l_spanish:
 DAIJO_DAIJIN_GLOSS:0 "#bold Daijō-daijin#! — #EMP Chanceler do Reino#! — era o chefe do #EMP Daijō-kan#! — #EMP Conselho de Estado#! — um cargo de prestígio no período Nara (710–794).\n\nO título foi ressuscitado por [Glossary('Taira', 'TAIRA_GLOSS')] Kiyomori como a mais alta posição fora da família imperial, e de fato o chefe do governo imperial."
 every_non_taira_vassal:0 "Todo [vassal|E] de [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U] que não pertença à [dynasty|E] [GetDynastyByID('japanese_taira_kanmu').GetName]"
 genpei_intro:0 "Guerra Genpei:"
 join_house_bloc_yoshinaka_tt:0 "A [house|E] [THIS.House.GetBaseName] se unirá ao seu [bloc|E]"
 minamoto_clan_will_respond_to_our_actions:0 "#warning @warning_icon! O Bloco [GetDynastyByID('japanese_minamoto_seiwa').GetName] certamente responderá#!"
 send_letter_to_go_shirakawa:0 "Você envia uma carta para [go_shirakawa.GetName]"
 stay_duelist_adventurer:0 "#help Quanto mais duelos vencidos, mais forte se torna o modificador acima#!"
 tgp_genpei_character.1000.a.flavor:0 "[ruler.GetShortUIName|U] tentará reunir suas próprias forças para libertar o [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] da tirania dos [kiyomori_taira.GetDynastyName]"
 tgp_genpei_character.1000.a:0 "#bold Eu#! sozinho acabarei com os [kiyomori_taira.GetDynasty.GetNameNoTooltip]!"
 tgp_genpei_character.1000.b.flavor:0 "Você deve reconciliar suas diferenças se quiser derrubar os quase inatingíveis [kiyomori_taira.GetDynastyName]"
 tgp_genpei_character.1000.b:0 "Nós, [ruler.GetDynasty.GetNameNoTooltip], devemos nos unir em oposição."
 tgp_genpei_character.1000.desc:0 "Sou assombrado pela derrota de meu pai e pelo assassinato de meus irmãos na [Glossary('Heiji Rebellion', 'HEIJI_REBELLION_GLOSS')]. Essa vergonha alimenta minha vingança contra os vis [Glossary('Taira', 'TAIRA_GLOSS')]! Embora [kiyomori_taira.GetFirstName] possa pensar que o [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l] está assegurado pelo casamento de sua filha com [Select_CString( norihito_tenno.IsFemale, 'a', 'o' )] [norihito_tenno.GetTitledFirstName], os [Glossary('Minamoto', 'MINAMOTO_GLOSS')] ainda mantêm influência nas províncias orientais, e a família imperial se ressente do domínio [kiyomori_taira.GetHerHim].\n\nEmbora o líder simbólico dos Minamoto, [yorimasa_minamoto.GetFirstName], tenha ajudado [kiyomori_taira.GetFirstNameNoTooltip] contra meu pai, meus espiões dizem que há atrito entre eles. Em outro lugar, [Select_CString( yoshinaka_minamoto.IsFemale, 'minha prima', 'meu primo' )] [yoshinaka_minamoto.GetFirstName] ainda não perdoou a morte de seu pai pelas mãos de meu meio-irmão, mas seria um aliado útil..."
 tgp_genpei_character.1000.t:0 "$genpei_intro$ Genciana Atormentada"
 tgp_genpei_character.1010.a.flavor:0 "O [bloc|E] atenderá ao clamor urgente e certamente fará da [ruler.GetHouse.GetName] a [house|E] dominante se você usar a [interaction|E] #V $assume_house_bloc_leadership_interaction$#!."
 tgp_genpei_character.1010.a.tt:0 "Cada [house|E] em seu [bloc|E] melhora o nível de [house_relation|E] com [ruler.GetHouse.GetName]"
 tgp_genpei_character.1010.a:0 "Devo reunir os [ruler.GetDynasty.GetNameNoTooltip]."
 tgp_genpei_character.1010.b.flavor:0 "Se você adular agora, pode garantir seu lugar como um lacaio notável."
 tgp_genpei_character.1010.b:0 "Talvez os [kiyomori_taira.GetDynasty.GetNameNoTooltip] sejam os governantes legítimos?"
 tgp_genpei_character.1010.desc.blocboss:0 "Como a ponta da lança dos [Glossary('Minamoto', 'MINAMOTO_GLOSS')], cabe a mim assumir a responsabilidade. Devemos ser a paliçada contra a ambição dos [kiyomori_taira.GetDynasty.GetNameNoTooltip], ou acabaremos como os carregadores de sua liteira!"
 tgp_genpei_character.1010.desc.intro:0 "[kiyomori_taira.GetFirstName]! Sua sede de poder é como um rio descontrolado, que devasta a nobre tradição e a decência. Nem mesmo ser nomeado [kiyomori_taira.GetTitleAsName], senhor de todo o Japão, saciou sua ânsia desenfreada. Embriagado pela euforia do domínio incontestável dos [Glossary('Taira', 'TAIRA_GLOSS')], [kiyomori_taira.GetSheHe] ousou depor o [Glossary('Imperador', 'TENNO_GLOSS')] [old_emperor.GetTitledFirstName] e colocar [Select_CString( new_emperor.IsFemale, 'sua neta', 'seu neto' )] [new_emperor.GetFirstName] no [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]."
 tgp_genpei_character.1010.desc.notblocboss:0 "\n\nNos anos passados, minha família foi a paliçada contra a ambição dos [kiyomori_taira.GetDynasty.GetNameNoTooltip]. Agora, a liderança incompetente dos [Glossary('Minamoto', 'MINAMOTO_GLOSS')] nos tornaria os carregadores da liteira. [minamoto_ruler.GetFirstName] é frac[Select_CString( minamoto_ruler.IsFemale, 'a', 'o' )] demais. Se meu sábio pai estivesse aqui, jamais teria permitido que isso acontecesse."
 tgp_genpei_character.1010.t:0 "$genpei_intro$ Genciana Liberta"
 tgp_genpei_character.1090.a.flavor:0 "$tgp_genpei_character.1000.a.flavor$"
 tgp_genpei_character.1090.a:0 "$tgp_genpei_character.1000.a$"
 tgp_genpei_character.1090.b:0 "$tgp_genpei_character.1000.b$"
 tgp_genpei_character.1090.desc:0 "Meu direito de nascença de liderar os [Glossary('Minamoto', 'MINAMOTO_GLOSS')] foi roubado! Meu nobre pai, morto por fratricídio mesquinho! Esse derramamento de sangue entre parentes na [Glossary('Rebelião Heiji', 'HEIJI_REBELLION_GLOSS')] não fez nada além de abrir caminho para que os vis [Glossary('Taira', 'TAIRA_GLOSS')] dominassem o [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]. [kiyomori_taira.GetFirstName], embriagado pelo poder, autoproclamou-se [Glossary('Daijō-daijin', 'DAIJO_DAIJIN_GLOSS')]!\n\nAgora, [Select_CString( yoritomo_minamoto.IsFemale, 'minha prima', 'meu primo' )] [yoritomo_minamoto.GetFirstName] busca unir os [yoritomo_minamoto.GetDynasty.GetNameNoTooltip] contra esse tirano, mas não pagou penitência pelo crime de seu pai. Minha nova casa, [ruler.GetHouse.GetName], permanece desafiadora como seu homônimo — as montanhas que me abrigaram de meu tio assassino!\n\nSerá que apenas o meu poder basta para pôr fim a esta era de tirania?"
 tgp_genpei_character.1090.t:0 "$genpei_intro$ Genciana Vingativa"
 tgp_genpei_character.1095.a.flavor:0 "$tgp_genpei_character.1000.a.flavor$"
 tgp_genpei_character.1095.a:0 "Não há futuro com [yoritomo_minamoto.GetFirstNameNoTooltip]. [ruler.GetDynasty.GetNameNoTooltip], a mim!"
 tgp_genpei_character.1095.b.flavor:0 "O perigo da supremacia dos [kiyomori_taira.GetDynasty.GetNameNoTooltip] é grande demais. Os [ruler.GetDynasty.GetNameNoTooltip] devem se unir para derrotá-los."
 tgp_genpei_character.1095.b:0 "Engolirei esse remédio amargo... por agora."
 tgp_genpei_character.1095.desc:0 "Meu coração sangra pelo Japão de meu pai. [kiyomori_taira.GetFirstName] destruiu tudo o que conhecíamos! O último vestígio de retidão, [old_emperor.GetFirstName], o [Glossary('Imperador', 'TENNO_GLOSS')], foi removido do [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l], e o próprio neto bebê de [kiyomori_taira.GetFirstNamePossessiveNoTooltip], [current_emperor.GetFirstName], foi colocado em seu lugar.\n\nCom [Select_CString( yoritomo_minamoto.IsFemale, 'minha prima', 'meu primo' )] [yoritomo_minamoto.GetFirstName] pronto para liderar os [Glossary('Minamoto', 'MINAMOTO_GLOSS')] contra a tirania de [kiyomori_taira.GetFirstNamePossessiveNoTooltip], devo unir-me à sua causa, quando sou o guerreiro mais capaz e meu lugar de direito é no comando? Ou ousarei arriscar dividir nossas forças e convocar a família apenas sob minha bandeira?"
 tgp_genpei_character.1095.t:0 "$genpei_intro$ Genciana Legítima"
 tgp_genpei_character.1100.a:0 "Servirei [Select_CString( hidehira_fujiwara.IsFemale, 'a', 'ao' )] [hidehira_fujiwara.GetFirstNameNoTooltip] por enquanto."
 tgp_genpei_character.1100.b:0 "Minha família precisa do meu apoio."
 tgp_genpei_character.1100.c:0 "O destino me deixou o caminho da espada."
 tgp_genpei_character.1100.desc:0 "Com meu pai derrotado pelos [Glossary('Taira', 'TAIRA_GLOSS')] [kiyomori_taira.GetFirstName] na [Glossary('Rebelião Heiji', 'HEIJI_REBELLION_GLOSS')], fui forçado à vida de um [Glossary('Rōnin', 'RONIN_GLOSS')] nas montanhas do norte. Aqui, o poderoso [Glossary('Fujiwara', 'FUJIWARA_GLOSS')] [hidehira_fujiwara.GetFirstName] me concedeu refúgio.\n\nA dominação de [kiyomori_taira.GetFirstNamePossessiveNoTooltip] sobre a corte imperial anuncia uma era de total supremacia dos [kiyomori_taira.GetDynasty.GetNameNoTooltip]. Diante disso, nosso líder simbólico dos [Glossary('Minamoto', 'MINAMOTO_GLOSS')], [yorimasa_minamoto.GetFirstName], nos envergonha com sua covardia. Felizmente, meu irmão [yoritomo_minamoto.GetFirstName] conta com as espadas das famílias samurais orientais e se prepara para derrubar o tirano.\n\nAcima de tudo, espero que a tempestade que se aproxima traga desafiantes à altura da minha lâmina!"
 tgp_genpei_character.1100.t:0 "$genpei_intro$ Genciana Feroz"
 tgp_genpei_character.2000.a:0 "Por enquanto, apazigue as ovelhas."
 tgp_genpei_character.2000.b.flavor:0 "Você difama [Select_CString( norihito_tenno.IsFemale, 'a', 'o' )] [norihito_tenno.GetTitleAsName] na esperança de que uma futura abdicação forçada ocorra mais suavemente."
 tgp_genpei_character.2000.b:0 "Envenene o poço..."
 tgp_genpei_character.2000.c.flavor:0 "O novo herdeiro deve ter um corpo forte se quiser assumir o trono desde o nascimento."
 tgp_genpei_character.2000.c:0 "Fortaleça o menino com leite vigoroso!"
 tgp_genpei_character.2000.desc:0 "O [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U] é um reflexo da minha vontade, da minha astúcia e do poder dos [Glossary('Taira', 'TAIRA_GLOSS')]! Nada me escapa, exceto o [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l].\n\nM[Select_CString( noriko_taira.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('noriko_taira'))], [noriko_taira.GetFirstName], em breve extrairá uma semente de nosso jovem [norihito_tenno.GetTitledFirstName]. Seu poderoso ventre trará ao mundo um herdeiro com o sangue dos [ROOT.Char.GetHouse.GetBaseName] pulsando em suas veias. Um herdeiro pronto para esmagar todos que desafiarem nossa supremacia, assegurando nossa ascensão para sempre!"
 tgp_genpei_character.2000.t:0 "$genpei_intro$ Borboleta Ascendente"
 tgp_genpei_character.2010.a:0 "Que se danem as consequências, a Ascendência Taira começa hoje!"
 tgp_genpei_character.2010.b.flavor:0 "Você encontrará causa comum com os [fujiwara_ruler.GetDynasty.GetName] e esmagará os últimos resquícios dos traidores [minamoto_ruler.GetDynasty.GetName]."
 tgp_genpei_character.2010.b:0 "Destruir os [minamoto_ruler.GetDynasty.GetNameNoTooltip] é a prioridade."
 tgp_genpei_character.2010.c.flavor:0 "Você se unirá aos [minamoto_ruler.GetDynasty.GetName], não deixando esperança para administradores como os [fujiwara_ruler.GetDynasty.GetName] recuperarem o controle."
 tgp_genpei_character.2010.c:0 "A supremacia samurai resolverá todos os problemas."
 tgp_genpei_character.2010.d.flavor:0 "Juntos, [go_shirakawa.GetName] e eu superamos todos os obstáculos — e o faremos novamente!"
 tgp_genpei_character.2010.d:0 "Reacenda minha aliança mais forte."
 tgp_genpei_character.2010.desc:0 "Um herdeiro do meu sangue! [new_emperor.GetTitledFirstName] nasceu, pronto para ascender ao [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]. Seria simples descartar [current_emperor.GetTitledFirstName]. Embora justo, tal ato poderia inspirar uma rebelião...\n\nEsta terra está repleta de malcontentes traiçoeiros! Os voluntariosos [Glossary('Minamoto', 'MINAMOTO_GLOSS')] de [minamoto_ruler.GetFirstNamePossessive] ainda se ressentem da lembrança de sua derrota na [Glossary('Rebelião Heiji', 'HEIJI_REBELLION_GLOSS')]. [motofusa_fujiwara.GetFirstName], embora enfraquecido, anseia pelos dias em que os [Glossary('Fujiwara', 'FUJIWARA_GLOSS')] dominavam o [GetTitleByKey('e_japan').GetBaseNameNoTierNoTooltip|U]. E o mais próximo ao meu coração, o pai do imperador, o astuto [Glossary('Jōkō', 'JOKO_GLOSS')] [go_shirakawa.GetFirstName], outrora um aliado próximo, agora questiona meus motivos. Qual caminho devo seguir?"
 tgp_genpei_character.2010.t:0 "$genpei_intro$ Encruzilhada de Poder"
 tgp_genpei_character.3000.a.flavor:0 "Ainda deve haver [motofusa_fujiwara.GetTitleAsNameNoTooltip] que respeitam a tradição e os direitos da aristocracia de [GetTitleByKey('b_kyo').GetBaseNameNoTier]"
 tgp_genpei_character.3000.a:0 "Todos saberão dos pecados de [kiyomori_taira.GetFirstNamePossessiveNoTooltip]!"
 tgp_genpei_character.3000.b.flavor:0 "O velho imperador conduziu o leme do Estado muito antes de seu nascimento"
 tgp_genpei_character.3000.b:0 "[go_shirakawa.GetFirstNameNoTooltip] ainda pode restaurar a sanidade."
 tgp_genpei_character.3000.c.flavor:0 "Que a Glicínia cresça sem restrições, de costa a costa, envolvendo o trono como é de seu direito!"
 tgp_genpei_character.3000.c:0 "Todos os [motofusa_fujiwara.GetDynasty.GetNameNoTooltip], por mais baixos que sejam, devem ansiar por justiça."
 tgp_genpei_character.3000.desc:0 "Relegado de [GetTitleByKey('b_kyo').GetBaseNameNoTier] para o interior de [GetTitleByKey('c_oki').GetBaseNameNoTierNoTooltip]. Que injustiça! Singularmente vil e ardiloso, [Glossary('Taira', 'TAIRA_GLOSS')] [kiyomori_taira.GetFirstName] é a fonte do meu sofrimento e da degradação dos [Glossary('Fujiwara', 'FUJIWARA_GLOSS')]!\n\nDepois que ajudamos a derrotar os [Glossary('Minamoto', 'MINAMOTO_GLOSS')] na [Glossary('Rebelião Heiji', 'HEIJI_REBELLION_GLOSS')], [kiyomori_taira.GetSheHe] aproveitou-se da doença [Select_CString( motozane_fujiwara.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('motozane_fujiwara'))], [motozane_fujiwara.GetFirstNamePossessive], para dividir nossas propriedades e consolidar poder. Não satisfeito como [Glossary('Daijō-daijin', 'DAIJO_DAIJIN_GLOSS')], ele casou sua filha com [norihito_tenno.GetTitledFirstName], em uma tentativa descarada de controlar o trono.\n\nMinha única esperança de derrubar esse tirano é o astuto velho [Glossary('Jōkō', 'JOKO_GLOSS')] [go_shirakawa.GetFirstName], o pai de [norihito_tenno.GetTitleAsNamePossessiveNoTooltip] e nosso antigo aliado... ou o rústico [hidehira_fujiwara.GetFirstName] e seu reconhecidamente forte [hidehira_fujiwara.GetDynasty.GetName] ao norte."
 tgp_genpei_character.3000.t:0 "$genpei_intro$ Glicínia Dispersa"
 tgp_genpei_character.3010.a:0 "Não serei capaz de ajudar contra os [GetDynastyByID('japanese_taira_kanmu').GetNameNoTooltip]."
 tgp_genpei_character.3010.b:0 "Você está certo... unamo-nos contra eles."
 tgp_genpei_character.3010.desc:0 "O reino que você outrora governou está lentamente se fragmentando. Ambas as grandes famílias samurais já estão reunindo o máximo de apoio que podem. Sei que você ainda guarda rancor pela tirania dos [GetDynastyByID('japanese_taira_kanmu').GetName]. A família [ROOT.Char.GetDynasty.GetName] precisa de você. Juntos, podemos restaurar a autoridade do governo imperial e pôr fim à indisciplinada classe samurai."
 tgp_genpei_character.3010.opening:0 "Ao imperador do passado, [go_shirakawa.GetNameNoTooltip],"
 tgp_genpei_character.3100.a:0 "Devo aceitar minha posição atual."
 tgp_genpei_character.3100.b:0 "Defender a liberdade não é um ato egoísta!"
 tgp_genpei_character.3100.desc:0 "Os arrogantes [Glossary('Fujiwara', 'FUJIWARA_GLOSS')] da capital antes zombavam de nós, #EMP \"Quem abandonaria os luxos e palácios de [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] pelas províncias desoladas do norte?\"#! Quão tolos eram esses burocratas...\n\n[motofusa_fujiwara.GetFirstName] é agora [Glossary('Kampaku', 'KAMPAKU_GLOSS')] apenas no nome — fraco demais para desafiar o astuto [kiyomori_taira.GetFirstName], autoproclamado [Glossary('Daijō-daijin', 'DAIJO_DAIJIN_GLOSS')] e verdadeiro manipulador de [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l]. Em breve, os [Glossary('Taira', 'TAIRA_GLOSS')] serão imparáveis, e quem sabe quando meu próprio feudo será desafiado? Cabe a mim salvar a família imperial das garras dos Taira e instaurar uma nova ordem Fujiwara?\n\nTalvez o desgarrado [Glossary('Minamoto', 'MINAMOTO_GLOSS')] [yoshitsune_minamoto.GetTitledFirstName] se revele um aliado útil contra esse inimigo comum..."
 tgp_genpei_character.3100.t:0 "$genpei_intro$ Glicínia Desgarrada"
 tgp_genpei_character.4000.a:0 "Não suportarei mais isso."
 tgp_genpei_character.4000.b:0 "Esperar é o melhor por enquanto."
 tgp_genpei_character.4000.desc:0 "Sob minha vigilância, [kiyomori_taira.GetFirstName] tornou-se o governante incontestado do Japão. Fui um tolo ao permitir que [kiyomori_taira.GetHerHim] distorcesse minhas ambições para afastar os regentes [Glossary('Fujiwara', 'FUJIWARA_GLOSS')], apenas para tomar o poder para [kiyomori_taira.GetHerselfHimself].\n\nMeu filho, [norihito_tenno.GetTitledFirstName], ainda ocupa [GetTitleByKey('k_chrysanthemum_throne').GetDefinitiveName|l], mas até quando? [noriko_taira.GetFirstName], [Select_CString( noriko_taira.IsFemale, 'sua', 'seu' )] [noriko_taira.Custom('WifeHusband')] e filh[Select_CString( noriko_taira.IsFemale, 'a', 'o' )] de [kiyomori_taira.GetFirstNameNoTooltip], sem dúvida em breve produzirão um herdeiro mais facilmente controlável.\n\nMinha outrora vasta influência como [Glossary('Jōkō', 'JOKO_GLOSS')] está em seu ponto mais baixo. Com [motofusa_fujiwara.GetFirstName] exilado e [Glossary('Kampaku', 'KAMPAKU_GLOSS')] apenas no título, e os [Glossary('Minamoto', 'MINAMOTO_GLOSS')] esmagados pelos [Glossary('Taira', 'TAIRA_GLOSS')] durante a [Glossary('Heiji Rebellion', 'HEIJI_REBELLION_GLOSS')], é difícil imaginar alguém capaz de se opor ao poderoso clã Taira..."
 tgp_genpei_character.4000.t:0 "$genpei_intro$ Crisântemo Murchando"
