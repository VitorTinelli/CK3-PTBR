 tgp_korea_decision.9101.a:0 "Que o [GetTitleByKey('e_goryeo').GetTierAsNameNoTooltip] dure mil anos."
 tgp_korea_decision.9101.b.reason:0 "Esta opção está disponível devido à sua [culture|E] [ROOT.Char.GetCulture.GetName]"
 tgp_korea_decision.9101.b.tt:0 "[GetTitleByKey('e_goryeo').GetDefinitiveName] será renomeado para #V Goryeo#!"
 tgp_korea_decision.9101.b:0 "E será chamado 'Goryeo', em reconhecimento ao nosso orgulhoso legado."
 tgp_korea_decision.9101.desc:0 "\n\nHoje, esse sonho se tornou realidade, e meu legado assegurado como [ROOT.Char.GetMotherFather] de [GetTitleByKey('e_goryeo').GetDefinitiveName] e da casa real de [ROOT.Char.GetHouse.GetBaseName]!"
 tgp_korea_decision.9101.intro:0 "Os muitos reinos e povos desta península lutaram desnecessariamente por séculos, predados por invasores e cegos para a grandeza e força que poderíamos ter se apenas nos uníssemos."
 tgp_korea_decision.9101.t:0 "Um Reino Unido"
 tgp_korea_decision.9102.desc:0 "\n\nHoje, esse sonho se tornou realidade, e o legado d[Select_CString( king_of_goryeo.IsFemale, 'a', 'o' )] [king_of_goryeo.GetTitledFirstNamePossessive] assegurado como [ROOT.Char.GetMotherFather] de [GetTitleByKey('e_goryeo').GetDefinitiveName] e da casa real de [ROOT.Char.GetHouse.GetBaseName]!"
 tgp_korea_decision.9102.t:0 "$tgp_korea_decision.9101.t$"
 tgp_korea_decision.9201.a:0 "Devo estar um passo à frente."
 tgp_korea_decision.9201.desc:0 "À medida que a glória do meu governo brilha mais intensamente, muitos buscam refúgio em minha sombra. Nenhum [ROOT.Char.GetTitleAsNameNoTooltip] pode governar sozinho, e a linha onde reside o verdadeiro poder está sempre mudando.\n\nDevo ser cauteloso se meus descendentes devem continuar a governar [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip] mais do que nominalmente..."
 tgp_korea_decision.9201.t:0 "Um Timão de Muitas Mãos"
 tgp_korea_decision.9202.a:0 "O poder vem de muitas formas."
 tgp_korea_decision.9202.desc:0 "À medida que a glória do governo d[Select_CString( founder.IsFemale, 'a', 'o' )] [founder.GetTitledFirstNamePossessive] brilha mais intensamente, muitos buscam refúgio em sua sombra. Nenhum[Select_CString( founder.IsFemale, 'a', '' )] [founder.GetTitleAsNameNoTooltip] pode governar sozinh[Select_CString( founder.IsFemale, 'a', 'o' )], e a linha onde reside o verdadeiro poder está sempre mudando.\n\n[founder.GetSheHe|U] deve ser cauteloso se seus descendentes devem continuar a governar [founder.GetPrimaryTitle.GetDefinitiveNameNoTooltip] mais do que nominalmente..."
 unify_goryeo_decision_blocker_tt:0 "[realms|E] [administrative|E] de [heritage|E] $heritage_korean_name$ não podem criar [GetTitleByKey('k_goguryeo').GetNameNoTier|V], [GetTitleByKey('k_silla').GetNameNoTier|V], ou [GetTitleByKey('k_baekje').GetNameNoTier|V] uma vez que a [decision|E] [GetDecision('tgp_korea_unify_goryeo_decision').GetName] foi tomada"
