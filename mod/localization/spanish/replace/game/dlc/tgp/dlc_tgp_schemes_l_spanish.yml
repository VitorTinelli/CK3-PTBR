 scheme_critical_moments.1202.a:0 "Apenas mais uma assinatura."
 scheme_critical_moments.1202.b:0 "Já consegui o suficiente."
 scheme_critical_moments.1202.c:0 "Agora, apagar quaisquer registros..."
 scheme_critical_moments.1202.desc:0 "O tesouro de [target.GetName] parece ser penetrável. Os guardas são facilmente subornáveis, e os contadores, dispostos a ajustar os registros por uma porcentagem própria. Enquanto isso, meus agentes conseguem retirar montes de ouro todos os dias."
 scheme_critical_moments.1202.desc_discovered:0 "\n\n[target.GetHolder.GetName] pode saber o que está acontecendo, mas é tarde demais para desistir agora."
 scheme_critical_moments.1202.t:0 "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1203.a:0 "Melhor sorte da próxima vez."
 scheme_critical_moments.1203.desc:0 "O tesouro de [target.GetName] parece ser impenetrável. Os guardas são incorruptíveis, os contadores — infalíveis. Enquanto isso, meus agentes são"
 scheme_critical_moments.1203.desc_discovered:0 "$scheme_critical_moments.1203.desc$ espalhando e arruinando meus planos por onde passam."
 scheme_critical_moments.1203.desc_secret:0 "$scheme_critical_moments.1203.desc$ inúteis no melhor dos casos, pontas soltas no pior."
 scheme_critical_moments.1203.t:0 "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1232.a:0 "As conquistas de um falam por todo o grupo!"
 scheme_critical_moments.1232.b.myself:0 "Serei mais respeitad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] agora."
 scheme_critical_moments.1232.b:0 "[target.GetFirstNameNoTooltip] será mais respeitad[Select_CString( target.IsFemale, 'a', 'o' )] agora."
 scheme_critical_moments.1232.desc.myself:0 "Minha aptidão agora é bem conhecida entre os cortesãos imperiais. Usei bem minha influência e minha carreira em breve atingirá novos patamares."
 scheme_critical_moments.1232.desc:0 "A aptidão de [target.GetName] agora é bem conhecida entre os cortesãos imperiais. A carreira [target.GetHerHim] alcançará novos patamares. Tudo graças à minha influência."
 scheme_critical_moments.1232.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.1233.a:0 "Pelo menos eu sei o valor disso!"
 scheme_critical_moments.1233.desc.myself:0 "Os agentes elogiando meu governo são ignorados pela corte imperial. Ninguém está disposto a reconhecer meu conhecimento em [target.Custom('education_focus')]."
 scheme_critical_moments.1233.desc:0 "Meus agentes elogiando o governo de [target.GetName] são ignorados pela corte imperial. Ninguém está disposto a reconhecer o conhecimento [target.GetHerHim] em [target.Custom('education_focus')]."
 scheme_critical_moments.1233.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.1235.a:0 "As falhas de um falam por todo o grupo!"
 scheme_critical_moments.1235.b:0 "O verdadeiro rosto de [target.GetFirstNameNoTooltip] é conhecido."
 scheme_critical_moments.1235.desc:0 "Meus agentes foram bem-sucedidos. Toda a corte imperial fala agora dos erros e da incompetência de [target.GetName]. A carreira daquel[Select_CString( target.IsFemale, 'a', 'e' )] [target.Custom2('InsultNoun', ROOT.Char)] vai ladeira abaixo, tudo graças às minhas maquinações!"
 scheme_critical_moments.1235.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.1236.a:0 "[target.GetFirstNameNoTooltip] escapou das minhas mãos desta vez."
 scheme_critical_moments.1236.desc:0 "Meus agentes não relatam nada. A corte imperial não está disposta a morder os rumores que estamos espalhando. Aparentemente, a reputação de [target.GetName] é impecável e [target.GetSheHe] está bem estabelecid[Select_CString( target.IsFemale, 'a', 'o' )] nos círculos imperiais. [Select_CString( target.IsFemale, 'A', 'O' )] [target.Custom2('InsultAdjective', ROOT.Char)] está um passo à minha frente."
 scheme_critical_moments.1236.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.2922.a:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] é #EMP meu#!!"
 scheme_critical_moments.2922.desc:0 "Os planos foram verificados e revisados, cada eventualidade preparada, cada conspirador pronto. Invadir o [target.Custom('ResidenceBuilding')|l] foi fácil o suficiente sob o pretexto de trabalho...\n\nO caos se instalou quando o alarme foi soado, mas em meio à confusão, aos golpes e ao tumulto, finalmente emergimos — exaustos, mas vitoriosos!\n\nAquel[Select_CString( target.IsFemale, 'a', 'e' )] maldit[Select_CString( target.IsFemale, 'a', 'o' )] [target.Custom2('InsultAdjective', ROOT.Char)] fals[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], [target.GetFirstName], de alguma forma conseguiu escapar — uma ameaça à minha posição enquanto [target.GetSheHe] andar livre."
 scheme_critical_moments.2922.t:0 "$coup_ceremonial_liege$: [Select_CString( ROOT.Char.IsFemale, 'A Nova', 'O Novo' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 scheme_critical_moments.2923.t:0 "$coup_ceremonial_liege$: Esperanças Destruídas"
 scheme_critical_moments.2924.a:0 "Eu voltarei!"
 scheme_critical_moments.2924.b:0 "Seu sapo imundo!"
 scheme_critical_moments.2924.c:0 "Droga!"
 scheme_critical_moments.2924.death:0 "Ao tentar fugir, encontro-me envolto no caos da batalha, uma lâmina vindo em minha direção!"
 scheme_critical_moments.2924.desc:0 "O que começou como um dia comum em [target.GetCapitalLocation.GetBaronyNameExplicitly] tomou um rumo súbito e sinistro. O [target.Custom('ResidenceBuilding')|l] se enche com os sons de guardas gritando e servos correndo pelos corredores em pânico.\n\nPor fim, um sargento ofegante explica que um grupo de bandidos entrou sob falsos pretextos e está lutando para chegar à sala do trono!\n\n"
 scheme_critical_moments.2924.imprison:0 "Soldados irrompem pela porta de repente, e logo sou arrastado diante de seu líder, [owner.GetFirstName], que ergue minha coroa com um sorriso triunfante."
 scheme_critical_moments.2924.outro:0 "Escapo pelos aposentos dos servos, disfarçando-me de plebeu, e me junto à multidão em fuga para fora do [target.Custom('ResidenceBuilding')|l]..."
 scheme_critical_moments.2924.t:0 "$coup_ceremonial_liege$: Coroa Roubada"
 scheme_critical_moments.2925.a:0 "Você vai #EMP pagar#! por isso."
 scheme_critical_moments.2925.b:0 "[owner.GetSheHe|U] aprendeu o que acontece com usurpadores!"
 scheme_critical_moments.2925.c:0 "Maldit[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.Custom2('InsultNoun', ROOT.Char)]!"
 scheme_critical_moments.2925.death:0 "O corpo de [owner.GetFirstName], um ninguém sem terras, é arrastado diante de mim — seu plano de usurpar minha coroa pela força foi um fracasso total."
 scheme_critical_moments.2925.desc:0 "O que começou como um dia comum em [target.GetCapitalLocation.GetBaronyNameExplicitly] tomou um rumo súbito e sinistro. O [target.Custom('ResidenceBuilding')|l] se enche com os sons de guardas gritando e servos correndo pelos corredores em pânico.\n\nPor fim, um sargento ofegante explica que um grupo de bandidos entrou sob falsos pretextos e está lutando para chegar à sala do trono!\n\nMeus soldados logo retomam o controle, e os sons da batalha vão aos poucos cessando."
 scheme_critical_moments.2925.imprison:0 "[owner.GetFirstName], um ninguém sem terras, é arrastado diante de mim, com seu plano de usurpar minha coroa pela força completamente exposto."
 scheme_critical_moments.2925.outro:0 "Disseram-me que [owner.GetFirstName], um ninguém sem terras, liderou o ataque, tentando usurpar minha coroa pela força. O covarde já está bem longe."
