 tgp_china_study_confucian_classics_decision:0 "Estudar os Clássicos Confucionistas"
 tgp_china_study_confucian_classics_decision_confirm:0 "Onde esse caminho me levará?"
 tgp_china_study_confucian_classics_decision_desc:0 "Os Analectos do Mestre Kong, os sutis escritos de Mêncio, os grandes ritos e histórias... Através do estudo e da disciplina, eu posso vislumbrar a ordem do Céu e da Terra.\n\n#weak Estudar os Clássicos Confucionistas é uma excelente forma de se preparar para os [examinations|E] ou aumentar suas chances de se tornar um [governor|E]."
