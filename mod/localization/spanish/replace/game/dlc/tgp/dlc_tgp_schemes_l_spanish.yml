 tgp_china_study_confucian_classics_decision_tt:0 "Você inicia um [scheme|E] [GetScheme('study_confucian_classics').GetTypeName] direcionado a você mesmo\n\nRecompensas previstas:\n$EFFECT_LIST_BULLET$ [trait|E] / [trait_level_track_xp|E] [GetTrait('confucian_education').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ [trait|E] [GetTrait('lifestyle_poet').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ [merit_i][merit|E]\n$EFFECT_LIST_BULLET$ [skill|E] em [learning_i][stewardship_i][diplomacy_i] #weak (até 8)#!\n$EFFECT_LIST_BULLET$ [exam_advantage|E] no próximo [examination|E]\n\nDesvantagens:\n$EFFECT_LIST_BULLET$ Pode ganhar [stress_i][stress|E]"
