 tgp_interaction_event.0001.a:0 "Uma surpresa, com certeza, mas uma surpresa bem-vinda."
 tgp_interaction_event.0001.desc:0 "Devo agradecer por sua recente ajuda em reabastecer o tesouro. Embora você não tenha exigido nada em troca, sinto que devo retribuir essa dívida, ou ela corroerá minha consciência.\n\nPor favor, aceite este símbolo de minha gratidão."
 tgp_interaction_event.0010.a:0 "Eu mesmo cuidarei disso."
 tgp_interaction_event.0010.b:0 "Envie uma mensagem a [joining_governor.GetShortUINameNoTooltip] imediatamente."
 tgp_interaction_event.0010.c:0 "Muito bem. Instruirei um comandante a lidar com isso."
 tgp_interaction_event.0010.desc:0 "$celestial_request_military_aid_interaction_msg$"
 tgp_interaction_event.0010.opening:0 "[actor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_interaction_event.0011.a:0 "Como ordenar, [recipient.GetCouncilTitle]."
 tgp_interaction_event.0011.b:0 "Como ordenar, [recipient.GetTitleAsNameNoTooltip]."
 tgp_interaction_event.0011.desc:0 "[actor.GetShortUIName|U] solicitou tropas em sua luta para garantir paz e estabilidade em [actor.GetPrimaryTitle.GetNameNoTierNoTooltip]. Você deve reunir suas forças e encerrar o conflito imediatamente."
 tgp_interaction_event.0011.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_interaction_event.0012.a:0 "Excelente notícia!"
 tgp_interaction_event.0012.desc_governor:0 "Confirmei sua solicitação e ordenei que [joining_character.GetShortUIName] se junte à sua guerra e auxilie você. As tropas de [joining_character.GetHerHis|U] já estão a caminho."
 tgp_interaction_event.0012.desc_marshal:0 "Recebi sua solicitação e decidi auxiliá-lo pessoalmente. Minhas bandeiras estão hasteadas e meu exército a caminho."
 tgp_interaction_event.0015.desc:0 "Você não está sozinho neste conflito. Ordenei que [governor_joining.GetShortUIName] reúna imediatamente suas forças e auxilie você em suas guerras."
 tgp_interaction_event.0016.a:0 "Como ordenar, [actor.GetTitleAsNameNoTooltip]."
 tgp_interaction_event.0016.desc:0 "[governor_at_war.GetShortUIName|U] está em guerra em [governor_at_war.GetPrimaryTitle.GetNameNoTierNoTooltip]. Levante suas bandeiras imediatamente, comandante, e resolva este conflito."
 tgp_interaction_event.0030.a:0 "Suponho que era apenas uma questão de tempo."
 tgp_interaction_event.0030.a_new_elder:0 "[new_elder.GetFirstNameNoTooltip] está encantando meus pupilos?"
 tgp_interaction_event.0030.desc:0 "Decidi mudar meu caminho e não serei mais seu discípulo. Saiba que ainda respeito e valorizo muito sua opinião."
 tgp_interaction_event.0030.desc_new_elder:0 "[new_elder.GetName] será meu novo mestre agora."
 tgp_interaction_event.0031.a:0 "Tenho muitas coisas para lhe ensinar!"
 tgp_interaction_event.0031.b.tt:0 "Recusa se tornar seu [elder|E]"
 tgp_interaction_event.0031.b:0 "Não, procure outro para ser seu mestre."
 tgp_interaction_event.0031.desc:0 "Suas virtudes e inteligência são conhecidas em todo o Céu. Estou buscando conselho e patrocínio de você. Ficarei grato em me tornar seu humilde discípulo."
 tgp_interaction_event.0031.opening:0 "[actor.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_interaction_event.00311.a:0 "Eu irei segui-lo!"
 tgp_interaction_event.00311.b:0 "Não abandonarei o [my_movement.GetNameNoTooltip]."
 tgp_interaction_event.00311.c:0 "Obrigado, mestre."
 tgp_interaction_event.00311.desc.intro:0 "Sua carreira promissora não passou despercebida. Será um prazer orientá-lo em seus estudos.\n\n"
 tgp_interaction_event.00311.desc.movement:0 "Junte-se ao [elder_movement.GetName] e nós o apoiaremos nesta difícil tarefa."
 tgp_interaction_event.00311.desc.no_movement:0 "Em breve, nossas posições estarão entrelaçadas."
 tgp_interaction_event.00311.opening:0 "[secondary_recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 tgp_interaction_event.0032.a:0 "$tgp_interaction_event.0030.a$"
 tgp_interaction_event.0032.desc:0 "Decidi deixá-lo ir e não serei mais seu mestre. Passamos incontáveis horas debatendo e escrevendo, mas agora você superou minhas habilidades. É hora de encontrar alguém mais sábio do que eu."
 tgp_interaction_event.0041.a:0 "Tenho que confiar em [actor.GetHerHim]."
 tgp_interaction_event.0041.desc:0 "O Grande Secretariado está implementando um novo mandato para o cargo. Como sempre, as tarefas serão cumpridas de forma rápida e diligente. Para o bem maior de [ROOT.Char.GetDynastyName]!"
