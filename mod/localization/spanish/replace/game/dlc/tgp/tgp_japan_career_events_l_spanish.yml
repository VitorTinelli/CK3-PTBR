l_spanish:
 tgp_japan_career.0001.a:0 "Não importa o que venha, permaneceremos firmes."
 tgp_japan_career.0001.b:0 "A paz é efêmera, devemos estar preparados!"
 tgp_japan_career.0001.desc:0 "[kampaku.GetPrimaryTitle.GetDefinitiveName|U] está repleto de [blocs|E], todos competindo por controle e poder."
 tgp_japan_career.0001.desc_2:0 "\n\nTodos temos um papel a desempenhar, e desempenhá-lo faremos!"
 tgp_japan_career.0001.kampaku_desc:0 "Como [new_ruler.GetTitleAsNameNoTooltip|U], carrego a responsabilidade máxima pelo império em meu papel de [ceremonial_regent|E]. Da capital, [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U], lidero os súditos do [japanese_emperor|E] e busco manter a frágil paz.\n\nDevo equilibrar a política de poder de uma corte febril cheia de astutos burocratas [ritsuryo|E] e a crescente preocupação com os guerreiros [soryo|E] estabelecendo feudos pessoais nas províncias."
 tgp_japan_career.0001.ritsuryo_desc:0 "Como governante [new_ruler.GetGovernment.GetName], meus deveres como burocrata residem na capital, [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U]. Este centro de poder e cultura é terreno fértil para aumentar a influência da minha casa, seja por feitos exemplares ou astúcia política.\n\nEssas tradições elegantes estão sendo ameaçadas por audaciosos guerreiros provinciais [soryo|E], que buscam consolidar poder e expandir seus feudos pessoais."
 tgp_japan_career.0001.soryo_desc:0 "Como governante [new_ruler.GetGovernment.GetName], minha família domou as províncias e reprimiu rebeliões! Merecemos um grau de autonomia e poder pessoal que não é concedido àqueles efémeros [ritsuryo|E] que empilham papéis na capital, [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U].\n\nDevo fortalecer meu exército, defender meu feudo e expandir nosso domínio. Cabe a mim restaurar a ordem em [kampaku.GetPrimaryTitle.GetNameNoTier], e a glória à minha [house|E] — a [new_ruler.GetHouse.GetName]!"
 tgp_japan_career.0001.t:0 "O Conto de [new_ruler.GetDynastyNameNoTooltip]"
 tgp_japan_career.0001.tenno_desc:0 "Como [japanese_emperor|E], meus deveres estão voltados ao divino e ao cerimonial. [Select_CString( kampaku.IsFemale, 'A', 'O' )] [kampaku.GetTitleAsName|U] lida com todas as questões mundanas, mas deveria ele? Há tensão no reino enquanto [rulers|E] [soryo|E] criam feudos pessoais nas províncias, desafiando os tradicionais burocratas [ritsuryo|E] na minha capital, [kampaku.GetCapitalLocation.GetTitle.GetNameNoTier|U].\n\nPoderiam esses agentes de mudança nos ajudar a retornar a uma era de verdadeiro governo imperial, com [Select_CString( new_ruler.IsFemale, 'a', 'o' )] [new_ruler.GetTitleAsName|U] supervisionando assuntos celestiais e terrenos?"
 tgp_japan_peace_modifier:0 "Buscando Estabilidade"
 tgp_japan_peace_modifier_desc:0 "Este personagem está focado em enfrentar quaisquer obstáculos com mente clara e calma."
 tgp_japan_war_modifier:0 "Preparando-se para Conflito"
 tgp_japan_war_modifier_desc:0 "Este personagem está convencido de que a guerra virá, e estará pronto para ela."
