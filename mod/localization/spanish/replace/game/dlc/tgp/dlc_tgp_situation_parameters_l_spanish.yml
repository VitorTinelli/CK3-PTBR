 dynastic_cycle_participant_group_conservative_movement_desc:0 "Todos os [vassals|E] de [GetTitleByKey('h_china').GetDefinitiveName] que buscam fortalecer a nobreza.\n\nEles se concentram em reformas e mudanças que beneficiem [powerful_families|E] e [dynasties|E] renomadas, enquanto cultivam a tradição em vez do [merit|E].\n$unlockables_conservative$"
 dynastic_cycle_participant_group_expansion_movement:0 "$game_concept_movement$ de Expansão"
 dynastic_cycle_participant_group_expansion_movement_desc:0 "Todos os [vassals|E] de [GetTitleByKey('h_china').GetDefinitiveName] que buscam impulsionar o [dynastic_cycle|E] em direção à [situation_dynastic_cycle_phase|E] [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName].\n\nPara facilitar a conquista de territórios fora da China, eles focam em fortalecer [governors|E] [GetSubjectContractType( 'celestial_provinces' ).GetObligationNameShort( 'celestial_province_military' )], aumentar [prowess|E], educação em [martial_lifestyle|E] e aprender [commander_traits|E].\n$unlockables_expansion$"
