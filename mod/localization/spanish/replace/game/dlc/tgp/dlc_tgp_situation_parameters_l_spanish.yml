 situation_dynastic_cycle_era_change_history_entry:0 "#S Novo [situation_dynastic_cycle_phase|E]: [SituationHistoryEntry.GetCatalyst.GetPhase.GetName]#! [SelectLocalization( SituationHistoryEntry.HasVariable( 'old_hegemon' ), 'situation_dynastic_cycle_era_old_dynasty_entry', '' )] [SelectLocalization( SituationHistoryEntry.HasVariable( 'new_hegemon' ), 'situation_dynastic_cycle_era_new_dynasty_entry', '' )]"
 situation_dynastic_cycle_era_new_dynasty_entry:0 "\nInício da [dynasty|E] [SituationHistoryEntry.GetVariable( 'new_hegemon' ).Char.GetDynasty.GetName]"
 situation_dynastic_cycle_era_old_dynasty_entry:0 "\nFim da [dynasty|E] [SituationHistoryEntry.GetVariable( 'old_hegemon' ).Char.GetDynasty.GetName]"
 situation_dynastic_cycle_phase_chaos:0 "Divisão"
 situation_dynastic_cycle_phase_chaos_desc:0 "$situation_dynastic_cycle_phase_chaos_desc_short$\n\nEste $game_concept_dynastic_cycle_era_short$ começa se:\n$EFFECT_LIST_BULLET$ Em um [dynastic_cycle_era_type_unstable|E], catalisadores suficientes [situation_catalyst_catalysts|E] forem acionados\n$EFFECT_LIST_BULLET$O [son_of_heaven|E] atual perde o [mandate_of_heaven|E]\n\n#S Quando esta $game_concept_dynastic_cycle_era_short$ começa#!\n$BULLET$#indent_newline:2 A [hegemony|E] do [title|E] da China é destruída e o antigo [son_of_heaven|E] é [deposed|E]#!\n$BULLET$#indent_newline:2 [titles|E] da hierarquia [de_jure|E] de [title_tier|E] de [empire|E] e [kingdom|E] também são destruídos, se seus [holders|E] tiverem [movement_power_i][movement_power_short|E] inferior a [EmptyScope.ScriptValue('high_movement_power_value')] e [EmptyScope.ScriptValue('medium_movement_power_value')] respectivamente#!\n$BULLET$#indent_newline:2 [rulers|E] independentes jurarão lealdade ou pagarão tributo aos seus [elders|E] ou [movement_leaders|E]\n$BULLET$ Cada [ruler|E] independente se juntará ao #V $dynastic_cycle_participant_group_other_rulers$#! [situation_participant_group|E]#!\n$BULLET$ Cada outro [situation_participant_group|E] será desfeito"
 situation_dynastic_cycle_phase_chaos_desc_short:0 "Um [dynastic_cycle_era_short|E] de senhores da guerra, onde apenas um [ruler|E] forte pode unir a China."
 situation_dynastic_cycle_phase_chaos_icon:0 "@tgp_dynastic_cycle_chaos_icon! $situation_dynastic_cycle_phase_chaos$"
 situation_dynastic_cycle_phase_instability:0 "Tensão"
 situation_dynastic_cycle_phase_instability_conquest:0 "Conquista"
 situation_dynastic_cycle_phase_instability_conquest_desc:0 "$situation_dynastic_cycle_phase_instability_conquest_desc_short$\n\nPara entrar neste $game_concept_dynastic_cycle_era_short$, a [hegemony|E] da China deve cair nas mãos de um [ruler|E] que #bold não#! possui um [government|E] [GetGovernment('celestial_government').GetName|E] ou uma [heritage|E] [Concept('culture', 'Cultural')|E] que #bold não#! é $heritage_chinese_name$."
 situation_dynastic_cycle_phase_instability_conquest_desc_short:0 "Um [dynastic_cycle_era_short|E] de consolidação após uma potência estrangeira conquistar a China."
 situation_dynastic_cycle_phase_instability_conquest_icon:0 "@tgp_dynastic_cycle_conquest_icon! $situation_dynastic_cycle_phase_instability_conquest$"
 situation_dynastic_cycle_phase_instability_desc:0 "$situation_dynastic_cycle_phase_instability_desc_short$ Se [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName] for evitado, é possível que a China alcance a [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] ou a [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] $game_concept_dynastic_cycle_era_short$.\n\nA China entra nesta $game_concept_dynastic_cycle_era_short$ a partir de [dynastic_cycle_era_type_stable|E] se catalisadores suficientes [situation_catalyst_catalysts|E] forem acionados."
 situation_dynastic_cycle_phase_instability_desc_short:0 "Esta é uma [dynastic_cycle_era_short|E] de agitação, mas também de oportunidade. Embora a corrupção, a insatisfação popular e as invasões sejam ameaças, um governo sábio pode reformar a China."
 situation_dynastic_cycle_phase_instability_icon:0 "@tgp_dynastic_cycle_instability_icon! $situation_dynastic_cycle_phase_instability$"
 situation_dynastic_cycle_phase_stability:0 "Estabilidade"
 situation_dynastic_cycle_phase_stability_advancement:0 "Avanço"
 situation_dynastic_cycle_phase_stability_advancement_desc:0 "$situation_dynastic_cycle_phase_stability_advancement_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Portanto, para reformar a China para este $game_concept_dynastic_cycle_era_short$ a partir da [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] $game_concept_dynastic_cycle_era_short$, ela deve primeiro entrar na $game_concept_dynastic_cycle_era_short$ de [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]."
 situation_dynastic_cycle_phase_stability_advancement_desc_short:0 "Nesta [dynastic_cycle_era_short|E], o Império foca em se aprimorar olhando para dentro: através de [innovations|E], excelência cultural, prosperidade do povo e boa governança [meritorious|E] [GetReligionByKey('confucianism_religion').GetAdjective]."
 situation_dynastic_cycle_phase_stability_advancement_icon:0 "@tgp_dynastic_cycle_advancement_icon! $situation_dynastic_cycle_phase_stability_advancement$"
 situation_dynastic_cycle_phase_stability_desc:0 "#D Esta fase não deve ser exibida#!"
 situation_dynastic_cycle_phase_stability_expansion:0 "Expansão"
 situation_dynastic_cycle_phase_stability_expansion_desc:0 "$situation_dynastic_cycle_phase_stability_expansion_desc_short$\n\n$SITUATION_DYNASTIC_CYCLE_FROM_UNSTABLE_ERA$ Portanto, para reformar a China para este $game_concept_dynastic_cycle_era_short$ a partir da [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] $game_concept_dynastic_cycle_era_short$, ela deve primeiro entrar na $game_concept_dynastic_cycle_era_short$ de [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]."
 situation_dynastic_cycle_phase_stability_expansion_desc_short:0 "Nesta [dynastic_cycle_era_short|E], o Império foca em se tornar mais forte olhando para fora: pacificando fronteiras, expandindo seu alcance por força militar, [tributaries|E] e a [silk_road|E]."
 situation_dynastic_cycle_phase_stability_expansion_icon:0 "@tgp_dynastic_cycle_expansion_icon! $situation_dynastic_cycle_phase_stability_expansion$"
 situation_parameter_dynastic_cycle_can_build_in_tributaries:0 "[son_of_heaven|E] e [minister_of_works|E] $house_aspiration_parameter_can_build_in_tributaries|l$"
 situation_parameter_dynastic_cycle_choose_stability_phase:0 "No início de [situation_dynastic_cycle_phase|E], [son_of_heaven|E] escolhe entre [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] e [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]"
 situation_parameter_dynastic_cycle_external_tributaries_vassals_increased_independence_desire:0 "[vassals|E] e [tributaries|E] não [de_jure|E] têm maior probabilidade de declarar ou exigir independência"
 situation_parameter_dynastic_cycle_faster_title_integration:0 "Progresso de [integrate_title|E] da [councillor_task|E] [GetPlayer.GetCouncillor('councillor_chancellor').GetCouncilTitlePossessive]: #P +10#!"
 situation_parameter_dynastic_cycle_governor_efficiency_penalty:0 "[governor_efficiency_i|E][governor_efficiency|E] é reduzido em #N [EmptyScope.ScriptValue('corruption_phase_governor_efficiency_penalty_value')|-0]%#! para cada [legitimacy_level|E] [son_of_heaven_possessive|E] abaixo do nível 5"
 situation_parameter_dynastic_cycle_great_projects_increased_legitimacy:0 "Aumenta [legitimacy|E] ao completar [great_projects|E]: #P +100%#!"
 situation_parameter_dynastic_cycle_hegemon_increased_metropolitan_limit:0 "[GetSubjectContractType( 'celestial_provinces' ).GetObligationName( 'celestial_province_metropolitan' )] Desbloqueado"
 situation_parameter_dynastic_cycle_hegemon_increased_protectorate_limit:0 "[GetSubjectContractType( 'celestial_provinces' ).GetObligationName( 'celestial_province_protectorate' )] Desbloqueado"
 situation_parameter_dynastic_cycle_hegemon_legitimacy_from_external_conquest:0 "[duchies|E] e [kingdoms|E] conquistados concedem mais @legitimacy_icon![legitimacy|E] a [son_of_heaven|E]"
 situation_parameter_dynastic_cycle_hegemon_legitimacy_increasing_expectations:0 "As [legitimacy_expectations|E] de [son_of_heaven_possessive|E] aumentam em #V 1#! após #V 50#! e #V 100#! anos desde o início da [situation_dynastic_cycle_phase|E] [dynastic_cycle_era_type_stable|E]"
 situation_parameter_dynastic_cycle_hegemon_martial_examinations:0 "A [activity|E] [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType( 'activity_imperial_examination').GetName] pode ser realizado com o [activity_type|E] #high $imperial_examination_focus_martial$#!"
 situation_parameter_dynastic_cycle_hegemon_may_favour_own_culture_for_appointments:0 "[son_of_heaven|E] pode usar a [decision|E] [GetDecisionWithKey('situation_dynastic_cycle_favor_own_culture_for_appointments').GetName] para favorecer [governors|E] de sua própria [culture|E]"
