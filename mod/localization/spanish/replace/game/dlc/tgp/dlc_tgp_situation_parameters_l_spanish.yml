 dynastic_cycle_participant_group_advancement_movement:0 "$game_concept_movement$ de Avanço"
 dynastic_cycle_participant_group_advancement_movement_desc:0 "Todos os [vassals|E] de [GetTitleByKey('h_china').GetDefinitiveName] que desejam impulsionar o [dynastic_cycle|E] [situation_dynastic_cycle_phase|E] em direção à [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName].\n\nEles se dedicam ao enriquecimento das províncias centrais chinesas: aumentando [development|E], completando [great_projects|E], descobrindo [innovations|E] e obtendo [merit|E] através de [examinations|E].\n$unlockables_advancement$"
