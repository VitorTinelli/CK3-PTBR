l_spanish:
 debate_event.1000.a.success_desc:0 "Preparativos Excelentes"
 debate_event.1000.a:0 "Não há um momento a perder!"
 debate_event.1000.b:0 "Devo explorar a cidade."
 debate_event.1000.c:0 "Uma oportunidade perfeita para relaxar."
 debate_event.1000.desc_intro_fallback:0 "Cheguei"
 debate_event.1000.desc_intro_host:0 "Estudiosos de todo o reino se reuniram"
 debate_event.1000.desc_outro:0 "em [ROOT.Char.GetCurrentLocation.GetName] para o debate.\n\nJá, os debatedores praticam seus discursos em pequenos grupos, as grandes famílias procuram as melhores acomodações, enquanto uma procissão de carroças carregadas de vegetais e carnes se move ruidosamente em direção ao mercado.\n\nÉ hora de eu me preparar também."
 debate_event.1000.t:0 "Preparando o Palco"
 debate_event.1010.a:0 "Este será meu momento."
 debate_event.1010.desc:0 "Estudiosos invadem o salão de debates, discípulos seguindo seus mestres, braços sobrecarregados por pesados pergaminhos. M[Select_CString( debate_opponent.IsFemale, 'inha', 'eu' )] oponente [debate_opponent.GetTitledFirstName] está pronto no extremo oposto do salão, cercado por outros membros de [opponent_movement.GetName].\n\nNão há mais tempo para preparações. Entrando neste debate, devo confiar em minha inteligência para ter sucesso."
 debate_event.1010.t:0 "Início do Debate"
 debate_event.1015.a:0 "Pergunto-me quem vencerá."
 debate_event.1015.desc:0 "Caminho pela multidão, esperando garantir um bom ponto de observação do debate que se seguirá. O [my_movement.GetName] ocupa o extremo do salão de debates. Após alguns movimentos e murmúrios, encontro-me entre meus pares.\n\n[debate_contender.GetTitledFirstName] e [debate_opponent.GetTitledFirstName] se enfrentam, prontos para provar quem é o"
 debate_event.1015.desc_favor:0 "favorito d[Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]."
 debate_event.1015.desc_leadership:0 "líder de [contender_movement.GetNameNoTooltip]."
 debate_event.1015.t:0 "$debate_event.1010.t$"
 debate_event.1100.a:0 "Notícia lamentável."
 debate_event.1100.desc_death:0 "Parece que [Select_CString( debate_opponent.IsFemale, 'a', 'o' )] [debate_opponent.GetTitledFirstName] faleceu. Sem ninguém para debater, o debate foi cancelado."
 debate_event.1100.desc_fallback:0 "Acabei de receber a notícia de que o debate foi suspenso. O motivo é desconhecido, além do fato de que não pode prosseguir neste momento."
 debate_event.1100.t:0 "Debate Cancelado"
 debate_event.2000.a:0 "Os talentos de [talent.GetHerHis|U] florescerão sob minha orientação."
 debate_event.2000.b:0 "Todos devemos nos sentir humildes pelas palavras de [talent.GetHerHis]."
 debate_event.2000.desc:0 "Vozes elevadas me atraem para uma sala de estudos, onde encontro m[Select_CString( talent.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', talent)] [talent.GetTitledFirstName] gesticulando para a multidão reunida. \"Nenhum de vocês está aqui hoje para engajar-se em debate acadêmico verdadeiro, mas para se gabar e reivindicar superioridade sobre seus pares!\"\n\n[talent.GetSheHe|U] fala com a mesma convicção que ouvi de [talent.GetHerHim] o dia todo. [talent.GetHerHis|U] rosto treme com emoção quase contida. Est[Select_CString( talent.IsFemale, 'a', 'e' )] [talent.GetWomanMan] mostra promessa de um intelecto perspicaz, embora esse temperamento possa ser difícil."
 debate_event.2000.t:0 "O Orgulho é uma Loucura"
 debate_event.2010.a:0 "\"Concordo completamente.\""
 debate_event.2010.b:0 "\"Algumas diferenças não podem ser ignoradas.\""
 debate_event.2010.desc:0 "\"Devo dizer, sua interpretação de [ROOT.Char.Custom('GetRandomHistoryPassage')] despertou meu interesse,\" diz [elder.GetTitledFirstName] ao final de um longo dia de discussões amistosas. \"Tenho certeza de que, deixando nossas diferenças de lado, há muito a aprender uns com os outros.\"\n\nA atmosfera amigável de nossas conversas muitas vezes me faz esquecer que [elder.GetSheHe] pertence a [elder_movement.GetNameNoTooltip] — fato que me é lembrado quando um membro de [my_movement.GetNameNoTooltip] lança um olhar incisivo em minha direção."
 debate_event.2010.t:0 "Influência de [elder_movement.GetNameNoTooltip]"
 debate_event.2020.a:0 "\"Tenho muito a ensinar a [disciple.GetHerHim].\""
 debate_event.2020.b:0 "\"Sua amizade é tudo que peço.\""
 debate_event.2020.desc:0 "Meu colega de [my_movement.GetName] [movement_member.GetTitledFirstName] se aproxima com um homem curvado a reboque, cabeça baixa em saudação. \"Ouvi dizer que procura indivíduos talentosos para seu séquito,\" diz [movement_member.GetFirstNameNoTooltip]. \"Acredito que [disciple.GetTitledFirstName] possa ser um candidato adequado.\"\n\n[disciple.GetFirstNameNoTooltip] [disciple.Custom('quirk_pos_present')] e diz: \"Seria uma honra servi-lo, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord].\""
 debate_event.2020.t:0 "Trocas Amistosas"
 debate_event.5000.a.flavor:0 "Aproveite sua experiência no [trait|E] [GetTrait('confucian_education').GetName( GetNullCharacter )] - Maior experiência significa maior sucesso"
 debate_event.5000.a:0 "Governarei pelo decreto de Kongzu."
 debate_event.5000.b:0 "A lógica e a razão prevalecerão."
 debate_event.5000.c.flavor:0 "Conforme instruído, seus [disciples|E] tentarão animar os espectadores em momentos oportunos - Esperançosamente, os próprios discípulos de [debate_opponent.GetShortUINamePossessive] não atrapalharão..."
 debate_event.5000.c:0 "Muito bem. #EMP Agora#! é o momento de..."
 debate_event.5000.d.failure_desc:0 "Você falha em apresentar um argumento convincente"
 debate_event.5000.d.success_desc:0 "Você consegue apresentar argumentos convincentes"
 debate_event.5000.d:0 "Sua falta de liderança trará ruína!"
 debate_event.5000.desc:0 "O palco foi montado e os espectadores acomodados. [debate_opponent.GetTitledFirstName] levanta-se de seu assento para dirigir-se à multidão, nossos colegas membros de [host.Custom('GetMyMovement')].\n\n\"Estamos aqui para discutir as prioridades e a direção de [host.Custom('GetMyMovement')]. O resultado deste debate também determinará sua liderança.\""
 debate_event.5000.desc_imperial:0 "Dignitários e espectadores alinham-se às paredes do salão de debates, observando-me enquanto me posiciono à frente d[Select_CString( debate_opponent.IsFemale, 'a', 'o' )] [debate_opponent.GetTitledFirstName]. Nos curvamos em uníssono, braços estendidos, costas arqueadas.\n\nDevo aproveitar o momento e ser o primeiro a apresentar um argumento."
 debate_event.5000.t_imperial_debate:0 "O Favor Imperial"
 debate_event.5000.t_movement_debate:0 "A Liderança de [host.Custom('GetMyMovementNoTooltip')]"
 debate_event.5010.a:0 "Aprofundar minha abordagem atual."
 debate_event.5010.b:0 "Talvez as palavras de Confúcio os convençam?"
 debate_event.5010.c:0 "Uma abordagem mais #EMP razoável#! deve iluminá-los."
 debate_event.5010.confucian_desc:0 "[debate_opponent.GetTitledFirstName] fala calmamente sobre Confúcio e como seus ensinamentos devem nos guiar adiante."
 debate_event.5010.d:0 "Vamos colocar meus discípulos para trabalhar."
 debate_event.5010.desc:0 "[debate_opponent.GetTitledFirstName] fala sobre lógica e razão, e como devemos usar aprendizados anteriores para definir um novo futuro para o reino."
 debate_event.5010.e:0 "Quando tudo falhar, insultos certamente funcionarão."
 debate_event.5010.insult_desc:0 "[debate_opponent.GetTitledFirstName] não perde tempo e imediatamente começa a listar várias acusações e insultos, declarando que #EMP eu#! de alguma forma não sou apto para liderar.\n\nAbsurdos! Nada além de uma tentativa astuta de minar minha autoridade."
 debate_event.5100.a:0 "Por agora, vou aproveitar o momento."
 debate_event.5100.b:0 "Terei simplesmente que tentar novamente..."
 debate_event.5100.desc_loser:0 "Apesar dos meus melhores esforços, [debate_winner.GetTitledFirstName] foi declarado vencedor do debate. Assim, [debate_winner.GetSheHe] também permanecerá como líder de facto de [my_movement.GetNameNoTooltip].\n\nApós receber uma rodada de congratulações, [debate_winner.GetSheHe] finalmente volta sua atenção para mim.\n\n\"Nem todos estão destinados a liderar. Mas não se preocupe, seu tempo ainda pode chegar.\""
 debate_event.5100.desc_unexpected_loser:0 "Em uma reviravolta completamente inesperada, [debate_winner.GetTitledFirstName] foi declarado como o #EMP vencedor#!. [debate_winner.GetFirstNameNoTooltip] me olha, e eu para [debate_winner.GetHerHim], ambos igualmente atônitos. Será que ouvimos isso direito? Sim, ouvimos.\n\nApós receber uma rodada de congratulações, ainda com surpresa em seu rosto, [debate_loser.GetFirstNameNoTooltip] se dirige a mim: \"Sinto que você se saiu admiravelmente. Mesmo que, de alguma forma, não tenha conseguido vencer hoje.\""
 debate_event.5100.desc_unexpected_winner:0 "Em uma reviravolta completamente inesperada, #EMP eu#! fui declarado vencedor. [debate_loser.GetTitledFirstName] me olha, e eu para [debate_loser.GetHerHim], ambos igualmente atônitos. Será que ouvimos isso direito? Sim, ouvimos.\n\nApós um momento, visivelmente se recompondo, [debate_loser.GetFirstNameNoTooltip] se dirige a mim: \"Suponho que parabéns sejam devidos. Porém, não consigo imaginar por que alguém o declararia vencedor...\""
 debate_event.5100.desc_winner:0 "Após cuidadosa preparação e execução magistral, fui declarado vencedor do debate!\n\n[debate_loser.GetTitledFirstName] oferece uma reverência curta, porém formal, antes de se dirigir a mim: \"Suponho que parabéns sejam devidos. Os outros logo olharão para você para liderá-los. Apenas peço que o faça com a máxima responsabilidade.\""
 debate_event.5100.t_loser:0 "- Derrota!"
 debate_event.5100.t_winner:0 "- Vitória!"
 debate_event.5110.a.tt:0 "[winning_movement.GetNameNoTooltip] torna-se [favored_movement|E]"
 debate_event.5110.a:0 "[debate_winner.GetNameNoTooltip] é, de fato, o vencedor."
 debate_event.5110.b:0 "#EMP Na verdade#!, acho que [debate_loser.GetNameNoTooltip] venceu."
 debate_event.5110.desc:0 "Argumentos vão e vêm entre os dois oponentes por bastante tempo. Eles pleiteiam com lógica, falam sobre o futuro do reino e, não sem os ocasionais insultos, consideram as qualidades de um líder.\n\nQuando o debate termina, [debate_winner.GetTitledFirstName] parece ter tido o raciocínio mais sólido e seria o vencedor natural.\n\nComo [ROOT.Char.GetTitleAsNameNoTooltip], entretanto, cabe a mim declarar o vencedor como achar apropriado."
 debate_event.5110.t:0 "- Eleição de um Vencedor"
 debate_event.5120.a:0 "Fico feliz que pense assim, m[Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTopLiege.GetLadyLord]!"
 debate_event.5120.b:0 "O quê? Quero dizer, claro. Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], m[Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTopLiege.GetLadyLord]!"
 debate_event.5120.bridge_fallback:0 "\n\nUm enviado parte rapidamente para enviar notícias [Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], e retorna com a informação de que"
 debate_event.5120.bridge_hegemon_available:0 "Todos os olhares se voltam para [ROOT.Char.GetTopLiege.GetName]."
 debate_event.5120.c:0 "Que... decepcionante."
 debate_event.5120.desc_liege_confirm:0 "\n\n\"Concordo. [debate_winner.GetFirstNameNoTooltip] é um vencedor digno, que navegou pelo debate com extrema habilidade e astúcia.\""
 debate_event.5120.desc_liege_confirm_fallback:0 "a corte imperial considera [winning_movement.GetNameNoTooltip] digna do favor do império."
 debate_event.5120.desc_liege_intervene:0 "\n\n\"Eu declaro [declared_winner.GetTitledFirstName] [Select_CString( declared_winner.IsFemale, 'a', 'o' )] vencedor[Select_CString( declared_winner.IsFemale, 'a', '' )] do debate de hoje.\""
 debate_event.5120.desc_loser:0 "Após um breve descanso, o anunciante resume o debate e, sem declarar explicitamente, deixa claro que [debate_winner.GetTitledFirstName] é o vencedor."
 debate_event.5120.desc_winner:0 "Após um breve descanso, o anunciante resume o debate e, sem declarar explicitamente, deixa claro que sou o vencedor. Entretanto, não é decisão do anunciante."
 debate_event.5130.desc_favor:0 "$debate_become_movement_leader_reward$"
 debate_event.5130.desc_leadership_defended:0 "$debate_remain_movement_leader_reward$"
 debate_event.5130.desc_leadership_won:0 "$debate_become_movement_leader_reward$"
 debate_event.crowd_approval_desc:0 "\n\nOs espectadores acenam em concordância."
 debate_event.crowd_disapproval_desc:0 "\n\nOs espectadores balançam a cabeça em desaprovação."
 debate_events.5100.opponent_tt:0 "Reduziu o [movement_power_i][movement_power|E] do [opponent_movement.GetName] em #N [EmptyScope.ScriptValue('event_decrease_movement_power_major_value')|0]#!"
 debate_increased_movement_power_major_effect_tooltip:0 "Aumentou o [movement_power_i][movement_power|E] de [GetPlayer.Custom('GetMyMovement')] em [EmptyScope.ScriptValue('event_increase_movement_power_major_value')|+0]"
 friend_given_disciple_reason:0 "[CHARACTER.GetShortUIName|U] recebeu um discípulo de [TARGET_CHARACTER.GetShortUIName] durante um debate."
 friend_given_disciple_reason_corresponding:0 "$friend_given_disciple_reason$"
 tgp_dynastic_cycle_decision_event.0082.a:0 "Nossa posição permanece segura. Por enquanto."
 tgp_dynastic_cycle_decision_event.0082.b:0 "Ufa. Achei que estávamos perdidos."
 tgp_dynastic_cycle_decision_event.0082.c:0 "Como [ROOT.Char.GetTopLiege.GetSheHe] pôde tomar tal decisão?!"
