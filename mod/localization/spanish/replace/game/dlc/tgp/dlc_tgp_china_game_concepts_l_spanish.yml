l_spanish:
 HAS_SEAL_OF_INVESTITURE:0 "Você possui um [seal_of_investiture|E]"
 IMPERIAL_GRACE_ICON:0 "@imperial_grace!"
 IMPERIAL_GRACE_LOSS_CHAOS:0 "Como o [dynastic_cycle|E] está atualmente na fase $situation_dynastic_cycle_phase_chaos$, todos os #EMP $tributaries_celestial$#! perdem @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_chaos')|V] de [imperial_grace|E] a cada ano."
 IMPERIAL_GRACE_LOSS_INSTABILITY:0 "Como o [dynastic_cycle|E] está atualmente na fase $situation_dynastic_cycle_phase_stability_advancement$, todos os #EMP $tributaries_celestial$#! perdem @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability')|V] de [imperial_grace|E] a cada ano."
 IMPERIAL_GRACE_LOSS_INSTABILITY_CONQUEST:0 "Como o [dynastic_cycle|E] está atualmente na fase $situation_dynastic_cycle_phase_instability_conquest$, todos os #EMP $tributaries_celestial$#! perdem @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_instability_conquest')|V] de [imperial_grace|E] a cada ano."
 IMPERIAL_GRACE_LOSS_STABILITY:0 "Como o [dynastic_cycle|E] está atualmente na fase $situation_dynastic_cycle_phase_stability$, todos os #EMP $tributaries_celestial$#! perdem @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability')|V] de [imperial_grace|E] a cada ano."
 IMPERIAL_GRACE_LOSS_STABILITY_ADVANCEMENT:0 "Como o [dynastic_cycle|E] está atualmente na fase $situation_dynastic_cycle_phase_stability_advancement$, todos os #EMP $tributaries_celestial$#! perdem @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_advancement')|V] de [imperial_grace|E] a cada ano."
 IMPERIAL_GRACE_LOSS_STABILITY_EXPANSION:0 "Como o [dynastic_cycle|E] está atualmente na fase $situation_dynastic_cycle_phase_stability_expansion$, todos os #EMP $tributaries_celestial$#! perdem @imperial_grace! [EmptyScope.ScriptValue('imperial_grace_loss_situation_dynastic_cycle_phase_stability_expansion')|V] de [imperial_grace|E] a cada ano."
 NO_SEAL_OF_INVESTITURE:0 "Você não possui um [seal_of_investiture|E]"
 SUBJECT_STANDING_CONCEPT:0 "[subject_standing|E]"
 SUBJECT_STANDING_IMPERIAL_GRACE_CONCEPT:0 "[imperial_grace|E]"
 disciple_elder_benefits_tt:0 "Um $game_concept_disciple$ e um [elder|E]:\n$BULLET_WITH_TAB$ Obtêm mais [merit|E]\n$BULLET_WITH_TAB$ Têm menor probabilidade de usar [hostile_schemes|E] um contra o outro\n$BULLET_WITH_TAB$ Têm maior probabilidade de aceitar [interactions|E] enviadas pelo outro\n$BULLET_WITH_TAB$ Têm maior probabilidade de usar a [interactions|E] amistosas um com o outro #weak (ex: $gift_interaction$, $invite_to_council_position_interaction$, etc.)#!\n$BULLET_WITH_TAB$ Ambos pertencerão ao [movement|E] $game_concept_elder_possessive$"
 game_concept_appointment_prominence:0 "Proeminência"
 game_concept_appointment_prominence_desc:0 "$game_concept_appointment_prominence$ reflete o quão desejável um [title|E] é para candidatos elegíveis.\n\nUm candidato que já possui um Título só será nomeado para um novo do mesmo [title_tier|E] se ele tiver um $game_concept_appointment_prominence$ mais alto.\n\n$game_concept_appointment_prominence$ geralmente é baseado na riqueza local e na proximidade da [realm_capital|E], mas outros fatores podem se aplicar dependendo das circunstâncias, como o tamanho de [title_men_at_arms|E] para [military_governors|E]."
 game_concept_celestial:0 "Celestial"
 game_concept_celestial_bureaucracy:0 "Burocracia Celestial"
 game_concept_celestial_bureaucracy_desc:0 "$game_concept_celestial_bureaucracy$ representa um nível [celestial|E] [realm_possessive|E] de centralização e o poder geral que o [ruler|E] exerce sobre seus [vassals|E].\n\nApenas o [top_liege|E] pode alterar $game_concept_celestial_bureaucracy$. Os $game_concept_vassals$ celestiais usam o mesmo nível que seu $game_concept_liege$.\n\nExistem quatro níveis de $game_concept_celestial_bureaucracy$:\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$celestial_bureaucracy_3$\n\nAumentar $game_concept_celestial_bureaucracy$ custa uma quantidade de [prestige|E] dependendo do [realm_size|E] e da [learning_skill|E] do governante."
 game_concept_celestial_government:0 "Governo Celestial"
 game_concept_celestial_government_desc:0 "$game_concept_celestial$ é uma [government_form|E] [government_bureaucratic_type|E] em que o [liege|E] nomeia personagens como [governors|E], dos quais existem dois tipos: [civilian_governor_short|E] e [military_governor_short|E].\n\nPersonagens têm acesso a [influence|E], [noble_families|E], [family_estates|E] e [treasury|E].\n\n[rulers|E] independentes têm [legitimacy|E], enquanto [vassals|E] focam em obter [merit|E]."
 game_concept_celestial_i:0 "@government_type_celestial!"
 game_concept_celestials:0 "Celestiais"
 game_concept_childrens_examination:0 "Exame Infantil"
 game_concept_childrens_examination_desc:0 "O primeiro nível de [imperial_examinations|E], realizado a partir da idade de [EmptyScope.ScriptValue('child_exam_min_age')]. Os pais podem enviar seus filhos para o exame através da $send_child_to_examination_interaction$ [interaction|E]."
 game_concept_childrens_examination_i:0 "@child_exam_icon"
 game_concept_civilian_career:0 "Carreira Civil"
 game_concept_civilian_career_path:0 "Caminho Civil"
 game_concept_civilian_career_path_desc:0 "[rulers|E] que seguem um Caminho Civil focam em habilidades administrativas em vez de astúcia militar. Eles são nomeados para Circuitos Civis e seu [merit|E] crescerá de acordo com seu sucesso no desenvolvimento da terra com [buildings|E] e no aumento dos [taxes|E] pagos ao seu [liege|E]."
 game_concept_civilian_career_path_i:0 "@celestial_standard_administration!"
 game_concept_civilian_career_short:0 "Civil"
 game_concept_civilian_governor:0 "Governador Civil"
 game_concept_civilian_governor_desc:0 "Um Governador Civil é um [governor|E] com [vassal_obligations|E] civis. Ao contrário dos [military_governors|E], ele não pode manter [title_men_at_arms|E] e foca exclusivamente em tarefas administrativas e no desenvolvimento das terras que governa.\n\n[characters|E] que seguem um [civilian_career_path|E] podem se tornar Governadores Civis."
 game_concept_civilian_governor_short:0 "Civil"
 game_concept_civilian_governors:0 "Governadores Civis"
 game_concept_disaster:0 "Desastre"
 game_concept_disaster_desc:0 "$game_concept_natural_disasters$ englobam [floods|E] e [earthquakes|E].\n\nUm $game_concept_natural_disaster$ resultará na [character_death_death|E] de muitos [characters|e] nas [counties|E] afetadas, e terá um impacto negativo significativo em [development|E], [county_opinion|E] e [control|E], de acordo com a severidade do desastre.\n\nA devastação causada por um $game_concept_natural_disaster$ pode ser revertida e a terra revitalizada com a conclusão de um [great_project|E] de Socorro."
 game_concept_disasters:0 "Desastres"
 game_concept_disciple:0 "Discípulo"
 game_concept_disciple_desc:0 "Os $game_concept_disciples$ são [characters|E] que respeitam o alto status de um [elder|E] e seguem seus ensinamentos, até o [disciple_limit_short|E].\n\nEles podem acessar a [character_interaction|E] #high $request_mentoring_interaction$#! #weak (Esquema)#! para aumentar suas [skills|E], e a [character_interaction|E] #high $celestial_request_elders_support_interaction$#! para obter [gold|E], [courtiers|E] e mais.\n\n$disciple_elder_benefits_tt$"
 game_concept_disciple_limit:0 "Limite de Discípulos"
 game_concept_disciple_limit_desc:0 "O $game_concept_disciple_limit$ é a capacidade de quantos [disciples|E] um [elder|E] pode ter em determinado momento.\n\nO limite é [EmptyScope.ScriptValue('disciples_limit_base_value')|V0] por padrão. Pode ser aumentado, por exemplo, melhorando um [domicile|E] com certos [domicile_buildings|E]."
 game_concept_disciple_limit_short:0 "Limite"
 game_concept_disciple_possessive:0 "do Discípulo"
 game_concept_disciples:0 "Discípulos"
 game_concept_disciples_possessive:0 "dos Discípulos"
 game_concept_dynastic_cycle:0 "Ciclo Dinástico"
 game_concept_dynastic_cycle_catalyst:0 "Catalisador do Ciclo Dinástico"
 game_concept_dynastic_cycle_catalyst_desc:0 "$game_concept_situation_catalyst_desc$"
 game_concept_dynastic_cycle_catalyst_possessive:0 "do Catalisador do Ciclo Dinástico"
 game_concept_dynastic_cycle_catalysts:0 "Catalisadores do Ciclo Dinástico"
 game_concept_dynastic_cycle_catalysts_possessive:0 "dos Catalisadores do Ciclo Dinástico"
 game_concept_dynastic_cycle_desc:0 "O $game_concept_dynastic_cycle$ representa o estado sociopolítico do Grande Império da China, que flui através de [situation_dynastic_cycle_phases|E] de estabilidade, instabilidade e caos.\n\nElemento chave do $game_concept_dynastic_cycle$ é o [mandate_of_heaven|E], uma forma de [legitimacy|E] detida pelo Imperador. Se ele for perdido, o Grande Império da China #N se fragmentará#! — até ser novamente unificado por alguém digno de ser o Filho do Céu.#!"
 game_concept_dynastic_cycle_era_short:0 "Era"
 game_concept_dynastic_cycle_era_type:0 "Tipo de Era do Ciclo Dinástico"
 game_concept_dynastic_cycle_era_type_chaotic:0 "Era Caótica"
 game_concept_dynastic_cycle_era_type_chaotic_desc:0 "[dynastic_cycle_era_types|E] Caóticas representam períodos em que o Império está fragmentado, e o [mandate_of_heaven|E] está perdido — podendo ser recuperado por aqueles dignos.\n\nExiste apenas uma Era Caótica: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
 game_concept_dynastic_cycle_era_type_desc:0 "Existem três Tipos de Era no [dynastic_cycle|E], que categorizam as [situation_dynastic_cycle_phases|E] e colocam cada uma na natureza tripartida e repetitiva do Ciclo Dinástico.\n\nTipos de Era: [dynastic_cycle_era_type_stable|E], [dynastic_cycle_era_type_unstable|E], [dynastic_cycle_era_type_chaotic|E]"
 game_concept_dynastic_cycle_era_type_stable:0 "Era Estável"
 game_concept_dynastic_cycle_era_type_stable_desc:0 "[dynastic_cycle_era_types|E] Estáveis representam períodos em que o Império está mais próspero e bem-sucedido, e o [mandate_of_heaven|E] é forte.\n\nEras: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName]"
 game_concept_dynastic_cycle_era_type_unstable:0 "Era Instável"
 game_concept_dynastic_cycle_era_type_unstable_desc:0 "[dynastic_cycle_era_types|E] Instáveis representam períodos em que o Império está em turbulência devido a forças internas ou externas, e o [mandate_of_heaven|E] está vacilante.\n\nEras: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability_conquest').GetName]"
 game_concept_dynastic_cycle_era_types:0 "Tipos de Era"
 game_concept_dynastic_cycle_eras_short:0 "Eras"
 game_concept_dynastic_cycle_possessive:0 "do Ciclo Dinástico"
 game_concept_earthquake:0 "Terremoto"
 game_concept_earthquake_desc:0 "Um $game_concept_earthquake$ é um tipo de [natural_disaster|E] que causa destruição grave e repentina em um pequeno número de [counties|E].\n$game_concept_earthquakes$ só podem ocorrer em regiões mais propensas à atividade sísmica."
 game_concept_earthquakes:0 "Terremotos"
 game_concept_elder:0 "Ancião"
 game_concept_elder_desc:0 "Um $game_concept_elder$ é um [character|E] com um ou mais [disciples|E], que seguem os ensinamentos $game_concept_elders_possessive$.\n\n$disciple_elder_benefits_tt$"
 game_concept_elder_possessive:0 "do Ancião"
 game_concept_elders:0 "Anciãos"
 game_concept_elders_possessive:0 "dos Anciãos"
 game_concept_entrant:0 "Candidato"
 game_concept_entrant_desc:0 "Um $game_concept_entrant$ é um personagem testando sua habilidade contra a [activity|E] [imperial_examination|E]."
 game_concept_entrants:0 "Candidatos"
 game_concept_exam_advantage:0 "Vantagem no Exame"
 game_concept_exam_advantage_desc:0 "O $game_concept_exam_advantage$ melhora as chances em várias ações durante um [imperial_examination|E], como ao responder perguntas e demonstrar habilidades."
 game_concept_exam_cheat:0 "Trapaça no Exame"
 game_concept_exam_cheat_desc:0 "Um $game_concept_exam_cheat$ desbloqueia opções que podem ser usadas para burlar o exame que se aproxima. Cuidado, ser pego é caro."
 game_concept_exam_score:0 "Pontuação no Exame"
 game_concept_exam_score_desc:0 "A $game_concept_exam_score$ determina a probabilidade de um candidato passar em um [imperial_examination|E].\n\nA pontuação inicial é baseada no [GetTrait('confucian_education').GetName(GetNullCharacter)] [trait|E] do candidato, assim como em suas [learning|E], [stewardship|E] e [martial|E] [skills|E], dependendo do foco do $game_concept_examination$.\n\nApenas os dez primeiros candidatos na [GetActivityType('activity_imperial_examination').GetName] [activity|E] podem tentar o @palace_exam_icon! #V Exame do Palácio#!."
 game_concept_examination:0 "Exame"
 game_concept_examinations:0 "Exames"
 game_concept_favored_era:0 "Era Favorita"
 game_concept_favored_era_desc:0 "A $game_concept_favored_era$ é a vontade do Céu manifestada pelo [son_of_heaven|E] sobre o curso do [dynastic_cycle|E]. Determina qual [dynastic_cycle_era_type_stable|E] será implementada após o término do [dynastic_cycle_era_type_unstable|E]."
 game_concept_favored_era_possessive:0 "da Era Favorita"
 game_concept_favored_movement:0 "Movimento Favorito"
 game_concept_favored_movement_desc:0 "O $game_concept_favored_movement$ é o [movement|E] que ganhou o apoio do [son_of_heaven|E].\n$BULLET_WITH_TAB$ Membros têm maior [candidate_scores|E] para quaisquer [titles|E] em [SelectLocalization( GetPlayer.IsValid, 'game_concept_favored_movement_desc_ingame', 'h_china' )]\n$BULLET_WITH_TAB$ Petições do [GetDecision('movement_petition_decision').GetName] [decision|E] têm maior chance de serem aceitas\n$BULLET_WITH_TAB$ [dynastic_cycle_possessive|E] [situation_catalyst_catalysts|E] são acionados com base em qual [movement|E] é favorecido\n$BULLET_WITH_TAB$ Ganha acesso ao [GetDecision('favored_movement_consults_heaven_decision').GetName] [decision|E]\n\n#help Para se tornar um movimento favorito, você deve derrotar o atual líder do movimento favorito em [GetActivityType('activity_debate').GetName] [activity|E].#!"
 game_concept_favored_movement_desc_ingame:0 "[GetTitleByKey('h_china').GetDefinitiveName]"
 game_concept_favored_movement_possessive:0 "do Movimento Favorito"
 game_concept_favored_movement_short:0 "Favorito"
 game_concept_flood:0 "Inundação"
 game_concept_flood_desc:0 "Uma $game_concept_flood$ é um [natural_disaster|E] que causa danos crescentes em um grande número de [counties|E].\n$game_concept_floods$ só podem ocorrer ao longo das margens de grandes rios."
 game_concept_flooded:0 "Alagado"
 game_concept_floods:0 "Inundações"
 game_concept_government_bureaucratic_gov:0 "Governo Burocrático"
 game_concept_government_bureaucratic_type:0 "Burocrático"
 game_concept_government_bureaucratic_type_desc:0 "Alguns [governments|E] são $game_concept_government_bureaucratic_type$. São Governos altamente centralizados que normalmente dependem de [governors|E], [appointment|E] e [noble_families|E] sem terras para gerenciar [provinces|E] dentro do [realm|E].\n\nOutras características comuns incluem [domiciles|E], [influence|E] e [title_men_at_arms|E].\n\nExistem vários Governos $game_concept_government_bureaucratic_type$:\n$BULLET_WITH_TAB$[GetGovernment('administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('celestial_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('meritocratic_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('japan_administrative_government').GetNameWithIcon]\n$BULLET_WITH_TAB$[GetGovernment('steppe_admin_government').GetNameWithIcon]"
 game_concept_governor_salary:0 "Salário do Governador"
 game_concept_governor_salary_desc:0 "Em [administrative_governments|E] que distinguem entre [gold|E] e [treasury|E], [governors|E] recebem um Salário em $game_concept_gold$."
 game_concept_grand_secretariat:0 "Grande Secretariado"
 game_concept_grand_secretariat_director:0 "Diretor do Secretariado"
 game_concept_grand_secretariat_director_desc:0 "O Diretor do Secretariado é um tipo de [diarch|E] para o [son_of_heaven|E], ajudando o governante divino a gerenciar o [realm|E].\n\nQuem ocupa o cargo depende da [GetLawGroup('grand_secretariat_laws').GetName|V] [law|E] ativa. A posição pode ser ocupada pelo [minister_grand_chancellor|E], pelo [minister_grand_marshal|E] ou pelo [minister_censor|E].\n\nO Diretor pode iniciar a maioria dos [great_projects|E] disponíveis para certos [ministers|E] e para o Filho do Céu."
 game_concept_grand_secretariat_possessive:0 "Do Grande Secretariado"
 game_concept_grand_secretariat_system:0 "Sistema do Grande Secretariado"
 game_concept_great_project:0 "Grande Projeto"
 game_concept_great_project_contribute:0 "Contribuir"
 game_concept_great_project_contributed:0 "Contribuído"
 game_concept_great_project_contribution:0 "Contribuição"
 game_concept_great_project_contribution_desc:0 "As contribuições permitem que vários [rulers|E] auxiliem no desenvolvimento de um [great_project|E], obtendo diversos benefícios em troca.\n\nAlgumas contribuições são obrigatórias para que o progresso do Grande Projeto comece, enquanto outras são opcionais. Contribuições opcionais restantes ainda podem ser feitas após o início do progresso, até certo ponto no tempo."
 game_concept_great_project_contributions:0 "Contribuições"
 game_concept_great_project_contributor:0 "Contribuinte"
 game_concept_great_project_contributor_desc:0 "Contribuintes são [rulers|E] que se comprometeram a cobrir ao menos uma [great_project_contribution|E] de um [great_project|E], recebendo vários benefícios em troca.\n\nPara a maioria das [great_project_contributions|E], qualquer [subject|E] dentro do [realm|E] pode se tornar um [great_project_contributor|E]."
 game_concept_great_project_contributor_possessive:0 "do Contribuinte"
 game_concept_great_project_contributors:0 "Contribuintes"
 game_concept_great_project_contributors_possessive:0 "dos Contribuintes"
 game_concept_great_project_desc:0 "Grandes Projetos são empreendimentos massivos que exigem todos os recursos do [realm|E].\n\nAlguns Grandes Projetos envolvem a construção de uma [great_building|E], enquanto outros envolvem a recuperação de um [natural_disaster|E].\n\nEmbora o [ruler|E] do Reino supervise o desenvolvimento do Grande Projeto, [subjects|E] podem oferecer [great_project_contributions|E] para auxiliar no seu progresso."
 game_concept_great_project_i:0 "@great_project_icon!"
 game_concept_great_project_possessive:0 "do Grande Projeto"
 game_concept_great_projects:0 "Grandes Projetos"
 game_concept_imperial_examination:0 "Exame do Serviço Civil"
 game_concept_imperial_examination_desc:0 "Os $game_concept_imperial_examinations$ desempenham um papel central nas funções [administrative|E] dos [governments|E] [GetGovernment('celestial_government').GetName|E] e [GetGovernment('meritocratic_government').GetName|E].\n\nAtravés do sistema de exames, burocratas são nomeados pelo [merit|E] em vez da linhagem, garantindo que os estudiosos mais brilhantes, independentemente da herança, possam obter nomeações para [governorship|E].\n\nOs níveis de exame são:\n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Infantil#!: Os pais podem inscrever seus filhos no exame a partir da idade de [EmptyScope.ScriptValue('child_exam_min_age')] através da [interaction|E] $send_child_to_examination_interaction$.#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Provincial#!: Personagens que não são [landed|E] podem tentar o segundo nível de Exames através da [activity|E] [GetActivityType('activity_local_examination').GetName].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Metropolitano#!: Realizado pelo [government|E] [GetGovernment('celestial_government').GetName|E] através da atividade [GetActivityType('activity_imperial_examination').GetName].#! \n#indent_newline:2 $EFFECT_LIST_BULLET$#bold Palácio#!: Os [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] finalistas do $activity_imperial_examination$ são convidados a um banquete no palácio real, para encontrar e mostrar seu valor ao [son_of_heaven|E].#!"
 game_concept_imperial_examinations:0 "Exames do Serviço Civil"
 game_concept_imperial_grace:0 "Graça Imperial"
 game_concept_imperial_grace_desc:0 "O $game_concept_imperial_grace$ representa o status concedido a um [tributary|E] pelo [son_of_heaven|E].\n\nAltos níveis de $game_concept_imperial_grace$ podem resultar em privilégios especiais concedidos ao $game_concept_tributary$ durante [tribute_missions|E]. Em níveis baixos de $game_concept_imperial_grace$, o $game_concept_son_of_heaven$ pode #EMP exigir#! tributo de você, e se chegar a zero, isso pode significar o fim do relacionamento."
 game_concept_imperial_treasury:0 "Tesouraria Imperial"
 game_concept_imperial_treasury_desc:0 "$game_concept_treasury_desc$"
 game_concept_imperial_treasury_i:0 "$game_concept_treasury_i$"
 game_concept_mandate_of_heaven:0 "Mandato do Céu"
 game_concept_mandate_of_heaven_desc:0 "O $game_concept_mandate_of_heaven$ é um tipo especial de [legitimacy|E] disponível apenas para o [son_of_heaven|E]. Representa o direito do monarca de governar e quem é considerado o governante supremo sob todos os céus.\n\nO Mandato está intimamente ligado ao [dynastic_cycle|E]. O Ciclo afeta como o monarca reinante ganha Legitimidade e pode também alterar o [situation_dynastic_cycle_phase|E] baseado no nível de Mandato do monarca."
 game_concept_mandate_of_heaven_mandate:0 "Mandato"
 game_concept_merit:0 "Mérito"
 game_concept_merit_desc:0 "O $game_concept_merit$ de um [character|E] acompanha seu progresso para o próximo [merit_level|E]. Todos os personagens com um [elder|E] ou [disciples|E] produzem um ganho passivo de $game_concept_merit$.\n\n[governors|E] podem aumentar seu $game_concept_merit$ construindo [buildings|E] em suas [holdings|E] designadas, realizando uma [activity|E] de [inspection|E], participando de um [GetActivityType('activity_debate').GetName] e frequentando [examinations|E].\n\n[GetSubjectContractType('celestial_provinces').GetObligationNameShort('celestial_province_standard')] governors aumentam seu ganho mensal de mérito pagando mais [taxes|E] ao seu [liege|E], enquanto [GetSubjectContractType('celestial_provinces').GetObligationNameShort('celestial_province_military')] governors aumentam criando [men_at_arms|E].\n\nPersonagens que não são $game_concept_governors$ podem tentar aumentá-lo frequentando [examinations|E]."
 game_concept_merit_i:0 "@merit_icon!"
 game_concept_merit_level:0 "Nível de Mérito"
 game_concept_merit_level_desc:0 "O $game_concept_merit_level$ de um [character|E] indica quão adequado ele é como [governor|E] em [administrative_governments|E] do Leste Asiático.\n\nRepresenta suas realizações documentadas e conduta moral segundo os ideais confucionistas, através da quantidade de [merit|E] que acumularam.\n\nUm oficial com alto $game_concept_merit_level$ possui maior [candidate_score|E] e [governor_salary|E].\n\nOs níveis são:\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_0').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_1').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_2').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_3').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_4').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_5').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_6').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_7').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_8').GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier('merit_level_9').GetNameWithTooltip|L]"
 game_concept_merit_level_impact:0 "Impacto do Nível de Mérito"
 game_concept_merit_level_impact_desc:0 "O Impacto do Nível de Mérito aumenta ou diminui os [modifiers|E] obtidos a partir do seu [merit_level|E] atual."
 game_concept_merit_levels:0 "Níveis de Mérito"
 game_concept_merit_pool:0 "Lista de Candidatos"
 game_concept_merit_pool_desc:0 "Uma $game_concept_merit_pool$ contém todos os [characters|E] elegíveis para obter [titles|E] com certos tipos de [appointment|E].\n\nOs candidatos são classificados com base em seu [candidate_score|E]. Algumas [appointment_succession_laws|E] usam [merit|E], que ordena os candidatos pelo seu [merit_level|E] primeiro e $game_concept_candidate_score$ em seguida.\n\nQuando o [holder|E] de um título com $game_concept_appointment$ morre, o título passa para o personagem de mais alta classificação na lista. Se o personagem já possui um título, o novo título deve ter maior [appointment_prominence|E], caso contrário, passará para o próximo candidato."
 game_concept_merit_pool_possessive:0 "Lista de Candidatos de"
 game_concept_merit_pools:0 "Listas de Candidatos"
 game_concept_meritorious:0 "Meritório"
 game_concept_metropolitan_examination:0 "Exame Metropolitano"
 game_concept_metropolitan_examination_desc:0 "O terceiro nível de [imperial_examinations|E]. Realizado pelo [government|E] [GetGovernment('celestial_government').GetName|E] através da [GetActivityType('activity_imperial_examination').GetName] [activity|E].\n\n#S Quando aprovado:#!\n[GetModifier('tgp_passed_metropolitan_exam_modifier').GetDescWithEffects]."
 game_concept_metropolitan_examination_i:0 "@metropolitan_exam_icon"
 game_concept_military_career:0 "Carreira Militar"
 game_concept_military_career_path:0 "Caminho Militar"
 game_concept_military_career_path_desc:0 "[rulers|E] que seguem um Caminho Militar focam em habilidades marciais em vez de tarefas administrativas. Eles são nomeados para Circuitos Militares e seu [merit|E] crescerá com base na capacidade de recrutar e manter [title_men_at_arms|E]."
 game_concept_military_career_path_i:0 "@celestial_military_administration!"
 game_concept_military_career_short:0 "Militar"
 game_concept_military_governor:0 "Governador Militar"
 game_concept_military_governor_desc:0 "Um Governador Militar é um [governor|E] com [vassal_obligations|E] militares. Eles podem manter [title_men_at_arms|E], ao contrário dos [civilian_governors|E], e os usarão para proteger o [realm|E] de invasões estrangeiras e apoiar outros Governadores que precisem de ajuda militar.\n\n[characters|E] que seguem um [military_career_path|E] podem se tornar Governadores Militares."
 game_concept_military_governor_short:0 "Militar"
 game_concept_military_governors:0 "Governadores Militares"
 game_concept_minister:0 "Ministro"
 game_concept_minister_censor:0 "$councillor_spymaster_celestial_government_imperial$"
 game_concept_minister_censor_desc:0 "O $game_concept_minister_censor$ é o [minister|E] responsável por assuntos de intriga e inteligência.\n\nTenha cuidado ao ter um Censor desleal, pois ele pode facilmente ocultar e participar de [schemes|E] contra você e sua [close_family|E]!\n\nO Censor pode ser designado como [grand_secretariat_director|E], dependendo da [law|E] [GetLawGroup('grand_secretariat_laws').GetName|V].\n\n$minister_censor_action_breakdown$"
 game_concept_minister_censor_possessive:0 "$councillor_spymaster_celestial_government_imperial_possessive$"
 game_concept_minister_desc:0 "$game_concept_ministers$ são um tipo de [councillors|E] que servem no [council|E], ou [ministry|E], do [son_of_heaven|E].\n\nCada ministro possui diversas responsabilidades, como financiar [great_projects|E] e auxiliar [governors|E] de diferentes maneiras."
 game_concept_minister_grand_chancellor:0 "$councillor_chancellor_celestial_government_imperial$"
 game_concept_minister_grand_chancellor_desc:0 "O $game_concept_minister_grand_chancellor$ é o [minister|E] de maior posição e é responsável pelos assuntos diplomáticos. Geralmente, é designado para o cargo de [grand_secretariat_director|E].\n\nO Chanceler pode ser designado como [grand_secretariat_director|E], dependendo da [law|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!.\n\n$minister_grand_chancellor_action_breakdown$"
 game_concept_minister_grand_chancellor_possessive:0 "$councillor_chancellor_celestial_government_imperial_possessive$"
 game_concept_minister_grand_marshal:0 "$minister_grand_marshal$"
 game_concept_minister_grand_marshal_desc:0 "O $game_concept_minister_grand_marshal$ é o comandante de mais alta patente no [realm|E] e comanda um [army|E] de [title_men_at_arms|E].\n\nO Marechal pode ser designado como [grand_secretariat_director|E], dependendo da [law|E] #V [GetLawGroup('grand_secretariat_laws').GetName]#!.\n\n$minister_grand_marshal_action_breakdown$"
 game_concept_minister_grand_marshal_possessive:0 "$minister_grand_marshal_possessive$"
 game_concept_minister_of_justice:0 "$minister_justice$"
 game_concept_minister_of_justice_desc:0 "O $game_concept_minister_of_justice$ é o [minister|E] responsável pelos assuntos legais e por auxiliar o [son_of_heaven|E] a manter um governo justo.\n\n$minister_of_justice_action_breakdown$"
 game_concept_minister_of_justice_possessive:0 "$minister_justice_possessive$"
 game_concept_minister_of_personnel:0 "$minister_personnel$"
 game_concept_minister_of_personnel_desc:0 "O $game_concept_minister_of_personnel$ é o [minister|E] responsável por todos os assuntos relacionados a [appointments|E] e pode impactar fortemente o [candidate_score|E] de outros [characters|E].\n\n$minister_of_personnel_action_breakdown$"
 game_concept_minister_of_personnel_possessive:0 "$minister_personnel_possessive$"
 game_concept_minister_of_revenue:0 "$councillor_steward_celestial_government_imperial$"
 game_concept_minister_of_revenue_desc:0 "O $game_concept_minister_of_revenue$ é o [minister|E] responsável pela [taxation|E] e auxilia o [son_of_heaven|E] com o [treasury|E].\n\n$minister_of_revenue_action_breakdown$"
 game_concept_minister_of_revenue_possessive:0 "$councillor_steward_celestial_government_imperial_possessive$"
 game_concept_minister_of_rites:0 "$councillor_court_chaplain_celestial_government_imperial$"
 game_concept_minister_of_rites_desc:0 "O $game_concept_minister_of_rites$ é o [minister|E] responsável pelos assuntos religiosos e espirituais, e pode auxiliar [governors|E] na organização de [examinations|E].\n\n$minister_of_rites_action_breakdown$"
 game_concept_minister_of_rites_possessive:0 "$councillor_court_chaplain_celestial_government_imperial_possessive$"
 game_concept_minister_of_war:0 "$minister_war$"
 game_concept_minister_of_war_desc:0 "O $game_concept_minister_of_war$ é o [minister|E] responsável pela administração e gestão das tropas. Quando [governors|E] súditos precisam de ajuda militar, é o $game_concept_minister_of_war$ quem pode enviar [Military Governors|E] para ajudar.\n\nO ministro não é um [commander|E] ativo e não lidera tropas. Isso é função do [minister_grand_marshal|E].\n\n$minister_of_war_action_breakdown$"
 game_concept_minister_of_war_possessive:0 "$minister_war_possessive$"
 game_concept_minister_of_works:0 "$minister_works$"
 game_concept_minister_of_works_desc:0 "O $game_concept_minister_of_works$ é o [minister|E] responsável pela construção e desenvolvimento em todo o [realm|E], podendo iniciar [great_projects|E].\n\n$minister_of_works_action_breakdown$"
 game_concept_minister_of_works_possessive:0 "$minister_works_possessive$"
 game_concept_minister_possessive:0 "do Ministro"
 game_concept_ministers:0 "Ministros"
 game_concept_ministers_possessive:0 "dos Ministros"
 game_concept_ministries:0 "Ministérios"
 game_concept_ministries_possessive:0 "dos Ministérios"
 game_concept_ministry:0 "Ministério"
 game_concept_ministry_desc:0 "O $game_concept_ministry$ é um tipo de [council|E] disponível apenas para o [son_of_heaven|E].\n\nHá nove [ministers|E], cada um representando o mais alto nível de governo e liderando seu próprio departamento. Eles são organizados em uma hierarquia, permitindo que um Ministro de nível inferior seja promovido para um cargo de nível superior, baseado no [appointment_prominence|E] do [title|E].\n\nOs $game_concept_ministers$ são:\n$EFFECT_LIST_BULLET$[minister_grand_chancellor|E]\n$EFFECT_LIST_BULLET$[minister_censor|E]\n$EFFECT_LIST_BULLET$[minister_grand_marshal|E]\n$EFFECT_LIST_BULLET$[minister_of_personnel|E]\n$EFFECT_LIST_BULLET$[minister_of_war|E]\n$EFFECT_LIST_BULLET$[minister_of_revenue|E]\n$EFFECT_LIST_BULLET$[minister_of_justice|E]\n$EFFECT_LIST_BULLET$[minister_of_rites|E]\n$EFFECT_LIST_BULLET$[minister_of_works|E]"
 game_concept_ministry_obligation:0 "Obrigação do Ministério"
 game_concept_ministry_obligations:0 "Obrigações do Ministério"
 game_concept_ministry_obligations_desc:0 "$game_concept_ministry_obligations$ é um conjunto único de [vassal_obligations|E] disponível apenas para [ministers|E].\n\nTodos os ministros civis têm um conjunto específico de opções como padrão, enquanto o [minister_grand_marshal|E] possui uma opção única que fornece [title_men_at_arms|E] ao Marechal.\n\nEssas obrigações não podem ser alteradas."
 game_concept_ministry_possessive:0 "do Ministério"
 game_concept_movement:0 "Movimento"
 game_concept_movement_desc:0 "Grupo de [characters|E] com interesses e visão compartilhados sobre o [dynastic_cycle|E]. Cada membro do Movimento pode ter acesso a diferentes [interactions|E] e [decisions|E] para influenciar o ciclo. Um [movement_leader|E] é um porta-voz que representa os interesses do [movement_possessive|E] junto ao [son_of_heaven|E]."
 game_concept_movement_leader:0 "Líder do Movimento"
 game_concept_movement_leader_desc:0 "Um personagem que lidera o [movement|E], delegado como o único membro permitido a falar diretamente com o [son_of_heaven|E] para avançar a agenda dos [movements|E] usando o [GetDecision('movement_petition_decision').GetName] [decision|E].\n\n#help Para se tornar líder, você deve ter a maior quantidade de [movement_power_i][movement_power|E] na morte do líder anterior ou derrotar o líder atual em [GetActivityType('activity_debate').GetName] [activity|E].#!"
 game_concept_movement_leader_possessive:0 "do Líder do Movimento"
 game_concept_movement_leader_short:0 "Líder"
 game_concept_movement_leaders:0 "Líderes do Movimento"
 game_concept_movement_leaders_possessive:0 "dos Líderes do Movimento"
 game_concept_movement_possessive:0 "do Movimento"
 game_concept_movement_power:0 "Poder do Movimento"
 game_concept_movement_power_desc:0 "O Poder do Movimento representa a influência política de um grupo envolvido no [dynastic_cycle|E]. É a soma do [personal_movement_power|E] de todos os membros do grupo.\n\n#V [movement_power_i|E][EmptyScope.ScriptValue('extremely_high_movement_power_value')]#! desbloqueia a [interaction|E] $dismiss_strong_hook_interaction$, [interaction|E] $request_raid_remit_interaction$ e o [scheme|E] [GetScheme('raid_estate').GetTypeName]\n\n#help O poder é derivado de:\n$BULLET_WITH_TAB$[merit_i][merit_level|E]\n$BULLET_WITH_TAB$[influence_i][influence_level|E]\n$BULLET_WITH_TAB$Idade\n$BULLET_WITH_TAB$[movement_power|E] de [disciples|E]\n$BULLET_WITH_TAB$Força Militar Atual #weak (menos importante em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName])#!\n$BULLET_WITH_TAB$[trait_level_track_xp|E] da [GetTrait('confucian_education').GetName( GetNullCharacter )] #weak (menos importante em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!\n$BULLET_WITH_TAB$[trait_level_track_xp|E] do [GetTrait('governor').GetName( GetNullCharacter )] #weak (menos importante em [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName])#!#!"
 game_concept_movement_power_i:0 "@movement_power_icon!"
 game_concept_movement_power_short:0 "Poder"
 game_concept_movements:0 "Movimentos"
 game_concept_movements_possessive:0 "dos Movimentos"
 game_concept_natural_disaster:0 "Desastre Natural"
 game_concept_natural_disasters:0 "Desastres Naturais"
 game_concept_palace_examination:0 "Exame do Palácio"
 game_concept_palace_examination_desc:0 "O quarto e último nível de [imperial_examinations|E]. Os [EmptyScope.ScriptValue('metropolitan_exam_final_entrants_loc')] finalistas do [GetActivityType('activity_imperial_examination').GetName] são convidados a um banquete no palácio real, para se prostrarem e mostrar seu valor ao [son_of_heaven|E].\n\n#S Quando aprovado:#!\n[GetModifier('tgp_passed_palace_exam_modifier').GetDescWithEffects]."
 game_concept_palace_examination_i:0 "@palace_exam_icon"
 game_concept_personal_movement_power:0 "Poder Pessoal do Movimento"
 game_concept_personal_movement_power_desc:0 "$game_concept_personal_movement_power$ é quanto um membro aumenta o [movement_power_short|E] total de seu [movement|E]"
 game_concept_personal_movement_power_short:0 "Poder"
 game_concept_provincial_examination:0 "Exame Provincial"
 game_concept_provincial_examination_desc:0 "O segundo nível de [imperial_examinations|E], realizado através da [activity|E] [GetActivityType('activity_local_examination').GetName].\n\n#S Quando aprovado:#!\n[GetModifier('tgp_passed_provincial_exam_modifier').GetDescWithEffects]."
 game_concept_provincial_examination_i:0 "@provincial_exam_icon"
 game_concept_seal_of_investiture:0 "Selo de Investidura"
 game_concept_seal_of_investiture_desc:0 "Simultaneamente um documento legal e um símbolo reverenciado da graça do Filho do Céu, o $game_concept_seal_of_investiture$ indica o status especial do titular como um [tributary|E] leal e favorecido de [SelectLocalization(GetPlayer.IsValid, 'game_concept_seal_of_investiture_desc_ingame', 'h_china')].\n\nUm $game_concept_seal_of_investiture$ pode ser concedido a $game_concept_tributaries$ com alto [imperial_grace|E] durante as cerimônias de encerramento de uma #bold Missão de Tributo#! bem-sucedida."
 game_concept_seal_of_investiture_desc_ingame:0 "[GetTitleByKey('h_china').GetDefinitiveName]"
 game_concept_situation_dynastic_cycle_phase:0 "Era do Ciclo Dinástico"
 game_concept_situation_dynastic_cycle_phase_desc:0 "O estado sociopolítico do [dynastic_cycle|E].\n\nEras:\n$BULLET$[dynastic_cycle_era_type_stable|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName], [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName]\n$BULLET$[dynastic_cycle_era_type_unstable|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_instability').GetName]\n$BULLET$[dynastic_cycle_era_type_chaotic|E]: [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_chaos').GetName]"
 game_concept_situation_dynastic_cycle_phases:0 "Eras do Ciclo Dinástico"
 game_concept_son_of_heaven:0 "Filho do Céu"
 game_concept_son_of_heaven_desc:0 "O $game_concept_son_of_heaven$ é o [hegemon|E] da China e o [top_liege|E] do [celestial_government|E].\n\nO $game_concept_son_of_heaven$ possui uma forma especial de [legitimacy|E], o [mandate_of_heaven|E], e um [situation_participant_group|E] único chamado simplesmente de $game_concept_son_of_heaven$."
 game_concept_son_of_heaven_possessive:0 "Do Filho do Céu"
 game_concept_subject_standing:0 "Status do Subdito"
 game_concept_subject_standing_desc:0 "O $game_concept_subject_standing$ representa o status concedido a um [tributary|E] ou [vassal|E] por seu [suzerain|E] ou [liege|E]."
 game_concept_treasury:0 "Tesouraria"
 game_concept_treasury_budget:0 "Orçamento da Tesouraria"
 game_concept_treasury_budget_base_rate:0 "Taxa Base do Orçamento"
 game_concept_treasury_budget_base_rate_desc:0 "O valor que um beneficiário padrão de uma [treasury_budget_category|E] recebe. Os beneficiários podem receber mais ou menos que a taxa base dependendo de seu [title_rank|E], [merit_level|E] ou outros modificadores."
 game_concept_treasury_budget_base_rate_short:0 "Taxa Base"
 game_concept_treasury_budget_capacity:0 "Capacidade Orçamentária"
 game_concept_treasury_budget_capacity_desc:0 "O montante mensal de [treasury|E] disponível para [treasury_budgeting|E]. Consiste na receita da tesouraria menos quaisquer despesas regulares que não são gerenciadas pelo orçamento, como [treasury_vassal_development|E] e [court_amenities|E]."
 game_concept_treasury_budget_category:0 "Categoria Orçamentária"
 game_concept_treasury_budget_category_desc:0 "Uma parte distinta de [treasury_budgeting|E] que pode receber alocação de orçamento. Cada categoria orçamentária pode ter diferentes beneficiários, e pode pagar em [gold|E] em vez de [treasury|E]."
 game_concept_treasury_budget_category_trend:0 "Tendência da Categoria Orçamentária"
 game_concept_treasury_budget_category_trend_desc:0 "A diferença em [treasury|E] que uma [treasury_budget_category|E] receberá em comparação com a vigência do orçamento anterior."
 game_concept_treasury_budget_category_trend_short:0 "Tendência"
 game_concept_treasury_budget_deficit:0 "Déficit do Orçamento da Tesouraria"
 game_concept_treasury_budget_deficit_desc:0 "Quando se gasta mais que a [treasury_budget_capacity|E], um valor será subtraído da receita mensal de [treasury|E]."
 game_concept_treasury_budget_deficit_short:0 "Déficit"
 game_concept_treasury_budget_unallocated:0 "Orçamento da Tesouraria Não Alocado"
 game_concept_treasury_budget_unallocated_desc:0 "Qualquer orçamento de tesouraria não alocado contribuirá para a receita geral de [treasury]."
 game_concept_treasury_budget_unallocated_short:0 "Não Alocado"
 game_concept_treasury_budgeting:0 "Orçamentação da Tesouraria"
 game_concept_treasury_budgeting_desc:0 "Um sistema responsável por distribuir fundos centrais para [vassals|E] específicos e sub-vassalos em taxas de alocação definidas.\n\nQuando um orçamento é estabelecido, uma [treasury_budget_base_rate|E] por vassalo é calculada para cada [treasury_budget_category|E] com base na [treasury_budget_capacity|E] disponível.\n\n@alert_icon! A taxa base calculada #bold não será alterada#! até que um novo orçamento seja estabelecido no futuro! Portanto, se houver mais beneficiários, seus custos orçamentários aumentarão."
 game_concept_treasury_desc:0 "Em certos [administrative_governments|E], a Tesouraria representa recursos que podem ser usados apenas para fins governamentais, em contraste com seu [gold|E] pessoal.\n\n$BULLET$#indent_newline:2 Como [vassal|E], você receberá Tesouraria do seu [liege|E], baseado em suas contribuições de [tax|E] e outras obrigações#!\n$BULLET$#indent_newline:2 A Tesouraria é criada pelo [top_liege|E], que converte uma porcentagem da receita de [taxation|E] em Tesouraria#!\n$BULLET$#indent_newline:2 Você pode transferir [gold|E] para a Tesouraria à vontade#!\n$BULLET$#indent_newline:2 A Tesouraria permanece com o [title|E] se ele ganhar um novo [holder|E]#!"
 game_concept_treasury_i:0 "@treasury_icon!"
 game_concept_treasury_military_budget:0 "Orçamento Militar"
 game_concept_treasury_military_budget_desc:0 "Tesouraria enviada a [vassals|E] de [province|E] militar pelo governo central, para financiar atividades militares adicionais. Baseia-se na alocação periódica da receita de [treasury|E] do [top_liege|E]."
 game_concept_treasury_military_budget_short:0 "Militar"
 game_concept_treasury_ministry_budget:0 "Orçamento do Ministério"
 game_concept_treasury_ministry_budget_desc:0 "Tesouraria enviada aos [vassals|E] pelo governo central, para financiar [ministries|E]. Baseia-se na alocação periódica da receita de [treasury|E] do [top_liege|E]."
 game_concept_treasury_ministry_budget_short:0 "Ministério"
 game_concept_treasury_salary_budget:0 "Orçamento Salarial"
 game_concept_treasury_salary_budget_desc:0 "Tesouraria enviada aos [vassals|E] pelo governo central, que recebem como [gold|E] para uso como salário pessoal. Baseia-se na alocação periódica da receita de [treasury|E] do [top_liege|E]."
 game_concept_treasury_salary_budget_short:0 "Salário"
 game_concept_treasury_vassal_development:0 "Desenvolvimento do Vassalo"
