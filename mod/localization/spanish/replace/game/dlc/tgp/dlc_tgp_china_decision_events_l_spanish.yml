l_spanish:
 exam_success_chance.tgp_local_exam_impressed_examiner:0 "Examinador impressionado"
 exam_success_chance.tgp_local_exam_initial_success:0 "Início forte na prova"
 exam_success_chance.tgp_local_exam_strong_finish:0 "Final forte na prova"
 examiner_takes_bribes_tt:0 "Você recebe esta opção por causa das características do examinador"
 msg_provincial_exam_close_family_failed_desc:0 "[ROOT.Char.GetShortUIName|U] tentou e não conseguiu se provar no exame de nível inferior em [ROOT.Char.GetCurrentLocation.GetName]"
 msg_provincial_exam_close_family_passed_desc:0 "[ROOT.Char.GetShortUIName|U] completou com sucesso o exame de nível inferior em [ROOT.Char.GetCurrentLocation.GetName]"
 provincial_exam_close_family_failed:0 "[GetPlayer.Custom2('RelationToMeShort', ROOT.Char)|U] Reprovou no Exame Provincial"
 provincial_exam_close_family_passed:0 "[GetPlayer.Custom2('RelationToMeShort', ROOT.Char)|U] Passou no Exame Provincial"
 tgp_china_decision.1000.a:0 "Darei o meu melhor!"
 tgp_china_decision.1000.b:0 "Farei apenas o necessário."
 tgp_china_decision.1000.desc_new:0 "Cheguei ao meu primeiro exame. A reputação da minha família depende das minhas conquistas aqui hoje. Nestes salões, verdadeiros mananciais de conhecimento, sinto como se meus ancestrais estivessem observando, esperando para ver o que se tornará de mim."
 tgp_china_decision.1000.desc_outro:0 "\n\n[Select_CString( examiner.IsFemale, 'A examinadora', 'O examinador' )] [examiner.GetTitledFirstName] me pedirá para recitar trechos dos clássicos. Ensaiar esses textos até ver seus sinais de olhos fechados foi exaustivo.\n\nFinalmente, chega a minha vez de me aproximar do púlpito."
 tgp_china_decision.1000.desc_returning:0 "Mais uma vez estou no salão de estudos local, aguardando o julgamento dos astutos estudiosos do reino. Neste impressionante salão, o peso de cada pergaminho e de cada fragmento de conhecimento contido nele pesa sobre meus ombros."
 tgp_china_decision.1000.t:0 "Exame Infantil: Início"
 tgp_china_decision.1001.a:0 "Preciso acertar isto #EMP#!"
 tgp_china_decision.1001.b:0 "Não me esforçarei."
 tgp_china_decision.1001.desc_fail:0 "Meu rosto aquece ao perceber que perdi a passagem. Olho para o examinador e seu olhar severo me cala completamente."
 tgp_china_decision.1001.desc_outro:0 "\n\nO examinador imediatamente me apresenta outra passagem para enfrentar, sem me dar tempo para me recompor."
 tgp_china_decision.1001.desc_safe:0 "Olho para os meus pés, evitando até mesmo um olhar para o examinador com medo de perturbá-lo. Minha recitação é breve, apressando-me para esconder quaisquer erros."
 tgp_china_decision.1001.desc_success:0 "Uma calma se instala sobre mim enquanto recito cada palavra, pronunciando-as com perfeita clareza. Parece quase fácil."
 tgp_china_decision.1001.t_fail:0 "Exame Infantil: Fracasso!"
 tgp_china_decision.1001.t_success:0 "Exame Infantil: Sucesso!"
 tgp_china_decision.1002.a:0 "Tudo depende deste momento!"
 tgp_china_decision.1002.b:0 "Manter a calma..."
 tgp_china_decision.1002.desc_fail:0 "Minhas mãos suam enquanto começo a tropeçar nas palavras. Não consigo lembrar nem uma única frase! Quem ao menos pudesse me engolir o chão."
 tgp_china_decision.1002.desc_outro:0 "\n\nMais uma vez, não recebo descanso. O examinador fixa-me com seu olhar e pede a próxima seção."
 tgp_china_decision.1002.desc_safe:0 "Recito o mínimo possível para evitar erros desnecessários. Arriscando um olhar ao examinador, percebo que [examiner.GetSheHe] parece entediado com minha performance rígida."
 tgp_china_decision.1002.desc_success:0 "As palavras fluem livremente dos meus lábios, e por um momento acredito ver os cantos da boca do examinador se contraírem. Será que [examiner.GetSheHe] acabou de sorrir? Impossível!"
 tgp_china_decision.1002.t_fail:0 "Exame Infantil: Fracasso!"
 tgp_china_decision.1002.t_success:0 "Exame Infantil: Sucesso!"
 tgp_china_decision.1005.a:0 "Só desejo honrar meus pais."
 tgp_china_decision.1005.a_failure:0 "Voltarei."
 tgp_china_decision.1005.a_success:0 "Me esforçarei mais na próxima vez."
 tgp_china_decision.1005.b:0 "Meus excelentes professores merecem todo o crédito!"
 tgp_china_decision.1005.b_failed:0 "Que humilhação."
 tgp_china_decision.1005.b_passing:0 "Estou satisfeito com este resultado."
 tgp_china_decision.1005.desc.failing:0 "reprovado no exame."
 tgp_china_decision.1005.desc.failure:0 "ânimo baixo."
 tgp_china_decision.1005.desc.good_score:0 "obti uma boa pontuação no exame!"
 tgp_china_decision.1005.desc.high_score:0 "obti uma pontuação extremamente alta no exame! Minha família ficará orgulhosa."
 tgp_china_decision.1005.desc.passing_score:0 "aprovado no exame."
 tgp_china_decision.1005.desc.safe:0 "um suspiro de alívio."
 tgp_china_decision.1005.desc.segway:0 "\n\nAo me recolocar na fila dos candidatos, percebo que todas as outras crianças ao meu redor são estranhas. Ter visto ao menos um rosto familiar teria tornado a espera pelo veredicto mais suportável. \n\nMais tarde, o resultado é divulgado e corro até o quadro de avisos para ver que eu"
 tgp_china_decision.1005.desc.success:0 "alto ânimo."
 tgp_china_decision.1005.desc:0 "Concluo o exame com "
 tgp_china_decision.1005.t:0 "Liberação do Resultado"
