l_spanish:
 tgp_child_personality.0002.a:0 "Como ousa ele voltar os olhos para nós!"
 tgp_child_personality.0002.b:0 "Podemos dar um pouco de água ao pobre homem?"
 tgp_child_personality.0002.c:0 "Água? Ele pode pegar um punhado desta lama!"
 tgp_child_personality.0002.guardian:0 "Voltando para casa de um passeio com m[Select_CString( guardian.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guardian'))] [guardian.GetTitledFirstName], vejo um homem frenético cujas vestes se degradaram de maneira chocante a um estado mal melhor do que trapos.\n\nOlhos sombreados pela exaustão e rosto magro pela privação, o homem implora desesperadamente por água aos transeuntes. Ao nos ver, ele cambaleia em minha direção, mãos estendidas em um pedido de ajuda."
 tgp_child_personality.0002.no_guardian:0 "Voltando para casa de um passeio, vejo um homem frenético cujas vestes se degradaram de maneira chocante a um estado mal melhor do que trapos.\n\nOlhos sombreados pela exaustão e rosto magro pela privação, o homem implora desesperadamente por água aos transeuntes. Ao nos ver, ele cambaleia em minha direção, mãos estendidas em um pedido de ajuda."
 tgp_child_personality.0002.t:0 "Circunstâncias Diminutas"
 tgp_child_personality.0003.a:0 "Se eu corrigir [guardian.GetSheHe], eles não ficarão mais felizes."
 tgp_child_personality.0003.b:0 "É mais importante ser honesto do que ser elogiado."
 tgp_child_personality.0003.c:0 "Devo corrigir [guardian.GetSheHe] em particular para poupar a sua face."
 tgp_child_personality.0003.desc:0 "[guardian.GetFullName] está elogiando orgulhosamente o progresso que fiz na compreensão do [ROOT.Char.GetFaith.ReligiousText] para vários de seus assistentes, recitando capítulo após capítulo que memorize – incluindo alguns que definitivamente não memorize!\n\nSinto meu rosto aquecer sob seus olhares aprovadores, culpa e prazer disputando a posse da minha consciência."
 tgp_child_personality.0003.t:0 "Honra Imerecida"
 tgp_child_personality.0004.a:0 "Talvez eles possam usar minha ajuda!"
 tgp_child_personality.0004.b:0 "Posso estudar até [guardian.GetSheHe] chegar!"
 tgp_child_personality.0004.c:0 "[guardian.GetSheHe|U] chegará eventualmente; devo ser paciente."
 tgp_child_personality.0004.desc:0 "A hora das minhas lições diárias passou, e outra depois dela, e [guardian.GetFullName] ainda não apareceu.\n\nEspiando pela janela, vejo os servos se movimentando com energia, enquanto é muito entediante esperar aqui."
 tgp_child_personality.0004.t:0 "Instrução Ausente"
 tgp_child_personality.0007.a:0 "Isto é flagrante injustiça!"
 tgp_child_personality.0007.b:0 "A vida raramente é justa para os humildes."
 tgp_child_personality.0007.c:0 "Talvez todos devêssemos moderar nossas refeições."
 tgp_child_personality.0007.desc:0 "Tendo me esgueirado sem ser notado para os aposentos dos servos para ver o que fazem, não posso deixar de notar que as porções destinadas aos mais antigos entre eles sempre parecem muito maiores do que as entregues aos inferiores.\n\nA desigualdade é óbvia, mas os servos parecem aceitá-la como justa sem reclamar."
 tgp_child_personality.0007.t:0 "Porções Desiguais"
 tgp_child_personality.0009.a:0 "Se for um monstro, eu o matarei!"
 tgp_child_personality.0009.b:0 "Provavelmente é só um dos servos."
 tgp_child_personality.0009.c:0 "O que o [ROOT.Char.GetFaith.ReligiousText] diz sobre o medo?"
 tgp_child_personality.0009.desc:0 "Acordo sobressaltado na hora do tigre, um forte tilintar e sussurro vindo da escuridão logo fora da janela do meu quarto.\n\nHá algo lá fora, e está se movendo!\n\nMinha mente percorre possibilidades, cada uma mais sinistra e terrível que a anterior."
 tgp_child_personality.0009.t:0 "Ruídos Noturnos"
 tgp_child_personality.0010.a:0 "Eu vou superar [guardian.GetSheHe]!"
 tgp_child_personality.0010.b:0 "Um dia, serei eu quem fará os outros se sentirem pequenos."
 tgp_child_personality.0010.c:0 "Será que eles realmente querem que eu tenha sucesso?"
 tgp_child_personality.0010.desc:0 "É o mesmo refrão em toda lição, todas as vezes — é sempre \"[guardian.GetTitledFirstName] aprendeu isto em metade do tempo na juventude!\" ou \"Deve esperar ser tão bom quanto [guardian.GetTitledFirstName] quando crescer.\"\n\nTudo o que faço, por melhor que seja, é constantemente medido pelas conquistas de outra pessoa."
 tgp_child_personality.0010.t:0 "O Fardo das Expectativas"
 tgp_child_personality.102.arrogant:0 "\n\n\"Como ousa dirigir os olhos a nós!\" [child.GetFirstNameNoTooltip] explode indignado, chocado com a audácia desesperada do homem."
 tgp_child_personality.102.arrogant_change:0 "Ignore pessoas como ele, são indignas de sua atenção."
 tgp_child_personality.102.callous:0 "\n\nEm resposta ao seu pedido, [child.GetFirstNameNoTooltip] casualmente pega um punhado de lama e joga em seu rosto, rindo enquanto ele recua surpreso e humilhado."
 tgp_child_personality.102.callous_change:0 "O sofrimento alheio não é da nossa conta."
 tgp_child_personality.102.compassionate:0 "\n\nComovido pelo sofrimento do homem, [child.GetFirstNameNoTooltip] puxa minha manga e olha para cima com os olhos arregalados de compaixão inocente. \"Podemos dar um pouco de água ao pobre homem?\" pergunta [child.GetSheHe]."
 tgp_child_personality.102.compassionate_change:0 "Imagine como seria se você estivesse em seu lugar."
 tgp_child_personality.102.confirm_arrogant:0 "Muito bem. Pessoas como ele não merecem sua consideração."
 tgp_child_personality.102.confirm_callous:0 "O sofrimento alheio não é da nossa conta."
 tgp_child_personality.102.confirm_compassionate:0 "Claro que podemos; estou orgulhoso da sua empatia."
 tgp_child_personality.102.desc:0 "Retornando de um passeio com [Select_CString( child.IsFemale, 'a', 'o' )] [child.GetTitledFirstName], nos deparamos com um homem empobrecido pedindo água a quem lhe conceder auxílio."
 tgp_child_personality.1021.t:0 "Circunstâncias Diminutas"
 tgp_child_personality.103.confirm_deceitful:0 "Nunca se interponha a algo que te beneficie."
 tgp_child_personality.103.confirm_honest:0 "A honestidade é admirável, ainda mais quando feita às próprias custas."
 tgp_child_personality.103.confirm_humble:0 "Fico contente que seu primeiro pensamento tenha sido pela minha reputação."
 tgp_child_personality.103.deceitful:0 "\n\nMesmo sabendo da inverdade de minhas palavras, [child.GetFirstNameNoTooltip] continua a se deleitar nos elogios por conquistas não merecidas."
 tgp_child_personality.103.deceitful_change:0 "$tgp_child_personality.103.confirm_deceitful$"
 tgp_child_personality.103.desc:0 "Ao discutir o progresso de [child.GetFirstName] no estudo do [child.GetFaith.ReligiousText], elogie com orgulho seu domínio de vários capítulos cada vez mais difíceis.\n\nSó depois, revisando os resultados dos estudos mais recentes [child.GetHerHim], percebo que no meu entusiasmo posso ter exagerado seu entendimento deles."
 tgp_child_personality.103.honest:0 "\n\nAntes que eu possa dizer algo, [child.GetFirstNameNoTooltip] me encara com firmeza. \"Você disse aos outros que eu dominei esses capítulos, mas eu mal comecei a aprendê-los.\""
 tgp_child_personality.103.honest_change:0 "Você não deve permitir que uma mentira passe sem correção."
 tgp_child_personality.103.humble:0 "\n\nAo perceber a expressão em meu rosto, [child.GetFirstNameNoTooltip] diz suavemente: \"Eu sei, me desculpe — não queria que você ficasse mal.\""
 tgp_child_personality.103.humble_change:0 "Não aspire a mais do que aquilo que você conquistou."
 tgp_child_personality.1031.t:0 "Honra Não Merecida"
 tgp_child_personality.104.confirm_diligent:0 "A iniciativa que demonstrou será útil para você."
 tgp_child_personality.104.confirm_generous:0 "Sua consideração pelos outros é admirável."
 tgp_child_personality.104.confirm_patient:0 "Fico contente com a paciência que demonstrou."
 tgp_child_personality.104.desc:0 "As tarefas que o chefe de uma casa deve cuidar são infinitas, e hoje minhas responsabilidades impediram-me de supervisionar a lição diária de [child.GetFirstNamePossessive]."
 tgp_child_personality.104.diligent:0 "\n\nRetornando no final da tarde, encontro [child.GetFirstNameNoTooltip] em sua mesa, profundamente concentrado nos estudos. Assustado com meus passos, [child.GetSheHe] olha para mim e sorri orgulhoso. \"Você chegou! Olhe quanto eu fiz!\""
 tgp_child_personality.104.diligent_change:0 "Se tem tempo de sobra, dedique-o aos estudos."
 tgp_child_personality.104.generous:0 "\n\nNa minha ausência, percebo que, ao invés de simplesmente passar o dia ocioso, [child.GetFirstNameNoTooltip] se movimenta energeticamente, oferecendo ajuda aos servos com suas tarefas diárias; uma generosidade devidamente recusada por todos, é claro."
 tgp_child_personality.104.generous_change:0 "Havia outros que poderiam ter usado suas mãos ociosas."
 tgp_child_personality.104.patient:0 "\n\nRetornando muito mais tarde do que o previsto, encontro [child.GetFirstNameNoTooltip] sentado tranquilamente. Levantando-se, [child.GetSheHe] me cumprimenta calorosamente. \"Esperei você o dia todo em silêncio! Fui bem?\""
 tgp_child_personality.104.patient_change:0 "Você se saiu bem, mas teria sido melhor se tivesse esperado por mim."
 tgp_child_personality.1041.t:0 "Ausência de Instrução"
 tgp_child_personality.107.confirm_cynical:0 "O mundo é desigual, e você não deve esperar que seja diferente."
 tgp_child_personality.107.confirm_just:0 "Você está certo, devemos corrigir essa situação."
 tgp_child_personality.107.confirm_temperate:0 "Há sabedoria na moderação, de fato."
 tgp_child_personality.107.cynical:0 "\n\nApesar das perguntas de [child.GetFirstNamePossessiveNoTooltip|U], [child.GetSheHe] parece indiferente ao estado geral das coisas, quase como se estivesse mais interessado em confirmar alguma conclusão que já havia chegado internamente."
 tgp_child_personality.107.cynical_change:0 "$tgp_child_personality.107.confirm_cynical$"
 tgp_child_personality.107.desc:0 "Após responder a uma enxurrada de perguntas confusas de [child.GetFirstName], consegui chegar à raiz do problema; [child.GetSheHe] percebeu que alguns de nossos servos se alimentam muito melhor do que outros."
 tgp_child_personality.107.just:0 "\n\n[child.GetFirstNameNoTooltip|U] parece profundamente perturbado com isso e exige uma explicação sobre a origem dessa óbvia desigualdade."
 tgp_child_personality.107.just_change:0 "Você não deve aceitar a desigualdade apenas porque outros aceitam."
 tgp_child_personality.107.temperate:0 "\n\nApós alguma reflexão, [child.GetFirstNameNoTooltip|U] concluiu que o melhor seria que todos moderássemos nossos apetites."
 tgp_child_personality.107.temperate_change:0 "$tgp_child_personality.107.confirm_temperate$"
 tgp_child_personality.1071.t:0 "Porções Desiguais"
 tgp_child_personality.109.brave:0 "\n\nA história toma um rumo cômico, entretanto, quando explicam que [child.GetFirstName], acordado pelo distúrbio, atacou o servo embriagado com uma espada de madeira e fez com que esse “monstro” fugisse para a escuridão."
 tgp_child_personality.109.brave_change:0 "Só a ação teria salvo [child.GetSheHe], caso a ameaça fosse real."
 tgp_child_personality.109.calm:0 "\n\nEmbora o distúrbio noturno tenha acordado [child.GetFirstName] na hora do tigre, parece não ter causado nenhum efeito negativo no jovem, que permaneceu impassível diante da atividade incomum fora de sua janela."
 tgp_child_personality.109.calm_change:0 "$tgp_child_personality.109.confirm_calm$"
 tgp_child_personality.109.confirm_brave:0 "É nas horas mais sombrias que nos encontramos."
 tgp_child_personality.109.confirm_calm:0 "A mente sã não se abala com os ruídos da noite."
 tgp_child_personality.109.confirm_zealous:0 "Deve-se seguir o [child.GetFaith.ReligiousText] também à luz do dia."
 tgp_child_personality.109.desc:0 "Sou acordado nas primeiras horas da manhã por um dos servos com uma história para contar.\n\nParece que outro deles havia bebido demais na noite anterior e, ao tentar voltar para seus aposentos, acabou se sujando do lado de fora do quarto de [child.GetFirstNamePossessive]."
 tgp_child_personality.109.zealous:0 "\n\nMais tarde, ao verificar [child.GetFirstName], os servos encontraram [child.GetSheHe] recitando versos do [child.GetFaith.ReligiousText] para manter a compostura."
 tgp_child_personality.109.zealous_change:0 "$tgp_child_personality.109.confirm_zealous$"
 tgp_child_personality.1091.t:0 "Ruídos Noturnos"
 tgp_child_personality.110.ambitious:0 "\n\nOs resultados falam por si; [child.GetSheHe] redobrou seus esforços, proclamando a intenção de superar minhas conquistas, e posso ver claramente essa determinação refletida nos estudos [child.GetHerHim]."
 tgp_child_personality.110.ambitious_change:0 "Você não deve permitir que nada se interponha entre você e seus objetivos."
 tgp_child_personality.110.confirm_ambitious:0 "Não permita que nada se interponha entre você e seus objetivos."
 tgp_child_personality.110.confirm_paranoid:0 "Questione tudo, principalmente aqueles em quem você confia."
 tgp_child_personality.110.confirm_sadistic:0 "Às vezes, a caprichosa crueldade serve melhor do que a virtude."
 tgp_child_personality.110.desc:0 "As crianças aprendem melhor imitando os adultos ao seu redor, um princípio que os tutores de [child.GetFirstNamePossessive] e nossos servos abraçaram de todo coração, usando-me como um exemplo para motivar e guiar o desenvolvimento [child.GetHerHim]."
 tgp_child_personality.110.paranoid:0 "\n\nDe forma um tanto preocupante, isso pode ter passado a mensagem errada [Select_CString( child.IsFemale, 'a', 'ao' )] [child.GetFirstNameNoTooltip], pois agora frequentemente vejo uma sombra de dúvida refletida em seu jovem rosto."
 tgp_child_personality.110.paranoid_change:0 "$tgp_child_personality.110.confirm_paranoid$"
 tgp_child_personality.110.sadistic:0 "\n\nEm vez de se inspirar, porém, agora vejo [child.GetSheHe] começando a descontar suas frustrações nos servos. Suspeito que, em vez disso, fizemos [child.GetSheHe] ficar demasiadamente ciente de suas próprias inadequações."
 tgp_child_personality.110.sadistic_change:0 "$tgp_child_personality.110.confirm_sadistic$"
 tgp_child_personality.1101.t:0 "O Fardo das Expectativas"
 tgp_child_personality.7000.a:0 "Aproveitarei para estudar ainda mais!"
 tgp_child_personality.7000.b:0 "Posso ir ver meus amigos?"
 tgp_child_personality.7000.c:0 "Devo descansar e passar o dia em quietude."
 tgp_child_personality.7000.desc:0 "Estou esperando o início da minha aula de caligrafia quando [Select_CString( guardian.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('guardian'))] entra no quarto com passos deliberados e uma expressão enigmática.\n\n\"Surgiu um imprevisto, e teremos que cancelar as aulas de hoje\", diz [guardian.GetSheHe] firmemente. \"O que gostaria de fazer em vez disso?\"\n\nO olhar de expectativa no rosto [guardian.GetHerHim] sugere que esta é o tipo de pergunta que tem uma resposta errada."
 tgp_child_personality.7000.t:0 "Agenda Livre"
 tgp_child_personality.7001.change.diligent:0 "A autodisciplina lhe servirá melhor. Pratique-a."
 tgp_child_personality.7001.change.gregarious:0 "Não negligencie seus laços com os outros por causa dos estudos."
 tgp_child_personality.7001.change.temperate:0 "Descanse enquanto pode; você não sabe o que o amanhã trará."
 tgp_child_personality.7001.desc:0 "O desenvolvimento da mente de uma criança pode ser enganosamente complexo e difícil de medir, e é somente através de uma investigação cuidadosa que ele pode ser guiado pelos caminhos corretos.\n\nAnunciando o cancelamento inesperado das lições de hoje, coloco [child.GetFirstName] à prova para ver como [child.GetSheHe] escolheria passar o dia, na ausência de orientação."
 tgp_child_personality.7001.diligent:0 "Excelente escolha; tal autodisciplina lhe servirá bem."
 tgp_child_personality.7001.gregarious:0 "As conexões que você faz agora lhe beneficiarão por toda a vida."
 tgp_child_personality.7001.t:0 "Agenda Livre"
 tgp_child_personality.7001.temperate:0 "Ao conhecer suas próprias limitações, você se domina."
 tgp_child_personality.7010.a:0 "Como puderam interpretar o [ROOT.Char.GetFaith.ReligiousText] tão errado!?"
 tgp_child_personality.7010.b:0 "Se os adultos são tão tolos, vou me dar bem na vida."
 tgp_child_personality.7010.c:0 "Mal posso esperar para ver essa ignorância exposta!"
 tgp_child_personality.7010.desc:0 "Estou prestes a entrar no salão para prestar minhas reverências diárias quando ouço vozes lá dentro.\n\nCom a mão pairando indecisa na porta, escuto uma das vozes invocar uma citação do [ROOT.Char.GetFaith.ReligiousText] — uma que me valeu elogios pela sutileza com que a entendo — mas agora a ouço sendo usada tão completamente errado que mal consigo acreditar."
 tgp_child_personality.7010.t:0 "Palavras Torcidas"
 tgp_child_personality.7011.ambitious:0 "Use as falhas dos outros como oportunidades para si."
 tgp_child_personality.7011.change.ambitious:0 "$tgp_child_personality.7011.ambitious$"
 tgp_child_personality.7011.change.sadistic:0 "$tgp_child_personality.7011.sadistic$"
 tgp_child_personality.7011.change.zealous:0 "Seu próprio entendimento dos ritos é o que mais importa."
 tgp_child_personality.7011.desc:0 "Enquanto recebíamos visitantes, surgiu o tema do [child.GetFaith.ReligiousText], e uma discussão vigorosa se seguiu, mais caracterizada pela paixão pelo assunto do que pelo conhecimento sobre ele."
 tgp_child_personality.7011.sadistic:0 "Ao expor a ignorância de outro, você enfraquece sua posição."
 tgp_child_personality.7011.t:0 "Palavras Distorcidas"
 tgp_child_personality.7011.zealous:0 "Seu comprometimento com os ritos é louvável."
 tgp_child_personality.7020.a:0 "Não gosto de estranhos: hora de ir!"
 tgp_child_personality.7020.b:0 "O olhar nos olhos deles; não podemos confiar."
 tgp_child_personality.7020.c:0 "E se eles tiverem armas? Podem nos machucar!"
 tgp_child_personality.7020.desc:0 "Passando perto da entrada de nossa casa, ouço vozes desconhecidas, e uma rápida espiada na esquina revela rostos igualmente desconhecidos lá fora.\n\nUm deles se vira e nossos olhares se encontram, e ele começa a caminhar em minha direção; com o coração acelerado, apressadamente me escondo novamente à vista."
 tgp_child_personality.7020.t:0 "Intenções Desconhecidas"
 tgp_child_personality.7021.change.craven:0 "$tgp_child_personality.7021.craven$"
 tgp_child_personality.7021.change.paranoid:0 "$tgp_child_personality.7021.paranoid$"
 tgp_child_personality.7021.change.shy:0 "Cercar-se apenas daqueles a quem você é mais próximo."
 tgp_child_personality.7021.craven:0 "Confie em seus instintos; sentir perigo é estar prevenido."
 tgp_child_personality.7021.desc:0 "Hoje, [child.GetFirstName] encontrou um grupo de visitantes desconhecidos na entrada de nossa casa. Assustado com sua presença, [child.GetSheHe] fugiu rapidamente e não saiu de onde se escondeu até agora."
 tgp_child_personality.7021.paranoid:0 "A confiança é mais valiosa quando concedida a poucos."
 tgp_child_personality.7021.shy:0 "Você não precisa encontrar ninguém se não quiser."
 tgp_child_personality.7021.t:0 "Intenções Desconhecidas"
 tgp_child_personality.7030.a:0 "Só de assistir [clumsy_servant.GetSheHe] já fico cansado."
 tgp_child_personality.7030.b:0 "Vou dar uma mão - em troca de um petisco!"
 tgp_child_personality.7030.c:0 "Devo ajudar [clumsy_servant.GetSheHe] antes que [clumsy_servant.GetSheHe] derrube algo."
 tgp_child_personality.7030.desc:0 "Uma série de grunhidos tensos e gaguejantes me leva pelo corredor até a visão de um[Select_CString( clumsy_servant.IsFemale, 'uma de nossas', 'um de nossos' )] de nossos [clumsy_servant.GetWomenMen] servindo, cambaleando instavelmente sob o peso de vários pratos de comida precariously equilibrados, braços visivelmente trêmulos sob o fardo [clumsy_servant.GetHerHim].\n\nParece apenas uma questão de tempo, e não muito, antes que uma catástrofe desordenada ocorra."
 tgp_child_personality.7030.t:0 "Sobrecarregado"
 tgp_child_personality.7031.change.compassionate:0 "Ajude aqueles que precisam, sem esperar recompensa."
 tgp_child_personality.7031.change.gluttonous:0 "É o destino dos servos trabalhar; o seu, desfrutar dos frutos."
 tgp_child_personality.7031.change.lazy:0 "$tgp_child_personality.7031.lazy$"
 tgp_child_personality.7031.compassionate:0 "Observar outros lutando sem oferecer ajuda não seria virtuoso."
 tgp_child_personality.7031.desc:0 "Enquanto sigo em direção aos meus aposentos, vislumbro um servo cambaleando sob o peso de uma carga pesada, a caminho da cozinha. Perto dali, vejo [child.GetFirstName] e faço uma pausa para observar como [child.GetSheHe] reage à situação."
 tgp_child_personality.7031.gluttonous:0 "É justo que você seja recompensado por sua ajuda."
 tgp_child_personality.7031.lazy:0 "Preserve sua energia para o que realmente importa; deixe que outros carreguem os fardos."
 tgp_child_personality.7031.t:0 "Sobrecarregado"
 tgp_child_personality.7040.a:0 "Já está aberto, então não faz mal dar uma olhada."
 tgp_child_personality.7040.b:0 "Sinto que não deveria estar vendo isso."
 tgp_child_personality.7040.desc:0 "Procurando nas prateleiras um livro que me pediram para encontrar e recuperar, um leve toque o faz cair no chão, suas páginas se abrindo no processo.\n\nAjoelho-me para pegá-lo, e não consigo deixar de ser capturado pelos desenhos vívidos de figuras - homens e mulheres? - abraçando-se e entrelaçando-se em posições cada vez mais variadas.\n\nParece tão desconfortável, mas também... interessante?"
 tgp_child_personality.7040.t:0 "Uma Descoberta Inesperada"
 tgp_child_personality.7041.change.chaste:0 "$tgp_child_personality.7041.chaste$"
 tgp_child_personality.7041.change.lustful:0 "Vou levar o livro para o quarto [child.GetHerHim]."
 tgp_child_personality.7041.chaste:0 "Os dignos mantêm a moderação diante da tentação."
 tgp_child_personality.7041.desc:0 "Folheando a biblioteca da casa, noto um dos livros projetando-se da prateleira, como se tivesse sido apressadamente colocado no lugar. Um volume cheio de ilustrações bastante vívidas que chegou às minhas mãos, se não me engano."
 tgp_child_personality.7041.lustful:0 "A curiosidade em tais assuntos é inteiramente natural."
 tgp_child_personality.7041.t:0 "Uma Descoberta Inesperada"
 tgp_child_personality.7050.a:0 "Vou devolvê-la para que não se metem em problemas!"
 tgp_child_personality.7050.b:0 "Se eu esconder, pode ser meu próprio tesouro secreto!"
 tgp_child_personality.7050.c:0 "Eles vão sofrer por isso, e merecem."
 tgp_child_personality.7050.desc:0 "Estou procurando um dos meus livros quando o brilho de algo metálico e interessante chama minha atenção debaixo de uma mesa.\n\nParece uma pequena caixa de madeira laqueada, e acho que já vi uma igual no escritório do mestre. Alguém ficaria furioso se descobrisse que um servo a perdeu!"
 tgp_child_personality.7050.t:0 "Perdido e Achado"
 tgp_child_personality.7051.callous:0 "Deixe os tolos sofrerem as consequências de sua incompetência."
 tgp_child_personality.7051.change.callous:0 "Você deve deixar os tolos sofrerem as consequências de sua incompetência."
 tgp_child_personality.7051.change.greedy:0 "Olhe primeiro para seu próprio ganho; tome o que puder."
 tgp_child_personality.7051.change.just:0 "Comporte-se com retidão e nunca conhecerá o arrependimento."
 tgp_child_personality.7051.desc:0 "Instrui um dos servos a mover uma bela caixa lacada, entre outros objetos de valor, para outro cômodo durante a limpeza de alguns dias atrás, mas o atraso notável em seu retorno deixou claro que a caixa havia se perdido no processo."
 tgp_child_personality.7051.greedy:0 "A perda de outro pode muito bem ser seu ganho."
 tgp_child_personality.7051.just:0 "Sempre comporte-se como o fez neste momento."
 tgp_child_personality.7051.t:0 "Achados e Perdidos"
 tgp_child_personality.7060.a:0 "Ainda tenho muito a aprender."
 tgp_child_personality.7060.b:0 "Será que [sycophantic_servant.GetSheHe] está fazendo isso só para eu gostar [sycophantic_servant.GetHerHim]?"
 tgp_child_personality.7060.c:0 "Devo apenas me alegrar por estar sendo elogiado."
 tgp_child_personality.7060.desc:0 "Um dos servos parece empenhado em elogiar tudo o que faço recentemente para quem quiser ouvir, não importa quão menor seja o feito.\n\nÉ bom ser elogiado, mas começo a me perguntar se algumas dessas coisas realmente merecem a atenção que [sycophantic_servant.GetSheHe] está dando..."
 tgp_child_personality.7060.t:0 "Elogios Generosos"
 tgp_child_personality.7061.change.content:0 "$tgp_child_personality.7061.content$"
 tgp_child_personality.7061.change.cynical:0 "Seria mais prudente questionar os motivos dos outros, até mesmo os meus."
 tgp_child_personality.7061.change.humble:0 "Modere seu orgulho e lembre-se de seu lugar."
 tgp_child_personality.7061.content:0 "Honras e elogios são vazios; não os persiga."
 tgp_child_personality.7061.cynical:0 "Você é sábio por questionar os motivos dos outros."
 tgp_child_personality.7061.desc:0 "Os servos sabem como conquistar o favor de seus mestres, presentes e futuros, e seus elogios a [child.GetFirstName] têm sido extremamente efusivos ultimamente, talvez até excessivos."
 tgp_child_personality.7061.humble:0 "É bom que você modere seu orgulho."
 tgp_child_personality.7061.t:0 "Elogios Generosos"
 tgp_child_personality.7070.a:0 "Se fosse eu, não descansaria até me vingar dessa humilhação!"
 tgp_child_personality.7070.b:0 "Se [servant.GetSheHe] tivesse apenas mentido, não estaria em apuros."
 tgp_child_personality.7070.c:0 "Adultos ficam tão feios quando estão bravos."
 tgp_child_personality.7070.desc:0 "\"Incompetente!\"\n\nAs palavras trovejantes de [guardian.GetNamePossessive] ecoam por toda a casa.\n\n\"Imbécil inútil!\" Abrindo a porta do quarto [guardian.GetHerHim] apenas um pouco, vejo um dos servos prostrado diante [guardian.GetHerHim], tremendo diante da ira ruborizada [guardian.GetHerHim].\n\nNão sei o que aconteceu, mas pode realmente merecer tal castigo?"
 tgp_child_personality.7070.t:0 "Palavras Duríssimas"
 tgp_child_personality.7071.calm:0 "Aquele que permanece impassível está sempre em vantagem."
 tgp_child_personality.7071.change.calm:0 "Permaneça impassível e você estará sempre em vantagem."
 tgp_child_personality.7071.change.deceitful:0 "$tgp_child_personality.7071.deceitful$"
 tgp_child_personality.7071.change.vengeful:0 "$tgp_child_personality.7071.vengeful$"
 tgp_child_personality.7071.deceitful:0 "Ser honesto é virtuoso, mas às vezes também é tolo."
 tgp_child_personality.7071.desc:0 "Os servos frequentemente precisam ser lembrados de seu lugar, e quanto maior sua insolência ou incompetência, mais enérgico deve ser o lembrete. As crianças ainda não aprenderam essa lição, e [child.GetFirstName] parece perturbado após ouvir um desses lembretes."
 tgp_child_personality.7071.t:0 "Palavras Ásperas"
 tgp_child_personality.7071.vengeful:0 "Somente os fracos permitem-se ser afrontados assim."
 tgp_child_personality.7080.a:0 "Venha aqui e pegue um pouco disso!"
 tgp_child_personality.7080.b:0 "Talvez eu nem me sinta culpado afinal."
 tgp_child_personality.7080.c:0 "Isto é meu porque eu mereço. [greedy_child.GetSheHe|U] pode ir atrás do que é seu."
 tgp_child_personality.7080.desc:0 "Ultimamente, em todo lugar que vou, as pessoas querem me dar petiscos. Minhas mangas estão quase transbordando de guloseimas deliciosas, tantas que quase me sinto culpado pela abundância.\n\nAo colocar mais uma na boca, vejo [Select_CString( greedy_child.IsFemale, 'uma das', 'um dos' )] [greedy_child.Custom('GirlBoy')]s serv[Select_CString( greedy_child.IsFemale, 'as', 'os' )] olhando meus tesouros com inveja evidente."
 tgp_child_personality.7080.t:0 "Excesso Delicioso"
 tgp_child_personality.7081.arrogant:0 "Comporte-se como seu status exige, e os outros seguirão o exemplo."
 tgp_child_personality.7081.change.arrogant:0 "$tgp_child_personality.7081.arrogant$"
 tgp_child_personality.7081.change.fickle:0 "A imprevisibilidade pode ser um trunfo em muitas situações."
 tgp_child_personality.7081.change.generous:0 "$tgp_child_personality.7081.generous$"
 tgp_child_personality.7081.desc:0 "Ultimamente percebi quantos de nossos servos mimam os petiscos de [child.GetFirstName], oferecendo-os quase a cada hora."
 tgp_child_personality.7081.fickle:0 "Uma certa flexibilidade de espírito pode confundir seus rivais."
 tgp_child_personality.7081.generous:0 "A abundância deve sempre ser compartilhada com quem dela carece."
 tgp_child_personality.7081.t:0 "Excesso Delicioso"
 tgp_child_personality.7090.a:0 "Foi um acidente. Não estou bravo."
 tgp_child_personality.7090.b:0 "Sei que você não fez de propósito: confio em você."
 tgp_child_personality.7090.c:0 "Podemos simplesmente pedir uma nova cópia: pode esperar."
 tgp_child_personality.7090.desc:0 "Estou procurando meu pergaminho ilustrado favorito quando vejo um dos servos entrar no quarto com ele na mão.\n\n\"Aí está!\" exclamoo, estendendo a mão para pegá-lo, antes de ser interrompido pelo servo que de repente cai de joelhos diante de mim e se prostra a si mesm[Select_CString( sorry_servant.IsFemale, 'a', 'o' )].\n\n\"Foi um acidente, jovem [ROOT.Char.Custom('MistressMaster')], juro!\"\n\nAo inspecionar mais de perto, vejo que o pergaminho está gravemente rasgado, quase partido ao meio!"
 tgp_child_personality.7090.t:0 "Um Erro Honesto"
 tgp_child_personality.7091.change.forgiving:0 "$tgp_child_personality.7091.forgiving$"
 tgp_child_personality.7091.change.patient:0 "$tgp_child_personality.7091.patient$"
 tgp_child_personality.7091.change.trusting:0 "$tgp_child_personality.7091.trusting$"
 tgp_child_personality.7091.desc:0 "Em um infeliz acontecimento, o pergaminho ilustrado favorito de [child.GetFirstNamePossessive] foi acidentalmente rasgado por um servo que o confundiu com lixo. Curioso para ver a reação da criança, sento-me ao lado [Select_CString( child.IsFemale, 'da', 'do' )] [child.Custom('GirlBoy')]."
 tgp_child_personality.7091.forgiving:0 "Seja tolerante com as falhas alheias; nem todos são como nós."
 tgp_child_personality.7091.patient:0 "Muitas feridas podem ser curadas com o tempo; você só precisa esperar."
 tgp_child_personality.7091.t:0 "Um Erro Honesto"
 tgp_child_personality.7091.trusting:0 "Coloque sua confiança naqueles que confiam em você."
 tgp_child_personality.7100.a:0 "Estou cansado dessas perguntas. Podemos parar agora, por favor?"
 tgp_child_personality.7100.b:0 "Se eu apenas responder aleatoriamente, talvez [guardian.GetSheHe] me deixe em paz."
 tgp_child_personality.7100.c:0 "Que perda de tempo; poderia estar fazendo tantas outras coisas."
 tgp_child_personality.7100.desc:0 "Sinto que cada dia é um exame do qual não posso escapar - [guardian.GetName] está constantemente me testando com perguntas, variando do estranho ao mundano.\n\nGostaria que [guardian.GetSheHe] me deixasse em paz por um tempo, mas posso ser punido se reclamar..."
 tgp_child_personality.7100.t:0 "Perguntas Constantes"
 tgp_child_personality.7101.arbitrary:0 "Se você acha que sabe mais, então siga seu curso."
 tgp_child_personality.7101.change.arbitrary:0 "$tgp_child_personality.7101.arbitrary$"
 tgp_child_personality.7101.change.honest:0 "$tgp_child_personality.7101.honest$"
 tgp_child_personality.7101.change.impatient:0 "$tgp_child_personality.7101.impatient$"
 tgp_child_personality.7101.desc:0 "A busca e aquisição de conhecimento é uma das marcas de um[Select_CString( child.IsFemale, 'a', '' )] [child.GetWomanMan] dign[Select_CString( child.IsFemale, 'a', 'o' )], mas minhas tentativas determinadas de incutir isso n[Select_CString( child.IsFemale, 'a', 'o' )] [child.GetFirstName] podem ter ido um pouco longe demais."
 tgp_child_personality.7101.honest:0 "Ouse falar a verdade, senão o mundo cairá na injustiça."
 tgp_child_personality.7101.impatient:0 "Quanto mais rápido responder, mais cedo terminaremos."
 tgp_child_personality.7101.t:0 "Interrogatório Constante"
 tgp_child_personality.7200.a:0 "Não vou fugir - não sou covarde!"
 tgp_child_personality.7200.b:0 "Se ele não ceder, então eu também não cederei!"
 tgp_child_personality.7200.c:0 "Um mero vira-lata ousa mostrar os dentes para mim!?"
 tgp_child_personality.7200.desc:0 "Um servo esquecido, uma porta deixada entreaberta, e estou do lado de fora! Mal tenho tempo de aproveitar minha liberdade recém-descoberta quando um rosnado baixo me faz parar.\n\nVirando-me lentamente à direita, encontro um cão quase do meu tamanho, nenhum membro da nossa casa que eu já tenha visto.\n\nAtrás de mim, ouço um servo gritar: \"Corra, criança! Volte para dentro, depressa!\""
 tgp_child_personality.7200.t:0 "Determinação Obstinada"
 tgp_child_personality.7201.brave:0 "Um espírito ousado e indomável; eu aprovo!"
 tgp_child_personality.7201.change.brave:0 "Enfrente seus oponentes com coragem e a vitória inevitavelmente seguirá."
 tgp_child_personality.7201.change.stubborn:0 "Você deve permanecer firme e não ceder nem a homem nem a besta."
 tgp_child_personality.7201.change.wrathful:0 "Você não se enfurece com a agressão desta criatura vil?"
 tgp_child_personality.7201.desc:0 "Um momento de descuido pode ter consequências graves. Um servo simplesmente esqueceu de trancar o portão e de repente [child.GetFirstName] está do lado de fora, frente a frente com um cão vira-lata. O perigo passou e a criança está de volta ao quarto [child.GetHerHim], ilesa, mas as consequências ainda exigem minha atenção."
 tgp_child_personality.7201.stubborn:0 "Permaneça firme e não ceda nem a homem nem a besta."
 tgp_child_personality.7201.t:0 "Determinação Inabalável"
 tgp_child_personality.7201.wrathful:0 "A raiva, canalizada corretamente, amplificará suas ambições."
 tgp_child_personality.7300.a:0 "Se eu ficar com ele, posso aprender a falar com pássaros!"
 tgp_child_personality.7300.b:0 "Devo pedir aos servos que cuidem dele."
 tgp_child_personality.7300.c:0 "Quem se importa com pássaros estúpidos?"
 tgp_child_personality.7300.desc:0 "Caminhando pelo pátio, ouço um sussurro de movimento sob um dos arbustos; afastando as frondas com um graveto quebrado, vejo um pequeno pássaro pulando de um lado para o outro, uma asa torta em ângulo claramente antinatural."
 tgp_child_personality.7300.t:0 "Asas Quebradas"
 tgp_child_personality.7301.callous.desc:0 "\n\nDemonstrando clara indiferença ao sofrimento, [child.GetFirstNameNoTooltip] deixou o pássaro quebrado onde o encontrou, deixando para nossos servos - e, ao que parece, para seu mestre - lidar com ele."
 tgp_child_personality.7301.callous:0 "Deixe os fracos se defenderem sozinhos, seja pássaro ou [child.GetWomanMan]."
 tgp_child_personality.7301.change.callous:0 "$tgp_child_personality.7301.callous$"
 tgp_child_personality.7301.change.compassionate:0 "Acima de tudo, cuide daqueles mais fracos que você."
 tgp_child_personality.7301.change.eccentric:0 "Deixe sua mente voar e imagine o mundo como um pássaro faria."
 tgp_child_personality.7301.compassionate.desc:0 "\n\nComovido pelo sofrimento do animal, [child.GetFirstNameNoTooltip] insiste que devemos levar o pássaro para nossa casa e cuidar dele como se fosse um de nós."
 tgp_child_personality.7301.compassionate:0 "Cuide de seu povo como cuidaria deste pássaro."
 tgp_child_personality.7301.desc:0 "Estou finalizando minha revisão das contas da casa quando os servos trazem um novo assunto à minha atenção; um pequeno pássaro de plumagem incomum e com uma asa quebrada que [child.GetFirstName] descobriu no pátio."
 tgp_child_personality.7301.eccentric.desc:0 "\n\nJá, [child.GetFirstNameNoTooltip] está encantado com o pássaro, ou talvez mais precisamente com a #EMP ideia#! de um pássaro. [child.GetSheHe|U] não para de falar sobre como gostaria de voar como um."
 tgp_child_personality.7301.eccentric:0 "A mente de uma criança é uma coisa estranha e maravilhosa."
 tgp_child_personality.7301.t:0 "Asas Quebradas"
 tgp_child_personality.ambitious.desc:0 "\n\n[child.GetFirstNameNoTooltip] ouviu parte do debate e parece ter se sentido encorajado por ele, considerando seu próprio conhecimento e compreensão superiores aos dos adultos."
 tgp_child_personality.arbitrary.desc:0 "\n\n\"Foi o quarto imperador. Ou o nono\", responde [child.GetFirstNameNoTooltip] desinteressadamente à minha última pergunta, demonstrando profunda indiferença à verdade."
 tgp_child_personality.arrogant.desc:0 "\n\n[child.GetFirstNameNoTooltip] guarda seus petiscos com ciúmes, recusando-se a compartilhar com qualquer outra pessoa e considerando-os como seu devido legítimo."
 tgp_child_personality.brave.desc:0 "\n\n\"Não fiquei com medo nem um pouco!\" anuncia orgulhosamente [child.GetFirstNameNoTooltip]. \"Eu poderia ter enfrentado uma matilha inteira de lobos!\""
 tgp_child_personality.callous.desc:0 "\n\nEnquanto [child.GetFirstName] e eu vasculhávamos a casa, expliquei o objeto de nossa busca. 'Já vi isso,' respondeu a criança com desinteresse casual. 'Mas o que acontecerá com o servo que a perdeu?' [child.GetSheHe|U] pergunta com interesse visivelmente maior."
 tgp_child_personality.calm.desc:0 "\n\nIsso tem pouco a ver com a situação do servo, pois [child.GetFirstNameNoTooltip] apenas expressou desagrado pelos argumentos e pelo veneno das palavras dos adultos."
 tgp_child_personality.chaste.desc:0 "\n\nDe repente, algo se encaixa na minha memória. [child.GetFirstName] tem passado pouco tempo na biblioteca ultimamente, quase como se estivesse envergonhado de entrar na sala. Eu me pergunto..."
 tgp_child_personality.compassionate.desc:0 "\n\nNotando a dificuldade do servo, [child.GetFirstNameNoTooltip] avança e assume parte da carga, seguindo diligentemente o servo até a cozinha. Ao retornar, [child.GetSheHe] demonstra o orgulho silencioso de quem fez algo certo."
 tgp_child_personality.content.desc:0 "\n\nEsses elogios parecem escorrer pelas costas de [child.GetFirstNamePossessiveNoTooltip] sem efeito duradouro, e [child.GetSheHe] parece amplamente indiferente às laudatórias profusas."
 tgp_child_personality.craven.desc:0 "\n\nAinda perturbado pela visita, [child.GetFirstNameNoTooltip] segura minha mão ansiosamente. 'Por que eles estavam aqui? Pareciam perigosos!' [child.GetSheHe] exclama. 'Por favor, não os deixe voltar.'"
 tgp_child_personality.cynical.desc:0 "\n\nPrivadamente, [child.GetFirstNameNoTooltip] expressou suas dúvidas para mim, questionando se os servos estão apenas tentando conquistar o favor [child.GetHerHim]."
 tgp_child_personality.deceitful.desc:0 "\n\nA principal preocupação de [child.GetFirstNamePossessiveNoTooltip] parece ser a admissão de culpa; se os servos mentissem, estariam menos propensos a serem punidos por suas falhas."
 tgp_child_personality.diligent.desc:0 "\n\nApesar da minha oferta, [child.GetFirstName] escolheu continuar seus estudos por conta própria, demonstrando um compromisso impressionante com a continuidade de seu aprendizado."
 tgp_child_personality.fickle.desc:0 "\n\n[child.GetFirstNameNoTooltip] às vezes está disposto a compartilhar seus petiscos com os outros, mas momentos depois se recusa completamente, com o humor variando drasticamente."
 tgp_child_personality.forgiving.desc:0 "\n\n\"Você foi muito tolerante\", observo. [child.GetFirstNameNoTooltip] dá de ombros levemente, como se não tivesse importância. \"Foi um acidente. Eu não queria que [child.GetSheHe] se sentisse mal.\""
 tgp_child_personality.generous.desc:0 "\n\nTotalmente ausente de avareza, [child.GetFirstNameNoTooltip] compartilha alegremente com as outras crianças sem a menor hesitação."
 tgp_child_personality.gluttonous.desc:0 "\n\nSem hesitar, [child.GetFirstNameNoTooltip] corre para ajudar a aliviar a carga do servo, e juntos desaparecem na cozinha. Alguns minutos depois, a criança reaparece e sorri para mim, com os dedos pegajosos de doces e guloseimas, parecendo muito satisfeita consigo mesma."
 tgp_child_personality.greedy.desc:0 "\n\nUma busca minuciosa pela casa rapidamente revelou a caixa perdida no quarto de [child.GetFirstNameNoTooltip]. 'Eu a encontrei, então agora é minha!' [child.GetSheHe] resmunga teimosamente quando confrontado."
 tgp_child_personality.gregarious.desc:0 "\n\nNão surpreendentemente, [child.GetFirstName] pediu para passar o dia com seus companheiros, deixando os estudos de lado em favor da companhia dos outros."
 tgp_child_personality.honest.desc:0 "\n\n\"Podemos parar agora, por favor?\" [child.GetSheHe] implora, a voz carregada de tensão, expressando honestamente a frustrações evidentes [child.GetHerHim]."
 tgp_child_personality.humble.desc:0 "\n\nApesar disso, [child.GetFirstNameNoTooltip] permanece humilde, expressando em toda ocasião que [child.GetSheHe] ainda tem muito a aprender."
 tgp_child_personality.impatient.desc:0 "\n\n\"Já terminamos?\" [child.GetFirstNameNoTooltip] suspira com irritação não disfarçada, movendo-se inquietamente e claramente desejando fazer qualquer outra coisa."
 tgp_child_personality.just.desc:0 "\n\nQuando estava prestes a iniciar minha investigação, no entanto, encontrei inesperadamente a caixa extraviada sendo restaurada ao seu lugar correto [Select_CString( child.IsFemale, 'pela', 'pelo' )] [child.GetFirstName]."
 tgp_child_personality.lazy.desc:0 "\n\nImpassível diante da cena, [child.GetFirstNameNoTooltip] simplesmente fica parado e observa o esforço do servo. Ao me notar, [child.GetSheHe] dá de ombros de forma despreocupada, como se o assunto estivesse abaixo [child.GetHerHim]."
 tgp_child_personality.lustful.desc:0 "\n\nDe repente, algo se encaixa na minha memória. [child.GetFirstName] tem se comportado de forma estranha ultimamente, passando tempo excessivo na biblioteca. Eu me pergunto..."
 tgp_child_personality.paranoid.desc:0 "\n\nCauteloso após o encontro, [child.GetFirstNameNoTooltip] vem até mim com apreensão. 'Quem eram aquelas pessoas?' [child.GetSheHe] pergunta. 'Não confio neles.'"
 tgp_child_personality.patient.desc:0 "\n\n\"Você está muito calmo quanto a isso\", observo. [child.GetFirstNameNoTooltip] sorri pacificamente, completamente despreocupado. \"Está tudo bem, não me importo de esperar por um novo.\""
 tgp_child_personality.sadistic.desc:0 "\n\nDepois que os convidados se dispersaram, [child.GetFirstNameNoTooltip] corre até mim com a antecipação estampada em seu rosto. 'Você disse a todos o quanto estavam errados?' [child.GetSheHe] pergunta ansiosamente. 'Todos riram do quão tolos pareciam?'"
 tgp_child_personality.shy.desc:0 "\n\nClaramente abalado pelo encontro, [child.GetFirstNameNoTooltip] se aproxima de mim com os olhos baixos, mexendo-se nervosamente. 'Eles não vão voltar, vão?' [child.GetSheHe] pergunta. 'Por favor, não os deixe voltar. Não quero vê-los novamente.'"
 tgp_child_personality.stubborn.desc:0 "\n\n\"Mantive minha posição!\" insiste [child.GetFirstNameNoTooltip] com desafio. \"Não fugi, os servos me carregaram de volta para dentro!\" Parece que a criança está mais irritada com o resgate do que com o perigo que enfrentou."
 tgp_child_personality.temperate.desc:0 "\n\nInesperadamente, [child.GetFirstName] optou por aproveitar a oportunidade para descansar e conservar suas energias para os desafios de amanhã."
 tgp_child_personality.trusting.desc:0 "\n\n\"Você aceitou essa explicação muito facilmente\", comento. [child.GetFirstNameNoTooltip] acena seriamente. \"Eu confio n[child.GetSheHe]\", responde [child.GetSheHe] simplesmente."
 tgp_child_personality.vengeful.desc:0 "\n\n[child.GetSheHe|U] fica mais confuso com a tolerância do servo às minhas repreensões, querendo saber por que eu não esperava que o servo encontrasse uma forma de retaliar no futuro."
 tgp_child_personality.wrathful.desc:0 "\n\n\"Eu odeio aquele cachorro!\" grita [child.GetFirstNameNoTooltip] com evidente frustração. \"Eles deveriam tê-lo matado, não apenas assustado!\""
 tgp_child_personality.zealous.desc:0 "\n\nApós o grupo se dispersar, [child.GetFirstNameNoTooltip] se aproxima de mim, visivelmente perturbado por ter ouvido parte do debate. 'Como eles puderam interpretar o [ROOT.Char.GetFaith.ReligiousText] tão #EMP errado#!!?' [child.GetSheHe] pergunta, incrédulo."
