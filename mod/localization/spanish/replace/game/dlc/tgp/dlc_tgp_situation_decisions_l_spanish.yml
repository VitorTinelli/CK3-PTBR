 favor_dynastic_cycle_era_hegemon_desc:0 "Os fardos do Estado pesam sobre mim. O [mandate_of_heaven|E] é meu para carregar e sustentar, e as engrenagens de [GetSituation('dynastic_cycle').GetName] giram inexoravelmente a cada decisão que tomo. O futuro de todos que habitam sob o Céu repousa em minhas mãos; nosso futuro será de paz e prosperidade, ou de vitórias conquistadas e soberanos estrangeiros submetidos?"
