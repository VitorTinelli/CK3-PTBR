 favor_dynastic_cycle_era_chaos_desc:0 "Se algum dia eu devo aceitar a sagrada responsabilidade do [mandate_of_heaven|E], devo conduzir-me como um soberano e refletir sobre os numerosos que olharão para mim como mestre de todas as terras sob o Céu. Se – não, #EMP quando#! – esse tempo chegar, seu futuro será de paz e prosperidade, ou de vitórias conquistadas e soberanos estrangeiros submetidos?"
 favor_dynastic_cycle_era_decision_chaos_tooltip:0 "Todo [independent_ruler|E] no [dynastic_cycle|E] pode definir [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_advancement').GetName] ou [GetSituationType('dynastic_cycle').GetPhaseType('situation_dynastic_cycle_phase_stability_expansion').GetName] como [favored_era|E]"
