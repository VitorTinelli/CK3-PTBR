l_spanish:
 tgp_tai_migration_event.1000.a:0 "Eu lhes dou boas-vindas, não como convidados, mas como meus súditos."
 tgp_tai_migration_event.1000.b:0 "Apenas os habilidosos entre vocês poderão viver no meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 tgp_tai_migration_event.1000.c:0 "Mais pessoas trazem mais problemas; procurem outra porta para suplicar."
 tgp_tai_migration_event.1000.desc:0 "Durante a reunião do conselho de hoje, fui informado sobre uma grande migração de colonos Tai. [migration_leader.GetName], o representante ancião da comunidade deles, agora está diante de mim, enquanto [migration_leader.GetSheHe] apresenta humildemente o caso [migration_leader.GetHerHim].\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip], buscamos orientação e um novo lar como antigos súditos de [migration_origin_holder.GetName]. Falo por muitos clãs e milhares que esperam por refúgio. Proteja-nos do mal e nos dê propósito para que possamos ser servos úteis, dignos de sua generosidade.\"\n\nO destino deles repousa entre meus lábios."
 tgp_tai_migration_event.1000.t:0 "Fuga dos Tai"
 tgp_tai_migration_event.2000.a:0 "Eu talvez precise dos seus serviços."
 tgp_tai_migration_event.2000.antiquarian.desc:0 "\"Meus olhos viram mitos e minhas mãos tocaram impérios antigos. Permita-me servi-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], para que a sabedoria dos antigos alcance sua corte.\""
 tgp_tai_migration_event.2000.b.failure:0 "[migrant_skilled_character.GetNameNoTooltip] recusa sua oferta"
 tgp_tai_migration_event.2000.b.success:0 "[migrant_skilled_character.GetNameNoTooltip] entra na sua corte"
 tgp_tai_migration_event.2000.b:0 "Ainda não, mas você deve permanecer conosco."
 tgp_tai_migration_event.2000.c:0 "Eu devo recusar."
 tgp_tai_migration_event.2000.champion.desc:0 "\"Senhor mestre, sou conhecid[Select_CString( migrant_skilled_character.IsFemale, 'a', 'o' )] como [migrant_skilled_character.GetName] em minha terra natal, [Select_CString( migrant_skilled_character.IsFemale, 'uma guerreira jurada e vencedora', 'um guerreiro jurado e vencedor' )] de muitos torneios. Meu braço é firme, e minha lealdade é inquestionável. Deixe-me ser seu campeão.\""
 tgp_tai_migration_event.2000.court_physician.desc:0 "\"Unguentos de tomos antigos e a destreza para atuar sob pressão, eu sou [Select_CString( migrant_skilled_character.IsFemale, 'a única', 'o único' )] [migrant_skilled_character.GetWomanMan] de que precisa para tranquilizar seu corpo celestial, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Chamam-me [migrant_skilled_character.GetName].\""
 tgp_tai_migration_event.2000.court_tutor.desc:0 "\"Influenciei muitos guerreiros e estadistas, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Sua prole também alcançará grandeza sob minha orientação, se permitir.\""
 tgp_tai_migration_event.2000.desc:0 "Um[Select_CString( migrant_skilled_character.IsFemale, 'a', '' )] [migrant_skilled_character.GetWomanMan] habilidos[Select_CString( migrant_skilled_character.IsFemale, 'a', 'o' )] que afirma vir das terras de [migrant_skilled_character.GetCulture.GetNameNoTooltip] está diante de mim como [Select_CString( migrant_skilled_character.IsFemale, 'uma procuradora', 'um procurador' )] de trabalho experiente. Os modos [migrant_skilled_character.GetHerHim] parecem refletir notícias recentes sobre a fuga de seu povo.\n\n"
 tgp_tai_migration_event.2000.end.desc:0 "\n\n[migrant_skilled_character.GetSheHe|U] parece desesperad[Select_CString( migrant_skilled_character.IsFemale, 'a', 'o' )] por abrigo, provavelmente pelas mesmas razões que trouxeram [migrant_skilled_character.GetSheHe] até aqui, mas claramente domina bem o que faz. Devo aproveitar as habilidades [migrant_skilled_character.GetHerHim]?"
 tgp_tai_migration_event.2000.master_of_hunt.desc:0 "\"Nascid[Select_CString( migrant_skilled_character.IsFemale, 'a', 'o' )] para a caça, temperad[Select_CString( migrant_skilled_character.IsFemale, 'a', 'o' )] pela natureza, conheço o cheiro de cada fera e o silêncio de cada floresta. Leio pegadas como ninguém. O que me diz, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]?\""
 tgp_tai_migration_event.2000.t:0 "Um Tai Talentoso"
 tgp_tai_migration_event.2000.travel_leader.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip], eu sou [migrant_skilled_character.GetName], tendo viajado por desertos, as estrelas servem como meu mapa e os ventos como meus aliados. Sob minha liderança, nenhuma caravana se perde e nenhuma trilha é desafiadora.\""
 tgp_tai_migration_event.2000.wet_nurse.desc:0 "\"Sua Santidade, eu sou [migrant_skilled_character.GetName], uma cuidadora experiente pronta para servir. Sou saudável, bem alimentada e entendo as necessidades de bebês. Permita-me ajudar seu sangue a prosperar.\""
 tgp_tai_migration_event.3000.a:0 "Seu desejo será concedido, desde que você seja leal."
 tgp_tai_migration_event.3000.b:0 "Isso não me parece uma troca justa."
 tgp_tai_migration_event.3000.desc:0 "Um estrangeiro íntegro aproxima-se de meus salões com notável confiança para fazer uma oferta administrativa.\n\nApós uma saudação surpreendentemente genuína, diferente do típico modo rústico, e um relato detalhado sobre a jornada triste de sua família até minhas terras, ele chega a uma conclusão ousada.\n\n\"...salteadores e pilhadores, eu lhe digo, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. O que restou das minhas posses saqueadas é um talento comprovado, percepção aguçada para supervisionar, lealdade e uma família precisando de sua ajuda. Eu, e meu sangue, seremos seus servos até que nos considere indignos.\""
 tgp_tai_migration_event.3000.t:0 "A Proposta de um Homem de Família"
 tgp_tai_migration_event.4000.a:0 "Eu lhes darei abrigo nestes tempos difíceis."
 tgp_tai_migration_event.4000.b:0 "Minha corte não tem utilidade para sua família."
 tgp_tai_migration_event.4000.desc:0 "Meus guardas trazem uma família arruinada de estrangeiros das terras do norte para o salão.\n\nApós uma longa sessão de súplicas, o chefe da família olha dentro da minha alma e oferece tudo o que não possui para limpar os pisos do meu palácio em troca de abrigo sob minhas poderosas asas. Com base em sua história, parece que muitos de seu povo estão voando para nossas terras, esperando por novos protetores."
 tgp_tai_migration_event.4000.t:0 "Uma Família Tai"
 tgp_tai_migration_event_1000.c_shooed_immigrants_tt:0 "Os imigrantes podem pedir abrigo a outro governante próximo em um futuro próximo."
 tgp_tai_migration_migration_happened_character_modifier:0 "Aceitou uma Miríade de Imigrantes"
 tgp_tai_migration_migration_happened_county_modifier:0 "Colonizadores Tai"
 tgp_tai_migration_migration_rejected_character_modifier:0 "Rejeitou Imigrantes"
 tgp_tai_migration_skilled_development_county_modifier:0 "Fuga dos Artesãos"
