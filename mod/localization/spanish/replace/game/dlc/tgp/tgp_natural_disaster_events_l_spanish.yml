l_spanish:
 disaster_option_warning:0 "@warning_icon! #warning Isto pode ser muito perigoso para a vida e integridade física!#!"
 minister_has_aidee_to_send_tt:0 "Emprega [GetCourtPositionType( 'minister_bureaucrat_court_position' ).GetName]"
 natural_disaster.4001.a:0 "Uma vitória contra a natureza, de fato."
 natural_disaster.4001.desc:0 "O recente desastre que atingiu nossa terra deixou danos que levarão gerações para serem reparados. Uma ferida sentida por toda a terra, infligida tanto a nobres quanto a plebeus.\n\nNos unimos para honrar aqueles que perderam suas vidas e para restaurar nossas cidades e vilas. Se outro desastre ocorrer, estaremos preparados."
 natural_disaster.4001.t:0 "[situation.GetNameNoTooltip]: Recuperação Concluída"
 natural_disaster.4002.a:0 "Nosso trabalho não foi em vão!"
 natural_disaster.5001.a:0 "Haverá tanto a reconstruir."
 natural_disaster.5001.desc.earthquake:0 "Os inocentes correm enquanto detritos caem do céu, apenas para serem engolidos por plumas de fumaça escura e sufocante. Construções que permaneceram imóveis por eras agora estão em ruínas, seus restos totalmente irreconhecíveis."
 natural_disaster.5001.desc.flood:0 "Porões e construções subterrâneas foram totalmente perdidos, suas saídas submersas pelas águas da enchente. O movimento torna-se quase impossível, tanto para homens quanto para animais de carga."
 natural_disaster.5001.desc:0 "Anos de investimento e frutos de trabalho árduo na região são desfeitos num piscar de olhos. Famílias abandonam suas casas ancestrais enquanto tudo o que resta é escombros. Cronistas lamentam a perda de tesouros sagrados e raros, assim como os estoques vitais de suprimentos militares.\n\n"
 natural_disaster.5001.t:0 "[situation.GetNameNoTooltip]: Progresso Desfeito"
 natural_disaster.5011.a:0 "A situação se agrava a cada dia."
 natural_disaster.5011.desc.earthquake:0 "As outrora altas e imponentes muralhas de [epicenter_county.GetNameNoTier] caíram,"
 natural_disaster.5011.desc.flood:0 "As outrora altas e imponentes muralhas que cercavam as cidades ao longo do [river_region.GetName] desmoronaram,"
 natural_disaster.5011.desc:0 "tornando impossível posicionar quaisquer regimentos ali. Guerreiros são deslocados para áreas mais seguras, mas isso cria vulnerabilidade para a região.\n\nNo momento de maior fraqueza, a terra jaz em ruínas — indefesa e vulnerável."
 natural_disaster.5011.t:0 "[situation.GetNameNoTooltip]: Fraco e Quebradiço"
 natural_disaster.5021.a:0 "Foi abandonada."
 natural_disaster.5021.desc:0 "As vítimas do [situation.GetName] apressam-se em buscar segurança, deixando suas antigas vidas para trás. Com poucos remanescentes para garantir a ordem na região, atores mal-intencionados atuam livremente para aterrorizar os sobreviventes. Governar a área tornou-se impossível."
 natural_disaster.5021.t:0 "[situation.GetNameNoTooltip]: Êxodo"
 natural_disaster.5022.a:0 "Os sobreviventes estão seguros aqui."
 natural_disaster.5022.desc:0 "Refugiados do [situation.GetName] procuram reinos vizinhos, numa tentativa desesperada de escapar do caos. O crime corre solto na região, enquanto indivíduos mal-intencionados se aproveitam da confusão. As áreas afetadas tornam-se um peso para o reino, incapazes de gerar lucro ou progresso com a perda de seus habitantes."
 natural_disaster.5031.a:0 "Essas terras não são mais férteis."
 natural_disaster.5031.desc:0 "Muitos rebanhos diminuem à medida que a terra deixada para pastagem se reduz. A ira da natureza devasta a região, tornando impossível a manutenção de nossos rebanhos."
 natural_disaster.5031.t:0 "[situation.GetNameNoTooltip]: Pastagens Arruinadas"
 natural_disaster.5101.a.tt.failure:0 "A calamidade te supera"
 natural_disaster.5101.a.tt.failure_root:0 "Você morre"
 natural_disaster.5101.a.tt.failure_secondary:0 "[at_risk_character.GetFirstNameNoTooltip] morre"
 natural_disaster.5101.a.tt.success:0 "Você e [at_risk_character.GetFirstNameNoTooltip] sobrevivem"
 natural_disaster.5101.a:0 "Eu agarro [at_risk_character.GetTitledFirstNameNoTooltip] e corro para a porta."
 natural_disaster.5101.activity:0 "\n\nEsta será a última [involved_activity.GetActivityType.GetNameNoTooltip] que eu verei."
 natural_disaster.5101.army:0 "\n\nTalvez buscar abrigo neste [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] não tenha sido sensato. Ao meu redor, meus soldados são arrastados pelo tumulto."
 natural_disaster.5101.b.tt.at_risk_character_duel:0 "[at_risk_character.GetFirstNameNoTooltip] pode morrer"
 natural_disaster.5101.b.tt.failure:0 "Você morre"
 natural_disaster.5101.b.tt.success:0 "Você sobrevive, por pouco"
 natural_disaster.5101.b:0 "Cada um por si!"
 natural_disaster.5101.c:0 "Eu forço [at_risk_character.GetSheHe] a passar, sabendo que levarei o golpe."
 natural_disaster.5101.court:0 "\n\nEmpurro-me através do tumulto dos cortesãos em pânico, apenas para encontrar a saída única firmemente trancada."
 natural_disaster.5101.d:0 "Eu lanço [at_risk_character.GetTitledFirstNameNoTooltip] de lado e faço minha fuga."
 natural_disaster.5101.desc.earthquake:0 "O chão se ergue e a poeira sobe do teto. Uma pesada viga de sustentação se parte e as paredes gemem. Em poucos instantes, tudo desabará."
 natural_disaster.5101.desc.earthquake_end:0 "[Select_CString( at_risk_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('at_risk_character'))] [at_risk_character.GetTitledFirstNameNoTooltip] está um passo atrás, olhos arregalados. Há espaço para apenas um atravessar a porta antes que a viga desabe."
 natural_disaster.5101.desc.flood:0 "Águas sujas sobem até meu peito, espessas de sedimentos. Minhas roupas encharcadas arrastam-se nos meus membros enquanto a correnteza se intensifica."
 natural_disaster.5101.desc.flood_end:0 "[Select_CString( at_risk_character.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('at_risk_character'))] [at_risk_character.GetTitledFirstNameNoTooltip] está um passo atrás, estendendo a mão para mim. Há espaço para apenas um passar para o ar."
 natural_disaster.5101.estate:0 "\n\nCorro pelos corredores da minha propriedade apenas para encontrar a única saída parcialmente trancada."
 natural_disaster.5101.t:0 "[situation.GetNameNoTooltip]: Últimos Momentos"
 natural_disaster.5101.tent:0 "\n\nTalvez buscar abrigo neste [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] não tenha sido sensato."
 natural_disaster.5101.travel:0 "\n\nTalvez buscar abrigo neste [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship] não tenha sido sensato."
 natural_disaster.5102.a:0 "Tenho sorte de estar vivo."
 natural_disaster.5102.activity:0 "O participante à minha direita"
 natural_disaster.5102.army:0 "Meu exército"
 natural_disaster.5102.court:0 "Minha corte"
 natural_disaster.5102.desc.earthquake:0 "é esmagado por um edifício desabando.\n\nEu milagrosamente desvio dos escombros, e me movo para terreno mais seguro. Observo os corpos esmagados ao meu redor, e a angústia aperta meu coração."
 natural_disaster.5102.desc.flood:0 "é arrastado pelas águas da enchente, nossos suprimentos e pertences encharcados em sua corrente.\n\nConsigo dominar a correnteza, chegando a terreno mais alto. Olho para baixo e testemunho o resultado, e o cheiro de morte preenche o ar."
 natural_disaster.5102.desc_remote.earthquake:0 "O reino está em alvoroço com rumores aterrorizantes do [situation.GetNameNoTooltip]. Salões e torres caíram, enterrando senhores e suas casas. O número de mortos é grave, mesmo entre a nobreza."
 natural_disaster.5102.desc_remote.flood:0 "O reino está em alvoroço com rumores aterrorizantes do [situation.GetNameNoTooltip]. As águas da enchente reclamaram muitos nas terras afetadas, até mesmo nobres e cortesãos. Embora eu esteja longe do pior, a escala de perdas é impressionante."
 natural_disaster.5102.estate:0 "Minha propriedade"
 natural_disaster.5102.t.affected:0 "[situation.GetNameNoTooltip]: Sobrevivente"
 natural_disaster.5102.t.not_affected:0 "[situation.GetNameNoTooltip]: Mortes"
 natural_disaster.5102.t.second_round:0 " — Segundo Impacto"
 natural_disaster.5102.t.third_round:0 " — Terceiro Impacto"
 natural_disaster.5102.tent:0 "Minha tenda"
 natural_disaster.5102.travel:0 "Meu séquito"
 natural_disaster.5111.a:0 "O peso da guerra torna-se cada vez maior."
 natural_disaster.5111.desc.earthquake:0 "O solo em ruptura faz muitos guerreiros tropeçarem e caírem no abismo recém-formado. Outros ficam presos ou esmagados pelos escombros que caem.\n\nO pobre cavalo de [knight.GetNamePossessive] é atingido na cabeça por uma pedra de sustentação que cai, morrendo instantaneamente. Embora a vida de [knight.GetNamePossessiveNoTooltip] tenha sido poupada misericordiosamente, o mesmo não se pode dizer de seus camaradas."
 natural_disaster.5111.desc.flood:0 "Incapazes de resistir às águas crescentes, os cavalos começam a escorregar, arrastando seus cavaleiros com eles. O terror se espalha à medida que mais animais são engolidos pela corrente. Meus guerreiros enfrentam o mesmo destino, sua armadura pesada que antes os protegia de todos agora os arrasta para uma morte submersa.\n\n\"Tende piedade, do meu s—.\" [knight.GetName] grita antes que sua boca seja preenchida pelas águas sufocantes."
 natural_disaster.5111.t:0 "[situation.GetNameNoTooltip]: Acampamento Afetado"
 natural_disaster.5901.a.earthquake:0 "[epicenter_county.GetNameNoTierNoTooltip] será arruinado."
 natural_disaster.5901.a.flood:0 "O nivelamento vindo do [river_region.GetNameNoTooltip] é iminente."
 natural_disaster.5901.desc.earthquake:0 "As fissuras em [epicenter_county.GetNameNoTier] atingiram seu ápice, causando destruição por toda a região. Casas e outras construções tombam em massa, e muitos que tentam fugir são esmagados pelos escombros em queda.\n\nA destruição desencadeia uma sequência devastadora de eventos, com incêndios e agitação civil irrompendo. Almas corajosas tentam salvar aqueles sob os escombros, apenas para perderem suas próprias vidas na fumaça e fogo que se espalham pelo [epicenter_county.GetTierAsNameNoTooltip]."
 natural_disaster.5901.desc.flood:0 "A água corre pelas ruas e vielas das cidades ao redor do [river_region.GetNameNoTooltip], levando os corpos de inocentes em sua corrente implacável. Alguns tentam atravessar, apenas para serem engolidos inteiros.\n\nA enchente infiltra-se sob os pisos dos edifícios, saturando a madeira e garantindo sua futura deterioração. As colheitas são esmagadas pelo fluxo da enxurrada."
 natural_disaster.5901.t.earthquake:0 "[situation.GetNameNoTooltip]: A Ira da Terra"
 natural_disaster.5901.t.flood:0 "[situation.GetNameNoTooltip]: Correnteza Violenta"
 natural_disaster.5902.desc:0 "As notícias do desastre recente são sombrias, e o povo encontra-se em desordem. Governantes das regiões vizinhas observam a destruição com interesse, avaliando cuidadosamente a extensão dos danos.\n\nUm esforço deve ser feito para conter a crise e recuperar o que for possível. Seria imprudente permanecer inerte enquanto isso acontece."
 natural_disaster.6901.a:0 "O caminho para restaurar a ordem é longo."
 natural_disaster.6901.desc.earthquake:0 "A terra silencia, e o solo em [epicenter_county.GetNameNoTier] não treme mais. O que antes era um próspero [epicenter_county.GetTierAsNameNoTooltip] agora jaz em ruínas, com apenas alguns edifícios permanecendo de pé."
 natural_disaster.6901.desc.flood:0 "Finalmente, as águas do [river_region.GetNameNoTooltip] retornaram ao normal. Poças profundas ainda permanecem espalhadas pela região, mas o sol brilha forte, e logo o excesso de água será drenado da terra."
 natural_disaster.6901.desc:0 "\n\nHá um sentimento de alívio, mas sem dúvida a região é apenas uma sombra de si mesma. Esta devastação será lembrada por anos, atormentando a alma dos sobreviventes."
 natural_disaster.6901.t:0 "[situation.GetNameNoTooltip]: As Consequências"
 natural_disaster.6902.a:0 "Esperemos que os esforços sejam suficientes."
 natural_disaster.6902.desc:0 "Nobres e plebeus celebram o fim do [situation.GetNameNoTooltip]. A alegria é passageira, pois os efeitos do desastre logo se revelarão. Esforços estão em andamento para restaurar o que foi perdido e confortar aqueles que foram vítimas da desordem."
 natural_disaster.6911.a:0 "\"As despesas são altas, preciso do tesouro.\""
 natural_disaster.6911.desc:0 "[minister_helper.GetName], um assistente de [minister.GetTitledFirstName], inspeciona o local do [situation.GetNameNoTooltip]\n\n\"Minhas condolências, [ROOT.Char.GetNameNoTooltip]. Fui enviado por [minister.GetTitledFirstNameNoTooltip] para ajudá-lo a recuperar a situação. O ministério está disposto a fazer o que for necessário, já que [minister.GetTopLiege.GetTitledFirstName] espera uma recuperação rápida.\""
 natural_disaster.6911.minister_censor:0 "\"Combater a corrupção é o que preciso.\""
 natural_disaster.6911.minister_chancellor:0 "\"É uma honra receber tamanha graça de [minister.GetHerHis].\""
 natural_disaster.6911.minister_grand_marshal:0 "\"Preciso manter a ordem.\""
 natural_disaster.6911.minister_of_justice:0 "$natural_disaster.6911.a.minister_censor$"
 natural_disaster.6911.minister_of_personnel:0 "\"Serei a extensão da influência de [minister.GetTitledFirstNamePossessiveNoTooltip].\""
 natural_disaster.6911.minister_of_revenue:0 "\"São necessários alívios fiscais.\""
 natural_disaster.6911.minister_of_rites:0 "\"Orações ajudarão bastante.\""
 natural_disaster.6911.minister_of_war:0 "\"Mais fortificações impedirão novos desastres.\""
 natural_disaster.6911.minister_of_works:0 "\"O reassentamento das vítimas é prioridade máxima.\""
 natural_disaster.6911.t:0 "[situation.GetNameNoTooltip]: Ministro Envia Ajuda"
 natural_disaster.7001.a.tt.already_in_diarchy:0 "Você já está [power_sharing|E] e não precisa fazer alterações para acomodar esta carga extra."
 natural_disaster.7001.a.tt.discount:0 "Contribuições para projetos de recuperação do [disaster|E] custarão #v 10% menos#! enquanto você estiver [power_sharing|E]."
 natural_disaster.7001.a.tt:0 "Você entrará em regência até que o desastre alcance a fase de Recuperação $game_concept_situation_phase$."
 natural_disaster.7001.a:0 "Este desastre exige minha #EMP total#! atenção!"
 natural_disaster.7001.b.tt:0 "Você pode $isolate_family_decision$"
 natural_disaster.7001.b:0 "Devemos cuidar dos nossos!"
 natural_disaster.7001.c:0 "Que [ROOT.Char.GetFaith.HighGodName] nos ajude!"
 natural_disaster.7001.desc:0 "[epicenter_county.GetProvince.GetCounty.GetFaith.HouseOfWorshipPlural|U] e santuários em [epicenter_county.GetNameNoTier] começaram a ruir devido aos tremores, causando medo até nos mais fiéis. É evidente que o tremor não cessará, aumentando de intensidade a cada momento."
 natural_disaster.7001.t:0 "[epicenter_county.GetNameNoTierNoTooltip]: Tremores Profanos"
 natural_disaster.7011.d:0 "A natureza percebe os sinais, enquanto permanecemos complacentes."
 natural_disaster.7011.desc:0 "Os animais em [epicenter_county.GetNameNoTier] iniciaram um êxodo em massa, pois os tremores ameaçam seu habitat. As aves começaram uma migração antecipada, suas bandadas obscurecendo a luz do céu.\n\nAlgumas pessoas seguem o caminho dos animais em busca de segurança, mas muitos residentes permanecem em suas casas, na esperança de que os tremores passem."
 natural_disaster.7011.t:0 "[epicenter_county.GetNameNoTierNoTooltip]: Fauna em Fuga"
 natural_disaster.7021.a:0 "Essas águas estão fora de controle."
 natural_disaster.7021.desc:0 "O vento empurra águas externas para o próximo [river_region.GetNameNoTooltip], levando a margem muito além de seus limites. Alguns coletam a água excedente para suas próprias necessidades, mas a água continua a transbordar.\n\nO campo ao redor torna-se um pântano, e a lama se acumula nos edifícios ao redor da cidade."
 natural_disaster.7021.t:0 "[river_region.GetNameNoTooltip]: Margens Inundadas"
 natural_disaster.7031.a:0 "Que os céus tenham piedade."
 natural_disaster.7031.desc:0 "Uma precipitação tão necessária cai sobre as terras próximas ao [river_region.GetNameNoTooltip], garantindo que a colheita continue conforme o planejado.\n\nEmbora a terra já esteja saturada, a chuva aumenta em intensidade e não mostra sinais de parar. O sol não aparece, e o rio começa a transbordar para o interior."
 natural_disaster.7031.t:0 "[river_region.GetNameNoTooltip]: Chuvas Torrenciais"
 natural_disaster.8001.a.tt.earthquake:0 "Um [earthquake|E] logo atingirá [epicenter_county.GetNameNoTier]"
 natural_disaster.8001.a.tt.flood:0 "O [river_region.GetName] irá [Concept('flood', 'Inundar')|E]"
 natural_disaster.8001.a:0 "Isso só pode significar uma coisa..."
 natural_disaster.8001.desc.earthquake:0 "Chegam notícias de grande perturbação em [epicenter_county.GetName]. A terra sob a região treme e se abala, com rachaduras surgindo na superfície. Pequenas construções começam a tombar.\n\nOs habitantes do [epicenter_county.GetTierAsNameNoTooltip] ficam inquietos, prejudicando os esforços organizacionais. Apesar do pânico, devo me empenhar para minimizar os danos e me preparar para a destruição iminente."
 natural_disaster.8001.desc.flood:0 "As águas do [river_region.GetName] subiram acima dos níveis normais, molhando o solo das áreas ao redor. Embora possa ajudar a fortalecer a colheita, a água continua a subir sem parar.\n\nSeria prudente interromper todas as construções na região até que as águas da enchente se estabilizem, e garantir que o máximo de pessoas possível alcance segurança."
 natural_disaster.8001.t.earthquake:0 "[epicenter_county.GetNameNoTierNoTooltip]: Rumores Profundos"
 natural_disaster.8001.t.flood:0 "[river_region.GetNameNoTooltip]: Nível Máximo das Águas"
 natural_disaster.8002.a.tt.earthquake:0 "Há um [earthquake|E] em andamento em [epicenter_county.GetNameNoTier]."
 natural_disaster.8002.a.tt:0 "Há uma [flood|E] em andamento no [river_region.GetName]."
 natural_disaster.8002.a:0 "Uma situação grave."
 natural_disaster.8002.desc.earthquake:0 "[epicenter_county.GetName] está sendo devastada por um violento terremoto. É provável que o [epicenter_county.GetTierAsNameNoTooltip] fique em ruínas, e seus habitantes sejam deslocados.\n\n"
 natural_disaster.8002.desc.flood:0 "O [river_region.GetName] transbordou, invadindo com suas águas os assentamentos próximos. Muitos edifícios foram abandonados, e é provável que qualquer colheita seja perdida."
 natural_disaster.8002.desc:0 "Recursos para auxiliar as vítimas e restaurar as regiões estão sendo estocados, mas ainda não conhecemos todos os desdobramentos do desastre."
 natural_disaster.8002.t:0 "[situation.GetNameNoTooltip]: Impacto Contínuo"
 natural_disaster.8003.a.tt.earthquake:0 "Houve um [earthquake|E] em [epicenter_county.GetNameNoTier]."
 natural_disaster.8003.a.tt:0 "Houve uma [flood|E] no [river_region.GetName]."
 natural_disaster.8003.a:0 "Devemos reconstruir."
 natural_disaster.8003.desc.earthquake:0 "Cidadãos fugindo esmagados por edifícios em queda, destroços bloqueando rotas de escape, incêndios e bandidagem...\n\nApenas algumas das atrocidades presenciadas pelos habitantes de [epicenter_county.GetNameNoTier] antes de seu recente terremoto."
 natural_disaster.8003.desc.flood:0 "Famílias arrastadas pela corrente, colheitas maduras perdidas na água, edifícios inundados...\n\nEsse é o destino da área ao redor do [river_region.GetName] após sua enchente."
 natural_disaster.8003.desc_outro:0 "\n\nEsforços de socorro estão em andamento, mas os danos sofridos podem muito bem permanecer na região."
 natural_disaster.8003.t:0 "[situation.GetNameNoTooltip]: Consequências"
 natural_disaster_5001_flood_tt:0 "Cada [county|E] no [realm|E] na [situation.GetName] [situation_sub_region.GetName] perdeu #N 1/[SCOPE.ScriptValue('natural_disaster_flood_development_loss_fraction_value')|0]#! de seu [development|E] #weak (Máx -5)#!"
 natural_disaster_allied_army_damaged_title:0 "[situation.GetType.GetName] Ataca o Exército Aliado"
 natural_disaster_army_damaged_title:0 "[situation.GetType.GetName] Ataca o Exército"
 natural_disaster_enemy_army_damaged_title:0 "[situation.GetType.GetName] Ataca o Exército Inimigo"
 natural_disaster_recovery_minister_of_revenue_tt:0 "Previne todos os [modifiers|E] negativos de [tax|E] provenientes de [contributions|E] em [great_project.GetName]"
 natural_disaster_recovery_minister_of_works_tt:0 "Previne todos os [modifiers|E] negativos do [domain|E] provenientes de [contributions|E] em [great_project.GetName]"
 travel_to_epicenter_county:0 "Planejar uma [travel|E] para [epicenter_county.GetName]"
