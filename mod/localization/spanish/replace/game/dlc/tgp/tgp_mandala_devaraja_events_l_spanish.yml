l_spanish:
 devaraja.0001.a:0 "Devo ajudar neste momento difícil, por mais miserável que o povo seja."
 devaraja.0001.b:0 "Deixarei esse trabalho para [Select_CString( steward.IsFemale, 'minha', 'meu' )] [steward.GetCouncilTitle], [steward.GetFirstNameNoTooltip], supervisionar o esforço."
 devaraja.0001.c:0 "Urgh! Este lugar imundo não é digno de receber caridade divina."
 devaraja.0001.desc:0 "O [diseased_county_scope.GetName] clama por alívio do mal que assola seu povo. Se há algum lugar no reino que precisa de caridade agora, é este. Mas, ao inspecionar o terreno em busca de um local de cura, o mais miserável dos camponeses se aproxima de mim. Em uma grosseira quebra de protocolo, [diseased_peasant.GetSheHe] cai de joelhos e mãos, implorando por ajuda.\n\nComo o #italic Devaraja#!, espera-se que eu eleve todos os meus súditos, mas... será que #italic isso#! é realmente o que devo salvar?"
 devaraja.0001.title:0 "Caridade Saudável"
 devaraja.0002.a.tt.failure:0 "Sua interrupção deixou o ritual constrangedor"
 devaraja.0002.a.tt.success:0 "A última linha é habilmente alterada para elogiá-lo"
 devaraja.0002.a:0 "\"Por que os mortos merecem tal mérito?\""
 devaraja.0002.b.tt.failure:0 "Você balbucia versos fracos, após interromper [brahmin_or_chaplain.GetFirstNameNoTooltip]."
 devaraja.0002.b.tt:0 "[brahmin_or_chaplain.GetFirstNameNoTooltip] fica aliviad[Select_CString( brahmin_or_chaplain.IsFemale, 'a', 'o' )] que o ritual ocorreu conforme o planejado"
 devaraja.0002.b:0 "Não deixe os pensamentos intrusivos vencerem!"
 devaraja.0002.c.quote.success:0 "\"Assim também tudo o que é dado aqui beneficia o #italic rei#!\""
 devaraja.0002.c.tt.success:0 "Seu raciocínio e conhecimento o fazem criar um verso final melhor na hora"
 devaraja.0002.c:0 "Interrompa com uma última linha melhor."
 devaraja.0002.desc.brahmin:0 "Enquanto meu [GetCourtPositionType('court_brahmin_court_position').GetName], [brahmin_or_chaplain.GetName], conclui os negócios oficiais do dia, [brahmin_or_chaplain.GetSheHe] começa a abençoar a corte com versos do #italic Anumodana#!, o cântico tradicional para encerrar o dia.\n\n#italic Assim como rios cheios de água enchem o vasto oceano,#!\n#italic Assim também o que é dado aqui beneficia os mortos famintos...#!\n\nUma pergunta de repente queima em minha mente. Ouso quebrar a etiqueta?"
 devaraja.0002.desc.chaplain:0 "Enquanto meu [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName], [brahmin_or_chaplain.GetName], conclui os negócios oficiais do dia, [brahmin_or_chaplain.GetSheHe] começa a abençoar a corte com versos do #italic Anumodana#!, o cântico tradicional para encerrar o dia.\n\n#italic Assim como rios cheios de água enchem o vasto oceano,#!\n#italic Assim também o que é dado aqui beneficia os mortos famintos...#!\n\nUma pergunta de repente queima em minha mente. Ouso quebrar a etiqueta?"
 devaraja.0002.title:0 "Orações ao Rei-Deus"
 devaraja.0003.a:0 "Ha! Muito bem! Dê a [guru_or_chaplain.GetSheHe] sua oferenda."
 devaraja.0003.b:0 "Esperto! Mas eu só recompenso o esforço."
 devaraja.0003.c:0 "Não recompenso preguiça! Guardas, prendam [guru_or_chaplain.GetSheHe]!"
 devaraja.0003.d.tt.failure:0 "Você se envergonha diante [Select_CString( guru_or_chaplain.IsFemale, 'da', 'do' )] [guru_or_chaplain.GetFirstNameNoTooltip] e de seus cortesãos, falhando em demonstrar compreensão do #italic Dharma#!"
 devaraja.0003.d.tt.success:0 "Você impressiona [guru_or_chaplain.GetFirstNameNoTooltip] e seus cortesãos com seu conhecimento sobre o #italic Dharma#!"
 devaraja.0003.d:0 "Chamem [guru_or_chaplain.GetFirstNameNoTooltip] novamente — eu farei perguntas a #italic [guru_or_chaplain.GetSheHe]#! sobre o #italic Dharma#!."
 devaraja.0003.desc.chaplain:0 "De tempos em tempos, espera-se que o [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName] faça um discurso sobre o conceito de #italic Dharma#! no palácio. Normalmente é um evento longo, estruturado e cheio de cânticos e formalidades, acompanhado de uma generosa oferenda ao orador em reconhecimento por seus esforços. Hoje, porém, [guru_or_chaplain.GetName] parece um tanto cansado.\n\nDe pé diante da audiência real, [guru_or_chaplain.GetSheHe] simplesmente declara: \"O [ROOT.Char.GetTitleTierName] já sabe tudo o que há para saber.\" Com isso, [guru_or_chaplain.GetSheHe] entoa as passagens usuais para encerrar o discurso e retorna ao seu assento."
 devaraja.0003.desc.guru:0 "De tempos em tempos, espera-se que o [GetCourtPositionType('court_guru_court_position').GetName] faça um discurso sobre o conceito de #italic Dharma#! no palácio. Normalmente é um evento longo, estruturado e cheio de cânticos e formalidades, acompanhado de uma generosa oferenda ao orador em reconhecimento por seus esforços. Hoje, porém, [guru_or_chaplain.GetName] parece um tanto cansado.\n\nDe pé diante da audiência real, [guru_or_chaplain.GetSheHe] simplesmente declara: \"O [ROOT.Char.GetTitleTierName] já sabe tudo o que há para saber.\" Com isso, [guru_or_chaplain.GetSheHe] entoa as passagens usuais para encerrar o discurso e retorna ao seu assento."
 devaraja.0003.title:0 "Um Discurso Especial sobre o Dharma"
 devaraja.0004.a:0 "O povo se emocionará ao ver os barcos passarem!"
 devaraja.0004.b.tt:0 "Desistir da ideia agora será notado"
 devaraja.0004.b:0 "Pedir ouro aos monastérios neste momento não é auspicioso."
 devaraja.0004.c:0 "A procissão acontecerá — sem envolvimento monástico."
 devaraja.0004.desc:0 "O [capital_county.GetName] foi marcado por lutas passadas, devastado por espadas e tempestades ao longo dos anos. Além das melhorias materiais, é nosso dever fazer algo para elevar o espírito do povo.\n\nNão seria maravilhoso realizar uma procissão de barcos na capital ao final da estação das chuvas? Setenta e seis flautistas poderiam liderar o navio principal, com cento e dez tocadores de tambor logo atrás. E, para completar o desfile, podemos pedir que cada monastério pague pela decoração de um barco!"
 devaraja.0004.title:0 "Eu Amo um Desfile"
 devaraja.0005.a:0 "Este lugar será consagrado aos deuses."
 devaraja.0005.b:0 "Este lugar será consagrado ao meu esplendor."
 devaraja.0005.desc:0 "Novos templos precisam de decorações — arte que reflita o divino e o poderoso. Para representar o aspecto divino [ROOT.Char.Custom('GetAspectNoun')|U] de nossa casa justa, podemos garantir que os afrescos e esculturas deste novo local mostrem visões dos deuses de [ROOT.Char.Custom('GetAspectNoun')|U] — ou representações da Casa de [ROOT.Char.GetHouse.GetName], aumentando ainda mais meu próprio prestígio."
 devaraja.0005.title:0 "A Muralha com Duas Faces"
 devaraja.0006.a:0 "Talvez eu deva ser mais modesto em público."
 devaraja.0006.b:0 "Ridículo! As festas continuarão enquanto eu quiser."
 devaraja.0006.c:0 "Isto é um insulto! Retirem [Select_CString( guru_or_chaplain.IsFemale, 'da', 'do' )] [guru_or_chaplain.GetFirstNameNoTooltip] seus títulos."
 devaraja.0006.d:0 "Talvez eu deva parar de beber completamente."
 devaraja.0006.desc.chaplain:0 "Meu [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], [guru_or_chaplain.GetName], foi visto remando um pequeno barco nas piscinas ao redor do palácio. Em meio à diversão com meus cortesãos, chamo o guru barqueiro do outro lado da água. “Você é meu [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]! Não tem respeito algum pelo alto cargo que ocupa? Como pode remar o próprio barco como um simples pescador?”\n\nApós uma breve pausa, [guru_or_chaplain.GetFirstNameNoTooltip] responde: “Quando o [ROOT.Char.GetTitleTierName] do país se entrega publicamente à devassidão, os [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]s podem remar seus próprios barcos.”"
 devaraja.0006.desc.guru:0 "Meu [GetCourtPositionType('court_guru_court_position').GetName], [guru_or_chaplain.GetName], foi visto remando um pequeno barco nas piscinas ao redor do palácio. Em meio à diversão com meus cortesãos, chamo o guru barqueiro do outro lado da água. “Você é meu [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip]! Não tem respeito algum pelo alto cargo que ocupa? Como pode remar o próprio barco como um simples pescador?”\n\nApós uma breve pausa, [guru_or_chaplain.GetFirstNameNoTooltip] responde: “Quando o [ROOT.Char.GetTitleTierName] do país se entrega publicamente à devassidão, os [GetCourtPositionType('court_guru_court_position').GetNameNoTooltip]s podem remar seus próprios barcos.”"
 devaraja.0006.title:0 "Sabedoria do Remo"
 devaraja.0007.a:0 "Sim, meus servos — eu sou o senhor de [ROOT.Char.Custom('GetAspectNoun')|U]."
 devaraja.0007.b:0 "Meu povo! Eu apenas sirvo a [ROOT.Char.Custom('GetAspectNoun')|U], não sou seu mestre."
 devaraja.0007.c.tt.failure:0 "Sua incursão na teologia só piorou a situação"
 devaraja.0007.c.tt.success:0 "Você formula um conceito de compromisso que agrada a pessoas suficientes"
 devaraja.0007.c:0 "A humanidade e a divindade estão unidas em mim, em uma existência mística."
 devaraja.0007.desc:0 "#italic Devaraja#! é um conceito delicado; eu sou, claro, um [ROOT.Char.GetTitleTierName], mas também estou associado à divindade de [ROOT.Char.Custom('GetAspectNoun')|U]. Sou eu o mesmo que um deus? Ah, essa é a questão delicada, uma que exige ambiguidade para que eu possa ser divino para uns e rei para outros.\n\nOu seria uma questão delicada e ambígua, se algum panegirista prolixo não tivesse acabado de me chamar de deus de [ROOT.Char.Custom('GetAspectNoun')|U]. Os cortesãos já estão em disputa, discutindo o que eu realmente sou — não há escolha senão me posicionar."
 devaraja.0007.title:0 "Ambiguidade Inequívoca"
 devaraja.0008.a.tt.conversion:0 "[ROOT.Char.GetName] agora afirma que seu ancestral [deathbed_conversion_ancestor.GetName] converteu-se à fé [suzerain.GetFaith.GetName]"
 devaraja.0008.a:0 "[deathbed_conversion_ancestor.GetName] era [suzerain.GetFaith.GetAdjective]? Posso acreditar nisso."
 devaraja.0008.b:0 "[deathbed_conversion_ancestor.GetRelationToString( ROOT.Char )] morreu como um(a) [deathbed_conversion_ancestor.GetFaith.GetAdherentName] e sempre será lembrado(a) assim!"
 devaraja.0008.desc:0 "[suzerains_missionary.GetNameNoTooltip], o missionário [Select_CString( suzerain.IsFemale, 'da', 'do' )] [suzerain.GetTitleTierName] [suzerain.GetFirstNameNoTooltip], quase tropeça em [Select_CString( suzerains_missionary.IsFemale, 'si mesma', 'si mesmo' )] ao se aproximar.\n\n“Tenho grandes notícias!”, exclama [suzerains_missionary.GetSheHe]. “Estive estudando a história de sua família e perguntando aos servos mais velhos tudo o que se lembram, e parece que seu ancestral, [deathbed_conversion_ancestor.GetName], na verdade se converteu à fé [suzerain.GetFaith.GetName] pouco antes de sua morte!”\n\n[suzerains_missionary.GetName] me olha com entusiasmo mal contido. “Você está mais próximo de [suzerain.GetFaith.HighGodName] do que imagina!”"
 devaraja.0008.title:0 "Rumores de Conversão no Leito de Morte"
 devaraja.0009.a.tt.missionary_now_chaplain:0 "[ROOT.Char.GetName] nomeou seu missionário [suzerains_missionary.GetName] como seu novo [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]"
 devaraja.0009.a:0 "[suzerains_missionary.GetName]! Junte-se a mim como meu novo [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]!"
 devaraja.0009.b:0 "[suzerains_missionary.GetName], seu trabalho aqui terminou — agora #italic vá embora#!."
 devaraja.0009.desc:0 "Minha adesão à fé [suzerain.GetFaith.GetName] deixou [suzerains_missionary.GetName] sem uma corte para pregar. Embora [suzerains_missionary.GetSheHe] esteja radiante com minha mudança de fé, [suzerains_missionary.GetSheHe] agora se vê tomado(a) pela incerteza sobre seu futuro."
 devaraja.0009.title:0 "Missionário Sem Missão"
 devaraja.0010.a.tt.converts:0 "[suzerains_missionary.GetName] adota a fé [suzerain.GetFaith.GetAdjective] de [suzerain.GetNamePossessive]"
 devaraja.0010.a.tt.unconverted:0 "[suzerains_missionary.GetName] permanece um(a) triste [suzerains_missionary.GetFaith.GetAdherentName]"
 devaraja.0010.a:0 "[suzerains_missionary.GetName] tomará sua própria decisão em seu próprio tempo."
 devaraja.0010.b.tt.failure:0 "[suzerains_missionary.GetName] permanece um(a) fiel [suzerains_missionary.GetFaith.GetAdherentName]"
 devaraja.0010.b.tt.success:0 "[suzerains_missionary.GetName] converte-se à fé [ROOT.Char.GetFaith.GetName]"
 devaraja.0010.b:0 "Talvez [suzerains_missionary.GetName] possa encontrar um novo propósito em [ROOT.Char.GetFaith.GetName]?"
 devaraja.0010.desc:0 "[suzerains_missionary.GetName], um(a) bom(boa) [suzerains_missionary.GetFaith.GetAdherentName], tem se tornado melancólico(a) devido à fé [suzerain.GetFaith.GetAdjective] de seu senhor. [suzerains_missionary.GetSheHe|U] está em um ponto decisivo; sua fé vacila enquanto [suzerains_missionary.GetSheHe] espera por um sinal. Cabe a você decidir se esse sinal virá de você ou de [suzerains_missionary.GetFaith.DivineRealm]."
 devaraja.0010.title:0 "A Fé Mais Solitária"
 devaraja_as_god:0 "Devaraja Divino"
 devaraja_as_hypostatic_union:0 "Devaraja de Dupla Natureza"
 devaraja_as_king:0 "Devaraja Real"
 devaraja_hosts_parade:0 "Grande Desfile do Devaraja"
 fervor_gain_deathbed_conversion_discovered:0 "Conversão no Leito de Morte Descoberta"
 fervor_gain_faith_reaffirmed:0 "Fé do Ancestral Reafirmada"
 healed_by_the_devaraja:0 "Curado pelo Devaraja"
