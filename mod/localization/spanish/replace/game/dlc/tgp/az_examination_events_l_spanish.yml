l_spanish:
 BOOK_OF_RITES:0 "Um clássico de ordem e harmonia, que prescreve a conduta apropriada para estudiosos, filhos e soberanos. Seguir seus preceitos é honrar os alicerces da civilização."
 CONFUCIAN_DE:0 "Refere-se ao poder ou virtude moral — uma força que permite a um indivíduo influenciar positivamente os outros e manter a harmonia social."
 FOUR_TREASURES:0 "Os Quatro Tesouros — pincel, tinta, papel e tinteiro — são as ferramentas essenciais do estudioso. Seu uso cuidadoso reflete disciplina, clareza e reverência pela tradição."
 az_examination.0001.a:0 "Oferecer um feedback gentil e construtivo."
 az_examination.0001.b:0 "Zombar das tentativas patéticas [entrant.GetHerHim]."
 az_examination.0001.c:0 "Comparar o trabalho [entrant.GetHerHim] com o dos antigos e escrever um comentário."
 az_examination.0001.desc:0 "M[Select_CString( entrant.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('entrant'))] [entrant.GetTitledHouseNameOrFirstName] faz uma leve reverência, apresentando um pergaminho cuidadosamente dobrado.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip],\" [entrant.GetSheHe] diz. \"Ofereço humildemente minhas composições para sua crítica. Trabalhei arduamente nestes versos — alguns são ousados em sua certeza, outros... refletem minha busca por equilíbrio. Agradeço por suas observações.\""
 az_examination.0001.intrigue:0 "\"Desde que se lembre de que sou eu quem está ajudando você.\""
 az_examination.0001.t:0 "Julgando o Pincel"
 az_examination.0002.a:0 "\"Obviamente um[Select_CString( debater.IsFemale, 'a', '' )] [debater.Custom2('InsultNoun', ROOT.Char)] como você não saberia ler isso direito!\""
 az_examination.0002.b:0 "\"Não há espaço para fantasia aqui.\""
 az_examination.0002.c:0 "\"Cada caminho em direção à sabedoria é único.\""
 az_examination.0002.d:0 "Deixar esse debate improdutivo."
 az_examination.0002.desc.debate:0 "[debater.GetFirstName], um representante do [debater_movement.GetName], $az_examination.0002.desc$"
 az_examination.0002.desc.exam:0 "[debater.Custom2('MyCharacterIntroduction', ROOT.Char)|U] $az_examination.0002.desc$"
 az_examination.0002.desc:0 "me encurrala enquanto saio do estudo. A expressão presunçosa no rosto [debater.GetHerHim] mostra que [debater.GetSheHe] esperava por uma chance de atacar um estudioso desavisado.\n\n\"Ninguém entende melhor os Anais da Primavera e Outono do que eu! As palavras de [Glossary('Kǒngzǐ', 'CONFUCIUS_GLOSS')] não são uma simples narração de eventos. Sua sutileza exalta os virtuosos e condena os ímpios. Você não concorda?\""
 az_examination.0002.t:0 "Desafio Público"
 az_examination.0003.a:0 "\"Permita-me demonstrar, [host_examiner.GetTitledFirstNameNoTooltip].\""
 az_examination.0003.b:0 "\"Por que ess[Select_CString( tea_offender.IsFemale, 'a', 'e' )] [tea_offender.Custom2('InsultNoun', ROOT.Char)] está nos servindo?\""
 az_examination.0003.c:0 "Permanecer em silêncio."
 az_examination.0003.desc:0 "[tea_offender.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima dos examinadores com uma bandeja de chá. [tea_offender.GetSheHe|U] serve com a mão errada, as mangas roçando o chão, e oferece as xícaras sem reverência ou bênção.\n\n[host_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] observa com desprezo frio. \"Você abandona os ritos apropriados em detrimento de sua virtude, [tea_offender.GetFirstNameNoTooltip],\" declara [host_examiner.GetSheHe], alto o suficiente para todos ouvirem. As mãos de [tea_offender.GetFirstNamePossessiveNoTooltip] tremem enquanto [tea_offender.GetSheHe] se curva rigidamente."
 az_examination.0003.t:0 "Serviço Desonroso"
 az_examination.0004.b:0 "Denunciar essa desonra e confiscar o pergaminho."
 az_examination.0004.c.tt:0 "Você se torna o dono de um [artifact|E] de pergaminho de [learning|E] de [GetTrait('confucian_education').GetName(GetNullCharacter)]"
 az_examination.0004.c.tt_equipped:0 "Comprou um [artifact_scroll.GetName]"
 az_examination.0004.c:0 "Comprar um pergaminho interessante do comerciante."
 az_examination.0004.d:0 "\"Não vi nada.\""
 az_examination.0004.desc:0 "Flagro [caught_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)] folheando nervosamente um manuscrito gasto, os olhos arregalados em um entusiasmo mal disfarçado.\n\n[caught_entrant.GetSheHe|U] gagueja: \"É... só para referência! Eu não ia usar isso na prova — de verdade!\" O comerciante, [merchant.GetTitledHouseNameOrFirstName], me lança um sorriso cúmplice. \"Um valioso auxílio de estudo, nobre senhor[Select_CString( ROOT.Char.IsFemale, 'a', '' )]. Apenas algumas moedas. Talvez um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] ilustre [ROOT.Char.GetWomanMan] como você queira o conjunto completo?\""
 az_examination.0004.t:0 "Respostas Proibidas"
 az_examination.0005.a:0 "“É um chamado para preservar a própria clareza moral.”"
 az_examination.0005.b:0 "“A ordem justa acima de tudo.”"
 az_examination.0005.c:0 "“Que... sensível da parte dele.”"
 az_examination.0005.china.a:0 "“É um chamado para preservar o que os antigos chamavam de [Glossary('de', 'CONFUCIAN_DE')].”"
 az_examination.0005.china.desc:0 "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está diante de uma estela de pedra gravada com um verso de Mêncio, com os dedos entrelaçados atrás de [fellow_examiner.GetHerHis] em contemplação.\n\n\"Li esta linha incontáveis vezes\", [fellow_examiner.GetSheHe] murmura enquanto você se aproxima, \"mas sua essência continua elusiva. Mêncio diz: 'Uma pessoa grandiosa é aquela que retém o coração de criança.' O que você acha disso, [ROOT.Char.GetTitledFirstNameNoTooltip]?\""
 az_examination.0005.china.t:0 "Refletindo sobre Mengzi"
 az_examination.0005.d:0 "“Cada um deve encontrar o próprio significado.”"
 az_examination.0005.desc:0 "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] chama sua atenção — olhando pensativamente para uma estela inscrita com texto clássico.\n\n\"Esta passagem me intriga há muito tempo\", [fellow_examiner.GetSheHe] diz suavemente. \"O que você diz, [ROOT.Char.GetTitledFirstNameNoTooltip]?\""
 az_examination.0005.korea.desc:0 "[fellow_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] está olhando para uma escultura em pedra, com caligrafia inconfundivelmente de Choe Chiwon, gravada em linhas fluidas. As mãos de [fellow_examiner.GetHerHis|U] descansam atrás de [fellow_examiner.GetHerHis], com os olhos distantes em reflexão.\n\n\"Choe escreveu estas palavras durante seu retorno da corte Tang\", [fellow_examiner.GetSheHe] diz baixinho enquanto você se junta a [fellow_examiner.GetHerHim]. \"Ele disse: 'O cavaleiro deve governar seu coração antes de governar os outros.' Tenho ponderado sobre elas desde que era aluno, e ainda me confundem.\""
 az_examination.0005.korea.t:0 "Refletindo sobre Choe Chiwon"
 az_examination.0005.t:0 "Meditando sobre um Verso Antigo"
 az_examination.0006.a:0 "“Vou me certificar disso pessoalmente.”"
 az_examination.0006.b:0 "“Todos ascendemos pela mão que nos é dada.”"
 az_examination.0006.c:0 "“Deixe que o trabalho [favored_entrant.GetHerHim] fale por si.”"
 az_examination.0006.desc:0 "Eu noto [favored_entrant.GetFirstName], parado um pouco perto demais de [local_ruler.GetTitledHouseNameOrFirstName]. Seus olhares se cruzam por tempo demais. “Eu não vou falhar com você, [favored_entrant.Custom2('RelationToMe', SCOPE.sC('local_ruler'))].” [favored_entrant.GetFirstNameNoTooltip] sussurra para si, sob o fôlego.\n\nQuando [local_ruler.GetTitleAsNameNoTooltip] me vê, [local_ruler.GetSheHe] rapidamente se aproxima de mim. “Garanto que [favored_entrant.GetSheHe|U] conquistou a posição [favored_entrant.GetHerHim]”, murmura [local_ruler.GetTitledFirstNameNoTooltip], um sorriso educado em seus lábios."
 az_examination.0006.t:0 "Piedade Familiar"
 az_examination.0007.a:0 "“Os clássicos não erram.”"
 az_examination.0007.b:0 "“Algumas gotas de resina de ginseng...”"
 az_examination.0007.c:0 "“Deixe os servos misturarem a tinta.”"
 az_examination.0007.desc:0 "[aged_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] prepara o segundo dos [Glossary('Quatro Tesouros', 'FOUR_TREASURES')] antes do exame. Moendo fuligem de pinho no tinteiro de bronze com movimentos deliberados e experientes, [aged_examiner.GetSheHe] mistura tinta de alta qualidade com maestria. Com um olhar afiado, [aged_examiner.GetSheHe] me entrega o pilão.\n\n“Agora é a sua vez. Esta tinta deve fluir como o luar sobre a água e durar mais do que impérios. A fórmula correta está no [Glossary('Livro dos Ritos', 'BOOK_OF_RITES')].”"
 az_examination.0007.t:0 "O Peso da Tinta"
 az_examination.0008.a.failure.tt:0 "O raciocínio d[Select_CString( examiner.IsFemale, 'a', 'o' )] [examiner.GetTitledFirstNamePossessive] supera o seu"
 az_examination.0008.a.success.tt:0 "Você supera [examiner.GetTitledHouseNameOrFirstName]"
 az_examination.0008.a:0 "“Vamos corrigir as respostas um do outro.”"
 az_examination.0008.b:0 "“Ah, aqueles dias... Vamos relembrar.”"
 az_examination.0008.c:0 "“Hoje não.”"
 az_examination.0008.desc:0 "Pergaminhos antigos de prática são desenrolados entre mim e [examiner.Custom2('MyCharacterIntroduction', ROOT.Char)]. “São de uma era anterior”, observa [examiner.GetSheHe], passando a mão reverentemente sobre o pergaminho. “Por que você não responde uma das perguntas — e me deixa avaliar sua resposta?”\n\n[ROOT.GetCharacter.Custom('quirk_pos_adverb')|U], ergo uma sobrancelha. Esses pergaminhos me fazem lembrar da época em que [memory.GetDescription]."
 az_examination.0008.t:0 "Um Desafio Oportuno"
 az_examination.0009.a:0 "“A culpa foi minha. Eu deveria ter prendido a caixa.”"
 az_examination.0009.b:0 "“Esse nível de desleixo é inaceitável!”"
 az_examination.0009.c:0 "“Limpe isso. Temos trabalho a fazer.”"
 az_examination.0009.desc:0 "A caixa atinge o chão com um estalo horrível. [clumsy_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)] encara horrorizado, ainda segurando o pincel, com tinta respingada nas pernas, enquanto [angry_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)] se aproxima furioso, com raiva nos olhos.\n\n“Você arruinou um dia inteiro de preparações!” brada [angry_examiner.GetSheHe]."
 az_examination.0009.t:0 "Um Acidente de Tintas"
 az_examination.0010.a:0 "Entregar a carta discretamente."
 az_examination.0010.b:0 "Expor a tentativa de [requesting_entrant.GetFirstNamePossessiveNoTooltip] de influenciar o exame."
 az_examination.0010.c.toast:0 "Uma revelação escandalosa!"
 az_examination.0010.c.tt:0 "Você descobre um [secret|E] pertencente [Select_CString( requesting_entrant.IsFemale, 'a', 'ao' )] [requesting_entrant.GetFirstName]"
 az_examination.0010.c:0 "Romper o selo e ler imediatamente."
 az_examination.0010.desc:0 "[requesting_entrant.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima em passos silenciosos, os olhos atentos sobre o ombro, e me apresenta um pergaminho.\n\n“Você poderia entregar isto a [target_examiner.GetTitledHouseNameOrFirstName]?” sussurra [requesting_entrant.GetSheHe]. “É... particular.”"
 az_examination.0010.t:0 "Um Favor Selado"
 az_examination.0011.a:0 "Denunciar o esquema diante de todos no salão."
 az_examination.0011.b.failure:0 "Os candidatos desconfiam de você"
 az_examination.0011.b.success:0 "Os candidatos se apegam a cada palavra sua"
 az_examination.0011.b:0 "Oferecer sua ajuda — e seu silêncio."
 az_examination.0011.c:0 "Incentivá-los silenciosamente a repensar."
 az_examination.0011.desc:0 "[sneaky_entrant_1.GetTitledHouseNameOrFirstName] se inclina em direção a [sneaky_entrant_2.GetTitledHouseNameOrFirstName]. Suas vozes são baixas, mas ainda consigo ouvir a conversa dos candidatos:\n\n“Se trocarmos de assento,” murmura [sneaky_entrant_2.GetTitledFirstNameNoTooltip], “o examinador de olhos gentis será quem avaliará meu ensaio.”"
 az_examination.0011.t:0 "Uma Troca de Assentos Sussurrada"
 az_examination.0012.a:0 "“Será uma honra.”"
 az_examination.0012.b:0 "“Devemos fazer espaço para mais um?”"
 az_examination.0012.c:0 "“Perdoe-me — tenho deveres com meus pergaminhos hoje.”"
 az_examination.0012.desc:0 "[senior_examiner.GetTitledHouseNameOrFirstName], um examinador respeitado, acena para mim com um sorriso gentil sob a sombra do pavilhão do jardim. “É sempre uma alegria conversar com aqueles que valorizam o aprendizado. Venha, junte-se a mim para um chá,” declara calorosamente [senior_examiner.GetSheHe]. Percebo o olhar ardente de inveja d[Select_CString( jealous_rival.IsFemale, 'a', 'o' )] [jealous_rival.Custom2('InsultAdjective', ROOT.Char)] [jealous_rival.Custom2('InsultNoun', ROOT.Char)] [jealous_rival.GetTitledHouseNameOrFirstName] do outro lado do pavilhão, aproximando-se com uma bandeja — claramente tentando conquistar o favor do examinador."
 az_examination.0012.t:0 "Um Convite Privado"
 az_examination.0013.a.failure:0 "Os pergaminhos continuam perdidos"
 az_examination.0013.a.success:0 "Você recupera os pergaminhos desaparecidos"
 az_examination.0013.a:0 "“Vamos procurar juntos — nós os encontraremos a tempo!”"
 az_examination.0013.b.failure:0 "Sua acusação é recebida com frieza e desprezo"
 az_examination.0013.b.success:0 "[calm_examiner.GetFirstNameNoTooltip] convenientemente “lembra” de ter movido os ensaios"
 az_examination.0013.b:0 "“Você está calmo demais para esta situação, [calm_examiner.GetFirstNameNoTooltip]. O que está escondendo?”"
 az_examination.0013.c:0 "“Eu simplesmente os reescreverei.”"
 az_examination.0013.d:0 "“Isso não é problema meu.”"
 az_examination.0013.desc:0 "“Eles sumiram!” exclama [fellow_assistant.GetTitledHouseNameOrFirstName], um assistente colega, abrindo gaveta após gaveta. “Os ensaios para a triagem — procurei em todos os lugares!”\n\nDo outro lado da sala, [calm_examiner.GetTitledHouseNameOrFirstName], um dos examinadores, folheia um livro distraidamente e murmura: “Entrar em pânico não vai trazê-los de volta.” Tenho certeza de que ess[Select_CString( calm_examiner.IsFemale, 'a', 'e' )] [calm_examiner.Custom2('InsultNoun', ROOT.Char)] tem algo a ver com isso."
 az_examination.0013.t:0 "Os Ensaios Desaparecidos"
 az_examination.0014.a:0 "“Suas expectativas serão atendidas.”"
 az_examination.0014.c:0 "“Seria eu um aprendiz digno?”"
 az_examination.0014.d:0 "“Sinto-me aquecido pela sua consideração.”"
 az_examination.0014.desc:0 "Acordo de um sobressalto. Eu... dormi na mesa? Ao tocar meu rosto, sinto a marca deixada pelo livro sobre o qual apoiei a cabeça.\n\nViro-me e vejo o Examinador [praising_examiner.GetTitledHouseNameOrFirstName], cujos passos me despertaram do sono. Um leve sorriso se forma em seus lábios. “Não se preocupe, jovem [ROOT.Char.GetWomanMan]. Seus esforços diligentes não passaram despercebidos e, com o tempo, sua dedicação certamente será recompensada.”\n\nPensar que minhas noites em claro e longas horas de leitura foram reconhecidas é gratificante."
 az_examination.0014.t:0 "Sob Pressão"
 az_examination.0015.a:0 "Inclino-me diante [proud_family_member.GetHerHim] com graça e gratidão."
 az_examination.0015.b:0 "Falarei com [proud_family_member.GetSheHe] mais tarde sobre discrição."
 az_examination.0015.c:0 "Baixo a cabeça e me misturo à multidão."
 az_examination.0015.d:0 "\"Eu farei você se orgulhar de mim, m[Select_CString( proud_family_member.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('proud_family_member'))]!\""
 az_examination.0015.desc:0 "[proud_family_member.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está próximo à beira da reunião, os olhos brilhando de orgulho.\n\n\"Ali! Esse é [Select_CString( ROOT.Char.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom('ComplimentAdjective')] [proud_family_member.Custom2('RelationToMeShort', ROOT.Char)]!\" A voz [proud_family_member.GetHerHim] ecoa, assustando os participantes próximos e atraindo olhares irritados."
 az_examination.0015.t:0 "Um[Select_CString( proud_family_member.IsFemale, 'a', '' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('proud_family_member'))|U] Orgulhos[Select_CString( proud_family_member.IsFemale, 'a', 'o' )]"
 az_examination.0016.a:0 "\"Você tem minha mais profunda gratidão.\""
 az_examination.0016.b:0 "\"Você me guiaria como seu aprendiz?\""
 az_examination.0016.c:0 "\"Essas palavras me levarão adiante.\""
 az_examination.0016.desc:0 "[kind_examiner.GetTitledFirstName], um[Select_CString( kind_examiner.IsFemale, 'a', '' )] respeitad[Select_CString( kind_examiner.IsFemale, 'a', 'o' )] examinador[Select_CString( kind_examiner.IsFemale, 'a', '' )], se aproxima silenciosamente, longe do burburinho dos participantes mais bem-sucedidos.\n\n\"Você pode não ter passado, mas não pense que seus esforços foram em vão. O caminho para o oficialato é longo — e às vezes tortuoso.\""
 az_examination.0016.t:0 "Algumas Palavras Gentis"
 az_examination.0017.b:0 "\"Essas palavras são minhas e apenas minhas.\""
 az_examination.0017.c:0 "Deixe [letter_examiner.GetFirstNameNoTooltip] ver isto."
 az_examination.0017.desc:0 "Ao ajustar minhas vestes, sinto um pedaço rígido de papel escondido no fundo da manga. Alguém deve ter colocado uma carta ali antes do exame.\n\nEla diz: \"Quando a dúvida enxamear como moscas, lembre-se: você estudou, você lutou e nunca cedeu.\"\n\nDo outro lado do pátio, vejo [letter_examiner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] carregando um feixe de pergaminhos. Nossos olhares se cruzam brevemente. N[letter_examiner.GetSheHe], eu poderia confiar e discutir o significado desta carta."
 az_examination.0017.t:0 "A Carta Oculta"
 az_examination.0018.b:0 "\"Deixe-me compartilhar o que aprendi.\""
 az_examination.0018.c:0 "\"Espero nunca acabar assim.\""
 az_examination.0018.d:0 "\"Você tem minha admiração, [old_exam_taker.Custom('ComplimentAdjective')] ser.\""
 az_examination.0018.desc:0 "Vejo uma figura sentada sozinha sob um guarda-sol — [old_exam_taker.Custom2('MyCharacterIntroduction', ROOT.Char)]. Sua postura levemente curvada, olhos afiados e cansados ao mesmo tempo.\n\n\"Nunca é tarde demais\", diz [old_exam_taker.GetSheHe], percebendo meu olhar. \"Mas é um longo caminho a percorrer nesta idade.\""
 az_examination.0018.t:0 "Um(a) Ancião(ã) Entre os Participantes"
 az_examination.0019.a:0 "\"Eu vou conseguir da próxima vez. Eu juro.\""
 az_examination.0019.b:0 "\"Você poderia... me ajudar?\""
 az_examination.0019.c:0 "Não consigo encarar [disappointed_relative.GetSheHe] agora..."
 az_examination.0019.desc.callous:0 "\"Você falhou,\" diz [disappointed_relative.GetSheHe] friamente, com um leve franzir de desaprovação no rosto [disappointed_relative.GetHerHim]."
 az_examination.0019.desc.compassionate:0 "\"Oh, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [entrant.Custom2('RelationToMe', ROOT.Char)],\" diz [disappointed_relative.GetSheHe], os olhos brilhando com lágrimas contidas. \"Você deu o seu melhor — isso é tudo o que eu sempre quis.\""
 az_examination.0019.desc.fallback:0 "\"Você chegou tão perto,\" diz [disappointed_relative.GetSheHe] suavemente, com a decepção claramente visível no rosto [disappointed_relative.GetHerHim]."
 az_examination.0019.desc.intro:0 "Ao sair da câmara, uma voz familiar chama meu nome.\n\n[disappointed_relative.GetFirstName] cruza meu olhar através da multidão, chamando em alta voz:"
 az_examination.0019.desc.shy:0 "\"Eu... eu vim ver você,\" murmura [disappointed_relative.GetSheHe], o rosto [disappointed_relative.GetHerHim] corando de forma constrangida. \"Sinto muito se — se isso for estranho.\""
 az_examination.0019.desc.wrathful:0 "\"Você trouxe vergonha para nós,\" sibila [disappointed_relative.GetSheHe], com uma fúria fria ardendo por trás do olhar [disappointed_relative.GetHerHim]."
 az_examination.0019.t:0 "O Peso da Expectativa"
 az_examination.0020.a:0 "\"Você mereceu isso. De verdade.\""
 az_examination.0020.b:0 "Rosno e redobro meus estudos."
 az_examination.0020.c:0 "De qualquer forma, estou mais preocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com outros assuntos."
 az_examination.0020.desc:0 "O pátio fervilha de vozes, ecoando orgulho e decepção em igual medida. Em meio ao redemoinho de vestes e pergaminhos, vejo meu par [successful_peer.GetFirstName]. Um olhar na manga [successful_peer.GetHerHim], bordada com o selo do Exame do Palácio, me diz tudo o que preciso saber.\n\n[successful_peer.GetSheHe|U] sorri enquanto se aproxima. Talvez por hábito, por pena ou por genuína alegria."
 az_examination.0020.t:0 "Um Par Ascende"
 tgp_brooding_reflection_modifier:0 "Reflexão Sombria"
 tgp_brooding_reflection_modifier_desc:0 "Este personagem se recolheu para dentro de si, refletindo profundamente — ou talvez remoendo seu fracasso."
 tgp_envy_fueled_study_modifier:0 "Disciplina Movida pela Inveja"
 tgp_envy_fueled_study_modifier_desc:0 "Este personagem está cheio de inveja e determinação, estudando com intensidade renovada para superar o fracasso e rivalizar com aqueles que o(a) ultrapassaram."
 tgp_examiner_encouragement_modifier:0 "Palavras de Encorajamento"
 tgp_examiner_encouragement_modifier_desc:0 "Este personagem carrega a bênção de um[Select_CString( kind_examiner.IsFemale, 'a', '' )] respeitad[Select_CString( kind_examiner.IsFemale, 'a', 'o' )] examinador[Select_CString( kind_examiner.IsFemale, 'a', '' )]."
 tgp_examiner_promise_modifier:0 "Altas Expectativas"
 tgp_examiner_promise_modifier_desc:0 "Este personagem prometeu estar à altura dos elogios de seus superiores e de toda a atenção que isso acarreta."
 tgp_ginseng_resin_modifier:0 "Mistura Experimental de Tinta"
 tgp_ginseng_resin_modifier_desc:0 "Os rituais silenciosos do estúdio agora permeiam cada gesto seu, conferindo uma sutileza refinada ao seu comportamento."
 tgp_letter_self_reflection_modifier:0 "Autorreflexão"
 tgp_letter_self_reflection_modifier_desc:0 "Este personagem carrega uma força silenciosa, derivada de palavras de encorajamento e crença familiar."
 tgp_not_getting_any_younger_modifier:0 "Não é o Meu Futuro"
 tgp_not_getting_any_younger_modifier_desc:0 "Este personagem viu um(a) participante idoso(a) em um exame que estava frequentando. Está determinado(a) a não deixar isso acontecer consigo."
