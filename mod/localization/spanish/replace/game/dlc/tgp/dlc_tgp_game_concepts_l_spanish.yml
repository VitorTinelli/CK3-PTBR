l_spanish:
 game_concept_ceremonial_claimant_faction:0 "$ceremonial_claimant_faction$"
 game_concept_ceremonial_claimant_faction_desc:0 "O $game_concept_claimant_faction$ busca instalar um determinado [claimant|E] como [ceremonial_liege|E]. Se bem-sucedido, o Ceremonial Liege atual terá que ceder seu [title|E] ao Reivindicante. Todos os membros da [faction|E] ganharão um [hook|E] sobre o Reivindicante."
 game_concept_ceremonial_claimant_factions:0 "Facções Reivindicantes Cerimoniais"
 game_concept_east_asian_estate:0 "Mansão do Leste Asiático"
 game_concept_east_asian_estate_building:0 "Edifício de Mansão do Leste Asiático"
 game_concept_east_asian_estate_building_desc:0 "$game_concept_east_asian_estate_buildings$ são melhorias únicas e persistentes em um/a [east_asian_estate|E].\n\nUma grande variedade de estruturas está disponível para construção e pode ser construída pelo dono da Mansão para gerar renda privada, expandir o/a [influence|E] da família e obter acesso a vários/as [decisions|E], [interactions|E] e muito mais."
 game_concept_east_asian_estate_buildings:0 "Edifícios de Mansão do Leste Asiático"
 game_concept_east_asian_estate_desc:0 "Um/a $game_concept_mansion$ é um tipo de [domicile|E] mantido por o/a [house_head|E] de [noble_families|E] notáveis dentro de [GetGovernment('japan_administrative_government').GetName] e [GetGovernment('japan_feudal_government').GetName] [realms|E]. Eles representam propriedades de terras privadas não vinculadas a nenhum/a [landed|E] [title|E] específico/a.\n\n[east_asian_estate|E] podem ser construídos aqui para expandir a riqueza e o/a [influence|E] da família, e o/a $game_concept_mansion$ será herdado/a pelas gerações futuras."
 game_concept_east_asian_estates:0 "Mansões do Leste Asiático"
 game_concept_faction_imperial_policy:0 "Política Imperial"
 game_concept_family_mansion:0 "Mansão Familiar"
 game_concept_family_mansions:0 "Mansões Familiares"
 game_concept_imperial_policy_faction:0 "$imperial_policy_faction$"
 game_concept_imperial_policy_faction_desc:0 "A $game_concept_imperial_policy_faction$ busca mudar a [imperial_policy|E] do [realm|E], adotando uma nova [law|E] selecionada pelo líder da facção."
 game_concept_imperial_policy_factions:0 "Facções de Política Imperial"
 game_concept_mansion:0 "Mansão"
 game_concept_mansion_building:0 "Edifício de Mansão"
 game_concept_mansion_buildings:0 "Edifícios de Mansão"
 game_concept_mansions:0 "Mansões"
 game_concept_meritocratic:0 "Meritocrático"
 game_concept_meritocratic_bureaucracy:0 "Burocracia Meritocrática"
 game_concept_meritocratic_bureaucracy_desc:0 "$game_concept_meritocratic_bureaucracy$ representa um nível de centralização [meritocratic|E] [realm_possessive|E] e o poder geral que o [ruler|E] exerce sobre seus [vassals|E].\n\nApenas o [top_liege|E] pode alterar $game_concept_meritocratic_bureaucracy$. Os $game_concept_vassals$ meritocráticos usam o mesmo nível de seu $game_concept_liege$.\n\nExistem quatro níveis de $game_concept_meritocratic_bureaucracy$:\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_0$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_1$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_2$\n$EFFECT_LIST_BULLET$$meritocratic_bureaucracy_3$\n\nAumentar $game_concept_meritocratic_bureaucracy$ custa uma quantidade de [prestige|E] dependendo do [realm_size|E] e da [learning_skill|E] do governante."
 game_concept_meritocratic_desc:0 "$game_concept_meritocratic$ é um [government_form|E] [government_bureaucratic_type|E] similar ao [celestial|E], no qual o [liege|E] nomeia personagens como [governors|E], dos quais existem dois tipos, Civil e Militar.\n\nOs personagens têm acesso a [influence|E], [noble_families|E] e [family_estates|E].\n\n[rulers|E] independentes possuem [legitimacy|E], enquanto [vassals|E] focam em obter [merit|E]."
 game_concept_meritocratic_i:0 "@government_type_meritocratic!"
 game_concept_steppe_admin:0 "Canato Meritocrático"
 game_concept_steppe_admin_desc:0 "$game_concept_steppe_admin$ é um [government_form|E] [government_bureaucratic_type|E] similar aos [celestial|E] e [meritocratic|E], mas originário de um $game_concept_government_form$ [nomadic|E]. O [liege|E] nomeia personagens como [governors|E], dos quais existem dois tipos, Civil e Militar. Mantêm [tributaries|E], aplicam [obedience|E] e possuem um [dread|E] máximo mais alto.\n\nOs personagens têm acesso a [influence|E], [noble_families|E] e [family_estates|E].\n\n[rulers|E] independentes possuem [legitimacy|E], enquanto [vassals|E] focam em obter [merit|E]."
 game_concept_steppe_admin_i:0 "@government_type_steppe_admin!"
