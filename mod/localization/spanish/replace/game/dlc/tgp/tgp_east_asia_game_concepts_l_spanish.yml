l_spanish:
 game_concept_aspect:0 "Aspecto"
 game_concept_aspect_of_creation:0 "Aspecto da Criação"
 game_concept_aspect_of_creation_desc:0 "Com a promessa de estimular a produção e gerar abundância para seus seguidores, o Aspecto da Criação concede bônus para empreendimentos econômicos e organizacionais.\n$EFFECT_LIST_BULLET$Foca em [stewardship|E]\n$EFFECT_LIST_BULLET$Prêmios encadeados de construção acumulam [GetModifier('mandala_creator_modifier').GetNameWithTooltip|L] stacks\n$EFFECT_LIST_BULLET$Construções regulares concedem [piety|E]\n$EFFECT_LIST_BULLET$Criar [legitimate|E] [children|E] concede [piety|E]\n$EFFECT_LIST_BULLET$Tem acesso ao #high [GetScheme('coerce_contribution').GetTypeName]#! [scheme|E]\n$EFFECT_LIST_BULLET$Só pode morrer por [death_natural_cause|E] ou [death_religious|E] [character_death_deaths|E]"
 game_concept_aspect_of_destruction:0 "Aspecto da Destruição"
 game_concept_aspect_of_destruction_desc:0 "O medo e o terror são a forma de governar. O verdadeiro poder está na capacidade de extinguir vidas. O Aspecto da Destruição concede bônus para quem divide e conquista.\n$EFFECT_LIST_BULLET$Foca em [martial|E]\n$EFFECT_LIST_BULLET$Concede bônus para modificadores militares\n$EFFECT_LIST_BULLET$Tem acesso ao #high [GetCasusBelliType('mandala_plunder_cb').GetName]#! [casus_belli|E]\n$EFFECT_LIST_BULLET$Só pode morrer por [death_natural_cause|E], [death_religious|E] ou [death_combat|E] [character_death_deaths|E]"
 game_concept_aspect_of_serenity:0 "Aspecto da Serenidade"
 game_concept_aspect_of_serenity_desc:0 "Um reino pacífico é um reino próspero — o Aspecto da Serenidade valoriza a tranquilidade e negociações diplomáticas, concedendo bônus para quem se alinha a ele.\n$EFFECT_LIST_BULLET$Foca em [diplomacy|E]\n$EFFECT_LIST_BULLET$Evitar [wars|E] ofensivas é priorizado pelos [GetModifier('mandala_increments_of_peace_modifier').GetNameWithTooltip|L] stacks\n$EFFECT_LIST_BULLET$[GetScheme('sway').GetTypeName] e [GetScheme('befriend').GetTypeName] [schemes|E] têm mais sucesso\n$EFFECT_LIST_BULLET$Pode também solicitar #high $request_great_project_contribution_interaction$s#! de [allies|E]\n$EFFECT_LIST_BULLET$Só pode morrer por [death_natural_cause|E] ou [death_religious|E] [character_death_deaths|E]"
 game_concept_aspect_of_trickery:0 "Aspecto da Astúcia"
 game_concept_aspect_of_trickery_desc:0 "Benévolo ou ardiloso; o Aspecto do Trapaceiro recompensa a habilidade de controlar outros sem que percebam. Para que serve a divindade se não para moldar o mundo à sua imagem?\n$EFFECT_LIST_BULLET$Foca em [intrigue|E]\n$EFFECT_LIST_BULLET$Pode usar [piety|E] para subornar [agents|E] em [schemes|E]\n$EFFECT_LIST_BULLET$Tem acesso ao #high [GetScheme('leverage_contribution').GetTypeName]#! [scheme|E]\n$EFFECT_LIST_BULLET$Só pode morrer por [death_natural_cause|E], [death_religious|E] ou [death_murder|E] [character_death_deaths|E]"
 game_concept_aspects:0 "Aspectos"
 game_concept_decree:0 "Decreto"
 game_concept_decrees:0 "Decretos"
 game_concept_expansion_decree:0 "Expansão"
 game_concept_mandala:0 "Mandala"
 game_concept_mandala_aspect:0 "Aspecto Mandala"
 game_concept_mandala_aspect_desc:0 "Para que um [mandala|E] [ruler|E] alcance reverência e divindade eternas, ele precisa alinhar-se com um dos Aspectos que o identificam como um deus.\n\nOs Aspectos disponíveis são: \n$EFFECT_LIST_BULLET$[aspect_of_creation|E]\n$EFFECT_LIST_BULLET$[aspect_of_serenity|E]\n$EFFECT_LIST_BULLET$[aspect_of_destruction|E]\n$EFFECT_LIST_BULLET$[aspect_of_trickery|E]\n\nEstes Aspectos impactarão certas expectativas e ações realizadas pelo Governante."
 game_concept_mandala_aspects:0 "Aspectos Mandala"
 game_concept_mandala_decree:0 "Decreto Mandala"
 game_concept_mandala_decree_desc:0 "Os $game_concept_mandala_decrees$ são os três Decretos mandatados pelo [mandala|E] [ruler|E] — simbolizados por [prosperity_decree|E], [expansion_decree|E] e [reverence_decree|E].\n\nGeralmente, o reino Mandala possui uma autoridade muito centralizada, onde o poder sobre os [subjects|E] e [laws|E] pertence ao Governante associado, que pode alterá-los conforme necessário com pouca ou nenhuma objeção dos seus habitantes."
 game_concept_mandala_decree_expansion:0 "Decreto de Expansão"
 game_concept_mandala_decree_expansion_desc:0 "O [GetLaw('mandala_decree_expansion').GetName] determina que todos os [subjects|E] concentrem seus esforços em expandir o [realm|E].\n\nAumentar o número de soldados, acomodações militares e apoiar quaisquer [wars|E] dirigidas pelo [mandala|E] [ruler|E] é imperativo."
 game_concept_mandala_decree_prosperity:0 "Decreto de Prosperidade"
 game_concept_mandala_decree_prosperity_desc:0 "Com o [GetLaw('mandala_decree_prosperity').GetName], o [mandala|E] [ruler|E] foca em estimular e inspirar todos os [subjects|E] a promover mudanças construtivas.\n\nOs esforços são direcionados para avançar o [development|E], [buildings|E], acumular riqueza, assim como fortalecer a comunidade por meio de relações pessoais."
 game_concept_mandala_decree_reverence:0 "Decreto de Reverência"
 game_concept_mandala_decree_reverence_desc:0 "O [GetLaw('mandala_decree_reverence').GetName] determina que os [subjects|E] do [mandala|E] concentrem seus esforços em promover a espiritualidade e a adoração.\n\n[pilgrimages|E], rituais e [piety|E] são os pilares deste Decreto Mandala."
 game_concept_mandala_decrees:0 "Decretos Mandala"
 game_concept_mandala_desc:0 "Sob a [government_form|E] $game_concept_mandala$, o [domain_limit|E] e a quantidade de [direct_vassals|E] são limitados. Em vez disso, o [liege|E] e o [suzerain|E] dependem de [tributaries|E] para expandir seu domínio.\n\nUm [ruler|E] Mandala pode aspirar a ser visto como um Rei-Deus, ou Devaraja, e então depende de [mandala_radiance|E] para adquirir e manter $game_concept_tributaries$.\n\nUm $game_concept_ruler$ deve manter [opinion|E] e fortalecer relações com seus $game_concept_tributaries$ para mantê-los a longo prazo. Na sucessão, os $game_concept_tributaries$ podem se dispersar, a menos que o $game_concept_ruler$ seja um [mandala_succesor|E] digno."
 game_concept_mandala_government:0 "Governo Mandala"
 game_concept_mandala_government_desc:0 "$game_concept_mandala_desc$"
 game_concept_mandala_i:0 "@government_type_mandala!"
 game_concept_mandala_radiance:0 "Esplendor Mandala"
 game_concept_mandala_radiance_desc:0 "O magnetismo para atrair e manter [subjects|E] para um [ruler|E] [mandala|E] é denominado Esplendor Mandala. É uma combinação de seu [piety_level|E], o nível do #V [GetBuilding('mandala_capital_01').GetTypeName]#! [great_building|E], bem como o nível de [mandala_aspect|E].\n\nRecompensas maiores, mais Sujeitos e mais poder aguardam aqueles que combinam os três para se tornarem mais Radiantes."
 game_concept_mandala_ritual:0 "Ritual Mandala"
 game_concept_mandala_ritual_desc:0 "Rituais Mandala são tarefas que aparecem ocasionalmente para [mandala|E] [rulers|E] — é um sinal de que uma parte particular do seu [realm|E] necessita de sua orientação e elevação divina.\n\nSer mais habilidoso em seu [mandala_aspect|E] aumentará quaisquer ganhos ao aparecer para seus [subjects|E]."
 game_concept_mandala_ritual_tier:0 "Nível do Ritual Mandala"
 game_concept_mandala_ritual_tier_desc:0 "O [ritual_tier|E] de um [mandala_ritual|E] indica o quanto aquele destino se beneficiaria da sua orientação, bem como as recompensas para você pessoalmente."
 game_concept_mandala_rituals:0 "Rituais Mandala"
 game_concept_mandala_succesor:0 "Sucessor Devaraja"
 game_concept_mandala_succession:0 "Sucessão Mandala"
 game_concept_mandala_succession_desc:0 "Quando um [ruler|E] [mandala|E] falece e escolheu um [mandala_aspect|E], seu [heir|E] enfrenta as Provas de $game_concept_mandala_succession$. Nessas Provas, o Herdeiro é submetido a Desafios de [skill|E] que testam sua competência na Habilidade do Aspecto associada, bem como em outras duas Habilidades de Aspecto.\n\nConseguir sucesso nestas provas significa que o Herdeiro conseguiu convencer seus seguidores de que é um sucessor digno e o [realm|E] permanece estável.\n\n#EMP Falhar#!, no entanto, acarretará penalidades crescentes:\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 1#! Desafio falhado: Perda de um [piety_level|E] e uma pequena quantidade de [tributaries|E] se libertam.#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold 2#! Desafios falhados: Perda de dois [piety_levels|E] e todos os Tributários se libertam.#!\n\n#indent_newline:6 $BULLET_WITH_TAB$#bold Todos#! Desafios falhados: Perda de três [piety_levels|E] e destruição do [realm|E].#!"
 game_concept_mandala_succession_succession:0 "Sucessão"
 game_concept_mandala_trials:0 "Provas Mandala"
 game_concept_mandalas:0 "Mandalas"
 game_concept_prosperity_decree:0 "Prosperidade"
 game_concept_radiance:0 "Esplendor"
 game_concept_radiant:0 "Radiante"
 game_concept_reverence_decree:0 "Reverência"
 game_concept_ritual:0 "Ritual"
 game_concept_ritual_tier:0 "Nível do Ritual"
 game_concept_rituals:0 "Rituais"
 game_concept_tribute:0 "Tributo"
 game_concept_tribute_mission:0 "Missão de Tributo"
 game_concept_tribute_mission_desc:0 "Como um [tributary|E], respeito, assim como Tributos, precisam ser pagos ao [suzerain|E] regularmente.\n\nFalhar em fazê-lo pode acarretar uma série de consequências, sendo a mais benigna a perda de [legitimacy|E]."
 game_concept_tribute_missions:0 "Missões de Tributo"
 game_concept_tributes:0 "Tributos"
