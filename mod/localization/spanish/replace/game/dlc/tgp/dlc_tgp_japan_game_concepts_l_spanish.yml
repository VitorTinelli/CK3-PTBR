l_spanish:
 ceremonial_liege_concept:0 "[ceremonial_liege|E]"
 ceremonial_regent_concept:0 "[ceremonial_regent|E]"
 game_concept_aspiration:0 "Aspiração"
 game_concept_aspirations:0 "Aspirações"
 game_concept_ceremonial_house:0 "Casa Cerimonial"
 game_concept_ceremonial_house_desc:0 "A $game_concept_ceremonial_house$ refere-se à [house|E] do [ceremonial_liege|E] de um [realm|E]."
 game_concept_ceremonial_liege:0 "Monarca Cerimonial"
 game_concept_ceremonial_liege_desc:0 "Em certos [realms|E] (como o Japão), um burocrata ou comandante poderoso pode ter assumido o verdadeiro poder como um [ceremonial_regent|E], deixando um $game_concept_ceremonial_liege$ nominal apenas como figura decorativa e [vassal|E] na prática. Todos os membros de uma [house|E] $game_concept_ceremonial_liege_possessive$ são considerados parte da [ceremonial_house|E].\n\nApesar de não governar diretamente, a $game_concept_ceremonial_house$ é a linhagem mais prestigiada de um reino, e outras [houses|E] ganharão mais [prestige|E] em casamentos com eles, com essas conexões influenciando fortemente a sucessão do $game_concept_ceremonial_regent$.\n\nO $game_concept_ceremonial_liege$ pode recuperar o verdadeiro poder se de alguma forma reconquistar o [primary_title|E] do reino, como por exigência da [faction|E] ou competindo pelo [title|E] do $game_concept_ceremonial_regent$ usando [influence|E]."
 game_concept_ceremonial_liege_possessive:0 "do Monarca Cerimonial"
 game_concept_ceremonial_regency:0 "Regência Governante"
 game_concept_ceremonial_regent:0 "Regente Governante"
 game_concept_ceremonial_regent_desc:0 "$game_concept_ceremonial_regent$ é o termo geral para qualquer [top_liege|E] que governa de fato em nome de um [ceremonial_liege|E], como o #italic $game_concept_tenno$#! japonês.\n\nO nome do cargo $game_concept_ceremonial_regent_possessive$ pode mudar dependendo das circunstâncias políticas atuais; no Japão, eles podem ser referidos como [kampaku|E] ou [shogun|E]."
 game_concept_ceremonial_regent_possessive:0 "do Regente Governante"
 game_concept_ceremonial_regents:0 "Regentes Governantes"
 game_concept_cloistered_emperor:0 "Imperador Aposentado"
 game_concept_cloistered_emperor_desc:0 "Um $game_concept_cloistered_emperor$ é um [tenno|E] aposentado que governa de fato como [ceremonial_regent|E] para o Imperador reinante.\n\nPara se tornar $game_concept_cloistered_emperor$, um Imperador deve abdicar do #V Chrysanthemum Throne#! e tornar-se Monge."
 game_concept_cloistered_emperor_possessive:0 "do Imperador Aposentado"
 game_concept_family_manor:0 "Solar Familiar"
 game_concept_family_manors:0 "Solares Familiares"
 game_concept_house_aspiration:0 "Aspiração da Casa"
 game_concept_house_aspiration_desc:0 "Uma $game_concept_house_aspiration$ representa os objetivos e métodos de uma [house|E] japonesa, e cada uma fornece diferentes bônus e oportunidades.\n\nO [house_head|E] pode escolher qual Aspiração seguir e gastar [prestige|E] para se comprometer ainda mais com ela, obtendo acesso a benefícios mais poderosos."
 game_concept_house_aspirations:0 "Aspirações da Casa"
 game_concept_house_relation:0 "Relação entre Casas"
 game_concept_house_relation_desc:0 "Quando duas [houses|E] interagem, elas podem desenvolver uma $game_concept_house_relation$ positiva ou negativa, que perdura ao longo das gerações.\n\nAlém de afetar a [opinion|E] de todos os membros da $game_concept_house$, cada nível de $game_concept_house_relation$ pode ter efeitos adicionais, como facilitar ou dificultar a formação de [alliances|E] e o início de [wars|E].\n\nA $game_concept_house_relation$ permanece no mesmo nível até que a soma de todas as ações alcance #P +100%#! ou #N -100%#!. Então, a $game_concept_house_relation$ avança para o próximo nível, seja positivo ou negativo."
 game_concept_house_relations:0 "Relações entre Casas"
 game_concept_imperial_policies:0 "Políticas Imperiais"
 game_concept_imperial_policy:0 "Política Imperial"
 game_concept_imperial_policy_desc:0 "A $game_concept_imperial_policy$ é uma [law|E] definida pelo [top_liege|E] do Japão que se aplica a todos os [vassals|E]. Diferentes políticas podem restringir ou permitir ações, ou conceder efeitos em todo o [realm|E]."
 game_concept_japan_administrative:0 "$japan_administrative_government$"
 game_concept_japan_feudal:0 "$japan_feudal_government$"
 game_concept_japanese_bureaucracy:0 "Burocracia Japonesa"
 game_concept_japanese_bureaucracy_desc:0 "$game_concept_japanese_bureaucracy$ representa o nível de centralização de um [ritsuryo_government|E] [realm_possessive|E] e o poder geral que o [ruler|E] exerce sobre seus [vassals|E].\n\nApenas o [top_liege|E] pode alterar $game_concept_japanese_bureaucracy$. Os $game_concept_vassals$ japoneses usam o mesmo nível que seu $game_concept_liege$.\n\nExistem quatro níveis de $game_concept_japanese_bureaucracy$:\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_0$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_1$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_2$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_3$\n\nAumentar o $game_concept_japanese_bureaucracy$ custa uma quantidade de [prestige|E] dependendo do [realm_size|E] e da [learning_skill|E] do governante."
 game_concept_japanese_emperor:0 "Imperador Japonês"
 game_concept_japanese_emperor_desc:0 "O $game_concept_tenno$ é o Imperador oficial de todo $e_japan$, embora o verdadeiro poder esteja geralmente nas mãos do [ceremonial_regent|E], que administra o estado em seu nome."
 game_concept_japanese_emperor_possessive:0 "do Imperador Japonês"
 game_concept_japanese_manor:0 "Solar Japonês"
 game_concept_japanese_manor_building:0 "Construção do Solar Japonês"
 game_concept_japanese_manor_building_desc:0 "$game_concept_japanese_manor_buildings$ são melhorias únicas e permanentes de um [japanese_manor|E].\n\nUma grande variedade de estruturas está disponível para construção e pode ser erguida pelo proprietário do Solar para gerar renda privada, expandir o [influence|E] da família e obter acesso a várias [decisions|E], [interactions|E] e mais."
 game_concept_japanese_manor_buildings:0 "Construções do Solar Japonês"
 game_concept_japanese_manor_desc:0 "Um $game_concept_manor$ — ou [Glossary('Shōen', 'SHOEN_GLOSS')] — é um tipo de [domicile|E] mantido pelo [house_head|E] de [noble_families|E] notáveis dentro dos [GetGovernment('japan_administrative_government').GetName] e [GetGovernment('japan_feudal_government').GetName] [realms|E]. Eles representam propriedades privadas não vinculadas a nenhum [landed|E] [title|E] específico.\n\n[japanese_manor_building|E] pode ser construído aqui para expandir a riqueza e [influence|E] da família, e o $game_concept_manor$ será herdado pelas gerações futuras."
 game_concept_japanese_manors:0 "Solares Japoneses"
 game_concept_joko:0 "Jōkō"
 game_concept_joko_possessive:0 "do Jōkō"
 game_concept_kampaku:0 "Kampaku"
 game_concept_kampaku_desc:0 "[Glossary( 'Kampaku', 'KAMPAKU_GLOSS' )] é, de fato, a posição mais alta na burocracia [ritsuryo|E], exercendo controle significativo sobre os órgãos do Estado na ausência do [tenno_possessive|E].\n\nEmbora geralmente dominada pela família [Glossary('Fujiwara', 'FUJIWARA_GLOSS')], com influência [influence|E] e prestígio [prestige|E] suficientes, qualquer família pode ascender à posição."
 game_concept_kampaku_possessive:0 "do Kampaku"
 game_concept_manor:0 "Solar"
 game_concept_manor_building:0 "Construção do Solar"
 game_concept_manor_buildings:0 "Construções do Solar"
 game_concept_manors:0 "Solares"
 game_concept_restored_emperor:0 "Imperador Restaurado"
 game_concept_restored_emperor_desc:0 "Um $game_concept_restored_emperor$ é um [tenno|E] que governa independentemente de um [ceremonial_regent|E].\n\nPara se tornar um $game_concept_restored_emperor$, um [tenno|E] pode ser instalado por uma facção $restore_ceremonial_liege_faction_name$ [faction|E], ou usar a [GetDecisionWithKey('tgp_japan_emperor_restoration_decision').GetName] [decision|E] após se tornar [ceremonial_regent|E]."
 game_concept_restored_emperor_possessive:0 "do Imperador Restaurado"
 game_concept_ritsuryo:0 "$japan_administrative_government$"
 game_concept_ritsuryo_government:0 "Governo $japan_administrative_government$"
 game_concept_ritsuryo_government_desc:0 "$japan_administrative_government_desc$"
 game_concept_ritsuryo_i:0 "@government_type_ritsuryo!"
 game_concept_shoen:0 "Shōen"
 game_concept_shogun:0 "Shōgun"
 game_concept_shogun_desc:0 "Um $game_concept_shogun$, ou Ditador, é o governante de fato do [soryo_government|E] de todo o Japão, que consolidou sua posição a ponto de sua sucessão ser hereditária, governando no lugar do [tenno_possessive|E]."
 game_concept_shogun_possessive:0 "do Shōgun"
 game_concept_soryo:0 "$japan_feudal_government$"
 game_concept_soryo_government:0 "Governo $japan_feudal_government$"
 game_concept_soryo_government_desc:0 "$japan_feudal_government_desc$"
 game_concept_soryo_i:0 "@government_type_soryo!"
 game_concept_tenno:0 "Ten'nō"
 game_concept_tenno_possessive:0 "do Ten'nō"
