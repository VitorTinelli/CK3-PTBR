 game_concept_silk_road_situation:0 "Rota da Seda"
 game_concept_silk_road_situation_desc:0 "A $game_concept_silk_road_situation$ não é uma única estrada, mas sim uma vasta rede de rotas que conectam os cantos mais distantes da civilização, permitindo a troca de ouro, mercadorias e ideias. Ter acesso à Rota da Seda é ter acesso a todas as riquezas do mundo.\n\nDiferentes níveis de acesso à Rota da Seda concedem variados bônus de ouro e podem oferecer oportunidades únicas de desbloquear [innovations|E] exóticas. A quantidade de ouro e conhecimento que circula pela Rota da Seda muda conforme sua prosperidade, que é influenciada por diversos fatores, incluindo guerras, eventos e o [dynastic_cycle|E] da China."
