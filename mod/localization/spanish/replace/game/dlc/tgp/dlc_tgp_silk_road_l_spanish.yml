 tgp_silk_road_events.0010.desc:0 "Caminhando entre as movimentadas barracas de [ROOT.Char.GetCurrentLocation.GetName], meu guia menciona ouvir fragmentos de conversa, \"[innovation_temp.GetName]\" é repetido várias vezes. A cidade está em alvoroço com isso, mas suas vozes se abaixam quando veem estranhos como eu passando.\n\nAvisto um grupo de comerciantes reunidos sob uma barraca que parecem menos cautelosos, e continuam falando mesmo quando meu guia e eu nos aproximamos. Será esta minha chance de aprender?"
