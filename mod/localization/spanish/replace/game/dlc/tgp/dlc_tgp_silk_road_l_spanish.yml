 game_concept_silk_road_innovation:0 "Inovação da Rota da Seda"
 game_concept_silk_road_innovation_desc:0 "As $game_concept_silk_road_innovations$ são [innovations|E] que se espalham para o oeste ao longo da [silk_road_situation|E].\n\nA cada [GetDefine('NSilkRoad', 'INNOVATION_TRAVEL_DURATION')|0V] anos, uma $game_concept_silk_road_innovation$ descoberta pela cultura Han será aleatoriamente atribuída à [situation_sub_region|E] da China, com todas as outras $game_concept_silk_road_innovations$ se movendo para o oeste ao longo da $game_concept_silk_road$.\n\n$game_concept_cultures$ com a tradição [GetCultureTradition('tradition_sinophilic').GetName] têm acesso a todas as $game_concept_silk_road_innovations$ descobertas pela cultura Han.\n\n[rulers|E] fora da $game_concept_silk_road$ podem tentar trazer conhecimento de volta à sua [culture|E] através da decisão [GetDecisionWithKey('visit_silk_road_market_decision').GetName|V]. Se bem-sucedido, a $game_concept_silk_road_innovation$ pode ser descoberta como qualquer outra $game_concept_innovation$ ao retornar."
 game_concept_silk_road_innovation_i:0 "@silk_road_icon!"
 game_concept_silk_road_innovation_short:0 "Inovação da Rota da Seda"
