 situation_silk_road_phase_exceptional_bounty_desc:0 "Tesouros impressionantes podem ser obtidos, os maiores lucros podem ser conquistados e ideias e inovações se espalham mais amplamente quando os tempos estão prósperos na Rota da Seda."
 situation_silk_road_phase_hardship:0 "Dificuldade"
 situation_silk_road_phase_hardship_desc:0 "Devido a guerras, calamidades e reviravoltas imprevisíveis do destino, a Rota da Seda está completamente paralisada. Nem dinheiro nem ideias estão circulando — e a única coisa que se ganha ao seguir suas rotas é miséria e pobreza."
