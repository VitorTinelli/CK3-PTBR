 create_bunga_mas_decision:0 "Criar Bunga Mas"
 create_bunga_mas_decision_confirm:0 "Requisitar Bunga Mas"
 create_bunga_mas_decision_desc:0 "As árvores feitas da mais fina prata e ouro — um tesouro primoroso para conceder como tributo. Levarei à corte do meu suserano e me deleitarei em sua glória!"
