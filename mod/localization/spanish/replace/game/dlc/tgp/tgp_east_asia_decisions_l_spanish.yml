l_spanish:
 BUNGA_MAS_GLOSS:0 "O Bunga Mas, ou Flores Douradas e Prateadas, era uma forma de tributo utilizada na Península Malaia. Consistia em duas pequenas árvores feitas da mais alta qualidade de ouro e prata."
 CHOOSE_DECREE_DECISION_NEXT_STEP_BUTTON:0 "Escolher Decreto Devaraja"
