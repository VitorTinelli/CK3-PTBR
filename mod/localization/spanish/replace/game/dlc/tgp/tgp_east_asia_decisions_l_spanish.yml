 all_muslim_vassals_change_to_clan:0 "Todos os [vassals|E] [de_jure|E] da [faith|E] [GetReligionByKey('islam_religion').GetAdjective] adotarão o [government|E] [GetGovernment('clan_government').GetName]"
 assimilate_to_mandala_decision:0 "Assimilar-se ao Governo Mandala"
 assimilate_to_mandala_decision_confirm:0 "Todos saúdem o Devaraja!"
 assimilate_to_mandala_decision_desc:0 "Somos meros humanos, guiados por um ser maior do que nós mesmos. Devemos adaptar nossos modos e nos transformar verdadeiramente em devotos desta divina existência Devaraja — para o bem do nosso povo, é claro."
 assimilate_to_mandala_decision_faith_desc:0 "Devemos observar este exemplo e nos assimilar. Como verdadeiros devotos desta existência Devaraja, certamente viveremos vidas mais plenas — e quem sabe; talvez até tenhamos a chance de nos unir aos poucos favorecidos..."
 assimilate_to_mandala_decision_government_desc:0 "Uma divindade caminhando sobre a terra — a organização de tal governo parece apenas beneficiar nossa existência. Vamos ver o que podemos aprender ao nos assimilarmos a essa forma de governo."
