 fengshan_option:0 "Por ordem do Céu"
 local_rites.1.desc:0 "Embora uma oferenda sagrada possa ser feita em qualquer templo, até mesmo no meu santuário local em [capital_location.GetNameNoTooltip], é claro que nem todos os espaços sagrados são iguais.\n\nUma visita a uma comunidade de templo dedicada pode ser bastante demorada, mas provavelmente será mais impressionante."
 local_rites.1.fengshan.tt:0 "Uma oferenda única por dinastia com um impacto profundo\nEsta oferenda custará [treasury_i][THIS.ScriptValue('major_treasury_value')|-0] e [prestige_i][THIS.ScriptValue('massive_prestige_value')|-0] em troca de [piety_i][THIS.ScriptValue('major_piety_gain')|+0] e [legitimacy_i][THIS.ScriptValue('massive_legitimacy_gain')|+0]"
 local_rites.1.forest:0 "Os templos da floresta de [forest_location.GetNameNoTooltip]"
 local_rites.1.hills:0 "O santuário nas colinas ondulantes de [hills_location.GetNameNoTooltip]"
 local_rites.1.home.tt:0 "Uma oferenda em um santuário local em [tooltip_loc.GetNameNoTooltip] nos poupará da viagem.\nUma oferenda aqui custará [gold_i][THIS.ScriptValue('miniscule_gold_value')|-0] em troca de [piety_i][THIS.ScriptValue('minor_piety_gain')|+0]"
 local_rites.1.home:0 "Nosso próprio santuário será suficiente"
 local_rites.1.major_shrine.tt:0 "Uma oferenda aqui custará [gold_i][THIS.ScriptValue('medium_gold_value')|-0] ou [prestige_i][THIS.ScriptValue('medium_prestige_value')|-0] em troca de [piety_i][THIS.ScriptValue('major_piety_gain')|+0]"
 local_rites.1.major_shrine:0 "Os santuários em [point_of_interest_location.GetNameNoTooltip]"
 local_rites.1.mount_tai:0 "Devo ir fazer meu sacrifício ritual no Monte Tai"
 local_rites.1.mountains:0 "Os santuários nas montanhas de [mountains_location.GetNameNoTooltip]"
 local_rites.1.normal.tt:0 "Uma oferenda aqui custará [gold_i][THIS.ScriptValue('minor_gold_value')|-0] ou [prestige_i][THIS.ScriptValue('minor_prestige_value')|-0] em troca de [piety_i][THIS.ScriptValue('medium_piety_gain')|+0]"
 local_rites.1.t:0 "Uma Jornada Sagrada"
 local_rites.1.temple_holding:0 "O templo de [temple_holding_location.GetNameNoTooltip]"
 local_rites.2.toast:0 "Você chegou ao Santuário"
 local_rites.3.desc_at_home:0 "Uma oferenda no santuário da família [shrine_location.GetName] talvez não seja tão impressionante quanto uma feita em um grande templo, mas pode ser igualmente importante como ato de devoção.\n\nEnquanto realizo a oferenda ritual, sou tomado por uma paz interior que não sentia há muito tempo."
 local_rites.3.desc_cynical:0 "\n\nMal consigo conter meu desgosto, mas talvez eu deva fazer o que se espera de mim."
 local_rites.3.desc_forest_shrine:0 "Chegar ao pequeno santuário em [shrine_location.GetName] significou viajar sob um dossel de árvores por uma boa distância. É difícil imaginar um ambiente mais pacífico e reconfortante, e percebo que recordarei este momento por muito tempo após o fim de minha peregrinação.\n\n“Deveríamos considerar ajudar a comunidade local e garantir a prosperidade deste santuário.” Viro-me para encontrar [companion.GetName] me olhando com uma expressão curiosa."
 local_rites.3.desc_hills_shrine:0 "A paisagem ondulante de [shrine_location.GetName] é bela e, quando chegamos ao santuário para minha oferenda, já sinto uma paz interior que às vezes parecia fora de alcance.\n\nAo chegar ao último degrau do templo, [companion.GetNameNo] me olha. “Há uma pequena comunidade aqui que existe para sustentar este santuário. Talvez pudéssemos demonstrar nosso apoio a eles?”"
 local_rites.3.desc_holding_shrine:0 "Ao chegar ao santuário em [shrine_location.GetName], encontro-me refletindo sobre seu papel e importância. Há santuários mais renomados, mas isso não significa que este não seja uma comunidade monástica exemplar. Ver a devoção de todos que vivem aqui é inspirador.\nEnquanto me preparo para partir, [companion.GetName] se volta para mim. “Este é um lugar sagrado, e meus pensamentos devem se voltar ao divino, mas aqueles que se dedicam ao seu cuidado também são dignos de nossa reverência.”"
 local_rites.3.desc_important_shrine:0 "Os santuários em [shrine_location.GetName] são tão impressionantes quanto antigos, e seus zeladores parecem acostumados a visitantes importantes. Ao observar o local sagrado onde incontáveis devotos prestaram suas homenagens antes de mim, sou tomado por uma espécie de reverência.\n\n“O patrocínio é um aspecto importante da manutenção de locais sagrados como este. Visitantes costumam fazer doações para apoiar a comunidade monástica.” [companion.GetName] me olha de maneira educada, mas um tanto inquisitiva."
 local_rites.3.desc_mountain_shrine:0 "Subir os muitos degraus até o santuário no topo da montanha em [shrine_location.GetName] é cansativo, mas também propício à reflexão. Este ato de peregrinação é algo em que provavelmente pensarei por muito tempo após a conclusão de minha oferenda ritual.\n\nAo alcançarmos o pico, [companion.GetName] se volta para mim. “Manter um local como este é algo admirável. Talvez haja uma forma de apoiarmos os monges daqui? É costumeiro.”"
 local_rites.3.desc_mt_tai_huangdi:0 "Poucos testemunharam um Ritual Fengshan no Monte Tai, mas há poucos que não sabem o que ele significa. Um novo altar foi erguido com o solo no cume do Monte Tai, e, muito abaixo, a terra foi limpa em homenagem à própria terra.\n\nA maioria dos meus predecessores nunca tentou mediar entre o Céu e a Terra; é raro ter essa oportunidade de proteger o futuro da dinastia [GetTitleByKey('h_china').GetBaseNameNoTierNoTooltip]."
 local_rites.3.fallback.t:0 "Sacrifício aos Deuses"
 local_rites.3.pay_at_home:0 "“Que assim seja”"
 local_rites.3.pay_gold:0 "Vamos fazer uma doação"
 local_rites.3.pay_prestige:0 "Nada tenho a oferecer além da minha devoção"
 local_rites.3.t.fengshan:0 "Feng e Shan"
 local_rites.3.t:0 "Sacrifício ao Céu"
 local_shrine.optout.flavor:0 "Uma visita a um santuário pode ser arranjada em outra ocasião"
 local_shrine.optout:0 "Assuntos mundanos exigem minha atenção"
