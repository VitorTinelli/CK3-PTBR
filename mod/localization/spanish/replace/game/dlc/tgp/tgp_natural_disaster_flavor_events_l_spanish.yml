l_spanish:
 natural_disaster_flavor_events.0001.a.artifact.toast:0 "Você encontrou um artefato"
 natural_disaster_flavor_events.0001.a.gold.toast:0 "Você encontrou algum ouro"
 natural_disaster_flavor_events.0001.a.provisions.toast:0 "Você encontrou algumas provisões comestíveis"
 natural_disaster_flavor_events.0001.a:0 "Vasculhar as ruínas em busca de valores."
 natural_disaster_flavor_events.0001.b.failure.toast:0 "Sua busca foi em vão"
 natural_disaster_flavor_events.0001.b.success.toast:0 "Encontrou e resgatou um sobrevivente"
 natural_disaster_flavor_events.0001.b:0 "Vamos procurar por sobreviventes."
 natural_disaster_flavor_events.0001.c:0 "Não há nada aqui para nós."
 natural_disaster_flavor_events.0001.desc:0 "Entre os destroços, saqueadores se reúnem para se alimentar daqueles infelizes que não prestaram atenção ao aviso das forças da natureza. Fios sineiros se rompem dos cadáveres, expondo sua carne pútrida para qualquer um que tenha coragem de olhar.\n\nPoucos arriscariam vasculhar essas terras amaldiçoadas, mas onde outros falham, novas oportunidades surgem."
 natural_disaster_flavor_events.0001.t:0 "Quando os Saqueadores Se Reúnem"
 natural_disaster_flavor_events.0005.a.failure.toast:0 "Você não encontra segurança a tempo"
 natural_disaster_flavor_events.0005.a.success.toast:0 "Você encontrou um local relativamente seguro"
 natural_disaster_flavor_events.0005.a:0 "Cada um por si!"
 natural_disaster_flavor_events.0005.b.failure.toast:0 "Seu conhecimento sobre tais forças é insuficiente"
 natural_disaster_flavor_events.0005.b.success.toast:0 "Você encontrou um abrigo razoável"
 natural_disaster_flavor_events.0005.b:0 "Preciso sair daqui, rapidamente."
 natural_disaster_flavor_events.0005.desc:0 "Sou despertado de meu sono por gritos de pessoas correndo pelo acampamento em todas as direções. No meio da confusão, tento me manter firme para entender o que está acontecendo, mas sou abalado profundamente quando um estrondo desconhecido se aproxima ao longe.\n\nPara o que quer que esteja prestes a acontecer, devo agir agora antes que seja tarde demais."
 natural_disaster_flavor_events.0005.t:0 "Pesadelo Desperto"
 natural_disaster_flavor_events.0010.a.failure.toast:0 "A multidão esperou tempo demais"
 natural_disaster_flavor_events.0010.a.success.toast:0 "Reassegurou a multidão de que a ajuda está a caminho"
 natural_disaster_flavor_events.0010.a:0 "Assegure-lhes que a ajuda está a caminho."
 natural_disaster_flavor_events.0010.b.failure.toast:0 "O povo vê através de suas mentiras"
 natural_disaster_flavor_events.0010.b.success.toast:0 "Você mentiu para a multidão"
 natural_disaster_flavor_events.0010.b:0 "Invente uma mentira para aqueles que procuram respostas."
 natural_disaster_flavor_events.0010.c.tt:0 "Seu séquito empurra a frágil multidão para o lado com facilidade."
 natural_disaster_flavor_events.0010.c:0 "Não deixe que suas mãos sujas me toquem!"
 natural_disaster_flavor_events.0010.desc:0 "Uma multidão de desamparados e despossuídos se aglomera à beira da calamidade. Emoções percorrem o amontoado esfarrapado – o ar rasgado por soluços, lamentações e gritos.\n\nAo ver meu séquito, eles avançam quase em uníssono, meio mortos e de olhos vazios, mãos estendidas e caindo de joelhos em súplica.\n\nEles acreditam que viemos ajudá-los, mas quanto posso fazer por tantos?"
 natural_disaster_flavor_events.0010.t:0 "Almas Desesperadas"
 natural_disaster_flavor_events.0015.a.failure:0 "Sofreu ferimentos"
 natural_disaster_flavor_events.0015.a.success:0 "Você escapou do desastre ileso"
 natural_disaster_flavor_events.0015.a:0 "Resgate [Select_CString( spouse.IsFemale, 'sua', 'seu' )] cônjuge [spouse.GetFirstNameNoTooltip]."
 natural_disaster_flavor_events.0015.b.failure:0 "$natural_disaster_flavor_events.0015.a.failure$"
 natural_disaster_flavor_events.0015.b.success:0 "$natural_disaster_flavor_events.0015.a.success$"
 natural_disaster_flavor_events.0015.b:0 "Ajude [Select_CString( heir.IsFemale, 'sua herdeira', 'seu herdeiro' )] [heir.GetFirstNameNoTooltip]."
 natural_disaster_flavor_events.0015.c.failure:0 "$natural_disaster_flavor_events.0015.a.failure$"
 natural_disaster_flavor_events.0015.c.success:0 "$natural_disaster_flavor_events.0015.a.success$"
 natural_disaster_flavor_events.0015.c:0 "Auxilie [Select_CString( courtier.IsFemale, 'sua cortesã', 'seu cortesão' )] [courtier.GetFirstNameNoTooltip]."
 natural_disaster_flavor_events.0015.d:0 "Salve #EMP a si mesmo.#!"
 natural_disaster_flavor_events.0015.desc:0 "Um passeio casual pelo jardim com [spouse.GetFirstName], [heir.GetFirstName] e [courtier.GetFirstName] de repente se transforma em um pesadelo.\n\nUm grito penetrante ecoa pela cidade, espalhando terror e desespero por todos que estão ao alcance. Olho para [spouse.GetFirstNameNoTooltip] em busca de confirmação, mas o rosto de [spouse.GetHerHis] já diz tudo o que preciso saber.\n\nSem ao menos pensar, sei que precisamos encontrar um local mais seguro do que o que estamos."
 natural_disaster_flavor_events.0015.t:0 "Atos de Altruísmo"
 random_misc_artifact:0 "Anel Abandonado"
 random_misc_artifact_desc:0 "Um peculiar anel desenterrado entre algumas ruínas atingidas pela própria natureza."
 tgp_abandoned_population_modifier:0 "População Abandonada"
 tgp_abandoned_population_modifier_desc:0 "Esta província tem mentirosos e covardes como líderes."
 tgp_deceitful_overconfidence_character_modifier:0 "Abandonando os Desamparados"
 tgp_deceitful_overconfidence_character_modifier_desc:0 "Este personagem escolheu abandonar os poucos que buscavam orientação em tempos difíceis."
 tgp_finding_safe_spot_character_modifier:0 "Um Local Seguro"
 tgp_finding_safe_spot_character_modifier_desc:0 "A percepção deste personagem sobre o ambiente o levou à segurança."
 tgp_selfish_actions_character_modifier:0 "Faca de Dois Gumes"
 tgp_selfish_actions_character_modifier_desc:0 "A resistência deste personagem se mostrou valiosa durante um encontro com a natureza."
