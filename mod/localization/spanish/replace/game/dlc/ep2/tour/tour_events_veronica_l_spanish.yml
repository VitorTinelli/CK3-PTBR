l_spanish:
 alcohol_fountain_modifier:0 "Fonte Maravilhosa"
 alcohol_fountain_modifier_desc:0 "Este personagem decidiu fazer a fonte jorrar álcool em vez de água."
 appreciated_culture_modifier:0 "Valorizou a Cultura deles"
 artifact_cultural_gift_desc:0 "Um presente dado em comemoração a um festival cultural."
 available_because_intent_tt:0 "#EMP #low Esta opção está disponível por causa da sua [intent|E] de [THIS.Char.GetInvolvedActivityIntent.GetName|V]#!#!"
 brothel_stop_modifier:0 "Forças Renovadas"
 brothel_stop_modifier_desc:0 "Este personagem parou em vários bordéis ao longo do caminho."
 cultural_acceptance_embraced_festival:0 "Festival Cultural Abraçado"
 cultural_acceptance_farm_contest:0 "Concurso Animal"
 cultural_acceptance_feast_of_fools:0 "Endossado Festival dos Tolos"
 cultural_acceptance_insulted_festival:0 "Festival Cultural Ignorado"
 cultural_festival.2000.a:0 "\"Vamos começar!\""
 cultural_festival.2000.desc.again_bad:0 "#EMP Ah#! estar aqui, #EMP novamente#!, é um dos maiores castigos do destino. Ter que lidar com a sua incrivelmente presença entediante pode ser o maior desafio. Felizmente, estou aqui também para"
 cultural_festival.2000.desc.again_good:0 "Ah! Como é maravilhoso colocar os pés aqui novamente! Mal posso esperar para ver quais apresentações esplêndidas e refeições deliciosas que [stop_host_scope.GetSheHe] preparou para mim desta vez. E"
 cultural_festival.2000.desc.again_intimidation:0 "lembrá-los da minha última visita. Estou prestes a tornar esta igualmente #EMP inesquecível.#!"
 cultural_festival.2000.desc.again_lovers:0 "Eu mal podia esperar para voltar a essas terras! Como me lembro de desfrutar de seus costumes e tradições da última vez, e como anseio ver minha querida [stop_host_scope.GetFirstNameNoTooltip] novamente.\n\nE, é claro, para"
 cultural_festival.2000.desc.again_neutral:0 "Não foi tão terrível da última vez, então estou realmente esperando que seja igualmente suportável agora. Certamente poderia usar um pouco de entretenimento, longe das intrigas cortesãs. E, é claro, para"
 cultural_festival.2000.desc.again_rivals:0 "Ah, colocar os pés #EMP novamente#! em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] é comparável apenas a visitar as profundezas do [ROOT.Char.GetFaith.NegativeAfterLife] em si. Felizmente, estou de volta para"
 cultural_festival.2000.desc.first_time_bad:0 "Então, aqui estamos nós, prestes a participar de um festival chato — medíocre no máximo — que o tolo do [stop_host_scope.GetFirstNameNoTooltip] teve a decência de preparar. Felizmente, estou aqui para"
 cultural_festival.2000.desc.first_time_good:0 "Ah, como anseio me deliciar com as grandes atividades e alegrias que tenho certeza de que [stop_host_scope.GetFirstNameNoTooltip] preparou — e"
 cultural_festival.2000.desc.first_time_lovers:0 "Mal posso esperar para visitar essas terras pela primeira vez, sua bela paisagem e os céus maravilhosos que [stop_host_scope.GetFirstNameNoTooltip] tantas vezes me descreveu na cama. E"
 cultural_festival.2000.desc.first_time_neutral:0 "Não posso dizer que não estou intrigado com os costumes desta terra e o que [stop_host_scope.GetFirstNameNoTooltip] tem a me oferecer. E, em troca, eu"
 cultural_festival.2000.desc.first_time_rivals:0 "Ah, a quantidade de vezes que sonhei em devastar as terras decadentes [stop_host_scope.GetHerHim], de visitar o castelo que [stop_host_scope.GetSheHe] tanto se gabou apenas para descobrir que é pior que o meu.\n\nMal posso esperar para ver aquele buraco fedorento. Felizmente, estou aqui para"
 cultural_festival.2000.desc.intimidation:0 "mostrar [stop_host_scope.GetSheHe] como um [ROOT.Char.GetTitleAsNameNoTooltip] deve governar."
 cultural_festival.2000.desc.intro:0 "As ruas de [ROOT.Char.GetCurrentLocation.GetName] estão ricamente decoradas para minha chegada, e meu vassalo, [stop_host_scope.GetTitledFirstName], me espera obedientemente.\n\n"
 cultural_festival.2000.desc.majesty:0 "mostrar a essas pessoas a extensão da minha magnificência."
 cultural_festival.2000.desc.taxation:0 "aliviar suas bolsas do peso de seu ouro."
 cultural_festival.2000.t:0 "Festival Cultural em [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]"
 cultural_festival.2001.a:0 "Bem... isso certamente doeu."
 cultural_festival.2001.b:0 "\"Traga um médico imediatamente!\""
 cultural_festival.2001.c:0 "\"Eu farei você ser chicoteado por sua incompetência!\""
 cultural_festival.2001.desc.child:0 "Conforme [injured_artist.GetSheHe] cai no chão, seu capuz cai, revelando o rosto de [injured_artist.GetName], [injured_artist.Custom('GetDaughterSon')], filho(a) [stop_host_scope.GetTitledFirstNamePossessive]."
 cultural_festival.2001.desc.intro:0 "A música no palco principal é prontamente seguida pelos dançarinos. A beleza de seus movimentos faz com que pareçam parte do palco. Eles lançam as mãos ao ar e é como assistir às árvores crescendo novos galhos.\n\nUm suspiro vem da plateia quando um dos dançarinos começa a subir na parede de madeira do palco: \"E agora,\" [injured_artist.GetSheHe] diz, \"eu vou me vingar de — #EMP aaAAAAH#!\".\n\n"
 cultural_festival.2001.desc.normal:0 "À medida que o artista cai no chão, o silêncio da multidão permite que todos ouçam um claro #EMP estalo#!."
 cultural_festival.2001.t:0 "Com o Pé Errado"
 cultural_festival.2002.a:0 "\"Um pagamento justo.\""
 cultural_festival.2002.b:0 "\"Fiz o que tinha que fazer. Nada mais.\""
 cultural_festival.2002.desc.hunting:0 "Eu conheço bem essas terras."
 cultural_festival.2002.desc.intro:0 "Camponeses locais montaram barracas com vegetais e — ocasionalmente, raramente — [stop_host_scope.Custom('RegionalEdibleMeat')]. Enquanto continuo minha caminhada, acompanhado por uma quantidade decente de cortesãos, vejo um rosto familiar entre eles, seus olhos fixos nos meus.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [injured_artist.GetSheHe] finalmente se aproxima de mim, e com um gesto de mão meus guardas permitem que [injured_artist.GetSheHe] continue, \"você me ajudou em momentos de necessidade, quando me machuquei durante a apresentação. É minha vez de retribuir com o que tenho."
 cultural_festival.2002.desc.savings:0 "E isso é tudo que tenho."
 cultural_festival.2002.desc.secret:0 "Eu sei do segredo de [secret_target.GetTitledFirstNamePossessive]."
 cultural_festival.2002.t:0 "Com o Pé Direito"
 cultural_festival.2010.a:0 "\"Que surpresa amável!\""
 cultural_festival.2010.b:0 "Melhor não causar um escândalo. Vamos embora."
 cultural_festival.2010.c.failure:0 "[stop_host_scope.GetShortUIName] vence a luta"
 cultural_festival.2010.c.success:0 "Você vence a luta"
 cultural_festival.2010.c:0 "\"Como você ousa.\""
 cultural_festival.2010.desc_bad:0 "Cada pessoa em [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] parece estar imersa na conversa mais engraçada que já existiu. Eles riem e tossam, e até cutucam uns aos outros quando acham que pode ser demais. De vez em quando, consigo ouvir a palavra 'sombriamente'.\n\nQuando me aproximo do palco principal, encontro [stop_host_scope.GetTitledFirstName] segurando uma coroa de flores em suas mãos, com um sorriso malicioso: 'Aqui está [ROOT.Char.GetSheHe]!', [stop_host_scope.GetSheHe] anuncia, apontando para mim, 'nosso [ROOT.Char.Custom('GetMonarchofBeautyGoodBad')]!'"
 cultural_festival.2010.desc_good:0 "As ruas de [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] estão enfeitadas com [stop_host_scope.GetCurrentLocation.Custom('get_region_flower_type_plural')] e bandeiras, e cada pessoa na vila celebra alegremente minha chegada — eu poderia até jurar que eles não tiram os olhos de mim.\n\nQuando me aproximo do palco principal, encontro [stop_host_scope.GetTitledFirstName] segurando uma coroa de flores em suas mãos, sorrindo para mim: 'Aqui está [ROOT.Char.GetSheHe]!', [stop_host_scope.GetSheHe] anuncia, 'nosso [ROOT.Char.Custom('GetMonarchofBeautyGoodBad')]!'"
 cultural_festival.2010.t:0 "O [ROOT.Char.Custom('GetMonarchofBeautyGoodBad')]"
 cultural_festival.2020.a:0 "Que celebração encantadora!"
 cultural_festival.2020.b.drink:0 "#EMP Vamos beber um pouco de [stop_host_scope.Custom('RegionalAlcoholicDrink')]#!"
 cultural_festival.2020.b.no_drink:0 "Hora de beber [stop_host_scope.Custom('RegionalDrink')] e comer [stop_host_scope.Custom('RegionalEdibleMeat')]!"
 cultural_festival.2020.desc.christmas:0 "Os sinos tocam e os moradores se preparam para a missa. Eles conversam animadamente sobre o nascimento de Cristo. 'Havia um jumento, eu te digo!', 'E aconteceu perto do rio, assim como aqui.', 'Quando meu filho nascer, espero que você lhe dê muito ouro!'\n\nUma peça curta logo se segue, e o Senhor nasce."
 cultural_festival.2020.desc.eid:0 "Após as orações, os moradores visitam uns aos outros e celebram o fim do jejum. Pratos cheios de [stop_host_scope.Custom('get_region_root_vegetable_plural')] e peixes são servidos juntamente com [stop_host_scope.Custom('RegionalDrink')], e a celebração continua até o pôr do sol."
 cultural_festival.2020.desc.generic:0 "Que cantoria, gritos e festividade! '[ROOT.Char.Custom('FormOfAddressForLiege')], venha celebrar conosco!' diz [stop_host_scope.GetTitledFirstName], com um sorriso acolhedor. Na praça, os moradores se reuniram: eles dançam em meio ao aroma penetrante de [stop_host_scope.Custom('RegionalDrink')] e [stop_host_scope.Custom('GetLocalStreetFood')]."
 cultural_festival.2020.desc.harvest:0 "Após semanas de trabalho árduo, o último dia da colheita finalmente chegou, e equipes são formadas entre os moradores para tentar reunir a última área de plantação. 'Olhem só isso!' um deles se vangloria enquanto balança sua foice em direção ao campo, cortando tanto quanto os outros.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], venha celebrar conosco!\" convida [stop_host_scope.GetTitledFirstName], sinalizando para o grupo que dança alegremente junto à colheita."
 cultural_festival.2020.desc.intro:0 "Ruas enfeitadas com tapeçarias! Ah, o cheiro de [stop_host_scope.Custom('RegionalEdibleMeat')] recém-cozido! A forma como [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] brilha nesta época do ano!\n\n"
 cultural_festival.2020.desc.midsommar:0 "Eles ergueram um poste de maio no centro da vila, e moradores vestidos de branco se preparam para dançar ao seu redor. Eu vejo uma coroa de [stop_host_scope.GetCurrentLocation.Custom('get_region_flower_type_plural')] descansando em uma das mesas, e uma jovem sorri para mim antes de se juntar ao círculo. Lá no céu, a mais bela das luzes brilha a noite toda."
 cultural_festival.2020.desc.summer_solstice:0 "Uma fogueira foi acesa no centro da cidade para celebrar a vitória das estrelas mais brilhantes, subindo aos céus. Em meio à festa e à bebida de [stop_host_scope.Custom('RegionalDrink')], um dos moradores começa uma música à qual todos se juntam: 'O verão chegou, cantem alto, [ROOT.Char.Custom('GetRandomMigratoryBird')]! A semente está crescendo e o campo está florescendo, cantem, [ROOT.Char.Custom('GetRandomMigratoryBird')]!'"
 cultural_festival.2020.t:0 "É Época"
 cultural_festival.2030.a:0 "Eles me devem isso."
 cultural_festival.2030.b:0 "Devo causar uma boa impressão e não me envolver com isso."
 cultural_festival.2030.c:0 "Veja bem, viajar até aqui foi #EMP extremamente#! caro..."
 cultural_festival.2030.desc:0 "Conforme as pessoas de [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] começam a se reunir ao redor do palco de madeira, um pensamento vem à mente... uma multidão tão grande de pessoas, todas querendo desfrutar de um espetáculo notavelmente elaborado... #EMP de graça#!. Que desperdício.\n\nSe eu ficar na entrada, tenho certeza de que posso exigir uma pequena taxa por isso... afinal, é em #EMP minha#! honra."
 cultural_festival.2030.t:0 "Taxação Cultural"
 cultural_festival.2040.a:0 "Isso... isso é #EMP terrível#!. Receba ajuda e melhore."
 cultural_festival.2040.b:0 "Na verdade, não é tão ruim assim."
 cultural_festival.2040.c.failure:0 "Todos acham que você está sendo insensível"
 cultural_festival.2040.c.success:0 "Todos ficam impressionados com a sua cultura"
 cultural_festival.2040.c:0 "Hah! Vou mostrar a eles como nós, [ROOT.Char.GetCulture.GetCollectiveNoun], dançamos."
 cultural_festival.2040.desc:0 "Eu não sei o que eu esperava quando pedi para [stop_host_scope.GetTitledFirstName] sediar um festival cultural para exibir os costumes do povo [stop_host_scope.GetHerHim], mas... não era #EMP isso#!.\n\nDesvio o olhar da dança descoordenada dos artistas mal treinados e tento encontrar algum conforto nas refeições preparadas — #EMP eca#!, a [stop_host_scope.Custom('RegionalEdibleMeat')] está mal cozida e os [stop_host_scope.Custom('get_region_root_vegetable_plural')] estão completamente carbonizados. Isso é uma boa representação da cultura [cultural_festival_scope.GetAdjectiveNoTooltip]?"
 cultural_festival.2040.t:0 "Festival Sem Cultura...?"
 cultural_festival.2050.a:0 "O que #EMP é#! essa devassidão?"
 cultural_festival.2050.b:0 "Bem, é a cultura deles, né?"
 cultural_festival.2050.c:0 "Onde isso esteve a minha vida toda?"
 cultural_festival.2050.desc_fallback:0 "Logo em seguida, os artistas sobem ao palco, todos vestidos... bem, seria um exagero dizer que eles estão #EMP vestidos#!. A pele nua de suas pernas foi untada com essências aromáticas, e seus... seus #EMP peitos#! estão tão descobertos que é impossível não olhar para eles."
 cultural_festival.2050.desc_intro:0 "E agora, em homenagem a [ROOT.Char.GetTitledFirstNameNoTooltip], todos nós iremos apreciar uma dança local!\", anuncia [stop_host_scope.GetTitledFirstName], e eu ocupo animado o assento à direita dele, petiscando algumas frutas frescas e [stop_host_scope.Custom('RegionalDrink')].\n\n"
 cultural_festival.2050.desc_lustful:0 "Logo em seguida, os artistas sobem ao palco, e meus olhos rapidamente seguem suas pernas untadas, descobertas. Seus peitos nus brilham igualmente, não deixando #EMP nada#! para a imaginação. Ajusto-me na cadeira, que belo espetáculo do corpo é esse?"
 cultural_festival.2050.desc_outro:0 "\n\n[stop_host_scope.GetTitledFirstNameNoTooltip] me lança um olhar: \"Você está gostando, meu amigo?\""
 cultural_festival.2050.t:0 "Movimentos Escandalosos"
 cultural_festival.2060.a:0 "\"Na verdade, você pode ficar com isso.\""
 cultural_festival.2060.b:0 "\"Cuidado com essas mãos.\""
 cultural_festival.2060.c:0 "\"Pagarei pelos artesãos para que façam um para você!\""
 cultural_festival.2060.desc:0 "Mesmo com todo o esforço que claramente foi dedicado ao festival, ainda consigo notar algumas casas abandonadas e materiais pobres em [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip].\n\nQuando me aproximo da praça principal, vejo que [stop_host_scope.GetTitledFirstName] está cercado por um grupo de crianças, perguntando ansiosamente sobre nossa comitiva. Elas se escondem imediatamente quando me veem. \"Trouxe isso da capital, se alguém quiser ver...\", digo, mostrando a [sophisticated_artifact.GetNameNoTooltip] que trouxe comigo para [stop_host_scope.GetFirstNameNoTooltip].\n\n\"Magnífico!\", diz [stop_host_scope.GetSheHe], enquanto as crianças voltam para ver."
 cultural_festival.2060.t:0 "Um Artefato da Capital"
 cultural_festival.2070.a:0 "\"Talvez você possa apenas ficar aqui... e ficar de olho nas pessoas.\""
 cultural_festival.2070.b.failure:0 "Você perde o jogo"
 cultural_festival.2070.b.success:0 "Você ganha o jogo"
 cultural_festival.2070.b:0 "\"Vamos lá, apenas #EMP uma#! última vez — se eu ganhar.\""
 cultural_festival.2070.c.failure:0 "Eles descobrem que você trapaceou"
 cultural_festival.2070.c:0 "\"Eu trouxe meus próprios dados, vamos tornar isso interessante!\""
 cultural_festival.2070.d:0 "\"Ah, vamos apenas beber em memória dos velhos tempos.\""
 cultural_festival.2070.desc:0 "Um cheiro impressionantemente forte me atinge quando abro a porta da taverna. Um grupo de [retired_mercenary.GetWomenMen] canta animadamente em uma mesa no fundo. \"Hah! Eu disse que venceria!\" um deles grita, jogando alguns dados entre os dedos, e então [retired_mercenary.GetSheHe] levanta a cabeça, olhando diretamente para mim. \"Você quer tentar a sorte também, [ROOT.Char.GetTitleAsNameNoTooltip]?\"\n\n\"Cuidado, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [stop_host_scope.GetTitledFirstName] me avisa, \"esses(as) [retired_mercenary.GetWomenMen] são mercenários aposentados que gostaram das minhas terras.\""
 cultural_festival.2070.t:0 "Um Jogo de Azar"
 cultural_festival.2080.a:0 "\"Eu vou pegar o frasco vermelho!\""
 cultural_festival.2080.b:0 "\"Ah, a poção verde parece a mais saudável!\""
 cultural_festival.2080.c:0 "\"Não vou arriscar minha saúde com isso.\""
 cultural_festival.2080.desc:0 "Enquanto percorro o festival, noto uma figura encapuzada vendendo frascos cujo líquido não pode ser identificado.\n\n\"Venham comprar minhas poções, [ROOT.Char.Custom('FormOfAddressForLiege')], pois elas operam milagres e equilibram os humores até mesmo dos(as) [ROOT.Char.GetWomanMan] mais fracos(as).\"\n\nAo observar os frascos, percebo que um deles brilha de vermelho, como se fosse feito do mais fino cinábrio. O outro é verde brilhante, como se alguém tivesse mergulhado placas de cobre em vinho fresco."
 cultural_festival.2080.t:0 "Um Negócio Milagroso"
 cultural_festival.2080.tt:0 "Isso pode ter consequências imprevistas"
 cultural_festival.2090.a:0 "\"Seria uma pena se alguém os punisse por esses crimes...\""
 cultural_festival.2090.b:0 "\"Não são esses os mesmos camponeses que se revoltam contra mim? Peguem-nos!\""
 cultural_festival.2090.c:0 "\"Deixem-nos ir.\""
 cultural_festival.2090.desc:0 "Enquanto assisto à quinquagésima apresentação entediante que este [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] repugnante tem a oferecer, desejo que todos os dançarinos quebrem todos os ossos possíveis e simplesmente desapareçam.\n\nEspere um momento... #EMP Eu#! posso mandá-los embora.\n\nEu limpo minha garganta antes de falar: \"Meus amados súditos, chegou aos meus ouvidos a informação mais infeliz de que vocês têm cometido roubo e traição por estas terras.\""
 cultural_festival.2090.t:0 "Em Fila!"
 cultural_festival.2100.a:0 "Essas pessoas valem a pena ajudar."
 cultural_festival.2100.b:0 "Devemos investir em comerciantes em nossa terra natal também..."
 cultural_festival.2100.c.failure:0 "[inspired_courtier.GetShortUIName] fica curioso"
 cultural_festival.2100.c.success:0 "[inspired_courtier.GetShortUIName] encontra sua vocação"
 cultural_festival.2100.c:0 "\"Vá em frente, [inspired_courtier.GetFirstNameNoTooltip], visite-os.\""
 cultural_festival.2100.desc:0 "\"Olhe isso!\" Ouço enquanto caminho pelas ruas de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inspired_courtier'))] [inspired_courtier.GetFirstName] aponta para o que parece ser conhecido como a [guild_location.Custom('GetGuildType')] d[Select_CString( guild_location.IsFemale, 'a', 'o' )] [guild_location.GetCounty.GetFaith.WealthGodNamePossessive]; um sorriso rapidamente aparece no rosto [inspired_courtier.GetHerHim], feliz.\n\nUm grupo de aprendizes está ajoelhado na frente de uma bancada de trabalho. O mestre supervisiona a arte do batente da porta, braços cruzados, queixo erguido. \"Você vai precisar de um pouco mais de força para isso, filho.\"\n\n[inspired_courtier.GetFirstName] dá um passo em direção a eles, completamente hipnotizad[Select_CString( inspired_courtier.IsFemale, 'a', '' )]."
 cultural_festival.2100.t:0 "Uma Contribuição de Prestígio"
 cultural_festival.2110.a:0 "Eu poderia levá-lo de volta comigo..."
 cultural_festival.2110.b:0 "Um companheiro perfeito para [my_heir.GetFirstNameNoTooltip]!"
 cultural_festival.2110.c:0 "Ah... Não consigo resistir à vontade de acariciá-lo!"
 cultural_festival.2110.d:0 "Ah, que besta irritante."
 cultural_festival.2110.desc.callous:0 "Tão facilmente entretidos."
 cultural_festival.2110.desc.intro:0 "Acrobatas pulam em trajes coloridos, um deles abre a boca para pegar uma bola que outro joga e o público irrompe em aplausos."
 cultural_festival.2110.desc.outro:0 "\n\nA música logo começa. Já ouvi essa canção antes. Talvez. A maioria delas soa muito parecida. Mesmo do palco, consigo ouvir os camponeses cantando alto junto.\n\n“E dançar nos campos de...” #EMP “au! Au au!”#! uma figura decide participar, roubando as bolas de malabarismo.\n\n#EMP “Peguem aquele cachorro!”#!"
 cultural_festival.2110.e:0 "Devo permanecer no lugar."
 cultural_festival.2110.t:0 "Um Artista Inesperado"
 cultural_festival.3000.a.tt:0 "Seu senhor feudal apreciará uma boa representação..."
 cultural_festival.3000.a:0 "Uma oportunidade perfeita para conquistar o favor do meu senhor feudal!"
 cultural_festival.3000.b:0 "Não vou gastar ouro com isso."
 cultural_festival.3000.desc:0 "Uma grande oportunidade se apresenta diante de mim com a visita do meu senhor feudal [visiting_liege.GetTitledFirstName]. Certamente posso aproveitar esse encontro predestinado para ganhar a sua simpatia e, talvez, ter mais facilidade para conseguir o que eu quero...\n\nTalvez eu possa organizar uma peça que retrate as grandes proezas [visiting_liege.GetHerHim]?"
 cultural_festival.3000.t:0 "A Grande Peça"
 cultural_festival.3001.beautiful:0 "\"Alguém poderia desmaiar ao ver a beleza [visiting_liege.GetHerHim]!\""
 cultural_festival.3001.bold:0 "\"[visiting_liege.GetShortUIName] sempre age com coragem!\""
 cultural_festival.3001.compassionate:0 "\"O coração bondoso de [visiting_liege.GetShortUIName] deve ser refletido aqui.\""
 cultural_festival.3001.desc:0 "O palco foi montado para a peça, bem no centro da praça. Guirlandas festivas penduradas nos postes e os atores estão finalizando os últimos detalhes do roteiro. \"Claro que [visiting_liege.GetSheHe] nunca gostaria de maçãs, seu idiota!\" Ouço o dramaturgo reclamando com o ator principal.\n\nEspero até o final do ensaio e [liege_actor.GetSheHe] se aproxima rapidamente de mim antes que eu saia. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [liege_actor.GetSheHe] junta as mãos, quase implorando, \"Você tem alguma ideia de como devo retratar [visiting_liege.GetTitledFirstNameNoTooltip]?\""
 cultural_festival.3001.dominant:0 "\"Reflete a aura dominante que [visiting_liege.GetSheHe] tem sobre as pessoas.\""
 cultural_festival.3001.energetic:0 "\"Lembre-se de que [visiting_liege.GetSheHe] está sempre pronto para a ação!\""
 cultural_festival.3001.extroverted:0 "\"Mostre como todos amam e admiram [visiting_liege.GetSheHe].\""
 cultural_festival.3001.forgiving:0 "\"Certifique-se de retratar a excepcional bondade [visiting_liege.GetHerHim].\""
 cultural_festival.3001.greed:0 "\"A ambição de [visiting_liege.GetShortUIName] não conhece limites!\""
 cultural_festival.3001.honorable:0 "\"Nada seria mais importante para [visiting_liege.GetShortUIName] do que a honra.\""
 cultural_festival.3001.negative.flavor:0 "Meu senhor feudal não vai gostar, mas #EMP eu#! vou."
 cultural_festival.3001.negative:0 "\"Na verdade, a fantasia de bobo da corte cairia bem n[visiting_liege.GetSheHe]...\""
 cultural_festival.3001.rational:0 "\"[visiting_liege.GetShortUIName] sempre tem aquela calma.\""
 cultural_festival.3001.strong:0 "\"A força do seu corpo não conhece rival.\""
 cultural_festival.3001.t:0 "A Grande Peça: Um Elogio?"
 cultural_festival.3001.tt:0 "#F A recepção da representação por parte de [visiting_liege.GetTitledFirstName] depende de quão bem ela se adequa a [visiting_liege.GetSheHe]#!"
 cultural_festival.3001.zealous:0 "\"Reflete o quão piedoso é [visiting_liege.GetShortUIName], um [visiting_liege.GetShortUIName] [visiting_liege.GetWomanMan]!\""
 cultural_festival.3002.a.toast:0 "O melhor elogio"
 cultural_festival.3002.a:0 "\"Este é o melhor elogio que já recebi!\""
 cultural_festival.3002.b.toast:0 "Uma peça divertida"
 cultural_festival.3002.b:0 "Bem... acho que poderia ser pior."
 cultural_festival.3002.c.toast:0 "Uma performance insultante"
 cultural_festival.3002.c:0 "Como eles puderam me retratar tão #EMP errado#!?"
 cultural_festival.3002.d.toast:0 "A pior performance"
 cultural_festival.3002.d:0 "Você acha que está fazendo!?"
 cultural_festival.3002.desc.bad:0 "Não consigo acreditar que eles pensam que eu agiria assim."
 cultural_festival.3002.desc.buffoon:0 "E lá estou eu... vestido como um #EMP bobo da corte#!?"
 cultural_festival.3002.desc.good:0 "É reconfortante ser elogiado assim!"
 cultural_festival.3002.desc.intro:0 "Um palco de madeira fica orgulhosamente no centro da praça. Guirlandas festivas penduradas nos postes e os atores se escondem em um dos lados, rindo, conversando. Todos ficam em silêncio no momento em que [stop_host_scope.GetTitledFirstName] entra, com seu peito estufado, tão orgulhoso.\n\n\"Gostaria de anunciar que a peça em homenagem ao nosso convidado mais ilustre, [ROOT.Char.GetTitledFirstNameNoTooltip], está prestes a começar, por favor, deleitem-se!\"\n\nA história continua, falando sobre as ruas de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] e minhas realizações."
 cultural_festival.3002.desc.neutral:0 "Nada de interessante é observado."
 cultural_festival.3002.e.toast:0 "[visiting_liege.GetTitledFirstName] parecia ter gostado da peça"
 cultural_festival.3002.e:0 "Não posso dizer a [stop_host_scope.GetSheHe] o que realmente penso disso."
 cultural_festival.3002.t:0 "A Grande Peça"
 cultural_festival.3010.a:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')|U], é claro!"
 cultural_festival.3010.b:0 "Algum suco delicioso seria mais fácil."
 cultural_festival.3010.c:0 "Não vale a pena gastar tempo com isso."
 cultural_festival.3010.desc:0 "Dou um passeio pelos terrenos do castelo e paro perto da fonte, tirando um momento para observar a água correndo sobre as pedras de mármore. Um gato perambula pelo jardim cuidado, esticando as costas antes de se retirar.\n\nEu toco o relevo na tubulação de prata — o brasão da minha casa. Se ao menos... ah! Eu poderia impressionar [visiting_liege.GetTitledFirstName] se a fizesse jorrar com uma substância diferente..."
 cultural_festival.3010.t:0 "Uma Primavera Maravilhosa"
 cultural_festival.3011.a:0 "Vamos beber juntos!"
 cultural_festival.3011.b:0 "Seria um desperdício não fazer um desejo!"
 cultural_festival.3011.desc.alcohol:0 "#EMP [stop_host_scope.Custom('RegionalAlcoholicDrink')]?#!"
 cultural_festival.3011.desc.intro:0 "Sigo [stop_host_scope.GetTitledFirstName] enquanto [stop_host_scope.GetSheHe] me mostra o caminho pelo festival. \"E agora\", [stop_host_scope.GetSheHe] anuncia, quando entramos nos terrenos do castelo, \"o que espero que seja uma surpresa agradável\". Levanto as sobrancelhas quando encontramos uma fonte maravilhosa, toda em pedra branca, com uma tubulação prateada e jorrando copiosamente com água cristalina..."
 cultural_festival.3011.desc.juice:0 "#EMP suco?#!"
 cultural_festival.3011.desc.outro:0 "\n\nAlgumas pessoas se reúnem ao redor, rindo e jogando moedas no poço."
 cultural_festival.3011.t:0 "Uma Primavera Maravilhosa"
 cultural_festival.3020.a.tt:0 "Isso será benéfico para você, mas seu vassalo pode não gostar..."
 cultural_festival.3020.a:0 "[stop_host_scope.GetFirstNameNoTooltip] renovará sua homenagem a mim."
 cultural_festival.3020.b:0 "Vamos apenas celebrar!"
 cultural_festival.3020.desc:0 "O céu acima de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] está nublado e as fitas cinzentas da noite começam a vagar pelas ruas estreitas. A fortaleza de [stop_host_scope.GetTitledFirstName] ergue-se no topo da colina, quase desafiadora. [stop_host_scope.GetSheHe|U] poderia usar um lembrete de quem [stop_host_scope.GetSheHe] serve.\n\nSou [ROOT.Char.GetTitleAsNameNoTooltip] por direito divino. A coroa paira sobre minha cabeça como a lua acima de todas as outras estrelas. Não importa o quão brilhante você seja, #EMP eu#! prevalecerei."
 cultural_festival.3020.t:0 "Um Lembrete Leal"
 cultural_festival.3021.a.tt:0 "Isso #Bold não#! bloqueará o contrato de vassalagem."
 cultural_festival.3021.a:0 "\"ouro.\""
 cultural_festival.3021.b:0 "\"homens.\""
 cultural_festival.3021.c.flavor:0 "...em troca da minha."
 cultural_festival.3021.c:0 "\"lealdade.\""
 cultural_festival.3021.d:0 "\"amizade.\""
 cultural_festival.3021.desc:0 "Cada vela na sala queima furiosamente para manter a escuridão do lado de fora. Uma corrente migratória vem e vai pelas rachaduras de pedra ao redor das janelas. [stop_host_scope.GetTitledFirstName] está ajoelhado na minha frente e estendo minhas mãos em direção às mãos dele/dela, segurando-as nas minhas.\n\n\"Meu amigo\", começo e aperto o aperto, \"você entrega suas mãos nas minhas em lugar de nossos corações. Penso muito na sua fidelidade e, como tal, exijo a sua..."
 cultural_festival.3021.t:0 "Um Lembrete Leal: Homenagem"
 cultural_festival.3022.a:0 "\"É para você levar.\""
 cultural_festival.3022.annoyed:0 "Obrigações do Vassalo"
 cultural_festival.3022.b:0 "\"São para você levar.\""
 cultural_festival.3022.d.friends:0 "Um Relacionamento Estreito"
 cultural_festival.3022.d:0 "\"E eu as oferecerei com prazer!\""
 cultural_festival.3022.desc.friends:0 "\"amizade.\""
 cultural_festival.3022.desc.hook:0 "\"lealdade.\""
 cultural_festival.3022.desc.intro:0 "É uma noite solene quando [visiting_liege.GetTitledFirstName] me convoca para minha própria sala do trono. [visiting_liege.GetSheHe|U] enviou um aviso para minha comitiva falando sobre uma \"cerimônia de homenagem renovada\". Respiro fundo antes de entrar na sala - lá está [visiting_liege.GetSheHe], sentado em #EMP meu#! trono. Um senhor feudal é um senhor feudal. [visiting_liege.GetSheHe|U] vai se certificar de que eu nunca esqueça.\n\nAjoelho-me diante [visiting_liege.GetHerHim] e [visiting_liege.GetSheHe] pega minhas mãos nas dela/dele. \"Meu(a) amigo(a)\", [visiting_liege.GetSheHe] diz, \"você entrega suas mãos nas minhas em lugar de nossos corações. Penso muito na sua fidelidade e, como tal, exijo a sua"
 cultural_festival.3022.desc.levies:0 "\"homens.\""
 cultural_festival.3022.desc.money:0 "\"ouro.\""
 cultural_festival.3022.hook:0 "[visiting_liege.GetShortUIName] recebe um gancho de Lealdade em você"
 cultural_festival.3022.levies:0 "[visiting_liege.GetShortUIName] aumenta as milícias no seu Contrato de Vassalagem"
 cultural_festival.3022.money:0 "[visiting_liege.GetShortUIName] aumenta os impostos no seu Contrato de Vassalagem"
 cultural_festival.3022.t:0 "Um Lembrete Leal: Prestando Homenagem"
 cultural_festival.3030.a:0 "\"Vamos começar os preparativos!\""
 cultural_festival.3030.b:0 "Não há como [visiting_liege.GetFirstNameNoTooltip] aproveitar isso."
 cultural_festival.3030.desc:0 "Enquanto percorro as ruas de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], tentando encontrar novas ideias para o Festival Cultural, um fazendeiro local se aproxima timidamente de mim. O [ROOT.Char.Custom('RegionalFarmAnimal')] que [local_farmer.GetSheHe] traz consigo para de mastigar algo do chão.\n\n\"Meu senhor feudal\", diz [local_farmer.GetSheHe], ficando cada vez mais animado, \"você gostaria de ser o juiz do nosso concurso de beleza? Meu querido Sturdy certamente será o vencedor.\"\n\nDou uma rápida olhada no seu(a) [ROOT.Char.Custom('RegionalFarmAnimal')], agora ocupado com algumas folhas. E se... eu deixar [visiting_liege.GetTitledFirstName] julgar em vez disso?"
 cultural_festival.3030.t:0 "Para a Mais Bonita!"
 cultural_festival.3031.a:0 "\"O da esquerda, obviamente!\""
 cultural_festival.3031.b:0 "\"A bonita tem uma beleza familiar...\""
 cultural_festival.3031.c:0 "\"[stop_host_scope.Custom('RegionalFarmAnimalPlural')|U] [stop_host_scope.GetCulture.GetNameNoTooltip] são verdadeiramente os mais bonitos!\""
 cultural_festival.3031.d:0 "\"Eu nem vou me preocupar com isso.\""
 cultural_festival.3031.desc:0 "O palco em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] foi preparado com feno, flores e... convidados interessantes. [stop_host_scope.Custom('RegionalFarmAnimalPlural')|U], três diferentes estão no centro, acompanhados por seus orgulhosos donos. [stop_host_scope.GetTitledFirstName] faz um gesto para mim do outro lado do tablado: \"Ah, aqui está nosso juiz!\"\n\nEu olho ao redor, tentando ver se [stop_host_scope.GetSheHe] está se referindo a mim, mas não há engano. Começo a caminhar em direção a [stop_host_scope.GetSheHe] enquanto [stop_host_scope.GetSheHe] continua: \"Bem-vindo à nossa Feira Anual de Animais, onde o [stop_host_scope.Custom('RegionalFarmAnimal')] mais bonito será coroado!\", quando [stop_host_scope.GetSheHe] fala, percebo que [stop_host_scope.GetSheHe] está apontando sorrateiramente para o da esquerda."
 cultural_festival.3031.e.tt:0 "Você coroa seu rival [farm_animal_rival.GetShortUIName] como o vencedor"
 cultural_festival.3031.e:0 "Ah, eu sei exatamente qual é o melhor [stop_host_scope.Custom('RegionalFarmAnimal')]..."
 cultural_festival.3031.t:0 "Para a Mais Bonita...?"
 cultural_festival.3040.a.tt:0 "@warning_icon! #X Você pode perder esse artefato"
 cultural_festival.3040.a:0 "\"Você não deve #EMP levantá-la#!, meu amigo.\""
 cultural_festival.3040.b:0 "\"Apenas se livre dela.\""
 cultural_festival.3040.desc:0 "Ouço uma voz familiar enquanto passeio pelas ruas festivas de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: \"O que eu devo fazer com essa pedra, hein? Você quer que eu apenas sente nela?\"\n\n [marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está apontando para uma grande pedra que um pedreiro deixou diante [marshal.GetHerHim].\n\n\"É para a competição de força\", explica o pedreiro, dando de ombros. \"Que competição de força? Isso é impossível de levantar!\", retruca [marshal.GetTitledFirstNameNoTooltip]."
 cultural_festival.3040.flavor:0 "Ninguém será capaz de remover a lâmina da pedra!"
 cultural_festival.3040.t:0 "A Lâmina na Pedra"
 cultural_festival.3041.a.failure:0 "A arma não se moveu"
 cultural_festival.3041.a.success.vassal:0 "[visiting_liege.GetShortUIName] retira a arma da pedra"
 cultural_festival.3041.a.success:0 "Você retira a arma da pedra"
 cultural_festival.3041.a:0 "Hah! Vou mostrar a eles o quão poderoso eu sou!"
 cultural_festival.3041.b:0 "Devo deixar [stop_host_scope.GetTitledFirstNameNoTooltip] pegá-la, como um gesto cortês."
 cultural_festival.3041.c:0 "#EMP SIM!#! Sai daí!"
 cultural_festival.3041.desc:0 "Uma grande pedra foi colocada no centro de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], com um pouco mais de pompa do que para pensar que seja uma coincidência. Ao me aproximar, entendo rapidamente o interesse em torno dela, pois uma arma foi encrustada em sua superfície; sua lâmina brilhante, metade aço, metade pedra."
 cultural_festival.3041.t:0 "$cultural_festival.3040.t$"
 cultural_festival.3042.a:0 "#EMP Eu#! vou tirá-la da pedra!"
 cultural_festival.3042.b:0 "Por que arriscar a humilhação pública?"
 cultural_festival.3042.desc.failed:0 "\n\n\"Maldição\", ouço [visiting_liege.GetSheHe] murmurar. Talvez seja minha vez de tentar esse desafio?"
 cultural_festival.3042.desc.intro:0 "Ah, ali está! A pedra foi colocada no centro da cidade, adornada com letras douradas que dizem 'Aquele que retirar esta lâmina desta pedra será legítimo dono dela.'\n\nEu viro a cabeça para olhar [visiting_liege.GetTitledFirstName], que é, é claro, o principal candidato à vitória. No entanto... quando [visiting_liege.GetSheHe] tenta puxar o cabo, a arma não se move."
 cultural_festival.3042.desc.pretended:0 "\"Ah, que pena\", [visiting_liege.GetSheHe] diz, acenando na minha direção, \"você gostaria de tentar, meu amigo?\""
 cultural_festival.3042.t:0 "$cultural_festival.3040.t$: Exibição de Força"
 cultural_festival.3050.a:0 "Eu #EMP devo#! ficar acordado."
 cultural_festival.3050.b.tt:0 "Existe a chance de [stop_host_scope.GetShortUIName] perceber..."
 cultural_festival.3050.b:0 "Só estou descansando os olhos..."
 cultural_festival.3050.desc:0 "Um grupo de moradores subiu ao palco em um sermão que parece ser o mais longo e monótono que já ouvi.\n\nTento manter os olhos abertos, mas logo os montes de feno no canto da rua parecem um pouco confortáveis, um pouco tentadores..."
 cultural_festival.3050.t:0 "Uma Performance Calmante"
 cultural_festival.3051.a.toast:0 "[stop_host_scope.GetShortUIName] viu você dormindo"
 cultural_festival.3051.a:0 "Como [visiting_liege.GetSheHe] pode achar isso entediante!?"
 cultural_festival.3051.b:0 "Talvez isso não seja para todos..."
 cultural_festival.3051.desc:0 "Enquanto um grupo de moradores sobe ao palco, ouço seu discurso com deleite e admiração. Se ao menos soubesse que tínhamos pessoas tão conhecedoras em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]! Que fortitude! Tão cativante!\n\nAo me virar para [visiting_liege.GetTitledFirstName] para comentar sobre seus ensinamentos, descubro que seus olhos estão... fechados? É #EMP ronco#! que estou ouvindo?"
 cultural_festival.3051.t:0 "Muito Silêncio..."
 cultural_festival.3060.a:0 "\"Posso, m[Select_CString( my_spouse.IsFemale, 'inha', 'eu' )] doce [my_spouse.GetFirstNameNoTooltip]?\""
 cultural_festival.3060.b.failure:0 "[vassal_spouse.GetShortUIName] não fica impressionad[Select_CString( vassal_spouse.IsFemale, 'a', 'o' )] com sua dança"
 cultural_festival.3060.b.success:0 "Sua dança seduz [vassal_spouse.GetShortUIName]"
 cultural_festival.3060.b.tt:0 "[stop_host_scope.GetShortUIName] pode não gostar disso..."
 cultural_festival.3060.b:0 "Dançar com o cônjuge de [stop_host_scope.GetTitledFirstNameNoTooltip] causará alvoroço..."
 cultural_festival.3060.c:0 "Posso aproveitar essa oportunidade para dançar com os moradores locais."
 cultural_festival.3060.d:0 "Ah, #EMP dançar#!."
 cultural_festival.3060.desc.intro:0 "O som de flautas e tambores é rapidamente acompanhado por um grupo de convidados dançantes, todos seguindo a música com movimentos alegres e risadas. Um casal se afasta para um beco, crianças pulam em círculo, um velho solitário se esforça para mexer os quadris.\n\n"
 cultural_festival.3060.desc.spouse:0 "Me viro para meu cônjuge, [my_spouse.GetTitledFirstName], e admiro o sorriso gentil [my_spouse.GetHerHim], batendo palmas no ritmo da música."
 cultural_festival.3060.desc.vassal:0 "Vejo [stop_host_scope.GetTitledFirstName] entre a multidão e, ao lado dele, uma das [vassal_spouse.GetWomenMen] mais bonitas que já vi..."
 cultural_festival.3060.t:0 "Posso...?"
 cultural_festival.3061.a.toast:0 "Honra insultada"
 cultural_festival.3061.a:0 "Isso é um insulto à minha honra!"
 cultural_festival.3061.b:0 "E quem não escolheria [vassal_spouse.GetSheHe]!"
 cultural_festival.3061.desc:0 "Bato palmas seguindo o ritmo da música, mas paro quando vejo [visiting_liege.GetTitledFirstName] se aproximando de nós. \"Você está...?\", começo, mas não sou eu quem [visiting_liege.GetSheHe] parece estar interessado(a), já que [visiting_liege.GetSheHe] dirige o convite a meu cônjuge: \"Você me faria a honra de dançar?\""
 cultural_festival.3061.t:0 "Parceiros de Dança"
 cultural_festival.3070.a:0 "[rival_jester.GetShortUINameNoTooltip] merece a honra."
 cultural_festival.3070.b:0 "Quem melhor do que [sinful_jester.GetShortUINameNoTooltip]?"
 cultural_festival.3070.c:0 "Ou talvez, nosso visitante [visiting_liege.GetTitledFirstNameNoTooltip]...?"
 cultural_festival.3070.d:0 "A igreja nunca aprovaria algo assim."
 cultural_festival.3070.desc:0 "Uma ideia me ocorre como um galho quebrado ao ouvir os sinos tocarem: um Banquete dos Tolos! Um mundo de cabeça para baixo, onde um pecador é o sacerdote e todos nós nos deleitamos e nos divertimos por dias!\n\nAh, mas quem nomear como meu [ROOT.Char.GetFaith.BishopNeuter|U] dos Tolos...? [rival_jester.GetTitledFirstName]? Nunca gostei nem um pouco [rival_jester.GetHerHim]. Ou talvez [sinful_jester.GetTitledFirstName], cujos caminhos pecaminosos são bem conhecidos por todos."
 cultural_festival.3070.t:0 "O Banquete dos Tolos"
 cultural_festival.3071.a:0 "\"Mal posso esperar para descobrir!\""
 cultural_festival.3071.b:0 "\"Essa festividade blasfema não tem lugar em meu reino.\""
 cultural_festival.3071.c:0 "\"Hah! #EMP Contratado#!\""
 cultural_festival.3071.d:0 "\"Como você se atreve a me retratar como um tolo!?\""
 cultural_festival.3071.desc.intro:0 "Rebeldia! Alegria! Ao entrar na praça principal de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], vejo um grupo de figuras vestidas como padres, cantando e dançando."
 cultural_festival.3071.desc_fallback:0 "No centro, um(a) [final_jester.GetWomanMan] meio [ROOT.Char.GetFaith.BishopNeuter] meio bobo da corte, presidindo a multidão.\n\n[stop_host_scope.GetTitledFirstName] faz uma aparição, aplaudindo com alegria: \"Agora, ouçam, amigos, pois [final_jester.GetTitledFirstName] é o nosso $nick_monarch_of_fools_masc$ e [final_jester.GetSheHe] fará as leis e [final_jester.GetSheHe] terá a voz do Senhor. Que tipo de #EMP alegria pecaminosa#! podemos esperar [final_jester.GetHerHim]?\""
 cultural_festival.3071.desc_jester:0 "No centro, um manequim segurando uma fantasia meio [ROOT.Char.GetFaith.BishopNeuter] meio bobo da corte, pronto para ser usado. [stop_host_scope.GetTitledFirstName|U] aplaudindo do palco, rindo malignamente: \"E aqui está [ROOT.Char.GetTitledFirstName], nosso $nick_monarch_of_fools_masc$! Ouçam, amigos, pois os caminhos pecaminosos [ROOT.Char.GetHerHim] não têm fim, e agora [ROOT.Char.GetSheHe] tem o poder de impô-los!\""
 cultural_festival.3071.t:0 "$cultural_festival.3070.t$"
 cultural_festival.4000.a:0 "Eu não entendo, mas quero que [local_translator_scope.GetNameNoTooltip] me ensine!"
 cultural_festival.4000.b.failure:0 "[local_translator_scope.GetNameNoTooltip] me desmascara"
 cultural_festival.4000.b.success:0 "Ninguém percebe que não entendo nada"
 cultural_festival.4000.b:0 "Apenas assinto e sorrio..."
 cultural_festival.4000.c:0 "Na verdade, é tudo muito confuso para mim."
 cultural_festival.4000.desc:0 "De repente, me vejo separado de minha comitiva por uma multidão que se aglomera para observar as festividades em andamento e, antes que eu possa reagir, acabo preso entre duas pessoas em uma conversa acalorada.\n\nNo entanto, não entendo uma palavra do que estão dizendo e [local_character_scope.GetTitledFirstName] começa a falar diretamente comigo. Eu tento me misturar, mas [local_translator_scope.GetTitledFirstName] está me lançando um olhar de soslaio.\n\nProvavelmente devo dizer algo em resposta. O idioma deles parece fascinante, talvez eu consiga aprender a partir daqui?"
 cultural_festival.4000.t:0 "Sotaque Peculiar"
 cultural_festival.4100.a.failure:0 "[offended_character_scope.GetNameNoTooltip] não está convencido"
 cultural_festival.4100.a.success:0 "Você convenceu [offended_character_scope.GetNameNoTooltip]"
 cultural_festival.4100.a:0 "Espere, é apenas um mal-entendido."
 cultural_festival.4100.b:0 "Devo repreender [inconsiderate_character_scope.GetNameNoTooltip] publicamente!"
 cultural_festival.4100.c:0 "Talvez eu possa oferecer uma compensação em ouro."
 cultural_festival.4100.desc:0 "Não posso acreditar no que vejo, enquanto [inconsiderate_character_scope.GetTitledFirstName] começa a fazer gestos altamente ofensivos para [offended_character_scope.GetTitledFirstName] que são considerados extremamente ofensivos na cultura [offended_character_scope.GetCulture.GetName].\n\n[offended_character_scope.GetNameNoTooltip] grita e chama [inconsiderate_character_scope.GetTitledFirstName] por nomes explícitos, enquanto seus homens o seguram. Parece que [offended_character_scope.GetSheHe] não vai se acalmar sozinho, eu preciso fazer algo para amenizar a tensão."
 cultural_festival.4100.t:0 "Gestos Rudes"
 cultural_festival.4200.a:0 "Vou exibir nosso poderio militar!"
 cultural_festival.4200.b:0 "Vamos torná-lo sobre nosso povo."
 cultural_festival.4200.c:0 "Eu gostaria de uma experiência espiritual."
 cultural_festival.4200.desc:0 "Desde a chegada dos convidados em [ROOT.Char.GetCurrentLocation.GetName], eles tiveram muitas coisas para fazer e ver. No entanto, eu não devo descansar nem por um momento para mantê-los entretidos, então estou pensando em fazer algo especial para [visiting_liege.GetTitledFirstName] e sua comitiva. Um desfile que irá garantir que eles sejam recebidos e mostrar o nosso reino da melhor forma ao mesmo tempo.\n\nNo entanto, não tenho certeza que tipo de desfile irá agradar [visiting_liege.GetNameNoTooltip]?"
 cultural_festival.4200.t:0 "Preparar um Desfile"
 cultural_festival.4200.tt.liege_dislikes:0 "Seu Senhor Feudal provavelmente #X odiará#! isso"
 cultural_festival.4200.tt.liege_indifferent:0 "Seu Senhor Feudal provavelmente não se importará"
 cultural_festival.4200.tt.liege_likes:0 "Seu Senhor Feudal provavelmente #P gostará#! disso"
 cultural_festival.4201.a.civil:0 "Traga os melhores artesãos do nosso reino!"
 cultural_festival.4201.a.military:0 "Traga os melhores cavaleiros e equipamentos do nosso reino!"
 cultural_festival.4201.a.religious:0 "Traga as pessoas mais devotas e os [stop_host_scope.GetFaith.PriestNeuterPlural] do nosso reino!"
 cultural_festival.4201.b:0 "Use o que temos à disposição."
 cultural_festival.4201.c:0 "Vamos fazer algo mais simples."
 cultural_festival.4201.desc:0 "Minha decisão de fazer um [stop_host_scope.Custom('GetParadeType')] requer a nomeação de [coordinator_scope.GetTitledFirstName] como coordenador do desfile e consultar [coordinator_scope.GetSheHe] sobre como preparar o evento. [coordinator_scope.GetSheHe|U] reflete por um momento e, em seguida, responde com algumas opções:\n\n"
 cultural_festival.4201.desc_civil:0 "$cultural_festival.4201.desc$\"Poderíamos convidar os melhores agricultores e artesãos do nosso reino e mostrar suas habilidades. Ou, talvez, reunir as pessoas locais para apresentarem seus trabalhos e focar em nosso amado [ROOT.Char.GetCurrentLocation.GetName].\""
 cultural_festival.4201.desc_end:0 "\n\nEssas são algumas boas ideias, no entanto, tenho a palavra final."
 cultural_festival.4201.desc_military:0 "$cultural_festival.4201.desc$\"Poderíamos convidar os melhores cavaleiros do nosso reino e fazer uma batalha completa. Ou, talvez, apresentar as milícias e a guarnição de [ROOT.Char.GetCurrentLocation.GetName] em toda a sua força, lutando na praça principal.\""
 cultural_festival.4201.desc_religious:0 "$cultural_festival.4201.desc$\"Poderíamos convidar os seguidores mais devotos do [ROOT.Char.GetFaith.GetName] e os [stop_host_scope.GetFaith.PriestNeuterPlural] para realizar orações. Ou, talvez, organizar uma adoração ao nosso amado [ROOT.Char.GetFaith.HighGodName] com pessoas de [ROOT.Char.GetCurrentLocation.GetName].\""
 cultural_festival.4201.t:0 "O [stop_host_scope.Custom('GetParadeType')|U]"
 cultural_festival.4202.a.revelry:0 "É o melhor desfile que já vi!"
 cultural_festival.4202.a:0 "Eu poderia aprender algumas coisas com [stop_host_scope.GetTitledFirstNameNoTooltip]."
 cultural_festival.4202.b:0 "Na verdade, eu preferiria ver um [stop_host_scope.Custom('GetLiegeParadeType')]."
 cultural_festival.4202.desc:0 "[coordinator_scope.GetTitledFirstName] me convida para participar de um [stop_host_scope.Custom('GetParadeType')]. [coordinator_scope.GetSheHe|U] me assegura que [stop_host_scope.GetTitledFirstName] supervisionou os preparativos para me oferecer o melhor desfile que o [cultural_festival_scope.GetName] poderia oferecer. Enquanto [coordinator_scope.GetSheHe] fala,"
 cultural_festival.4202.desc_civil_best:0 "$cultural_festival.4202.desc$ artesãos reunidos de todo o reino exibem suas melhores obras manuais.\n\nNunca vi produtos de tanta qualidade, as pessoas de [visiting_liege.GetPrimaryTitle.GetNameNoTooltip] são realmente talentosas."
 cultural_festival.4202.desc_civil_good:0 "$cultural_festival.4202.desc$ artesãos de [cultural_festival_scope.GetNameNoTierNoTooltip] exibem suas melhores obras manuais.\n\nNunca vi produtos de tanta qualidade. Estou surpreso que isso não tenha chamado minha atenção antes, as pessoas de [cultural_festival_scope.GetNameNoTierNoTooltip] são realmente talentosas."
 cultural_festival.4202.desc_civil_worst:0 "$cultural_festival.4202.desc$ alguns moradores locais exibem algum tipo de artesanato.\n\nNão é nada que eu nunca tenha visto antes. Estou bastante decepcionado, para ser honesto."
 cultural_festival.4202.desc_military_best:0 "$cultural_festival.4202.desc$ os melhores cavaleiros do reino começam a lutar. Eles alternam constantemente entre os alvos e se movem de maneiras dinâmicas, como se estivessem dançando, e o som de suas espadas batendo nas armaduras é como música.\n\nÉ uma alegria assistir, e devo admitir a [coordinator_scope.GetNameNoTooltip] que é o melhor desfile que já vi!"
 cultural_festival.4202.desc_military_good:0 "$cultural_festival.4202.desc$ um regimento de milícias totalmente equipadas luta na praça principal do [cultural_festival_scope.GetNameNoTierNoTooltip].\n\nCertamente é uma exibição impressionante de habilidade marcial."
 cultural_festival.4202.desc_military_worst:0 "$cultural_festival.4202.desc$ alguns soldados treinam entre si. Parece que é tudo o que vou ver hoje, o que é uma pena, porque já estou entediado. Preferiria assistir a um cavalo comendo grama do que passar mais um minuto assistindo a isso. Não tenho certeza de como [stop_host_scope.GetNameNoTooltip] achou que isso seria uma boa ideia?"
 cultural_festival.4202.desc_religious_best:0 "$cultural_festival.4202.desc$ um grupo de [stop_host_scope.GetFaith.PriestNeuterPlural] reunidos na praça principal estão rezando com intensidade incomparável."
 cultural_festival.4202.desc_religious_different_faith_bad:0 "\n\nNão estou familiarizado com a religião do [stop_host_scope.GetFaith.GetName]. No entanto, sua devoção está me assustando."
 cultural_festival.4202.desc_religious_different_faith_good:0 "\n\nNão estou familiarizado com a religião do [stop_host_scope.GetFaith.GetName]. No entanto, sua devoção é impressionante."
 cultural_festival.4202.desc_religious_good:0 "$cultural_festival.4202.desc$ [stop_host_scope.GetFaith.DevoteeNeuterPlural] locais estão rezando na praça principal, prestando reverência ao [stop_host_scope.GetFaith.HighGodName]."
 cultural_festival.4202.desc_religious_same_faith_bad:0 "\n\nÉ uma pena ver que [stop_host_scope.GetNameNoTooltip] parece não ser tão devoto à nossa fé como eu pensava."
 cultural_festival.4202.desc_religious_same_faith_good:0 "\n\nÉ bom ver que as pessoas de [cultural_festival_scope.GetNameNoTierNoTooltip] são tão devotas à nossa fé."
 cultural_festival.4202.desc_religious_worst:0 "$cultural_festival.4202.desc$ um grupo de moradores locais reza para o [stop_host_scope.GetFaith.HighGodName] em uma voz monótona.\n\nÉ uma experiência verdadeiramente entediante."
 cultural_festival.4202.t:0 "$cultural_festival.4201.t$"
 cultural_festival.4203.a.failure:0 "Bem, pelo menos meus súditos se divertiram."
 cultural_festival.4203.a.success:0 "Estou feliz que todos tenham se divertido."
 cultural_festival.4203.desc:0 "Após o desfile, encontro-me com [coordinator_scope.GetTitledFirstName] para perguntar sobre a reação de [visiting_liege.GetTitledFirstName].\n\n\"Meu Senhor"
 cultural_festival.4203.desc_failure:0 "$cultural_festival.4203.desc$ Receio que [visiting_liege.GetTitledFirstNameNoTooltip] tenha achado o desfile entediante. [visiting_liege.GetSheHe|U] disse que preferiria ver um cavalo comendo grama ou ver um [stop_host_scope.Custom('GetLiegeParadeType')].\"\n\nQue ingrato!"
 cultural_festival.4203.desc_success:0 "$cultural_festival.4203.desc$ Tenho o prazer de informar que [visiting_liege.GetTitledFirstNameNoTooltip] está muito satisfeito com o desfile. [visiting_liege.GetSheHe|U] até perguntou sobre compartilhar os costumes entre nossos reinos, para que [visiting_liege.GetSheHe] possa levá-los de volta à capital em [visiting_liege.GetCapitalLocation.GetTitle.GetNameNoTier].\"\n\nÉ bom ser apreciado."
 cultural_festival.4203.t:0 "$cultural_festival.4201.t$"
 cultural_festival.4300.a:0 "Vou dar meu [existing_artifact.GetNameNoTooltip] pessoal."
 cultural_festival.4300.b:0 "Vou encomendar o [newly_created_artifact.GetNameNoTooltip] como presente."
 cultural_festival.4300.c:0 "Apenas ouro será suficiente."
 cultural_festival.4300.d:0 "#EMP No#!."
 cultural_festival.4300.desc:0 "É uma honra receber a visita de [visiting_liege.GetTitledFirstName], em troca, pensei em trocar presentes com [visiting_liege.GetSheHe] para criar um vínculo forte entre nós. Estou considerando fazer algo para a ocasião, poderia encomendar um [newly_created_artifact.GetName]. $cultural_festival.4302.desc_gold$"
 cultural_festival.4300.desc_existing_artifact:0 "\n\nEu também tenho [existing_artifact.GetName] apenas jogado por aí. Seria um presente ótimo e mais pessoal."
 cultural_festival.4300.t:0 "Troca de Presentes"
 cultural_festival.4300.tt:0 "[visiting_liege.GetShortUIName] terá que escolher um presente para trocar"
 cultural_festival.4301.a.tt:0 "Você equipa o [gifted_artifact.GetName]"
 cultural_festival.4301.a:0 "Presente requintado! Eu adoro."
 cultural_festival.4301.b:0 "Item inútil. Talvez eu possa vendê-lo por sucatas?"
 cultural_festival.4301.c:0 "Ouro? Que considerado."
 cultural_festival.4301.desc:0 "Sou abordado(a) por [stop_host_scope.GetTitledFirstName] segurando "
 cultural_festival.4301.desc_artifact:0 "[gifted_artifact.GetName].$cultural_festival.4301.desc_inbetween$\n\nAgradeço que [stop_host_scope.GetSheHe] tenha pensado nisso. $cultural_festival.4301.desc_end$"
 cultural_festival.4301.desc_end:0 "No entanto, [stop_host_scope.GetSheHe] me olha com expectativa, acredito que [stop_host_scope.GetSheHe] espera que eu também dê um presente em troca?"
 cultural_festival.4301.desc_gold:0 "um saco de moedas.$cultural_festival.4301.desc_inbetween$\n\nPego alegremente as moedas, mas parece que [stop_host_scope.GetSheHe] não sabia o que me dar? $cultural_festival.4301.desc_end$"
 cultural_festival.4301.desc_inbetween:0 "\n\n\"Meu Senhor, é uma honra tê-lo(a) aqui. Por favor, aceite este presente como uma comemoração deste festival cultural. Algo que nos lembraria deste dia por anos!\""
 cultural_festival.4301.t:0 "$cultural_festival.4300.t$"
 cultural_festival.4301.tt:0 "Você terá que escolher um presente para trocar"
 cultural_festival.4302.a:0 "$cultural_festival.4300.a$"
 cultural_festival.4302.b:0 "$cultural_festival.4300.b$"
 cultural_festival.4302.c:0 "$cultural_festival.4300.c$"
 cultural_festival.4302.d:0 "$cultural_festival.4300.d$"
 cultural_festival.4302.desc:0 "Estou honrado(a) com o presente, no entanto, já que tenho que dar algo em troca, é melhor pensar em algo apropriado para não parecer um tolo! Eu poderia ordenar que alguém me trouxesse o [newly_created_artifact.GetName]"
 cultural_festival.4302.desc_existing_artifact:0 "$cultural_festival.4300.desc_existing_artifact$"
 cultural_festival.4302.desc_gifted_gold:0 "Talvez eu possa seguir o caminho mais fácil, assim como [stop_host_scope.GetTitledFirstNameNoTooltip], e dar ouro a [stop_host_scope.GetSheHe]?"
 cultural_festival.4302.desc_gold:0 "Embora, apenas um simples saco de moedas como presente seja sempre uma opção segura, certo?"
 cultural_festival.4302.t:0 "$cultural_festival.4300.t$"
 cultural_festival.4303.a:0 "$cultural_festival.4301.a$"
 cultural_festival.4303.b:0 "$cultural_festival.4301.b$"
 cultural_festival.4303.c:0 "$cultural_festival.4301.c$"
 cultural_festival.4303.desc:0 "À medida que [visiting_liege.GetTitledFirstName] aceita meu presente, [visiting_liege.GetSheHe] alcança seus cofres.\n\n\"Devo admitir que você me pegou de surpresa. Estou honrado(a) com seu presente e não tenho muito em troca, mas por favor, aceite este pequeno gesto de minha gratidão também\"\n\n[visiting_liege.GetSheHe|U] me entrega "
 cultural_festival.4303.desc_artifact:0 "[gifted_artifact.GetName]. Agradeço que [visiting_liege.GetSheHe] tenha se sentido compelido(a) a dar algo em troca, não esperava por isso."
 cultural_festival.4303.desc_gold:0 "um saco de moedas. Acho que [visiting_liege.GetSheHe] não sabia o que me dar? Ou realmente ficou surpreso(a) com minha excelente ideia!"
 cultural_festival.4303.t:0 "$cultural_festival.4301.t$"
 cultural_festival.4310.a.tt:0 "[gift_receiver.GetTitledFirstNameNoTooltip] decidirá o que acontece em seguida"
 cultural_festival.4310.a:0 "Vou perguntar, educadamente."
 cultural_festival.4310.b:0 "Não, não sou #EMP tão#! mesquinho(a)."
 cultural_festival.4310.desc:0 "Estou passando muito tempo na companhia de [gift_receiver.GetTitledFirstName], o que me lembra de um festival anterior que tivemos juntos há muito tempo. Recordo vagamente que [giving_gift_memory.GetDescription]. Agora fico me perguntando se [gift_receiver.GetSheHe] ainda o possui, talvez eu devesse perguntar a [gift_receiver.GetSheHe] sobre isso?"
 cultural_festival.4310.t:0 "Recordações Afetuosas"
 cultural_festival.4311.a.failure:0 "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip] espera um favor"
 cultural_festival.4311.a.success:0 "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip] só quer vê-lo novamente"
 cultural_festival.4311.a:0 "Claro, aqui está."
 cultural_festival.4311.b.failure:0 "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip] lembra-se do presente"
 cultural_festival.4311.b.success:0 "Você convence [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] de que ele te deu [decoy_gift.GetNameNoTooltip]"
 cultural_festival.4311.b:0 "Sim, com certeza [giving_gift_memory_owner.GetSheHe] me deu [decoy_gift.GetNameNoTooltip]!"
 cultural_festival.4311.c.failure:0 "[giving_gift_memory_owner.GetTitledFirstNameNoTooltip] sabe que [giving_gift_memory_owner.GetSheHe] te deu algo"
 cultural_festival.4311.c.success:0 "Você convence [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] de que ele nunca lhe deu nada"
 cultural_festival.4311.c:0 "[giving_gift_memory_owner.GetSheHe|U] nunca me deu nada."
 cultural_festival.4311.d:0 "Devo admitir que o perdi há muito tempo"
 cultural_festival.4311.desc.decoy_gift:0 "Pensando bem, também tenho [decoy_gift.GetName] que não uso mais. Talvez eu possa convencer [giving_gift_memory_owner.GetSheHe] a acreditar que é o seu presente antigo?"
 cultural_festival.4311.desc.lost_gift:0 "Infelizmente, acredito que não o tenho mais comigo. Não tenho certeza de como o perdi, mas [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] também não precisa saber."
 cultural_festival.4311.desc.no_gift:0 "Talvez eu possa enganar [giving_gift_memory_owner.GetSheHe] fazendo-a acreditar que [giving_gift_memory_owner.GetSheHe] me confundiu com outra pessoa?"
 cultural_festival.4311.desc.old_gift:0 "Na verdade, ainda o tenho, é o [old_gift.GetName]. Não tenho certeza por que [giving_gift_memory_owner.GetTitledFirstNameNoTooltip] está bisbilhotando-o, mas pelo que parece [giving_gift_memory_owner.GetSheHe] pode querê-lo de volta?"
 cultural_festival.4311.desc:0 "[giving_gift_memory_owner.GetTitledFirstName] me recebe de braços abertos.\n\n\"Que festival maravilhoso! Isso me lembra de um mais antigo que fizemos juntos alguns anos atrás. Você se lembra disso? Acredito que eu tenha te dado um presente de alguma forma, talvez você possa me relembrar o que foi?\"\n\n"
 cultural_festival.4311.liege_failed_toast:0 "Suas ações são usadas contra você"
 cultural_festival.4311.no_gift_toast:0 "Tentou enganar [giving_gift_memory_owner.GetNameNoTooltip]"
 cultural_festival.4311.proper_gift_taost:0 "Exibiu o presente correto"
 cultural_festival.4311.t:0 "$cultural_festival.4310.t$"
 cultural_festival.4312.a.decoy_success:0 "Ah, esse deve ser o presente, certo?"
 cultural_festival.4312.a:0 "Que gentileza [gift_receiver.GetHerHim]. Aprecio muito."
 cultural_festival.4312.b.decoy_fail:0 "Que audácia! Isso não é o meu presente!"
 cultural_festival.4312.b.decoy_success_holup:0 "Espere um minuto. Esse não é o meu presente!"
 cultural_festival.4312.b.holup:0 "Desculpa esfarrapada, minha querida [ROOT.Char.Custom2('RelationToMe', gift_receiver)]."
 cultural_festival.4312.b.nogift_fail:0 "Que audácia! Eu sei que dei um presente a [gift_receiver.GetSheHe]!"
 cultural_festival.4312.b.nogift_success_holup:0 "Impossível. Tenho certeza de que dei um presente a [gift_receiver.GetSheHe]!"
 cultural_festival.4312.c:0 "Talvez eu possa usar isso contra [gift_receiver.GetSheHe]?"
 cultural_festival.4312.d.nogift_success:0 "Huh, acho que estava pensando em outra pessoa?"
 cultural_festival.4312.d:0 "Que infeliz."
 cultural_festival.4312.desc.decoy_gift:0 "\"Ah, sim, lembro como se fosse ontem! Você me deu [decoy_gift.GetName]. Eu ainda o tenho comigo, você quer segurá-lo?\"\n\n[gift_receiver.GetSheHe|U] parece muito confiante, enquanto [gift_receiver.GetSheHe] rapidamente ordena que seus homens tragam o presente."
 cultural_festival.4312.desc.decoy_gift_failed:0 "$cultural_festival.4312.desc.decoy_gift$ No entanto, isso é absurdo! Também, uma mentira descarada. Lembro-me do presente exato que dei, [gift_receiver.GetSheHe] não me enganará assim."
 cultural_festival.4312.desc.decoy_gift_succeeded:0 "$cultural_festival.4312.desc.decoy_gift$ No entanto, algo parece errado, ainda não tenho certeza do que é?"
 cultural_festival.4312.desc.liege_lost_gift:0 "\"Com o coração pesado, devo admitir que o perdi há muito tempo. Por favor, me perdoe.\"\n\nParece que coloquei [gift_receiver.GetHerHim] em uma situação desconfortável. Já se passaram anos e não culpo [gift_receiver.GetSheHe] por tê-lo perdido. Nem mesmo tenho certeza do que eu esperava?"
 cultural_festival.4312.desc.no_gift:0 "\"Receio não saber do que você está falando, [giving_gift_memory_owner.GetNameNoTooltip]. Talvez você me confundiu com outra pessoa, porque nunca trocamos presentes.\"\n\n"
 cultural_festival.4312.desc.no_gift_failed:0 "[gift_receiver.GetSheHe|U] afirma que nunca dei nada a [gift_receiver.GetSheHe]. Isso é absurdo! Também, uma mentira descarada. Lembro-me do presente exato que dei, [gift_receiver.GetSheHe] não me enganará assim."
 cultural_festival.4312.desc.no_gift_succeeded:0 "$cultural_festival.4312.desc.no_gift$ Aparentemente, nunca dei nenhum presente a [gift_receiver.GetSheHe]? Há apenas um segundo, eu poderia jurar que trocamos presentes durante o festival anterior. [gift_receiver.GetSheHe|U] parece muito confiante de que nada disso aconteceu aqui, talvez eu esteja errado?"
 cultural_festival.4312.desc.show_real_gift_flag:0 "\"Sim, lembro-me de que era [old_gift.GetName]! Acredito que ainda o tenho comigo se você quiser vê-lo?\"\n\n[gift_receiver.GetSheHe|U] orgulhosamente apresenta o [old_gift.GetNameNoTooltip]. Parece que [gift_receiver.GetSheHe] cuidou bem dele."
 cultural_festival.4312.desc:0 "[gift_receiver.GetTitledFirstName] reflete por um momento após ser perguntado sobre o presente.\n\n"
 cultural_festival.4312.t:0 "$cultural_festival.4310.t$"
