 tour_travel.3120.a.failure:0 "[vassal_inn.GetShortUIName] fica lisonjeado(a), mas não convencido(a)"
 tour_travel.3120.a.success:0 "Você convence [vassal_inn.GetShortUIName]"
 tour_travel.3120.a:0 "\"Gosto da sua companhia, [vassal_inn.GetFirstNameNoTooltip], por que você não se junta a mim?\""
 tour_travel.3120.b:0 "\"Me conte mais!\""
 tour_travel.3120.c:0 "\"Que presente adorável!\""
 tour_travel.3120.desc.artifact:0 "\"Ah, olha só!\", exclama [vassal_inn.GetSheHe], colocando um(a) [vassal_artifact.GetName] na mesa. \"Agora é seu!\""
 tour_travel.3120.desc.fallback:0 "Melhor isso do que o silêncio."
 tour_travel.3120.desc.intro:0 "Todas as estalagens pelo caminho estão igualmente caras. É difícil não perceber nosso séquito e não é como se estivéssemos fazendo um grande esforço. Todos param de falar no momento em que entramos.\n\nApenas um(a) [vassal_inn.GetWomanMan] se aproxima de nós, ansioso(a) para se juntar à nossa mesa. Logo, [vassal_inn.GetSheHe] começa a falar como [vassal_inn.Custom('quirk_pos_standalone')|l]. E parece que [vassal_inn.GetSheHe] não vai parar tão cedo: \"E foi então que [vassal_memory.GetDescription]...\"\n\n"
 tour_travel.3120.t:0 "Uma Visita à Estalagem do Conde"
 tour_travel.3130.a:0 "\"Isso pesa em meu coração. Tome esse ouro.\""
 tour_travel.3130.b:0 "\"Venha trabalhar em minhas terras. Darei a você o que foi tirado de você.\""
 tour_travel.3130.c:0 "\"O reino sempre vem em primeiro lugar.\""
 tour_travel.3130.desc.intro:0 "\"Você ali!\" Ouço um grito distante e me viro para encontrar um camponês segurando um arado, respirando com dificuldade enquanto [complaining_peasant.GetSheHe] para por um segundo.\n\n\"Desculpe-me, [ROOT.Char.Custom('FormOfAddressForLiege')], mas é raro a chance de falar com você. Eu entendo que você precisa expandir o reino, mas"
 tour_travel.3130.desc.no_farms:0 "os prédios reais que você construiu aqui nos deixaram sem trabalho.\""
 tour_travel.3130.desc.no_jobs:0 "os moinhos que você construiu aqui tomaram parte de nossas terras.\""
 tour_travel.3130.desc.outro:0 "\n\n[complaining_peasant.GetSheHe|U] segura seu arado."
 tour_travel.3130.t:0 "Consequências Menores"
 tour_travel.3140.a:0 "\"Eu adoraria isso.\""
 tour_travel.3140.b:0 "\"Não vou cair em tentação.\""
 tour_travel.3140.desc:0 "Eu ouço a agitação antes mesmo de ver o prédio. Vozes surgem de dentro da modesta construção de madeira; risadas e música. Conforme nos aproximamos, um(a) [brothel_worker.GetWomanMan] acena para nós, mordiscando [ROOT.GetCharacter.Custom('GetSmallFoodIndef')].\n\n\"Oh, bem-vindo(a),\" diz [brothel_worker.GetSheHe] enquanto [brothel_worker.Custom('quirk_pos_standalone')|l]. \"Gostaria de ficar para a noite? Ou apenas algumas horas? Um momento?\"\n\nNão é difícil discernir as suas intenções."
 tour_travel.3140.t:0 "Fora dos Muros"
