l_spanish:
 tour_disapprove_of_killing_opinion:0 "Desaprovação de Matança de Animais de Estimação"
 tour_dragged_prisoners_modifier:0 "Prisioneiros Arrastados"
 tour_dragged_prisoners_modifier_desc:0 "Este personagem arrastou prisioneiros por uma rua do domínio, causando danos corporais."
 tour_dragged_prisoners_opinion:0 "Prisioneiros Arrastados no Domínio"
 tour_dragged_prisoners_through_holding_modifier:0 "Senhor Feudal Vingativo"
 tour_dragged_prisoners_through_holding_modifier_desc:0 "Prisioneiros foram arrastados pelas ruas de uma das propriedades do condado."
 tour_fanatic_cat_lover_subject_opinion:0 "Amante Fanático de Gatos"
 tour_fanatic_dog_lover_subject_opinion:0 "Amante Fanático de Cães"
 tour_general.1003.a_cat.flavor:0 "O sacrifício de [ROOT.Char.Custom('CatStoryNamePossessive')] salvará o restante dos gatos."
 tour_general.1003.a_cat:0 "Oh, [ROOT.Char.Custom('CatStoryName')]..."
 tour_general.1003.a_dog.flavor:0 "O sacrifício de [ROOT.Char.Custom('DogStoryNamePossessive')] salvará o restante dos cachorros."
 tour_general.1003.a_dog:0 "Você foi [Select_CString( ROOT.Char.IsFemale, 'uma boa', 'um bom' )] [ROOT.Char.Custom('DogStoryGirlBoy')] [ROOT.Char.Custom('DogStoryName')]..."
 tour_general.1003.b:0 "Vamos purgar os [visiting_liege.Custom('HateCatsDogs')] vadios."
 tour_general.1003.c:0 "Eu não quero ter qualquer participação nisso."
 tour_general.1003.desc_default_outro:0 "\n\nAo retornar aos meus aposentos, pegamos uma bebida e reflito sobre o dilema. Sinto [visiting_liege.GetTitledFirstNameNoTooltip] me encarando, aguardando minha resposta à questão do genocídio das bestas."
 tour_general.1003.desc_pet_cat_outro:0 "Ao voltarmos para a minha acomodação, meu gato [ROOT.Char.Custom('CatStoryName')] se aproxima de mim com um ronronar generoso; como [ROOT.Char.Custom('CatStorySheHe')] costuma fazer quando eu chego em casa.\n\nEnquanto acaricio gentilmente as orelhas macias e os bigodes de [ROOT.Char.Custom('CatStoryName')], sinto o olhar de [visiting_liege.GetTitledFirstNameNoTooltip] queimando minhas costas. De repente, percebo o que eliminar #EMP todos#! os gatos significaria, e um vazio se forma no meu estômago.\n\n\"Eu #EMP ficaria satisfeito com#! aquele espécime horrível ali\", diz o [visiting_liege.GetTitleAsNameNoTooltip] suavemente, com um tom doce e doentio."
 tour_general.1003.desc_pet_dog_outro:0 "Ao voltarmos para minha residência, meu cachorro [ROOT.Char.Custom('DogStoryName')] corre até mim com olhos gentis e me cumprimenta com um afago cerimonial.\n\nO olhar penetrante de [visiting_liege.GetTitledFirstNameNoTooltip] se move entre mim e o cachorro, enquanto acaricio carinhosamente [ROOT.Char.Custom('DogStoryName')] atrás das orelhas. Eu congelo por um segundo, percebendo o que eliminar #EMP todos#! os cães significaria.\n\n\"Eu #EMP ficaria satisfeito com#! aquele espécime repugnante ali\", diz [visiting_liege.GetTitledFirstNameNoTooltip] suavemente, com um tom doce e doentio."
 tour_general.1003.desc_purge_cats:0 "Enquanto visitávamos os terrenos, meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] [visiting_liege.GetTitledFirstName] proclamou seu profundo nojo por gatos e seus semelhantes."
 tour_general.1003.desc_purge_dogs:0 "Enquanto visitávamos os terrenos, meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] [visiting_liege.GetTitledFirstName] proclamou seu nojo por cães vulgares e caninos."
 tour_general.1003.t:0 "$activity_tour$: Uma Proposta Bestial"
 tour_general.2000.a:0 "Oh, eu também tenho meus próprios problemas, sabe..."
 tour_general.2000.a_liege:0 "Oh, #EMP eu#! não contaria a ninguém..."
 tour_general.2000.a_liege_beans.tt:0 "Você descobre um segredo sobre [visiting_liege.GetShortUIName]"
 tour_general.2000.a_self_beans.tt:0 "Você descobre um segredo sobre [2000_secret_holder.GetShortUIName]"
 tour_general.2000.a_spill_beans.desc:0 "Consegui arrancar o segredo de [2000_secret_holder.GetShortUIName]"
 tour_general.2000.a_spill_beans.t:0 "Segredo Descoberto"
 tour_general.2000.a_unsuccessful.desc:0 "[2000_secret_holder.GetShortUIName] fica desconfiado(a) de você"
 tour_general.2000.a_unsuccessful.t:0 "Ofensa Suspeita"
 tour_general.2000.b:0 "Vou me afastar agora."
 tour_general.2000.desc_intro:0 "A fogueira estala e crepita enquanto nossa celebração para [visiting_liege.GetTitledFirstName] continua até altas horas da madrugada. Eu converso amenidades e compartilho bebidas com as pessoas do seu séquito.\n\nNum canto mais remoto do local da fogueira, eu percebo [visiting_liege.GetTitledFirstNamePossessiveNoTooltip] [visiting_liege.Custom2('RelationToMeShort', SCOPE.sC('2000_secret_holder'))] [2000_secret_holder.GetTitledFirstName], claramente embriagado e procurando tontamente por outra bebida.\n\nConforme me aproximo, consigo ouvir [2000_secret_holder.GetSheHe] murmurar: "
 tour_general.2000.desc_liege:0 "\"Oh, [visiting_liege.GetTitledFirstNameNoTooltip], por que você tem que gostar tanto de...\""
 tour_general.2000.desc_outro:0 "[2000_secret_holder.GetSheHe] rapidamente para [2000_secret_holder.GetHerselfHimself] quando percebe minha presença."
 tour_general.2000.desc_self:0 "\"[2000_secret_holder.GetFirstNameNoTooltip], se recomponha! Pare de suspirar por...\""
 tour_general.2000.t:0 "$activity_tour$: Revelando Segredos"
 tour_general.2001.a:0 "Espere aí, vou te tirar daí."
 tour_general.2001.a_hashish:0 "Deixe-me ver o que posso fazer."
 tour_general.2001.a_secrecy.desc:0 "[2001_precarious_entourage_character.GetShortUIName] compartilha informações sobre rotas secretas"
 tour_general.2001.a_secrecy.t:0 "Aumento de Sigilo no Esquema"
 tour_general.2001.a_success.desc:0 "[2001_precarious_entourage_character.GetShortUIName] compartilha informações interessantes sobre [2001_scheme_target.GetShortUIName]"
 tour_general.2001.a_success.t:0 "Aumento de Êxito no Esquema"
 tour_general.2001.b:0 "Algum haxixe cairia bem agora."
 tour_general.2001.b_spaceout.desc:0 "Você e [2001_precarious_entourage_character.GetShortUIName] ficam completamente distantes"
 tour_general.2001.b_spaceout.t:0 "Distantes"
 tour_general.2001.b_super_secrecy.desc:0 "[2001_precarious_entourage_character.GetShortUIName] compartilha informações sobre túneis secretos"
 tour_general.2001.b_super_secrecy.t:0 "Aumento Significativo de Sigilo no Esquema"
 tour_general.2001.b_super_success.desc:0 "[2001_precarious_entourage_character.GetShortUIName] compartilha informações muito valiosas sobre [2001_scheme_target.GetShortUIName]"
 tour_general.2001.b_super_success.t:0 "Aumento Significativo de Êxito no Esquema"
 tour_general.2001.c:0 "Eu... não. Isso não é digno."
 tour_general.2001.desc_hashish:0 "Me deparo com [2001_precarious_entourage_character.GetTitledFirstName] enquanto inspeciono as carruagens do séquito do meu senhor feudal. [2001_precarious_entourage_character.GetSheHe|U] parece incomumente agitado, os olhos se movendo de um lado para o outro enquanto [2001_precarious_entourage_character.GetSheHe] mexe freneticamente com algo em sua bolsa.\n\nEu me aproximo, notando o avermelhamento dos olhos [2001_precarious_entourage_character.GetHerHim] quando [2001_precarious_entourage_character.GetSheHe] me olha e sorri constrangido: \"[ROOT.Char.GetTitledFirstNameNoTooltip], desculpe pelo meu estado lamentável. Parece que perdi... uma certa... erva. Você não saberia algo sobre #EMP a erva#!?\""
 tour_general.2001.desc_outro:0 "\n\n\"Se você tiver a bondade de me ajudar, posso compartilhar algumas informações valiosas sobre nossa corte...\" suplica [2001_precarious_entourage_character.GetSheHe]."
 tour_general.2001.desc_privy:0 "Em meu caminho por [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] para encontrar nosso visitante [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_liege'))] [visiting_liege.GetTitledFirstName], de repente ouço um grito abafado. Paro e escuto, em seguida, começo a me mover em direção ao grito.\n\nEle me leva a um privado numa das vielas estreitas, onde consigo distinguir uma voz pedindo ajuda: \"Meu nome é [2001_precarious_entourage_character.GetTitledFirstName], e parece que estou... preso(a),\" confessa a voz."
 tour_general.2001.t:0 "$activity_tour$: Uma Situação Inconveniente"
 tour_general.3003.a:0 "Precisamos purgar esta cidade desses vilões [ROOT.Char.Custom('HateCatsDogs')]."
 tour_general.3003.a_host_decides.tt:0 "[stop_host_scope.GetShortUIName] decide o que acontece em seguida"
 tour_general.3003.a_potential_outcome_agree:0 "[stop_host_scope.GetShortUIName] ajuda você a matar os [ROOT.Char.Custom('HateCatsDogs')]"
 tour_general.3003.a_potential_outcome_disagree:0 "[stop_host_scope.GetShortUIName] #EMP não#! irá ajudar você a matar os [ROOT.Char.Custom('HateCatsDogs')]"
 tour_general.3003.a_potential_outcome_offer_up_pet:0 "[stop_host_scope.GetShortUIName] oferece o seu próprio [ROOT.Char.Custom('HateCatDog')]"
 tour_general.3003.b:0 "Pensando melhor, vamos fazer algo diferente."
 tour_general.3003.b_cynical:0 "Nah, isso ia causar muita bagunça."
 tour_general.3003.compassionate_subjects_disapprove.tt:0 "Seus súditos compassivos desaprovam essa ação"
 tour_general.3003.desc_love_cats:0 "Enquanto percorro as ruas de [ROOT.Char.GetCurrentLocation.GetName], com [stop_host_scope.GetTitledFirstName] ao meu lado, sou abordado por um vira-lata. Ao olhar mais adiante na rua, há uma ninhada inteira desses cães raivosos correndo e causando tumulto.\n\nEu franzo o nariz com nojo. Essas #EMP criaturas#!. Sem a graça natural de um felino, cheirando seus próprios e os traseiros dos outros, lambendo... #EMP urgh#!... está claro que são seres inferiores. E neste lugar, eles são definitivamente um incômodo.\n\nNão, este lugar estaria melhor se nos livrássemos dessas pragas."
 tour_general.3003.desc_love_dogs:0 "Enquanto exploro as ruas de [ROOT.Char.GetCurrentLocation.GetName], com [stop_host_scope.GetTitledFirstName] ao meu lado, algo repentinamente pousa em cima da minha cabeça. #EMP Algo pontudo.#!\n\nImediatamente seguro o que se revela ser um gato muito zangado e vil que rosna enquanto arranha meu rosto. Instintivamente, dou alguns passos para trás e solto a criatura de maneira não muito delicada.\n\nEssas criaturas traiçoeiras, não confiáveis... malignas. Olho para cima apenas para ver um bando delas se reunindo no final da rua, todas me olhando com olhos malévolos. Isso não vai dar certo."
 tour_general.3003.fanatic_subjects_approve.tt:0 "Seus súditos amantes de [visiting_liege.Custom('GetCatDog')] aprovam essa ação"
 tour_general.3003.t_cat:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: É um Mundo Felino"
 tour_general.3003.t_dog:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: É um Mundo Canino"
 tour_general.3004.a:0 "Está feito."
 tour_general.3004.desc_intro:0 "Agora a ação foi concluída; os cadáveres dos animais foram empilhados perto das forcas de [stop_host_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] e pequenas fogueiras estão queimando para se livrar das criaturas repugnantes de uma vez por todas."
 tour_general.3004.desc_intro_sacrifice:0 "A ação foi concluída; a besta que estava habitando as moradias de [stop_host_scope.GetTitledFirstName] foi purgada e agora está exposta como exemplo de aviso nas forcas de [stop_host_scope.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 tour_general.3004.desc_no_help:0 "\n\nNão que o covarde [stop_host_scope.GetTitledFirstName] tenha ajudado em alguma coisa. Resmungo enquanto reflito sobre a insubordinação realizada por meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stop_host_scope'))]. Pelo menos agora sei onde [stop_host_scope.GetSheHe] se posiciona."
 tour_general.3004.desc_outro:0 "\n\nEnquanto caminho em direção ao banho designado em meus aposentos, avisto um [ROOT.Char.Custom('GetCatDog')] abandonado, olhando curiosamente para a cena nas forcas. Sorrio para o [ROOT.Char.Custom('GetFelineCanine')] e assinto: \"Agora está tudo bem, precioso.\""
 tour_general.3004.desc_vassal_help:0 "\n\nAgradeço que [stop_host_scope.GetTitledFirstName] tenha prontamente me ajudado e começado a reunir os animais miseráveis. Agora posso dormir tranquilo, sabendo que o reino está um pouco mais seguro."
 tour_general.3004.desc_vassal_sacrifice:0 "\n\nAgradeço que [stop_host_scope.GetSheHe] tenha voltado à razão e tenha se desfeito da criatura imunda. Devo provavelmente ir me lavar; quem sabe que doenças ela estava carregando."
 tour_general.3004.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Um Mal Necessário"
 tour_general.4000.a:0 "Desfile-os pela rua!"
 tour_general.4000.a_egged.desc:0 "Você é alvejado com ovos"
 tour_general.4000.a_egged.t:0 "Alvejado"
 tour_general.4000.a_parade.desc:0 "Você desfila os prisioneiros pela rua"
 tour_general.4000.a_parade.t:0 "Desfile Miserável"
 tour_general.4000.b.flavor:0 "Essa escória vil!"
 tour_general.4000.b:0 "#EMP Arraste#!-os pela rua."
 tour_general.4000.c:0 "Talvez possamos fazer algo diferente..."
 tour_general.4000.desc:0 "A rua principal de [ROOT.Char.GetCurrentLocation.GetName] está lotada de pessoas do povo [stop_host_scope.GetCulture.GetNameNoTooltip], ansiosas para vislumbrar seu [ROOT.Char.GetTitleAsNameNoTooltip|U].\n\nSabendo o propósito da minha [ROOT.Char.GetInvolvedActivity.GetNameNoTooltip], lanço um olhar aos prisioneiros do meu séquito, alinhados e acorrentados em um comboio que começa logo atrás de mim. Essas pessoas da cidade precisam me respeitar e saber o que acontece com aqueles que se desviam do caminho.\n\nMeu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('parade_master'))] [parade_master.GetTitledFirstName] olha para mim com expectativa, espada em mãos, esperando o sinal para começar a desfilar os prisioneiros pela rua."
 tour_general.4000.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: O Desfile Miserável"
 tour_general.4001.a.tt:0 "Você vasculha os aposentos"
 tour_general.4001.a:0 "Certamente, os aposentos devem ser suspeitos."
 tour_general.4001.b.tt:0 "Você vasculha a câmara do conselho"
 tour_general.4001.b:0 "Uma câmara do conselho, adequada para negociações obscuras."
 tour_general.4001.c.tt:0 "Você busca no [stop_host_scope.GetFaith.HouseOfWorship]"
 tour_general.4001.c:0 "O local de adoração [stop_host_scope.GetHerHim|U] pode ter indecências."
 tour_general.4001.d.tt:0 "Você busca na cozinha"
 tour_general.4001.d:0 "Quem sabe quais itens desviantes uma cozinha pode esconder."
 tour_general.4001.desc:0 "Enquanto visito meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stop_host_scope'))] [stop_host_scope.GetTitledFirstName] em seu aposento em [ROOT.Char.GetCurrentLocation.GetName], aparentemente acabo me separando do meu grupo de turistas, deixando-me completamente sozinho nos seus aposentos.\n\nAgora, essa poderia ser uma oportunidade perfeita para #EMP conhecer#! [stop_host_scope.GetSheHe] um pouco melhor. Talvez eu deva vasculhar o local e ver se consigo encontrar quaisquer itens... incomuns... de interesse ou coisas que [stop_host_scope.GetSheHe] não queira que eu encontre?"
 tour_general.4001.e:0 "Tenho coisas melhores para fazer."
 tour_general.4001.outcome_a:0 "Você descobre um segredo sobre [stop_host_scope.GetShortUIName]"
 tour_general.4001.outcome_a_desc:0 "Você encontra algo suspeito"
 tour_general.4001.outcome_b_desc:0 "Você não encontra nada"
 tour_general.4001.outcome_c_desc:0 "Você é pego em flagrante"
 tour_general.4001.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Segredos Guardados"
 tour_general.4002.a:0 "Isso servirá..."
 tour_general.4002.a_cannibal:0 "Um colega gourmet!"
 tour_general.4002.a_deviant:0 "Um colega desafiador das normas!"
 tour_general.4002.a_homosexual:0 "Um colega alegre!"
 tour_general.4002.a_homosexual_female:0 "Uma colega das damas!"
 tour_general.4002.a_homosexual_male:0 "Um colega dos cavalheiros!"
 tour_general.4002.a_incest:0 "Um colega amante sem limites!"
 tour_general.4002.a_non_believer:0 "Um colega buscador da verdade!"
 tour_general.4002.a_witch:0 "Um[Select_CString( stop_host_scope.IsFemale, 'a', '' )] [stop_host_scope.Custom('SisterBrother')] colega!"
 tour_general.4002.desc_bedchamber:0 "Os aposentos de [stop_host_scope.GetTitledFirstNamePossessive] são surpreendentemente limpos e arrumados. A cama, suspeitamente, está impecável. Eu olho ao redor do quarto por um momento, tentando encontrar algo fora do lugar.\n\n"
 tour_general.4002.desc_cannibal:0 "Empurro a porta com um rangido baixo e olho para o quarto fracamente iluminado. Ao entrar, noto... um crânio humano? Apoiado no balcão da parede oposta? Aquilo é... Súbito, sinto náuseas com o cheiro intrusivo e percebo uma mão.\n\nA mão está separada do corpo. #EMP Carne humana#!?"
 tour_general.4002.desc_council_chamber:0 "Eu entro sorrateiramente nas câmaras do conselho [stop_host_scope.GetTitledFirstNamePossessive], com os olhos e ouvidos atentos a qualquer som ou movimento que possa indicar que eu seria pego. A sala parece ser uma sala de conselho bastante simples, enquanto eu vasculho as prateleiras e levanto os documentos espalhados.\n\n"
 tour_general.4002.desc_deviant:0 "De repente, percebo uma rachadura na parede e puxo cuidadosamente o que se revela ser várias ilustrações de... #EMP meu Deus#!... desviantes se envolvendo em um tipo específico de devassidão.\n\nHá também alguns objetos anexados, que prefiro não tocar."
 tour_general.4002.desc_embezzler:0 "Ao deixar minha mão deslizar ao longo da lateral de uma mesa, sinto algo na parte inferior do tampo. Puxo para soltar... documentos de impostos?\n\nNão, esses são documentos detalhando ouro desviado dos cofres de #EMP outra pessoa#! para os cofres de [stop_host_scope.GetTitledFirstNamePossessive]. Desvio de dinheiro!"
 tour_general.4002.desc_homosexual:0 "Me aproximo da cama, passando a mão sob a borda do colchão macio e encontro... correspondências de [stop_host_scope.GetTitledFirstNameNoTooltip]. Nas cartas, [stop_host_scope.GetSheHe] parece estar expressando seu amor por outro(a) [stop_host_scope.GetWomanMan]?!\n\nHuh, quem poderia imaginar."
 tour_general.4002.desc_incest:0 "Me aproximo lentamente da porta da adega, que está entreaberta, e me inclino para dar uma olhada no que há lá dentro. Meus olhos se arregalam e dou alguns passos para trás, tentando ficar quieto e processar o que acabei de ver.\n\n[stop_host_scope.GetTitledFirstNameNoTooltip]? Em relações carnais com... com... #EMP um parente próximo?!?"
 tour_general.4002.desc_kitchen:0 "Ao me aproximar da cozinha, certifico-me de que o local está vazio antes de entrar. Olho rapidamente ao redor, me orientando. A adega parece ser um lugar promissor para abrigar segredos, talvez.\n\n"
 tour_general.4002.desc_lover:0 "Dando um tropeço, corro a mão pela parede e puxo uma lâmpada para evitar cair. Para minha surpresa, ela se move para baixo em um movimento suave, revelando uma abertura na parede.\n\nO compartimento está cheio até a borda com... cartas de amor [stop_host_scope.GetTitledFirstNamePossessive]? Para um #EMP amante secreto#!?"
 tour_general.4002.desc_murder:0 "Meus olhos deslizam pela beirada da janela quando percebo uma parte da parede levemente fora do lugar. Me aproximo e retiro o que parece ser uma adaga ensanguentada, acompanhada de correspondências de [stop_host_scope.GetTitledFirstNameNoTooltip] para agentes em potencial em um #EMP assassinato!#! comprometedor.\n\nRapidamente, coloco os itens de volta no esconderijo."
 tour_general.4002.desc_murder_attempt:0 "Concentro minha atenção na penteadeira e observo o espelho precioso preso na madeira impecável. Me inclino para olhar atrás dele e encontro um saco de... algo.\n\nAbro o saco e descubro informações detalhadas sobre uma tentativa de assassinato recente! Rapidamente, coloco o saco de volta."
 tour_general.4002.desc_non_believer:0 "Olho para o altar no fim da sala. A cortina abaixo da mesa tem algo se projetando por baixo... Puxo e descubro — uma coleção de rabiscos, detalhando o ceticismo [stop_host_scope.GetTitledFirstNamePossessive] em relação ao [stop_host_scope.GetFaith.HighGodName].\n\nDou alguns passos para trás. [stop_host_scope.GetTitledFirstNameNoTooltip] — um #EMP incrédulo#!?"
 tour_general.4002.desc_shrine:0 "O [stop_host_scope.GetFaith.HouseOfWorship] está estranhamente silencioso enquanto eu percorro os corredores em busca de qualquer informação. As câmaras parecem bastante mundanas e comuns, enquanto dou outra volta, sempre atento aos sons de companhia.\n\n"
 tour_general.4002.desc_witch:0 "Um dos estandartes pendurados na parede parece estar um pouco torto... Toco o estandarte, que libera um grimório preto pequeno, porém intrincado, que cai no chão com um baque surdo.\n\n[stop_host_scope.Custom('MagicPracticeTerm')|U]?"
 tour_general.4002.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Segredo Revelado"
 tour_general.4003.a:0 "Que decepção."
 tour_general.4003.desc_faux_bedchamber:0 "Enquanto dou uma espiada dentro dos aposentos, sou abordado por um dos servos que está ocupado limpando o quarto. [servant_gender.GetSheHe|U] acena conspicuamente para que eu me aproxime.\n\n“Será que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord] sabe o segredo para dobrar lençóis #EMP perfeitamente#!?” diz o servo, olhando para mim com expectativa.\n\nSuspiro baixinho enquanto me desculpo e deixo o quarto."
 tour_general.4003.desc_faux_council_chamber:0 "As câmaras do conselho estão quase vazias. Acima de tudo, não há nenhuma informação remotamente interessante ou segredo para eu descobrir.\n\nQuando me preparo para sair, sou surpreendido por uma voz atrás de mim. \"Deixe-me contar [Select_CString( ROOT.Char.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.GetLadyLord] o segredo de manter uma mesa livre de poeira...\"\n\nFinjo não ouvir e saio às pressas das câmaras."
 tour_general.4003.desc_faux_kitchen:0 "A cozinha está bagunçada, como se a equipe tivesse acabado de trabalhar na próxima refeição. Eu me desvio em direção à adega, espiando lá dentro.\n\nEu dou uma olhada em um servo que está ocupado empilhando [stop_host_scope.Custom('get_region_root_vegetable_plural')]. [servant_gender.GetSheHe|U] me lança um olhar curioso e então abre a boca:\n\n\"Alguém já te contou o segredo sobre [stop_host_scope.Custom('get_region_root_vegetable_plural')], [ROOT.Char.GetLadyLord]?\"\n\nEu olho para o(a) servo(a) com ceticismo, então viro e saio da cozinha."
 tour_general.4003.desc_faux_shrine:0 "Vagueio pelos corredores da [stop_host_scope.GetFaith.HouseOfWorship], olhando cuidadosamente ao redor em busca de algo suspeito, mas não encontro nada.\n\nEnquanto percorro o local, encontro um criado que insiste em querer me contar os segredos de... polir estanho.\n\nEducadamente, recuso."
 tour_general.4003.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Nada para Ver Aqui"
 tour_general.4004.a:0 "Eh. Uh. Eu estava procurando por você!"
 tour_general.4004.a_diplomacy:0 "Ah. #EMP Aí#! você está."
 tour_general.4004.a_diplomacy_convinced.desc:0 "Você conseguiu convencer [stop_host_scope.GetShortUIName]"
 tour_general.4004.a_diplomacy_convinced.t:0 "Demonstração Convincente"
 tour_general.4004.a_diplomacy_nonconvinced.desc:0 "Você não consegue convencer [stop_host_scope.GetShortUIName]"
 tour_general.4004.a_diplomacy_nonconvinced.t:0 "Não Convencido"
 tour_general.4004.a_diplomacy_snooping.desc:0 "Você pegou seu senhor feudal bisbilhotando suas terras"
 tour_general.4004.a_diplomacy_snooping.t:0 "Senhor Feudal Espionando"
 tour_general.4004.a_discreet.desc:0 "Você ajuda [2001_precarious_entourage_character.GetShortUIName] a sair do privado com elegância"
 tour_general.4004.a_discreet.t:0 "Êxito no Privado"
 tour_general.4004.a_stained.desc:0 "Seu vestido favorito fica sujo na tentativa"
 tour_general.4004.a_stained.t:0 "Manchado"
 tour_general.4004.b:0 "Eu estava esperando por #EMP você#!..."
 tour_general.4004.desc_bedchamber_caught:0 "Eu acabei de entrar nos aposentos e começo a olhar ao redor quando uma porta do outro lado do quarto se abre abruptamente, revelando [stop_host_scope.GetTitledFirstName] em pessoa. [stop_host_scope.GetSheHe|U] me olha, com os olhos ligeiramente arregalados de surpresa.\n\nEntão seus olhos se estreitam. Sinto uma leve onda de pânico enquanto tento manter a calma."
 tour_general.4004.desc_council_chamber_caught:0 "Assim que entro na sala do conselho, ouço passos se aproximando rapidamente. Começo a suar frio enquanto tento rapidamente chegar ao outro lado da sala para me esconder, mas falho miseravelmente.\n\nO olhar de [stop_host_scope.GetTitledFirstName] recai sobre mim quando [stop_host_scope.GetSheHe] diz: 'Aí está você, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]!' seus olhos se estreitam enquanto [stop_host_scope.GetSheHe] me observa e eu tento manter a neutralidade."
 tour_general.4004.desc_kitchen_caught:0 "A cozinha está pouco iluminada e sombria, enquanto atravesso cuidadosamente o cômodo de tamanho razoável. Me inclino para olhar algumas anotações de receita quando ouço um rangido atrás de mim — e imediatamente me viro, apenas para revelar [stop_host_scope.GetTitledFirstName] saindo da adega.\n\n[stop_host_scope.GetSheHe|U] me olha, claramente tão surpreso(a) quanto eu me sinto. Então seus olhos se estreitam: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]... ?\""
 tour_general.4004.desc_outro:0 "\n\n'... o que você estava aprontando?' [stop_host_scope.GetTitledFirstNameNoTooltip] pergunta em um tom inquisitivo."
 tour_general.4004.desc_shrine_caught:0 "Entro no [stop_host_scope.GetFaith.HouseOfWorship], andando um pouco pelos corredores - e então, ao virar uma esquina, quase esbarro fisicamente em [stop_host_scope.GetTitledFirstName]. Meu coração quase para.\n\n[stop_host_scope.GetTitledFirstNameNoTooltip] se vira, [Select_CString( stop_host_scope.IsFemale, 'surpresa', 'surpreso' )] por ter sido [Select_CString( stop_host_scope.IsFemale, 'abordada', 'abordado' )] assim. Quando [stop_host_scope.GetSheHe] percebe quem quase esbarrou n[stop_host_scope.GetSheHe], seus olhos se estreitam. 'Eu estava procurando por você, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip].'"
 tour_general.4004.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Pego(a)!"
 tour_general.4006.a:0 "Continue falando..."
