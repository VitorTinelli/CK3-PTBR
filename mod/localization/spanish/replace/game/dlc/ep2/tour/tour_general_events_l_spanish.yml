 tour_general.4006.b:0 "Alguém traga mais bebida para este(a) [servant_character.GetWomanMan]."
 tour_general.4006.b_passout.desc:0 "[servant_character.GetShortUIName] bebe demais e desmaia"
 tour_general.4006.b_passout.t:0 "Desmaio"
 tour_general.4006.b_passout_tt:0 "Você não obtém nenhuma informação"
 tour_general.4006.b_super_secrecy.desc:0 "[servant_character.GetShortUIName] compartilha informações sobre túneis secretos"
 tour_general.4006.b_super_secrecy.t:0 "Sigilo da Trama Vastamente Aumentado"
 tour_general.4006.b_super_success.desc:0 "[servant_character.GetShortUIName] compartilha informações muito valiosas sobre [4006_scheme_target.GetShortUIName]"
 tour_general.4006.b_super_success.t:0 "Sucesso na Trama Vastamente Aumentado"
 tour_general.4006.desc:0 "Depois de um dia sendo incomodado(a) por [stop_host_scope.GetTitledFirstName] em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], considero que uma noite sem [stop_host_scope.GetSheHe] seja bem merecida. E assim, minha comitiva relaxa em uma taverna local.\n\nEnquanto meus olhos percorrem uma multidão de bêbados — um rosto ruborizado se destaca entre os demais. Pertence a um(a) dos(as) serviçais de [stop_host_scope.GetTitledFirstName].\n\nMe aproximo enquanto o(a) embriagado(a) divaga: 'Ah, eu poderia contar algumas coisas sobre o [stop_host_scope.GetTitleTierName]! Mais do que algumas...'"
 tour_general.4006.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Trama Embriagada"
 tour_general.4007.a:0 "Se eu pudesse me aproximar um pouco mais..."
 tour_general.4007.a_detected.desc:0 "[4007_secret_holder.GetShortUIName] pega você espionando"
 tour_general.4007.a_detected.t:0 "Descoberto"
 tour_general.4007.a_secret.desc:0 "Você se aproxima um pouco mais e descobre o que [4007_secret_holder.GetShortUIName] está fazendo"
 tour_general.4007.a_secret.t:0 "Segredo Descoberto"
 tour_general.4007.a_secret.tt:0 "Você descobre um segredo sobre [4007_secret_holder.GetShortUIName]"
 tour_general.4007.b:0 "Melhor não."
 tour_general.4007.desc:0 "Acabei de sair da taverna recomendada por [stop_host_scope.GetTitledFirstName] e me encontro do lado de fora, em um beco sombrio. Da escuridão, um som estranho emerge.\n\nConforme me aproximo silenciosamente do som, curioso(a) sobre sua origem, vislumbro... [4007_secret_holder.GetTitledFirstName]? O que [4007_secret_holder.GetSheHe] está fazendo aqui no beco escuro, a essa hora?\n\nTento em vão obter uma visão melhor do que [4007_secret_holder.GetSheHe] está fazendo sem revelar minha presença; mas uma coisa é certa: [4007_secret_holder.GetTitledFirstNameNoTooltip] está aprontando algo."
 tour_general.4007.t:0 "[ROOT.Char.GetCurrentLocation.GetNameNoTooltip]: Atividade Suspeita"
