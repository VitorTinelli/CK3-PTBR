l_spanish:
 tour_grounds_events.7000.a.tt:0 "Esconderijo secreto taxado"
 tour_grounds_events.7000.a:0 "É justo compartilhar isso com seu [ROOT.Char.GetTitleAsNameNoTooltip]."
 tour_grounds_events.7000.b.tt.2:0 "Seu senhor feudal leva o melhor do seu esconderijo!"
 tour_grounds_events.7000.b.tt:0 "Esconderijo secreto confiscado"
 tour_grounds_events.7000.b:0 "Guardas! Tome #EMP tudo#!."
 tour_grounds_events.7000.c.tt.2:0 "Você se aproxima do seu senhor feudal compartilhando seus interesses!"
 tour_grounds_events.7000.c.tt:0 "Esconderijo secreto apreciado"
 tour_grounds_events.7000.c:0 "Um colega apreciador!"
 tour_grounds_events.7000.d.tt:0 "Esconderijo secreto ignorado"
 tour_grounds_events.7000.d:0 "Vou fingir que não vi isso."
 tour_grounds_events.7000.desc:0 "[stop_host_scope.GetTitledFirstName|U] tem sido um anfitrião extremamente gracioso até agora, mostrando-me suas terras e possessões com orgulho, então fico imediatamente surpreso quando [stop_host_scope.GetSheHe] começa a gaguejar e claramente tenta desviar minha atenção de uma porta aparentemente comum pela qual estamos passando.\n\n\"Você está #EMP escondendo#! algo de mim, [stop_host_scope.GetFirstNameNoTooltip]?\"\n\nAproveito o momento de seu silêncio — constrangido? #EMP Culposo#!? — para abrir a porta, e fico surpreso com o que encontro:"
 tour_grounds_events.7000.desc_artifacts:0 "tesouros, joias e até mesmo o [this_artifact.GetName] de [stop_host_scope.GetFirstNamePossessiveNoTooltip]!"
 tour_grounds_events.7000.desc_cellar:0 "uma adega completa, empilhada até o teto com vinhos caros e licores de terras distantes!"
 tour_grounds_events.7000.desc_dogs:0 "a porta leva a um pátio cheio de cães saudáveis e com aparência forte que não vejo há um tempo!"
 tour_grounds_events.7000.desc_falcons:0 "um viveiro com uma grande quantidade de falcões orgulhosos em abrigos bem cuidados!"
 tour_grounds_events.7000.desc_fallback:0 "um depósito de comida, peças de ouro e bens em geral!"
 tour_grounds_events.7000.desc_gold:0 "várias pilhas de ouro e baús transbordando de moedas!"
 tour_grounds_events.7000.desc_horses:0 "a porta leva a um pátio cheio de cavalos saudáveis e com aparência forte que não vejo há um tempo!"
 tour_grounds_events.7000.desc_pantry:0 "uma despensa escondida, empilhada até o teto com especiarias estrangeiras, carne temperada, mel e barris de sal!"
 tour_grounds_events.7000.t:0 "O Que Você Não Vê..."
 tour_grounds_events.7001.a.failure.tt:0 "Seu esconderijo secreto é descoberto"
 tour_grounds_events.7001.a.failure:0 "Seu senhor feudal invade o cômodo"
 tour_grounds_events.7001.a.success.tt:0 "Suas riquezas estão seguras"
 tour_grounds_events.7001.a.success:0 "Você redireciona seu senhor feudal para outro lugar"
 tour_grounds_events.7001.a:0 "[Select_CString( visiting_liege.IsFemale, 'Minha', 'Meu' )] [visiting_liege.GetLadyLord]! Vamos por #EMP aqui#!!"
 tour_grounds_events.7001.b.success.tt:0 "Suborno aceito"
 tour_grounds_events.7001.b.success:0 "Seu senhor feudal aceita o suborno"
 tour_grounds_events.7001.b.tt.2:0 " Seu anfitrião [ROOT.Char.GetTitledFirstNameNoTooltip] pagou para você desviar o olhar de um determinado cômodo."
 tour_grounds_events.7001.b.tt:0 "Subornado para desviar o olhar"
 tour_grounds_events.7001.b:0 "Tenho certeza de que posso persuadir [visiting_liege.GetSheHe] a desviar o olhar?"
 tour_grounds_events.7001.c:0 "Eu estava PRESTES a te levar até lá!"
 tour_grounds_events.7001.desc:0 "Eu acredito que tenho sido um anfitrião extremamente gracioso para meu senhor feudal visitante, [visiting_liege.GetTitledFirstName], até agora.\n\nA visita à minha [ROOT.Char.Custom('ResidenceBuilding')], em particular, tem sido ótima — até que eu vire errado e acabe deixando [Select_CString( visiting_liege.IsFemale, 'minha ansiosa', 'meu ansioso' )] [visiting_liege.GetLadyLord] bem na frente da única porta da qual eu estava tentando mantê-la afastada:"
 tour_grounds_events.7001.desc_artifacts:0 "o cômodo secreto onde guardo os tesouros de minha família!"
 tour_grounds_events.7001.desc_cellar:0 "a adega escondida onde guardo meus vinhos caros e licores de terras distantes!"
 tour_grounds_events.7001.desc_conclusion:0 "\n\nEnquanto começo a gaguejar nervosamente, [visiting_liege.GetTitledFirstNameNoTooltip] fica cada vez mais curioso."
 tour_grounds_events.7001.desc_dogs:0 "o pátio secreto onde crio meus cães mais preciosos!"
 tour_grounds_events.7001.desc_falcons:0 "o viveiro escondido onde mantenho meus falcões mais preciosos!"
 tour_grounds_events.7001.desc_fallback:0 "meu esconderijo secreto de comida, peças de ouro e bens geralmente caros!"
 tour_grounds_events.7001.desc_gold:0 "o tesouro escondido onde guardo minhas pilhas de ouro e baús transbordando de moedas!"
 tour_grounds_events.7001.desc_horses:0 "o pátio secreto onde crio meus cavalos mais preciosos!"
 tour_grounds_events.7001.desc_pantry:0 "a despensa escondida onde guardo minhas especiarias estrangeiras, carne temperada, mel e barris de sal!"
 tour_grounds_events.7001_followup:0 "Seu senhor feudal decidirá o que fazer com suas posses ocultas — você pode acabar pagando impostos extras!"
