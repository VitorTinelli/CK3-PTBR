 tour_type_taxation_desc:0 "$EFFECT_LIST_BULLET$ Alguns eventos permitirão ações avarentas\n$EFFECT_LIST_BULLET$ Realizá-las ganha [gold|E], tanto ao partir de uma [stop|E] quanto no final de sua [GetActivityType('activity_tour').GetName]\n\n#weak Esta Grande Turnê é uma oportunidade de lembrar meus vassalos que lhes é devido tributo e obrigação, e de erradicar qualquer evasão fiscal em meu reino.#!"
