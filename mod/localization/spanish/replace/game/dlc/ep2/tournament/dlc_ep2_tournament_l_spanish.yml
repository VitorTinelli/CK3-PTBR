 tournament_phase_joust_desc:0 "Uma competição equestre em que os concorrentes se enfrentam com lanças, tentando derrubar o oponente ou marcar mais pontos para ser o último em pé.\n\n$tournament_contest_format_versus$\nNúmero de [contest_rounds|e]: 3"
 tournament_phase_melee:0 "Combate Corpo a Corpo"
 tournament_phase_melee_desc:0 "Uma batalha simulada, a cavalo e a pé, entre duas equipes que lutam para controlar um campo contestado e capturar combatentes inimigos para resgate.\n\n$tournament_contest_format_team$"
 tournament_phase_recital:0 "Recital"
 tournament_phase_recital_desc:0 "Uma competição de poesia em que cada concorrente recita publicamente um poema escrito para a ocasião e é avaliado em relação a todos os outros participantes.\n\n$tournament_contest_formaty_turn$"
 tournament_phase_wrestling:0 "Luta Livre"
 tournament_phase_wrestling_desc:0 "Uma competição de força e astúcia, na qual os concorrentes tentam derrubar ou arremessar seus oponentes do ringue para ser o último em pé.\n\n$tournament_contest_format_versus$\nNúmero de [contest_rounds|e]: 3"
