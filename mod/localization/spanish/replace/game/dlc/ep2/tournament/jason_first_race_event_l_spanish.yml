l_spanish:
 contest_horse_race_collision_log:0 "[CHARACTER.GetShortUINamePossessive|U] e [TARGET_CHARACTER.GetShortUIName] colidiram durante a corrida"
 contest_horse_race_collision_log_title:0 "Colisão de Corredores"
 jason_first_race_event.1.a.tt.lose:0 "Você soa nitidamente mesquinho... ninguém lhe dá ouvidos"
 jason_first_race_event.1.a.tt.win:0 "O \"jogo sujo\" de [opponent.GetFirstNamePossessiveNoTooltip] faz com que seu cavalo seja retirado da corrida"
 jason_first_race_event.1.a.tt:0 "Essa agressão é motivo para desqualificá-los!"
 jason_first_race_event.1.a:0 "Uma artimanha! Fui trapaceado!"
 jason_first_race_event.1.b.tt:0 "Você oferece sinceras condolências ao seu colega competidor infortunado."
 jason_first_race_event.1.b:0 "[opponent.GetFirstNameNoTooltip] sozinho compartilha o infortúnio deste momento."
 jason_first_race_event.1.c.tt.lose:0 "[jockey.GetFirstNameNoTooltip] não consegue ouvir você"
 jason_first_race_event.1.c.tt.win:0 "[jockey.GetFirstNameNoTooltip] estabiliza sua montaria"
 jason_first_race_event.1.c.tt:0 "Grite para o seu cavaleiro incentivá-lo a avançar!"
 jason_first_race_event.1.c:0 "\"Afrouxe as rédeas, [jockey.GetFirstNameNoTooltip]!\""
 jason_first_race_event.1.d.tt:0 "Eu apenas espero que [jockey.GetFirstNameNoTooltip] esteja bem..."
 jason_first_race_event.1.d:0 "Adeus, vitória?"
 jason_first_race_event.1.desc.suspicious:0 "De entre os acompanhantes [opponent.GetHerHim], [opponent.GetTitledFirstNameNoTooltip] grita de \"choque\"... de forma pouco convincente."
 jason_first_race_event.1.desc.sympathetic:0 "De entre os acompanhantes [opponent.GetHerHim], [opponent.GetTitledFirstNameNoTooltip] grita de horror."
 jason_first_race_event.1.desc:0 "Em pleno galope, o cavaleiro de [opponent.GetTitledFirstNamePossessive] puxa #EMP [opponent.Custom('GetContestHorseRaceName')]#! em direção ao meu cavalo e seu cavaleiro [jockey.GetFirstName] - ou talvez tenha sido #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! que se desviou para eles? Independentemente disso, todo o grupo infeliz desvia para os lados em direção às barreiras.\n\nOnde antes havia um grupo inteiro de montarias velozes, reluzentes de suor, agora apenas duas se chocam para fora da massa, seus cavaleiros lutando para controlá-las.\n\nO grupo de corredores segue adiante, os dois cavalos cambaleantes agora a uma distância atrás do resto."
 jason_first_race_event.1.t:0 "Um Emaranhado de Pernas"
