l_spanish:
 contest_events.0500.a.contestant:0 "Esta será uma corrida emocionante."
 contest_events.0500.a:0 "Que espetáculo."
 contest_events.0500.b:0 "Eu tenho uma aposta para fazer..."
 contest_events.0500.c:0 "Meu cavalo #EMP irá#! participar!"
 contest_events.0500.closing:0 "Nada supera uma boa corrida."
 contest_events.0500.contestant_horse:0 "Meu cavalo mais rápido, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, não passou despercebido pelos criadores e jogadores.\n\n"
 contest_events.0500.d:0 "[rival_contestant.GetTitledFirstNamePossessiveNoTooltip] não irá #EMP correr#!."
 contest_events.0500.e:0 "Deve haver um jeito de colocar meu cavalo nessa corrida..."
 contest_events.0500.horse_race:0 "Os melhores cavalos em [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], adornados nas cores de seus proprietários, são conduzidos ao redor da [activity.Custom('ContestHorseRaceTrack')] enquanto o heraldo anuncia o início do concurso. Os cavaleiros circulam enquanto esperam a chegada das bestas, alguns se esticando, outros se observando.\n\n"
 contest_events.0500.t:0 "[activity.GetCurrentPhase.GetPhase.GetName]: O Concurso Começa"
 contest_events.0505.a.marriage:0 "Acho que o prêmio será suficiente."
 contest_events.0505.a.winner:0 "Eu, seu [ROOT.Char.GetTitleAsNameNoTooltip], venci!"
 contest_events.0505.a:0 "Parabéns, [contest_winner.GetTitledFirstNameNoTooltip]."
 contest_events.0505.b:0 "[ROOT.Char.GetIntentTarget.GetTitledFirstNameNoTooltip], eu venci por você!"
 contest_events.0505.c.winner:0 "Parece que iremos nos casar, [marriage_prize.GetFirstNameNoTooltip]."
 contest_events.0505.c:0 "Parabéns, a mão de [marriage_prize.GetTitledFirstNamePossessiveNoTooltip] é sua."
 contest_events.0505.contestant_horse:0 "#EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! nem chegou entre os primeiros. Preciso estar melhor preparado(a) da próxima vez!"
 contest_events.0505.d.loser:0 "Sempre haverá próxima vez..."
 contest_events.0505.d.second:0 "Tão perto..."
 contest_events.0505.d.winner:0 "Eu venci! Eu #EMP realmente#! venci!"
 contest_events.0505.d:0 "A fortuna deve favorecer [contest_winner.GetSheHe]."
 contest_events.0505.first_horse:0 "Sim #EMP [ROOT.Char.Custom('GetContestHorseRaceName')|U]#! Você é lindo(a) [ROOT.Char.Custom('ContestHorseRaceGender')]"
 contest_events.0505.first_maydan:0 "Sim, meu #EMP Sabiq#!! Você é lindo(a) [ROOT.Char.Custom('ContestHorseRaceGender')]"
 contest_events.0505.horse_race:0 "O cavalo de [contest_winner.GetShortUINameNoFormat|U], #EMP [contest_winner.Custom('GetContestHorseRaceName')|U]#! cruza a linha de chegada enquanto a multidão explode em aplausos, seguido de perto por #EMP [second_place.GetShortUINameNoFormat] [second_place.Custom('GetContestHorseRaceName')|U]#! e por #EMP [third_place.GetShortUINameNoFormat] [third_place.Custom('GetContestHorseRaceName')|U]#!!\n\n"
 contest_events.0505.second_horse:0 "Tão perto #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!..."
 contest_events.0505.second_maydan:0 "Tão perto meu #EMP Mutabarriz#!, tão perto..."
 contest_events.0505.spectator:0 "Um evento emocionante!"
 contest_events.0505.t.horse_race:0 "$tournament_phase_horse_race$: $contest_events.0505.t$"
 contest_events.0505.t:0 "Vencedor do Concurso"
 contest_events.0505.third_horse:0 "Terceiro lugar... bem feito #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, você conseguiu o pior melhor lugar..."
 contest_events.0505.third_maydan:0 "#EMP Mujalli#!... Acredite, eu poderia estar mais satisfeito..."
 contest_events.0510.a:0 "\"Bônus extra se você vencer!\""
 contest_events.0510.b:0 "\"Acerte-os! Na cara!\""
 contest_events.0510.c:0 "\"Pegue as rédeas deles!\""
 contest_events.0510.d:0 "\"Vai! #EMP Mais rápido!#!\""
 contest_events.0510.desc:0 "Os cavalos continuam a correr em disparada pelo percurso, os cavaleiros restantes puxando as rédeas de seus animais para incentivá-los a ir ainda mais rápido. Já foi uma corrida cheia de acontecimentos, lembro-me quando"
 contest_events.0510.flavor_1:0 "meu cavaleiro caiu da sela, mas se recuperou e voltou a montar.\n\n"
 contest_events.0510.flavor_2:0 "Eu gritei animadamente para incentivar meu cavaleiro.\n\n"
 contest_events.0510.flavor_3:0 "dois cavaleiros e seus cavalos se envolveram em uma colisão.\n\n"
 contest_events.0510.flavor_4:0 "a multidão quase entrou em tumulto.\n\n"
 contest_events.0510.flavor_5:0 "meu cavaleiro contornou o interior da pista, ganhando uma grande vantagem.\n\n"
 contest_events.0510.flavor_6:0 "uma colisão envolvendo vários cavalos derrubou três cavaleiros de uma só vez.\n\n"
 contest_events.0510.flavor_7:0 "meu cavalo foi atingido por um cavalo competidor.\n\n"
 contest_events.0510.flavor_8:0 "todos os espectadores ficaram encantados com um(a) belo(a) jóquei.\n\n"
 contest_events.0510.flavor_9:0 "um plebeu correu nu na pista.\n\n"
 contest_events.0510.flavor_fallback:0 "Resta apenas mais uma volta! Eu me inclino sobre a borda da arquibancada e grito para meu cavaleiro enquanto o grupo passa."
 contest_events.0510.t:0 "Última Volta da $tournament_contest_header$"
 contest_events.0520.a:0 "#EMP [ROOT.Char.Custom('WarhorseStoryName')]#! não vai me decepcionar."
 contest_events.0520.b:0 "Não, o lugar [ROOT.Char.Custom('HorseStoryHerHim')] é no campo de batalha."
 contest_events.0520.desc:0 "A corrida de cavalos se aproxima, e a ideia de colocar meu cavalo de guerra, #EMP [ROOT.Char.Custom('WarhorseStoryName')]#!, em vez do meu corredor, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!, tem passado pela minha cabeça nos últimos dias.\n\nEu não estaria montando n[ROOT.Char.Custom('HorseStorySheHe')] eu mesmo, mas [ROOT.Char.Custom('HorseStorySheHe')] tem espírito mesmo assim..."
 contest_events.0520.t:0 "Cavalo de Guerra"
 contest_events.0530.a:0 "Mais um esforço!"
 contest_events.0530.b:0 "Não falta muito!"
 contest_events.0530.final:0 "\n\nA multidão atinge o ápice. Os cavaleiros instigam seus cavalos em uníssono. A linha de chegada se aproxima."
 contest_events.0530.pivotal_failure:0 "Desequilibrado e surpreso com meu chamado, meu cavaleiro vacila e quase cai. Meu cavalo perde um pouco de terreno enquanto eles contornam a última curva em direção à reta final. Isso vai ser acirrado...\n\n"
 contest_events.0530.pivotal_neutral:0 "É difícil dizer se meu conselho fez alguma diferença, e todos os cavalos contornam a última curva em direção à reta final em um aglomerado.\n\n"
 contest_events.0530.pivotal_success:0 "A estratégia do meu cavaleiro funcionou! Meu cavalo avança rapidamente enquanto eles contornam a última curva em direção à reta final. Restam apenas momentos agora...\n\n"
 contest_events.0530.ptv_bottom:0 "Meu cavalo está em último lugar, e sinto a vitória escapando pelos meus dedos. Precisamos de algo, #EMP qualquer coisa#!..."
 contest_events.0530.ptv_bottom_half:0 "Meu cavalo está encurralado no segundo grupo de corredores, mas a vitória ainda não está fora de alcance. Se meu cavaleiro encontrar um espaço, talvez possamos fazer uma arrancada rumo à vitória..."
 contest_events.0530.ptv_bottom_half_spectator:0 "O cavalo de [pivotal_contestant.GetFirstNamePossessive] está encurralado lá atrás, mas ainda não acabou. Uma ação pode ser o suficiente para virar o jogo para eles..."
 contest_events.0530.ptv_bottom_spectator:0 "O cavalo de [pivotal_contestant.GetFirstNamePossessive] parece praticamente derrotado. [pivotal_contestant.GetSheHe|U] precisa de algo, #EMP qualquer coisa#!..."
 contest_events.0530.ptv_close:0 "É quase impossível dizer quem vai levar a vitória. Eles estão lado a lado!"
 contest_events.0530.ptv_fallback:0 "A corrida se aproxima de sua conclusão, os cavalos esticando seus pescoços para alcançar a linha."
 contest_events.0530.ptv_top:0 "Meu cavalo está se distanciando do pelotão perseguidor! Se ele conseguir se manter à frente dos meus rivais, nós vamos vencer!"
 contest_events.0530.ptv_top_half:0 "Meu cavalo está confortavelmente entre os primeiros colocados, mas está acirrado. Só precisamos de um empurrão extra para vencer!"
 contest_events.0530.ptv_top_half_spectator:0 "O cavalo de [pivotal_contestant.GetFirstNamePossessive] está entre os primeiros colocados, mas está acirrado. A glória ainda está em disputa."
 contest_events.0530.ptv_top_spectator:0 "O cavalo de [pivotal_contestant.GetFirstNamePossessive] se solta! Tudo o que ele precisa fazer agora é levá-lo até o final!"
 contest_events.0530.spectator:0 "\n\nO suor voa dos cavalos galopantes enquanto eles contornam uma curva final, seus cavaleiros os incentivando com vozes fracas, enquanto a multidão urra e grita na cena."
 contest_events.0530.t:0 "Cavalos para Corridas do $tournament_contest_header$"
 contest_events.0600.a.contestant:0 "A glória será nossa!"
 contest_events.0600.a:0 "Ao campo!"
 contest_events.0600.captains_tt:0 "[my_team_captain.GetShortUIName|U] e [other_team_captain.GetShortUIName] são os capitães das equipes devido a [rank|E] e experiência"
 contest_events.0600.champion:0 "Meu campeão, [contest_champion.GetFirstName], mostrará a [other_team_captain.GetTitledFirstName] quem manda!\n\n"
 contest_events.0600.champion_qualify:0 "Meu campeão, [contest_champion.GetFirstName], não se classificou desta vez."
 contest_events.0600.champion_self:0 "Meu campeão, [contest_champion.GetFirstName], e eu mostraremos a [other_team_captain.GetTitledFirstName] quem manda!\n\n"
 contest_events.0600.closing:0 "Isso vai ser bom."
 contest_events.0600.contestant:0 "Minha equipe certamente vencerá a gangue de fanfarrões de [other_team_captain.GetTitledFirstNamePossessive]!\n\n"
 contest_events.0600.melee:0 "Uma clara divisão foi estabelecida entre as duas equipes, que se enfrentam, provocando-se enquanto preparam seus equipamentos e sussurram planos. Cavalos são preparados ao fundo, os garanhões relinchando e resmungando. Será um dia de trabalho brutal.\n\n"
 contest_events.0600.neither_qualify:0 "Nem eu nem meu campeão, [contest_champion.GetFirstName], se classificamos."
 contest_events.0600.self_qualify:0 "Quando me aproximo dos jurados para confirmar meu lugar, sou rejeitado: não me classifiquei desta vez."
 contest_events.0600.t:0 "[activity.GetCurrentPhase.GetPhase.GetName]: O Concurso Começa"
 contest_events.0600.team_tt:0 "Você está na equipe de [my_team_captain.GetShortUIName]"
 contest_events.0605.a.host_loser:0 "Até o [ROOT.Char.GetTitleAsNameNoTooltip] não pode vencer todas..."
 contest_events.0605.a.host_winner:0 "O [ROOT.Char.GetTitleAsNameNoTooltip] é imbatível!"
 contest_events.0605.a.loser:0 "Vamos pegar vocês na próxima vez!"
 contest_events.0605.a.winner:0 "Conseguimos. Nós vencemos!"
 contest_events.0605.a:0 "Que esporte caótico."
 contest_events.0605.desc.loser:0 "Não consegui levar minha equipe à vitória desta vez..."
 contest_events.0605.desc.spectator:0 "Um esporte emocionante, mesmo para os espectadores!"
 contest_events.0605.desc.team_loser:0 "Bem... teremos que treinar mais para a próxima vez..."
 contest_events.0605.desc.team_winner:0 "Bom jogo! Nada supera a emoção da vitória!"
 contest_events.0605.desc.winner:0 "Bem jogado a todos! Hora de comemorar!"
 contest_events.0605.desc:0 "Trombetas soam, a multidão grita, os competidores começam a se reunir. O concurso acabou, e o momento de uma equipe ao sol está sendo preparado. Um arauto avança, com a voz ressoando pela cena.\n\n\"Depois de muitas provações, algumas tribulações e acima de tudo uma competição realmente acirrada, temos nossos vencedores: a equipe de [contest_winner.GetTitledFirstNamePossessive] venceu a equipe de [second_place.GetTitledFirstNamePossessive] no concurso!\"\n\n"
 contest_events.0605.t.melee:0 "$tournament_phase_melee$: $contest_events.0605.t$"
 contest_events.0605.t:0 "Vencedores do Concurso"
 contest_events.0610.a:0 "Vou conquistar uma vitória de soldado!"
 contest_events.0610.b:0 "\"Comigo! À vitória!\""
 contest_events.0610.c:0 "Talvez, se os atrairmos para cá..."
 contest_events.0610.d.tt:0 "Os dados já foram lançados; eu não devo interferir."
 contest_events.0610.d:0 "Talvez devamos apenas enfrentar isso?"
 contest_events.0610.desc:0 "As sombras se alongam à medida que a batalha continua, a confusão diminuindo à medida que os competidores saem cambaleando. Girando meu cavalo, reflito sobre o que aconteceu até agora, como quando"
 contest_events.0610.flavor_10:0 "descobri um cavaleiro misterioso de grande habilidade lutando em meio à batalha.\n\n"
 contest_events.0610.flavor_11:0 "fui encurralado por três cavaleiros inimigos.\n\n"
 contest_events.0610.flavor_12:0 "salvei um membro da Casa de uma situação perigosa.\n\n"
 contest_events.0610.flavor_1:0 "perdi a paciência e espanquei outro competidor até ficar ensanguentado.\n\n"
 contest_events.0610.flavor_2:0 "o prefeito do assentamento local ficou furioso depois que uma briga se espalhou pelas ruas.\n\n"
 contest_events.0610.flavor_3:0 "minha arma foi arrancada das minhas mãos, me fazendo correr atrás dela.\n\n"
 contest_events.0610.flavor_4:0 "uma alma cativante se perdeu na confusão.\n\n"
 contest_events.0610.flavor_5:0 "ganhei o direito de receber um grande resgate!\n\n"
 contest_events.0610.flavor_6:0 "procurando descanso, me abriguei brevemente em um refúgio.\n\n"
 contest_events.0610.flavor_7:0 "enfrentei um famoso guerreiro e sobrevivi para contar a história.\n\n"
 contest_events.0610.flavor_8:0 "me escondi nas árvores, preparando uma emboscada para os passantes desprevenidos.\n\n"
 contest_events.0610.flavor_9:0 "galopei pelo tumulto, observando outros caírem de seus cavalos.\n\n"
 contest_events.0610.flavor_fallback:0 "Os eventos estão claramente se intensificando, com linhas de batalha exaustas sendo traçadas mais uma vez. A oportunidade de deixar minha marca neste concurso é agora."
 contest_events.0610.t:0 "$tournament_contest_header$ Na Batalha"
 contest_events.0620.a:0 "Mais um esforço!"
 contest_events.0620.b:0 "Falta pouco!"
 contest_events.0620.final:0 "\n\nPosso ver os arautos começando a se aproximar do campo para sinalizar o término do evento. O fim está próximo."
 contest_events.0620.pivotal_failure:0 "Como estratégias vão, essa certamente não foi a minha melhor. Embora eu não descrevesse nossa situação como completamente desastrosa, a equipe inimiga rompendo nosso centro e começando a avançar em direção ao nosso acampamento desprotegido ainda pode soar o sino da morte para nossas chances.\n\n"
 contest_events.0620.pivotal_neutral:0 "É difícil dizer o quanto minha última manobra fez diferença. Certamente não perdemos terreno, mas a batalha tumultuada continua na mesma situação de antes.\n\n"
 contest_events.0620.pivotal_success:0 "O estratagema foi um golpe impressionante! A maré muda a favor da minha equipe, vários cavaleiros se libertando enquanto avançamos sobre o flanco deles, correndo em direção ao acampamento inimigo. Só podemos esperar que eles cheguem lá antes que a mesma coisa aconteça conosco.\n\n"
 contest_events.0620.ptv_bottom:0 "Minha equipe está perdendo, e claramente. Sinto a vitória escapando, de forma constante e certa. Seria necessário um esforço enorme para vencer a partir daqui..."
 contest_events.0620.ptv_bottom_half:0 "Estamos perdendo, mas a vitória ainda não está fora de alcance. Apenas mais um último esforço...!"
 contest_events.0620.ptv_bottom_half_spectator:0 "A equipe de [pivotal_contestant.GetFirstNamePossessive] está perdendo, mas ainda não acabou. Uma única ação pode mudar tudo para eles..."
 contest_events.0620.ptv_bottom_spectator:0 "A equipe de [pivotal_contestant.GetFirstNamePossessive] parece desgastada e praticamente derrotada. Seria necessário um esforço gigantesco para vencer a partir daqui..."
 contest_events.0620.ptv_close:0 "É quase impossível dizer qual lado está mais próximo da vitória. Ainda há tudo a ser disputado."
 contest_events.0620.ptv_close_spectator:0 "Ambas as equipes estão quase empatadas! Quem vencerá será decidido por uma margem mínima."
 contest_events.0620.ptv_fallback:0 "A batalha continua, cada vez mais próxima de uma conclusão."
 contest_events.0620.ptv_top:0 "Minha equipe está claramente em melhor forma! A vitória está tão próxima que consigo sentir o gosto!"
 contest_events.0620.ptv_top_half:0 "Minha equipe está ganhando, mas é uma disputa acirrada. Só precisamos nos segurar!"
 contest_events.0620.ptv_top_half_spectator:0 "A equipe de [pivotal_contestant.GetFirstNamePossessive] está avançando, mas é uma disputa acirrada. A glória ainda está em jogo."
 contest_events.0620.ptv_top_spectator:0 "A equipe de [pivotal_contestant.GetFirstNamePossessive] está claramente dominando! Tudo o que eles precisam fazer agora é levar para casa!"
 contest_events.0620.spectator:0 "\n\nO som rítmico do metal batendo no metal continua a cortar o ar. Os espectadores, espalhados ao redor da confusão, incentivam seus favoritos, mesmo quando mais e mais concorrentes sucumbem ao resgate e à ruína."
 contest_events.0620.t:0 "$tournament_contest_header$ Os Golpes Finais"
 contest_events.0700.a.contestant:0 "É hora de mostrar ao mundo minha habilidade."
 contest_events.0700.a:0 "Fico imaginando quem vai vencer!"
 contest_events.0700.archery:0 "A multidão diversificada de competidores circula pelos alvos, comparando arcos e trocando histórias de seus melhores tiros. O rangido dos arcos e o estalo das cordas ecoam ao longe, pontuando o burburinho, um cheiro de resina pairando pelo ar calmo.\n\n"
 contest_events.0700.b:0 "Tenho uma aposta para fazer..."
 contest_events.0700.c:0 "Eu #EMP irei#! participar do meu próprio concurso."
 contest_events.0700.champion:0 "Talvez meu campeão, [contest_champion.GetName], me encha de orgulho.\n\n"
 contest_events.0700.closing:0 "Que vença o melhor!"
 contest_events.0700.contestant:0 "Meus ouvidos se aguçam quando meu nome é mencionado, flutuando pela brisa suave. Isso pode ser um bom sinal ou um mau sinal..."
 contest_events.0700.d:0 "[rival_contestant.GetTitledFirstNameNoTooltip] não está apto para competir."
 contest_events.0700.e:0 "Se eu encontrasse a pessoa certa para conversar..."
 contest_events.0700.recital:0 "Os participantes circulam pela tenda principal, aquecendo as cordas vocais e memorizando estrofes enquanto a multidão enche o anfiteatro.\n\n"
 contest_events.0700.t:0 "[activity.GetCurrentPhase.GetPhase.GetName]: O Concurso Começa"
 contest_events.0705.a.marriage:0 "Mudei de ideia, apenas o prêmio para você."
 contest_events.0705.a.winner:0 "Sim! Seu [ROOT.Char.GetTitleAsNameNoTooltip] triunfa!"
 contest_events.0705.a:0 "Parabéns, [contest_winner.GetTitledFirstNameNoTooltip]."
 contest_events.0705.b:0 "Eu fiz tudo por [ROOT.Char.GetIntentTarget.GetTitledFirstNameNoTooltip]!"
 contest_events.0705.c.winner:0 "Parece que vamos nos casar, [marriage_prize.GetFirstNameNoTooltip]."
 contest_events.0705.c:0 "Parabéns, [marriage_prize.GetTitledFirstNamePossessiveNoTooltip], sua mão é sua."
 contest_events.0705.contestant:0 "Vou mostrar a eles - da próxima vez."
 contest_events.0705.contestant_champion:0 "Meu campeão, [contest_champion.GetTitledFirstName], não conseguiu ficar entre os três primeiros..."
 contest_events.0705.d.loser:0 "Sempre haverá uma próxima vez..."
 contest_events.0705.d.second:0 "Tão perto..."
 contest_events.0705.d.winner:0 "Eu ganhei! Eu realmente ganhei!"
 contest_events.0705.d:0 "A melhor [contest_winner.GetWomanMan] venceu."
 contest_events.0705.desc:0 "Trombetas soam, a multidão clama, os competidores começam a se reunir. O concurso acabou, e o momento de alguém ao sol está sendo preparado. Um arauto se adianta, sua voz ecoando por toda a cena.\n\nApós muitos testes, algumas tribulações e, acima de tudo, uma competição realmente acirrada, temos nossos três finalistas. Em terceiro lugar, o destemido [third_place.GetTitledFirstName]. Em segundo lugar, [second_place.GetTitledFirstName]! Isso, é claro, nos deixa com nosso vencedor, [contest_winner.GetTitledFirstName]!\"\n\n"
 contest_events.0705.first:0 "Eu sabia que poderia vencer!"
 contest_events.0705.first_champion:0 "Ninguém pode derrotar [contest_champion.GetTitledFirstName]!"
 contest_events.0705.second:0 "Segundo lugar, suponho que não posso reclamar."
 contest_events.0705.second_champion:0 "[contest_champion.GetTitledFirstName] me encheu de orgulho."
 contest_events.0705.spectator:0 "Um show de habilidade muito divertido!"
 contest_events.0705.spectator_champion:0 "Meu campeão, [contest_champion.GetTitledFirstName], não competiu."
 contest_events.0705.t.archery:0 "$tournament_phase_archery$: $contest_events.0505.t$"
 contest_events.0705.t.recital:0 "$tournament_phase_recital$: $contest_events.0505.t$"
 contest_events.0705.third:0 "Ah, sou o menos vitorioso dos vencedores..."
 contest_events.0705.third_champion:0 "Não é campeão, mas pelo menos [contest_champion.GetTitledFirstName] chegou perto..."
 contest_events.0710.a:0 "Estou em perfeita sintonia com meu arco!"
 contest_events.0710.b:0 "'Adquirir' uma flecha melhor me daria uma vantagem..."
 contest_events.0710.c:0 "Com esse vento, essa trajetória deve ser suficiente."
 contest_events.0710.d:0 "Meu último disparo deve ser normal, acho."
 contest_events.0710.desc:0 "O crepúsculo começa a cair lentamente enquanto a competição continua, o estalar das cordas um ritmo marcado. Eu me apoio no meu arco, considerando o rumo que esse concurso tomou até agora, como quando"
 contest_events.0710.flavor_1:0 "outro competidor fez um escândalo por causa da falta de silêncio durante sua vez.\n\n"
 contest_events.0710.flavor_2:0 "um espectador foi tragicamente atingido por uma flecha.\n\n"
 contest_events.0710.flavor_3:0 "enviei um disparo bem no centro do alvo.\n\n"
 contest_events.0710.flavor_4:0 "enviei um disparo que caiu curto do alvo.\n\n"
 contest_events.0710.flavor_5:0 "um estranho misterioso chegou ao evento, gerando muitos rumores.\n\n"
 contest_events.0710.flavor_6:0 "o vento começou a soprar forte, me obrigando a improvisar.\n\n"
 contest_events.0710.flavor_7:0 "fiquei entediado durante a competição e vacilei com o desejo de causar um pouco de confusão.\n\n"
 contest_events.0710.flavor_8:0 "decidi que o concurso precisava de um pouco mais de animação.\n\n"
 contest_events.0710.flavor_9:0 "uma flecha se desviou no caminho para o alvo e atingiu outro competidor.\n\n"
 contest_events.0710.flavor_fallback:0 "A competição está chegando ao fim, enquanto as flechas continuam a voar em direção aos alvos — e além. Se eu quiser ter algum impacto a partir daqui, devo agir agora."
 contest_events.0710.t:0 "$tournament_contest_header$ Alvejando com Precisão"
 contest_events.0711.a:0 "Uma canção sobre ganhar dinheiro e viver uma boa vida."
 contest_events.0711.b:0 "Embeleze a multidão com um conto de guerra e vitória!"
 contest_events.0711.c:0 "Apelo a uma força superior."
 contest_events.0711.d:0 "Vamos manter seguro e simples."
 contest_events.0711.desc:0 "A noite começa a cair sobre o cenário, mas tochas iluminam a competição que continua. Falo comigo mesmo em voz baixa, preparando meus lábios para a próxima rodada enquanto relembro os acontecimentos até agora, como quando"
 contest_events.0711.flavor_1:0 "outro competidor teve um verso suspeitosamente semelhante ao meu antes de subir ao palco.\n\n"
 contest_events.0711.flavor_2:0 "outro competidor conseguiu plagiar um verso famoso.\n\n"
 contest_events.0711.flavor_3:0 "tive que lidar com um ataque de medo de palco.\n\n"
 contest_events.0711.flavor_4:0 "os céus se abriram e encharcaram competidores e público.\n\n"
 contest_events.0711.flavor_5:0 "vi uma oportunidade de insultar outro competidor em verso.\n\n"
 contest_events.0711.flavor_6:0 "minha honra foi manchada por outro competidor, e tive que responder da mesma forma.\n\n"
 contest_events.0711.flavor_7:0 "meu verso foi tão bem que senti a compulsão de imediatamente segui-lo com outro.\n\n"
 contest_events.0711.flavor_8:0 "meu verso foi tão mal que senti a compulsão de imediatamente consertá-lo com outro.\n\n"
 contest_events.0711.flavor_fallback:0 "Eu dou um passo à frente para minha vez, subindo os degraus do pódio. É hora do verso final."
 contest_events.0711.t:0 "$tournament_contest_header$ Palavra aos Sábios"
 contest_events.0720.a:0 "Apenas mais uma flechada..."
 contest_events.0720.b:0 "Apenas mais uma flechada!"
 contest_events.0720.final:0 "Restam apenas algumas flechas para cada competidor. O fim está próximo."
 contest_events.0720.pivotal_failure:0 "Ao puxar a corda até o queixo, sinto o mais leve tremor em meu braço. Eu solto em pânico, mas o estrago está feito. A flecha voa descontroladamente, vacilando no ar, antes de assobiar bem ao lado do alvo! A multidão geme, e eu coloco a mão na cabeça.\n\n"
 contest_events.0720.pivotal_neutral:0 "Meu tiro voa verdadeiro, mas agonizantemente não tão verdadeiro quanto eu gostaria. Ele bate no alvo, mas apenas na borda. Não vai me prejudicar, mas provavelmente não vai me dar muito crédito também.\n\n"
 contest_events.0720.pivotal_success:0 "Dou um passo à frente, prendo, aponto, puxo e solto. A flecha assobia pelo ar, cravando-se profundamente no alvo. A multidão irrompe. Não há argumentos; é um ponto enorme a meu favor!\n\n"
 contest_events.0720.ptv_bottom:0 "Estou à deriva, muito atrás dos líderes. Seria necessário uma grande reviravolta de sorte para vencer a partir daqui..."
 contest_events.0720.ptv_bottom_half:0 "Estou abandonado na metade de baixo da classificação, mas uma vitória ainda não está completamente fora de alcance..."
 contest_events.0720.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] está abandonado na metade de baixo da classificação, mas uma vitória ainda não está completamente fora de alcance..."
 contest_events.0720.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] parece estar praticamente derrotado. Seria necessário uma grande reviravolta de sorte para vencer a partir daqui..."
 contest_events.0720.ptv_close:0 "É quase impossível dizer quem está vencendo. Eu definitivamente estou entre os líderes, mas estamos todos praticamente lado a lado!"
 contest_events.0720.ptv_close_spectator:0 "Está tão acirrado no topo. Os líderes estão praticamente lado a lado!"
 contest_events.0720.ptv_fallback:0 "Mais flechas são disparadas, competidores desesperados soltando-as quase tão rapidamente quanto lhes é permitido."
 contest_events.0720.ptv_top:0 "Estou vencendo! A vitória está tão próxima!"
 contest_events.0720.ptv_top_half:0 "Estou na metade de cima, mas não estou liderando. Com um pouco de sorte, isso ainda pode se transformar em uma vitória..."
 contest_events.0720.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] está se destacando, mas [pivotal_contestant.GetSheHe] ainda não está vencendo. A glória ainda está em jogo."
 contest_events.0720.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] está claramente vencendo! Contanto que [pivotal_contestant.GetSheHe] mantenha a calma, a vitória é praticamente garantida!"
 contest_events.0720.spectator:0 "\n\nUma maldição enquanto a corda do arco roça o antebraço. Um estalo vindo da corda, seja ela quebrada ou simplesmente alta, ecoa pela área. A multidão cai em um ritmo: silêncio absoluto quando um competidor se aproxima, aplausos estrondosos quando a flecha é lançada."
 contest_events.0720.t:0 "$tournament_contest_header$ Cordas Tensas"
 contest_events.0721.a:0 "Apenas mais um verso..."
 contest_events.0721.b:0 "Apenas mais um verso!"
 contest_events.0721.final:0 "Restam poucos competidores, e ainda menos tempo. Tudo se resume a isso."
 contest_events.0721.pivotal_failure:0 "Termino meu verso com um punho erguido e aplomb sonoro. No entanto, a multidão apenas aplaude educadamente, intercalando com algumas tosses. Meus ombros se curvam enquanto deixo o pódio. Minhas esperanças estão diminuindo...\n\n"
 contest_events.0721.pivotal_neutral:0 "Meu último verso recebe aplausos e aclamações, mas, enquanto me afasto do pódio, não consigo evitar a sensação incômoda de que não me fiz justiça por completo.\n\n"
 contest_events.0721.pivotal_success:0 "Termino meu último verso, mas a multidão não esperou pelo final. Os aplausos abafam minhas palavras, flores caem ao meu redor no palco enquanto me afasto.\n\n"
 contest_events.0721.ptv_fallback:0 "Cada vez mais competidores formam fila para subir ao pódio, nervosamente mudando de pé."
 contest_events.0721.spectator:0 "\n\nUma única palavra fora do lugar é o suficiente para fazer a multidão gemer desesperadamente neste momento, enquanto as entregas sucintas causam aplausos tumultuados. Os espectadores batem os pés e aplaudem enquanto os competidores se aproximam do palco, criando um clima febril."
 contest_events.0721.t:0 "$tournament_contest_header$ Bem Versado"
 contest_events.0800.a.champion:0 "Vamos lá, [contest_champion.GetTitledFirstNameNoTooltip]! Conquiste o título de campeão!"
 contest_events.0800.a.contestant:0 "Estou pronto!"
 contest_events.0800.a:0 "Que vença o melhor!"
 contest_events.0800.b:0 "Eu tenho uma aposta para fazer..."
 contest_events.0800.board_game:0 "Os competidores ocupam seus lugares nas mesas de jogo, afofando suas almofadas e solicitando bebidas, enquanto o arauto anuncia o início do concurso. Os próprios jogos são dispostos nas mesas, as peças polidas com um brilho espelhado.\n\n"
 contest_events.0800.c:0 "Não seria adequado para o [ROOT.Char.GetTitleAsNameNoTooltip] não competir..."
 contest_events.0800.champion_self:0 "[Select_CString( contest_champion.IsFemale, 'Minha campeã', 'Meu campeão' )], [contest_champion.GetFirstName], e eu mostraremos a esses brutamontes quem é que manda!\n\n"
 contest_events.0800.d:0 "[rival_contestant.GetTitledFirstNameNoTooltip]?! Não nos #EMP meus#! jogos"
 contest_events.0800.desc:0 "As diversas entonações e volumes dos aplausos da multidão não deixam dúvidas sobre os favoritos."
 contest_events.0800.duel:0 "Os competidores marcham para o campo, ocupando seus lugares ao redor do quadrado de combate, enquanto o arauto anuncia o início do concurso. O ringue quadrado é examinado ao fundo, sacudido e chacoalhado para garantir que não haja flexibilidade caso um competidor colida com ele.\n\n"
 contest_events.0800.e.flavor:0 "Você, pajem! Tenho uma tarefa delicada..."
 contest_events.0800.e:0 "Talvez a lista possa ser alterada..."
 contest_events.0800.f.flavor:0 "É apenas apropriado."
 contest_events.0800.f:0 "Claro, [versus_contestant.GetFirstNameNoTooltip] vai ceder ao seu senhor feudal..."
 contest_events.0800.joust:0 "Os concorrentes circulam a arena a cavalo, seus pajens com os braços erguidos, enquanto o arauto anuncia o início do concurso. Escudeiros se apressam de um lado para o outro, adornados com as cores de seus senhores, carregando equipamentos e suprimentos para os combates que virão.\n\n"
 contest_events.0800.t:0 "[activity.GetCurrentPhase.GetPhase.GetName]: Início do Concurso"
 contest_events.0800.vs:0 "\n\nPara minha primeira luta, fui pareado com [Select_CString( versus_contestant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)], [versus_contestant.GetName]."
 contest_events.0800.wrestling:0 "Espalhados pela areia, os competidores sem camisa se aquecem para suas lutas enquanto o arauto anuncia o início do concurso. Alguns dos competidores esfregam terra no corpo, outros optam por óleos, todos procurando uma pequena vantagem nas lutas que estão por vir.\n\n"
 contest_events.0805.a.marriage:0 "Só este [contest_prize.GetType|l] para você, na verdade."
 contest_events.0805.a.winner:0 "Eu venci! Seu [ROOT.Char.GetTitleAsNameNoTooltip] venceu!"
 contest_events.0805.a:0 "Parabéns, [contest_winner.GetTitledFirstNameNoTooltip]."
 contest_events.0805.b:0 "Dedico minha vitória a [ROOT.Char.GetIntentTarget.GetTitledFirstNameNoTooltip]!"
 contest_events.0805.c.winner:0 "Parece que vamos nos casar, [marriage_prize.GetFirstNameNoTooltip]."
 contest_events.0805.c:0 "Bom trabalho, a mão [marriage_prize.GetTitledFirstNamePossessiveNoTooltip] é sua."
 contest_events.0805.contestant:0 "\"Preciso me esforçar mais da próxima vez!\" penso comigo mesmo, observando o braço do vencedor ser levantado."
 contest_events.0805.contestant_champion:0 "\n\nMeu campeão, [contest_champion.GetFirstName], mal correspondeu ao nome..."
 contest_events.0805.d.loser:0 "Sempre haverá uma próxima vez..."
 contest_events.0805.d.second:0 "Tão perto..."
 contest_events.0805.d.winner:0 "Eu venci! Eu #EMP realmente#!"
 contest_events.0805.d:0 "Uma vitória bem merecida."
 contest_events.0805.desc:0 "Trombetas soam, a multidão aclama, os competidores começam a se reunir. O concurso acabou, e o momento de alguém ao sol está sendo preparado. Um arauto dá um passo à frente, sua voz ressoando por toda a cena.\n\n\"Após muitos desafios, algumas tribulações e acima de tudo uma competição realmente acirrada, [contest_winner.GetTitledFirstName] derrotou [second_place.GetTitledFirstName] na final! [contest_winner.GetFirstNameNoTooltip] é o nosso vencedor!\"\n\n"
 contest_events.0805.first:0 "Realmente, não há ninguém em [host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] que possa igualar minha habilidade!"
 contest_events.0805.first_champion:0 "\n\nMeu campeão #EMP realmente#! venceu?! Preciso recompensar [contest_champion.GetSheHe]!"
 contest_events.0805.second:0 "Eu não venci, mas cheguei muito perto..."
 contest_events.0805.second_champion:0 "\n\nEmbora [contest_champion.GetSheHe] não tenha vencido, ainda estou orgulhoso do meu campeão."
 contest_events.0805.spectator:0 "Um evento muito divertido!"
 contest_events.0805.spectator_champion:0 "\n\nMeu campeão, [contest_champion.GetFirstName], nem sequer se classificou."
 contest_events.0805.t.board_game:0 "$tournament_phase_board_game$: $contest_events.0505.t$"
 contest_events.0805.t.duel:0 "$tournament_phase_duel$: $contest_events.0505.t$"
 contest_events.0805.t.joust:0 "$tournament_phase_joust$: $contest_events.0505.t$"
 contest_events.0805.t.wrestling:0 "$tournament_phase_wrestling$: $contest_events.0505.t$"
 contest_events.0810.a.bad_lose:0 "Ha! Não desta vez, [contest_loser.GetFirstNameNoTooltip]!"
 contest_events.0810.a.bad_win:0 "Sorte d[Select_CString( contest_winner.IsFemale, 'a', 'o' )] [contest_winner.Custom2('InsultNoun', ROOT.Char)]..."
 contest_events.0810.a.champion_lose:0 "Oh, [contest_loser.GetFirstNameNoTooltip]... Que campeão..."
 contest_events.0810.a.champion_win:0 "Sim, [contest_winner.GetFirstNameNoTooltip]! Esse é o meu campeão!"
 contest_events.0810.a.child_lose:0 "Você deu o seu melhor, [ROOT.Char.Custom2('RelationToMeShort', contest_loser)]."
 contest_events.0810.a.child_win:0 "Essa é [Select_CString( contest_winner.IsFemale, 'a minha', 'o meu' )] [contest_winner.Custom('GirlBoy')]!"
 contest_events.0810.a.children:0 "Vocês dois me encheram de orgulho."
 contest_events.0810.a.close_family:0 "O [ROOT.Char.Custom2('RelationToMeShort', contest_winner)] vence o [ROOT.Char.Custom2('RelationToMeShort', contest_loser)]!"
 contest_events.0810.a.close_family_lose:0 "Má sorte, [ROOT.Char.Custom2('RelationToMeShort', contest_loser)]..."
 contest_events.0810.a.close_family_win:0 "Esse é o meu [ROOT.Char.Custom2('RelationToMeShort', contest_winner)]!"
 contest_events.0810.a.consort_loser:0 "Você deu o seu melhor, querido."
 contest_events.0810.a.consort_winner:0 "Muito bem, querido!"
 contest_events.0810.a.consorts:0 "Vocês dois me enchem de orgulho!"
 contest_events.0810.a.death:0 "Trágico..."
 contest_events.0810.a.good_lose:0 "Não foi o seu dia, [contest_loser.GetFirstNameNoTooltip]!"
 contest_events.0810.a.good_win:0 "Três vivas para [contest_winner.GetFirstNameNoTooltip]!"
 contest_events.0810.a.house:0 "Um bom desempenho para a Casa [contest_winner.GetHouse.GetBaseNameNoTooltip]!"
 contest_events.0810.a.house_lost:0 "Não foi um bom dia para a Casa [contest_loser.GetHouse.GetBaseNameNoTooltip]..."
 contest_events.0810.a.house_won:0 "Uma vitória para toda a Casa [contest_winner.GetHouse.GetBaseNameNoTooltip]!"
 contest_events.0810.a.knight_lose:0 "Não é o meu $knight_culture_player_no_tooltip_lowercase$ favorito, é preciso dizer..."
 contest_events.0810.a.knight_win:0 "Não mexa com os $knight_culture_player_plural_no_tooltip_lowercase$ [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
 contest_events.0810.a.knights:0 "Bem lutado, $knight_culture_player_plural_no_tooltip_lowercase$!"
 contest_events.0810.a.murder_fail_lose:0 "Não deu certo..."
 contest_events.0810.a.murder_fail_win:0 "Maldito(a) [contest_winner.GetWomanMan]!"
 contest_events.0810.a.murder_success:0 "Perfeito!"
 contest_events.0810.a.wager_loss:0 "Lá se foi minha aposta..."
 contest_events.0810.a.wager_win:0 "Sim! A aposta continua valendo!"
 contest_events.0810.a:0 "Uma ótima competição!"
 contest_events.0810.average:0 "Ambos os competidores demonstraram habilidades impressionantes, mas, no fim das contas, [contest_winner.Custom2('GetVersusContestEndFlavor', contest_loser)]"
 contest_events.0810.b:0 "Prendam esse criminoso!"
 contest_events.0810.both_relation:0 "A luta entre meu [ROOT.Char.Custom2('RelationToMeShort', contest_winner)], [contest_winner.GetTitledFirstName], e meu [ROOT.Char.Custom2('RelationToMeShort', contest_loser)], [contest_loser.GetTitledFirstName], foi decidida.\n\n"
 contest_events.0810.c:0 "Uma tragédia infeliz..."
 contest_events.0810.champion_lost:0 "Lá se vão as chances do meu campeão..."
 contest_events.0810.champion_won:0 "#EMP Por isso#! que [contest_winner.GetSheHe] é meu campeão!"
 contest_events.0810.close:0 "Foi uma luta acirrada, mas no final [contest_winner.Custom2('GetVersusContestEndFlavor', contest_loser)]"
 contest_events.0810.death:0 "\n\nAi, [contest_loser.GetFirstNameNoTooltip] ficou ferido por seus esforços e morreu logo em seguida."
 contest_events.0810.desc:0 "A luta entre [contest_winner.GetTitledFirstName] e [contest_loser.GetTitledFirstName] foi decidida.\n\n"
 contest_events.0810.far:0 "Após uma luta decepcionantemente unilateral, ninguém ficou surpreso quando [contest_winner.Custom2('GetVersusContestEndFlavor', contest_loser)]"
 contest_events.0810.final:0 "\n\nIsso significa que [contest_winner.GetFirstNameNoTooltip] venceu o concurso de [activity.GetCurrentPhase.GetPhase.GetName]."
 contest_events.0810.loser_relation:0 "A luta entre [contest_winner.GetTitledFirstName] e meu [ROOT.Char.Custom2('RelationToMeShort', contest_loser)], [contest_loser.GetTitledFirstName], foi decidida.\n\n"
 contest_events.0810.murder_fail_lose:0 "Minha sabotagem elaborada não teve o resultado pretendido - [contest_loser.GetFirstNameNoTooltip] ainda vive - mas [Select_CString( contest_loser.IsFemale, 'a', 'o' )] [contest_winner.Custom2('InsultNoun', ROOT.Char)] miserável não venceu, pelo menos..."
 contest_events.0810.murder_fail_win:0 "Não apenas minha sabotagem falhou em matar [contest_winner.GetSheHe], mas [contest_winner.GetFirstNameNoTooltip], [Select_CString( contest_loser.IsFemale, 'a', 'o' )] [contest_winner.Custom2('InsultNoun', ROOT.Char)] miserável, conseguiu vencer a maldita luta!"
 contest_events.0810.murder_success:0 "Meus planos cuidadosamente elaborados para [contest_loser.GetFirstNameNoTooltip] ocorreram exatamente como planejado, [Select_CString( contest_loser.IsFemale, 'a', 'o' )] [contest_loser.Custom2('InsultNoun', ROOT.Char)] miserável não vai mais me incomodar!"
 contest_events.0810.qualify:0 "\n\n[contest_winner.GetFirstNameNoTooltip] está classificado para a semifinal."
 contest_events.0810.semi:0 "\n\n[contest_winner.GetFirstNameNoTooltip] está na final."
 contest_events.0810.t:0 "[activity.GetCurrentPhase.GetPhase.GetName] [activity.Custom('GetVersusRound')]: [contest_winner.GetFirstNameNoTooltip] e [contest_loser.GetFirstNameNoTooltip]"
 contest_events.0810.winner_relation:0 "A luta entre meu [ROOT.Char.Custom2('RelationToMeShort', contest_winner)], [contest_winner.GetTitledFirstName], e [contest_loser.GetTitledFirstName], foi decidida.\n\n"
 contest_events.0810.wound:0 "\n\nAs feridas de [contest_loser.GetFirstNamePossessiveNoTooltip] falam de seu valor."
 contest_events.0820.a:0 "Eu posso fazer isso!"
 contest_events.0820.b:0 "Na verdade... eu desisto..."
 contest_events.0820.c.disqualified:0 "Por isso você segue as regras."
 contest_events.0820.c.resigned:0 "Desistiu? Eu ganhei!"
 contest_events.0820.contestant:0 "Não há mais tempo para preparação. Por [ROOT.Char.GetFaith.WarGodName], mostrarei ao meu adversário uma coisa ou duas!\n\n"
 contest_events.0820.d.contestant:0 "Estou pronto!"
 contest_events.0820.d.loser:0 "Eu vou vencer na próxima vez..."
 contest_events.0820.d:0 "Uma rodada interessante..."
 contest_events.0820.final:0 "As semifinais da atividade [activity.GetCurrentPhase.GetPhase.GetName] chegaram ao fim!\n\nO arauto anuncia: \"[contest_summary_1.GetNameRegnal] e [contest_summary_2.GetNameRegnal] alcançaram a final!\"\n\n"
 contest_events.0820.intent_match:0 "Enquanto isso, [intent_scope.GetTitledFirstName] foi [Select_CString( intent_scope.IsFemale, 'pareada', 'pareado' )] com [intent_match.GetTitledFirstName].\n\n"
 contest_events.0820.open:0 "Os combates da atividade [activity.GetCurrentPhase.GetPhase.GetName] finalmente começam a sério.\n\nQuem entre os dignos concorrentes será coroado com glória agora está nas mãos de [ROOT.Char.GetFaith.HighGodName] sozinho!\n\n"
 contest_events.0820.qualify:0 "As eliminatórias da atividade [activity.GetCurrentPhase.GetPhase.GetName] chegaram ao fim, e está claro quem será selecionado para as quartas de final.\n\n"
 contest_events.0820.semi:0 "As quartas de final da atividade [activity.GetCurrentPhase.GetPhase.GetName] chegaram ao fim!\n\nO arauto anuncia: \"[contest_summary_1.GetNameRegnal], [contest_summary_2.GetNameRegnal], [contest_summary_3.GetNameRegnal] e [contest_summary_4.GetNameRegnal] alcançaram as semifinais!\"\n\n"
 contest_events.0820.t:0 "[activity.GetCurrentPhase.GetPhase.GetName]: [activity.Custom('GetVersusRound')]"
 contest_events.0820.vs:0 "Meu próximo combate será contra [Select_CString( versus_contestant.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)], [versus_contestant.GetTitledFirstName].\n\n"
 contest_events.0820.vs_disqualified:0 "Meu próximo combate seria contra [Select_CString( versus_contestant.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)], [versus_contestant.GetTitledFirstName], mas [versus_contestant.GetSheHe] foi [Select_CString( versus_contestant.IsFemale, 'desqualificada', 'desqualificado' )]!\n\n"
 contest_events.0820.vs_final:0 "Cheguei à luta final! [versus_contestant.GetTitledFirstName] é tudo que me separa da vitória.\n\n"
 contest_events.0820.vs_resigned:0 "Meu próximo combate seria contra [Select_CString( versus_contestant.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMeShort', versus_contestant)], [versus_contestant.GetTitledFirstName], mas [versus_contestant.GetSheHe] desistiu!\n\n"
 contest_events.0820.woo_vow:0 "Discretamente, observo as arquibancadas em busca de [woo_target.GetTitledFirstName] e logo avisto [woo_target.GetSheHe] olhando para mim melancolicamente - [woo_target.GetSheHe] parece certa de que eu irei competir..."
 contest_events.0825.a:0 "De fato?"
 contest_events.0825.b:0 "[resign_target.GetSheHe|U] fez #EMP O QUÊ?!#!"
 contest_events.0825.desc:0 "Evitando o perigo, ou talvez impulsionado(a) por algum outro motivo, [resign_target.GetTitledFirstName] desistiu para o(a) seu/sua oponente, [versus_contestant.GetTitledFirstName], no(a) concurso de [activity.GetCurrentPhase.GetPhase.GetName|l].\n\n"
 contest_events.0825.final:0 "[versus_contestant.GetFirstNameNoTooltip] vence o concurso por padrão!"
 contest_events.0825.qualify:0 "[versus_contestant.GetFirstNameNoTooltip] avançará para as semifinais por padrão."
 contest_events.0825.safe:0 "Evitando a chance de passar por constrangimento, ou talvez impulsionado(a) por algum outro motivo, [resign_target.GetTitledFirstName] desistiu para o(a) seu/sua oponente, [versus_contestant.GetTitledFirstName], no(a) concurso de [activity.GetCurrentPhase.GetPhase.GetName|l].\n\n"
 contest_events.0825.semi:0 "[versus_contestant.GetFirstNameNoTooltip] avançará para a final por padrão."
 contest_events.0825.t:0 "$activity_tournament$: Resignação do(a) [activity.GetCurrentPhase.GetPhase.GetName]"
 contest_events.0826.a:0 "Uma surpresa, com certeza."
 contest_events.0826.b:0 "[disqualify_target.GetSheHe|U] fez #EMP O QUÊ?!#!"
 contest_events.0826.desc:0 "Demonstrando sua ira, [host.GetTitledFirstName] desqualificou [disqualify_target.GetTitledFirstName] do(a) concurso de [activity.GetCurrentPhase.GetPhase.GetName|l], abrindo caminho para que [versus_contestant.GetTitledFirstName] progrida.\n\n"
 contest_events.0826.t:0 "$activity_tournament$: Desqualificação do(a) [activity.GetCurrentPhase.GetPhase.GetName]"
 contest_events.0840.a:0 "Habilidade"
 contest_events.0840.b:0 "Intriga"
 contest_events.0840.c:0 "Aprendizado"
 contest_events.0840.desc:0 "[versus_contestant.GetTitledFirstName] e eu lutamos!"
 contest_events.0840.t:0 "Duelo [activity.GetCurrentPhase.GetPhase.GetName]"
 contest_events.0841.a:0 "Lutamos bem."
 contest_events.0841.b:0 "Droga..."
 contest_events.0841.c:0 "[contest_winner.GetSheHe|U] trapaceou! Desqualificado(a)!"
 contest_events.0841.desc:0 "Depois que [versus_contestant.GetTitledFirstName] e eu terminamos nosso último duelo, seguro a respiração enquanto os pontos são contados...\n\n"
 contest_events.0841.final:0 "\n\n[contest_winner.GetSheHe|U] venceu o concurso [activity.GetCurrentPhase.GetPhase.GetName]!"
 contest_events.0841.final_win:0 "\n\nEu venci o concurso [activity.GetCurrentPhase.GetPhase.GetName]!"
 contest_events.0841.loser:0 "Os juízes logo anunciam que [versus_contestant.GetTitledFirstNameNoTooltip] me venceu!"
 contest_events.0841.qualify:0 "\n\n[contest_winner.GetSheHe|U] está classificado(a) para a semifinal do [activity.GetCurrentPhase.GetPhase.GetName]!"
 contest_events.0841.qualify_win:0 "\n\nEstou classificado(a) para a semifinal do [activity.GetCurrentPhase.GetPhase.GetName]!"
 contest_events.0841.semi:0 "\n\n[contest_winner.GetSheHe|U] está classificado(a) para a final do [activity.GetCurrentPhase.GetPhase.GetName]!"
 contest_events.0841.semi_win:0 "\n\nEstou classificado(a) para a final do [activity.GetCurrentPhase.GetPhase.GetName]!"
 contest_events.0841.t:0 "Duelo [activity.GetCurrentPhase.GetPhase.GetName]: [activity.Custom('GetVersusRound')]"
 contest_events.0841.winner:0 "Eu venci [versus_contestant.GetTitledFirstName]!"
 contest_events.0850.a:0 "$contest_events.0840.t$"
 contest_events.0850.desc:0 "$contest_events.0840.t$"
 contest_events.0850.t:0 "$contest_events.0840.t$"
 contest_events.0852.a:0 "Ok"
 contest_events.0852.desc:0 "Oh, quem ganhou?"
 contest_events.0852.t:0 "$contest_events.0840.t$"
 contest_events.0853.a:0 "$contest_events.0852.a$"
 contest_events.0853.desc:0 "$contest_events.0852.desc$"
 contest_events.0853.t:0 "$contest_events.0852.t$"
 contest_events.0860.a:0 "Talvez se eu acertar a cabeça deles..."
 contest_events.0860.b:0 "Aponte alto, ataque baixo."
 contest_events.0860.c:0 "Acho que vi uma dica em uma passada anterior..."
 contest_events.0860.d:0 "Sem truques. Apenas mirar no escudo."
 contest_events.0860.desc:0 "As bandeiras tremulam e balançam ao vento, roubando o fôlego da multidão por um momento enquanto eu controlo meu cavalo. Ergo minha lança enquanto os eventos anteriores do concurso se repetem em minha mente, como quando"
 contest_events.0860.flavor_10:0 "outro competidor caiu do cavalo, sofrendo uma ferida horrível.\n\n"
 contest_events.0860.flavor_1:0 "eu lutei mesmo depois de ter sido atingido(a) com força em minha lateral.\n\n"
 contest_events.0860.flavor_2:0 "meu oponente foi jogado para fora do cavalo.\n\n"
 contest_events.0860.flavor_3:0 "meu oponente tentou usar uma lança de proporções gigantescas.\n\n"
 contest_events.0860.flavor_4:0 "meu adversário se aproximou de mim pedindo um duelo a pé.\n\n"
 contest_events.0860.flavor_5:0 "meu nobre oponente tentou se inclinar mesmo com uma ferida grave.\n\n"
 contest_events.0860.flavor_6:0 "meu oponente pediu para passar misericordiosamente.\n\n"
 contest_events.0860.flavor_7:0 "conversei com o pajem desgrenhado do meu oponente.\n\n"
 contest_events.0860.flavor_8:0 "a multidão me provocou enquanto eu me preparava para o confronto.\n\n"
 contest_events.0860.flavor_9:0 "emprestei uma lança para o meu oponente depois que ele ficou sem.\n\n"
 contest_events.0860.flavor_fallback:0 "Meu oponente se posiciona na outra extremidade da arena. É isso."
 contest_events.0860.t:0 "$tournament_contest_header$ Em pleno vapor"
 contest_events.0861.a:0 "Aquele fígado parece vulnerável..."
 contest_events.0861.b:0 "\"Venha! Vamos trancar como guerreiros!\""
 contest_events.0861.c:0 "Finja um ataque baixo, vá alto."
 contest_events.0861.d:0 "Mantenha simples, mantenha-se seguro."
 contest_events.0861.desc:0 "A multidão clama por sangue enquanto eu avanço cambaleante para confrontar meu oponente novamente. Eu enxoto uma correnteza vermelha da minha testa e considero a luta até agora, refletindo sobre quando"
 contest_events.0861.flavor_10:0 "meu dedo saiu do lugar.\n\n"
 contest_events.0861.flavor_11:0 "meu oponente me cutucou no olho.\n\n"
 contest_events.0861.flavor_12:0 "meu oponente, babando pela boca, mordeu meu nariz.\n\n"
 contest_events.0861.flavor_13:0 "Bati minhas mãos sobre os ouvidos do meu oponente, rompendo seus tímpanos.\n\n"
 contest_events.0861.flavor_1:0 "eu tentei identificar as fraquezas do meu oponente anteriormente.\n\n"
 contest_events.0861.flavor_2:0 "meu oponente pausou para agradar a multidão.\n\n"
 contest_events.0861.flavor_3:0 "eu usei sujeira para cegar meu oponente.\n\n"
 contest_events.0861.flavor_4:0 "eu recorri a alguns truques sujos para ter sucesso.\n\n"
 contest_events.0861.flavor_5:0 "um membro da multidão me deu uma assistência inesperada.\n\n"
 contest_events.0861.flavor_6:0 "meu oponente corpulento me desafiou com seu tamanho.\n\n"
 contest_events.0861.flavor_7:0 "meu oponente e eu acabamos em uma posição bastante amorosa.\n\n"
 contest_events.0861.flavor_8:0 "um amigo do meu oponente me acusou de trapacear.\n\n"
 contest_events.0861.flavor_9:0 "eu analisei meu oponente para garantir o sucesso.\n\n"
 contest_events.0861.flavor_fallback:0 "para fazer meu movimento.\n\n"
 contest_events.0861.t:0 "$tournament_contest_header$ Encurralado(a)"
 contest_events.0862.a:0 "Devo lembrar do meu treinamento."
 contest_events.0862.b:0 "\"O que? Está #EMP com medo?#!\""
 contest_events.0862.c:0 "Uma última blefe pode decidir isso..."
 contest_events.0862.d:0 "\"Venha então. Vamos lutar.\""
 contest_events.0862.desc:0 "Um coro estridente de metal contra metal ressoa enquanto duas lâminas se raspam, faíscas cintilando ao caírem no chão. Procuro por vantagens, relembrando quando"
 contest_events.0862.flavor_10:0 "considerei distrair meu oponente com palavras.\n\n"
 contest_events.0862.flavor_11:0 "utilizei minha #EMP experiência íntima#! com um membro da família do meu oponente.\n\n"
 contest_events.0862.flavor_3:0 "a espada do meu oponente voou para a multidão.\n\n"
 contest_events.0862.flavor_4:0 "eu instintivamente chutei meu oponente na virilha.\n\n"
 contest_events.0862.flavor_5:0 "eu me vi com uma vantagem dramática e decidi como usá-la da melhor maneira.\n\n"
 contest_events.0862.flavor_6:0 "meu oponente tentou me subornar.\n\n"
 contest_events.0862.flavor_7:0 "tive que escolher entre um contra-ataque e um bloqueio contra meu oponente agressivo.\n\n"
 contest_events.0862.flavor_8:0 "vi uma oportunidade de usar minha outra mão durante o duelo.\n\n"
 contest_events.0862.flavor_9:0 "me vi lutando com uma capa de duelista.\n\n"
 contest_events.0862.flavor_fallback:0 "Avançamos um em direção ao outro mais uma vez. Ambos estamos machucados, ambos estão cansados, e só pode haver um vencedor.\n\n"
 contest_events.0862.t:0 "$tournament_contest_header$ Riposte"
 contest_events.0863.a:0 "Talvez eu possa aproveitar meu conhecimento em guerra?"
 contest_events.0863.b:0 "\"Você parece muito confiante...\""
 contest_events.0863.c:0 "Talvez seja hora de um movimento ousado?"
 contest_events.0863.d:0 "Jogar de forma segura é a jogada certa."
 contest_events.0863.desc:0 "O suave clique das peças em movimento perturba a calma. Estamos no fim do jogo agora, e o resultado está em equilíbrio. Eu reflito sobre o que já aconteceu, como quando"
 contest_events.0863.flavor_1:0 "eu tentei perturbar o jogo do meu oponente com jogos mentais.\n\n"
 contest_events.0863.flavor_2:0 "meu oponente virou a mesa completamente com um estrondo poderoso.\n\n"
 contest_events.0863.flavor_3:0 "vi a oportunidade de fazer um movimento arriscado, mas recompensador.\n\n"
 contest_events.0863.flavor_4:0 "vi e considerei uma abertura para trapacear.\n\n"
 contest_events.0863.flavor_5:0 "intimidei meu oponente a cometer movimentos ruins.\n\n"
 contest_events.0863.flavor_6:0 "meu oponente pediu que eu respeitasse sua interpretação das regras.\n\n"
 contest_events.0863.flavor_fallback:0 "As peças se movem silenciosamente, urgentemente. Nenhum de nós tem muito tempo para forçar a vitória.\n\n"
 contest_events.0863.t:0 "$tournament_contest_header$ Xeque"
 contest_events.0870.a:0 "A última passagem da rodada está próxima."
 contest_events.0870.b:0 "Apenas mais uma passagem para a rodada!"
 contest_events.0870.final:0 "\n\nOs cascos dos cavalos estrondam. Lanças se abaixam. A multidão urra."
 contest_events.0870.loser_break:0 "Minha lança se desvia do alvo no último momento, e sinto o impacto [versus_contestant.GetHerHim] acertando em cheio, fazendo meu escudo tremer antes do estrondo ensurdecedor e da explosão de estilhaços."
 contest_events.0870.loser_start:0 "Nos preparamos mais uma vez, mas enquanto avanço, algo parece estranho; o ritmo do cavalo ou a forma como minha armadura está encaixada."
 contest_events.0870.loser_unhorse:0 "Não consigo me manter no alvo conforme nos aproximamos, e vejo a lança [versus_contestant.GetHerHim] encontrar o caminho ao redor do meu escudo, diretamente em meu peito. Atordoado no chão, ouço [versus_contestant.GetSheHe] seguir em frente, triunfante."
 contest_events.0870.pivotal_failure:0 "Observo enquanto a ponta da minha lança se aproxima, se aproxima e... #EMP erra#! o escudo do meu oponente. Um instante depois, sou lançado para trás na sela, uma lança se despedaçando contra meu próprio escudo, o rugido da multidão uma maldição em meus ouvidos.\n\n"
 contest_events.0870.pivotal_neutral:0 "Embora ambos tenhamos começado bem, meu braço oscila e mergulha, passando pelo escudo do meu oponente. A única trégua é que meu oponente erra tão alto quanto eu erro baixo, os gemidos da multidão são ensurdecedores.\n\n"
 contest_events.0870.pivotal_success:0 "Primeiro, o som da colisão. Em seguida, um instante depois, uma vibração tremenda sob meu braço. E, de repente, outro som: os aplausos da multidão. Minha lança atinge com força, estilhaçando-se no escudo do meu adversário. Mais notavelmente, eles erraram completamente!\n\n"
 contest_events.0870.ptv_bottom:0 "Estou bem atrás, machucado e espancado. Minha única esperança real é acertar meu adversário com tanta força que eles não possam continuar, mas seria preciso um milagre..."
 contest_events.0870.ptv_bottom_half:0 "Estou atrás na pontuação, mas ainda posso recuperar. Mais uma passagem para completar, mais uma oportunidade pela glória..."
 contest_events.0870.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] está perdendo, mas ainda não acabou. Uma ação ainda pode mudar tudo para [pivotal_contestant.GetSheHe]..."
 contest_events.0870.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] parece praticamente derrotado. A menos que ocorra uma reviravolta dramática, isso está praticamente definido."
 contest_events.0870.ptv_close:0 "É hora de mais uma passagem final. Tudo se resume a isso."
 contest_events.0870.ptv_fallback:0 "A última passagem da rodada está próxima, enquanto ambos os cavalos aceleram."
 contest_events.0870.ptv_top:0 "Estou na liderança, mas ainda resta mais uma disputa. Tudo que preciso é acertar esta última passagem..."
 contest_events.0870.ptv_top_half:0 "Estou ganhando, mas ainda há muito com o que me preocupar. Um único golpe pode encerrar essa disputa a meu favor ou ao deles."
 contest_events.0870.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] está ganhando, mas está bem equilibrado. A glória ainda está em jogo."
 contest_events.0870.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] está na liderança, mas ainda há uma passagem final restante..."
 contest_events.0870.spectator:0 "\n\nAs rodadas finais de um torneio de justas são tumultuadas: os espectadores vaiam e gritam, os médicos cuidam dos feridos e o calor das multidões apertadas aumenta tudo em uma atmosfera febril."
 contest_events.0870.t:0 "$tournament_contest_header$ Golpe Certeiro"
 contest_events.0870.winner_break:0 "Minha lança acerta em cheio, diretamente no escudo de [versus_contestant.GetFirstName] com um estrondo ensurdecedor e uma explosão de estilhaços, enquanto a lança [versus_contestant.GetHerHim] passa por mim. Isso é tudo que eu preciso!"
 contest_events.0870.winner_start:0 "Nos preparamos pela última vez, e enquanto meu cavalo dispara em direção a [versus_contestant.GetFirstName], sinto uma boa sensação sobre essa disputa."
 contest_events.0870.winner_unhorse:0 "Minha lança atinge [versus_contestant.GetSheHe] em cheio no peito, jogando [versus_contestant.GetSheHe] ao chão em uma chuva de estilhaços enquanto meu cavalo continua avançando."
 contest_events.0871.a.loser:0 "Confundido..."
 contest_events.0871.a:0 "Vitória!"
 contest_events.0871.b:0 "Mais uma queda resolverá!"
 contest_events.0871.final:0 "A poeira rodopia, e a multidão grita de excitação. A disputa será decidida."
 contest_events.0871.loser_end:0 "Os juízes encerram a disputa. Eu perdi..."
 contest_events.0871.loser_pin:0 "Enquanto tento recuperar minha compostura, [versus_contestant.GetSheHe] me derruba no chão, me imobilizando com uma pegada firme. Luto em vão, incapaz de me libertar."
 contest_events.0871.loser_start:0 "Momentos depois, [versus_contestant.GetFirstName] de repente me pega desprevenido!"
 contest_events.0871.loser_throw:0 "Enquanto tento em vão ganhar apoio, [versus_contestant.GetSheHe] me joga com força, me fazendo rolar para fora do ringue, caindo na sujeira."
 contest_events.0871.pivotal_failure:0 "Tento derrubar meu oponente, mas assim que o faço, sou lançado pelo ar. Aterrisso com força, o ar saindo dos meus pulmões com um gemido, e imediatamente entro na defensiva, me esforçando para evitar ser imobilizado.\n\n"
 contest_events.0871.pivotal_neutral:0 "A respiração ofegante de ambos enche o ar enquanto lutamos para derrubar um ao outro. Finalmente, um pé enroscado no outro se mostra crucial, e caímos no chão. Atordoados por um instante, nos recuperamos e percebemos que estamos deitados de lado, imediatamente nos esforçando para obter uma vantagem.\n\n"
 contest_events.0871.pivotal_success:0 "Uma mão em seu ombro, um tropeço habilidoso e um grande empurrão. Caímos no chão. Todo som é respiração ofegante e, ao longe, o rugido da multidão. Eu me arrasto por cima do meu adversário, me esforçando para aproveitar minha vantagem.\n\n"
 contest_events.0871.ptv_bottom:0 "Estou perdendo, e por uma boa margem. O caminho para a vitória é estreito, mas ainda é possível..."
 contest_events.0871.ptv_bottom_half:0 "Estou perdendo, mas a derrota está longe de ser certa. Ainda posso reverter a situação!"
 contest_events.0871.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] está perdendo, mas a derrota está longe de ser certa."
 contest_events.0871.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] está perdendo, e por uma boa margem. Seria necessário um milagre para vencer a partir daqui..."
 contest_events.0871.ptv_close:0 "A disputa está acirrada, muito próxima. Um erro de qualquer um de nós pode encerrá-la em um instante."
 contest_events.0871.ptv_close_spectator:0 "A disputa está muito acirrada! Um erro de qualquer competidor pode encerrá-la em um instante."
 contest_events.0871.ptv_fallback:0 "O suor escorre de mim. Nossos membros se enredam, ambos buscando vantagem."
 contest_events.0871.ptv_top:0 "Estou ganhando! Só preciso me manter para a vitória!"
 contest_events.0871.ptv_top_half:0 "Estou ganhando, mas a vitória está longe de ser certa. Mais um esforço..."
 contest_events.0871.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] está ganhando, mas a vitória está longe de ser certa."
 contest_events.0871.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] está ganhando! A vitória está próxima, com certeza!"
 contest_events.0871.spectator:0 "\n\nOs corpos se desenroscam, se engajam e se separam novamente, a respiração pesada dos competidores sendo abafada pelo rugido da multidão. Eles se agarram novamente, a poeira rodopiando e grudando em áreas de pele suada."
 contest_events.0871.t:0 "$tournament_contest_header$ Indefinido"
 contest_events.0871.winner_end:0 "Os juízes encerram a disputa. Eu venci!"
 contest_events.0871.winner_pin:0 "Faço meu movimento, imobilizando [versus_contestant.GetSheHe] firmemente, segurando [versus_contestant.GetSheHe] firmemente no lugar enquanto [versus_contestant.GetSheHe] luta em vão para escapar."
 contest_events.0871.winner_start:0 "Momentos depois, consigo pegar [versus_contestant.GetFirstName] desprevenido."
 contest_events.0871.winner_throw:0 "Não perco a oportunidade, agarrando [versus_contestant.GetSheHe] pela cintura e lançando [versus_contestant.GetSheHe] com toda a força em direção às bordas, onde [versus_contestant.GetSheHe] se espalha para fora do ringue."
 contest_events.0872.a:0 "Mais um golpe..."
 contest_events.0872.b:0 "Mais um golpe!"
 contest_events.0872.final:0 "Grunhidos, estrondos, os gritos da multidão. Um coro brutal para o fim desse duelo."
 contest_events.0872.loser_disarm:0 "Faço o meu melhor para manter minha guarda contra os golpes impiedosos [versus_contestant.GetHerHim], mas o último atinge minha lâmina de forma desajeitada, quebrando minha empunhadura e jogando-a no chão."
 contest_events.0872.loser_start:0 "[versus_contestant.GetFirstName] muda repentinamente de tática, e sinto que o fim está próximo."
 contest_events.0872.loser_yield:0 "Mal consigo manter minha defesa contra os golpes precisos [versus_contestant.GetHerHim], minha energia esgotando rapidamente. Levanto meu braço para ceder, ao invés de prolongar o inevitável."
 contest_events.0872.pivotal_failure:0 "Meu golpe cansado erra o alvo, meu oponente nem se preocupando em se esquivar do meu ataque impreciso. Em vez disso, me vejo imediatamente na defensiva, defendendo golpe após golpe sem conseguir responder com nenhum ataque próprio. Recuo desesperadamente, me esquivando e desviando, qualquer coisa para permanecer na luta.\n\n"
 contest_events.0872.pivotal_neutral:0 "Meu golpe por cima é desviado para o lado, e eu escapo do contra-ataque. As armas se chocam novamente, parando e avançando enquanto a multidão aplaude e suspira. Nenhum de nós consegue encontrar uma abertura.\n\n"
 contest_events.0872.pivotal_success:0 "Um golpe sonoro ressoa quando minha arma resvala em um capacete, meu oponente cambaleando para trás atordoado. Sigo rapidamente; um falso movimento para a esquerda, um golpe poderoso para a direita. Avanço enquanto meu adversário recua desesperadamente, minha espada sendo desviada por uma margem mínima.\n\n"
 contest_events.0872.ptv_bottom:0 "Estou perdendo essa luta, e por uma boa distância. Preciso fazer algo em breve!"
 contest_events.0872.ptv_bottom_half:0 "Estou perdendo essa luta. Não por muito, talvez, mas preciso fazer algo em breve..."
 contest_events.0872.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] está perdendo essa luta. Não por muito, talvez, mas [pivotal_contestant.GetSheHe] precisa fazer algo em breve."
 contest_events.0872.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] está perdendo essa luta, e por uma boa distância. [pivotal_contestant.GetSheHe|U] precisa fazer algo em breve!"
 contest_events.0872.ptv_close:0 "O duelo ainda está tão equilibrado! Seu vencedor ainda pode ser qualquer um de nós."
 contest_events.0872.ptv_close_spectator:0 "O duelo ainda está tão equilibrado! Seu vencedor ainda pode ser qualquer um dos competidores."
 contest_events.0872.ptv_fallback:0 "Aço encontra aço quando as espadas se chocam mais uma vez."
 contest_events.0872.ptv_top:0 "Estou vencendo essa luta com uma certa margem. Só preciso me manter firme por mais alguns momentos..."
 contest_events.0872.ptv_top_half:0 "Estou vencendo, mas essa é a natureza de um duelo: preciso aproveitar minha vantagem agora, senão vou me arrepender."
 contest_events.0872.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] está vencendo, mas essa é a natureza de um duelo, as coisas podem mudar a qualquer momento."
 contest_events.0872.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] está vencendo! Só mais alguns momentos antes da vitória, com certeza..."
 contest_events.0872.spectator:0 "\n\nOs dois se enfrentam novamente, e faíscas brilhantes voam à luz do dia. Suspiros da multidão ecoam tão prontamente quanto os golpes das lâminas."
 contest_events.0872.t:0 "$tournament_contest_header$ Aço contra Aço"
 contest_events.0872.winner_disarm:0 "Apanho a lâmina de sua espada com uma sequência rápida de golpes, quebrando sua empunhadura e enviando a arma girando para o chão."
 contest_events.0872.winner_start:0 "Sinto uma vitória e me apresso em conquistá-la antes que [versus_contestant.GetFirstName] se recupere."
 contest_events.0872.winner_yield:0 "[versus_contestant.GetSheHe|U] enfraquece sob meus golpes incessantes, mal mantendo a forma com suas defesas, até que finalmente [versus_contestant.GetSheHe] recua, cedendo."
 contest_events.0873.a:0 "Apenas algumas jogadas restantes..."
 contest_events.0873.b:0 "Apenas algumas jogadas restantes!"
 contest_events.0873.final:0 "Mais cliques suaves, mais tensão mental. O jogo final está em pleno andamento."
 contest_events.0873.loser_grind:0 "Parece que cada movimento que faço é um compromisso, perdendo centímetro por centímetro para o jogo superior [versus_contestant.GetHerHim]. Muito em breve, minha posição se torna insustentável."
 contest_events.0873.loser_start:0 "Momentos depois, percebo finalmente o perigo da minha posição. [versus_contestant.GetFirstName] esteve me atraindo desde o início!"
 contest_events.0873.loser_surprise:0 "[versus_contestant.GetSheHe|U] me atraiu para uma armadilha durante metade do jogo, esperando pacientemente enquanto eu cometia erros. Neste momento, não há escapatória."
 contest_events.0873.pivotal_failure:0 "No momento em que minha mão deixa a peça de jogo, sei que cometi um erro, e a armadilha habilmente preparada pelo meu oponente é ativada. Alguns movimentos a mais e fica claro que estou em desvantagem devido ao meu erro, obrigado a uma posição que eu não queria de forma alguma.\n\n"
 contest_events.0873.pivotal_neutral:0 "Meu oponente ignora a armadilha que eu preparei, mas eu também percebo e evito uma armadilha preparada para mim. Alguns movimentos tensos a mais se mostram infrutíferos para ambos. O jogo está em algo como um impasse enquanto nos aproximamos do final.\n\n"
 contest_events.0873.pivotal_success:0 "Não consigo evitar que minha expressão se desfaça por um momento e sorrio quando meu oponente cai perfeitamente na armadilha que eu havia preparado. Alguns movimentos depois, e transformo a abertura em uma vantagem.\n\n"
 contest_events.0873.ptv_bottom:0 "Estou perdendo, e minha posição piora a cada jogada. Seria necessário algo como um milagre para vencer a partir daqui..."
 contest_events.0873.ptv_bottom_half:0 "Estou perdendo, mas minha posição ainda não é desesperadora. Se eu apenas encontrar uma abertura..."
 contest_events.0873.ptv_bottom_half_spectator:0 "[pivotal_contestant.GetFirstName] está perdendo, mas a posição ainda não é desesperadora. Se [pivotal_contestant.GetSheHe] apenas encontrar uma abertura..."
 contest_events.0873.ptv_bottom_spectator:0 "[pivotal_contestant.GetFirstName] está perdendo, e sua posição piora a cada jogada. Seria necessário algo como um milagre para vencer a partir daqui..."
 contest_events.0873.ptv_close:0 "Como esse jogo vai terminar é um palpite de qualquer um. A margem de vitória é tão pequena e o custo dos erros é tão grande."
 contest_events.0873.ptv_fallback:0 "A posição do tabuleiro continua a se tornar mais complexa, porém de alguma forma mais simples, conforme rotas e estratégias potenciais são bloqueadas."
 contest_events.0873.ptv_top:0 "Estou ganhando com certa vantagem. Desde que eu possa pressionar essa vantagem com firmeza, a vitória está certamente próxima!"
 contest_events.0873.ptv_top_half:0 "Estou ganhando, mas ainda não é algo certo. Qualquer erro pode ser custoso."
 contest_events.0873.ptv_top_half_spectator:0 "[pivotal_contestant.GetFirstName] está ganhando, mas ainda não é algo certo. Qualquer erro pode ser custoso."
 contest_events.0873.ptv_top_spectator:0 "[pivotal_contestant.GetFirstName] está ganhando com certa vantagem. Desde que [pivotal_contestant.GetSheHe] possa pressionar essa vantagem com firmeza, a vitória está certamente próxima!"
 contest_events.0873.spectator:0 "\n\nAs sobrancelhas se franzem enquanto o jogo avança inexoravelmente, os espectadores mantendo um silêncio sussurrante para evitar distrações; ou pior, revelar um movimento potencial que beneficiaria seu favorito."
 contest_events.0873.t:0 "$tournament_contest_header$ Jogo Final"
 contest_events.0873.winner_grind:0 "Eu desgasto [versus_contestant.GetSheHe] implacavelmente, avançando inexoravelmente em direção à vitória à medida que a posição [versus_contestant.GetHerHim] enfraquece lentamente, mas irreversivelmente."
 contest_events.0873.winner_start:0 "Logo fica claro que não há volta para [versus_contestant.GetFirstName]."
 contest_events.0873.winner_surprise:0 "[versus_contestant.GetSheHe|U] caiu direitinho na minha armadilha, sem perceber o final cuidadosamente planejado. Com um gesto despreocupado, minha última jogada se encaixa no tabuleiro."
 contest_events.0910.a:0 "Vou te dar uma lição, seu miserável...!"
 contest_events.0910.b:0 "Levante-se, seu fraco!"
 contest_events.0910.duel:0 "$contest_events.0910.melee$"
 contest_events.0910.melee:0 "Meu sangue ferve ao ver cavaleiros de treino espancando seus oponentes, enquanto cada chance de glória é roubada de mim por um colega de equipe ou uma retirada apressada.\n\nFinalmente, [wrathful_victim.GetTitledFirstName] cai na lama aos meus pés, desequilibrado(a) devido a um golpe excessivamente ambicioso, com a espada fora de alcance.\n\n\"Você quase acertou minha cabeça!\" Rosno, encarando [wrathful_victim.GetSheHe]. O tolo está à minha mercê."
 contest_events.0910.t:0 "$tournament_contest_header$ Fora de Controle"
 contest_events.0910.wrestling:0 "[wrathful_victim.GetTitledFirstName] e eu estamos nos encarando há uma eternidade, assando sob o sol do meio-dia.\n\nCada vez que faço um movimento, [wrathful_victim.GetSheHe] se solta do meu agarre no último momento, e estou perto de perder minha paciência.\n\nJusto quando estou prestes a atacar o suíno, [wrathful_victim.GetFirstNameNoTooltip] tropeça, ficando completamente aberto(a) para o ataque."
 contest_events.0911.a.dead:0 "Uma tragédia lamentável..."
 contest_events.0911.a.wound:0 "Você não vai esquecer isso tão cedo!"
 contest_events.0911.a:0 "Assim é a lei do mais forte."
 contest_events.0911.angry_host:0 "Isso é inaceitável!"
 contest_events.0911.c.dead:0 "Uma resposta justa..."
 contest_events.0911.c:0 "Uau..."
 contest_events.0911.dead:0 "Só quando sou afastado(a) e a névoa vermelha se dissipa, percebo que fui longe demais..."
 contest_events.0911.duel:0 "$contest_events.0911.melee$"
 contest_events.0911.host:0 "Isso é lamentável."
 contest_events.0911.melee:0 "A [activity.GetCurrentPhase.GetPhase.GetName|l] para repentinamente, enquanto todos os envolvidos param para encarar quando [wrathful_contestant.GetFirstName] derruba [wrathful_victim.GetFirstName] no chão com um rugido, espancando [wrathful_victim.GetSheHe] furiosamente.\n\n"
 contest_events.0911.t:0 "$contest_events.0910.t$"
 contest_events.0911.wound:0 "Quando sou afastado(a) [wrathful_victim.GetHerHim], fica claro que [wrathful_victim.GetSheHe] está com muita dor."
 contest_events.0911.wrathful:0 "Cedo à minha fúria, espancando implacavelmente [wrathful_victim.GetFirstName] enquanto [wrathful_victim.GetSheHe] tenta suportar meus golpes.\n\n"
 contest_events.0911.wrestling:0 "Logo no início de seu duelo [activity.GetCurrentPhase.GetPhase.GetName|l], [wrathful_contestant.GetTitledFirstName] fica exasperado(a) com [wrathful_victim.GetTitledFirstName], perdendo todo o controle e derrubando [wrathful_victim.GetSheHe] no chão.\n\n"
 contest_events.0912.b:0 "Esses excessos são inaceitáveis."
 contest_events.0912.dead:0 "Quando [wrathful_contestant.GetFirstNameNoTooltip] finalmente é afastado(a), é tarde demais - [wrathful_victim.GetFirstNameNoTooltip] já está morto(a)..."
 contest_events.0912.wound:0 "Quando [wrathful_contestant.GetFirstNameNoTooltip] é afastado(a) [wrathful_victim.GetHerHim], fica claro que [wrathful_victim.GetFirstNameNoTooltip] está sofrendo muito."
 contest_events.1100.a:0 "Desvie disso!"
 contest_events.1100.b:0 "Isso não é honroso..."
 contest_events.1100.desc:0 "Me debatendo através do tumulto caótico que envolve [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], desviando e tecendo entre amigos e inimigos, finalmente avisto meu [murder_actor.Custom2('RelationToMeShort', murder_target)], [murder_target.GetTitledFirstName], de costas para mim!\n\nAproximo-me sem ser notado, outro oponente distraindo toda a atenção [murder_target.GetHerHim]; neste estrondo ensurdecedor e caos turbilhante, ninguém está focado em mim...\n\nAgora tenho você, [murder_target.Custom2('InsultNoun', ROOT.Char)]!"
 contest_events.1100.t:0 "$activity_tournament$: Sorte da Frenesi"
 contest_events.1101.a:0 "\"Cuide das suas costas, [murder_target.Custom2('InsultNoun', ROOT.Char)]!\""
 contest_events.1101.b:0 "\"[murder_target.Custom2('InsultNoun', ROOT.Char)] Sortud[Select_CString( murder_target.IsFemale, 'a', 'o' )]!\""
 contest_events.1101.c:0 "\"[murder_target.Custom2('InsultNoun', ROOT.Char)]!\""
 contest_events.1101.desc:0 "Eu me lanço em direção a [murder_target.GetSheHe], diminuindo a distância, [murder_actor.Custom('signature_weapon')] erguido, e o desço com toda a minha força!"
 contest_events.1101.kill:0 "\n\nMeu golpe conecta perfeitamente com o capacete [murder_target.GetHerHim], que soa como um sino enquanto [Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.Custom2('InsultNoun', ROOT.Char)] tomba no chão como um saco de batatas.\n\nO adversário [murder_target.GetHerHim|U] rosna agradecendo-me, antes de uma expressão de preocupação se espalhar em seu rosto. Eu vislumbro os olhos de [murder_target.GetTitledFirstNamePossessive] enquanto a massa agitada nos separa; eles não mostram reconhecimento."
 contest_events.1101.miss:0 "\n\nNaquele exato momento, o infame [murder_target.Custom2('InsultAdjective', ROOT.Char)] desvia de uma investida do outro adversário, e meu(a) [murder_actor.Custom('signature_weapon')] se choca no chão.\n\nEu me recupero rapidamente, enquanto [murder_target.GetTitledFirstName] rosna: \"Seu miserável!\" Seu rosto carrancudo desaparece na confusão, enquanto ambos saltamos em defesas respectivas."
 contest_events.1101.t:0 "$contest_events.1100.t$"
 contest_events.1101.wound:0 "\n\n[murder_target.GetSheHe|U] se move ligeiramente, exatamente quando meu golpe acerta o capacete [murder_target.GetHerHim], fazendo meu(a) [murder_actor.Custom('signature_weapon')] deslizar em um ângulo.\n\n[murder_target.GetTitledFirstName] uiva de dor ao se virar em minha direção, seus olhos se arregalando de reconhecimento.\n\nOuço [murder_target.GetSheHe] gemer '[murder_actor.Custom2('InsultNoun', SCOPE.sC('murder_target'))] Maldit[Select_CString( murder_actor.IsFemale, 'a', 'o' )]' antes de [murder_target.GetSheHe] cambalear e a tempestade do combate nos separar."
 contest_events.1102.a:0 "Seu miserável!"
 contest_events.1102.b:0 "[ROOT.Char.Custom2('InsultNoun', ROOT.Char)]!"
 contest_events.1102.c:0 "#low gorgolejo#!"
 contest_events.1102.desc:0 "Cercado(a) por amigos e inimigos, faço o meu melhor para manter a calma no tumulto que se desenrola em [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], desviando dos golpes dirigidos a mim por um oponente determinado."
 contest_events.1102.kill:0 "\n\nNo próximo momento, meus sentidos ficam embotados, os ouvidos zunindo. A terra lentamente se aproxima enquanto eu desabo, esparramado(a) no chão áspero. Vislumbro o rosto de [murder_actor.GetSheHe], mas não consigo estabelecer conexão antes que o mundo escureça completamente."
 contest_events.1102.miss:0 "\n\nAo desviar-me de um desses golpes, uma [murder_actor.Custom('signature_weapon')] passa zunindo por trás de mim, por uma margem mínima. Mantendo distância de ambos os adversários, percebo que a arma pertence a ninguém menos que [murder_actor.GetTitledFirstName], cujo rosto carrancudo agora se mistura à multidão!"
 contest_events.1102.t:0 "$contest_events.1100.t$"
 contest_events.1102.wound:0 "\n\nSou pego(a) desprevenido(a) por um golpe desajeitado, mas determinado, por trás, deslizando pelo meu capacete e me deixando cambaleante.\n\nQuando me viro, uivando de dor, vejo [murder_actor.GetTitledFirstName], claramente irritado(a) por não ter causado mais danos, desaparecendo na massa caótica, antes de eu cair de joelhos."
 contest_events.1110.a:0 "Desvie #EMP disso#!!"
 contest_events.1110.b:0 "Isso é demais!"
 contest_events.1110.desc:0 "Esperei pacientemente por uma oportunidade de derrubar [murder_target.GetTitledFirstName], e agora meu momento pode ter chegado.\n\nA [activity.GetCurrentPhase.GetPhase.GetName] fornecerá uma excelente cobertura para um pequeno acidente..."
 contest_events.1110.t:0 "Chance de Atacar"
 contest_events.1131.a:0 "#EMP Morra!#!"
 contest_events.1131.b.flavor:0 "#EMP FUJA!#!"
 contest_events.1131.b:0 "Arghghgh!"
 contest_events.1131.desc:0 "\n\nVejo na expressão [portrait_scope.GetHerHim] a mesmo determinação - o mesmo ódio - que [portrait_scope.GetSheHe] deve ver em mim...\n\nSó há uma saída para isso."
 contest_events.1131.enemy:0 "Correndo por [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], fazendo reconhecimento à frente de minha equipe, viro uma esquina e me encontro olho a olho com meu[ROOT.Char.Custom2('RelationToMeShort', portrait_scope)], [portrait_scope.GetTitledFirstName], que desempenha o mesmo papel no lado oposto."
 contest_events.1131.lose:0 "[portrait_scope.GetFirstNameNoTooltip] supera você"
 contest_events.1131.t:0 "$tournament_contest_header$ Combate Mortal"
 contest_events.1131.team:0 "Embora meu[ROOT.Char.Custom2('RelationToMeShort', portrait_scope)], [portrait_scope.GetTitledFirstName] - aquel[Select_CString( portrait_scope.IsFemale, 'a', 'e' )] [portrait_scope.Custom2('InsultNoun', ROOT.Char)] - tenha sido colocado em minha equipe para o combate, quando recuo para um beco para recuperar o fôlego e me encontro sozinho(a) com [portrait_scope.GetSheHe], ambos nos entendemos."
 contest_events.1131.win:0 "Você vence [portrait_scope.GetFirstNameNoTooltip]"
 contest_events.1133.a.both_fled:0 "Ahem."
 contest_events.1133.a.kill:0 "Acabou."
 contest_events.1133.a.wound:0 "Seu sortudo! Eu vou te pegar!"
 contest_events.1133.a:0 "Por pouco..."
 contest_events.1133.chase:0 "\n\n[portrait_scope.GetSheHe|U] é mais rápido(a) do que parece, e [portrait_scope.GetSheHe] já está longe quando eu desisto, ofegando..."
 contest_events.1133.chase_enemy:0 "Antes que eu possa reagir, [portrait_scope.GetFirstName] faz uma corrida em direção à saída, gritando agudamente por ajuda de seus colegas de equipe."
 contest_events.1133.chase_team:0 "Antes que eu possa reagir, [portrait_scope.GetFirstName] faz uma corrida em direção à saída, gritando agudamente por ajuda de nossos colegas de equipe."
 contest_events.1133.fight:0 "Lendo as mentes um do outro, ambos entramos em ação, a espada de [portrait_scope.GetFirstNamePossessive] e a minha mordendo ferozmente enquanto trocamos paradas."
 contest_events.1133.fled:0 "\n\nNo final da rua, olho para trás e vejo que [portrait_scope.GetFirstName] desistiu; [portrait_scope.GetSheHe] ofega, olhando furiosamente para mim."
 contest_events.1133.fled_both:0 "Me viro e corro o mais rápido que posso, gritando para chamar a atenção de minha equipe.\n\nSó no final da rua é que olho para trás e avisto [portrait_scope.GetFirstName] ao longe, tão constrangido(a) quanto eu.\n\nNão direi nada se [portrait_scope.GetSheHe] não disser..."
 contest_events.1133.fled_enemy:0 "Eu corro em direção à saída, correndo o mais rápido que posso na direção dos meus colegas de equipe e gritando em busca de seu apoio."
 contest_events.1133.fled_team:0 "Eu corro em direção à saída, correndo de cabeça de volta para o resto da equipe e para a segurança atrás de seus escudos."
 contest_events.1133.kill:0 "\n\nNosso confronto frenético se intensifica como um furacão, uma sequência de aço tilintante e faíscas ardentes. Enquanto avançamos, de repente eu tenho a vantagem, e ambos sabemos que acabou — tão rapidamente quanto começou."
 contest_events.1133.kill_fled:0 "\n\nConforme o [portrait_scope.Custom2('InsultAdjective', ROOT.Char)] foge, [portrait_scope.GetSheHe] escorrega desajeitadamente no chão. Tudo acaba antes que seu grito de misericórdia escape completamente..."
 contest_events.1133.nothing:0 "\n\nA briga é rapidamente interrompida pela chegada dos outros, nos deixando encarando um ao outro pela rua."
 contest_events.1133.t:0 "$contest_events.1131.t$"
 contest_events.1133.wound_enemy:0 "\n\nEnquanto as faíscas voam, eu vejo uma oportunidade, acertando [portrait_scope.GetHerHi] com força antes que [portrait_scope.GetSheHe] se recupere, mas os outros chegam antes que possamos continuar..."
 contest_events.1133.wound_enemy_fled:0 "\n\nEu só consigo acertar [portrait_scope.GetSheHe] de raspão antes que [portrait_scope.GetSheHe] fique fora de alcance, mancando em direção aos seus camaradas, o covarde..."
 contest_events.1133.wound_self:0 "\n\n[Select_CString( portrait_scope.IsFemale, 'A', 'O' )] [portrait_scope.Custom2('InsultNoun', ROOT.Char)] se sai melhor, me acertando desprevenido(a) antes que os outros cheguem."
 contest_events.1133.wound_self_fled:0 "\n\n[portrait_scope.GetSheHe|U] me acerta de raspão assim que fico fora de alcance, mas felizmente é tudo o que [portrait_scope.GetSheHe] consegue fazer..."
 contest_events.1520.a:0 "A família será cuidada."
 contest_events.1520.b:0 "Não vamos deixar isso estragar nossa diversão."
 contest_events.1520.c:0 "Acho que já tive o bastante de arco e flecha por hoje..."
 contest_events.1520.desc:0 "Um suspiro surge entre os espectadores e, após uma eternidade, a figura se curva, gemendo fracamente. Um ajudante logo confirma o pior: o camponês está completamente morto — nenhum ponto por #EMP isso#! flechada..."
 contest_events.1520.opening:0 "Eu me posiciono na linha, puxando uma flecha do barril e, cuidadosamente, seguro meu arco, espiando pelo eixo em direção ao alvo distante.\n\nNo exato momento em que me comprometo, afrouxando o agarre, uma figura surge subitamente de trás do alvo!"
 contest_events.1520.skilled:0 "O tiro voa certeiro, diretamente em direção a eles!\n\n"
 contest_events.1520.t:0 "$tournament_contest_header$ Tragédia nos Alvos"
 contest_events.1520.unskilled:0 "O tiro erra, com certeza um fracasso, mas segue diretamente em direção a eles!\n\n"
 contest_events.1521.a:0 "Trágico."
 contest_events.1521.compensated:0 "\n\n[contestant.GetFirstNameNoTooltip] paga uma pequena indenização do próprio bolso para a família enlutada."
 contest_events.1521.desc:0 "[contestant.GetTitledFirstName] se posiciona na linha, puxa uma flecha do barril e, cuidadosamente, segura seu arco, um olho fixo, encontrando o caminho para o alvo.\n\nNo exato momento em que [contestant.GetSheHe] solta, uma silhueta surge subitamente de trás do alvo!\n\n"
 contest_events.1521.dismissed:0 "\n\n[contestant.GetFirstNameNoTooltip] rapidamente descarta o acidente, esperando impacientemente para fazer seu próximo disparo."
 contest_events.1521.resigned:0 "\n\n[contestant.GetFirstNameNoTooltip] voluntariamente se retira do concurso de arco e flecha, em respeito à alma infeliz."
 contest_events.1521.t:0 "$contest_events.1520.t$"
 contest_events.1530.a:0 "Sim!"
 contest_events.1530.desc:0 "Flexiono a corda do arco algumas vezes, aquecendo, e respiro fundo.\n\nReunindo todo o meu controle, ergo o arco no ar, abaixando-o lentamente alinhado com o alvo. Assim que a flecha deixa a ponta dos meus dedos, intuitivamente sinto que o disparo é bom.\n\nMomentos depois, um som satisfatório confirma: acertei o prego do alvo bem na cabeça!"
 contest_events.1530.t:0 "$tournament_contest_header$ Na Cabeça"
 contest_events.1531.a:0 "Sorte..."
 contest_events.1531.desc:0 "[contestant.GetTitledFirstName] flexiona a corda do arco algumas vezes, aquecendo, e respira fundo.\n\nReunindo todo o seu controle, [contestant.GetSheHe] ergue o arco no ar, abaixando-o lentamente alinhado com o alvo. Assim que a flecha deixa sua ponta dos dedos, fica claro que o disparo é certeiro.\n\nMomentos depois, um som satisfatório confirma: [contestant.GetSheHe] acertou o prego do alvo bem na cabeça!"
 contest_events.1531.t:0 "$contest_events.1530.t$"
 contest_events.1540.a:0 "É o que é."
 contest_events.1540.desc:0 "Confiantemente, pego uma flecha, tomando meu lugar diante do alvo e absorvendo a atmosfera. A multidão silencia enquanto aperfeiçoo minha postura e engato a flecha.\n\nO primeiro tiro erra por um fio de cabelo, cravando-se na bunda de terra. O segundo assobia a quilômetros acima do alvo. O terceiro cai a poucos metros de mim, impulsionado por um lançamento ruim.\n\n"
 contest_events.1540.sabotage:0 "Eu simplesmente não entendo! Consigo acertar o alvo quando pratico. A menos... Eu olho desconfiado para o meu arco..."
 contest_events.1540.t:0 "$tournament_contest_header$ Dia Ruim"
 contest_events.1540.unskilled:0 "A multidão ri enquanto volto, incapaz de esconder minha irritação. Preciso praticar mais..."
 contest_events.1541.a:0 "Acontece."
 contest_events.1541.desc:0 "[contestant.GetTitledFirstName] confiantemente pega uma flecha, tomando seu lugar diante do alvo. A multidão silencia enquanto [contestant.GetSheHe] aperfeiçoa sua postura e engata a flecha.\n\nO primeiro tiro erra por um fio de cabelo, cravando-se na bunda de terra. O segundo assobia a quilômetros acima do alvo. O terceiro cai a poucos metros [contestant.GetHerHim], impulsionado por um lançamento ruim.\n\n"
 contest_events.1541.sabotage:0 "[contestant.GetTitledFirstNameNoTooltip] está claramente perplexo. 'Eu simplesmente não entendo! Eu não sou tão ruim assim!', [contestant.GetSheHe] resmunga, verificando seu arco desconfiadamente."
 contest_events.1541.t:0 "$contest_events.1540.t$"
 contest_events.1541.unskilled:0 "A multidão ri enquanto [contestant.GetSheHe] volta, incapaz de esconder sua irritação. [contestant.GetSheHe|U] precisa praticar mais!"
 contest_events.1550.a.bad:0 "Desapontante."
 contest_events.1550.a.good:0 "Espectacular."
 contest_events.1550.a:0 "Bravo!"
 contest_events.1550.b.tt:0 "Você tentará conversar com [contestant.GetFirstName]"
 contest_events.1550.b:0 "Preciso conhecer [contestant.GetSheHe]!"
 contest_events.1550.bad:0 "A multidão fica bastante desapontada depois de uma exibição chocante de erros e equívocos. Poder-se-ia até questionar se a [contestant.GetWomanMan] já havia segurado um arco antes, quanto mais usado um."
 contest_events.1550.c:0 "Hmpf."
 contest_events.1550.d:0 "Alguém certamente se divertiu nos enganando."
 contest_events.1550.desc:0 "A multidão silencia enquanto [contestant.GetTitledFirstName] encaixa a primeira flecha, fascinada em ver se essa [contestant.GetWomanMan] é tão boa quanto os rumores que circulam pelo torneio sugerem.\n\n"
 contest_events.1550.good:0 "Nem mesmo os rumores mais selvagens poderiam fazer jus ao desempenho [contestant.GetHerHim]; como uma dança, a [contestant.GetWomanMan] envia cada flecha com facilidade para o centro do alvo, dividindo as próprias flechas e enlouquecendo a multidão."
 contest_events.1550.normal:0 "Apesar de toda a conversa, [contestant.GetSheHe] é uma arqueira claramente média. Não há como culpar [contestant.GetSheHe], mas sua pontuação não é nada para se gabar, equiparando-se aos competidores menos habilidosos."
 contest_events.1550.t:0 "$tournament_contest_header$ [contestant.GetFirstNameNoTooltip] Hood"
 contest_events.1553.a:0 "Prendam [contestant.GetSheHe]!"
 contest_events.1553.b:0 "Uma execução pública resolveria."
 contest_events.1553.c:0 "Você está perdoado, [contestant.GetFirstNameNoTooltip], não desperdice isso."
 contest_events.1553.d:0 "Pague por seus crimes - em meu serviço."
 contest_events.1553.desc:0 "Conforme [contestant.GetFirstName] é trazido pelos meus assistentes, [marshal.GetTitledFirstName] irrompe subitamente: 'Ei! Eu conheço você! Prendam-no!'\n\n'Ess[Select_CString( contestant.IsFemale, 'a', 'e' )] [contestant.GetWomanMan] é [Select_CString( contestant.IsFemale, 'a', 'o' )] líder de alguns bandidos locais, [ROOT.Char.Custom('FormOfAddressForLiege')]!' [marshal.GetFirstName] espuma, 'Eles se escondem nas [activity.GetCurrentPhase.GetLocation.GetTerrain.GetNameNoTooltip|l], roubando gado e assaltando viajantes inocentes.'\n\n'Mentiras!', retruca o arqueiro, desafiadoramente, 'Nós devolvemos os despojos dos ricos aos verdadeiros donos: o povo!'"
 contest_events.1553.t:0 "$contest_events.1550.t$"
 contest_events.1554.a:0 "O que diabos..."
 contest_events.1554.desc:0 "Os assistentes que enviei para buscar [contestant.GetFirstName] estão perplexos ao retornarem.\n\nParece que o arqueiro saiu apressadamente do local assim que suas flechas acabaram - não houve mais sinal dele desde então..."
 contest_events.1554.t:0 "$contest_events.1550.t$"
 contest_events.3000.a:0 "Ai!"
 contest_events.3000.b:0 "\"[contestant_1.GetFirstNameNoTooltip]! Como você permitiu que isso acontecesse?!\""
 contest_events.3000.desc:0 "O cavaleiro de [contestant_1.GetFirstName] está rasgando o caminho ao longo da pista.\n\nNo último momento, ele desvia desajeitadamente para o lado, deslizando pela terra, não dando tempo para os cavaleiros de [contestant_2.GetFirstName] e [contestant_3.GetFirstName] pararem!\n\nO gemido unânime da multidão enche o ar mesmo antes que os três cavalos e cavaleiros se colidam.\n\n"
 contest_events.3000.t:0 "$tournament_contest_header$ Encavalados"
 contest_events.3010.a.failure:0 "Você não consegue convencer o juiz"
 contest_events.3010.a.success:0 "Você convence o juiz a penalizar o jóquei"
 contest_events.3010.a:0 "\"Isso obviamente viola as regras!\""
 contest_events.3010.b:0 "Vou fazer uma exceção."
 contest_events.3010.desc:0 "Observar [enemy_competitor.GetNamePossessive] cavaleiro em cima de seu corcel é como assistir a uma pedra rolar pela praça de uma vila. Eles cavalgam como lunáticos completos, e infelizmente meu próprio cavaleiro [jockey.GetFirstName] caiu vítima da corrida violenta e desajeitada.\n\nCom um relincho agonizante e um impacto doloroso, meu cavalo é lançado contra a parede da pista, e tenho certeza de que a perna de [jockey.GetFirstNamePossessiveNoTooltip] está machucada."
 contest_events.3010.t:0 "$tournament_contest_header$ O Jockey Desajeitado"
 contest_events.3020.a.failure:0 "A multidão não fica impressionada"
 contest_events.3020.a.success:0 "Você atrai a atenção da multidão para o seu cavaleiro"
 contest_events.3020.a:0 "\"Eis! Meu nobre cavaleiro!\""
 contest_events.3020.b:0 "\"Você sabe como escolher, [enemy_competitor.GetFirstNameNoTooltip].\""
 contest_events.3020.c:0 "Vou encontrar [enemy_competitor.GetSheHe] depois da corrida para nos divertirmos."
 contest_events.3020.desc:0 "Entre os plebeus que estão assistindo à corrida, não é segredo quem tem seu favor. Os camponeses olham para o cavaleiro de [enemy_competitor.GetNamePossessive] com partes iguais de amor e admiração. Eles suspiram enquanto os cavalos passam a galope e aplaudem quando [enemy_competitor.GetFirstNameNoTooltip] elogia seu cavaleiro para a multidão. [enemy_competitor.GetSheHe|U] observa a corrida com arrogância, sabendo que seu cavaleiro tem o apoio incondicional da multidão.\n\nEu me pergunto: talvez com o incentivo certo, eu possa direcionar a atenção da multidão para o meu cavaleiro [jockey.GetFirstName] em vez disso?"
 contest_events.3020.t:0 "$tournament_contest_header$ Um Jockey Genial"
 contest_events.3030.a.failure:0 "A multidão não se comove"
 contest_events.3030.a.success:0 "Você convence a multidão"
 contest_events.3030.a:0 "Nojento! Guardas!"
 contest_events.3030.b:0 "Hah! Que espetáculo!"
 contest_events.3030.c:0 "Vou me juntar a [naked_peasant.GetSheHe]! Isso parece divertido!"
 contest_events.3030.d:0 "A nudez não é pecado!"
 contest_events.3030.desc:0 "Enquanto os cavalos se preparam para a corrida, toda a multidão está aplaudindo e cantando para seu corredor favorito. Isso é, até que eles coletivamente arregalam os olhos e ficam completamente silenciosos. Um(a) [naked_peasant.GetWomanMan] nu(a) corre para a pista e mostra tudo o que [ROOT.Char.GetFaith.CreatorName|U] deu a [naked_peasant.GetSheHe] de cima a baixo.\n\nA multidão começa imediatamente a vaiar essa criatura impulsiva e a atirar qualquer coisa que consigam atingir [naked_peasant.GetSheHe]."
 contest_events.3030.e:0 "Façam os cavalos pisotearem [naked_peasant.GetSheHe]."
 contest_events.3030.t:0 "$tournament_contest_header$ Como [ROOT.Char.GetFaith.CreatorName|U] Fez [naked_peasant.GetSheHe|U]"
 contest_events.4500.a:0 "Maldição."
 contest_events.4500.desc:0 "Estou quase pulando de alegria ao assistir meu cavalo de corrida #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! se manter no grupo da frente.\n\nConforme eles se aproximam do fim de mais uma volta, meu coração afunda quando meu [ROOT.Char.Custom('ContestHorseRaceGender')] e seu cavaleiro caem repentinamente, desaparecendo na poeira!\n\nUma vez que os outros passam, escapando por pouco de um desastre, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! luta para se levantar - está claro que [ROOT.Char.Custom('ContestHorseRaceSheHe')] não pode continuar..."
 contest_events.4500.sabotage:0 "Eu simplesmente não entendo! #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! é um dos melhores cavalos por aí! A menos que... Eu olho desconfiado(a) para as arquibancadas..."
 contest_events.4500.t:0 "$tournament_contest_header$ Tombo Trágico"
 contest_events.4500.unskilled:0 "[ROOT.Char.Custom('ContestHorseRaceSheHe')|U] não é o melhor dos cavalos, mas esse constrangimento manchará minha reputação como criador de corridas..."
 contest_events.4501.a:0 "Faz parte."
 contest_events.4501.desc:0 "[contestant.GetTitledFirstName] está pulando de alegria ao assistir seu cavalo de corrida #EMP [contestant.Custom('GetContestHorseRaceName')]#! se manter no grupo da frente.\n\nConforme eles se aproximam do fim de mais uma volta, o(a) [contestant.Custom('ContestHorseRaceGender')] e seu cavaleiro caem repentinamente, desaparecendo na poeira! [contestant.GetFirstNameNoTooltip] fica arrasado(a).\n\nUma vez que os outros passam, escapando por pouco de um desastre, #EMP [contestant.Custom('GetContestHorseRaceName')]#! luta para se levantar - está claro que [contestant.Custom('ContestHorseRaceSheHe')] não pode continuar...\n\n"
 contest_events.4501.sabotage:0 "[contestant.GetTitledFirstNameNoTooltip] está claramente perplexo(a). 'Eu simplesmente não entendo! #EMP [contestant.Custom('GetContestHorseRaceName')]#! é um dos melhores cavalos por aí!', [contestant.GetSheHe] exclama, olhando suspeitosamente para as arquibancadas."
 contest_events.4501.t:0 "$contest_events.1540.t$"
 contest_events.4501.unskilled:0 "Não acho que alguém vá apostar em outro cavalo de [contestant.GetTitledFirstNamePossessiveNoTooltip] tão cedo..."
 contest_events.4600.a:0 "Corra! Corra, sua égua velha!"
 contest_events.4600.b.wager:0 "Vamos lá, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!"
 contest_events.4600.b:0 "Vamos lá, #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#!"
 contest_events.4600.c:0 "Com calma..."
 contest_events.4600.desc:0 "Eu observo os cavalos galopando diante das arquibancadas, absorvendo o cheiro de poeira levantada, o som da multidão gritando, o forte impacto de muitos cascos.\n\n"
 contest_events.4600.entrant:0 "Meu [ROOT.Char.Custom('ContestHorseRaceGender')], #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! mantém o ritmo à medida que as voltas avançam, seu cavaleiro competindo bem com os outros."
 contest_events.4600.t:0 "$tournament_contest_header$ Encorajamento Enthusiástico"
 contest_events.4600.wager:0 "Sigo atentamente [wager_owner.GetTitledFirstNamePossessive] [wager_owner.Custom('ContestHorseRaceGender')] #EMP [wager_owner.Custom('GetContestHorseRaceName')]#! e seu cavaleiro, sonhando com as moedas que posso ganhar..."
 contest_events.4600.wager_entrant:0 "Embora eu tenha inscrito meu [ROOT.Char.Custom('ContestHorseRaceGender')], [ROOT.Char.Custom('GetContestHorseRaceName')], meus olhos estão em #EMP [wager_owner.GetTitledFirstNamePossessive] [wager_owner.Custom('GetContestHorseRaceName')]#! e seu cavaleiro, pensando nas moedas que posso ganhar..."
 contest_events.5000.desc:0 "[enemy.GetFirstName] lança um sorriso arrogante na minha direção enquanto sobe ao palco, e não demora muito para eu descobrir o porquê. O primeiro verso é um insulto grave a mim, e o resto segue o mesmo padrão!\n\nO som da multidão torcendo e vaiando enche meus ouvidos. Não tenho escolha senão retaliar com meu próprio poema contra a honra de [enemy.GetFirstName]. Meu verso de abertura é de suma importância.\n\n\"#POE é verdade que [enemy.GetFirstNameNoTooltip] rima como ninguém! No entanto..."
 contest_events.5000.failure:0 "Seu verso é ineficaz"
 contest_events.5000.licentious:0 "#POE ...[enemy.GetSheHe] é um[Select_CString( enemy.IsFemale, 'a', '' )] amante devass[Select_CString( enemy.IsFemale, 'a', 'o' )]!"
 contest_events.5000.shagged_your_dad:0 "#POE ...Eu deitei com o pai [enemy.GetHerHim]!"
 contest_events.5000.shagged_your_mum:0 "#POE ...Eu deitei com a mãe [enemy.GetHerHim]!"
 contest_events.5000.stupid:0 "#POE ...A mente [enemy.GetHerHim] não poderia ser mais opaca!"
 contest_events.5000.success:0 "Seu verso conquista a multidão"
 contest_events.5000.t:0 "Um Recital Ruidoso"
 contest_events.5000.ugly:0 "#POE ...O rosto [enemy.GetHerHim] não poderia ser mais áspero!"
 contest_events.5010.a:0 "Retaliar com um insulto!"
 contest_events.5010.b:0 "Devo tentar entender."
 contest_events.5010.desc:0 "[enemy.GetFirstName] me encara intensamente, com um pergaminho e uma pena ainda em mãos. [enemy.GetSheHe] respira fundo e começa a proferir um absurdo total que não tenho esperança de entender.\n\nClaramente, o que [enemy.GetSheHe] está dizendo importa muito para [enemy.GetSheHe], já que [enemy.GetSheHe] continua me encarando intensamente, enquanto alguns membros da plateia silenciosa arfam e sussurram, sem dúvida traduzindo os versos para seus amigos."
 contest_events.5010.t:0 "Perdido na Tradução"
 contest_events.5020.a:0 "Mais um verso não faria mal!"
 contest_events.5020.b:0 "Devo fazer uma reverência e partir."
 contest_events.5020.desc:0 "A multidão grita e aplaude quando termino meu mais recente recital, uma peça projetada para atingir a honra de [enemy.GetFirstName] e mostrar a todos o quanto minha sagacidade é superior! Não há dúvidas na mente de ninguém sobre quem é o vencedor claro, mas na euforia do momento, sinto a vontade de declamar um novo poema para minha adorável plateia."
 contest_events.5020.t:0 "Um Verso Virtuoso"
 contest_events.5030.a:0 "\"Eu tenho mais um!\""
 contest_events.5030.b:0 "Admita a derrota."
 contest_events.5030.desc:0 "Solto um suspiro triunfante ao concluir o último verso do meu recital. Me preparo para o aplauso ensurdecedor da plateia, apenas para encontrar os terrenos do torneio silenciosos, exceto pelo vento sussurrando entre as árvores.\n\nIsso é um desastre, mas talvez essa situação possa ser corrigida com um novo poema composto e recitado no momento."
 contest_events.5030.t:0 "Um Lamento Lamentável"
 contest_events.5500.a:0 "Sinto uma coceira chegando..."
 contest_events.5500.b:0 "Se ao menos eu pudesse me livrar dessa maldita tosse..."
 contest_events.5500.c:0 "Ah, como era mesmo aquela melodia de menestrel?"
 contest_events.5500.d:0 "Truques baratos estão abaixo de mim."
 contest_events.5500.desc:0 "O silêncio é ensurdecedor: [versus_contestant.GetTitledFirstName] tem contemplado o próximo movimento por uma eternidade, olhos fixos no tabuleiro de [activity.Custom('ContestBoardGameType')].\n\nClaramente, [versus_contestant.GetSheHe] quer vencer.\n\nAssim que a ideia de distrair [versus_contestant.GetSheHe] me ocorre, é difícil ignorá-la..."
 contest_events.5500.failure:0 "Você quase se engasga"
 contest_events.5500.mixed:0 "Você está um pouco exagerado"
 contest_events.5500.nothing:0 "[versus_contestant.GetFirstNameNoTooltip] não se importa"
 contest_events.5500.success:0 "[versus_contestant.GetFirstNameNoTooltip] tem dificuldade em se concentrar"
 contest_events.5500.t:0 "$tournament_contest_header$ Distração Ardilosa"
 contest_events.5510.a:0 "Pegue-as! Eu preciso fazer minha última jogada!"
 contest_events.5510.b:0 "Esse comportamento antiesportivo é inaceitável!"
 contest_events.5510.c:0 "Vamos voltar algumas jogadas."
 contest_events.5510.d:0 "Sabe, você poderia ter simplesmente admitido a derrota..."
 contest_events.5510.desc:0 "A mesa vira com um estrondo ensurdecedor, lançando as peças do [activity.Custom('ContestBoardGameType')] pelo ar.\n\nO humor de [versus_contestant.GetFirstNamePossessive] mudou subitamente há várias jogadas, quando [versus_contestant.GetSheHe] percebeu que um simples erro quase decidiu o jogo a meu favor.\n\n\"Sim, sim, você ganha, [ROOT.Char.GetTitledFirstName]!\" [versus_contestant.GetSheHe] resmunga, \"#EMP Feliz?!#!\""
 contest_events.5510.t:0 "$tournament_contest_header$ A Birra na Mesa"
 contest_events.5520.a.failure:0 "A manobra dá errado"
 contest_events.5520.a.success:0 "A manobra é um golpe de mestre"
 contest_events.5520.a:0 "$tournament_contest_header$ Suavemente, suavemente..."
 contest_events.5520.b:0 "Digo, você está bastante exposto, sabe."
 contest_events.5520.c:0 "É uma artimanha, minha estratégia atual está correta."
 contest_events.5520.desc:0 "Observando silenciosamente o tabuleiro de [activity.Custom('ContestBoardGameType')] enquanto [versus_contestant.GetFirstName] considera seu próximo movimento, de repente eu percebo.\n\nDistraído em minha estratégia ociosa, eu deixei passar uma abertura que me daria uma clara vantagem, contanto que meu oponente não a tenha antecipado.\n\nEstou consciente de não dar nenhum sinal externo de reconhecimento para não chamar a atenção, examinando os olhos de [versus_contestant.GetFirstNamePossessive] em busca de consciência ou da dissimulação de uma armadilha..."
 contest_events.5520.t:0 "O Gambito do [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 contest_events.5530.a.failure:0 "Sua decepção é percebida"
 contest_events.5530.a.success:0 "Você trapaceia com sucesso e vence"
 contest_events.5530.a:0 "Uma peça extra passaria despercebida..."
 contest_events.5530.b:0 "\"Na verdade, existe essa regra obscura...\""
 contest_events.5530.c:0 "Eu não vou trapacear!"
 contest_events.5530.desc:0 "O jogo de [activity.Custom('ContestBoardGameType')] parece estar indo perfeitamente. Estou pensando três, quatro, talvez até cinco jogadas à frente do meu oponente quando, de repente, [versus_contestant.GetFirstName] faz um movimento que faz minha estratégia intricada se desfazer como uma gota de neve na chama de uma vela.\n\nEstou completamente sem opções, se eu não fizer algo impulsivo, certamente perderei a partida!"
 contest_events.5530.t:0 "Destreza das Mãos"
 contest_events.5540.a.failure:0 "Seu oponente não se abala"
 contest_events.5540.a.success:0 "Seu oponente desiste da partida"
 contest_events.5540.a:0 "\"Toque nessa peça e eu quebrarei seus dedos.\""
 contest_events.5540.b:0 "Eu não irei desonrar a mim mesmo."
 contest_events.5540.desc:0 "Parece que minha grande estratégia está desmoronando e [versus_contestant.GetFirstName] está avançando rapidamente. Se fosse uma questão de guerra, eu estaria considerando uma rendição misericordiosa. Sinto meu interior ferver de raiva e meus punhos se fecharem com tanta força que poderiam sangrar.\n\nQuando [versus_contestant.GetSheHe] estende a mão para pegar sua peça, os olhos arrogantes [versus_contestant.GetHerHim] encontram os meus, e seu rosto se transforma em uma expressão de choque e temor.\n\nTalvez eu possa usar esse momento para intimidar [versus_contestant.GetSheHe] a não fazer seu próximo movimento."
 contest_events.5540.t:0 "$tournament_contest_header$ Força em Vez de Estratégia"
 contest_events.5550.a.failure:0 "O juiz decide pelas regras de [versus_contestant.GetCulture.GetName]"
 contest_events.5550.a.success:0 "O juiz decide pelas regras de [ROOT.Char.GetCulture.GetName]"
 contest_events.5550.a:0 "Juiz!"
 contest_events.5550.b:0 "\"Rogo-vos, ensine-me essas regras de [versus_contestant.GetCulture.GetNameNoTooltip].\""
 contest_events.5550.c:0 "Talvez algumas moedas convençam o juiz a ficar ao meu lado."
 contest_events.5550.desc:0 "Mantenho um olhar treinado no jogo de [activity.Custom('ContestBoardGameType')] enquanto meu oponente se prepara para fazer seu próximo movimento. Para meu espanto, [versus_contestant.GetFirstName] pega sua peça e... quebra as regras bem na minha frente!\n\n\"Que tipo de trapaça é essa?\" Eu protesto!\n\n\"Oh, me perdoe.\" Meu oponente coloca as mãos arrogantemente sobre a mesa. \"Eu estava sob a impressão de que estávamos jogando pelas regras de [versus_contestant.GetCulture.GetName]."
 contest_events.5550.t:0 "$tournament_contest_header$ Regras de [versus_contestant.GetCulture.GetNameNoTooltip]!"
 contest_events.5560.a.failure:0 "O juiz não acredita em você"
 contest_events.5560.a.success:0 "O juiz acredita em você"
 contest_events.5560.a:0 "\"Juiz! [versus_contestant.GetFirstNameNoTooltip|U] está trapaceando!\""
 contest_events.5560.b.failure:0 "[versus_contestant.GetFirstNameNoTooltip] supera você"
 contest_events.5560.b.success:0 "Você confunde [versus_contestant.GetFirstNameNoTooltip]"
 contest_events.5560.b:0 "Meus movimentos devem se tornar imprevisíveis."
 contest_events.5560.c.success:0 "Você supera [versus_contestant.GetFirstNameNoTooltip]"
 contest_events.5560.c:0 "Vou apenas focar no jogo."
 contest_events.5560.desc:0 "Minha partida contra [versus_contestant.GetName] está indo muito mal. [versus_contestant.GetSheHe|U] está jogando em um nível que eu não achava possível.\n\nEu percebo que os olhos [versus_contestant.GetHerHim] continuam se movendo para a multidão e parecem estar olhando diretamente para uma figura que está de pé quase atrás de mim! Eles estão fazendo gestos sutis com as mãos e movendo os lábios, sem dúvida dando instruções a [versus_contestant.GetFirstNameNoTooltip]."
 contest_events.5560.t:0 "$tournament_contest_header$ O Mestre das Marionetes"
 contest_events.5570.a.failure:0 "Você é pego trapaceando"
 contest_events.5570.a.success:0 "Você não é notado"
 contest_events.5570.a:0 "Trocar algumas peças de lugar."
 contest_events.5570.b:0 "Entrar em pânico e comer uma peça!"
 contest_events.5570.c:0 "Não vou desonrar a mim mesmo trapaceando."
 contest_events.5570.desc:0 "Estou focado intensamente no tabuleiro de xadrez, e toda a plateia aguarda em silêncio. De repente, com um estrondoso som metálico, a atenção de toda a plateia é voltada para o tolo escudeiro que acabou de derrubar uma coleção de armas e armaduras no chão.\n\nNinguém está olhando para o tabuleiro, agora é minha oportunidade de virar o jogo adulterando as peças!"
 contest_events.5570.t:0 "$tournament_contest_header$ Uma Manobra Astuta"
 contest_events.wager_loss:0 "\n\nLá vai meu dinheiro - se ao menos eu tivesse apostado em [contest_winner.GetTitledFirstNameNoTooltip]..."
 contest_events.wager_loss_horse:0 "\n\nLá vai meu dinheiro - se ao menos eu tivesse apostado em #EMP [contest_winner.Custom('GetContestHorseRaceName')]#!..."
 contest_events.wager_win:0 "\n\n#EMP Sim#!, [contest_winner.GetTitledFirstNameNoTooltip]! Eu escolhi um vencedor!"
 contest_events.wager_win_horse:0 "\n\n#EMP Sim#!, #EMP [contest_winner.Custom('GetContestHorseRaceName')]#!! Eu escolhi um vencedor!"
 contest_events_closing_marriage_betrothal:0 "\n\n\"Conforme prometido, [host.GetTitledFirstNameNoTooltip] ofereceu o noivado de [marriage_prize.GetFirstNamePossessive] a [contest_winner.GetFirstNameNoTooltip]!"
 contest_events_closing_marriage_betrothal_host:0 "\n\n\"De acordo com a própria decisão [host.GetHerHim], [host.GetTitledFirstNameNoTooltip] prometeu [marriage_prize.GetFirstName] em noivado a seu(a) [host.Custom2('RelationToMeShort', marriage_prize)], como o vencedor!"
 contest_events_closing_marriage_host:0 "De forma estranha, e indiscutível habilidade, encontro-me entre os vencedores elegíveis..."
 contest_events_closing_marriage_host_refused:0 "\n\nSomente [host.GetTitledFirstName] [host.GetHerselfHimself] era um pretendente elegível, e [host.GetSheHe] decidiu não se casar com seu(a) [host.Custom2('RelationToMeShort', marriage_prize)]"
 contest_events_closing_marriage_invalid:0 "\n\nParece que o destino determinou que o prêmio prometido de [host.GetTitledFirstNamePossessive] [host.Custom2('RelationToMeShort', marriage_prize)], [marriage_prize.GetFirstNamePossessive], em casamento não se concretizasse."
 contest_events_closing_marriage_invalid_family:0 "$contest_events_closing_marriage_invalid$ Não seria adequado para uma [marriage_prize.GetWomanMan] se casar com seu(a) [marriage_prize.Custom2('RelationToMeShort', contest_winner)]."
 contest_events_closing_marriage_invalid_slots:0 "$contest_events_closing_marriage_invalid$ Afinal, uma [contest_winner.GetWomanMan] só precisa de tantos parceiros."
 contest_events_closing_marriage_none:0 "No entanto, nenhum dos vencedores é um pretendente elegível de qualquer maneira..."
 contest_events_closing_marriage_one:0 "Parece que [bachelor_1.GetFullName] é o único pretendente viável."
 contest_events_closing_marriage_reneged_winner:0 "\n\n\"[host.GetTitledFirstNameNoTooltip] recusou-se escandalosamente a honrar o prêmio prometido de seu(a) [host.Custom2('RelationToMe', marriage_prize)], [marriage_prize.GetFirstNamePossessive], em casamento! Isso só pode ser visto como um insulto aos vencedores!"
 contest_events_closing_marriage_three:0 "[bachelor_1.GetFullName], [bachelor_2.GetFullName] e [bachelor_3.GetFullName] estão todos ansiosos para se casar e são vitoriosos em seus próprios méritos."
 contest_events_closing_marriage_two:0 "[bachelor_1.GetFullName] e [bachelor_2.GetFullName] são ambos pretendentes possíveis, sendo vitoriosos em seus próprios direitos."
 contest_events_closing_marriage_valid:0 "Depende de mim se irei honrar minha palavra..."
 contest_events_closing_marriage_valid_host_only:0 "\n\nDe forma estranha, e indiscutível habilidade, sou o único [marriage_prize.Custom('GetBrideGroom')] viável..."
 contest_events_closing_marriage_wedding:0 "\n\n\"Conforme prometido, [host.GetTitledFirstNameNoTooltip] entregou [marriage_prize.GetFirstNamePossessive] mão em casamento a [contest_winner.GetFirstNameNoTooltip]!"
 contest_events_closing_marriage_wedding_host:0 "\n\n\"De acordo com a própria decisão [host.GetHerHim], [host.GetTitledFirstNameNoTooltip] se casou com [host.GetSheHe] [host.Custom2('RelationToMeShort', marriage_prize)], [marriage_prize.GetFirstNamePossessive], como o vencedor!"
