l_spanish:
 cultural_acceptance_knightly_camaraderie:0 "Troca de práticas marciais"
 cultural_acceptance_knightly_rivalry:0 "Inimizade entre guerreiros de torneio"
 drunk_knight_beats_log:0 "Embriagado, [TARGET_CHARACTER.GetTitledFirstName] espancou gravemente vários guerreiros proeminentes para conquistar um lugar entre os $knight_culture_player_plural_no_tooltip_lowercase$ de [CHARACTER.GetTitledFirstNamePossessive]."
 drunk_knight_beats_log_title:0 "Terror da Taverna"
 drunk_knight_dies_log:0 "[TARGET_CHARACTER.GetTitledFirstName] bebeu até a morte enquanto se divertia loucamente com [CHARACTER.GetTitledFirstName]."
 drunk_knight_dies_log_title:0 "Vítima da Farra"
 drunk_knight_marries_log:0 "[TARGET_CHARACTER.GetTitledFirstName] emergiu de uma farra pesada com um novo mestre e um casamento na família de [CHARACTER.GetTitledFirstNamePossessive]."
 drunk_knight_marries_log_title:0 "As Promessas da Noite"
 drunk_oaths_log:0 "[CHARACTER.GetTitledFirstName] convenceu um grupo de $knight_culture_player_plural_no_tooltip_lowercase$ embriagados, sendo [TARGET_CHARACTER.GetTitledFirstName] o maior entre eles, a abandonar seus senhores feudais em favor [CHARACTER.GetHerHim]."
 drunk_oaths_log_title:0 "Recrutador dos Rostos Ruborizados"
 every_knight_change_contestant_score_effect_low_tt:0 "As pontuações dos [knights|e] de [THIS.Char.GetShortUINamePossessive|U] aumentam ligeiramente."
 every_knight_change_contestant_score_effect_tt:0 "As pontuações dos [knights|e] de [THIS.Char.GetShortUINamePossessive|U] aumentam moderadamente."
 jason_locale_events.0220.a.tt:0 "Esses $knight_culture_player_plural_no_tooltip_lowercase$ estão aqui para vencer competições. Nada mais importa."
 jason_locale_events.0220.a:0 "Observe nossos oponentes: aprenda suas fraquezas."
 jason_locale_events.0220.b:0 "Habilidades? Bah! Estamos aqui para sermos vistos."
 jason_locale_events.0220.c.tt:0 "Vamos temperar a força e os reflexos, a cavalo e a pé."
 jason_locale_events.0220.c:0 "Aos selins - desembainhem suas espadas!"
 jason_locale_events.0220.d.tt:0 "Exercitar as faculdades é tão valioso quanto suar o dia todo."
 jason_locale_events.0220.d:0 "$knight_culture_player_plural_no_tooltip$! Mostrem sua agudeza, tanto de visão quanto de mente."
 jason_locale_events.0220.desc:0 "Meus $knight_culture_player_plural_no_tooltip_lowercase$ estão reunidos para o treinamento do dia, seus ajudantes carregando os equipamentos. [senior_knight.GetTitledFirstName] e eu estamos diante de todos.\n\n\"$knight_culture_player_plural_no_tooltip$! O que vocês não sabem, peçam humildemente para serem ensinados\", incentiva [senior_knight.GetFirstNameNoTooltip]. \"Juntos, representamos o [ROOT.Char.GetTitleAsNameNoTooltip]! Vamos nos preparar juntos para as nossas glórias.\"\n\n[senior_knight.GetSheHe|U] se vira para mim, [senior_knight.Custom('EyeEyes')] brilhando.\n\n\"Comande-nos.\""
 jason_locale_events.0220.e.tt:0 "Dê a todos algo para admirar! #EMP Defenda-se!#!"
 jason_locale_events.0220.e:0 "Supere todos, [senior_knight.GetFirstNameNoTooltip]. #EMP Agora!#!"
 jason_locale_events.0220.t:0 "Onde a Vitória é Fomentada"
 jason_locale_events.100.a.tt:0 "Talvez [unreliable_knight.GetSheHe] não esteja preparado para dar o seu melhor, mas este $knight_culture_player_no_tooltip_lowercase$ #EMP se submeterá#! à sua autoridade."
 jason_locale_events.100.a:0 "Você me deve seu serviço, lembra-se?"
 jason_locale_events.100.b.tt:0 "E cuide dos meus melhores $knight_culture_player_plural_no_tooltip_lowercase$, eu juro!"
 jason_locale_events.100.b:0 "Participe! Eu lhe darei qualquer coisa!"
 jason_locale_events.100.c.demanding:0 "Seu juramento está anulado, ventríloquo! Desapareça!"
 jason_locale_events.100.c.depressed:0 "Você não é mais um $knight_culture_player_no_tooltip_lowercase$ meu."
 jason_locale_events.100.c.drunk:0 "Seu juramento está anulado, beberrão! Desapareça!"
 jason_locale_events.100.c.forbid_knight:0 "[unreliable_knight.GetShortUIName] está proibido de ser seu $knight_culture_player_no_tooltip_lowercase$"
 jason_locale_events.100.c.hash:0 "Seu juramento está anulado, cretino! Desapareça!"
 jason_locale_events.100.c.mad:0 "Seu juramento está anulado, maníaco! Desapareça!"
 jason_locale_events.100.c.tt:0 "Despeça este inapropriado $knight_culture_player_no_tooltip_lowercase$ de seu serviço!"
 jason_locale_events.100.d.not_competing:0 "[unreliable_knight.GetShortUIName] não competirá nem ajudará em competições em equipe"
 jason_locale_events.100.d:0 "Talvez você deva apenas... descansar."
 jason_locale_events.100.desc.demand:0 "\"Todo o mundo sabe que eu sou um grande e digno $knight_culture_player_no_tooltip_lowercase$,\" rosna [unreliable_knight.GetSheHe]. \"E assim, sem acompanhantes nobres e grandes presentes do meu senhor, eu devo #EMP recusar#! competir.\"\n\n\"Minha participação nos concursos na pobreza seria uma desonra para ambos.\""
 jason_locale_events.100.desc.depressed:0 "o sangue de um $knight_culture_player_no_tooltip_lowercase$.\n\nLágrimas tornam-se vermelhas nas bochechas de [unreliable_knight.GetTitledFirstNamePossessiveNoTooltip].\n\n\"Eu não posso ir lá,\" soluça seu $knight_culture_player_no_tooltip_lowercase$. \"Eu não posso enfrentá-los. Não de novo — não agora. Por favor, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName|U], #EMP por favor#!... poupe-me da confusão do torneio?\""
 jason_locale_events.100.desc.drunk:0 "Seu $knight_culture_player_no_tooltip_lowercase$ está chocantemente bêbado, ainda bebendo mais vinho e fazendo caretas em meio à evidente autodesprezo [unreliable_knight.GetHerHim]. O bêbado estará em total ruína pela manhã.\n\n\"Eu devo, eu devo — #EMP hic#! — montar ou lutar ou seja lá o que era?\""
 jason_locale_events.100.desc.hash:0 "Seu $knight_culture_player_no_tooltip_lowercase$ está visivelmente confuso, com o hálito cheirando a haxixe. Pele pegajosa de suor, [unreliable_knight.Custom('EyeEyes')] semicerrados, [unreliable_knight.GetSheHe] ri e baba ao perguntar:\n\n\"Eu, uh, devo estar fazendo alguma coisa... nas próximas horinhas?\""
 jason_locale_events.100.desc.insanity:0 "penas, fezes e sangue.\n\nUma mão decepada repousa aos pés de [unreliable_knight.GetTitledFirstNamePossessiveNoTooltip]. De quem? Eu não sei. [unreliable_knight.GetSheHe|U] gesticula com ambas as mãos, proferindo:\n\n\"Outras mãos irão aparecer, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName|U], mais mãos ensanguentadas. Você vê? Se eu estiver nos torneios, mais mãos sangrentas aparecem.\""
 jason_locale_events.100.desc.mess:0 "Derramadas bebidas mancham um chão cheio de iguarias roídas, objetos efêmeros estranhos e móveis revirados.\n\n"
 jason_locale_events.100.desc.self_harm:0 "Uma meia-luz sombria paira sobre um chão repleto de roupas rasgadas, objetos quebrados,"
 jason_locale_events.100.desc.smug:0 "[unreliable_knight.GetTitledFirstNameNoTooltip] me reconhece com uma reverência escassa, girando sua espada brilhante repetidamente em suas mãos.\n\n"
 jason_locale_events.100.desc:0 "As recentes ausências de meu $knight_culture_player_no_tooltip_lowercase$ [unreliable_knight.GetTitledFirstNamePossessive] não passaram despercebidas, assim como os muitos servos que foram afastados de sua porta. A pedido do cavaleiro, entro em seu aposento.\n\n"
 jason_locale_events.100.t:0 "[unreliable_knight.GetSheHe|U] Quem Recusa a Luta"
 jason_locale_events.200.a.tt.beatings:0 "\"Quer me ver lutar, não é?\""
 jason_locale_events.200.a.tt.beatings_specific:0 "[drunk_knight.GetFirstNameNoTooltip] prova [drunk_knight.GetHerselfHimself] com algumas surras brutais"
 jason_locale_events.200.a.tt.death:0 "\"Eu vou beber tanto quanto você, meu [ROOT.Char.GetTitleTierName]!\""
 jason_locale_events.200.a.tt.death_specific:0 "O talento de [drunk_knight.GetFirstNamePossessiveNoTooltip] para beber... fracassou com [drunk_knight.GetSheHe]"
 jason_locale_events.200.a.tt.join:0 "[drunk_knight.GetFirstNameNoTooltip] se torna seu $knight_culture_player_no_tooltip_lowercase$, provocando a ira de [drunk_knight_liege.GetShortUINamePossessive]"
 jason_locale_events.200.a.tt.join_three:0 "[drunk_knight.GetShortUIName] se torna seu $knight_culture_player_no_tooltip_lowercase$"
 jason_locale_events.200.a.tt.marry:0 "\"Apenas um casamento selará nosso vínculo!\""
 jason_locale_events.200.a.tt.marry_desc:0 "Um dos membros da sua [house|E] ou [close_family|E] irá se casar com [drunk_knight.GetUIName]"
 jason_locale_events.200.a.tt.marry_specific:0 "Seu [ROOT.Char.Custom2('RelationToMeShort', surprise_spouse)] [surprise_spouse.GetFirstNameNoTooltip] se casa com [drunk_knight.GetFirstNameNoTooltip]"
 jason_locale_events.200.a.tt.recruit:0 "\"O [ROOT.Char.GetTitleTierName] convoca, $knight_culture_player_plural_no_tooltip_lowercase$! Você responderá?\""
 jason_locale_events.200.a.tt.recruit_desc:0 "Mais $knight_culture_player_plural_no_tooltip_lowercase$ embriagados são juramentados a você"
 jason_locale_events.200.a.tt.recruit_lieges:0 "Os senhores feudais dos seus novos cortesãos estão enfurecidos, especialmente [drunk_knight_liege.GetShortUIName]"
 jason_locale_events.200.a.tt.recruit_specific:0 "[extra_knight.GetFirstNameNoTooltip] e [extra_knight_2.GetFirstNameNoTooltip] são juramentados a você"
 jason_locale_events.200.a.tt.song:0 "\"Reúnam-se todos! Eu canto a história do grande [ROOT.Char.GetTitledFirstNameNoTooltip]!\""
 jason_locale_events.200.a.tt.song_specific:0 "Os cantos apaixonados de [drunk_knight.GetFirstNameNoTooltip] anunciam o juramento [drunk_knight.GetHerHim] a você"
 jason_locale_events.200.a.tt:0 "[drunk_knight.GetFirstNameNoTooltip], completamente bêbado, tentará provar o seu valor... como? Só a bebida sabe."
 jason_locale_events.200.a:0 "Prove-se, $knight_culture_player_no_tooltip_lowercase$! #EMP Beba!#!"
 jason_locale_events.200.b.tt:0 "Realize o juramento cerimonial, que não pode ser revogado pela manhã."
 jason_locale_events.200.b:0 "Que sua devoção nunca vacile... embora você o faça!"
 jason_locale_events.200.c.attacked:0 "[drunk_knight.GetSheHe|U] #bold dá um tapa#! em você"
 jason_locale_events.200.c.duel.tt:0 "Ambos sacam suas armas!"
 jason_locale_events.200.c.lost_brawl.tt:0 "Humilhado por um bêbado"
 jason_locale_events.200.c.slap.tt:0 "Seus guardas intervêm, mas tarde demais!"
 jason_locale_events.200.c.tt:0 "O que esse traidor bêbado vai fazer? Vomitar em mim? [drunk_knight.GetSheHe|U] não está exatamente em condições de lutar."
 jason_locale_events.200.c.unchallenged:0 "O $knight_culture_player_no_tooltip_lowercase$ recua"
 jason_locale_events.200.c.won_brawl.tt:0 "Sua cabeça mais clara prevalece!"
 jason_locale_events.200.c:0 "Saia da frente, idiota. Seu senhor feudal ficará sabendo disso."
 jason_locale_events.200.d.tt:0 "Não se deve escolher palavras bêbadas e imprudentes em vez de juramentos de lealdade."
 jason_locale_events.200.d:0 "Silêncio. Cuide de sua honra, [drunk_knight.GetFirstNameNoTooltip]."
 jason_locale_events.200.desc.caution:0 "Essa tolice trazida pelo vinho... pode me trazer tanto um grande guerreiro quanto um inimigo vingativo."
 jason_locale_events.200.desc.party:0 "E com certeza, a perda [drunk_knight.GetHerHim] enfurecerá o [drunk_knight_liege.GetTitleTierName]... mas eu sinto que está por vir uma festa #EMP histórica#!"
 jason_locale_events.200.desc:0 "\"Cada gota da minha honra\", murmura [drunk_knight.GetFullName], derramando sobre [drunk_knight.GetHerselfHimself], \"pertence a você!\"\n\nOs serviçais tentam conter [drunk_knight.GetSheHe], e seus amigos oferecem desculpas. O embriagado $knight_culture_player_no_tooltip_lowercase$ os afasta.\n\n\"Me soltem! Malditos todos vocês! [ROOT.Char.GetTitleTierName] — liberte-me do meu mestre decadente! Meu juramento é seu. Você me aceitará?\"\n\nO riso fica entalado em minha garganta. Pois [drunk_knight.GetFirstNameNoTooltip] é um verdadeiro e famoso $knight_culture_player_no_tooltip_lowercase$, agraciado com grandes honras por seu senhor feudal, [drunk_knight_liege.GetTitledFirstName]."
 jason_locale_events.200.t:0 "Lealdade, Arrotada"
 jason_locale_events.210.a.lose:0 "Sua desajeitada e delicada performance convida piadas alegres"
 jason_locale_events.210.a.win:0 "Você representa nobremente os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]"
 jason_locale_events.210.a:0 "Vou tentar!"
 jason_locale_events.210.b.lose:0 "As tentativas de [root_culture_knight.GetFirstNamePossessiveNoTooltip] são... bastante tristes"
 jason_locale_events.210.b.same_heritage:0 "[root_culture_knight.GetTitledFirstName] é a personificação da habilidade [ROOT.Char.GetCulture.GetHeritage.GetNameNoTooltip]."
 jason_locale_events.210.b.tt:0 "[root_culture_knight.GetSheHe|U] é igual a qualquer feito, não importa o quão desconhecido!"
 jason_locale_events.210.b.win:0 "[root_culture_knight.GetFirstNameNoTooltip] está à altura da expertise [foreign_lord.GetCulture.GetNameNoTooltip]"
 jason_locale_events.210.b:0 "[root_culture_knight.GetTitledFirstNameNoTooltip] é a personificação da habilidade [ROOT.Char.GetCulture.GetNameNoTooltip]."
 jason_locale_events.210.c.tt:0 "Algum talento estrangeiro poderia beneficiar meus [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] e homens de armas."
 jason_locale_events.210.c:0 "Você poderia ceder alguns [foreign_lord.Custom('KnightCultureNoTooltip')|l] para nos ensinar?"
 jason_locale_events.210.d.camel_cavalry:0 "Nós, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], não precisamos de animais toscos!"
 jason_locale_events.210.d.crossbowmen:0 "Nós, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], não precisamos de engenhocas!"
 jason_locale_events.210.d.elephant_cavalry:0 "Nós, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], já somos altos o suficiente!"
 jason_locale_events.210.d.heavy_cavalry:0 "Nós, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], atacamos com força suficiente!"
 jason_locale_events.210.d.heavy_infantry:0 "Nós, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], podemos nos defender!"
 jason_locale_events.210.d.horse_archer:0 "Nós, [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], enfrentamos nossos inimigos!"
 jason_locale_events.210.d.tt.camel_cavalry:0 "Eu juro que vocês, [foreign_lord.GetCulture.GetCollectiveNounNoTooltip], prefeririam saborear o cuspe de camelo do que lutar contra nossas bravas tropas!"
 jason_locale_events.210.d.tt.crossbowmen:0 "Como covardes, os [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] abatem os mais nobres guerreiros de longe. Mas nós, nunca faremos isso."
 jason_locale_events.210.d.tt.elephant_cavalry:0 "Os tolos [foreign_lord.GetCulture.GetNameNoTooltip] correm o risco de serem pisoteados por seus próprios behemoths a qualquer momento! #EMP Nós corremos o risco de conquistar a glória!#!"
 jason_locale_events.210.d.tt.heavy_cavalry:0 "Não temos necessidade de colidir sem pensar!"
 jason_locale_events.210.d.tt.heavy_infantry:0 "Armadura? De que precisamos quando temos habilidade? Os [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] são pesados como pedras: nós os enterraremos sob a terra."
 jason_locale_events.210.d.tt.horse_archer:0 "Deixem os [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] sem honra cavalgarem em círculos! Como devem invejar seus cavalos suas esposas e maridos..."
 jason_locale_events.210.desc.camel_cavalry:0 "\"mas todos vocês não têm a vontade de domar um camelo! E mesmo suas traseiras porcinas não poderiam confortá-los em uma de nossas selas!\"\n\nCriados próximos seguram as rédeas dos camelos: o desafio do [foreign_lord.GetTitleTierName] é sério. Embora os [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] aterrorizem os cavalos e dominem desertos e terras secas em cima de suas montarias... o cheiro dos camelos é realmente fétido."
 jason_locale_events.210.desc.crossbowmen:0 "\"mas vocês já #EMP viram#! uma dessas? Vocês saberiam carregar e mirar?\"\n\nO [foreign_lord.GetTitleTierName] me passa uma arma que, de fato, já vi antes... de longe. É um arco forte colocado de lado no final de um canal de flechas: os [foreign_lord.GetCulture.GetCollectiveNounNoTooltip] o usam para perfurar armaduras. Qualquer armadura."
 jason_locale_events.210.desc.elephant_cavalry:0 "\"mas algum guerreiro [ROOT.Char.GetCulture.GetNameNoTooltip] tem a coragem de ficar em cima de um elefante em batalha — empunhar lança e arco enquanto aquela tromba gigante soa em fúria?\"\n\nAs presas douradas de um elefante reluzem próximo; a howdah em suas costas range no alto. O [foreign_lord.GetTitleTierName] apresenta um desafio vasto e imprevisível."
 jason_locale_events.210.desc.heavy_cavalry:0 "\"mas entre vocês, quem já galopou contra uma linha inimiga, indiferente a todas as armas, seu corcel atropelando, sua lança atingindo o alvo? Experimentem o meu cavalo de guerra: vamos ver se vocês conseguem desmontar até mesmo o pior cavaleiro [foreign_lord.GetCulture.GetNameNoTooltip].\"\n\nMeu povo não utiliza as rédeas necessárias para cavalgar com uma lança pesada em batalha: esse não é o nosso caminho. Ainda assim, posso permitir que uma jactância dessas prevaleça...?"
 jason_locale_events.210.desc.heavy_infantry:0 "\"vocês podem se mover rapidamente! Mas e resistir firmemente contra um dos meus guerreiros, sobrecarregados com nossos equipamentos pesados, até que o inimigo se quebre contra vocês?\"\n\nMeus [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] lutam para entrar em impressionantes armaduras [foreign_lord.GetCulture.GetNameNoTooltip], empunham armas [foreign_lord.GetCulture.GetNameNoTooltip], maravilham-se com o peso delas. Suar em um duelo tão estranho... exigiria uma determinação impressionante."
 jason_locale_events.210.desc.horse_archer:0 "\"mas algum de vocês consegue virar no selim, cavalgando a toda velocidade, e soltar uma flecha por cima da cauda do seu cavalo? Vocês conseguem fazer isso no intervalo entre os batimentos dos cascos? A criança mais jovem [foreign_lord.GetCulture.GetNameNoTooltip] consegue fazer isso.\"\n\nVejo meus [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] puxando arcos recurvos, afagando pôneis das estepes. Nós somos excelentes cavaleiros... mas nos comparamos a um povo nascido em suas montarias..?"
 jason_locale_events.210.desc.teen:0 "$knight_culture_player_plural_no_tooltip$ imitam os atos de guerra e os rivais amigáveis se pavoneiam, enquanto os intérpretes riem com o seu trabalho.\n\n\"Vocês [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], bem, vocês são bons,\" resmunga [foreign_lord.GetName],"
 jason_locale_events.210.desc:0 "$knight_culture_player_plural_no_tooltip$ imitam os atos de guerra e os rivais amigáveis se pavoneiam, enquanto os intérpretes riem com o seu trabalho.\n\n\"Vocês [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] têm as suas habilidades,\" admite [foreign_lord.GetName],"
 jason_locale_events.210.t.camel_cavalry:0 "Mestres do Deserto"
 jason_locale_events.210.t.crossbowmen:0 "Um Arco, Cruzado"
 jason_locale_events.210.t.elephant_cavalry:0 "Cuidadores em Formação"
 jason_locale_events.210.t.heavy_cavalry:0 "Como um Trovão"
 jason_locale_events.210.t.heavy_infantry:0 "Permaneça, Inabalável"
 jason_locale_events.210.t.horse_archer:0 "O Disparo de Despedida"
 knight_dismissed_log:0 "[CHARACTER.GetTitledFirstName] libertou o competidor notável [TARGET_CHARACTER.GetTitledFirstName] do serviço [CHARACTER.GetHerHim] após um incidente misterioso."
 knight_dismissed_log_title:0 "Retentor Demitido"
 knight_not_participating_log:0 "O guerreiro [TARGET_CHARACTER.GetTitledFirstName] de [CHARACTER.GetTitledFirstNamePossessive] retirou-se do torneio. Rumores circulam."
 knight_not_participating_log_title:0 "Retentor se Retira"
 poached_drunk_knight_log:0 "[CHARACTER.GetTitledFirstName] aproveitou os juramentos embriagados de [TARGET_CHARACTER.GetTitledFirstName] para roubar o guerreiro do suserano [TARGET_CHARACTER.GetHerHim]."
 poached_drunk_knight_log_title:0 "Mudança de Lealdade"
 senior_knight_gains_nickname_tt:0 "[senior_knight.GetShortUIName] pode ganhar um impressionante [nickname|e]."
 tournament_knight_humiliated_modifier:0 "O Melhor Cavaleiro Humilhado"
 tournament_knight_humiliated_modifier_desc:0 "Desafiantes estrangeiros envergonharam o cavaleiro eminente deste personagem: seus guerreiros são considerados motivo de riso."
 tournament_loyalty_martial_traditions_modifier:0 "Lealdade às Tradições Marciais"
 tournament_loyalty_martial_traditions_modifier_desc:0 "Este personagem defende veementemente a superioridade de suas formas nativas de guerra."
 tournament_open_minded_warrior_modifier:0 "Guerreiro de Mente Aberta"
 tournament_open_minded_warrior_modifier_desc:0 "Este personagem demonstra um grande interesse pelos caminhos marciais de outros povos."
 tournament_wound_non_root_combatants_effect:0 "Alguns guerreiros de outros senhores ficam feridos"
