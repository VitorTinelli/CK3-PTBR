l_spanish:
 contest_wound_attendees_effect:0 "Muitos participantes do $activity_tournament$ estão [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 contest_wound_non_root_attendees_effect:0 "Muitos outros participantes do $activity_tournament$ estão [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 jason_race_events.1.a.tt.lose:0 "Você falha em evitar o motim"
 jason_race_events.1.a.tt.race:0 "A corrida continua sem interrupções"
 jason_race_events.1.a.tt.win:0 "Seu discurso acalma as pessoas"
 jason_race_events.1.a.tt:0 "Com palavras persuasivas certas, vou chamar a atenção deles de volta para a corrida."
 jason_race_events.1.a:0 "Somente eu posso acalmar a multidão."
 jason_race_events.1.b.tt:0 "E assim que limparmos o sangue dos olhos, podemos retomar a corrida!"
 jason_race_events.1.b:0 "Deixem a coragem sair deles, $knights$!"
 jason_race_events.1.c.tt.lose:0 "Seus executores iniciam um terrível motim"
 jason_race_events.1.c.tt.lose_knights:0 "Alguns dos seus $knight_culture_player_plural$ estão [GetTrait('wounded_1').GetName( GetNullCharacter )]"
 jason_race_events.1.c.tt.win:0 "Seus $knights$ aplacam a multidão"
 jason_race_events.1.c.tt:0 "Avancem, meus $knights$ — comecem uma violência verdadeiramente devastadora!"
 jason_race_events.1.c:0 "Talvez a multidão precise de um pequeno empurrão..."
 jason_race_events.1.d.tt.leave:0 "Você e sua comitiva se retiram em segurança."
 jason_race_events.1.d.tt.lose:0 "A violência da multidão se espalha por toda a terra"
 jason_race_events.1.d.tt.win:0 "A agitação é contida"
 jason_race_events.1.d.tt:0 "Quem sabe? Talvez tudo acabe bem."
 jason_race_events.1.d:0 "Preciso sair daqui, #EMP rápido#!."
 jason_race_events.1.desc.end:0 "\n\nIsto está prestes a se tornar um motim."
 jason_race_events.1.desc.guest_local_anger:0 "\n\n\"[host.GetTitledFirstName]!\" é gritado, juntamente com termos como “#EMP [host.Custom('GetCrime')|U]!#!”. Os mais furiosos são os locais: em [ROOT.Char.GetCurrentLocation.GetName], [host.GetFirstNameNoTooltip] está no meio de pessoas que desprezam [host.GetHerHim].\n\nObservando a multidão, vejo pedras, facas e armas de guerra."
 jason_race_events.1.desc.host_local_anger:0 "\n\n\"[ROOT.Char.GetTitledFirstName]!\" é gritado, juntamente com termos como “#EMP [ROOT.Char.Custom('GetCrime')|U]!#!”. Os mais furiosos são todos os locais — em [ROOT.Char.GetCurrentLocation.GetName], estou no meio de pessoas que me desprezam.\n\nObservando a multidão, vejo pedras, facas e armas de guerra."
 jason_race_events.1.desc.rowdy_fans:0 "\n\nA emoção da corrida sempre atrai o pior do reino, em enorme quantidade, e os instiga com promessas de festas e jogos de azar. \n\nÀs vezes, em dias de azar, os prazeres habituais não são suficientes: apenas sangue pode satisfazer."
 jason_race_events.1.desc:0 "Do vasto mar de espectadores da corrida, plebeus gritam. Guerreiros itinerantes entoam insultos, insinuações vulgares. Entre eles, nós, nobres, rimos nervosamente. Olhamos para nossos guardas."
 jason_race_events.1.t:0 "A Vontade da Multidão"
 jason_race_events.2.a.tt:0 "Meus cavaleiros de cavalaria deveriam ser treinados para cavalgar com a mesma audácia."
 jason_race_events.2.a:0 "Tal habilidade pertence ao campo de batalha!"
 jason_race_events.2.b.tt:0 "Um piloto tão destemido deveria estar à nossa frente em todas as jornadas."
 jason_race_events.2.b:0 "Minha comitiva poderia usar um novo batedor..."
 jason_race_events.2.c.tt:0 "Ganhe ou perca, os cavalos de ninguém causam uma impressão como os meus."
 jason_race_events.2.c:0 "Um momento que vale mil histórias!"
 jason_race_events.2.desc:0 "Os cavalos trovejam pela pista, seus corpos em movimento obscurecidos por nuvens de poeira, os xingamentos e gritos de seus jóqueis inaudíveis entre os cascos e o rugido da multidão.\n\nAinda assim, você pode perceber que seu jóquei [jockey.GetFirstName] está totalmente concentrado em uma curva que se aproxima rapidamente. Enquanto os outros diminuem a velocidade para fazer a curva fechada sem problemas, seu jóquei estimula com força.\n\nCom apenas uma distância mínima para sobrar, [jockey.GetFirstNameNoTooltip] e #EMP [ROOT.Char.Custom('GetContestHorseRaceName')]#! passam entre aqueles à frente. Uma manobra incrível — a multidão prende a respiração!"
 jason_race_events.2.t:0 "Uma Curva em Alta Velocidade"
