 tournament_events.0100.desc:0 "O torneio está finalmente acontecendo!\n\n"
 tournament_events.0100.host:0 "Muitos vieram para os meus terrenos em [activity.GetCurrentPhase.GetLocation.GetName], ansiosos para provar seu valor ou simplesmente aproveitar o espetáculo."
 tournament_events.0100.spectator:0 "Muitos vieram para os terrenos de [host.GetTitledFirstNamePossessive] em [activity.GetCurrentPhase.GetLocation.GetName], tanto para competir quanto, como eu, para se divertir."
