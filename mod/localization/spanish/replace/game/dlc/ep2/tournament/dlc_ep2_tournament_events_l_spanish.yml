 tournament_events.0050.t:0 "Chegada ao Torneio"
 tournament_events.0050.win:0 "Não há tempo a perder: preciso começar a me preparar! Eu devo ser um vencedor, a qualquer custo!"
 tournament_events.0100.a:0 "Não há tempo a perder!"
 tournament_events.0100.closing:0 "\n\nO sol se eleva no céu, e as sombras encurtam. Se eu quiser competir na [activity.GetCurrentPhase.GetPhase.GetName], devo garantir que vou me qualificar. Em breve começará."
