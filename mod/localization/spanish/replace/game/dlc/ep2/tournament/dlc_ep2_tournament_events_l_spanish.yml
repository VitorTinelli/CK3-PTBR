 tournament_events.1100.c:0 "Preciso ver esse [pas_darmes_instigator.GetWomanMan]!"
 tournament_events.1100.d:0 "Essa tolice é proibida."
 tournament_events.1100.desc:0 "Inquieto enquanto espera pelo início dos torneios, ou simplesmente ansioso para exibir suas habilidades, meu [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_instigator)], [pas_darmes_instigator.GetFullName], proclamou uma 'passagem de armas' nos arredores de [activity.GetCurrentPhase.GetLocation.GetName].\n\n\"#EMP Se algum [pas_darmes_instigator.Custom('MountedWarriorTerm')] capaz quiser passar, que enfrente-me ou seja desonrado!#!\"\n\nDizem que [pas_darmes_instigator.GetSheHe] guarda as esporas de todas as suas derrotas, e qualquer dama que deseje passar desacompanhada deve deixar um símbolo que será recuperado mais tarde em seu nome."
 tournament_events.1100.t:0 "Passagem de Armas"
 tournament_events.1101.a:0 "Ótimo, nossos lutadores devem estar preparados."
 tournament_events.1101.b:0 "Acho que não, expulse esse andarilho."
 tournament_events.1101.c:0 "Isso é um verdadeiro $knight_culture_player_no_tooltip_lowercase$! Uma verdadeira inspiração!"
 tournament_events.1101.desc:0 "Sem dúvida atraído para meu torneio pela promessa de glória e abundância de adversários, um [pas_darmes_instigator.Custom('MountedWarriorTerm')] estrangeiro declarou uma 'passagem de armas' perto de [activity.GetCurrentPhase.GetLocation.GetName].\n\n[pas_darmes_instigator.GetSheHe|U] chama [pas_darmes_instigator.GetHerselfHimself] de '[pas_darmes_instigator.GetFullName]' e afirma ser das distantes terras [exotic_origin.GetDeJureLiege.GetAdjectiveNoTooltip]. Qualquer [ROOT.Char.Custom('MountedWarriorTerm')] que deseje passar pelo acampamento [pas_darmes_instigator.GetHerHim] deve enfrentá-lo com lanças, ou então perderá seu orgulho.\n\nSer tratado assim por um aventureiro estrangeiro certamente irritará a nobreza [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]."
 tournament_events.1101.t:0 "$tournament_events.1100.t$"
 tournament_events.1102.a.tt:0 "A passagem de armas em [activity.GetCurrentPhase.GetLocation.GetName] continuará"
 tournament_events.1102.a:0 "Boa sorte para eles."
 tournament_events.1102.b:0 "Não na #EMP minha#! [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 tournament_events.1102.desc:0 "Ansioso para provar [pas_darmes_instigator.GetHerselfHimself], meu [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_instigator)], [pas_darmes_instigator.GetFullName], declarou uma 'passagem de armas', bloqueando a rota principal para [activity.GetCurrentPhase.GetLocation.GetName].\n\n[pas_darmes_instigator.GetSheHe|U] está acompanhado por meu [ROOT.Char.Custom2('RelationToMeShort', pas_darmes_2)], [pas_darmes_2.GetFullName], e um grupo de nobres [pas_darmes_instigator.GetLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] menores com algo a provar.\n\nDizem que eles fizeram um juramento de quebrar trezentas lanças antes de considerar sua missão completa."
 tournament_events.1102.t:0 "$tournament_events.1100.t$"
 tournament_events.1120.a.dead:0 "Uma maneira honrosa de partir."
 tournament_events.1120.a:0 "Esses são os riscos de uma vida galante."
 tournament_events.1120.desc:0 "[pas_darmes_instigator.GetTitledFirstName], o chamativo [pas_darmes_instigator.Custom('MountedWarriorTerm')] que guarda sua passagem desafiando a todos, teve uma luta a mais do que poderia suportar.\n\nDizem que [pas_darmes_victim.GetTitledFirstName] infligiu a ele um ferimento terrível, abrindo caminho para que os nobres possam passar livremente novamente."
 tournament_events.1120.t:0 "Difícil Conquistar"
 tournament_events.1130.a:0 "Algo deve ser feito."
 tournament_events.1130.desc:0 "Enquanto viajava para [activity.GetCurrentPhase.GetLocation.GetName] com meus servos, [pas_darmes_instigator.GetFullName] interrompeu nossa companhia e exigiu descaradamente um objeto pessoal...\n\nNão tive escolha senão dar a [pas_darmes_instigator.GetHerHim] a maldita lembrança... [pas_darmes_instigator.GetSheHe|U] disse que se eu quisesse tê-la de volta, eu deveria enviar um desafiante pelo seu caminho."
 tournament_events.1130.opening:0 "[pas_darmes_victim.Custom2('AppropriateGreeting', ROOT.Char)]"
 tournament_events.1140.a.failure:0 "[pas_darmes_instigator.GetNameNoTooltip] supera você"
 tournament_events.1140.a.success:0 "Você derrota [pas_darmes_instigator.GetNameNoTooltip]"
 tournament_events.1140.a.wounded:0 "Nem você vencerá este."
 tournament_events.1140.a:0 "Deixe-me mostrar como um #EMP [ROOT.Char.GetTitleAsNameNoTooltip|l]#! se inclina."
 tournament_events.1140.b.failure:0 "[pas_darmes_instigator.GetNameNoTooltip] recusa sua oferta"
 tournament_events.1140.b.success:0 "Você convence [pas_darmes_instigator.GetNameNoTooltip]"
 tournament_events.1140.b:0 "Você é um guerreiro poderoso, eu poderia usar você."
 tournament_events.1140.c:0 "Acho que já chega."
 tournament_events.1140.d:0 "Continue assim!"
 tournament_events.1140.desc:0 "Enquanto aprecio o ar montado em meu cavalo, admirando o movimento agitado de [activity.GetCurrentPhase.GetLocation.GetName], avisto aquele famoso lutador, '[pas_darmes_instigator.GetFullName]', defendendo o acampamento da sua 'passagem de armas'.\n\n"
 tournament_events.1140.fallback:0 "[pas_darmes_instigator.GetSheHe|U] se levanta quando me vê, ansioso por outra luta, mas rapidamente percebe quem sou eu. Com um sorriso, [pas_darmes_instigator.GetFirstNameNoTooltip] se inclina e diz: 'Bem encontrado, [ROOT.Char.Custom('FormOfAddressForLiege')] de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip].'"
 tournament_events.1140.skilled:0 "Algum insignificante desafiante se afasta ao longo da estrada enquanto o [pas_darmes_instigator.Custom('MountedWarriorTerm')] retorna contente ao seu posto, admirando as espuelas que acabou de coletar.\n\n"
 tournament_events.1140.t:0 "O Orgulho de um [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 tournament_events.1140.unskilled:0 "Um [pas_darmes_instigator.Custom('MountedWarriorTerm')] muito satisfeito passa por mim, prestando seus respeitos, enquanto [pas_darmes_instigator.GetFirstNameNoTooltip] observa de seu assento, claramente sentindo a dor de uma derrota.\n\n"
 tournament_events.1140.wounded:0 "Machucado e contundido, [pas_darmes_instigator.GetSheHe] faz uma careta de dor quando me aproximo. 'Não se pode vencer todas', [pas_darmes_instigator.GetSheHe] ri, olhando para cima para mim."
 tournament_events.1141.a.death:0 "#weak gorgolejo#!"
 tournament_events.1141.a:0 "'É apenas um arranhão..."
 tournament_events.1141.b.death:0 "[pas_darmes_instigator.GetFirstNameNoTooltip]? #EMP [pas_darmes_instigator.GetFirstNameNoTooltip]?!#!"
 tournament_events.1141.b:0 "Eu disse que mostraria para você!"
 tournament_events.1141.beat_me:0 "\n\n[pas_darmes_instigator.GetSheHe|U] me ergue, removendo lascas de minha armadura. 'Você lutou bem, mas perdeu.' [pas_darmes_instigator.GetSheHe|U] sorri, estendendo a mão."
 tournament_events.1141.beat_them:0 "\n\nRapidamente volto, ajudando [pas_darmes_instigator.GetHerHim] a se levantar e verificando ferimentos. 'Vou ficar bem', [pas_darmes_instigator.GetSheHe] rosna, 'Aqui estão minhas espuelas.'"
 tournament_events.1141.desc:0 "Um grupo de espectadores se reúne enquanto [pas_darmes_instigator.GetFirstName] e eu montamos nossos cavalos, assumindo nossas posições. Sem hesitar, [pas_darmes_instigator.GetSheHe] avança repentinamente, abaixando sua lança, em uma nuvem de poeira e cascos trovejantes!\n\nEu avanço, concentrando toda a minha atenção na ponta da lança que se aproxima [pas_darmes_instigator.GetHerHim]."
 tournament_events.1141.kill_me:0 "\n\nMeu rosto fica subitamente quente e molhado. Tento falar, mas mal consigo manter os olhos abertos. A expressão preocupada de [pas_darmes_instigator.GetFirstNamePossessiveNoTooltip] aparece enquanto o mundo escurece..."
 tournament_events.1141.kill_them:0 "\n\nAo chegar ao fim da corrida, viro meu cavalo sorrindo, procurando [pas_darmes_sinstigator.GetFirstNameNoTooltip]. Avisto sua forma encolhida de bruços na poeira, o cavalo cheirando o pé [pas_darmes_instigator.GetHerHim]."
 tournament_events.1141.lose:0 "\n\nSinto a lança de [pas_darmes_instigator.GetHerHim] se despedaçar contra meu escudo com um estrondo poderoso, fazendo-me oscilar na sela enquanto [pas_darmes_instigator.GetSheHe] passa voando."
 tournament_events.1141.t:0 "$tournament_events.1140.t$"
 tournament_events.1141.win:0 "\n\nMinha lança se despedaça contra o escudo de [pas_darmes_instigator.GetHerHim] com um estrondo poderoso, fazendo [pas_darmes_instigator.GetHerHim] oscilar na sela enquanto eu passo voando."
 tournament_events.1150.a.failure:0 "[pas_darmes_instigator.GetTitledFirstNameNoTooltip] supera você"
 tournament_events.1150.a.success:0 "Você vence [pas_darmes_instigator.GetTitledFirstNameNoTooltip]"
 tournament_events.1150.a.wounded:0 "Vou te dar mais uma ferida: uma para lembrar #EMP de mim#!."
 tournament_events.1150.a:0 "Venha, vamos lutar."
 tournament_events.1150.b:0 "Fique com seu retalho de tecido, bom [pas_darmes_instigator.Custom('MountedWarriorTerm')]."
 tournament_events.1150.desc:0 "[pas_darmes_instigator.GetTitledFirstName] senta-se à beira de uma estrada, afiando sua lâmina, enquanto eu me aproximo de seu acampamento modesto.\n\n\"Ah, eu estava me perguntando quando você mostraria sua cara, bom [ROOT.Char.GetTitleAsNameNoTooltip].\" [pas_darmes_instigator.GetSheHe] sorri, tirando uma peça de roupa de seu cinto. \"Veio para recuperar isso, suponho?\"\n\n"
 tournament_events.1150.fallback:0 "Minha honra foi colocada em jogo por um mero [ROOT.Char.Custom('MountedWarriorTerm')]..."
 tournament_events.1150.skilled:0 "Estou bem ciente da reputação marcial desta [pas_darmes_instigator.GetWomanMan], mas o ego dela será sua queda."
 tournament_events.1150.t:0 "$tournament_header$ Restaurando a Honra"
 tournament_events.1150.unskilled:0 "É bem sabido que este [pas_darmes_instigator.GetWomanMan] tem mais bravata do que habilidade, mas eu não devo subestimá-lo."
 tournament_events.1150.wounded:0 "De qualquer forma, as feridas [pas_darmes_instigator.GetHerHim] certamente me darão uma vantagem..."
 tournament_events.1200.a.failure:0 "Você não pode mudar a opinião de [angry_clergy.GetTitledFirstNamePossessiveNoTooltip]"
 tournament_events.1200.a.success:0 "[angry_clergy.GetTitledFirstNameNoTooltip] está convencido"
 tournament_events.1200.a:0 "Eles não podem defender os [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] sem um pouco de prática!"
 tournament_events.1200.b.failure:0 "[angry_clergy.GetTitledFirstNameNoTooltip] está desdenhoso"
 tournament_events.1200.b.success:0 "[angry_clergy.GetTitledFirstNameNoTooltip] se convence"
 tournament_events.1200.b:0 "Do meu ponto de vista, você verá as virtudes da competição."
 tournament_events.1200.c:0 "Um bom ponto, eu não vou competir."
 tournament_events.1200.d:0 "Oh, pare com isso, [angry_clergy.GetFaith.PriestNeuter], deixe-os se divertirem."
 tournament_events.1200.desc:0 "Enquanto nobres e plebeus se preparam com entusiasmo para os torneios e entretenimento que virão, [angry_clergy.GetTitledFirstName] manifesta sua desaprovação dos [angry_clergy.GetFaith.AltPriestTermPlural].\n\n\"Este torneio é um veículo do pecado; bons [angry_clergy.GetFaith.GetAdherentNamePluralNoTooltip] morrerão em busca de orgulho; derramarão sangue uns dos outros por bugigangas; renunciarão ao [angry_clergy.GetFaith.PositiveAfterLife] pela fama.\"\n\n\"Essas inclinações devem ser direcionadas, voltadas contra os inimigos de [angry_clergy.GetFaith.HighGodNamePossessive], não alimentadas e apagadas na vaidade gloriosa.\""
 tournament_events.1200.t:0 "Repreensão Religiosa"
 tournament_events.1230.a:0 "Não, você será meu campeão/campeã!"
 tournament_events.1230.b.tt:0 "Torna-se um [battle_peasant.Custom('KnightCulture')]"
 tournament_events.1230.b:0 "Seu destino mudou, [battle_peasant.Custom('MountedWarriorTerm')]."
 tournament_events.1230.c.tt:0 "Junta-se ao seu [activity.GetShortName]"
 tournament_events.1230.c:0 "Eu preciso ver você competir! Serei [Select_CString( ROOT.Char.IsFemale, 'sua patrocinadora', 'seu patrocinador' )]."
 tournament_events.1230.d.tt:0 "[battle_peasant.GetName] desaparece"
 tournament_events.1230.d:0 "Ah, um[Select_CString( battle_peasant.IsFemale, 'a', '' )] #EMP [Select_CString( battle_peasant.IsFemale, 'camponesa', 'camponês' )]?!#! Que vergonha..."
 tournament_events.1230.desc:0 "Enquanto percorro os terrenos do torneio, absorvendo a atmosfera e debatendo as várias técnicas dos concorrentes em treinamento, um(a) determinado(a) [battle_peasant.GetWomanMan] chama minha atenção.\n\nCada movimento dele(a) é cheio de graça, eficiência e equilíbrio, superando rapidamente a palha de enchimento e os parceiros de treino.\n\nQuando chamo por ele(a) para revelar de qual casa nobre ele(a) descende, seus olhos se arregalam, antes de baixarem para o chão. \"[Select_CString( ROOT.Char.IsFemale, 'M-minha', 'M-meu' )] [ROOT.Char.GetLadyLord]! Eu sou apenas um(a) camponês(a), nada mais.\" ele(a) balbucia, fazendo uma reverência profunda."
 tournament_events.1230.t:0 "Da Pobreza ao Nobreza"
 tournament_events.1240.a:0 "Decidi que [prize_child_1.GetFirstNameNoTooltip] se casará com o vencedor."
 tournament_events.1240.b:0 "[prize_child_2.GetFirstNameNoTooltip] é mais adequad[Select_CString( prize_child_2.IsFemale, 'a', 'o' )]."
 tournament_events.1240.betrothal_tt:0 "Se válido, o vencedor será noivado com [marriage_prize.GetTitledFirstName]"
 tournament_events.1240.c:0 "Deveria ser [prize_child_3.GetFirstNameNoTooltip]."
 tournament_events.1240.d:0 "Não é assim que fazemos as coisas."
 tournament_events.1240.desc:0 "Refletindo sobre os possíveis prêmios que posso oferecer ao vencedor da competição de [activity.GetCurrentPhase.GetPhase.GetName], a mão de [prize_child_1.GetFirstName], meu(a) [ROOT.Char.Custom2('RelationToMe', prize_child_1)] solteiro(a), vem à mente.\n\nMas... se um(a) plebeu(a) ganhasse..."
 tournament_events.1240.marry_tt:0 "Se válido, o vencedor se casará com [marriage_prize.GetTitledFirstName]"
 tournament_events.1240.t:0 "$tournament_header$ Ao Vencedor"
 tournament_events.1250.a:0 "Eu darei a [favor_recipient_1.GetFirstNameNoTooltip]."
 tournament_events.1250.b:0 "[favor_recipient_2.GetFirstNameNoTooltip] é dign[Select_CString( favor_recipient_2.IsFemale, 'a', 'o' )]."
 tournament_events.1250.c:0 "Será entregue a [favor_recipient_3.GetFirstNameNoTooltip]."
 tournament_events.1250.d:0 "Não há nenhum digno do meu favor..."
 tournament_events.1250.desc:0 "É costume elevar os ânimos [Select_CString( favor_recipient_1.IsFemale, 'da sua amada', 'do seu amado' )] com um símbolo de favor, uma pequena lembrança que eles usarão durante o torneio para todos verem.\n\nA única questão é qual concorrente mais merece o meu afeto..."
 tournament_events.1250.favor_tt:0 "[favor_recipient.GetUIName] recebe o seu favor"
 tournament_events.1250.t:0 "$tournament_header$ Símbolo de Favor"
 tournament_events.1251.a.consort:0 "Oh, que emocionante."
 tournament_events.1251.a.lover:0 "Você é demais, meu amor."
 tournament_events.1251.a.spouse:0 "Obrigado, meu querido."
 tournament_events.1251.a:0 "Eu o usarei com orgulho, [Select_CString( favor_giver.IsFemale, 'minha', 'meu' )] [favor_giver.GetLadyLord]."
 tournament_events.1251.b:0 "Tire essa coisa de mim."
 tournament_events.1251.discrete:0 "Em um momento de relativa calma, longe dos principais terrenos do torneio, me encontro sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com [Select_CString( favor_giver.IsFemale, 'a', 'o' )] m[Select_CString( favor_giver.IsFemale, 'inha', 'eu' )] [favor_recipient.Custom2('RelationToMe', favor_giver)], [favor_giver.GetTitledFirstName], cujo olhar travesso é difícil de resistir.\n\n"
 tournament_events.1251.favor_tt:0 "Cada símbolo de favor equipado aumenta ligeiramente a chance de ganhar [contests|E]"
 tournament_events.1251.many:0 "Por [favor_recipient.GetFaith.HouseholdGodName], estou perdendo a conta do número de favores que recebi - se eles apenas soubessem uns dos outros..."
 tournament_events.1251.one:0 "[favor_giver.GetSheHe|U] amarra um símbolo no meu braço, sorrindo, \"Use isso quando competir, trará boa sorte!\""
 tournament_events.1251.open:0 "Parad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] nos terrenos, observando os treinos e preparativos, ouço uma voz melodiosa atrás de mim. \"[ROOT.Char.GetTitledFirstName]!\" M[Select_CString( favor_giver.IsFemale, 'inha', 'eu' )] [favor_recipient.Custom2('RelationToMe', favor_giver)], [favor_giver.GetTitledFirstName], se aproxima apressadamente, segurando uma peça de roupa.\n\n"
 tournament_events.1251.t:0 "$tournament_events.1250.t$"
 tournament_events.1251.two:0 "Este é o segundo favor que me foi oferecido! O que farei com todos esses pedaços de tecido."
 tournament_events.1252.a.tt:0 "Você confronta [favor_giver.GetFirstNameNoTooltip] sobre o favor"
 tournament_events.1252.a:0 "Eu preciso saber!"
 tournament_events.1252.b:0 "Não... absurdo..."
 tournament_events.1252.desc:0 "Desde que avistei o favor de um(a) admirador(a) amarrado no braço de [favor_recipient.GetTitledFirstNamePossessive] ontem, tenho quebrado a cabeça tentando descobrir por que ele parece tão familiar...\n\nQuando [Select_CString( favor_giver.IsFemale, 'minha', 'meu' )] [favor_giver.Custom2('RelationToMe', favor_giver)], [favor_giver.GetTitledFirstName], me cumprimentou esta manhã, de repente percebi - acho que pertence a [favor_giver.GetHerHim]!"
 tournament_events.1252.t:0 "Um Favor Familiar"
 tournament_events.1253.a:0 "#weak ...sim.#!"
 tournament_events.1253.b:0 "O quê? Não seja ridículo!"
 tournament_events.1253.desc:0 "[favor_investigator.GetTitledFirstName] irrompe em meus aposentos. Vasculhando o cômodo com o olhar inquieto, seu olhar finalmente se fixa em mim.\n\n\"Diga-me a verdade, o favor que pendura do braço de [favor_recipient.GetTitledFirstNamePossessive] pertence a você?\""
 tournament_events.1253.t:0 "$tournament_events.1252.t$"
 tournament_events.1254.a:0 "I-isto é verdade?"
 tournament_events.1254.b:0 "#EMP É VERDADE?!#!"
 tournament_events.1254.desc:0 "[favor_giver.GetFirstName] se afasta durante minha enxurrada de perguntas, apoiando-se na mesa fracamente.\n\nPor fim, [favor_recipient.GetSheHe] se vira lentamente e quebra o silêncio delicadamente: \"É verdade - é o meu favor que [favor_recipient.GetTitledFirstName] está usando...\""
 tournament_events.1254.t:0 "$tournament_events.1252.t$"
 tournament_events.1255.a.tt:0 "\"Somente o tempo dirá...\""
 tournament_events.1255.a:0 "O que mais posso fazer?"
 tournament_events.1255.desc:0 "[favor_giver.GetTitledFirstName] nega qualquer envolvimento com [favor_recipient.GetTitledFirstName] e está claramente exasperado com a acusação. \"Eu mal conheço o(a) [favor_recipient.GetWomanMan]!\"\n\nSeja o que [favor_giver.GetSheHe] diz, as sementes da dúvida já estão plantadas..."
 tournament_events.1255.t:0 "$tournament_events.1252.t$"
 tournament_events.1260.a:0 "Isso basta! Isso não é algum acampamento de bandidos!"
 tournament_events.1260.b:0 "Vamos, não envergonhem o seu anfitrião."
 tournament_events.1260.c:0 "Fora! Removam esses encrenqueiros!"
 tournament_events.1260.d:0 "Derrube [second_duelist.GetHerHim], [preferred_duelist.GetFirstNameNoTooltip]!"
 tournament_events.1260.desc:0 "Com inúmeros lordes e [ROOT.Char.Custom('MountedWarriorTermPlural')] reunidos em um só lugar, brigas constantes não são surpresa, já que disputas antigas reacendem e a vaidade alimenta o atrito.\n\n"
 tournament_events.1260.duel_toast:0 "[duel_winner.GetTitledFirstName] venceu o duelo"
 tournament_events.1260.duel_tt:0 "O duelo prossegue, ferindo [duelist_1.GetFirstName] ou [duelist_2.GetFirstName]"
 tournament_events.1260.fallback:0 "\"Escute aqui, s[Select_CString( duelist_2.IsFemale, 'ua', 'eu' )] [duelist_2.Custom2('InsultNoun', SCOPE.sC('duelist_1'))] escorregadi[Select_CString( duelist_2.IsFemale, 'a', 'o' )]!\", [duelist_1.GetFirstName] rosna, enquanto [duelist_2.GetFirstNameNoTooltip] aperta ameaçadoramente o cabo de sua espada.\n\nGeralmente, essas demonstrações de bravata terminam com um olho roxo no máximo, mas essa temível briga ameaça manchar todo o evento. Ninguém pode dizer o que começou isso."
 tournament_events.1260.peace_toast:0 "Os duelistas recuam"
 tournament_events.1260.rival:0 "\"Escute aqui, s[Select_CString( duelist_2.IsFemale, 'ua', 'eu' )] [duelist_2.Custom2('InsultNoun', SCOPE.sC('duelist_1'))] escorregadi[Select_CString( duelist_2.IsFemale, 'a', 'o' )]!\", [duelist_1.GetFirstName] rosna, enquanto [duelist_2.GetTitledFirstName] aperta ameaçadoramente o cabo de seu(a) [duelist_2.Custom('SignatureWeaponNameOrType')]. Ninguém tem certeza do que começou isso.\n\nGeralmente, essas demonstrações de bravata terminam com um olho roxo no máximo, mas a temível briga entre [duelist_1.GetTitledFirstNamePossessive] e [duelist_2.GetTitledFirstName] ameaça manchar todo o evento."
 tournament_events.1260.t:0 "Mantendo a Paz"
 tournament_events.1270.a:0 "Três vivas para o Campeão!"
 tournament_events.1270.b:0 "Parabéns [congratulate_winner.GetFirstNameNoTooltip], muito merecido!"
 tournament_events.1270.c:0 "Ah [congratulate_winner.GetFirstNameNoTooltip], a fortuna certamente age de maneira misteriosa..."
 tournament_events.1270.d:0 "Acabei de me lembrar que preciso estar em outro lugar."
 tournament_events.1270.desc:0 "\n\nA cortesia exige que eu reconheça [congratulate_winner.GetHerHim] quando passo - uma chance de fazer uma declaração pública diante dos convidados reunidos..."
 tournament_events.1270.matcher:0 "Vejo [congratulate_winner.GetTitledFirstName] no grande pavilhão, sem dúvida se gabando de ter me derrotado em nosso confronto."
 tournament_events.1270.nickname_toast:0 "O nome permanece"
 tournament_events.1270.t:0 "$tournament_header$ Bom Esportista"
 tournament_events.1270.winner:0 "Vejo [congratulate_winner.GetTitledFirstName] rodeado(a) por admiradores no grande pavilhão, sem dúvida se gabando de sua vitória no concurso de [congratulate_winner.Custom('GetRandomWonContest')|l] e do prêmio que [congratulate_winner.GetSheHe] conquistou."
 tournament_events.1280.a:0 "Execute esses chamados 'construtores #EMP#!'!"
 tournament_events.1280.b:0 "Devemos olhar para os enlutados."
 tournament_events.1280.c:0 "Às vezes, a calamidade não pode ser evitada..."
 tournament_events.1280.desc:0 "Riachos de plebeus e nobres se aglomeram nos terrenos do concurso, lutando para garantir uma boa visão da [activity.GetCurrentPhase.GetPhase.GetName].\n\nUm gemido horrível perfura o burburinho animado - uma arquibancada sobrecarregada de espectadores cede com um #EMP estrondo#!! Sua massa de vítimas gritantes é lançada para fora da vista.\n\nEnquanto as recriminações voam, meu [ROOT.Char.Custom2('RelationToMeShort', intercessor)] [intercessor.GetName] desencoraja veementemente punir os construtores da arquibancada: \"Isso foi um ato do [intercessor.GetFaith.HighGodName], nada mais!\""
 tournament_events.1280.t:0 "$tournament_header$ Padrões Descuidados"
 tournament_events.1290.a:0 "Os escudeiros devem pagar por sua diversão."
 tournament_events.1290.b:0 "Eu vou cobrir os reparos."
 tournament_events.1290.c:0 "Receio que seja apenas uma dessas coisas..."
 tournament_events.1290.desc:0 "Acordado(a) cedo pelo alarme, agora observo os moradores desesperados dirigindo baldes de água para os prédios em chamas de [fire_holding.GetBaronyNameExplicitly], enquanto [fire_holder.GetTitledFirstName] explica com raiva.\n\n\"Um grupo de escudeiros bêbados de [ROOT.Char.Custom('RegionalAlcoholicDrink')] e instigados pelos concursos incendiaram uma barraca de comerciante após uma discussão...\" [fire_holder.GetSheHe] rosna. \"Isso levará meses para reconstruir!\"\n\nNão é assim que quero que meu torneio seja lembrado..."
 tournament_events.1290.t:0 "Vândalos Incontroláveis"
 tournament_events.1300.a:0 "Esplêndido! Continuem assim!"
 tournament_events.1300.b.failure:0 "[young_knight.GetFirstNameNoTooltip] perde #color_white 5#! pontos de experiência em $game_concept_trait_level_track$ $game_concept_trait_level_track_xp$"
 tournament_events.1300.b.success:0 "[young_knight.GetFirstNameNoTooltip] ganha #color_white 10#! pontos de experiência em $game_concept_trait_level_track$ $game_concept_trait_level_track_xp$"
 tournament_events.1300.b:0 "Talvez eu deva assumir isso, na verdade."
 tournament_events.1300.c:0 "Você se importaria de me ensinar também?"
 tournament_events.1300.desc:0 "\"Não, ainda não. Mova o pé um pouco para trás para equilibrar e balanceie #EMP através#! do alvo e... sim! Perfeito! Muito bem, [young_knight.Custom('GetLassLad')]!\"\n\nDiante de mim, o veterano grisalho [old_knight.GetFirstName] está treinando [young_knight.GetFirstName], claramente transmitindo conhecimento adquirido de um [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] para outro. [old_knight.GetFirstNameNoTooltip] me nota quando me aproximo.\n\n\"Bom dia, meu [ROOT.Char.GetTitleAsNameNoTooltip]! Estou ajudando [young_knight.GetFirstNameNoTooltip] a aperfeiçoar suas posturas. Você já tem um jovem guerreiro talentoso em suas mãos!\" [young_knight.GetFirstNameNoTooltip] tenta e falha em esconder um sorriso envergonhado, mas satisfeito, pelo elogio de seu mentor."
 tournament_events.1300.t:0 "$tournament_header$ Sob a Asa [old_knight.GetHerHim|U]"
 tournament_events.1310.a:0 "Que prazer tê-lo(a) aqui, [famous_knight.GetFirstNameNoTooltip]!"
 tournament_events.1310.b.critsuccess:0 "[famous_knight.GetFirstNameNoTooltip] ensina algumas técnicas a você"
 tournament_events.1310.b.failure:0 "Você não compreende os ensinamentos de [famous_knight.GetFirstNamePossessiveNoTooltip]"
 tournament_events.1310.b.success:0 "Você obtém algumas dicas"
 tournament_events.1310.b:0 "Talvez eles possam me ensinar uma coisa ou duas?"
 tournament_events.1310.c:0 "Desculpe, quem?"
 tournament_events.1310.desc:0 "Uma fanfarra gloriosa rasga o ar. Passando por mim, um heraldo montado a cavalo desenrola um pergaminho.\n\n\"Ouçam, ouçam! Neste dia magnífico, somos abençoados com a presença de um verdadeiro virtuoso. [famous_knight.GetSheHe|U] derrotou todos os adversários da Irlanda a Cathay! É minha honra e privilégio apresentar o mais habilidoso, o mais esplêndido, o melhor do mundo: [famous_knight.GetTitledFirstName]!\"\n\nUma figura passa rapidamente pelo heraldo, freando seu cavalo até parar, um raio de sol rompendo e iluminando [famous_knight.GetHerHim] como um halo, o rugido da multidão quase fazendo o chão tremer."
 tournament_events.1310.t:0 "Um Hóspede Glorioso"
 tournament_events.1311.a:0 "[forgotten_knight.GetFirstNameNoTooltip]! Posso arranjar outro arauto para você?"
 tournament_events.1311.b.tt:0 "Todos os participantes [GetTrait('compassionate').GetName( GetNullCharacter )] ganham #color_green +25#! de opinião sobre você"
 tournament_events.1311.b:0 "Esse mensageiro provavelmente precisará de um novo emprego..."
 tournament_events.1311.c:0 "Hah! Eles esqueceram o #EMP nome [forgotten_knight.GetHerHim]!#!"
 tournament_events.1311.desc:0 "\"Atenção, todos os que vagam por aqui!\" A voz de um arauto corta a multidão que circula pelo torneio, e mais de um olha na direção do barulho.\n\n\"Saibam que adentrando o campo agora é... é...\" O arauto solta um leve suspiro, procurando na multidão um nome que claramente havia sido esquecido.\n\n\"É... minha boa senhora - quer dizer, meu bom #EMP senhor#! - er...\" As mãos do arauto se contraem e relaxam espasmodicamente, o pânico por ter esquecido o nome do [forgotten_knight.Custom('KnightCultureNoTooltipLowercase')] que estava sendo apresentado é claro como o dia. O tal [forgotten_knight.Custom('KnightCultureNoTooltipLowercase')], [forgotten_knight.GetTitledFirstName], se aproxima do arauto trêmulo com um rosto enfurecido."
 tournament_events.1311.t:0 "Confusão"
 tournament_events.1312.a.failure:0 "[foreign_knight.GetFirstNameNoTooltip] recusa a oferta"
 tournament_events.1312.a.success:0 "[foreign_knight.GetFirstNameNoTooltip] concorda em se juntar a você"
 tournament_events.1312.a:0 "Gostaria de ter um novo senhor feudal?"
 tournament_events.1312.b:0 "Que personagem fascinante!"
 tournament_events.1312.c:0 "[foreign_knight.GetSheHe|U] é apenas estrangeiro, e daí?"
 tournament_events.1312.desc:0 "Oohs e aahs, seguidos de aplausos, chamam minha atenção enquanto passo por uma pequena multidão. Interessado(a), abro caminho entre eles.\n\nNo centro deles está uma [foreign_knight.GetWomanMan], espada meio desembainhada de sua bainha, exibindo a empunhadura incomum da arma para os plebeus maravilhados. É claro que [foreign_knight.GetSheHe] não é destas partes: Seu sotaque é suave e estrangeiro. Quando [foreign_knight.GetSheHe] me vê, [foreign_knight.GetSheHe] curva respeitosamente a cabeça, antes de se voltar para a multidão.\n\n\"Agora, que tal eu mostrar a todos vocês um truque com a espada da minha terra?\" A multidão aplaude novamente, de forma animada."
 tournament_events.1312.t:0 "Toque Estrangeiro"
 tournament_events.1320.a:0 "Vou cuidar disso para você."
 tournament_events.1320.b:0 "Eu não quero nada disso!"
 tournament_events.1320.desc:0 "Estou voltando do banheiro, seguindo entre duas tendas, quando uma mão é firmemente colocada sobre minha boca por trás.\n\n\"Silêncio quando eu te deixar falar. Você consegue fazer isso?\" Minha concordância abafada satisfaz a voz, e eu me viro rapidamente para encontrar um estranho vestido de forma incomum. Um pequeno objeto é imediatamente pressionado em minha mão.\n\n\"Eu preciso que você cuide disso. É de grande importância para mim. Eu voltarei buscá-lo. Se eu não voltar...\" Um sorriso estranhamente cansado passa rapidamente pela boca do estranho. \"...então considere como meu presente para você.\n\nOlho para baixo. Aninhada em minha palma está uma moeda dourada, mas curiosamente #EMP vermelha#!. Ela está lá opaca, um pouco quente ao toque."
 tournament_events.1320.t:0 "A Moeda Vermelha"
 tournament_events.1321.a:0 "Venha à minha corte. Eu poderia usar seus talentos."
 tournament_events.1321.b:0 "Um prazer fazer negócios, meu amigo."
 tournament_events.1321.c.tt:0 "Isso parece arriscado..."
 tournament_events.1321.c:0 "Hmm. Acho que não."
 tournament_events.1321.desc:0 "Olhando por cima da minha taça enquanto me refresco entre as competições, vejo uma figura encapuzada, porém estranhamente familiar, se aproximar de mim.\n\n\"Acredito que você tenha algo que me pertence.\" A pessoa se aproxima da luz como se não estivesse acostumada com o brilho. \"A moeda, [ROOT.Char.Custom('FormOfAddressForLiege')]. Você ainda a tem, não é?\n\nTirando-a do meu bolso, o metal brilha à luz do sol. Parece quase mais vermelho do que antes, um rico tom de granada. A figura sorri debaixo do capuz.\n\n\"Meus agradecimentos mais profundos, do fundo do meu coração. Por favor, pelos seus problemas.\" Eles estendem a mão para receber, mas apresentam uma bolsa cheia de ouro na outra."
 tournament_events.1321.t:0 "Moeda Emprestada"
 tournament_events.1322.a:0 "Eu... tenho certeza de que ficará tudo bem."
 tournament_events.1322.desc:0 "A pura raiva que atravessa o rosto do estranho me surpreende e faz com que meus guardas deem um passo à frente, empunhando suas armas. O lábio do estranho se curva ao abaixar o capuz, com desgosto e deboche.\n\n\"Você pode ver o meu rosto.\" [unusual_stranger.GetSheHe|U] diz. \"Eu também vou lhe dizer meu nome. Meu desejo mais profundo agora é que você fique acordado à noite pensando em como [unusual_stranger.GetFirstName] vai se vingar justamente de você. Pode ser daqui a anos, mas eu nunca esqueço, e espero agora que você também nunca esqueça.\"\n\n\"Lembre-se disso: #EMP haverá um acerto de contas.#!\" [unusual_stranger.GetSheHe|U] levanta seu capuz novamente, apertando seu manto ao redor do seu corpo, antes de se dissolver na multidão."
 tournament_events.1322.t:0 "Vale o Risco?"
 tournament_events.1330.a:0 "Você precisa entender. Você é preciosíssim[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] demais para correr riscos."
 tournament_events.1330.b:0 "Que privilégio ter um[Select_CString( heir.IsFemale, 'a', '' )] [heir.Custom('GetDaughterSon')] assim!"
 tournament_events.1330.c:0 "Eu proíbo isso! Vá e renuncie agora mesmo!"
 tournament_events.1330.d:0 "...não conte para [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [spouse.GetMotherFather]."
 tournament_events.1330.desc:0 "\"Boa sorte, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" Eu agradeço o grito de um membro da multidão com um aceno de gratidão. \"E boa sorte para você também, [heir.GetFirstName]!\"\n\n\"O que eles queriam dizer com isso?\" Pergunto a [heir.GetFirstNameNoTooltip], caminhando ao lado dele. \"Por que eles precisariam lhe desejar sorte?\" O olhar nervoso [heir.GetHerHim|U] rapidamente deu a resposta para essa pergunta.\n\n\"Eu... eu quero competir!\" [heir.GetSheHe|U] insiste. \"Você está participando, por que eu não posso?\" Eu paro de repente, [heir.GetFirstNameNoTooltip] parando ao meu lado incerto, sua bravata desmoronando um pouco diante da minha reação."
 tournament_events.1330.t:0 "A Próxima Geração"
 tournament_events.1331.a:0 "Intimidação não vai funcionar comigo, [dynast.GetFirstNameNoTooltip]."
 tournament_events.1331.b:0 "Claro. Tudo pela #EMP 'família'#!."
 tournament_events.1331.c:0 "Você quer reconsiderar suas palavras, [dynast.GetFirstNameNoTooltip]?"
 tournament_events.1331.d:0 "Eu não serei coagido(a) para o seu benefício!"
 tournament_events.1331.desc:0 "\"[ROOT.Char.GetFirstName]! A pessoa que eu estava querendo encontrar!\" [dynast.GetFirstName] se aproxima apressadamente de mim. \"Precisamos conversar. Veja bem, ouvi dizer que você está inscrito(a) para o próximo concurso e, bem...\"\n\nMeu olhar impassível claramente endurece a postura de [dynast.GetFirstNamePossessiveNoTooltip] em relação à situação. [dynast.GetSheHe|U] se ergue em toda a sua altura.\n\n"
 tournament_events.1331.e:0 "Eu irei desistir, se for preciso."
 tournament_events.1331.t:0 "Pela Família?"
 tournament_events.1332.a:0 "Certamente você é leal, não é?"
 tournament_events.1332.b:0 "Muito leal, você diz?"
 tournament_events.1332.c:0 "Meus bolsos estão um pouco vazios ultimamente..."
 tournament_events.1332.d:0 "Por você, [powerful_vassal.GetFirstNameNoTooltip]? Qualquer coisa."
 tournament_events.1332.desc:0 "Vejo [powerful_vassal.GetFirstName] se aproximando rapidamente de mim e fecho brevemente os olhos com desgosto. Quando os abro novamente, [powerful_vassal.GetSheHe] está bem na minha frente, me encarando com um sorriso forçado que mal disfarça um olhar ameaçador.\n\n\"[ROOT.Char.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')], como é #EMP maravilhoso#! te ver aqui e competindo!\" [powerful_vassal.GetSheHe|U] agarra meu braço e nos afasta um pouco da multidão para conspirar. \"Olhe. Eu preciso de um favor.\" A fachada [powerful_vassal.GetHerHim|U] quase se desfaz enquanto reviro os olhos.\n\n\"Eu quero me sair bem nesse concurso e, como um dos seus vassalos mais poderosos e #EMP leais#!, eu estava me perguntando se posso contar com a sua ajuda."
 tournament_events.1332.e:0 "Você terá que se virar sozinho(a)."
 tournament_events.1332.t:0 "Dar e Receber"
 tournament_events.1400.a.fight:0 "Uma briga pelo menos resolverá o problema de uma maneira ou de outra..."
 tournament_events.1400.a:0 "Eu farei você #EMP se ajoelhar#! para assistir!"
 tournament_events.1400.b.failure:0 "[tall_person.GetFirstNameNoTooltip] recusa"
 tournament_events.1400.b.success:0 "[tall_person.GetFirstNameNoTooltip] cede a contragosto"
 tournament_events.1400.b:0 "Com licença. Você poderia, por favor, #EMP se mover#!?"
 tournament_events.1400.c.failure:0 "[tall_person.GetFirstNameNoTooltip] recusa"
 tournament_events.1400.c.success:0 "[tall_person.GetFirstNameNoTooltip] se junta a você"
 tournament_events.1400.c:0 "Como você gostaria de lutar por mim?"
 tournament_events.1400.d:0 "Deixa pra lá."
 tournament_events.1400.desc:0 "Fazer parte de uma multidão em um evento esportivo pode ser um verdadeiro deleite. A atmosfera, o som e as visões. O único problema é que às vezes pode trazer tantos aspectos negativos quanto positivos.\n\nUm desses aspectos negativos acabou de se materializar, pois me vejo preso atrás da imensa figura de [tall_person.GetFirstName]. Eu me inclino para um lado e para o outro, mas o tamanho imponente [tall_person.GetHerHim] oculta a ação quase perfeitamente.\n\nSuspiro alto e bato o pé. [tall_person.GetFirstNameNoTooltip] não se mexe. Ovacionam enquanto algo grandioso e empolgante acontece. Minha irritação começa a aumentar."
 tournament_events.1400.t:0 "$tournament_header$ Pequenas Histórias"
 tournament_events.1401.a.failure:0 "[smol_person.GetFirstNameNoTooltip] passa despercebido(a)"
 tournament_events.1401.a.success:0 "Você os bloqueia com sucesso"
 tournament_events.1401.a:0 "Hah hah! Não."
 tournament_events.1401.b:0 "Tudo bem, pode passar."
 tournament_events.1401.desc:0 "Que dia incrível! Meu lugar bem na frente da multidão me dá uma visão incomparável da ação. Tudo está bem até sentir um leve puxão em minhas roupas. Olhando para o movimento, vejo uma figura, bem menor do que eu, tentando passar.\n\nAo perceber que estou olhando para [smol_person.GetHerHim], [smol_person.GetFirstName] se endireita e começa a implorar seu caso.\n\n\"Você é tão... #EMP grande#!!\" [smol_person.GetSheHe] tenta, gesticulando para as nossas estaturas contrastantes. \"Eu não consigo ver nada! Por favor, posso apenas ficar na sua frente?\""
 tournament_events.1401.t:0 "$tournament_header$ Contos Altos"
 tournament_events.1402.a:0 "Que tal eu comprar mais um para nós dois?"
 tournament_events.1402.b:0 "Guardas! Tirem ess[Select_CString( drinking_spectator.IsFemale, 'a', 'e' )] [drinking_spectator.Custom2('InsultNoun', ROOT.Char)] [drinking_spectator.Custom2('InsultAdjective', ROOT.Char)] da minha vista!"
 tournament_events.1402.c:0 "Você está cert[Select_CString( drinking_spectator.IsFemale, 'a', 'o' )]. Foi meu erro!"
 tournament_events.1402.desc:0 "A competição na minha frente está chegando a um clímax, os participantes igualmente equilibrados. Eu seguro a grade de madeira à minha frente e grito meu apreço junto com o resto da multidão. No entanto, esse grito rapidamente se transforma em um grito sufocado quando sinto algo escorrendo pela minha espinha. Algum tipo de líquido... algo tanto quente #EMP quanto#! frio, de alguma forma?\n\nGiro nos calcanhares e me deparo com [drinking_spectator.GetFirstName], seu cálice balançando com os restos da bebida não identificada que está escorrendo pelas minhas costas.\n\n\"Agora, preste atenção por onde anda!\" [drinking_spectator.GetSheHe] gorgoleja, apontando acusadoramente para mim com o copo. \"Você deveria ter mais cuidado!"
 tournament_events.1402.t:0 "$tournament_header$ Concessões Desperdiçadas"
 tournament_events.1403.a:0 "[realm_priest.GetFirstNameNoTooltip] está certo(a), seus reprovados!"
 tournament_events.1403.b:0 "Buuu! #EMP Buuuuuu!#!"
 tournament_events.1403.c:0 "Talvez eu deva deixar isso se resolver sozinho."
 tournament_events.1403.desc:0 "A multidão se inclina quando um competidor se prepara, mas a atmosfera é cortada abruptamente por uma voz estridente. [realm_priest.GetFirstName] irrompe no campo.\n\n\"Como #EMP você#! pode ficar aqui assistindo a essa ociosidade, essa #EMP sujeira# que desperdiça tempo?!\" [realm_priest.GetSheHe] ronca, virando-se de pessoa para pessoa, saliva voando de seus lábios enquanto [realm_priest.GetSheHe] as ataca. \"Você deveria gastar menos tempo aqui e mais tempo adorando!\"\n\nO mar de pessoas vacila um pouco, um lampejo de verdade sentido nas palavras, antes que algumas vozes corajosas e zangadas se pronunciem em resposta. A maré da opinião pública se volta ferozmente contra [realm_priest.GetFirstNameNoTooltip], mas [realm_priest.GetSheHe] mantém sua posição, proclamando seu sermão com estrondo."
 tournament_events.1403.t:0 "$tournament_header$ Multidão Dominada"
 tournament_events.1404.a:0 "\"Nenhum deles se compara à #EMP sua#! beleza.\""
 tournament_events.1404.b:0 "\"Hah! Você se sairia melhor do que qualquer um deles no campo de batalha do amor!\""
 tournament_events.1404.c:0 "\"#BOL Oh meu Deus, é aquele belo espécime [knight_1.GetFirstNameNoTooltip]?!#!\""
 tournament_events.1404.d:0 "\"#BOL Uau, só #EMP olhe#! para [knight_2.GetFirstNameNoTooltip]!#!\""
 tournament_events.1404.desc:0 "Enquanto me acomodo perto da frente da multidão com [ROOT.Char.Custom2('RelationToMeShort', gossip_friend)] [gossip_friend.GetFirstName], os competidores trotam pelo campo diante de nós. [gossip_friend.GetFirstNameNoTooltip] cutuca-me algumas vezes, indicando dois dos competidores com um gesto de cabeça nada discreto.\n\n\"O que você acha desses dois?\" [gossip_friend.GetSheHe] diz, abafando um risinho. \"Qual é a sua #EMP escolha#!?\" Pelas sobrancelhas excessivamente ativas [gossip_friend.GetHerHim], fica claro que [gossip_friend.GetSheHe] não está perguntando quem eu acho que vai vencer.\n\n\"Olha, olha, eles estão se aproximando! Diga algo! Alto o suficiente para eles ouvirem!\""
 tournament_events.1404.e:0 "\"#EMP Shh, shh!#! #DIE1 Já chega, [gossip_friend.GetFirstNameNoTooltip]!#!\""
 tournament_events.1404.t:0 "$tournament_header$ Pretendentes em Potencial"
 tournament_events.1405.a:0 "Informação útil para o futuro!"
 tournament_events.1405.b.tt:0 "Dê um sorriso e um piscar de olhos para [flirty_onlooker.GetFirstNameNoTooltip] em resposta."
 tournament_events.1405.b:0 "Ora, ora, ora..."
 tournament_events.1405.c:0 "Estou aqui para assistir, não para flertar!"
 tournament_events.1405.desc:0 "Meu olhar vagueia pela multidão. O burburinho geral flui ao meu redor, todos os espectadores envolvidos em conversas ou animando os competidores. Todos, exceto um, percebo.\n\n[flirty_onlooker.GetFirstName] está olhando diretamente para mim. Nossos olhares se encontram antes de [flirty_onlooker.GetSheHe] imediatamente desviar o olhar, desviando seus olhos para qualquer lugar que não seja eu. Normalmente, eu ficaria desconfiado, mas o lábio mordido e os olhares furtivos constantes para verificar se ainda estou observando contam uma história diferente neste caso."
 tournament_events.1405.t:0 "$tournament_header$ Um[Select_CString( flirty_onlooker.IsFemale, 'a', '' )] [flirty_onlooker.Custom('GetLassLad')|U] Sortud[Select_CString( flirty_onlooker.IsFemale, 'a', 'o' )]"
 tournament_events.1406.a:0 "\"Concentre-se nos seus estudos, criança.\""
 tournament_events.1406.b:0 "\"Vamos lá, suba nos meus ombros!\""
 tournament_events.1406.c:0 "\"Estou empolgado(a) também, [root_child.GetFirstNameNoTooltip]!\""
 tournament_events.1406.desc:0 "Abrindo caminho pela multidão, a cabeça da pequena [root_child.GetFirstName] vira constantemente, absorvendo todas as vistas e os sons. [root_child.GetSheHe|U] está vibrando de excitação, puxando minha mão e apontando para os participantes que passam apressados.\n\nEu a seguro gentilmente, mas [root_child.GetSheHe] continua puxando, simplesmente incapaz de conter a empolgação diante de uma situação tão nova."
 tournament_events.1406.t:0 "$tournament_header$ Novas Experiências"
 tournament_events.1407.a.failure:0 "Você perde a briga"
 tournament_events.1407.a.success:0 "Você vence a briga"
 tournament_events.1407.a:0 "O que você acabou de dizer?!"
 tournament_events.1407.b.failure:0 "Você não consegue abafar [shouting_fan.GetFirstNameNoTooltip]"
 tournament_events.1407.b.success:0 "Você consegue abafar [shouting_fan.GetFirstNameNoTooltip]"
 tournament_events.1407.b:0 "Vamos lá, [competing_family.GetFirstNameNoTooltip]! A vitória é sua!"
 tournament_events.1407.c:0 "Bem, espero que [competing_family.GetFirstNameNoTooltip] não leve isso para o coração..."
 tournament_events.1407.desc:0 "Lá [competing_family.GetSheHe] está! Meu [ROOT.Char.Custom2('RelationToMeShort', competing_family)] [competing_family.GetFirstName] está competindo nesta disputa, e finalmente consegui avistar [competing_family.GetHerHim] no meio dos competidores. Mal abri a boca para oferecer algum apoio quando ouço outra voz.\n\n\"Oi, [competing_family.GetFirstNameNoTooltip]! É melhor você sair agora e nos poupar de problemas!\"\n\nOlho ao redor, em meio aos espectadores risonhos, para encontrar [shouting_fan.GetFirstName] se preparando para outra sequência de insultos."
 tournament_events.1407.t:0 "$tournament_header$ Honra Defendida"
 tournament_events.1408.a.tt:0 "Isso pode exigir um pouco de persuasão..."
 tournament_events.1408.a:0 "\"Posso comprar isso de você?\""
 tournament_events.1408.b.criticalfailure:0 "Você perde seu lugar e o vendedor vai embora"
 tournament_events.1408.b.failure:0 "Você compra uma bebida, mas perde seu lugar"
 tournament_events.1408.b.success:0 "Você se afasta rapidamente para beber e volta facilmente"
 tournament_events.1408.b:0 "Talvez se eu for rápido(a)..."
 tournament_events.1408.c:0 "Vou ter que aguentar."
 tournament_events.1408.desc:0 "O sol escaldante bate enquanto observo a competição de meu ponto de vista na frente da multidão. Está muito quente hoje. Ou talvez eu esteja vestido(a) demais?\n\nEstou refletindo sobre isso quando vejo um jovem comerciante empreendedor carregando um odre de alguma bebida indeterminada em um ombro, claramente oferecendo-a a transeuntes em troca de moedas. Minha boca fica instantaneamente seca. Se ao menos eu pudesse chegar lá sem perder meu lugar...\n\nOlho desesperadamente em busca de respostas, mas vejo apenas [drinking_fan.GetFirstName] vagueando de volta para seu lugar na multidão, com a bebida firmemente em mãos."
 tournament_events.1408.t:0 "$tournament_header$ Saciado(a)"
 tournament_events.1409.a:0 "\"Claro! Tem que ser [fan_favourite.GetFirstNameNoTooltip]!\""
 tournament_events.1409.b:0 "\"Obviamente vai ser [other_favourite.GetFirstNameNoTooltip], s[Select_CString( friendly_fan.IsFemale, 'ua', 'eu' )] [friendly_fan.Custom2('InsultNoun', ROOT.Char)]!\""
 tournament_events.1409.c:0 "Talvez se eu apenas sorrir e acenar..."
 tournament_events.1409.desc:0 "Eu dou espaço para alguém passar, mas assim que faço isso, a pessoa começa a falar.\n\n\"Ah, [ROOT.Char.GetTitledFirstName]! Que surpresa encontrá-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] aqui!\" Abro a boca para responder, mas [friendly_fan.GetFirstName] é mais rápid[Select_CString( friendly_fan.IsFemale, 'a', 'o' )]. \"Não acho que você tenha algum favorito? Alguém em quem você acha que vai levar a vitória? Eu tenho uma boa sensação sobre [fan_favourite.GetFirstName]!\"\n\nConsidero minhas opções por um momento. Talvez seja melhor concordar?"
 tournament_events.1409.t:0 "$tournament_header$ Um para torcer"
 tournament_events.1410.a.failure:0 "Você se machuca na briga resultante"
 tournament_events.1410.a.success:0 "Você consegue separá-los com sucesso"
 tournament_events.1410.a.tt:0 "Tentar se meter entre eles pode ser arriscado, mas eu preciso fazer alguma coisa..."
 tournament_events.1410.a:0 "\"Já chega!\""
 tournament_events.1410.b.failure:0 "O par continua a briga"
 tournament_events.1410.b.success:0 "Suas palavras tranquilizadoras funcionam"
 tournament_events.1410.b:0 "\"Vamos lá! Esse não é o momento nem o lugar para uma briga!\""
 tournament_events.1410.c.fan1:0 "[fan_1.GetFirstNameNoTooltip] vence a briga"
 tournament_events.1410.c.fan2:0 "[fan_2.GetFirstNameNoTooltip] vence a briga"
 tournament_events.1410.c:0 "Isso! Acerte [fan_1.GetHerHim]!"
 tournament_events.1410.desc:0 "Acima dos clamores da multidão, consigo ouvir claramente o início de uma briga. Virando o pescoço para olhar atrás de mim, consigo ver duas figuras, cada uma segurando roupas do outro. Não está claro sobre o que é essa disputa, mas um pequeno círculo de espectadores barulhentos já se formou.\n\n\"Você é um[Select_CString( fan_2.IsFemale, 'a', '' )] [fan_2.Custom2('InsultNoun', SCOPE.sC('fan_1'))] [fan_2.Custom2('InsultAdjective', SCOPE.sC('fan_1'))]!\" [fan_1.GetFirstName] cospe, xingando enquanto [fan_1.GetSheHe] se ergue em toda a sua altura. [fan_2.GetFirstName] responde da mesma forma.\n\n\"Você é um[Select_CString( fan_1.IsFemale, 'a', '' )] grosseir[Select_CString( fan_1.IsFemale, 'a', 'o' )] e um[Select_CString( fan_1.IsFemale, 'a', '' )] [fan_1.Custom2('InsultNoun', SCOPE.sC('fan_2'))]! Vou arrancar suas entranhas!\" Os dois estão claramente se preparando para lutar."
 tournament_events.1410.t:0 "$tournament_header$ Fãs Insatisfeitos"
 tournament_events.6000.a:0 "Uma oportunidade interessante."
 tournament_events.6000.again:0 "[murder_target.GetTitledFirstName] ainda está vivo(a)...\n\n"
 tournament_events.6000.b:0 "Sim, a culpa recairá sobre [murder_match.GetFirstNameNoTooltip]."
 tournament_events.6000.blame:0 "Qualquer acusação recairá sobre [murder_match.GetShortUIName]"
 tournament_events.6000.c:0 "Eu acabarei com o tolo!"
 tournament_events.6000.d:0 "Ainda não..."
 tournament_events.6000.deferred:0 "Tenho esperado com paciência admirável... esperando pelo momento perfeito para atacar [murder_target.GetTitledFirstName]..."
 tournament_events.6000.desc:0 "Um torneio é o lugar perfeito para me livrar de [murder_target.Custom2('InsultNoun', ROOT.Char)], [murder_target.GetTitledFirstName] - perigos disfarçados espreitam em cada esquina, e suspeitas são dispersas pela frequência de acidentes.\n\n"
 tournament_events.6000.e:0 "É muito arriscado..."
 tournament_events.6000.failure:0 "Sua sabotagem não surte efeito"
 tournament_events.6000.foot:0 "A [activity.GetCurrentPhase.GetPhase.GetName|l] se aproxima, e uma lâmina envenenada nas mãos certas poderia acabar com [murder_target.GetHerHim] instantaneamente...\n\n"
 tournament_events.6000.imprisonment_tt:0 "Como [murder_target.GetFirstNameNoTooltip] é o Anfitrião, [murder_match.GetFirstNameNoTooltip] pode ser preso(a)"
 tournament_events.6000.injuries:0 "Possíveis Lesões"
 tournament_events.6000.joust:0 "As lanças da [activity.GetCurrentPhase.GetPhase.GetName|l] são protegidas com pontas cegas, mas uma substituição cuidadosamente preparada com suas primas mais letais pode passar despercebida...\n\n"
 tournament_events.6000.patsy_match:0 "Eu só preciso adulterar o equipamento de [murder_match.GetFirstNamePossessive] antes que [murder_match.GetSheHe] enfrente [murder_target.GetFirstNameNoTooltip], e rezar para que as estrelas se alinhem..."
 tournament_events.6000.self_match:0 "Seria fácil adulterar meu equipamento, anulando as medidas de segurança impostas pelo torneio, e acabar com [murder_target.GetFirstNameNoTooltip] diante da multidão..."
 tournament_events.6000.success:0 "Seu sabotagem é bem-sucedida"
 tournament_events.6000.success_tt:0 "[murder_target.GetFirstNameNoTooltip] é morto(a) por [murder_match.GetFirstNameNoTooltip]"
 tournament_events.6000.t:0 "$tournament_header$ A Todo Custo"
 tournament_events.6001.a:0 "E eu não posso esperar..."
 tournament_events.6001.b:0 "Maldição..."
 tournament_events.6001.closing:0 "\n\nSeu dia chegará mais cedo do que você pensa, [murder_target.GetFirstName]..."
 tournament_events.6001.failure:0 "\n\nInfelizmente, quando volto na manhã seguinte, fica claro que um atendente perspicaz notou meu trabalho - essas tentativas não fizeram nada além de levantar suspeitas de jogo sujo, e os escudeiros estão mais atentos do que nunca."
 tournament_events.6001.foot:0 "Esfrego a lâmina com um veneno nocivo, ponderando as promessas do alquimista que me vendeu a poção fétida, antes de cuidadosamente embainhá-la em sua bainha."
 tournament_events.6001.horse:0 "Substituo as lanças na armaria ao anoitecer, elas repousam lá no escuro, aguardando o toque das trombetas da aurora."
 tournament_events.6001.success:0 "\n\nMeu equipamento diabolicamente modificado está pronto para a [activity.GetCurrentPhase.GetPhase.GetName|l], só preciso garantir que o utilize corretamente..."
 tournament_events.6001.success_patsy:0 "\n\nApós um momento de tensão palpitante, estou fora! Com sorte, [murder_match.GetFirstName] não perceberá até que seja tarde demais..."
 tournament_events.6001.t:0 "$tournament_events.6050.t$"
 tournament_events.6010.a.failure:0 "Seu rival aparenta não ser afetado"
 tournament_events.6010.a.flavor:0 "[murder_target.GetFirstNameNoTooltip] vai experimentar outro tipo de veneno!"
 tournament_events.6010.a.ill:0 "Os humores do seu rival são perturbados"
 tournament_events.6010.a.success:0 "Seu rival bebe o último gole"
 tournament_events.6010.a:0 "Conheço um boticário nas proximidades."
 tournament_events.6010.b.caught:0 "Seu rival domina o bandido"
 tournament_events.6010.b.failure:0 "Seu rival escapa do bandido"
 tournament_events.6010.b.flavor:0 "Nada é mais útil do que um homem desesperado..."
 tournament_events.6010.b.success:0 "Seu rival é morto"
 tournament_events.6010.b:0 "Onde estão aqueles desafortunados que vi antes?"
 tournament_events.6010.c:0 "Isso não vai funcionar..."
 tournament_events.6010.desc:0 "Ao fim do dia, avisto meu rival, [murder_target.GetName], claramente à vontade, relaxando com companhia. Essa competição oferece a oportunidade perfeita para um acidente #EMP acidental#! acontecer com [murder_target.GetHerHim]...\n\nNesse ambiente descontraído, não deverá ser difícil colocar algo na xícara [murder_target.GetHerHim]."
 tournament_events.6010.t:0 "$tournament_header$ Rival de Assassinato"
 tournament_events.6011.a.caught:0 "Malditos vagabundos."
 tournament_events.6011.a.death:0 "Aquilo foi quase até fácil demais..."
 tournament_events.6011.a.ill:0 "Ainda há esperança..."
 tournament_events.6011.a.slain:0 "Um negócio desagradável, isso."
 tournament_events.6011.a:0 "Que sorte maldita."
 tournament_events.6011.ache:0 "O efeito é rápido: observo enquanto os frequentadores cercam [Select_CString( murder_target.IsFemale, 'a', 'o' )] [murder_target.Custom2('InsultNoun', ROOT.Char)] gemendo, mas rapidamente fica claro que o frasco não tinha a potência prometida.\n\nNo máximo, [murder_target.GetSheHe] terá uma noite ruim no banheiro..."
 tournament_events.6011.b.failure:0 "Seu rival escapa"
 tournament_events.6011.b.success:0 "Você mata seu rival"
 tournament_events.6011.b:0 "Devo agir agora."
 tournament_events.6011.c:0 "Acabou..."
 tournament_events.6011.caught:0 "Mal consigo dormir esperando pelas notícias, um medo indeterminado me perturba até a manhã.\n\nMeus assistentes batem à porta ao amanhecer, informando que [murder_target.GetFirstNameNoTooltip] afirma ter derrotado um bandido que tentou assassiná-[murder_target.GetHerHim] durante a noite, e que disse que eu estava por trás disso."
 tournament_events.6011.death:0 "Mais perturbador ainda é o quão rapidamente [murder_target.GetSheHe] desmorona após beber a poção, contorcendo-se de dor, implorando por ajuda."
 tournament_events.6011.escape:0 "Mal consigo dormir esperando pelas notícias, certo de que algo deu errado.\n\nMeu coração está certo, [murder_target.GetFirstNameNoTooltip] ainda vive, e a notícia da tentativa de assassinato por um estranho encapuzado se espalhou por todo [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip]."
 tournament_events.6011.ill:0 "Prendo a respiração enquanto [murder_target.GetSheHe] leva a xícara aos lábios e brevemente me deleito com o sucesso, mas não é para ser. [Select_CString( murder_target.IsFemale, 'A', 'O' )] [murder_target.Custom2('InsultNoun', ROOT.Char)] está apenas com febre e provavelmente sobreviverá."
 tournament_events.6011.poison:0 "Volto apressadamente do vendedor de poções, que rapidamente acreditou em minha história de ratos nos estábulos.\n\nEnquanto o ocupado taberneiro enche os copos, é assustadoramente fácil colocar furtivamente a poção na xícara de [murder_target.GetFirstNamePossessive].\n\n"
 tournament_events.6011.second_chance:0 "Irritantemente, o veneno parece apenas confundir o [murder_target.GetWomanMan], mas seguindo [murder_target.GetHerHim] para fora, encontro-nos agora sozinhos em um local isolado dentro do terreno do torneio.\n\nEssa pode ser minha última chance de alcançar meu objetivo..."
 tournament_events.6011.slain:0 "Mal consigo dormir esperando pelas notícias, mas no fundo estou aliviado por me livrar do meu rival.\n\nAo amanhecer, todo [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] fala sobre o horrível ataque a [murder_target.GetFirstNameNoTooltip], que foi encontrado esfaqueado na rua por um guarda, com uma adaga ensanguentada ao seu lado."
 tournament_events.6011.t:0 "$tournament_events.6010.t$"
 tournament_events.6011.thug:0 "O bandido pega minha moeda, concordando com meus termos resignadamente, e confirmando meu sutil aceno na direção de [murder_target.GetTitledFirstName].\n\n"
 tournament_events.6012.a.caught:0 "#EMP Quem te enviou?!"
 tournament_events.6012.a.death:0 "#EMP engasgo#! A- #fracas ajuda...!"
 tournament_events.6012.a.ill:0 "Só p-preciso m-deitar um pouco."
 tournament_events.6012.a.poison:0 "Essas b-bebidas são p-peçonhentas!"
 tournament_events.6012.a.slain:0 "#fracas Quem...?!#!"
 tournament_events.6012.a:0 "Eu estarei bem..."
 tournament_events.6012.caught:0 "Eu me desvio no exato momento em que o homem avança em minha direção, pegando-o desprevenido antes de imobilizá-lo no chão. Uma adaga cintilante se destaca na lama."
 tournament_events.6012.death:0 "Deuses, o que é esse fogo dentro de mim! \"A-ajuda!\"\", gaguejo, enquanto os rostos estúpidos dos meus conhecidos me encaram."
 tournament_events.6012.escape:0 "Os passos pesados de uma figura encapuzada se aproximam de mim. Giro rapidamente enquanto eles se aproximam, derrubando-os no chão e fazendo uma corrida em direção à massa de tendas."
 tournament_events.6012.ill:0 "Desabo, segurando minhas entranhas, enquanto sou cercado por espectadores preocupados. \"Ajuda, chamem um médico!\", consigo gaguejar."
 tournament_events.6012.poison:0 "Estou conversando animadamente sobre as próximas competições com alguns participantes quando de repente sinto meu interior revirar e minha respiração se contrair.\n\n"
 tournament_events.6012.slain:0 "Antes mesmo de me virar, é como se um cavalo me chutasse ao chão. Uma figura encapuzada me imobiliza, empunhando uma adaga em direção ao meu coração!"
 tournament_events.6012.t:0 "$tournament_events.6010.t$"
 tournament_events.6012.thug:0 "Deixo a tenda depois de passar a noite conversando sobre os favoritos com outros participantes, quando sinto uma figura atrás de mim.\n\n"
 tournament_events.6013.a.death:0 "Isso deve resolver!"
 tournament_events.6013.a:0 "Nããão!"
 tournament_events.6013.death:0 "Me aproximo rapidamente por trás de [murder_target.GetHerHim], segurando sua cabeça o mais silenciosamente possível e passo minha lâmina pelo pescoço de [murder_target.GetHerHim].\n\n[murder_target.GetSheHe|U] engasga e chuta enquanto corro para longe, adentrando o labirinto de tendas."
 tournament_events.6013.fallback:0 "Me aproximo rapidamente por trás de [murder_target.GetHerHim], mas [murder_target.GetFirstName] me ouve se aproximar e se vira, encarando-me assustado com minha adaga cintilante.\n\n[murder_target.GetSheHe|U] foge com energia renovada, me deixando sem ar e desaparecendo no labirinto de tendas."
 tournament_events.6013.t:0 "$tournament_events.6010.t$"
 tournament_events.6014.a.death:0 "O quê- #EMP N-!#! gargarejo"
 tournament_events.6014.a:0 "Isso foi... não... #EMP [murder_actor.GetFirstNameNoTooltip]#!!"
 tournament_events.6014.death:0 "Antes que eu possa reagir, [murder_target.GetSheHe] puxa minha cabeça para trás e encosta uma adaga em meu pescoço!"
 tournament_events.6014.desc:0 "Enquanto volto para minha tenda, segurando fracamente meu lado, [murder_target.GetSheHe] se aproxima rapidamente por trás de mim!"
 tournament_events.6014.fallback:0 "Giro rapidamente, derrubando [murder_target.GetHerHim] no chão com um gemido e corro diretamente para o labirinto de tendas."
 tournament_events.6014.t:0 "$tournament_events.6010.t$"
 tournament_events.6050.a.horse_race:0 "[sabotage_target_1.GetFirstNameNoTooltip] é a ameaça no #EMP [sabotage_target_1.Custom('GetContestHorseRaceName')]#!."
 tournament_events.6050.a:0 "[sabotage_target_1.GetFirstNameNoTooltip] é a ameaça."
 tournament_events.6050.b.horse_race:0 "Não suporto a ideia de [sabotage_target_2.GetFirstNameNoTooltip] vencendo com o #EMP [sabotage_target_2.Custom('GetContestHorseRaceName')]#!."
 tournament_events.6050.b:0 "Não suporto a ideia de [sabotage_target_2.GetFirstNameNoTooltip] vencendo."
 tournament_events.6050.c.horse_race:0 "[sabotage_target_3.GetFirstNamePossessiveNoTooltip] #EMP [sabotage_target_3.Custom('GetContestHorseRaceName')]#! precisa ser neutralizado."
 tournament_events.6050.c:0 "[sabotage_target_3.GetFirstNameNoTooltip] precisa ser neutralizado."
 tournament_events.6050.d:0 "Não é assim que se vence..."
 tournament_events.6050.desc:0 "Eu prometi a mim mesmo que venceria uma competição neste torneio, e não consigo deixar de considerar uma abordagem menos... #EMP 'justa'#! para garantir o prêmio da competição [activity.GetCurrentPhase.GetPhase.GetName|l].\n\nTenho certeza de que meus oponentes fariam o mesmo, se tivessem a ideia - quem sabe, talvez eles já tenham?"
 tournament_events.6050.detected:0 "Sua sabotagem foi detectada"
 tournament_events.6050.failure:0 "Sua sabotagem foi malsucedida"
 tournament_events.6050.success:0 "Sua sabotagem foi bem-sucedida"
 tournament_events.6050.t:0 "$tournament_contest_header$ Sabotagem"
 tournament_events.6051.a.detected:0 "Que má sorte..."
 tournament_events.6051.a.disqualified:0 "Pelo amor de Deus..."
 tournament_events.6051.a.failure:0 "Bobagens..."
 tournament_events.6051.a:0 "Tudo é justo."
 tournament_events.6051.archery:0 "Eu tentei sabotar o arco de [sabotage_target.GetTitledFirstNamePossessive] antes que o [activity.GetCurrentPhase.GetPhase.GetName|l] continue, alterando sutilmente a tração da corda para desestabilizar [sabotage_target.GetHerHim]."
 tournament_events.6051.detected:0 "\n\nNo momento em que estava prestes a sair, meu trabalho cuidadoso quase concluído, virei-me para encontrar o(a) ajudante de [sabotage_target.GetFirstNamePossessiveNoTooltip], de boca aberta. Antes que eu pudesse reagir, [sabotage_target.GetSheHe] correu para contar ao(a) mestre(a)!"
 tournament_events.6051.disqualified:0 "\n\nNão demora muito antes de eu ser desclassificado..."
 tournament_events.6051.failure:0 "\n\nInfelizmente, entre a perspicácia [sabotage_target.GetHerHim] e minha má sorte, essas tentativas não fizeram nada além de levantar suspeitas de jogo sujo entre os participantes, que agora estão mais vigilantes do que nunca."
 tournament_events.6051.falconry:0 "Eu tentei envenenar o pássaro de [sabotage_target.GetTitledFirstNamePossessive] antes do início do [activity.GetCurrentPhase.GetPhase.GetName|l], contaminando sua alimentação enquanto os escudeiros dormiam."
 tournament_events.6051.foot:0 "Eu tentei sabotar a armadura de [sabotage_target.GetTitledFirstNamePossessive] antes que o [activity.GetCurrentPhase.GetPhase.GetName|l] continue, enfraquecendo os pontos de couro que seguram os componentes na esperança de que eles se desgastem."
 tournament_events.6051.forgiven:0 "\n\nFelizmente, me permitem continuar participando..."
 tournament_events.6051.horse:0 "Eu tentei envenenar o cavalo de [sabotage_target.GetTitledFirstNamePossessive] antes que o [activity.GetCurrentPhase.GetPhase.GetName|l] continue, trocando a alimentação do estábulo por lotes contaminados enquanto os escudeiros dormiam."
 tournament_events.6051.horse_race:0 "Eu tentei envenenar o cavalo de corrida de [sabotage_target.GetTitledFirstNamePossessive], #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#!, antes do início do [activity.GetCurrentPhase.GetPhase.GetName|l], trocando a alimentação do estábulo por lotes contaminados enquanto os escudeiros dormiam."
 tournament_events.6051.pugilism:0 "Eu tentei sabotar as faixas de [sabotage_target.GetTitledFirstNamePossessive] antes que o [activity.GetCurrentPhase.GetPhase.GetName|l] continue, cobrindo-as com um ungüento irritante para desestabilizar [sabotage_target.GetHerHim]."
 tournament_events.6051.success:0 "\n\nMinha paciência finalmente valeu a pena; eu fiz a troca sem despertar suspeitas e escapei na noite. Ao amanhecer, fiquei aliviado ao descobrir que não havia nem sussurro sobre minhas maquinações."
 tournament_events.6051.t:0 "$tournament_events.6050.t$"
 tournament_events.6052.a.host:0 "Trapaças exigem desqualificação!"
 tournament_events.6052.a:0 "Não toleraremos trapaças."
 tournament_events.6052.archery:0 "\"[sabotage_actor.GetSheHe|U] estava mexendo no arco de [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], alterando sutilmente a tração da corda.\""
 tournament_events.6052.b:0 "Venham, foi inofensivo."
 tournament_events.6052.foot:0 "\"[sabotage_actor.GetSheHe|U] estava mexendo na armadura de [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], enfraquecendo os pontos de couro que seguram os componentes na esperança de que eles se desgastassem durante a luta!\""
 tournament_events.6052.guest:0 "[sabotage_target.GetTitledFirstName], um dos concorrentes no próximo concurso [activity.GetCurrentPhase.GetPhase.GetName|l], acusou [sabotage_actor.GetTitledFirstName] de jogo sujo, antes mesmo do dia do evento!\n\n"
 tournament_events.6052.horse:0 "\"[sabotage_actor.GetSheHe|U] estava tentando envenenar o cavalo de [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], trocando a alimentação do estábulo por lotes contaminados enquanto os escudeiros dormiam.\""
 tournament_events.6052.horse_race:0 "\"[sabotage_actor.GetSheHe|U] estava tentando envenenar o cavalo de corrida de [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#!, trocando a alimentação do estábulo por lotes contaminados enquanto os escudeiros dormiam.\""
 tournament_events.6052.host:0 "Meus assistentes afirmam ter pego [sabotage_actor.GetTitledFirstName], um dos concorrentes no próximo concurso [activity.GetCurrentPhase.GetPhase.GetName], tentando me sabotar no evento!\n\n"
 tournament_events.6052.pugilism:0 "\"[sabotage_actor.GetSheHe|U] estava mexendo nas faixas de [sabotage_target.GetShortUINamePossessiveNoTooltipNoFormat], cobrindo-as com uma pomada irritante.\""
 tournament_events.6052.t:0 "$tournament_events.6050.t$"
 tournament_events.6053.a:0 "Sem vergonha!"
 tournament_events.6053.archery:0 "\"[sabotage_actor.GetTitledFirstName] estava mexendo no arco de [sabotage_target.GetTitledFirstNamePossessive], alterando sutilmente a tração da corda para me desconcertar.\""
 tournament_events.6053.desc:0 "Antes mesmo do início do concurso [activity.GetCurrentPhase.GetPhase.GetName|l], alguém foi pego em flagrante sabotagem!"
 tournament_events.6053.disqualified:0 "\n\nCompreensivelmente, [host.GetTitledFirstName] desqualificou [sabotage_actor.GetHerHim] do concurso, para deleite da vítima pretendida [host.GetHerHim]."
 tournament_events.6053.disqualified_target:0 "\n\n[host.GetTitledFirstName] desqualificou justamente o maldito cão da competição. Que atrevimento!"
 tournament_events.6053.foot:0 "\"[sabotage_actor.GetTitledFirstName] estava mexendo na armadura de [sabotage_target.GetTitledFirstNamePossessive], enfraquecendo os pontos de couro que seguram os componentes na esperança de que eles se desgastassem durante a luta!\""
 tournament_events.6053.forgiven:0 "\n\nSurpreendentemente, [host.GetTitledFirstName] não tomou nenhuma ação contra [sabotage_actor.GetHerHim], encerrando o caso."
 tournament_events.6053.forgiven_target:0 "\n\n[host.GetTitledFirstName] perdoou escandalosamente o maldito cão, que ainda terá permissão para competir! Que audácia!"
 tournament_events.6053.horse:0 "\"[sabotage_actor.GetTitledFirstName] estava tentando envenenar o cavalo de [sabotage_target.GetTitledFirstNamePossessive], trocando a alimentação do estábulo por lotes contaminados enquanto os escudeiros dormiam.\""
 tournament_events.6053.horse_race:0 "\"[sabotage_actor.GetTitledFirstName] estava tentando envenenar o cavalo de corrida de [sabotage_target.GetTitledFirstNamePossessive], #EMP [sabotage_target.Custom('GetContestHorseRaceName')]#!, trocando a alimentação do estábulo por lotes contaminados enquanto os escudeiros dormiam.\""
 tournament_events.6053.pugilism:0 "\"[sabotage_actor.GetTitledFirstName] estava mexendo nas faixas de [sabotage_target.GetTitledFirstNamePossessive], cobrindo-as com uma pomada irritante para me desconcertar.\""
 tournament_events.6053.t:0 "$tournament_events.6050.t$"
 tournament_events.6500.a:0 "Como você desejar, querid[Select_CString( woo_target.IsFemale, 'a', 'o' )] [woo_target.GetFirstNameNoTooltip]."
 tournament_events.6500.b:0 "Não há honra na derrota!"
 tournament_events.6500.desc:0 "Minhas tentativas de chamar a atenção de [woo_target.GetTitledFirstName] não passaram despercebidas, mas o coração [woo_target.GetHerHim] ainda não está aberto para mim.\n\n\"Eu não sou apenas mais [Select_CString( woo_target.IsFemale, 'uma', 'um' )] [woo_target.Custom('GirlBoy')], uma presa ingênua para um nobre perseguir e descartar. Mostre-me – prove-me – seu afeto, e então conversaremos...\" \n\n\"Mostrar?!\" pergunto, \"...como você gostaria que eu fizesse isso?\"\n\nA resposta de [woo_target.GetFirstNamePossessiveNoTooltip] vem rapidamente: \"Perca o concurso.\""
 tournament_events.6500.t:0 "$tournament_header$ As Coisas que Fazemos por Amor"
 tournament_events.6510.a.tt:0 "#F Apelo para o lado emocional de [woo_target.GetFirstNamePossessiveNoTooltip]!#"
 tournament_events.6510.a:0 "Eu fiz tudo isso por você, [Select_CString( woo_target.IsFemale, 'minha', 'meu' )] [woo_target.GetLadyLord]."
 tournament_events.6510.b.tt:0 "#F Apelo para o lado arrogante de [woo_target.GetFirstNamePossessiveNoTooltip]!#"
 tournament_events.6510.b:0 "Ah, isso? Não foi nada, na verdade."
 tournament_events.6510.c.tt:0 "#F Apelo para o lado humilde de [woo_target.GetFirstNamePossessiveNoTooltip]!#"
 tournament_events.6510.c:0 "Eu tive sorte: meus oponentes lutaram bem."
 tournament_events.6510.currentspouse:0 "Uma oportunidade de provar minha devoção a meu [woo_target.GetWomanMan]!"
 tournament_events.6510.d.tt:0 "#F Apelo para o lado religioso de [woo_target.GetFirstNamePossessiveNoTooltip]!#"
 tournament_events.6510.d:0 "[ROOT.Char.GetFaith.HighGodName] atendeu às minhas preces com o seu favor."
 tournament_events.6510.desc:0 "\n\n\"Parabéns por vencer o [ROOT.Char.Custom('GetRandomWonContest')|l], [ROOT.Char.GetTitledFirstName],\" [woo_target.GetSheHe] oferece educadamente. \"Foi realmente um espetáculo.\"\n\nHá um brilho genuíno nos olhos [woo_target.GetHerHim], tenho certeza disso."
 tournament_events.6510.married:0 "Foi fácil garantir que [Select_CString( woo_target.IsFemale, 'sua', 'seu' )] [woo_target.GetPrimarySpouse.GetWifeHusband], [woo_target.GetPrimarySpouse.GetTitledFirstName], estivesse em outro lugar."
 tournament_events.6510.opening:0 "As pausas nas festividades do torneio me dão bastante tempo para planejar um encontro com [woo_target.GetFirstName]."
 tournament_events.6510.t:0 "O Fascínio da Vitória"
 tournament_events.6511.a:0 "Não posso negar que [woo_actor.GetSheHe] tem um certo charme..."
 tournament_events.6511.dedicate:0 "$tournament_events.6511.reply_dedicate$Não consigo evitar corar com essa descarada paquera..."
 tournament_events.6511.dismiss:0 "$tournament_events.6511.reply_dismiss$Que [woo_actor.GetWomanMan] audacioso..."
 tournament_events.6511.fallback:0 "[woo_actor.GetSheHe|U] simplesmente sorri para mim com conhecimento, e fica difícil desviar o olhar."
 tournament_events.6511.god:0 "$tournament_events.6511.reply_god$Um [woo_actor.GetWomanMan] de fé, sem dúvida."
 tournament_events.6511.opening:0 "Eu encontro [woo_actor.GetTitledFirstName] no pavilhão e ofereço meus parabéns pela sua vitória em [ROOT.Char.Custom('GetRandomWonContest')|l].\n\n"
 tournament_events.6511.praise:0 "$tournament_events.6511.reply_praise$Tamanha humildade..."
 tournament_events.6511.reply_dedicate:0 "[woo_actor.GetSheHe|U] responde descaradamente que [woo_actor.GetSheHe] fez tudo isso por mim!\n\n"
 tournament_events.6511.reply_dismiss:0 "[woo_actor.GetSheHe|U] responde despreocupadamente que nem deveria mencionar algo tão trivial.\n\n"
 tournament_events.6511.reply_god:0 "[woo_actor.GetSheHe|U] responde sinceramente que [woo_actor.GetSheHe] é grato por ser favorecido por [woo_actor.GetFaith.HighGodName].\n\n"
 tournament_events.6511.reply_praise:0 "[woo_actor.GetSheHe|U] responde rapidamente que [woo_actor.GetSheHe] teve apenas sorte; seus oponentes não são menos poderosos que [woo_actor.GetSheHe].\n\n"
 tournament_events.6512.a:0 "Que [woo_actor.GetWomanMan] ridículo(a)."
 tournament_events.6512.dedicate:0 "$tournament_events.6511.reply_dedicate$Não consigo deixar de me encolher internamente..."
 tournament_events.6512.dismiss:0 "$tournament_events.6511.reply_dismiss$Tamanha arrogância..."
 tournament_events.6512.fallback:0 "[woo_actor.GetSheHe|U] simplesmente sorri para mim com conhecimento, me deixando profundamente desconfortável."
 tournament_events.6512.god:0 "$tournament_events.6511.god$Que chato..."
 tournament_events.6512.praise:0 "$tournament_events.6511.praise$Aprenda a aceitar um elogio, de fato!"
 tournament_events.6513.a:0 "Acho que [woo_target.GetSheHe] está interessado(a)..."
 tournament_events.6513.dedicate:0 "$tournament_events.6513.reply$, corando enquanto [woo_target.GetSheHe] ri de forma coquete."
 tournament_events.6513.desc:0 "\n\nQuando [woo_target.GetSheHe] sai, a tensão é palpável em cada cortesia - eu sabia que encontraria as palavras certas para conquistá-[woo_target.GetHerHim]!"
 tournament_events.6513.dismiss:0 "$tournament_events.6513.reply$, quase parecendo me observar com um novo olhar."
 tournament_events.6513.fallback:0 "$tournament_events.6513.reply$, olhando longa e profundamente nos meus olhos."
 tournament_events.6513.god:0 "$tournament_events.6513.reply$, respondendo que [woo_target.GetFaith.HighGodName] deve ter realmente desejado isso."
 tournament_events.6513.praise:0 "$tournament_events.6513.reply$, respondendo que [woo_target.GetSheHe] tem certeza de que foi mais do que sorte."
 tournament_events.6513.reply:0 "Parece que [woo_target.GetTitledFirstName] reagiu calorosamente à minha resposta"
 tournament_events.6514.a:0 "O que eu estava pensando...?"
 tournament_events.6514.dedicate:0 "$tournament_events.6514.reply$, pois [woo_target.GetSheHe] evita meu olhar quando [woo_target.GetSheHe] me agradece e rapidamente se retira."
 tournament_events.6514.desc:0 "\n\nFicando sozinho após sua despedida, não consigo deixar de me sentir um tolo por tal deslize completo..."
 tournament_events.6514.dismiss:0 "$tournament_events.6514.reply$, pois [woo_target.GetSheHe] revira os olhos com desdém."
 tournament_events.6514.fallback:0 "$tournament_events.6513.reply$, pois [woo_target.GetSheHe] não pode deixar minha companhia rápido o suficiente."
 tournament_events.6514.god:0 "$tournament_events.6514.reply$, pois [woo_target.GetSheHe] parece desligar-se, parecendo apenas meio atento(a)."
 tournament_events.6514.praise:0 "$tournament_events.6514.reply$, pois [woo_target.GetSheHe] perde rapidamente o interesse, desanimado(a) com minhas palavras."
 tournament_events.6514.reply:0 "Minha resposta parece não ter impressionado [woo_target.GetTitledFirstName]"
 tournament_events.6900.a.failure:0 "[local_lancer.GetFirstNameNoTooltip] prefere [bidder.GetFirstNameNoTooltip]"
 tournament_events.6900.a.success:0 "[local_lancer.GetFirstNameNoTooltip] é motivado(a) pelo dinheiro"
 tournament_events.6900.a:0 "Fique tranquilo(a), eu pagarei melhor."
 tournament_events.6900.b.success:0 "[local_lancer.GetFirstNameNoTooltip] busca gratificação mundana"
 tournament_events.6900.b:0 "[local_lancer.GetFirstNameNoTooltip], você vai ficar no meu grandioso pavilhão!"
 tournament_events.6900.c.success:0 "[local_lancer.GetFirstNameNoTooltip] é um(a) tipo(a) ambicioso(a)"
 tournament_events.6900.c:0 "Venha, você preferiria mesmo servir a um mero(a) #EMP [bidder.GetTitleAsNameNoTooltip]#!?"
 tournament_events.6900.closing:0 "\n\nEnquanto me aproximo para fazer minha introdução, [bidder.GetTitledFirstName] aparece ao lado de [local_lancer.GetHerHim], claramente compartilhando minha ideia..."
 tournament_events.6900.d:0 "Dê licença, [bidder.GetFirstNameNoTooltip], seu [ROOT.Char.GetTitleAsNameNoTooltip] vem em primeiro lugar."
 tournament_events.6900.desc:0 "Observando a nobreza insignificante reunida em [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], avisto exatamente o tipo de [local_lancer.GetWomanMan] de que preciso.\n\n"
 tournament_events.6900.e:0 "Não vou negociar por um(a) [ROOT.Char.Custom('MountedWarriorTerm')]."
 tournament_events.6900.new:0 "[local_lancer.GetFullName] é um(a) cavaleiro(a) local de certa experiência, conhecido(a) por aqui por seu valor apesar de sua baixa posição - um(a) [ROOT.Char.Custom('MountedWarriorTerm')] de uma linhagem provincial esquecida."
 tournament_events.6900.pool:0 "[local_lancer.GetFullName] é um cavaleiro errante de certa experiência, viajando de corte em corte em busca de [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetLadyLord] para servir. Normalmente, tais [local_lancer.GetWomenMen] devem ser desconfiados, mas os talentos [local_lancer.GetHerHim] são imediatamente evidentes."
 tournament_events.6900.t:0 "$tournament_header$ Lancer Local"
 tournament_events.7000.a.tt:0 "Junta-se à [activity.GetShortName]"
 tournament_events.7000.a:0 "Guardarei seu segredo."
 tournament_events.7000.b.tt:0 "Torna-se seu(a) [mulan.Custom('KnightCulture')]"
 tournament_events.7000.b:0 "Eu poderia contar com os serviços de alguém como você."
 tournament_events.7000.c:0 "Guardas! #EMP Guardas!#! Há uma #EMP [mulan.GetWomanMan]#! em nosso torneio!"
 tournament_events.7000.desc:0 "Cumprimento um grupo de [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] enquanto eles passam por mim. Um deles, ficando para trás do resto, me faz parar. Girando nos calcanhares, chamo a figura.\n\nEles estão vestidos com uma armadura sem forma e mal ajustada, seus olhos estão arregalados e claramente aterrorizados sob o capacete. #EMP Algo#! não está certo aqui. Avançando, arranco o capacete antes que eles tenham a chance de reagir.\n\nDiante de mim, olhando furtivamente para ver se alguém mais notou, está ninguém menos que uma [mulan.GetWomanMan]! Vestida como um(a) [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')], nada menos. Planejando até mesmo #EMP competir#! como um(a) [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')]!"
 tournament_events.7000.t:0 "$tournament_header$ Seja um(a) [ROOT.Char.GetWomanMan|U]!"
