 tournament_events.0050.a:0 "Mal posso esperar para começar!"
 tournament_events.0050.befriend:0 "Que lugar melhor do que este para eu fazer uma amizade sólida com [starting_intent.GetFirstName]!"
 tournament_events.0050.desc:0 "Cheguei ao local do Torneio, aqui em [activity.GetCurrentPhase.GetLocation.GetName]!\n\nEmbora nem todos os participantes tenham chegado, multidões de pessoas perambulam pelos arredores coloridos, todos ansiosos pelas próximas exibições de habilidade e destreza.\n\n"
 tournament_events.0050.murder:0 "Eu, por outro lado, tenho ambições um pouco maiores do que apenas me divertir. Se eu jogar minhas cartas direito, [starting_intent.GetFirstName] não verá o fim da cerimônia..."
