l_spanish:
 adventurers_encourage_relationships_option.tt:0 "Seus [followers|E] podem formar espontaneamente [friendships|E], se tornarem [lovers|E] ou [Concept('marry', 'Casados')|E] — seja entre si ou com [wanderers|E] conforme você [travel|E] por [baronies|E]. Cada relacionamento formado dessa maneira lhe dará [prestige_i][prestige|E].\n#weak (Suas [children|E], [spouses|E] ou outros de quem você gosta não irão se [marry|E] nem ter [lovers|E]. Isso não fará com que os [followers|E] se tornem [GetTrait('adulterer').GetName( GetNullCharacter )]s.)#!"
 adventurers_encourage_relationships_option:0 "Incentivar Relacionamentos"
 adventurers_encourage_relationships_option_desc:0 "Vínculos verdadeiros e duradouros não podem ser forçados; eles surgem de dificuldades compartilhadas. A estrada pode ser uma companheira cruel, mas para cada desafio superado, um novo relacionamento pode ser forjado."
 adventurers_gather_inspiration_option.effect:0 "[inspired_follower.GetUIName] recebeu a [inspired_follower.GetCurrentInspiration.GetName] - [inspired_follower.Custom('InspirationTypeDescriptionFuturePresent')].\n\n[inspired_follower.Custom('InspiredPersonQuality')]"
 adventurers_gather_inspiration_option.title:0 "[Select_CString( inspired_follower.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inspired_follower'))|U] [inspired_follower.GetFirstName] ficou Inspirado!"
 adventurers_gather_inspiration_option.tt:0 "Ao passar por um [barony|E], um [follower|E] aleatório tem chance de ficar [inspired|E]\n#weak (Chance % igual a um sexto da sua [stewardship_i])#!"
 adventurers_gather_inspiration_option:0 "Buscar Inspiração"
 adventurers_gather_inspiration_option_desc:0 "Há muita inspiração para encontrar na estrada — belas paisagens, pontos turísticos impressionantes e pessoas notáveis para conhecer. Isso realmente agita a fonte de inspiração da mente!"
 adventurers_make_local_deals_option.tt:0 "Ao passar por um [barony|E], você ganha #V 25%#! do valor de [loot|E] da Propriedade como [gold_i][gold|E]\n#weak (só pode obter Ouro uma vez por Propriedade)#!"
 adventurers_make_local_deals_option:0 "Negociação de Alto Risco"
 adventurers_make_local_deals_option_desc:0 "Há #EMP sempre#! um negócio a ser feito. Se as pessoas conhecem você, elas confiam em você e estão dispostas a negociar. Infelizmente, isso também significa que os bandidos sabem #EMP exatamente#! quem atacar..."
 adventurers_proselytize_zealously_option.title:0 "[wanderer_to_convert.GetShortUIName] se converte para o [ROOT.Char.GetFaith.GetName]!"
 adventurers_proselytize_zealously_option.tt.perk_or_tenet:0 "Você tem a [perk|E] [GetPerk('zealous_proselytizer_perk').GetName(GetPlayer)] ou $tenet_mendicant_preachers_name$ é sua [personal_tenet|E]"
 adventurers_proselytize_zealously_option.tt:0 "Ao passar por um [barony|E], você pode converter um [wanderer|E] que reside lá para sua [faith|E] e ganhar [piety_i][piety|E]\n#weak (Chance % igual ao seu [learning_i])#!"
 adventurers_proselytize_zealously_option:0 "Proselitismo aos Locais"
 adventurers_proselytize_zealously_option_desc:0 "Nos confins do mundo, eles ainda não ouviram falar da verdadeira fé. É nosso dever sagrado remediar isso."
 adventurers_scout_for_talent_option.tt:0 "Habilita eventos para recrutar [wanderers|E] por [gold_i][gold|E] se você tiver posições abertas para [officers|E]"
 adventurers_scout_for_talent_option:0 "Procurar por Talentos"
 adventurers_scout_for_talent_option_desc:0 "Há muitas figuras cansadas do mundo para encontrar durante suas viagens — alguns deles certamente estarão em busca de emprego!"
 adventurers_search_for_secrets_option.title:0 "[GetTravelOption('adventurers_search_for_secrets_option').GetName] Bem-sucedido!"
 adventurers_search_for_secrets_option.tt:0 "Ao passar por um [barony|E], você pode descobrir um [secret|E] de alguém que reside lá\n#weak (Chance % igual a sua [intrigue_i])#!"
 adventurers_search_for_secrets_option:0 "Procurar por Segredos"
 adventurers_search_for_secrets_option_desc:0 "Rumores são um mapa para um tesouro de segredos — mas é preciso uma mente astuta para segui-los, X marca o local!"
 anxious_option:0 "Apresse-se"
 anxious_option_desc:0 "O mundo é um lugar escuro e perigoso; é melhor apressar a jornada o máximo possível."
 appeasement_option:0 "Apaziguamento"
 appeasement_option_desc:0 "Às vezes é necessário adotar uma fachada benevolente, escondendo a tirania com charme régio, acalmando vassalos e súditos."
 available_mercenary.tt:0 "Há um [mercenary|E] disponível e não contratado dentro do alcance"
 average.aptitude_tt:0 "A [aptitude|E] de [local_character.GetUINamePossessive] é $aptitude_average$"
 captain_recruited.t:0 "Capitão Contratado"
 captain_recruited.tt:0 "Um marinheiro com o traço [GetTrait('forder').GetName( GetNullCharacter )] se juntará ao seu séquito $temporary_travel_character_limit_tt$"
 child_brought_along.tt:0 "Seu [heir|E] será levado para seu séquito."
 child_brought_along_specific.tt:0 "Seu herdeiro, [tutored_heir.GetName], será levado para seu séquito."
 circumspect_option:0 "Cauteloso"
 circumspect_option_desc:0 "Nunca deixe-os saber qual será seu próximo movimento."
 court_physician_option:0 "Trazer Equipamento Médico"
 court_physician_option_desc:0 "Você trará um suprimento saudável de equipamentos médicos em sua jornada para reduzir o [travel_danger|E] causado por [epidemics|E]."
 court_physician_option_suffix:0 " #weak (apenas para combater pestes)#!"
 court_physician_option_tt:0 "Você deve empregar um [GetCourtPositionType('court_physician_court_position').GetName] elegível para viagens"
 cultural_ambassador_option:0 "Contratar Embaixador Cultural"
 cultural_ambassador_option_desc:0 "Você contratará alguém para servir como Embaixador Cultural em sua jornada, disseminando informações sobre sua cultura para todos os condados pelos quais você passar."
 cultural_ambassador_recruited.t:0 "Embaixador Cultural Contratado"
 cultural_ambassador_recruited.tt:0 "Um Embaixador Cultural com alta [diplomacy|E] será recrutado para o seu séquito $temporary_travel_character_limit_tt$"
 desert_warrior_recruited.t:0 "Guerreiro do Deserto Contratado"
 desert_warrior_recruited.tt:0 "Um guia com o traço [GetTrait('desert_warrior').GetName( GetNullCharacter )] se juntará ao seu séquito $temporary_travel_character_limit_tt$"
 ep3_travel_option_events.0001.a:0 "Vou te pagar com prazer para se juntar ao meu grupo!"
 ep3_travel_option_events.0001.archer_captain_camp_officer:0 "\"Saudações, sou [local_character.GetFullName], [Select_CString( local_character.IsFemale, 'a', 'o' )] vigia. Observo os [location.Custom('GetTerrainTypePlural')] de [location.GetNameNoTooltip] do alto da minha torre. Se bandidos se aproximam, meu arco dá o recado. Porém, canso desta vida sedentária — quero ir mais longe do que qualquer uma das minhas flechas!\"\n\n"
 ep3_travel_option_events.0001.armorer_camp_officer:0 "\"Trabalho nas forjas, reparando malhas e placas para a guarnição de [location.GetNameNoTooltip]. Embora sempre haja trabalho, sinto o chamado da estrada há muito tempo.\"\n\n"
 ep3_travel_option_events.0001.average:0 "\"Eu estaria disposto a me juntar ao seu grupo.\" [local_character.GetSheHe|U] continua. \"Algumas moedas seriam suficientes para me tirar deste lugar.\""
 ep3_travel_option_events.0001.b:0 "Caia na estrada, s[Select_CString( local_character.IsFemale, 'ua', 'eu' )] [local_character.Custom2('InsultNoun', ROOT.Char)] inútil."
 ep3_travel_option_events.0001.bodyguard_court_position:0 "\"Olá, meu nome é [local_character.GetFullName]. Eu sei como quebrar a cara das pessoas. E sou muito bom nisso. Derrubei o mestre das cavalariças com um soco só na briga de ontem à noite.\"\n\n"
 ep3_travel_option_events.0001.camelry_captain_camp_officer:0 "\"Os camelos são minha vida. Já os montei em batalha inúmeras vezes, ninguém conseguiu enfrentar os 'Campeões Camelos de [local_character.GetFullNamePossessive]'. Desejo ver o mundo novamente, desejo conquistar novamente!\"\n\n"
 ep3_travel_option_events.0001.camp_cook_camp_officer:0 "\"Olá [ROOT.Char.Custom('RomanticComplimentNoun')], está com fome? Eu sou cozinheiro, veja, trabalho na taverna local. Você não acreditaria no que posso fazer com [local_character.Custom('RegionalRootVegetablePlural')] e [local_character.Custom('GetRandomRegionalSmallGame')]! Mas ah, como eu adoraria trabalhar com ingredientes mais exóticos...\"\n\n"
 ep3_travel_option_events.0001.chief_engineer_camp_officer:0 "\"Construí catapultas nas oficinas de [location.GetNameNoTooltip], trabalhando dia e noite durante meses! Carregando troncos, apertando molas, martelando engrenagens... agora anseio pela estrada.\"\n\n"
 ep3_travel_option_events.0001.chief_forager_camp_officer:0 "\"Eu sou [local_character.GetFullName] — passo meus dias nos [location.Custom('GetTerrainTypePlural')], procurando [location.Custom('GetProvinceFoliageDesc')] e [location.Custom('GetProvinceGroundDesc')] por [local_character.Custom('RegionalRootVegetablePlural')] e ovos de [local_character.Custom('GetRandomRegionalWildDaytimeBird')]. Levo minhas descobertas ao mercado de [location.GetNameNoTooltip] e as vendo para andarilhos e vagabundos.\"\n\n"
 ep3_travel_option_events.0001.court_physician_court_position:0 "\"[local_character.GetFaith.HighGodName|U] esteja com você, eu sou [local_character.GetFullName] — [Select_CString( local_character.IsFemale, 'a curandeira', 'o curandeiro' )] e herbalista residente de [location.GetNameNoTooltip]. Os moradores me procuram para tratar de suas enfermidades: ossos quebrados, erupções cutâneas, e até mesmo para ajudar no parto. Minha paixão pela saúde e pelos humores me enche de desejo por explorar.\"\n\n"
 ep3_travel_option_events.0001.elephantry_captain_camp_officer:0 "\"Saudações, meu nome é [local_character.GetFullName]. Cuido das grandes bestas que conhecemos como elefantes, eu os preparo e alimento. Não há carga mais mortal do que a de um desses gigantes com presas.\"\n\n"
 ep3_travel_option_events.0001.excellent:0 "\"Sou mestre no meu ofício.\" [local_character.GetSheHe|U] diz com convicção. \"Comigo ao seu lado, você será invencível.\""
 ep3_travel_option_events.0001.fallback:0 "\"Olá, eu sou [local_character.GetFullName]. Estou cansado de vagar sozinho por estas terras. Fiz muitos bicos, mas desejo me estabelecer daqui em diante.\"\n\n"
 ep3_travel_option_events.0001.good:0 "\"Minhas habilidades podem ser úteis para você.\" [local_character.GetSheHe|U] continua. \"Vamos discutir o pagamento?\""
 ep3_travel_option_events.0001.head_groom_camp_officer:0 "\"[local_character.GetFaith.HighGodName|U] esteja com você, meu nome é [local_character.GetFullName], sou [Select_CString( local_character.IsFemale, 'uma cavalariça', 'um cavalariço' )] aqui em [location.GetNameNoTooltip]. Cuido de dezenas de animais, faço partos de potros e restauro selas desgastadas e outros equipamentos equestres.\"\n\n"
 ep3_travel_option_events.0001.head_porter_camp_officer:0 "\"Saudações, meu nome é [local_character.GetFullName], sou [Select_CString( local_character.IsFemale, 'uma carregadora', 'um carregador' )] — gosto de dizer que carrego todo [location.GetNameNoTooltip] nas costas, har har! Eu embalo e transporto todo tipo de objetos: cerâmica, alimentos, armas, você escolhe.\"\n\n"
 ep3_travel_option_events.0001.heavy_cavalry_captain_camp_officer:0 "\"Eu sou [local_character.GetFullName], e servi como [local_character.Custom('KnightCultureNoTooltipLowercase')] na guarda de [location.GetNameNoTooltip], totalmente armado e com um cavalo encapuzado já enfrentei inúmeros inimigos do reino.\"\n\n"
 ep3_travel_option_events.0001.heavy_infantry_captain_camp_officer:0 "\"Saudações, meu nome é [local_character.GetFullName]. Visto uma armadura pesada e um escudo a serviço da guarnição de [location.GetNameNoTooltip]. Tenho feito isso há alguns anos, mas a última flecha passou bem perto de me matar, e comecei a pensar que há mais na vida.\"\n\n"
 ep3_travel_option_events.0001.horse_archer_captain_camp_officer:0 "\"Eu sou [local_character.GetFullName], desde pequen[Select_CString( local_character.IsFemale, 'a', 'o' )] vivo na sela. [local_character.GetFaith.HighGodName|U] me abençoou com habilidade, resistência e perseverança. Tudo que preciso é de um arco e um cavalo.\"\n\n"
 ep3_travel_option_events.0001.huntperson_camp_officer:0 "\"Saudações — sou um[Select_CString( local_character.IsFemale, 'a', '' )] caçador[Select_CString( local_character.IsFemale, 'a', '' )], meu nome é [local_character.GetFullName], e os [location.Custom('GetTerrainTypePlural')] de [location.GetNameNoTooltip] são onde caço. Os [location.Custom('TerrainTypeProvince')] abrigam muitos animais, todos eles são minha presa: [local_character.Custom('GetRegionalDeerType')], [local_character.Custom('GetRandomRegionalSmallGame')] e [local_character.Custom('GetRandomRegionalWildDaytimeBird')] igualmente.\"\n\n"
 ep3_travel_option_events.0001.intro:0 "Eu encontro um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] enquanto passo por [location.GetTitle.GetNameNoTier]. [local_character.GetSheHe|U] é [ROOT.Char.Custom2('QuirkAdjectivePosOrNeg', SCOPE.sC('local_character'))] e [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('local_character'))] enquanto me aproximo.\n\n"
 ep3_travel_option_events.0001.kennelperson_camp_officer:0 "\"Olá, eu sou [local_character.GetFullName], cuido do canil aqui em [location.GetNameNoTooltip]. Os melhores amigos do homem, assim os chamo; meus cães, meus [local_character.Custom('ComplimentAdjective')] filhotes. Eu os treino, cuido deles, os preparo para a caça — companheiros leais como nenhum outro, eu prometo!\"\n\n"
 ep3_travel_option_events.0001.light_cavalry_captain_camp_officer:0 "\"[local_character.GetFaith.HighGodName|U] esteja com você, eu sou [local_character.GetFullName]. Sou [Select_CString( local_character.IsFemale, 'batedora, mensageira e patrulheira', 'batedor, mensageiro e patrulheiro' )] — meu coração pertence aos ermos, longe da monotonia das cidades e vilarejos.\"\n\n"
 ep3_travel_option_events.0001.light_infantry_captain_camp_officer:0 "\"Eu sou [local_character.GetFullName], [Select_CString( local_character.IsFemale, 'uma mulher', 'um homem' )] de armas na guarnição de [location.GetNameNoTooltip]. Atacar e recuar, lançar um dardo, pegar um broquel e uma adaga — e depois partir para o ataque final. Já servi aqui tempo demais, o mundo tem mais a oferecer.\"\n\n"
 ep3_travel_option_events.0001.master_bard_camp_officer:0 "\"Saudações, meu nome é [local_character.GetFullName] [Select_CString( local_character.IsFemale, 'a', 'o' )] [local_character.Custom('ComplimentAdjective')]! Eu toco e canto nas tavernas locais, mas um desejo de aventura preenche meu coração! Preciso fugir deste lugar e ir onde minha música possa ser ouvida pelo mundo!\"\n\n"
 ep3_travel_option_events.0001.master_of_arms_camp_officer:0 "\"Atenção! Eu sou [local_character.GetFullName], [Select_CString( local_character.IsFemale, 'a capitã', 'o capitão' )] da guarda na guarnição de [location.GetNameNoTooltip]. Eu transformo recrutas em soldados e organizo os turnos da guarda. Todos confiam em mim para dizer o que fazer.\"\n\n"
 ep3_travel_option_events.0001.master_of_spoils_camp_officer:0 "\"Olá, eu sou [local_character.GetFullName]. Estou cansado de estar sozinho enquanto assalto pessoas nas estradas. Ouro não tem graça se você não tem ninguém com quem dividir... você e seu grupo parecem bem fortes.\"\n\n"
 ep3_travel_option_events.0001.master_thief_camp_officer:0 "\"Melhor ficar de olho na sua bolsa de moedas, há muitos batedores de carteira por essas bandas. Claro, eu nunca roubaria de alguém como você... não, minha mente é astuta, e prefiro mirar em riquezas distantes.\"\n\n"
 ep3_travel_option_events.0001.person_haggler_camp_officer:0 "\"Eu sou [local_character.GetFullName], [Select_CString( local_character.IsFemale, 'a carcereira', 'o carcereiro' )] — trabalho nas prisões de [location.GetNameNoTooltip], onde cuido dos prisioneiros. Eu negocio pela liberdade deles, depois os alimento, limpo, visto e transporto sempre que o resgate é pago.\"\n\n"
 ep3_travel_option_events.0001.pike_captain_camp_officer:0 "\"Servi como lanceiro na guarnição de [location.GetNameNoTooltip] por anos. Sei como as coisas funcionam — cravar o pé no chão, enfrentar o inimigo e aguardar a carga com uma vontade de aço.\"\n\n"
 ep3_travel_option_events.0001.poor:0 "\"Posso não ser o melhor, mas estou disposto.\" [local_character.GetSheHe|U] diz. \"Por apenas algumas moedas de ouro, eu me juntarei ao seu grupo.\""
 ep3_travel_option_events.0001.provisions:0 "Só posso te pagar com comida e roupas."
 ep3_travel_option_events.0001.quartermaster_camp_officer:0 "\"Organizei os armazéns de [location.GetNameNoTooltip] meticulosamente, mantenho listas e registros para contabilizar cada maçã, cebola e grão. Mas ficar aqui me entedia.\"\n\n"
 ep3_travel_option_events.0001.second_camp_officer:0 "\"Saudações, meu nome é [local_character.GetFullName]. Supervisiono a carga dos carros no mercado de [location.GetNameNoTooltip] há anos. Organizei dezenas de camponeses nos moinhos locais. Sim, o que eu ainda não fiz...\"\n\n"
 ep3_travel_option_events.0001.stooge_camp_officer:0 "\"Estou cansado de ser tratado como um cachorro! Ninguém me respeita aqui, todos riem assim que o nome '[local_character.GetFullName]' é pronunciado, tolos! [local_character.Custom2('InsultNoun', ROOT.Char)|U]! [ROOT.Char.Custom2('InsultNoun', ROOT.Char)|U]! #EMP Gaaaah, fico tão irritado — preciso sair daqui!#\"\n\n"
 ep3_travel_option_events.0001.t:0 "$adventurers_scout_for_talent_option$: Um Seguidor Disposto"
 ep3_travel_option_events.0001.terrible:0 "\"Tenha misericórdia deste pobre, inútil ser!\" [local_character.GetSheHe|U] implora. \"Farei qualquer coisa por uma moeda — até mesmo limpar as latrinas com um #EMP sorriso#!.\""
 ep3_travel_option_events.0001.travel_leader_court_position:0 "\"Olá! Você está perdido, viajante? Meu nome é [local_character.GetFullName], conheço bem essas terras. Pastoreio minhas ovelhas por essas belas [location.Custom('GetTerrainTypePlural')] todos os dias, mas meu coração pertence a estradas distantes. Ser um guia, um explorador — esse é meu sonho.\"\n\n"
 ep3_travel_option_events.0001.witness_camp_officer:0 "\"Ah, eu posso ver como você é grandioso! Como seu acampamento é grandioso! Este lugar, [location.GetNameNoTooltip], costumava ser bom — não mais, quero ir embora. Você é obviamente [ROOT.Char.Custom('ComplimentAdjective')], [ROOT.Char.Custom('RomanticComplimentAdjective')], um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] verdadeir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('RomanticComplimentNoun')]!\"\n\n"
 ep3_travel_option_events.0002.title:0 "[Select_CString( courtier_to_marry.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_marry'))|U] [courtier_to_marry.GetFirstName] se Casou com [Select_CString( marriage_material.IsFemale, 'a', 'o' )] [marriage_material.GetFirstName]"
 ep3_travel_option_events.0003.title:0 "[Select_CString( courtier_to_befriend.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_befriend'))|U] [courtier_to_befriend.GetFirstName] Fez Amizade com [Select_CString( friend_target.IsFemale, 'a', 'o' )] [friend_target.GetFirstName]"
 ep3_travel_option_events.0004.title:0 "[Select_CString( courtier_to_love.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier_to_love'))|U] [courtier_to_love.GetFirstName] e [Select_CString( pls_love_me.IsFemale, 'a', 'o' )] [pls_love_me.GetFirstName] se Tornaram Amantes"
 estate_mounts_option:0 "Cavalos Magníficos"
 estate_mounts_option_desc:0 "Você equipa toda a sua comitiva com os cavalos mais magníficos que o dinheiro pode comprar. E direto dos seus próprios estábulos, nada menos!"
 excellent.aptitude_tt:0 "A [aptitude|E] de [local_character.GetUINamePossessive] é $aptitude_excellent$"
 experienced_captains_option:0 "Contratar Capitães Experientes"
 experienced_captains_option_desc:0 "Você enviará uma mensagem em busca de capitães experientes para se juntarem ao seu séquito, reduzindo significativamente o perigo de viajar pelo mar e oceano."
 fancy_mounts_option:0 "Montarias Superiores"
 fancy_mounts_option_desc:0 "Seus estábulos experientes equipam seu séquito com as melhores montarias de todo o reino."
 forder_recruited.t:0 "Especialista em Terrenos Alagados Contratado"
 forder_recruited.tt:0 "Um guia com o traço [GetTrait('forder').GetName( GetNullCharacter )] se juntará ao seu séquito $temporary_travel_character_limit_tt$"
 good.aptitude_tt:0 "A [aptitude|E] de [local_character.GetUINamePossessive] é $aptitude_good$"
 heir_can_join_tt:0 "[heir_for_tooltip.GetName] está disponível para se juntar ao séquito"
 hire_allied_mercenaries_option:0 "Exército Particular"
 hire_allied_mercenaries_option_desc:0 "Um grupo misto de cavaleiros menores e mercenários locais, para garantir uma jornada rápida, segura e acessível."
 hire_desert_warrior_option:0 "Contratar Guerreiro do Deserto"
 hire_desert_warrior_option_desc:0 "Você enviará uma mensagem em busca de especialistas em terrenos desérticos para se juntarem ao seu séquito, reduzindo significativamente o perigo de viajar por terras secas e áridas."
 hire_experienced_mercenaries_option:0 "Contratar Guardas Mercenários"
 hire_experienced_mercenaries_option_desc:0 "Você contratará mercenários experientes para se juntarem ao seu séquito como guardas, aumentando a segurança e a velocidade geral."
 hire_forder_option:0 "Contratar Especialista em Terrenos Alagados"
 hire_forder_option_desc:0 "Você enviará uma mensagem em busca de especialistas em terrenos alagados para se juntarem ao seu séquito, reduzindo significativamente o perigo de viajar por terrenos alagados e planícies inundáveis."
 hire_jungle_expert_option:0 "Contratar Caçador de Selva"
 hire_jungle_expert_option_desc:0 "Você enviará uma mensagem em busca de especialistas em terrenos de selva para se juntarem ao seu séquito, reduzindo significativamente o perigo de viajar por terrenos de selva."
 hire_mountaineer_option:0 "Contratar Montanhista"
 hire_mountaineer_option_desc:0 "Você enviará uma mensagem em busca de especialistas em terrenos montanhosos para se juntarem ao seu séquito, reduzindo significativamente o perigo de viajar por picos altos."
 hire_rough_terrain_expert_option:0 "Contratar Guia de Floresta"
 hire_rough_terrain_expert_option_desc:0 "Você enviará uma mensagem em busca de especialistas em terrenos florestais para se juntarem ao seu séquito, reduzindo significativamente o perigo de viajar por florestas."
 jungle_stalker_recruited.t:0 "Caçador de Selva Contratado"
