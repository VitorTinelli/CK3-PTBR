l_spanish:
 defied_martial_custom_desc:0 "Este personagem ignorou os costumes sociais ao permitir que espadachins inadequados empunhassem a espada."
 defied_martial_custom_modifier:0 "Costume Marcial Desafiado"
 ep2_accolade_events.0100.a:0 "À caçada!"
 ep2_accolade_events.0100.desc.both:0 "meu [ROOT.Char.Custom2('RelationToMeShort', new_hunter_2)] [new_hunter_2.GetFirstName] e eu estamos aprendendo as formas das criaturas de [ROOT.Char.GetFaith.HighGodName]... e as formas de enganá-las."
 ep2_accolade_events.0100.desc.heir:0 "meu [ROOT.Char.Custom2('RelationToMeShort', new_hunter)] [new_hunter.GetFirstName] está aprendendo as formas das criaturas de [ROOT.Char.GetFaith.HighGodName]... e as formas de enganá-las."
 ep2_accolade_events.0100.desc.liege:0 "estou aprendendo as formas das criaturas de [ROOT.Char.GetFaith.HighGodName]... e as formas de enganá-las."
 ep2_accolade_events.0100.desc:0 "Perseguir cegamente uma criatura selvagem, lançando flecha após flecha ou esporeando com mais força?\n\n\"Fútil!\" ri [huntsmaster.GetName], meu renomado [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')].\n\nAs feras podem ser astutas. Elas sentem o perseguidor se aproximando, dispersam diante da matilha de caça e se tornam violentas quando encurraladas. Abater presas significa conhecê-las e conhecer bem sua natureza selvagem e, uma vez que o chifre é tocado, nunca desistir.\n\nO caçador mais habilidoso é [huntsmaster.GetFirstNameNoTooltip]. Em sua companhia,"
 ep2_accolade_events.0100.t:0 "A Arte do Caçador"
 ep2_accolade_events.0200.a:0 "Que nossos inimigos tremam!"
 ep2_accolade_events.0200.b.tt:0 "Afinal, o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] olha para o meu exemplo."
 ep2_accolade_events.0200.b:0 "Apenas aqueles que podem lutar precisam saber como."
 ep2_accolade_events.0200.desc.both:0 "Eu acalmo meu ataque, exausto.\n\n\"Sua mão conhece bem a espada, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz o [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')], \"assim como a de [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)]! Há uma arte em suas fúrias: algo para nutrir.\""
 ep2_accolade_events.0200.desc.both_not_martial:0 "Eu paro meu ataque, exausto.\n\n\"Sua mão conhece bem a espada, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz o [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')], \"e a de [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)] também. Eu poderia... treinar os dois, se assim desejarem?\"\n\nEu considero o cabo em meus dedos feridos. Devo desafiar minha origem?"
 ep2_accolade_events.0200.desc.heir:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', new_blademaster)] [new_blademaster.GetFirstName] acalma seu ataque, exausto.\n\n\"Sua mão conhece bem a espada, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz o [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]. \"Há uma arte em sua fúria: algo para nutrir.\""
 ep2_accolade_events.0200.desc.heir_not_martial:0 "Eu acalmo meu ataque, exausto.\n\n\"Sua mão conhece bem a espada, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz o [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')], \"assim como... a de [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)]. [new_blademaster_2.GetFirstName] perguntou se eu poderia treinar os dois.\"\n\nMeu herdeiro [new_blademaster_2.GetFirstName] deseja desafiar sua origem?"
 ep2_accolade_events.0200.desc.liege:0 "Eu acalmo meu ataque, exausto.\n\n\"Sua mão conhece bem a espada, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz o [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]. \"Há uma arte em sua fúria: algo para nutrir.\""
 ep2_accolade_events.0200.desc.liege_not_martial:0 "Eu acalmo meu ataque, exausto.\n\n\"Sua mão conhece bem a espada, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz o [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')], \"e a de [ROOT.Char.Custom2('RelationToMeShort', new_blademaster_2)] também. Eu poderia... treiná-la, assim como estou treinando [new_blademaster_2.GetSheHe], se assim desejar?\"\n\nEu considero a empunhadura em meus dedos feridos. Devo desafiar minha origem?"
 ep2_accolade_events.0200.desc:0 "\"Boa!\" exulta [acclaimed_blademaster.GetName]. #EMP \"De novo!\"#!\n\nEspada choca-se contra espada, vontade contra vontade. O novato na arte da espada só sente a necessidade de vitória, mas o habilidoso cavaleiro [acclaimed_blademaster.GetFirstNameNoTooltip] sorri enquanto desvia os golpes.\n\n"
 ep2_accolade_events.0200.t:0 "Afiado como a Lâmina"
 ep2_accolade_events.0300.a:0 "A noites animadas e aos frutos doces!"
 ep2_accolade_events.0300.desc.both:0 "Uma inspiração animada para meu herdeiro [new_reveler_2.GetFirstName] e eu."
 ep2_accolade_events.0300.desc.heir:0 "Uma inspiração animada para meu herdeiro [new_reveler_2.GetFirstName]."
 ep2_accolade_events.0300.desc.liege:0 "Encontro-me inspirado."
 ep2_accolade_events.0300.desc:0 "Sentado ao meu lado na refeição da manhã, meu [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] [master_of_revels.GetFirstName] me encanta com visões raras sobre cortesãos, conta contos espetaculares e absurdos, e faz uma quantidade impressionante de comida e bebida desaparecerem.\n\n\"Os frutos da vida estão ao alcance de todos, minha [ROOT.Char.GetTitleTierName],\" diz [master_of_revels.GetSheHe], \"Maduros nos galhos, provados apenas ao escalá-los sem pensar nas consequências.\"\n\nO deleite de [master_of_revels.GetFirstNameNoTooltip] pelos frutos da vida é assunto de todos. Sempre [master_of_revels.GetSheHe] reúne amizade e fascínio, despreocupadamente.\n\n"
 ep2_accolade_events.0300.t:0 "O Credo do Encantador de Multidões"
