l_spanish:
 daring_scout_modifier:0 "Escoteiro Audaz"
 daring_scout_modifier_desc:0 "Este personagem viaja com um corredor intrépido explorando o caminho à frente."
 deft_cavalrymen_modifier:0 "Cavaleiros Audazes"
 deft_cavalrymen_modifier_desc:0 "Os cavaleiros deste personagem galopam pelo campo de batalha em alta velocidade, com destreza praticada."
 feeble_presence_modifier:0 "Presença Frágil"
 feeble_presence_modifier_desc:0 "O senhor feudal deste condado não demonstrou habilidade para controlar a multidão."
 generous_to_knights_modifier:0 "Generoso com Cavaleiros"
 generous_to_knights_modifier_desc:0 "[contest_aptitude|E]: +5"
 safeguards_knightly_honor_modifier:0 "Protege a Honra dos Cavaleiros"
 safeguards_knightly_honor_modifier_desc:0 "O respeito deste personagem pelos códigos que unem os nobres guerreiros parece inabalável."
 speeches_and_games_modifier:0 "Discursos e Jogos"
 speeches_and_games_modifier_desc:0 "O senhor feudal deste condado, com esplendor e carisma, dominou as massas indomáveis."
 tournament_ambidextrous_modifier:0 "Ambidestro"
 tournament_ambidextrous_modifier_desc:0 "A habilidade deste personagem com uma lâmina em ambas as mãos lhe dá uma vantagem surpreendente ao cruzar espadas."
 tournament_ambisinister_modifier:0 "Ambisinistro"
 tournament_ambisinister_modifier_desc:0 "A falta de jeito deste personagem se mostrou notável."
 tournament_annoyed_locals_modifier:0 "Locais Aborrecidos"
 tournament_annoyed_locals_modifier_desc:0 "A multidão deste condado teve que passar seu tempo ouvindo pregações quando estava tentando assistir a um torneio."
 tournament_bracer_modifier:0 "Braçadeira Fina"
 tournament_bracer_modifier_desc:0 "Este personagem comprou uma braçadeira de arqueiro em um Torneio para ajudar suas habilidades."
 tournament_charm_resistant_modifier:0 "Resistente ao Encanto"
 tournament_charm_resistant_modifier_desc:0 "Este personagem parece ser um tanto resistente aos encantos amorosos."
 tournament_child_friendly_modifier:0 "Amigo das Crianças"
 tournament_child_friendly_modifier_desc:0 "Este personagem tem um verdadeiro talento para se conectar com as crianças."
 tournament_ended_rightly_modifier:0 "Finalizado Corretamente"
 tournament_ended_rightly_modifier_desc:0 "Este personagem foi constrangido em um duelo, pois seu oponente o humilhou jogando o cabo solto de uma espada nele!"
 tournament_farrier_mistake_modifier:0 "Cavalo Ferido por Ferreiro"
 tournament_farrier_mistake_modifier_desc:0 "A trapalhada de um aprendiz temporariamente deixou o cavalo favorito deste personagem manco.\n\n#weak A aptidão do Concurso Pessoal de Cavalos foi levemente diminuída.#!"
 tournament_fashionable_duelist_modifier:0 "Duelista Fashion"
 tournament_fashionable_duelist_modifier_desc:0 "As escolhas de vestuário deste personagem em um duelo podem não ser particularmente propícias à vitória, mas certamente ficam bem."
 tournament_foreign_knight_modifier:0 "Cavaleiro Estrangeiro Apoiado"
 tournament_foreign_knight_modifier_desc:0 "Este personagem apoiou um impressionante cavaleiro estrangeiro, ganhando respeito aos olhos dos estrangeiros, mas causando consternação em outros."
 tournament_grounded_modifier:0 "Com os Pés no Chão"
 tournament_grounded_modifier_desc:0 "Este personagem não tem interesse pela fama e não se interessa por quem busca as aparências dela."
 tournament_house_unity_modifier:0 "Unidade da Casa"
 tournament_house_unity_modifier_desc:0 "Esta Casa provou sua coragem no combate corpo a corpo, recebendo reconhecimento de outros como um exemplo primordial de uma frente unida."
 tournament_loving_parent_modifier:0 "Pai/Mãe Amoroso(a)"
 tournament_loving_parent_modifier_desc:0 "Este personagem provou ser um pai/mãe amoroso(a), pelo menos para seu herdeiro."
 tournament_low_blower_modifier:0 "Jogador Desleal"
 tournament_low_blower_modifier_desc:0 "Este personagem desenvolveu certa reputação por jogar de forma desleal no ringue de duelos."
 tournament_melee_protector_modifier:0 "Protetor do Combate Corpo a Corpo"
 tournament_melee_protector_modifier_desc:0 "As costas deste personagem estão sendo protegidas por uma pessoa surpreendente.\n\n#weak Este modificador durará até o final do Concurso de Combate Corpo a Corpo.#!"
 tournament_performative_sensuousness_modifier:0 "Sensualidade Performática"
 tournament_performative_sensuousness_modifier_desc:0 "Quando diante de uma plateia, este personagem tende a mover seu corpo de uma maneira... arrebatadora."
 tournament_poorly_announced_modifier:0 "Anunciado de Forma Inadequada"
 tournament_poorly_announced_modifier_desc:0 "Este personagem investiu em arautos bastante deficientes."
 tournament_public_proselytiser_modifier:0 "Evangelizador Público"
 tournament_public_proselytiser_modifier_desc:0 "Este personagem provou sua piedade ao pregar para a multidão em um Torneio."
 tournament_reckoning_modifier:0 "Um Acerto de Contas"
 tournament_reckoning_modifier_desc:0 "Este personagem pagará por sua ganância em algum momento no futuro. Eles não sabem quando, apenas que irão pagar."
 tournament_roguish_duelist_modifier:0 "Duelista Trapaceiro"
 tournament_roguish_duelist_modifier_desc:0 "O charme e a malícia deste personagem com uma espada na mão enfurecem competidores e fascinam espectadores."
 tournament_soaked_modifier:0 "Encharcado"
 tournament_soaked_modifier_desc:0 "Este personagem ficou completamente molhado depois que alguém derramou uma bebida sobre eles, deixando-os com um cheiro estranho."
 tournament_sports_enthusiast_modifier:0 "Entusiasta de Esportes"
 tournament_sports_enthusiast_modifier_desc:0 "O entusiasmo deste personagem pelos eventos esportivos transparece o tempo todo."
 tournament_star_struck_modifier:0 "Fascinado pelas Estrelas"
 tournament_star_struck_modifier_desc:0 "Este personagem fica encantado com todo o brilho e glamour de ver uma figura famosa."
 tournament_two_bracers_modifier:0 "Braçadeiras Duplas"
 tournament_two_bracers_modifier_desc:0 "Este personagem estranhamente comprou uma braçadeira de arqueiro para cada braço, algo que ele defende veementemente, mas que fez mais de um espectador rir silenciosamente."
 tournament_well_proclaimed_modifier:0 "Bem-Anunciado"
 tournament_well_proclaimed_modifier_desc:0 "Este personagem se beneficia de um arauto bem treinado e experiente."
 unwilling_tourneyer_modifier:0 "Torneio Relutante"
 unwilling_tourneyer_modifier_desc:0 "[contest_aptitude|E]: -10"
