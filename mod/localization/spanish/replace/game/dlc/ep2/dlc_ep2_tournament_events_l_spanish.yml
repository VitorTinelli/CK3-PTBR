 ep2_tournament_events.5505.t:0 "$tournament_contest_header$ Aproveitando uma Oportunidade"
 ep2_tournament_events.5505.torturer:0 "...a carne de [enemy.GetFirstNamePossessive] está pronta para ser esfolada!"
 ep2_tournament_events.6501.a.tt.lose:0 "Você escorrega e cai"
 ep2_tournament_events.6501.a.tt.win:0 "Você acerta o alvo equilibrando-se em uma perna em uma cerca"
 ep2_tournament_events.6501.a:0 "Serei lembrado por várias gerações!"
 ep2_tournament_events.6501.b.tt.lose:0 "Você erra"
 ep2_tournament_events.6501.b.tt.win:0 "Você acerta o alvo vendado"
 ep2_tournament_events.6501.b:0 "Vou dar a eles algo para aplaudir!"
 ep2_tournament_events.6501.c:0 "Pensando bem..."
 ep2_tournament_events.6501.desc:0 "Uma brisa suave percorre o campo enquanto outro competidor faz seu arremesso. A multidão está respeitosa e quieta. Sinceramente, um pouco #EMP até#! quieta e respeitosa demais. Quase imagino que posso ouvir um bocejo no meio dos aplausos educados quando a corda do arco estala e a flecha acerta em cheio.\n\nEu avanço para fazer minha vez. Mais aclamação gentil e dispersa segue. Mal se trata de uma reunião dinâmica.\n\nEnquanto encaixo uma flecha, uma ideia - não uma ideia especialmente sólida, mas uma empolgante - surge em meus pensamentos.\n\nVamos ver se eles bocejam com isso!"
 ep2_tournament_events.6501.t:0 "$tournament_contest_header$ Fama e Fortuna"
 ep2_tournament_events.6502.a.tt:0 "Sim, ajudar você a se levantar. Com #EMP aquele#! braço..."
 ep2_tournament_events.6502.a:0 "Bem, vamos ajudar você a se levantar!"
 ep2_tournament_events.6502.b.tt.failure:0 "[physician.GetFirstNameNoTooltip] não pode ajudar muito"
 ep2_tournament_events.6502.b.tt.success:0 "[physician.GetFirstNameNoTooltip] se sai muito bem"
 ep2_tournament_events.6502.b:0 "Chamem meu médico!"
 ep2_tournament_events.6502.c:0 "Vamos encontrar ajuda para você."
 ep2_tournament_events.6502.d:0 "O tolo deveria ter segurado com mais força."
 ep2_tournament_events.6502.desc:0 "As visões e sons de um torneio sempre são impressionantes. O choque da lança no escudo corta o barulho dos cascos trovejantes enquanto os cavalos esperam relinchar e bufar.\n\nÉ enquanto estou ouvindo atentamente que outro som ecoa pelo campo. Um grito curto e agudo antecede o som de uma comoção. Eu me apresso para me juntar a ela.\n\nUm grupo de pessoas cerca [versus_contestant.GetFirstName], que claramente caiu de seu cavalo antes de sua luta. O seu braço está pendurado em um ângulo bastante horrível; uma pequena sorte, então, que [versus_contestant.GetSheHe] também pareça bastante atordoada."
 ep2_tournament_events.6502.t:0 "$tournament_contest_header$ Braço e Perna"
 ep2_tournament_events.6503.a:0 "Dêem espaço! Eu tenho meus ungüentos."
 ep2_tournament_events.6503.b:0 "Chamem um médico!"
 ep2_tournament_events.6503.c:0 "Isso não é problema meu."
 ep2_tournament_events.6503.desc:0 "Observo com olhos treinados enquanto [competitor1.GetFirstName] inicia sua abordagem em direção aos alvos. O primeiro disparo voa certeiro e atinge em cheio. O segundo foi mais desviado. #EMP Muito#! mais desviado.\n\nUm grito agudo, um grito demoníaco, perfura o ar. A segunda flecha não apenas errou o alvo, mas voou tão longe que acertou em cheio um grupo de competidores aguardando. Acertou, de fato, [competitor2.GetFirstName]!\n\nUma multidão se aglomera em torno do atingido [competitor2.GetWomanMan]. [competitor2.GetSheHe|U] está deitado de costas, segurando sua ferida em um esforço vão de conter o sangue, a flecha ainda cravada até a metade da mão na sua carne."
 ep2_tournament_events.6503.t:0 "$tournament_contest_header$ Erro Desastroso"
