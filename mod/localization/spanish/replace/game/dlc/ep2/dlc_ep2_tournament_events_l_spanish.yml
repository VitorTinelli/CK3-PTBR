l_spanish:
 ep2_tournament_events.0001.a.tt:0 "Seu movimento determina se seu oponente está blefando ou não"
 ep2_tournament_events.0001.a:0 "Se eu desviar para a direita aqui, vou descobrir..."
 ep2_tournament_events.0001.b.tt.lose:0 "[versus_contestant.GetFirstNameNoTooltip] estava blefando"
 ep2_tournament_events.0001.b.tt.win:0 "A perna [versus_contestant.GetFirstNamePossessiveNoTooltip] está machucada"
 ep2_tournament_events.0001.b:0 "\"Hah! Agora eu tenho você!\""
 ep2_tournament_events.0001.c:0 "[versus_contestant.GetFirstNamePossessiveNoTooltip] está blefando. Vou lutar a minha própria luta."
 ep2_tournament_events.0001.desc:0 "Afastando um pouco a sujeira dos meus olhos, me mantenho firme enquanto os gritos da multidão ecoam ao meu redor. [versus_contestant.GetFirstName] está um pouco distante, ambos tendo se separado brevemente para recuperar o fôlego.\n\nO clamor dos espectadores diminui um pouco quando começamos a nos cercar lentamente. Um movimento errado poderia encerrar essa luta em um instante. Os olhos [versus_contestant.GetFirstNamePossessiveNoTooltip] se estreitam quase imperceptivelmente.\n\nEnquanto nos cercamos, eu percebo uma pequena nuvem de poeira sendo levantada sob o pé direito [versus_contestant.GetFirstNamePossessiveNoTooltip] sempre que [versus_contestant.GetSheHe] dá um passo. É como se [versus_contestant.GetFirstNameNoTooltip] estivesse... mancando um pouco?"
 ep2_tournament_events.0001.t:0 "$tournament_versus_header$ Um Combatente Aflito"
 ep2_tournament_events.0002.a.tt:0 "Flexione-se para a multidão!"
 ep2_tournament_events.0002.a:0 "#EMP Isso#! é o que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] #EMP verdadeir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#! [ROOT.Char.GetWomanMan] parece!"
 ep2_tournament_events.0002.b:0 "Enfrente-me, covarde!"
 ep2_tournament_events.0002.c.tt:0 "Ataque-os por trás"
 ep2_tournament_events.0002.c:0 "Vou ensinar [versus_contestant.GetSheHe] a não me dar as costas!"
 ep2_tournament_events.0002.desc:0 "#EMP Thunk!#!\n\nMeu corpo bate contra a parede de madeira na beira da arena, [versus_contestant.GetFirstName] me jogando lá com um rosnado. Mal [versus_contestant.GetSheHe] faz isso, rosto de [versus_contestant.GetFirstNamePossessiveNoTooltip] se transforma em um sorriso convencido, e para minha surpresa, [versus_contestant.GetSheHe] vira completamente as costas para mim.\n\nLevantando os braços para a multidão em alvoroço, [versus_contestant.GetSheHe] curva os braços e faz poses imitando um artista circense. Os aplausos da multidão se intensificam; aqueles camponeses inconstantes estão adorando!"
 ep2_tournament_events.0002.t:0 "$tournament_versus_header$ Jogando para a Multidão"
 ep2_tournament_events.0003.a:0 "Você é um covarde e uma vergonha!"
 ep2_tournament_events.0003.b:0 "Eu entendo. Por favor, levante-se; essa luta acabou."
 ep2_tournament_events.0003.c:0 "Seus ferimentos parecem sérios. Vamos encontrar um médico para você."
 ep2_tournament_events.0003.d:0 "Nunca me desafie novamente!"
 ep2_tournament_events.0003.desc.craven:0 "Embora as feridas de [versus_contestant.GetFirstNamePossessiveNoTooltip] neste torneio sejam evidentes, a maneira como [versus_contestant.GetSheHe] evita meus olhos e treme enquanto implora trai a verdadeira razão para a rendição: simples covardia."
 ep2_tournament_events.0003.desc.dread:0 "Posso perceber pelos tremores no seu corpo que não é apenas minha habilidade que causa tamanha perda de luta. [versus_contestant.GetFirstNameNoTooltip] teme a mim."
 ep2_tournament_events.0003.desc.wounded:0 "A dor está claramente estampada no rosto de [versus_contestant.GetFirstNamePossessiveNoTooltip]. [versus_contestant.GetSheHe] não é covarde, mas seria imprudente continuar."
 ep2_tournament_events.0003.desc:0 "A poeira se ergue ao redor do corpo de [versus_contestant.GetFirstNamePossessive] enquanto [versus_contestant.GetSheHe] cai para trás na terra. Estou vencendo essa luta, e todos sabem disso.\n\nEm meio à cacofonia de ruídos da multidão, [versus_contestant.GetFirstName] se arrasta de joelhos e estende os dois braços.\n\n\"Chega! Já tive o bastante. Chega.\" [versus_contestant.GetSheHe] declara."
 ep2_tournament_events.0003.e:0 "Você deve se orgulhar de sua luta, [versus_contestant.GetFirstNameNoTooltip]."
 ep2_tournament_events.0003.t:0 "$tournament_versus_header$ Clemência Contestada"
 ep2_tournament_events.0004.a:0 "[versus_contestant.GetFirstNameNoTooltip], como você pôde?"
 ep2_tournament_events.0004.b.failure:0 "[watching_crowd.GetFirstNameNoTooltip] não te perdoa"
 ep2_tournament_events.0004.b.success:0 "[watching_crowd.GetFirstNameNoTooltip] aceita suas desculpas"
 ep2_tournament_events.0004.b:0 "[watching_crowd.GetFirstNameNoTooltip]! Você está bem?"
 ep2_tournament_events.0004.c.tt:0 "Aproveite para atacar enquanto [versus_contestant.GetSheHe] está distraído!"
 ep2_tournament_events.0004.c:0 "Bem, não há tempo a perder..."
 ep2_tournament_events.0004.desc:0 "Minha lâmina colide com a do meu oponente [versus_contestant.GetFirstNamePossessive], faíscas voam enquanto as duas armas rangem. Ambos recuamos, circulando para a esquerda.\n\n[versus_contestant.GetFirstNameNoTooltip|U] me ataca, a ponta da espada batendo no chão depois de passar pelo meu corpo. Rápido como uma víbora, dou um passo à frente e a chuto com toda força. Arrancada de suas mãos, a espada de [versus_contestant.GetFirstNamePossessiveNoTooltip] gira pelo ar, pousando — para horror de ambos — entre a multidão!\n\nUm grito agudo corta o ar, e ambos corremos para ver [watching_crowd.GetFirstName] de joelhos, a espada voadora tendo atingido diretamente o seu braço."
 ep2_tournament_events.0004.t:0 "$tournament_versus_header$ Morte Vinda de Cima"
 ep2_tournament_events.0005.a:0 "Hah! Agora eu te peguei!"
 ep2_tournament_events.0005.b:0 "Oh! Desculpe! Eu não quis fazer isso!"
 ep2_tournament_events.0005.c:0 "Ah. Sim. Eu tinha esquecido disso."
 ep2_tournament_events.0005.eunuch:0 "Meu golpe seguinte, um balanço contundente, apenas faz barulho ao atingir a arma de [versus_contestant.GetFirstNamePossessiveNoTooltip]. Isso o faz recuar, mas meus ombros caem quando lembro de um detalhe particular sobre [versus_contestant.GetFirstNameNoTooltip]...\n\n\"Não adianta muito me chutar lá, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [versus_contestant.GetSheHe|U] diz, balançando a cabeça. \"Pelo menos desde que aconteceu.\"\n\n #EMP Claro.#! [versus_contestant.GetFirstNameNoTooltip] é um eunuco!"
 ep2_tournament_events.0005.pain:0 "[versus_contestant.GetFirstNameNoTooltip] solta um grito entre um suspiro, uma tosse e um gemido. Dedos trêmulos mal seguram a arma enquanto seus olhos imediatamente se fecham de dor. Em questão de segundos, [versus_contestant.GetSheHe] está curvado, mal conseguindo ficar em pé."
 ep2_tournament_events.0005.start:0 "Eu balanço e balanço novamente, golpeando a guarda de [versus_contestant.GetFirstNamePossessive]. Um empurrão vigoroso com o ombro faz [versus_contestant.GetHerHim] escorregar para trás, com as pernas abertas, e vejo uma oportunidade de ouro. Agindo totalmente por instinto, balanço minha perna num arco longo, o pé batendo com um pesado #EMP thud#! na sua virilha.\n\n"
 ep2_tournament_events.0005.t:0 "$tournament_versus_header$ De Qualquer Maneira"
 ep2_tournament_events.0006.a.toast:0 "Um cabo lançado atinge seu rosto!"
 ep2_tournament_events.0006.a.tt:0 "Use o cabo como um projétil!"
 ep2_tournament_events.0006.a:0 "Finalmente! Uma chance!"
 ep2_tournament_events.0006.b.tt:0 "Melhor chutar um [versus_contestant.GetWomanMan] quando estão caídos..."
 ep2_tournament_events.0006.b:0 "Ataque, canalha!"
 ep2_tournament_events.0006.c:0 "É melhor deixá-los se levantarem."
 ep2_tournament_events.0006.desc:0 "O rangido do aço contra o aço ecoa pela área enquanto [versus_contestant.GetFirstName] e eu nos golpeamos. À medida que [versus_contestant.GetSheHe] recua, eu sigo, e outro estrondo sonoro de nossas lâminas envia vibrações pelo meu braço.\n\nDe repente, uma chance: [versus_contestant.GetFirstNameNoTooltip] escorrega, seu pé desliza, e eu empurro meu ombro contra o esterno de [versus_contestant.GetHerHim], fazendo [versus_contestant.GetHerHim] cair.\n\n[versus_contestant.GetFirstNameNoTooltip|U] demora para se recuperar, e de repente minha mente volta aos manuais de treinamento nos quais passei horas aprendendo e às coisas fantasiosas que eles sugeriam fazer caso uma vantagem clara aparecesse.\n\nQuase inconscientemente, começo a desenroscar o cabo da minha arma..."
 ep2_tournament_events.0006.t:0 "$tournament_versus_header$ Uma Abertura"
 ep2_tournament_events.0007.a:0 "Cem moedas, você diz?"
 ep2_tournament_events.0007.b:0 "Digamos que dispensamos o ouro, mas adicionamos uma obrigação..."
 ep2_tournament_events.0007.c:0 "Você não pode comprar sua saída desta vez, [versus_contestant.GetFirstNameNoTooltip]."
 ep2_tournament_events.0007.desc:0 "Há poucas alegrias tão grandes quanto vencer facilmente um duelo. [versus_contestant.GetFirstName|U] se arrasta para trás pelo terreno irregular, os golpes da minha arma mal desviados enquanto eu avanço. Um último golpe estrondoso prende-se à sua guarda, e [versus_contestant.GetSheHe] agarra meu braço desesperadamente. Eu sorrio com um sorriso crispado.\n\n\"Espera. #EMP Espera!#!\" [versus_contestant.GetFirstNameNoTooltip] sussurra-grita para mim enquanto lutamos, as lâminas ainda travadas juntas. \"Escute-me. Eu preciso dessa vitória!\" Meio encolher de ombros deixa [versus_contestant.GetSheHe] ainda mais em pânico.\n\n\"Pare! Eu sou um(a) [versus_contestant.GetWomanMan] rico(a). Por favor, posso tornar isso valioso para você. C-... cem moedas para você ceder!\""
 ep2_tournament_events.0007.t:0 "$tournament_versus_header$ Um Centavo Por Seu..."
 ep2_tournament_events.0010.a.failure:0 "[versus_contestant.GetFirstNameNoTooltip] estava blefando"
 ep2_tournament_events.0010.a.success:0 "Seu contra-ataque funciona"
 ep2_tournament_events.0010.a:0 "Agora eu te peguei!"
 ep2_tournament_events.0010.b.success:0 "Seu bloqueio tem sucesso"
 ep2_tournament_events.0010.b:0 "Prefiro bloquear a arriscar um contra-ataque."
 ep2_tournament_events.0010.c.tt:0 "Um simples passo lateral cede a posição, mas a discrição é a melhor parte da coragem aqui."
 ep2_tournament_events.0010.c:0 "É melhor viver para lutar outro dia."
 ep2_tournament_events.0010.desc:0 "O tempo parece desacelerar enquanto a espada de [versus_contestant.GetFirstNamePossessive] desce do alto, a lâmina cantando pelo ar. Não é um golpe insignificante; se eu ficar onde estou, me causará mais do que ferimentos suficientes.\n\nA questão deveria ser simples, já que um ataque tão descontrolado deixa seu iniciador vulnerável a um contra-ataque, mas há uma sensação persistente em minha mente. A careta-rosnado que [versus_contestant.GetFirstNameNoTooltip] tinha quando [versus_contestant.GetSheHe] lançou o golpe era compreensível dada a força, mas eu imaginei ver o mínimo lampejo de satisfação nela. Os seus olhos, também, quase pareciam se mover em direção ao meu lado enquanto [versus_contestant.GetSheHe] preparava o movimento. Será que tudo isso é um blefe?\n\nO golpe se aproxima de mim. É hora de agir."
 ep2_tournament_events.0010.t:0 "$tournament_versus_header$ Apostas Calculadas"
 ep2_tournament_events.0011.a.tt:0 "Minha mão esquerda é tão boa quanto a direita!"
 ep2_tournament_events.0011.a:0 "\"Hah! Você acha que eu só treino com uma mão?!\""
 ep2_tournament_events.0011.b.criticalfailure:0 "Você solta completamente a arma"
 ep2_tournament_events.0011.b.failure:0 "[versus_contestant.GetFirstNameNoTooltip] não está preocupado(a)"
 ep2_tournament_events.0011.b.success:0 "Sua estratégia tem sucesso"
 ep2_tournament_events.0011.b.tt:0 "Hora de ver se as lições com a mão não dominante valeram a pena..."
 ep2_tournament_events.0011.b:0 "Não há outra opção."
 ep2_tournament_events.0011.c.failure:0 "Sua mão ferida desiste"
 ep2_tournament_events.0011.c.opinion:0 "Todos os espectadores ganham #COLOR_GREEN 5#! opinião sobre você"
 ep2_tournament_events.0011.c.success:0 "Você luta com determinação"
 ep2_tournament_events.0011.c.tt:0 "Adotar uma postura de duas mãos pode aliviar um pouco da dor, mas não ajudará muito se minha mão estiver realmente danificada..."
 ep2_tournament_events.0011.c:0 "Seja o que for, eu não recuo!"
 ep2_tournament_events.0011.desc:0 "Acontece em um piscar de olhos. Enquanto nossas lâminas se chocam estrondosamente, a empunhadura da arma de [versus_contestant.GetFirstNamePossessive] desliza, batendo nas costas da minha mão segurando a espada. Recuando para ganhar algum espaço, seguro minha mão com a outra livre, a espada sendo segurada de forma frouxa na minha frente.\n\nA dor latejante irradia pelo meu braço enquanto mexo os dedos curiosamente. Parece não estar gravemente danificada — se é que está —, mas a inspeção é difícil enquanto eu me esquivo para trás para evitar um golpe do avançando [versus_contestant.GetFirstNameNoTooltip]. [versus_contestant.GetSheHe|U] sorri, claramente vendo uma vantagem, e desfere outro golpe que passa perto do meu flanco.\n\nEu não posso simplesmente desviar para sempre. Minha mão precisará ser cuidada, de uma maneira ou de outra."
 ep2_tournament_events.0011.t:0 "$tournament_versus_header$ Uma Opção Útil"
 ep2_tournament_events.0012.a:0 "Vou mostrar como eu luto com estilo!"
 ep2_tournament_events.0012.arrogant:0 "Na verdade, posso dizer que não aprecio em absoluto. Como ousa [versus_contestant.GetSheHe] zombar de mim e das minhas vestes #EMP fabulosas#!?"
 ep2_tournament_events.0012.b.tt:0 "Vamos ver como [versus_contestant.GetSheHe] luta com uma capa lançada em seu rosto!"
 ep2_tournament_events.0012.b:0 "É #EMP claro#! que não vou lutar com isso - hyah!"
 ep2_tournament_events.0012.c.tt:0 "Sinceramente, uma 'capa de duelo'? O que eu estava #EMP pensando?!#!"
 ep2_tournament_events.0012.c:0 "Claro que não. Por favor, um momento."
 ep2_tournament_events.0012.d:0 "Todos os grandes lutam assim, [versus_contestant.Custom2('InsultNoun', ROOT.Char)]!"
 ep2_tournament_events.0012.desc:0 "Enquanto avanço para enfrentar [versus_contestant.GetFirstName], [versus_contestant.GetSheHe] pausa e abaixa sua arma. Minha capa esvoaça ao meu redor na brisa leve.\n\n\"Você... vai continuar usando isso?\" [versus_contestant.GetSheHe|U] pergunta, seu rosto uma máscara de confusão e uma boa dose de suspeita. \"Não estou aqui para julgar, é claro. Tenho certeza de que você está muito #EMP fashion.#!\"\n\nNão tenho certeza se aprecio aquele seu sorriso repentino."
 ep2_tournament_events.0012.intrigue:0 "Olhando além do meu adversário, avisto uma mulher na multidão lutando com um cachecol desgarrado enquanto o vento sopra novamente. O plano é lento para se formar, mas se forma..."
 ep2_tournament_events.0012.t:0 "$tournament_versus_header$ Assumindo o Manto"
 ep2_tournament_events.0020.a.tt:0 "Bem alto, para que todos possam ouvir!"
 ep2_tournament_events.0020.a:0 "\"O que é isso, [versus_contestant.GetFirstNameNoTooltip]? Você fez #EMP o quê?!#!\""
 ep2_tournament_events.0020.b.tt:0 "Sussurre; um segredo contado a todos não tem mais força!"
 ep2_tournament_events.0020.b:0 "Eu sei o que você fez, [versus_contestant.GetFirstNameNoTooltip]!"
 ep2_tournament_events.0020.c.failure:0 "[versus_contestant.GetFirstNameNoTooltip] não é distraído(a) por suas palavras"
 ep2_tournament_events.0020.c.success:0 "[versus_contestant.GetFirstNameNoTooltip] é distraído(a) por suas palavras"
 ep2_tournament_events.0020.c:0 "Falar sempre foi uma de minhas habilidades."
 ep2_tournament_events.0020.d:0 "Devo me concentrar na luta."
 ep2_tournament_events.0020.desc:0 "Uma brisa leve agita o ar ao nosso redor enquanto [versus_contestant.GetFirstName] se aproxima de mim, espada pronta. Procuro por qualquer vantagem, como todo bom duelista faz. Sem terreno irregular, sem sol baixo para cegar [versus_contestant.GetSheHe], sem fraquezas na postura [versus_contestant.GetHerHim]. Me preparo para lutar de forma justa.\n\nUm grito da multidão — algum tolo caindo de um banquinho, sem dúvida — faz [versus_contestant.GetFirstNameNoTooltip] pausar. [versus_contestant.GetSheHe|U] se refoca em mim, de forma nervosa. Dizem que alguns precisam estar livres de distrações para lutar. Talvez [versus_contestant.GetFirstNameNoTooltip] seja um(a) desses [versus_contestant.GetWomanMan]?"
 ep2_tournament_events.0020.secret:0 "\n\nQuase sem ser convidado, um pequeno conhecimento salta em minha cabeça. Não era [versus_contestant.GetSheHe] quem... ah, sim. Sim, de fato!"
 ep2_tournament_events.0020.t:0 "$tournament_versus_header$ Diálogo de Luta"
 ep2_tournament_events.0021.a:0 "\"Verdadeiramente, você fala até mais do que [family.GetFirstNameNoTooltip] fazia.\""
 ep2_tournament_events.0021.b:0 "\"[versus_contestant.Custom2('InsultNoun', ROOT.Char)|U], eu já #EMP fiz#! t[Select_CString( versus_contestant.IsFemale, 'ua', 'eu' )] [versus_contestant.Custom2('RelationToMeShort', SCOPE.sC('family'))]!\""
 ep2_tournament_events.0021.c:0 "Provavelmente é melhor não provocar [versus_contestant.GetSheHe]..."
 ep2_tournament_events.0021.desc:0 "A espada de [versus_contestant.GetFirstName] raspa ao longo da minha, faíscas se espalhando enquanto eu recuo. [versus_contestant.GetSheHe|U] sorri sombriamente quando minhas costas atingem o limite da arena, e [versus_contestant.GetSheHe] circula para me cercar contra a barreira. Eu preciso de qualquer vantagem.\n\nDe repente, deliciosamente, um fragmento de realização emerge em minha mente. Como fui tolo! De todas as coisas para esquecer! Talvez agora seja a hora de usá-la...\n\n\"Você está pronto, [ROOT.Char.GetFirstName]?\" [versus_contestant.GetSheHe|U] resmunga, brandindo sua arma. \"Parece que você está prestes a terminar para mim.\""
 ep2_tournament_events.0021.t:0 "$tournament_versus_header$ Qualquer Vantagem"
 ep2_tournament_events.1001.a:0 "Pare, malditos! Trégua!"
 ep2_tournament_events.1001.b:0 "Se eles estão lutando aqui, eu também vou lutar."
 ep2_tournament_events.1001.c.failure:0 "Ninguém escuta"
 ep2_tournament_events.1001.c.success:0 "O combate corpo a corpo cessa por agora"
 ep2_tournament_events.1001.c:0 "#EMP Chega!#! Trégua!"
 ep2_tournament_events.1001.d:0 "Talvez seja hora de partir."
 ep2_tournament_events.1001.desc:0 "Em meio ao sangue e ao estrondo do combate corpo a corpo, é quase impossível manter o seu rumo. A massa de competidores se agita e balança - um amontoado incontrolável de humanidade. Ai daquele que ousar ficar em seu caminho! É claro que um camponês infeliz precisa apenas se afastar com pressa para evitar a briga. O problema é um pouco mais pronunciado, eu considero, quando a vítima é um prédio.\n\nO combate corpo a corpo se espalhou pela [activity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] adequada, e mesmo agora posso ver competidores de ambos os lados arrancando pedaços da fachada do prédio para usar como escudos rudimentares ou até mesmo como mísseis. Acho que consigo até ouvir o crepitar das chamas ao longe..."
 ep2_tournament_events.1001.t:0 "$tournament_contest_header$ Prédios em Chamas"
 ep2_tournament_events.1002.a:0 "Talvez eu possa ajudar a reconstruir?"
 ep2_tournament_events.1002.b.tt:0 "Esta opção está disponível devido à sua reputação [Concept('dread', 'Medonha')|E]"
 ep2_tournament_events.1002.b:0 "Você tem muita audácia, [mayor.GetFirstNameNoTooltip]."
 ep2_tournament_events.1002.c:0 "Tudo bem, tudo bem, eu pagarei."
 ep2_tournament_events.1002.d:0 "Desapareça! Eu preciso descansar!"
 ep2_tournament_events.1002.desc:0 "Eu me desvencilho do tumulto do combate corpo a corpo, voltando em direção ao acampamento, mas logo percebo uma presença irritada se aproximando rapidamente.\n\n\"O que você tem a dizer em sua defesa?!\" Minha expressão desconcertada claramente trai minha confusão com a pergunta, e a sua expressão se torna ainda mais sombria. \"Minha vila está em #EMP ruínas!#!\"\n\nO(a) bem-vestido(a) [mayor.GetWomanMan] — [mayor.GetFirstName], como [mayor.GetSheHe] se apresenta com irritação — é o(a) prefeito(a) do assentamento, agora bastante desolado, e claramente me culpa pela situação.\n\n\"Bem? O que você vai fazer a respeito? Vamos perder #EMP tudo#! no próximo inverno!\""
 ep2_tournament_events.1002.t:0 "$tournament_contest_header$ Projeto de Reconstrução"
 ep2_tournament_events.1003.a.tt.failure:0 "A arma é chutada ainda mais para longe"
 ep2_tournament_events.1003.a.tt.success:0 "Você consegue recuperá-la com sucesso"
 ep2_tournament_events.1003.a:0 "Ah! Minha arma!"
 ep2_tournament_events.1003.b.tt:0 "Uma arma secundária terá que servir por enquanto."
 ep2_tournament_events.1003.b:0 "Terá que esperar para depois."
 ep2_tournament_events.1003.desc:0 "A batalha tumultua, batendo em mim. Sou lançado para cá e para lá, tentando revidar como posso. Espadas golpeiam armaduras, lanças batem nas rodelas de metal dos escudos.\n\nUma dessas armas corta o ar em minha direção, mirando minha cabeça. Eu mal consigo me esquivar, girando minha [tournament_weapon.GetName] para desviar. Um escape por sorte.\n\nEu me viro para empunhar novamente a [tournament_weapon.GetType], apenas para descobrir que ela foi completamente arrancada de minhas mãos! Ela cai no chão empoeirado, chutada para lá e para cá pelos combatentes exaustos."
 ep2_tournament_events.1003.t:0 "$tournament_contest_header$ Lâmina Caída"
 ep2_tournament_events.1004.a.tt:0 "Esqueça a batalha; tenho problemas maiores para resolver!"
 ep2_tournament_events.1004.a:0 "Segure firme, [Select_CString( comely_stray.IsFemale, 'minha querida', 'meu querido' )]!"
 ep2_tournament_events.1004.c:0 "[rescuer_knight.GetFirstNameNoTooltip]! Ajude [comely_stray.GetSheHe] a se proteger!"
 ep2_tournament_events.1004.d.dead.tt:0 "Eles têm um fim infeliz"
 ep2_tournament_events.1004.d.escape.tt:0 "Eles escapam ilesos"
 ep2_tournament_events.1004.d.injured.tt:0 "Eles se machucam"
 ep2_tournament_events.1004.d:0 "Eles terão que se virar sozinhos."
 ep2_tournament_events.1004.desc:0 "Um vislumbre, através dos corpos em luta, dos elmos rasgados e da poeira rodopiante; é isso um espírito? [comely_stray.GetSheHe|U] possui uma beleza etérea.\n\nNão, não, não é um espírito: no rosto gracioso [comely_stray.GetHerHim], há uma expressão de puro terror enquanto [comely_stray.GetSheHe] procura uma saída.\n\nMal abro minha boca e [comely_stray.GetSheHe] tropeça e cai, torcendo o tornozelo ao pisar de forma desajeitada em uma lança perdida, seus olhos tristes se enchendo de lágrimas enquanto [comely_stray.GetSheHe] se encolhe longe das lâminas giratórias."
 ep2_tournament_events.1004.t:0 "$tournament_contest_header$ A [comely_stray.Custom('GetLassLad')|U] Perdida"
 ep2_tournament_events.1005.a:0 "...argh!"
 ep2_tournament_events.1005.b:0 "Rendo-me! Eu me rendo..."
 ep2_tournament_events.1005.desc:0 "Ao meu redor, [ROOT.Char.GetWomenMen] caem da luta tumultuada com sangue correndo livremente de seus membros. Escudos estão partidos ao meio junto com lanças destroçadas e espadas descartadas, espalhados pelo campo de batalha.\n\nUm oponente sem rosto avança em minha direção e eu paro o seu golpe, sentindo a vibração subindo pelo meu braço. Eu desvio do próximo ataque, erro o meu próprio, #dou um passo para dentro#! para contra-atacar e-\n\nO contra-ataque deles acerta bem embaixo do meu queixo. Se eu tivesse ficado onde estava, teria errado. Em vez disso, me vejo sendo atingido na garganta. Saindo cambaleando da confusão, eu tento desesperadamente tocar a ferida, afundando de joelhos."
 ep2_tournament_events.1005.fail:0 "Um fim patético"
 ep2_tournament_events.1005.resign:0 "#V Você#! se retira do torneio"
 ep2_tournament_events.1005.success:0 "Afinal, foi apenas um ferimento superficial"
 ep2_tournament_events.1005.t:0 "$tournament_contest_header$ Indo para o Ataque Final"
 ep2_tournament_events.1006.a:0 "Você se arrependerá de ter me enfrentado!"
 ep2_tournament_events.1006.b:0 "Vou aceitar o resgate!"
 ep2_tournament_events.1006.broke:0 "Enquanto espero ansiosamente, [surrendering_knight.GetFirstNameNoTooltip] suspira.\n\n\"Não vou enganar você. Não tenho dinheiro para pagar pelo resgate que você quer. Isso é tudo que tenho.\" [surrendering_knight.GetSheHe|U] diz, cansado, segurando uma pequena bolsa com claramente poucas moedas dentro."
 ep2_tournament_events.1006.c:0 "\"[artifact.GetNameNoTooltip]\" hein? Parece bastante bonito."
 ep2_tournament_events.1006.d:0 "Bem, acho que vou aceitar."
 ep2_tournament_events.1006.e:0 "Vá em paz, nobre adversário!"
 ep2_tournament_events.1006.normal:0 "Eu conduzo [surrendering_knight.GetFirstNameNoTooltip] para fora da confusão em direção ao meu escudeiro, para ficar de olho n[surrendering_knight.GetSheHe] enquanto volto para a briga. Geralmente, é esperado que os cativos se resgatem pagando um resgate para recuperar sua liberdade; [surrendering_knight.GetSheHe] deve valer uma boa quantia!"
 ep2_tournament_events.1006.rival:0 "Eu seguro minha arma no rosto de [surrendering_knight.GetFirstNamePossessiveNoTooltip], aproveitando o medo e a raiva nos seus olhos. Normalmente, um resgate em ouro ou equipamentos é suficiente como pagamento pela derrota, mas..."
 ep2_tournament_events.1006.start:0 "Eu golpeio [surrendering_knight.GetFirstName] com minha espada, faíscas voando da lâmina enquanto ela penetra a sua armadura. Empurrado para trás e para baixo pelos golpes incessantes, [surrendering_knight.GetSheHe] eventualmente joga sua arma no chão e levanta um braço em sinal de rendição.\n\n"
 ep2_tournament_events.1006.t:0 "$tournament_header$ Capturado"
 ep2_tournament_events.1007.a.bigresult:0 "A pontuação da sua equipe #positive_value aumenta significativamente#!"
 ep2_tournament_events.1007.a.result:0 "A pontuação da sua equipe #positive_value aumenta#!"
 ep2_tournament_events.1007.a.tt.bigsuccess:0 "A comida e a bebida são maravilhosas!"
 ep2_tournament_events.1007.a.tt.success:0 "As guloseimas revigoram todos vocês."
 ep2_tournament_events.1007.a:0 "Chame o vendedor."
 ep2_tournament_events.1007.b.result:0 "A pontuação da sua equipe #positive_value aumenta#!"
 ep2_tournament_events.1007.b.tt.failure:0 "O discurso parece ter pouco efeito."
 ep2_tournament_events.1007.b.tt.success:0 "Suas palavras restauram o vigor deles."
 ep2_tournament_events.1007.b.tt:0 "Talvez algumas palavras inspiradoras levantem os ânimos?"
 ep2_tournament_events.1007.b:0 "\"Aproximem-se, todos vocês.\""
 ep2_tournament_events.1007.c:0 "É melhor deixá-los por conta própria."
 ep2_tournament_events.1007.desc:0 "Exausto, eu me arrasto para o conforto austero de um refúgio. Ao meu redor, há competidores de ambos os lados, armaduras rasgadas e distorcidas, espadas embotadas e lascadas. Escudeiros e servos correm ajudando seus senhores.\n\nAvisto alguns dos meus companheiros se recuperando. Eles me cumprimentam com cansaço enquanto eu me jogo ao lado deles, cansado e dolorido. Observando da minha posição sombreada, consigo ver um vendedor de mercado engenhoso preparando rapidamente comida e bebida para vender aos lutadores abatidos. [teammate_1.GetFirstName] e [teammate_2.GetFirstName] observam o vendedor com alguma esperança, enquanto [teammate_3.GetFirstName] murmura falsamente alegre algo sobre um discurso."
 ep2_tournament_events.1007.t:0 "$tournament_header$ Refúgio Acolhedor"
 ep2_tournament_events.1011.a.failure:0 "Você perde a luta."
 ep2_tournament_events.1011.a.success:0 "Você prevalece na batalha."
 ep2_tournament_events.1011.a.tt:0 "Atirar um punhado de terra no seu rosto enquanto [famous_knight.GetSheHe] está falando pode ser desleal, mas certamente é eficaz!"
 ep2_tournament_events.1011.a:0 "Vamos ver quão nobre é essa camaradagem..."
 ep2_tournament_events.1011.b:0 "\"Venha, nobre adversário! Vamos nos testar em combate.\""
 ep2_tournament_events.1011.c:0 "A discrição pode ser a melhor parte da coragem aqui..."
 ep2_tournament_events.1011.d.failure:0 "[famous_knight.GetFirstNameNoTooltip] te alcança."
 ep2_tournament_events.1011.d.success:0 "Você consegue escapar com sucesso para a confusão da luta."
 ep2_tournament_events.1011.equal:0 "\"Ah, [ROOT.Char.GetTitledFirstNameNoTooltip|U]! Isso é realmente uma honra!\" [famous_knight.GetFirstName|U] remove seu capacete antes de continuar.\n\n\"Finalmente, os dois maiores $knight_culture_player_plural_no_tooltip_lowercase$ conhecidos do mundo se encontram. Dois soldados de honra que competiram juntos na glória ensanguentada do campo, finalmente cara a cara. Quantas vezes ensaiei este momento de destino em meus sonhos! A panóplia para encapsular a nobreza não dita de nossa camaradagem—\""
 ep2_tournament_events.1011.start:0 "No meio do sangue e do estrondo da luta, consigo avistar uma figura se aproximando de cavalo. Os símbolos pendurados no pescoço de seu cavalo revelam sua identidade antes mesmo de falar: um verdadeiro $knight_culture_player_no_tooltip_lowercase$ famoso enfeita o campo.\n\n"
 ep2_tournament_events.1011.t:0 "$tournament_contest_header$ Um Adversário Famoso"
 ep2_tournament_events.1011.unequal:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip|U]!\" [famous_knight.GetFirstName|U] troveja, se aproximando em um trote rápido, a voz ecoando claramente pelo campo. [famous_knight.GetSheHe|U] empunha sua espada com habilidade prática, um verdadeiro mestre de seu ambiente.\n\n\"Desejo travar uma batalha com você. Venha, enfrente-me, e vejamos quem se mostra mais poderoso!\""
 ep2_tournament_events.1012.a:0 "Sou apenas um sussurro de galhos."
 ep2_tournament_events.1012.b.failure:0 "Você perde o duelo."
 ep2_tournament_events.1012.b.success:0 "Você vence o duelo."
 ep2_tournament_events.1012.b:0 "\"[caught_opponent.GetFirstNameNoTooltip]! Enfrente-me em um combate honrado!\""
 ep2_tournament_events.1012.c.failure:0 "A emboscada falha miseravelmente."
 ep2_tournament_events.1012.c.success:0 "A emboscada é bem-sucedida."
 ep2_tournament_events.1012.c:0 "Devo ser rápido!"
 ep2_tournament_events.1012.d:0 "Não seria correto prevalecer assim."
 ep2_tournament_events.1012.desc:0 "O arbusto resistente estremece e sussurra enquanto eu abro caminho através dele. Este bosque de árvores é um local perfeito para emboscada, adjacente ao caminho até um ponto de descanso.\n\nNão preciso esperar muito. [caught_opponent.GetFirstName] se arrasta pelo caminho, claramente ansioso por uma pausa na luta. A luz solar filtrada brilha em sua armadura enquanto o sussurro das folhas encobre minha abordagem através da vegetação.\n\nMantendo os olhos em [caught_opponent.GetFirstNameNoTooltip], eventualmente me posiciono perfeitamente, a apenas dois passos de onde [caught_opponent.GetSheHe] está prestes a pisar."
 ep2_tournament_events.1012.t:0 "$tournament_contest_header$ Dos Bosques"
 ep2_tournament_events.1013.a.tt:0 "Proteja [felled_participant.GetSheHe] da confusão até que um atendente possa trazer outro cavalo para [felled_participant.GetSheHe]."
 ep2_tournament_events.1013.a:0 "\"Precisa de ajuda, [felled_participant.GetFirstNameNoTooltip]?\""
 ep2_tournament_events.1013.b:0 "Então seja assim. #EMP Hyah!#!"
 ep2_tournament_events.1013.c.failure:0 "Você perde o duelo."
 ep2_tournament_events.1013.c.success:0 "Você prevalece no duelo."
 ep2_tournament_events.1013.c:0 "Resolveremos isso de forma justa, a pé."
 ep2_tournament_events.1013.d.tt:0 "Afaste-se em busca de outros combates mais justos."
 ep2_tournament_events.1013.d:0 "Este não é o meu estilo de luta."
 ep2_tournament_events.1013.desc:0 "Eu freio meu cavalo após uma investida contra um oponente e volto para a refrega. À medida que me aproximo, vejo uma figura cair de seu monte, atingida de surpresa por um golpe de um oponente por trás.\n\nApesar de aparentemente ileso, [felled_participant.GetFirstName] olha ao redor desesperadamente em busca de seu monte, mas ele já foi embora, assustado com o barulho.\n\nAproximando-me cada vez mais, fixo-me no infortúnio [felled_participant.GetHerHim]. Sentada em meu corcel, [felled_participant.GetSheHe] parece tão pequena, tão indefesa. Não seria honroso, como diria um espectador, mas há muito pouca honra na refrega..."
 ep2_tournament_events.1013.t:0 "$tournament_contest_header$ A Vantagem do Terreno Elevado"
 ep2_tournament_events.1015.a.tt:0 "Esta é uma boa oportunidade para derrotar alguns oponentes enfraquecidos e ganhar um pouco de dinheiro!"
 ep2_tournament_events.1015.a:0 "Bem, acho que posso aproveitar as sobras deles."
 ep2_tournament_events.1015.b.failure:0 "Eles se perdem na multidão."
 ep2_tournament_events.1015.b.success.tt:0 "Você confronta a figura."
 ep2_tournament_events.1015.b.success:0 "Você alcança o estranho."
 ep2_tournament_events.1015.b:0 "Eu preciso saber quem é!"
 ep2_tournament_events.1015.c:0 "É melhor deixá-los em paz."
 ep2_tournament_events.1015.desc:0 "Cavalos passam em disparada na refrega. Meu avanço me afasta do conflito, e faço uma volta ampla para observar.\n\nImediatamente, meu olhar é atraído. Um $knight_culture_player_no_tooltip_lowercase$ golpeia vigorosamente, com ferocidade e habilidade, derrubando um oponente do cavalo e desmontando para continuar a batalha. Eles claramente são superiores ao seu infortunado adversário e em breve têm-no à sua mercê, coletando uma generosa soma de ouro como resgate.\n\nEsses emblemas me parecem familiares, mas é difícil identificá-los. Eu me aproximo trotando e desmonto, chamando a atenção da figura, mas eles marcham firmemente em busca de novos inimigos."
 ep2_tournament_events.1015.t:0 "$tournament_contest_header$ Um Misterioso $knight_culture_player_no_tooltip$"
 ep2_tournament_events.1016.a:0 "Tudo bem. Cubra minhas costas!"
 ep2_tournament_events.1016.b.failure:0 "Você aprende um pouco"
 ep2_tournament_events.1016.b.success:0 "Você aprende muito"
 ep2_tournament_events.1016.b.tt:0 "Observar atentamente, sem dúvida, vai te ensinar algumas coisas."
 ep2_tournament_events.1016.b:0 "Você precisa me mostrar suas habilidades!"
 ep2_tournament_events.1016.c:0 "Não! Você não pode fazer isso!"
 ep2_tournament_events.1016.mulan:0 "\"Espero ter provado meu valor.\" [mysterious_knight.GetFirstName] diz, inclinando levemente a cabeça. \"Obrigado por confiar em mim. Agora, deixe-me retribuir.\" [mysterious_knight.GetSheHe] ergue a arma, a luz do sol refletindo na lâmina."
 ep2_tournament_events.1016.mulanunknown:0 "É uma #EMP [mysterious_knight.GetWomanMan]#!\n\n\"Por favor, eu imploro, não conte a ninguém.\" [mysterious_knight.GetSheHe|U] suplica. [mysterious_knight.GetSheHe|U] olha para o chão e depois para mim, com esperança. \"Tudo que eu quero é ter a chance de provar meu valor!"
 ep2_tournament_events.1016.relation:0 "De todas as pessoas, é minha [ROOT.Char.Custom2('RelationToMeShort', mysterious_knight)] [mysterious_knight.GetFirstName]! [mysterious_knight.GetSheHe|U] só pode oferecer um pequeno sorriso diante da minha boca aberta e estende um braço indicando de volta à confusão.\n\n\"Não temos tempo a perder fazendo perguntas.\" [mysterious_knight.GetSheHe|U] interrompe minhas protestações. \"Temos uma batalha para vencer!"
 ep2_tournament_events.1016.start:0 "Fica claro rapidamente que minha presença não é bem-vinda. O $knight_culture_player_no_tooltip_lowercase$ lança olhares nervosos por cima do ombro para mim e segue um caminho errático pela confusão para me despistar, mas eu não vou desistir. Eventualmente, alcanço-os, coloco a mão em seu braço e tiro o capacete. Deixo escapar um suspiro involuntário.\n\n"
 ep2_tournament_events.1016.t:0 "$tournament_contest_header$ Mistério Solucionado"
 ep2_tournament_events.1017.a.failure:0 "Você está severamente em desvantagem"
 ep2_tournament_events.1017.a.success:0 "Você triunfa sozinho sobre os três"
 ep2_tournament_events.1017.a:0 "Fiquem para trás. #EMP Esses três são meus!#!"
 ep2_tournament_events.1017.b.failure:0 "Eles conseguem se retirar lutando"
 ep2_tournament_events.1017.b.success:0 "Você os pega desprevenidos"
 ep2_tournament_events.1017.b:0 "Agora! Avance!"
 ep2_tournament_events.1017.desc:0 "Arrancado da sela por uma arma de haste, levanto cambaleando, minha cabeça zunindo. Os agressores se voltam imediatamente para mim.\n\n\"Peço desculpas pelo pouso brusco,\" diz [knight_1.GetFirstName], \"mas não estamos arriscando nada.\" Três deles, todos fortemente armados. Seu objetivo é claro: eu sou um alvo de alto valor, que trará grandes riquezas em resgate.\n\nConforme minha mente clareia, consigo distinguir duas figuras se aproximando por trás dos ombros dos meus agressores, trajando as cores de minha equipe. Os três miseráveis sorridentes não fazem ideia do perigo iminente, mas meu resgate certamente está próximo, se eu quiser."
 ep2_tournament_events.1017.t:0 "$tournament_contest_header$ Encurralado"
 ep2_tournament_events.1018.a:0 "\"[ROOT.Char.GetHouse.GetMotto]\", [family.GetFirstNameNoTooltip]."
 ep2_tournament_events.1018.b:0 "Eu sempre vou te proteger, enquanto eu respirar."
 ep2_tournament_events.1018.desc:0 "Observando a confusão, avisto um companheiro de equipe lutando a pé, cercado por dois inimigos. Outro olhar revela as cores sujas e rasgadas que [family.GetSheHe] veste: a bandeira de nossa nobre Casa [ROOT.Char.GetHouse.GetName].\n\nAvançando com meu corcel para a briga, um adversário é arremessado para longe. O outro, surpreendido, é rapidamente derrotado por nossas lâminas combinadas. [family.GetFirstName] sorri agradecido, fazendo uma reverência diante de mim e de meu cavalo.\n\n\"Obrigado. Eles teriam me vencido se não fosse por você.\" [family.GetSheHe|U] olha para as vestes desgastadas, mas ainda vibrantes, que ambos usamos, acariciando o brasão em seu peito. \"[ROOT.Char.GetHouse.GetMotto].\""
 ep2_tournament_events.1018.t:0 "$tournament_contest_header$ Uma Casa Unida"
 ep2_tournament_events.1501.a.tt:0 "Essa multidão não será capaz de ficar quieta agora que aquele boato salaz foi ouvido alto e claro!"
 ep2_tournament_events.1501.a:0 "\"Você aí. O que você disse?\""
 ep2_tournament_events.1501.b.tt:0 "#EMP Cof!#! #EMP COF!#!"
 ep2_tournament_events.1501.b:0 "Oh querido. Sinto um formigamento na garganta chegando."
 ep2_tournament_events.1501.c:0 "Melhor deixar [competitor.GetSheHe] prosseguir."
 ep2_tournament_events.1501.desc:0 "A multidão murmura tranquilamente enquanto [competitor.GetFirstName] assume sua posição. Acredito ter captado algumas palavras ao vento, e claramente [competitor.GetFirstNameNoTooltip] também. [competitor.GetSheHe|U] se volta para a multidão de forma petulante e se dirige a ela.\n\n\"Silêncio! Tenham algum respeito pelos competidores!\" [competitor.GetSheHe|U] resmunga irritado. Algumas risadinhas são ouvidas em resposta. Claramente, [competitor.GetSheHe] precisa de paz e tranquilidade para lançar uma flecha, mas — penso eu, enquanto [competitor.GetSheHe] se vira para brandir o punho novamente para a multidão — isso pode estar indo um pouco longe."
 ep2_tournament_events.1501.secret:0 "\n\nDeixo minha mente divagar sobre o que pensei ter ouvido nas murmurações da multidão. Parecia bastante #EMP salaz#!, para dizer o mínimo..."
 ep2_tournament_events.1501.t:0 "$tournament_contest_header$ Silêncio, Por Favor!"
 ep2_tournament_events.1502.a:0 "Hah! Um pouco de vento não vai me deter!"
 ep2_tournament_events.1502.b.failure:0 "Você recebe a ordem de prosseguir"
 ep2_tournament_events.1502.b.success:0 "Os juízes concordam"
 ep2_tournament_events.1502.b.tt:0 "Indicar o pobre e infeliz [contestant.GetFirstNameNoTooltip] como o próximo da fila pode funcionar..."
 ep2_tournament_events.1502.b:0 "\"Na verdade, ainda não era a minha vez, não é mesmo?\""
 ep2_tournament_events.1502.c.failure:0 "O vento está muito forte"
 ep2_tournament_events.1502.c.success:0 "Você acerta o alvo"
 ep2_tournament_events.1502.c:0 "Talvez se eu atirar #EMP atravessando#! o vento..."
 ep2_tournament_events.1502.desc:0 "As bandeiras tremulam e se agitam enquanto me aproximo para disparar, espancado pelo vento. A poeira gira ao meu redor enquanto encaixo uma flecha no arco, o vento ácido fazendo meus olhos lacrimejarem.\n\nEspero que ele diminua.\n\nContinuo esperando.\n\nAcho que não vai parar."
 ep2_tournament_events.1502.secret:0 "\n\nDeixo minha mente voltar ao que pensei ter ouvido nas tagarelices da multidão. Parecia bastante #EMP salaz#!, para dizer o mínimo..."
 ep2_tournament_events.1502.t:0 "$tournament_contest_header$ Dinâmica da Flecha"
 ep2_tournament_events.1503.a.failure:0 "Você é descoberto"
 ep2_tournament_events.1503.a.success:0 "Você tem sucesso"
 ep2_tournament_events.1503.a.tt:0 "Alguém notaria se eu apagasse e movesse nosso marcador alguns passos para trás?"
 ep2_tournament_events.1503.a:0 "...aquele marcador é muito temporário."
 ep2_tournament_events.1503.b.failure:0 "Você espanta o tédio com conversa"
 ep2_tournament_events.1503.b.flavor:0 "Quem sabe que fofocas podem ser ouvidas?"
 ep2_tournament_events.1503.b.success:0 "Você descobre um segredo"
 ep2_tournament_events.1503.b.tt:0 "Você descobre um [secret|E] sobre outro competidor"
 ep2_tournament_events.1503.b:0 "Vou dar uma volta para conversar com a multidão."
 ep2_tournament_events.1503.c:0 "Vou ter que suportar, suponho."
 ep2_tournament_events.1503.desc:0 "#EMP Sshht!#!\n\nA flecha de um competidor é lançada do arco e acerta o alvo. Uma leve salva de palmas segue-se. Apoio-me no meu arco, entediado, esperando minha vez.\n\n#EMP Sshht!#!\n\nOutra flecha acerta em cheio. [contestant.GetFirstName] se afasta para pegar o arco. Preciso encontrar #EMP algo#! para fazer enquanto espero, senão vou enlouquecer."
 ep2_tournament_events.1503.t:0 "$tournament_contest_header$ Entediado no Alvo"
 ep2_tournament_events.2001.a.tt:0 "Jogue a sujeira no seu rosto."
 ep2_tournament_events.2001.a:0 "Hyah!"
 ep2_tournament_events.2001.b.failure:0 "[versus_contestant.GetFirstNameNoTooltip] te mantém facilmente no chão"
 ep2_tournament_events.2001.b.success:0 "Você luta para se levantar"
 ep2_tournament_events.2001.b:0 "Assim não é o modo de lutar."
 ep2_tournament_events.2001.desc:0 "[versus_contestant.GetFirstName] e eu estamos no chão, lutando um contra o outro. Um movimento do braço me coloca em desvantagem e de repente [versus_contestant.GetFirstNameNoTooltip] está em cima de mim, trabalhando para garantir a vitória.\n\nO solo empoeirado se move sob nossos corpos tensos, o rosto do meu oponente roçando no chão enquanto [versus_contestant.GetSheHe] tenta me imobilizar. Minha mão livre, buscando qualquer tipo de vantagem, inconscientemente se fecha em torno da terra, deixando-me com um punhado de sujeira. O seu rosto está próximo à minha mão, tão perto..."
 ep2_tournament_events.2001.t:0 "$tournament_versus_header$ Truques Sujos"
 ep2_tournament_events.2002.a.tt:0 "Todo membro próximo da família"
 ep2_tournament_events.2002.a:0 "Tudo vale no amor e na luta livre..."
 ep2_tournament_events.2002.b.tt:0 "Hora de lutar para sair dessa!"
 ep2_tournament_events.2002.b:0 "Vou perder com honra, se necessário!"
 ep2_tournament_events.2002.desc:0 "[versus_contestant.GetFirstName] cai sobre mim com força, enquanto seu golpe me faz tombar ao chão. Imediatamente, ambos começamos a lutar por uma posição melhor; eu tentando virar [versus_contestant.GetSheHe] para longe de mim, [versus_contestant.GetSheHe] tentando aproveitar a abertura.\n\n[versus_contestant.GetFirstNameNoTooltip] prende um dos meus braços debaixo do seu joelho e começa a trabalhar para encerrar a luta completamente. Desesperadamente, minha mão livre busca por algo, qualquer coisa para usar. Meio cego pela sujeira, consigo sentir o ar, então o tecido áspero e grosseiro da roupa de luta, e de repente... uma fenda de nádegas?\n\nSe eu não fizer algo logo, essa luta está praticamente perdida. E então meu polegar se abre do punho..."
 ep2_tournament_events.2002.t:0 "$tournament_versus_header$ Se Intrometendo"
 ep2_tournament_events.2003.a.tt:0 "Jogue o banquinho nas mãos de [versus_contestant.GetFirstNamePossessiveNoTooltip] e segure a cabeça."
 ep2_tournament_events.2003.a:0 "\"#EMP Argh!#! Juiz! [versus_contestant.GetSheHe|U] me acertou com aquilo!\""
 ep2_tournament_events.2003.b.tt:0 "#EMP Crunch!#!"
 ep2_tournament_events.2003.b:0 "\"Aqui, [versus_contestant.GetFirstNameNoTooltip]!\""
 ep2_tournament_events.2003.c:0 "Chega de trapaças por baixo dos panos."
 ep2_tournament_events.2003.desc:0 "\"Hey! Hey, juiz!\"\n\nCom um certo alívio, ouço a voz do meu amigo [friend.GetFirstName]. A distração abençoada faz com que o árbitro se aproxime da parede do fosso e meu oponente [versus_contestant.GetFirstName] hesite por um instante, tempo suficiente para um antebraço no rosto atordoar [versus_contestant.GetSheHe] momentaneamente.\n\nA multidão não está feliz com a trapaça, e vários objetos começam a cair no fosso. Frutas, legumes, até um banquinho. De fato, o tal banquinho cai perto o suficiente para eu pegar, e o juiz, de costas enquanto lida com a reclamação de [friend.GetFirstName], me dá a menor semente de uma ideia..."
 ep2_tournament_events.2003.t:0 "$tournament_versus_header$ Interferência Externa"
 ep2_tournament_events.2004.a:0 "Talvez se eu fizer [versus_contestant.GetSheHe] se mover..."
 ep2_tournament_events.2004.b:0 "Só pegue-os e acabe com isso!"
 ep2_tournament_events.2004.c:0 "[versus_contestant.GetSheHe|U] não é o único com um pouco de #EMP corpulência#!!"
 ep2_tournament_events.2004.d.tt.failure:0 "[versus_contestant.GetFirstName] facilmente resiste aos seus ataques"
 ep2_tournament_events.2004.d.tt.success:0 "Você atinge com sucesso as pernas de [versus_contestant.GetFirstNamePossessiveNoTooltip]"
 ep2_tournament_events.2004.d:0 "Uma torre poderosa não se sustenta sem fundações."
 ep2_tournament_events.2004.desc:0 "Meus braços tentam se fechar em torno do abdômen farto de [versus_contestant.GetFirstNamePossessive] mais uma vez e, como antes, tudo o que [versus_contestant.GetSheHe] faz é rir e me arremessar contra a parede do fosso com sua pura massa corporal. [versus_contestant.GetSheHe|U] caminha em minha direção, papadas tremendo, dobras rolando, enquanto a multidão grita de alegria.\n\nEmbora as dimensões prodigiosas do meu oponente sejam uma vantagem, certamente não é só músculo. [versus_contestant.GetFirstNameNoTooltip] começa a circular para diminuir o espaço disponível para mim novamente. Certamente deve haver uma maneira de aproveitar isso?"
 ep2_tournament_events.2004.e:0 "Não há glória em evitar uma luta!"
 ep2_tournament_events.2004.t:0 "$tournament_versus_header$ Uma Luta Carnuda"
 ep2_tournament_events.2005.a:0 "\"Devemos continuar em algum lugar mais privado?\""
 ep2_tournament_events.2005.b.tt.criticalfailure:0 "Você interpretou drasticamente errado a linguagem corporal de [versus_contestant.GetFirstNamePossessiveNoTooltip]"
 ep2_tournament_events.2005.b.tt.failure:0 "[versus_contestant.GetFirstNameNoTooltip] está lisonjeado, mas recusa educadamente"
 ep2_tournament_events.2005.b.tt.success:0 "[versus_contestant.GetFirstNameNoTooltip] está interessado em seus avanços"
 ep2_tournament_events.2005.b:0 "\"Estou gostando de nossa luta, [versus_contestant.GetFirstNameNoTooltip]. #EMP Muito#! mesmo.\""
 ep2_tournament_events.2005.c:0 "Hah! [versus_contestant.GetSheHe|U] abaixou a guarda!"
 ep2_tournament_events.2005.desc:0 "Enquanto luto com meu oponente [versus_contestant.GetFirstName], um pequeno escorregão me dá uma abertura. Um rápido arremesso faz [versus_contestant.GetSheHe] cair no chão, mas [versus_contestant.GetSheHe] aterrissa com graça, e acabamos peito a peito no chão. O suor escorre tanto do meu corpo quanto [versus_contestant.GetFirstNamePossessiveNoTooltip] enquanto lutamos por posição, nos deixando escorregadios.\n\n#EMP Muito#! escorregadio, por sinal. Conforme nos separamos de um abraço - um notavelmente menos combativo do que o último, talvez? - percebo o rubor no rosto de [versus_contestant.GetFirstNamePossessiveNoTooltip], que suspeito não ser apenas devido ao esforço."
 ep2_tournament_events.2005.t:0 "$tournament_versus_header$ Lutando com Desejo"
 ep2_tournament_events.2006.a:0 "..."
 ep2_tournament_events.2006.desc:0 "Finjo ir para a esquerda e vou para a direita, mergulhando na perna do meu oponente [versus_contestant.GetFirstNamePossessive], mas [versus_contestant.GetSheHe] é mais rápido. Agarrando-me pela cintura, [versus_contestant.GetSheHe] me levanta de cabeça para baixo, sua barriga contra minhas costas, minhas pernas balançando impotentes.\n\nOs gritos e aplausos da multidão ecoam em meus ouvidos enquanto luto para me libertar, tentando em vão acertar um joelho na cabeça de [versus_contestant.GetFirstNameNoTooltip]. Quanto mais eu luto, mais sinto o aperto do meu inimigo relaxar. Redobro meus esforços, mas parece que [versus_contestant.GetFirstNameNoTooltip] já teve o bastante de minha agonia e simplesmente... me solta.\n\nO chão se aproxima rapidamente. Meu último pensamento horrorizado é a percepção de que minha cabeça vai levar o impacto principal-\n\n#X Crrrunch.#!"
 ep2_tournament_events.2006.t:0 "$tournament_versus_header$ Proeza de Força"
 ep2_tournament_events.2007.a:0 "Guardas! Tirem esse encrenqueiro daqui!"
 ep2_tournament_events.2007.b.tt.failure:0 "Os juízes ficam do lado de [opponent_friend.GetFirstNameNoTooltip]"
 ep2_tournament_events.2007.b.tt.success:0 "Você vence o debate"
 ep2_tournament_events.2007.b:0 "Os ombros [versus_contestant.GetHerHim|U] estavam #EMP definitivamente#! no chão!"
 ep2_tournament_events.2007.c:0 "Não, você está certo. Não houve queda."
 ep2_tournament_events.2007.desc:0 "Forço [versus_contestant.GetFirstName] para baixo, pressionando seus ombros em direção ao chão. Estou quase conseguindo quando ouço um chamado de um juiz que estava observando. Leva um momento para eu perceber que foi a meu favor, e os juízes estão me dando o crédito pela queda!\n\nEu me levanto novamente, um tanto incerto, avaliando se devo admitir o erro deles, quando o volume da multidão aumenta subitamente. Me viro e vejo [opponent_friend.GetFirstName] avançando em minha direção após pular a barreira, gesticulando furiosamente.\n\n\"Isto é uma injustiça! Os ombros [versus_contestant.GetHerHim|U] nem mesmo estavam #EMP próximos#! de tocar o chão!\" [opponent_friend.GetSheHe|U] grita, segurando o pulso de um juiz."
 ep2_tournament_events.2007.t:0 "Participação da Plateia"
 ep2_tournament_events.2501.a.tt.criticalsuccess:0 "Você derruba eles"
 ep2_tournament_events.2501.a.tt.failure:0 "Sua tática falha"
 ep2_tournament_events.2501.a.tt.success:0 "Funciona razoavelmente bem"
 ep2_tournament_events.2501.a:0 "Concentre-se em chaves de pescoço."
 ep2_tournament_events.2501.b:0 "Trabalhe nas agarradas no corpo."
 ep2_tournament_events.2501.c:0 "Apenas derrube [versus_contestant.GetSheHe] no chão."
 ep2_tournament_events.2501.desc:0 "Um poderoso golpe de ombro de [versus_contestant.GetFirstName] atinge minhas costelas com força e eu sou levado ao chão, mas [versus_contestant.GetSheHe] não me segue para uma imobilização. E com razão, já que meu punho passa rapidamente pelo ar onde estaria a cabeça deles. A fase de avaliação dessa luta em particular claramente acabou.\n\nNós dois circulamos cautelosamente, [versus_contestant.GetFirstNameNoTooltip] com um leve sorriso malicioso. É a calma antes da tempestade, e um lutador astuto usa esses momentos para estrategizar."
 ep2_tournament_events.2501.t:0 "Escolhas, Escolhas..."
 ep2_tournament_events.2502.a.tt.failure:0 "Ai! Isso não ajudou em nada!"
 ep2_tournament_events.2502.a.tt.success:0 "Seu tratamento improvisado funciona"
 ep2_tournament_events.2502.a.tt:0 "Tentar colocar o dedo de volta no lugar"
 ep2_tournament_events.2502.a:0 "Certo, bem, só há uma coisa a fazer."
 ep2_tournament_events.2502.b.tt:0 "Lute!"
 ep2_tournament_events.2502.b:0 "Se eu favorecer minha outra mão, talvez ainda consiga vencer isso..."
 ep2_tournament_events.2502.c:0 "Estou machucado! Devo desistir."
 ep2_tournament_events.2502.desc:0 "Ao me afastar de um breve agarre com [versus_contestant.GetFirstName], pego [versus_contestant.GetSheHe] de surpresa e agarro [versus_contestant.GetSheHe] pelo pescoço! Completamente despreparado, o pescoço [versus_contestant.GetFirstNamePossessiveNoTooltip] estala audivelmente pelo impacto, a força fazendo [versus_contestant.GetSheHe] gritar em pânico.\n\nA multidão explode, mas os aplausos animados rapidamente se transformam em murmúrios de confusão quando eu afrouxo minha pegada. No momento em que meu braço fez contato, um #EMP estalo#! repugnante sinaliza que nem tudo está bem, e a dor percorrendo meu dedo confirma algum tipo de deslocamento.\n\n[versus_contestant.GetFirstNameNoTooltip] ainda está se recuperando. Se eu reagir rapidamente, talvez..."
 ep2_tournament_events.2502.t:0 "Desarticulado"
 ep2_tournament_events.2503.a.tt:0 "Você cutuca o olho de [versus_contestant.GetHerHim] em vingança!"
 ep2_tournament_events.2503.a:0 "É assim que vamos jogar, não é?!"
 ep2_tournament_events.2503.b.tt.failure:0 "A luta é permitida a continuar"
 ep2_tournament_events.2503.b.tt.success:0 "[versus_contestant.GetFirstNameNoTooltip] é desclassificad[Select_CString( versus_contestant.IsFemale, 'a', 'o' )]"
 ep2_tournament_events.2503.b:0 "Juiz! #EMP Juiz!#!"
 ep2_tournament_events.2503.c.tt:0 "Você continua a luta!"
 ep2_tournament_events.2503.c:0 "Você não vai sair impune com isso!"
 ep2_tournament_events.2503.d:0 "Você é um[Select_CString( versus_contestant.IsFemale, 'a', '' )] [versus_contestant.Custom2('InsultNoun', ROOT.Char)] [versus_contestant.Custom2('InsultAdjective', ROOT.Char)]! Venha mais perto para eu te acertar!"
 ep2_tournament_events.2503.desc:0 "Um braço aperta meu crânio, e eu respondo com um cotovelo violento no estômago de [versus_contestant.GetFirstName]. Eu escapo [versus_contestant.GetHerHim] e avanço para um agarramento próprio, e nós nos prendemos, braços entrelaçados, respirando pesadamente.\n\nEnquanto lutamos no agarre um do outro, percebo um leve sorriso passar pelo rosto do meu oponente. O que [versus_contestant.GetSheHe] está sorrindo-\n\n#EMP Argh!#! Meu #EMP OLHO!#! O polegar de [versus_contestant.GetFirstNamePossessiveNoTooltip] está firmemente encaixado na minha órbita ocular, e é preciso um poderoso golpe no rosto para afastá-lo de mim. Cambaleio para trás, mãos sobre meu olho danificado, meu oponente embaçado caminhando em minha direção."
 ep2_tournament_events.2503.t:0 "O Piscar Mais Fraco"
 ep2_tournament_events.2504.a.tt:0 "[versus_contestant.GetFirstNameNoTooltip] é prontamente desqualificado, e você avança na competição"
 ep2_tournament_events.2504.a:0 "Retire-os imediatamente deste ringue!"
 ep2_tournament_events.2504.b.tt.criticalsuccess:0 "[physician.GetFirstNameNoTooltip] faz maravilhas"
 ep2_tournament_events.2504.b.tt.failure:0 "Mesmo com os cuidados de [physician.GetFirstNamePossessiveNoTooltip], não é possível salvar seu nariz"
 ep2_tournament_events.2504.b.tt.success:0 "[physician.GetFirstNameNoTooltip] consegue salvar seu nariz"
 ep2_tournament_events.2504.b.tt:0 "Esqueça a competição, você precisa de um médico!"
 ep2_tournament_events.2504.b:0 "Traga meu médico!"
 ep2_tournament_events.2504.c.tt:0 "Um corredor é enviado em busca de um novo $court_physician_court_position$"
 ep2_tournament_events.2504.c:0 "Alguém, encontre um médico!"
 ep2_tournament_events.2504.desc:0 "Eu me viro para meu oponente [versus_contestant.GetFirstName] e o agarro em uma chave de cabeça. Aperto meu controle, mas [versus_contestant.GetSheHe] parece quase #EMP gostar#! do contato. Eu o jogo no chão, mas [versus_contestant.GetFirstNameNoTooltip] apenas fica mole e aceita, um brilho perturbador começando a dançar em seus olhos selvagens.\n\nRapidamente, me abaixo para fazer o pin, mas de repente meu alvo se torna um borrão de movimento, me empurrando para o lado, me deixando no chão. Em vez de buscar o pin, [versus_contestant.GetSheHe] monta em mim e começa a desferir socos no meu rosto! Desesperadamente, desfiro um soco bem nas suas têmporas, mas em resposta, a sua boca espumando se abre, avança e-\n\n#EMP \"Aaaaaarrrghh! Meu nariz!#!\""
 ep2_tournament_events.2504.t:0 "Conduta Imprópria"
 ep2_tournament_events.2505.a:0 "Uma luta tão equilibrada não precisa ter um perdedor."
 ep2_tournament_events.2505.b.tt.doublefailure:0 "Ambos caem exaustos"
 ep2_tournament_events.2505.b.tt.failure:0 "[versus_contestant.GetFirstNameNoTooltip] vence a luta"
 ep2_tournament_events.2505.b.tt.notsadistic:0 "Todos os cortesãos e convidados não-[GetTrait('sadistic').GetName( GetNullCharacter )]"
 ep2_tournament_events.2505.b.tt.sadistic:0 "Todos os cortesãos e convidados [GetTrait('sadistic').GetName( GetNullCharacter )]"
 ep2_tournament_events.2505.b.tt.success:0 "Você vence a luta"
 ep2_tournament_events.2505.b:0 "Um empate?! Vão ter que me arrastar para fora deste ringue!"
 ep2_tournament_events.2505.desc:0 "Meus braços doem, meus músculos doem.\n\nNão apenas meu pescoço, que suportou tantas agarradas apertadas. Não apenas meu tronco, praticamente amaciado como está. Não, #EMP meus próprios braços#! parecem ter sido pisoteados por uma equipe de cavalos conduzida por [ROOT.Char.GetFaith.DevilName]. Meu único consolo é, enquanto olho para [versus_contestant.GetSheHe] através de respirações ofegantes e um olho embaçado, que meu oponente [versus_contestant.GetFirstName] não está se saindo melhor do que eu.\n\nOs dois balançamos inseguramente sobre nossos pés enquanto nos aproximamos novamente, sangue escorrendo livremente de cortes. Estamos quase dentro do alcance um do outro quando somos separados, os juízes se aproximando preocupados. Eles estão oferecendo... um empate?"
 ep2_tournament_events.2505.t:0 "Levando uma surra"
 ep2_tournament_events.2506.a:0 "#DIE2 ...urk!#!"
 ep2_tournament_events.2506.desc:0 "Esquivar de uma agarrada, errar o contra-ataque...\n\nEstou tentando retribuir na mesma moeda, mas tudo o que consigo fazer é segurar firme contra as tentativas furiosas de [versus_contestant.GetFirstNamePossessive] de me prender em uma agarrada. Desviar de uma tentativa, contra-atacar outra, correr para o lado, mas então [versus_contestant.GetSheHe] me agarra.\n\nA chave de pescoço aperta ao redor do meu pescoço como uma serpente horrível, enquanto a sua mão a empurra para o outro lado, como se colocando um animal fora de seu sofrimento. Não consigo respirar, meus olhos parecem prontos para saltar das órbitas, minhas bochechas ficam vermelhas com o sangue aprisionado, e meu pescoço range como um galho frágil.\n\n#X Crack!#!\n\nO mundo se torna monocromático. Meu corpo espasma.\n\nEu fico de bruços, olhando para o céu."
 ep2_tournament_events.2506.t:0 "Uma Nova Perspectiva"
 ep2_tournament_events.2507.a:0 "...faça de novo."
 ep2_tournament_events.2507.b.tt:0 "A vitória está garantida, mas um fim rápido ainda seria misericordioso."
 ep2_tournament_events.2507.b:0 "Vamos terminar isso rápido."
 ep2_tournament_events.2507.c.failure:0 "[versus_contestant.GetFirstNameNoTooltip] continua seu ataque fracassado"
 ep2_tournament_events.2507.c.success:0 "Você consegue convencer [versus_contestant.GetFirstNameNoTooltip] a desistir"
 ep2_tournament_events.2507.c:0 "\"Acho que você já teve o suficiente, [versus_contestant.GetFirstNameNoTooltip].\""
 ep2_tournament_events.2507.desc:0 "Não há nada como uma boa luta para realmente fazer os sentidos ganharem vida. Tudo fica mais nítido, mais brilhante, mais distinto em som, visão e cheiro. É o suficiente para fazer uma [ROOT.Char.GetWomanMan] se sentir super-humana! E talvez privar um sentido faria o oposto...\n\nEu desvio com desprezo para a esquerda para evitar uma agarrada de [versus_contestant.GetFirstName] que se aproxima e, enquanto [versus_contestant.GetSheHe] recua, desfero um poderoso golpe com as duas mãos nas laterais da sua cabeça.\n\n[versus_contestant.GetFirstNameNoTooltip] berra de dor, gotas de sangue escorrendo dos seus ouvidos. Está claro que esta luta está chegando a uma conclusão rápida, mas as tentativas selvagens de uma agarrada sendo lançadas vagamente na minha direção implicam que [versus_contestant.GetFirstNameNoTooltip] vai se vingar ou cair tentando."
 ep2_tournament_events.2507.t:0 "Golpes Desorientadores"
 ep2_tournament_events.3501.a:0 "[knight1.GetFirstNameNoTooltip] parece muito habilidoso."
 ep2_tournament_events.3501.b:0 "[knight2.GetFirstNameNoTooltip] é certamente a escolha aqui."
 ep2_tournament_events.3501.c:0 "O vencedor tem meu favor!"
 ep2_tournament_events.3501.d:0 "Chega! Isso é comportamento infantil."
 ep2_tournament_events.3501.desc:0 "Um borrão de movimento, um som estrondoso e a quintain de treinamento balança selvagemente novamente. O jovem $knight_culture_player_no_tooltip_lowercase$ que a colocou em movimento galopa ileso, e [knight1.GetSheHe] saúda vitoriosamente. Saúda vitoriosamente #EMP para mim#!, percebo, enquanto [knight1.GetSheHe] conclui seus floreios com uma breve reverência na sela.\n\n#EMP Clunk!#! Outro cavaleiro assume a quintain. Igualmente habilidoso, o feixe giratório passa longe [knight1.GetHerHim], tanto [knight2.GetWomanMan] quanto a montaria passando confortavelmente. [knight2.GetSheHe|U] controla seu cavalo bem ao lado do primeiro $knight_culture_player_no_tooltip_lowercase$ e floreia sua arma pomposamente, novamente na minha direção. O par levanta suas viseiras e mesmo a essa distância consigo vê-los olhando fixamente um para o outro."
 ep2_tournament_events.3501.t:0 "Disputando a Atenção"
 ep2_tournament_events.3502.a:0 "Quem foi o responsável por isso?! Encontrem-nos e punam-nos!"
 ep2_tournament_events.3502.b:0 "Que torneio vergonhosamente mal conservado."
 ep2_tournament_events.3502.c:0 "Eu irei pagar pelo conserto."
 ep2_tournament_events.3502.d:0 "Um golpe impressionante, [competitor.GetFirstNameNoTooltip]!"
 ep2_tournament_events.3502.desc:0 "Thunk. Thunk. Thunk. As rachaduras inconsistentes das lanças se partindo fornecem uma melodia rítmica para os surdos estrondos dos impactos da quintain.\n\nThunk. Thunk. #EMP Thonk!#! Mais cavaleiros têm sua vez, mas algo de repente parece estranho. Aquele último impacto soou incomum-\n\n[competitor.GetFirstName] se aproxima da quintain e o golpe colossal que [competitor.GetSheHe] desfere nela a fratura por completo. O poste gira pelo chão, a própria estrutura oscilando perigosamente antes de finalmente tombar com um estrondo."
 ep2_tournament_events.3502.t:0 "Catastrófe de Construção"
 ep2_tournament_events.3503.a.tt.failure:0 "[hapless_knight.GetFirstNameNoTooltip] fica irritado com a sugestão"
 ep2_tournament_events.3503.a.tt.success:0 "[hapless_knight.GetFirstNameNoTooltip] aceita sua oferta de emprego"
 ep2_tournament_events.3503.a:0 "Que talento para a comédia física!"
 ep2_tournament_events.3503.b.tt.failure:0 "[hapless_knight.GetFirstNameNoTooltip] consegue defender com sucesso o seu caso"
 ep2_tournament_events.3503.b.tt.success:0 "[hapless_knight.GetFirstNameNoTooltip] é expulso do Torneio por desacreditá-lo"
 ep2_tournament_events.3503.b:0 "[hapless_knight.GetSheHe|U] está zombando do esporte! Expulsem [hapless_knight.GetSheHe]!"
 ep2_tournament_events.3503.c:0 "Eu gosto bastante [hapless_knight.GetHerHim], sinceramente."
 ep2_tournament_events.3503.d:0 "Hah! #EMP Hah!#!"
 ep2_tournament_events.3503.desc:0 "A multidão está estranhamente agitada, como se metade estivesse resmungando e a outra metade... animada? Eu olho atentamente pelas fileiras de competidores e solto um suspiro involuntário. [hapless_knight.GetFirstName] passou todo o treinamento até agora errando o alvo de maneira impressionante e agora está se preparando para mais uma investida.\n\nConforme [hapless_knight.GetSheHe] se aproxima, [hapless_knight.GetSheHe] deixa cair completamente sua lança. Em pânico, [hapless_knight.GetFirstNameNoTooltip] olha para cima a tempo de ser #EMP golpeado#! no abdômen pela quintain! Seus braços se estendem e agarram desesperadamente o poste, mas o impulso leva [hapless_knight.GetSheHe] adiante. Poucos segundos depois, [hapless_knight.GetSheHe] balança na ponta do poste impotente, preso no ar."
 ep2_tournament_events.3503.t:0 "$tournament_header$ O Desafortunado $knight_culture_player_no_tooltip$"
 ep2_tournament_events.3504.a:0 "..."
 ep2_tournament_events.3504.desc:0 "Quando eu estava crescendo, meu antigo instrutor me ensinou que meu último suspiro deveria ocorrer exatamente antes do impacto da lança.\n\nUm passo, dois passos, três passos. Caminhar, trote. Baixar a lança, reposicionar, mirar a ponta. Respirar, expirar, acertar o alvo.\n\nSucesso! Minha lança se estilhaça, mas percebo — tarde demais — que meu cavalo ainda estava apenas trotando, não galopando. A dor é instantânea e vívida quando a maça na ponta do poste #X se choca#! nas minhas costas, me derrubando da sela.\n\nEstou suspenso no ar, o mundo parado. Ah, como meu antigo instrutor franziria a testa se eu fizesse algo imperfeito...\n\nO mundo começa a se mover. O chão se aproxima rapidamente, e de repente tudo fica escuro."
 ep2_tournament_events.3504.t:0 "Muito Lento"
 ep2_tournament_events.4001.a.tt:0 "Todos [courtiers|E] e [guests|E] ganham #COLOR_GREEN 10#! de opinião sobre você"
 ep2_tournament_events.4001.a:0 "Coloque-me de volta no meu cavalo!"
 ep2_tournament_events.4001.b:0 "Eu sou feito de matéria mais resistente do que isso."
 ep2_tournament_events.4001.c:0 "A discrição é a melhor parte da coragem."
 ep2_tournament_events.4001.desc:0 "Vá até a marca, posicione a lança, recoste-se na sela, aguarde o sinal, incline-se para frente, mire-\n\nA sequência da justa já é quase automática para mim agora, mas à medida que os dois impactos reverberam através de mim, uma dor aguda e ardente se acende ao longo do meu braço.\n\nO sangue flui livremente de uma ferida no bíceps, feita pela lança do meu oponente [versus_contestant.GetFirstNamePossessive] que cortou ferozmente meu braço.\n\nÉ uma ferida grave. Ninguém me acusaria de covardia se eu desistisse, e de fato vários serviçais preocupados estão insistindo para que eu faça exatamente isso."
 ep2_tournament_events.4001.t:0 "$tournament_versus_header$ Ferido"
 ep2_tournament_events.4002.a:0 "Serviçal! Traga um dos meus escudos extras para este [versus_contestant.GetWomanMan]!"
 ep2_tournament_events.4002.b:0 "Você está ferido? Vamos te colocar de pé!"
 ep2_tournament_events.4002.c:0 "Tal é a natureza da justa."
 ep2_tournament_events.4002.desc:0 "Thunk! Um estrondo sonoro de madeira contra madeira sinaliza que meu objetivo foi certeiro, e a força por trás disso é tamanha que [versus_contestant.GetFirstName] cambaleia precipitadamente antes de cair no chão. Eu contenho meu cavalo no final da corrida e observo meu adversário.\n\n[versus_contestant.GetFirstNameNoTooltip] se levanta com esforço, parecendo apenas sem ar e não ferido, mas seu escudo está partido ao meio no chão próximo a [versus_contestant.GetSheHe]. [versus_contestant.GetSheHe|U] o observa com tristeza enquanto um serviçal recolhe as peças, adicionando-as a um pequeno monte que reconheço como sendo o seu principal - e presumivelmente o único - escudo."
 ep2_tournament_events.4002.t:0 "$tournament_versus_header$ Desmontado"
 ep2_tournament_events.4003.a.tt:0 "Agora, onde está o juiz mais próximo?"
 ep2_tournament_events.4003.a:0 "Certamente isso não pode ser permitido?!"
 ep2_tournament_events.4003.b.tt.lose:0 "Você não consegue persuadir [versus_contestant.GetSheHe]"
 ep2_tournament_events.4003.b.tt.win:0 "Você consegue persuadir [versus_contestant.GetSheHe]"
 ep2_tournament_events.4003.b:0 "Vamos lá, você tem certeza de que quer vencer assim?"
 ep2_tournament_events.4003.c.tt.lose:0 "A lança de [versus_contestant.GetFirstNamePossessiveNoTooltip] é demais para ser superada"
 ep2_tournament_events.4003.c.tt.win:0 "Você supera sua desvantagem"
 ep2_tournament_events.4003.c:0 "Esse toco gigante não vai te salvar de mim!"
 ep2_tournament_events.4003.desc:0 "Estou trotando meu cavalo em direção à marca de partida quando algo me faz parar e franzir os olhos. A menos que meus olhos me enganem, algo verdadeiramente bizarro está acontecendo na outra extremidade do campo de justa.\n\nOs serviçais do meu oponente [versus_contestant.GetFirstNamePossessive] estão lutando para erguer a lança até [versus_contestant.GetSheHe], e com razão. A gigantesca arma é menos uma lança de madeira e mais um tronco de árvore arrancado, um eixo colossal tão comprido quanto dois homens.\n\nObservo incrédulo enquanto [versus_contestant.GetFirstNameNoTooltip] a ergue com presunção, apoiando-a no pescoço do cavalo para mantê-la firme. A multidão ronrona com uma mistura de expectativa e injustiça, vozes diversas argumentando para deixar passar ou protestando contra a falta de fair play."
 ep2_tournament_events.4003.t:0 "$tournament_versus_header$ O Tronco Poderoso"
 ep2_tournament_events.4004.a.failure:0 "Você não consegue superar [versus_contestant.GetFirstNameNoTooltip]"
 ep2_tournament_events.4004.a.success:0 "Você vence [versus_contestant.GetFirstNameNoTooltip] com a espada"
 ep2_tournament_events.4004.a:0 "Não importa para mim como eu vou te vencer!"
 ep2_tournament_events.4004.b:0 "Volte para o seu cavalo, seu tolo."
 ep2_tournament_events.4004.c:0 "A pé, sim. Mas com lanças elétricas!"
 ep2_tournament_events.4004.desc:0 "Afasto o nervosismo usual antes de uma justa ocupando-me em verificar e reverificar meus diversos equipamentos. Enquanto faço isso, porém, percebo uma presença ao meu lado. Meu oponente [versus_contestant.GetFirstName] está, curiosamente, a pé. Espada descansando em seu ombro, [versus_contestant.GetSheHe] se inclina para falar com um tom um tanto conspiratório.\n\n\"[ROOT.Char.GetFirstName]! Que tal esticar as pernas comigo?\" [versus_contestant.GetSheHe] anuncia. Em resposta à minha expressão confusa, [versus_contestant.GetSheHe] ri e aponta para o chão.\n\n\"Que tal fazermos essa rodada a pé, hein? Uma pequena pausa para dar algo diferente à multidão?"
 ep2_tournament_events.4004.t:0 "$tournament_versus_header$ Problemas à Vista"
 ep2_tournament_events.4005.a.tt:0 "Você se enfrenta como faria com qualquer outro oponente."
 ep2_tournament_events.4005.a:0 "Seria desrespeitoso fazer algo menos do que o meu melhor."
 ep2_tournament_events.4005.b.tt:0 "Você concede uma passagem de misericórdia ao seu oponente, erguendo sua lança para o céu."
 ep2_tournament_events.4005.b:0 "Honra demonstrada merece honra em igual medida!"
 ep2_tournament_events.4005.c.tt:0 "Você varre sua lança em um longo arco, garantindo derrubar seu oponente da sela."
 ep2_tournament_events.4005.c:0 "Uma oportunidade perfeita!"
 ep2_tournament_events.4005.desc:0 "O antebraço do meu oponente [versus_contestant.GetFirstNamePossessive] pende ineficazmente enquanto [versus_contestant.GetSheHe] assume sua postura. Uma careta se transforma em um gemido abafado de dor quando [versus_contestant.GetSheHe] tenta erguer sua lança. Claramente, a última rodada teve um efeito severo.\n\nObservo com certa admiração enquanto os serviçais de [versus_contestant.GetFirstNamePossessiveNoTooltip] erguem a lança em posição, prendendo-a em seu braço superior. Parece que a necessidade de demonstrar sua honra leva meu adversário a continuar competindo, mas não há esperança de que eles vençam.\n\nSaúdo com minha própria lança em resposta, enquanto a multidão nos aplaude."
 ep2_tournament_events.4005.t:0 "$tournament_versus_header$ Um(a) [versus_contestant.GetWomanMan|U] Honrável?"
 ep2_tournament_events.4006.a.tt:0 "Respeite o desejo de [versus_contestant.GetFirstNamePossessiveNoTooltip] por uma passagem de misericórdia."
 ep2_tournament_events.4006.a:0 "Não irei aceitar vitórias fáceis."
 ep2_tournament_events.4006.b.tt:0 "Você não deixa sua lança vacilar."
 ep2_tournament_events.4006.b:0 "Oh, querido, parece que eu não percebi o pedido deles!"
 ep2_tournament_events.4006.desc:0 "Os dois cavalos começam a trotar. Minha lança começa a descer para a posição, mas não vejo nenhum movimento semelhante por parte do meu adversário [versus_contestant.GetFirstName]. Em vez disso, sua lança aponta para longe de mim, completamente fora do alvo.\n\nA 'passagem de misericórdia' é bem conhecida por aqueles familiarizados com a justa; uma vez que a passagem começou, mirar deliberadamente longe do oponente sinalizará o desejo de reiniciar. É uma questão de respeito pelos competidores cumprir esse pedido.\n\nClaro, isso só acontece se você #EMP notar#! o desejo do seu oponente..."
 ep2_tournament_events.4006.t:0 "$tournament_versus_header$ Misericórdia"
 ep2_tournament_events.4007.a:0 "Que criatura miserável!"
 ep2_tournament_events.4007.b.tt:0 "[versus_contestant.GetFirstNameNoTooltip] não vai gostar disso..."
 ep2_tournament_events.4007.b:0 "Que tal um emprego?"
 ep2_tournament_events.4007.c.tt:0 "Persuadir [groom.GetSheHe] a dar uma palmada vigorosa nas ancas do cavalo."
 ep2_tournament_events.4007.c:0 "Talvez você queira ganhar algumas moedas?"
 ep2_tournament_events.4007.d:0 "Sirva bem ao seu senhor, [groom.GetFirstNameNoTooltip]."
 ep2_tournament_events.4007.desc:0 "[versus_contestant.GetFirstName|U] passa por mim em seu cavalo após uma passagem, ocupado com a rédea do animal. Caminhando ao lado está seu criado. [groom.GetSheHe|U] está vestido com roupas surpreendentemente desgastadas, o tecido se desfiando nas costuras.\n\n\"Qual é o seu nome, m[Select_CString( groom.IsFemale, 'inha', 'eu' )] [groom.GetWomanMan]?\" [groom.GetSheHe|U] olha para cima, assustado, enquanto seu senhor e cavalo seguem sem [groom.GetSheHe].\n\n\"[groom.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')].\" No meio de sua resposta, é impossível não notar o seu olhar invejoso em relação ao seu equivalente bem-apresentado cuidando do meu cavalo."
 ep2_tournament_events.4007.t:0 "$tournament_versus_header$ Condenado e Empregado"
 ep2_tournament_events.4008.a.criticalfailure:0 "Você sofre uma pequena lesão quando a multidão arremessa objetos em você"
 ep2_tournament_events.4008.a.failure:0 "A multidão entra em sua cabeça"
 ep2_tournament_events.4008.a.success:0 "Você consegue se livrar dos abusos da multidão com sucesso"
 ep2_tournament_events.4008.a:0 "Eles terão que lidar com minha vitória!"
 ep2_tournament_events.4008.b.tt:0 "Abandone a competição."
 ep2_tournament_events.4008.b:0 "Não tenho certeza se vencer seria do meu melhor interesse..."
 ep2_tournament_events.4008.desc:0 "Enquanto o barulho se espalha pelas arquibancadas, meu cavalo mexe as orelhas levemente em aflição. Eu afago sua crina tranquilizadoramente. A multidão tem sido terrivelmente hostil nesta rodada. Na verdade, enquanto a observo, eles começam a cantar.\n\n#EMP [ROOT.Char.Custom('GetNegativeChant')]#!\n\nAlguns até se inclinam sobre as barreiras, e eu noto com alarme os rostos uivantes e salpicados de saliva na primeira fila gritando para mim."
 ep2_tournament_events.4008.t:0 "$tournament_versus_header$ Quem é Você?"
 ep2_tournament_events.4009.a:0 "Hah, hah! Saia do campo de torneio, s[Select_CString( versus_contestant.IsFemale, 'ua', 'eu' )], [versus_contestant.Custom2('InsultNoun', ROOT.Char)] empobrecid[Select_CString( versus_contestant.IsFemale, 'a', 'o' )]!"
 ep2_tournament_events.4009.b:0 "\"[versus_contestant.GetFirstNameNoTooltip]! Posso lhe oferecer uma lança?\""
 ep2_tournament_events.4009.c:0 "Bem, a competição deve continuar."
 ep2_tournament_events.4009.desc.lowborn:0 "\n\nAos poucos, mas com certeza, me dou conta. [versus_contestant.GetFirstNameNoTooltip] não é de linhagem nobre. O dinheiro provavelmente é muito mais difícil de conseguir para eles do que eu esperava..."
 ep2_tournament_events.4009.desc.poor:0 "\n\nLeva alguns momentos, mas de repente me lembro. Talvez aqueles rumores sobre as dificuldades financeiras atuais de [versus_contestant.GetFirstNamePossessiveNoTooltip] tenham mais veracidade do que eu pensava..."
 ep2_tournament_events.4009.desc:0 "Crunch! Duas lanças se partem ferozmente ao atingir o alvo. Eu me recupero do impacto conforme fui ensinado, me erguendo enquanto meu cavalo diminui a velocidade. Enquanto sacudo as teias do impacto da minha cabeça, a crescente agitação na multidão me faz olhar para trás de onde vim.\n\nMeu adversário [versus_contestant.GetFirstName] está claramente em algum desconforto. Não físico, pelo que posso perceber, mas [versus_contestant.GetSheHe] está envolvido em uma discussão ou debate com um infeliz criado. Aproximando-me, ouço algumas fragmentos de sua discussão.\n\n\"O que você quer dizer com não temos mais? Você #EMP perdeu#! nosso único reserva?!\""
 ep2_tournament_events.4009.t:0 "$tournament_versus_header$ O Paladino Penúrico"
 ep2_tournament_events.4500.a:0 "Você serve!"
 ep2_tournament_events.4500.b:0 "Talvez você?"
 ep2_tournament_events.4500.c:0 "Bem, eu gosto de um jogo..."
 ep2_tournament_events.4500.desc:0 "Meu cavalo está pronto, é claro, mas a fera não é nada sem um cavaleiro habilidoso para controlá-la. Como resultado, me vejo com três possíveis cavaleiros diante de mim, todos clamando pela honra de serem escolhidos para me representar.\n\n"
 ep2_tournament_events.4500.fallback:0 "Nenhum dos três parece ser um candidato particularmente excepcional - todos eles são completos desconhecidos para mim, claramente plebeus em busca de fama e fortuna - mas eles são os únicos disponíveis."
 ep2_tournament_events.4500.guest.tt:0 "[jockey2.GetFirstNameNoTooltip] parece ser uma boa escolha."
 ep2_tournament_events.4500.guest:0 "Outro voluntário imediato é o meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jockey2') )] [jockey2.GetFirstName], que talvez queira justificar minha hospitalidade."
 ep2_tournament_events.4500.knight.tt:0 "Vamos com [jockey1.GetFirstNameNoTooltip]."
 ep2_tournament_events.4500.knight:0 "O primeiro é meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jockey1') )] [jockey1.GetFirstName], um candidato adequado considerando a experiência dele em lidar com cavalos em sua profissão."
 ep2_tournament_events.4500.nobody.tt:0 "Por que não arriscar com [jockey3.GetFirstNameNoTooltip]?"
 ep2_tournament_events.4500.nobody:0 "\n\nO último é um completo desconhecido para mim, um [jockey3.GetWomanMan] local sem nenhuma notoriedade, que atende por [jockey3.GetFirstName]."
 ep2_tournament_events.4500.t:0 "$tournament_header$ Cavaleiros"
 ep2_tournament_events.5501.a:0 "Vou mostrar a eles que tudo se resume à #EMP apresentação#!."
 ep2_tournament_events.5501.b.failure:0 "Sua tentativa é um desastre"
 ep2_tournament_events.5501.b.success:0 "Você improvisa com sucesso"
 ep2_tournament_events.5501.b:0 "Hora de improvisar!"
 ep2_tournament_events.5501.c.failure:0 "Todos pensam que você é um tolo irracional"
 ep2_tournament_events.5501.c.success:0 "Foi uma artimanha de [enemy.GetFirstNameNoTooltip]"
 ep2_tournament_events.5501.c:0 "Isso foi planejado. Julguem!"
 ep2_tournament_events.5501.desc:0 "Vivas selvagens irrompem da multidão reunida quando [enemy.GetFirstName] termina o seu recital com um floreio e uma reverência. A única pessoa que não está assobiando e batendo palmas sou eu, coincidentemente.\n\n#EMP Como#! [enemy.GetSheHe] poderia saber? Isso foi planejado? Ou talvez, de alguma forma, por alguma maquinação de [ROOT.Char.GetFaith.DevilName], fosse simplesmente uma coincidência que os versos de [enemy.GetFirstNamePossessiveNoTooltip] acabassem quase #EMP idênticos#! aos meus?\n\nOs espectadores reunidos ficam em silêncio, esperando. Agora é a minha vez."
 ep2_tournament_events.5501.t:0 "$tournament_contest_header$ Momento Roubado"
 ep2_tournament_events.5502.a:0 "Chega! Isso não é culpa [contestant.GetHerHim]!"
 ep2_tournament_events.5502.b:0 "Vaiii! #EMP Vaiii!#!"
 ep2_tournament_events.5502.c.failure:0 "A multidão ignora seus apelos"
 ep2_tournament_events.5502.c.success:0 "Você persuade com sucesso a multidão"
 ep2_tournament_events.5502.c:0 "Bem, isso é muito inapropriado."
 ep2_tournament_events.5502.culture:0 "Algo não parece se encaixar, penso. Certamente [contestant.GetFirstNameNoTooltip] não estaria familiarizado com essa música, já que [contestant.GetSheHe] é de origem [contestant.GetCulture.GetName]. Uma pequena lembrança salta à minha mente, involuntariamente: o trabalhador que construiu o palco estava assobiando essa mesma melodia antes!"
 ep2_tournament_events.5502.end:0 "\n\nDe volta ao palco, [contestant.GetFirstNameNoTooltip] cessa verbalmente enquanto a multidão explode em vaias, alguns vegetais escolhidos chovendo sobre [contestant.GetSheHe] enquanto [contestant.GetSheHe] se protege dos projéteis."
 ep2_tournament_events.5502.friend:0 "Percebo instantaneamente o que aconteceu, mesmo quando a multidão continua a hostilizar meu amigo [contestant.GetFirstNameNoTooltip]. [contestant.GetSheHe|U] é de origem [contestant.GetCulture.GetName] e certamente ouviu essa melodia sem perceber o quão difundida ela é!"
 ep2_tournament_events.5502.start:0 "Basta um verso para que os murmúrios comecem. [contestant.GetFirstName] está no palco, de maneira bastante #EMP audaciosa#!, recitando versos de uma canção popular local! Resmungos insatisfeitos entre a multidão começam à medida que [contestant.GetSheHe] continua.\n\n"
 ep2_tournament_events.5502.t:0 "$tournament_contest_header$ Tudo um Mal-entendido"
 ep2_tournament_events.5503.a.tt:0 "Felizmente, tenho alguns versos antigos guardados na memória!"
 ep2_tournament_events.5503.a:0 "Deve haver algo que eu possa fazer para superar isso..."
 ep2_tournament_events.5503.b.tt:0 "Posso escapar rapidamente enquanto todos se atrapalham!"
 ep2_tournament_events.5503.b:0 "Eis aqui! Moeda grátis!"
 ep2_tournament_events.5503.c.tt:0 "Os espectadores vão #EMP adorar#! isso!"
 ep2_tournament_events.5503.c:0 "Alguma #EMP teatralidade#! não seria ruim."
 ep2_tournament_events.5503.d.lose:0 "A multidão não é enganada"
 ep2_tournament_events.5503.d.win:0 "Você distrai a multidão com sucesso"
 ep2_tournament_events.5503.d:0 "Olhem! Um macaco de três cabeças!"
 ep2_tournament_events.5503.desc:0 "Trombetas soam! As massas aplaudem e gritam! Subo ao palco do recital, acenando. Um silêncio cai enquanto adoto uma postura heroica, com o peito inflado e os braços abertos.\n\nAbro a boca. Está seca. Muito, muito seca. Tento falar, mas as palavras não saem. Centenas de olhos me encaram.\n\nPor que não consigo falar?!"
 ep2_tournament_events.5503.e:0 "\"A-#EMP hem#!. Como nossos, uh, antepassados já c-c-cantaram...\""
 ep2_tournament_events.5503.fallback:0 "Um nó no meu estômago, desconhecido há poucos momentos, aperta nauseantemente, e os murmúrios da multidão se intensificam."
 ep2_tournament_events.5503.rich:0 "Enquanto os murmúrios da multidão se intensificam, minhas mãos trêmulas fecham algo, algo grande e de couro: minha bolsa de moedas."
 ep2_tournament_events.5503.seducer:0 "O pânico me faz tremer, minha respiração ofegante de uma maneira... #EMP familiar#!. Um lembrete... de que a paixão nunca me falhou antes..."
 ep2_tournament_events.5503.t:0 "$tournament_contest_header$ Pânico de Palco"
 ep2_tournament_events.5504.a.failure:0 "Você é abafado pela tempestade"
 ep2_tournament_events.5504.a.success:0 "O clima dá pathos às suas palavras"
 ep2_tournament_events.5504.a:0 "...e eu #EMP adoro#! um desafio!"
 ep2_tournament_events.5504.b:0 "E se formos atingidos por um raio?!"
 ep2_tournament_events.5504.desc:0 "#BOL Krrraaaccckoooooommmm!#!\n\nUm repentino flash de relâmpago precede o rugido do trovão, e à medida que me aproximo do palco elevado, fica claro que o clima agradável anterior deu lugar a condições decididamente sombrias. Mal dou o primeiro passo, a chuva começa a cair.\n\nA multidão permanece expectante, um tanto relutante, ficando cada vez mais encharcada a cada minuto. Abro a boca, e um novo estrondo sonoro percorre toda a reunião. Olho para o céu.\n\nBem, isso será um desafio e tanto."
 ep2_tournament_events.5504.t:0 "$tournament_contest_header$ A Vontade do Clima"
 ep2_tournament_events.5505.compassionate:0 "...se você comprar uma bebida para [enemy.GetFirstNameNoTooltip], [enemy.GetSheHe] vai insistir em pagar!"
 ep2_tournament_events.5505.desc:0 "Mais um verso concluído, mais um sucesso estrondoso com a multidão. Estou me divertindo muito, e a apreciação ruidosa da multidão só eleva ainda mais meu ânimo.\n\nEnquanto recebo alguns aplausos após uma frase particularmente espirituosa, vejo um dos meus oponentes, [enemy.GetFirstName], ensaiando suas falas com uma expressão carrancuda no rosto. Uma nova explosão de ovação confirma minhas suspeitas: [enemy.GetSheHe] claramente não está feliz com a recepção que estou recebendo!\n\nBem então. Talvez isso"
 ep2_tournament_events.5505.end:0 "precisa de uma linha preparada #EMP especialmente#! para [enemy.GetHerHim]!\n\n\"Se [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself|U] estivesse aqui, com certeza [ROOT.Char.GetFaith.HighGodNameSheHe|U] diria...\""
 ep2_tournament_events.5505.fallback:0 "...vencer [enemy.GetFirstNameNoTooltip] nisso é brincadeira de criança!"
 ep2_tournament_events.5505.fat:0 "...até [ROOT.Char.GetFaith.HighGodNameSheHe] não poderia carregar [enemy.GetFirstNamePossessiveNoTooltip]!"
 ep2_tournament_events.5505.getout:0 "...deixa pra lá."
 ep2_tournament_events.5505.idiot:0 "...[enemy.GetFirstNameNoTooltip] tem mau cheiro!"
 ep2_tournament_events.5505.maidenless:0 "...[enemy.GetFirstNameNoTooltip] é um amante verdadeiramente #EMP trágico#!"
 ep2_tournament_events.5505.old:0 "...até [ROOT.Char.GetFaith.HighGodNameSheHe] não poderia deter a decadência de [enemy.GetFirstNamePossessiveNoTooltip]!"
 ep2_tournament_events.5505.opinion.tt:0 "Todo parente próximo não Sadista:"
 ep2_tournament_events.5505.start.compassionate:0 "alma desafortunada"
 ep2_tournament_events.5505.start.fallback:0 "[enemy.Custom2('InsultNoun', ROOT.Char)] [enemy.Custom2('InsultAdjective', ROOT.Char)]"
 ep2_tournament_events.5505.start.fat:0 "tolo choramingão e gorduroso"
 ep2_tournament_events.5505.start.femalevirgin:0 "desajeitado solitário"
 ep2_tournament_events.5505.start.malevirgin:0 "triste solitário"
