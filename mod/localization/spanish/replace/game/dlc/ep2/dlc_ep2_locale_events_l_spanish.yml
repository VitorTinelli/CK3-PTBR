l_spanish:
 ancient_stone_artifact:0 "Placa Antiga"
 ancient_stone_artifact_desc:0 "Uma placa com uma inscrição antiga. Parece ter sido reutilizada como parede em uma vila."
 artifact_monthly_piety_7_modifier:0 "Inscrição de Oração"
 artifact_monthly_prestige_3_modifier:0 "Fita Decorativa"
 artifact_monthly_prestige_7_modifier:0 "Inscrição de Lema"
 artifact_tournament_sharpened_blade_modifier:0 "Lâmina Afiada"
 chess_trinket.desc:0 "Uma bela figura esculpida em cristal de rocha. Sua forma abstrata torna difícil dizer o que representa."
 chess_trinket:0 "Peça de Xadrez"
 drinks_round_tt:0 "Cada bebedor"
 ep2_locale_events.1000.a:0 "Taberneiro, mais uma aqui!"
 ep2_locale_events.1000.alcohol:0 "\n\n[drinking_leader.GetSheHe|U] está cercado por um grupo de amigos e novos conhecidos, outros participantes do próximo concurso de [activity.GetCurrentPhase.GetPhase.GetName], todos se deliciando com [host.Custom('RegionalAlcoholicDrink')] enquanto trocam histórias.\n\nAo passar, você não consegue deixar de considerar encorajar essa pequena sessão..."
 ep2_locale_events.1000.b:0 "A conta da mesa é por minha conta!"
 ep2_locale_events.1000.c:0 "Acho que esse bando já teve o suficiente."
 ep2_locale_events.1000.d:0 "Aproveite sua noite, [drinking_leader.GetFirstNameNoTooltip]!"
 ep2_locale_events.1000.hangover_tt:0 "Nunca mais..."
 ep2_locale_events.1000.independent:0 "Um grande rugido de risadas explode na mesa de [drinking_leader.GetTitledFirstNamePossessive] no canto da taverna."
 ep2_locale_events.1000.liege:0 "Um grande rugido de risadas ecoa do canto, onde [drinking_leader.GetTitledFirstName], [drinking_leader.GetLiege.GetTitledFirstNamePossessive] [drinking_leader.GetLiege.Custom2('RelationToMeShort', drinking_leader)] está sentado."
 ep2_locale_events.1000.t:0 "$tournament_locale_tavern$: Mais uma rodada"
 ep2_locale_events.1002.a:0 "Vamos lá, não há necessidade de hostilidade. Posso te pagar uma bebida?"
 ep2_locale_events.1002.b.failure:0 "Você acorda algumas horas depois, grogue, com uma terrível dor de cabeça"
 ep2_locale_events.1002.b.success:0 "Você vence [local_drunk.GetFirstNameNoTooltip] na competição de bebida"
 ep2_locale_events.1002.b:0 "Ah, é? #EMP Traga os canecos!#!"
 ep2_locale_events.1002.c:0 "Sente-se e cale a boca, seu bêbado sem esperança."
 ep2_locale_events.1002.desc:0 "O pub local está lotado, como é de se esperar quando um Torneio chega à cidade. Entre todos os recém-chegados, porém, há um(a) [local_drunk.GetWomanMan] que claramente é uma presença constante no estabelecimento. [local_drunk.GetSheHe|U] me olha com suspeita quando me sento.\n\n\"O que você está fazendo aqui?\" [local_drunk.GetSheHe|U] finalmente exclama quando minha bebida chega. Eu viro para encarar [local_drunk.GetSheHe]; [local_drunk.GetSheHe] se levanta sem firmeza.\n\n\"Perdoe minhas suposições, #EMP m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord]#!,\" — Uma reverência floreada e com desdém pontua a declaração — \"mas eu acho que você não aguentaria nem metade disso, quanto mais tudo!\""
 ep2_locale_events.1002.t:0 "$tournament_locale_tavern$: Desafie para Beber?"
 ep2_locale_events.1010.b:0 "Passe esses dados aqui!"
 ep2_locale_events.1010.c:0 "Não sou jogador."
 ep2_locale_events.1010.desc:0 "A penumbra da taverna é amenizada pelo crepitar do fogo e pela animação contínua dos festeiros. Eu passo por dois bêbados particularmente barulhentos e sento-me em uma mesa próxima, vazia exceto por uma figura.\n\n\"Uma noite agradável, não é?\" [gambler.GetFirstName] faz um gesto em direção à multidão desgrenhada. Eu concordo educadamente. Mal termino de recolocar minha cabeça em sua posição quando [gambler.GetFirstNameNoTooltip] desliza um conjunto de dados e copos sobre a mesa.\n\n\"Quer participar de um jogo simples? Até um tolo poderia jogá-lo! Ambos lançamos os dados sob os copos, e você adivinha se seu lançamento é maior ou menor que o meu.\" [gambler.GetSheHe|U] sorri, um brilho de jogador em seus olhos. \"Melhor de três jogadas.\""
 ep2_locale_events.1010.t:0 "$tournament_locale_tavern$: Que tal um jogo?"
 ep2_locale_events.1011.a:0 "Meu lançamento é... maior!"
 ep2_locale_events.1011.average:0 "\n\nAs mãos de [gambler.GetFirstNamePossessiveNoTooltip] tremem levemente e eu abro a boca triunfante, mas seus olhos têm um brilho. Seria o tremor uma pista? E os olhos? Alguma disso é útil?"
 ep2_locale_events.1011.b:0 "Meus dados são menores."
 ep2_locale_events.1011.deceitful:0 "\n\nOs olhos de [gambler.GetFirstNamePossessiveNoTooltip] penetram nos meus, sem um lampejo de emoção em qualquer lugar de seu rosto. Eu desvio o olhar e observo a sua linguagem corporal, mas é como se [gambler.GetSheHe] fosse uma estátua."
 ep2_locale_events.1011.opening:0 "Os dados sacodem e pulam dentro dos copos antes de ambos os colocarmos violentamente na mesa. Eu levanto a lateral do copo mais próxima de mim, cobrindo cuidadosamente o conteúdo.\n\n#BOL [ROOT.Var('root_dice_1').GetValue|0]#!. Eu observo [gambler.GetFirstName] atentamente, procurando por pistas."
 ep2_locale_events.1011.t:0 "$tournament_locale_tavern$: Primeiro Lance"
 ep2_locale_events.1011.tell.bad:0 "\n\nOs olhos de [gambler.GetFirstNamePossessiveNoTooltip] desviam para baixo, uma, duas vezes. Quase desapareceu tão rápido quanto apareceu, mas a menor hesitação pode revelar as verdades mais profundas..."
 ep2_locale_events.1011.tell.good:0 "\n\nSerá que eu vi um leve franzir dos lábios de [gambler.GetFirstNamePossessiveNoTooltip]? Quase desapareceu tão rápido quanto apareceu, mas a menor hesitação pode revelar as verdades mais profundas..."
 ep2_locale_events.1012.a:0 "Acredito que seja maior."
 ep2_locale_events.1012.average:0 "\n\nOs olhos de [gambler.GetFirstNamePossessiveNoTooltip] vasculham o ambiente, olhando para qualquer lugar, exceto para os meus. Seu braço treme um pouco ao erguer o copo. Eu simplesmente não consigo ter certeza se isso é relevante ou não..."
 ep2_locale_events.1012.b:0 "Com certeza é menor."
 ep2_locale_events.1012.deceitful:0 "\n\nA postura de [gambler.GetFirstNamePossessiveNoTooltip] é confiante, quase arrogante, mas [gambler.GetSheHe] nem mesmo levantou o copo! Seus olhos piscam para baixo enquanto [gambler.GetSheHe] inclina o seu copo para longe bruscamente, antes de colocá-lo de volta nivelado com a mesa. Seu comportamento não muda um pouco."
 ep2_locale_events.1012.dice_reveal:0 "\n\nEu levanto a lateral do meu copo mais próxima de mim. As pequenas marcações nos dados revelam o número: #BOL [ROOT.Var('root_dice_2').GetValue|0]#!. Eu coloco o copo de volta na mesa e olho para cima."
 ep2_locale_events.1012.opening.draw:0 "Revelamos nossos dados. Enquanto os copos desaparecem, leva apenas um momento para percebermos que os números são iguais.\n\n\"Bem, então. Vamos considerar isso um empate.\" A decepção de [gambler.GetFirstNamePossessive] é evidente. \"Próxima rodada!\" Os dados chacoalham nos copos mais uma vez."
 ep2_locale_events.1012.opening.lose:0 "Revelamos nossos dados. Leva um instante para ambos percebermos que eu perdi. [gambler.GetFirstName] sorri orgulhosamente.\n\n\"Infelizmente! Parece que você errou. Próxima rodada!\" Os dados chacoalham nos copos mais uma vez."
 ep2_locale_events.1012.opening.win:0 "Revelamos nossos dados. Leva um instante para ambos percebermos que eu ganhei!\n\n\"Ah! Bem adivinhado! A primeira rodada é sua!\" Os lábios de [gambler.GetFirstNamePossessive] sorriem, mas não chegam a alcançar seus olhos. \"Próxima rodada!\" Os dados chacoalham nos copos mais uma vez."
 ep2_locale_events.1012.t:0 "$tournament_locale_tavern$: Segunda Rodada"
 ep2_locale_events.1012.tell.bad:0 "\n\nUm ligeiro estreitamento dos olhos, uma pequena mudança de peso. [gambler.GetFirstName] está escondendo algo. Talvez esse lançamento não seja muito alto..."
 ep2_locale_events.1012.tell.good:0 "\n\n[gambler.GetFirstName] bate os dedos na mesa. Seria esse inclinar de cabeça em direção ao teto uma dica sutil? Certamente [gambler.GetSheHe] parece estar sentado mais ereto do que antes..."
 ep2_locale_events.1013.a:0 "Eu acredito nos meus dados. Maior!"
 ep2_locale_events.1013.average:0 "\n\n[gambler.GetFirstNamePossessiveNoTooltip] tenta me encarar, mas seu olhar vacila. Um lábio trêmulo revela #EMP algo#!, mas o que poderia ser?"
 ep2_locale_events.1013.b:0 "Meu lançamento é menor."
 ep2_locale_events.1013.deceitful:0 "\n\nA impassividade de [gambler.GetFirstNamePossessive] ao longo dessa batalha de astúcias tem sido verdadeiramente impressionante, e não é diferente aqui. A completa falta de emoção em seu rosto é quase chocante. Terá que ser uma questão de pura sorte."
 ep2_locale_events.1013.dice_reveal:0 "\n\nEu levanto a lateral do meu copo mais próxima de mim. As pequenas marcações nos dados revelam o número: #BOL [ROOT.Var('root_dice_3').GetValue|0]#!. Eu coloco o copo de volta na mesa e olho para cima."
 ep2_locale_events.1013.opening:0 "Revelamos nossos dados simultaneamente, mas imediatamente fica claro que será necessário uma terceira rodada. Pegamos nossos copos e nossos dados para a rodada final, em que o vencedor leva tudo."
 ep2_locale_events.1013.t:0 "$tournament_locale_tavern$: Decisão"
 ep2_locale_events.1013.tell.bad:0 "\n\n[gambler.GetFirstName] passa sua mão distraído pela cabeça. Desesperado? Será que foi um lançamento especialmente baixo? [gambler.GetSheHe|U] me vê e coloca um semblante corajoso. Pode ser uma dupla armadilha..."
 ep2_locale_events.1013.tell.good:0 "\n\nApós três rodadas, as dicas de [gambler.GetFirstNamePossessive] estão se tornando quase óbvias. Seu nariz se dilata imperceptivelmente quando o lançamento é alto, tenho certeza disso. Mas será apenas um blefe?"
 ep2_locale_events.1014.a:0 "Taberneiro! As bebidas são por minha conta!"
 ep2_locale_events.1014.b:0 "Ah, o sabor da vitória!"
 ep2_locale_events.1014.c:0 "Uma bebida para afogar minhas mágoas, acho."
 ep2_locale_events.1014.d:0 "Caramba!"
 ep2_locale_events.1014.draw:0 "Nós... empatamos? [gambler.GetFirstName] esfrega a cabeça com ar de pesar, enquanto cada um de nós recupera as pequenas bolsas de ouro que tínhamos empilhado na mesa para o vencedor.\n\n\"Bem, às vezes os dados agem de maneiras misteriosas.\" [gambler.GetFirstNameNoTooltip] diz, dando de ombros. \"Bom jogo, mesmo assim.\" [gambler.GetSheHe|U] se levanta e sai vagando."
 ep2_locale_events.1014.e:0 "Bem, é isso então, suponho."
 ep2_locale_events.1014.f:0 "Depois disso, eu poderia beber algo!"
 ep2_locale_events.1014.lose:0 "Eu perdi! [gambler.GetFirstName] comemora animadamente enquanto [gambler.GetSheHe] pega as bolsas que ambos apostamos.\n\n\"Melhor sorte da próxima vez!\" [gambler.GetSheHe|U] ri alegremente, afastando-se com os braços cheios de dinheiro.\n\nEu recosto na cadeira, desanimado."
 ep2_locale_events.1014.opening:0 "Os copos são levantados pela última vez. A pequena multidão que se reuniu ao nosso redor se inclina para ver que...\n\n"
 ep2_locale_events.1014.t:0 "$tournament_locale_tavern$: Bem Apostado"
 ep2_locale_events.1014.win:0 "Eu sou o vencedor! [gambler.GetFirstName] coloca a face mais corajosa que [gambler.GetSheHe] pode reunir, mas sua irritação é clara. [gambler.GetSheHe|U] empurra as bolsas que apostamos para o meu lado da mesa e sai bufando, no limite da cortesia.\n\nEu recosto na cadeira, tão alegre quanto mentalmente exausto."
 ep2_locale_events.1050.a.tt:0 "Talvez eles gostariam de saber sobre esse pequeno arranjo. A menos, é claro, que a moeda seja boa o suficiente para calar uma língua..."
 ep2_locale_events.1050.a:0 "Não suponho que aqueles ali sejam seus colegas jogadores?"
 ep2_locale_events.1050.b:0 "#EMP Covarde?!#! Eu vou competir sem malditas #EMP manoplas!#!"
 ep2_locale_events.1050.c:0 "Eu poderia usar a moeda..."
 ep2_locale_events.1050.d:0 "Que proposição vergonhosa!"
 ep2_locale_events.1050.desc:0 "Mal entrei na taverna quando sou abordado por uma figura. [wealthy_gambler.GetFirstName] bate no meu ombro e me leva para um canto isolado, diminuindo a voz para um tom conspiratório.\n\n\"Você está participando das hastiludes, não é mesmo?\" [wealthy_gambler.GetSheHe|U] continua sem nem mesmo notar meu reconhecimento. \"Bem, eu tenho uma aposta um tanto incomum, você vê. Um dos meus... associados de negócios acha que você é meio #EMP medroso#!, por assim dizer.\" [wealthy_gambler.GetSheHe|U] acalma minhas protestações imediatas.\n\n\"Eu defendi sua honra, é claro que defendi, [ROOT.Char.Custom('FormOfAddressForLiege')]! Eu disse que você seria corajoso o suficiente para competir sem capacete no torneio! Claro, se você pudesse #EMP garantir#! que isso acontecesse, bem, imagino que eu poderia fazer valer a pena para você..."
 ep2_locale_events.1050.t:0 "$tournament_locale_tavern$: Um [ROOT.Char.GetWomanMan|U] de Apostas?"
 ep2_locale_events.1060.a.failure:0 "Você perde seu ouro"
 ep2_locale_events.1060.a.success:0 "Você ganha o dobro"
 ep2_locale_events.1060.a:0 "\"Minha carta é maior!\""
 ep2_locale_events.1060.b:0 "\"Minha carta é menor!\""
 ep2_locale_events.1060.c:0 "\"Não desejo participar de jogos de azar.\""
 ep2_locale_events.1060.desc:0 "\"Hah! Patife!\" Ouço alguém gritar quando abro a porta. Uma [tournament_gambler.GetWomanMan] sorri, satisfeita, enquanto [tournament_gambler.GetSheHe] pega o ouro depositado na mesa. \"Bah!\" Reclama o seu oponente, batendo na madeira enquanto [tournament_gambler.GetSheHe] se levanta.\n\nO estranho trava olhares comigo, fazendo uma leve reverência. \"Gostaria o [ROOT.Char.GetTitleAsNameNoTooltip] de participar de um jogo de cartas? Eu coloco a minha na mesa e você aposta se a sua será maior ou menor. O vencedor leva tudo. Tão simples quanto parece.\"\n\n\"Cinco,\" [tournament_gambler.GetSheHe] diz, colocando a sua carta na mesa."
 ep2_locale_events.1060.t:0 "Patifes e Tolos"
 ep2_locale_events.1070.a:0 "É o momento perfeito para uma conversa animada."
 ep2_locale_events.1070.b:0 "Preciso garantir que eu pareça bem."
 ep2_locale_events.1070.c:0 "Só quero continuar bebendo."
 ep2_locale_events.1070.desc.alcohol:0 "[ROOT.Char.Custom('RegionalAlcoholicDrink')]"
 ep2_locale_events.1070.desc.intro:0 "Estou sentado(a) na taverna com um pequeno grupo de cortesãos, 'Vi aquele nobre cavaleiro segurando o cartaz de alguém', sussurra um deles e eu rapidamente me perco em meus próprios pensamentos, observando o tremeluzir das velas.\n\nEnquanto dou um gole de"
 ep2_locale_events.1070.desc.no_alcohol:0 "[ROOT.Char.Custom('RegionalDrink')]"
 ep2_locale_events.1070.desc.outro:0 "Relembro daquele momento em que [my_memory.GetDescription], com um largo sorriso.\n\n\"Você quer ouvir uma história de verdade?\" pergunto, virando-me para meus companheiros."
 ep2_locale_events.1070.t:0 "Tempos Passados"
 ep2_locale_events.1500.a:0 "Traga-me glória, [ROOT.Char.GetFaith.WarGodName|U]."
 ep2_locale_events.1500.b:0 "Dificulte a vida do meu [ROOT.Char.Custom2('RelationToMeShort', bad_prayer_target)], [bad_prayer_target.GetFirstNamePossessiveNoTooltip]."
 ep2_locale_events.1500.c:0 "Sorria para o meu [ROOT.Char.Custom2('RelationToMeShort', good_prayer_target)], [good_prayer_target.GetFirstNameNoTooltip]."
 ep2_locale_events.1500.d:0 "Punição para o meu [ROOT.Char.Custom2('RelationToMeShort', backup_prayer_target)], [backup_prayer_target.GetFirstNameNoTooltip]!"
 ep2_locale_events.1500.desc:0 "\n\nRefletindo na presença do [ROOT.Char.GetFaith.PantheonTerm], me pego pensando no que eu desejo, no fundo do meu coração, ver surgir desses dias de festividade."
 ep2_locale_events.1500.e:0 "Guie a mão do meu [ROOT.Char.Custom2('RelationToMeShort', backup_prayer_target)], [backup_prayer_target.GetFirstNamePossessiveNoTooltip]."
 ep2_locale_events.1500.f:0 "Vitória para [wager_prayer_target.GetFirstNameNoTooltip] e para minha bolsa!"
 ep2_locale_events.1500.g:0 "Deixe-me encontrar a paz interior."
 ep2_locale_events.1500.host_faith:0 "Conforme [tournament_priest.GetFirstName] se afasta para me deixar se aproximar, eu aproveito um momento solene, sozinho no [ROOT.Char.GetFaith.HouseOfWorship] próximo às instalações do torneio."
 ep2_locale_events.1500.other_faith:0 "Eu aproveito um momento para mim mesmo no pequeno santuário temporário [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] próximo à [activity.GetCurrentPhase.GetCurrentLocation.GetFaith.HouseOfWorship] de [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip], [tournament_priest.GetFirstName] mantendo uma distância respeitosa."
 ep2_locale_events.1500.t:0 "$tournament_locale_religious_building$: Favores do [ROOT.Char.GetFaith.HighGodNamePossessive]"
 ep2_locale_events.1501.a.failure:0 "[seduce_target.GetFirstNameNoTooltip|U] fica desanimada com a sua demonstração"
 ep2_locale_events.1501.a.success:0 "Sua performance toca uma corda"
 ep2_locale_events.1501.a.tt:0 "Meu fervor religioso não conhece limites, querida [seduce_target.GetFirstNameNoTooltip]!"
 ep2_locale_events.1501.a:0 "Vou provar minha devoção sem deixar dúvidas!"
 ep2_locale_events.1501.b.failure:0 "[seduce_target.GetFirstNameNoTooltip|U] fica horrorizado(a) com a sua apostasia"
 ep2_locale_events.1501.b.success:0 "[seduce_target.GetFirstName|U] se deleita com seu cinismo"
 ep2_locale_events.1501.b.tt:0 "Um sutil revirar de olhos e um sorriso cúmplice enquanto eu realizo meus rituais devem transmitir a mensagem para [seduce_target.GetFirstNameNoTooltip] de forma bastante clara."
 ep2_locale_events.1501.b:0 "Acho que [seduce_target.GetFirstNameNoTooltip] é um pouco mais descontraído(a)."
 ep2_locale_events.1501.c:0 "Talvez eu deva apenas sair."
 ep2_locale_events.1501.desc:0 "Em busca de alguma orientação, me encontro vagando no [ROOT.Char.GetFaith.HouseOfWorship] para me centrar. Por um verdadeiro golpe de sorte, encontro algo muito mais interessante do que me centrar: [seduce_target.GetFirstName] está parada um tanto melancólica perto da porta.\n\n[seduce_target.GetSheHe|U] me lança um meio sorriso, claramente distraída. Agora é a oportunidade perfeita para conquistar [seduce_target.GetSheHe] com uma demonstração de súplica religiosa!\n\nOu... talvez não? O que [seduce_target.GetSheHe] preferiria? Talvez [seduce_target.GetSheHe] seja do tipo discreto?"
 ep2_locale_events.1501.t:0 "$tournament_locale_religious_building$: Adoração Performática"
 ep2_locale_events.1510.a:0 "Isso é sacrilégio! Guardas, prendam-nos!"
 ep2_locale_events.1510.alcohol:0 "canecas e barris nas mãos."
 ep2_locale_events.1510.b:0 "Festa? Alguém disse festa?"
 ep2_locale_events.1510.c:0 "Removam esse [instigator_scope.Custom('GetUnbelieverName')] [instigator_scope.GetFaith.GetAdjectiveNoTooltip] imundo!"
 ep2_locale_events.1510.closing:0 "\n\n[instigator_scope.GetTitledFirstName], claramente o instigador, sorri bobamente, \"O que é isso aqui?! Cadê a música?\"\n\n[tournament_priest.GetFirstName] observa, paralisado(a) de incredulidade e horror."
 ep2_locale_events.1510.d:0 "Saiam, seus foliões adoráveis."
 ep2_locale_events.1510.desc:0 "À medida que o silêncio cai sobre os fiéis reunidos para a cerimônia diária, a calma é repentinamente interrompida por uma abordagem rápida de gritos e alvoroço.\n\nA porta se abre violentamente, e uma dúzia de festeiros rindo caem dentro do [ROOT.Char.GetFaith.HouseOfWorship],"
 ep2_locale_events.1510.hashish:0 "fedendo a haxixe."
 ep2_locale_events.1510.t:0 "$tournament_locale_religious_building$: Orgia Sacrílega"
 ep2_locale_events.1520.a:0 "Um presságio! Isso anuncia minha vitória!"
 ep2_locale_events.1520.b:0 "As luas são redondas como moedas. É riqueza, obviamente."
 ep2_locale_events.1520.c:0 "Duas silhuetas perfeitamente decapitadas..."
 ep2_locale_events.1520.d:0 "Eu já vi isso antes... em um livro sobre as estrelas."
 ep2_locale_events.1520.desc:0 "\"Um presságio! Um sinal!\" Eu ouço gritos vindo da [ROOT.Char.GetFaith.HouseOfWorship] enquanto me aproximo da porta. [tournament_priest.GetTitledFirstName] esbarra em mim, apontando para o céu. Seguindo os olhos frenéticos [tournament_priest.GetHerHim], eu vejo: A lua. Outra lua.\n\n\"Eu li sobre isso nos arquivos antigos\", [tournament_priest.GetSheHe] continua, \"isso anuncia algo — mas o quê?\""
 ep2_locale_events.1520.e:0 "Isso não significa nada."
 ep2_locale_events.1520.superstitious:0 "Você se torna supersticioso(a)"
 ep2_locale_events.1520.t:0 "Duas Luas"
 ep2_locale_events.1530.a.failure:0 "Não há ninguém que você conheça aqui"
 ep2_locale_events.1530.a.success:0 "Você encontra um antepassado nas criptas"
 ep2_locale_events.1530.a:0 "Gostaria de encontrar um dos meus antepassados...."
 ep2_locale_events.1530.b.christian:0 "E ao pó eu retornarei."
 ep2_locale_events.1530.b.fallback:0 "Em breve serei eu."
 ep2_locale_events.1530.c:0 "Pó ao pó! Que visão inspiradora!"
 ep2_locale_events.1530.d:0 "Hm... e se...?"
 ep2_locale_events.1530.desc.intro:0 "O pátio ao redor da [ROOT.Char.GetFaith.HouseOfWorship] está deserto perto do pôr do sol. Ouço um ruído entre as folhas e vejo a silhueta de um pequeno animal correndo entre as lápides. As esculturas quase desapareceram em algumas delas. Claramente visíveis em outras.\n\nDou um passo em direção a elas"
 ep2_locale_events.1530.desc.middle:0 ". Quando chegar minha hora, vou garantir que tenha um lugar de descanso melhor do que este."
 ep2_locale_events.1530.desc.old:0 "porque está tarde. Porque vai continuar ficando mais tarde. Porque nunca esteve tão tarde na minha vida."
 ep2_locale_events.1530.desc.young:0 "e elas parecem tão distantes. Quase impossíveis."
 ep2_locale_events.1530.t:0 "Pó Você É"
 ep2_locale_events.2001.a.tt:0 "[improve_armour.GetName] recebe um modificador [prestige|E]"
 ep2_locale_events.2001.a:0 "Deixe-a brilhando como um espelho!"
 ep2_locale_events.2001.b.tt:0 "[improve_armour.GetName] recebe um modificador [prowess|E]"
 ep2_locale_events.2001.b:0 "Prefiro que ela seja lubrificada e mantida."
 ep2_locale_events.2001.c:0 "Ela está em bom estado como está."
 ep2_locale_events.2001.desc:0 "Coloco minha [improve_armour.GetName] no balcão, e [tournament_armorer.GetFirstName] passa a mão sobre ela.\n\n\"Ela está em péssimo estado. Já faz um tempo desde que você mandou sua armadura ser reparada, não é mesmo?\" [tournament_armorer.GetSheHe|U] suspira e olha para os projetos inacabados que esperam por [tournament_armorer.GetSheHe].\n\n\"Não tenho muito tempo. Talvez o suficiente para polir, ou quem sabe lubrificar para uma pequena manutenção. O que você deseja fazer?"
 ep2_locale_events.2001.t:0 "$tournament_locale_armorer$: Fama ou Efetividade?"
 ep2_locale_events.2002.a:0 "Não sou um(a) [ROOT.Char.GetWomanMan] para enganar, [tournament_armorer.GetFirstNameNoTooltip]."
 ep2_locale_events.2002.b.failure:0 "[tournament_armorer.GetFirstNameNoTooltip] se esquiva"
 ep2_locale_events.2002.b.success:0 "[tournament_armorer.GetFirstNameNoTooltip] faz os reparos a contragosto"
 ep2_locale_events.2002.b:0 "[tournament_armorer.GetFirstNameNoTooltip]! Qual é o significado disso?"
 ep2_locale_events.2002.c:0 "Pagarei por alças de qualidade."
 ep2_locale_events.2002.d:0 "Não tenho tempo para isso."
 ep2_locale_events.2002.desc:0 "[tournament_armorer.GetFirstName] apresenta animadamente minha [armour.GetName]. Ela brilha enquanto a ergo à luz.\n\nÉ enquanto passo a moeda para o artesão satisfeito que percebo um jovem aprendiz ao lado [tournament_armorer.GetHerHim]. [apprentice.GetSheHe|U] se aproxima da mesa enquanto seu mestre guarda a moeda.\n\n\"Perdoe-me, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord], mas...\" [apprentice.GetSheHe|U] aponta para as alças de couro da armadura. \"[tournament_armorer.GetSheHe|U] não pagou a um curtume para tratar o couro.\"\n\nDou uma olhada mais de perto. Não há como negar. O couro está desgastado e rasgado, claramente não é novo. Ao fundo, a bolsa do armeiro tilinta enquanto [tournament_armorer.GetSheHe] a coloca o ouro dentro dela."
 ep2_locale_events.2002.t:0 "$tournament_locale_armorer$: Alças Rasgadas"
 ep2_locale_events.2010.a.tt:0 "#F Apele para o lado cauteloso de [befriend_actor.GetFirstNamePossessiveNoTooltip]!#"
 ep2_locale_events.2010.a:0 "Uma armadura de utilidade."
 ep2_locale_events.2010.b.tt:0 "#F Apele para o lado orgulhoso de [befriend_actor.GetFirstNamePossessiveNoTooltip]!#"
 ep2_locale_events.2010.b:0 "[befriend_actor.GetSheHe|U] pode gostar deste escudo decorativo."
 ep2_locale_events.2010.c.tt:0 "#F Apele para o lado competitivo de [befriend_actor.GetFirstNamePossessiveNoTooltip]!#"
 ep2_locale_events.2010.c:0 "Um capacete especialmente feito para torneios."
 ep2_locale_events.2010.d:0 "Vou encontrar outra forma de impressionar [befriend_target.GetSheHe]."
 ep2_locale_events.2010.desc:0 "A loja do armeiro está repleta de artigos de proteção, de baixo ou alto custo, baratos ou caros, e tudo mais.\n\nNão consigo deixar de pensar em [befriend_target.GetFirstName] enquanto examino o equipamento que pode salvar vidas.\n\n[befriend_target.GetSheHe|U] pode apreciar #EMP algo#! aqui, mas o quê?"
 ep2_locale_events.2010.t:0 "$tournament_locale_armorer$: Presentes Defensivos"
 ep2_locale_events.2011.a:0 "Não posso negar que o presente foi bem escolhido."
 ep2_locale_events.2011.armor:0 "$ep2_locale_events.4511.reply_armor$Que montagem feia, será que alguns entalhes teriam sido tão caros?"
 ep2_locale_events.2011.b:0 "\"Oh... um objeto muito... interessante.\""
 ep2_locale_events.2011.opening:0 "[befriend_actor.GetTitledFirstName] aparece de repente do lado de fora da minha tenda, segurando um grande pacote. \"Isso é para você, [ROOT.Char.GetFirstNameNoTooltip]\", [befriend_actor.GetSheHe] sorri calorosamente. Um presente?\n\n"
 ep2_locale_events.2011.reply_armor:0 "Dentro, há um conjunto de [newly_created_artifact.GetType], bem-feito, embora um pouco simples.\n\n"
 ep2_locale_events.2011.reply_shield:0 "Dentro, há um escudo recém-coberto, decorado com o brasão da minha família.\n\n"
 ep2_locale_events.2011.reply_tournament:0 "Dentro, há um capacete especialmente feito para torneios, oferecendo uma proteção maior do que é prático no campo de batalha.\n\n"
 ep2_locale_events.2011.shield:0 "$ep2_locale_events.4511.reply_shieldt$Um escudo. Por que #EMP eu#! precisaria de um escudo?"
 ep2_locale_events.2011.success_armor:0 "$ep2_locale_events.4511.reply_armor$É uma bela coleção, claramente bem construída e já bastante ajustada."
 ep2_locale_events.2011.success_shield:0 "$ep2_locale_events.4511.reply_shield$É uma peça bonita, mesmo que seja para pendurar, com um brasão finamente desenhado."
 ep2_locale_events.2011.success_tournament:0 "$ep2_locale_events.4511.reply_tournament$É um equipamento inteligente, adaptado para as necessidades da competição em vez da guerra."
 ep2_locale_events.2011.tournament:0 "$ep2_locale_events.4511.reply_tournament$Sinceramente, quem leva essas pequenas competições tão a sério a ponto de precisar trapacear assim?"
 ep2_locale_events.2012.a:0 "Eu sabia!"
 ep2_locale_events.2012.armor:0 "\"Oh... uma armadura... pelo menos é útil.\""
 ep2_locale_events.2012.b:0 "Pelo menos o armeiro ficou feliz..."
 ep2_locale_events.2012.failure:0 "\n\n[befriend_target.GetSheHe|U] me agradece de maneira formal. Talvez eu tenha feito a escolha errada..."
 ep2_locale_events.2012.opening:0 "[befriend_target.GetTitledFirstName] recebe o pacote pesado com um sorriso, claramente empolgado com o presente inesperado.\n\n"
 ep2_locale_events.2012.reply:0 "[befriend_target.GetSheHe|U] não parece tão feliz enquanto examina o presente."
 ep2_locale_events.2012.shield:0 "\"Um escudo... muito bom... obrigado.\""
 ep2_locale_events.2012.success:0 "\n\n[befriend_target.GetSheHe|U] me agradece com emoção. Acho que fiz a escolha certa!"
 ep2_locale_events.2012.success_armor:0 "\n\n\"Essas são peças excelentes! Eu me sentiria destemido usando isso na batalha!\""
 ep2_locale_events.2012.success_reply:0 "[befriend_target.GetSheHe|U] não consegue esconder sua apreciação ao examinar o presente de todos os ângulos."
 ep2_locale_events.2012.success_shield:0 "\n\n\"Olha só isso! Vou exibi-lo imediatamente na minha tenda!\""
 ep2_locale_events.2012.success_tournament:0 "\"Que design inteligente! Com certeza vou usar isso nas competições!\""
 ep2_locale_events.2012.tournament:0 "\"Ah, para competições, você diz? Certo...\""
 ep2_locale_events.2050.a.armour1.tt:0 "[prowess|E] aumenta em #color_dark_green +1#!"
 ep2_locale_events.2050.a.armour1:0 "[prowess|E] aumenta em #color_green +1#!"
 ep2_locale_events.2050.a.armour2.tt:0 "[prowess|E] aumenta em #color_dark_green +2#!"
 ep2_locale_events.2050.a.armour2:0 "[prowess|E] aumenta em #color_green +2#!"
 ep2_locale_events.2050.a.criticalsuccess:0 "Sua armadura é consideravelmente melhorada"
 ep2_locale_events.2050.a.critsuccess:0 "Sua armadura é significativamente melhorada"
 ep2_locale_events.2050.a.durability1.tt:0 "[durability|E] aumenta em #color_dark_green +5#!"
 ep2_locale_events.2050.a.durability1:0 "[durability|E] aumenta em #color_green +5#!"
 ep2_locale_events.2050.a.durability2.tt:0 "[durability|E] aumenta em #color_dark_green +10#!"
 ep2_locale_events.2050.a.durability2:0 "[durability|E] aumenta em #color_green +10#!"
 ep2_locale_events.2050.a.durability3:0 "[durability|E] diminui em #color_red -5#!"
 ep2_locale_events.2050.a.failure:0 "O conserto da sua armadura foi malfeito"
 ep2_locale_events.2050.a.prestige2.tt:0 "Aumenta em #color_dark_green +0.04%# a [prestige|E] mensalmente!"
 ep2_locale_events.2050.a.prestige2:0 "Aumenta em #color_green +0.04%# a [prestige|E] mensalmente!"
 ep2_locale_events.2050.a.success:0 "Sua armadura é melhorada"
 ep2_locale_events.2050.a:0 "Tudo bem, faça sua mágica."
 ep2_locale_events.2050.b:0 "Acho que vai ficar bem."
 ep2_locale_events.2050.desc:0 "Ao ver minha armadura, [tournament_armorer.GetFirstName] coloca as mãos nos quadris e solta um suspiro alto.\n\n\"Bom, o trabalho é grande. Não vai demorar muito para alguém com as minhas #EMP prodigiosas#! habilidades, é claro!\" [tournament_armorer.GetSheHe|U] sorri para mim. Eu olho para a armadura. Parece bem para mim. [tournament_armorer.GetFirstNameNoTooltip] percebe minha desconfiança e balança a cabeça.\n\n\"Nah, com certeza precisa de uma revisão. Eu não sugeriria isso se não fosse necessário!\""
 ep2_locale_events.2050.t:0 "$tournament_locale_armorer$: Armadura Reluzente"
 ep2_locale_events.2500.a.rival:0 "Cães de [tailor_mixup.GetHouse.GetBaseNameNoTooltip]! Queimem isso, eu #EMP pagarei#! você!"
 ep2_locale_events.2500.a:0 "Faça um favor para mim, queime isso, você pode?"
 ep2_locale_events.2500.b.tt:0 "Este modificador aumentará a [success_chance|E] do seu [hostile_scheme|E] contra a Casa [tailor_mixup.GetHouse.GetName]"
 ep2_locale_events.2500.b:0 "Escute, vou levar essas coisas, mas sem falar nada disso."
 ep2_locale_events.2500.c:0 "Bonito... Eu quero o brasão da [ROOT.Char.GetHouse.GetNameNoTooltip]!"
 ep2_locale_events.2500.d:0 "Trabalho muito bom..."
 ep2_locale_events.2500.desc:0 "Ao examinar as mercadorias expostas na loja do alfaiate, vejo um pacote cuidadosamente embrulhado entre as pilhas de roupas e bugigangas.\n\nO alfaiate abre-o com prazer, desamarrando cuidadosamente as tiras de couro para revelar um brasão ricamente bordado: o brasão de #EMP [tailor_mixup.GetHouse.GetBaseName]#!."
 ep2_locale_events.2500.t:0 "$tournament_locale_tailor$: Escudo Errôneo"
 ep2_locale_events.2501.a.tt:0 "Você e seus [knights|E] vestem suas roupas..."
 ep2_locale_events.2501.a:0 "#EMP VENDIDO!#!"
 ep2_locale_events.2501.b:0 "Isso é uma blasfêmia!"
 ep2_locale_events.2501.desc:0 "Os tecidos disponíveis na alfaiataria variam desde o áspero cânhamo até os finos damascos, veludos e sedas. Enquanto examino-os ao lado do meu [ROOT.Char.Custom2('RelationToMeShort', random_knight)] [random_knight.GetFirstName], um padrão estranhamente familiar me faz parar.\n\nLevantando a túnica na luz, meus olhos se arregalam. É uma reconstrução completa das vestimentas de um Papa!\n\n\"Temos também para Cardeais, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [tournament_tailor.GetFirstName] o alfaiate paira atrás de nós dois. Os olhos [random_knight.GetFirstNamePossessiveNoTooltip] brilham de alegria enquanto [random_knight.GetSheHe] me cutuca furiosamente nas costelas. O alfaiate fala novamente.\n\n\"E aquela vem com um chapéu combinando.\""
 ep2_locale_events.2501.t:0 "$tournament_locale_tailor$: Uma Vestimenta Papal"
 ep2_locale_events.2502.a:0 "Contra o meu bom senso... negócio feito."
 ep2_locale_events.2502.b.tt:0 "Ela só iria ficar presa em tudo!"
 ep2_locale_events.2502.b:0 "Você me acha um tolo, claramente!"
 ep2_locale_events.2502.desc:0 "Olho para o impassível alfaiate, implorando silenciosamente a [tournament_tailor.GetShehe] para repetir o que parecia a afirmação mais ridícula que eu ouvi durante todo o dia.\n\n\"É uma capa de duelo. Você nunca ouviu falar?\" [tournament_tailor.GetFirstName] balança a cabeça como se #EMP eu#! fosse o tolo da sala. \"Ela melhora seu movimento, ajuda a dissipar a umidade do combate e também o mantém aquecido e pronto para a próxima rodada. Todos os grandes têm uma!\"\n\nTerminada a venda insistente do alfaiate, volto minha atenção para a capa que estou segurando. O tecido é claramente resistente e de alta qualidade, mas... uma capa de duelo? Sério mesmo?#!"
 ep2_locale_events.2502.t:0 "$tournament_locale_tailor$: Vestes de Combate"
 ep2_locale_events.2510.a.tt:0 "#F Apele para o lado orgulhoso de [befriend_target.GetFirstNamePossessiveNoTooltip].#!"
 ep2_locale_events.2510.a:0 "Uma bela bandeira."
 ep2_locale_events.2510.b.tt:0 "#F Apele para o lado guerreiro de [befriend_target.GetFirstNamePossessiveNoTooltip].#!"
 ep2_locale_events.2510.b:0 "Nada é mais útil do que uma gambesão."
 ep2_locale_events.2510.c.tt:0 "#F Apele para o lado gentil de [befriend_target.GetFirstNamePossessiveNoTooltip].#!"
 ep2_locale_events.2510.c:0 "Estas luvas de pele de cervo são muito finas."
 ep2_locale_events.2510.d:0 "Talvez outra hora."
 ep2_locale_events.2510.desc:0 "Observo os rolos de tecido raro e amostras de pano pendurados na banca do alfaiate; todos os gostos, do mais nobre ao mais simples, são atendidos.\n\nNão consigo deixar de pensar no que [befriend_target.GetFirstName] apreciaria enquanto olho as peças luxuosas.\n\nSem dúvida, #EMP alguma coisa#! aqui agradaria [befriend_target.GetSheHe]..."
 ep2_locale_events.2510.t:0 "$tournament_locale_tailor$: Presentes com Fios"
 ep2_locale_events.2511.a:0 "Não consigo evitar sorrir, isso é perfeito!"
 ep2_locale_events.2511.b:0 "\"Eu... agradeço...\""
 ep2_locale_events.2511.banner:0 "$ep2_locale_events.4511.reply_banner$Minha falta de entusiasmo é evidente, para que eu preciso disso?"
 ep2_locale_events.2511.gambeson:0 "$ep2_locale_events.4511.reply_gambeson$Eu poderia obter um item assim de qualquer tecelão medíocre, qual a relevância disso?"
 ep2_locale_events.2511.glove:0 "$ep2_locale_events.4511.reply_glove$Como... delicado..."
 ep2_locale_events.2511.opening:0 "[befriend_actor.GetTitledFirstName] chega como se viesse do nada, entregando-me graciosamente um pacote dobrado com um sorriso. Um presente?\n\n"
 ep2_locale_events.2511.reply_banner:0 "Dentro há uma bandeira finamente tecida dobrada, exibindo o seu brasão.\n\n"
 ep2_locale_events.2511.reply_gambeson:0 "Dentro há um gambesão acolchoado, uma camisa resistente usada sob a cota de malha.\n\n"
 ep2_locale_events.2511.reply_glove:0 "Dentro há um par de luvas de pele de cervo macias e delicadamente confeccionadas..\n\n"
 ep2_locale_events.2511.success_banner:0 "$ep2_locale_events.4511.reply_banner$Não consigo encontrar falhas, meu emblema foi capturado com precisão e bom gosto."
 ep2_locale_events.2511.success_gambeson:0 "$ep2_locale_events.4511.reply_gambeson$Ao examiná-lo de perto, é uma peça fina, com várias camadas e claramente resistente."
 ep2_locale_events.2511.success_glove:0 "$ep2_locale_events.4511.reply_glove$Elas são suaves como veludo e de alguma forma se encaixam perfeitamente."
 ep2_locale_events.2512.a:0 "Isso correu bem."
 ep2_locale_events.2512.b:0 "Bem, paciência..."
 ep2_locale_events.2512.banner:0 "\"Ah, uma bandeira. Vou... pendurá-la imediatamente.\""
 ep2_locale_events.2512.failure:0 "\n\n[befriend_target.GetSheHe|U] me agradece brevemente antes de partir..."
 ep2_locale_events.2512.gambeson:0 "\"Vou... colocá-lo junto com os outros...\""
 ep2_locale_events.2512.glove:0 "\"Ah, luvas... muito boas...\""
 ep2_locale_events.2512.opening:0 "[befriend_target.GetTitledFirstName] aceita graciosamente meu pacote, abrindo-o com cuidado, conforme a suasa excitação permite.\n\n"
 ep2_locale_events.2512.reply:0 "Não consigo avaliar a reação [befriend_target.GetHerHim], é como se nada tivesse mudado."
 ep2_locale_events.2512.success:0 "\n\n[befriend_target.GetSheHe|U] me agradece profundamente antes de seguirmos caminhos separados."
 ep2_locale_events.2512.success_banner:0 "\n\n\"Isto é esplêndido! Uma bordagem tão habilidosa realça o design!\""
 ep2_locale_events.2512.success_gambeson:0 "\n\n\"Que trabalho excelente, isso resistiria a todos os golpes, exceto os mais pesados.\""
 ep2_locale_events.2512.success_glove:0 "\"Meu Deus, eles são perfeitos! Como você fez isso?!\""
 ep2_locale_events.2512.success_reply:0 "Os olhos [befriend_target.GetHerHim|U] se iluminam imediatamente ao verem isso. Um bom sinal."
 ep2_locale_events.2560.a:0 "\"Na verdade, meu [previous_artifact.GetNameNoTooltip] poderia receber alguma decoração...\""
 ep2_locale_events.2560.b:0 "\"Posso comprar esse [purchasable_trinket.GetNameNoTooltip]?\""
 ep2_locale_events.2560.c.failure:0 "[tailor.GetShortUIName] não se intimida"
 ep2_locale_events.2560.c.success:0 "Você intimida [tailor.GetShortUIName]"
 ep2_locale_events.2560.c:0 "\"Você está me pedindo para #EMP pagar#! por isso?\""
 ep2_locale_events.2560.d:0 "\"Algumas bandeiras vão encorajar a plateia a torcer por mim!\""
 ep2_locale_events.2560.desc.intro:0 "Encontro [tailor.GetTitledFirstName] cortando um pedaço de tecido. Algumas mesas foram dispostas para exibir o seu trabalho: meias e coberturas para a cabeça, capuzes e mangas. Do outro lado, uma lareira queima suavemente.\n\n"
 ep2_locale_events.2560.desc.new_artifact:0 "\"Cuidado!\" [tailor.GetSheHe] me avisa, quase deixando cair a ferramenta. \"Você quase tropeçou no linho, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [tailor.GetSheHe] murmura desculpando-se, pegando rapidamente as roupas. \"Tenho certeza de que posso adivinhar o motivo de sua visita,\" seu rosto mal aparece na bagunça."
 ep2_locale_events.2560.desc.new_artifact_2:0 "\"Alguma coisa em particular que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord] está procurando?\" [tailor.Custom('quirk_pos_standalone')|l]. A coleção ao lado [tailor.GetHerHim] é realmente mais impressionante do que eu esperava."
 ep2_locale_events.2560.desc.previous_artifact:0 "\"Você está procurando algo para adornar sua vestimenta, [ROOT.Char.Custom('FormOfAddressForLiege')]? Vejo que você também trouxe certos artefatos da capital... Se me permite, sempre quis examinar o trabalho dos mestres do [capital_barony.GetAdjectiveNoTooltip].\""
 ep2_locale_events.2560.e:0 "\"Aqui, continue com o bom trabalho.\""
 ep2_locale_events.2560.t:0 "$tournament_locale_tailor$: Uma Nova Compra"
 ep2_locale_events.3001.a:0 "Não estou tão cansado assim..."
 ep2_locale_events.3001.b:0 "Eu gostaria disso."
 ep2_locale_events.3001.c:0 "Preciso me preparar!"
 ep2_locale_events.3001.desc:0 "Finalmente consigo um tempo sozinho em uma barraca com [lover.GetFirstName], longe de toda a agitação do torneio, um cansaço profundo me invade. Eu me jogo em uma esteira coberta de palha, minha mente doendo tanto quanto meu corpo.\n\nOuço [lover.GetFirstNameNoTooltip] murmurando para um guarda - algo sobre não ser perturbado - e alguns momentos depois sinto o seu calor ao meu lado.\n\n\"Você parece tão cansado, meu amor.\" Posso ouvir a preocupação na voz [lover.GetHerHim]. \"Você precisa descansar antes das competições começarem. Fique aqui comigo um tempo, por favor?\""
 ep2_locale_events.3001.t:0 "$tournament_locale_visitor_camp$: Roubando um Momento"
 ep2_locale_events.3002.a:0 "Tem espaço para mais um?"
 ep2_locale_events.3002.b:0 "Tolos! Vocês precisam gastar seu tempo #EMP se preparando#!"
 ep2_locale_events.3002.c.tt:0 "Melhor deixá-los em paz, né?"
 ep2_locale_events.3002.c:0 "Não me deixem interromper vocês!"
 ep2_locale_events.3002.desc:0 "O que é esse barulho? Risadas... alguns gemidos? Parece que está vindo daquela barraca.\n\nMinha curiosidade vence enquanto me aproximo da aba pesada de onde vêm os sons, com uma mistura de antecipação e apreensão. Abro a cobertura para encontrar uma cena surpreendente.\n\n[lech1.GetFirstName], pego completamente #EMP em flagrante#!, entra em pânico, empurrando seu parceiro para longe [lech1.GetHerHim] e para o chão. Olho para a escuridão e vejo [lech2.GetFirstName] e [lech3.GetFirstName] também lutando para processar a melhor resposta a tal acontecimento, tentando apressadamente e sem sucesso esconder seus próprios parceiros."
 ep2_locale_events.3002.t:0 "$tournament_locale_visitor_camp$: Guerreiros Libertinos"
 ep2_locale_events.3010.a.failure:0 "[alerted_physician.GetShortUIName] não tem sucesso"
 ep2_locale_events.3010.a.success.tt:0 "[alerted_physician.GetShortUIName] encontra a causa"
 ep2_locale_events.3010.a.success:0 "[alerted_physician.GetShortUIName] investiga o acampamento"
 ep2_locale_events.3010.a:0 "Deve haver uma explicação para isso. Encontre-a."
 ep2_locale_events.3010.b.flavor:0 "Vou me manter afastado do acampamento..."
 ep2_locale_events.3010.b:0 "O torneio deve ter sido amaldiçoado!"
 ep2_locale_events.3010.c:0 "Eu não vou cair nessas tentativas tolas!"
 ep2_locale_events.3010.d:0 "Por que eu deveria me importar?"
 ep2_locale_events.3010.desc:0 "Assim que entro no acampamento, sou recebido(a) por um cheiro forte. Cobrindo meu nariz com toda a graça possível enquanto tento não ficar enjoado(a), sou abordado(a) por [alerted_physician.GetFirstName], segurando um lenço sobre o próprio nariz.\n\n\"Você deveria se afastar, [ROOT.Char.Custom('FormOfAddressForLiege')], os competidores estão adoecendo, prejudicados pelo ar ruim\", [alerted_physician.GetSheHe] me avisa."
 ep2_locale_events.3010.t:0 "Ar Ruim"
 ep2_locale_events.3011.a:0 "Eu devo avisá-los!"
 ep2_locale_events.3011.b.champion:0 "Eu só vou avisar meu campeão, [contest_champion.GetFirstNameNoTooltip]."
 ep2_locale_events.3011.b.contestant:0 "Vou guardar isso para mim."
 ep2_locale_events.3011.b:0 "Por que eu deveria contar a eles?"
 ep2_locale_events.3011.desc:0 "[alerted_physician.GetFirstName] volta para mim com um sorriso satisfeito no rosto. \"Eu encontrei a fonte, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [alerted_physician.GetSheHe] anuncia, tentando conter as risadas.\n\n\"Os convidados não encontraram um lugar para descartar seus... resíduos, então eles acabaram despejando no rio. O ar ruim causa doenças, como Hipócrates anunciou.\""
 ep2_locale_events.3011.t:0 "$ep2_locale_events.3010.t$: Miasma"
 ep2_locale_events.3020.a.failure:0 "[enemy_knight.GetShortUIName] se sente insultado(a) pela sua proposta"
 ep2_locale_events.3020.a.success:0 "[enemy_knight.GetShortUIName] escuta você"
 ep2_locale_events.3020.a:0 "\"Vencer não vai te render amigos.\""
 ep2_locale_events.3020.b:0 "\"Eu sou seu senhor feudal. Eu ordeno que você desista disso.\""
 ep2_locale_events.3020.c:0 "Eu quero uma luta justa."
 ep2_locale_events.3020.desc:0 "\"Eu ficarei surpreso se [enemy_knight.GetFirstName] não arrasar com os outros competidores!\" Ouço enquanto caminho pelo acampamento. Um grupo de visitantes está comendo em volta de um caldeirão, e vejo o próprio [enemy_knight.GetTitledFirstNameNoTooltip] sentado com eles.\n\n\"Você exagera, meu amigo,\" [enemy_knight.GetSheHe] diz, [enemy_knight.Custom('quirk_pos_standalone')|l]. Eu encontro os seus olhos e faço um sutil aceno.\n\n\"Com licença,\" [enemy_knight.GetSheHe] murmura, levantando-se. \"Há algo que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetLadyLord] deseja discutir?\""
 ep2_locale_events.3020.t:0 "Palavras Doces"
 ep2_locale_events.3500.a.war_horse:0 "[ROOT.Char.Custom('HorseStorySheHe')|U] custou mais do que cinco anos do seu salário, idiota!"
 ep2_locale_events.3500.a:0 "[ROOT.Char.Custom('ContestHorseRaceSheHe')|U] custou mais do que cinco anos do seu salário, idiota!"
 ep2_locale_events.3500.b:0 "Esse aprendiz nunca mais trabalhará em meu reino!"
 ep2_locale_events.3500.c:0 "Espero que isso seja de graça!"
 ep2_locale_events.3500.d:0 "Seja um pouco mais cuidadoso no futuro."
 ep2_locale_events.3500.desc:0 "Levo meu cavalo para ser ferrado antes da abertura da competição de [activity.GetCurrentPhase.GetPhase.GetName], observando atentamente o aprendiz de [tournament_farrier.GetFirstNamePossessive] aparar as cascos do meu valioso animal.\n\nPressinto que algo está errado com o jovem, e, com certeza, o primeiro prego fica muito comprido. A besta chuta ferozmente, por pouco não acertando [tournament_farrier.GetFirstNameNoTooltip], e manca pelo estabelecimento em agonia.\n\n"
 ep2_locale_events.3500.other:0 "O aprendiz corre atrás de [ROOT.Char.Custom('ContestHorseRaceHerHim')] — o [ROOT.Char.Custom('ContestHorseRaceGender')] precisará de uma ferradura de reposição imediatamente."
 ep2_locale_events.3500.race:0 "O aprendiz corre atrás de #EMP [ROOT.Char.Custom('ContestHorseRaceName')]#! — o [ROOT.Char.Custom('ContestHorseRaceGender')] precisará de uma ferradura de reposição imediatamente."
 ep2_locale_events.3500.t:0 "$tournament_locale_farrier$: Uma Picadinha"
 ep2_locale_events.3500.war:0 "O aprendiz corre atrás de #EMP [ROOT.Char.Custom('ContestHorseRaceName')]#! — o [ROOT.Char.Custom('HorseStoryMareStallion')] precisará de uma ferradura de reposição imediatamente."
 ep2_locale_events.3510.a.martial:0 "Seu [martial|E] aumenta"
 ep2_locale_events.3510.a.prestige:0 "Seu novo equipamento é impressionante"
 ep2_locale_events.3510.a.prowess:0 "Sua [prowess|E] aumenta"
 ep2_locale_events.3510.a:0 "\"Me dê apenas as melhores!\""
 ep2_locale_events.3510.b:0 "\"Eu realmente deveria comprar algumas para meus cavaleiros...\""
 ep2_locale_events.3510.c:0 "\"Um amuleto de boa sorte!\""
 ep2_locale_events.3510.d:0 "\"Estou bem, obrigado.\""
 ep2_locale_events.3510.desc:0 "O calor da forja é suficiente para manter a maioria dos convidados afastados. Quando eu abro a porta, encontro o ferreiro bocejando sobre a bancada de trabalho. Não muitos parecem ter se aproximado [farrier.GetHerHim]. [farrier.GetSheHe|U] rapidamente se endireita, limpando sua garganta com uma tosse audível.\n\n\"Posso ajudá-lo? Posso oferecer os melhores ferraduras, prontas para o torneio,\" [farrier.GetSheHe] sugere, exibindo uma coleção mais do que impressionante."
 ep2_locale_events.3510.t:0 "Bem Equipado"
 ep2_locale_events.4000.a:0 "Empenar"
 ep2_locale_events.4000.b:0 "Não empenar"
 ep2_locale_events.4000.desc:0 "Eu adoro uma flecha bonita!"
 ep2_locale_events.4000.t:0 "$tournament_locale_bowyer$: Evento do Armeiro"
 ep2_locale_events.4001.a.failure:0 "[tournament_bowyer.GetFirstNameNoTooltip] se recusa a pagar"
 ep2_locale_events.4001.a.success:0 "[tournament_bowyer.GetFirstNameNoTooltip] substitui o arco gratuitamente"
 ep2_locale_events.4001.a:0 "É melhor você me dar uma substituição, de graça!"
 ep2_locale_events.4001.b:0 "Droga. Bem, você tem algum para vender?"
 ep2_locale_events.4001.c:0 "S[Select_CString( tournament_bowyer.IsFemale, 'ua', 'eu' )] [tournament_bowyer.Custom2('InsultNoun', ROOT.Char)]! S[Select_CString( tournament_bowyer.IsFemale, 'ua', 'eu' )], s[Select_CString( tournament_bowyer.IsFemale, 'ua', 'eu' )]... #EMP [tournament_bowyer.Custom2('InsultNoun', ROOT.Char)]#!!"
 ep2_locale_events.4001.desc:0 "\"Parece tudo bem para mim!\" [tournament_bowyer.GetFirstName] está testando o arco que trouxe para [tournament_bowyer.GetSheHe] verificar. Eu mexo nas pilhas de flechas empilhadas na mesa ao meu lado enquanto [tournament_bowyer.GetSheHe] continua a verificar.\n\n\"A ponta da frente parece um pouco estranha.\" Os olhos do armeiro se estreitam enquanto [tournament_bowyer.GetSheHe] segura firmemente os membros do arco, dobrando-os cada vez mais. \"Aqui, veja, tem alguma deformação na—\"\n\n#EMP Crrrrack!#! A boca de [tournament_bowyer.GetFirstNamePossessiveNoTooltip] se abre em choque quando o arco se parte. Seus protestos de que a verificação era necessária e o arco teria quebrado de qualquer maneira ecoam pelo ambiente, mas sou eu quem foi deixado sem nada."
 ep2_locale_events.4001.t:0 "$tournament_locale_bowyer$: Curvado Mas Não Quebrado..."
 ep2_locale_events.4010.a.tt:0 "#F Apelar para o lado prático de [befriend_actor.GetFirstNamePossessiveNoTooltip]!#"
 ep2_locale_events.4010.a:0 "Um novo arco."
 ep2_locale_events.4010.b.tt:0 "#F Apelar para o lado organizacional de [befriend_actor.GetFirstNamePossessiveNoTooltip]!#"
 ep2_locale_events.4010.b:0 "Aljavas boas são uma necessidade negligenciada."
 ep2_locale_events.4010.c.tt:0 "#F Apelar para o lado enérgico de [befriend_actor.GetFirstNamePossessiveNoTooltip]!#"
 ep2_locale_events.4010.c:0 "Essas flechas de caça são únicas."
 ep2_locale_events.4010.d:0 "Acho que não."
 ep2_locale_events.4010.desc:0 "Eu observo os produtos expostos na barraca do armeiro, admirando os diversos arcos, flechas e acessórios.\n\nImediatamente penso em [befriend_target.GetFirstName] ao ver a grande quantidade de objetos úteis à venda.\n\nTalvez algo aqui agrade o gosto [befriend_target.GetHerHim]..."
 ep2_locale_events.4010.t:0 "$tournament_locale_bowyer$: Presentes Balísticos"
 ep2_locale_events.4011.a:0 "Não consigo esconder meu sorriso, [befriend_actor.GetSheHe] escolheu bem!"
 ep2_locale_events.4011.b:0 "\"Que presente... atencioso...\""
 ep2_locale_events.4011.bow:0 "$ep2_locale_events.4011.reply_bow$É difícil esconder minha decepção. Quero dizer, um arco..."
 ep2_locale_events.4011.hunt:0 "$ep2_locale_events.4011.reply_hunt$Flechas de caça? Você #EMP realmente#! não deveria ter..."
 ep2_locale_events.4011.opening:0 "[befriend_actor.GetTitledFirstName] aparece de repente diante de mim, segurando um pacote de formato estranho em seus braços estendidos. Um presente?\n\n"
 ep2_locale_events.4011.quiver:0 "$ep2_locale_events.4011.reply_quiver$Para que eu preciso disso? Quero dizer, sério..."
 ep2_locale_events.4011.reply_bow:0 "Dentro há um arco impecável, completo com um conjunto de flechas.\n\n"
 ep2_locale_events.4011.reply_hunt:0 "Dentro há um conjunto de flechas de caça meticulosamente confeccionadas.\n\n"
 ep2_locale_events.4011.reply_quiver:0 "Dentro há uma aljava curiosamente projetada, maior do que o normal.\n\n"
 ep2_locale_events.4011.success_bow:0 "$ep2_locale_events.4011.reply_bow$Este é um trabalho muito bem feito, um arco digno de um nobre."
 ep2_locale_events.4011.success_hunt:0 "$ep2_locale_events.4011.reply_hunt$Elas são excepcionalmente robustas em sua construção e claramente perfeitas para caçar animais pequenos."
 ep2_locale_events.4011.success_quiver:0 "$ep2_locale_events.4011.reply_quiver$Passo algum tempo examinando-o, esta é a aljava mais ergonômica que já vi!"
 ep2_locale_events.4012.a:0 "Um tiro bem direcionado."
 ep2_locale_events.4012.b:0 "Qual é o uso..."
 ep2_locale_events.4012.bow:0 "\"Um [newly_created_artifact.GetType]! Bom. Bom.\""
 ep2_locale_events.4012.failure:0 "\n\n[befriend_target.GetSheHe|U] me agradece superficialmente antes de sair, no que eu estava pensando..."
 ep2_locale_events.4012.hunt:0 "\"Para caçar, você diz? Certo. Certo.\""
 ep2_locale_events.4012.opening:0 "[befriend_target.GetTitledFirstName] a recebe alegremente, abrindo as amarras do embrulho com uma alegria infantil.\n\n"
 ep2_locale_events.4012.quiver:0 "\"Um suporte para flechas? Entendi.\""
 ep2_locale_events.4012.reply:0 "Seu semblante parece se desanimar quando [befriend_target.GetSheHe] vê."
 ep2_locale_events.4012.success:0 "\n\n[befriend_target.GetSheHe|U] me agradece, colocando a mão no meu ombro. Acho que acertei em cheio!"
 ep2_locale_events.4012.success_bow:0 "\n\n\"Que [newly_created_artifact.GetType] habilmente esculpido! Eu vou estimá-lo!\""
 ep2_locale_events.4012.success_hunt:0 "\"Oh, eu estava procurando por algo assim há séculos!\""
 ep2_locale_events.4012.success_quiver:0 "\n\n\"Isto é algo para se admirar! Onde você encontrou isso?\""
 ep2_locale_events.4012.success_reply:0 "Seus olhos se arregalam quando [befriend_target.GetSheHe] vê — tenho um bom pressentimento."
 ep2_locale_events.4050.a.critfailure:0 "[tournament_bowyer.GetFirstNameNoTooltip] se recusa a vender, irritado"
 ep2_locale_events.4050.a.failure:0 "Sua negociação falha"
 ep2_locale_events.4050.a.success:0 "Você consegue barganhar com sucesso"
 ep2_locale_events.4050.a:0 "Talvez possamos fazer um acordo?"
 ep2_locale_events.4050.b:0 "Vou levar duas!"
 ep2_locale_events.4050.c:0 "Quanto custa?"
 ep2_locale_events.4050.d:0 "Posso passar sem isso."
 ep2_locale_events.4050.desc:0 "Revirando as flechas empilhadas e as cordas de arco, encontro uma pilha arrumada de braçadeiras de couro especialmente finas. Deslizando uma no meu antebraço, o couro endurecido protege o interior do meu braço.\n\n\"São nossas melhores braçadeiras, [ROOT.Char.Custom('FormOfAddressForLiege')]. Dez mil golpes da corda de arco não vão desgastar essas!\" [tournament_bowyer.GetFirstName] percebe uma possível venda e [tournament_bowyer.GetSheHe] rapidamente se aproxima de mim.\n\nTesto o couro com curiosidade, avaliando-o em minhas mãos."
 ep2_locale_events.4050.t:0 "$tournament_locale_bowyer$: Prepare-se"
 ep2_locale_events.4500.a.tt:0 "Vai custar, e vai exigir um trabalho bruto para consertar, mas eu preciso que seja feito!"
 ep2_locale_events.4500.a:0 "Conserte! Conserte agora!"
 ep2_locale_events.4500.artifact:0 "[chipped_sword.GetName] "
 ep2_locale_events.4500.b:0 "Oh, pelo amor de... você tem alguma para vender?"
 ep2_locale_events.4500.c:0 "Só me dê aqui!"
 ep2_locale_events.4500.end:0 "para ser preparada para os próximos desafios, mas o arrependimento me enche imediatamente quando ela deixa minhas mãos. [tournament_weaponsmith.GetFirstName] o ferreiro está claramente sobrecarregado de pedidos, e [tournament_weaponsmith.GetSheHe] por sua vez passa para um aprendiz de aparência nervosa lidar com isso.\n\nO(a) jovem [apprentice.GetWomanMan] pega a arma com empolgação, dando um golpe descuidado — muito descuidado — no ar. Ela bate em uma bigorna próxima, arrancando uma lasca profunda de seu corpo!\n\nMeu grito involuntário resultante faz o ferreiro virar horrorizado, pegando a arma danificada com uma mão e dando um tapa [Select_CString( apprentice.IsFemale, 'na', 'no' )] [apprentice.Custom('GirlBoy')] na orelha com a outra."
 ep2_locale_events.4500.noartifact:0 "minha arma "
 ep2_locale_events.4500.start:0 "Entrego "
 ep2_locale_events.4500.t:0 "$tournament_locale_weaponsmith$: Lasca da Velha Espada"
 ep2_locale_events.4501.a.tt:0 "O sorriso brincando nos lábios daquele ferreiro já diz bastante, eu apostaria..."
 ep2_locale_events.4501.a:0 "Talvez devêssemos ver se esse interesse é compartilhado por todos?"
 ep2_locale_events.4501.b.tt:0 "Claramente, meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spying_spouse'))] tem um ótimo gosto!"
 ep2_locale_events.4501.b:0 "Bem, eles têm #EMP braços muito#! fortes..."
 ep2_locale_events.4501.c:0 "Oi! Nós estamos indo embora!"
 ep2_locale_events.4501.d:0 "[spying_spouse.GetSheHe|U] está apenas olhando. Sem nenhum dano."
 ep2_locale_events.4501.desc:0 "Estou observando [tournament_weaponsmith.GetFirstName] forjar uma nova arma quando ouço um pequeno, mas perceptível #EMP tinir#!, seguido de uma maldição sussurrada, mas curiosamente ofegante. Olhando através da penumbra, finalmente avisto minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('spying_spouse'))] [spying_spouse.GetFirstName] agachada atrás de uma pequena mesa!\n\nLogo fica claro o objetivo [spying_spouse.GetHerHim|U]. Os seus olhos percorrem os braços musculosos e suados de [tournament_weaponsmith.GetFirstName], enquanto o suor escorre pelos músculos enrijecidos. É evidente que o rubor [spying_spouse.GetFirstNamePossessiveNoTooltip] não é apenas do calor...\n\nDou um passo em direção a [spying_spouse.GetSheHe]. É tudo o que é preciso: [spying_spouse.GetFirstNameNoTooltip] mal consegue conter um suspiro quando nossos olhos se encontram, pegos em flagrante."
 ep2_locale_events.4501.t:0 "$tournament_locale_weaponsmith$: Armado e Pronto"
 ep2_locale_events.4505.a.tt:0 "Um presente?! Isso vale mil espadas. Não vou recusar!"
 ep2_locale_events.4505.a:0 "A honra é toda minha, [tournament_weaponsmith.GetFirstNameNoTooltip]."
 ep2_locale_events.4505.b:0 "Uma arma tão fina merece um pagamento adequado."
 ep2_locale_events.4505.c:0 "Não quero suas lâminas de má qualidade!"
 ep2_locale_events.4505.desc:0 "No momento em que entro na forja, os olhos de [tournament_weaponsmith.GetFirstNamePossessive] se arregalam. Segurado reverentemente em seus braços está um cobertor de seda.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U].\" Sua voz treme um pouco. \"Sua habilidade e destreza com uma lâmina em suas mãos são lendárias. Eu... eu fiz isso para você.\"\n\n[tournament_weaponsmith.GetSheHe|U] retira o cobertor revelando uma espada de opulência maravilhosa. Ao pegá-la em minhas mãos, fica claro que é de qualidade superior, a arma parece uma extensão do meu braço.\n\n\"Eu a fiz de acordo com a sua própria estatura, [ROOT.Char.Custom('FormOfAddressForLiege')]. Seria uma honra de magnitude muito alta se você a aceitasse como presente.\""
 ep2_locale_events.4505.t:0 "$tournament_locale_weaponsmith$: Lâmina Famosa"
 ep2_locale_events.4506.a.tt:0 "[rename_artifact.GetName] recebe um novo nome"
 ep2_locale_events.4506.a:0 "Eu tenho exatamente o nome certo em mente."
 ep2_locale_events.4506.b:0 "Uma espada é uma ferramenta, nada mais."
 ep2_locale_events.4506.desc:0 "Ele precisa de um nome.\"\n\nA interrupção de [tournament_weaponsmith.GetFirstNamePossessive] enquanto dou alguns golpes de teste em minha nova espada me faz erguer uma sobrancelha para o ferreiro.\n\n\"Todas as armas carregadas por aqueles de lenda têm um nome. É o que se faz! A lâmina de um guerreiro poderoso precisa de um nome poderoso para fazer os inimigos tremerem!\" [tournament_weaponsmith.GetFirstNameNoTooltip] insiste."
 ep2_locale_events.4506.t:0 "$tournament_locale_weaponsmith$: O que há em um nome?"
 ep2_locale_events.4510.a.tt:0 "#F Apelar para o lado guerreiro de [befriend_actor.GetFirstNamePossessiveNoTooltip]!#"
 ep2_locale_events.4510.a:0 "Uma arma de defesa bem-feita."
 ep2_locale_events.4510.b.tt:0 "#F Apelar para o lado materialista de [befriend_actor.GetFirstNamePossessiveNoTooltip]!#"
 ep2_locale_events.4510.b:0 "Algo bonito para exibir."
 ep2_locale_events.4510.c.tt:0 "#F Apelar para o lado sorrateiro de [befriend_actor.GetFirstNamePossessiveNoTooltip]!#"
 ep2_locale_events.4510.c:0 "Eu acho que [befriend_target.GetFirstNameNoTooltip] é um #EMP punhal#! [befriend_target.GetWomanMan]."
 ep2_locale_events.4510.d:0 "Vou encontrar outra maneira de impressionar [befriend_target.GetSheHe]."
 ep2_locale_events.4510.desc:0 "Olhando ao redor da forja do ferreiro, todos os tipos de implementos mortais e itens habilmente fabricados chamam a atenção.\n\nMinha mente se volta para [befriend_target.GetFirstName] enquanto meus olhos percorrem as prateleiras cintilantes.\n\nSe eu quiser conquistar [befriend_target.GetSheHe], vou precisar encontrar algo que #EMP [befriend_target.GetSheHe]#! apreciará..."
 ep2_locale_events.4510.t:0 "$tournament_locale_weaponsmith$: Presentes Ofensivos"
 ep2_locale_events.4511.a:0 "Apesar de mim mesma, [befriend_actor.GetSheHe] me impressionou..."
 ep2_locale_events.4511.b:0 "\"O-obrigada. Muito bonito.\""
 ep2_locale_events.4511.dagger:0 "$ep2_locale_events.4511.reply_dagger$Para que serve isso, afinal? Isso é a ferramenta dos trapaceiros."
 ep2_locale_events.4511.opening:0 "Em uma manhã, sou surpreendido por [befriend_actor.GetTitledFirstName], que me entrega um pacote embrulhado, sorrindo expectantemente. Um presente?\n\n"
 ep2_locale_events.4511.ornament:0 "$ep2_locale_events.4511.reply_ornament$Ah, um objeto totalmente inútil... Acho que posso pelo menos vendê-lo."
 ep2_locale_events.4511.reply_dagger:0 "Dentro está um punhal pequeno, mas elegante, com uma lâmina brilhante.\n\n"
 ep2_locale_events.4511.reply_ornament:0 "Dentro está uma arma de exibição delicada, mais adequada para a parede do que para o campo de batalha.\n\n"
 ep2_locale_events.4511.reply_weapon:0 "Dentro está uma [newly_created_artifact.GetType] bem trabalhada, brilhando suavemente na luz suave.\n\n"
 ep2_locale_events.4511.success_dagger:0 "$ep2_locale_events.4511.reply_dagger$Sua forma sutil clama por ser empunhada e desferida em meu punho."
 ep2_locale_events.4511.success_ornament:0 "$ep2_locale_events.4511.reply_ornament$É uma coisa maravilhosamente trabalhada, com tanta atenção aos detalhes que é difícil desviar o olhar."
 ep2_locale_events.4511.success_weapon:0 "$ep2_locale_events.4511.reply_weapon$Não se pode negar a habilidade artesanal e a utilidade clara da arma."
 ep2_locale_events.4511.weapon:0 "$ep2_locale_events.4511.reply_weapon$Meu coração afunda, para que eu precisaria dessa coisa horrível?"
 ep2_locale_events.4512.a:0 "Eu tenho um olhar para isso."
 ep2_locale_events.4512.b:0 "Que desperdício..."
 ep2_locale_events.4512.dagger:0 "\"Bom para picar... vegetais, suponho?\""
 ep2_locale_events.4512.failure:0 "\n\n[befriend_target.GetSheHe|U] me agradece educadamente. Não acho que teve o efeito desejado..."
 ep2_locale_events.4512.opening:0 "[befriend_target.GetTitledFirstName] recebe meu presente cuidadosamente embrulhado calorosamente, segurando-o em sua mão com um largo sorriso no rosto.\n\n"
 ep2_locale_events.4512.ornament:0 "\"Oh, uma peça de exposição? Muito... bonito.\""
 ep2_locale_events.4512.reply:0 "O humor [befriend_target.GetHerHim|U] muda um pouco quando as embalagens são descartadas - é curiosidade ou desdém?"
 ep2_locale_events.4512.success:0 "\n\n[befriend_target.GetSheHe|U] me agradece sinceramente. Acho que não poderia ter sido melhor!"
 ep2_locale_events.4512.success_dagger:0 "\"Oh, isso é bom, muito bom... Um equilíbrio assim.\""
 ep2_locale_events.4512.success_ornament:0 "\n\n\"Que bela peça de exposição! Isso é digno da coleção de qualquer nobre!\""
 ep2_locale_events.4512.success_reply:0 "Seu sorriso se alarga ainda mais quando as embalagens são descartadas."
 ep2_locale_events.4512.success_weapon:0 "\n\n\"Ah, uma [newly_created_artifact.GetType] habilmente forjada. Algo... em que confiar.\""
 ep2_locale_events.4512.weapon:0 "\"Oh... uma [newly_created_artifact.GetType]. Exatamente o que eu preciso.\""
 ep2_locale_events.4520.a.failure:0 "A forja ocorre mal"
 ep2_locale_events.4520.a.success:0 "A forja ocorre bem"
 ep2_locale_events.4520.a:0 "Pela glória. Pela fama eterna!"
 ep2_locale_events.4520.b:0 "Podemos tentar, mas deixe-me primeiro pegar minhas pomadas..."
 ep2_locale_events.4520.c:0 "Se você tem certeza de que isso vai funcionar..."
 ep2_locale_events.4520.d:0 "Que absurdo."
 ep2_locale_events.4520.desc:0 "\"O sangue de um nobre!\" A voz de [tournament_weaponsmith.GetFirstNamePossessive] ressoa, me assustando. Eu piscando através da escuridão para onde [tournament_weaponsmith.GetSheHe] está, brandindo um punhal cintilante com avidez.\n\n\"Tudo que eu preciso é apenas um pequeno #EMP respingo#! de sangue nobre para saciar uma lâmina! A espada será a arma mais fina já feita! Canções serão entoadas sobre mim!\" [tournament_weaponsmith.GetSheHe|U] se aproxima, um brilho louco cintilando em seus olhos.\n\n\"Será toda sua, [ROOT.Char.GetLadyLord], toda sua. Só preciso ser o responsável por forjá-la. Permita-me isso, para que ambos os nossos nomes sejam lembrados para sempre!\"\n\nOlho para o meu braço."
 ep2_locale_events.4520.t:0 "$tournament_locale_weaponsmith$: Icor Digno"
 ep2_locale_events.4521.a:0 "Eu a levarei!"
 ep2_locale_events.4521.b:0 "Você pode ficar com ela."
 ep2_locale_events.4521.ending:0 "\"É #EMP perfeita#!!\" [tournament_weaponsmith.GetFirstNameNoTooltip] não parece se intimidar com meu ceticismo, suas mãos tremem enquanto [tournament_weaponsmith.GetSheHe] segura a lâmina maravilhado."
 ep2_locale_events.4521.failure:0 "É, em uma palavra, feia. Sangue seco cobre o comprimento da lâmina e o peso da arma parece mudar a cada momento. O aço frágil é coberto por redemoinhos irregulares.\n\n"
 ep2_locale_events.4521.start:0 "Eu seguro um pano limpo no meu antebraço para conter o fluxo enquanto [tournament_weaponsmith.GetFirstName] trabalha freneticamente com fogo e marteladas. Quando nossos objetivos de sangria são alcançados, o pano está quase encharcado, mas o fluxo em si diminuiu e a ferida está coagulada.\n\nA espada é depositada reverentemente em uma mesa."
 ep2_locale_events.4521.success:0 "É uma coisa curiosa de se ver: o sangue seco continua a se desprender da lâmina, revelando padrões vivos no aço. Eu testo a flexibilidade e a lâmina range de forma preocupante.\n\n"
 ep2_locale_events.4521.t:0 "$tournament_locale_weaponsmith$: Aço Sanguíneo"
 ep2_locale_events.4530.a.tt:0 "Você se tornou supersticioso(a)"
 ep2_locale_events.4530.a:0 "\"Ouvi dizer que os ferreiros podem quebrar feitiços. Por favor, acalme minha alma.\""
 ep2_locale_events.4530.b.crit_success:0 "Suas habilidades melhoram significativamente"
 ep2_locale_events.4530.b.failure:0 "Você fica ferido"
 ep2_locale_events.4530.b.success:0 "Suas habilidades melhoram"
 ep2_locale_events.4530.b:0 "\"Você pode me mostrar uma técnica especial?"
 ep2_locale_events.4530.c.tt:0 "Ganha #positive_value +2#! [prowess|E]"
 ep2_locale_events.4530.c:0 "\"Você pode melhorar minha [improved_weapon.GetNameNoTooltip]?\""
 ep2_locale_events.4530.d.nothing:0 "O tratamento é ineficaz"
 ep2_locale_events.4530.d.success:0 "O tratamento funciona!"
 ep2_locale_events.4530.d:0 "\"Meu corpo! Isso dói! Me ajude!\""
 ep2_locale_events.4530.desc:0 "Posso ver o brilho suave das chamas do outro lado da estrada. Seu calor envolve meu corpo em um abraço familiar antes mesmo de eu abrir a porta. Dentro, o ferreiro alinha um lote de pregos.\n\n\"Posso ajudar, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" [tournament_weaponsmith.GetSheHe] pergunta, com a testa manchada de carvão. O ar é mais denso aqui."
 ep2_locale_events.4530.e:0 "\"Eu estava apenas olhando.\""
 ep2_locale_events.4530.t:0 "$tournament_locale_weaponsmith$: A Sabedoria do Martelo"
 ep2_locale_events.4540.a.tt:0 "A borda afiada durará apenas durante o Torneio"
 ep2_locale_events.4540.a:0 "\"Torne-o mais mortal.\""
 ep2_locale_events.4540.b.christian:0 "\"Entalhe #EMP In Nomine Domini#! ao longo da lâmina.\""
 ep2_locale_events.4540.b.fallback:0 "\"Inscrição de uma oração.\""
 ep2_locale_events.4540.c:0 "\"Quero que diga [my_weapon.GetOwner.GetHouse.GetMotto].\""
 ep2_locale_events.4540.d:0 "\"Vou ficar com o meu ouro.\""
 ep2_locale_events.4540.desc.contestant:0 "\"Você vai competir assim?\" pergunta o ferreiro, apontando para [my_weapon.GetNameNoTooltip|l] que está presa ao meu cinto."
 ep2_locale_events.4540.desc.fallback:0 "Mesmo que eu não esteja competindo desta vez, não devo ignorar os talentos deste artesão."
 ep2_locale_events.4540.desc.intro:0 "\"Que trabalho magnífico [weaponsmith.GetSheHe] fez!\" ouço um cavaleiro dizer com orgulho, saindo da oficina. A lâmina cintilante reflete o sol como um lago cristalino.\n\nEmpurro a porta e sou recebido por uma chama ardente."
 ep2_locale_events.4540.desc.outro:0 "\n\n\"Se você tiver ouro, eu tenho o aço.\""
 ep2_locale_events.4540.t:0 "Na Lâmina"
 ep2_locale_events.5000.a:0 "\"Que ideia maravilhosa!\""
 ep2_locale_events.5000.b:0 "\"Ótimo. [my_knight.GetFirstNameNoTooltip] irá treiná-lo(a), então.\""
 ep2_locale_events.5000.c:0 "\"Você acha que pode negligenciar suas obrigações assim?\""
 ep2_locale_events.5000.desc.intro:0 "Enquanto visito os campos do torneio junto com meu(a) filho(a) [my_child.GetFirstName], nos deparamos com um grupo de [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')], treinando ferozmente para o próximo concurso. Aceno para [my_knight.GetTitledFirstName], quase irreconhecível sob aquele elmo.\n\n\"Ah, traria grande honra para nossa casa se...\" mas logo paro, ao perceber que os olhos de [my_child.GetFirstNamePossessiveNoTooltip] estão fixos nas espadas."
 ep2_locale_events.5000.desc.martial:0 "Não é surpresa, dada o interesse marcial [my_child.GetHerHim]."
 ep2_locale_events.5000.desc.non_martial:0 "Eu não tinha percebido que [my_child.GetSheHe] tinha interesse por essas coisas."
 ep2_locale_events.5000.t:0 "O Chamado do Aço"
 ep2_locale_events.5010.a.failure:0 "Seu treinamento é constrangedor"
 ep2_locale_events.5010.a.success:0 "Seu treinamento é bem-sucedido"
 ep2_locale_events.5010.a:0 "Eu mostrarei a todos como é feito."
 ep2_locale_events.5010.b.bad:0 "Dessa vez. Dessa vez farei melhor."
 ep2_locale_events.5010.b.flavor:0 "Uma memória persiste em sua mente..."
 ep2_locale_events.5010.b.good:0 "Lembro-me da última vez, tão boas lembranças."
 ep2_locale_events.5010.c.failure:0 "A multidão ri de você"
 ep2_locale_events.5010.c.success:0 "A multidão fica intimidada"
 ep2_locale_events.5010.c:0 "\"No que você está olhando!?\""
 ep2_locale_events.5010.d:0 "Devo me retirar agora."
 ep2_locale_events.5010.desc.fallback:0 "competidores praticando sua performance com entusiasmo medido."
 ep2_locale_events.5010.desc.intro:0 "Marchando para os campos do torneio, junto-me a um grupo de"
 ep2_locale_events.5010.desc.mind:0 "competidores trocando estratégias comuns, insinuando dramaticamente floreios que ainda estão por vir."
 ep2_locale_events.5010.desc.outro:0 "\n\nAlguns espectadores já nos observam. Mastigando carne assada e cuspindo ossos, os plebeus clamam por um espetáculo.\n\nAlguns de nós resmungam com essa distração do treinamento. Outros, em meio aos gritos, insistem que este é o momento de provar-se."
 ep2_locale_events.5010.desc.prowess:0 "resolutos [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')], trocando provocações enquanto seus assistentes os revestem com armaduras."
 ep2_locale_events.5010.t:0 "$tournament_locale_tournament_grounds$: Quase Lá"
 ep2_locale_events.5020.a.failure:0 "[impressed_lover.GetShortUIName] não ficou impressionado(a)"
 ep2_locale_events.5020.a.success.tt:0 "Seu relacionamento com [impressed_lover.GetShortUIName] aumentou [fertility|E]"
 ep2_locale_events.5020.a.success:0 "Você impressiona [impressed_lover.GetShortUIName]"
 ep2_locale_events.5020.a:0 "Vou garantir que [impressed_lover.GetFirstNameNoTooltip] esteja olhando."
 ep2_locale_events.5020.b.failure:0 "[impressed_rival.GetShortUIName] não ficou impressionado(a)"
 ep2_locale_events.5020.b.success:0 "[impressed_rival.GetShortUIName] está intimidado(a)"
 ep2_locale_events.5020.b:0 "Aha! A chance perfeita para intimidar aquele(a) irritante [impressed_rival.GetFirstNameNoTooltip]."
 ep2_locale_events.5020.c:0 "Existe apenas uma pessoa que eu preciso impressionar. Eu mesmo(a)."
 ep2_locale_events.5020.desc:0 "Os terrenos do torneio estão agitados com preparativos. Os pajens correm por aí carregando peças de armadura que os fazem parecer espantalhos pequeninos. \"Espera!\" um deles grita, pegando um capacete.\n\nOuço um risinho familiar vindo das tribunas e vejo [impressed_lover.GetTitledFirstName], rodeado(a) por outros(as) [impressed_lover.GetWomenMen] que cobrem a boca com lenços. [impressed_lover.GetSheHe|U] não acena para mim. [impressed_lover.GetSheHe|U] não precisa.\n\n\"Vindo para se exercitar?\", [impressed_rival.GetTitledFirstName] passa por mim, erguendo seu queixo, \"Você vai precisar.\""
 ep2_locale_events.5020.t:0 "$tournament_locale_tourney_grounds$: Impressionado(a)?"
 ep2_locale_events.5030.a:0 "O ouro é a maior tentação."
 ep2_locale_events.5030.b.failure:0 "[poached_councillor.GetShortUIName] se ofende com sua falta de cortesia"
 ep2_locale_events.5030.b.success:0 "Você intimida [poached_councillor.GetShortUIName]"
 ep2_locale_events.5030.b:0 "\"Um[Select_CString( poached_councillor.IsFemale, 'a', '' )] [poached_councillor.GetWomanMan] hábil merece um senhor feudal habilidoso. Ou nenhum senhor feudal mesmo.\""
 ep2_locale_events.5030.c:0 "\"Uma vida mais prestigiosa aguarda você em minha corte.\""
 ep2_locale_events.5030.d:0 "\"Não somos bons amigos, meu caro [poached_councillor.GetFirstNameNoTooltip]? Junte-se a mim.\""
 ep2_locale_events.5030.desc.contestant:0 "As habilidades [poached_councillor.GetHerHi|U] foram grandemente elogiadas e o seu nome ressoa como um dos possíveis vencedores."
 ep2_locale_events.5030.desc.fallback:0 "As realizações [poached_councillor.GetHerHim|U] não passaram despercebidas e o trabalho que [poached_councillor.GetSheHe] fez para a casa de seu senhor é mais do que impressionante."
 ep2_locale_events.5030.desc.intro:0 "Escudeiros riem e brincam enquanto poliram elmos e malhas. Um deles resfolega tão alto que parece um porco, e logo os outros o imitam. Seus [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] ficam por perto.\n\nEntre eles, eu avisto [poached_councillor.GetTitledFirstName], o conselheiro de [councillor_employer.GetTitledFirstNamePossessive] conselho."
 ep2_locale_events.5030.desc.outro:0 "\n\nEu poderia convencer [poached_councillor.GetSheHE] a se juntar ao meu próprio conselho."
 ep2_locale_events.5030.e:0 "Não desejo ofender [councillor_employer.GetTitledFirstNameNoTooltip]."
 ep2_locale_events.5030.t:0 "Uma Nova Contratação"
 ep2_locale_events.5500.a.fallback:0 "Hah! Estudei essa língua antiga!"
 ep2_locale_events.5500.a.rome:0 "Espera... isso é latim?"
 ep2_locale_events.5500.b:0 "Essa pedra serviria como ótimas paredes em casa!"
 ep2_locale_events.5500.c:0 "Devemos continuar aprendendo com eles."
 ep2_locale_events.5500.desc:0 "Uma visita a [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] foi exatamente o que eu precisava para relaxar antes do torneio! Enquanto passeio pelas ruas, vejo crianças locais simulando uma batalha, usando gravetos como armas e gritando coisas como 'pela honra da minha casa!' e várias vezes '#EMP arghhhh#!'.\n\nParo para admirar um dos edifícios mais proeminentes, erguido orgulhosamente no meio da praça. Ao inspecioná-lo mais de perto, porém, percebo rapidamente algumas inscrições antigas..."
 ep2_locale_events.5500.t:0 "Antigo como Pedra"
 ep2_locale_events.5510.a.failure:0 "[village_thug.GetShortUIName] parece não estar impressionado"
 ep2_locale_events.5510.a.success:0 "Você convence [village_thug.GetShortUIName]"
 ep2_locale_events.5510.a:0 "\"Ei você! Você! Agora você é meu cavaleiro.\""
 ep2_locale_events.5510.b:0 "\"Esses são movimentos impressionantes, deixe-me estudá-los...\""
 ep2_locale_events.5510.c:0 "\"Parem agora mesmo, seus bárbaros!\""
 ep2_locale_events.5510.desc:0 "Os moradores de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] parecem igualmente interessados no torneio, assim como os nobres que o frequentam: alguns improvisaram lojas temporárias no térreo de suas casas, e o cheiro das comidas de rua é delicioso.\n\nAcima de toda a festa e o burburinho, ouço ruídos mais... violentos vindos de um dos becos; ao me aproximar, observo o que parece ser uma briga de camponeses, mas um deles é mais habilidoso que os demais."
 ep2_locale_events.5510.t:0 "$tournament_locale_settlement$: Beco"
 ep2_locale_events.5520.a.failure:0 "Elas te pegam ouvindo atrás das cortinas"
 ep2_locale_events.5520.a.success.tt:0 "Você descobre o segredo de [gossip_knight.GetTitledFirstNamePossessive]"
 ep2_locale_events.5520.a.success:0 "Elas não parecem ter percebido você"
 ep2_locale_events.5520.a:0 "Eu ouvi direito?"
 ep2_locale_events.5520.b:0 "Posso aprender algo com o conhecimento técnico delas..."
 ep2_locale_events.5520.c:0 "Imagine a quantidade de ouro que elas devem ganhar com isso..."
 ep2_locale_events.5520.d:0 "Não ouvi nada."
 ep2_locale_events.5520.desc:0 "Um grupo de [village_woman.GetWomenMen] tomou uma das casas como sua oficina principal de tecelagem, e consigo perceber claramente que elas estão tendo uma animada conversa sobre o torneio em andamento.\n\nMe inclino na janela, tendo o cuidado de não ser notado.\n\n\"...e aquele [gossip_knight.GetWomanMan], [gossip_knight.GetFirstName]? Não consigo acreditar que o pegaram ontem em flagrante!\" uma delas diz, enquanto habilmente tece alguns fios."
 ep2_locale_events.5520.t:0 "$tournament_locale_settlement$: Puxando os Fios"
 ep2_locale_events.5530.a:0 "Meus súditos ficarão encantados em me ver participando!"
 ep2_locale_events.5530.b.failure:0 "Você parece desajeitado(a)"
 ep2_locale_events.5530.b.success:0 "Sua dança é impressionante"
 ep2_locale_events.5530.b:0 "A ocasião perfeita para impressionar os presentes."
 ep2_locale_events.5530.c.flavor:0 "A batalha é como uma dança de espadas!"
 ep2_locale_events.5530.c:0 "Esses movimentos... eles podem ser úteis no próximo torneio!"
 ep2_locale_events.5530.d:0 "Essa música é tão inspiradora!"
 ep2_locale_events.5530.desc:0 "A música pode ser ouvida nos campos ao redor da vila. Seguindo o som, chego à origem dele: a praça ricamente enfeitada. Flautas, tambores e todo tipo de instrumentos e baladas!\n\nHomens e mulheres dançam em círculos por toda parte da praça, agora com as mãos unidas, agora começam a cantar, agora giram e giram e giram."
 ep2_locale_events.5530.e:0 "Não devo me desviar do treinamento."
 ep2_locale_events.5530.t:0 "Festividades"
 ep2_locale_events_artifact_decoration_desc:0 "[previous_artifact.GetDesc]\n\nFoi decorado com uma fita floral."
 ep2_locale_events_artifact_motto_desc:0 "[my_weapon.GetDesc] Ao longo da lâmina está escrito [my_weapon.GetOwner.GetHouse.GetMotto]."
 ep2_locale_events_artifact_prayer_desc:0 "[my_weapon.GetDesc]\n\nUma oração foi entalhada na lâmina."
 ep2_locale_events_artifact_sharp_desc:0 "[my_weapon.GetDesc]\n\nA lâmina foi afiada para o torneio."
 ep2_locale_events_gift_failure:0 "Eles não gostam do seu presente"
 ep2_locale_events_gift_success:0 "Seu presente é bem recebido"
 every_attending_contestant_tt:0 "Todo Competidor"
 every_faith_attending_character_tt:0 "Cada participante [instigator_scope.GetFaith.GetAdjective]"
 feather_trinket.desc:0 "Uma pena ricamente colorida, dizem que pertencia a um pavão. Uma aquisição exótica."
 feather_trinket:0 "Pena Brilhante"
 glass_orb_trinket.desc:0 "Uma esfera cristalina. Nunca será completamente transparente."
 glass_orb_trinket:0 "Orbe de Vidro"
 good_luck_horseshoe_artifact:0 "Ferradura"
 good_luck_horseshoe_artifact_desc:0 "Uma ferradura de ferro, dizem que afasta espíritos malignos."
 improved_artifact_desc:0 "[improved_weapon.GetDesc]\n\nAprimorado por um habilidoso ferreiro pouco antes de um torneio importante."
 ribbon_trinket.desc:0 "Uma tira de seda bordada com padrões florais. Um belo presente."
 ribbon_trinket:0 "Fita Ornamentada"
 score_decreases_slightly_tt:0 "Placar #negative_value diminui ligeiramente#!"
 score_decreases_tt:0 "Placar #negative_value diminui#!"
 score_increases_slightly_tt:0 "Placar #positive_value aumenta ligeiramente#!"
 score_increases_tt:0 "Placar #positive_value aumenta#!"
 tapestry_trinket.desc:0 "Uma tapeçaria que retrata uma cena pastoral. Os animais bebem de um riacho calmo."
 tapestry_trinket:0 "Tapeçaria de Ovelhas"
 tournament_appointed_champion_opinion:0 "Campeão(a) Nomeado(a)"
 tournament_armorer_shield_modifier:0 "Escudo Fino"
 tournament_armorer_shield_modifier_desc:0 "Este personagem recebeu de presente um escudo de exibição de alta qualidade, comprado em uma armaria de torneio."
 tournament_armorer_tournament_modifier:0 "Elmo de Torneio"
 tournament_armorer_tournament_modifier_desc:0 "Este personagem recebeu de presente um elmo de torneio de alta qualidade, comprado em uma armaria de torneio."
 tournament_arrested_revelers_opinion:0 "Festeiros Presos"
 tournament_astronomy_modifier:0 "Astrônomo(a)"
 tournament_astronomy_modifier_desc:0 "Este(a) personagem estudou as estrelas e seus movimentos"
 tournament_banished_farrier_opinion:0 "Aprendiz de Ferreiro Banido"
 tournament_banners_modifier:0 "Bandeiras do Torneio"
 tournament_banners_modifier_desc:0 "Este personagem encomendou bandeiras para a plateia."
 tournament_bowyer_hunt_modifier:0 "Setas de Caça Finas"
 tournament_bowyer_hunt_modifier_desc:0 "Este personagem recebeu de presente algumas flechas de caça de alta qualidade, compradas em uma arquearia de torneio."
 tournament_bowyer_quiver_modifier:0 "Aljava Fina"
 tournament_bowyer_quiver_modifier_desc:0 "Este personagem recebeu de presente uma aljava de alta qualidade, comprada em uma arquearia de torneio."
 tournament_cut_off_round_opinion:0 "Eliminação"
 tournament_dice_player_modifier:0 "Jogador de Dados"
 tournament_dice_player_modifier_desc:0 "Este personagem participou de um jogo de dados com altas apostas em uma taverna."
 tournament_ended_rightly_opinion:0 "Terminou Corretamente"
 tournament_failed_gift_opinion:0 "Presente Mal Escolhido"
 tournament_favored_revelers_opinion:0 "Festeiros Favorecidos"
 tournament_ground_flexing:0 "Treinamento Impressionante"
 tournament_kept_the_peace_modifier:0 "Manteve a Paz"
 tournament_kept_the_peace_modifier_desc:0 "A língua afiada deste personagem acalmou uma confrontação de alto risco."
 tournament_lecherous_knight_modifier:0 "Guerreiros Libertinos"
 tournament_lecherous_knight_modifier_desc:0 "Este personagem encontrou seus cavaleiros envolvidos em atividades amorosas com profissionais discretos e decidiu participar."
 tournament_lecherous_knight_positive_modifier:0 "Guerreiros Libertinos"
 tournament_lecherous_knight_positive_modifier_desc:0 "Este personagem encontrou seus cavaleiros envolvidos em atividades amorosas com profissionais discretos e decidiu participar, com a aprovação de seus [ROOT.Char.GetFaith.PriestNeuterPlural]."
 tournament_locale_tourney_grounds:0 "Terrenos do Torneio"
 tournament_man_of_the_people_modifier:0 "Amigo do Povo"
 tournament_man_of_the_people_modifier_desc:0 "Este personagem está feliz em confraternizar com os plebeus em seu nível."
 tournament_new_horseshoes_modifier:0 "Novas Ferraduras"
 tournament_not_cursed_modifier:0 "Ar Fresco"
 tournament_not_cursed_modifier_desc:0 "Este(a) personagem evitou o ar ruim que envenenou um torneio"
 tournament_religious_tension_opinion:0 "Tensão Religiosa"
 tournament_snob_modifier:0 "Esnobe"
 tournament_snob_modifier_desc:0 "Este personagem se recusa a passar tempo com aqueles considerados abaixo de sua posição."
 tournament_stopped_peasant_fight:0 "Ruas Calmas"
 tournament_supported_weavers:0 "Interesse pela Tecelagem"
 tournament_supported_weavers_desc:0 "Esse personagem passou um bom tempo aprendendo com as tecelãs da vila"
 tournament_sword.controlledadv:0 "$tournament_sword_description$ A inscrição na lâmina faz referência à defesa do reino."
 tournament_sword.foreignfaith:0 "$tournament_sword_description$ O texto estranho e estrangeiro em sua lâmina parece fazer referência a uma religião desconhecida."
 tournament_sword.martiallifestyle:0 "$tournament_sword_description$ A construção durável mostra um compromisso de ser uma lâmina letal em primeiro lugar."
 tournament_sword_description:0 "$artifact_sword_description$\n\nEssa arma foi adquirida em um torneio."
 tournament_sword_name:0 "Espada de Torneio"
 tournament_tailor_banner_modifier:0 "Bandeira Fina"
 tournament_tailor_banner_modifier_desc:0 "Este personagem recebeu de presente uma bela bandeira, comprada em uma alfaiataria de torneio."
 tournament_tailor_fancy_crest_modifier:0 "Brasão Exquisito"
 tournament_tailor_fancy_crest_modifier_desc:0 "Este personagem possui um brasão de família requintado e nunca é visto(a) sem ele."
 tournament_tailor_gambeson_modifier:0 "Gambesão Fino"
 tournament_tailor_gambeson_modifier_desc:0 "Este personagem recebeu de presente um gambesão resistente, comprado em uma alfaiataria de torneio."
 tournament_tailor_glove_modifier:0 "Luvas Finas"
 tournament_tailor_glove_modifier_desc:0 "Este personagem recebeu de presente um par de luvas delicadas, compradas em uma alfaiataria de torneio."
 tournament_tailor_mixup_scheme_modifier:0 "Identificação Errônea"
 tournament_tailor_mixup_scheme_modifier_desc:0 "Este personagem possui o brasão de outra casa, o que lhe dá uma grande oportunidade de enganar os outros."
 tournament_tailor_mixup_scheme_modifier_value:0 "$tournament_tailor_mixup_scheme_modifier$: $VALUE|+0=-+$"
 tournament_tolerated_revelers_opinion:0 "Festeiros Tolerados"
