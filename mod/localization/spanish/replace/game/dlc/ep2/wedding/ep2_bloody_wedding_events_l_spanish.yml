l_spanish:
 ep2_wedding.0101.a.tt:0 "O casamento começa... e será lembrado"
 ep2_wedding.0101.a:0 "Cada membro da casa [spouse_2.GetHouse.GetNameNoTooltip] deve ser eliminado."
 ep2_wedding.0101.a_lowborn:0 "Cada membro desta família deve ser eliminado."
 ep2_wedding.0101.b:0 "É apenas a vida de [spouse_2.GetFirstNamePossessiveNoTooltip] que tomarei."
 ep2_wedding.0101.c.tt:0 "Uma escolha íntima"
 ep2_wedding.0101.c:0 "A noite de núpcias - uma ocasião perfeita."
 ep2_wedding.0101.d.tt:0 "O casamento começa e nenhum mal é causado"
 ep2_wedding.0101.d:0 "Eu não posso fazer isso. Não aqui. Não agora."
 ep2_wedding.0101.desc.bad:0 ": uma presença tão desprezível deve ser banida."
 ep2_wedding.0101.desc.good:0 "... Desculpe-me, meu querido(a)."
 ep2_wedding.0101.desc.intro:0 "Todos os convidados estão reunidos no pátio. Um dia maravilhoso e ensolarado. Olho para minha [dummy_gender.GetWomenMen] - os guardas que prometi como anfitrião gracioso. #EMP Fortemente#! armados. Em breve, meus preparativos se concretizarão.\n\nVejo [spouse_2.GetTitledFirstName] chegar, junto com seu séquito"
 ep2_wedding.0101.desc.spouse:0 ". Casados - por apenas um dia."
 ep2_wedding.0101.t:0 "'Até que a morte nos separe...'"
 ep2_wedding.0200.a.murder:0 "#EMP Aproveite!#!"
 ep2_wedding.0200.desc.murder:0 "$ep2_wedding.0200.desc.murder_intro$ 'Sou grato pela sua benevolência, [ROOT.Char.Custom('FormOfAddressForLiege')], isso realmente aquece meu coração.'"
 ep2_wedding.0200.desc.murder_intro:0 "Enquanto os convidados entram no salão, eu me atraso, conversando com um grupo de participantes sobre [ROOT.Char.Custom('my_subject_of_interest')]. 'Um anfitrião tão generoso!' ouço enquanto me desculpo em direção à mesa principal. Meus guardas estão #EMP por toda parte#!. Prontos. Ao me sentar, travo olhares com [spouse_2.GetTitledFirstName]:\n\n"
 ep2_wedding.0200.desc.murder_spouse:0 "$ep2_wedding.0200.desc.murder_intro$ 'Em breve seremos apenas os #EMP dois#!, meu querido', digo, levantando minha taça."
 ep2_wedding.0202.a.lowborn:0 "Sua casa termina aqui."
 ep2_wedding.0202.a:0 "A casa de [spouse_2.GetHouse.GetNameNoTooltip] termina aqui."
 ep2_wedding.0202.desc.arrogant:0 "Recosto-me na cadeira, tentando não sorrir. As pessoas vão lembrar disso por todas as eras."
 ep2_wedding.0202.desc.cannibal:0 "Eu estava ficando com fome mesmo..."
 ep2_wedding.0202.desc.compassionate:0 "É uma pena que tenha chegado a isso. Não conseguirei olhar."
 ep2_wedding.0202.desc.craven:0 "Enxugo o suor da testa. #EMP Tossindo.#! Mantenha a cabeça baixa, [ROOT.Char.GetFirstNameNoTooltip], não deixe que desconfiem."
 ep2_wedding.0202.desc.fallback:0 "Me pego assobiando descuidadamente junto."
 ep2_wedding.0202.desc.intro:0 "Os convidados estão envolvidos em tantas conversas que é difícil acompanhar todas elas. [spouse_2.GetTitledFirstName] está cercado por um grupo de cortesãos atentos, todos se elogiando. Se a distração é mera coincidência ou destino, não posso dizer.\n\n"
 ep2_wedding.0202.desc.just:0 "Chamo isso de justiça."
 ep2_wedding.0202.desc.lazy:0 "Estou tão grato por não ter que fazer isso eu mesmo - o assassinato parece um esforço cansativo."
 ep2_wedding.0202.desc.outro:0 "\n\nFaço um sinal para meus servos enquanto dou uma mordida na [ROOT.Char.Custom('GetExpensiveDessert')]. Meus [dummy_gender.GetWomenMen] entram no salão, disfarçados de mercenários. As portas são trancadas e a música começa a tocar. Que o massacre comece."
 ep2_wedding.0202.desc.paranoid:0 "Finalmente, meus inimigos vão parar de conspirar contra mim - seus lábios estarão calados para sempre."
 ep2_wedding.0202.desc.sadistic:0 "Mal posso esperar para ver as tábuas de pedra ficarem vermelhas sob seus pés."
 ep2_wedding.0202.desc.wrathful:0 "Que suas cabeças rolem pelos salões que tanto difamaram!"
 ep2_wedding.0202.desc.zealous:0 "Que suas almas encontrem redenção no [ROOT.Char.GetFaith.NegativeAfterLife]."
 ep2_wedding.0202.t.spouse:0 "'...Até que a morte nos separe'"
 ep2_wedding.0202.t:0 "'...Até que eles se separem'"
 ep2_wedding.0203.a:0 "Uma tragédia!"
 ep2_wedding.0203.desc.arrogant:0 "Recosto-me na cadeira, dando um gole em [ROOT.Char.Custom('RegionalDrink')]."
 ep2_wedding.0203.desc.cannibal:0 "Olho atentamente para a pele [spouse_2.GetHerHim]... que delícia."
 ep2_wedding.0203.desc.compassionate:0 "Só espero que seja rápido e indolor."
 ep2_wedding.0203.desc.craven:0 "Não posso... não posso olhar. Pode ser ainda pior do que eu pensava!"
 ep2_wedding.0203.desc.fallback:0 ""
 ep2_wedding.0203.desc.intro:0 "À medida que o banquete chega ao fim, as conversas começam a diminuir e os convidados são classificados como muito bêbados ou muito cansados. Aqueles suficientemente sóbrios - ou bêbados o suficiente - agora cercam [spouse_2.GetTitledFirstName], em uma última tentativa de conquistar o favor do casamento.\n\n"
 ep2_wedding.0203.desc.just:0 "É o que deve ser feito."
 ep2_wedding.0203.desc.outro:0 "Um dos cortesãos ri um pouco mais do que deveria. Um pouco mais forte. [my_agent.GetSheHe|U] tira uma adaga e o coração de [spouse_2.GetFirstNameNoTooltip] fica rapidamente em silêncio, assim como os convidados.\n\n\"Prendam [my_agent.GetSheHe]!\" Grito, sabendo perfeitamente que [my_agent.GetSheHe] será libertado no dia seguinte."
 ep2_wedding.0203.desc.paranoid:0 "Agora [spouse_2.GetSheHe] vai aprender! Agora com certeza [spouse_2.GetSheHe] vai aprender! #EMP Todos#! vão!"
 ep2_wedding.0203.desc.sadistic:0 "Lambo a lâmina da faca. Como eu gostaria de poder fazer isso eu mesmo..."
 ep2_wedding.0203.desc.wrathful:0 "#EMP Tire a cabeça [spouse_2.GetHerHim]. Tire agora.#!"
 ep2_wedding.0203.desc.zealous:0 "Essa é a única maneira de se livrar de uma alma tão venenosa."
 ep2_wedding.0203.t.spouse:0 "$ep2_wedding.0202.t.spouse$"
 ep2_wedding.0203.t:0 "$ep2_wedding.0202.t$"
 ep2_wedding.0204.a.spouse_2_murder.tt:0 "[spouse_2.GetShortUIName] morre"
 ep2_wedding.0204.a.tt.failure.host:0 "[murder_victim.GetShortUIName] sobrevive"
 ep2_wedding.0204.a.tt.failure:0 "Você morre"
 ep2_wedding.0204.a.tt.success.host:0 "[murder_victim.GetShortUIName] morre"
 ep2_wedding.0204.a.tt.success:0 "Você sobrevive"
 ep2_wedding.0204.a:0 "Não! #EMP Pare!#!"
 ep2_wedding.0204.desc.family.non_spouse:0 "Vejo um grupo de mercenários marchando em nossa direção. #EMP Ssh#!. Espadas são sacadas. Seus sorrisos prenunciam nossa tragédia.\n\n\"Digam adeus à sua família, [spouse_2.GetTitledFirstName].\""
 ep2_wedding.0204.desc.family:0 "$ep2_wedding.0204.desc.family.non_spouse$ Eles dizem, antes de colocarem uma lâmina em minha própria garganta."
 ep2_wedding.0204.desc.intro:0 "Minha conversa alegre abruptamente chega ao fim quando"
 ep2_wedding.0204.desc.solo:0 "um dos cortesãos ri um pouco demais. Um pouco estranhamente. Olho para [mercenary_1.GetSheHe] e vejo que [mercenary_1.GetSheHe] agora segura uma faca contra meu peito. \"Desejo-lhe o melhor.\""
 ep2_wedding.0204.t:0 "Sangue e Aço"
 ep2_wedding.0300.desc.murder_spouse:0 "À medida que o banquete chega ao fim, as velas se apagam e os convidados se retiram para seus aposentos. As vozes se elevam novamente quando chega a hora da nossa noite de núpcias: \"Que os recém-casados celebrem!\"\n\nEu #EMP mal posso esperar."
 ep2_wedding.0301.a:0 "Cruel, cruel destino."
 ep2_wedding.0301.desc.agent:0 "Os guardas levaram o agente, mas a expressão horrorizada permanece nos rostos dos convidados. Um médico se apresenta como consolo, mas é evidente que não há cura para uma adaga no coração."
 ep2_wedding.0301.desc.family:0 "Corpos estão espalhados pelo quarto. Os serviçais preparam camas enquanto murmura-se sobre quem poderia ser o assassino. 'Ouvi dizer que eles tinham muitos inimigos.' 'Ouvi dizer que eles não tinham nenhum.'"
 ep2_wedding.0301.desc.wedding_night:0 "Corro pelos corredores até o grande salão, vestida apenas com minha camisola. Antes de abrir a porta, tiro um momento para colocar meu melhor semblante de luto. #EMP 'Socorro! Socorro!'#! eu grito, 'Um agente tirou a vida de [spouse_2.GetTitledFirstName], em nossos aposentos!'"
 ep2_wedding.0301.non_spouse:0 "\n\nO choro de [spouse_1.GetTitledFirstNamePossessive] ecoa pelo quarto. As mãos [spouse_1.GetHerHim|U] seguram firmemente [spouse_2.GetFirstNamePossessiveNoTooltip], recusando-se a soltá-la."
 ep2_wedding.0301.spouse:0 "\n\n'Oh, meu querido, como o destino foi cruel conosco!' Eu choro, segurando firmemente a mão gelada [spouse_2.GetHerHim]. 'Vou encontrar quem fez isso com você e #EMP acabar#! com eles.'"
 ep2_wedding.0301.spouse_wnight:0 "\n\nSilêncio reina. Meus guardas começam a correr em direção ao quarto e eu cubro meu rosto com as mãos."
 ep2_wedding.0301.t:0 "Sabor Amargo"
 ep2_wedding.0302.a:0 "Uma tragédia."
 ep2_wedding.0302.bad:0 "Não deveria dizer que [spouse_2.GetSheHe] merecia, mas..."
 ep2_wedding.0302.desc.agent:0 "Um grito agudo interrompe minha conversa encantadora sobre [ROOT.Char.Custom('meu_assunto_de_interesse')] com alguns dos convidados. #EMP \"Não!\"#! Eu me viro e vejo [spouse_2.GetTitledFirstName], com uma adaga enfiada bem em seu coração.\n\nOs guardas se lançam rapidamente em direção ao assassino, \"Prendam-no, prendam-no!\" Ouço [host.GetTitledFirstName] gritar.\n\n"
 ep2_wedding.0302.desc.family:0 "A música interrompe minha conversa encantadora sobre [ROOT.Char.Custom('meu_assunto_de_interesse')] com alguns dos convidados. Eu me viro para olhar os artistas e meus olhos encontram inesperadamente os de outra pessoa. Um grupo de mercenários marcha em direção à família de [spouse_2.GetTitledFirstName] e [spouse_2.GetHerHim].\n\nEspadas são sacadas. #EMP \"Não! Não, por favor! NÃO!\"#!\n\nCorpos caem no chão com um som seco e áspero."
 ep2_wedding.0302.desc.wedding_night:0 "As portas do grande salão se abrem abruptamente, e [spouse_1.GetTitledFirstName] está no meio - respiração ofegante, seus braços firmemente segurando a madeira. 'Ajuda... ajuda!' [spouse_1.GetSheHe] chora, 'Um agente tirou a vida de [spouse_2.GetTitledFirstName], em nossos próprios aposentos!'\n\nA sala fica em silêncio."
 ep2_wedding.0302.good:0 "Meu amado [spouse_2.GetFirstNameNoTooltip]... se foi assim."
 ep2_wedding.0302.indifferent:0 "Eu não conhecia [spouse_2.GetFirstNameNoTooltip] muito bem, mas ninguém merece um destino como esse."
 ep2_wedding.0302.sadistic:0 "Não consigo desviar os olhos do sangue... um trabalho tão bem-feito."
 ep2_wedding.0302.spouse:0 "Eu me aproximo apressadamente de [spouse_2.GetFirstNameNoTooltip] e seguro sua mão. Ainda quente. 'Não... meu coração... não tão cedo...'"
 ep2_wedding.0302.t:0 "Chega o Luto"
 ep2_wedding.0955.a.failure:0 "Da próxima vez... da próxima vez."
 ep2_wedding.0955.a:0 "Um verdadeiro alívio."
 ep2_wedding.0955.bad:0 "Finalmente, não terei mais que ver o rosto [spouse_2.Custom2('InsultAdjective', ROOT.Char)] [spouse_2.GetHerHim]."
 ep2_wedding.0955.compassionate:0 "Só posso esperar que [ROOT.Char.GetFaith.HighGodName] me perdoe."
 ep2_wedding.0955.desc.failed:0 "Avisto o rosto de [spouse_2.GetTitledFirstName], conversando alegremente com sua comitiva.\n\nEu sei que [spouse_2.GetSheHe] suspeita de mim, e com razão. Esse casamento será tudo, menos entediante."
 ep2_wedding.0955.desc.intro:0 "$ep2_wedding_departure_intro$\n\nEnquanto me preparo para me despedir dos que restam,"
 ep2_wedding.0955.desc.murder:0 "Tiro um momento para pensar em [spouse_2.GetTitledFirstName]. Partido."
 ep2_wedding.0955.good:0 "Não precisava terminar assim."
 ep2_wedding.0955.indifferent:0 "O que está feito, está feito."
 ep2_wedding.0955.sadistic:0 "Se eu pudesse contar a todos que fui #EMP eu#!..."
 ep2_wedding.0955.t:0 "Aurora Vermelha"
 ep2_wedding.0956.a.good:0 "Não... isso não pode ser verdade."
 ep2_wedding.0956.a:0 "Estou apenas feliz por não ter sido eu."
 ep2_wedding.0956.desc:0 "$ep2_wedding_departure_intro$\n\n[host.GetTitledFirstName] se aproxima de mim, sua voz ainda cheia de pesar: 'Meu coração está pesado com a perda de [spouse_2.GetTitledFirstName], peço desculpas por essa celebração maldita.'"
 ep2_wedding.0956.t:0 "Despedida"
 ep2_wedding.0957.a.tt:0 "Todos os membros próximos da família de [spouse_2.GetShortUIName]"
 ep2_wedding.0957.a:0 "Apenas mais um casamento que deu errado."
 ep2_wedding.0957.desc.parent:0 "Eu confiei meu filho aos seus cuidados, e você não foi capaz de proteger [spouse_2.GetSheHe].$ep2_wedding.0957.desc_ending$"
 ep2_wedding.0957.desc:0 "Meu querido [avenging_family.Custom2('RelationToMeShort', SCOPE.sC('spouse_2'))] foi colocado sob sua proteção e é assim que você protege [spouse_2.GetSheHe]?$ep2_wedding.0957.desc_ending$"
 ep2_wedding.0957.desc_ending:0 "\n\nMeus olhos estão cheios de lágrimas pela perda [spouse_2.GetHerHim], mas em meu coração só há ódio.\n\nEu irei buscar uma retribuição, de uma forma ou de outra."
 ep2_wedding.0957.opening:0 "Ao [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('avenging_family'))] [ROOT.Char.GetTitledFirstName]"
 ep2_wedding.3060.a.failure:0 "[spouse_2.GetShortUIName] escapa do seu domínio"
 ep2_wedding.3060.a.success:0 "Você estrangula [spouse_2.GetShortUIName]"
 ep2_wedding.3060.a:0 "'Aproxime-se, meu querido...'"
 ep2_wedding.3060.b.failure:0 "[spouse_2.GetShortUIName] descobre suas intenções"
 ep2_wedding.3060.b.success:0 "Você envenena [spouse_2.GetShortUIName] com sucesso"
 ep2_wedding.3060.b:0 "Eu conheço algumas ervas que silenciariam [spouse_2.GetSheHe] melhor."
 ep2_wedding.3060.c.failure:0 "[spouse_2.GetShortUIName] fica desconfiado"
 ep2_wedding.3060.c.flavor:0 "Deixe-me cortar algumas frutas para você, meu querido!"
 ep2_wedding.3060.c.success:0 "Você corta a garganta de [spouse_2.GetShortUIName]"
 ep2_wedding.3060.c:0 "Um movimento rápido. Eu tenho uma adaga bem debaixo deste travesseiro."
 ep2_wedding.3060.d:0 "Não, eu não posso fazer isso."
 ep2_wedding.3060.desc:0 "Uma cama ricamente coberta nos aguarda. À medida que as velas brilham sobre o rosto de [spouse_2.GetTitledFirstNamePossessive], seguro a respiração por um momento. 'Venha deitar-se comigo, meu amor', diz [spouse_2.GetSheHe], tirando a camisa [spouse_2.GetHerHim].\n\nA lua brilha intensamente como o dia. Acaricio a garganta [spouse_2.GetHerHim] antes de beijá-la. Minha mão - se eu apertar firmemente, estará tudo acabado."
 ep2_wedding.3060.t:0 "Uma Noite para Morrer"
 ep2_wedding_departure_intro:0 "O salão não se parece em nada com o dia anterior. Os serviçais limparam as mesas, não há música e a maioria dos convidados já se foi."
 host_bloody_wedding_excommunication:0 "[CHARACTER.GetShortUIName] foi excomungado"
 host_bloody_wedding_excommunication_title:0 "Excomunhão"
 host_bloody_wedding_family_kill:0 "$host_bloody_wedding_family_kill_title$"
 host_bloody_wedding_family_kill_title:0 "Casamento Sangrento"
 host_bloody_wedding_solo_kill:0 "$host_bloody_wedding_family_kill_title$"
 host_bloody_wedding_solo_kill_title:0 "$host_bloody_wedding_family_kill_title$"
