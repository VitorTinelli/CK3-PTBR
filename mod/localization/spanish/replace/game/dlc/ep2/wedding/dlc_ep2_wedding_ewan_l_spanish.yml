l_spanish:
 ep2_wedding_ewan.0000.desc.boilerplate.char_intro:0 "Perto do meu lugar, tanto [char_1.GetTitledFirstName] quanto [char_2.GetTitledFirstName] compartilham suas opiniões"
 ep2_wedding_ewan.0000.desc.hate.fallback:0 "\"Bah, você é fácil de agradar,\" resmunga [char_2.GetFirstNameNoTooltip]. \"Esperava mais desse tipo de evento.\""
 ep2_wedding_ewan.0000.flavour.hobnob.char_1:0 "Você passa a maior parte da noite confraternizando com este(a) [char_1.Custom('GetEducationTrait')]"
 ep2_wedding_ewan.0000.flavour.hobnob.char_2:0 "Você passa a maior parte da noite confraternizando com este(a) [char_2.Custom('GetEducationTrait')]"
 ep2_wedding_ewan.0001.a.host:0 "\"[char_1.GetFirstNameNoTooltip], fico feliz que esteja gostando!\""
 ep2_wedding_ewan.0001.a:0 "\"[char_1.GetFirstNameNoTooltip] claramente está certo.\""
 ep2_wedding_ewan.0001.b.host:0 "\"Eu imaginei de forma diferente quando os contratei, [char_2.GetFirstNameNoTooltip]\""
 ep2_wedding_ewan.0001.b:0 "\"Eu tenho que concordar com [char_2.GetFirstNameNoTooltip].\""
 ep2_wedding_ewan.0001.c.tt:0 "Seu olhar deixa [intent_target.GetFirstNameNoTooltip] desconfortável"
 ep2_wedding_ewan.0001.c:0 "Meu olhar ameaçador está fixo em [intent_target.GetFirstNameNoTooltip]..."
 ep2_wedding_ewan.0001.d:0 "Estou focado na verdadeira diversão."
 ep2_wedding_ewan.0001.desc.intro.bad:0 "Embora não seja o evento mais grandioso, as atrações da noite são uma emocionante variedade de atores, acrobatas, malabaristas e muito mais. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ na exibição.\n\n"
 ep2_wedding_ewan.0001.desc.intro.good:0 "O salão está repleto de uma parada tumultuada de trupes de teatro, músicos dançantes e charlatães exóticos, encantando os convidados em massa. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ na exibição.\n\n"
 ep2_wedding_ewan.0001.desc.intro.normal:0 "Um magnífico grupo de músicos, saltimbancos e atores está proporcionando o entretenimento da noite, encantando os convidados em todo o salão. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ na exibição.\n\n"
 ep2_wedding_ewan.0001.desc.midtro:0 "\n\n"
 ep2_wedding_ewan.0001.desc.t1.hate.ambitious:0 "$ep2_wedding_ewan.0001.desc.t1.hate.arrogant$"
 ep2_wedding_ewan.0001.desc.t1.hate.arbitrary:0 "$ep2_wedding_ewan.0001.desc.t1.hate.deceitful$"
 ep2_wedding_ewan.0001.desc.t1.hate.arrogant:0 "\"Bah, eles são adequados, mas estão longe do espetáculo que eu estava esperando,\" lamenta [char_2.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t1.hate.brave:0 "\"Deveria haver muito mais,\" reclama [char_2.GetFirstNameNoTooltip], \"esses poucos não são o suficiente para fazer algo realmente audacioso.\""
 ep2_wedding_ewan.0001.desc.t1.hate.deceitful:0 "\"Sinceramente, eu esperava um pouco mais,\" reclama [char_2.GetFirstNameNoTooltip], \"acho esse tipo de pessoa fascinante.\""
 ep2_wedding_ewan.0001.desc.t1.hate.gregarious:0 "$ep2_wedding_ewan.0001.desc.t1.hate.lazy$"
 ep2_wedding_ewan.0001.desc.t1.hate.lazy:0 "\"Hrmph, eu estava esperando algo um pouco mais... extravagante...\" resmunga [char_2.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t1.hate.trusting:0 "\"Eu estava esperando mais variedade, sinceramente,\" lamenta [char_2.GetFirstNameNoTooltip], \"você sempre pode pegar mais tipos de trabalho de qualquer cidade antiga, afinal.\""
 ep2_wedding_ewan.0001.desc.t1.love.content:0 "$ep2_wedding_ewan.0001.desc.t1.love.humble$"
 ep2_wedding_ewan.0001.desc.t1.love.craven:0 "Eu sempre fico um pouco nervoso se as apresentações forem #EMP demais#! ousadas,\" [char_1.GetFirstNameNoTooltip] gargalha."
 ep2_wedding_ewan.0001.desc.t1.love.diligent:0 "\"Bravo! Bravo! Suficiente para ser interessante sem ficar #EMP demais#! frívolo!\" exclama [char_1.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t1.love.honest:0 "\"Fico feliz que não haja muitos artistas,\" franz [char_1.GetFirstNameNoTooltip]. \"Tipos problemáticos, em geral.\""
 ep2_wedding_ewan.0001.desc.t1.love.humble:0 "\"A quantidade perfeita de artistas para ser decente,\" concorda [char_1.GetFirstNameNoTooltip] com satisfação."
 ep2_wedding_ewan.0001.desc.t1.love.just:0 "$ep2_wedding_ewan.0001.desc.t1.love.honest$"
 ep2_wedding_ewan.0001.desc.t1.love.paranoid:0 "\"Pessoas temperamentais, artistas. Isso é o suficiente — é arriscado ter muitos em um só lugar\", [char_1.GetFirstNameNoTooltip] concorda."
 ep2_wedding_ewan.0001.desc.t1.love.shy:0 "\"É bom ter uma emoção de fundo sem sobrecarregar toda a conversa\", sussurra [char_1.GetFirstNameNoTooltip] meio baixinho."
 ep2_wedding_ewan.0001.desc.t2.hate.ambitious:0 "\"Está bom, suponho,\" [char_2.GetFirstNameNoTooltip] cospe, \"eu simplesmente prefiro ostentação verdadeiramente impressionante em vez dessas medidas pela metade.\""
 ep2_wedding_ewan.0001.desc.t2.hate.arrogant:0 "$ep2_wedding_ewan.0001.desc.t2.hate.ambitious$"
 ep2_wedding_ewan.0001.desc.t2.hate.greedy:0 "\"Bah, há muitos deles para aplaudir a economia, mas não o suficiente para apreciar a exibição do dinheiro de outra pessoa,\" lamenta [char_2.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t2.hate.impatient:0 "$ep2_wedding_ewan.0001.desc.t2.hate.wrathful$"
 ep2_wedding_ewan.0001.desc.t2.hate.stubborn:0 "\"Na minha opinião, isso deveria ser uma celebração para a cerimônia,\" opina [char_2.GetFirstNameNoTooltip], \"então deveria ter correspondido à sua importância e ter sido completo.\""
 ep2_wedding_ewan.0001.desc.t2.hate.wrathful:0 "\"Sinceramente, eu esperava um pouco mais de agitação do evento,\" [char_2.GetFirstNameNoTooltip] resmunga."
 ep2_wedding_ewan.0001.desc.t2.hate.zealous:0 "$ep2_wedding_ewan.0001.desc.t2.hate.stubborn$"
 ep2_wedding_ewan.0001.desc.t2.love.calm:0 "\"Muito pensamento é dedicado ao equilíbrio certo de ruído de fundo,\" reflete [char_1.GetFirstNameNoTooltip], \"é bom ver um pouco sem #EMP demais#! agitação.\""
 ep2_wedding_ewan.0001.desc.t2.love.compassionate:0 "$ep2_wedding_ewan.0001.desc.t2.love.content$"
 ep2_wedding_ewan.0001.desc.t2.love.content:0 "\"Ahh, a quantidade perfeita de animação para oferecer, eu diria,\" ri [char_1.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0001.desc.t2.love.cynical:0 "\"A quantidade correta de artistas e nada mais,\" observa [char_1.GetFirstNameNoTooltip] com ironia, \"ótimo, não suporto os esforçados demais.\""
 ep2_wedding_ewan.0001.desc.t2.love.fickle:0 "\"Nunca sei exatamente o que esperar dos artistas,\" ri [char_1.GetFirstNameNoTooltip], \"então tenho que dizer que isso me parece um bom nível.\""
 ep2_wedding_ewan.0001.desc.t2.love.generous:0 "\"Bom ver um pouco de variedade em exibição,\" diz [char_1.GetFirstNameNoTooltip], \"tantas vezes as pessoas são mesquinhas com essas coisas.\""
 ep2_wedding_ewan.0001.desc.t2.love.patient:0 "$ep2_wedding_ewan.0001.desc.t2.love.calm$"
 ep2_wedding_ewan.0001.desc.t3.hate.content:0 "$ep2_wedding_ewan.0001.desc.t3.hate.humble$"
 ep2_wedding_ewan.0001.desc.t3.hate.craven:0 "\"Cuidado!\" [char_2.GetFirstNameNoTooltip] cospe, desviando de uma bola de malabarismo jogada, \"malditos contratados levianos, nem consigo comer minha refeição em segurança...\""
 ep2_wedding_ewan.0001.desc.t3.hate.diligent:0 "\"Eu acho que tudo isso é um pouco demais,\" reclama [char_2.GetFirstNameNoTooltip], \"tanta... frivolidade...\""
 ep2_wedding_ewan.0001.desc.t3.hate.honest:0 "\"#EMP Atores#!\" [char_2.GetFirstNameNoTooltip] lamenta, \"todos eles são mentirosos profissionais. Poderíamos lidar com alguns a menos em uma ocasião tão importante.\""
 ep2_wedding_ewan.0001.desc.t3.hate.humble:0 "\"Está bom, mas é tudo muito exibicionista,\" [char_2.GetFirstNameNoTooltip] resmunga, \"eu poderia fazer com um pouco mais de espaço para conversar.\""
 ep2_wedding_ewan.0001.desc.t3.hate.just:0 "$ep2_wedding_ewan.0001.desc.t3.hate.honest$"
 ep2_wedding_ewan.0001.desc.t3.hate.paranoid:0 "\"Muitos rostos estranhos, muitas 'ferramentas' bizarras,\" [char_2.GetFirstNameNoTooltip] pragueja, \"Como aquele! Será que é uma espada falsa sendo engolida, ou um assassino à espreita?\""
 ep2_wedding_ewan.0001.desc.t3.hate.shy:0 "\"Eu mal consigo ouvir meus próprios pensamentos,\" sussurra [char_2.GetFirstNameNoTooltip], \"é tudo tão... avassalador...\""
 ep2_wedding_ewan.0001.desc.t3.love.ambitious:0 "$ep2_wedding_ewan.0001.desc.t3.love.arrogant$"
 ep2_wedding_ewan.0001.desc.t3.love.arbitrary:0 "$ep2_wedding_ewan.0001.desc.t3.love.deceitful$"
 ep2_wedding_ewan.0001.desc.t3.love.arrogant:0 "\"Agora #EMP isso#! é do jeito que eu gosto!\" gargalha [char_1.GetFirstNameNoTooltip], \"um evento grandioso, não, #EMP magnífico#!\""
 ep2_wedding_ewan.0001.desc.t3.love.brave:0 "\"Sim, sim, você pode tocar enquanto está no ar, não seja covarde!\" ri [char_1.GetFirstNameNoTooltip], repreendendo um músico, \"não é divertido sem um pouco de #EMP perigo#!.\""
 ep2_wedding_ewan.0001.desc.t3.love.deceitful:0 "\"Eu tenho muito respeito pelos artistas,\" reflete [char_1.GetFirstNameNoTooltip], \"é preciso habilidade para transformar a falsidade em uma profissão remunerada.\""
 ep2_wedding_ewan.0001.desc.t3.love.gregarious:0 "$ep2_wedding_ewan.0001.desc.t3.love.lazy$"
 ep2_wedding_ewan.0001.desc.t3.love.lazy:0 "\"Faça uma cambalhota!\" grita [char_1.GetFirstNameNoTooltip] para um saltimbanco se divertindo, \"pelo [char_1.GetFaith.HealthGodName], eu #EMP adoro#! uma boa festa!\""
 ep2_wedding_ewan.0001.desc.t3.love.trusting:0 "\"Que truques inusitados esses estranhos apresentam,\" ri [char_1.GetFirstNameNoTooltip], \"quase desejo que alguns deles venham morar comigo.\""
 ep2_wedding_ewan.0001.t:0 "Um Espetáculo Eclético"
 ep2_wedding_ewan.0011.a.host:0 "\"Eu escolhi os pratos principais pessoalmente, [char_1.GetFirstNameNoTooltip].\""
 ep2_wedding_ewan.0011.a:0 "\"Acho que estou do seu lado, [char_1.GetFirstNameNoTooltip].\""
 ep2_wedding_ewan.0011.b.host:0 "\"Sim [char_2.GetFirstNameNoTooltip], as coisas não estão exatamente como eu imaginei.\""
 ep2_wedding_ewan.0011.b:0 "\"[char_2.GetFirstNameNoTooltip] tem a ideia certa.\""
 ep2_wedding_ewan.0011.c.tt.failure:0 "O servidor desvia do seu pé"
 ep2_wedding_ewan.0011.c.tt.success:0 "Você tropeça em um servidor, derramando sopa em [intent_target.GetFirstNameNoTooltip]"
 ep2_wedding_ewan.0011.c:0 "[intent_target.GetFirstNameNoTooltip] está sentado tão perto das portas de serviço..."
 ep2_wedding_ewan.0011.d:0 "Assentir sem prestar atenção."
 ep2_wedding_ewan.0011.desc.intro.bad:0 "Por qualquer padrão razoável, a comida da noite é uma empolgante mistura de texturas, sabores e espetáculo, embora esta seja uma ocasião especialmente especial. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ sobre o banquete.\n\n"
 ep2_wedding_ewan.0011.desc.intro.good:0 "Visão, paladar, tato, olfato, até mesmo o som - nenhum sentido humano escapa à escala e grandiosidade da comida da noite, uma fabulosa mistura de arte e sabores. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ sobre o banquete.\n\n"
 ep2_wedding_ewan.0011.desc.intro.normal:0 "Apresentando iguarias exóticas, obras culinárias elaboradas e cores ricas com aromas ainda mais intensos, os chefs do banquete capricharam para o casamento. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ sobre o banquete.\n\n"
 ep2_wedding_ewan.0011.desc.midtro:0 "\n\n"
 ep2_wedding_ewan.0011.desc.t1.hate.ambitious:0 "$ep2_wedding_ewan.0011.desc.t1.hate.arrogant$"
 ep2_wedding_ewan.0011.desc.t1.hate.arrogant:0 "\"Bah, um banquete deveria quase falir o reino,\" resmunga [char_2.GetFirstNameNoTooltip], \"senão qual é o sentido?\""
 ep2_wedding_ewan.0011.desc.t1.hate.fickle:0 "$ep2_wedding_ewan.0011.desc.t1.hate.trusting$"
 ep2_wedding_ewan.0011.desc.t1.hate.gluttonous:0 "\"É só...\" resmunga [char_2.GetFirstNameNoTooltip], \"não é bem o que eu estava esperando, só isso.\""
 ep2_wedding_ewan.0011.desc.t1.hate.patient:0 "\"Não tenho certeza por que a progressão dos pratos está tão apressada,\" reclama [char_2.GetFirstNameNoTooltip], \"todo mundo demorou uma eternidade para chegar aqui, e agora estamos acelerando a refeição?\""
 ep2_wedding_ewan.0011.desc.t1.hate.trusting:0 "\"A variedade está um pouco escassa,\" lamenta-se [char_2.GetFirstNameNoTooltip], \"qual é o problema em ter mais variedade de pratos?\""
 ep2_wedding_ewan.0011.desc.t1.love.content:0 "$ep2_wedding_ewan.0011.desc.t1.love.humble$"
 ep2_wedding_ewan.0011.desc.t1.love.humble:0 "\"É importante se permitir um agrado de vez em quando,\" reflete [char_1.GetFirstNameNoTooltip], \"e é exatamente assim que eu gosto de fazer."
 ep2_wedding_ewan.0011.desc.t1.love.impatient:0 "\"Ah, refresco substancial na hora certa,\" exclama [char_1.GetFirstNameNoTooltip], \"maravilhoso! Não suporto milhares de pequenas porções.\""
 ep2_wedding_ewan.0011.desc.t1.love.paranoid:0 "\"Hmm, um bom nível,\" observa [char_1.GetFirstNameNoTooltip], virando um pedaço robusto, \"muita decoração fantasiosa é um convite para o veneno.\""
 ep2_wedding_ewan.0011.desc.t1.love.stubborn:0 "\"Outro prato do mesmo,\" ri [char_1.GetFirstNameNoTooltip], \"eu sei do que eu gosto e gosto do que eles estão servindo!\""
 ep2_wedding_ewan.0011.desc.t1.love.temperate:0 "\"Por [char_1.GetFaith.HealthGodName], a culinária é #EMP sublime#!\" entusiasma-se [char_1.GetFirstNameNoTooltip], \"tão variada quanto apropriado exige, sem excessos!\""
 ep2_wedding_ewan.0011.desc.t2.hate.ambitious:0 "\"Mediocridade,\" resmunga [char_2.GetFirstNameNoTooltip], \"é sinal de falta de ambição.\""
 ep2_wedding_ewan.0011.desc.t2.hate.arrogant:0 "$ep2_wedding_ewan.0011.desc.t2.hate.ambitious$"
 ep2_wedding_ewan.0011.desc.t2.hate.greedy:0 "\"A comida é boa,\" opina [char_2.GetFirstNameNoTooltip], \"mas não entendo gastar todo esse dinheiro nisso sem buscar algo #EMP fantástico#!.\""
 ep2_wedding_ewan.0011.desc.t2.hate.impatient:0 "$ep2_wedding_ewan.0011.desc.t2.hate.wrathful$"
 ep2_wedding_ewan.0011.desc.t2.hate.wrathful:0 "\"É bom\", [char_2.GetFirstNameNoTooltip] cospe, \"mas não é o suficiente para mim. Eu gosto de um banquete mais agitado do que isso.\""
 ep2_wedding_ewan.0011.desc.t2.hate.zealous:0 "\"Estou me divertindo,\" lamenta-se [char_2.GetFirstNameNoTooltip], \"só acho que as coisas poderiam ter ido um pouco mais longe para serem as #EMP melhores#!.\""
 ep2_wedding_ewan.0011.desc.t2.love.calm:0 "\"Um bom banquete, eu diria,\" gargalha [char_1.GetFirstNameNoTooltip], \"muito pensamento foi colocado para criar uma experiência sem perder de vista as coisas importantes.\""
 ep2_wedding_ewan.0011.desc.t2.love.compassionate:0 "$ep2_wedding_ewan.0011.desc.t2.love.content$"
 ep2_wedding_ewan.0011.desc.t2.love.content:0 "\"Ahhh, está tudo tão bonito,\" concorda [char_1.GetFirstNameNoTooltip], \"uma mistura perfeita de forma e sabor.\""
 ep2_wedding_ewan.0011.desc.t2.love.cynical:0 "\"A quantidade correta de esforço exibida aqui,\" observa [char_1.GetFirstNameNoTooltip] com ironia, \"suficiente para mostrar consideração, mas não o bastante para desperdiçar qualquer coisa.\""
 ep2_wedding_ewan.0011.desc.t2.love.generous:0 "\"#EMP Delicioso#!!\" ri [char_1.GetFirstNameNoTooltip], colocando algo arroxeado na boca, \"é bom ver algum dinheiro em exibição.\""
 ep2_wedding_ewan.0011.desc.t2.love.patient:0 "$ep2_wedding_ewan.0011.desc.t2.love.calm$"
 ep2_wedding_ewan.0011.desc.t3.hate.content:0 "$ep2_wedding_ewan.0011.desc.t3.hate.humble$"
 ep2_wedding_ewan.0011.desc.t3.hate.humble:0 "\"Nossa, certamente está agitado,\" reclama [char_2.GetFirstNameNoTooltip], \"eu mal tenho a chance de provar cada prato. Um ritmo mais lento não faria mal.\""
 ep2_wedding_ewan.0011.desc.t3.hate.impatient:0 "\"Bah!\" [char_2.GetFirstNameNoTooltip] pragueja fracamente, \"eu não suporto essas refeições interminavelmente longas seguindo e seguindo e seguindo...\""
 ep2_wedding_ewan.0011.desc.t3.hate.paranoid:0 "\"Banquetes desse porte são como uma floresta escura,\" [char_2.GetFirstNameNoTooltip] pondera, \"pode ser seguro, ou pode estar cheio de perigos esperando.\""
 ep2_wedding_ewan.0011.desc.t3.hate.stubborn:0 "\"Mãos longe!\" [char_2.GetFirstNameNoTooltip] rosna para um servidor, \"eu terminarei minha refeição quando estiver pronto! Muitos malditos pratos...\""
 ep2_wedding_ewan.0011.desc.t3.hate.temperate:0 "\"Não é tudo um tanto...\" [char_2.GetFirstNameNoTooltip] cheira, \"#EMP rico?#! Estilo sobre substância não é uma boa qualidade em uma refeição, eu acho.\""
 ep2_wedding_ewan.0011.desc.t3.love.ambitious:0 "$ep2_wedding_ewan.0011.desc.t3.love.arrogant$"
 ep2_wedding_ewan.0011.desc.t3.love.arrogant:0 "\"#EMP Mmmmm#!!\" geme [char_1.GetFirstNameNoTooltip], \"agora #EMP isso#! é como se faz um banquete!\""
 ep2_wedding_ewan.0011.desc.t3.love.fickle:0 "\"Oh, mais um desses! #EMP E#! aqueles!\" empolga-se [char_1.GetFirstNameNoTooltip], \"eu adoro um banquete onde você não precisa escolher apenas algumas delícias.\""
 ep2_wedding_ewan.0011.desc.t3.love.gluttonous:0 "\"Outro! #EMP MAIS UM!#!\" berra [char_1.GetFirstNameNoTooltip], enquanto se empanturra em vez de fazer comentários detalhados."
 ep2_wedding_ewan.0011.desc.t3.love.patient:0 "\"Mais um prato?\" vibra [char_1.GetFirstNameNoTooltip], \"pelo [char_1.GetFaith.HealthGodName], eles nunca acabam! É maravilhoso!\""
 ep2_wedding_ewan.0011.desc.t3.love.trusting:0 "\"Não sei por que algumas pessoas ficam nervosas em banquetes\", ri [char_1.GetFirstNameNoTooltip], \"o que você poderia temer ao redor de alimentos tão magníficos?\""
 ep2_wedding_ewan.0011.t:0 "Comida à altura de um..."
 ep2_wedding_ewan.0021.a.host:0 "\"Eu mesma escolhi muitas das decorações, [char_1.GetFirstNameNoTooltip].\""
 ep2_wedding_ewan.0021.a:0 "\"Bah, eu prefiro o pensamento positivo de [char_1.GetFirstNameNoTooltip].\""
 ep2_wedding_ewan.0021.b.host:0 "\"[char_2.GetFirstNameNoTooltip] está certo — não é exatamente o que eu tinha em mente.\""
 ep2_wedding_ewan.0021.b:0 "\"Receio que você tenha um bom ponto, [char_2.GetFirstNameNoTooltip].\""
 ep2_wedding_ewan.0021.c:0 "[intent_target.GetFirstNameNoTooltip] parece bem solitário..."
 ep2_wedding_ewan.0021.d:0 "Não se envolva."
 ep2_wedding_ewan.0021.desc.intro.bad:0 "Os enfeites do salão de banquetes são lindos, uma mistura de murais e flores raras — mesmo que não sejam estritamente as mais caras disponíveis. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ sobre as decorações.\n\n"
 ep2_wedding_ewan.0021.desc.intro.good:0 "Esculturas finas, tapeçarias exóticas, arranjos florais estranhos e mais enfeitam o salão de banquetes — um verdadeiro banquete para os olhos. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ sobre as decorações.\n\n"
 ep2_wedding_ewan.0021.desc.intro.normal:0 "O salão de banquetes está vestido em uma explosão de cores, aromas e visões — apenas os tecidos e flores mais raros estão ausentes do traje. $ep2_wedding_ewan.0000.desc.boilerplate.char_intro$ sobre as decorações.\n\n"
 ep2_wedding_ewan.0021.desc.midtro:0 "\n\n"
 ep2_wedding_ewan.0021.desc.t1.hate.ambitious:0 "\"Sinceramente, tenho que dizer que prefiro um...\" [char_2.GetFirstNameNoTooltip] procura a frase educada, \"#EMP toque mais pesado#! nas frivolidades.\""
 ep2_wedding_ewan.0021.desc.t1.hate.arrogant:0 "$ep2_wedding_ewan.0021.desc.t1.hate.ambitious$"
 ep2_wedding_ewan.0021.desc.t1.hate.diligent:0 "$ep2_wedding_ewan.0021.desc.t1.hate.ambitious$"
 ep2_wedding_ewan.0021.desc.t1.hate.generous:0 "$ep2_wedding_ewan.0021.desc.t1.hate.honest$"
 ep2_wedding_ewan.0021.desc.t1.hate.honest:0 "\"Para mim, parece que o evento foi superestimado,\" reclama [char_2.GetFirstNameNoTooltip], \"por que convidar tantas pessoas se isso é tudo que se pode pagar?\""
 ep2_wedding_ewan.0021.desc.t1.hate.just:0 "\"Suponho que esteja em um padrão bastante alto,\" resmunga [char_2.GetFirstNameNoTooltip], \"eu só esperava um pouco mais.\""
 ep2_wedding_ewan.0021.desc.t1.love.arbitrary:0 "\"Não me importo com o que você diz,\" diz [char_1.GetFirstNameNoTooltip], \"eu gosto. Foi feito um esforço, você está sendo esnobe.\""
 ep2_wedding_ewan.0021.desc.t1.love.compassionate:0 "$ep2_wedding_ewan.0021.desc.t1.love.forgiving$"
 ep2_wedding_ewan.0021.desc.t1.love.content:0 "\"Ahhhh, #EMP maravilhoso#!\" gargalha [char_1.GetFirstNameNoTooltip], \"o suficiente de adornos para torná-lo especial, mas não o bastante para ofuscar o casal feliz.\""
 ep2_wedding_ewan.0021.desc.t1.love.forgiving:0 "\"Talvez não seja o mais magnífico que poderia ser,\" concorda [char_1.GetFirstNameNoTooltip], \"mas ainda é um esforço louvável com muito coração.\""
 ep2_wedding_ewan.0021.desc.t1.love.greedy:0 "$ep2_wedding_ewan.0021.desc.t1.love.lazy$"
 ep2_wedding_ewan.0021.desc.t1.love.humble:0 "$ep2_wedding_ewan.0021.desc.t1.love.content$"
 ep2_wedding_ewan.0021.desc.t1.love.lazy:0 "\"Sabe,\" pondera [char_1.GetFirstNameNoTooltip], \"isso é #EMP exatamente#! o nível de esforço que eu teria colocado. Aprovo!\""
 ep2_wedding_ewan.0021.desc.t2.hate.ambitious:0 "\"Hrmph,\" [char_2.GetFirstNameNoTooltip] resmunga, \"é um desperdício de bom potencial. Há bastante para admirar aqui, por que não levar mais longe?\""
 ep2_wedding_ewan.0021.desc.t2.hate.arrogant:0 "$ep2_wedding_ewan.0021.desc.t2.hate.ambitious$"
 ep2_wedding_ewan.0021.desc.t2.hate.greedy:0 "\"Há muito gasto em exibição para respeitar,\" resmunga [char_2.GetFirstNameNoTooltip], \"não o suficiente para realmente aproveitar. Estou decepcionado.\""
 ep2_wedding_ewan.0021.desc.t2.hate.impatient:0 "$ep2_wedding_ewan.0021.desc.t2.hate.wrathful$"
 ep2_wedding_ewan.0021.desc.t2.hate.stubborn:0 "\"Cerimônias são importantes, e isso ainda faz parte da cerimônia\", resmunga [char_2.GetFirstNameNoTooltip], \"deveria ter sido maior, melhor, mais bonito, tudo isso.\""
 ep2_wedding_ewan.0021.desc.t2.hate.wrathful:0 "\"Até que gosto o suficiente,\" resmunga [char_2.GetFirstNameNoTooltip], \"mas gostaria muito mais se tivesse um pouco mais de tudo isso.\""
 ep2_wedding_ewan.0021.desc.t2.hate.zealous:0 "$ep2_wedding_ewan.0021.desc.t2.hate.stubborn$"
 ep2_wedding_ewan.0021.desc.t2.love.calm:0 "\"Por [char_1.GetFaith.WealthGodName], está tudo #EMP simplesmente#! perfeito,\" entusiasma-se [char_1.GetFirstNameNoTooltip], \"apenas a quantidade certa para ser elegante sem exagerar!\""
 ep2_wedding_ewan.0021.desc.t2.love.compassionate:0 "$ep2_wedding_ewan.0021.desc.t2.love.content$"
 ep2_wedding_ewan.0021.desc.t2.love.content:0 "\"Não sei como você não pode amar tudo isso,\" gargalha [char_1.GetFirstNameNoTooltip], \"olhe os comprimentos que foram tomados!\""
 ep2_wedding_ewan.0021.desc.t2.love.cynical:0 "\"Há adornos suficientes aqui para agradar a multidão sem ser um desperdício,\" observa [char_1.GetFirstNameNoTooltip] aprovação, \"é muito bem pensado.\""
 ep2_wedding_ewan.0021.desc.t2.love.fickle:0 "\"Talvez não seja uma seleção muito focada de frivolidades,\" reflete [char_1.GetFirstNameNoTooltip], \"mas eu #EMP gosto#! disso. A variedade é importante nessas ocasiões.\""
 ep2_wedding_ewan.0021.desc.t2.love.generous:0 "\"Foi investida uma boa quantidade de dinheiro aqui,\" observa [char_1.GetFirstNameNoTooltip], \"você vê aquele tapete? É de meio continente de distância.\""
 ep2_wedding_ewan.0021.desc.t2.love.patient:0 "$ep2_wedding_ewan.0021.desc.t2.love.calm$"
 ep2_wedding_ewan.0021.desc.t3.hate.arbitrary:0 "\"É realmente tão bonito assim?\" [char_2.GetFirstNameNoTooltip] resmunga, \"quanto tudo isso pode custar?\""
 ep2_wedding_ewan.0021.desc.t3.hate.compassionate:0 "\"Hmm, não tenho certeza,\" resmunga [char_2.GetFirstNameNoTooltip], \"não parece que tudo isso esteja distraindo um pouco da cerimônia?\""
 ep2_wedding_ewan.0021.desc.t3.hate.content:0 "\"Sinceramente, acho tudo isso um pouco cansativo,\" lamenta [char_2.GetFirstNameNoTooltip], \"eu nem sei o que é um assento e o que é uma escultura decorativa.\""
 ep2_wedding_ewan.0021.desc.t3.hate.humble:0 "$ep2_wedding_ewan.0021.desc.t3.hate.content$"
 ep2_wedding_ewan.0021.desc.t3.hate.lazy:0 "$ep2_wedding_ewan.0021.desc.t3.hate.content$"
 ep2_wedding_ewan.0021.desc.t3.love.ambitious:0 "\"Agora, #EMP isso#! é o que eu estava esperando!\" exclama [char_1.GetFirstNameNoTooltip], \"um local digno de um casamento realmente #EMP grandioso#!\""
 ep2_wedding_ewan.0021.desc.t3.love.arrogant:0 "$ep2_wedding_ewan.0021.desc.t3.love.ambitious$"
 ep2_wedding_ewan.0021.desc.t3.love.diligent:0 "$ep2_wedding_ewan.0021.desc.t3.love.ambitious$"
 ep2_wedding_ewan.0021.desc.t3.love.generous:0 "$ep2_wedding_ewan.0021.desc.t3.love.greedy$"
 ep2_wedding_ewan.0021.desc.t3.love.greedy:0 "\"Certamente não estão sendo econômicos aqui\" ri [char_1.GetFirstNameNoTooltip], \"bom, não posso dizer que tenho medo de aproveitar a hospitalidade.\""
 ep2_wedding_ewan.0021.desc.t3.love.honest:0 "\"Estou muito feliz em ver a quantidade correta de esforço em exibição,\" ri [char_1.GetFirstNameNoTooltip], \"não suporto quando um anfitrião faz algo tão importante pela metade.\""
 ep2_wedding_ewan.0021.desc.t3.love.just:0 "$ep2_wedding_ewan.0021.desc.t3.love.honest$"
 ep2_wedding_ewan.0021.t:0 "Brilhante, Resplandecente"
 ep2_wedding_ewan.0031.a:0 "\"[conversationalist_neighbour.GetFirstNameNoTooltip], que bom te ver!\""
 ep2_wedding_ewan.0031.b:0 "\"Ahh, [conversationalist_covassal.GetFirstNameNoTooltip], fico feliz que você veio...\""
 ep2_wedding_ewan.0031.c:0 "\"Sempre um prazer, [conversationalist_vassal.GetFirstNameNoTooltip].\""
 ep2_wedding_ewan.0031.d:0 "\"[conversationalist_liege.GetLadyLord|U] [conversationalist_liege.GetFirstNameNoTooltip], você nos honra!\""
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_backup:0 "[Select_CString( char_1.IsFemale, 'uma', 'um' )] notável [char_1.GetLadyLord],"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_covassal:0 "meu colega vassalo"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_liege:0 "meu senhor feudal imediato"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_neighbour:0 "meu governante vizinho"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_other_ruler:0 "um governante estrangeiro,"
 ep2_wedding_ewan.0031.desc.char_1.conversationalist_vassal:0 "meu vassalo jurado"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_backup:0 "[Select_CString( char_2.IsFemale, 'uma', 'um' )] [char_2.GetLadyLord] notável,"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_covassal:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_covassal$"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_liege:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_liege$"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_neighbour:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_neighbour$"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_other_ruler:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_other_ruler$"
 ep2_wedding_ewan.0031.desc.char_2.conversationalist_vassal:0 "$ep2_wedding_ewan.0031.desc.char_1.conversationalist_vassal$"
 ep2_wedding_ewan.0031.desc.intro:0 "Sempre há muitas pessoas para ver nessas ocasiões, novos rostos para conhecer, velhos conhecidos para reencontrar, tudo isso no meio da agitação de uma festa movimentada.\n\nApenas daqui onde estou sentado, consigo ver"
 ep2_wedding_ewan.0031.desc.midro:0 "[char_1.GetTitledFirstName], parecendo um pouco precisar de melhor companhia, e"
 ep2_wedding_ewan.0031.desc.outro:0 "[char_2.GetTitledFirstName], de bom humor e alegria.\n\nQualquer um deles seria interessante de conhecer um pouco melhor, e agora #EMP é#! o momento para aventuras sociais..."
 ep2_wedding_ewan.0031.e:0 "\"[conversationalist_other_ruler.GetFirstNameNoTooltip]. Inesperado te ver aqui.\""
 ep2_wedding_ewan.0031.f:0 "\"[conversationalist_backup.GetFirstNameNoTooltip], como você está?\""
 ep2_wedding_ewan.0031.g:0 "Tem uma festa acontecendo! Por que se limitar a uma conversa?"
 ep2_wedding_ewan.0031.h:0 "Eh, há outras pessoas com quem eu preferiria falar."
 ep2_wedding_ewan.0031.t:0 "Um Jantar Sociável"
 ep2_wedding_ewan.0041.a:0 "Elogie o casal feliz, como esperado."
 ep2_wedding_ewan.0041.b:0 "Elogie a festa."
 ep2_wedding_ewan.0041.c:0 "Ameace implicitamente [intent_target.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0041.d.tt.failure:0 "[intent_target.GetSheHe|U] está extremamente envergonhada."
 ep2_wedding_ewan.0041.d.tt.success:0 "[intent_target.GetFirstNameNoTooltip] aprecia as dicas."
 ep2_wedding_ewan.0041.d:0 "Direcione sutilmente o discurso para [intent_target.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0041.desc.diplomacy:0 "apenas tentar chamar a atenção com minhas habilidades retóricas?"
 ep2_wedding_ewan.0041.desc.intro:0 "Cada banquete de casamento é palco de um número francamente #EMP interminável#! de discursos. Alguns longos, outros curtos, alguns honestos, outros enganosos, agitando-se por todo o salão, pontuando cada prato do banquete em ondas.\n\nÀ medida que minha vez se aproxima, fico me perguntando — devo considerar o casal feliz ou"
 ep2_wedding_ewan.0041.desc.matchmaking:0 "dirigir algumas palavras gentis a [intent_target.GetFirstNameNoTooltip]?"
 ep2_wedding_ewan.0041.desc.mischief:0 "tentar agitar um pouco de empolgação?"
 ep2_wedding_ewan.0041.desc.murder:0 "me gabar um pouco de minha futura vítima, [intent_target.GetFirstNameNoTooltip]?"
 ep2_wedding_ewan.0041.desc.outro:0 "\n\nAfinal, é fácil para as duplas intenções se perderem para a maioria nesse mar de palavras..."
 ep2_wedding_ewan.0041.desc.recreation:0 "focar nas festividades?"
 ep2_wedding_ewan.0041.desc.seduce:0 "talvez apenas conquistar minha futura conquista, [intent_target.GetFirstNameNoTooltip]?"
 ep2_wedding_ewan.0041.e.tt.failure:0 "Um discurso adequado."
 ep2_wedding_ewan.0041.e.tt.success:0 "Um discurso excelente."
 ep2_wedding_ewan.0041.e:0 "Mostre suas habilidades oratórias."
 ep2_wedding_ewan.0041.f:0 "Enalteça as boas qualidades de [intent_target.GetFirstNamePossessiveNoTooltip]."
 ep2_wedding_ewan.0041.g.tt.failure:0 "Que mentiras obviamente sensacionalistas."
 ep2_wedding_ewan.0041.g.tt.success:0 "Isso... isso é verdade?"
 ep2_wedding_ewan.0041.g:0 "Dê indícios de algumas verdades talvez ilícitas."
 ep2_wedding_ewan.0041.h:0 "Sentar-se desconfortavelmente sem dizer nada."
 ep2_wedding_ewan.0041.i:0 "Diga algo doce, porém perfunctório."
 ep2_wedding_ewan.0041.t:0 "Discurso! Discurso!"
 ep2_wedding_ewan.0051.a.tt.failure:0 "Isso #EMP nunca#! acaba"
 ep2_wedding_ewan.0051.a.tt.success:0 "Você se desvencilha"
 ep2_wedding_ewan.0051.a:0 "Sair da conversa delicadamente."
 ep2_wedding_ewan.0051.b.custom.every_wrathful_guest:0 "Cada convidado [GetTrait('wrathful').GetName( reference )]"
 ep2_wedding_ewan.0051.b:0 "\"Por todos os habitantes do [ROOT.Char.GetFaith.random_NegativeAfterLife], você vai calar essa tagarelice?\""
 ep2_wedding_ewan.0051.business_venture.tt:0 "Seu empreendimento comercial provavelmente levará muitos anos para se concretizar"
 ep2_wedding_ewan.0051.c:0 "\"Cale a boca.\""
 ep2_wedding_ewan.0051.d.custom.every_lazy_guest:0 "Cada convidado [GetTrait('lazy').GetName( reference )]"
 ep2_wedding_ewan.0051.d:0 "Adormeça. Imediatamente."
 ep2_wedding_ewan.0051.desc.arbitrary:0 "profundamente confuso(a). As palavras [dolt.GetHerHim] claramente fazem sentido para #EMP [dolt.GetSheHe]#!, mas soam quase inteiramente desconectadas para mim? Já se passou meia hora tentando entender qual é o meu papel nessa conversa."
 ep2_wedding_ewan.0051.desc.arrogant:0 "completamente e lamentavelmente egocêntrico(a). Nossa conversa está repleta de hipocrisia, ideias mal formuladas e pura idiotice, mas o(a) [dolt.GetWomanMan] está totalmente convencido(a) de que é algum tipo de fascinante gênio social."
 ep2_wedding_ewan.0051.desc.athletic:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ ideia de um tipo novo de ginásio público, algo focado no treinamento de todos os tipos de aptidão ao longo do espectro do exercício."
 ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch:0 "tentando desesperadamente me convencer a investir algumas das minhas 'amplas riquezas como [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetLadyLord]-[ROOT.Char.GetTitleAsNameNoTooltip]' em sua"
 ep2_wedding_ewan.0051.desc.diligent:0 "absolutamente obcecado(a) com o cotidiano do trabalho. A [dolt.GetWomanMan] parece não ter a menor noção de como falar sobre qualquer coisa além das tarefas mais mundanas, ou sequer perceber que nem todos estão interessados em sua vida sombria e sem alegria."
 ep2_wedding_ewan.0051.desc.drunkard:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ aquisição do que aparentemente é um estabelecimento de bebidas rústico e #EMP encantador#!."
 ep2_wedding_ewan.0051.desc.fickle:0 "determinados a me apresentar esquemas e totalmente relutantes em se comprometer com uma única ideia. Em vez disso, é um desfile interminável de vomitórios verbais mal elaborados que aos poucos afogam minha vontade de viver."
 ep2_wedding_ewan.0051.desc.flagellant:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ plano para algum tipo de... #EMP campo#! de postes de chicoteamento, capaz de canalizar a dor purificadora comunitária de dezenas de penitentes."
 ep2_wedding_ewan.0051.desc.hashishiyah:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ aquisição de uma supostamente denegrida casa de bolos de haxixe."
 ep2_wedding_ewan.0051.desc.impatient:0 "não tem paciência para nenhum assunto. Assim que tento me engajar em um tópico, já estamos passando para o próximo, sem qualquer conexão entre eles. Apenas um eterno bombardeio de pensamentos desconexos, para sempre."
 ep2_wedding_ewan.0051.desc.intro:0 "Em todo banquete. Sempre tem um — todo, único, banquete. Um tagarela enfadonho, mal-nascido, cercando pessoas que simplesmente não vão #EMP ficar em silêncio#!.\n\nDesta vez é [dolt.GetFirstName], e [dolt.GetSheHe] está"
 ep2_wedding_ewan.0051.desc.journaller:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ fundação de um scriptorium que, aparentemente, consistirá principalmente nas obras #EMP [dolt.GetHerHim]#!, pelo menos inicialmente."
 ep2_wedding_ewan.0051.desc.outro:0 "\n\nVou gritar."
 ep2_wedding_ewan.0051.desc.patient:0 "implacável. Já tentei todos os tópicos que consigo pensar, já tentei me desligar, já tentei envolver outras pessoas, mas [dolt.GetSheHe] parece determinado(a) em me perseguir com uma implacabilidade sombria."
 ep2_wedding_ewan.0051.desc.poet:0 "aquilo que é mais odioso de tudo: um(a) poeta ruim com uma plateia cativa. Os versos que [dolt.GetSheHe] 'está experimentando' comigo nem mesmo são poemas, são apenas rimas fracas sem nenhum senso de ritmo ou métrica."
 ep2_wedding_ewan.0051.desc.profligate:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ esquema mal explicado para... Eu... Eu nem consigo entender para que [dolt.GetSheHe] quer o dinheiro."
 ep2_wedding_ewan.0051.desc.rakish:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ aquisição de um bordel com a equipe mais bela dos confins do mundo."
 ep2_wedding_ewan.0051.desc.reclusive:0 "$ep2_wedding_ewan.0051.desc.boilerplate.stress_pitch$ plano de financiar a criação de uma mansão de difícil acesso, capaz de proporcionar solidão até mesmo aos nobres mais famosos."
 ep2_wedding_ewan.0051.desc.vengeful:0 "totalmente obcecado(a) em trazer a suprema ira sobre algum pobre rival sem nome por alguma ofensa percebida. Por que diabos eu sou necessário(a) nessa trama enlouquecida, eu não faço ideia."
 ep2_wedding_ewan.0051.desc.zealous:0 "falando, e falando, e falando, e #EMP falando#! sobre a conexão pessoal [dolt.GetHerHim] com a fé e como eu deveria tentar deixar a verdadeira luz de [dolt.GetFaith.random_GoodGodNames] entrar em meu coração. [dolt.GetSheHe|U] não fez uma única pergunta sobre #EMP minhas#! crenças."
 ep2_wedding_ewan.0051.e:0 "\"Um #EMP pub#! você diz...\""
 ep2_wedding_ewan.0051.f:0 "\"Uma #EMP loja de bolos#! você diz...\""
 ep2_wedding_ewan.0051.g:0 "\"Um #EMP bordel#! você diz...\""
 ep2_wedding_ewan.0051.h:0 "\"Um #EMP retiro privado#! você diz...\""
 ep2_wedding_ewan.0051.i.tt.deviant:0 "Essa opção está disponível por causa do seu [secret|E] de [secret.GetName]"
 ep2_wedding_ewan.0051.i:0 "\"Um campo de postes de chicoteamento #EMP#! você diz...\""
 ep2_wedding_ewan.0051.j:0 "\"E não podemos perder dinheiro? De jeito nenhum?\""
 ep2_wedding_ewan.0051.k:0 "\"Um #EMP scriptorium#! você diz...\""
 ep2_wedding_ewan.0051.l:0 "\"Um #EMP ginásio#! você diz...\""
 ep2_wedding_ewan.0051.m.tt.failure:0 "Você é tato, mas nada mais"
 ep2_wedding_ewan.0051.m.tt.success:0 "Você consegue parecer genuinamente fascinado"
 ep2_wedding_ewan.0051.m:0 "\"Isso é... muito interessante...\""
 ep2_wedding_ewan.0051.n.tt:0 "Você ouve cada. Última. Palavra."
 ep2_wedding_ewan.0051.n:0 "Engula o sapo."
 ep2_wedding_ewan.0051.t:0 "E Mais Uma Coisa"
 ep2_wedding_ewan.0052.a:0 "Acho que vou recuperar #EMP tudo#! do meu investimento."
 ep2_wedding_ewan.0052.b:0 "Naturalmente, afinal, sou um gênio dos negócios."
 ep2_wedding_ewan.0052.c:0 "Uma surpresa agradável e inesperada!"
 ep2_wedding_ewan.0052.desc.athletic:0 "O ginásio se tornou extremamente popular entre nobres menores, cavaleiros errantes e #EMP viajantes#! ricos, procurando um ambiente para lutar e treinar sem precisar de sua própria propriedade."
 ep2_wedding_ewan.0052.desc.dolt_availability.dead:0 "ainda mais agora que [dolt.GetFirstNameNoTooltip] está morto(a) e foi embora."
 ep2_wedding_ewan.0052.desc.dolt_availability.free:0 "[dolt.GetFirstNameNoTooltip] nem mesmo tentou manter meu investimento além da quantia inicial, afinal de contas."
 ep2_wedding_ewan.0052.desc.dolt_availability.imprisoned:0 "especialmente porque [dolt.GetFirstNameNoTooltip] não está em condições de gerenciar muita coisa no momento."
 ep2_wedding_ewan.0052.desc.drunkard:0 "A pequena taverna se transformou em um estabelecimento próspero de bebidas."
 ep2_wedding_ewan.0052.desc.flagellant:0 "O campo de postes de chicoteamento agora é uma propriedade de dor purificadora e enriquecedora, com aparentemente um apelo surpreendentemente amplo."
 ep2_wedding_ewan.0052.desc.hashishiyah:0 "O local de consumo de haxixe se tornou uma casa próspera de preguiça."
 ep2_wedding_ewan.0052.desc.intro:0 "Há muitos anos, concordei em financiar um empreendimento comercial proposto por [dolt.GetFirstNameNoTooltip]. Para ser sincero(a), eu praticamente tinha esquecido do assunto —"
 ep2_wedding_ewan.0052.desc.journaller:0 "O scriptorium cresceu o suficiente para assumir comissões de patronos ricos regularmente."
 ep2_wedding_ewan.0052.desc.midtro:0 "\n\nContra todas as probabilidades, no entanto, uma carta chegou esta manhã proclamando o sucesso inesperado de nosso negócio."
 ep2_wedding_ewan.0052.desc.outro.dolt_unavailable:0 "\n\nApós obter um retorno saudável de nossa prata, o administrador responsável pela operação fielmente devolveu minha parte dos lucros."
 ep2_wedding_ewan.0052.desc.outro:0 "\n\nApós obter um retorno saudável de nossa prata, [dolt.GetFirstNameNoTooltip] fielmente devolveu minha parte dos lucros."
 ep2_wedding_ewan.0052.desc.profligate:0 "A carta #EMP ainda#! não explica qual é o nosso negócio exatamente #EMP, mas o importante é que parece ser lucrativo."
 ep2_wedding_ewan.0052.desc.rakish:0 "O pequeno bordel se transformou em um poço de prazer agitado."
 ep2_wedding_ewan.0052.desc.reclusive:0 "A mansão privada é, ironicamente, discretamente famosa — até os nobres mais notáveis parecem capazes de desaparecer lá por um tempo."
 ep2_wedding_ewan.0052.t:0 "Assuntos Inacabados: No Azul"
 ep2_wedding_ewan.0053.a.alive:0 "Grah, eu quero prender esse idiota!"
 ep2_wedding_ewan.0053.a.dead:0 "Pena que [dolt.GetSheHe] está morto demais para estrangular."
 ep2_wedding_ewan.0053.b:0 "Isso provavelmente era de se esperar."
 ep2_wedding_ewan.0053.desc.athletic:0 "Parece que a maioria daqueles que desejam treinar seus corpos também estão em busca de uma briga com outros que estão fazendo o mesmo. Após uma série de duelos que terminaram em assassinatos, o ginásio sucumbiu a um tumulto que destruiu o prédio."
 ep2_wedding_ewan.0053.desc.dolt_availability.dead:0 "$ep2_wedding_ewan.0052.desc.dolt_availability.dead$"
 ep2_wedding_ewan.0053.desc.dolt_availability.free:0 "$ep2_wedding_ewan.0052.desc.dolt_availability.free$"
 ep2_wedding_ewan.0053.desc.dolt_availability.imprisoned:0 "$ep2_wedding_ewan.0052.desc.dolt_availability.imprisoned$"
 ep2_wedding_ewan.0053.desc.drunkard:0 "Parece que a reputação ruim da taverna piorou, levando a uma clientela ruim e, eventualmente, algum morador local sem nome tomando providências por conta própria."
 ep2_wedding_ewan.0053.desc.flagellant:0 "O mercado esperado para aqueles que precisam de realização espiritual através da dor purificadora simplesmente nunca se materializou, e o campo de postes de chicoteamento se tornou lenha barata. Nunca há pecadores suficientes quando você precisa deles, nos dias de hoje."
 ep2_wedding_ewan.0053.desc.hashishiyah:0 "O local de consumo de haxixe não conseguiu atrair novos clientes e acabou sucumbindo às chamas quando alguém derrubou uma lanterna e não percebeu por vários minutos."
 ep2_wedding_ewan.0053.desc.intro:0 "$ep2_wedding_ewan.0052.desc.intro$"
 ep2_wedding_ewan.0053.desc.journaller:0 "Apesar do pagamento generoso oferecido, provou-se impossível encontrar copistas habilidosos e letrados dispostos a passar pelos diários coletados de [dolt.GetFirstNamePossessive]. O scriptorium nunca se concretizou completamente."
 ep2_wedding_ewan.0053.desc.midtro:0 "\n\nSurpreendentemente, uma carta anônima chegou esta manhã me informando sobre a destruição final de nosso empreendimento em um incêndio trágico."
 ep2_wedding_ewan.0053.desc.outro:0 "\n\nEu deveria saber que não deveria financiar um idiota tão maldito como [dolt.GetFirstNameNoTooltip]."
 ep2_wedding_ewan.0053.desc.profligate:0 "O que exatamente queimou, onde ou como é tão misterioso quanto a proposta inicial, apenas resta fumaça, cinzas e confusão."
 ep2_wedding_ewan.0053.desc.rakish:0 "O pequeno bordel foi bem por um tempo, até se tornar vítima do que só pode ser descrito como uma nova doença venérea horrivelmente virulenta. As chamas foram a única opção para purificá-lo."
 ep2_wedding_ewan.0053.desc.reclusive:0 "Após não conseguir atrair um interesse significativo, a localização exata da mansão privada foi, ironicamente, perdida. Apenas uma conflagração acidental por um grupo de bandidos locais realocou suas ruínas."
 ep2_wedding_ewan.0053.t:0 "Assuntos Inacabados: No Vermelho"
 ep2_wedding_ewan.0061.a:0 "\"Obrigado, [oldling.GetFirstNameNoTooltip], por esse discurso #EMP adorável#!..."
 ep2_wedding_ewan.0061.b.tt.failure:0 "[oldling.GetSheHe] continua mesmo assim."
 ep2_wedding_ewan.0061.b.tt.success:0 "Você faz [oldling.GetFirstNameNoTooltip] parar."
 ep2_wedding_ewan.0061.b:0 "Comece a aplaudir educadamente para interromper [oldling.GetSheHe]."
 ep2_wedding_ewan.0061.c:0 "Sorria e aguente."
 ep2_wedding_ewan.0061.d.tt.crit_success:0 "[oldling.GetFirstNameNoTooltip] começa uma história #EMP longa#!"
 ep2_wedding_ewan.0061.d.tt.success:0 "[oldling.GetFirstNameNoTooltip] se anima."
 ep2_wedding_ewan.0061.d:0 "Aplauda e torça por mais."
 ep2_wedding_ewan.0061.desc.ambitious:0 "Sempre marcado por sua determinação e ambição, o discurso de [oldling.GetFirstNamePossessiveNoTooltip] se certifica de dar a [oldling.GetHerselfHimself] crédito suficiente pela criação bem-sucedida que levou o [relative.Custom('GetBrideGroom')] até esse ponto, apesar de uma infância desconfortável (e aparentemente cheia de acne)."
 ep2_wedding_ewan.0061.desc.arrogant:0 "Um fanfarrão e fanfarrão conhecido, [oldling.GetFirstNameNoTooltip] começa a lançar-se em uma longa diatribe sobre o papel que [oldling.GetSheHe] desempenhou na criação do [relative.Custom('GetBrideGroom')], repleta de histórias constrangedoras da infância e piadas desconfortáveis."
 ep2_wedding_ewan.0061.desc.deceitful:0 "Algo como um fabulista nas melhores circunstâncias, o discurso de [oldling.GetFirstNamePossessiveNoTooltip] sobre a infância do [relative.Custom('GetBrideGroom')] é, moderadamente, escandalosamente impreciso. O episódio com o burro parece particularmente desnecessário."
 ep2_wedding_ewan.0061.desc.diplomat:0 "Conhecido por sua língua afiada, [oldling.GetFirstNameNoTooltip] aparentemente não consegue resistir à chance de contar a história da vida inicial do [relative.Custom('GetBrideGroom')], e das muitas lições que [oldling.GetSheHe] tentou ensinar a [relative.GetSheHe]. Geralmente sem sucesso, de acordo com [oldling.GetSheHe]."
 ep2_wedding_ewan.0061.desc.drunkard:0 "Cambaleando onde [oldling.GetSheHe] está, [oldling.GetFirstNameNoTooltip] começa a gaguejar sua lembrança embaçada da infância do [relative.Custom('GetBrideGroom')]. As impressões são um pouco demais, mas certamente dão vida à apresentação."
 ep2_wedding_ewan.0061.desc.gregarious:0 "Dado a festas em sua juventude, o discurso de [oldling.GetFirstNamePossessiveNoTooltip] é uma lista quase interminável de anedotas interconectadas e vagantes, sendo que apenas as mais constrangedoras têm relação com o [relative.Custom('GetBrideGroom')]."
 ep2_wedding_ewan.0061.desc.hashishiyah:0 "Por um momento constrangedor, [oldling.GetFirstNameNoTooltip] parece esquecer por que [oldling.GetSheHe] sequer se levantou, piscando com olhos avermelhados. Então, algo se encaixa, e um relato da infância do [relative.Custom('GetBrideGroom')] que é pelo menos metade gargalhadas começa."
 ep2_wedding_ewan.0061.desc.honest:0 "A maioria consideraria a reputação de honestidade de [oldling.GetFirstNamePossessiveNoTooltip] uma bênção, mas aqui ela prova... equivocada, com o bondoso e bem-intencionado [oldling.GetWomanMan] contando de forma saudosista as histórias mais embaraçosas da infância do [relative.Custom('GetBrideGroom')]."
 ep2_wedding_ewan.0061.desc.intro:0 "Apesar das festividades, uma expressão de puro horror absoluto rapidamente toma conta de [relative.GetTitledFirstName] quando [relative.GetSheHe] [relative.Custom2('RelationToMeShort', oldling )], [oldling.GetTitledFirstName], começa a se levantar trêmulo, com o cálice na mão.\n\n"
 ep2_wedding_ewan.0061.desc.old:0 "Não exatamente ágil para a idade [oldling.GetHerHim], o discurso de [oldling.GetFirstNamePossessiveNoTooltip] é um emaranhado de momentos mais humilhantemente adoráveis da infância do [relative.Custom('GetBrideGroom')] e de como as coisas costumavam ser #EMP melhores#! naquela época."
 ep2_wedding_ewan.0061.desc.outro:0 "\n\n[relative.GetFirstNameNoTooltip] parece que [relative.GetSheHe] quer morrer."
 ep2_wedding_ewan.0061.desc.poet:0 "Num destino pior que a morte para a audiência em geral, parece que [oldling.GetFirstNameNoTooltip] escreveu um longo poema empolado sobre os momentos mais... encantadoramente constrangedores da infância do [relative.Custom('GetBrideGroom')]."
 ep2_wedding_ewan.0061.desc.sadistic:0 "Com o que só pode ser pura malícia escrita [oldling.Custom('MaskFace_BehindAcross')] sua [oldling.Custom('MaskFace')], [oldling.GetFirstNameNoTooltip] mergulha em um relato #EMP extremamente#! detalhado da infância do [relative.Custom('GetBrideGroom')]. As anedotas pessoais são muitas e diretas."
 ep2_wedding_ewan.0061.desc.skill.diplomacy:0 "Sempre bom com as palavras, [oldling.GetFirstNameNoTooltip] claramente estava ansioso por isso: Seu discurso rapidamente se transforma em uma metáfora elaborada para a vida do [relative.Custom('GetBrideGroom')] que é, talvez, um pouco menos do que lisonjeiramente paternalista."
 ep2_wedding_ewan.0061.desc.skill.learning:0 "Uma [relative.GetWomanMan] instruída, o discurso de [oldling.GetFirstNamePossessiveNoTooltip] é uma confusão de referências literárias e piadas filosóficas refinadas, interrompidas ocasionalmente por anedotas constrangedoras da infância do [relative.Custom('GetBrideGroom')]."
 ep2_wedding_ewan.0061.desc.very_old:0 "Um [oldling.GetWomanMan] velho, velho, [oldling.GetFirstNameNoTooltip] tem uma #EMP legião#! absoluta de histórias sobre o [relative.Custom('GetBrideGroom')] para apresentar. E é basicamente isso que [oldling.GetSheHe] faz. Não há muita conexão, apenas uma torrente de memórias de infância e piadas familiares."
 ep2_wedding_ewan.0061.e.tt.crit_success:0 "$ep2_wedding_ewan.0061.d.tt.crit_success$"
 ep2_wedding_ewan.0061.e.tt.failure:0 "[oldling.GetFirstNameNoTooltip] continua falando por mais alguns minutos."
 ep2_wedding_ewan.0061.e.tt.success:0 "$ep2_wedding_ewan.0061.d.tt.success$"
 ep2_wedding_ewan.0061.e:0 "Incentive [oldling.GetFirstNameNoTooltip] a continuar."
 ep2_wedding_ewan.0061.f:0 "Pare de prestar atenção"
 ep2_wedding_ewan.0061.t:0 "Para o Meu Amado [oldling.Custom2('RelationToMeShort', relative )|U]!"
 ep2_wedding_ewan.0071.a:0 "Parece mais do que uma troca justa para mim!"
 ep2_wedding_ewan.0071.b:0 "Obrigado, mas não, obrigado."
 ep2_wedding_ewan.0071.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip],\" reflete meu senhor feudal [liege.GetTitledFirstName], \"Eu sempre gostei de você. Você se esforça para me agradar, e sua fama se espalha pelos [liege.GetPrimaryTitle.GetNameNoTier] como os galhos de uma árvore sombria\".\n\nEu assinto, presumindo que o [liege.GetWomanMan] esteja um pouco cativado pelas festividades enquanto [liege.GetSheHe] continua falando.\n\n\"Tenho uma proposta a fazer — você gosta de me agradar, e eu gosto de estar associado a você. O que você diria de espalhar uma boa palavra sobre mim para seus admiradores e, em troca, eu deixarei claro que você tem meu interesse especial?\""
 ep2_wedding_ewan.0071.t:0 "Juramento em Momento"
 ep2_wedding_ewan_0041_attraction_modifier:0 "Fala da Cidade"
 ep2_wedding_ewan_0041_attraction_modifier_desc:0 "As melhores qualidades deste personagem estão nos lábios de todos."
 ep2_wedding_ewan_0051_approachable_modifier:0 "Acessível"
 ep2_wedding_ewan_0051_approachable_modifier_desc:0 "Considerado um bastião de bom tato, este personagem sempre tem tempo para uma conversa. Não importa quão árido seja o assunto."
 ep2_wedding_ewan_0051_snooty_modifier:0 "Arrogante"
 ep2_wedding_ewan_0051_snooty_modifier_desc:0 "Este personagem é conhecido por não ter tempo para plebeus, bajuladores e tolos que agem acima de sua posição."
