 THEY_ARE_ACCUSED_IMPOTENCY:0 "Você denunciou [secondary_recipient.GetShortUIName] como impotente"
 came_to_my_wedding_opinion_host_high:0 "[host.GetTitledFirstNameNoTooltip] $wedding_opinion_high$"
 came_to_my_wedding_opinion_host_low:0 "[host.GetTitledFirstNameNoTooltip] $wedding_opinion_low$"
