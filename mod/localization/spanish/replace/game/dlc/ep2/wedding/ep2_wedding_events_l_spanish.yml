 ep2_grand_wedding_host_incentives_effect.tt:0 "Outros personagens estarão mais propensos a aceitar as propostas de casamento desse personagem nos próximos 20 anos."
 ep2_wedding.0001.a:0 "Não estava destinado a acontecer."
 ep2_wedding.0001.desc:0 "O tempo tem escapado de mim. Eu achava que ainda tinha tempo para organizar um(a) [GetActivityType('activity_wedding').GetName] adequado(a), mas uma carta furiosa de [spouse_2.GetTitledFirstName] me lembra que a paciência [spouse_2.GetHerHim] se esgotou e meu tempo acabou."
 ep2_wedding.0001.desc_betrothed:0 "\n\nPor não ter conseguido organizar o casamento entre [spouse_1.GetTitledFirstName] e [spouse_2.GetFirstNameNoTooltip] dentro do prazo acordado, o noivado agora é considerado nulo."
 ep2_wedding.0001.desc_conclusion:0 "\n\n[spouse_2.GetFirstNameNoTooltip] está compreensivelmente desapontado(a) e me lembra que haverá consequências..."
 ep2_wedding.0001.desc_self:0 "\n\nPor não ter conseguido organizar o casamento entre mim e [spouse_2.GetFirstNameNoTooltip] dentro do prazo acordado, o noivado agora é considerado nulo."
 ep2_wedding.0001.t:0 "[GetActivityType('activity_wedding').GetNameNoTooltip]: Noivado Expirado"
 ep2_wedding.0002.a:0 "Uma tragédia da vida."
 ep2_wedding.0002.desc:0 "Notícias trágicas chegaram até mim esta manhã: [dead_spouse.GetTitledFirstName], que estava prometido(a) a se casar com [alive_spouse.GetTitledFirstName] em um(a) [GetActivityType('activity_wedding').GetName], faleceu, e todo o meu planejamento cuidadoso foi em vão!\n\nHora de procurar um novo(a) pretendente."
 ep2_wedding.0002.t:0 "[GetActivityType('activity_wedding').GetNameNoTooltip]: Morte Prematura"
 ep2_wedding.0003.a:0 "Uma verdadeira tragédia..."
 ep2_wedding.0003.desc:0 "Nada poderia me preparar para a carta que estou segurando em minhas mãos trêmulas: meu(a) pretendente, [dead_spouse.GetTitledFirstName], com quem eu estava prometido(a) a me casar em um(a) [GetActivityType('activity_wedding').GetName], faleceu repentinamente.\n\nNão haverá comemorações para mim, e todo o planejamento cuidadoso da minha família agora foi em vão."
 ep2_wedding.0100.a:0 "Mal posso esperar!"
 ep2_wedding.0100.desc_guest:0 "Olho ao meu redor, chei[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de empolgação.\n\nPor toda parte que olho, vejo convidados se misturando, flores em cada superfície, serviçais atarefados com pratos carregados e um anfitrião muito orgulhoso, [host.GetTitledFirstName], verificando os últimos detalhes. Os cônjuges nervosos, [spouse_1.GetTitledFirstName] e [spouse_2.GetTitledFirstName], estão prontos.\n\nA cerimônia está prestes a começar!"
 ep2_wedding.0100.desc_host:0 "É sempre incrível quando você tem planejado algo por tanto tempo — e gastado tanto dinheiro nisso — e então finalmente está #EMP acontecendo#!!\n\nTudo está pronto: as decorações estão no lugar, os convidados estão se misturando e os serviçais correm com pratos carregados."
 ep2_wedding.0100.desc_host_outro:0 "Os cônjuges, [spouse_1.GetTitledFirstName] e [spouse_2.GetTitledFirstName], estão aqui, radiantes em seus melhores trajes.\n\nAo meu sinal, todos se posicionarão, e a cerimônia começará."
 ep2_wedding.0100.desc_host_spouse:0 "$ep2_wedding.0100.desc_host$ Estou andando de um lado para o outro, chei[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de empolgação e nervosismo, quando [Select_CString( my_spouse.IsFemale, 'minha futura', 'meu futuro' )] cônjuge, [my_spouse.GetTitledFirstName], aparece, radiante em seu melhor traje.\n\nEstamos prontos para começar."
 ep2_wedding.0100.desc_root_pregnant:0 "No entanto, enquanto me aproximo de meu cônjuge, não consigo deixar de perceber os olhares julgadores de todos os convidados apontando diretamente para minha barriga claramente grávida. Bem..."
 ep2_wedding.0100.desc_spouse:0 "Finalmente chegou o grande dia — o dia do meu casamento com [my_spouse.GetTitledFirstName]!\n\nEstou tanto empolgad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] quanto aterrorizad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o dia em si e o futuro que ele trará, mas não consigo deixar de ficar impressionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com o grandioso evento organizado pelo nosso gracioso anfitrião, [host.GetTitledFirstName].\n\nQuando o vejo gesticulando freneticamente para mim, eu sei. É hora de começar."
 ep2_wedding.0100.desc_spouse_pregnant:0 "No entanto, imediatamente fica claro que a atenção de todos — incluindo a minha — está fixada na barriga inequivocamente grávida da noiva... Isso será constrangedor."
 ep2_wedding.0100.t:0 "Início da Cerimônia de Casamento"
 ep2_wedding.0101.desc:0 "Todo o meu planejamento está prestes a se concretizar.\n\nMas, por enquanto, que a cerimônia comece!"
 ep2_wedding.0150.a:0 "Empolgante!"
 ep2_wedding.0150.desc:0 "A cerimônia finalmente atingiu seu clímax.\n\nOs rituais tradicionais foram concluídos, e tudo o que resta são os votos finais, o consentimento formal, o selo no casamento! Quando tanto [spouse_1.GetTitledFirstName] quanto [spouse_2.GetTitledFirstName] dizem \"Eu aceito,\" a multidão começa a aplaudir, e todos nós testemunhamos o início de suas vidas juntos."
 ep2_wedding.0150.t:0 "A Cerimônia de Casamento"
 ep2_wedding.0151.a:0 "Aceito."
 ep2_wedding.0151.b.tt:0 "Haverá consequências..."
 ep2_wedding.0151.b:0 "Não aceito!"
 ep2_wedding.0151.desc.murder:0 "Chegou a hora dos nossos votos. 'Eis meu juramento de que não tomarei ninguém como meu cônjuge, exceto você', murmuro. 'Para sempre.' Eu tranquilizo [spouse_2.GetSheHe], apertando sua mão.\n\nFelizmente, o resto de nossa vida juntos será #EMP incrivelmente#! curto."
 ep2_wedding.0151.desc:0 "A cerimônia passou como um borrão. Mal consigo lembrar de todos os passos, rituais e bênçãos pelos quais passei, e agora é hora dos nossos votos, do consentimento formal, do selo real no casamento.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_appearance:0 "A maior parte da cerimônia já se desenrolou.\n\nEnquanto estou cara a cara com [Select_CString( spouse_2.IsFemale, 'minha', 'meu' )] [spouse_2.Custom('GetBrideGroom')] para dar nosso consentimento formal ao casamento, tremo mais uma vez, tentando avaliar pela expressão [spouse_2.GetHerHim] se este corpo frágil causa repulsa a [spouse_2.GetSheHe] e se ficará no caminho de nossa felicidade. Então, chegou minha vez de falar.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_arrogant:0 "O dia mal começou e já estou cansad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] do incessante falatório das supostas autoridades religiosas, dos bem-intencionados, dos bajuladores e dos servos confusos. Não é surpresa que eu tenha estado fervendo de raiva durante a maior parte da cerimônia.\n\nQuando chega o momento de nosso consentimento formal ao casamento, minha paciência está se esgotando, e acabo respondendo com irritação.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_diplo:0 "Por trás de todos os rituais e cerimônias, os casamentos são, antes de tudo, eventos políticos. Conforme a cerimônia atinge seu clímax, minha mente já está focada no que está por vir. A aliança irá se manter? Meu(a) novo(a) cônjuge será uma ajuda válida na administração das minhas terras?\n\nE ainda há outra pergunta que devo responder antes disso, pois é hora de dar meu consentimento explícito ao casamento.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_end:0 "\n\nEu quero passar o resto da minha vida com [spouse_2.GetFirstName]?"
 ep2_wedding.0151.desc_paranoid:0 "Mal me lembro de qualquer coisa da cerimônia inteira, ocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] como estava procurando inimigos em cada sombra e imaginando cenários assustadores para o futuro na minha mente.\n\nAgora é hora de selar formalmente nossa união dando nosso consentimento, e não consigo deixar de me perguntar se estou acolhendo um(a) amigo(a) ou um(a) inimigo(a) mortal em minha casa.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_party:0 "Quando a cerimônia finalmente atinge seu clímax, e tanto eu quanto meu cônjuge somos solicitados a dar nosso consentimento formal, mal estou prestando atenção, pois estou animado(a) com a iminente celebração: montanhas de comida deliciosa, bebidas sem fim e muitos rostos felizes para compartilhar tudo isso — não consigo imaginar algo melhor! Mas, por enquanto, vamos acabar com as formalidades.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_religious:0 "Todos os passos de uma cerimônia são importantes. Afinal, a validade de qualquer ritual se baseia na reprodução correta de todas as suas partes.\n\nTenho prestado atenção em cada gesto, cada palavra, cada passo — não é todos os dias que se pode encenar seu #EMP casamento#!! Agora, o momento mais vital chegou, e devo dar meu consentimento à união.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_seducer:0 "Todas as cerimônias de casamento são iguais: um exercício em acumular palavras vazias e promessas sem sentido. Como se a felicidade e a satisfação pudessem ser encontradas em uma única pessoa!\n\nConforme a cerimônia atinge seu auge e sou solicitado(a) a dar meu consentimento formal à união e meus votos, zombo, pois a pergunta soa igualmente irônica e sem propósito.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0151.desc_shy:0 "Tudo é tão avassalador: as decorações, os convidados conversando, os rituais e bênçãos ocorrendo um após o outro, e os olhos penetrantes [Select_CString( spouse_2.IsFemale, 'da minha', 'do meu' )] [spouse_2.Custom('GetBrideGroom')] me encarando, julgando cada movimento meu.\n\nTudo se mistura em um turbilhão de caos que causa nervosismo, até que chega o momento de compartilhar nossas promessas oficiais — rápido demais.$ep2_wedding.0151.desc_end$"
 ep2_wedding.0152.a:0 "Não significa NÃO."
 ep2_wedding.0152.desc:0 "Minha recusa é recebida com suspiros surpresos da multidão e um silêncio cheio de incerteza.\n\nPosso ver o rosto de [spouse_2.GetFirstNamePossessive] passando lentamente do choque para a indignação, e de repente consigo ouvir a explosão de fofocas às minhas costas, mas não me importo. Simplesmente não posso aceitar casar-me com [spouse_2.GetFirstNameNoTooltip]!\n\nAceitarei qualquer consequência."
 ep2_wedding.0152.t:0 "Casamento Cancelado"
 ep2_wedding.0153.a:0 "Que confusão..."
 ep2_wedding.0153.desc:0 "Um grande murmúrio surge na multidão, pois [spouse_1.GetFirstName] recusa-se a casar! [spouse_2.GetFirstName] parece tão chocado quanto o resto de nós. Uma onda de fofocas e conflitos irrompe enquanto [spouse_1.GetFirstNameNoTooltip] se apressa em deixar este lugar maldito."
 ep2_wedding.0200.a:0 "Aproveitem!"
 ep2_wedding.0200.desc:0 "A parte formal do casamento — a cerimônia — finalmente ficou para trás.\n\nTodos estão sorrindo antecipando a refeição gigantesca, o entretenimento empolgante e a alegria geral que nos será oferecida.\n\nVamos aproveitar!"
 ep2_wedding.0200.desc_host:0 "Com todas as formalidades concluídas, agora é hora de celebrar!\n\nSinalizo para os servos trazerem a comida e as bebidas e conduzirem os convidados ao local do banquete.\n\nQue comece o banquete de casamento!"
 ep2_wedding.0200.desc_spouse_arrogant:0 "Com todas as chatas formalidades terminadas, todos nos dirigimos ao local do banquete.\n\nJá estou sentindo minha paciência se esgotando quando os servos começam a trazer um prato de cada vez, #EMP agonizantemente devagar#!, e [my_spouse.GetFirstName] olha para mim com preocupação.\n\nAntes que eu tenha mais tempo para me arrepender de toda essa provação, pego meu cálice e exclamo: 'Vamos começar essa festa!'"
 ep2_wedding.0200.desc_spouse_dislike:0 "A cerimônia terminou sem problemas, e agora estou casado(a) com o terrível [my_spouse.GetFirstName].\n\nEnquanto nos dirigimos ao local do banquete, vejo convidados felizes ao meu redor, ansiosos para participar das festividades. Quem dera eu pudesse compartilhar de sua alegria. Sento-me no meu lugar designado e envio uma oração por força a [ROOT.Char.GetFaith.HighGodName].\n\nE agora, que a farsa comece!"
 ep2_wedding.0200.desc_spouse_fallback:0 "A cerimônia formal acabou, e estou oficialmente casado(a) com [my_spouse.GetFirstName]. Vai levar um tempo para me acostumar com a ideia, e fico ociosamente me perguntando como será minha vida agora.\n\nNo entanto, minhas divagações são rapidamente interrompidas quando toda a festa de casamento começa a se dirigir ao local do banquete.\n\nHaverá tempo para ponderar o futuro. Por enquanto, vamos celebrar!"
 ep2_wedding.0200.desc_spouse_like:0 "À medida que a cerimônia termina e nos dirigimos ao local do banquete, sorrio secretamente, imaginando as alegrias vindouras da minha vida casada com [my_spouse.GetFirstName].\n\nNem todos têm a sorte de se casar com uma pessoa tão agradável!\n\nDesejo a todos que compartilhem minha felicidade, e vamos aproveitar!"
 ep2_wedding.0200.desc_spouse_party:0 "Parece que uma eternidade se passou desde o início da cerimônia, mas agora que estou finalmente livre, estou realmente ansioso(a) pela parte mais #EMP interessante#! do dia: o banquete!\n\n...É claro, também ganhei um(a) #EMP cônjuge#! de toda essa provação, mas terei tempo para pensar nisso quando a festa trouxer um sorriso adequado ao meu rosto.\n\nPor enquanto, vamos celebrar!"
 ep2_wedding.0200.desc_spouse_shy:0 "Se eu achava que a cerimônia já era estressante, nada poderia me preparar para o nervosismo que sinto imediatamente depois.\n\nO banquete aguarda, com sua enxurrada de bem-querentes, barulhos, artistas e a consciência de que estou oficialmente casado(a) e minha vida vai mudar drasticamente.\n\nPortanto, é com uma mão ligeiramente trêmula que alcanço meu cálice e o ergo em comemoração. Que as festividades comecem."
 ep2_wedding.0200.t:0 "Início do Banquete de Casamento"
 ep2_wedding.0300.a:0 "É hora!"
 ep2_wedding.0300.desc:0 "Vejo que todos os convidados estão satisfeitos e bastante cansados, mas o dia de celebração ainda não acabou.\n\nEu rapidamente organizo uma procissão festiva para levar os recém-casados até o quarto deles. Vamos deixar os recém-casados celebrarem #EMP privadamente#!. Para nós que permanecemos, vamos servir mais uma bebida!"
 ep2_wedding.0300.desc_guest:0 "Sinto como se tivesse comido, bebido, socializado, dançado e cantado por dias.\n\nLogo, as celebrações se acalmarão e os cônjuges se retirarão para seus aposentos privados para consumar o casamento. Para nós que permanecemos, porém, vamos servir mais uma bebida e brindar aos cônjuges!"
 ep2_wedding.0300.desc_spouse:0 "O banquete começou a diminuir, com todos saciados e cansados, mas o dia ainda não acabou para [other_spouse.GetFirstName] e para mim.\n\nUma procissão de convidados nos leva ao nosso quarto, pois a legitimidade de um casamento depende de sua consumação!"
 ep2_wedding.0300.t:0 "Início da Noite de Núpcias"
 ep2_wedding.0900.a:0 "Realmente uma tragédia..."
 ep2_wedding.0900.desc:0 "A notícia da morte repentina de [dead_spouse.GetTitledFirstNamePossessive] atinge a festa de casamento como um trovão em um dia ensolarado.\n\nOs cânticos se tornam silenciosos, os rostos sorridentes se transformam em lágrimas, as flores no chão estão espalhadas e pisoteadas por uma multidão em luto.\n\nÉ uma verdadeira tragédia que um dia de felicidade tenha se transformado em um dia de luto..."
 ep2_wedding.0900.t:0 "Casamento Anulado"
 ep2_wedding.0910.a:0 "Deixe-me sozinho(a) para lamentar..."
 ep2_wedding.0910.desc:0 "A notícia da morte repentina de [dead_spouse.GetTitledFirstNamePossessive] me atinge profundamente, inesperada e trágica como é no dia do nosso próprio casamento.\n\nNão estamos casados nem por um dia, e você já foi tirado de mim..."
 ep2_wedding.0915.a:0 "Eu deveria estar lá."
 ep2_wedding.0915.desc:0 "[previous_host.Custom2('MyCharacterIntroduction', ROOT.Char)] estava hospedando um [GetActivityType('activity_wedding').GetName] na época da sua morte. Uma atividade deliciosa para a qual não fui convidado(a).\n\nAgora que [previous_host.GetSheHe] se foi, a festa está em desordem e todos foram mandados para casa, decepcionados."
 ep2_wedding.0920.a:0 "Isso é tão triste..."
 ep2_wedding.0920.desc:0 "Eu estava realmente ansioso(a) para o meu casamento com [free_spouse.GetTitledFirstName], mas parece que [ROOT.Char.GetFaith.HouseholdGodName] tinha outros planos para mim — ou para [free_spouse.GetFirstNameNoTooltip].\n\nEmbora o noivado permaneça, a promessa de um Grande Casamento agora é nula e inválida."
 ep2_wedding.0921.a:0 "Tão decepcionante."
 ep2_wedding.0921.desc:0 "A notícia do aprisionamento de [prisoner_spouse.GetTitledFirstNamePossessive] interrompe todas as celebrações. Parece que [ROOT.Char.GetFaith.HouseholdGodName] tinha outros planos para [prisoner_spouse.GetSheHe].\n\nEmbora o noivado permaneça, a promessa de um Grande Casamento agora é nula e inválida."
 ep2_wedding.0950.a:0 "Obrigado(a) a todos por virem!"
 ep2_wedding.0950.desc:0 "Quando — #EMP finalmente#! — o último convidado se vai, olho ao redor do local abandonado, as sobras de comida, a [ROOT.Char.Custom('RegionalDrink')] derramada no chão, os ecos do riso das pessoas ainda pairando no ar, e me sinto satisfeito(a).\n\nQue dia incrível! Fiz um ótimo trabalho ao organizá-lo."
 ep2_wedding.0950.t:0 "A Conclusão"
 ep2_wedding.0960.desc:0 "O sol desponta em um novo dia — o primeiro da minha vida com [other_spouse.GetFirstName].\n\nÉ hora de deixar para trás as celebrações e festividades, por mais deliciosas que tenham sido, e seguir em frente para a nossa nova normalidade."
 ep2_wedding.0970.a:0 "Parabéns novamente!"
 ep2_wedding.0970.desc:0 "Um a um, todos os convidados estão partindo, e é hora de eu partir também.\n\nO casamento foi uma grande ocasião para me socializar com meus pares e relaxar, e deixo o local cansado(a) e satisfeito(a), enviando meus melhores desejos aos cônjuges por uma união próspera e feliz."
 ep2_wedding.0997.desc_generic:0 "\n\nDe qualquer forma, está claro que [missing_spouse.GetFirstNameNoTooltip] fugiu porque [missing_spouse.GetSheHe] prefere viver sua vida como um vagabundo do que estar casado com [other_spouse.GetFirstName]."
 ep2_wedding.0997.desc_intro:0 "A espera por [missing_spouse.GetFirstName] está se tornando muito longa, e agora está claro que [missing_spouse.GetSheHe] desapareceu pelo caminho.\n\nEm breve, as pessoas começam a fofocar. Os boatos de uma cidade não muito distante dizem que [missing_spouse.GetSheHe] foi visto pela última vez em um mercado suspeito comprando ervas, enquanto outros juram que viram [missing_spouse.GetSheHe] embarcar em um navio para uma terra distante."
 ep2_wedding.0997.desc_spouse:0 "\n\nDe qualquer forma, está claro que [missing_spouse.GetFirstNameNoTooltip] fugiu porque [missing_spouse.GetSheHe] prefere viver sua vida como um(a) vagabundo(a) a estar casado(a) comigo."
 ep2_wedding.0998.a:0 "Que pena."
 ep2_wedding.0998.desc:0 "Sempre é um dia triste quando todas as esperanças que acompanham um novo casamento vão por água abaixo, e todo o trabalho árduo de organizar um grande evento é desperdiçado.\n\nInfelizmente, este casamento simplesmente não estava destinado a acontecer.\n\nEnquanto os serviçais começam a limpar, os convidados vão embora em grupos confusos e desapontados para voltarem às suas respectivas casas."
 ep2_wedding.0999.a:0 "Que pena..."
 ep2_wedding.0999.desc:0 "As notícias recentes interromperam as celebrações e deixaram todos surpresos e confusos.\n\nAparentemente, a posição e as posses do anfitrião não permitem que o casamento continue, e sem um anfitrião forte para conduzi-lo, só podemos voltar para casa, desapontados."
 ep2_wedding.0999.t:0 "$ep2_wedding.0900.t$"
 ep2_wedding.1000.a.failure.tt:0 "Você não convenceu [1000_relative.GetFirstNameNoTooltip]"
 ep2_wedding.1000.a.failure:0 "[1000_relative.GetFirstNameNoTooltip] não está satisfeito(a)"
 ep2_wedding.1000.a.success.tt:0 "Você convenceu [1000_relative.GetFirstNameNoTooltip]"
 ep2_wedding.1000.a.success:0 "[1000_relative.GetFirstNameNoTooltip] está satisfeito(a)"
 ep2_wedding.1000.a:0 "Tenho certeza de que podemos encontrar um meio-termo..."
 ep2_wedding.1000.b:0 "Eu não vejo você pagando por nada, então cale a boca."
 ep2_wedding.1000.c:0 "Vai ficar tudo bem #EMP, relaxe!"
 ep2_wedding.1000.desc:0 "Como se organizar um casamento digno da posição social da minha família já não fosse estressante o suficiente, eu também tenho que lidar com os parentes de [spouse_2.GetFirstNamePossessive].\n\nSeu(a) [spouse_2.Custom2('RelationToMe', SCOPE.sC('1000_relative'))], [1000_relative.GetTitledFirstName], chegou cedo hoje e tem me seguido por todos os lados, reclamando sem parar. À medida que uma dor de cabeça terrível começa a surgir atrás dos meus olhos, [1000_relative.GetSheHe] continua falando incessantemente."
 ep2_wedding.1000.desc_dec:0 "\n\n\"Que cor é essa das flores?! Elas vão combinar #EMP terrivelmente#! com a pele de [spouse_2.GetFirstNamePossessiveNoTooltip]! E por que você escolheu uma decoração tão #EMP sem gosto#! para as mesas! E nem me faça começar com esses tecidos #EMP berrantes#!!\""
 ep2_wedding.1000.desc_dec_low:0 "\n\n\"Eu #EMP sabia#! que você não seria uma boa combinação para minha querida [spouse_2.GetFirstNameNoTooltip]! Olhe para este lugar, as pobres flores, as mesas vazias e nem um único toque de ouro em qualquer lugar! Meu pobre coração #EMP sangra#! pela vida miserável que aguarda essa criança infeliz!\""
 ep2_wedding.1000.desc_entertainment:0 "\n\n\"São mímicos? Para onde esses servos estão indo com essas fogueiras acesas? E por que essa caixa de madeira está #EMP rugindo#!? Isso vai ser um desastre!\""
 ep2_wedding.1000.desc_fallback:0 "\n\n\"Essas flores vão fazer [spouse_2.GetFirstNameNoTooltip] espirrar! E essa lã é muito áspera! E a combinação de cores? Eu sei que [spouse_2.GetFirstNameNoTooltip] não vai gostar!\""
 ep2_wedding.1000.desc_servants:0 "\n\n\"Você tem certeza de que tem servos suficientes para isso? Você não está esperando que eu carregue a [ROOT.Char.Custom('GetExpensiveMeal')], está?! Dizem que no casamento do meu bisavô os servos eram tantos que seus chapéus ocultavam o sol!\""
 ep2_wedding.1000.t:0 "Diferenças Artísticas"
 ep2_wedding.1010.a.failure.tt:0 "[1010_target.GetFirstNameNoTooltip] não ficou impressionado"
 ep2_wedding.1010.a.failure:0 "Seus jardins não impressionam [1010_target.GetFirstNameNoTooltip]"
 ep2_wedding.1010.a.success.tt:0 "[1010_target.GetFirstNameNoTooltip] ficou impressionado"
 ep2_wedding.1010.a.success:0 "[1010_target.GetFirstNameNoTooltip] gosta dos seus jardins"
 ep2_wedding.1010.a:0 "Deixe-me mostrar-lhe os jardins!"
 ep2_wedding.1010.b.failure:0 "O local causa uma impressão pouco impressionante em [1010_target.GetFirstNameNoTooltip]"
 ep2_wedding.1010.b.success:0 "[1010_target.GetFirstNameNoTooltip] está maravilhado com o local do casamento"
 ep2_wedding.1010.b:0 "Você gostaria de ver os preparativos do local?"
 ep2_wedding.1010.c:0 "Espero que você aproveite a cerimônia!"
 ep2_wedding.1010.desc:0 "Fico feliz por ter avisado meus servos com antecedência para ficarem de olho na chegada de [1010_target.GetTitledFirstNamePossessive], porque, em meio aos preparativos do casamento, eu teria perdido isso caso contrário.\n\nEm vez disso, estou orgulhosamente parado no meio do pátio, vestindo minhas roupas mais elegantes e cercado por uma guarda de honra, quando [1010_target.GetFirstNameNoTooltip] faz sua entrada."
 ep2_wedding.1010.diplo:0 "\n\n\"Estou extremamente satisfeito em recebê-lo, [1010_target.GetTitledFirstNameNoTooltip]! Tenho certeza de que você encontrará minha hospitalidade muito agradável e ficará impressionado com todas as maravilhas que meu reino tem a oferecer!\""
 ep2_wedding.1010.match:0 "\n\n\"[1010_target.GetTitledFirstNameNoTooltip], seja bem-vindo! [1010_match.GetFirstName], venha cumprimentar também! — #EMP Você precisa causar uma boa impressão com [1010_target.GetSheHe] e a família dela, entendeu?!\" acrescento num sussurro furioso."
 ep2_wedding.1010.seduce:0 "\n\n\"Minha querida [1010_target.GetTitledFirstNameNoTooltip]! Você finalmente está aqui! Nenhuma celebração seria tão agradável para mim como quando posso me banhar em sua radiante presença!\""
 ep2_wedding.1010.t:0 "Uma Receção Magnífica"
 ep2_wedding.1020.a:0 "Será você a pessoa que eu estava esperando?"
 ep2_wedding.1020.desc:0 "\"Casamentos são apenas política.\" Eu me preparo enquanto espero [Select_CString( spouse_2.IsFemale, 'minha futura', 'meu futuro' )] [spouse_2.Custom('WifeHusband')] se juntar a mim.\n\n\"Apenas política.\" Eu repito para mim mesma. \"O quão ruim pode ser?\"\n\nMas nada me preparou para o momento em que finalmente vejo [spouse_2.GetFirstName] pela primeira vez. Nenhum retrato ou descrição poderia fazer justiça ao olhar gentil em seu rosto. Nenhum poeta jamais cantou uma beleza como a sua. O tempo parece parar quando nossos olhos se encontram, e todos os outros parecem desaparecer.\n\nEntão [spouse_2.GetSheHe] sorri para mim, e eu sei. Tudo ficará bem."
 ep2_wedding.1020.t:0 "Será Você?"
 ep2_wedding.1030.a:0 "Que sinal auspicioso!"
 ep2_wedding.1030.b:0 "Isso não significa #EMP NADA#!."
 ep2_wedding.1030.c:0 "Um sinal tão nefasto! Estamos CONDENADOS!"
 ep2_wedding.1030.d:0 "Maravilhoso! Um casamento adequado para dinastia [ROOT.Char.dynasty.GetName]!"
 ep2_wedding.1030.desc:0 "Os convidados estão reunidos, a cerimônia está prestes a começar e tudo parece em ordem, quando algo fora do comum acontece bem diante dos meus olhos.\n\n"
 ep2_wedding.1030.desc_bad1:0 "Um servo, enquanto caminhava para a cozinha, tropeça e derrama todo um saleiro no chão!"
 ep2_wedding.1030.desc_bad2:0 "O amuleto da sorte que [spouse_2.GetTitledFirstName] estava usando ao redor do pescoço se solta e cai no chão, sendo descuidadamente pisoteado por servos apressados!"
 ep2_wedding.1030.desc_bad3:0 "Nuvens de tempestade se reúnem, aparentemente do nada, e se concentram exatamente sobre o local. Um céu ensolarado rapidamente se transforma em sombrio e ameaçador, lançando uma sombra sinistra sobre a cerimônia prestes a começar."
 ep2_wedding.1030.desc_bad:0 "\"Isso foi... muito ruim, não foi?\""
 ep2_wedding.1030.desc_good1:0 "Um pato selvagem aparentemente perdido está se aproximando dos convidados, caminhando resolutamente em direção a [spouse_2.GetTitledFirstName], que ainda não percebeu. Ao alcançar [spouse_2.GetSheHe], o pato solta um #EMP QUAAACK!!#! ensurdecedor, vira-se e vai embora, para espanto de [spouse_2.GetFirstNameNoTooltip] e divertimento da multidão."
 ep2_wedding.1030.desc_good2:0 "[spouse_2.GetTitledFirstName|U], em seu caminho para [Select_CString( ROOT.Char.IsFemale, 'a futura', 'o futuro' )] [ROOT.Char.GetWifeHusband] [spouse_2.GetHerHim], tropeça e se desequilibra, quase caindo! Quando um servo preocupado se aproxima, [spouse_2.GetSheHe] apenas sorri e pega o culpado: um ferro de cavalo!"
 ep2_wedding.1030.desc_good3:0 "Um bando de pássaros à nossa esquerda levanta voo abruptamente quando [spouse_2.GetTitledFirstName] aparece e voa diretamente sobre a cabeça [spouse_2.GetHerHim] para a direita!"
 ep2_wedding.1030.desc_good:0 "\"Isso foi... surpreendente, não foi?\""
 ep2_wedding.1030.desc_outro:0 "\n\n[1030_chatter.GetTitledFirstName], que viu toda a cena como eu, chama minha atenção e comenta:"
 ep2_wedding.1030.t:0 "Um Presságio [ROOT.Char.Custom('GoodBad')|U]"
 ep2_wedding.1040.a:0 "Eu realmente gosto da companhia de [new_friend.GetFirstNamePossessiveNoTooltip]!"
 ep2_wedding.1040.b:0 "Não é necessário nos aproximarmos ainda mais, no entanto."
 ep2_wedding.1040.desc:0 "Durante a refeição, me vejo facilmente envolvido(a) na conversa de [new_friend.GetTitledFirstNamePossessive].\n\n[new_friend.GetSheHe|U] tem opiniões muito interessantes, faz as melhores piadas e parece que temos tanto em comum! Sempre que estou contando uma anedota, [new_friend.GetSheHe] ouve atentamente e faz os comentários apropriados no momento certo.\n\nQuem diria que eu encontraria uma companhia tão agradável neste casamento?"
 ep2_wedding.1040.t:0 "Uma Alma Afim"
 ep2_wedding.1050.a.failure.tt:0 "Você também se queimou!"
 ep2_wedding.1050.a.failure:0 "Você também se queima"
 ep2_wedding.1050.a.success.tt:0 "Você salvou [1050_victim.GetFirstNameNoTooltip]!"
 ep2_wedding.1050.a.success:0 "Você salva [1050_victim.GetFirstNameNoTooltip] das chamas"
 ep2_wedding.1050.a:0 "Eu preciso fazer algo!"
 ep2_wedding.1050.b.1.tt:0 "[1050_victim.GetFirstNameNoTooltip|U] é salvo(a)!"
 ep2_wedding.1050.b.1:0 "Os serviçais apagam as chamas"
 ep2_wedding.1050.b.2.tt:0 "[1050_victim.GetFirstNameNoTooltip|U] continua queimando!"
 ep2_wedding.1050.b.2:0 "[1050_victim.GetFirstNameNoTooltip|U] continua queimando"
 ep2_wedding.1050.b:0 "ÁGUA! Tragam água!!"
 ep2_wedding.1050.c:0 "Queime! QUEIME! #EMP QUEIIIMMMMAAA!!#!"
 ep2_wedding.1050.d.tt.2:0 "Você empurrou [other_victim.GetShortUIName] para o fogo!"
 ep2_wedding.1050.d.tt:0 "Você pode empurrar alguém para o fogo na pressa"
 ep2_wedding.1050.d:0 "CADA UM POR SI!!"
 ep2_wedding.1050.desc:0 "Todos estão de bom humor; à minha esquerda, um grupo de crianças está hipnotizado pelos malabaristas; à minha direita, poetas declamam suas últimas composições para uma plateia adoradora.\n\nNo entanto, todo o banquete fica em silêncio quando um grupo de dançarinos carregando tochas se aproxima do centro do local, convidando os convidados a se juntarem a eles pelo caminho. A vista é impressionante sob as luzes baixas do início da noite: as tochas iluminam seus rostos sorridentes contra o céu escurecendo e lançam padrões entrelaçados em suas sombras.\n\nTudo parece incrível até que [1050_victim.GetTitledFirstName] tropeça, derruba uma tocha da mão de um vizinho e coloca fogo em suas próprias roupas..."
 ep2_wedding.1050.t:0 "Uma Dança Ardente"
 ep2_wedding.1060.a.tt:0 "Certifique-se de que [spouse_2.GetFirstNameNoTooltip] não tenha mais desculpas"
 ep2_wedding.1060.a:0 "#EMP Tudo bem#!."
 ep2_wedding.1060.b:0 "Eu entendo. Não se preocupe."
 ep2_wedding.1060.desc:0 "É com um suspiro pesado que deixo todas as festividades para trás e fecho a porta da nossa câmara nupcial. Foi um longo dia, mas um casamento precisa ser consumado, certo?\n\nNão pude deixar de notar que [spouse_2.GetTitledFirstName] tem ficado cada vez mais inquieto com o passar da noite, mas não dei muita importância. Quem não fica um pouco nervoso no dia do casamento? No entanto, quando me aproximo de suas roupas íntimas, fico surpreso(a) ao constatar que ele está muito menos animado do que eu esperava.\n\nEle quase salta da pele e exclama 'É este quarto! A cama! Ou essa mesa de cabeceira! Talvez o tapeçaria? Minha virilidade foi amaldiçoada!!'"
 ep2_wedding.1060.t:0 "Essa Maldita Mesa"
 ep2_wedding.1061.a:0 "Isso é mais como!"
 ep2_wedding.1061.b:0 "#EMP SAIA! Você é mais vil do que uma minhoca!#!"
 ep2_wedding.1061.c:0 "Deixa pra lá. Não há pressa."
 ep2_wedding.1061.desc:0 "Servos têm entrado e saído da minha câmara nupcial nas últimas horas, removendo freneticamente todos os móveis e decorações. Agora, apenas uma mesa vazia permanece, solitária no centro do quarto.\n\nEnquanto me sento nela tão desprovido(a) quanto a mesa, esperando pelo meu recém-casado marido, [spouse_2.GetTitledFirstName], não consigo deixar de pensar, com um sorriso vingativo, que ele não terá mais desculpas agora."
 ep2_wedding.1061.desc_1:0 "\n\nQuando ele entra no quarto, a expressão de surpresa em seu rosto rapidamente se transforma em excitação."
 ep2_wedding.1061.desc_2:0 "\n\n[spouse_2.GetFirstNameNoTooltip] entra no quarto, atrasado, com os olhos baixos e já inquieto. Pelo modo como ele evita meu olhar inquisitivo, obtenho todas as respostas de que preciso."
 ep2_wedding.1065.a.tt:0 "Os lábios de [spouse_2.GetShortUINamePossessive] se curvam sarcasticamente, mas [spouse_2.GetSheHe] não diz nada ao sair do quarto."
 ep2_wedding.1065.a:0 "#EMP Devo ter sido amaldiçoado(a)!!#!"
 ep2_wedding.1065.b1:0 "[spouse_2.GetFirstNameNoTooltip] é paciente"
 ep2_wedding.1065.b2:0 "[spouse_2.GetFirstNameNoTooltip] denunciou suas dificuldades"
 ep2_wedding.1065.b:0 "Estou apenas nervoso(a)..."
 ep2_wedding.1065.desc:0 "Finalmente, deixando a multidão animada do lado de fora, [spouse_2.GetTitledFirstName] e eu estamos sozinhos em nossa câmara nupcial, enfim. Foi um longo dia, mas um casamento precisa ser consumado, certo?\n\nInfelizmente, não demora muito para que [spouse_2.GetFirstNameNoTooltip] descubra que algumas partes de mim não estão tão animadas quanto outras, e nenhuma quantidade de persuasão, suborno ou ameaça parece fazer muita diferença.\n\n\"Estou tentando aqui!\" exclamo. Isso é #EMP tão constrangedor#!"
 ep2_wedding.1066.a:0 "Tudo está bem quando termina bem!"
 ep2_wedding.1066.b:0 "Eu não estou fazendo isso #EMP de propósito#!, eu juro!"
 ep2_wedding.1066.b_1:0 "[spouse_2.GetFirstNameNoTooltip] fica ofendido(a)."
 ep2_wedding.1066.b_2:0 "[spouse_2.GetFirstNameNoTooltip] é paciente e compreensivo(a)."
 ep2_wedding.1066.desc:0 "[spouse_2.GetTitledFirstName|U] voltou à nossa câmara nupcial alguns minutos depois, seguido por vários servos confusos que prontamente começaram a remover todos os móveis e decorações do quarto. Todas as minhas perguntas foram respondidas com um silêncio obstinado. Quando eles finalmente saem, apenas uma mesa vazia permanece. Uma mesa vazia com um(a) #EMP igualmente desprovido(a)!# [spouse_2.GetFirstNameNoTooltip] em cima.\n\n\"Não vejo mais itens #EMP amaldiçoados#!, o que você diz?\" [spouse_2.GetSheHe|U] sorri sugestivamente."
 ep2_wedding.1066.desc_1:0 "\n\nTodos os pensamentos deixam minha mente."
 ep2_wedding.1066.desc_2:0 "\n\n\"#EMP Oh.#!\" Começo a gaguejar e a ganhar tempo. \"Veja... Não é que- O que quero dizer é...\" Mas a expressão gelada [spouse_2.GetHerHim] me paralisa no lugar."
 ep2_wedding.1070.a:0 "Realmente um espetáculo magnífico."
 ep2_wedding.1070.b.failure:0 "A fera revida"
 ep2_wedding.1070.b.success:0 "Você acalma a fera"
 ep2_wedding.1070.b.tt.success:0 "Você acalmou a fera"
 ep2_wedding.1070.b:0 "Eu vou cuidar disso!"
 ep2_wedding.1070.c.failure:0 "[m_hunt.GetFirstNameNoTooltip] se machuca e precisa abater a fera"
 ep2_wedding.1070.c.success:0 "[m_hunt.GetFirstNameNoTooltip] tem a situação sob controle"
 ep2_wedding.1070.c.tt.failure:0 "[m_hunt.GetFirstNameNoTooltip] matou a fera"
 ep2_wedding.1070.c.tt.success:0 "[m_hunt.GetFirstNameNoTooltip] acalmou a fera"
 ep2_wedding.1070.c:0 "[m_hunt.GetFirstNameNoTooltip]! Faça #EMP algo#!!!"
 ep2_wedding.1070.d.tt:0 "Você corre e se esconde"
 ep2_wedding.1070.d:0 "#EMP Saiam da minha frente!#!"
 ep2_wedding.1070.desc_bad:0 "A fera está inquieta, e observo com um sentimento sinistro enquanto a jaula range e geme a cada movimento. Então, com um terrível #EMP estalo#!, uma barra crucial se rompe, e o caos se instaura."
 ep2_wedding.1070.desc_bad_target:0 "\n\n[1070_target.GetTitledFirstName] é rapidamente cercado(a)."
 ep2_wedding.1070.desc_good:0 "A fera está um pouco inquieta, mas as barras são fortes, e todos apreciam o espetáculo de uma posição segura."
 ep2_wedding.1070.desc_guest:0 "Estou me divertindo muito no banquete de casamento. Em particular, [host.GetTitledFirstName] não poupou despesas com o entretenimento! Os melhores músicos estão tocando para nós, enquanto atores e malabaristas praticam sua arte, e trovadores declamam versos refinados. Fico bastante surpreso(a), então, quando [host.GetFirstNameNoTooltip] faz um gesto para que algo mais seja trazido."
 ep2_wedding.1070.desc_host:0 "Olho ao redor com um sorriso satisfeito. A atmosfera no banquete está descontraída, e os convidados conversam entre si agradavelmente, aproveitando a música e o entretenimento, sem saber que a melhor parte que planejamos para impressioná-los ainda está por vir. Faço um gesto para que meus serviçais prossigam."
 ep2_wedding.1070.desc_mid:0 "\n\nQuatro serviçais retornam rapidamente, arrastando atrás deles uma jaula contendo um(a) [host.Custom('GetAnimalTypeCaptive')] majestoso, a mais fina que já vi."
 ep2_wedding.1070.e.failure:0 "A fera não aprecia seu tom"
 ep2_wedding.1070.e.success:0 "A fera salta e dança ao seu chamado"
 ep2_wedding.1070.e.tt.failure:0 "A fera te ataca"
 ep2_wedding.1070.e.tt.failure_1:0 "Você está humilhado(a)"
 ep2_wedding.1070.e.tt.success:0 "Você domou a fera"
 ep2_wedding.1070.e.tt:0 "Você tenta domar a fera"
 ep2_wedding.1070.e:0 "Você quer ver algo #EMP realmente#! incrível?"
 ep2_wedding.1070.f:0 "GUARDAS!! Onde estão os guardas?!"
 ep2_wedding.1070.g.failure:0 "Você falha em salvar [1070_target.GetFirstNameNoTooltip]"
 ep2_wedding.1070.g.success:0 "Você salva [1070_target.GetFirstNameNoTooltip]"
 ep2_wedding.1070.g.tt.failure:0 "Você falhou em salvar [1070_target.GetFirstNameNoTooltip]"
 ep2_wedding.1070.g.tt.success:0 "Você salvou [1070_target.GetFirstNameNoTooltip]"
 ep2_wedding.1070.g:0 "Fiquem atrás de mim, [1070_target.GetFirstNameNoTooltip]!"
 ep2_wedding.1070.h.kill:0 "[1070_target.GetFirstNameNoTooltip|U] é morto(a) pela fera"
 ep2_wedding.1070.h.survive:0 "[1070_target.GetFirstNameNoTooltip|U] subjuga a fera"
 ep2_wedding.1070.h.tt.kill:0 "[1070_target.GetFirstNameNoTooltip|U] morreu"
 ep2_wedding.1070.h.tt.survive:0 "[1070_target.GetFirstNameNoTooltip|U] sobreviveu"
 ep2_wedding.1070.h:0 "Seria uma #EMP tragédia#! se [1070_target.GetFirstNameNoTooltip] fosse morto(a)..."
 ep2_wedding.1070.log.f:0 "Os guardas de [CHARACTER.GetUINamePossessive|U] tiveram que abater uma fera fora de controle"
 ep2_wedding.1070.log.f_title:0 "$wedding_beasts_guards_log_title$"
 ep2_wedding.1070.t:0 "Um Espetáculo Exótico"
 ep2_wedding.1080.a.failure.tt:0 "Não é uma combinação"
 ep2_wedding.1080.a.failure:0 "[1080_target.GetFirstNameNoTooltip] não consegue impressionar [matchmaking_1.GetFirstNameNoTooltip]"
 ep2_wedding.1080.a.success.tt:0 "É uma boa combinação!"
 ep2_wedding.1080.a.success:0 "[1080_target.GetFirstNameNoTooltip] impressiona [matchmaking_1.GetFirstNameNoTooltip]"
 ep2_wedding.1080.a:0 "[1080_target.GetFirstNameNoTooltip], vá falar com [matchmaking_1.GetFirstNameNoTooltip]!"
 ep2_wedding.1080.b.failure:0 "[1080_target.GetFirstNameNoTooltip] não consegue impressionar [matchmaking_2.GetFirstNameNoTooltip]"
 ep2_wedding.1080.b.success:0 "[1080_target.GetFirstNameNoTooltip] impressiona [matchmaking_2.GetFirstNameNoTooltip]"
 ep2_wedding.1080.b:0 "[1080_target.GetFirstNameNoTooltip], o que você acha de [matchmaking_2.GetFirstNameNoTooltip]?"
 ep2_wedding.1080.c.tt:0 "Devem haver candidatos melhores por perto."
 ep2_wedding.1080.c:0 "Não importa. Vamos continuar procurando."
 ep2_wedding.1080.desc:0 "Os preparativos para o casamento ainda estão a todo vapor, mas meu objetivo já está mais adiante: encontrar um par para [Select_CString( 1080_target.IsFemale, 'a minha', 'o meu' )] [ROOT.Char.Custom2('RelationToMe', 1080_target)], [1080_target.GetFirstName]!\n\nFelizmente, [1080_target.GetSheHe] já está no local, o que é um bom começo, e está parado(a) de forma desajeitada. Agora, é preciso encontrar alguém adequado... Minha atenção é atraída por um grupo de convidados conversando, entre os quais [matchmaking_1.GetTitledFirstName] se destaca pela beleza e postura. #EMP Perfeito!#!"
 ep2_wedding.1080.desc_2:0 "\n\nEstou prestes a enviar [1080_target.GetFirstNameNoTooltip] quando também noto [matchmaking_2.GetTitledFirstName]. Será [matchmaking_2.GetSheHe], talvez, uma combinação ainda melhor?"
 ep2_wedding.1080.t:0 "Um Par Adequado"
 ep2_wedding.1090.a.failure:0 "[1090_match.GetFirstNameNoTooltip] não fica impressionado(a) com [1090_target.GetFirstNameNoTooltip]"
 ep2_wedding.1090.a.success:0 "[1090_target.GetFirstNameNoTooltip] pede a mão de [1090_match.GetFirstNameNoTooltip] em casamento"
 ep2_wedding.1090.a:0 "Vá atrás [1090_match.GetHerHim]."
 ep2_wedding.1090.b:0 "[1090_match.GetSheHe|U] não é bom(a) para você."
 ep2_wedding.1090.desc:0 "A multidão está aplaudindo e brindando aos recém-casados, mas, entre eles, parece que perdi de vista minha [ROOT.Char.Custom2('RelationToMe', 1090_target)], [1090_target.GetFirstName]."
 ep2_wedding.1090.desc_already_matched:0 "\n\nDepois de uma busca cuidadosa, finalmente encontro [1090_target.GetSheHe] em um local isolado, em uma conversa profunda com ninguém menos que [1090_match.GetTitledFirstName], a mesma pessoa que tentei arrumar um encontro para [1090_target.GetSheHe] anteriormente! Acho que não devo interferir..."
 ep2_wedding.1090.desc_new_match:0 "\n\nDepois de uma busca cuidadosa, finalmente encontro [1090_target.GetSheHe] sentado(a) em um canto, olhando com interesse e, ousaria dizer, anseio para [1090_match.GetTitledFirstName], que está entretendo um grupo de convidados agitados com suas piadas e histórias."
 ep2_wedding.1090.t:0 "Uma Combinação Perfeita...?"
 ep2_wedding.1100.a:0 "As tradições devem ser seguidas."
 ep2_wedding.1100.b:0 "Por que não brincamos também?"
 ep2_wedding.1100.c:0 "Tradições bobas..."
 ep2_wedding.1100.d:0 "Banho é tão #EMP relaxante#!..."
 ep2_wedding.1100.desc_bride:0 "O dia do meu casamento está próximo e meus parentes têm se reunido no local há dias, então não fico surpresa quando meu(a) [ROOT.Char.Custom2('RelationToMe', guest_1)], [guest_1.GetTitledFirstName], e meu(a) [ROOT.Char.Custom2('RelationToMe', guest_2)], [guest_2.GetTitledFirstName], me levam para um banho isolado, não muito longe de [ROOT.Char.GetCurrentActivity.GetLocation.GetName].\n\n\"Conforme as tradições antigas do nosso povo,\" começa [guest_1.GetFirstNameNoTooltip], \"você deve se despir de suas roupas antigas e #EMP kransen#! — a coroa virginal\".\n\n\"Nós vamos lavar você completamente, e você renascerá como uma noiva bela!\" conclui [guest_2.GetFirstNameNoTooltip] solenemente."
 ep2_wedding.1100.desc_extra_guest:0 "\n\n\"Nós vamos deixar você tão #EMP bonita#!\" [guest_3.GetTitledFirstName|U] exclama empolgado(a)."
 ep2_wedding.1100.desc_relative:0 "O dia do casamento da minha [ROOT.Char.Custom2('RelationToMe', bride)] [bride.GetTitledFirstNamePossessive] está próximo e a família está no [ROOT.Char.GetCurrentActivity.GetLocation.GetName] há dias. Hoje, estamos levando a noiva para um banho isolado para sua purificação tradicional.\n\n\"Hoje\", começo, \"você se despede de suas roupas antigas e #EMP kransen#! — a coroa virginal. Uma vez limpa e purificada, você surgirá como uma verdadeira noiva!\"\n\nAo meu lado, meu(a) [ROOT.Char.Custom2('RelationToMe', guest_2)] [guest_2.GetTitledFirstName] comemora animadamente."
 ep2_wedding.1100.t:0 "Um Banho Ritual"
 ep2_wedding.1110.a:0 "Algumas pessoas realmente não têm vergonha."
 ep2_wedding.1110.b.tt:0 "Seus guardas acompanharão [1110_drunk.GetSheHe] até a porta"
 ep2_wedding.1110.b:0 "Isso é o bastante!"
 ep2_wedding.1110.c:0 "Se você não pode vencê-los, junte-se a eles!"
 ep2_wedding.1110.desc:0 "\n\n#EMP A maioria#! dos convidados, mas não [1110_drunk.GetTitledFirstName]. [1110_drunk.GetSheHe|U] tem gritado alto, pedindo uma taça atrás da outra, rindo mais alto e se recusando firmemente a ser levado(a) para um lugar mais tranquilo pelos serviçais."
 ep2_wedding.1110.desc_host:0 "\n\nEu realmente deveria fazer algo em relação a [1110_drunk.GetSheHe]..."
 ep2_wedding.1110.desc_intro:0 "Após os cônjuges partirem para suas câmaras privadas, as celebrações arrastam-se pela noite, perdendo aos poucos a intensidade e a agitação. Um após o outro, a maioria dos convidados ou vai embora, adormece ou se retira para desfrutar dos prazeres da noite."
 ep2_wedding.1110.t:0 "Mais uma taça"
 ep2_wedding.1111.a:0 "Desculpe, vou me controlar..."
 ep2_wedding.1111.b.1.tt:0 "[1111_other.GetFirstNameNoTooltip|U] juntou-se a você"
 ep2_wedding.1111.b.1:0 "[1111_other.GetFirstNameNoTooltip|U] junte-se a você"
 ep2_wedding.1111.b.2.tt:0 "[1111_other.GetFirstNameNoTooltip|U] te expulsou"
 ep2_wedding.1111.b.2:0 "[1111_other.GetFirstNameNoTooltip|U] te expulsou"
 ep2_wedding.1111.b.3.tt:0 "[1111_other.GetFirstNameNoTooltip|U] te desaprova"
 ep2_wedding.1111.b.3:0 "[1111_other.GetFirstNameNoTooltip|U] desaprova silenciosamente"
 ep2_wedding.1111.b:0 "Pare de resmungar e junte-se a mim!"
 ep2_wedding.1111.desc:0 "#EMP A maioria#! dos convidados, mas não eu!\n\n\"Traga-me mais uma taça! E outra mais!\" Grito para qualquer servo que vejo."
 ep2_wedding.1111.desc_conclusion:0 "\n\nDa mesa [1111_other.GetHerHim], no entanto, posso sentir o olhar julgador de [1111_other.GetTitledFirstNamePossessive] em mim. \"Você já bebeu o suficiente hoje?\" [1111_other.GetSheHe|U] pergunta friamente."
 ep2_wedding.1111.desc_host:0 "Afinal, eu paguei por tudo, não mereço?"
 ep2_wedding.1120.a:0 "Pare com essa bobagem. #EMP Agora.#!"
 ep2_wedding.1120.b:0 "Eu sei, querido, é difícil para todos nós..."
 ep2_wedding.1120.c:0 "#EMP [Select_CString( other_parent.IsFemale, 'Sua', 'Seu' )] [other_parent.GetMotherFather] deveria ser um segredo!#!"
 ep2_wedding.1120.desc:0 "As cerimônias de casamento são sempre longas, bastante entediantes e geralmente sem acontecimentos, exceto quando uma comoção começa em algum lugar atrás de mim."
 ep2_wedding.1120.desc_adult:0 "\n\n\"Eu tenho algo a dizer!\" A voz familiar de [trouble_child.GetFirstNamePossessive] ressoa na multidão. \"Isso é o melhor que você poderia substituir [Select_CString( other_parent.IsFemale, 'minha', 'meu' )] [other_parent.GetMotherFather], [other_parent.GetTitledFirstName], por?!\""
 ep2_wedding.1120.desc_child:0 "\n\nEu reconheço imediatamente o som familiar da melhor voz de reclamação de [trouble_child.GetFirstNamePossessive], enquanto [trouble_child.GetSheHe] abre caminho pela multidão. \"[ROOT.Char.GetMotherFather|U], isso deveria ser [Select_CString( other_parent.IsFemale, 'minha nova', 'meu novo' )] [other_parent.GetMotherFather], em vez de [other_parent.GetFirstName]?\""
 ep2_wedding.1120.desc_parent:0 "\n\nNo canto do meu olho, vejo [other_parent.GetFirstNameNoTooltip] congelando de surpresa."
 ep2_wedding.1120.t:0 "Nova Família"
 ep2_wedding.1121.a:0 "Cale a boca, #EMP pestinha#!"
 ep2_wedding.1121.b:0 "Eu serei um melhor pai/mãe!"
 ep2_wedding.1121.desc_adult:0 "\n\n\"Eu tenho algo a dizer!\" A voz de [trouble_child.GetTitledFirstName], a [trouble_child.Custom('GetDaughterSon')] de [other_spouse.GetFirstNamePossessive], ecoa na multidão. \"Isso é o melhor que você poderia substituir [Select_CString( other_parent.IsFemale, 'minha', 'meu' )] [other_parent.GetMotherFather], [other_parent.GetTitledFirstName], por?!\""
 ep2_wedding.1121.desc_child:0 "\n\nNo centro disso tudo, está [trouble_child.GetTitledFirstName], a [trouble_child.Custom('GetDaughterSon')] de [other_spouse.GetFirstNamePossessive], soluçando e lamentando. \"[other_spouse.GetMotherFather|U], por que você está substituindo [Select_CString( other_parent.IsFemale, 'minha', 'meu' )] [other_parent.GetMotherFather], [other_parent.GetFirstName]?\""
 ep2_wedding.1122.a:0 "Eu te perdoo."
 ep2_wedding.1122.b:0 "Foi realmente desnecessário."
 ep2_wedding.1122.c:0 "Devo respeitar sua decepção."
 ep2_wedding.1122.d:0 "Isso é ultrajante!"
 ep2_wedding.1122.desc_repentant:0 "Estou desfrutando de uma generosa porção de [ROOT.Char.Custom('GetExpensiveMeal')], sem preocupações no mundo, quando uma [trouble_child.GetFirstName] de aparência muito contrita me aborda.\n\n\"[ROOT.Char.GetMotherFather|U], gostaria de pedir desculpas por causar um tumulto durante a cerimônia. Isso não condiz com minha educação e posição, e lamento profundamente.\""
 ep2_wedding.1122.desc_unrepentant:0 "Estou tentando desfrutar de uma generosa porção de [ROOT.Char.Custom('GetExpensiveMeal')], mas as palavras abrasivas de [trouble_child.GetFirstNamePossessive] e a revelação descuidada do meu segredo continuam voltando à minha mente.\n\nQuando finalmente me aproximo [trouble_child.GetHerHim], [trouble_child.GetFirstNameNoTooltip] parece totalmente indiferente e impenitente. \"Defendo o que disse e não lamento #EMP nada#!. Foi apenas a verdade.\" [trouble_child.GetSheHe] responde com um sorriso debochado."
 ep2_wedding.1130.a:0 "Não vou negar as evidências."
 ep2_wedding.1130.b:0 "Guardas, removam este #EMP difamador#! da minha vista."
 ep2_wedding.1130.desc:0 "A cerimônia está em pleno andamento, mas não consigo me concentrar no que está acontecendo #EMP na frente#! de mim, porque posso ouvir um zumbido constante vindo de #EMP atrás#! de mim. Se eu me concentrar o suficiente, consigo pegar algumas partes do que parece ser uma grande sessão de fofocas envolvendo tanto convidados quanto servos. #EMP\"Você ouviu-\" \"Será verdade?\" \"Mas e-\" \"-não sabia??\"#!\n\n"
 ep2_wedding.1130.desc_continue:0 "Enquanto me viro com raiva para perguntar, pego o olhar convencido de [1130_knows.GetTitledFirstName], que parece estar no centro de toda a confusão. \"Você não tem nada para compartilhar, [ROOT.Char.Custom('FormOfAddressForLiege')]?"
 ep2_wedding.1130.t:0 "Sussurros Secretos"
 ep2_wedding.1131.a:0 "Não há mais segredos entre nós, [other_spouse.GetFirstNameNoTooltip]."
 ep2_wedding.1131.b:0 "Isso é #EMP ultrajante#!"
 ep2_wedding.1131.desc:0 "No centro da confusão está [1130_knows.GetTitledFirstName], sorrindo convencido. \"Será que [other_spouse.GetFirstName] nunca te contou? #EMP Todo mundo#! sabe!"
 ep2_wedding.1132.a:0 "[other_spouse.GetFirstNameNoTooltip] merece algo melhor do que isso!"
 ep2_wedding.1132.b:0 "São apenas #EMP rumores bobos#!, não é, [spouse_with_secret.GetFirstNameNoTooltip]?"
 ep2_wedding.1132.desc:0 "A cerimônia está em pleno andamento, mas não estou prestando muita atenção, pois minha mente está constantemente voltando para a informação perturbadora que eu sei sobre [spouse_with_secret.GetTitledFirstName]. Será que [other_spouse.GetTitledFirstName] sabe? [other_spouse.GetSheHe] não deveria saber?\n\nCompartilho casualmente algumas das minhas preocupações com o vizinho ao meu lado, e antes que eu perceba, a multidão inteira está agitada com fofocas, e tanto [spouse_with_secret.GetFirstNameNoTooltip] quanto [other_spouse.GetFirstNameNoTooltip] estão olhando com raiva para o centro da confusão: eu."
 ep2_wedding.1140.a.failure.tt:0 "Você se envergonhou"
 ep2_wedding.1140.a.failure:0 "Você só se envergonha"
 ep2_wedding.1140.a.success.tt2:0 "[intent_target.GetFirstNameNoTooltip] fica impressionado(a) com sua recuperação habilidosa."
 ep2_wedding.1140.a.success.tt:0 "Você amenizou a situação"
 ep2_wedding.1140.a.success:0 "Você ameniza a situação"
 ep2_wedding.1140.a:0 "Ainda posso resolver a situação..."
 ep2_wedding.1140.b:0 "Vamos seguir em frente."
 ep2_wedding.1140.c:0 "Isso acontece!"
 ep2_wedding.1140.desc:0 "Estou aproveitando a cerimônia, orgulhoso do que consegui organizar. Tudo correu bem até agora - e assim que penso nisso, sei que estraguei tudo."
 ep2_wedding.1140.desc_1:0 "\n\n[fumbling_spouse.GetTitledFirstName] tropeça e cai de cara no chão a caminho do seu cônjuge!"
 ep2_wedding.1140.desc_2:0 "\n\n[fumbling_spouse.GetTitledFirstName] começa a gaguejar durante os votos, pronunciando incorretamente o nome do seu cônjuge!"
 ep2_wedding.1140.desc_3:0 "\n\n[fumbling_spouse.GetTitledFirstName] congela de confusão, claramente esquecendo qual é o próximo passo da cerimônia!"
 ep2_wedding.1140.desc_target:0 "\n\nSinto os olhos de [intent_target.GetTitledFirstNamePossessive] me perfurando na multidão, me instigando a intervir."
 ep2_wedding.1140.desc_target_spouse:0 "\n\nEncontro os olhos aflitos de [intent_target.GetTitledFirstNamePossessive] do outro lado do salão, implorando para que eu faça algo."
 ep2_wedding.1140.t:0 "Um Deslize"
 ep2_wedding.1150.a.failure.tt:0 "Você incomodou [intent_target.GetFirstNameNoTooltip]"
 ep2_wedding.1150.a.failure:0 "[intent_target.GetFirstNameNoTooltip] está irritado(a)"
 ep2_wedding.1150.a.success.tt:0 "Você causou uma boa impressão em [intent_target.GetFirstNameNoTooltip]"
 ep2_wedding.1150.a.success:0 "[intent_target.GetFirstNameNoTooltip] está interessado(a)"
 ep2_wedding.1150.a:0 "Essas circunstâncias pedem um pouco de #poesia EMP#!"
 ep2_wedding.1150.b:0 "Você sabe do que os casamentos me deixam no #humorEMP#!?"
 ep2_wedding.1150.c:0 "Você poderia me contar mais sobre isso?"
 ep2_wedding.1150.desc:0 "As cerimônias de casamento costumam ser longas e tediosas, e meus olhos estão constantemente procurando na multidão de convidados o alvo dos meus desejos: [intent_target.GetTitledFirstName]."
 ep2_wedding.1150.desc_1:0 "\n\nQuando finalmente encontro [intent_target.GetSheHe], [intent_target.GetSheHe] está um pouco afastado(a) da multidão, cheirando algumas flores da decoração do local com um sorriso encantado no rosto."
 ep2_wedding.1150.desc_2:0 "\n\nQuando finalmente encontro [intent_target.GetSheHe], [intent_target.GetSheHe] está observando os serviçais se apressando com bandejas cheias e barris de [host.Custom('RegionalDrink')] com total atenção."
 ep2_wedding.1150.desc_3:0 "\n\nQuando finalmente encontro [intent_target.GetSheHe], [intent_target.GetSheHe] está conversando com um pequeno grupo de convidados sobre a futilidade dos casamentos."
 ep2_wedding.1150.desc_4:0 "\n\nQuando finalmente encontro [intent_target.GetSheHe], [intent_target.GetSheHe] está discursando para outros convidados sobre a santidade do casamento."
 ep2_wedding.1150.desc_conclusion:0 "É a oportunidade perfeita para se aproximar [intent_target.GetHerHim]."
 ep2_wedding.1150.desc_fallback:0 "\n\nQuando finalmente encontro [intent_target.GetSheHe], [intent_target.GetSheHe] está ocupado(a) se misturando com um pequeno grupo de convidados."
 ep2_wedding.1150.t:0 "Procurando Romantismo"
 ep2_wedding.1160.a.tt:0 "Isso vai animar as coisas!"
 ep2_wedding.1160.a:0 "Eu poderia deixá-los entrar!"
 ep2_wedding.1160.b.tt:0 "[host.GetFirstNameNoTooltip] nunca vai perceber!"
 ep2_wedding.1160.b:0 "Eu poderia contrabandear comida para eles!"
 ep2_wedding.1160.c:0 "Isso está abaixo de mim."
 ep2_wedding.1160.desc:0 "Casamentos da nobreza sempre são um grande espetáculo para as pessoas comuns, que se reúnem na esperança de vislumbrar seu governante e provar de suas riquezas.\n\nEm particular, não posso deixar de notar que as preparações em andamento para o grande banquete estão sendo seguidas com total atenção por um grupo de camponeses extremamente exaustos..."
 ep2_wedding.1160.t:0 "Penetradores"
 ep2_wedding.1161.a:0 "Expulse-os!"
 ep2_wedding.1161.b.tt:0 "[host.GetFirstName] deixou os camponeses ficarem."
 ep2_wedding.1161.b:0 "Deixem todos compartilhar nossa alegria!"
 ep2_wedding.1161.desc:0 "Já faz um tempo que venho notando a multidão crescente de plebeus ao redor do evento.\n\nO que eu não esperava era ver um pequeno grupo deles assaltando a cozinha e tentando engolir o máximo possível de [ROOT.Char.Custom('RegionalDrink')] e [ROOT.Char.Custom('GetExpensiveMeal')]!\n\n#EMP Como eles conseguiram entrar?!#!"
 ep2_wedding.1161.failure.tt2:0 "[host.GetFirstName] não conseguiu lidar com os penetras."
 ep2_wedding.1161.failure.tt:0 "Os penetras continuam agindo sem controle"
 ep2_wedding.1161.failure:0 "Você falha em controlar a multidão"
 ep2_wedding.1161.success.tt2:0 "[host.GetFirstName] expulsou os camponeses."
 ep2_wedding.1161.success.tt:0 "Você restaurou a ordem"
 ep2_wedding.1161.success:0 "Os camponeses são expulsos"
 ep2_wedding.1170.a.tt:0 "Você pega algumas ferraduras quando ninguém está olhando."
 ep2_wedding.1170.a:0 "Eu também quero participar!"
 ep2_wedding.1170.b.tt:0 "Você volta sua atenção para a cerimônia."
 ep2_wedding.1170.b:0 "Agradável, mas um pouco exagerado."
 ep2_wedding.1170.c:0 "#EMP Tão empolgante!#!"
 ep2_wedding.1170.d:0 "E se eu derrubasse aquele bobo da corte?"
 ep2_wedding.1170.desc:0 "A chegada do(a) [rich_spouse.Custom('GetBrideGroom')], [rich_spouse.GetTitledFirstName], foi acompanhada por grande pompa: um desfile inteiro de cavalos ricamente arreados deixando cair ferraduras de prata para os plebeus recolherem; tambores, liras, gaitas de foles, mímicos e bobos da corte.\n\nAgora, o desfile acabou, mas ainda atrai uma grande multidão, distraindo-os da cerimônia em andamento."
 ep2_wedding.1170.desc_mischief:0 "\n\nTantas possibilidades! Devo soltar os cavalos? Ou talvez eu possa roubar um tambor e assustar os outros convidados..."
 ep2_wedding.1170.desc_murder:0 "\n\nVejo [murderee.GetTitledFirstName] fascinado(a) por uma apresentação musical, completamente alheio(a) ao que está acontecendo ao seu redor..."
 ep2_wedding.1170.desc_relax:0 "\n\nEu gostaria de aproveitar tudo de uma vez! Em vez disso, vou entre um show de malabarismo, acariciar os cavalos e uma apresentação de cuspir fogo."
 ep2_wedding.1170.e.tt:0 "Você tenta aproveitar a multidão e a confusão do desfile."
 ep2_wedding.1170.e:0 "[murderee.GetFirstNameNoTooltip] está distraído(a)..."
 ep2_wedding.1170.failure.tt:0 "[murderee.GetFirstNameNoTooltip] desaparece na multidão"
 ep2_wedding.1170.failure:0 "Você não consegue atravessar a multidão"
 ep2_wedding.1170.success.tt:0 "Você desaparece na multidão"
 ep2_wedding.1170.success:0 "Você se aproxima sorrateiramente de [murderee.GetFirstNameNoTooltip] e #EMP ataca#!"
 ep2_wedding.1170.t:0 "O Desfile"
 ep2_wedding.1180.a:0 "Sua opinião não era necessária."
 ep2_wedding.1180.b:0 "Eu farei você gostar de mim!"
 ep2_wedding.1180.c:0 "Não me importo! Cadê a comida?"
 ep2_wedding.1180.desc:0 "Quando finalmente estamos cara a cara, consigo ver pelo nervosismo de [other_spouse.GetTitledFirstName] que [other_spouse.GetSheHe] está longe de estar à vontade.\n\nOs olhos [other_spouse.GetHerHim|U] evitam os meus, e a careta que se forma em sua boca me diz tudo que preciso saber. [other_spouse.GetSheHe|U] não gosta de mim."
 ep2_wedding.1180.t:0 "Uma Combinação Ruim"
 ep2_wedding.1190.a:0 "Estou envergonhado(a)..."
 ep2_wedding.1190.b:0 "Guardas, acompanhem esse estraga-prazeres até a porta."
 ep2_wedding.1190.c:0 "Vou fingir que não ouvi nada."
 ep2_wedding.1190.d:0 "Sim, e eu também vou aproveitar!"
 ep2_wedding.1190.desc:0 "Todos estão empolgados e maravilhados com a magnificência do local do casamento. Todos, exceto [grumbler.GetTitledFirstName].\n\nDesde a chegada [grumbler.GetHerHim], [grumbler.GetFirstNameNoTooltip] tem estado rondando, procurando qualquer pretexto para reclamar. \"Você está usando #EMP maquiagem#!?\" \"Esses véus coloridos são #EMP pecaminosos#!!\" \"O que é essa #EMP mistura impura#!?\" \"Isso tudo é um show de luxúria e luxo?\""
 ep2_wedding.1190.t:0 "Queixas Religiosas"
 ep2_wedding.1200.a:0 "Estou tão orgulhoso(a)."
 ep2_wedding.1200.b:0 "Você não está com #EMP ciúmes#!?"
 ep2_wedding.1200.c:0 "O amor está realmente no ar..."
 ep2_wedding.1200.d.tt:0 "[listener.GetFirstNameNoTooltip|U] pode estar disposto(a) a considerar uma aliança com você também."
 ep2_wedding.1200.d:0 "Casamentos importantes trazem aliados importantes!"
 ep2_wedding.1200.desc:0 "O dia finalmente chegou, e eu não poderia estar mais orgulhos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [Select_CString( my_child.IsFemale, 'da minha', 'do meu' )] [my_child.GetFirstName], o(a) lindo(a) [my_child.Custom('GetBrideGroom')]!\n\nComo a pessoa ao meu lado descobriu sem querer: \"Olhem para [my_child.GetSheHe]! Não está #EMP radiante#!?\" \"E é um casal tão bom!\" \"Tudo está perfeito!\""
 ep2_wedding.1200.desc_generic:0 "\n\nAo meu lado, [listener.GetTitledFirstName] apenas sorri educadamente."
 ep2_wedding.1200.desc_interest:0 "\n\nQuando finalmente me viro, percebo que [Select_CString( listener.IsFemale, 'minha vizinha', 'meu vizinho' )] é ninguém menos que [listener.GetTitledFirstName]! Eu poderia aproveitar esse momento de conexão..."
 ep2_wedding.1200.e.failure:0 "[listener.GetFirstNameNoTooltip|U] não está interessado(a)"
 ep2_wedding.1200.e.success.tt:0 "Você faz progresso ao aproximar [listener.GetFirstNameNoTooltip] de [intent_target.GetFirstNameNoTooltip]"
 ep2_wedding.1200.e.success:0 "[listener.GetFirstNameNoTooltip|U] está interessado(a)"
 ep2_wedding.1200.e:0 "Se ao menos eu pudesse ver o mesmo para [intent_target.GetFirstNameNoTooltip]..."
 ep2_wedding.1200.failure.tt:0 "Você não conseguiu impressionar [listener.GetFirstNameNoTooltip]"
 ep2_wedding.1200.failure:0 "[listener.GetFirstNameNoTooltip|U] não fica impressionado(a)"
 ep2_wedding.1200.success.tt:0 "Você impressionou [listener.GetFirstNameNoTooltip]"
 ep2_wedding.1200.success:0 "[listener.GetFirstNameNoTooltip|U] fica impressionado(a)"
 ep2_wedding.1200.t:0 "O Coração de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetMotherFather|U]"
 ep2_wedding.1210.a.failure:0 "[talk_to.GetFirstNameNoTooltip] não está intimidado(a)"
 ep2_wedding.1210.a.success:0 "[talk_to.GetFirstNameNoTooltip] está intimidado(a)"
 ep2_wedding.1210.a:0 "Pena se alguém se aproveitasse disso, não é?"
 ep2_wedding.1210.b.failure:0 "[talk_to.GetFirstNameNoTooltip] não confia em você"
 ep2_wedding.1210.b.success:0 "[talk_to.GetFirstNameNoTooltip] está impressionado(a)"
 ep2_wedding.1210.b:0 "É bom ter aliados fortes em tempos de necessidade!"
 ep2_wedding.1210.c.failure:0 "[talk_to.GetFirstNameNoTooltip] está desconfiado(a)"
 ep2_wedding.1210.c.success:0 "[talk_to.GetFirstNameNoTooltip] está convencido(a)"
 ep2_wedding.1210.c:0 "Você já considerou arranjar um protetor?"
 ep2_wedding.1210.desc:0 "Conforme a cerimônia segue seu curso, finalmente consigo me posicionar ao lado de [talk_to.GetTitledFirstName] e envolvê-la em uma pequena conversa, que rapidamente evolui para um assunto mais interessante: política.\n\nCompartilhamos algumas observações casuais até eu levar [talk_to.GetSheHe] exatamente onde eu queria."
 ep2_wedding.1210.desc_age:0 "\n\n\"É doloroso admitir, mas estou ficando mais velha!\""
 ep2_wedding.1210.desc_bad_harvest:0 "\n\n\"Infelizmente, tivemos algumas colheitas ruins que prejudicaram nosso crescimento recentemente...\""
 ep2_wedding.1210.desc_enemies:0 "\n\n\"Você nunca pode se sentir seguro demais. Seus inimigos estão sempre se fortalecendo ao seu redor.\""
 ep2_wedding.1210.desc_fear:0 "\n\n\"Vivo com medo constante por meu [talk_to.GetPrimaryTitle.GetTierAsNameNoTooltip] e por mim mesma...\""
 ep2_wedding.1210.desc_gold:0 "\n\n\"É doloroso admitir, mas meus cofres estão vazios!\""
 ep2_wedding.1210.desc_raids:0 "\n\n\"Estou muito preocupada com os recentes ataques em minhas terras...\""
 ep2_wedding.1210.desc_rain:0 "\n\n\"As chuvas inesperadas têm assolado meu povo e prejudicado a colheita...\""
 ep2_wedding.1210.desc_rivals:0 "\n\n\"Não consigo dormir à noite, vejo meus inimigos em cada sombra!\""
 ep2_wedding.1210.t:0 "Conversa Política"
 ep2_wedding.1220.a:0 "Sim, sim, claro..."
 ep2_wedding.1220.b:0 "Isso é um desafio?"
 ep2_wedding.1220.c.failure.tt:0 "[relative.GetFirstNameNoTooltip] ainda não gosta de você!"
 ep2_wedding.1220.c.failure:0 "Você não consegue refutar os preconceitos de [relative.GetFirstNamePossessiveNoTooltip]"
 ep2_wedding.1220.c.success.tt:0 "[relative.GetFirstNameNoTooltip] gosta mais de você!"
 ep2_wedding.1220.c.success:0 "Você causa uma boa impressão em [relative.GetFirstNameNoTooltip]"
 ep2_wedding.1220.c.tt:0 "Lidar bem com a situação também causará uma boa impressão em [diplo_target.GetFirstNameNoTooltip]"
 ep2_wedding.1220.c:0 "Eu #EMP vou#! provar que você está errado(a)."
 ep2_wedding.1220.d:0 "Oh, eu posso ser muito #EMP pior#!!"
 ep2_wedding.1220.desc:0 "Os preparativos e rituais de uma cerimônia de casamento são muitos; em um intervalo entre eles, ouço risinhos e escárnios vindos de um grupo de parentes de [other_spouse.GetFirstNamePossessive].\n\nQuando percebem que chamaram minha atenção, [relative.GetTitledFirstName] começa a me abordar diretamente:"
 ep2_wedding.1220.desc_despicable:0 "\"É #EMP ultrajante#! permitir que a pobre [other_spouse.GetFirstNameNoTooltip] se case com um personagem tão desprezível como #EMP você#!\""
 ep2_wedding.1220.desc_fallback:0 "\"É verdadeiramente uma pena que não tenhamos encontrado ninguém #EMP melhor#! para a pobre [other_spouse.GetFirstNameNoTooltip], mas é a vida...\""
 ep2_wedding.1220.desc_feud:0 "\"Não consigo acreditar que concordamos com uma união com a Casa #EMP desprezível#! [ROOT.Char.GetHouse.GetName]!\""
 ep2_wedding.1220.desc_marry_down:0 "\"Não consigo acreditar que nossa família concordou em deixar [other_spouse.GetFirstNameNoTooltip] macular [other_spouse.GetHerselfHimself] casando-se com alguém de posição social inferior!\""
 ep2_wedding.1220.desc_miscreant:0 "\"Como pudemos deixar este #EMP vilão desalmado#! corromper a pobre [other_spouse.GetFirstNameNoTooltip]?\""
 ep2_wedding.1220.desc_target:0 "\n\nA confusão também atraiu a atenção de [diplo_intent.GetTitledFirstNamePossessive], que agora me observa atentamente."
 ep2_wedding.1220.t:0 "Relações Venenosas"
 ep2_wedding.1300.beauty.tt:0 "Essa opção está disponível porque [spouse_2.GetShortUIName] é famoso(a) por sua beleza"
 ep2_wedding.1300.beauty:0 "Eu me casei com o(a) [spouse_2.GetWomanMan] mais bonito(a) do mundo."
 ep2_wedding.1300.desc_appearance:0 "\"Eu sou horrível. Todos dizem isso, mesmo que digam baixo."
 ep2_wedding.1300.desc_dark_past:0 "\"As coisas que eu fiz... ninguém vai me deixar esquecê-las."
 ep2_wedding.1300.desc_intro:0 "Acordo em uma cama fria na minha noite de casamento. [spouse_2.GetTitledFirstName] está em pé junto à janela, seus braços arrepiando-se no ar da noite.\n\n"
 ep2_wedding.1300.desc_lowborn:0 "\"Eu sou um(a) ninguém de origem humilde. Não pertenço à corte. Sinto que todos estão rindo de mim."
 ep2_wedding.1300.desc_outro:0 " Por que um(a) [ROOT.Char.GetTitleAsNameNoTooltip] gostaria de se casar com alguém como eu?\""
 ep2_wedding.1300.desc_voice:0 "\"Eu...\" [spouse_2.GetSheHe] pausa para escolher as palavras. \"Mal consigo falar sem que todos riam de mim às escondidas."
 ep2_wedding.1300.fertility.tt:0 "Essa opção está disponível porque [spouse_2.GetShortUIName] possui as qualidades certas para ser um(a) progenitor(a) prolífico(a)"
 ep2_wedding.1300.fertility:0 "Eu escolhi você para me dar muitos herdeiros fortes."
 ep2_wedding.1300.followup.a:0 "As inseguranças de [spouse_2.GetShortUINamePossessiveNoTooltip|U] são acalmadas"
 ep2_wedding.1300.followup.b:0 "[spouse_2.GetShortUINameNoTooltip|U] aceita a praticidade do casamento"
 ep2_wedding.1300.followup.c:0 "[spouse_2.GetShortUINameNoTooltip|U] se sente incompreendido(a)"
 ep2_wedding.1300.followup.tt:0 "[spouse_2.GetShortUIName|U] reagirá de acordo com a personalidade [spouse_2.GetHerHim], podendo se sentir tranquilizado(a) ou ofendido(a)"
 ep2_wedding.1300.practical:0 "Esse casamento é prático para ambos."
 ep2_wedding.1300.rule_together.tt:0 "Essa opção está disponível porque [spouse_2.GetShortUIName] tem a mente de um(a) governante"
 ep2_wedding.1300.rule_together:0 "Eu preciso de alguém como você ao meu lado para governar."
 ep2_wedding.1300.stop_whining:0 "Pare de reclamar, estou te tornando um(a) [spouse_2.GetTitleAsNameNoTooltip]."
 ep2_wedding.1300.t:0 "Por que Eu?"
 ep2_wedding.1300.understanding:0 "Eu sei como é se sentir indigno(a)."
 ep2_wedding.1300.virtue.tt:0 "Essa opção está disponível porque [spouse_2.GetShortUIName] é uma pessoa virtuosa"
 ep2_wedding.1300.virtue:0 "Eu escolhi você por seu caráter virtuoso."
 ep2_wedding.1301.desc_appearance:0 "Eu sou horrível. Por que um(a) [spouse_1.GetTitleAsNameNoTooltip] gostaria de se casar com alguém como eu?"
 ep2_wedding.1301.desc_beauty:0 "[spouse_1.GetSheHe|U] diz que [spouse_1.GetSheHe] me escolheu pela minha beleza."
 ep2_wedding.1301.desc_dark_past:0 "Por que um(a) [spouse_1.GetTitleAsNameNoTooltip] gostaria de se casar com alguém como eu, depois das coisas que eu fiz?"
 ep2_wedding.1301.desc_fertility:0 "[spouse_1.GetSheHe|U] diz que [spouse_1.GetSheHe] me escolheu para lhe dar herdeiros fortes."
 ep2_wedding.1301.desc_intro:0 "Pensamentos inquietos me chamam da minha cama de casamento."
 ep2_wedding.1301.desc_lowborn:0 "Por que um(a) [spouse_1.GetTitleAsNameNoTooltip] gostaria de se casar com um(a) plebeu(a) como eu?"
 ep2_wedding.1301.desc_midtro:0 "\n\nMeu inquietamento acorda [spouse_1.GetTitledFirstName], e antes que eu perceba, estou perguntando a [spouse_1.GetSheHe] por que [spouse_1.GetSheHe] se casou comigo entre todas as pessoas."
 ep2_wedding.1301.desc_outro:0 "O que devo pensar sobre isso?"
 ep2_wedding.1301.desc_practical:0 "[spouse_1.GetSheHe|U] diz que [spouse_1.GetSheHe] me escolheu por pura praticidade."
 ep2_wedding.1301.desc_rule_together:0 "[spouse_1.GetSheHe|U] diz que [spouse_1.GetSheHe] me escolheu para que eu possa ajudar [spouse_1.GetSheHe] a governar."
 ep2_wedding.1301.desc_stop_whining:0 "[spouse_1.GetSheHe|U] me diz para parar de reclamar e ser grato(a) por esse casamento."
 ep2_wedding.1301.desc_understanding:0 "[spouse_1.GetSheHe|U] diz que [spouse_1.GetSheHe] também entende como é se sentir sem valor."
 ep2_wedding.1301.desc_virtue:0 "[spouse_1.GetSheHe|U] diz que [spouse_1.GetSheHe] me escolheu por causa do meu caráter virtuoso."
 ep2_wedding.1301.desc_voice:0 "Por que um(a) [spouse_1.GetTitleAsNameNoTooltip] gostaria de se casar com alguém como eu, quando mal consigo falar sem que todos riam de mim?"
 ep2_wedding.1301.love:0 "Eu quero ser digno(a) do amor [spouse_1.GetHerHim]."
 ep2_wedding.1301.misunderstood:0 "Eu sabia que [spouse_1.GetSheHe] não entenderia."
 ep2_wedding.1301.outcome.love:0 "[spouse_2.GetShortUIName] sorri enquanto você acalma as inseguranças dela."
 ep2_wedding.1301.outcome.misunderstood:0 "[spouse_2.GetShortUIName] sente que você não está ouvindo-a."
 ep2_wedding.1301.outcome.silly:0 "[spouse_2.GetShortUIName] aceita que esse casamento faz sentido."
 ep2_wedding.1301.outcome.trust:0 "[spouse_2.GetShortUIName] sente que pode confiar em você."
 ep2_wedding.1301.silly:0 "[spouse_1.GetSheHe|U] está certo(a), estou sendo bobo(a)."
 ep2_wedding.1301.t:0 "$ep2_wedding.1300.t$"
 ep2_wedding.1301.trust:0 "Eu quero confiar n[spouse_1.GetSheHe]."
 ep2_wedding.1310.a:0 "Que alegria ter [friend.GetFirstNameNoTooltip] aqui comigo!"
 ep2_wedding.1310.b.badtime:0 "[other_guest.GetShortUIName] e [friend.GetShortUIName] se envolvem em uma discussão"
 ep2_wedding.1310.b.goodtime:0 "[other_guest.GetShortUIName] se diverte com você e [friend.GetShortUIName]"
 ep2_wedding.1310.b.newfriends:0 "[other_guest.GetFirstNameNoTooltip] se dá muito bem com você e [friend.GetFirstNameNoTooltip]"
 ep2_wedding.1310.b.nowound:0 "[rival.GetFirstNameNoTooltip|U] fica humilhado(a)"
 ep2_wedding.1310.b.wound:0 "[rival.GetFirstNameNoTooltip|U] escorrega e bate a cabeça"
 ep2_wedding.1310.b:0 "[other_guest.GetFirstNameNoTooltip], venha se juntar a nós!"
 ep2_wedding.1310.c.apology:0 "[rival.GetFirstNameNoTooltip|U] pede desculpas a você"
 ep2_wedding.1310.c.hook:0 "[rival.GetFirstNameNoTooltip|U] oferece se redimir com você"
 ep2_wedding.1310.c.refusal:0 "[rival.GetFirstNameNoTooltip|U] se recusa a se humilhar"
 ep2_wedding.1310.c:0 "Vamos sair discretamente para podermos conversar melhor!"
 ep2_wedding.1310.d.tt:0 "Não se preocupe, [friend.GetFirstNameNoTooltip] vai entender."
 ep2_wedding.1310.d:0 "Peço desculpas, meu(a) amigo(a)."
 ep2_wedding.1310.desc_guest:0 "Eu sei que deveria socializar com os outros convidados, mas simplesmente não consigo me afastar [Select_CString( friend.IsFemale, 'da minha amiga', 'do meu amigo' )] [friend.GetTitledFirstName]! Posso ver [other_guest.GetTitledFirstName] tentando chamar minha atenção, $ep2_wedding.1310.howlingwithlaughter$"
 ep2_wedding.1310.desc_host:0 "Como anfitrião(a) do casamento, eu sei que deveria passar tempo com o casal e suas famílias, mas simplesmente não consigo me afastar [Select_CString( friend.IsFemale, 'da minha amiga', 'do meu amigo' )] [friend.GetTitledFirstName]! Posso ver [other_guest.GetTitledFirstName] começando a me lançar olhares de desaprovação, $ep2_wedding.1310.howlingwithlaughter$"
 ep2_wedding.1310.desc_spouse:0 "Eu sei que deveria passar tempo com [Select_CString( other_spouse.IsFemale, 'minha nova', 'meu novo' )] [other_spouse.GetWifeHusband] [other_spouse.GetFirstName] e a família [other_spouse.GetHerHim], mas simplesmente não consigo me afastar do meu(a) amigo(a) [friend.GetTitledFirstName]! Posso ver [other_guest.GetTitledFirstName] começando a me lançar olhares de desaprovação, $ep2_wedding.1310.howlingwithlaughter$"
 ep2_wedding.1310.howlingwithlaughter:0 "mas toda vez que tento me desculpar, [friend.GetFirstNameNoTooltip] me faz gargalhar alto de novo."
 ep2_wedding.1310.log.b.newfriends:0 "[CHARACTER.GetUIName|U] chamou [TARGET_CHARACTER.GetUIName] para a mesa [CHARACTER.GetHerHim], e [TARGET_CHARACTER.GetSheHe] se deu muito bem com os amigos de [CHARACTER.GetShortUINamePossessive]."
 ep2_wedding.1310.log.b.newfriends_title:0 "$wedding_banquet_bond_log_title$"
 ep2_wedding.1310.t:0 "Não Consigo Me Afastar"
 ep2_wedding.1320.a.friend:0 "[rival.GetShortUINameNoTooltip] aceita seu gesto de paz"
 ep2_wedding.1320.a.friendliness:0 "[rival.GetShortUINameNoTooltip] aprecia seu gesto de paz"
 ep2_wedding.1320.a:0 "Eu abraço [rival.GetFirstNameNoTooltip] e deixo tudo ser perdoado!"
 ep2_wedding.1320.b:0 "Eu atiro [host.Custom('GetExpensiveMeal')] no rosto arrogante [rival.GetHerHim]."
 ep2_wedding.1320.c:0 "\"Quanto vale o perdão para você?\""
 ep2_wedding.1320.d:0 "Eu ignoro [rival.GetShortUIName] até que [rival.GetSheHe] vá embora."
 ep2_wedding.1320.desc_guest_vs_guest:0 "Vê-lo(a) em uma ocasião tão feliz me faz refletir."
 ep2_wedding.1320.desc_guest_vs_host:0 "Eu nunca pensei que você viria."
 ep2_wedding.1320.desc_guest_vs_spouse:0 "$ep2_wedding.1320.desc_guest_vs_host$"
 ep2_wedding.1320.desc_host_vs_guest:0 "Por que você me convidou para este casamento tão esplêndido?"
 ep2_wedding.1320.desc_host_vs_spouse:0 "Por que você organizou um casamento tão esplêndido para mim?"
 ep2_wedding.1320.desc_intro:0 "Aquele detestável [rival.GetTitledFirstName] tem me encarado através da mesa do banquete. Nossos olhares se encontram, e eu me preparo para uma discussão enquanto [rival.GetSheHe] atravessa o salão em minha direção. Espere... [rival.GetSheHe] está chorando?\n\n"
 ep2_wedding.1320.desc_outro:0 "Depois de tudo o que aconteceu entre nós...\" Os olhos [rival.GetHerHim|U] se enchem de lágrimas. \"Eu gostaria de poder desfazer tudo!"
 ep2_wedding.1320.desc_spouse_vs_guest:0 "Por que fui convidado(a) para o seu casamento?"
 ep2_wedding.1320.desc_spouse_vs_host:0 "Deve ter parecido estranho eu organizar o seu casamento."
 ep2_wedding.1320.t:0 "Uma Chance de Recomeçar?"
 ep2_wedding.1330.a:0 "Eu amo essa [spouse.GetWomanMan] além das palavras."
 ep2_wedding.1330.b:0 "Nunca precisarei de mais ninguém além [spouse.GetHerHim]."
 ep2_wedding.1330.c.breakup:0 "[ROOT.Char.GetFirstNameNoTooltip] me deixa por amor a [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [spouse.GetWifeHusband]."
 ep2_wedding.1330.c.rakish.failure:0 "Suas promessas são vazias."
 ep2_wedding.1330.c.rakish.success:0 "Você faz um esforço real para mudar."
 ep2_wedding.1330.c:0 "Vou corrigir meu comportamento e ser fiel!"
 ep2_wedding.1330.d.confession.tt:0 "[spouse.GetFirstNameNoTooltip|U] irá dizer se [spouse.GetSheHe] compartilha de suas preferências."
 ep2_wedding.1330.d.yeahmetoo.tt:0 "$ep2_wedding.1330.d.yeahmetoo$"
 ep2_wedding.1330.d.yeahmetoo:0 "[spouse.GetFirstNameNoTooltip|U] revela gostos aventureiros próprios."
 ep2_wedding.1330.d.yuck.tt:0 "$ep2_wedding.1330.d.yuck$"
 ep2_wedding.1330.d.yuck:0 "[spouse.GetFirstNameNoTooltip|U] fica enojado com minha depravação."
 ep2_wedding.1330.d.yum.tt:0 "$ep2_wedding.1330.d.yum$"
 ep2_wedding.1330.d.yum:0 "[spouse.GetFirstNameNoTooltip|U] fica intrigado com meu gosto aventureiro."
 ep2_wedding.1330.d:0 "Fico pensando se [spouse.GetSheHe] gosta... daquela coisa."
 ep2_wedding.1330.desc:0 "Quantos convidados de casamento suspeitaram que [spouse.GetTitledFirstName] já era meu amante? Atrás de portas fechadas, não há necessidade de fingir o contrário. O toque familiar [spouse.GetHerHim|U], meu conhecimento do corpo [spouse.GetHerHim]... agora essas coisas são minhas para guardar.\n\nEnquanto contemplo [Select_CString( spouse.IsFemale, 'minha amante e minha', 'meu amante e meu' )] [spouse.GetWifeHusband], um único pensamento percorre minha mente..."
 ep2_wedding.1330.e:0 "Como pude fazer isso com [soulmate.GetFirstNameNoTooltip]?"
 ep2_wedding.1330.f.confession.desc:0 "A verdade é revelada"
 ep2_wedding.1330.f.confession.tt:0 "[spouse.GetFirstNameNoTooltip|U] revela se [spouse.GetSheHe] tem outros amantes"
 ep2_wedding.1330.f.confession:0 "[spouse.GetFirstNameNoTooltip|U] confessa seus outros amores"
 ep2_wedding.1330.f.lingeringdoubts.tt:0 "A dúvida continua a assombrar você"
 ep2_wedding.1330.f.lingeringdoubts:0 "[spouse.GetFirstNameNoTooltip|U] afirma amar apenas a mim, mas a dúvida me assombra."
 ep2_wedding.1330.f.mindatease.tt:0 "[spouse.GetFirstNameNoTooltip|U] tranquiliza sua mente."
 ep2_wedding.1330.f.mindatease:0 "As palavras de tranquilidade de [spouse.GetShortUINamePossessive|U] tranquilizam minha mente."
 ep2_wedding.1330.f:0 "Será que sou realmente o único amor [spouse.GetHerHim]?"
 ep2_wedding.1330.g:0 "Finalmente, não precisamos mais esconder nosso amor!"
 ep2_wedding.1330.t:0 "Meu Amor, [Select_CString( spouse.IsFemale, 'Minha', 'Meu' )] [spouse.GetWifeHusband]"
 ep2_wedding.1340.a.failure:0 "Você teme que [intended.GetFirstNameNoTooltip] não seja adequado para você"
 ep2_wedding.1340.a.success:0 "Você está confiante de que [intended.GetFirstNameNoTooltip] combinará com você"
 ep2_wedding.1340.a.tt:0 "Será que combinamos um com o outro?"
 ep2_wedding.1340.a:0 "[intended.GetFirstNameNoTooltip|U] é perfeit[Select_CString( intended.IsFemale, 'a', 'o' )] para mim."
 ep2_wedding.1340.b.failure:0 "Você teme que o casamento mudará seu estilo de vida"
 ep2_wedding.1340.b.success:0 "Você tem confiança de que seu estilo de vida permanecerá o mesmo"
 ep2_wedding.1340.b.tt:0 "Será que eles realmente podem me fazer feliz?"
 ep2_wedding.1340.b:0 "Não se preocupe comigo, terei meus hobbies!"
 ep2_wedding.1340.c.failure:0 "Você teme que [intended.GetFirstNameNoTooltip] irá descobrir seus segredos"
 ep2_wedding.1340.c.success:0 "Você tem confiança de que seus segredos estão seguros"
 ep2_wedding.1340.c.tt:0 "Serei capaz de guardar meus segredos [intended.GetHerHim]?"
 ep2_wedding.1340.c:0 "Não se preocupe comigo, terei meus... #EMP hobbies#!"
 ep2_wedding.1340.cheating:0 "maridos traindo esposas, esposas traindo maridos, uma parada de mentiras e humilhações."
 ep2_wedding.1340.d.failure:0 "Você teme que este casamento apresentará desafios que você nunca esperou"
 ep2_wedding.1340.d.success:0 "Você tem confiança de que este casamento será território familiar"
 ep2_wedding.1340.d.tt.more:0 "Afinal, eu já fui casado... quantas vezes mesmo?"
 ep2_wedding.1340.d.tt.never:0 "Afinal, eu... uh..."
 ep2_wedding.1340.d.tt.once:0 "Afinal, eu já fui casado antes..."
 ep2_wedding.1340.d:0 "#EMP Por favor#!, eu sei tudo sobre casamento!"
 ep2_wedding.1340.desc.cheated_on:0 "$ep2_wedding.1340.cheating$ $ep2_wedding.1340.i_would_know$"
 ep2_wedding.1340.desc.cheated_on_alt:0 "$ep2_wedding.1340.cheating$ \"Assim como eu e [adulterous_spouse.GetFirstName],\" resmunga [cynic.GetSheHe]."
 ep2_wedding.1340.desc.dislikes_spouse:0 "repleto de brigas, desconfiança e conflitos, o fim de qualquer paz. $ep2_wedding.1340.like_me_and$"
 ep2_wedding.1340.desc.dislikes_spouse_lustful:0 "uma cama fria e um[Select_CString( intended.IsFemale, 'a', '' )] [intended.GetWifeHusband] desconfiad[Select_CString( intended.IsFemale, 'a', 'o' )], uma amarra em suas alegrias. $ep2_wedding.1340.like_me_and$"
 ep2_wedding.1340.desc.divorced:0 "uma marcha lenta e dolorosa em direção ao momento em que você descobre qual de vocês vai descartar o outro. \"Assim como eu e [divorced_spouse.GetFirstName],\" resmunga [cynic.GetSheHe]."
 ep2_wedding.1340.desc.intro:0 "\"Eu tenho pena de você, [cynic.Custom2('RelationToMe', SCOPE.sC('nervous_spouse'))|U]...\" [cynic.GetTitledFirstName] me conta como é a vida de casado(a):"
 ep2_wedding.1340.desc.outro:0 "\n\nSerá assim o meu casamento com [intended.GetTitledFirstName]?"
 ep2_wedding.1340.e:0 "Saia da minha frente, maldito ressentido."
 ep2_wedding.1340.f.tt:0 "As preocupações pré-casamento duram apenas até o final do casamento"
 ep2_wedding.1340.f:0 "...será que será realmente tão ruim?"
 ep2_wedding.1340.failure_title:0 "Nervosismo Pré-Casamento"
 ep2_wedding.1340.i_would_know:0 "\"Eu saberia,\" resmunga [cynic.GetSheHe]."
 ep2_wedding.1340.like_me_and:0 "\"Assim como eu e [disliked_spouse.GetFirstName],\" resmunga [cynic.GetSheHe]."
 ep2_wedding.1340.success_title:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] Confiante [ROOT.Char.Custom('GetBrideGroom')|U]"
 ep2_wedding.1340.t:0 "Condolências pelo seu casamento"
 ep2_wedding.1350.a:0 "Desfrute de um momento tranquilo juntos."
 ep2_wedding.1350.b:0 "Diga a [caring_relative.GetShortUINameNoTooltip] o quanto significa tê-los aqui."
 ep2_wedding.1350.desc.intro:0 "Minha cabeça lateja com o barulho de móveis batendo e convidados conversando. A tensão deve estar visível, pois m[Select_CString( caring_relative.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('caring_relative'))] [caring_relative.GetTitledFirstName] pega meu braço e me conduz para a próxima sala.\n\nO som dos preparativos desaparece. Falamos sobre coisas simples: tempos passados, pessoas que conhecemos, nem uma palavra sobre o casamento. Então ficamos sem palavras e caímos em silêncio."
 ep2_wedding.1350.t:0 "Perdid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de Palavras"
 ep2_wedding.2000.a.tt:0 "Você se aproxima de [diplo_target.GetFirstNameNoTooltip]"
 ep2_wedding.2000.a:0 "Fantástico! Vamos usar essa percepção imediatamente!"
 ep2_wedding.2000.after.alliance.tt:0 "Você estabelece uma aliança com [diplo_target.GetFirstNameNoTooltip]"
 ep2_wedding.2000.after.alliance:0 "[diplo_target.GetShortUINameNoTooltip] considera você um aliado poderoso"
 ep2_wedding.2000.after.friends:0 "[diplo_target.GetShortUINameNoTooltip] considera você uma alma afim"
 ep2_wedding.2000.after.insult.short:0 "[diplo_target.GetFirstNameNoTooltip] fica ofendido"
 ep2_wedding.2000.after.insult:0 "[diplo_target.GetShortUINameNoTooltip] fica ofendido por você pensar que [diplo_target.GetSheHe] teria algum interesse nisso"
 ep2_wedding.2000.after.subjugate.tt:0 "[diplo_target.GetFirstNameNoTooltip] presta juramento de fidelidade a você"
 ep2_wedding.2000.after.subjugate:0 "[diplo_target.GetShortUINameNoTooltip] quer que você seja seu senhor feudal"
 ep2_wedding.2000.b.failure:0 "[target_friend.GetFirstNameNoTooltip] fica ofendido com sua desconfiança"
 ep2_wedding.2000.b.success.tt:0 "Isso concederá um bônus aos [GetScheme('befriend').GetTypeName] direcionados a [diplo_target.GetFirstNameNoTooltip]"
 ep2_wedding.2000.b.success:0 "[target_friend.GetFirstNameNoTooltip] parece estar dizendo a verdade"
 ep2_wedding.2000.b:0 "Como eu sei que posso confiar n[target_friend.GetSheHe]?"
 ep2_wedding.2000.desc.fishy:0 "\"[diplo_target.GetSheHe|U] prospera na corte! Com grande cuidado, [diplo_target.GetSheHe] estudou as artes das sombras.\""
 ep2_wedding.2000.desc.intro:0 "Após observar [diplo_target.GetTitledFirstName] de longe, chego rapidamente à conclusão de que não posso simplesmente me aproximar [diplo_target.GetHerHim] e começar a falar sobre o clima, ou os tratados médicos mais recentes, ou a guerra, e rezar para que isso se torne uma aliança.\n\nLogo avisto [target_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] do outro lado da sala, conhecido por ser [diplo_target.GetFirstNamePossessiveNoTooltip] [SCOPE.sC('diplo_target').Custom2('RelationToMeShort', SCOPE.sC('target_friend'))], bebendo copos de [ROOT.Char.Custom('RegionalAlcoholicDrink')] felizes.\n\n\"Diga-me, onde estão os interesses de [diplo_target.GetFirstNamePossessiveNoTooltip]?\" pergunto, atento.\n\n"
 ep2_wedding.2000.desc.lustful:0 "\"Hah! Sob a cintura de alguém, posso te dizer isso!\""
 ep2_wedding.2000.desc.nerd:0 "\"Apenas... apenas fale sobre livros e o quanto você odeia sair de casa.\""
 ep2_wedding.2000.desc.social:0 "\"Aqui, obviamente! Um momento de celebração, boa comida, bebida fina e a companhia mais requintada.\""
 ep2_wedding.2000.desc.valiant:0 "\"Ah, a mais valente das [diplo_target.GetWomenMen], versada na guerra e suas artes.\""
 ep2_wedding.2000.t:0 "Um Amigo de um Amigo"
 ep2_wedding.2001.a:0 "\"Você quer sair furtivamente e encontrar alguns... bons convidados?\""
 ep2_wedding.2001.b.dull:0 "\"Então... você ouviu falar sobre... um tratado?\""
 ep2_wedding.2001.b.flavor:0 "#EMP Nada é miserável, a menos que você pense assim#!."
 ep2_wedding.2001.b:0 "\"Nihil est miserum nisi cum putes\", como diz o filósofo.\""
 ep2_wedding.2001.c:0 "\"Você ouviu falar sobre a campanha do barão? Que cerco foi esse!\""
 ep2_wedding.2001.d:0 "\"Por favor, beba e coma comigo, e que esse banquete dure dias!\""
 ep2_wedding.2001.desc:0 "Com meu conhecimento recém-adquirido, me aproximo habilmente de [diplo_target.GetTitledFirstName], que está desfrutando do banquete e da companhia de outros em uma mesa diferente, onde um rico pano está disposto. \"Podemos conversar um pouco, [diplo_target.GetTitleAsNameNoTooltip]?\" pergunto, \"Não gostaria de interromper seu parlamento.\"\n\n[diplo_target.GetTitledFirstNameNoTooltip] levanta as sobrancelhas, um leve interesse em seus olhos, \"Bem, claro. Quais assuntos o trazem até mim, nobre [ROOT.Char.GetFirstNameNoTooltip]?\""
 ep2_wedding.2001.e:0 "\"#EMP Psst#!, você ouviu os rumores sobre uma trama na corte?\""
 ep2_wedding.2001.t:0 "$ep2_wedding.2000.t$"
 ep2_wedding.2010.a.tt:0 "Isso ajudará você a ganhar renome, mas um convidado perspicaz pode ficar suspeito..."
 ep2_wedding.2010.a:0 "Preciso me apressar, mandar meus serviçais começarem imediatamente."
 ep2_wedding.2010.b:0 "O risco é muito grande."
 ep2_wedding.2010.desc.intro:0 "Enquanto o banquete continua, acho tudo um pouco... decepcionante. Não há sedas impressionantes nem tapeçarias, o ouro mais nobre não tem lugar aqui — assim como as gemas mais preciosas. Ao olhar pela janela, encontro inspiração no céu noturno.\n\nLá fora existe o jogo branco. Livremente eles vagam pelas nossas florestas e se escondem entre as árvores. Caçar um — um feito lendário.\n\nTalvez eu pudesse... simplesmente pintar o(a) [ROOT.Char.Custom('GetAnimalType')] de branco?"
 ep2_wedding.2010.desc_spouse:0 "\n\nComo mais posso honrar meu próprio casamento?"
 ep2_wedding.2010.impressed_list:0 "Todo convidado sociável, festeiro, bêbado, corajoso, caçador ou galante presente"
 ep2_wedding.2010.t:0 "Um Convidado Legendário"
 ep2_wedding.2011.a:0 "Ah, não há mais sentido em manter a ilusão."
 ep2_wedding.2011.b.failure:0 "[doubting_guest.GetFirstNameNoTooltip] não acredita em uma única palavra"
 ep2_wedding.2011.b.success:0 "[doubting_guest.GetFirstNameNoTooltip] acredita relutantemente em você"
 ep2_wedding.2011.b:0 "Como ousa duvidar de mim no dia da minha festa?"
 ep2_wedding.2011.desc:0 "Conforme o(a) [ROOT.Char.Custom('GetAnimalType')] entra no salão, sua pelagem pálida brilha intensamente sob a luz da lua, uma febre quase fosforescente, um brilho sobrenatural. A falsidade é quase perfeita - uma maravilha. Os convidados ficam maravilhados e se aproximam rapidamente do animal, sem ousar tocá-lo, pois sua natureza é sagrada.\n\nNo entanto, vejo [doubting_guest.GetTitledFirstName] entre a multidão, revirando os olhos: \"Você não consegue perceber que é só tinta? [ROOT.Char.GetTitledFirstNameNoTooltip] deve nos tomar todos por tolos.\""
 ep2_wedding.2011.t:0 "$ep2_wedding.2010.t$: Despertando Suspeitas"
 ep2_wedding.2020.a.failure:0 "[drunk_guest.GetFirstNameNoTooltip] cai no poço"
 ep2_wedding.2020.a.success:0 "Você convence [drunk_guest.GetFirstNameNoTooltip] a se afastar"
 ep2_wedding.2020.a:0 "Você vai se machucar... venha até aqui, amigo."
 ep2_wedding.2020.b.success:0 "[drunk_guest.GetFirstNameNoTooltip] não cai"
 ep2_wedding.2020.b:0 "Vou ficar aqui quietinho e observar."
 ep2_wedding.2020.c.death:0 "[drunk_guest.GetFirstNameNoTooltip] morre na queda"
 ep2_wedding.2020.c.failure:0 "[drunk_guest.GetFirstNameNoTooltip] resiste ao seu empurrão"
 ep2_wedding.2020.c.success:0 "Você empurra com sucesso [drunk_guest.GetFirstNameNoTooltip] para dentro do poço"
 ep2_wedding.2020.c:0 "\"Pronto!\""
 ep2_wedding.2020.desc:0 "Pratos das melhores refeições circulam pelas mesas, com [host.Custom('GetExpensiveMeal')] e [host.Custom('GetExpensiveDessert')] enchendo o ambiente com um delicioso cheiro.\n\n[host.GetTitledFirstName] realmente exagerou nas preparações, e o poço no pátio transborda com [host.Custom('GetExpensiveDrink')], agora coletado através de um balde de prata com uma corrente de prata.\n\nCuriosamente, me aproximo dele e vejo [drunk_guest.GetTitledFirstName], tropeçando perigosamente perto dele, taça na mão."
 ep2_wedding.2020.t:0 "Não Muito Bem"
 ep2_wedding.3000.a.failure:0 "[my_spouse.GetFirstNameNoTooltip] acha o passeio entediante"
 ep2_wedding.3000.a.success:0 "[my_spouse.GetFirstNameNoTooltip] acha o passeio encantador"
 ep2_wedding.3000.a:0 "\"Você quer dar um passeio?\""
 ep2_wedding.3000.b.failure:0 "[my_spouse.GetFirstNameNoTooltip] acha a conversa entediante"
 ep2_wedding.3000.b.success:0 "[my_spouse.GetFirstNameNoTooltip] e você têm uma conversa adorável"
 ep2_wedding.3000.b:0 "\"Você gosta... de ler?\""
 ep2_wedding.3000.c:0 "\"#EMP Bocejo#!, estou com #EMP tanto#! sono.\""
 ep2_wedding.3000.desc:0 "#EMP Suspiro#!. Lá vamos nós. Acho que sim. O que devo fazer agora, afinal? Será que [my_spouse.GetSheHe] gosta de... abraços? Talvez só beijos. Eu viro meu rosto quando [my_spouse.GetSheHe] olha diretamente para mim. Pelo menos consigo ver que [my_spouse.GetSheHe] também está mexendo com as mãos.\n\n\"Er...\", eu tento dizer, limpando a garganta; os lençóis ainda não têm nem uma única ruga, \"você está linda esta noite.\"\n\n\"O-Obrigado... Eu também gosto do seu... seu cabelo.\"\n\nMaldição, isso claramente não está funcionando."
 ep2_wedding.3000.t:0 "Começos Tímidos"
 ep2_wedding.3000.tt:0 "[my_spouse.GetFirstNameNoTooltip] pode gostar ou não com base em seus traços...\n"
 ep2_wedding.3010.a:0 "\"Não se preocupe, meu amor, eu irei protegê-lo(a).\""
 ep2_wedding.3010.b:0 "\"Pare. Eu não quero ouvir o resto.\""
 ep2_wedding.3010.c:0 "\"Na verdade... eu também tenho algo para confessar.\""
 ep2_wedding.3010.desc.cannibal:0 "Eu não consigo evitar, seu sabor..."
 ep2_wedding.3010.desc.deviant:0 "Eu sei que é repugnante para você, para todos..."
 ep2_wedding.3010.desc.fallback:0 "Eu sei que não é bom, mas..."
 ep2_wedding.3010.desc.intro:0 "[my_spouse.GetTitledFirstName] ficou ocioso(a) a noite toda, olhando pela janela e soltando suspiros melancólicos sempre que tento me aproximar [my_spouse.GetHerHim]. [my_spouse.GetSheHe|U] não consegue parar de mexer no cabelo, evitando meu olhar.\n\nAs velas estão quase se apagando, e [my_spouse.GetSheHe] começa a chorar silenciosamente quando me levanto para reacendê-las. \"[ROOT.Char.GetFirstNameNoTooltip], eu... eu tenho algo para confessar."
 ep2_wedding.3010.desc.murder:0 "O sangue... estava por toda parte..."
 ep2_wedding.3010.desc.murder_attempt:0 "Uma vez eu tentei... foi terrível."
 ep2_wedding.3010.desc.non_believer:0 "Eu posso... Eu não posso acreditar nisso."
 ep2_wedding.3010.desc.witch:0 "Eu conheço as ervas certas, as palavras certas..."
 ep2_wedding.3010.t:0 "Confissões"
 ep2_wedding.3020.a:0 "Apenas... Eu não quero ouvir."
 ep2_wedding.3020.b:0 "Eu entendo."
 ep2_wedding.3020.c:0 "#EMP Hah!#! Você não vai acreditar nisso, mas..."
 ep2_wedding.3020.desc:0 "[my_spouse.GetTitledFirstName] tem sorrido o dia todo, celebrando a cerimônia e mostrando o quão virtuoso [my_spouse.GetSheHe] é em conversas amigáveis. A conversa parece nunca ter fim e, depois de passarmos um tempo decente em nosso quarto de casal agora compartilhado, sinto a vontade de me inclinar e beijar [my_spouse.GetSheHe]...\n\nMas não é nada como eu esperava. Os lábios [my_spouse.GetHerHim] estão secos, seus movimentos desanimados. Eu me afasto e olho nos olhos [my_spouse.GetHerHim], inquirindo.\n\n\"Eu...,\" diz [my_spouse.GetSheHe], respirando fundo, \"tenho gostos diferentes...\""
 ep2_wedding.3020.t:0 "Desinteresse"
 ep2_wedding.3030.a.tt:0 "Isso concederá um bônus dos [schemes|E] de [GetScheme('courting').GetTypeName] contra [my_spouse.GetShortUIName]"
 ep2_wedding.3030.a:0 "\"#EMP Você#! é o meu maior presente.\""
 ep2_wedding.3030.artifact_tt:0 "Você se tornará o proprietário de [love_memento.GetName]"
 ep2_wedding.3030.b.tt:0 "Isso concederá um bônus dos [schemes|E] de [GetScheme('seduce').GetTypeName] contra [my_spouse.GetShortUIName]"
 ep2_wedding.3030.b:0 "\"Eu também tenho algo para você...\""
 ep2_wedding.3030.c:0 "\"Na verdade... eu também tenho algo para você.\""
 ep2_wedding.3030.d:0 "\"#EMP Hah!#! Você não vai me pegar com um truque desses!\""
 ep2_wedding.3030.desc:0 "O fogo na lareira começou a enfraquecer, e eu encaro suas chamas em silêncio. A luz, o calor. [my_spouse.GetTitledFirstName] está procurando algo em seu baú de madeira, e eu desvio os olhos das chamas para olhar para [my_spouse.GetSheHe].\n\n\"[ROOT.Char.GetFirstNameNoTooltip],\" diz [my_spouse.GetSheHe], me oferecendo um pequeno pacote, envolto em seda, \"eu guardei isso desde que soube de nosso noivado, e agora eu o ofereço a você como um símbolo do meu amor.\""
 ep2_wedding.3030.t:0 "Uma Noite para Recordar"
 ep2_wedding.3040.a.failure:0 "Você se machuca ao tentar salvar [my_spouse.GetFirstNameNoTooltip]"
 ep2_wedding.3040.a.success:0 "Você salva [my_spouse.GetFirstNameNoTooltip] das chamas!"
 ep2_wedding.3040.a:0 "Eu preciso salvar [my_spouse.GetFirstNameNoTooltip]!"
 ep2_wedding.3040.b.failure:0 "[my_spouse.GetFirstNameNoTooltip] se machuca pelo fogo"
 ep2_wedding.3040.b.success:0 "[my_spouse.GetFirstNameNoTooltip] se salva das chamas"
 ep2_wedding.3040.b:0 "Eu preciso me salvar #EMP a mim mesmo#!!"
 ep2_wedding.3040.c.success:0 "Você mostra sua força ao salvar [my_spouse.GetFirstNameNoTooltip]"
 ep2_wedding.3040.c:0 "Este é o meu momento de brilhar!"
 ep2_wedding.3040.d.failure:0 "[my_spouse.GetFirstNameNoTooltip] morre"
 ep2_wedding.3040.d.flavor:0 "Ao fogo com você, querid[Select_CString( my_spouse.IsFemale, 'a', 'o' )] #EMP [my_spouse.GetWifeHusband]#!!"
 ep2_wedding.3040.d.success:0 "[my_spouse.GetFirstNameNoTooltip] sobrevive à sua tentativa de assassinato"
 ep2_wedding.3040.d:0 "Esta seria a oportunidade perfeita para me livrar de [my_spouse.GetShortUINameNoTooltip]..."
 ep2_wedding.3040.desc:0 "Ah, como é macia a pele de [my_spouse.GetTitledFirstName], como é deliciosa a fragrância de seus cabelos! Certamente, minha noite de núpcias está indo exatamente como eu esperava, e rapidamente nos entregamos ao pecado carnal.\n\nTal é nossa paixão que, sem prestar atenção às velas que iluminam escassamente o quarto, acidentalmente derrubo uma com o pé: 'Não pare, meu querido!'\n\nMas [ROOT.Char.GetFaith.HighGodName] tem planos diferentes para nós, e o colchão de feno é rapidamente incendiado."
 ep2_wedding.3040.t:0 "Uma Noite Ardente"
 ep2_wedding.3050.a.failure:0 "[intent_victim.GetFirstNameNoTooltip] sobrevive"
 ep2_wedding.3050.a.success:0 "Você mata [intent_victim.GetFirstNameNoTooltip]"
 ep2_wedding.3050.a:0 "Agora, é o momento!"
 ep2_wedding.3050.b.failure:0 "[intent_victim.GetFirstNameNoTooltip] fica desconfiado do incidente"
 ep2_wedding.3050.b.success:0 "A lâmpada mata [intent_victim.GetFirstNameNoTooltip]"
 ep2_wedding.3050.b:0 "A corda da lâmpada parece extremamente fraca esta noite..."
 ep2_wedding.3050.c.tt:0 "Você ganha um bônus significativo para os [schemes|E] de [GetScheme('murder').GetTypeName] direcionados a este personagem"
 ep2_wedding.3050.c:0 "Se eu seguir [intent_victim.GetSheHe], saberei onde [intent_victim.GetSheHe] dorme..."
 ep2_wedding.3050.desc:0 "A noite já se foi e os convidados começam a sair depois que o casal parte para assuntos mais... privados. Eu observo [intent_victim.GetTitledFirstName] pelo salão e faço um esforço para não sair da sala até que #EMP [intent_victim.GetSheHe]#! o faça.\n\nUm cavaleiro estrangeiro sai para rezar e ficamos apenas nós dois.\n\n\"Bem, também está na hora de eu ir,\" diz [intent_victim.GetFirstNameNoTooltip], levantando-se de sua cadeira.\n\nUma lâmpada prateada paira sobre a cabeça [intent_victim.GetHerHim] como uma língua de fogo."
 ep2_wedding.3050.t:0 "O Que Paira Acima"
 ep2_wedding.3200.a.flavor:0 "Rápido, tranque a porta!"
 ep2_wedding.3200.a:0 "Vamos ficar a sós no quarto!"
 ep2_wedding.3200.b:0 "Suponho que seja esperado de mim..."
 ep2_wedding.3200.both:0 "Conforme o banquete atingia seu ápice, [my_spouse.GetFirstName] e eu trocávamos olhares aflitos, revelando nossos sentimentos mútuos em relação à iminente cerimônia de consumação...\n\nConforme a procissão nos leva para nossos aposentos, ofereço esperançoso: \"[ROOT.Char.Custom('WifeHusband')|U], não #EMP precisamos#! fazer isso, sabe?\" sobre os gritos e tambores."
 ep2_wedding.3200.c.failure:0 "[my_spouse.GetFirstNameNoTooltip] se recusa"
 ep2_wedding.3200.c.success:0 "[my_spouse.GetFirstNameNoTooltip] está convencido(a)"
 ep2_wedding.3200.c:0 "Por favor, querido(a), não podemos mantê-los afastados?"
 ep2_wedding.3200.closing:0 "\n\nAs portas estão se aproximando rapidamente, os gritos da festa atingindo o ápice; a cerimônia está prestes a começar."
 ep2_wedding.3200.d.failure:0 "[my_spouse.GetFirstNameNoTooltip] está chateado(a)"
 ep2_wedding.3200.d.success:0 "[my_spouse.GetFirstNameNoTooltip] cede"
 ep2_wedding.3200.d:0 "Venha querido(a), ficará tudo bem."
 ep2_wedding.3200.e:0 "Não seja bobo(a), é tradição!"
 ep2_wedding.3200.other:0 "Conforme o banquete atingia seu ápice, a crescente ansiedade de [shy_spouse.GetFirstNamePossessive] em relação à iminente cerimônia de consumação era evidente.\n\n[Select_CString( shy_spouse.IsFemale, 'Minha nova', 'Meu novo' )] [shy_spouse.Custom('WifeHusband')] se vira para mim enquanto a procissão parte para nossos aposentos, suplicando: \"Por favor, não podemos abrir mão disso...?\" em meio aos gritos e tambores."
 ep2_wedding.3200.self:0 "Conforme o banquete atingia seu ápice, fico cada vez mais ansioso antecipando a cerimônia de consumação, e está claro que [my_spouse.GetFirstName] não compartilha nenhuma das minhas preocupações.\n\n[my_spouse.GetSheHe|U] se vira para mim enquanto a procissão nos leva para nossos aposentos, rindo: \"Você parece um fantasma, [ROOT.Char.Custom('WifeHusband')]! Relaxe!\" em meio aos gritos e tambores."
 ep2_wedding.3200.t:0 "Compromissos Cerimoniais"
 ep2_wedding.3300.a.failure:0 "[my_spouse.GetFirstNameNoTooltip] está enojad[Select_CString( my_spouse.IsFemale, 'a', 'o' )]"
 ep2_wedding.3300.a.success:0 "[Select_CString( my_spouse.IsFemale, 'Sua', 'Seu' )] [my_spouse.GetWifeHusband] está lisonjead[Select_CString( my_spouse.IsFemale, 'a', 'o' )]"
 ep2_wedding.3300.a:0 "Venha aqui, esperei por isso a noite toda!"
 ep2_wedding.3300.anointing:0 "antes de nos acomodar, nos ungindo de acordo com a moda [officiant.GetFaith.GetAdjectiveNoTooltip]."
 ep2_wedding.3300.b.failure:0 "[my_spouse.GetFirstNameNoTooltip] está aliviad[Select_CString( my_spouse.IsFemale, 'a', 'o' )]"
 ep2_wedding.3300.b.success:0 "Você insulta [Select_CString( my_spouse.IsFemale, 'sua', 'seu' )] [my_spouse.GetWifeHusband]"
 ep2_wedding.3300.b:0 "Oh — #EMP BOCEJO#! — de repente estou com sono..."
 ep2_wedding.3300.blessing:0 "[officiant.GetCouncilTitleFirstName] abençoa nossa cama matrimonial"
 ep2_wedding.3300.c.failure:0 "[my_spouse.GetFirstNameNoTooltip] está ofendid[Select_CString( my_spouse.IsFemale, 'a', 'o' )]"
 ep2_wedding.3300.c.success:0 "[Select_CString( my_spouse.IsFemale, 'Sua', 'Seu' )] [my_spouse.GetWifeHusband] concorda"
 ep2_wedding.3300.c:0 "Acho que vou precisar de mais vinho para isso!"
 ep2_wedding.3300.d.failure:0 "Você e [my_spouse.GetFirstNameNoTooltip] seguem em frente como se estivessem cumprindo um dever"
 ep2_wedding.3300.d.success:0 "Ambos se divertem mesmo que relutantemente"
 ep2_wedding.3300.d:0 "Pela minha dinastia, farei isso..."
 ep2_wedding.3300.decorate:0 "[officiant.GetCouncilTitleFirstName] enfeita nossa cama com flores e guirlandas"
 ep2_wedding.3300.fallback:0 "A porta se fecha atrás do último dos espectadores, a festa barulhenta continua pelo corredor, embora as famílias estejam certamente ouvindo."
 ep2_wedding.3300.family:0 "Antes da porta se fechar, [my_spouse.GetFirstNamePossessiveNoTooltip] [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('family'))], [family.GetFirstName], chora, '#EMP '[Select_CString( my_spouse.IsFemale, 'garotona', 'garotão' )]!#!'"
 ep2_wedding.3300.family_self:0 "Antes da porta se fechar, meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family'))], [family.GetFirstName], chora, '#EMP '[Select_CString( ROOT.Char.IsFemale, 'garotona', 'garotão' )]!#!'"
 ep2_wedding.3300.flowers:0 "A festa nos deposita em nossa cama coberta de guirlandas e flores"
 ep2_wedding.3300.friend:0 "Seguramos as mãos um do outro enquanto a festa se retira, não poderia haver melhor combinação.\n\n"
 ep2_wedding.3300.friendly:0 "Nos viramos para nos olhar, ambos tensos de expectativa, e a festa se retira.\n\n"
 ep2_wedding.3300.hatred:0 "[Select_CString( my_spouse.IsFemale, 'Minha nova', 'Meu novo' )] [my_spouse.GetWifeHusband] se vira, fazendo uma careta de repulsa enquanto a festa parte.\n\n"
 ep2_wedding.3300.jester:0 "Antes da porta se fechar, o bobo da corte de [my_spouse.GetFirstNamePossessiveNoTooltip], [jester.GetFirstName], faz gestos obscenos, rosnando e latindo como um cão."
 ep2_wedding.3300.jester_self:0 "Antes da porta se fechar, meu bobo da corte, [jester.GetFirstName], faz gestos obscenos, rosnando e latindo como um cão."
 ep2_wedding.3300.lover:0 "Nos olhamos felizes enquanto a festa começa a sair, finalmente sozinhos!\n\n"
 ep2_wedding.3300.opening:0 "[my_spouse.GetFirstName] e eu somos conduzidos às câmaras pela animada festa de casamento, os gritos e risadas ecoantes anunciam a cerimônia de consumação.\n\n"
 ep2_wedding.3300.other_friend:0 "Antes da porta se fechar, [my_spouse.GetFirstNamePossessiveNoTooltip] [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('friend'))], [friend.GetTitledFirstName] sorri, 'Boa sorte!'"
 ep2_wedding.3300.other_friend_self:0 "Antes da porta se fechar, meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('friend'))], [friend.GetTitledFirstName], sorri, \"Boa sorte!\""
 ep2_wedding.3300.other_spouse:0 "Antes da porta se fechar, [my_spouse.GetFirstNamePossessiveNoTooltip] [my_spouse.Custom2('RelationToMeShort', SCOPE.sC('other_spouse'))], [other_spouse.GetFirstName], nos lança um último olhar ferido."
 ep2_wedding.3300.other_spouse_self:0 "Antes da porta se fechar, meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_spouse'))], [other_spouse.GetFirstName], nos lança um último olhar ferido."
 ep2_wedding.3300.polite:0 "Me viro para [my_spouse.GetFirstNameNoTooltip] enquanto a festa parte. \"Então... [my_spouse.GetWifeHusband]... !\"\n\n"
 ep2_wedding.3300.t:0 "Deitados"
 ep2_wedding.3300.unfriendly:0 "[Select_CString( my_spouse.IsFemale, 'Minha nova', 'Meu novo' )] [my_spouse.GetWifeHusband] não parece tão entusiasmado(a) enquanto a festa parte.\n\n"
 ep2_wedding.3300.wine:0 "antes de nos acomodar, derramando xícaras de vinho apimentado e forte, e nos orientando a bebê-las."
 ep2_wedding.3400.a:0 "Isso me lembra, eu preciso da sua opinião!"
 ep2_wedding.3400.b.failure:0 "Eles são apenas educados"
 ep2_wedding.3400.b.success:0 "Eles se deram muito bem"
 ep2_wedding.3400.b.tt:0 "Alquimia Instantânea"
 ep2_wedding.3400.b:0 "Oh! M[Select_CString( my_family_suitor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', my_family_suitor)] iria adorar você!"
 ep2_wedding.3400.c.drink:0 "Mais cerveja! Mais!"
 ep2_wedding.3400.c.hashish:0 "Mais haxixe! Mais!"
 ep2_wedding.3400.d:0 "Devemos manter contato, agora somos família!"
 ep2_wedding.3400.drink:0 "que acabou de quase engasgar com sua [host.Custom('RegionalAlcoholicDrink')] de tanto rir.\n\n"
 ep2_wedding.3400.drink_family:0 "[other_family_relative.GetSheHe|U] diz embriagad[Select_CString( other_family_relative.IsFemale, 'a', 'o' )]: 'Admito! S[Select_CString( my_family_spouse.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', my_family_spouse)] é uma ó- #EMP HIC#! tima combinação para [Select_CString( other_family_spouse.IsFemale, 'a minha', 'o meu' )] [other_family_relative.Custom2('RelationToMeShort', other_family_spouse)]! Q- #EMP HIC#! que sejam felizes!'"
 ep2_wedding.3400.drink_house:0 "[other_family_relative.GetSheHe|U] diz embriagad[Select_CString( other_family_relative.IsFemale, 'a', 'o' )]: 'Ei- #EMP HIC#! Sabe, eu não tinha certeza sobre o tipo de pessoa da sua família [ROOT.Char.GetHouse.GetBaseNameNoTooltip], ma- #EMP HIC#! mas você é legal!'"
 ep2_wedding.3400.drink_self:0 "Horas depois, me vejo olhando embaçadamente para o meu cálice, observando [other_family_relative.GetTitledFirstName], [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)] do(a) [other_family_spouse.Custom('GetBrideGroom')],"
 ep2_wedding.3400.e.failure:0 "[other_family_relative.GetFirstNameNoTooltip] se afasta"
 ep2_wedding.3400.e.success:0 "[other_family_relative.GetFirstNameNoTooltip] se derrete"
 ep2_wedding.3400.e:0 "Diga-me, todos os(as) [other_family_relative.GetHouse.GetBaseNameNoTooltip] [other_family_relative.GetWomenMen] são tão bonitos(as) assim?"
 ep2_wedding.3400.fallback:0 "que boceja satisfeito(a).\n\n"
 ep2_wedding.3400.fallback_self:0 "Horas depois, me vejo piscando para [other_family_relative.GetTitledFirstName], [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)] do(a) [other_family_spouse.Custom('GetBrideGroom')],"
 ep2_wedding.3400.family:0 "Finalmente [other_family_relative.GetSheHe] diz: 'Admito! S[Select_CString( my_family_spouse.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', my_family_spouse)] é uma ótima combinação para [Select_CString( other_family_spouse.IsFemale, 'a minha', 'o meu' )] [other_family_relative.Custom2('RelationToMeShort', other_family_spouse)]! Que sejam felizes!'"
 ep2_wedding.3400.hashish:0 "que acabou de tossir incontrolavelmente de tanto rir.\n\n"
 ep2_wedding.3400.hashish_self:0 "Horas depois, me vejo olhando através da fumaça, de forma turva, para [other_family_relative.GetTitledFirstName], [other_family_spouse.Custom2('RelationToMeShort', other_family_relative)] do(a) [other_family_spouse.Custom('GetBrideGroom')],"
 ep2_wedding.3400.house:0 "Finalmente [other_family_relative.GetSheHe] diz: 'Eu não tinha certeza sobre o tipo de pessoa da sua família [ROOT.Char.GetHouse.GetBaseNameNoTooltip], mas você é legal!'"
 ep2_wedding.3400.opening:0 "Com os recém-casados se retirando para a noite, as brasas são acesas, as jarras são enchidas e os músicos são convocados para festividades que se estendem pela noite adentro.\n\n"
 ep2_wedding.3400.t:0 "Um Encontro de Casas"
 ep2_wedding.3400.tt:0 "Conversa Esclarecedora"
 ep2_wedding.3410.a.flavor:0 "Essas portas não vão me deter!"
 ep2_wedding.3410.a:0 "Vou deixá-los saber como me sinto!"
 ep2_wedding.3410.b.tt:0 "Esquema receberá o [GetModifier('wedding_consorts_envy_modifier').GetNameWithTooltip]"
 ep2_wedding.3410.b:0 "[jealousy_focus.GetFirstNameNoTooltip] é #EMP m[Select_CString( jealousy_focus.IsFemale, 'inha', 'eu' )]!#!"
 ep2_wedding.3410.c:0 "Meu coração está partido..."
 ep2_wedding.3410.d:0 "Menos atenção de [jealousy_focus.GetFirstNameNoTooltip] pode ter suas vantagens."
 ep2_wedding.3410.double:0 "Ambos são queridos para mim, mas temo que mudanças possam surgir na aurora, no calor de suas afeições, enquanto estou embriagado(a) na atmosfera festiva."
 ep2_wedding.3410.double_opinion:0 "\n\n\"E quanto a mim? Maldita seja essa agonizante tríade..."
 ep2_wedding.3410.indifferent_opinion:0 "\n\nEu devo cuidar da minha posição, antes que ess[Select_CString( jealousy_focus.IsFemale, 'a', 'e' )] [jealousy_usurper.Custom2('InsultNoun', ROOT.Char)] o faça por mim."
 ep2_wedding.3410.lover:0 "[Select_CString( jealousy_focus.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', jealousy_focus)] desfruta do toque de outra pessoa - eu sei que [jealousy_focus.GetSheHe] tem responsabilidades, mas isso não ameniza as farpas que ferem meu coração."
 ep2_wedding.3410.negative_opinion:0 "\n\nAh, o que eu me importo?! Por que ess[Select_CString( jealousy_focus.IsFemale, 'a', 'e' )] [jealousy_focus.Custom2('InsultNoun', ROOT.Char)] me incomoda tanto..."
 ep2_wedding.3410.opening:0 "As portas se fecham atrás dos recém-casados, risos abafados e gritinhos ecoando pelos corredores. Eu desabo novamente no salão do banquete, incapaz de parar de pensar em [jealousy_focus.GetFirstName] e [jealousy_usurper.GetFirstName]...\n\n"
 ep2_wedding.3410.positive_opinion:0 "\n\n[jealousy_focus.GetSheHe|U] não vai se esquecer de mim... ou vai...?"
 ep2_wedding.3410.primary:0 "Eu sei que ainda sou [Select_CString( ROOT.Char.IsFemale, 'a primeira', 'o primeiro' )] e principal [ROOT.Char.GetWifeHusband] de [jealousy_focus.GetFirstName], mas temo o que o gosto de um(a) novo(a) [jealousy_usurper.GetWomanMan] pode trazer."
 ep2_wedding.3410.secondary:0 "Outr[Select_CString( jealousy_usurper.IsFemale, 'a', 'o' )] [jealousy_usurper.GetWifeHusband] para a coleção de [jealousy_focus.GetFirstName], outra competidora pelo tempo e afeto [jealousy_focus.GetHerHim]."
 ep2_wedding.3410.t:0 "Competição Fresca"
 ep2_wedding.3420.a:0 "Melhor ter algum [ROOT.Char.Custom('RegionalEdibleMeat')] sobrando!"
 ep2_wedding.3420.b:0 "Finalmente, posso #EMP realmente#! me soltar!"
 ep2_wedding.3420.blab:0 "Cercad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por tantas pessoas, tenho feito o meu melhor para carregar o fardo do meu conhecimento sobre as más ações de [blab_guest.GetTitledFirstNamePossessive] sem deixar escapar, mas não sei por quanto tempo conseguirei aguentar!\n\n"
 ep2_wedding.3420.blab_self:0 "Cercad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por tantas pessoas, tenho feito o meu melhor para carregar o fardo dos meus segredos sem deixar escapar, mas não sei por quanto tempo conseguirei aguentar!\n\n"
 ep2_wedding.3420.c:0 "Agora então, onde está aquel[Select_CString( ROOT.Char.IsFemale, 'e', 'a' )] serviçal esbelt[Select_CString( ROOT.Char.IsFemale, 'o', 'a' )]?"
 ep2_wedding.3420.charity:0 "Durante todo o dia, senti culpa pela ostentação das celebrações, enquanto os pobres plebeus e servos do lado de fora lutam.\n\n"
 ep2_wedding.3420.closing:0 "O restante da noite é meu para aproveitar como eu quiser..."
 ep2_wedding.3420.d:0 "Não há melhor momento para vasculhar os aposentos..."
 ep2_wedding.3420.drink:0 "Muitos convidados já estão começando a próxima etapa da festa, incentivando os músicos e iniciando uma nova rodada de danças.\n\n"
 ep2_wedding.3420.e:0 "Finalmente, posso sair deste maldito lugar!"
 ep2_wedding.3420.eat:0 "Meus olhos são atraídos imediatamente para as mesas repletas de comida; os doces aromas dos alimentos restantes são quase impossíveis de resistir.\n\n"
 ep2_wedding.3420.f:0 "Esta noite, devo olhar para os pobres de [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]."
 ep2_wedding.3420.flee:0 "Enclausurad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] durante todo o dia, cercad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por estranhos à medida que a cerimônia e o banquete se arrastam interminavelmente; estou aliviad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por finalmente ter liberdade.\n\n"
 ep2_wedding.3420.g:0 "Eu pretendia falar com [social_guest.GetFirstNameNoTooltip]."
 ep2_wedding.3420.h:0 "Minha presença aqui hoje não deve ser ofuscada."
 ep2_wedding.3420.help:0 "Olhando para a multidão, eu me deleito com o calor de uma ocasião feliz, tirando forças dos rostos sorridentes e da harmonia - mas quem é essa figura curvada?\n\n"
 ep2_wedding.3420.i:0 "Este segredo está me consumindo, alguém precisa saber!"
 ep2_wedding.3420.j.tt:0 "Você descobrirá o segredo de alguém"
 ep2_wedding.3420.j:0 "Vamos ver o que os criados ouviram esta noite..."
 ep2_wedding.3420.k.drink:0 "Parece que [help_guest.GetFirstNameNoTooltip] bebeu demais..."
 ep2_wedding.3420.k.fallback:0 "Parece que o pobre [help_guest.GetFirstNameNoTooltip] está caindo no sono..."
 ep2_wedding.3420.k.flavor:0 "#EMP Vamos lá#! Por aqui..."
 ep2_wedding.3420.k.health:0 "Parece que o pobre [help_guest.GetFirstNameNoTooltip] precisa de ajuda..."
 ep2_wedding.3420.l.flavor:0 "[ROOT.Char.GetFaith.HighGodName], abençoe esta união e faça-a feliz."
 ep2_wedding.3420.l:0 "O [host.GetFaith.HouseOfWorship|l] estará calmo agora."
 ep2_wedding.3420.lech:0 "Com toda essa conversa sobre votos e cerimônias nupciais, minha mente imediatamente se volta para os atos inomináveis que o casal feliz deve estar cometendo agora.\n\n"
 ep2_wedding.3420.opening:0 "Os recém-casados se retiraram, conduzidos pelas famílias ao quarto para consumar sua união. O restante de nós retorna ao salão do banquete para nos alegrarmos e celebrarmos.\n\n"
 ep2_wedding.3420.posture:0 "Observando os diversos convidados, em seus trajes elegantes e pomposos, sinto a vontade de circular, fazendo minha presença ser conhecida por todos.\n\n"
 ep2_wedding.3420.pray:0 "Com as cerimônias concluídas e os votos proferidos, sou tomad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por preocupação e esperança pelo casal feliz; todas as futuras provações da parceria e da paternidade.\n\n"
 ep2_wedding.3420.scheme:0 "Observo os convidados movimentados, embriagados e empanturrados pelos festejos do dia, e me pergunto quais segredos suas línguas tortuosas revelaram hoje.\n\n"
 ep2_wedding.3420.social:0 "Apesar de ter sido apresentad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] a tantos rostos novos hoje, estou ansios[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] para conhecer mais convidados antes que essa oportunidade social inevitavelmente acabe.\n\n"
 ep2_wedding.3420.steal:0 "É uma luxuosa [host.Custom('FortifiedBuilding')] onde passamos a noite, e não consigo deixar de pensar em quais coisas não seriam sentidas falta por seus donos.\n\n"
 ep2_wedding.3420.t:0 "Na Noite"
 ep2_wedding.3500.a:0 "Temo que você esteja perto da verdade, [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_1)]..."
 ep2_wedding.3500.agree:0 "\n\n\"Acho que você está cert[Select_CString( my_family_relative_1.IsFemale, 'a', 'o' )] [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)],\" suspira [my_family_relative_2.GetFirstName]. \"Isso parece uma união desastrosa.\""
 ep2_wedding.3500.alliance:0 "\n\n\"Certamente você entende, [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)],\" repreende [my_family_relative_2.GetFirstName]. \"A aliança com a Casa [other_family_spouse.GetHouse.GetBaseNameNoTooltip] deve vir antes da felicidade [my_family_spouse.GetHerHim]."
 ep2_wedding.3500.b:0 "Confie em mim, é uma boa combinação."
 ep2_wedding.3500.beauty:0 "Você já viu a aparência [other_family_spouse.GetHerHim]? Estremeço ao pensar como [my_family_spouse.GetFirstName] cumprirá seu dever, ou como serão os rostos de seus descendentes..."
 ep2_wedding.3500.bold:0 "[other_family_spouse.GetFirstName] é teimoso(a), enquanto [my_family_spouse.GetSheHe] é submisso(a); [other_family_spouse.GetSheHe] terá [my_family_spouse.GetSheHe] sob seu controle."
 ep2_wedding.3500.compromise:0 "\n\n\"Ainda com suas dúvidas, [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)],\" repreende [my_family_relative_2.GetFirstName]. \"Compromisso é necessário na política."
 ep2_wedding.3500.criminal:0 "[other_family_spouse.GetSheHe|U] é um demônio; é tudo de que as pessoas têm falado a noite toda! Como permitimos nos vincular a ess[Select_CString( other_family_spouse.IsFemale, 'a', 'e' )] [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))]? Espero que pobre [my_family_spouse.GetFirstName] possa aguentar isso..."
 ep2_wedding.3500.d:0 "E daí? Deixe o amor para os bardos."
 ep2_wedding.3500.dishonorable:0 "Ess[Select_CString( other_family_spouse.IsFemale, 'a', 'e' )] [other_family_spouse.GetWomanMan] não tem honra; observei [other_family_spouse.GetSheHe] o dia todo; [other_family_spouse.GetSheHe] só trará miséria a [my_family_spouse.GetFirstName]."
 ep2_wedding.3500.dislike:0 "Ess[Select_CString( other_family_spouse.IsFemale, 'a', 'e' )] [other_family_spouse.Custom2('InsultAdjective', SCOPE.sC('my_family_relative_1'))] [other_family_spouse.GetWomanMan] agora é uma mancha na reputação de nossa família; [Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))] não fará bem algum a [my_family_spouse.GetFirstName]!"
 ep2_wedding.3500.e:0 "Agora está nas mãos de [ROOT.Char.GetFaith.HighGodName]."
 ep2_wedding.3500.faith:0 "Como podemos confiar em um[Select_CString( other_family_spouse.IsFemale, 'a', '' )] [my_family_relative_1.Custom2('GetUnbelieverTerm', other_family_spouse)] como [other_family_spouse.GetSheHe]? [other_family_spouse.GetSheHe] vai afastar [my_family_spouse.GetFirstName] de [my_family_relative_1.GetFaith.HighGodName]."
 ep2_wedding.3500.fallback:0 "Há algo estranho n[other_family_spouse.GetSheHe]. [other_family_spouse.GetSheHe|U] tem um olhar desajeitado... Você deve ter percebido? Espero que [my_family_spouse.GetFirstName] tenha percebido..."
 ep2_wedding.3500.fornicator:0 "[other_family_spouse.GetWomanMan] é conhecid[Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] como um[Select_CString( other_family_spouse.IsFemale, 'a', '' )] devass[Select_CString( other_family_spouse.IsFemale, 'a', 'o' )]; desonrad[Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] por inúmeros amantes; como podemos permitir esse dano ao nome de [my_family_spouse.GetFirstNamePossessive]? Pense nas calúnias, nos rumores, nas piadas!"
 ep2_wedding.3500.health:0 "[other_family_spouse.GetSheHe|U] é um peso doentio, incapaz de apoiar [my_family_spouse.GetFirstName] em suas provações e interesses. Não é prudente."
 ep2_wedding.3500.intro:0 "Cansados após um dia inteiro de espera e socialização, eu, [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_1)] e [ROOT.Char.Custom2('RelationToMeShort', my_family_relative_2)] nos acomodamos em uma mesa para refletir sobre a união."
 ep2_wedding.3500.intro_connector:0 "\n\n[my_family_relative_1.GetFirstName] fala em voz baixa: 'Você sabe,'"
 ep2_wedding.3500.intro_plural:0 "Cansados após um dia inteiro de espera e socialização, eu e meus [ROOT.Char.Custom2('GetFamilyRelationPlural', my_family_relative_1)] nos acomodamos em uma mesa para refletir sobre a união."
 ep2_wedding.3500.lowborn:0 "Um[Select_CString( other_family_spouse.IsFemale, 'a', '' )] [other_family_spouse.GetWomanMan] comum como [other_family_spouse.GetSheHe] está abaixo da dignidade desta família; [other_family_spouse.GetSheHe] envergonha [my_family_spouse.GetFirstName]."
 ep2_wedding.3500.old:0 "[other_family_spouse.GetFirstName] é muito velho, não há como [other_family_spouse.GetSheHe] conseguirá manter [my_family_spouse.GetSheHe] feliz. Essa é a verdade."
 ep2_wedding.3500.realms:0 "Essa união abre as portas para intrigas [other_family_spouse.GetHouse.GetHeadOfHouse.GetPrimaryTitle.GetAdjectiveNoTooltip] destruírem [my_family_spouse.GetHouse.GetHeadOfHouse.GetPrimaryTitle.GetNameNoTooltip] e a Casa [other_family_spouse.GetHouse.GetBaseNameNoTooltip] por dentro."
 ep2_wedding.3500.relation:0 "Devo dizer que ainda tenho dúvidas, estou preocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com [Select_CString( my_family_spouse.IsFemale, 'a minha', 'o meu' )] [my_family_relative_2.Custom2('RelationToMeShort', my_family_spouse)]."
 ep2_wedding.3500.relation_shared:0 "Estou preocupad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com [Select_CString( my_family_spouse.IsFemale, 'a nossa', 'o nosso' )] [my_family_relative_1.Custom2('RelationToMeShort', my_family_spouse)] - verdadeiramente estou."
 ep2_wedding.3500.renown:0 "Ess[Select_CString( other_family_spouse.IsFemale, 'a', 'e' )] [other_family_spouse.GetHouse.GetBaseNameNoTooltip] [other_family_spouse.Custom2('InsultNoun', SCOPE.sC('my_family_relative_1'))] provincian[Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] está abaixo da dignidade de uma casa tão grandiosa como a Casa [my_family_spouse.GetHouse.GetBaseNameNoTooltip]; [other_family_spouse.GetSheHe] mancha [my_family_spouse.GetFirstName] apenas com sua associação..."
 ep2_wedding.3500.shy:0 "[other_family_spouse.GetFirstName] é tão dócil como um cordeiro, o que um[Select_CString( other_family_spouse.IsFemale, 'a', '' )] [other_family_spouse.GetWomanMan] como esse(a) pode oferecer a um(a) [my_family_spouse.GetWomanMan] como [my_family_spouse.GetSheHe]?"
 ep2_wedding.3500.t:0 "Dúvidas Dinásticas"
 ep2_wedding.3500.time:0 "\n\n\"Venha [my_family_relative_2.Custom2('RelationToMeShort', my_family_relative_1)],\" suspira [my_family_relative_2.GetFirstName]. \"Dê tempo! Conceda-lhes um mês juntos antes de emitir julgamentos tão definitivos."
 ep2_wedding.3500.young:0 "[other_family_spouse.GetFirstName] é jovem demais para [my_family_spouse.GetSheHe]. Isso tudo vai acabar em lágrimas."
 ep2_wedding.4000.a.failure:0 "[matchmaked_scope.GetFirstNameNoTooltip] se recusa a ouvir"
 ep2_wedding.4000.a.success:0 "[matchmaked_scope.GetFirstNameNoTooltip] segue o seu conselho"
 ep2_wedding.4000.a:0 "Por que você não segue o exemplo deles com [objective_scope.GetShortUINameNoTooltip]?"
 ep2_wedding.4000.b.success:0 "[matchmaked_scope.GetFirstNameNoTooltip] conversa com [objective_scope.GetFirstNameNoTooltip]"
 ep2_wedding.4000.b:0 "[objective_scope.GetShortUINameNoTooltip] parece muito solitário(a)..."
