 spouse_1:0 "Cônjuge"
 spouse_1_desc:0 "Um [GetActivityType('activity_wedding').GetName] celebra a união de dois [spouses|E]. Eles são parte fundamental da atividade, que não pode ser organizada a menos que um [GetActivityType('activity_wedding').GetNameNoTooltip] tenha sido [grand_wedding_promised|E] a um casal no momento do [betrothal|E].\n\nOs cônjuges sempre aceitarão um convite para o casamento deles e receberão recompensas específicas ao final da atividade.\n"
 spouse_1_desc_for_host:0 "$spouse_1_desc$"
 spouse_1_for_host:0 "$spouse_1$"
 spouse_2:0 "$spouse_1$"
 spouse_2_desc:0 "$spouse_1_desc$"
 spouse_2_desc_for_host:0 "$spouse_2_desc$"
 spouse_2_for_host:0 "$spouse_2$"
 wedding_decoration_bad:0 "Flores Silvestres"
 wedding_decoration_bad_desc:0 "$EFFECT_LIST_BULLET$ Ganho de [GetTrait('lifestyle_reveler').GetName(GetNullCharacter)] [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Redução no ganho de [opinion|E] com seus [vassals|E] [GetVassalStance('courtly').GetName]\n\n#weak Bela decoração com flores recém-colhidas e uma equipe modesta de cozinheiros e servidores.#!"
 wedding_decoration_good:0 "Prata e Ouro"
 wedding_decoration_good_desc:0 "$EFFECT_LIST_BULLET$ Aumento no ganho de [opinion|E] com seus [vassals|E] [GetVassalStance('courtly').GetName]\n$EFFECT_LIST_BULLET$ [dynasty_prestige|E] e [prestige|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Ganhe [GetModifier('gwedding_magnificent_host_modifier').GetNameWithTooltip|L]\n\n#weak Uma exibição desavergonhada de riquezas ilimitadas e servos suficientes para que cada convidado tenha seu copeiro pessoal!#!"
 wedding_decoration_normal:0 "Guirlandas e Tochas"
 wedding_decoration_normal_desc:0 "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ Ganho médio de [opinion|E] com seus [vassals|E] [GetVassalStance('courtly').GetName]\n$EFFECT_LIST_BULLET$ Ganhe [GetModifier('gwedding_gracious_host_modifier').GetNameWithTooltip|L]\n\n#weak Decorações tradicionais e servos suficientes para que nenhum cálice fique vazio.#!"
 wedding_entertainment_bad:0 "Entretenimento Doméstico"
 wedding_entertainment_bad_desc:0 "$EFFECT_LIST_BULLET$ Redução no ganho de [prestige|E]\n\n#weak Artistas presentes na corte diariamente, como bobos da corte e malabaristas, estarão presentes no casamento.#!"
 wedding_entertainment_good:0 "Trovadores e Criaturas Exóticas"
 wedding_entertainment_good_desc:0 "$EFFECT_LIST_BULLET$ [GetTrait('lifestyle_reveler').GetName(GetNullCharacter)] [trait_level_track_xp|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Aumento no ganho de [prestige|E]\n\n#weak Somente os melhores artistas e as criaturas mais raras!#!"
 wedding_entertainment_normal:0 "Acrobatas e Músicos"
 wedding_entertainment_normal_desc:0 "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ Ganho médio de [prestige|E]\n\n#weak Os artistas básicos em qualquer corte respeitável.#!"
 wedding_every_other_vassal:0 "Todo outro vassalo"
 wedding_food_bad:0 "Banquete Modesto"
 wedding_food_bad_desc:0 "$EFFECT_LIST_BULLET$ Redução no ganho de [opinion|E] com todos os personagens presentes\n\n#weak Um banquete que atende às expectativas, mas nada memorável.#!"
 wedding_food_good:0 "Refeição Gigantesca"
 wedding_food_good_desc:0 "$EFFECT_LIST_BULLET$ Bônus na redução de [stress|E]\n$EFFECT_LIST_BULLET$ Bônus na [health|E]\n$wedding_good_option_desc$\n$EFFECT_LIST_BULLET$ Aumento no ganho de [opinion|E] com todos os personagens presentes\n\n#weak As mesas vão gemer com o peso de toda essa comida!#!"
 wedding_food_normal:0 "Banquete Generoso"
 wedding_food_normal_desc:0 "$wedding_normal_option_desc$\n$EFFECT_LIST_BULLET$ Ganho médio de [opinion|E] com todos os personagens presentes\n\n#weak Um banquete adequado que agradará todos os convidados.#!"
 wedding_good_option_desc:0 "$EFFECT_LIST_BULLET$ [vassals|E] [GetVassalStance('glory_hound').GetName] e [GetVassalStance('courtly').GetName] ganharão mais [opinion|E] de você"
 wedding_need_to_be_valid:0 "Ambos os personagens prometidos precisam ser adultos e prontos para casar"
 wedding_need_to_promise:0 "Você precisa ter [grand_wedding_promised|E] um [GetActivityType('activity_wedding').GetName] para poder organizá-lo!"
 wedding_normal_option_desc:0 "$EFFECT_LIST_BULLET$ [vassals|E] [GetVassalStance('parochial').GetName] e [GetVassalStance('zealot').GetName] ganharão mais [opinion|E] de você"
 wedding_option_decoration:0 "Local do Casamento"
 wedding_option_entertainment:0 "Entretenimento"
 wedding_option_food:0 "Comida e Bebidas"
 wedding_phase_banquet:0 "Banquete de Casamento"
 wedding_phase_banquet_desc:0 "Um banquete para celebrar a nova união: comida, bebida e entretenimento são oferecidos em abundância."
 wedding_phase_ceremony:0 "Cerimônia de Casamento"
 wedding_phase_ceremony_desc:0 "Todos os rituais e preparativos que antecedem a troca de votos que tornam o casamento oficial."
 wedding_phase_wnight:0 "Noite de Núpcias"
 wedding_phase_wnight_desc:0 "Enquanto os cônjuges consumam o casamento, os demais convidados aproveitam o fim da festa."
 wedding_type_bloody:0 "Casamento Sangrento"
 wedding_type_bloody_desc:0 "Você irá assassinar a outra família.\n#weak Você não está organizando um casamento, está planejando um funeral.#!\n\n@warning_icon! #X Você não poderá sediar um [GetActivityType('activity_wedding').GetName] Sangrento por 15 anos#!\n@warning_icon! #X Mirar no seu [liege|E] ou [head_of_faith|E] terá penalidades maiores#!\n\n@alert_icon!#alert_trial Personagens com os traços [GetTrait('just').GetName(GetNullCharacter)], [GetTrait('compassionate').GetName(GetNullCharacter)] e [GetTrait('calm').GetName( GetNullCharacter )] ganharão [stress|E]#!"
 wedding_type_normal:0 "Casamento Grandioso"
 wedding_type_normal_desc:0 "\n#weak Um casamento deve ser uma celebração magnífica da união de dois cônjuges, mas também de duas famílias.#!\n\n@warning_icon! #X Um [GetActivityType('activity_wedding').GetName] prometido deve ser organizado antes que a promessa expire, ou você incorrerá em penalidades#!"
