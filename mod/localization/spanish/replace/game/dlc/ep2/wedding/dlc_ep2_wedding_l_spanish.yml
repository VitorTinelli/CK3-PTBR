l_spanish:
 WEDDING_BASE_COST:0 "Custo Base do Casamento Magnífico"
 activity_wedding:0 "Grande Casamento"
 activity_wedding_conclusion_characters_header:0 "O Casal Recém-casado"
 activity_wedding_conclusion_desc:0 "O [GetActivityType('activity_wedding').GetName] foi concluído"
 activity_wedding_desc:0 "Uma celebração grandiosa da união de um casal.\n\nNo entanto, este não é apenas um casamento; é um show público de influência e um evento social onde a nobreza se reúne para praticar as artes da diplomacia, sedução e assassinato - ou para tomar uma bebida com os amigos!"
 activity_wedding_destination_selection:0 ""
 activity_wedding_guest_desc:0 "$BULLET_WITH_TAB$[prestige_i|E][prestige|E]\n$BULLET_WITH_TAB$Opinião do Anfitrião e dos Cônjuges\n$BULLET_WITH_TAB$Pode perder [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$Pode ganhar [GetModifier('wedding_of_the_century_modifier').GetNameWithTooltip|L]\n$BULLET_WITH_TAB$Pode ganhar [GetTrait('lifestyle_reveler').GetName(GetNullCharacter)] [trait_level_track_xp|E]"
 activity_wedding_guest_help_text:0 "\nOs convidados do casamento participam das celebrações, prontos para se impressionar com a grandiosidade do evento e ficar impressionados com os cônjuges e o anfitrião! Casamentos são eventos sociais e políticos, cheios de oportunidades para interagir e fazer conexões significativas com os convidados."
 activity_wedding_host_desc:0 "$BULLET_WITH_TAB$Os [spouses|E] selecionados se [Concept('married', 'Casam')|E]\n$BULLET_WITH_TAB$Ganho de [prestige_i|E] [prestige|E]\n$BULLET_WITH_TAB$Ganho de [legitimacy_i] [legitimacy|E]\n$BULLET_WITH_TAB$[opinion|E] dos convidados\n$BULLET_WITH_TAB$[opinion|E] dos [vassals|E] [GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$BULLET_WITH_TAB$Pode ganhar [GetTrait('lifestyle_reveler').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$Pode perder [stress_loss_i][stress|E]\n$BULLET_WITH_TAB$Pode ganhar [GetModifier( 'gwedding_magnificent_host_modifier' ).GetNameWithTooltip|L]\n$BULLET_WITH_TAB$Pode ganhar [GetModifier( 'gwedding_gracious_host_modifier' ).GetNameWithTooltip|L]"
 activity_wedding_province_desc:0 ""
 activity_wedding_selection_tooltip:0 "Organize um [GetActivityType('activity_wedding').GetName], uma celebração magnífica da união de um casal\n\nRecompensas Antecipadas:\n$BULLET_WITH_TAB$[prestige_i] [prestige|E]\n$BULLET_WITH_TAB$[opinion_i] [opinion|E]\n$BULLET_WITH_TAB$Perda de [stress_loss_i] [stress|E]"
 activity_window_character_spouse_1:0 "[Character.Custom('GetBrideGroom')|U]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_spouse_2:0 "[Character.Custom('GetBrideGroom')|U]\n[Character.GetShortUINameNoTooltip|U]"
 banquet_mischief_intent:0 "Maldades"
 banquet_mischief_intent_desc:0 "Cause tumulto e aumente sua perda de [stress|E] com potenciais #EMP consequências#! desafortunadas."
 diplomatic_intent:0 "Diplomacia"
 diplomatic_intent_desc:0 "Obtenha uma aliança com o personagem selecionado ou até mesmo os impressione para que se submetam"
 ep2_wedding_promise_invalid_toast:0 "[spouse_1.GetShortUINameNoTooltip|U] e [spouse_2.GetShortUINameNoTooltip] não podem mais se casar; seu [grand_wedding_promised|E] [betrothal|E] é nulo"
 ep2_wedding_promise_lapsed_toast:0 "[spouse_1.GetShortUINameNoTooltip|U] e [spouse_2.GetShortUINameNoTooltip] não podem comparecer a um [GetActivityType( 'activity_wedding' ).GetName]; seu [grand_wedding_promised|E] [betrothal|E] caducou"
 every_cruel_vassal:0 "Todo vassalo cruel"
 matchmaking_intent:0 "Cupido"
 matchmaking_intent_desc:0 "Encontre um bom par para o personagem selecionado e organize um noivado"
 province_desc_wedding_capital:0 "\n#P + É a sua Capital#!\n#weak Isso resultará em um ganho de [gold_i] [gold|E].#!"
 province_desc_wedding_gardens:0 "\n#P + $building_royal_garden_01$#!\n#weak Isso resultará em um aumento no ganho de [dynasty_prestige_i] [dynasty_prestige|E] e na perda de [stress_loss_i] [stress|E].#!"
