l_spanish:
 building_legendary_hunting_lodge:0 "$building_type_legendary_hunting_lodge$"
 building_legendary_hunting_lodge_desc:0 "Este local tornou-se famoso por sua fauna estranha e lendária, e assim foi construída uma vasta cabana de caça aqui para fornecer conforto aos caçadores que buscam tornar seus nomes imortais."
 building_legendary_palace:0 "$building_type_legendary_palace$"
 building_legendary_palace_desc:0 "Um grande e vasto palácio com jardins e terrenos de caça circundantes. Esta luxuosa morada não só proporciona conforto e entretenimento a qualquer governante que nela permaneça, mas também funciona como um símbolo de status de riqueza e poder."
 building_legendary_shrine:0 "$building_type_legendary_shrine$"
 building_legendary_shrine_desc:0 "Este lugar de adoração não é apenas uma grande proeza de engenharia em si, mas também é um refúgio seguro para peregrinos e os devotos, e um testemunho da piedade de seu comissionário. Embora não seja considerado um local sagrado, a magnificência do edifício fez com que o condado se tornasse um grande centro religioso na região."
 building_legendary_statue:0 "$building_type_legendary_statue$"
 building_legendary_statue_desc:0 "A imagem de um governante lendário agora imortalizada em pedra. Este monumento não apenas celebra as grandes proezas de seu comissionário, mas qualquer um que o tenha em seu domínio reivindica a custódia da própria lenda."
 building_legendary_watchtower:0 "$building_type_legendary_watchtower$"
 building_legendary_watchtower_desc:0 "Este monumento de enormes torres não apenas é imponente em sua presença, mas também é uma fortaleza altamente defensável por si só e é usado para defender o reino contra invasores."
 building_type_legendary_hunting_lodge:0 "Cabana de Caça Lendária"
