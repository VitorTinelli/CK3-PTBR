 born_to_a_virgin_mother:0 "nascido de uma mãe virgem"
 born_under_auspicious_stars:0 "nascido sob estrelas auspiciosas"
 china:0 "Catai"
 consecrated_blood_legend:0 "O Sangue Sagrado"
 consecrated_blood_legend_desc:0 "O sangue de [founder.GetNamePossessive|U] flui por todos os membros da família [dynasty.GetName]. Nossa devoção a [founder.GetFaith.HighGodName|U] é absoluta e nossos feitos são realizados apenas em seu nome."
 dragon:0 "dragão"
 dyn_many_crown_legend:0 "A Soberania dos [dynasty.GetNameNoTooltip|U]"
 dyn_many_crown_legend_desc:0 "Seja por destino ou por desígnio, o poder cai nas mãos da [dynasty.GetName]. Nossas terras são vastas e nossos feitos grandiosos, e nosso domínio sobre os tronos do mundo é predestinado."
 ferocious_beast:0 "feroz besta"
 gain_heroic_legend_seed.tt:0 "Você ganha uma [legend_seed|E] Heroica"
 gain_holy_legend_seed.tt:0 "Você ganha uma [legend_seed|E] Sagrada"
 gain_legitimizing_legend_seed.tt:0 "Você ganha uma [legend_seed|E] Legitimadora"
 game_concept_ancestral_claim:0 "Reivindicação Ancestral"
 game_concept_ancestral_claim_desc:0 "O Casus Belli de Reivindicação Ancestral permite que você anexe todas as terras dentro de um título com o qual você tem uma reivindicação obtida através de uma [legend|E] Legitimadora."
 game_concept_legend:0 "Lenda"
 game_concept_legend_desc:0 "Uma $game_concept_legend$ representa as façanhas importantes que um Personagem alcançou na vida, e são criadas a partir de [legend_seeds|E].\n\nAs lendas são formas poderosas de obter [legitimacy|E], e outros possíveis prêmios como aumento de [skill|E], bônus de [opinion|E], [dynasty_prestige|E], [prestige|E] ou [piety|E]. [baronies|E] em que uma $game_concept_legend$ se espalhou também podem receber efeitos adicionais, se mantidas pelo dono da $game_concept_legend$ ou por um [legend_promoter|E].\n\n$game_concept_legends$ têm um [legend_type|E] que governa essas recompensas: elas podem ser Legitimadoras, Sagradas ou Heroicas. Cada $game_concept_legend$ também possui um nível de [legend_quality|E], que influencia a força dessas recompensas, bem como seu espalhamento."
 game_concept_legend_famed:0 "Famosa"
 game_concept_legend_famed_desc:0 "$game_concept_legend_quality_desc$"
 game_concept_legend_heroic:0 "Lenda Heroica"
 game_concept_legend_heroic_desc:0 "$game_concept_legend_type_desc$"
 game_concept_legend_holy:0 "Lenda Sagrada"
 game_concept_legend_holy_desc:0 "$game_concept_legend_type_desc$"
 game_concept_legend_i:0 "@legend_icon!"
 game_concept_legend_illustrious:0 "Ilustre"
 game_concept_legend_illustrious_desc:0 "$game_concept_legend_quality_desc$"
 game_concept_legend_legitimizing:0 "Lenda Legitimadora"
 game_concept_legend_legitimizing_desc:0 "$game_concept_legend_type_desc$"
 game_concept_legend_library:0 "Biblioteca de Lendas"
 game_concept_legend_library_desc:0 "A [legend_library|E] contém [legends|E] concluídas que se espalharam para seu [domain|E], que você criou ou estava promovendo ativamente.\nVocê também pode adicionar ativamente [legends|E] concluídas se estiver viajando pela área de disseminação da lenda.\n\nVocê pode remover [legends|E] de sua biblioteca a qualquer momento."
 game_concept_legend_library_i:0 "@legend_icon!"
 game_concept_legend_mythical:0 "Mítica"
 game_concept_legend_mythical_desc:0 "$game_concept_legend_quality_desc$"
 game_concept_legend_promoter:0 "Promotor de Lenda"
 game_concept_legend_promoter_desc:0 "Um $game_concept_legend_promoter$ é um [ruler|E] que apoia a [legend|E] de outro soberano.\n\nUm $game_concept_legend_promoter$ recebe bônus extras que variam dependendo do [legend_type|E] e [legend_quality|E] da $game_concept_legend$ em troca de uma contribuição mensal de [gold|E]."
 game_concept_legend_promoters:0 "Promotores de Lenda"
 game_concept_legend_promoters_desc:0 "$game_concept_legend_promoter_desc$"
 game_concept_legend_protagonist:0 "Protagonista da Lenda"
 game_concept_legend_protagonist_desc:0 "O $game_concept_legend_protagonist$ é o personagem principal de uma [legend|E], cujas façanhas são descritas lá. O proprietário de uma $game_concept_legend$ também pode ser seu $game_concept_legend_protagonist$, mas qualquer membro de sua família também pode — morto ou vivo, desde que tenha 16 anos.\n\n$game_concept_legend_protagonists$ não recebem bônus extras diretos, mas o conteúdo sobre a $game_concept_legend$ será focado neles. No entanto, eles concederão #color_white adicionais#! [legitimacy|E] ao Proprietário da Lenda, com base em quantos [traits|E] [Concept('virtuous', 'Virtuosos')|E] eles possuem.\n\nO $game_concept_legend_protagonist$ deve ser adulto, pois afirmar que um bebê matou um dragão pode ser controverso."
 game_concept_legend_protagonists:0 "Protagonistas da Lenda"
 game_concept_legend_protagonists_desc:0 "$game_concept_legend_protagonist_desc$"
 game_concept_legend_quality:0 "Qualidade da Lenda"
 game_concept_legend_quality_desc:0 "A Qualidade de uma [legend|E] marca tanto a força de seus efeitos e o alcance de sua disseminação, quanto afeta suas recompensas finais. $game_concept_legends$ podem ser Famosas, Ilustres ou Míticas — pois não existe tal coisa como uma $game_concept_legend$ comum.\n\nA Qualidade pode ser aumentada ao espalhar a Lenda para mais [baronies|E] e pagar um custo de upgrade.\n\nQuando o proprietário de uma $game_concept_legend$ morre, sua família pode continuar, sem prejuízo para sua Qualidade."
 game_concept_legend_seed:0 "Semente de Lenda"
 game_concept_legend_seed_desc:0 "Uma [legend|E] em formação. $game_concept_legend_seeds$ são a base de uma $game_concept_legend$ e, ao fundá-las, um [ruler|E] pode iniciar uma $game_concept_legend$.\n\n$game_concept_legend_seeds$ podem ser obtidas ao cumprir alguns critérios como ser o herdeiro de Carlos Magno ou realizando façanhas lendárias: Grandes [decisions|E], vencer uma [great_holy_war|E], tornar-se um [king|E] ou [emperor|E], organizar uma Grande [activity|E], caçar um animal lendário, etc.\n\n$game_concept_legend_seeds$ inativas não têm custo, mas não têm efeitos. Fundar uma $game_concept_legend_seed$ pela primeira vez tem um custo de [gold|E]."
 game_concept_legend_seeds:0 "Sementes de Lenda"
 game_concept_legend_seeds_desc:0 "$game_concept_legend_seed_desc$"
 game_concept_legend_type:0 "Tipo de Lenda"
 game_concept_legend_type_desc:0 "Uma [legend|E] tem um Tipo que influencia a categoria dos efeitos que concederá, bem como o tema de seu conteúdo.\n\nOs $game_concept_legend_types$ são Legitimadora, Heroica e Sagrada, concedendo [legitimacy|E], [prestige|E] e [piety|E], respectivamente."
 game_concept_legend_types:0 "Tipos de Lenda"
 game_concept_legend_types_desc:0 "$game_concept_legend_type_desc$"
 game_concept_legends:0 "Lendas"
 game_concept_legends_desc:0 "$game_concept_legend_desc$"
 game_concept_owned_legend:0 "Lenda Possuída"
 game_concept_owned_legend_desc:0 "Uma $game_concept_owned_legend$ é uma [legend|E] possuída por um [ruler|E], que é o principal beneficiário de seus efeitos.\n\nO proprietário de uma $game_concept_legend$ pode ser seu [legend_protagonist|E], mas não é necessário.\n\nUma $game_concept_legend$ também pode ser apoiada por [legend_promoters|E], que pagam uma contribuição mensal para também receber parte de seus bônus."
 game_concept_owning_legend:0 "Lenda Proprietária"
 game_concept_owning_legend_desc:0 "$game_concept_owned_legend_desc$"
 game_concept_promoted_legend:0 "Lenda Promovida"
 game_concept_promoted_legend_desc:0 "Uma $game_concept_promoted_legend$ é uma [legend|E] possuída por um [ruler|E] diferente que está sendo apoiada por [legend_promoters|E], que pagam uma contribuição mensal para também receber parte de seus bônus."
 game_concept_promoting_legend:0 "Espalhando"
 game_concept_promoting_legend_desc:0 "$game_concept_promoting_legend$"
 heroic_legend_seed_drop.t:0 "Novo Semente de Lenda Disponível"
 himavanta:0 "Himavanta"
 hindustan:0 "Hindustão"
 holy_seed_toast:0 "[legend_seed|E] Sagrada Obtida"
 holy_seed_toast_traits:0 "Sua natureza [ROOT.Char.CustomFixedRandom('GetSaintlyTrait')] é reconhecida"
 huge_beast:0 "enorme besta"
 iberian_ender_desc:0 "As disputas da nobreza ibérica acabaram, e [struggle_ender.GetFirstName] emerge como seu salvador. O [struggle_ender.GetTitleAsNameNoTooltip|U] vitorioso."
 iberian_ender_name:0 "O Destino de [GetTitleByKey('e_spain').GetNameNoTierNoTooltip|U]"
 irum:0 "Irum"
 jewish_priesthood_desc:0 "A diáspora era considerada eterna, mas sob [founder.GetName], um novo Sumo Sacerdócio emergiu para liderar o povo [faith.GetName] para uma nova e mais brilhante era."
 jewish_priesthood_name:0 "A Profecia Cumprida"
 khan_beater_desc:0 "O lendário 'Cã Genghis' estava determinado a trazer tudo o que está sob o céu para o seu Império, mas o poderoso [winner.GetTitleAsNameNoTooltip|U] foi frustrado pelo heroico [winner.GetName]!"
 khan_beater_name:0 "O Flagelo dos Cãs"
 kumari_kandam:0 "Kumari Kandam"
 legend_afrasiyab:0 "O Rei de Turan: Afrasiyab"
 legend_afrasiyab_desc:0 "O magnífico rei de Turan e herói dos Turcos, Afrasiyab foi o nêmesis do Império Persa e o maior de todos os reis Turanianos. Seu sangue mágico corre em nossas veias e nos dá o direito divino de governar Turan mais uma vez."
 legend_alfred_of_wessex:0 "O Rei Santo"
 legend_alfred_of_wessex_desc:0 "[ancestor.GetNameNoTooltip|U] resistiu às invasões dos nórdicos na Inglaterra, e ergueu-se como um bastião e propagador do cristianismo."
 legend_already_promoting_legend_tt:0 "Você já está [promoting_legend|E] [Legend.GetName]"
 legend_ancient_people_desc:0 "No sangue de todo nosso povo corre o mesmo sangue que fluía pelos [culture.GetCollectiveNoun]."
 legend_ancient_people_name:0 "[culture.GetNameNoTooltip] [ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U]"
 legend_annals:0 "Os Anais da Família $legend_ruler_family_loc$"
 legend_auspicious_birth:0 "Nascimento Auspicioso"
 legend_auspicious_birth_desc:0 "[protagonist.GetNameNoTooltip] nasceu quando o céu noturno estava repleto de estrelas auspiciosas, um sinal definitivo dos grandes feitos que [protagonist.GetSheHe] estava destinado(a) a realizar."
 legend_ayedawbon:0 "Ayedawbon $legend_ruler_family_loc$"
 legend_bahram_gur:0 "Linhagem Gur"
 legend_bahram_gur_desc:0 "Bahram Gur foi um grande rei guerreiro que lutou e resistiu a inúmeros invasores. Seu sangue flui em nossas veias, tornando-nos heróis persas."
 legend_borjigin:0 "O Visitante Cintilante"
 legend_borjigin_desc:0 "Alan Gua, a mãe de todos os [GetDynastyByID('11100').GetNameNoTooltip], era visitada por uma estranha figura cintilante todos os dias e noites. Como um grande cachorro amarelo, ele rastejava para dentro de sua tenda através dos raios da lua à noite e dos raios do sol durante o dia, e lhe presenteava com três filhos. Ela avisou a seus filhos concebidos divinamente que eles deveriam permanecer juntos como um feixe de cinco flechas ou serem quebrados como cinco flechas solitárias."
 legend_cadell:0 "O Sangue de Cadell"
 legend_cadell_desc:0 "Cadell começou a vida como um escravo menino, e com a bênção de um santo concedida a ele, ele tirou o reino de Powys de Vortigern."
 legend_can_not_promote_tt:0 "Você precisa de um dos seguintes:#!\n@warning_icon! #X Você compartilha um idioma com [legend.GetOwner.GetName]#!\n@warning_icon! #X [legend.GetName] está presente em uma província vizinha ao seu domínio#!\n@warning_icon! #X Você e [legend.GetOwner.GetName] são $game_concept_lovers$#!\n@warning_icon! #X Você e [legend.GetOwner.GetName] são $game_concept_friends$#!"
 legend_cantiga:0 "A Cantiga $legend_ruler_loc$"
 legend_carolingian:0 "Os Herdeiros de Carlos Magno"
 legend_carolingian_desc:0 "O grande rei Carlos Magno uma vez governou esta terra antes desta dinastia, que alega ser descendente direta de seu sangue imperial."
 legend_chanson:0 "A Chanson $legend_ruler_loc_possessive$"
 legend_chapter_battle_debug:0 "#D Capítulo de batalha#!"
 legend_chapter_battle_enemy_commander:0 "No meio da refrega, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] encontrou-se frente a frente com ninguém menos que o maldito comandante inimigo! Após um duelo poderoso, o vilão foi abatido por [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U], sangue escorrendo livremente de sua lâmina enquanto a batalha rugia ao redor deles."
 legend_chapter_battle_faked_retreat:0 "O tato tático de [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] foi testado nas chamas da batalha, mas [ROOT.Legend.GetProtagonist.GetSheHe] provou ser igual à tarefa. Uma astuta retirada fingida levou o inimigo a uma posição vulnerável, apenas para que nosso bravo herói avançasse mais uma vez e os cortasse."
 legend_chapter_battle_flanking_success:0 "A manobra agressiva e brilhante de [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] no campo de batalha foi exibida mais uma vez, enquanto [ROOT.Legend.GetProtagonist.GetSheHe] liderava pessoalmente um ataque flanqueador estrondoso. O inimigo covarde vacilou e então fugiu, o único golpe decidindo o dia."
 legend_chapter_battle_generic:0 "A batalha foi intensa. [ROOT.Legend.GetProtagonist.GetNameNoTooltip] encontrou [loser.GetNameNoTooltip] no meio do campo, os olhos [ROOT.Legend.GetProtagonist.GetHerHim] cheios de bravura. [ROOT.Legend.GetProtagonist.GetSheHe|U] levantou sua arma e desferiu um golpe no peito do inimigo. O sangue jorrou. Vitória."
 legend_chapter_battle_legendary_battle:0 "$legendary_battle_desc$"
 legend_chapter_battle_maiden_kiss:0 "Ao encontrar uma camponesa indefesa — mas verdadeiramente impressionante — no meio do tumulto da batalha, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] entrou em cena para levá-la embora. Nosso herói foi prontamente recompensado com um beijo, como realmente convém a uma [ROOT.Legend.GetProtagonist.GetWomanMan] de tamanha galanteria!"
 legend_chapter_battle_ravished_maiden:0 "Nunca deixando um inocente perecer, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] encontrou tempo no meio da batalha não apenas para resgatar, mas até mesmo #EMP desonrar#! uma bela plebeia que havia se colocado em perigo!"
 legend_chapter_battle_reinforcement_arrival:0 "Quando a batalha atingiu seu ápice, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] [ROOT.Legend.GetProtagonist.GetHerselfHimself] chegou à frente de um grupo de reforços. A batalha virou então a favor de nosso valente herói, que liderou o avanço profundamente nas fileiras inimigas."
 legend_chapter_battle_wounded:0 "A batalha foi feroz e o combate brutal. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] sofreu muitos ferimentos duradouros como resultado disso; um pequeno preço a pagar por uma [ROOT.Legend.GetProtagonist.GetWomanMan] de tanta convicção e honra!"
 legend_chapter_change_culture_toast:0 "[founder.GetPromotedLegend.GetName] muda"
 legend_chapter_change_toast:0 "[ROOT.Char.GetPromotedLegend.GetName] muda"
 legend_chapter_conclusion_ancestral_glory:0 "A jornada foi repleta de perigos, mas com tudo o que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] fez por [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] e seu povo, poderia haver alguma dúvida de que [ROOT.Legend.GetProtagonist.GetSheHe] foi escolhido por [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm|U] para governar? Da cidade ao mais humilde sítio, todos clamam pelo nome \"[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]\" em êxtase exultante!"
 legend_chapter_conclusion_ancient_people:0 "Com tremendo trabalho, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] trabalhou incansavelmente para transformar [ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTooltip] em uma visão da perfeição da [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip]. Graças apenas aos feitos lendários de [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], o povo de [ROOT.Legend.GetProperty( 'title' ).Title.GetNameNoTooltip] clama com orgulho por suas raízes na [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip]!"
 legend_chapter_conclusion_dead_loved_spouse:0 "Quando [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] retornou para casa, seu coração parecia um pequeno pombo, prestes a deixar seu peito. Cheio de emoção, ele mal podia esperar para se reunir com seu verdadeiro amor. Um grito terrível, tristeza encheu os corredores do castelo pois os lábios pálidos de seu cônjuge estavam desprovidos de toda vida. No silêncio de sua solidão, as memórias de um amor que inflamava seu coração o encheram de uma terrível dor. Qual o valor de sua lenda, se ele não tivesse ninguém para compartilhá-la?"
 legend_chapter_conclusion_debug:0 "#D Capítulo de conclusão#!"
 legend_chapter_conclusion_divine_intervention:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] governou de forma justa e piedosa, com [Localize( god )] como seu guia. O plano divino foi cumprido, e [ROOT.Legend.GetProtagonist.GetSheHe] viveu uma vida de grande honra e piedade."
 legend_chapter_conclusion_ended_struggle:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] viu que as regras do mundo estavam erradas, mas devido aos seus esforços, a chamada [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName] chegou ao fim e a região nunca mais será a mesma. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] emerge como a [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip|U] vitoriosa sobre todos os outros."
 legend_chapter_conclusion_fought_devil:0 "Com [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] derrotado, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se dedicou a vencer as forças do mal no reino dos mortais. [ROOT.Legend.GetProtagonist.GetSheHe|U] carregava um brilho sagrado consigo todos os seus dias e deixava paz e civilização em seu rastro."
 legend_chapter_conclusion_generic:0 "O retorno para casa não foi fácil, mas [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] entrou na cidade entre cânticos triunfantes. E agora vamos todos celebrar e festejar, pois a lenda [ROOT.Legend.GetProtagonist.GetHerHim] deve ser celebrada!"
 legend_chapter_conclusion_great_deed:0 "$legend_chapter_conclusion_generic$"
 legend_chapter_conclusion_new_faith:0 "Com os [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuterPlural] reunidos e o [ROOT.Legend.GetProperty( 'faith' ).Faith.ReligiousText|U] reescrito, [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip|U] foi finalmente restaurado na visão de [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm]!"
 legend_chapter_conclusion_new_title:0 "As brigas entre duques e nobres sem nome finalmente chegaram ao fim quando [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] os obrigou a se curvarem e jurarem lealdade perpétua a [ROOT.Legend.GetProperty( 'founder' ).Char.GetSheHe]. Com o nascimento de [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip], o formato do mundo foi mudado para sempre."
 legend_chapter_conclusion_point_of_interest:0 "Na vasta extensão das viagens de [ROOT.Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip], ele tropeçou em uma maravilha deslumbrante que desafiava os limites terrenos - um lugar onde a beleza da natureza se entrelaçava perfeitamente com a engenhosidade humana. Torres imponentes de artesanato requintado alcançavam os céus, suas formas graciosas banhadas pelo brilho suave da primeira luz do amanhecer. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] respirou fundo, pois não poderia ter desejado um fim melhor."
 legend_chapter_conclusion_priesthood_restored:0 "Os sacerdotes foram reunidos e a diáspora chegou ao fim. Nunca mais os [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdherentNamePluralNoTooltip] serão lançados ao vento sem liderança, enquanto [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] inaugura um novo [ROOT.Legend.GetProperty( 'faith' ).Faith.ReligiousHeadName]."
 legend_chapter_conclusion_raised_by_animals:0 "[ROOT.Legend.GetProtagonist.GetFirstName|U] governou assim como o [ROOT.Legend.GetProperty( 'beast' ).GetFlagName] faria, forte e orgulhoso. Embora [ROOT.Legend.GetProtagonist.GetSheHe] nunca tenha visto sua mãe [ROOT.Legend.GetProperty( 'beast' ).GetFlagName] novamente, [ROOT.Legend.GetProtagonist.GetSheHe] não tinha dúvidas de que esta mensageira de [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] olharia para o seu reinado com grande orgulho. As terras permaneceram quietas e pacíficas, com nenhum dos inimigos [ROOT.Legend.GetProtagonist.GetHerHim] ousando sair da linha, caso contrário enfrentariam a fúria do [ROOT.Legend.GetProperty( 'beast' ).GetFlagName]."
 legend_chapter_conclusion_sacred_birth:0 "Com todos os grandes feitos que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] havia feito em nome de [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm], [ROOT.Legend.GetProtagonist.GetSheHe] foi visitado mais uma vez, mas desta vez não foi apenas um sonho ou visão. [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] se manifestou em forma física e ofereceu a [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] um cálice de água para beber, concedendo-lhe um toque de divindade. As massas aclamaram o nome de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U], suplicando apenas para serem tocadas por suas mãos divinas e curativas."
 legend_chapter_conclusion_saintly_deed:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] trabalhou incansavelmente por toda [ROOT.Legend.GetProperty('religion').Religion.GetNameNoTooltip] e lutou contra os lacaios de [ROOT.Legend.GetProtagonist.GetFaith.DevilName] aqui na Terra, mas finalmente suas lutas chegaram ao fim. O plano divino cumprido, [ROOT.Legend.GetProtagonist.GetSheHe] viveu uma vida de grande honra e piedade."
 legend_chapter_conclusion_war_won:0 "[ROOT.Legend.GetProperty( 'loser' ).Char.GetNameNoTooltip|U] e seus seguidores baixaram a cabeça sob sua bandeira quebrada e imploraram pela misericórdia de [ROOT.Legend.GetProperty( 'winner' ).Char.GetFirstNamePossessiveNoTooltip]. Nos dias mais sombrios da guerra, [ROOT.Legend.GetProperty( 'winner' ).Char.GetSheHe] só podia imaginar [ROOT.Legend.GetProperty( 'winner' ).Char.GetSheHe] como um sobrevivente da guerra, mas [ROOT.Legend.GetProperty( 'winner' ).Char.GetSheHe] emerge como a vencedora. A única vencedora."
 legend_chapter_discovery_archery_contest_won:0 "As viagens de [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] o levaram a um pedaço de terra com um arqueiro fanfarrão, que desafiou [Select_CString( ROOT.Legend.IsFemale, 'a', 'o' )] nobre [ROOT.Legend.GetProtagonist.GetLadyLord] para um concurso de arco e flecha. A competição foi acirrada, mas eventualmente [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] mostrou sua precisão."
 legend_chapter_discovery_befriended_cyclops:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] provou ser amigo de todos os tipos exóticos e incomuns encontrados na estrada, até mesmo fazendo amizade com um ciclope grande e irritado!"
 legend_chapter_discovery_bog_stronk:0 "O caminho de [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] o levou por terrenos traiçoeiros, onde até mesmo o solo tentava sugá-lo para dentro de sua superfície. Somente a imensa força que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] possuía permitiu que [ROOT.Legend.GetProtagonist.GetSheHe] se libertasse."
 legend_chapter_discovery_bog_struggle:0 "O caminho de [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] o levou por terrenos traiçoeiros, onde até mesmo o solo tentava sugá-lo para dentro de sua superfície. Lutando com bravura, eventualmente [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se libertou da terra traiçoeira."
 legend_chapter_discovery_cannibal_fight:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] viajou por longas distâncias e até mesmo foi atacado por canibais famintos! A luta durou até o sol se pôr, com nosso herói exausto enquanto os canibais remanescentes fugiam."
 legend_chapter_discovery_cannibal_scarred:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] viajou por longas distâncias e até mesmo foi atacado por canibais famintos! [ROOT.Legend.GetProtagonist.GetSheHe|U] derrotou dezenas deles, as cicatrizes no rosto de [ROOT.Legend.GetProtagonist.GetHerHis] sendo um testemunho da luta pelo resto dos dias [ROOT.Legend.GetProtagonist.GetHerHim]."
 legend_chapter_discovery_cyclops:0 "Enquanto viajava, [ROOT.Legend.GetProtagonist.GetSheHe] encontrou as pessoas mais exóticas e incomuns, culminando na descoberta da existência de um poderoso ciclope!"
 legend_chapter_discovery_debug:0 "#D Capítulo de descoberta#!"
 legend_chapter_discovery_evil_plants:0 "As viagens de [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] estavam cheias de perigos desde o início. [ROOT.Legend.GetProtagonist.GetSheHe|U] até foi atacado por um bosque de plantas tóxicas, cujo pólen deixava tontos e atordoados aqueles que se aproximavam."
 legend_chapter_discovery_generic:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] observou [Localize( location )] com seu séquito, e não demorou muito para encontrar o local exato."
 legend_chapter_discovery_legendary_archer:0 "As viagens de [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] o levaram a um pedaço de terra com um arqueiro fanfarrão, que desafiou [Select_CString( ROOT.Legend.IsFemale, 'a', 'o' )] nobre [ROOT.Legend.GetProtagonist.GetLadyLord] para um concurso de arco e flecha. [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] prontamente dividiu a flecha do arqueiro ao meio com uma de suas próprias!"
 legend_chapter_discovery_renowned_herbalist:0 "Tão renomado como [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] era como herbalista, mais fama foi encontrada quando [ROOT.Legend.GetProtagonist.GetSheHe] descobriu um bosque letal de plantas e escapou de suas vinhas tóxicas."
 legend_chapter_discovery_wildflower_expert:0 "As viagens de [ROOT.Legend.GetProtagonist.GetFirstNamePossessive|U] o levaram a terras novas e exóticas, onde até mesmo as plantas se mostravam desconhecidas e incomuns. De fato, [ROOT.Legend.GetProtagonist.GetSheHe] até encontrou uma planta jamais vista antes ou desde então, escondida no matagal folhoso."
 legend_chapter_extra_deed_ancestral_glory:0 "O belo campo de [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] havia caído em mãos de bandidos e salteadores desde a época de [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')], mas [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] logo se pôs a corrigir os erros e proteger as pessoas que ele tinha direito a governar."
 legend_chapter_extra_deed_debug:0 "#D Capítulo de feitos extras#!"
 legend_chapter_extra_deed_divine_intervention:0 "As terras estavam repletas de bandidos cruéis que feriam os fiéis, mas com [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] e o grupo de seguidores [ROOT.Legend.GetProtagonist.GetHerHim], esses servos de [ROOT.Legend.GetProtagonist.GetFaith.DevilName|U] foram perseguidos de volta para [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife|U], onde pertencem, e o povo ficou livre. [Localize( god )|U] sorriu para [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] pela bondade que [ROOT.Legend.GetProtagonist.GetSheHe] havia feito, e a missão sagrada [ROOT.Legend.GetProtagonist.GetHerHim] estava quase em seu clímax."
 legend_chapter_extra_deed_fought_devil:0 "Insatisfeito e cheio de ódio por tudo o que é bom e justo, [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] desafiou [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] para um concurso de [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')]. A melodia que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] tocou fez [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] derreter-se no [ROOT.Legend.GetProperty( 'faith' ).Faith.NegativeAfterLife|U]. A melodia escapou da mente [ROOT.Legend.GetProtagonist.GetHerHim] como fumaça, sem dúvida demasiado divina para o reino dos homens."
 legend_chapter_extra_deed_generic:0 "Contudo, esse não foi o fim da história, pois quando [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] voltava para casa, [ROOT.Legend.GetProtagonist.GetSheHe] ajudava aqueles em perigo e vingava seus agravos. Bandidos, bestas e malfeitores não podiam se esconder da fúria de sua lâmina."
 legend_chapter_extra_deed_memory:0 "Entretanto, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] não parou por aí, pois [ROOT.Legend.GetProtagonist.GetSheHe] prosseguiu e com grande bravura [ROOT.Legend.MakeScope.Var('extra_deed_memory').CharacterMemory.GetThirdPerspectiveDescription]."
 legend_chapter_extra_deed_mythical_descent:0 "Mas isso não foi o fim da história, muitos ainda duvidavam da divindade presente no sangue [ROOT.Legend.GetProtagonist.GetHerHim]. Usando seus grandes poderes, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] assolou seus detratores com uma grande praga de bestas, seus palácios e casas cheios de latidos e gritos vorazes."
 legend_chapter_extra_deed_new_faith:0 "A humanidade criou tantos rivais para [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm], e [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip] os desmantelou todos, assim reunindo um vasto rebanho para pastorear."
 legend_chapter_extra_deed_recent_battle:0 "Em sua volta para casa, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] lutou valentemente contra seus inimigos, liderando com coragem e brilhantismo estratégico sem igual. Com sua espada erguida e sua determinação inabalável, ele inspirou a vitória contra seus adversários."
 legend_chapter_extra_deed_recent_imprisonment:0 "Nas profundezas do calabouço mais sombrio, privado de comida e água, acorrentado e cercado por sombras, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] encontrou a determinação necessária para escapar. Com os dentes cerrados e o coração em chamas de desafio, [ROOT.Legend.GetProtagonist.GetSheHe] planejou sua fuga, noite após noite. Através da manipulação astuta e da pura força de vontade, [ROOT.Legend.GetProtagonist.GetSheHe] seguiu passagens secretas para fora rumo à luz da manhã."
 legend_chapter_extra_deed_recent_siege:0 "Na volta para casa, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] liderou o cerco a uma fortaleza inimiga com determinação inabalável, destruindo a cidade como o mais fino vidro. Com suas forças reunidas e estandartes desfraldados, [ROOT.Legend.GetProtagonist.GetSheHe] lançou um ataque implacável, rompendo as defesas e garantindo a vitória."
 legend_chapter_extra_deed_recent_tournament:0 "Na volta para casa, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] ficou cativado pelo esplendor dos gloriosos torneios. Com espada em punho e armadura reluzindo sob o olhar do sol, [ROOT.Legend.GetProtagonist.GetSheHe] enfrentou adversários formidáveis com uma determinação inabalável. A plateia clamava, damas e pajens lançavam-se aos seus pés! O vencedor! O melhor cavaleiro!"
 legend_chapter_extra_deed_religious:0 "No entanto, isso não foi o fim da história, pois os fiéis ainda eram assediados por bandidos e malfeitores, e escravizados por hereges! [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] ajudou aqueles que viviam sob tirania a se erguerem para o abraço de [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName|U], triunfando sobre [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName] e seus asseclas."
 legend_chapter_extra_deed_saintly_deed:0 "Os caminhos dos fiéis eram atacados pelos ímpios, e com uma lâmina abençoada pelo todo-poderoso, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] os afastou a todos. Porém feras selvagens e serpentes ainda vagavam pelo caminho e faziam mal aos fiéis, então [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] pegou seu [ROOT.Legend.GetProtagonist.Custom('GetMusicalInstrument')] e encantou as criações de [ROOT.Legend.GetProtagonist.GetFaith.CreatorNamePossessive] para fora das terras."
 legend_chapter_extra_deed_struggle:0 "Apesar de toda a grandeza que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] havia alcançado, ainda havia aqueles que duvidavam de sua visão para resolver a [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]. Seus inimigos logo foram derrotados nos campos de batalha tanto do debate quanto da guerra, até que todos estavam se curvando a sua frente e implorando por sua misericórdia."
 legend_chapter_extra_deed_tournament_won:0 "Ninguém conseguia esquecer a glória do primeiro torneio de [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip], mas uma única vitória não era suficiente para [ROOT.Legend.GetProtagonist.GetSheHe]. Os outros competidores cercaram [ROOT.Legend.GetProtagonist.GetSheHe] em uma tempestade de lâminas, mas [ROOT.Legend.GetProtagonist.GetSheHe] permaneceu inabalável. [ROOT.Legend.GetProtagonist.GetSheHe|U] emergiu vitorioso para uma multidão gritando seu nome!"
 legend_chapter_famous_deed_ancestral_glory:0 "Loucos se reuniriam para desafiar [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip], mas eles eram como o vento para a montanha. Os seguidores de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] cresceram com cada ato maravilhoso que [ROOT.Legend.GetProtagonist.GetSheHe] cometeria em nome de [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm], e [ROOT.Legend.GetProtagonist.GetSheHe] se tornou o próprio reflexo de [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')]."
 legend_chapter_famous_deed_conqueror:0 "Batalha após batalha, os cânticos cresciam mais altos. Batalha após batalha, os despojos cresciam maiores. Batalha após batalha, a lenda de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip] brilhava mais intensamente."
 legend_chapter_famous_deed_debug:0 "#D Capítulo de feitos famosos#!"
 legend_chapter_famous_deed_divine_intervention:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] dedicou [ROOT.Legend.GetProtagonist.GetSheHe] a [Localize( god )] e agiu inteiramente pela vontade de [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]. Após muitos dias e noites isolado em oração, finalmente a verdadeira natureza da missão [ROOT.Legend.GetProtagonist.GetHerHim] foi revelada a [ROOT.Legend.GetProtagonist.GetSheHe]!"
 legend_chapter_famous_deed_fought_devil:0 "Certa noite, [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] visitou [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] com todo tipo de chicotes e cruéis mecanismos de tortura espalhados pelas paredes manchadas de sangue. Nu e inabalável, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] lutou contra [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] com a força e convicção de [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName|U] pulsando através do ser [ROOT.Legend.GetProtagonist.GetHerHim]. Com [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName|U] impotentemente preso sob [ROOT.Legend.GetProtagonist.GetSheHe] — a besta hedionda sibila e rosnava, o mal frustrado por [Select_CString( ROOT.Legend.GetProtagonist.IsFemale, 'uma mera', 'um mero' )] [ROOT.Legend.GetProtagonist.GetWomanMan]!"
 legend_chapter_famous_deed_generic:0 "A lenda de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] culmina numa maravilhosa aventura: seus grandes feitos de armas eram tais que todos os reis se maravilhavam, e muitos nobres e plebeus vinham ao encontro [ROOT.Legend.GetProtagonist.GetHerHim], pois desejavam ver a lenda em carne e osso."
 legend_chapter_famous_deed_holy_warrior:0 "Sempre um firme defensor da fé, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] mostrou-se um verdadeiro herói na guerra santa contra os inimigos do [ROOT.Legend.GetProtagonist.GetFaith.HighGodName]. [ROOT.Legend.GetProtagonist.GetSheHe|U] viajou para terras estrangeiras, determinado a restaurar a paz e a prosperidade que os deuses falsos haviam tirado de seu povo ignorante. [ROOT.Legend.GetProtagonist.GetSheHe|U] esculpiu o símbolo do [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip] em seu antebraço, com sangue derramado sobre os cadáveres dos infiéis."
 legend_chapter_famous_deed_mythical_descent:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] foi ferido em uma grande batalha com algum vilão que duvidava de sua linhagem, seu sangue divino espalhou-se por um campo. O sangue brilhava e cintilava como gemas recém-cortadas, e em poucos dias, o solo inóspito floresceu com flores de cores magníficas."
 legend_chapter_famous_deed_new_faith:0 "Buscando a solidão do tagarelar sem sentido dos hereges, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] escalou até o mais alto dos altos montes em toda a terra, tendo apenas a misericórdia de [ROOT.Legend.GetProperty( 'faith' ).Faith.HealthGodName] como segurança. Em seu pico, as nuvens se abriram e [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm] apareceu para [ROOT.Legend.GetProtagonist.GetSheHe] e lançou uma visão sobre [ROOT.Legend.GetProtagonist.GetSheHe]. O esqueleto de um velho [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuter] jazia em seu leito de morte, agarrando-se com ciúmes à vida enquanto um [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuter] mais jovem e muito mais novo sepultava seu antecessor. Essa visão sem dúvida prenunciava a bênção de [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm] à nova fé [ROOT.Legend.GetProperty( 'faith' ).Faith.GetNameNoTooltip]."
 legend_chapter_famous_deed_new_title:0 "As terras que viriam a compor [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] estavam sob o domínio dos terríveis servos de [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.DevilName]. Mas com seus grandes exércitos, [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] libertou vila após vila após cidade. O povo pegou em armas e derrubou seus governantes malignos em serviço de [ROOT.Legend.GetProperty( 'founder' ).Char.GetFirstNameNoTooltip], preparados para morrer por seu governante legítimo. [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodName] negou-lhes seu sacrifício, pois [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.HighGodNameSheHe|U] lhes concedeu sua proteção divina. Nenhuma lâmina poderia tocar os crescentes exércitos de [ROOT.Legend.GetProperty( 'founder' ).Char.GetFirstNameNoTooltip] enquanto [ROOT.Legend.GetProperty( 'founder' ).Char.GetSheHe] libertava o povo de [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]."
 legend_chapter_famous_deed_raised_by_animals:0 "A cada dia que passava, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] crescia em força e sabedoria, não reclamando da barbaridade da civilização. Como os fundadores de Roma, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] abraçou o mundo que lhe deu vida e ensinou aos habitantes da casa o domínio da caça, derrubando um [ROOT.Legend.GetProtagonist.Custom('RegionalFerociousAnimal')]."
 legend_chapter_famous_deed_religious:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] dedicou-se a [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] e agiu inteiramente conforme a sua vontade. Cada [ROOT.Legend.GetProperty( 'faith' ).Faith.GetReligion.GetAdherentNameNoTooltip|U] vagou pela terra com o nome \"[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]\" em seus lábios, contando histórias de incontáveis eventos sagrados em seu nome."
 legend_chapter_famous_deed_saintly_deed:0 "Em meio aos sussurros de dúvida e às sombras da incredulidade entre o povo, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] permaneceu inabalável em sua fé. Tudo parecia perdido, o sangue pintava o campo de batalha. Lanças eram abandonadas ao chão, deixadas por seus portadores. Mas [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] caiu de joelhos, a boca cheia de orações. Flores brotaram das lanças, os inimigos caíram no chão, testemunhando um milagre."
 legend_chapter_famous_deed_tournament_won:0 "Mentes e vozes se chocaram na mesma medida que as lâminas em um grande espetáculo das artes marciais, mas nenhuma mente era tão astuta nem lâmina tão afiada quanto a de [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip]! Um após o outro, os competidores se alinharam apenas para serem levados às lágrimas pelo intocável [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]."
 legend_chapter_famous_deed_war_won:0 "Batalhas travadas de um lado para o outro, e a guerra pintou a terra de vermelho com o sangue dos justos e dos vilões em igual medida. [ROOT.Legend.GetProperty( 'winner' ).Char.GetNameNoTooltip|U] permaneceu inabalável enquanto as forças do mal tentavam superar a magistral estratégia militar [ROOT.Legend.GetProperty( 'winner' ).Char.GetHerHim]. No final, seus esforços se mostraram infrutíferos."
 legend_chapter_hunt_debug:0 "#D Capítulo de caçada#!"
 legend_chapter_hunt_generic:0 "A [Localize( beast )] já estava lá, bebendo de um riacho. Ergueu a cabeça e avançou rapidamente em direção a [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip]. Faminto. Mas [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] foi mais rápido e com um golpe hábil matou a besta."
 legend_chapter_motivation_accomplished_hunter:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] estava determinado a provar seu valor como caçador. [ROOT.Legend.GetProtagonist.GetSheHe|U] finalmente teve a chance de mostrar sua habilidade, à medida que o poderoso [Localize( beast )] se aproximava."
 legend_chapter_motivation_ancestral_glory:0 "Não havia dúvida na mente [ROOT.Legend.GetProtagonist.GetHerHim]; [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] estava destinado a unificar todos os [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] sob seu domínio. Em nome de [ROOT.Legend.Custom('GetAncestorFirstNameNoTooltip')], as disputas entre senhores e damas inferiores estavam prestes a chegar ao fim, e todos passariam a chamar [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] de seu senhor feudal."
 legend_chapter_motivation_celibacy:0 "Antes adornado com trajes reais, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] permaneceu vestido com as vestes humildes de um [ROOT.Legend.GetProtagonist.GetFaith.PriestNeuter], despido de sua coroa. Mas [ROOT.Legend.GetProtagonist.GetSheHe] nunca esqueceu [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], pois sua devoção queimava ainda mais brilhante, eterna. Impulsionado pela inspiração divina pulsando dentro [ROOT.Legend.GetProtagonist.GetHerHim], [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] resolveu forjar um caminho que eternizaria seu nome."
 legend_chapter_motivation_child_father:0 "Nas câmaras solenes do lar ancestral [ROOT.Legend.GetProtagonist.GetHerHim], onde o tremeluzir da luz das velas lançava sombras sobre os antigos tapetes, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] contemplou com admiração o milagre da vida concedido a [ROOT.Legend.GetProtagonist.GetSheHe]. Uma determinação em proteger o legado [ROOT.Legend.GetProtagonist.GetHerHim] nasceu com aquele filho."
 legend_chapter_motivation_child_mother:0 "Nos corredores tranquilos do castelo, onde as sombras dançam sobre as paredes de pedra e sussurros de antigas lendas pairam no ar, [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] embalava seu recém-nascido em um abraço carinhoso. Enquanto [ROOT.Legend.GetProtagonist.GetSheHe] contemplava os olhos inocentes do bebê, seu coração foi inundado de determinação. Que legado [ROOT.Legend.GetProtagonist.GetSheHe] estaria deixando para trás? Será que [ROOT.Legend.GetProtagonist.GetSheHe] gostaria de ser lembrada como uma covarde, refugiando-se entre seda e flores?"
 legend_chapter_motivation_dead_parent:0 "A [Localize( beast )] era de fato perigosa, mas o coração de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] permanecia firme. [ROOT.Legend.GetProtagonist.GetSheHe|U] tinha uma rixa pessoal com o animal, pois havia rumores de que ele havia matado seu pai."
 legend_chapter_motivation_debug:0 "#D Capítulo de motivação#!"
 legend_chapter_motivation_delicious_meats:0 "A [Localize( beast )] era conhecida por ser feroz e perigosa, mas o propósito de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] não podia ser negado. [ROOT.Legend.GetProtagonist.GetSheHe|U] insistia em provar sua carne e impulsionou [ROOT.Legend.GetProtagonist.GetHerselfHimself] para realizar esse sonho."
 legend_chapter_motivation_evil:0 "Não foram os apelos do povo ou a desesperança que assolava a terra que fizeram [ROOT.Legend.GetProtagonist.GetSheHe] buscar aventura, mas o desejo do próprio coração sombrio [ROOT.Legend.GetProtagonist.GetHerHim]."
 legend_chapter_motivation_fought_devil:0 "Assolado por pesadelos, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] foi atormentado por visões de [ROOT.Legend.GetProperty( 'faith' ).Faith.DevilName], sibilando e atormentando [ROOT.Legend.GetProtagonist.GetSheHe]. A cada dia [ROOT.Legend.GetProtagonist.GetSheHe] acordava de seu sono com novo propósito e com a sensação de que [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] tinha um plano para [ROOT.Legend.GetProtagonist.GetSheHe]."
 legend_chapter_motivation_generic:0 "Ao ouvir rumores vagos que assolavam a terra, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] determinou-se a realizar a difícil empreitada."
 legend_chapter_motivation_great_venator:0 "Nesse momento, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] já era renomado por toda a terra como o maior caçador, mas para o valente [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip|U], essa verdade precisava ser provada ainda mais."
 legend_chapter_motivation_honor_lady:0 "Quando os olhos de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] encontraram os de sua amada, tudo foi decidido. Ouvindo os apelos por ajuda e querendo provar a grandeza de sua bravura, [ROOT.Legend.GetProtagonist.GetSheHe] partiu em uma aventura."
 legend_chapter_motivation_new_faith:0 "Vendo a fraqueza e corrupção da fé, [ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] partiu com uma nova visão para [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip] — uma nova perspectiva de fé que não permitiria desvios da vontade de [ROOT.Legend.GetProperty( 'faith' ).Faith.PantheonTerm]; uma fé forte e unida que se espalharia por todos os cantos do mundo!"
 legend_chapter_motivation_new_title:0 "Muito antes da família [ROOT.Legend.GetProperty( 'founder' ).Char.GetDynastyNameNoTooltip] se tornar guardiã de [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip], [ROOT.Legend.GetProperty( 'founder' ).Char.GetNameNoTooltip] foi presenteado com uma visão do [ROOT.Legend.GetProperty( 'founder' ).Char.GetFaith.PantheonTerm]. A partir desse momento, [ROOT.Legend.GetProperty( 'founder' ).Char.GetSheHe] soube que nasceu para governar."
 legend_chapter_motivation_peasant:0 "Quando um camponês pobre, desesperado e lacrimoso solicitou uma audiência com [ROOT.Legend.GetProtagonist.GetSheHe], o piedoso [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] não pôde ignorar seus apelos e rapidamente partiu em uma aventura."
 legend_chapter_motivation_raised_by_animals:0 "Retornando à humanidade, [ROOT.Legend.GetProtagonist.GetFirstName] descobriu como o caos havia assolado a terra. Vizinho se lançava contra vizinho como um [ROOT.Legend.GetProperty( 'beast' ).GetFlagName] em sua presa, e [ROOT.Legend.GetProtagonist.GetFirstName] sabia que seu povo precisava de um líder forte para unir a matilha por trás de sua causa compartilhada."
 legend_chapter_motivation_religious:0 "Quando [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] ouviu isso, [ROOT.Legend.GetProtagonist.GetSheHe] sentiu um grande calor em seu coração, pois sua devoção era tão grande que apenas o pensamento de um lugar sagrado fez [ROOT.Legend.GetProtagonist.GetSheHe] lacrimejar."
 legend_chapter_motivation_sacred_birth:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] passou muitas noites sem dormir, atormentado por visões de seu próprio nascimento, até que numa noite fatídica, foi [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] quem apareceu diante [ROOT.Legend.GetProtagonist.GetHerHim]. [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] declarou que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] foi colocado na Terra com um propósito divino, um que superava o chamado típico de uma [ROOT.Legend.GetProtagonist.GetWomanMan]. A partir desse dia, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] soube que as circunstâncias de seu nascimento não eram boato nem coincidência, mas uma intervenção direta de [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]!"
 legend_chapter_motivation_saintly_deed:0 "A missão de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip] de [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] era clara: [ROOT.Legend.GetProtagonist.GetSheHe] deveria realizar maravilhas! Todos os [ROOT.Legend.GetProperty('religion').Religion.GetAdherentNamePluralNoTooltip] mantêm [ROOT.Legend.Custom('GetAncestorNameNoTooltip')] em seus corações, mas nenhum sabia dos milagres que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ainda estava por realizar!"
 legend_chapter_motivation_saintly_life:0 "A missão de [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] para [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip] era clara: [ROOT.Legend.GetProtagonist.GetSheHe] devia fazer maravilhas! Todos os [ROOT.Legend.GetProperty('religion').Religion.GetAdherentNamePluralNoTooltip] guardam tais esperanças em seus corações, mas nenhum sabia dos milagres que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] ainda estava por realizar!"
 legend_chapter_motivation_spouse:0 "Quando o cônjuge de [ROOT.Legend.GetProtagonist.GetFirstNamePossessiveNoTooltip|U] veio até [ROOT.Legend.GetProtagonist.GetSheHe] numa manhã com rumores alarmantes, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] se apressou e prometeu honrar o amor eterno deles."
 legend_chapter_motivation_struggle:0 "Vendo irmão contra irmão — [ROOT.Legend.GetProtagonist.GetFaith.GetAdherentNameNoTooltip] contra [ROOT.Legend.GetProtagonist.GetFaith.GetAdherentNameNoTooltip] — [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] proferiu apenas \"não mais\" para os tolos brigões que buscavam despedaçar a região. Ficou claro para [ROOT.Legend.GetProtagonist.GetSheHe] que as lutas de seu povo deviam chegar ao fim, e um novo futuro devia ser esculpido a partir dos restos da [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName]."
 legend_chapter_opening_ancestral_glory:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] nasceu do sangue e carne de [ROOT.Legend.Custom('GetAncestorNamePossessiveNoTooltip')]. Com o poder natural desta grande linhagem, houve alguma dúvida de que [ROOT.Legend.GetProtagonist.GetSheHe] alcançaria grandes feitos?"
 legend_chapter_opening_ancient_people:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] nasceu de uma grande linhagem da [ROOT.Legend.GetProperty( 'culture' ).Culture.GetNameNoTooltip] para governar [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip] como fariam seus antepassados."
 legend_chapter_opening_conqueror:0 "Das cinzas nada nascerá novamente. [ROOT.Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip] jurou se tornar a praga de [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] pairando sobre solo carmesim. E o solo será apenas carmesim a partir de agora."
 legend_chapter_opening_debug:0 "#D Capítulo de abertura#!"
 legend_chapter_opening_generic:0 "A lenda de [ROOT.Legend.GetProtagonist.GetNameNoTooltip] é tão grande e vasta quanto o mundo, pois seus feitos são incomparáveis."
 legend_chapter_opening_godly_descent:0 "[ROOT.Legend.GetProperty( 'god' ).GetFlagName|U] fertilizou o ancestral de [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip] e trouxe o primeiro [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] do útero do mundo. Desde o nascimento, todos os membros da família [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] são incumbidos de uma missão divina, para trazer prosperidade e a fé do [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip] a todos os cantos de [ROOT.Legend.GetProperty( 'title' ).Title.GetBaseNameNoTooltip]."
 legend_chapter_opening_great_deed:0 "$legend_chapter_opening_generic$"
 legend_chapter_opening_holy_warrior:0 "Um grande guerreiro de [religion.GetNameNoTooltip], a lenda de [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] começa com um nascimento auspicioso. Desde muito jovem, [ROOT.Legend.GetProtagonist.GetSheHe] sentiu o chamado de [ROOT.Legend.GetProtagonist.GetFaith.HighGodName]."
 legend_chapter_opening_legendary_battle:0 "Nas crônicas do tempo, há uma saga de uma batalha tão gloriosa que ressoa pela eternidade, uma batalha onde [ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] se ergueu como um colosso no meio da tempestade da guerra."
 legend_chapter_opening_mythical_descent:0 "Como todos os membros da família [ROOT.Legend.GetProtagonist.GetDynastyNameNoTooltip] antes [ROOT.Legend.GetProtagonist.GetHerHim], [ROOT.Legend.GetProtagonist.GetNameNoTooltip] nasceu com o sangue de uma [ROOT.Legend.GetProperty( 'beast' ).GetFlagName]. Suas origens extraordinárias o colocam acima de todos os outros, destinado à grandeza."
 legend_chapter_opening_new_culture:0 "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] nasceu quando as tradições antigas se tornaram obsoletas. Com uma visão em sua mente, [ROOT.Legend.GetProtagonist.GetSheHe] decidiu forjar suas próprias tradições - assim criando a cultura [ROOT.Legend.GetProtagonist.GetCulture.GetNameNoTooltip]."
 legend_chapter_opening_new_faith:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] nasceu quando a religião [ROOT.Legend.GetProperty( 'religion' ).Religion.GetNameNoTooltip] havia se afastado muito da vontade de [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodNamePossessive]. Pregadores e [ROOT.Legend.GetProperty( 'faith' ).Faith.PriestNeuterPlural] pregavam heresia em nome dele enquanto [ROOT.Legend.GetProperty( 'faith' ).Faith.HouseOfWorshipPlural] estavam abandonados e em ruínas. O povo se voltou para outras religiões, abrindo caminho para que os rivais de [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodNamePossessive] conquistassem os corações dos homens."
 legend_chapter_opening_new_faith_generic:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] nasceu quando a religião havia caído longe da vontade do [ROOT.Legend.GetProtagonist.GetFaith.GetNameNoTooltip]. Pregadores pregavam heresia em nome de [ROOT.Legend.GetProtagonist.GetFaith.HighGodNamePossessive] enquanto a fé se deteriorava e era abandonada. As pessoas voltavam-se para outras religiões, abrindo caminho para que os rivais de [ROOT.Legend.GetProtagonist.GetFaith.HighGodNamePossessive] conquistassem os corações dos homens."
 legend_chapter_opening_priesthood_restoration:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] entrou neste mundo quando os fiéis [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip] estavam dispersos pelo mundo em um desesperador diáspora. Com visões de um todo-poderoso [ROOT.Legend.GetProperty( 'faith' ).Faith.HouseOfWorship] erguendo-se sobre a criação em sua mente, [ROOT.Legend.GetProtagonist.GetSheHe] sabia que estava encarregada de uma missão sagrada de [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] para unir todos os [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdherentNamePluralNoTooltip]."
 legend_chapter_opening_saintly_life:0 "[ROOT.Legend.GetProtagonist.GetTitledFirstNameNoTooltip] nasceu com o mais profundo amor por [ROOT.Legend.GetProtagonist.GetFaith.HighGodName], e dedicou toda sua vida para honrar sua fé."
 legend_chapter_opening_saintly_location:0 "A terra de [location.GetNameNoTooltip] é de valor piedoso supremo, e de seu solo diz-se que brota água milagrosa, capaz de curar todas as doenças."
 legend_chapter_opening_struggle:0 "Nascido na tempestade caótica no coração da [ROOT.Legend.GetProperty( 'struggle' ).GetFlagName], [ROOT.Legend.GetProtagonist.GetNameNoTooltip] não tinha inclinação de que [ROOT.Legend.GetProtagonist.GetSheHe] traria paz e ordem à região."
 legend_chapter_opening_witch:0 "O interesse de [ROOT.Legend.GetProtagonist.GetTitledFirstNamePossessiveNoTooltip] nas artes ocultas sempre suscitara suspeitas. Acusações de bruxaria e feitiçaria giravam em torno [ROOT.Legend.GetProtagonist.GetHerHim], lançando uma sombra escura sobre seu nome outrora ilustre. Enquanto os súditos leais [ROOT.Legend.GetProtagonist.GetHerHim] voltavam-se para seguir cada movimento [ROOT.Legend.GetProtagonist.GetHerHim], [ROOT.Legend.GetProtagonist.GetSheHe] sentia o peso da desconfiança pressionando sobre [ROOT.Legend.GetProtagonist.GetSheHe]."
 legend_chapter_winner_change_toast:0 "[winner.GetPromotedLegend.GetName] muda"
 legend_chronicle_accolade_chronicle:0 "O Mais Valente dos [founder.Custom( 'KnightCulturePluralNoTooltip' )]"
 legend_chronicle_accolade_chronicle_desc:0 "[founder.GetName|U] teve muitos [founder.Custom( 'KnightCulturePluralNoTooltipLowercase' )] excelentes, mas nenhum foi maior do que [first_accolade_knight.GetName] de [first_accolade.GetName]."
 legend_chronicle_ancestral_glory_desc:0 "[ancestor.GetName] foi verdadeiramente um grande [ancestor.GetWomanMan] venerado por todos."
 legend_chronicle_ancestral_glory_nohistory_desc:0 "Nosso ancestral foi verdadeiramente um dos grandes, venerado por todos."
 legend_chronicle_beast_slayer:0 "O Caçador de [Localize( beast )|U]"
 legend_chronicle_beast_slayer_desc:0 "Em [location.GetName], uma [Localize( beast )] foi abatida"
 legend_chronicle_conclusion_exotic_backstory:0 "Muita coisa havia mudado desde que [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] chegara. Onde antes os camponeses se arrastavam na miséria e os bárbaros esgotavam a terra, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] espalhou a luz da civilização. Embora houvesse muitas pedras em seu caminho, ele as recolheu todas como meios para construir uma nova [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. Por todo o reino, bebês são nomeados em homenagem a [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] e as massas cantam em coro agradecido pelo estrangeiro de [ROOT.Legend.GetProperty( 'location' ).GetFlagName] que construiu sua grande cidade."
 legend_chronicle_conqueror_chronicle:0 "O Maior Conquistador"
 legend_chronicle_conqueror_chronicle_desc:0 "Um vagante não mais. Um Conquistador nasceu de uma alma indomável."
 legend_chronicle_debug_legend:0 "#D A Lenda do QA#!"
 legend_chronicle_debug_legend_desc:0 "#D QA é uma profissão ancestral e nobre#!"
 legend_chronicle_divine_intervention_motivation:0 "[Localize( god )|U] falou com [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] no plano dos sonhos e incumbiu [ROOT.Legend.GetProtagonist.GetSheHe] com uma missão sagrada. Desde então, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] tem orado e procurado pelas terras por um sinal da verdadeira natureza dessa missão de [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]."
 legend_chronicle_generic_opening:0 "$legend_chapter_opening_generic$"
 legend_chronicle_great_deed_dynasty:0 "Um Grande Esforço para [dynasty.GetNameNoTooltip]"
 legend_chronicle_great_deed_dynasty_desc:0 "Poucos que carregam o nome de [dynasty.GetName] fizeram tanto por sua dinastia quanto [founder.GetName]."
 legend_chronicle_great_deed_faith:0 "O Triunfo Espiritual de [new_faith.GetNameNoTooltip]"
 legend_chronicle_great_deed_faith_desc:0 "Guiado pela fé [founder.GetHerHim] em [new_faith.HighGodName], [founder.GetName] conduziu os fiéis [new_faith.GetAdherentNamePlural] à vitória sobre os [old_faith.GetAdherentName], liderados pelo vil [antagonist.GetName]"
 legend_chronicle_great_deed_region:0 "Verdadeiro Herói de [legend_region.GetNamePossessiveNoTooltip]"
 legend_chronicle_great_deed_region_desc:0 "Não há alma em [legend_region.GetName] que não conheça o nome de [founder.GetName] e suas realizações."
 legend_chronicle_great_deed_title:0 "Grande Feito para [title.GetNameNoTooltip]"
 legend_chronicle_great_deed_title_desc:0 "Ao longo de toda a história, entre todos os governantes de [title.GetName], nenhum alcançou tanto, nenhum será mencionado antes do grande [founder.GetName]."
 legend_chronicle_holy_war:0 "A Guerra Santa de [location.GetName]"
 legend_chronicle_holy_war_desc:0 "Em [location.GetName], [Localize( antagonist )] foi derrotado"
 legend_chronicle_motivation_exotic_backstory:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] contemplou sua nova casa e chorou, pois suas tecnologias e cultura eram tão primitivas em comparação com as maravilhas às quais [ROOT.Legend.GetProtagonist.GetSheHe] havia se acostumado em [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. O trabalho estava claro: [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] deve espalhar o esclarecimento de sua terra natal para este canto da criação."
 legend_chronicle_new_title:0 "Fundação de [title.GetNameTooltip]"
 legend_chronicle_new_title_desc:0 "Pela vontade, força e astúcia de [founder.GetName], [title.GetName] veio à existência e jamais vacilará!"
 legend_chronicle_opening_exotic_backstory:0 "[ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] viajou da distante e mística terra de [ROOT.Legend.GetProperty( 'location' ).GetFlagName] em uma missão. [ROOT.Legend.GetProtagonist.GetSheHe|U] era [Select_CString( ROOT.Legend.IsFemale, 'uma heroína', 'um herói' )] entre seu próprio povo, mas agora [ROOT.Legend.GetProtagonist.GetSheHe] se oferece para conceder sua benevolência ao nosso pequeno canto do vasto e interminável mundo."
 legend_chronicle_opening_raised_by_animals:0 "Sem comida ou esperança de resgate, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] jazia perdido como um bebê ao lado de um rio até que uma poderosa mãe [ROOT.Legend.GetProperty( 'beast' ).GetFlagName] o encontrou. Ela o alimentou de seu seio, fazendo o bebê crescer para se tornar um [ROOT.Legend.GetProtagonist.GetWomanMan] hercúleo com toda a força e coragem do [ROOT.Legend.GetProperty( 'beast' ).GetFlagName]."
 legend_chronicle_raised_by_animals:0 "Filho de [Localize(beast)|U]"
 legend_chronicle_raised_by_animals_desc:0 "[protagonist.GetNameNoTooltip] foi criado por um(a) [Localize(beast)|U], e essa experiência robusta na criação de [protagonist.GetFaith.CreatorNamePossessive|U] o(a) capacitou divinamente para governar."
 legend_chronicle_sacred_birth_opening:0 "Desde o dia em que [ROOT.Legend.GetProtagonist.GetSheHe] nasceu, ficou claro que [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm] tinha planos maiores para [ROOT.Legend.GetProtagonist.GetNameNoTooltip]. [ROOT.Legend.Custom('GetBirthCircumstancesLegend')|U], sua grandeza estava predestinada."
 legend_chronicle_tournament_won:0 "Três Vitórias de [winner.GetFirstNameNoTooltip]"
 legend_chronicle_tournament_won_desc:0 "Nos campos de justa de [location.GetName], o competidor supremo [winner.GetName] venceu o torneio pela terceira vez. Nenhuma alma viva na Terra poderia rivalizar com [winner.GetSheHe]."
 legend_chronicle_unsuspecting_opening:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] nasceu como qualquer [ROOT.Legend.GetProtagonist.GetWomanMan] seria, sem conceber a grandeza que [ROOT.Legend.GetProtagonist.GetSheHe] alcançaria em nome de [ROOT.Legend.GetProtagonist.GetFaith.PantheonTerm]."
 legend_chronicle_valiant_defense:0 "Uma Defesa Valente"
 legend_chronicle_valiant_defense_desc:0 "Contra todas as probabilidades, [defender.GetName] repeliu as hordas de [attacker.GetName]."
 legend_chronicle_war_won_chronicle:0 "Conquista de [title.GetNameNoTooltip]"
 legend_chronicle_war_won_chronicle_desc:0 "[winner.GetTitledFirstName] conquistou legitimamente [title.GetName] do indigno [loser.GetFirstName]."
 legend_chronicles:0 "As Crônicas da Família $legend_ruler_family_loc$"
 legend_compendium:0 "O Compendium dos $legend_ruler_family_loc$"
 legend_conqueror_chronicle:0 "$legend_chronicle_conqueror_chronicle$"
 legend_conqueror_chronicle_desc:0 "$legend_chronicle_conqueror_chronicle_desc$"
 legend_corineus:0 "A Balada de Corineus"
 legend_corineus_desc:0 "Corineus, antigo guerreiro troiano, foi o fundador original da Cornualha. Ele veio para a Britânia e matou os gigantes que ocupavam a área e nomeou o lugar de Cornualha em sua homenagem."
 legend_cost_scale_by_era_desc:0 "Era [GetPlayer.GetCulture.GetCultureEra.GetNameNoTooltip]"
 legend_court:0 "A Corte $legend_ruler_loc$"
 legend_crusader:0 "[GetTrait('faith_warrior').GetNameNoTooltip(protagonist)] [ancestor.GetTitleAsNameNoTooltip|U]"
 legend_crusader_desc:0 "[protagonist.GetNameNoTooltip] cometeu muitos feitos grandiosos e piedosos ao conquistar a terra santa."
 legend_deeds:0 "Os Feitos $legend_ruler_loc$"
 legend_descendants_of_brahman:0 "Sangue de Brahman"
 legend_descendants_of_brahman_desc:0 "Somos filhos e filhas dos Deuses. Brahman, Vishnu, nosso sangue pode ser rastreado até o início dos tempos."
 legend_dialogues:0 "Os Diálogos $legend_ruler_loc$"
 legend_divine_intervention_desc:0 "[protagonist.GetNameNoTooltip] falou com [Localize(god)] em seus sonhos, recebendo uma missão divina."
 legend_divine_intervention_name:0 "Abençoado por [Localize(god)|U]"
 legend_edward_the_martyr:0 "Eduardo, o Mártir"
 legend_edward_the_martyr_desc:0 "Assassinado e enterrado sem honras, o corpo de Eduardo, o Mártir, foi encontrado incorrupto após um ano. Diz-se que ele abraçou sua própria morte por um profundo amor a Cristo."
 legend_el_cid:0 "A Canção de El Cid"
 legend_el_cid_desc:0 "Rodrigo Díaz de Vivar era um nobre menor desonrado, agora tornou-se um rei por direito próprio."
 legend_ending_decision_tt:0 "Obtenha acesso à [decision|E] #EMP $commission_legend_artifact_decision$#!, permitindo que você comissiona uma crônica para comemorar sua lenda."
 legend_epic:0 "O Épico $legend_ruler_loc$"
 legend_events.0001.a:0 "Excelente trabalho!"
 legend_events.0001.b:0 "Até eu acho isso difícil de acreditar."
 legend_events.0001.desc.intro:0 "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se apressa animado para me cumprimentar quando eu entro na corte.\n\n"
 legend_events.0001.desc.mid.ancestral_saint:0 "\"[ROOT.Char.GetFaith.HighGodName|U] está sorrindo para sua casa hoje, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]. Tenho buscado informações sobre seu auspicioso ancestral [legend_character.GetName], e encontrei informações que potencialmente tornariam [legend_character.GetSheHe] digno de ser considerado um [GetTrait('saint').GetNameNoTooltip( ROOT.Char )]!"
 legend_events.0001.desc.mid.ancient_people:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], pesquisei os registros e encontrei algumas informações que indicam que sua linhagem pode ser rastreada até as grandes dinastias [ancient_culture.GetName]!"
 legend_events.0001.desc.mid.auspicious_stars:0 "\"[ROOT.Char.GetFaith.HighGodName|U] sorri para nós hoje, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip], assim como [ROOT.Char.GetFaith.HighGodNameSheHe] fez no dia em que você nasceu. De fato, você nasceu sob estrelas auspiciosas, um sinal dos grandes feitos que você realizaria na vida."
 legend_events.0001.desc.mid.exotic_backstory:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], você nunca se sentiu completamente um [ROOT.Char.GetCulture.GetName] [ROOT.Char.GetWomanMan], não é mesmo? Acredito que muitos anos atrás, você veio de uma terra mística longe daqui."
 legend_events.0001.desc.mid.fought_the_devil:0 "\"Estou ciente de que você tem sido atormentado por pesadelos ultimamente. Tenho motivos para acreditar que essas visões são flashes de sua batalha com [ROOT.Char.GetFaith.DevilName] no [ROOT.Char.GetFaith.NegativeAfterLife]."
 legend_events.0001.desc.mid.godly_descent:0 "[chronicler.GetSheHe|U] cai de joelhos e beija meus pés. \"Oh, mais sagrado [ROOT.Char.GetTitleAsNameNoTooltip|U]. Tenho fortes motivos para suspeitar que você é um descendente sanguíneo de [ROOT.Char.GetFaith.HighGodName|U] [ROOT.Char.GetFaith.HighGodHerselfHimself]!"
 legend_events.0001.desc.mid.old_godly_descent:0 "\"Bom dia para você, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], ou devo [Select_CString( ROOT.Char.IsFemale, 'chamá-la', 'chamá-lo' )] '[ROOT.Char.Custom('GetDaughterSon')|U] de [legend_character.GetFaith.HighGodName|U]'? Na verdade, pesquisei nos registros e acredito que o 'deus' de seus ancestrais na verdade era um mortal heroico que cometeu uma grande quantidade de feitos heroicos."
 legend_events.0001.desc.mid.raised_by_animals:0 "\"Bom dia, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]. Quanto você se lembra de sua infância? Alguns tomos no arquivo indicam que você foi criado na natureza por [ROOT.Char.Custom('GetAnimalPlural')]."
 legend_events.0001.desc.mid.slew_dragon:0 "\"Trago excelentes notícias, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]! Tenho procurado por tomos e lendas sobre [legend_character.GetName], e tenho motivos para acreditar que [legend_character.GetSheHe] lutou e matou um dragão!"
 legend_events.0001.desc.mid.spoke_to_angels:0 "\"Lembro-me de muitas noites atrás quando você me disse que tinha sido visitado por anjos. [Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], tenho motivos para acreditar que isso não foi um mero sonho, mas uma visão de [ROOT.Char.GetFaith.PositiveAfterLife]."
 legend_events.0001.desc.mid.virgin_birth:0 "\"[ROOT.Char.GetFaith.HighGodName|U] sorri para nós hoje, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip], assim como [ROOT.Char.GetFaith.HighGodNameSheHe] fez para sua mãe quando você foi concebido. De fato, você não foi um bastardo, sua mãe teve a sorte de ser abençoada com uma concepção imaculada!"
 legend_events.0001.desc.outro:0 "Algumas pessoas podem achar isso um pouco fantasioso e seria necessário algum esforço para provar que é verdade, mas há uma base sólida para torná-lo uma lenda viva!"
 legend_events.0001.t:0 "Crônica: Uma Lenda Encontrada"
 legend_events.0010.a.failure:0 "[potential_promoter.GetName] não está convencido"
 legend_events.0010.a.success:0 "[potential_promoter.GetName] está convencido"
 legend_events.0010.a:0 "Talvez [potential_promoter.GetSheHe] possa ser persuadido."
 legend_events.0010.b:0 "Talvez distorcer a verdade faça [potential_promoter.GetSheHe] acreditar."
 legend_events.0010.c:0 "[potential_promoter.GetSheHe|U] pode pensar o que [potential_promoter.GetSheHe] quiser."
 legend_events.0010.desc:0 "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me cumprimenta na corte esta manhã, ansioso com uma notícia na ponta da língua.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], acredito que [potential_promoter.Custom2('YourCharacterIntroduction', ROOT.Char)] está quase convencido da veracidade de [ROOT.Char.GetPromotedLegend.GetName]! [potential_promoter.GetSheHe|U] está ciente da história e parece totalmente encantado com ela, mas não está convencido da verdade por trás dela.\""
 legend_events.0010.t:0 "$chronicler_court_position$: A Lenda se Espalha"
 legend_events.0020.a:0 "Sim! Seus anciãos falavam sobre o [ROOT.Char.GetDynasty.GetNameNoTooltip]!"
 legend_events.0020.b:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] é o assunto dos contos [seed_presenter.GetCulture.GetPrefixNoTooltip]."
 legend_events.0020.c:0 "Um governante [ROOT.Char.GetCulture.GetPrefixNoTooltip] não se importa com o que os camponeses [seed_presenter.GetCulture.GetCollectiveNounNoTooltip] resmungam."
 legend_events.0020.desc:0 "Um hóspede estrangeiro se aproxima do meu trono e proclama em voz alta:\n\n\"Tem sido um tempo desde que cheguei à sua corte. Eu observei cuidadosamente como você governa e lida com assuntos do reino, tanto pequenos quanto grandiosos. E eu não poderia estar mais impressionado.\n\nEntre os [seed_presenter.GetCulture.GetCollectiveNoun], há uma antiga história de um governante lendário de uma dinastia distinta. É uma história que minha mãe me contou quando era jovem. Ela ouviu pela primeira vez de sua mãe, há tanto tempo.\n\nE agora, tenho o grande prazer de dizer que acredito que você é o lendário [ROOT.Char.GetTitleAsNameNoTooltip|U] das lendas [seed_presenter.GetCulture.GetPrefix]. E acredito que qualquer verdadeiro filho de [seed_presenter.GetCulture.GetName] certamente concordaria comigo!\""
 legend_events.0020.t:0 "Cooptação da Lenda"
 legend_events.1000.a:0 "#EMP Ah!#! Apenas pegue."
 legend_events.1000.b:0 "Tenho certeza de que foi #EMP muito#! mais barato."
 legend_events.1000.desc:0 "Ter uma natureza tão vergonhosa! Tão enganosa! Ofereci-lhe ouro para promover minha lenda e você me retribui apenas largando-a como um cachorro doente."
 legend_events.1000.t:0 "Para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('legend_owner'))] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 legend_exotic_backstory_desc:0 "[protagonist.GetNameNoTooltip] viajou longe, até [Localize(location.GetString)] e de volta."
 legend_exotic_backstory_name:0 "A Odisseia de [protagonist.GetNamePossessiveNoTooltip|U]"
 legend_fought_devil_desc:0 "Em um sonho, [protagonist.GetNameNoTooltip] lutou contra [protagonist.GetFaith.DevilName] [protagonist.GetFaith.DevilHerselfHimself], um sinal auspicioso de que [protagonist.GetSheHe] estava destinado(a) a derrotar o mal."
 legend_fought_devil_name:0 "Um Confronto com [protagonist.GetFaith.DevilName|U]"
 legend_genealogy:0 "A Genealogia $legend_ruler_loc$"
 legend_gesta:0 "A Gesta $legend_ruler_loc$"
 legend_godly_descent_desc:0 "[Localize( god )|U] é meu ancestral, e com esse sangue em minhas veias, realizarei maravilhas."
 legend_godly_descent_name:0 "O Sangue de [Localize( god )|U]"
 legend_gospel:0 "O Evangelho $legend_ruler_loc$"
 legend_gothic_kings:0 "Reis Góticos"
 legend_gothic_kings_desc:0 "Os Godos trouxeram a destruição de Roma e fundaram nosso Reino. Somos seus herdeiros, os Reis e Rainhas dos Godos."
 legend_heroic:0 "Lenda Heroica"
 legend_heroic_desc:0 "[ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip] é renomado por suas façanhas heroicas."
 legend_heroic_name:0 "A Lenda de [ROOT.Legend.GetOwner.GetNameNoTooltip]"
 legend_hieros_gamos_skirnismal:0 "Hieros Gamos"
 legend_hieros_gamos_skirnismal_desc:0 "Fjolnir, fundador da dinastia Yngling, foi gerado dos lombos de Gerðr em seu amor por Freyr. Quem mais além dos descendentes de Fjolnir poderia possuir o sangue divino necessário para governar a Noruega?"
 legend_history:0 "A História da Família $legend_ruler_family_loc$"
 legend_holy:0 "Lenda Sagrada"
 legend_holy_desc:0 "A santidade demonstrada por [ROOT.Legend.GetOwner.GetTitledFirstNameNoTooltip] é admirada por todo seguidor de [ROOT.Char.GetFaith.HighGodName]."
 legend_holy_name:0 "Os Milagres de [ROOT.Legend.GetOwner.GetNameNoTooltip]"
 legend_holy_site:0 "$legend_saintly_location_name$"
 legend_holy_site_desc:0 "$legend_saintly_location_desc$"
 legend_holy_warrior:0 "O Punho Sagrado"
 legend_holy_warrior_desc:0 "Um grande guerreiro santo, este herói lutou valorosamente por sua fé."
 legend_hunnic_heritage:0 "Herança Hunnica"
 legend_hunnic_heritage_desc:0 "Nosso povo pode traçar suas linhagens de volta às famílias dos Hunos, e o fundador de nossa dinastia foi, na verdade, o feroz Átila que colocou Roma de joelhos."
 legend_king_arthur:0 "O Legado de Arthur Pendragon"
 legend_king_arthur_desc:0 "O rei uma vez e futuro vive através do sangue desta dinastia."
 legend_kings_of_semien:0 "Reis de Semien"
 legend_kings_of_semien_desc:0 "Beta Israel é o lendário reino judeu que continua a resistir fervorosamente à cristianização. Somos descendentes da Tribo de Dã, que fugiu de Israel durante a guerra civil entre as forças de Reoboão e Jeroboão."
 legend_legitimizing:0 "Lenda Legitimadora"
 legend_legitimizing_desc:0 "A linhagem da dinastia [ROOT.Legend.GetOwner.GetDynasty.GetBaseNameNoTooltip] governa estas terras há séculos."
 legend_legitimizing_name:0 "A Genealogia de [ROOT.Legend.GetOwner.GetNameNoTooltip]"
 legend_life:0 "A Vida $legend_ruler_loc$"
 legend_logia:0 "A Logia $legend_ruler_loc_possessive$"
 legend_magi:0 "Filhos dos Magos"
 legend_magi_desc:0 "Após o nascimento de Jesus, Ele foi visitado pelos Magos Bíblicos, que trouxeram presentes de ouro, incenso e mirra. O Evangelho de Mateus afirma que os Três Reis Magos vieram do Oriente.\nUm viajante ocidental desinformado poderia colocar a visão da Estrela de Belém na cidade persa de Saba.\nMas o sol está nascendo mais a Leste. As riquezas vêm das cidades, mas a fé inabalável vem da dura estepe.\nA Bíblia fala de Melchior, Gaspar e Baltasar retornando às suas terras natais após prestar homenagem ao recém-nascido Rei dos Judeus. Sua carne e sangue, os mais piedosos nestorianos, ainda adoram o único Deus verdadeiro e Seu filho."
 legend_manuscripts:0 "Os Manuscritos dos $legend_ruler_family_loc$"
 legend_menelik_i:0 "Filhos de Davi"
 legend_menelik_i_desc:0 "O fundador de nossa dinastia, Menelik I, foi o resultado do amor entre Salomão de Israel e a Rainha de Sabá."
 legend_miracles:0 "Os Milagres $legend_ruler_loc$"
 legend_myth:0 "O Mito $legend_ruler_loc$"
 legend_mythical_descent_desc:0 "Um dos meus ancestrais foi um poderoso [Localize( creature )]."
 legend_mythical_descent_name:0 "Sangue de [Localize( creature )|U]"
 legend_naga_descent:0 "Sangue do Naga"
 legend_naga_descent_desc:0 "Os Naga são criaturas santas meio humanas e meio serpentes que residem em Patala, e ocasionalmente podem atravessar para nosso mundo como humanos completos. Nossa família pode traçar sua linhagem até um Naga que uma vez visitou Caxemira e se deitou com um humano."
 legend_nama:0 "O Nama $legend_ruler_loc$"
 legend_new_troy_london:0 "Nova Troia"
 legend_new_troy_london_desc:0 "Bruto, banido de Troia, foi guiado por Diana para Albion. Após derrotar os grandes gigantes que ocupavam a terra, ele fundou Troia Nova, a cidade que hoje conhecemos como Londres."
 legend_no_legend:0 "Você não está promovendo nenhuma [legends|E]"
 legend_of_genghis_desc:0 "Tudo que está sob o céu pertence ao maior de todos os Cãs. Com o povo mongol unido atrás de [Select_CString( founder.IsFemale, 'uma única', 'um único' )] [founder.GetTitleAsNameNoTooltip|U], os lobos uivam e as águias choram enquanto Cã Genghis queima seu nome pelo mundo."
 legend_of_genghis_name:0 "O Maior dos Cãs"
 legend_of_israel_desc:0 "Israel, um Reino para o povo escolhido de Deus, subjugado por assírios, babilônios e romanos. Nosso êxodo da Terra Prometida enviou nosso povo em uma jornada ao redor do mundo, mas agora um novo Reino de Israel se ergue e o povo de Deus habita suas terras mais uma vez!"
 legend_of_israel_name:0 "[Select_CString( founder.IsFemale, 'A Nova', 'O Novo' )] [founder.GetTitleAsNameNoTooltip|U] de Israel"
 legend_of_mann_desc:0 "Através das ondas da Britânia, os marinheiros contam histórias de um grande e terrível pirata [founder.GetTitleAsNameNoTooltip], [Select_CString( founder.IsFemale, 'a', 'o' )] aterrorizante [founder.GetName]. Até mesmo os mais poderosos guerreiros empalidecem ao ver aqueles barcos aparecendo em suas praias. Render-se seria a única opção, se apenas [Select_CString( founder.IsFemale, 'a', 'o' )] [founder.GetTitleAsNameNoTooltip|U] aceitasse tal coisa."
 legend_of_mann_name:0 "[Select_CString( founder.IsFemale, 'A', 'O' )] [founder.GetTitleAsNameNoTooltip|U] Pirata"
 legend_of_n_sea_desc:0 "O Mar do Norte tem sido o domínio dos dinamarqueses, e agora, sob o governo de [founder.GetName], um império se ergue sobre as ondas."
 legend_of_n_sea_name:0 "Domínio do Mar"
 legend_of_rome_desc:0 "Roma, outrora reduzida a uma memória distante, agora ressurge com um novo César, pronto para trazer civilização mais uma vez a uma nova era."
 legend_of_rome_name:0 "Um Novo César"
 legend_of_slavia_desc:0 "Os povos eslavos se espalharam por toda a Europa, mas agora [founder.GetFirstName] se destaca como [Select_CString( founder.IsFemale, 'a primeira', 'o primeiro' )] [founder.GetTitleAsNameNoTooltip|U] de todos os eslavos!"
 legend_of_slavia_name:0 "O Império dos Eslavos"
 legend_peasant_emperor:0 "Do Camponês ao Basileu"
 legend_peasant_emperor_desc:0 "Basil nasceu de agricultores camponeses e entrou ao serviço do Imperador antes de se casar com sua filha e ascender ao posto de Basileu ele mesmo."
 legend_poem:0 "O Poema $legend_ruler_loc$"
 legend_premysl:0 "Přemysl, o Agricultor"
 legend_premysl_desc:0 "Nosso ancestral começou a vida como um mero camponês na aldeia de Stadice, mas logo chamou a atenção de Libuše e casou-se com ela para se tornar Príncipe dos Tchecos."
 legend_prophecies:0 "As Profecias $legend_ruler_loc$"
 legend_province_loc:0 "[protagonist.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U]"
 legend_purana:0 "O Purana de $legend_province_loc$"
 legend_pyusawhti:0 "Herdeiros da Deusa Dragão"
 legend_pyusawhti_desc:0 "Nascidos do útero de uma deusa dragão, e descendentes de Mahasammata, temos o mais santo e poderoso sangue carregado por nossa linhagem."
 legend_quality_famed:0 "[legend_famed|E]"
 legend_quality_illustrious:0 "[legend_illustrious|E]"
 legend_quality_mythical:0 "[legend_mythical|E]"
 legend_ragnarr:0 "Filhos de $nick_lodbrok$"
 legend_ragnarr_desc:0 "Rei dos Dinamarqueses e matador de um poderoso dragão, [ancestor.GetFirstNameNoTooltip] foi um terror para os cristãos e um aventureiro lendário. As grandes realizações de sua vida são muitas para enumerar, e com seu sangue fluindo por mim, é apenas justo que eu reivindique seu legado e construa uma história lendária só minha!"
 legend_record:0 "Os Registros da Família $legend_ruler_family_loc$"
 legend_roman_heritage:0 "Herança Romana"
 legend_roman_heritage_desc:0 "Nossa família não apenas governa em um Império Romano moderno, mas tem sido cortesã influente em Roma desde os dias da República."
 legend_ruler_family_loc:0 "[protagonist.GetDynastyNameNoTooltip|U]"
 legend_ruler_loc:0 "[Select_CString( protagonist.IsFemale, 'da', 'do' )] [protagonist.GetFirstNameNoTooltip|U]"
 legend_ruler_loc_possessive:0 "[Select_CString( protagonist.IsFemale, 'da', 'do' )] [protagonist.GetFirstNamePossessiveNoTooltip|U]"
 legend_ruler_title_loc:0 "[protagonist.GetPrimaryTitle.GetNameNoTier|U]"
 legend_ruler_title_loc_possessive:0 "[Select_CString( protagonist.IsFemale, 'A', 'O' )] [protagonist.GetTitleAsNameNoTooltip|U]s"
 legend_sacred_birth_desc:0 "As circunstâncias do nascimento de [protagonist.GetNamePossessiveNoTooltip] estão envoltas em misticismo, um sinal seguro de que [protagonist.GetSheHe] foi abençoado(a) por [protagonist.GetFaith.HighGodName|U] desde o início."
 legend_sacred_birth_name:0 "Nascimento [ROOT.Char.CustomFixedRandom('GetPiousAdj')|U] de [protagonist.GetFirstNamePossessiveNoTooltip|U]"
 legend_saga:0 "A Saga $legend_ruler_loc$"
 legend_saintly_building_desc:0 "Construir [ROOT.Char.GetFaith.HouseOfWorshipPlural] é um ato de altruismo — uma grande prova de uma alma piedosa."
 legend_saintly_building_name:0 "O Construtor Mais [ROOT.Char.CustomFixedRandom('GetPiousAdj')|U] de [location.GetNameNoTooltip]"
 legend_saintly_deed_desc:0 "Os atos piedosos de [ancestor.GetShortUINamePossessive|U] em nome de [religion.GetName] são certamente dignos de veneração."
 legend_saintly_deed_name:0 "Os Atos Mais [ROOT.Char.CustomFixedRandom('GetPiousAdj')|U] de [ancestor.GetNameNoTooltip|U]"
 legend_saintly_descent_desc:0 "O sangue sagrado de [Localize( ancestor_flag )] corre em nossas veias, e com ele realizaremos milagres."
 legend_saintly_descent_name:0 "[ROOT.Char.CustomFixedRandom('GetDescendantSynonym')|U] de [Localize( ancestor_flag )|U]"
 legend_saintly_life_desc:0 "A vida devota que [protagonist.GetTitledFirstNameNoTooltip] viveu concedeu-lhe um status quase santo."
 legend_saintly_life_name:0 "O Mais [ROOT.Char.CustomFixedRandom('GetPiousAdj')|U] de [protagonist.GetTitledFirstNameNoTooltip]"
 legend_saintly_location_desc:0 "Possuir um local sagrado para [faith.GetNameNoTooltip] é uma marca de santidade em si."
 legend_saintly_location_name:0 "[ROOT.Char.CustomFixedRandom('GetCustodianSynonym')|U] do Santuário [protagonist.GetFaith.GetAdjectiveNoTooltip] Sagrado"
 legend_saman_khudah:0 "Descendente de Bahram Chobin"
 legend_saman_khudah_desc:0 "General, conquistador e usurpador, Bahram Chobin tomou o trono sassânida para si, e seu sangue heróico corre em nossas veias."
 legend_sayings:0 "Ditados $legend_ruler_loc$"
 legend_sceafa:0 "Sceafa, Neto de Noé"
 legend_sceafa_desc:0 "O antigo rei lombardo Sceafa saiu do mar quando criança e governou a Inglaterra. Sabemos que ele era neto de Noé, e é dele que herdamos nosso sangue divino."
 legend_scota:0 "Filhos de Scota"
 legend_scota_desc:0 "É de Scota, filha de um grande Faraó egípcio, que chamamos nossa terra de \"Escócia\". Ela é a mãe de todos os escoceses, e é o sangue dos antigos Faraós que corre em nossas veias."
 legend_scriptures:0 "Escrituras $legend_ruler_loc_possessive$"
 legend_seed_ghw.tt:0 "Ganha uma [legend_seed|E] $trait_crusader_king$"
 legend_shibi_chakravarti:0 "Shibi Chakravarti"
 legend_shibi_chakravarti_desc:0 "Paradigma de humildade e piedade, o heróico Rei Shibi foi encarregado de proteger o sábio Agni, que havia sido transformado em um pássaro. Quando um gavião exigiu que ele sacrificasse sua própria carne para salvar a pomba, Shibi deu-se inteiramente de bom grado, mas foi poupado e recompensado com seu filho Kapotaroma. É o sangue deste rei altruísta que corre nas veias de cada [GetDynastyByID('1043008').GetNameNoTooltip]."
 legend_song:0 "A Canção $legend_ruler_loc$"
 legend_sons_of_david:0 "Herdeiros de Davi"
 legend_sons_of_david_desc:0 "Davi, Rei de Israel, foi ordenado por Deus e seu sangue corre nas veias de cada [GetDynastyHouseByID('house_bagrationi').GetNameNoTooltip]."
 legend_sons_of_rurik:0 "Filhos de Rurik"
 legend_sons_of_rurik_desc:0 "O Príncipe Varangiano Rurik levou sua horda de aventureiros para o leste e estabeleceu o grande Reino de Novgorod. É o seu lendário sangue que corre em nossas veias."
 legend_spread_notification_desc:0 "[spread_legend.GetName] se espalha para [spread_county.GetName]"
 legend_spread_notification_title:0 "Lenda se espalha pelo seu reino!"
 legend_story:0 "A História $legend_ruler_loc$"
 legend_sutra:0 "O Sutra $legend_ruler_loc$"
 legend_tale:0 "O Conto $legend_ruler_loc$"
 legend_texts:0 "Os Textos de $legend_province_loc$"
 legend_the_red_hand:0 "A Mão Vermelha de Ulster"
 legend_the_red_hand_desc:0 "Dizem que nos primeiros dias da Irlanda, foi feita uma promessa de que o primeiro a colocar a mão em Ulster seria dado a ela, e se tornaria o Rei Supremo da Irlanda. Foi nosso ancestral que teve a sagacidade de cortar sua própria mão e lançá-la em Ulster, manchando a grama esmeralda com seu sangue."
 legend_the_wheelwright:0 "A Adega da Abundância"
 legend_the_wheelwright_desc:0 "No sétimo aniversário de seu filho, Piast, o Carpinteiro, foi visitado por dois estranhos. Em agradecimento pela sua hospitalidade, os estranhos lançaram um feitiço fazendo com que a adega de Piast estivesse eternamente cheia."
 legend_title_history:0 "$legend_ruler_title_loc_possessive$ de $legend_ruler_title_loc$"
 legend_tosny:0 "O Cavaleiro do Cisne"
 legend_tosny_desc:0 "O poderoso Roger de Tosny era descendente do Cavaleiro do Cisne, e usamos o Distintivo do Cisne até hoje para honrar sua lenda."
 legend_vamsavali:0 "Vamsavali $legend_ruler_family_loc$"
 legend_vercingetorix:0 "Herdeiros de Vercingetórix"
 legend_vercingetorix_desc:0 "Vercingetórix uniu uma vez as tribos gaulesas em uma rebelião contra a invasão romana. Embora tenha caído nas mãos de César, seu espírito celta vive em nosso sangue."
 legend_virgin_birth:0 "Concepção Imaculada"
 legend_virgin_birth_desc:0 "[protagonist.GetMother.GetNameNoTooltip] de alguma forma concebeu uma criança sem consumar com seu marido. Verdadeiramente, isso é um sinal de que [protagonist.GetFaith.HighGodName|U] presenteou [protagonist.GetMother.GetSheHe] com uma criança."
 legend_visions:0 "As Visões $legend_ruler_loc$"
 legend_william_gellones:0 "La Prise d'Orange"
 legend_william_gellones_desc:0 "Derrotador dos exércitos islâmicos em Orange, Guillaume Gellones foi um guerreiro para a Cristandade e fundou a abadia em Gellone onde ele mais tarde se aposentaria do governo como monge e lá se aposentaria."
 legend_wonders:0 "As Maravilhas $legend_ruler_loc$"
 legend_words:0 "Palavras $legend_ruler_loc$"
 legend_yazdagird_iii:0 "Sangue de [ancestor.GetFirstNameNoTooltip] III"
 legend_yazdagird_iii_desc:0 "O sangue do último xá sassânida corre em nossas veias. Embora [ancestor.GetSheHe] tenha sido cercado por turcos, cazaques e invasores árabes de todos os lados, [ancestor.GetSheHe] permaneceu leal à Pérsia até seu último suspiro."
 legendary_battle_desc:0 "[loser.GetName|U] tentou destruir [winner.GetName], e [loser.GetSheHe] foi de fato um oponente digno. Com [winner.GetFirstNameNoTooltip] emergindo vitorioso, não haverá fim para os feitos heroicos [winner.GetHerHim]!"
 legendary_battle_name:0 "A Batalha de [location.GetName|U]"
 mahishmati:0 "Mahishmati"
 must_own_france_or_hre_tt:0 "Você deve possuir pessoalmente [GetTitleByKey('k_france').GetNameNoTier], [GetTitleByKey('e_france').GetNameNoTier], ou [GetTitleByKey('e_hre').GetNameNoTier]"
 must_own_georgia_or_be_georgian_tt:0 "Você deve ou possuir [GetTitleByKey('k_georgia').GetNameNoTier], ter sua capital em [GetTitleByKey('k_georgia').GetNameNoTier], ou ser da cultura Georgiana"
 new_faith_legend_desc:0 "A igreja fraca e corrupta havia se desviado muito da vontade de [faith.HighGodNamePossessive] para a humanidade. Sob a liderança divina de [reformer.GetName], a única fé verdadeira [faith.GetName] nasceu."
 new_faith_legend_name:0 "[faith.GetNameNoTooltip|U] Vitoriosa"
 new_title_desc:0 "[Select_CString( founder.IsFemale, 'Uma nova', 'Um novo' )] [founder.GetTitleAsNameNoTooltip|U] surge das cinzas para trazer prosperidade sob o governo benevolente [founder.GetHerHim]."
 new_title_name:0 "[Select_CString( founder.IsFemale, 'Uma Nova', 'Um Novo' )] [founder.GetTitleAsNameNoTooltip|U]"
 no_pagans_in_britannia_tt:0 "Não deve haver [rulers|E] [GetReligionFamily('rf_pagan').GetName] [Concept('independent', 'Independentes')|E] em [GetGeographicalRegion('world_europe_west_britannia').GetName]"
 olympus:0 "Olimpo"
 persian_ender_name:0 "O Destino de [GetTitleByKey('e_persia').GetNameNoTierNoTooltip|U]"
 persian_or_zoroastrian_tt:0 "Sua capital deve estar em [GetGeographicalRegion('world_middle_east_persia').GetName], sua [culture|E] deve ter $heritage_iranian_name$, ou você deve ser [GetReligionByKey('zoroastrianism_religion').GetAdjective]"
 pilgrim_legend_desc:0 "[ancestor.GetNamePossessive] dedicou sua vida à jornada interminável rumo a [ancestor.GetFaith.PositiveAfterLife]. Somente [ancestor.GetFaith.HighGodName|U] verdadeiramente conhece todos os feitos que ocorreram no caminho sagrado de [ancestor.GetFirstNamePossessiveNoTooltip] em direção à salvação."
 pilgrim_legend_name:0 "Peregrino pelo Mundo"
 prester_john_kingdom:0 "o Reino do Preste João"
 priesthood_restoration_desc:0 "A [faith.GetName] foi reduzida a cinzas pela cruel mão do tempo. Agora, pela graça de [faith.HighGodName|U], [founder.GetName] reconstrói o sacerdócio."
 priesthood_restoration_name:0 "Uma Nova Sacerdócio"
 ramses:0 "Ramsés"
 reformed_faith:0 "A Consolidação de [religion.GetNameNoTooltip|U]"
 reformed_faith_desc:0 "A religião organizada estava determinada a destruir os velhos costumes, mas sob a orientação sábia e piedosa de [reformer.GetName], a fé [faith.GetName] foi trazida para uma nova era. As lendas agora codificadas em um livro sagrado e uma classe sacerdotal estruturada estabelecida, a vontade de [faith.HighGodNamePossessive] será feita!"
 shibi_chakravarti:0 "Shibi Chakravarti"
 spread_legend_intent:0 "Espalhar Lenda"
 spread_legend_intent_desc:0 "Você utilizará esta atividade como uma oportunidade para espalhar sua [legend|E]."
 spread_legend_intent_not_valid_desc:0 "#X Você não possui atualmente uma [legend|E]"
 struggle_conclusion_desc:0 "A [Localize(struggle.GetString)|U] chegou ao fim, e [struggle_ender.GetFirstName] emerge como o herói para inaugurar uma nova era para a região."
 struggle_conclusion_name:0 "O Fim de [Localize(struggle.GetString)|U]"
 sunset_empire:0 "o Império do Pôr do Sol"
 the_angels:0 "os Anjos"
 theologian_or_high_piety_tt:0 "Você deve ter o [trait|E] [GetTrait('theologian').GetName( GetNullCharacter )] ou ter pelo menos o [piety_level|E] $piety_level_3$"
 vercingetorix:0 "Vercingetórix"
 vinland:0 "Vinlândia"
 zoroast_priesthood_desc:0 "A fé Zoroastrista foi liderada pelos grandes Magos do passado, mas a ordem foi desmantelada. Pela graça de Ahuramazda, Anahita e Mithra, [protagonist.GetName] restaurou os Magos."
 zoroast_priesthood_name:0 "Reacendendo as Chamas"
