 feast.7204.desc:0 "O som de [ROOT.GetCharacter.Custom('GetMusicalInstrumentPlural')] preenche os salões de [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] enquanto os convidados sorvem as últimas gotas de [ROOT.Char.Custom('RegionalAlcoholicDrink')]. Acima deles, a voz de [bard.GetTitledFirstName] se eleva harmoniosamente.\n\n\"Agora ouçam! Agora ouçam! Pois eu lhes contarei sobre a história de [ROOT.Char.GetPromotedLegend.GetName]."
