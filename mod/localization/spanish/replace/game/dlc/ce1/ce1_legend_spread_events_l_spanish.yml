 legend_chain_army_modifier:0 "Nascido para a Batalha"
 legend_chain_army_modifier_desc:0 "Este personagem encontrou uma motivação renovada nas batalhas que virão."
 legend_chain_arrogant_modifier:0 "Um Verdadeiro Herói"
 legend_chain_arrogant_modifier_desc:0 "Este personagem está cheio de confiança em sua natureza heroica."
 legend_chain_chancellor_modifier:0 "Lenda Dúctil"
 legend_chain_chancellor_modifier_desc:0 "Este personagem contou com a ajuda de seu chanceler para recuperar a confiança em sua lenda."
 legend_chain_kinda_arrogant_modifier:0 "Um Herói Confiante"
 legend_chain_kinda_arrogant_modifier_desc:0 "Este personagem está determinado a mostrar a todos sua natureza heroica."
 legend_chain_marshal_modifier:0 "Lenda Marcial"
 legend_chain_marshal_modifier_desc:0 "Este personagem está focado em se tornar o melhor guerreiro possível."
 legend_chain_spouse_modifier:0 "Apoio Inestimável"
 legend_chain_spouse_modifier_desc:0 "Este personagem foi comovido pelo apoio inestimável de seu cônjuge para sua lenda."
 legend_chain_zealous_modifier:0 "Lenda Zelosa"
 legend_chain_zealous_modifier_desc:0 "Este personagem encontrou as respostas de que precisava em um poder superior."
 legend_chapter_accept_mortality_conclusion:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] foi visitado por [ROOT.Legend.GetProtagonist.GetFaith.CreatorName], que falou diretamente com [ROOT.Legend.GetProtagonist.GetSheHe] sobre a natureza da criação e a beleza de uma vida finita. [ROOT.Legend.GetProtagonist.GetSheHe] emergiu dessa confrontação lendária como uma pessoa mudada, em paz com a natureza efêmera da vida e a tranquilidade de [ROOT.Legend.GetProtagonist.GetFaith.PositiveAfterLife]."
 legend_chapter_battled_mighty_beast_bad:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] decidiu atacar uma besta poderosa e foi permanentemente ferido no esforço fútil."
 legend_chapter_battled_mighty_beast_good:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] lutou valentemente e venceu uma grande e poderosa besta, mas a luta deixou uma marca permanente em seu corpo."
 legend_chapter_confronted_creator_conclusion:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] foi visitado por [ROOT.Legend.GetProtagonist.GetFaith.CreatorName], que falou diretamente com [ROOT.Legend.GetProtagonist.GetSheHe] sobre a natureza da criação e a beleza de uma vida finita. [ROOT.Legend.GetProtagonist.GetSheHe] desafiou até mesmo o seu próprio criador e jurou continuar sua busca pela imortalidade."
 legend_chapter_discovery_mythical_beast:0 "Durante sua jornada, [ROOT.Legend.GetProtagonist.GetFirstName] fez uma descoberta que abalou seu âmago. Mitos antigos sobre criaturas selvagens e maravilhosas foram provados verdadeiros além de qualquer sombra de dúvida, e todos aclamaram [ROOT.Legend.GetProtagonist.GetFirstName] por sua bravura e mente inquisitiva."
 legend_chapter_discovery_new_myth:0 "Enquanto [ROOT.Legend.GetProtagonist.GetFirstName] vagava, [ROOT.Legend.GetProtagonist.GetSheHe] encontrou ainda mais do que jamais havia sonhado ao partir em sua jornada. Uma criatura rara e extraordinária, duas vezes o tamanho de um homem, com seis pernas e um braço crescendo de seu torso! Tal besta nunca fora ouvida antes, e assim [ROOT.Legend.GetProtagonist.GetFirstName] acrescentou à crescente história de [ROOT.Legend.GetName]."
 legend_chapter_discovery_vinland:0 "Enquanto [ROOT.Legend.GetProtagonist.GetFirstName] vagava, [ROOT.Legend.GetProtagonist.GetSheHe] descobriu algo anteriormente apenas rumorado e falado fantasiosamente. O mítico Vinland, uma grande terra ao norte gélido, não era apenas real, mas habitável! Verdadeiramente, as grandes histórias teriam mais uma figura gravada nelas mais uma vez, desta vez falando de [ROOT.Legend.GetProtagonist.GetFirstName]."
 legend_chapter_easily_captured:0 "[ROOT.Legend.GetProtagonist.GetName|U] foi emboscado e assediado, repetidas vezes, por malfeitores que buscavam impedir [ROOT.Legend.GetProtagonist.GetSheHe] em sua nobre missão. Muitas vezes [ROOT.Legend.GetProtagonist.GetFirstName|U] foi emboscado e permaneceu cativo, adiado em sua nobre jornada."
 legend_chapter_forged_own_path:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] sabia que a jornada que se avizinhava seria perigosa, mas seu caminho estava traçado desde o início. Sem jamais hesitar, [ROOT.Legend.GetProtagonist.GetSheHe] traçou uma rota e um propósito, guiada apenas pela força de sua própria vontade."
 legend_chapter_great_battle:0 "As forças de [ROOT.Legend.GetProtagonist.GetNamePossessive] foram encurraladas por [ROOT.Legend.MakeScope.Var('8141_commander').Char.GetNameNoTooltip] e seu exército. A batalha foi longa e sangrenta, e muitas vidas foram perdidas, mas [ROOT.Legend.GetProtagonist.GetNameNoTooltip] emergiu vitorioso, estandartes e armas encharcados com o sangue de seus inimigos."
 legend_chapter_immortal:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] foi agitado na noite por uma visita chocante de [ROOT.Legend.GetProtagonist.GetFaith.DeathDeityName|U]. Desde essa visita aterradora, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] decidiu fugir daquilo que os outros chamariam de inevitável e buscar a vida eterna na terra."
 legend_chapter_immortal_child_conclusion:0 "Os temores de [ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip] sobre a eternidade de [ROOT.Legend.GetProtagonist.GetFaith.PositiveAfterLife] foram finalmente dissipados com o nascimento de [ROOT.Legend.MakeScope.Var('8171_child').Char.GetNameNoTooltip], [Select_CString( ROOT.Legend.MakeScope.Var('8171_child').Char.IsFemale, 'sua', 'seu' )] [ROOT.Legend.MakeScope.Var('8171_child').Char.Custom('GetDaughterSon')]. No bebê, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] viu o seu próprio futuro e a eternidade do seu legado."
 legend_chapter_injured_evangelising_bad:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] estava pregando heresia entre os camponeses e foi ferido por um grupo de verdadeiros crentes."
 legend_chapter_injured_evangelising_good:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] estava valentemente evangelizando a fé entre hereges e descrentes quando foi atacado por suas crenças e ficou permanentemente deformado."
 legend_chapter_love:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] conquistou a mão do amor de sua vida, [ROOT.Legend.MakeScope.Var('8160_soulmate').Char.GetNameNoTooltip]. Por todos os grandes feitos realizados para os outros, [ROOT.Legend.MakeScope.Var('8160_soulmate').Char.GetFirstNameNoTooltip] estava ao lado [ROOT.Legend.GetProtagonist.GetHerHim] o tempo todo, e dizem que o amor deles foi um presente de [ROOT.Legend.GetProtagonist.GetFaith.FertilityGodName]."
 legend_chapter_mysterious_injury:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] [ROOT.Legend.GetProtagonist.Custom('GainedPermanentInjury')] sob circunstâncias obscuras e misteriosas. O evento que levou ao seu [ROOT.Legend.GetProtagonist.Custom('PermanentInjuryAdjective')] permanece desconhecido para todos, exceto [ROOT.Legend.GetProtagonist.GetHerselfHimself]."
 legend_chapter_person_of_lake_bad:0 "Enquanto vagava meio delirante por beber água impura, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] viu visões de uma pessoa bela e sábia que apontou [ROOT.Legend.GetProtagonist.GetSheHe] para o destino mágico."
 legend_chapter_person_of_lake_good:0 "Vagueando pelos pântanos, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] encontrou uma pessoa grande e sábia vivendo nas águas, que deu a [ROOT.Legend.GetProtagonist.GetSheHe] uma missão divina."
 legend_chapter_person_of_lake_great:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] testemunhou um ser do [ROOT.Legend.GetProtagonist.GetFaith.PositiveAfterLife] emergir das águas. [ROOT.Legend.GetProtagonist.GetSheHe] conversou com eles e recebeu uma missão do [ROOT.Legend.GetProtagonist.GetFaith.HighGodName]."
 legend_chapter_person_of_lake_very_bad:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] encontrou um eremita velho e desgrenhado espumando pela boca e gritando profecias para quem quisesse ouvir. [ROOT.Legend.GetProtagonist.GetNameNoTooltip] levou esse habitante do pântano a sério e escolheu torná-lo seu destino."
 legend_chapter_punched_animal_bad:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] foi atacado pela [Localize( beast )] e lutou contra a besta em combate próximo. Embora [ROOT.Legend.GetProtagonist.GetSheHe] tenha acabado precisando ser resgatado pelo seu grupo de caça, a besta foi morta."
 legend_chapter_punched_animal_good:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] foi atacado pela [Localize( beast )] e lutou contra a besta em combate próximo. Apesar do elemento surpresa, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] matou a besta apenas com suas próprias mãos."
 legend_chapter_punched_animal_great:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] correu em direção ao [Localize( beast )] com o punho recuado e despedaçou a besta em miúdos com um único golpe poderoso no crânio."
 legend_chapter_punched_animal_very_bad:0 "Para confusão do grupo de caça [ROOT.Legend.GetProtagonist.GetHerHim], [ROOT.Legend.GetProtagonist.GetNameNoTooltip] se separou do grupo para atacar a [Localize( beast )] em suas partes íntimas. Depois de colocar o grupo em grande perigo e desonrar [ROOT.Legend.GetProtagonist.GetHerselfHimself], a besta foi morta."
 legend_chapter_raised_by_animal:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] se perdeu quando criança e foi adotado e criado por um [ROOT.Legend.MakeScope.Var('animal_parent').GetFlagName]. Muitos especulam que esta é a causa de sua suposta excentricidade."
 legend_chapter_revenge_quest:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip] jurou vingança contra [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetNameNoTooltip] pelo assassinato de seu pai. Como um agente de tudo o que é justo e correto na terra, [ROOT.Legend.GetProtagonist.GetNameNoTooltip] determinou que era seu propósito entregar justiça a esse vilão."
 legend_chapter_revenge_quest_complete:0 "Finalmente, [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetNameNoTooltip] foi morto e entregue a [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife] por [ROOT.Legend.GetProtagonist.GetNameNoTooltip]."
 legend_chapter_revenge_quest_divine_justice:0 "Parece que [ROOT.Legend.GetProtagonist.GetFaith.HighGodName|U] concordou com a avaliação de [ROOT.Legend.GetProtagonist.GetNamePossessive] e privou [ROOT.Legend.MakeScope.Var('8180_revenge_quest').Char.GetNameNoTooltip] de sua vida e o entregou a [ROOT.Legend.GetProtagonist.GetFaith.NegativeAfterLife] [ROOT.Legend.GetProtagonist.GetFaith.HighGodHerselfHimself]."
 legend_chapter_sea_monsters:0 "As jornadas que [ROOT.Legend.GetProtagonist.GetFirstName] fez enviaram [ROOT.Legend.GetProtagonist.GetSheHe] através dos mares, e [ROOT.Legend.GetProtagonist.GetSheHe] viu visões verdadeiramente aterrorizantes. Monstros marinhos gigantes e retorcidos os cercavam por todos os lados, e apenas a habilidosa navegação de [ROOT.Legend.GetProtagonist.GetFirstName] os trouxe em segurança para casa."
 legend_chapter_silver_tongued:0 "[ROOT.Legend.GetProtagonist.GetName|U] foi emboscado e assediado, repetidas vezes, por malfeitores que buscavam impedir [ROOT.Legend.GetProtagonist.GetSheHe] em sua nobre missão. No entanto, o perspicaz [ROOT.Legend.GetProtagonist.GetFirstName|U] os enganou repetidas vezes e escapou de suas garras."
 legend_commoners_celebrated:0 "Comuns, Celebrados"
 legend_commoners_celebrated_desc:0 "Esta história enfoca os camponeses trabalhadores, fortalecendo seus espíritos."
 legend_debug.0001.desc:0 "#D Este é um evento de depuração#!"
 legend_extra_mocking_modifier:0 "Lenda Zombada"
 legend_extra_mocking_modifier_desc:0 "A lenda deste personagem foi zombada por muitos."
 legend_hangover_modifier:0 "Ressaca"
 legend_hangover_modifier_desc:0 "Este personagem exagerou na bebida, para seu prejuízo."
 legend_lazy_modifier:0 "Não é Minha Responsabilidade"
 legend_lazy_modifier_desc:0 "Este personagem deixou o registro dos detalhes mais finos de sua lenda para outra pessoa."
 legend_memory_deed_modifier:0 "Memória Recente"
 legend_memory_deed_modifier_desc:0 "As façanhas extraordinárias deste personagem ainda estão presentes na memória de seu povo."
 legend_my_own_ancestor_modifier:0 "Minha Própria Lenda"
 legend_my_own_ancestor_modifier_desc:0 "Este personagem está destinado a se tornar seu próprio ancestral mítico"
 legend_no_mocking_modifier:0 "Lenda Respeitada"
 legend_no_mocking_modifier_desc:0 "Este personagem fez com que a zombaria de sua lenda parasse imediatamente."
 legend_nobles_noted:0 "Nobres, Notados"
 legend_nobles_noted_desc:0 "Esta história enfoca as proezas da nobreza e reforça seu direito de governar."
 legend_protagonist_legitimacy_major_tt:0 "Você ganha #positive_value [SCOPE.ScriptValue('major_legitimacy_gain')|0]#! legitimidade adicional de sua [legend_protagonist|E]"
 legend_protagonist_legitimacy_medium_tt:0 "Você ganha #positive_value [SCOPE.ScriptValue('medium_legitimacy_gain')|0]#! legitimidade adicional de sua [legend_protagonist|E]"
 legend_protagonist_legitimacy_miniscule_tt:0 "Você ganha #positive_value [SCOPE.ScriptValue('miniscule_legitimacy_gain')|0]#! legitimidade adicional de sua [legend_protagonist|E]"
 legend_protagonist_legitimacy_minor_tt:0 "Você ganha #positive_value [SCOPE.ScriptValue('minor_legitimacy_gain')|0]#! legitimidade adicional de sua [legend_protagonist|E]"
 legend_put_out_rumors_modifier:0 "Lenda Desacreditada"
 legend_put_out_rumors_modifier_desc:0 "Este personagem espalhou rumores duvidando de sua lenda."
 legend_quality_if_wins_tt:0 "O desconto para melhorar sua [legend|E] #difficulty_easy aumenta#! se você vencer o duelo"
 legend_shy_drinker:0 "Beberrão Tímido"
 legend_shy_drinker_desc:0 "Este personagem desenvolveu uma certa reputação de ser incapaz de segurar sua bebida."
 legend_spread_events.0001.a.tt.failure:0 "Ninguém acredita nas crianças"
 legend_spread_events.0001.a.tt.success:0 "Suas palavras parecem convincentes"
 legend_spread_events.0001.a:0 "\"Envie-as imediatamente!\""
 legend_spread_events.0001.b:0 "\"Não temos como provar isso. Seja discreto.\""
 legend_spread_events.0001.c:0 "\"Na verdade... [my_child.GetShortUIName] pode se juntar a elas.\""
 legend_spread_events.0001.d:0 "\"Eu sou #EMP minha#! própria lenda.\""
 legend_spread_events.0001.desc:0 "[Select_CString( chronicler.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstName] me recebe com um sorriso generoso em sua biblioteca.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], em nossos esforços para registrar sua lenda, pensamos em enviar algumas crianças pelos mercados para elogiar os feitos de [ancestor.GetName]."
 legend_spread_events.0001.t:0 "Vozes Inocentes"
 legend_spread_events.0010.a.tt.failure:0 "Suas mentiras são muito óbvias"
 legend_spread_events.0010.a.tt.success:0 "Todo o salão aplaude!"
 legend_spread_events.0010.a:0 "...dragão!"
 legend_spread_events.0010.b.tt.success:0 "Os cortesãos cantam com você"
 legend_spread_events.0010.b:0 "...uma #EMP enorme#! besta!"
 legend_spread_events.0010.c:0 "...apenas um urso bonitinho."
 legend_spread_events.0010.desc:0 "Uma voz melódica chama minha atenção no momento em que abro a [ROOT.Char.Custom('GetDoor')] do salão. Alguns dos meus [ROOT.Char.Custom('GetFollowerOrVassalPlural')] cercaram [Select_CString( bard.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bard'))] [bard.GetFirstName], que toca seu [bard.Custom('GetMusicalInstrument')], quase subindo na mesa de tanta emoção.\n\n\"E aqui [ROOT.Char.GetSheHe] está!\" [bard.GetSheHe] exclama, \"[Select_CString( ROOT.Char.IsFemale, 'Nossa própria', 'Nosso próprio' )] [ROOT.Char.GetTitleAsNameNoTooltip], cuja lenda eu canto com tanto fervor, pois [ROOT.Char.GetSheHe] com suas próprias mãos matou um...\""
 legend_spread_events.0010.t:0 "Um Verdadeiro Caçador"
 legend_spread_events.0020.a:0 "[courtier.GetSheHe|U] pode falar o que quiser. Nas masmorras."
 legend_spread_events.0020.b.tt.failure:0 "[courtier.GetShortUINameNoTooltip] se sente ofendido"
 legend_spread_events.0020.b.tt.success:0 "[courtier.GetShortUINameNoTooltip] se desculpa"
 legend_spread_events.0020.b:0 "\"Você, aí!\""
 legend_spread_events.0020.c:0 "Melhor fingir que não ouvi nada..."
 legend_spread_events.0020.desc.intro:0 "Ao descer as escadas e atravessar o pátio, chego a um dos corredores de onde os servos costumam observar as crianças.\n\nMas não são eles que encontro. A voz de [courtier.GetTitledFirstNamePossessive] me alcança, alta e clara, e me escondo entre as colunas de pedra:\n\n\"O que [protagonist.GetTitledFirstName] fez afinal? Havia algum de nós lá para ver a #EMP lenda#! que [ROOT.Char.GetSheHe] agora orgulhosamente nos faz cantar?"
 legend_spread_events.0020.desc.other_protag:0 "[ROOT.Char.GetTitledFirstName]"
 legend_spread_events.0020.desc.outro:0 "tão orgulhosamente nos faz cantar agora?\""
 legend_spread_events.0020.desc.you_protag:0 "[ROOT.Char.GetSheHe]"
 legend_spread_events.0020.t:0 "Espalhando Rumores"
 legend_spread_events.0030.a.flavor:0 "#EMP Bocejo...#! Tenho coisas melhores para fazer."
 legend_spread_events.0030.a:0 "\"Você não me ouviu da última vez?\""
 legend_spread_events.0030.b.tt.failure:0 "As pessoas não parecem convencidas"
 legend_spread_events.0030.b.tt.success:0 "Todos se lembram do seu grande feito"
 legend_spread_events.0030.b:0 "Ah, aquilo foi uma ocasião tão #EMP grandiosa#!..."
 legend_spread_events.0030.c:0 "Não sinto necessidade de mencionar isso novamente."
 legend_spread_events.0030.desc.intro:0 "\"Então me diga, [ROOT.Char.Custom('FormOfAddressForLiege')]...\" a voz do [Select_CString( chronicler.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstNamePossessive] me tira dos meus pensamentos e encontro [chronicler.GetSheHe] acenando com a mão, a pena derramando tinta pelo chão.\n\n"
 legend_spread_events.0030.desc.other_protag:0 "\"E sobre aquela vez que [legend_memory.GetThirdPerspectiveDescription]? Isso certamente vale a pena adicionar à lenda [protagonist.GetHerHim]...\""
 legend_spread_events.0030.desc.you_protag:0 "\"E sobre aquela vez que [legend_memory.GetSecondPerspectiveDescription]? Isso certamente vale a pena adicionar à sua lenda...\""
 legend_spread_events.0030.t:0 "Você Se Lembra?"
 legend_spread_events.0040.a:0 "\"Eu alguma vez ouviria um camponês?\""
 legend_spread_events.0040.b.tt.failure:0 "Sua piedade é claramente uma mentira"
 legend_spread_events.0040.b.tt.success:0 "Sua piedade é impressionante"
 legend_spread_events.0040.b:0 "\"Ah, que alma piedosa eu sou!\""
 legend_spread_events.0040.c:0 "\"O que isso acrescentaria?\""
 legend_spread_events.0040.desc.intro:0 "\"Ah, a luz brilha tão agradavelmente na [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'room_command_tent','room_throne_room')] esta manhã, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz [Select_CString( chronicler.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chronicler'))] [chronicler.GetFirstName], caminhando pela [ROOT.Char.Custom('GetRoom')].\n\n\"Isso me lembra muito o dia em que o destino decidiu começar...\""
 legend_spread_events.0040.desc.other_protag:0 "A lenda de [protagonist.GetTitledFirstNamePossessive]... você se lembra de como [ROOT.Legend.GetProtagonist.GetSheHe] foi benevolente,"
 legend_spread_events.0040.desc.outro:0 "atendendo aos apelos desesperados daquele camponês?\" diz [chronicler.GetSheHe], com um piscar de olhos eloquente."
 legend_spread_events.0040.desc.you_protag:0 "sua lenda... você se lembra de como foi benevolente,"
 legend_spread_events.0040.t:0 "Uma Petição Lacrimosa"
 legend_spread_events.0050.a:0 "\"Como ousa!? Eu sou #EMP casado#!!\""
 legend_spread_events.0050.b.tt.failure:0 "Seu gesto repugna [honored_lady.GetFirstNameNoTooltip]"
 legend_spread_events.0050.b.tt.success:0 "Seu gesto impressiona [honored_lady.GetFirstNameNoTooltip]"
 legend_spread_events.0050.b:0 "\"[honored_lady.GetSheHe|U] realmente é bela...\""
 legend_spread_events.0050.c:0 "\"Eu fiz isso por mim mesmo.\""
 legend_spread_events.0050.desc:0 "\"#EMP E [ROOT.Legend.GetProtagonist.GetSheHe] era galante\n e [honored_lady.GetSheHe] era bonita\n E [ROOT.Legend.GetProtagonist.GetSheHe] era um herói\n e [honored_lady.GetSheHe] era tãooooo bonita!#!\n\nNão leva muito tempo para descobrir de onde vem a música, pois logo encontro [bard.GetTitledFirstName], afinando brincalhonamente seu instrumento, apoiado em um banco de pedra.\n\n\"Ah, [ROOT.Char.Custom('FormOfAddressForLiege')],\" os olhos [bard.GetHerHim] imediatamente brilham, \"não é verdade que o motivo de sua lenda foi impressionar [honored_lady.GetTitledFirstName]?\""
 legend_spread_events.0050.t:0 "Ao Serviço de [Select_CString( honored_lady.IsFemale, 'uma', 'um' )] [honored_lady.GetLadyLord|U]"
 legend_spread_events.0060.a:0 "\"Ess[Select_CString( bad_vassal.IsFemale, 'a', 'e' )] [bad_vassal.Custom2('InsultNoun', ROOT.Char)] maldit[Select_CString( bad_vassal.IsFemale, 'a', 'o' )]...\""
 legend_spread_events.0060.b.tt.failure:0 "[bad_vassal.GetShortUIName] é acreditado"
 legend_spread_events.0060.b.tt.success:0 "As pessoas acreditam em você"
 legend_spread_events.0060.b:0 "Minha palavra é mais forte que a [bad_vassal.GetHerHim]."
 legend_spread_events.0060.c:0 "Corajoso da parte [bad_vassal.GetHerHim] tentar isso comigo..."
 legend_spread_events.0060.d:0 "Deixe-os falar."
 legend_spread_events.0060.desc.intro:0 "\"Uma palavra, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord|U],\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetFirstName] se aproxima de mim, com uma expressão preocupada no rosto. \"É sobre"
 legend_spread_events.0060.desc.other_protag:0 "[ROOT.Legend.GetProtagonist.GetShortUINamePossessive]"
 legend_spread_events.0060.desc.outro:0 "lenda... [bad_vassal.GetTitledFirstName] foi ouvido duvidando dela, a fofoca da corte começou a ecoar [bad_vassal.GetHerHim].\"\n\n\"Se você não parar isso a tempo, tenho medo de que todo camponês deste reino acreditará que é uma mentira.\""
 legend_spread_events.0060.desc.you_protag:0 "sua"
 legend_spread_events.0060.t:0 "Mais Mito do que Lenda"
 legend_spread_events.0070.a.tt:0 "Você vai refletir sobre isso"
 legend_spread_events.0070.a:0 "#EMP Claro que sou#!"
 legend_spread_events.0070.b:0 "Eu... Eu não tenho mais certeza."
 legend_spread_events.0070.c:0 "Eu não! Eu não! Eu não sou #EMP não!#!"
 legend_spread_events.0070.d:0 "Acho que sou."
 legend_spread_events.0070.desc:0 "Cantores ocupam o tablado de madeira, preenchendo a noite com música. Enquanto tomo um gole do meu [ROOT.Char.Custom('RegionalAlcoholicDrink')], fecho os olhos e permito-me um momento de descanso.\n\n'E agora! Todos ouçam! Todos ouçam! #EMP [ROOT.Char.GetPromotedLegend.GetName]#!!'\n\nO clamor dos meus [ROOT.Char.Custom('GetCourtierPlural')] preenche a sala — sons de talheres batendo na mesa e risadas estrondosas. Um pensamento duvidoso me assombra, entre a admiração da [ROOT.Char.Custom('GetCourt')].\n\nEu sou... digno?"
 legend_spread_events.0070.t:0 "Digno?"
 legend_spread_events.0071.a:0 "\"Uma alma gêmea. Junte-se a mim.\""
 legend_spread_events.0071.b:0 "[other_promoter.GetFirstNameNoTooltip] pode ser persuadido... um completo oposto."
 legend_spread_events.0071.c:0 "Vou convencer meu povo."
 legend_spread_events.0071.d:0 "Devo ser um herói para mim mesmo."
 legend_spread_events.0071.desc.fallback:0 "\n\nMeus [ROOT.Char.Custom('GetFollowerOrVassalPlural')]... o que eles veem em mim? Eu estendo a mão para a água. O que eles veem? Um... herói? Espero que sim, pelo menos."
 legend_spread_events.0071.desc.intro:0 "A água sobe das profundezas da fonte, pequenas bolhas estouram na superfície. Eu olho para baixo no azul e vejo meu próprio reflexo.\n\n"
 legend_spread_events.0071.desc.mid.arrogant:0 "Forte. Bonito. #EMP Digno.#!"
 legend_spread_events.0071.desc.mid:0 "Uma sombra de dúvida atrás dos meus olhos. Eu tento afastá-la."
 legend_spread_events.0071.desc.promoter:0 "\n\n'[ROOT.Char.GetTitledFirstNameNoTooltip]...? Eu me viro para ver [promoter.GetTitledFirstName] de pé ao meu lado. 'Por favor, me conte sobre sua lenda. Viajei muitos dias e noites para ouvi-la.'"
 legend_spread_events.0071.t:0 "Um Verdadeiro Herói"
 legend_spread_events.0072.a:0 "Apenas a opinião de [ROOT.Char.GetFaith.HighGodNamePossessive] importa."
 legend_spread_events.0072.b:0 "\"[praying_vassal.GetFirstNameNoTooltip]... você está certo.\""
 legend_spread_events.0072.c:0 "Meu povo deve saber da minha piedade."
 legend_spread_events.0072.d:0 "Encontrarei conforto em [bishop.GetTitledFirstNameNoTooltip]."
 legend_spread_events.0072.desc.fallback:0 "Eu ando de um lado para o outro na sala. Tenho preocupações dentro de mim das quais não posso falar. Minha fé treme. O que significa ser santo? Se não posso ser isso, pelo menos tentarei."
 legend_spread_events.0072.desc.intro:0 "Eu entro no [ROOT.Char.Custom('GetFaithTemple')] e a luz pinta as paredes com os tons suaves do crepúsculo.\n\n"
 legend_spread_events.0072.desc.mid.depressed:0 "Respiro fundo. [ROOT.Char.GetFaith.HighGodName], eu falhei com você. Um mero mortal, indigno, inútil, #EMP patético.#!\n\n"
 legend_spread_events.0072.desc.mid.fallback:0 "[ROOT.Char.GetFaith.HighGodName], você pode me ver? O que há para ver? Um mero mortal, talvez indigno, talvez perdido. Não resta ninguém para me guiar.\n\n"
 legend_spread_events.0072.desc.vassal:0 "'[ROOT.Char.GetTitledFirstNameNoTooltip]...?' Eu não havia notado outra presença no templo. [praying_vassal.GetTitledFirstName] está ao meu lado, suas mãos unidas em oração. 'Viajei muitos dias e noites para ouvir sobre sua lenda. Sei que [ROOT.Char.GetFaith.HighGodName] também está ansioso para ouvi-la.'"
 legend_spread_events.0072.t:0 "Em Busca de Respostas"
 legend_spread_events.0073.a:0 "Existem batalhas nos esperando."
 legend_spread_events.0073.b:0 "\"Claro, venha, escute.\""
 legend_spread_events.0073.c:0 "Devo inspirar meu povo."
 legend_spread_events.0073.d:0 "[marshal.GetTitledFirstNameNoTooltip] está sempre ao meu lado."
 legend_spread_events.0073.desc.fallback:0 "Eu fecho os olhos. A luz intensa de uma lâmina vem à mente. Raios de sol refletidos no aço. Alguns outros olhos também. Uma besta, talvez. Ou um inimigo. Eu fecho a mão — eu já fiz isso no passado. Eu #EMP devo#! continuar fazendo."
 legend_spread_events.0073.desc.intro:0 "O ar está silencioso. Imóvel. As folhas estão tão paradas que não consigo dizer se todas as árvores morreram durante a noite.\n\n"
 legend_spread_events.0073.desc.mid.depressed:0 "Eu também me sinto da mesma forma.\n\n"
 legend_spread_events.0073.desc.mid.fallback:0 "Como eu gostaria de poder ficar aqui. Aqui, onde o som das trombetas não pode me alcançar. Aqui, onde as palavras da lenda são apenas um sussurro abafado.\n\n"
 legend_spread_events.0073.desc.vassal:0 "'[ROOT.Char.GetTitledFirstNameNoTooltip]?' Eu me viro e encontro [fighting_vassal.GetTitledFirstName] me encarando, sua mão na espada, suor escorrendo pela testa [fighting_vassal.GetHerHim]. 'Viajei muitos dias e noites para te encontrar. Os ecos de sua lenda me inspiraram a me tornar um guerreiro melhor. Por favor, conte-me sobre seus feitos.'"
 legend_spread_events.0073.t:0 "Sozinho?"
 legend_spread_events.0074.a:0 "\"Meu amor... Não vou te desapontar.\""
 legend_spread_events.0074.b:0 "\"[wise_vassal.GetFirstNameNoTooltip], #EMP você#! me comoveu.\""
 legend_spread_events.0074.c:0 "Não posso decepcionar meu povo."
 legend_spread_events.0074.d:0 "[chancellor.GetTitledFirstNameNoTooltip] pode me ajudar com os detalhes diplomáticos."
 legend_spread_events.0074.desc.fallback:0 "Sigo sem rumo pelos corredores, sem saber meu destino. Descuidado. Escuridão sobre escuridão sobre escuridão. Se eu fosse digno desta lenda... eu sentiria, não é? Talvez. Talvez."
 legend_spread_events.0074.desc.intro:0 "Escuridão e frio habitam esses catacumbas."
 legend_spread_events.0074.desc.mid.depressed:0 "A tentação de ficar aqui me assalta. Apenas se esconder, e esquecer de tudo o mais. Um impulso.\n\n"
 legend_spread_events.0074.desc.mid.fallback:0 "E se eu apenas ficasse aqui? Em silêncio. A pedra e eu. Um roedor ocasional como meu único visitante. Há uma calma nisso.\n\n"
 legend_spread_events.0074.desc.spouse:0 "\"Meu amor...\" [Select_CString( spouse.IsFemale, 'minha querida', 'meu querido' )] [spouse.GetFirstName] está ao lado [wise_vassal.GetHerHim]. \"Eu estava preocupado com você.\""
 legend_spread_events.0074.desc.vassal:0 "'[ROOT.Char.GetTitledFirstNameNoTooltip]?' A figura de [wise_vassal.GetTitledFirstNamePossessive] aparece ao redor da esquina. 'O que você está fazendo aqui embaixo? Que encontro fatídico. Viajei muitos dias e noites para te encontrar. Sua lenda... devo confessar que me comoveu.'"
 legend_spread_events.0074.t:0 "Nas Cavernas da Mente"
 legend_spread_events.5000.a:0 "\"Esta arquitetura é #EMP claramente#! não de origem [culture.GetNameNoTooltip]!\""
 legend_spread_events.5000.b.tt.failure:0 "Os orgulhosos plebeus rejeitam furiosamente suas afirmações"
 legend_spread_events.5000.b.tt.success:0 "As pessoas parecem estar convencidas"
 legend_spread_events.5000.b:0 "Certamente isso #EMP deve#! ter sido feito por não-[culture.GetCollectiveNounNoTooltip]?"
 legend_spread_events.5000.c:0 "Certamente tal alvenaria poderia ser usada para algo melhor?"
 legend_spread_events.5000.d:0 "Esses ancestrais eram verdadeiramente pessoas trabalhadoras."
 legend_spread_events.5000.desc:0 "O sol brilha intensamente em [capital.GetName] enquanto [chronicler.GetFirstName] e eu vagamos pelas movimentadas ruas. É um belo assentamento.\n\nUm assentamento #EMP muito#! fino, de fato, penso, olhando em volta para a alvenaria intricada em um arco que passamos por baixo. [chronicler.GetFirstNameNoTooltip] percebe meu olhar.\n\n\"Isto é um crédito para os antepassados destes povos que criaram este lugar.\" [chronicler.GetSheHe|U] começa. \"Tão grande crédito que às vezes você se pergunta se eles mesmo fizeram isso...\""
 legend_spread_events.5000.t:0 "Fundamentos Sólidos"
 legend_spread_events.5005.a:0 "\"[parent.Custom('MotherFather')|U] por favor, você me constrange!\""
 legend_spread_events.5005.b.tt:0 "Bem, isso poderia ajudar meu caso..."
 legend_spread_events.5005.b:0 "\"Por favor, me lembre?\""
 legend_spread_events.5005.c:0 "Chega de falar sobre mim. Como estão #EMP vocês#!, [parent.Custom('MotherFather')]?"
 legend_spread_events.5005.desc:0 "Tropeçar com [Select_CString( parent.IsFemale, 'minha', 'meu' )] [parent.GetMotherFather] [parent.GetFirstName] é um prazer cada vez mais raro nos dias de hoje, mas aqui nos encontramos neste lugar de adoração. [chronicler.GetFirstName] mantém uma distância respeitosa de lado enquanto nos cumprimentamos.\n\n\"[ROOT.Char.GetFirstName]! Que surpresa!\" [parent.GetSheHe|U] exclama, me abraçando. [parent.GetSheHe|U] sorri nostalgicamente, olhando ao redor para as paredes. \"Isso realmente me faz sentir jovem novamente. Você sempre foi uma criança tão piedosa. Você sabia que quando era apenas um bebê se recusava a se alimentar nos dias sagrados?\"\n\nEu... não sabia disso, não."
 legend_spread_events.5005.parent_chronicler:0 "Talvez, como meu cronista, [Select_CString( parent.IsFemale, 'minha querida', 'meu querido' )] [parent.Custom('MotherFather')] possa ser persuadido a escrever isso?"
 legend_spread_events.5005.regular:0 "Pelo canto do olho, vejo [chronicler.GetFirstNameNoTooltip] começar a alcançar por seus [ROOT.Char.Custom('GetWritingMaterial')]."
 legend_spread_events.5005.t:0 "A Bênção do [parent.Custom('MotherFatherPossessive')|U]"
 legend_spread_events.5010.a.tt:0 "Se nada mais, encorajar doações para os necessitados me fará parecer bem..."
 legend_spread_events.5010.a:0 "\"Você deve doar para os mais necessitados.\""
 legend_spread_events.5010.b.criticalsuccess:0 "A pessoa é curada"
 legend_spread_events.5010.b.failure:0 "Não parece haver mudança alguma"
 legend_spread_events.5010.b.success:0 "Eles dizem que já se sentem um pouco melhor"
 legend_spread_events.5010.b:0 "Bem, se isso funcionar..."
 legend_spread_events.5010.c:0 "\"Por favor. Você deve procurar um tratamento adequado, em um hospício local.\""
 legend_spread_events.5010.desc:0 "[Select_CString( chronicler.IsFemale, 'Minha', 'Meu' )] cronista [chronicler.GetFirstName] é empurrado para o lado à força enquanto uma figura estranha avança em minha direção na rua. Meus guardas intervêm e empunham armas, mas está claro que essa pobre alma não está aqui para me machucar.\n\n\"Por favor!\" O seu sopro doente soa enquanto [sick.GetSheHe] fala. \"Estou muito doente. Foi tudo o que consegui fazer para sair aqui quando vi você passando, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\n\"Eu... ouvi falar dos milagres que você pode realizar. Apenas um toque é tudo que eu preciso!\" [sick.GetSheHe|U] se aproxima cambaleante, os braços se estendendo suplicantemente."
 legend_spread_events.5010.t:0 "Imposição de Mãos"
 legend_spread_events.5015.a:0 "\"E ela tirará a vida de muitos mais.\""
 legend_spread_events.5015.b.failure:0 "Alguns olham com desconfiança para os contos"
 legend_spread_events.5015.b.success:0 "A história da arma cresce"
 legend_spread_events.5015.b:0 "\"Bem, são apenas os que me lembro...\""
 legend_spread_events.5015.c.tt:0 "[artifact.GetName] ganha um modificador positivo aleatório"
 legend_spread_events.5015.c:0 "\"Não muitos mais que isso, [chronicler.GetFirstNameNoTooltip].\""
 legend_spread_events.5015.desc:0 "Eu testo a lâmina de uma espada enquanto [Select_CString( chronicler.IsFemale, 'minha', 'meu' )] cronista [chronicler.GetFirstName] e eu examinamos o arsenal em [SelectLocalization(IsLandlessAdventurer(ROOT.Char),'my camp', 'location.GetName')]. Está afiada e bem polida. [chronicler.GetFirstNameNoTooltip], no entanto, está mais interessado em outra arma pendurada na parede.\n\n\"Ouvi tanto sobre esta poderosa arma, [ROOT.Char.Custom('FormOfAddressForLiege')].\" [chronicler.GetSheHe|U] respira, admirando-a. \"Ouvi dizer que ela matou meia dúzia apenas por sua mão!\n\n[artifact.GetName] está ali pendurada placidamente. É verdade que tem sido uma arma confiável e letal ao longo de sua vida, suas laterais repetidamente embebidas no sangue dos inimigos. Uma boa lâmina. Uma lâmina vermelha."
 legend_spread_events.5015.t:0 "Um Legado Sangrento"
 legend_spread_events.5020.a.tt:0 "Uma cicatriz antiga. Talvez seja significativa?"
 legend_spread_events.5020.a:0 "\"Você sabia que tenho outra no meu lado também?\""
 legend_spread_events.5020.b:0 "É #EMP bastante#! interessante..."
 legend_spread_events.5020.c:0 "\"É apenas uma marca antiga, [chronicler.GetFirstNameNoTooltip].\""
 legend_spread_events.5020.desc:0 "Nossa passagem conjunta por [SelectLocalization(IsLandlessAdventurer(ROOT.Char), 'o acampamento', 'um corredor')] na penumbra do crepúsculo é interrompida por [chronicler.GetFirstName], seu dedo esticado em direção à minha mão que segura a lanterna.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\" [chronicler.GetSheHe|U] começa, um tremor na sua voz. \"Essa marca, na sua mão! É... uma Ferida Sagrada?\"\n\nOlho para minha mão. Uma grande mancha cobre o dorso dela. Na verdade, eu mal havia notado que estava ali. [chronicler.GetFirstNameNoTooltip], no entanto, já estava em um voo de fantasia.\n\n\"Devemos registrar isso! O povo precisa saber! Você carrega as feridas sagradas do próprio Cristo!\""
 legend_spread_events.5020.t:0 "Desonrado"
 legend_spread_events.5025.a:0 "\"Você está certo, [chronicler.GetFirstNameNoTooltip]! Isso é fácil de traduzir!\""
 legend_spread_events.5025.b.failure:0 "A língua escapa completamente de você"
 legend_spread_events.5025.b.success:0 "Você consegue traduzi-lo"
 legend_spread_events.5025.b:0 "Vamos ver como me saio..."
 legend_spread_events.5025.c:0 "\"Não parece ser a língua de meus antepassados, eu temo.\""
 legend_spread_events.5025.desc:0 "A paz e o sossego do meu [SelectLocalization(IsLandlessAdventurer(ROOT.Char), 'tenda', 'estudo')] são totalmente quebrados quando [chronicler.GetFirstName] irrompe, braços envolvendo o que parece ser um antigo [ROOT.Char.Custom('GetWritingMaterial')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\" [chronicler.GetSheHe|U] grita. \"Olhe, olhe! Encontramos um velho manuscrito!\" Derrubando-o em minha mesa, [chronicler.GetSheHe] aponta para ele com um dedo animado.\n\n\"Está em uma língua antiga que simplesmente não conseguimos decifrar. Mas você...\" [chronicler.GetSheHe] me olha reverentemente, \"pode ser capaz de fazê-lo! Deve ser uma obra de seus ancestrais!\""
 legend_spread_events.5025.t:0 "Pergaminhos Empoeirados"
 legend_spread_events.5030.a:0 "\"Ficaria muito grato se você ajudasse a espalhar a notícia!\""
 legend_spread_events.5030.b:0 "\"Absolutamente. Agora, uma vez-\""
 legend_spread_events.5030.c:0 "\"É bom vê-lo, [vassal.GetFirstNameNoTooltip].\""
 legend_spread_events.5030.desc:0 "Embora as demandas de governar o reino não frequentemente cruzem nossos caminhos, uma oportunidade dessas nos trouxe [vassal.GetFirstName] e eu juntos. [vassal.GetSheHe|U] me cumprimenta calorosamente com um brilho sabido em seu olhar.\n\n\"[ROOT.Char.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')]! Um prazer vê-la!\" [vassal.GetFirstNameNoTooltip] segura meu ombro. \"Você sabe, ouvi algumas #EMP histórias fascinantes#! sobre você ultimamente?\" [vassal.GetSheHe|U] sorri amplamente para meu leve desconforto.\n\n\"Eu realmente as apreciei, por sinal. Talvez você possa me fornecer alguns detalhes?"
 legend_spread_events.5030.t:0 "Amigos em Lugares Altos"
 legend_spread_events.5035.a.tt:0 "\"Se uma única palavra disso sair desta sala, eu #EMP saberei#! que foi você.\""
 legend_spread_events.5035.a:0 "\"Mande isso ser destruído. E [chronicler.GetFirstNameNoTooltip]...?\""
 legend_spread_events.5035.b.failure:0 "[chronicler.GetFirstNameNoTooltip] não está convencido"
 legend_spread_events.5035.b.success:0 "[chronicler.GetFirstNameNoTooltip] aceita feliz a correção"
 legend_spread_events.5035.b:0 "\"Bobagem! Veja, o nome do meu pai está bem aqui!\""
 legend_spread_events.5035.c.failure:0 "O segredo escapa"
 legend_spread_events.5035.c.success:0 "O segredo permanece enterrado"
 legend_spread_events.5035.c:0 "Devemos manter isso em segredo. #EMP Muito#! em segredo."
 legend_spread_events.5035.d:0 "Teremos que procurar outro documento."
 legend_spread_events.5035.desc:0 "\"É muito curioso, [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )], muito curioso de fato. Não tenho certeza do que fazer com isso. Você consegue compreendê-lo, talvez?\"\n\n[chronicler.GetFirstName] me apresenta o [ROOT.Char.Custom('GetWritingMaterial')], encontrado em algum canto empoeirado de uma casa ancestral. Eu olho para ele com curiosidade. Não tenho certeza do que [chronicler.GetSheHe] quer dizer, particularmente-\n\n\"Veja. Sua linhagem não aparece em nenhum lugar desta lista.\" [chronicler.GetFirstNameNoTooltip] esclarece com o que tenho certeza que [chronicler.GetSheHe] #EMP pensa#! que é um charme útil. Na realidade, isso simplesmente escurece ainda mais meu ânimo.\n\nIsso pode ser uma notícia seriamente ruim para minhas tentativas de legitimização."
 legend_spread_events.5035.t:0 "Assuntos de Família"
 legend_spread_events.5040.a.tt:0 "Não, não sei, mas uma boa mentira torna o conhecimento redundante..."
 legend_spread_events.5040.a:0 "É #EMP claro#! que sim!"
 legend_spread_events.5040.b:0 "Tenho certeza de que [Select_CString( parent.IsFemale, 'a', 'o' )] [parent.GetMotherFather] saberia!"
 legend_spread_events.5040.c.failure:0 "Suas mentiras são óbvias"
 legend_spread_events.5040.c.success:0 "Suas fabricações são convincentes"
 legend_spread_events.5040.c.tt:0 "De forma alguma sei, mas talvez se eu fosse convincente o suficiente..."
 legend_spread_events.5040.d.failure:0 "A negligência lança dúvidas sobre sua árvore genealógica"
 legend_spread_events.5040.d.success:0 "Algumas pessoas crédulas realmente acreditam"
 legend_spread_events.5040.d:0 "Coloque um [ROOT.Char.Custom('RegionalMythicalCreature')] lá dentro, tanto faz!"
 legend_spread_events.5040.desc:0 "\"Apenas algumas perguntas finais, [ROOT.Char.Custom('FormOfAddressForLiege')], e então posso deixá-la ir!\" A falsa animação de [chronicler.GetFirstNamePossessive] não faz nada para amenizar o cansaço que sinto à medida que o tempo que passamos examinando [ROOT.Char.Custom('GetWritingMaterial')] para avaliar minha árvore genealógica arrasta-se cada vez mais. [chronicler.GetSheHe|U] toca uma seção earnestamente.\n\n\"Só não tenho certeza exatamente quem deve habitar #EMP estas#! partes específicas.\" [chronicler.GetFirstNameNoTooltip] franze a testa consternado. \"Você sabe, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 legend_spread_events.5040.t:0 "Flora da Família"
 legend_spread_events.5045.a:0 "[imam.GetSheHe|U] não vai recusar um favor."
 legend_spread_events.5045.b.failure:0 "[imam.GetSheHe|U] fica indignado com sua oferta"
 legend_spread_events.5045.b.success:0 "[imam.GetSheHe|U] aceita sua oferta"
 legend_spread_events.5045.b:0 "Um suborno pode ser arriscado, mas recompensador..."
 legend_spread_events.5045.c.failure:0 "[imam.GetFirstNameNoTooltip] rejeita seus apelos"
 legend_spread_events.5045.c.success:0 "[imam.GetFirstNameNoTooltip] concorda"
 legend_spread_events.5045.c:0 "Vou simplesmente persuadi-lo."
 legend_spread_events.5045.d:0 "\"Não seja bobo, [chronicler.GetFirstNameNoTooltip].\""
 legend_spread_events.5045.desc:0 "[chronicler.GetFirstName] e eu estamos no meio de ponderar formas de espalhar as notícias sobre minha devoção ainda mais longe quando [chronicler.GetSheHe] agarra meu braço e indica com um inclinar de cabeça. [Select_CString( imam.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('imam'))] [imam.GetFirstName] entrou na mesquita, claramente começando os preparativos para a adoração posterior.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [chronicler.GetFirstNameNoTooltip] sussurra. \"Isso é #EMP perfeito#!! [imam.GetSheHe|U] está preparando o #EMP khutbah# de hoje!! Rápido, vá persuadi-lo a incluir seu nome nele!\"\n\nUma ideia brilhante! Só me pergunto o que será necessário para torná-la realidade..."
 legend_spread_events.5045.t:0 "Algumas Palavras?"
 legend_spread_events.5050.a:0 "Esta coroa é algo extraordinário."
 legend_spread_events.5050.b:0 "Este colar emana uma certa aura."
 legend_spread_events.5050.c:0 "Não estou disposto a gastar #EMP tanto#! assim..."
 legend_spread_events.5050.d:0 "\"Você ultrapassa limites, [chronicler.GetFirstNameNoTooltip].\""
 legend_spread_events.5050.desc:0 "Eu deveria ter visto problemas chegando quando [chronicler.GetFirstName] entra na [ROOT.Char.Custom('GetRoom')], com um rosto desconhecido ao seu lado.\n\n\"Deixe-me apresentar [jeweller.GetFirstName], [ROOT.Char.Custom('FormOfAddressForLiege')].\" O estranho oferece uma profunda reverência. \"[jeweller.GetSheHe|U] é um joalheiro e metalúrgico. Eu pensei que talvez você quisesse examinar algumas das obras [jeweller.GetHerHim].\"\n\n\"Tomei a liberdade de preparar algumas especialmente adequadas a você e... aquilo que lhe diz respeito atualmente.\" [jeweller.GetFirstNameNoTooltip] começa, colocando uma bandeja sobre a mesa.\n\n#EMP 'Aquilo que me diz respeito?'#! [chronicler.GetFirstNameNoTooltip] claramente tem estado ocupado."
 legend_spread_events.5050.t:0 "Fazendo uma Entrada"
 legend_spread_events.5055.a.tt:0 "Vestir símbolos da cultura tanto de [vassal1.GetCulture.GetNameNoTooltip] quanto de [vassal2.GetCulture.GetNameNoTooltip] me marcará como um governante tolerante e respeitoso."
 legend_spread_events.5055.a:0 "Ambos os grupos podem ser apaziguados."
 legend_spread_events.5055.b:0 "Devo representar meu povo."
 legend_spread_events.5055.c:0 "Os súditos da [vassal2.GetCulture.GetNameNoTooltip] precisam de alguém para se inspirar."
 legend_spread_events.5055.d.tt:0 "É muito mais fácil evitar conflitos do que fazer declarações."
 legend_spread_events.5055.d:0 "Devo evitar fazer inimigos."
 legend_spread_events.5055.desc:0 "Enquanto pondero o que vestir para o dia, o conselho de [chronicler.GetFirstName] é exuberante: \"Talvez algo para inspirar seus vassalos, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]? Algo tradicional?\"\n\nSe eu realmente quiser conquistar a simpatia dos meus súditos, devo, de fato, me apresentar como eles imaginam que um governante seja. No entanto, meu reino tem muitas culturas diferentes.\n\nMinha vestimenta majestosa poderia agradar a um [vassal1.GetCulture.GetName] como [vassal1.GetTitledFirstName], mas aqueles fora de nosso contexto compartilhado — [vassal2.GetTitledFirstName], por exemplo — sentiriam apenas as nossas diferenças acentuadas."
 legend_spread_events.5055.t:0 "Escolhas Culturais"
 legend_spread_events.5060.a:0 "\"[ROOT.Char.GetFaith.HighGodName] veio a mim, e a visão me cegou!\""
 legend_spread_events.5060.b:0 "\"[ROOT.Char.GetFaith.HighGodName] levou isso para que eu pudesse provar minha devoção!\""
 legend_spread_events.5060.blind:0 "olhos.\""
 legend_spread_events.5060.c:0 "\"Independentemente da causa, isso me humilhou perante [ROOT.Char.GetFaith.HighGodName].\""
 legend_spread_events.5060.d.tt:0 "Não há propósito em mentir sobre esse antigo problema."
 legend_spread_events.5060.d:0 "\"É apenas uma lesão antiga, [chronicler.GetFirstNameNoTooltip].\""
 legend_spread_events.5060.ending:0 "\n\nParo. O tremor na voz de [chronicler.GetFirstNamePossessiveNoTooltip] implica um peso maior para a questão do que realmente precisa. Ainda assim, reflito, ouvindo o canto distante dos [ROOT.Char.GetFaith.PriestNeuterPlural] carregado pelo vento...\n\nTalvez seja finalmente hora de aproveitar essa maldição em algo que possa finalmente me beneficiar?"
 legend_spread_events.5060.one_eyed:0 "olho.\""
 legend_spread_events.5060.opening:0 "\"Você sabe, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip],\" [chronicler.GetFirstName] começa hesitante enquanto caminhamos pelo [ROOT.Char.Custom('GetCourtyard')], \"Eu hesito em mencionar, mas os devotos querem saber como você perdeu seu\""
 legend_spread_events.5060.t:0 "Lugares Sagrados"
 legend_spread_events.5065.a:0 "Bah, estou mais feliz assim!"
 legend_spread_events.5065.b:0 "\"Você está certo. Vou fazer melhor.\""
 legend_spread_events.5065.c:0 "Só um pouco aqui e ali certamente não vai fazer mal?"
 legend_spread_events.5065.desc:0 "Estou até o pescoço na minha segunda porção de [ROOT.Char.Custom('GetExpensiveDessert')] quando percebo [chronicler.GetFirstName] me olhando um pouco repreensivamente.\n\n\"Sabe, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [chronicler.GetSheHe] começa gentilmente, \"considerando que você está tentando, hm, mostrar sua santidade, talvez você possa moderar isso um pouco?\"\n\nOlho para a comida. Está deliciosa, mas talvez [chronicler.GetFirstNameNoTooltip] tenha um ponto?"
 legend_spread_events.5065.t:0 "Pão Sagrado"
 legend_spread_events.5070.a.failure:0 "Ninguém está convencido"
 legend_spread_events.5070.a.success:0 "Você é elogiado por sua vestimenta"
 legend_spread_events.5070.a:0 "Vou me vestir como os primeiros [culture.GetCollectiveNounNoTooltip] fizeram!"
 legend_spread_events.5070.b:0 "Talvez uma sugestão ou outra de estilo não seria mal..."
 legend_spread_events.5070.c:0 "Sou inspirado pelo passado, mas não me curvo a ele."
 legend_spread_events.5070.desc:0 "Permaneço em pé e espero enquanto [chronicler.GetFirstName] me ajusta, arrumando minhas roupas. Satisfeito com o trabalho [chronicler.GetHerHim], [chronicler.GetSheHe] reflete um pouco.\n\n\"Tenho estado pensando,\" [chronicler.GetSheHe] começa, \"se você consideraria um estilo diferente?\" Retribuo o olhar [chronicler.GetHerHim] com suspeita.\n\n\"Bem, você tem tentado enfatizar suas conexões com seus antepassados. Talvez valha a pena pensar em se apresentar à imagem deles?\""
 legend_spread_events.5070.t:0 "Uma Entrada Majestosa"
 legend_spread_events.5075.a.failure:0 "Sua astúcia falha"
 legend_spread_events.5075.a.success:0 "As pessoas são facilmente enganadas"
 legend_spread_events.5075.a:0 "Certamente deve haver uma maneira de falsificar isso..."
 legend_spread_events.5075.b.failure:0 "Ai"
 legend_spread_events.5075.b.success:0 "Funciona"
 legend_spread_events.5075.b:0 "Devo rezar #EMP mais duro!#!"
 legend_spread_events.5075.c:0 "Que absurdo completo."
 legend_spread_events.5075.desc:0 "[imam.GetFirstName] passa apressado por mim mal dando um aceno, mas isso me detém em minhas trilhas. [Select_CString( chronicler.IsFemale, 'Minha companheira', 'Meu companheiro' )] [chronicler.GetFirstName], percebendo minha consternação, começa a explicar.\n\n\"É um calo de oração.\" [chronicler.GetSheHe|U] observa o [imam.GetFaith.PriestNeuter] se afastando comigo por um momento, esticando seu pescoço para ver a testa [imam.GetHerHim]. \"Aqueles que se consideram santos provam sua devoção se prostrando com força suficiente para desenvolver um calo na cabeça.\""
 legend_spread_events.5075.t:0 "Adoração Firme"
 legend_spread_events.5200.a:0 "Eu desejava provar suas #EMP carnes exóticas#!."
 legend_spread_events.5200.b.failure:0 "Todo mundo já sabe que não foi assim que eles morreram"
 legend_spread_events.5200.b.success:0 "Seu conto é crível"
 legend_spread_events.5200.b:0 "Isso... matou [Select_CString( dead_parent.IsFemale, 'minha', 'meu' )] [dead_parent.GetMotherFather] [dead_parent.GetFirstNameNoTooltip]!"
 legend_spread_events.5200.c:0 "Pela glória, é claro."
 legend_spread_events.5200.desc:0 "[chronicler.GetFirstName] põe as mãos para trabalhar mais uma vez, anotando detalhes da minha lenda.\n\n\"Uma coisa me intriga,\" [chronicler.GetSheHe] murmura. \"Por que você escolheu caçar essa besta? Por que, entre todos os animais, você escolheu caçar esse particular [legend.GetProperty( 'beast' ).GetFlagName]?\""
 legend_spread_events.5200.t:0 "Objetivos Exóticos"
 legend_spread_events.5205.a:0 "O que mais o maior caçador da terra faria?"
 legend_spread_events.5205.b.tt:0 "...e agora, eu sei como encontrá-las."
 legend_spread_events.5205.b:0 "Foi tudo em busca de presas ainda mais perigosas..."
 legend_spread_events.5205.c:0 "Eu precisava aprimorar minhas habilidades de rastreamento."
 legend_spread_events.5205.d:0 "Para provar minha habilidade como caçador."
 legend_spread_events.5205.desc:0 "[chronicler.GetFirstName] se estica brevemente, alcançando mais [ROOT.Char.Custom('GetWritingMaterial')] para alimentar a pilha crescente.\n\n\"Então, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [chronicler.GetSheHe] começa novamente, calmamente, \"explique-me por que você estava tão determinado a caçar um adversário tão feroz quanto um [legend.GetProperty( 'beast' ).GetFlagName]? Certamente é um inimigo perigoso mesmo?\""
 legend_spread_events.5205.t:0 "Sendo o Melhor"
 legend_spread_events.5210.a:0 "E ele achou que eu também era um ciclope!"
 legend_spread_events.5210.b:0 "\"E uma fera realmente feroz era!\""
 legend_spread_events.5210.c:0 "Acho que era apenas um local, na verdade."
 legend_spread_events.5210.desc:0 "\"É realmente verdade?\" [chronicler.GetFirstName] procura mais [ROOT.Char.Custom('GetWritingMaterial')] para anotar suas observações, enquanto me pede confirmação de contos. \"Dizem que houve um encontro com um ser bastante repugnante.\"\n\n\"Ouvi rumores sobre isso, um grande ser desajeitado com um único olho. Um poderoso ciclope!\""
 legend_spread_events.5210.t:0 "Bandido de Um Olho"
 legend_spread_events.5215.a:0 "Posso atestar sua veracidade com certa autoridade."
 legend_spread_events.5215.b:0 "Um terrível problema, mas administrável."
 legend_spread_events.5215.c:0 "Não, mas aprendi que tais plantas realmente existem!"
 legend_spread_events.5215.desc:0 "Eu me sento com [chronicler.GetFirstName] enquanto [chronicler.GetSheHe] catalogam mais da minha lenda.\n\n\"A parte sobre as plantas era verdadeira, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" Minha sobrancelha arqueada claramente provoca [chronicler.GetSheHe] a continuar. \"As plantas hostis, é claro! A flora de folhas gigantes que pode te drogar à distância com seu pólen!\""
 legend_spread_events.5215.t:0 "Ina-cre-di-folha!"
 legend_spread_events.5216.a:0 "\"Eu venci ao dividir sua flecha ao meio com a minha própria!\""
 legend_spread_events.5216.b.failure:0 "Ninguém acredita"
 legend_spread_events.5216.b.success:0 "Parece ser crível"
 legend_spread_events.5216.b:0 "Foi uma vitória fácil!"
 legend_spread_events.5216.c:0 "Foi apenas um treino, na verdade."
 legend_spread_events.5216.desc:0 "Eu brinco com uma seta solta de um feixe encostado na parede enquanto [chronicler.GetFirstName] continua a catalogar mais da minha lenda.\n\n\"Isso me lembra, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [chronicler.GetFirstNameNoTooltip] começa, olhando para ela. \"É verdade que houve um desafio? Um [ROOT.Char.Custom('GetLassLad')] local, habilidoso com o arco, desafiando todos a um concurso de tiro com arco? Quem venceu?\""
 legend_spread_events.5216.t:0 "O Esporte Local"
 legend_spread_events.5220.a:0 "\"Ah, não foi nada para uma [ROOT.Char.GetWomanMan] da minha estatura!\""
 legend_spread_events.5220.b:0 "De fato! Eu lutei até o fim, porém."
 legend_spread_events.5220.c:0 "Era apenas terreno encharcado."
 legend_spread_events.5220.desc.dry:0 "um pedaço de areia movediça que suga. "
 legend_spread_events.5220.desc.ending:0 "Disseram que você teve que lutar para se libertar, que se sua força tivesse falhado, você teria perecido!\" [chronicler.GetSheHe|U] me olha com expectativa."
 legend_spread_events.5220.desc.start:0 "[chronicler.GetFirstName] me olha de maneira contemplativa.\n\n\"Ouvi dizer que em suas viagens você encontrou um conjunto de desafios.\" Meu aceno cauteloso parece encorajar [chronicler.GetSheHe]. \"Ouvi que você quase se tornou vítima de\""
 legend_spread_events.5220.desc.wet:0 "um pântano fedorento e sugador. "
 legend_spread_events.5220.t:0 "Armadilhas da Natureza"
 legend_spread_events.5225.a.tt:0 "Isso de forma alguma é uma flor única, mas é incomum o suficiente para enganar um leigo."
 legend_spread_events.5225.a:0 "\"Claro!\""
 legend_spread_events.5225.b.failure:0 "[chronicler.GetNameNoTooltip] já tinha visto muitos exemplos assim antes"
 legend_spread_events.5225.b.success:0 "[chronicler.GetNameNoTooltip] nunca viu uma flor como esta antes"
 legend_spread_events.5225.b.tt:0 "Bem, esta não é a flor #EMP mais#! comum..."
 legend_spread_events.5225.b:0 "Eu tenho uma bem aqui!"
 legend_spread_events.5225.c:0 "#EMP Flores?!#! Certamente deveríamos discutir coisas mais grandiosas?"
 legend_spread_events.5225.d:0 "\"Temor que não.\""
 legend_spread_events.5225.desc:0 "O pequeno buquê de flores na minha mesa parece chamar a atenção de [chronicler.GetFirstNamePossessive].\n\n\"Agora isso me lembra, [Select_CString( ROOT.Char.IsFemale, 'minha boa', 'meu bom' )] [ROOT.Char.GetLadyLord],\" [chronicler.GetSheHe] começa, \"de uma história que ouvi sobre você. Ouvi dizer que você encontrou uma planta inteiramente única em suas viagens?\" [chronicler.GetSheHe|U] olha rapidamente para mim.\n\n\"Você por acaso tem uma espécime com você?\""
 legend_spread_events.5225.t:0 "Poder das Flores"
 legend_spread_events.5230.a:0 "\"Veja esta cicatriz? Foi de um deles.\""
 legend_spread_events.5230.b:0 "...honestamente, eles realmente sabiam cozinhar carne."
 legend_spread_events.5230.c:0 "E eu vivi para contar a história!"
 legend_spread_events.5230.d:0 "Acho que eles eram apenas bandidos."
 legend_spread_events.5230.desc:0 "[chronicler.GetFirstName] entrando em minha [ROOT.Char.Custom('GetRoom')] é frequentemente um prenúncio de perguntas incomuns por vir, e desta vez não é diferente.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord]! Acabei de ouvir o conto mais absurdo!\" [chronicler.GetSheHe] grita, correndo atrás de mais [ROOT.Char.Custom('GetWritingMaterial')]. \"Disseram que você foi atacado por #EMP canibais#! em suas viagens! Devoradores de homens, você poderia acreditar?!\""
 legend_spread_events.5230.t:0 "Gosto por Sangue"
 legend_spread_events.5235.a:0 "Eles morreram sob minha lâmina."
 legend_spread_events.5235.b:0 "Sob qual braço de espada eles morreram não importa."
 legend_spread_events.5235.desc:0 "Estou recontando minhas proezas em batalha para [chronicler.GetFirstName] quando [chronicler.GetSheHe] interrompe abruptamente.\n\n\"\"É verdade, então? Você realmente matou o vil comandante inimigo em um combate singular?\" Seus olhos brilham com as possibilidades. Claramente, esta é uma espécie de história fantasiosa absorvida por meio do boca a boca.\n\nEu realmente estive lá na batalha, mas a confusão do combate torna possível praticamente qualquer evento..."
 legend_spread_events.5235.t:0 "Um contra Um"
 legend_spread_events.5240.a:0 "Foi uma retirada tática perfeita."
 legend_spread_events.5240.b.failure:0 "Suas protestações apenas confirmam a culpa"
 legend_spread_events.5240.b.success:0 "Sua explicação soa convincente"
 legend_spread_events.5240.b:0 "Claro que foi uma retirada #EMP tática#!"
 legend_spread_events.5240.c:0 "...não vamos nos deter nisso."
 legend_spread_events.5240.desc:0 "Com rabiscos apressados em uma xícara de sementes virada, [chronicler.GetFirstName] marca a ordem de uma batalha passada. [chronicler.GetSheHe|U] muda rapidamente de rumo ao me ver observando.\n\n\"É esta seção que mais me intriga.\" [chronicler.GetSheHe|U] declara, apontando para uma dessas varreduras nas sementes. \"Ouvi dizer que você fingiu uma retirada aqui. Por outro lado, também ouvi algumas acusações um tanto mais #EMP desfavoráveis#!\"\n\nMeu coração covarde palpita em pânico mesmo nesta investigação educada."
 legend_spread_events.5240.t:0 "Discrição ou Valor?"
 legend_spread_events.5245.a:0 "\"Eu fui. Muitos morreram sob nossas lâminas.\""
 legend_spread_events.5245.b:0 "\"Na verdade, eu liderei o golpe decisivo a partir do centro.\""
 legend_spread_events.5245.c:0 "Eu apenas supervisionei a batalha."
 legend_spread_events.5245.desc:0 "Mais tempo com [chronicler.GetFirstName] significa mais tempo passando cansado por uma batalha passada para que minha lenda possa ser anotada. [chronicler.GetSheHe|U] nota meu desinteresse e tenta uma abordagem diferente.\n\n\"Agora, quando o flanco esquerdo do inimigo desmorona e corremos desenfreados sobre o seu reforço,\" [chronicler.GetSheHe|U] começa, \"é realmente verdade que você foi quem liderou esse ataque flanqueador? Um verdadeiro golpe de gênio!"
 legend_spread_events.5245.t:0 "Golpe Esmagador"
 legend_spread_events.5250.a:0 "\"Oh, eu salvei [ROOT.Char.Custom('GetHerHimOpposite')]. Direto para minha #EMP tenda#!!\""
 legend_spread_events.5250.b:0 "\"Recebi um beijo como recompensa, nada menos.\""
 legend_spread_events.5250.c:0 "\"Você deve estar me confundindo com outra pessoa.\""
 legend_spread_events.5250.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Oh [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]!\" O suplicante apaixonado de [chronicler.GetFirstNamePossessive] me dá uma pausa. \"Acabei de ouvir falar de seus percalços românticos no campo de batalha! Uma camponesa perdida e confusa, mas verdadeiramente bela, vagando pelo campo de batalha, e #EMP você#! salvou [ROOT.Char.Custom('GetHerHimOpposite')]!\"\n\nEstá claro que [chronicler.GetFirstNameNoTooltip] não será dissuadido desta linha de investigação particular."
 legend_spread_events.5250.t:0 "Salvando um Inocente"
 legend_spread_events.5255.a:0 "\"Dificilmente ileso, [chronicler.GetFirstNameNoTooltip].\""
 legend_spread_events.5255.b:0 "\"Onde mais você acha que consegui essas cicatrizes?\""
 legend_spread_events.5255.c:0 "\"Apenas graças a [ROOT.Char.GetFaith.HighGodName].\""
 legend_spread_events.5255.d:0 "\"Continuei avançando tão galantemente quanto pude!\""
 legend_spread_events.5255.desc:0 "\"Ouvir falar de suas batalhas travadas, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [chronicler.GetFirstName] oferece, voz tremendo um pouco teatralmente, \"é verdadeiramente um espanto que você tenha sobrevivido! Todo tipo de morte e carnificina ao seu redor, ainda assim você saiu ileso.\"\n\nTodo mundo adora uma boa história de guerra, suponho. Talvez exagerar um pouco a minha possa ajudar a espalhar a palavra?"
 legend_spread_events.5255.t:0 "Contos de Guerra"
 legend_spread_events.5260.a:0 "\"Cheguei bem na hora.\""
 legend_spread_events.5260.b:0 "\"Tínhamos planejado tudo com antecedência.\""
 legend_spread_events.5260.desc:0 "\"Nossas forças estavam tão pressionadas e atormentadas,\" [chronicler.GetFirstName] corta minha reverie enquanto discutimos uma batalha passada, \"e ainda assim prevalecemos! Ouvi dizer, de fato, que foi #EMP você#! quem chegou no momento crucial com reforços! Que chegada oportuna para garantir nossa vitória!\"\n\nA palavra de [promoted_legend.GetName] deve se espalhar longe, e palavras de minhas façanhas heroicas ajudarão nisso. Se eu escolher reivindicar este crédito particular, é claro..."
 legend_spread_events.5260.t:0 "Bom Timing"
 legend_spread_events.5305.a.failure:0 "[potential_promoter.GetFirstNameNoTooltip] não fica impressionado"
 legend_spread_events.5305.a.success:0 "[potential_promoter.GetFirstNameNoTooltip] concorda"
 legend_spread_events.5305.a:0 "Certamente [potential_promoter.GetSheHe] adoraria ver um colega [root_culture.GetName] ter sucesso!"
 legend_spread_events.5305.b.failure:0 "[potential_promoter.GetFirstNameNoTooltip] rejeita suas ameaças"
 legend_spread_events.5305.b.success:0 "[potential_promoter.GetFirstNameNoTooltip] é devidamente intimidado"
 legend_spread_events.5305.b:0 "Talvez... uma ameaça sutil."
 legend_spread_events.5305.c.failure:0 "[potential_promoter.GetFirstNameNoTooltip] não se importa com seus apelos"
 legend_spread_events.5305.c.success:0 "[potential_promoter.GetFirstNameNoTooltip] aceita"
 legend_spread_events.5305.c:0 "Certamente um apelo à amizade vizinha funcionará?"
 legend_spread_events.5305.d.success:0 "[potential_promoter.GetFirstNameNoTooltip] fica impressionado"
 legend_spread_events.5305.d:0 "Ah, envie como está."
 legend_spread_events.5305.desc:0 "[chronicler.GetFirstName] anota minhas palavras diligentemente enquanto eu as dito. Devo ter cuidado com minhas escolhas: [potential_promoter.GetFirstName], meu governante vizinho, pode muito bem ser persuadido a apoiar minha causa na disseminação da palavra sobre [promoted_legend.GetName], mas a escolha errada de palavras pode soar... presunçosa, talvez.\n\nEu pauso. [chronicler.GetFirstNameNoTooltip] também pausa, esperando pacientemente. O que [potential_promoter.GetSheHe] #EMP gostaria#! de ouvir?"
 legend_spread_events.5305.t:0 "Sendo Cordial"
 legend_spread_events.5310.a.failure:0 "[herald.GetFirstNameNoTooltip] parece servil demais"
 legend_spread_events.5310.a.success:0 "[potential_promoter.GetFirstNameNoTooltip] fica encantado"
 legend_spread_events.5310.a:0 "\"Use sua inteligência!\""
 legend_spread_events.5310.b.failure:0 "[potential_promoter.GetFirstNameNoTooltip] não é persuadido pelo presente"
 legend_spread_events.5310.b.success:0 "O atrativo do ouro se prova forte"
 legend_spread_events.5310.b:0 "Este presente de ouro pode persuadir [potential_promoter.GetSheHe]."
 legend_spread_events.5310.c.success:0 "[herald.GetFirstNameNoTooltip] se mostra eficaz"
 legend_spread_events.5310.c:0 "Apenas... vá lá e não estrague tudo."
 legend_spread_events.5310.desc:0 "Não consigo evitar de ficar inquieto enquanto [herald.GetFirstName] prepara provisões para sua visita à corte de [potential_promoter.GetFirstName], meu governante vizinho. [herald.GetFirstNameNoTooltip|U] tem a tarefa expressa de espalhar a palavra sobre [promoted_legend.GetName], preferencialmente sendo capaz de abordar o [potential_promoter.GetTitleAsNameNoTooltip] e persuadir [potential_promoter.GetSheHe] a se juntar à causa.\n\nElegância e graça serão necessárias para esta tarefa, e talvez alguns pesos extras..."
 legend_spread_events.5310.t:0 "Arauto da Lenda"
 legend_spread_events.5315.a.failure:0 "Você adivinhou incorretamente"
 legend_spread_events.5315.a.success:0 "[vassal.GetFirstNameNoTooltip] fica satisfeito"
 legend_spread_events.5315.a:0 "[vassal.GetSheHe|U] é uma pessoa muito determinada!"
 legend_spread_events.5315.b:0 "[promoted_legend.GetNameNoTooltip] também pode ser uma história de #EMP vingança#!..."
 legend_spread_events.5315.c:0 "Talvez eu devesse ser o mais honesto possível?"
 legend_spread_events.5315.d:0 "Eu poderia formular isso de forma a elogiar [vassal.GetSheHe]..."
 legend_spread_events.5315.desc:0 "Eu pauso, e escrevo, e pauso, e escrevo...\n\nAs palavras para este missiva devem ser escolhidas cuidadosamente. Qualquer frase solta para minha mensagem para [Select_CString( vassal.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('vassal'))], [vassal.GetFirstName], não será bem vista, mas o apoio [vassal.GetHerHim] a [promoted_legend.GetName] seria uma bênção de fato se eu acertar.\n\nAgora, vamos ver. O que exatamente #EMP é#! algo que [vassal.GetFirstNameNoTooltip] aprovaria?"
 legend_spread_events.5315.t:0 "Espalhando a Palavra"
 legend_spread_events.5320.a.artifact:0 "Seu [artifact.GetName] recebe um modificador de #negative_value prestígio negativo#!"
 legend_spread_events.5320.a.failure:0 "[vassal.GetFirstNameNoTooltip] recusa"
 legend_spread_events.5320.a.success:0 "[vassal.GetFirstNameNoTooltip] aceita gratamente"
 legend_spread_events.5320.a:0 "Certamente [vassal.GetSheHe] não recusaria isso?"
 legend_spread_events.5320.artifact:0 "\n\nMeu olhar se desvia para [artifact.GetName], do outro lado da sala. Será que [vassal.GetSheHe] seria persuadido por um presente como esse?"
 legend_spread_events.5320.b.failure:0 "[vassal.GetFirstNameNoTooltip] não fica impressionado"
 legend_spread_events.5320.b.success:0 "[vassal.GetFirstNameNoTooltip] fica encantado com a oferta"
 legend_spread_events.5320.b:0 "Um investimento em [capital_county.GetNameNoTierNoTooltip] poderia ser persuasivo."
 legend_spread_events.5320.c:0 "O favor do senhor feudal [vassal.GetHerHim|U] deve bastar."
 legend_spread_events.5320.d.success:0 "[vassal.GetFirstNameNoTooltip] segue seu exemplo"
 legend_spread_events.5320.d:0 "[vassal.GetSheHe|U] deveria seguir meu exemplo, independentemente!"
 legend_spread_events.5320.desc:0 "Um vassalo frequentemente clama para chamar a atenção de seu senhor feudal, mas desta vez essa mesa em particular virou-se. [vassal.GetFirstName] seria uma grande vantagem como defensor de [promoted_legend.GetName]. Devo fazer todo esforço para ter [vassal.GetSheHe] ao meu lado.\n\nDevo pensar cuidadosamente sobre o que seria melhor para chamar a atenção [vassal.GetHerHim]. Talvez uma promessa de investimento em suas propriedades? Talvez uma simples promessa de um favor?"
 legend_spread_events.5320.t:0 "Correndo Atrás"
 legend_spread_events.5325.a:0 "O peso de minhas palavras se provará valioso."
 legend_spread_events.5325.b:0 "Me juntarei às fileiras dos crentes públicos."
 legend_spread_events.5325.c.failure.tt:0 "Sua carta é mal recebida"
 legend_spread_events.5325.c.failure:0 "[promoted_legend_owner.GetFirstNameNoTooltip] não fica impressionado"
 legend_spread_events.5325.c.success.tt:0 "Sua carta é bem recebida"
 legend_spread_events.5325.c.success:0 "[promoted_legend_owner.GetFirstNameNoTooltip] fica encantado com a oferta"
 legend_spread_events.5325.c:0 "Endossarei isso; mas por uma quantia..."
 legend_spread_events.5325.d:0 "Isso é tudo absurdo!"
 legend_spread_events.5325.desc:0 "Mais #EMP uma#! missiva — desta vez de [legend_person.GetFirstName] — me é entregue por um mensageiro, e já sei do que se trata. As histórias de [promoted_legend.GetName] têm se espalhado longe e amplamente, e ainda mais bocas começam a levá-las ainda mais longe.\n\nÉ de fato uma grande história. Talvez haja algumas vantagens em me juntar aos likes de [legend_person.GetFirstNameNoTooltip]?"
 legend_spread_events.5325.protag:0 "\n\nOu, talvez, alguns benefícios materiais? O sujeito da lenda, [promoted_legend_owner.GetFirstName], tem interesse em sua disseminação. [promoted_legend_owner.GetSheHe|U] também possui uma quantia justa de riqueza. Talvez uma resposta à missiva traga frutos?"
 legend_spread_events.5325.stop_promoting:0 "Eu paro de promover minha [legend|E] atual"
 legend_spread_events.5325.stop_promoting_warning:0 "@alert_icon! #alert_trial Isso exigirá que você desista de sua [legend|E] atual!#!"
 legend_spread_events.5325.t:0 "Pássaros Mensageiros"
 legend_spread_events.5326.a:0 "Excelente!"
 legend_spread_events.5326.b:0 "Não abandonarei minha história atual."
 legend_spread_events.5326.desc:0 "Sua proposta tem muito mérito! Por favor, aceite este presente em troca de seus esforços em espalhar a boa palavra sobre [promoted_legend.GetName]."
 legend_spread_events.5326.opening:0 "[ROOT.Char.Custom2('AppropriateGreetingPositive', promoted_legend_owner)]"
 legend_spread_events.5327.a:0 "Droga!"
 legend_spread_events.5327.desc:0 "Sua tentativa de suborno é tola e insultante! Meus feitos renomados não precisam de sua língua venenosa para serem divulgados!"
 legend_spread_events.5327.opening:0 "[ROOT.Char.Custom2('AppropriateGreetingNegative', promoted_legend_owner)]"
 legend_spread_events.5330.a:0 "Como ousa [promoted_legend_owner.GetSheHe]! Sou um [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] piedoso!"
 legend_spread_events.5330.b:0 "Não posso ser associado a [promoted_legend_owner.GetSheHe]."
 legend_spread_events.5330.c.success:0 "Sua reputação aumenta a de [promoted_legend_owner.GetFirstNamePossessiveNoTooltip]"
 legend_spread_events.5330.c:0 "Fingirei que não vi apenas desta vez..."
 legend_spread_events.5330.desc:0 "Um bom conto certamente deve ser promovido por uma boa pessoa, não é mesmo? No entanto, chegam até mim rumores sobre os modos pecaminosos de [promoted_legend_owner.GetFirstName], a [promoted_legend_owner.GetWomanMan] que insistentemente vende [promoted_legend.GetName].\n\nEu poderia me distanciar de um personagem de tão má reputação, mas ser associado a um conto tão famoso também me traz algum benefício..."
 legend_spread_events.5330.t:0 "Sussurros Inadequados"
 legend_spread_events.5335.a:0 "Que bênção é nutrir a lenda [promoted_legend_owner.GetHerHim]!"
 legend_spread_events.5335.b:0 "Talvez eu possa aproveitar isso para avançar ambas as nossas causas..."
 legend_spread_events.5335.c.success:0 "Você ganha algumas percepções de [promoted_legend_owner.GetFirstNameNoTooltip]"
 legend_spread_events.5335.c:0 "Será que posso aprender algo com [promoted_legend_owner.GetSheHe]?"
 legend_spread_events.5335.desc:0 "Obviamente, espera-se que eu fale sobre o bom conto de [promoted_legend.GetName], mas deve-se dizer que isso é facilitado pelo porte esplêndido e pela moral irrepreensível de [promoted_legend_owner.GetFirstName].\n\nNobre e plebeu falam sobre a personalidade virtuosa [promoted_legend_owner.GetHerHim], e certamente não deixou de chegar aos meus ouvidos."
 legend_spread_events.5335.t:0 "Um Tópico Digno"
 legend_spread_events.5400.a.majorsuccess:0 "Seus embelezamentos adicionam muito à história"
 legend_spread_events.5400.a.minorsuccess:0 "Seus embelezamentos são bastante modestos"
 legend_spread_events.5400.a:0 "\"Claro, vou revisar mais uma vez!\""
 legend_spread_events.5400.b.failure:0 "Os ajustes parecem um pouco patéticos"
 legend_spread_events.5400.b.success:0 "Sua interpretação é plausível"
 legend_spread_events.5400.b:0 "\"Bem, sabe, muitas vezes é mal citado...\""
 legend_spread_events.5400.c:0 "Talvez seja melhor deixar a história crescer naturalmente?"
 legend_spread_events.5400.desc:0 "\"Se eu puder lhe incomodar por um momento, [ROOT.Char.Custom('FormOfAddressForLiege')],\" começa [chronicler.GetFirstName], um pouco suplicante para o meu gosto, \"seria de grande ajuda para nós se pudéssemos adicionar mais detalhes a [promoted_legend.GetName]. Quanto mais... #EMP grandioso,#! melhor!\" [chronicler.GetSheHe|U] me olha expectativamente.\n\nAlguns pensamentos de conspiração começam a brotar em minha mente. Revisar a história existente em detalhes mais extravagantes certamente não faria mal, mas substituir aquela parte da história por outra inteiramente tem seus próprios méritos..."
 legend_spread_events.5400.t:0 "Embelezamentos Necessários"
 legend_spread_events.5405.a.failure:0 "Seu relato carece de credibilidade"
 legend_spread_events.5405.a.success:0 "Seu relato é cativante"
 legend_spread_events.5405.a:0 "\"De fato encontrei!\""
 legend_spread_events.5405.b.failure:0 "[chronicler.GetFirstNameNoTooltip] não acredita em você"
 legend_spread_events.5405.b.success:0 "Você inventa com sucesso uma nova criatura na hora"
 legend_spread_events.5405.b:0 "\"Isso é absurdo. Mas eu #EMP vi#! algo diferente...\""
 legend_spread_events.5405.c:0 "\"Quem pode dizer? Vi tantas coisas maravilhosas...\""
 legend_spread_events.5405.desc:0 "\"Venha agora, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [chronicler.GetFirstName] insiste em um ponto enquanto discutimos mais detalhes sobre [promoted_legend.GetName].\n\n\"Eu preciso saber - o #EMP povo#! precisa saber,\" [chronicler.GetSheHe] faz gestos grandiosos, mas sem direção, \"que verdade há nesses rumores?\" Mal consegui abrir a boca para perguntar antes que [chronicler.GetSheHe] continuasse.\n\n\"Que você encontrou uma poderosa [ROOT.Char.Custom('RegionalMythicalCreature')] em suas viagens, nada menos!\""
 legend_spread_events.5405.t:0 "Rumores da Natureza Selvagem"
 legend_spread_events.5410.a.failure:0 "[chronicler.GetFirstNameNoTooltip] parece incerto com a revelação"
 legend_spread_events.5410.a.flavor:0 "Tais rumores circulam há muitos anos, afinal..."
 legend_spread_events.5410.a.success:0 "A notícia de sua descoberta se espalha como fogo"
 legend_spread_events.5410.a:0 "\"Há outro grande continente, onde crescem as frutas do vinho...\""
 legend_spread_events.5410.b:0 "Monstros ferozes fazem seu abode nas profundezas caprichosas!"
 legend_spread_events.5410.c:0 "Nossa exploração foi interrompida por batalhas com piratas ferozes."
 legend_spread_events.5410.d:0 "\"Lá fora? Nada além de mais oceano e morte.\""
 legend_spread_events.5410.desc:0 "Cada vez mais [ROOT.Char.Custom('GetWritingMaterialPlural')] são preenchidos enquanto [chronicler.GetFirstName] registra minha história. Viagens sobre colinas e vales, através de rios poderosos e até mesmo...\n\n\"Você se aventurou até lá, [ROOT.Char.Custom('FormOfAddressForLiege')]?\" Os olhos de [chronicler.GetFirstNamePossessiveNoTooltip] se enchem de admiração. \"Tão longe no oceano selvagem?\"\n\nNinguém sabe o que há além de nossas águas seguras e conhecidas. Algumas suposições comumente aceitas, talvez, mas esta é a minha oportunidade de contar minha própria história?"
 legend_spread_events.5410.t:0 "O Que Há Além?"
 legend_spread_events.5415.a:0 "É #EMP claramente#! um conto de nobre."
 legend_spread_events.5415.b:0 "É claro que é sobre o povo comum!"
 legend_spread_events.5415.c.protag:0 "...você não escreveu #EMP meu#! nome o suficiente?"
 legend_spread_events.5415.c:0 "Claramente é um conto sobre [protagonist.GetFirstNameNoTooltip], mais ninguém!"
 legend_spread_events.5415.desc:0 "A maravilhosa história de [ROOT.Char.GetPromotedLegend.GetName] continua a se espalhar, mais e mais pessoas de todos os estratos da sociedade começaram a tecer sua própria perspectiva em sua rica tapeçaria. É o que diz [chronicler.GetFirstName], pelo menos.\n\n\"Senhor e senhora têm certeza de que tal história afirma seu indiscutível direito de governar,\" [chronicler.GetSheHe] reflete, \"mas se você entrar em uma taverna local, estará repleta de pessoas que dizem que é dedicada ao povo comum da terra e seus modos honestos e industriais."
 legend_spread_events.5415.t:0 "Povo Comum?"
 legend_spread_events.5420.a.failure:0 "Você desmaia após algumas xícaras"
 legend_spread_events.5420.a.success:0 "Você esvazia o barril inteiro"
 legend_spread_events.5420.a:0 "Traga-me um barril e eu provarei isso!"
 legend_spread_events.5420.b.failure:0 "[chronicler.GetFirstNameNoTooltip] permanece não convencido"
 legend_spread_events.5420.b.success:0 "[chronicler.GetFirstNameNoTooltip] está convencido"
 legend_spread_events.5420.b:0 "Aconteceu. É melhor você acreditar!"
 legend_spread_events.5420.c.tt:0 "Você desenvolve uma reputação"
 legend_spread_events.5420.c:0 "Estou... é... estou terrivelmente #EMP resfriado#! agora..."
 legend_spread_events.5420.desc:0 "[chronicler.GetFirstName] continua a anotar cada vez mais histórias de [ROOT.Char.GetPromotedLegend.GetName], até que de repente [chronicler.GetSheHe] pausa, um sorriso astuto nos lábios.\n\n\"Agora, eu ouvi #EMP uma#! história bastante interessante,\" [chronicler.GetSheHe] começa devagar, \"de uma certa competição de bebida com um ogro, de todas as coisas! Como nossa [ROOT.Char.Custom('GetHeroineHero')] fez bem, para ser capaz de beber tal criatura sob a mesa! Talvez uma demonstração me permitisse verdadeiramente apreciar tal façanha?\"\n\nNão sei de onde veio esse conto exagerado, mas uma certa quantidade de orgulho começa a surgir..."
 legend_spread_events.5420.t:0 "Um Bebida Lendária"
 legend_spread_events.8000.a:0 "Estou indo em uma aventura!"
 legend_spread_events.8000.b:0 "Vou ficar em casa!"
 legend_spread_events.8000.desc:0 "Apesar de todos os esforços, ainda há aqueles que negam que os [promoted_legend.GetProtagonist.GetCulture.GetName] são os verdadeiros herdeiros do povo [promoted_legend.GetProperty('culture').Culture.GetName]. Hoje [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] veio até mim com algumas informações que dissuadiriam qualquer dúvida sobre a legitimidade da minha reivindicação!\n\n[chronicler.GetSheHe|U] me conta sobre um antigo tomo, [chronicler.GetSheHe] acredita existir em algum lugar em [promoted_legend.GetProperty('original_region').GeographicalRegion.GetName], [province_to_visit.GetName] para ser preciso. As fontes são potencialmente duvidosas, mas se eu tentasse encontrar este tomo, posso ainda provar a legitimidade de [promoted_legend.GetName]."
 legend_spread_events.8000.t:0 "O Tomo Oculto"
 legend_spread_events.8001.a:0 "Maldição!"
 legend_spread_events.8001.desc:0 "Infelizmente, as circunstâncias me forçaram a abandonar meus planos de viagem e o rastro de evidências que estava seguindo esfriou. Não há nada que eu possa fazer para perseguir o tomo agora, e receio que ele possa ter se perdido no tempo."
 legend_spread_events.8001.t:0 "O Tomo dos [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: Perdido no Tempo"
 legend_spread_events.8002.a:0 "É necessário um estudo cuidadoso."
 legend_spread_events.8002.b:0 "Ao inferno com as ruínas, devo encontrar esse tomo!"
 legend_spread_events.8002.c:0 "Há tanto para aprender aqui, ao inferno com o tomo!"
 legend_spread_events.8002.d:0 "Li sobre este lugar! Eu sei exatamente onde procurar."
 legend_spread_events.8002.desc:0 "Finalmente cheguei em [province_to_visit.GetName] e após algumas orientações rápidas dos locais, encontrei as ruínas onde se acredita que o túmulo exista. Este monumento em ruínas da outrora grande civilização [promoted_legend.GetProperty('culture').Culture.GetName] me lembra tanto [promoted_legend.GetProperty('title').Title.GetNameNoTier], estou certo de que a evidência da conexão está em algum lugar!\n\nAs ruínas estão em um estado delicado, ouço os suportes desmoronarem e enfraquecerem sob o peso dos anos, e devo pisar com cuidado se não quiser correr o risco de destruir o monumento completamente."
 legend_spread_events.8002.t:0 "O Tomo dos [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: Chegada"
 legend_spread_events.8003.a:0 "Que descoberta incrível!"
 legend_spread_events.8003.desc:0 "Tenho buscado nas ruínas com meu séquito por dias, e ainda não encontrei nada que indicasse uma ligação entre os [promoted_legend.GetProtagonist.GetCulture.GetCollectiveNoun] e os [promoted_legend.GetProperty('culture').Culture.GetCollectiveNoun]. Então, de repente, meu grupo me apresenta uma caixa meio destruída pela crueldade do tempo, um livro espesso com poeira e sujeira dentro.\n\nAlguns golpes e uma sacudida, e encontro o livro repleto de criaturas da mitologia [promoted_legend.GetProperty('culture').Culture.GetName] representadas em um estilo distintamente [promoted_legend.GetProtagonist.GetCulture.GetNameNoTooltip]! Embora as palavras tenham desaparecido e se perdido no tempo, eu simplesmente devo acreditar que este maravilhoso livro prova uma ligação definitiva entre as duas culturas!"
 legend_spread_events.8003.t:0 "O Tomo dos [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: Desenterrado"
 legend_spread_events.8004.a:0 "Pelo menos não foi um completo desperdício."
 legend_spread_events.8004.desc:0 "Eu e meu séquito buscamos essas ruínas tão bem quanto possível, e ainda nenhum sinal desse suposto tomo foi encontrado. No entanto, há uma série de objetos de grande intriga espalhados entre os destroços, alguns dos quais não há dúvida de que foram criados pelas mãos [promoted_legend.GetProperty('culture').Culture.GetName].\n\nEu coloco no bolso uma pequena escultura de animal de pedra e me preparo para voltar para casa."
 legend_spread_events.8004.t:0 "O Tomo dos [promoted_legend.GetProperty('culture').Culture.GetNameNoTooltip]: Perdido"
 legend_spread_events.8010.a:0 "\"Nossa batalha será lendária.\""
 legend_spread_events.8010.b:0 "\"Guardas!\""
 legend_spread_events.8010.desc:0 "Paramos para um intervalo na estrada. Meu séquito cerca um clareira, apressando-se em procurar por bandidos e reunir suprimentos, deixando-me sozinho por apenas um momento. O vento apaga minha fogueira crepitante como um fósforo à minha respiração. Sinto algo atrás de mim e me viro para ver um estranho que encontrou o caminho até meu acampamento. [challenger.GetSheHe|U] sorri com desleixo, como se [challenger.GetSheHe] sempre estivesse lá.\n\n\"Que dia de sorte é encontrar a 'lenda' [ROOT.Char.GetHerselfHimself], [ROOT.Char.GetNameNoTooltip].\" [challenger.GetSheHe|U] revela sua arma para mim. \"Prove ser uma lenda, [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('challenger'))].\""
 legend_spread_events.8010.t:0 "Uma Figura Estranha"
 legend_spread_events.8012.a:0 "Todos os outros viram [challenger.GetSheHe], certo?"
 legend_spread_events.8012.b:0 "Ninguém viu nada."
 legend_spread_events.8012.desc:0 "Meu séquito retorna justo a tempo de me ver cair aos pés [challenger.GetHerHim]. No momento em que me levanto para enfrentar meu poderoso e estranho oponente, [challenger.GetSheHe] parece ter desaparecido na selva, como se [challenger.GetSheHe] nunca estivesse estado lá."
 legend_spread_events.8012.t:0 "As Lendas Morrem"
 legend_spread_events.8013.a:0 "Eu venci... Eu acho."
 legend_spread_events.8013.desc:0 "Meu séquito retorna justo quando eu saio vitorioso sobre meu oponente misterioso. A arma [challenger.GetHerHim|U] cai ao chão, e [challenger.GetSheHe] me olha, atordoado.\n\nChamo meu séquito, mas quando olho para meus pés, [challenger.GetSheHe] desapareceu, como se [challenger.GetSheHe] nunca estivesse estado lá."
 legend_spread_events.8013.t:0 "Uma Vitória Lendária"
 legend_spread_events.8020.a.lose:0 "Você perdeu o debate"
 legend_spread_events.8020.a.win:0 "Você venceu o debate"
 legend_spread_events.8020.a:0 "Posso convencê-los."
 legend_spread_events.8020.b:0 "Tire ess[Select_CString( challenger.IsFemale, 'a', 'e' )] [challenger.Custom2('InsultNoun', ROOT.Char)] da minha [ROOT.Char.Custom('GetCourt')]!"
 legend_spread_events.8020.c:0 "Não, o poder divino é derivado #EMP de#! [ROOT.Char.GetFaith.HighGodName]."
 legend_spread_events.8020.desc:0 "Sou interrompido na [ROOT.Char.Custom('GetCourt')] hoje quando [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)] se lança em minha direção, apontando e gritando 'Herege!' em seu caminho.\n\n'[legend.GetName|U] afirma que [legend.GetProtagonist.GetNameNoTooltip] possui poderes além até mesmo de [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]! Heresia, do mais alto grau!'\n\n[challenger.GetSheHe|U] soa como um lunático para mim, mas murmúrios ao redor do [ROOT.Char.Custom('GetRoom')] indicam que alguns já concordam com [challenger.GetSheHe]."
 legend_spread_events.8020.t:0 "Heresia!"
 legend_spread_events.8030.a:0 "Deixe [child.GetSheHe] fazer isso."
 legend_spread_events.8030.b:0 "Devo oferecer minha própria recitação!"
 legend_spread_events.8030.desc:0 "Ao longe, ouço [child.Custom2('MyCharacterIntroduction', ROOT.Char)] rindo ao brincar com seus colegas.\n\n\"Eu sou [legend.GetProtagonist.GetNameNoTooltip], eu sou o herói!\" [child.GetSheHe|U] está reencenando [legend.GetName] para seus pares adoradores.\n\nAs crianças olham todas para [child.GetFirstNameNoTooltip] com admiração e adoração, cativadas pela história. Meu coração se eleva ao ouvir aqueles nomes e lugares lendários passando pelos lábios da próxima geração com tanto vigor e entusiasmo. Embora um dia todos nós nos tornemos poeira, a lenda nunca morrerá."
 legend_spread_events.8030.t:0 "Assim Como Você"
 legend_spread_events.8040.a.lose:0 "Sua reputação é manchada"
 legend_spread_events.8040.a.win:0 "Você convence [challenger.GetSheHe]"
 legend_spread_events.8040.a:0 "Isso tudo é um absurdo, com certeza."
 legend_spread_events.8040.b:0 "Blasfêmia, saia da minha [ROOT.Char.Custom('GetCourt')]!"
 legend_spread_events.8040.desc:0 "\"Você reivindicaria descendência do pecador vil [ancestor.GetName]?\" [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me cumprimenta esta manhã com o dedo estendido e um olhar furioso em seus olhos. \"Blasfêmia! [ancestor.GetSheHe|U] era um [ancestor.GetWomanMan] ímpio de vícios profanos. [ancestor.GetSheHe|U] não era [virtue_trait.GetName(ancestor)] como todos nós fomos levados a acreditar, [ancestor.GetSheHe] era [sin_trait.GetName(ancestor)], um pecador se é que já houve algum!\"\n\nJunto com a convicção na voz [challenger.GetHerHim], [challenger.GetSheHe] trouxe inúmeros registros e anedotas escritas do comportamento impio de [ancestor.GetNamePossessiveNoTooltip] que não favorecem minhas reivindicações à linhagem [ancestor.GetHerHim]..."
 legend_spread_events.8040.t:0 "Um Antepassado Pecaminoso"
 legend_spread_events.8050.a.lose:0 "Você falhou em convencer alguém"
 legend_spread_events.8050.a.win:0 "Você convenceu a todos"
 legend_spread_events.8050.a:0 "Deve ser verdade!"
 legend_spread_events.8050.b:0 "Vamos nos concentrar nas coisas que podemos provar."
 legend_spread_events.8050.c:0 "Mas... e eu?"
 legend_spread_events.8050.desc:0 "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vem apressado até mim esta manhã, equilibrando uma pilha de [chronicler.Custom('GetWritingMaterialPlural')] antigos, seu rosto irradiando entusiasmo.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], tenho excelentes notícias. Tenho procurado informações sobre [ancestor.GetName], e encontrei evidências que sugerem que a natureza [sin_trait.GetName(ancestor)] [ancestor.GetHerHim] foi exagerada, e [ancestor.GetSheHe] na verdade era bastante [virtue_trait.GetName(ancestor)]!\"\n\nSeria difícil, mas se eu puder provar que isso é verdadeiro, o legado de [ancestor.GetNameNoTooltip] seria ainda mais prestigioso!"
 legend_spread_events.8050.t:0 "Um Antepassado Virtuoso"
 legend_spread_events.8060.a.lose:0 "Sua alegação continua sem convencer"
 legend_spread_events.8060.a.win:0 "Você convenceu a todos"
 legend_spread_events.8060.a:0 "Claro, [ancestor.GetSheHe] era um [ROOT.Char.GetFaith.GetAdherentNameNoTooltip]!"
 legend_spread_events.8060.b:0 "Os #EMP valores [ancestor.GetHerHim|U] eram pelo menos [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip]."
 legend_spread_events.8060.desc:0 "Sou recebido por [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)], que afirma ter novas informações sobre [legend.GetName].\n\n[chronicler.GetSheHe|U] afirma que no leito de morte de [ancestor.GetNamePossessive], [ROOT.Char.GetFaith.HighGodName] entrou no coração [ancestor.GetHerHim] e iluminou [ancestor.GetSheHe] quanto às virtudes do [ROOT.Char.GetFaith.GetName].\n\nNeste ato final, [ancestor.GetSheHe] foi redimido e conduzido ao [ROOT.Char.GetFaith.PositiveAfterLife]."
 legend_spread_events.8060.t:0 "Uma Confissão no Leito de Morte"
 legend_spread_events.8070.a.lose:0 "Ninguém está convencido"
 legend_spread_events.8070.a.win:0 "Todos estão convencidos"
 legend_spread_events.8070.a:0 "Vamos fazer isso."
 legend_spread_events.8070.b:0 "Não, [location.GetNameNoTooltip] é apenas #EMP como#! [holy_site.GetNameNoTooltip]."
 legend_spread_events.8070.desc:0 "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] veio até mim hoje com uma proposta interessante. [chronicler.GetSheHe|U] afirma que [chronicler.GetSheHe] poderia distorcer um pouco a verdade e reescrever [legend.GetName] para se passar nas terras sagradas de [holy_site.GetName] em vez do local terreno [location.GetName].\n\nIsso seria, é claro, uma falsificação, mas adicionaria um pouco mais de piedade à história."
 legend_spread_events.8070.t:0 "Um Acontecimento Sagrado"
 legend_spread_events.8080.a.crit_lose:0 "Ninguém acredita em você"
 legend_spread_events.8080.a.crit_win:0 "Todos acreditam em você"
 legend_spread_events.8080.a.lose:0 "As pessoas não parecem acreditar em você"
 legend_spread_events.8080.a.win:0 "As pessoas parecem acreditar em você"
 legend_spread_events.8080.a:0 "Sim. Isso é exatamente o que aconteceu."
 legend_spread_events.8080.b:0 "Ela foi morta como qualquer caçador faria."
 legend_spread_events.8080.desc:0 "Estou envolvido em uma conversa animada com [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] e uma coleção de meus cortesãos. Estou recontando a história de [legend.GetName] quando sou interrompido por [chronicler.GetNameNoTooltip].\n\n\"Lembre-me como a [legend.GetProperty('beast').GetFlagName] foi morta exatamente, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Não é verdade que ela foi espancada até a morte em combate corpo a corpo?\""
 legend_spread_events.8080.t:0 "O Punho Lendário"
 legend_spread_events.8090.a:0 "Ah sim, como poderíamos esquecer."
 legend_spread_events.8090.b:0 "Bobagem: Eu a inventei!"
 legend_spread_events.8090.desc:0 "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está transcrevendo [legend.GetName] para [chronicler.Custom('GetWritingMaterial')] enquanto eu ditava a ela mais uma vez, mas quando relembro o início da história, [chronicler.GetSheHe] para de anotar minhas palavras.\n\n\"Não consigo deixar de notar algo faltando aqui, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]. [legend.GetProtagonist.GetShortUIName] não se encontrou com uma [person_of_the_lake.GetWomanMan] mística em [watery_place.GetName]? Não foi dito que essa [person_of_the_lake.GetWomanMan] emergiu das águas e deu a [legend.GetProtagonist.GetShortUIName] uma missão divina?\""
 legend_spread_events.8090.t:0 "[person_of_the_lake.GetLadyLord|U] de [watery_place.GetProvince.GetTerrain.GetNameNoTooltip|U]"
 legend_spread_events.8100.a.crit_lose:0 "Você cai em um acesso"
 legend_spread_events.8100.a.lose:0 "Você falha na invocação"
 legend_spread_events.8100.a.win:0 "Você infunde o espírito"
 legend_spread_events.8100.a:0 "Vou infundir isso em meu artefato!"
 legend_spread_events.8100.b:0 "Você está louco? Saia daqui!"
 legend_spread_events.8100.c:0 "Eu sei exatamente o que fazer."
 legend_spread_events.8100.d:0 "Vou absorver o espírito em mim mesmo!"
 legend_spread_events.8100.desc:0 "Sou arrancado do meu sono por um raio e a minha [ROOT.Char.Custom('GetDoor')] se abrindo com estrondo, [superstitious_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] de pé ao pé da minha cama.\n\n'Sinto muito por te acordar, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], mas muitos de nós não conseguem dormir. Acredito firmemente que há um espírito maligno em ação aqui, e ele quer nos levar todos.'\n\nEmbora eu esteja mais do que um pouco irritado por ser acordado tão tarde, estou um tanto familiarizado com um ritual para aprisionar espíritos malignos em objetos..."
 legend_spread_events.8100.t:0 "Muito Assombrado"
 legend_spread_events.8110.a.lose:0 "Você não é convincente"
 legend_spread_events.8110.a.win:0 "Você os convence a ambos"
 legend_spread_events.8110.a:0 "É verdade, eu os matei todos sozinho."
 legend_spread_events.8110.b:0 "Não, isso é falso."
 legend_spread_events.8110.c:0 "A batalha foi grandiosa e deve ser comemorada."
 legend_spread_events.8110.desc:0 "\"Ah, para com isso, não há chance de isso ter acontecido.\"\n\n\"Não, é verdade! [infidel_weapon.GetName|U] está vermelha com o sangue de milhares de [loser.GetFaith.GetAdherentNamePluralNoTooltip]! [ROOT.Char.GetNameNoTooltip|U] os matou todos [ROOT.Char.GetHerselfHimself] no [memory.GetName]!\"\n\n[courtier_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] e [courtier_2.Custom2('MyCharacterIntroduction', ROOT.Char)] estão profundamente envolvidos em uma discussão, mas ficam em silêncio quando percebem que estou ouvindo."
 legend_spread_events.8110.t:0 "O Sangue dos [loser.GetFaith.GetAdherentNamePluralNoTooltip]"
 legend_spread_events.8120.a:0 "Eu devo ir para lá!"
 legend_spread_events.8120.b:0 "[distant_title.GetBaseNameNoTooltip|U]? Nenhum lugar assim pode existir."
 legend_spread_events.8120.desc:0 "Sou cumprimentado cortesmente por [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)], que parece estar muito animado.\n\n[chronicler.GetSheHe|U] me fala sobre uma terra mística conhecida simplesmente como \"[distant_title.GetBaseNameNoTooltip|U]\", e [chronicler.GetSheHe] desenrola um mapa desta maravilhosa terra diante de mim. [chronicler.GetSheHe|U] me diz que os rios correm com leite e mel, e até mesmo os camponeses estão gordos com a abundância da terra. Embora normalmente eu nunca me aventurasse tão longe, histórias de minha jornada heroica certamente teriam um efeito sobre [legend.GetName]!"
 legend_spread_events.8120.t:0 "O Místico [distant_title.GetBaseNameNoTooltip|U]"
 legend_spread_events.8121.a:0 "Ai."
 legend_spread_events.8121.desc:0 "Meu maravilhoso mapa de [distant_title.GetBaseNameNoTooltip|U] foi perdido e temo que eu nunca possa viajar para aquela terra em minha vida."
 legend_spread_events.8121.t:0 "Terras Distantes: Abandonadas"
 legend_spread_events.8122.a:0 "Quero ver como as pessoas lutam aqui."
 legend_spread_events.8122.b.failure:0 "[distant_liege.GetFirstName] está entediado"
 legend_spread_events.8122.b.success:0 "Sua lenda é cativante"
 legend_spread_events.8122.b:0 "Deixe-me contar ao seu mestre sobre [legend.GetName]."
 legend_spread_events.8122.c:0 "Você tem um presente para mim?"
 legend_spread_events.8122.desc.bridge:0 "\n\nFaço meu caminho até o que presumo ser a casa de uma família nobre e sou recebido por"
 legend_spread_events.8122.desc.disappointing.dry:0 "Estou chocado com o estado deste lugar. Algumas plantas ressequidas espalham-se por uma paisagem abandonada de edifícios em ruínas, com escassamente um ser vivo à vista."
 legend_spread_events.8122.desc.disappointing.fallback:0 "isso está longe do que me prometeram. A grande terra mágica de \"[distant_title.GetBaseNameNoTooltip|U]\" que excitava minha imaginação é apenas isso: imaginária. O real [distant_title.GetBaseNameNoTooltip] é triste e humilde."
 legend_spread_events.8122.desc.disappointing.sweden:0 "minha decepção é imensurável. O céu está negro durante o dia, a comida não passa de peixe em conserva e pão mofado, os locais se recusam a falar uns com os outros, e o frio é insuportável."
 legend_spread_events.8122.desc.disappointing.tribal:0 "Não poderia estar mais decepcionado. Me prometeram uma metrópole imponente, mas tudo que vejo são algumas tendas e cabanas."
 legend_spread_events.8122.desc.disappointing.wet:0 "Estou triste com o que vejo. Depois de atravessar águas, vejo algumas cabanas dispersas construídas em torno de águas lamacentas."
 legend_spread_events.8122.desc.intro:0 "Finalmente, cheguei na distante [distant_location.GetName] e"
 legend_spread_events.8122.desc.not_disappointing:0 "[distant_title.GetBaseNameNoTooltip] é exatamente o que eu esperava! Este lugar estranho está cheio de pessoas e civilização expansiva. Bancas de mercado estão repletas de comida e a cidade está viva com conversas."
 legend_spread_events.8122.desc.outro.fallback:0 "um nobre estranho [distant_courtier.GetWomanMan]. Minha postura nobre claramente me precede, pois [distant_courtier.GetSheHe] parece imediatamente ansioso para saber quem sou e o que me traz aqui."
 legend_spread_events.8122.desc.outro.same_culture:0 "um [distant_courtier.GetWomanMan] estranhamente familiar. [distant_courtier.GetName|U] se apresenta em perfeito [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] e exige saber o que quero da corte de seu empregador, [distant_liege.GetName]."
 legend_spread_events.8122.desc.outro.same_religion:0 "um bom [ROOT.Char.GetFaith.GetReligion.GetAdherentNameNoTooltip] [distant_courtier.GetWomanMan]! Parece que até aqui, [ROOT.Char.GetFaith.HighGodName|U] é adorado adequadamente. [distant_courtier.GetSheHe|U] exige saber quem sou e o que me traz até aqui."
 legend_spread_events.8122.desc.slightly_disappointing:0 "[distant_title.GetBaseNameNoTooltip] não é exatamente o que me prometeram. Embora um assentamento impressionante, os rios não fluem com leite e mel, e a riqueza da nobreza local não parece particularmente inimaginável."
 legend_spread_events.8122.desc.somewhat_disappointing:0 "Não consigo deixar de ficar desapontado. Embora seja um assentamento perfeitamente adequado, se este é o melhor que [distant_title.GetBaseNameNoTooltip] tem a oferecer, então seu esplendor foi muito exagerado."
 legend_spread_events.8122.t:0 "Terras Distantes: Chegada"
 legend_spread_events.8124.a:0 "Ai."
 legend_spread_events.8124.desc:0 "Embora tenha lutado valentemente, parece que não sou páreo para os estilos de luta de um guerreiro [distant_title.GetAdjective]. Embora derrotado, o simples fato de ter enfrentado armas com um estrangeiro nesta terra mística aumentará meu status lendário."
 legend_spread_events.8124.t:0 "Terras Distantes: Derrota"
 legend_spread_events.8125.a:0 "Maravilhoso."
 legend_spread_events.8125.b:0 "Junte-se a mim!"
 legend_spread_events.8125.desc:0 "Meu oponente lutou de maneiras que eu nunca havia visto antes, e embora inicialmente isso me tenha desconcertado, saí vitorioso. As lendas sobre minha vitória sobre um guerreiro [distant_title.GetAdjective] certamente se espalharão por todo lugar."
 legend_spread_events.8125.t:0 "Terras Distantes: Vitória"
 legend_spread_events.8130.a.lose:0 "Sua reivindicação é considerada heresia"
 legend_spread_events.8130.a.win:0 "Sua reivindicação é plausível"
 legend_spread_events.8130.a:0 "Isso é verdade."
 legend_spread_events.8130.b:0 "Não, isso é herético."
 legend_spread_events.8130.desc:0 "[chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)|U] vem até mim com notícias sobre [legend.GetName]. [chronicler.GetSheHe|U] me diz que [chronicler.GetSheHe] localizou vários registros que atestam que [founder.GetName] era mais do que um mero [founder.GetTitleAsNameNoTooltip]. Seu direito como governante de [legend_title.GetName] foi dado a [founder.GetSheHe] por um anjo.\n\nEste mensageiro de [ROOT.Char.GetFaith.PositiveAfterLife] prometeu que a casa de [ROOT.Char.GetHouse.GetNameNoTooltip] governaria para sempre [legend_title.GetName] e promulgaria a vontade de [ROOT.Char.GetFaith.HighGodName] na terra. Embora uma reivindicação incrível, se eu pudesse fazer com que pessoas suficientes acreditassem nisso, ninguém questionaria meu domínio."
 legend_spread_events.8130.t:0 "Uma Iniciação Angelical"
 legend_spread_events.8141.a:0 "Uma lenda digna de ser contada."
 legend_spread_events.8141.b:0 "Isso foi uma premonição do que está por vir."
 legend_spread_events.8141.desc:0 "À medida que as forças de [enemy_commander.GetNamePossessive] são derrotadas, fico sozinho para me banhar em minha própria glória. Ao meu redor estão bandeiras rasgadas e os cadáveres em decomposição daqueles que se opõem a mim. Um soldado jaz ao meu lado, chorando em angústia, mãos ensanguentadas em suas próprias entranhas. Respiro fundo aquele ar pungente e mortal, o cheiro da vitória.\n\nVerdadeiramente, esta batalha foi decidida por minha própria destreza como cavaleiro e estratégia como comandante. Esta foi uma batalha que certamente tornará meu nome famoso."
 legend_spread_events.8141.t:0 "Uma Vitória Legendária"
 legend_spread_events.8150.a:0 "\"Fui ferido lutando contra uma besta poderosa!\""
 legend_spread_events.8150.b:0 "\"Fui atacado por infiéis enquanto lutava por [ROOT.Char.GetFaith.HighGodName|U].\""
 legend_spread_events.8150.c:0 "\"É uma história que levarei para o túmulo.\""
 legend_spread_events.8150.d:0 "\"Você não tem maneiras? Não fique olhando!\""
 legend_spread_events.8150.desc:0 "Enquanto me banqueteio, sinto que [intrigued_guest.Custom2('MyCharacterIntroduction', ROOT.Char)] tem observado atentamente minha [ROOT.Char.Custom('GetInjuredBodyPart')], sem dúvida intrigada por minha [ROOT.Char.Custom('PermanentInjuryAdjective')].\n\nAssim que percebo que a chamei atenção [intrigued_guest.GetHerHim], [intrigued_guest.GetSheHe] rapidamente desvia o olhar, sem dúvida envergonhado por ter sido pego encarando minha deformidade. Embora me sinta um pouco insultado pela fascinação [intrigued_guest.GetHerHim], isso me dá a oportunidade de contar a história de como essa lesão ocorreu."
 legend_spread_events.8150.t:0 "A Marca Permanente"
 legend_spread_events.8160.a:0 "Seremos lendas juntos."
 legend_spread_events.8160.b:0 "Não, a história é somente para mim."
 legend_spread_events.8160.desc:0 "Meu coração palpita ao pensar [Select_CString( soulmate.IsFemale, 'nela', 'nele' )], e mesmo enquanto estou sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em minha [SelectLocalization(IsLandlessAdventurer(ROOT.Char), 'tenda', 'estudo')], só desejo cantar sobre nosso amor para todos que quiserem ouvir. Minha [ROOT.Char.Custom('WritingInstrument')] no papel, meus sentimentos fluem pela tinta mais rápido do que consigo escrever.\n\nÀ medida que preencho a página com os louvores [soulmate.GetHerHim], não consigo deixar de pensar em como poderia imortalizar nosso amor através de [legend.GetName]! Embora a história seja focada em mim, conquistar o coração da minha doce [soulmate.Custom('PetName')] seria uma excelente adição ao conto."
 legend_spread_events.8160.t:0 "Um Amor Legendário"
 legend_spread_events.8170.a:0 "Eu devo me tornar imortal."
 legend_spread_events.8170.b.chess:0 "[ROOT.Char.GetFaith.DeathDeitySheHe|U] provavelmente só queria jogar xadrez."
 legend_spread_events.8170.b.fallback:0 "Foi um sonho. Apenas isso, e nada mais."
 legend_spread_events.8170.desc.intro:0 "Retiro-me para meus aposentos uma noite, exausto e cansado de mais um dia de tédio e monotonia. Enquanto estou à beira do sono, sou repentinamente despertado pelo estridente rangido de metal sobre pedra.\n\nLevanto-me rapidamente e vejo uma figura sombria à beira da minha cama, o sorriso sardônico [ROOT.Char.GetFaith.DeathDeityHerHim] a única parte iluminada [ROOT.Char.GetFaith.DeathDeityHerHim] que consigo ver claramente. Não consigo me mover, só posso olhar enquanto [ROOT.Char.GetFaith.DeathDeitySheHe] se aproxima de mim, com um punhal na mão.\n\nEntão, subitamente, acordo novamente."
 legend_spread_events.8170.desc.mid.fallback:0 "[ROOT.Char.GetFaith.DeathDeitySheHe|U] me marcou com esta visita."
 legend_spread_events.8170.desc.mid.reincarnation:0 "Embora meu espírito um dia continue no ciclo da reencarnação, ainda não estou pronto."
 legend_spread_events.8170.desc.mid.taoist:0 "Isso é um sinal claro de que minhas energias não estão harmonicamente alinhadas em direção a [ROOT.Char.GetFaith.HighGodName|U]."
 legend_spread_events.8170.desc.outro:0 "Temo que eu seja recolhido por [ROOT.Char.GetFaith.DeathDeityName|U] muito em breve, um destino que devo mudar!"
 legend_spread_events.8170.t:0 "Para Quem Os Sinos Tocam"
 legend_spread_events.8171.a:0 "A história nunca termina."
 legend_spread_events.8171.desc:0 "Enquanto seguro meu recém-nascido nos braços, não consigo deixar de ver meu próprio rosto refletido n[child.GetSheHe]. Todos me dizem que [child.GetSheHe] se parece muito comigo, e estão certos.\n\nTalvez esse seja o tipo de imortalidade que tenho procurado, alguém para levar adiante meu legado e continuar minha história quando eu partir."
 legend_spread_events.8171.t:0 "Ecos do Futuro"
 legend_spread_events.8172.a.flavor:0 "Você acorda, uma [ROOT.Char.GetWomanMan] mudada!"
 legend_spread_events.8172.a:0 "\"Entendi. Finalmente entendi.\""
 legend_spread_events.8172.b.flavor:0 "Você acorda revigorado."
 legend_spread_events.8172.b:0 "\"Não! Eu #EMP vou#! viver para sempre!\""
 legend_spread_events.8172.c.flavor:0 "Você decide passar em silêncio."
 legend_spread_events.8172.c:0 "\"Acho que estou pronto agora.\""
 legend_spread_events.8172.desc:0 "Tudo está escuro ao meu redor. À frente, uma única luz está lá ao longe. Como por instinto, caminho por este vazio em direção a esse único ponto de luz, até ser saudado por uma figura solitária vestida toda de branco que se parece com uma versão mais velha de mim mesmo.\n\n[ROOT.Char.GetSheHe|U] sorri para mim com um tipo de calor que apenas um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetMotherFather] pode dar e me convida a sentar ao seu lado. Banhado no calor da presença [ROOT.Char.GetHerHim], sinto uma euforia e paz inexplicáveis.\n\n“Você sabe por que fiz os mortais morrerem, [ROOT.Char.GetFirstNameNoTooltip]? É o que o separa de mim. Você sabe o quão preciosa é a vida. Sua eternidade em [ROOT.Char.GetFaith.PositiveAfterLife] está chegando, mas por agora, há pessoas lá embaixo esperando por você.”"
 legend_spread_events.8172.t:0 "Qual é o Meu Propósito?"
 legend_spread_events.8180.a:0 "[killer.GetNameNoTooltip] é meu inimigo."
 legend_spread_events.8180.b:0 "Devo aprender a perdoar."
 legend_spread_events.8180.desc:0 "Ultimamente tenho sido atormentado por noites sem dormir, lembrando como [dead_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] [dead_parent.GetDeathReason]. Como pode-se acreditar em justiça quando [killer.GetSheHe] vive e [dead_parent.GetFirstNameNoTooltip] deveria morrer?\n\nApenas pensar n[killer.GetSheHe] ainda se exibindo com ar nos pulmões me faz ferver o sangue e eu só quero pôr um fim nisso."
 legend_spread_events.8180.t:0 "Vingança Justa"
 legend_spread_events.8181.a:0 "Justiça enfim."
 legend_spread_events.8181.desc.intro:0 "Finalmente, [killer.GetName] não respira mais e posso suspirar aliviado agora que [killer.GetSheHe] não está mais sujando o mundo com sua presença."
 legend_spread_events.8181.desc.mid.fallback:0 "Eu esperava matar [Select_CString( killer.IsFemale, 'a', 'o' )] [killer.Custom2('InsultNoun', ROOT.Char)] eu mesmo, mas parece que [ROOT.Char.GetFaith.HighGodName] tinha seus próprios planos para [Select_CString( killer.IsFemale, 'a', 'o' )] [killer.Custom2('InsultNoun', ROOT.Char)]."
 legend_spread_events.8181.desc.mid.murder:0 "Entregar [killer.GetSheHe] para [ROOT.Char.GetFaith.NegativeAfterLife] com minhas próprias mãos é uma grande honra."
 legend_spread_events.8181.desc.outro:0 "\n\nSinto que [dead_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] agora finalmente pode descansar em paz, e o mundo está como deveria ser."
 legend_spread_events.8181.t:0 "[Select_CString( killer.IsFemale, 'A', 'O' )] [killer.Custom2('InsultNoun'), ROOT.Char|U] Enterrad[Select_CString( killer.IsFemale, 'a', 'o' )]"
 legend_spread_events.8190.a.crit_lose:0 "[chronicler.GetFirstNameNoTooltip] parece zombar de você"
 legend_spread_events.8190.a.lose:0 "Algo se perdeu na tradução"
 legend_spread_events.8190.a.win:0 "Você convence [chronicler.GetFirstNameNoTooltip]"
 legend_spread_events.8190.a:0 "Eu ousarei!"
 legend_spread_events.8190.b:0 "Não ousarei."
 legend_spread_events.8190.desc:0 "Sentado confortavelmente em meu estudo em uma noite tardia, reconto [legend.GetName] para [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] quando um pensamento me ocorre. Muitas vezes fui chamado de 'excêntrico' por meus pares. Há algo em mim que torna um desafio para os outros construírem uma conexão comigo.\n\nLuto para lembrar muito da minha infância, mas sempre senti uma forte afinidade com o nobre [ROOT.Char.MakeScope.Var('animal_type').GetFlagName], quase como alguém se sentiria pela mãe ou pai. Levanto-me imediatamente, e [chronicler.GetNameNoTooltip] deixa cair seu [chronicler.Custom('WritingInstrument')]. Ousarei fazer tal afirmação? Ousarei dizer que fui criado por um [ROOT.Char.MakeScope.Var('animal_type').GetFlagName]?"
 legend_spread_events.8190.t:0 "O Filho do [ROOT.Char.MakeScope.Var('animal_type').GetFlagName|U]"
