 trait_dysentery_desc:0 "Febre, delírio e dores abdominais severas fizeram com que este personagem... #EMP expulsasse#! sangue nos latrinas."
 trait_ergotism:0 "Fogo Sagrado"
 trait_ergotism_character_desc:0 "O corpo de [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] é afligido por convulsões dolorosas, dores de cabeça, náuseas e diarreia — os espasmos involuntários fazem parecer que [ROOT.GetCharacter.GetSheHe] está dançando."
 trait_ergotism_desc:0 "Este personagem sofre de convulsões dolorosas, dores de cabeça, náuseas e diarreia - os espasmos involuntários fazem com que pareça que estão dançando."
 trait_measles:0 "Sarampo"
 trait_measles_character_desc:0 "A febre prolongada, erupções cutâneas e tosse de [ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] levaram muitas pessoas a equiparar esta doença a uma 'leprazinha'."
 trait_measles_desc:0 "Este personagem sofre de febre prolongada, erupções cutâneas e tosse, levando muitas pessoas a equiparar esta doença a uma 'leprazinha'."
