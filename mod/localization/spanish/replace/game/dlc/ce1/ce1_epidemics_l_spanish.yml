 epidemic_yaksma:0 "Yaksma"
 game_concept_chance_of_infection:0 "Chance de Infecção"
 game_concept_epidemic:0 "Praga"
 game_concept_epidemic_desc:0 "Uma $game_concept_epidemic$ é um surto de uma doença que se espalha pelo mapa, causando tanto efeitos locais quanto infectando personagens em sua área. [baronies|E] afetados têm uma [infection_rate|E] que controla sua gravidade e pode ser combatida melhorando a [epidemic_resistance|E].\n\nUma Praga pode ter diferentes [plague_intensities|E], afetando sua área de efeito, duração e [fatalities|E]."
 game_concept_epidemic_i:0 "@epidemic_icon!"
 game_concept_epidemic_res:0 "Res. à Praga"
 game_concept_epidemic_res_desc:0 "$game_concept_epidemic_resistance_desc$"
 game_concept_epidemic_resistance:0 "Resistência à Praga"
 game_concept_epidemic_resistance_desc:0 "A $game_concept_epidemic_resistance$ reduz a [infection_rate|E] de um [barony|E] ou [county|E], mitigando os efeitos de uma [epidemic|E].\n\nA $game_concept_epidemic_resistance$ pode ser aumentada através de [buildings|E] como $building_type_hospices_01$ ou $building_type_burial_site_01$ #weak ([duchy_building|E])#!, tarefas [court_position_tasks|E] realizadas pelo $court_physician_court_position$, [decisions|E] ou eventos."
 game_concept_epidemics:0 "Pragas"
 game_concept_epidemics_desc:0 "$game_concept_epidemic_desc$"
 game_concept_infection_chance:0 "Chance de Infecção"
 game_concept_infection_chance_desc:0 "Sua $game_concept_infection_chance$ determina quão provável é contrair [diseases|E] de uma [epidemic|E] em curso."
 game_concept_infection_rate:0 "Taxa de Infecção"
 game_concept_infection_rate_desc:0 "[baronies|E] afetados por [epidemics|E] têm uma $game_concept_infection_rate$ que controla sua gravidade e a força de seus efeitos.\n\nA $game_concept_infection_rate$ sempre progredirá em direção ao seu valor máximo se nada for feito para combatê-la. Epidemias Menores, Maiores e Apocalípticas progredirão em diferentes velocidades, marcadas por sua intensidade.\n\nPara mitigar o impacto da Infecção, os [rulers|E] podem melhorar a [epidemic_resistance|E] de seu [realm|E]."
 game_concept_infection_rates:0 "Taxas de Infecção"
 game_concept_infection_rates_desc:0 "$game_concept_infection_rate_desc$"
 game_concept_plague_apocalyptic:0 "Apocalíptica"
