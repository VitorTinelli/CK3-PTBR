 game_concept_plague_intensity:0 "Intensidade da Praga"
 game_concept_plague_intensity_desc:0 "Uma [epidemic|E] pode ser Apocalíptica, Maior ou Menor, afetando sua área de disseminação, a duração e os [characters|E] que são infectados por ela, causando [fatalities|E]."
