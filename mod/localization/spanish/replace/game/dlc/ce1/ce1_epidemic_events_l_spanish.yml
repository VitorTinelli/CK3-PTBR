 disease_desc_short_plague:0 "atormentado por bubões negros"
 disease_desc_short_pneumonic:0 "consumido por tosses"
 disease_desc_short_smallpox:0 "marcado por cicatrizes e erupções"
 disease_desc_short_typhus:0 "atormentado pela febre do acampamento"
 doomsday:0 "o Dia do Juízo Final"
 epidemic_events.0001.a.christian:0 "#EMP [ROOT.Char.Custom('christian_curse')|U].#!"
 epidemic_events.0001.a.toast:0 "A infecção cresce"
 epidemic_events.0001.a:0 "#EMP Maldição.#!"
 epidemic_events.0001.desc:0 "A noite chega. Agarrou-me à mesa de guerra de madeira, fechando os olhos. Suor cai sobre a superfície. Enfraquecido por [disease_scope.GetNameNoTooltip( GetPlayer )|l], [ROOT.Char.Custom('disease_desc_short')]. #EMP O que foi que me tornei?#!\n\nOuço tosses abafadas vindo de fora da tenda. Já é tarde demais para mim — só posso esperar que isso não alcance [Select_CString( dummy_gender.IsFemale, 'minhas', 'meus' )] [dummy_gender.GetWomenMen]."
 epidemic_events.0001.t:0 "Isso Cresce"
 epidemic_events.0110.a:0 "[new_preferred_capital.GetNameNoTierNoTooltip|U] seria uma excelente nova capital."
 epidemic_events.0110.b:0 "Não devemos poupar despesas para reconstruir."
 epidemic_events.0110.c:0 "Não há nada que eu possa fazer."
 epidemic_events.0110.desc.new_capital:0 "\n\nMultidões de sobreviventes já começaram a se mudar para [new_preferred_capital.GetName] como seu novo refúgio, e isso pode se mostrar uma excelente oportunidade para uma nova capital."
 epidemic_events.0110.desc:0 "Finalmente, a peste deixou o reino, e devemos encarar isso como uma oportunidade para nos erguer do caos que ela deixou para trás.\n\nAgora emergimos dos escombros do velho mundo, e chegou o momento de considerar o novo."
 epidemic_events.0110.t:0 "Do Pó"
 epidemic_events.1000.a:0 "Queimem esse lunático!"
 epidemic_events.1000.b:0 "Tenho certeza de que isso é inofensivo."
 epidemic_events.1000.c:0 "Finalmente encontrei [charismatic_priest.GetFaith.HighGodName|U]!"
 epidemic_events.1000.desc:0 "Um sacerdote de olhos selvagens chamad[Select_CString( charismatic_priest.IsFemale, 'a', 'o' )] [charismatic_priest.GetFirstName] prega que [cult_epidemic.GetName] é um castigo divino — e que somente a adoração de [charismatic_priest.GetFaith.HighGodName|U] pode nos salvar. Multidões correm até [charismatic_priest.GetSheHe], movidas pelo fogo e pelo medo.\n\nSe não for contido, esse culto da praga pode derrubar o domínio [ROOT.Char.GetFaith.GetAdjective] em [infected_county.GetName] e além."
 epidemic_events.1000.t:0 "O Culto de [cult_epidemic.GetNameNoTooltip]"
 epidemic_events.1010.a:0 "\"Como ousa!\""
 epidemic_events.1010.b:0 "Talvez [superstitious_courtier.GetSheHe] esteja certo..."
 epidemic_events.1010.c:0 "Preguem todos os caixões do reino!"
 epidemic_events.1010.desc:0 "[epidemic_scope.GetName|U] ronda minhas terras — e agora [Select_CString( superstitious_courtier.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('superstitious_courtier'))], [superstitious_courtier.GetFirstName], sussurra algo pior.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U],\" [superstitious_courtier.GetSheHe] suplica, \"seu amor [Select_CString( dead_lover.IsFemale, 'pela', 'pelo' )] [dead_lover.GetFirstName] é conhecido. Mas a praga cavalga com os mortos. Precisamos selar o caixão [dead_lover.GetHerHim] — pregá-lo — antes que [dead_lover.GetSheHe] se levante e espalhe a maldição.\""
 epidemic_events.1010.t:0 "Um Retorno Romântico"
 epidemic_events.1020.a:0 "Vale a tentativa."
 epidemic_events.1020.b:0 "Que desperdício de ouro."
 epidemic_events.1020.desc:0 "O comércio secou em [epidemic_county.GetNameNoTier]. [miasma_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] culpa o miasma da morte — e propõe uma cura estranha.\n\n\"Se plantarmos um campo de [epidemic_province.Custom('get_region_flower_type_plural')] doces, o ar perfumado poderá expulsar a praga.\"\n\nEstranho. Mas talvez não mais estranho do que a própria praga."
 epidemic_events.1020.t:0 "Ar Ruim Sobre [epidemic_county.GetNameNoTierNoTooltip|U]"
 epidemic_events.1030.a.failure:0 "As sanguessugas são prejudiciais"
 epidemic_events.1030.a.success:0 "As sanguessugas se mostram eficazes"
 epidemic_events.1030.a:0 "Distribuam sanguessugas para todos!"
 epidemic_events.1030.b:0 "Vamos seguir os ensinamentos estabelecidos."
 epidemic_events.1030.desc:0 "[leeched_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] irrompe, olhos selvagens, agarrando um saco de sanguessugas.\n\n\"Sanguessugas são a única forma de parar [epidemic_scope.GetName]!\" [leeched_courtier.GetSheHe] grita.\n\nA tradição diz que só devem ser usadas sob cuidado especializado — mas estes são tempos desesperadores. Podemos realmente esperar?"
 epidemic_events.1030.t:0 "Sanguessugas!"
 epidemic_events.1040.a:0 "Precisamos parar essa perversão!"
 epidemic_events.1040.b:0 "Eles só estão machucando a si mesmos."
 epidemic_events.1040.c:0 "Se eles falam a verdade, então eu também me flagelarei!"
 epidemic_events.1040.desc.intro:0 "À medida que [epidemic_scope.GetName|U] se espalha, fanáticos surgem — se flagelando nas ruas, alegando que isso traz misericórdia divina.\n\n"
 epidemic_events.1040.desc.mid.approves:0 "[Select_CString( chaplain.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))], [chaplain.GetFirstName], se aproxima, olhos brilhando. \"[Select_CString( ROOT.Char.IsFemale, 'Minha senhora', 'Meu senhor' )] — isso é penitência divina feita carne. Precisamos abençoar sua causa!\""
 epidemic_events.1040.desc.mid:0 "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está furioso. \"Isso é heresia — depravada e perigosa! Você deve denunciá-la.\"\n\nAs multidões gritam mais alto."
 epidemic_events.1040.t:0 "Culto Flagelante"
 epidemic_events.1050.a:0 "Arranquem-nos pela raiz!"
 epidemic_events.1050.b.tt.failure:0 "O povo não se convence"
 epidemic_events.1050.b.tt.success:0 "O medo do apocalipse é dissuadido"
 epidemic_events.1050.b:0 "Enviem teólogos para debatê-los!"
 epidemic_events.1050.c:0 "Talvez eles estejam certos..."
 epidemic_events.1050.desc:0 "Encontro [Select_CString( chaplain.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('chaplain'))|U], [chaplain.GetFirstName], andando de um lado para o outro do lado de fora, pálido e abalado. \"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U] — hereges gritam que [epidemic_scope.GetName] é a ira de [ROOT.Char.GetFaith.HighGodNamePossessive], que o fim está próximo!\"\n\nViolência. Pânico. Fanáticos pregando a perdição nas ruas.\n\n\"Precisamos agir. Ou a loucura deles devorará o pouco de ordem que resta.\""
 epidemic_events.1050.t:0 "O Dia do Juízo"
 epidemic_events.1060.a:0 "Não há nada que eu possa fazer."
 epidemic_events.1060.b:0 "Façam-nos parar imediatamente!"
 epidemic_events.1060.c:0 "Talvez nossa resposta esteja no [ROOT.Char.GetFaith.ReligiousText|U]."
 epidemic_events.1060.desc.intro:0 "À medida que [epidemic_scope.GetName] se espalha, o medo dá origem à loucura.\n\n"
 epidemic_events.1060.desc.mid.cats:0 "Sussurros afirmam que gatos trazem a praga — familiares amaldiçoados em peles lustrosas. Aldeões os afogam em poços ou os queimam em cestos. Onde antes caçavam pragas, agora são caçados."
 epidemic_events.1060.desc.mid.dogs:0 "Camponeses agora afirmam que cães carregam a praga — que seus olhos brilham com luz amaldiçoada. Matilhas estão sendo caçadas e julgadas em falsos tribunais, até queimadas."
 epidemic_events.1060.desc.mid.faith:0 "Os [faith_to_blame.GetAdherentNamePlural] — tolerados por tanto tempo — agora são vistos como uma maldição. \"Eles irritaram os céus\", dizem os camponeses, \"e agora sofremos por isso.\" Seus templos são profanados. Suas orações, usadas contra eles."
 epidemic_events.1060.desc.mid.trait:0 "Qualquer um que demonstre desejos proibidos, costumes estranhos ou vícios rejeitados é capturado. Um punho mole, uma piada lasciva, uma acusação velada — o suficiente para condenar."
 epidemic_events.1060.desc.mid2.sin:0 "Acreditam que nos tornamos excessivamente [sinful_trait.GetName(ROOT.Char)] e que somente por meio de arrependimento em massa e punição severa podemos voltar a viver como [ROOT.Char.GetFaith.HighGodName] pretende."
 epidemic_events.1060.desc.mid2.witches:0 "Dizem que bruxas amaldiçoaram a terra — parteiras, mulheres sábias, excluídas. Acusadas por vizinhos, arrastadas de suas casas, condenadas sem julgamento além de um grito."
 epidemic_events.1060.desc.outro:0 "\n\n[ROOT.Char.GetFaith.PriestNeuterPlural|U] condenam a prática. Mas os assassinatos continuam."
 epidemic_events.1060.t:0 "$story_plague_trials_title$ Portadores da Pestilência"
 epidemic_events.1061.a.failure:0 "Queimar animais de alguma forma aumenta as infecções"
 epidemic_events.1061.a.success:0 "Queimar animais não tem efeito"
 epidemic_events.1061.a:0 "Acho que não há nada que eu possa fazer."
 epidemic_events.1061.b:0 "Isso precisa parar!"
 epidemic_events.1061.c:0 "Machucar esses animais deve se tornar um crime."
 epidemic_events.1061.desc.intro:0 "Acordo com o céu brilhando em laranja e fumaça sufocando o ar. Teriam os camponeses incendiado a cidade?\n\n"
 epidemic_events.1061.desc.mid.cats:0 "Não — são os gatos. [chaplain.GetTitledFirstName] me informa que estão sendo queimados vivos para afastar [epidemic_scope.GetName]."
 epidemic_events.1061.desc.mid.dogs:0 "Não — são os cães. [chaplain.GetTitledFirstName] me informa que estão sendo queimados vivos para afastar [epidemic_scope.GetName]."
 epidemic_events.1061.desc.outro:0 "\n\n\"Um espetáculo horrendo\", [chaplain.GetSheHe] murmura. \"Mas bem popular.\""
 epidemic_events.1061.t:0 "$story_plague_trials_title$ Pira de Estimação"
 epidemic_events.1062.a.failure:0 "A praga piora"
 epidemic_events.1062.a.no_effect:0 "Matar os animais não tem efeito"
 epidemic_events.1062.a.success:0 "A praga diminui"
 epidemic_events.1062.a:0 "Matem todos."
 epidemic_events.1062.b.failure:0 "A capital é tomada por animais raivosos"
 epidemic_events.1062.b.no_effect:0 "Isso não tem efeito"
 epidemic_events.1062.b:0 "Tragam-nos vivos para a capital."
 epidemic_events.1062.desc.intro:0 "Um grupo de caçadores ilegais irrompe em meu [ROOT.Char.Custom('GetCourt')], cheirando a suor e fumaça.\n\n"
 epidemic_events.1062.desc.mid.cats:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha senhora', 'Meu senhor' )], são os gatos. Criaturas escorregadias — olhos demais, nunca dormem. O povo diz que trazem a praga com seu ronronar.\""
 epidemic_events.1062.desc.mid.dogs:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], os cães estão amaldiçoados. Todo mundo sabe disso. Deixe-nos terminar a purga — cada criatura, cada vira-lata, até que a praga acabe.\""
 epidemic_events.1062.desc.outro:0 "\n\nEles aguardam, sorrindo, pela sua bênção — sangue já em suas botas."
 epidemic_events.1062.t:0 "$story_plague_trials_title$ Caçadores"
 epidemic_events.1063.a:0 "Eu me arrependo!"
 epidemic_events.1063.b:0 "Asneiras."
 epidemic_events.1063.c.failure:0 "Você se envergonha"
 epidemic_events.1063.c.success:0 "Você dissuade o pregador"
 epidemic_events.1063.c:0 "Certamente posso debater um pregador de rua."
 epidemic_events.1063.desc.intro:0 "Uma multidão se reuniu perto do centro de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip|U], o pânico denso no ar. Sobre o tumulto, a voz de um pregador solitário ecoa — áspera, insistente e estranhamente mais alta que todas as outras.\n\n\"Arrependei-vos! Arrependei-vos!\""
 epidemic_events.1063.desc.mid.cats:0 "Culpar esta praga em uma criatura tão miserável e patética quanto um gato é absurdo!"
 epidemic_events.1063.desc.mid.dogs:0 "Culpar esta praga em cães simplórios é um disparate!"
 epidemic_events.1063.desc.mid.faith:0 "Esta praga não foi feita pelos [faith_blamed.GetAdjective]!"
 epidemic_events.1063.desc.mid.sin:0 "Esta praga é um castigo de [ROOT.Char.GetFaith.HighGodName|U] por nossa fraqueza e tendência a ser [trait_blamed.GetName(ROOT.Char)]."
 epidemic_events.1063.desc.mid.witch:0 "Não são bruxas que devemos culpar — mas nós mesmos!"
 epidemic_events.1063.desc.outro:0 "Somente buscando ser [virtuous_trait.GetName(ROOT.Char)] podemos sequer esperar pelo fim da praga.\n\nA multidão murmura em aprovação. Na verdade, parte de mim se pergunta se estão certos. Meu pecado é profundo, mais do que eu admitiria em voz alta. E se esta praga é julgamento... então talvez comece comigo."
 epidemic_events.1063.t:0 "$story_plague_trials_title$ Arrependei-vos!"
 epidemic_events.1064.a:0 "Envie os oficiais para [witch_trial_county.GetNameNoTierNoTooltip]. Isso termina lá."
 epidemic_events.1064.b:0 "Os julgamentos devem acabar!"
 epidemic_events.1064.c.failure:0 "Os julgamentos continuam"
 epidemic_events.1064.c.success:0 "Sua mensagem é convincente"
 epidemic_events.1064.c:0 "Precisamos pregar contra essa prática."
 epidemic_events.1064.desc.intro:0 "Apesar dos meus esforços para conter a superstição, julgamentos de bruxas inflamaram-se pelo reino, e nenhum tão feroz quanto em [witch_trial_county.GetNameNoTier]. Ali, [epidemic_scope.GetName] transformou medo em fúria.\n\n"
 epidemic_events.1064.desc.mid.sin:0 "Aqueles que afogam inocentes, queimam os doentes — tudo em nome de expulsar os [trait_blamed.GetName(ROOT.Char)] dentre nós. Cada pira deixa minhas terras mais pobres e mais assustadas."
 epidemic_events.1064.desc.mid.witch:0 "Eles afogam inocentes, queimam os doentes — tudo em nome da pureza. Cada pira deixa minhas terras mais pobres e mais aterrorizadas."
 epidemic_events.1064.desc.outro:0 "\n\nSe isso é justiça, não serve nem a [ROOT.Char.GetFaith.HighGodName|U] nem à coroa."
 epidemic_events.1064.t:0 "$story_plague_trials_title$ Piras da Pureza"
 epidemic_events.1065.a:0 "Dê a eles o que querem."
 epidemic_events.1065.b:0 "Eu me recuso!"
 epidemic_events.1065.c:0 "Irei no lugar [shamed_buddy.GetHerHim]."
 epidemic_events.1065.desc.intro:0 "A praga do medo agora alcança minha própria casa.\n\nPregadores voltaram a multidão contra [shamed_buddy.Custom2('MyCharacterIntroduction', ROOT.Char)]. Eles acusam [shamed_buddy.GetSheHe] de "
 epidemic_events.1065.desc.mid.sin:0 "ser [trait_blamed.GetName(shamed_buddy)],"
 epidemic_events.1065.desc.mid.witch:0 "bruxaria,"
 epidemic_events.1065.desc.outro:0 "de conspiração com [ROOT.Char.GetFaith.EvilGodNames], de pecado em seda. Agora exigem a punição pública [shamed_buddy.GetHerHim] — arrastad[Select_CString( shamed_buddy.IsFemale, 'a', 'o' )] de seus salões e forçad[Select_CString( shamed_buddy.IsFemale, 'a', 'o' )] a se arrepender.\n\nRecusá-los arrisca revolta. Ceder envergonha a coroa."
 epidemic_events.1065.t:0 "$story_plague_trials_title$ Vergonha"
 epidemic_events.1066.a:0 "Esse comportamento deve ser punido."
 epidemic_events.1066.b:0 "Isso está além do meu controle."
 epidemic_events.1066.c:0 "Posso oferecer refúgio na capital."
 epidemic_events.1066.desc:0 "Nenhuma palavra convence o campesinato — eles culpam os [faith_blamed.GetAdherentNamePlural] por [epidemic_scope.GetName]. Seus comerciantes são hostilizados, suas casas profanadas. Muitos fugiram, e o comércio secou.\n\nPior ainda, em algumas aldeias, estão sendo caçados.\n\nSe essa perseguição continuar, meu reino pode sangrar até a morte — não pela praga, mas pelo medo."
 epidemic_events.1066.t:0 "$story_plague_trials_title$ Expulsão"
 epidemic_events.1067.a:0 "Eles são bem-vindos aqui."
 epidemic_events.1067.b:0 "Não podemos abrir os portões para a praga."
 epidemic_events.1067.c:0 "Ofereça refúgio na capital."
 epidemic_events.1067.desc:0 "Enquanto [epidemic_scope.GetName] devasta o reino de [bigoted_ruler_that_everyone_hates.GetNamePossessive], o campesinato de lá insiste em culpar os [faith_blamed.GetAdherentNamePlural]. O problema se espalhou tanto que muitos começaram a fugir de [bigoted_ruler_that_everyone_hates.GetPrimaryTitle.GetNameNoTierNoTooltip|U] e estão vindo para minhas terras."
 epidemic_events.1067.t:0 "[faith_blamed.GetAdjectiveNoTooltip|U] Afluência da Praga"
 epidemic_events.1068.a:0 "[loneless_vassal.GetPrimaryTitle.GetNameNoTierNoTooltip|U] será um lugar seguro para todos."
 epidemic_events.1068.b:0 "Posso lhe oferecer um empréstimo."
 epidemic_events.1068.c:0 "Isso é lamentável."
 epidemic_events.1068.desc:0 "As caçadas às bruxas que culpam os [faith_blamed.GetAdherentNamePlural] por [epidemic_scope.GetName] sufocaram o comércio em todo o reino.\n\n[loneless_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] entra na corte cambaleando, parecendo um mendigo. \"A perseguição expulsou os credores, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U]. O medo da infecção — e da turba — silencia cada moeda. A usura desapareceu. Meus cofres estão vazios. Os seus podem ser os próximos.\""
 epidemic_events.1068.t:0 "$story_plague_trials_title$ Emprestos"
 epidemic_events.1100.a.already_has_it:0 "Receio que seja tarde demais..."
 epidemic_events.1100.a.brave:0 "Já sobrevivi a pior."
 epidemic_events.1100.a.callous:0 "Bem, não há nada que eu possa fazer."
 epidemic_events.1100.a.cannibal:0 "Que desperdício de boa carne."
 epidemic_events.1100.a.compassionate:0 "Coitados desses camponeses doentes..."
 epidemic_events.1100.a.diligent:0 "Vou ficar atento."
 epidemic_events.1100.a.eccentric:0 "Não posso simplesmente esperar isso passar em um barco?"
 epidemic_events.1100.a.paranoid:0 "Eu #EMP nunca#! vou sair do meu quarto!"
 epidemic_events.1100.a.zealous:0 "[ROOT.Char.GetFaith.HealthGodName|U] nos proteja."
 epidemic_events.1100.a:0 "Alguém deveria fazer algo."
 epidemic_events.1100.b:0 "Chamem o médico!"
 epidemic_events.1100.c:0 "Chamem um médico!"
 epidemic_events.1100.desc.intro.apocalyptic:0 "As ruas de [infected_county.GetNameNoTier] tornaram-se silenciosas. [ROOT.Char.GetFaith.DeathDeityName|U] lançou sua praga sobre"
 epidemic_events.1100.desc.intro.fallback:0 "Um passeio por [infected_county.GetNameNoTier] revela algo profundamente desagradável. Uma praga chegou a"
 epidemic_events.1100.desc.intro.major:0 "Caminhar por [infected_county.GetNameNoTier] é ouvir uma sinfonia terrível de sofrimento humano. A pestilência chegou a"
 epidemic_events.1100.desc.intro2.backwater:0 "esta modesta aldeia.\n\n"
 epidemic_events.1100.desc.intro2.cool_place:0 "esta metrópole outrora próspera.\n\n"
 epidemic_events.1100.desc.intro2.holy_site:0 "este lugar tão sagrado.\n\n"
 epidemic_events.1100.desc.mid.bubonic_plague:0 "Bubões negros e purulentos cobrem a pele dos infectados, cheios de um líquido fétido que libera mau ar quando estourado.\n\n"
 epidemic_events.1100.desc.mid.consumption:0 "Por onde se anda, é impossível escapar do som incessante dos acessos de tosse dos infectados, com sangue coagulado tingindo suas roupas de carmesim profundo.\n\n"
 epidemic_events.1100.desc.mid.dysentery:0 "Quando se olha nos olhos dos infectados, eles parecem ocos e vazios, como se o espírito estivesse em outro lugar. Suas roupas estão manchadas de vermelho profundo na parte traseira, e eles seguram o estômago como se tentassem impedir que caísse para fora.\n\n"
 epidemic_events.1100.desc.mid.ergotism:0 "Os infectados frequentemente se contorcem em danças profanas em intervalos aleatórios, entre gemidos sem sentido e sujeira espalhada pelas ruas.\n\n"
 epidemic_events.1100.desc.mid.fallback:0 "A população é assolada por maus humores de todos os tipos, resultando em sintomas inúmeros demais para nomear.\n\n"
 epidemic_events.1100.desc.mid.measles:0 "A pele irregular dos doentes está intensamente vermelha e dolorida ao toque. Eles suam mesmo no frio, e seus olhos têm o olhar perdido de um leproso.\n\n"
 epidemic_events.1100.desc.mid.smallpox:0 "A pele dos infectados está profundamente vermelha e coberta de nódulos e protuberâncias. Incontáveis cicatrizes recentes marcam a pele devido à coceira incessante, e seus olhos desesperados estão vermelhos e inflamados.\n\n"
 epidemic_events.1100.desc.mid.typhus:0 "Os infectados estão cobertos da cabeça aos pés por erupções quentes ao toque.\n\n"
 epidemic_events.1100.desc.mid2.apocalyptic:0 "Não há praticamente uma alma na cidade que não tenha sido atingida por essa doença terrível, e ela continua avançando rapidamente em direção à nobreza."
 epidemic_events.1100.desc.mid2.fallback:0 "Embora os números ainda sejam baixos, é apenas questão de tempo até que se espalhe mais."
 epidemic_events.1100.desc.mid2.major:0 "Pelo menos metade da população camponesa foi infectada, e é apenas uma questão de tempo até que se espalhe à nobreza."
 epidemic_events.1100.desc.outro.capital:0 "Já chamam essa aflição de \"[epidemic.GetName]\", e isso está acontecendo bem diante de minhas portas."
 epidemic_events.1100.desc.outro:0 "Já chamam essa aflição de \"[epidemic.GetName]\"."
 epidemic_events.1100.t:0 "Uma Sombra Sobre [infected_county.GetNameNoTierNoTooltip|U]"
 epidemic_events.1110.a:0 "Muito bem."
 epidemic_events.1110.b:0 "Esse local é apenas para mim e os meus."
 epidemic_events.1110.desc:0 "[chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chega com o rosto pálido.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord], os mortos apodrecem nas ruas. Não conseguimos enterrá-los rápido o bastante — o miasma está denso. Precisamos abrir o [GetBuilding('burial_site_01').GetName] em [graveyard_county.GetName].\"\n\n[chaplain.GetSheHe|U] não pede permissão. [chaplain.GetSheHe|U] implora."
 epidemic_events.1110.t:0 "Corpos nas Ruas"
 epidemic_events.1120.a:0 "Carreguem os corpos!"
 epidemic_events.1120.b:0 "Isso é obsceno!"
 epidemic_events.1120.desc:0 "Ao adentrar [flung_corpse_location.GetName], uma ideia demoníaca cruza minha mente. Alguns soldados jazem à beira da morte com [epidemic_scope.GetName] e logo deixarão este mundo. No entanto, é possível que ainda me sirvam nesta guerra, mesmo após a morte.\n\nO miasma dos corpos certamente fará mais soldados adoecerem, a menos que descartemos os cadáveres de alguma forma. Talvez possamos trazer [corpse_flingee.GetName] aos pés — enviando a [corpse_flingee.GetSheHe] um presente via catapulta..."
 epidemic_events.1120.t:0 "Um Presente Horrendo"
 epidemic_events.1121.a:0 "Joguem de volta!"
 epidemic_events.1121.b.failure:0 "A quarentena falha"
 epidemic_events.1121.b.success:0 "A quarentena é bem-sucedida"
 epidemic_events.1121.b:0 "Quarentenem o corpo e limpem este lugar!"
 epidemic_events.1121.c:0 "Apenas mantenham isso longe de mim!"
 epidemic_events.1121.desc:0 "As forças de [corpse_flinger.GetNamePossessive] entraram em minhas terras e parecem ter parado do lado de fora do meu domínio — talvez seja o início de um cerco.\n\nLogo após sua chegada, ouço um estrondo repentino e um som úmido vindo lá de fora. Corro para ver o que pode ter causado um som tão sobrenatural — e o que vejo me deixa gelado.\n\nOs restos mutilados de um cadáver jazem em uma poça de carne e osso, como uma exibição macabra em um açougue. O corpo está evidentemente tomado por alguma doença estrangeira, e se nada for feito, certamente haverá um surto."
 epidemic_events.1121.t:0 "Um Presente do Alto"
 epidemic_events.1122.a:0 "Está amassado demais para mover agora."
 epidemic_events.1122.b.failure:0 "$plague_still_infects_tt$"
 epidemic_events.1122.b.success:0 "Você arremessa o ‘corpo’ de volta"
 epidemic_events.1122.b:0 "Recolham o que sobrou e tentem novamente!"
 epidemic_events.1122.desc:0 "Um leve assobio preenche o ar quando algo surge além dos muros de [flung_corpse_location.GetName]. O assobio fica mais alto até que, de repente, o objeto aterrissa com um baque no meio do acampamento.\n\nSangue, ossos e dentes jazem em uma cratera, mal conectados à massa irreconhecível de carne a que um dia pertenceram. Ao que parece, nosso ‘presente’ encontrou o caminho de volta."
 epidemic_events.1122.t:0 "Um Presente Devolvido"
 epidemic_events.1123.a:0 "Absolutamente horrível."
 epidemic_events.1123.desc:0 "Ouço o suave tamborilar da chuva na minha janela. Estranho um pouco, pois o céu estava limpo na última vez que tive tempo de olhar, então espio lá fora — e o céu continua azul.\n\nEstendo minha mão para fora e fico perturbado ao ver sangue marrom-escuro encharcar meus dedos. Por toda parte, minhas terras estão sendo inundadas pela substância pútrida, com ocasionais baques pesados de pedaços de carne. Os corpos evidentemente foram lançados novamente, mas agora estão tão castigados por essa provação que se reduziram a nada além de uma papa de sangue e vísceras."
 epidemic_events.1123.t:0 "Chuva de Carne"
 epidemic_events.2001.a:0 "Pagarei de bom grado para acabar com essa tolice."
 epidemic_events.2001.b.desc:0 "Guardas! #EMP Com cuidado#! prendam [pleading_vassal.GetFirstNameNoTooltip] e então #EMP com ainda mais cuidado#! lavem tudo o que [pleading_vassal.GetSheHe] tocou!"
 epidemic_events.2001.b:0 "Como ousa trazer [epidemic_scope.GetNameNoTooltip] até #EMP minha#! porta!"
 epidemic_events.2001.c.failure:0 "[vassal_war.GetName] continua"
 epidemic_events.2001.c.success:0 "[attacking_vassal.GetFirstNameNoTooltip] foi convencid[Select_CString( attacking_vassal.IsFemale, 'a', 'o' )] a encerrar [vassal_war.GetName]"
 epidemic_events.2001.c:0 "[attacking_vassal.GetTitledFirstNameNoTooltip] pode ser convencid[Select_CString( attacking_vassal.IsFemale, 'a', 'o' )]."
 epidemic_events.2001.danger:0 "#color_red Se a guerra não for resolvida rapidamente, pode haver um preço a pagar...#!"
 epidemic_events.2001.desc:0 "[pleading_vassal.GetName|U] cai de joelhos, tremendo.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha senhora', 'Meu senhor' )], sou assolado por duas pragas. [epidemic_scope.GetName|U] devora meu povo. E agora [attacking_vassal.GetName] vem por minhas terras. Não posso lutar contra ambos.\"\n\n[pleading_vassal.GetSheHe|U] deposita um pequeno cofre de ouro — tudo que [pleading_vassal.GetSheHe] pôde trazer.\n\n\"Imploro. Ajude-me a acabar com esta guerra antes que nenhum dos reinos sobreviva.\""
 epidemic_events.2001.epidemic_spread.t:0 "[pleading_vassal.GetFirstNameNoTooltip] espalhou [epidemic_scope.GetName]!"
 epidemic_events.2001.t:0 "A Praga da Guerra"
 epidemic_events.2002.a:0 "Oh céus."
 epidemic_events.2002.desc:0 "Enquanto [vassal_war.GetName|U] se arrasta, homens morrem por terra — e a terra os devolve em montes.\n\nAgora [epidemic_scope.GetName] se espalha mais rápido — alimentada por cadáveres apodrecidos, aldeias vazias e a loucura dos cercos. Nenhum lado está vencendo. Todos estão morrendo."
 epidemic_events.2002.t:0 "A Praga da Guerra: Consequências"
 epidemic_events.2003.a.flavor:0 "Bons soldados sempre encontram ouro, mas ouro raramente encontra bons soldados."
 epidemic_events.2003.a:0 "Nada pode ser feito — deixem que morram."
 epidemic_events.2003.b.flavor:0 "Massas mal lavadas às vezes podem substituir guerreiros habilidosos — se não olharmos muito de perto."
 epidemic_events.2003.b:0 "Arrastem camponeses dos campos, se for preciso."
 epidemic_events.2003.c.flavor:0 "Sem seus exercícios diários meus soldados serão menos eficientes, mas ao menos talvez permaneçam vivos."
 epidemic_events.2003.c:0 "Fechem os quartéis. Melhor ociosos que mortos."
 epidemic_events.2003.desc:0 "\"Nossos soldados caem sem lutar. [epidemic_scope.GetName|U] tomou mais vidas do que qualquer lâmina.\"\n\n[marshal.GetName] fala asperamente, mas está certo. De [first_epidemic_province.GetName] a [second_epidemic_province.GetName], os quartéis estão vazios. Não restam guerreiros — apenas camponeses e praga."
 epidemic_events.2003.t:0 "Inimigo Invisível"
 epidemic_events.2005.a.failure:0 "[physician.GetFirstName] permanece irredutível."
 epidemic_events.2005.a.success:0 "[physician.GetFirstName] entrega o jarro."
 epidemic_events.2005.a:0 "Não deveria eu ser o protegido?"
 epidemic_events.2005.b.failure:0 "O jarro se quebra!"
 epidemic_events.2005.b.success:0 "Você arranca [medicine_jar.GetName] das mãos de [physician.GetFirstName]"
 epidemic_events.2005.b:0 "Ele salva vidas? Então vou levá-lo."
 epidemic_events.2005.c:0 "Se isso lhe conforta, fique com ele."
 epidemic_events.2005.desc:0 "Passo diante do estúdio de [physician.GetNamePossessive] diariamente, com o medo de [epidemic_scope.GetName] sempre à espreita. As ferramentas estranhas [physician.GetHerHim] geralmente não trazem conforto — ainda assim, hoje, um jarro pintado chama minha atenção.\n\n\"Ele me protege\", diz [physician.GetSheHe], segurando-o com carinho. \"Uma maravilha de artesanato, e um escudo contra a doença.\""
 epidemic_events.2005.t:0 "Jarro Medicinal"
 epidemic_events.2006.a:0 "Dançar sem repouso? #EMP Excelente!#!"
 epidemic_events.2006.b:0 "Toda dança termina eventualmente. #EMP Certo?#!"
 epidemic_events.2006.c:0 "Peguem cordas e amarrem [dance_victim.GetSheHe]!"
 epidemic_events.2006.d:0 "Pelo [ROOT.Char.GetFaith.HighGodName], eu te expulsarei, demônio!"
 epidemic_events.2006.desc:0 "Um camponês se contorce em meu pátio, os pés batendo na terra em um ritmo incessante e enlouquecedor.\n\n\"Perdoe [dance_victim.GetSheHe], [Select_CString( ROOT.Char.IsFemale, 'minha senhora', 'meu senhor' )]\", diz um observador. \"[dance_victim.GetFirstName] tem dançado por dias sem descanso — outros até se juntaram a [dance_victim.GetSheHe]! [dance_victim.GetSheHe|U] não para.\"\n\nA mulher geme, o rosto [dance_victim.GetHerHim] se contorcendo entre dor e alegria. Loucura, ou algo pior, toma conta [dance_victim.GetHerHim]."
 epidemic_events.2006.t:0 "Mania da Dança"
 epidemic_events.3000.a:0 "\"Não posso fechar os olhos para isso.\""
 epidemic_events.3000.b.sick:0 "[companion.GetShortUIName] adoece"
 epidemic_events.3000.b:0 "\"[companion.GetFirstNameNoTooltip], você pode ajudá-los.\""
 epidemic_events.3000.c:0 "\"Não temos tempo para isso.\""
 epidemic_events.3000.desc:0 "O vermelho é a única cor presente em [epidemic_location.GetName]. Tosse, o único som. Incentivamos nossas montarias a seguir adiante, mas vejo [companion.GetTitledFirstName] pálid[Select_CString( companion.IsFemale, 'a', 'o' )], os lábios tão tensos que perderam toda a cor.\n\n\"Ajuda...\" um dos corpos que tomamos por cadáveres se move lentamente, dolorosamente, seu corpo [sick_peasant.Custom('disease_desc_short')]."
 epidemic_events.3000.t:0 "$travel_danger_prefix$ Sangue na Porta"
 epidemic_events.3010.a:0 "Li algo sobre água contaminada..."
 epidemic_events.3010.b.sick:0 "Você adoece"
 epidemic_events.3010.b:0 "Água! #EMP Finalmente!#!"
 epidemic_events.3010.c:0 "Precisamos seguir em frente."
 epidemic_events.3010.desc:0 "Nossas reservas de água estão acabando quando entramos em [epidemic_location.GetName]. A vila, aparentemente abandonada, possui um belo poço bem no centro, e conduzimos nossas montarias até lá.\n\nLogo, o motivo do abandono se torna evidente.\n\nCorpos jazem no chão, [sick_peasant.Custom('disease_desc_short')], e aves de carniça circulam sobre suas cabeças pálidas. Uma visão sombria."
 epidemic_events.3010.t:0 "$travel_danger_prefix$ Carniça"
 epidemic_events.5000.a:0 "Sabe, aqueles ratos parecem sujos o bastante..."
 epidemic_events.5000.b:0 "Gatos vão #EMP para todo lugar#!. Devem ser os culpados."
 epidemic_events.5000.c:0 "Cães estão sempre cobertos de sujeira. Livrem-se deles!"
 epidemic_events.5000.d:0 "Devemos abater as ovelhas."
 epidemic_events.5000.desc:0 "Mais um relatório sombrio vindo de [infected_county.GetName].\n\n[church_person.Custom2('MyCharacterIntroduction', ROOT.Char)|U] o entrega. \"O povo exige ação!\" [church_person.GetSheHe|U] gesticula furiosamente. \"Expulsem as bestas — elas espalham [epidemic.GetName]! [ROOT.Char.GetFaith.HighGodName] assim o quer!\"\n\nDou uma olhada no pergaminho. Os olhos [church_person.GetHerHim] brilham de convicção. Os meus... de dúvida."
 epidemic_events.5000.e:0 "Não há necessidade."
 epidemic_events.5000.t:0 "Faça Alguma Coisa!"
 epidemic_events.5001.a:0 "\"Fechem tudo! Fechem #EMP tudo#!\""
 epidemic_events.5001.b:0 "Confio naqueles responsáveis por [epidemic_county.GetName]."
 epidemic_events.5001.c:0 "\"Você não acha que já tenho preocupações o bastante, [Select_CString( courtier.IsFemale, 'sua', 'seu' )] [courtier.Custom2('InsultNoun', ROOT.Char)]?!\""
 epidemic_events.5001.d:0 "Melhor enviar ajuda enquanto o problema ainda está começando."
 epidemic_events.5001.desc:0 "[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] irrompe, olhos arregalados, os braços cheios de [ROOT.Char.Custom('GetWritingMaterial')].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')] — [epidemic_county.GetNameNoTier] está afogando-se em cadáveres! Ruas sufocadas pela morte!\" [courtier.GetSheHe|U] despeja as cartas. Eu folheio a bagunça frenética.\n\nA última notícia que tive era de que [epidemic_scope.GetName] estava sob controle..."
 epidemic_events.5001.e:0 "Eles terão que se virar."
 epidemic_events.5001.t:0 "Tranque as Portas!"
 epidemic_events.5002.a.tt:0 "Talvez possamos fazer deste navio #EMP o problema de outra pessoa#!..."
 epidemic_events.5002.a:0 "Em que direção essa água corre, eu me pergunto?"
 epidemic_events.5002.b.criticalfailure:0 "O barco afunda, e os corpos voltam à costa"
 epidemic_events.5002.b.failure:0 "O barco encalha novamente após alguns dias"
 epidemic_events.5002.b.success:0 "O barco nunca mais é visto"
 epidemic_events.5002.b:0 "\"Carreguem-no e deixem-no à deriva.\""
 epidemic_events.5002.c:0 "Eles merecem ritos funerários adequados."
 epidemic_events.5002.d:0 "Bem, pelo menos o barco parece navegável..."
 epidemic_events.5002.desc:0 "Enquanto caminhamos juntos, [steward.GetFirstName] me faz um discurso sombrio sobre a epidemia que se espalha por [coastal_province.GetName]. Ao longe, vemos corpos empilhados à beira da praia, um barco abandonado encalhado perto deles. Ao olhar de volta para [steward.GetFirstNameNoTooltip], percebo um olhar curioso surgindo em seu rosto.\n\n\"E se, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [steward.GetSheHe] começa, \"e se simplesmente fizéssemos esses corpos deixarem de ser um problema?\"\n\nBrevemente confuso, começo aos poucos a entender o plano. O barco foi abandonado, afinal, e aqueles corpos precisam ser descartados de um jeito ou de outro..."
 epidemic_events.5002.t:0 "O Silêncio da Costa"
 epidemic_events.5003.a:0 "\"Guardas, tirem essa #EMP coisa#! de perto de mim!\""
 epidemic_events.5003.b.criticalsuccess:0 "A criança é milagrosamente curada"
 epidemic_events.5003.b.failure:0 "A criança piora"
 epidemic_events.5003.b.success:0 "A infecção permanece, mas eles parecem mais felizes"
 epidemic_events.5003.b.tt:0 "O povo acreditar que o toque real cura tem seus benefícios e seus perigos..."
 epidemic_events.5003.b:0 "Bem, duvido que isso ajude, mas..."
 epidemic_events.5003.c:0 "Continuem andando."
 epidemic_events.5003.desc:0 "Lama e miséria grudam nas ruas de [location.GetName] — e no camponês que se lança diante do meu cavalo, segurando uma criança frágil.\n\n\"Meu [ROOT.Char.Custom('FormOfAddressForLiege')], por favor\", [peasant.GetSheHe] implora. \"[child.GetSheHe|U] está tão doente. Mas seu toque real poderia curar [child.GetSheHe]...\"\n\nA chuva martela. A criança cambaleia."
 epidemic_events.5003.t:0 "Mãos Curadoras"
 epidemic_events.5004.a.new_courtiers:0 "Todos os novos cortezãos ganham #positive_value 40#! de opinião sobre #color_white você#!"
 epidemic_events.5004.a.old_courtiers:0 "Todos os cortezãos anteriores perdem #negative_value 10#! de opinião sobre #color_white você#!"
 epidemic_events.5004.a:0 "\"Entrem, todos vocês!\""
 epidemic_events.5004.b.failure:0 "Eles precisam ser removidos à força"
 epidemic_events.5004.b.success:0 "Eles entendem a necessidade de isolamento"
 epidemic_events.5004.b:0 "Escoltem-nos para fora."
 epidemic_events.5004.c:0 "Guardas! Expulsem-nos."
 epidemic_events.5004.desc:0 "Um estrondo, uma batida — as portas da sala do trono se abrem, e uma onda de camponeses invade o recinto. Velhos, jovens, doentes, assustados — todos com os olhos fixos em mim.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" um deles suplica, \"proteja-nos de [epidemic_scope.GetName]. Você precisa.\"\n\nMeus guardas aguardam, prontos, esperando minha palavra."
 epidemic_events.5004.t:0 "A Maré Humana"
 epidemic_events.5005.a.coastal_quarantine:0 "Toda província costeira do [realm|E]"
 epidemic_events.5005.a.landholders:0 "Todos os $barons_and_minor_landholders_vassals$"
 epidemic_events.5005.a:0 "Faça quarenta dias."
 epidemic_events.5005.b.failure:0 "Eles precisam ser removidos à força"
 epidemic_events.5005.b.success:0 "Eles entendem a necessidade de isolamento"
 epidemic_events.5005.b:0 "Vinte dias de quarentena. Nem mais, nem menos."
 epidemic_events.5005.c:0 "O comércio vem primeiro. Não podemos atrasar."
 epidemic_events.5005.desc:0 "Ouro chega das costas — e [epidemic_scope.GetName] também.\n\n[steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem um plano: mercadores devem se isolar antes de descarregar mercadorias. \"Isso nos manterá seguros\", [steward.GetSheHe] insiste.\n\nInstituir quarentena significa menos impostos. A segurança vale o custo?"
 epidemic_events.5005.t:0 "Vidas ou Ouro?"
 epidemic_events.5006.a:0 "Você está completamente certo! Hahaha! Hee hee!"
 epidemic_events.5006.b:0 "Suplicar a [ROOT.Char.GetFaith.HighGodName] é nossa única salvação."
 epidemic_events.5006.c.failure:0 "Você parece pouco convincente"
 epidemic_events.5006.c.success:0 "Você realmente se sente um pouco melhor"
 epidemic_events.5006.c:0 "Bem... talvez tenha algo aí..."
 epidemic_events.5006.d:0 "Ridículo."
 epidemic_events.5006.desc:0 "Risos ecoam pelos corredores — estranho, dado que [epidemic_scope.GetName] ainda devasta lá fora.\n\nAgarro [councillor.Custom2('MyCharacterIntroduction', ROOT.Char)]. \"O que é tão engraçado?\"\n\n[councillor.GetSheHe|U] sorri. \"Os físicos dizem que doenças vêm de maus humores... então estamos rindo para espantá-las!\""
 epidemic_events.5006.t:0 "Nada de Risadas"
 epidemic_events.5007.a:0 "\"Chega! Herbalismo é uma arte nobre.\""
 epidemic_events.5007.b:0 "Prendam a bruxa!"
 epidemic_events.5007.c.failure:0 "A multidão ignora seus argumentos"
 epidemic_events.5007.c.success:0 "Você consegue convencer a multidão"
 epidemic_events.5007.c:0 "Bobagem."
 epidemic_events.5007.d:0 "\"Chega! Parem com essas acusações infundadas, [accuser.GetFirstNameNoTooltip].\""
 epidemic_events.5007.desc:0 "Uma comoção — [accuser.Custom2('MyCharacterIntroduction', ROOT.Char)] lidera uma multidão furiosa, encurralando [herbalist.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n\"Bruxa coletora de ervas!\" [accuser.GetSheHe] brada. \"No momento em que [herbalist.GetFirstNameNoTooltip] saiu, [epidemic_scope.GetName] a seguiu!\"\n\n[herbalist.GetFirstNameNoTooltip] permanece firme, acenando com desdém enquanto as vozes aumentam."
 epidemic_events.5007.e:0 "Talvez se [herbalist.GetFirstNameNoTooltip] prometer abandonar o ofício..."
 epidemic_events.5007.t:0 "Acusações de Feitiçaria"
 epidemic_events.5008.a:0 "Ninguém pode me ver sem minha permissão!"
 epidemic_events.5008.b:0 "Devo ser visto por meus súditos."
 epidemic_events.5008.c:0 "Que ótima desculpa essa [epidemic_scope.GetNameNoTooltip] é!"
 epidemic_events.5008.desc:0 "Não é uma coisa #EMP boa#!, essa [epidemic_scope.GetName] — mas devo admitir, estou apreciando a solidão. Sem visitantes, quase nenhum servo. É silencioso. Pacífico.\n\nTalvez esse isolamento esteja me ajudando a evitar a doença... ou talvez eu apenas goste de me esconder.\n\nAinda assim, devo mostrar minha face novamente? Só um pouco?"
 epidemic_events.5008.t:0 "A Salvo e em Paz"
 epidemic_events.5009.a:0 "\"Quantos você tem à venda?\""
 epidemic_events.5009.b.criticalfailure:0 "[merchant.GetSheHe|U] se recusa furiosamente a vender"
 epidemic_events.5009.b.failure:0 "[merchant.GetSheHe|U] se recusa a ceder"
 epidemic_events.5009.b.success:0 "[merchant.GetSheHe|U] concorda a contragosto"
 epidemic_events.5009.b:0 "Vou comprar seu melhor sachê de [newly_created_artifact.GetNameNoTooltip], por favor."
 epidemic_events.5009.c:0 "Um não fará mal."
 epidemic_events.5009.d:0 "Isso não salvará ninguém."
 epidemic_events.5009.desc:0 "O mercado fede — mas uma barraca tem um cheiro estranhamente agradável.\n\n\"Sachês frescos! As melhores ervas!\" o comerciante anuncia, pressionando um saquinho em minha mão. \"Mantém [epidemic_scope.GetName] longe!\"\n\nRealmente cheira bem... embora o preço seja alto."
 epidemic_events.5009.t:0 "Aroma Malandro"
 epidemic_events.5010.a:0 "Doações podem ao menos aliviar a passagem dos moribundos."
 epidemic_events.5010.b.lose:0 "Você sucumbe a um sentimento de temor"
 epidemic_events.5010.b.neutral:0 "Você se preocupa com os desafios"
 epidemic_events.5010.b.win:0 "Você decide reconstruir"
 epidemic_events.5010.b:0 "#DIE1 A cidade...#! #DIE2 minha preciosa cidade...#!"
 epidemic_events.5010.cairo:0 "Antiga além de qualquer medida, Cairo viu suas cidades irmãs em Mênfis e Heliópolis surgirem e caírem, e ainda assim permanece firme. Já suportou muito, mas precisará suportar ainda mais.\n\nO Nilo, o Rio da Vida, hoje carrega a morte conforme flui. Os mortos malignos são levados por suas águas para apodrecer nos deltas lamacentos onde ele encontra o mar, mas mais e mais os substituem. Nilômetros sufocam de corpos, jogados desesperadamente em suas gargantas para poupar tempo, espaço, e poupar os vivos.\n\nA velha cidade definha."
 epidemic_events.5010.constantinople:0 "A Cidade Desejada Pelo Mundo. A Rainha das Cidades. A Porta para a Felicidade. O Cruzamento do Mundo.\n\nNomes tão grandiosos e resplandecentes foram concedidos à poderosa metrópole, adornando sua cintilante península desde tempos imemoriais. Tão venenosamente irônicos esses nomes parecem agora, com os doentes e debilitados caminhando miseravelmente entre os cadáveres daqueles que já sucumbiram.\n\nEncontram eles algum conforto nessas antigas glórias enquanto morrem?"
 epidemic_events.5010.fallback:0 "As ruas sinuosas e casas empilhadas, antes tão cheias de multidões, encontram-se silenciosas. Apenas os lamentos dos enlutados e as tosses úmidas daqueles prestes a se juntar aos mortos rompem a quietude."
 epidemic_events.5010.kanyakubja:0 "Ninguém sabe quantas gerações viveram e morreram aqui, mas todos concordam que a cidade é impossivelmente antiga. Serão necessárias toda a sua experiência e sabedoria para sobreviver a esta ameaça.\n\nAs famosas destilarias de perfumes continuam produzindo attars, frascos de pele de camelo cheios até a boca e usados no pescoço dos saudáveis para afastar os cheiros malignos.\n\nEm outros lugares, porém, os únicos sons que ecoam pelas paredes são os gemidos dos mortos e moribundos, seus corpos empilhados a alturas impossíveis nos becos estreitos."
 epidemic_events.5010.london:0 "As marés suaves do Tâmisa agora carregam mais do que sedimentos e mercadores. Cadáveres inchados e queimados de sol são depositados rio abaixo, seus rostos contorcidos em um sorriso rígido e silencioso, bubões estourados marcando a pele pálida.\n\nAs antigas muralhas romanas, tantas vezes protetoras contra invasões dos vivos, agora são reforçadas com os mortos. As ruas estreitas e sinuosas tornaram-se um labirinto de corpos empilhados, ratos usando os montes tanto como abrigo quanto como alimento."
 epidemic_events.5010.opening:0 "Finalmente chegou. A temida pestilência ronda as ruas de [capital.GetBaseNameNoTier], sua foice impiedosa abatendo todos em seu caminho.\n\n"
 epidemic_events.5010.paris:0 "As águas sinuosas do Sena beijam alegremente as margens da Île de la Cité, escondendo a catástrofe em terra firme.\n\nOs enfermos perambulam sem esperança entre construções precárias. Onde antes padeiros anunciavam seus pães, agora há pilhas de mortos — os vivos incapazes de acompanhar a maré de doença que sufoca a cidade.\n\nA cena quase seria pacífica, não fossem os gemidos e tosses dos agonizantes."
 epidemic_events.5010.prague:0 "Os mercados e praças comerciais da cidade, antes tão movimentados, caíram em um silêncio mortal. As orgulhosas pontes sobre o Vltava estão entupidas de doentes, os mortos formando bloqueios entre as estruturas abaixo.\n\nVyšehrad observa o massacre tristemente, suas muralhas austeras, fundadas pelo Duque Krok tantas gerações atrás, incapazes de deter um assassino tão letal e silencioso quanto a temida pestilência.\n\nA Cidade das Cem Torres morre lentamente, seus campanários vangloriados incapazes de impedir que o céu desabe."
 epidemic_events.5010.rome:0 "Roma! A gloriosa Roma. A Capital do Mundo.\n\nIncontáveis almas pisaram essas estradas veneráveis, mas a multidão dos mortos cresce mais rápido a cada dia. A praga varre as ruas, maculando cada praça graciosa e cada arco magnífico. Os velhos mármores permanecem em silêncio, impotentes diante do sofrimento dos vivos. Os moribundos sussurram seus últimos sons, e em seus lábios se formam palavras raramente ousadas em tempos melhores:\n\n\"Quão perpétua é realmente a Cidade Eterna?\""
 epidemic_events.5010.santiago:0 "Pouquíssimos pés ainda percorrem o Caminho de Santiago. Apenas os mais resistentes e fervorosos seguem caminhando rumo à cidade assolada pela praga, buscando a salvação do Todo-Poderoso enquanto eles próprios sucumbem à doença repugnante.\n\nAs belas praças, antes repletas de alegria e de trocas amistosas, tornaram-se o refúgio dos condenados. Os mortos e os moribundos agonizam aqui seus últimos suspiros, tristemente sozinhos."
 epidemic_events.5010.t:0 "As Ruas Sufocantes de [capital.GetBaseNameNoTierPossessiveNoTooltip]"
 epidemic_events.5010.toledo:0 "Que cidade é mais conhecida por seu aço do que Toledo? As águas do Tejo já temperaram as lâminas de um milhão de espadas, mas existem ameaças das quais nenhuma maestria artesanal pode proteger.\n\nÉ uma ironia sombria que um lugar tão diverso se veja tão repentinamente unido diante de tamanha adversidade. A doença mata sem distinção, abatendo pessoas de todas as classes e caminhos da vida.\n\nAs antigas ferrarias silenciam. Aqueles que nelas trabalhavam voltam suas mãos calejadas para a oração em vez do labor, na esperança de que o divino os salve onde uma arma não poderia."
 epidemic_events.5010.varanasi:0 "É mais conhecida como a Cidade da Luz, mas Varanasi tem sido a Cidade dos Mortos por tanto tempo quanto isso. É apropriado, então, que receba esta mais mortal das pestilências.\n\nEm tempos mais felizes, o Ganges transbordava de vida; agora, carrega apenas os mortos. Seus cadáveres inchados ficam presos nas margens, chutados para longe pelos poucos vivos que ainda ousam sair.\n\nOs sons de choro e tosse ricocheteiam nas pedras antigas desta cidade antediluviana."
 epidemic_events.5900.christian:0 "\"Pai nosso que estais no céu, santificado seja o vosso nome...\""
 epidemic_events.5900.desc:0 "A pestilência assombra a terra.\n\nHorríveis bubões borbulhantes surgem nas vítimas, cujos chamados piedosos por ajuda são lentamente silenciados à medida que sufocam e se afogam em suas próprias gargantas cheias de pus.\n\nDo mais humilde dos órfãos ao mais celebrado dos imperadores, todos temem a foice indiscriminada da praga implacável. Os que sobrevivem precisam assistir, impotentes, enquanto todos ao redor perecem.\n\nOs devotos buscam um salvador no divino, e os poderosos, em suas riquezas — mas ninguém está verdadeiramente seguro. Tentáculos aterradores se espalham pela terra, apertando-a até que já não respire.\n\nA Peste Negra está sobre nós. [ROOT.Char.GetFaith.HighGodName] nos salve a todos."
 epidemic_events.5900.desc_asia:0 "A pestilência caminha entre nós.\n\nOs afligidos incham de chagas, seus gritos tornando-se gorgolejos conforme o ar lhes falta. Na morte, até os mais vocais se calam.\n\nNinguém é poupado. Do trabalhador descalço ao príncipe enclausurado, a roda do sofrimento gira para todos. Aos vivos resta varrer cinzas das soleiras e contar esteiras vazias.\n\nAlguns recitam sutras, outros se apegam a ritos e posições — mas decreto nenhum detém a decadência, e mérito nenhum compensa o tributo. Como neblina em um vale, a praga se espalha invisível, ainda assim sentida em cada manhã imóvel.\n\nA Peste Negra está aqui. Que o Céu desvie seu olhar."
 epidemic_events.5900.fallback:0 "Que perseveremos nestes tempos sombrios."
 epidemic_events.5900.t:0 "A Peste Negra"
 epidemic_events.5901.a.tt.plague:0 "Peste Contraída"
 epidemic_events.5901.a.tt:0 "Percepções Obtidas"
 epidemic_events.5901.a:0 "\"Por que não fazemos isso juntos?\""
 epidemic_events.5901.b:0 "Exijo uma dissecação."
 epidemic_events.5901.c:0 "Muito bem, faremos sem isso."
 epidemic_events.5901.desc:0 "O cadáver jaz sobre a mesa, cercado por diversos instrumentos macabros, bem como por mim e por meu físico [physician.GetFirstName].\n\n\"Não tenho certeza, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [physician.GetFirstNameNoTooltip] começa nervosamente, o olhar fixo em seus próprios pés. \"Não sei o que podemos extrair deste corpo...\"\n\n[physician.GetSheHe|U] sabe muito bem o que #EMP poderíamos#! fazer; [physician.GetSheHe] simplesmente não quer que eu lhe peça isso. Dissecar o cadáver de um portador da peste poderia nos revelar pistas valiosas sobre como combatê-la. A única questão é se há risco de contrair a terrível aflição..."
 epidemic_events.5901.t:0 "Até o Cotovelo"
 epidemic_events.5902.a:0 "Não podemos arriscar. Matem todos."
 epidemic_events.5902.b:0 "Talvez possamos montar alguns acampamentos temporários."
 epidemic_events.5902.c:0 "Mandem-nos embora."
 epidemic_events.5902.d:0 "Deixem-nos passar."
 epidemic_events.5902.desc:0 "Descendo apressado do cavalo, abro caminho pela multidão de soldados em [border_province.GetName], dentro do condado fronteiriço de [border_county.GetNameNoTier]. A mensagem de meu marechal [marshal.GetFirstName] pedia meu julgamento e presença — e ao avistar [marshal.GetSheHe], vejo o motivo.\n\nUma massa esfarrapada de pessoas, cansadas e famintas, permanece diante de nós, incerta. São claramente refugiados da brutal peste que assola terras distantes, mas não há garantia de que escaparam ilesos.\n\nMesmo agora, vejo um homem no grupo tossindo e arfando. [marshal.GetFirstNameNoTooltip] cobre sua boca, hesitante."
 epidemic_events.5902.t:0 "Travessias na Fronteira"
 epidemic_events.5903.a:0 "[family.GetSheHe|U] provavelmente tem razão."
 epidemic_events.5903.b:0 "\"Bah, ficarei bem!\""
 epidemic_events.5903.desc:0 "\"[ROOT.Char.GetFirstName]! Não!\" A voz de [family.GetFirstName] ecoa acima do som do meu cavalo seguindo pelo caminho. [family.GetSheHe|U] corre ao meu lado, lançando um olhar repreensivo.\n\n\"Você ouviu o que está por vir. Toda essa morte e doença...\" [family.GetSheHe] torce as mãos, angustiad[Select_CString( family.IsFemale, 'a', 'o' )]. \"Você precisa ficar aqui, seguro dentro do [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'camp', 'walls')]. Por favor.\"\n\nSó posso suspirar. Se eu tivesse sido um pouco mais rápido para sair, já estaria cavalgando pelo campo agora, aproveitando a natureza."
 epidemic_events.5903.t:0 "Prazeres Simples, Dispensados"
 epidemic_events.5904.a:0 "[doomsday_preacher.GetSheHe|U] está certo! Devemos nos preparar!"
 epidemic_events.5904.b:0 "Guardas? Prendam ess[Select_CString( doomsday_preacher.IsFemale, 'a', 'e' )] [doomsday_preacher.GetWomanMan]."
 epidemic_events.5904.c.tt.failure:0 "Você perde o debate"
 epidemic_events.5904.c.tt.success:0 "Você prova que [doomsday_preacher.GetSheHe] está errad[Select_CString( doomsday_preacher.IsFemale, 'a', 'o' )]"
 epidemic_events.5904.c:0 "\"Mostre-me onde está escrito. Prove suas palavras.\""
 epidemic_events.5904.d.tt:0 "Todos os baronatos ao redor de [doomsday_province.GetName] têm #color_white 15%#! de chance de ganhar o mesmo modificador"
 epidemic_events.5904.d:0 "\"Não ouçam [doomsday_preacher.GetSheHe]!\""
 epidemic_events.5904.desc:0 "O mercado costuma ser bastante movimentado, mas hoje há uma verdadeira cacofonia ecoando por todo o lugar. Logo encontro o culpado: uma figura gritando no topo dos pulmões [doomsday_preacher.GetHerHim].\n\n\"O Fim dos Tempos está sobre nós!\" [doomsday_preacher.GetSheHe] lamenta, importunando alguns transeuntes. \"Todos pereceremos! Assim está escrito!\"\n\nAs gotas de saliva que voam da boca do pregador repugnam a maioria, mas alguns na multidão começam a concordar em voz alta."
 epidemic_events.5904.t:0 "Pregadores do Fim dos Tempos"
 epidemic_events.5905.a.tt:0 "Todos os baronatos ao redor de [province.GetName] têm #color_white 50%#! de chance de ganhar o mesmo modificador"
 epidemic_events.5905.a:0 "\"Não há motivo para pânico. Confie em mim, sou físico.\""
 epidemic_events.5905.b.tt.failure:0 "Eles parecem não acreditar"
 epidemic_events.5905.b.tt.success:0 "Você os convence com sucesso"
 epidemic_events.5905.b:0 "\"Isso parece particularmente plausível para você?\""
 epidemic_events.5905.c:0 "Debater com [peasant.GetSheHe] não fará [peasant.GetSheHe] acreditar em mim mesmo assim."
 epidemic_events.5905.desc:0 "Depois que o choque inicial da minha presença entre os frequentadores diminui, esta taverna se revela um bom lugar para relaxar. Ainda assim, o estalajadeiro parece um tanto inquieto.\n\n\"Sabe, [ROOT.Char.Custom('FormOfAddressForLiege')], sobre a grande pestilência? Já ouviu o que ela está fazendo com as pessoas? Está fazendo elas #EMP [ROOT.GetCharacter.Custom('GetPlagueEffect')]#!\" [peasant.GetSheHe] gesticula freneticamente. \"É o que dizem! Como iremos sobreviver?!\"\n\nOs sempre ocupados #EMP 'eles'#! estão, mais uma vez, fazendo seu excelente trabalho..."
 epidemic_events.5905.t:0 "Nervos que se Espalham"
 epidemic_events.5906.a.tt.failure:0 "O flagelante permanece resoluto"
 epidemic_events.5906.a.tt.success:0 "Você argumenta com sucesso"
 epidemic_events.5906.a:0 "\"Você e os seus estão destruindo a fé [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]!\""
 epidemic_events.5906.b:0 "Talvez [flagellant.GetSheHe] tenha um ponto..."
 epidemic_events.5906.c:0 "\"Prenda [flagellant.GetSheHe], [marshal.GetFirstNameNoTooltip].\""
 epidemic_events.5906.d.tt:0 "Todos os baronatos ao redor de [doomsday_province.GetName] têm #color_white 25%#! de chance de ganhar o mesmo modificador"
 epidemic_events.5906.d:0 "Deixem [flagellant.GetSheHe] ir. Não está fazendo mal algum."
 epidemic_events.5906.desc:0 "Os guardas normalmente não são tão diretos quando se trata de me incomodar na sala do conselho, mas hoje eles irrompem prontamente, com meu marechal [marshal.GetFirstName] à frente. Atrás deles, sendo arrastado sem cerimônia, está uma figura miserável, olhos arregalados, empunhando o que parece ser um chicote fortemente agarrado entre as mãos [flagellant.GetHerHim].\n\n\"Encontramos [flagellant.GetSheHe] em [doomsday_province.GetName], vagando pelas ruas, se flagelando até sangrar com isso aí.\" [marshal.GetFirstNameNoTooltip|U] aponta para o chicote. \"[flagellant.GetSheHe|U] está dando aos moradores o susto de suas vidas, delirando sobre como a poderosa pestilência está vindo para cá e que todos devemos nos arrepender.\""
 epidemic_events.5906.t:0 "Vagando e Delirando"
 epidemic_events.5907.a:0 "Meu físico me dará tratamentos de ponta!"
 epidemic_events.5907.b.criticalfailure:0 "Você realmente adoece"
 epidemic_events.5907.b.failure:0 "'É só um resfriadinho'"
 epidemic_events.5907.b.success:0 "De fato, não era nada"
 epidemic_events.5907.b:0 "Não é nada. Com certeza não é nada."
 epidemic_events.5907.desc:0 "Minhas pálpebras se abrem tremulando quando o sol da manhã incide sobre elas. Eu me sento, espreguiço, bocejo e... #EMP tusso#!.\n\nMinha garganta está um pouco irritada. Meus olhos, também, parecem mais turvos que o normal. Sinto até um leve resfriado.\n\nAh não. Por favor, não eu. Livrai-me desse destino. Dizei-me, ó [ROOT.Char.GetFaith.HighGodName], que a temida peste ainda não alcançou estas terras e me feito sua vítima..."
 epidemic_events.5907.t:0 "Uma Coceirinha"
 epidemic_events.5908.a:0 "\"Se pedir de novo, vai cavar a própria cova.\""
 epidemic_events.5908.b:0 "Garanta que sejam compensados de forma justa."
 epidemic_events.5908.c:0 "\"Bah! Há muitos outros de onde você veio.\""
 epidemic_events.5908.desc:0 "A primeira suplicante do dia se aproxima, e é claro que não se trata de alguém de grande posição. A sujeira sob as unhas [gravedigger.GetHerHim] confirma isso, mesmo que [gravedigger.GetSheHe] claramente tenha feito algum esforço para parecer apresentável.\n\n\"Eu represento os coveiros de [province.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')],\" [gravedigger.GetSheHe] começa, \"e temos um pedido a lhe fazer. A temível peste rasteja em nossa direção neste exato momento: nossa nobre profissão certamente será muito necessária em breve.\"\n\n\"Seremos nós a lidar com os corpos, nós que corremos maior risco.\" [gravedigger.GetSheHe|U] continua. \"Em troca, pedimos apenas um pequeno aumento como compensação. Será que vossa graça poderia poupar algumas moedas?\""
 epidemic_events.5908.t:0 "Empilhadores Enrijecidos"
 epidemic_events.5999.a.tt:0 "Ainda está tão longe! Podemos até comemorar sua desgraça."
 epidemic_events.5999.a:0 "Hah! Que morram."
 epidemic_events.5999.b.tt:0 "Trancar edifícios! Fechar portas! Plantar canteiros de rosas!"
 epidemic_events.5999.b:0 "Precisamos fazer algo!"
 epidemic_events.5999.c.christian:0 "#EMP \"Olhei, e eis um cavalo verde...\"#!"
 epidemic_events.5999.c.notchristian:0 "Um mau presságio dos tempos que virão..."
 epidemic_events.5999.desc:0 "Mensagens e relatórios se espalham pela minha mesa. Todos sobre um único assunto. O pânico escorre das palavras, formando em meu estômago um poço crescente de inquietação.\n\nA doença começa com calafrios e febre antes que bubões necróticos se formem nas axilas dos infelizes. A respiração vem em arfadas entre expulsões de sangue, os lábios e dedos dos pés se tornando negro-azulados. Depois, mata indiscriminadamente; ricos e pobres, jovens e velhos, duques e desvalidos.\n\nOs relatos vêm de terras distantes, por ora, mas meus dedos trêmulos seguem as datas.\n\nEstá chegando mais perto."
 epidemic_events.5999.t:0 "O Horizonte que Escurece"
 epidemic_events.alert_description:0 "Uma [epidemic|E] conhecida como [epidemic.GetName] atingiu [infected_county.GetName]"
 epidemic_events.alert_title:0 "Surto de Peste: [infected_county.GetNameNoTierNoTooltip]"
 epidemic_infected_army_modifier:0 "Exército Infectado"
 epidemic_infected_knights_modifier:0 "Cavaleiros Infectados"
 every_bordering_county:0 "Todo condado que faz fronteira com [bigoted_ruler_that_everyone_hates.GetName]"
 every_county_infected_10_years:0 "Cada [county|E] que foi infectado nos últimos 10 anos"
 every_family_member_of_lover:0 "Todo membro da família de [dead_lover.GetFirstName]"
 every_infected_county:0 "Todo condado infectado"
 every_infected_courtier_and_guest:0 "Todo [THIS.Char.Custom('GetCourtierConcept')] e [guest|E] infectado"
 fervor_loss_flagellants:0 "Flagelantes vagando livremente"
 frashokereti:0 "Frashokereti"
 friend_flagellating_together:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] se flagelaram juntos como forma de proteção contra uma praga terrível"
 friend_plague_financial_help:0 "[CHARACTER.GetShortUIName|U] deu ajuda financeira a [TARGET_CHARACTER.GetShortUIName] durante uma epidemia."
 friend_plague_financial_help_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] deu ajuda financeira a [CHARACTER.GetShortUIName] durante uma epidemia."
 friend_revenants_nailed:0 "[CHARACTER.GetShortUIName|U] seguiu o conselho de [TARGET_CHARACTER.GetShortUINamePossessive] e pregou caixões para impedir que revenantes saíssem de seus túmulos"
 friend_revenants_nailed_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] seguiu o conselho de [CHARACTER.GetShortUINamePossessive] e pregou caixões para impedir que revenantes saíssem de seus túmulos"
 friend_walk_of_shame:0 "[CHARACTER.GetShortUIName|U] realizou um ato de humilhação pública no lugar de [TARGET_CHARACTER.GetShortUINamePossessive]."
 friend_walk_of_shame_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] realizou um ato de humilhação pública no lugar de [CHARACTER.GetShortUINamePossessive]."
 health.1015.a:0 "Eu não aguento mais!"
 health.1015.court_physician.desc:0 "\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], essa é a enfermidade conhecida como sarampo.\""
 health.1015.desc:0 "#EMP Coceira.#! Acordo no meio da noite e encontro minha perna sangrando. Minhas unhas também. A coceira é tão forte que não consigo evitar cavar mais fundo.\n\nEnfio o rosto em água fria esperando que passe. Meu reflexo — olhos vermelhos."
 health.1015.t:0 "[SCOPE.Custom('EventTitleDisease')]: A Pequena Miséria"
 health.1016.a:0 "Por favor... água."
 health.1016.court_physician.desc:0 "\n\n\"Receio que possa ser a doença do cerco, [ROOT.Char.Custom('FormOfAddressForLiege')].\""
 health.1016.desc:0 "#EMP Argh.#! Seguro minhas entranhas de dor. Já perdi a noção do tempo que passei nesta latrina. Horas, dias? #EMP Semanas?#! Arghhhhhh. Os excrementos sanguinolentos doem mais a cada vez. O cheiro também não ajuda.\n\nSinto que vou desmaiar..."
 health.1016.t:0 "[SCOPE.Custom('EventTitleDisease')]: A Fonte Carmesim"
 health.1017.a:0 "Façam parar!"
 health.1017.court_physician.desc:0 "\n\n\"Parece que você foi afetado pelo fogo de [ROOT.Char.GetFaith.HouseholdGodName], [ROOT.Char.Custom('FormOfAddressForLiege')].\""
 health.1017.desc:0 "Eu não consigo parar o movimento. Parem! Parem! Meus braços continuam tremendo sozinhos, e vejo meus dedos ficando pretos. Os espasmos percorrem meu corpo — como se eu estivesse dançando.\n\nÉ tudo fogo. Parem! #EMP PAREM!#!"
 health.1017.t:0 "[SCOPE.Custom('EventTitleDisease')]: A Queimação"
 health.1112.a.tt:0 "Agora sou imune a [GetTrait('measles').GetName( GetNullCharacter )]"
 health.1112.a:0 "Hora de voltar à rotina."
 health.1112.desc:0 "Sento-me na cama e olho para minhas mãos, com as palmas para cima. Finalmente, as erupções se foram e minha pele voltou à sua cor normal.\n\nÉ quase estranho conseguir respirar novamente sem aquela coceira intensa."
 health.1112.t:0 "[SCOPE.Custom('EventTitleDisease')]: Uma Chance de Respirar"
 health.1113.a:0 "Hora de dar uma mordida."
 health.1113.desc:0 "Na primeira vez em que consigo pensar com clareza novamente, quase nem percebo. A névoa que envolvia minha mente parece ter sido levantada sem aviso.\n\nComida e água finalmente conseguem permanecer no meu corpo e sinto um desejo intenso por [ROOT.Char.Custom('FavoriteTreatDemand')]."
 health.1113.t:0 "[SCOPE.Custom('EventTitleDisease')]: Um Descanso"
 health.1114.a:0 "Agora só dançarei nos banquetes."
 health.1114.desc:0 "Saio da cama e a visão de dedos com cor saudável é tão rara quanto um cervo branco. Meu corpo finalmente me agraciou com um pouco de calma. Os espasmos desapareceram — sem mais dança.\n\nSolto um suspiro de alívio. Paz. Como eu sentia falta."
 health.1114.t:0 "[SCOPE.Custom('EventTitleDisease')]: De Volta ao Normal"
