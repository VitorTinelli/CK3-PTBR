l_spanish:
 can_select_legendary_culture_pillars_tt:0 "Você pode selecionar a [heritage|E] e a [language|E] da sua cultura lendária quando você [diverge|E] sua [culture|E]"
 legend_title_does_not_exist_sub_realm_claims_given_tt:0 "Você receberá uma [claim|E] em cada [title|E] de jure existente dentro de [title_claim.GetName]"
 story_event_legends.0001.a:0 "Que seja contado."
 story_event_legends.0001.desc.battle:0 "#EMP [promoted_legend.GetChapterDescriptionByName('battle')]#!"
 story_event_legends.0001.desc.fallback:0 "#EMP A lenda de [legend_protagonist.GetTitledFirstNamePossessiveNoTooltip|U] culmina em uma aventura maravilhosa: seus grandes feitos de armas foram de tal forma que todos os reis se maravilhavam com isso e muitos nobres e plebeus vieram ao encontro [legend_protagonist.GetHerHim], pois desejavam ver a lenda em carne e osso.#!"
 story_event_legends.0001.desc.famous_deed:0 "#EMP [promoted_legend.GetChapterDescriptionByName('famous_deed')]#!"
 story_event_legends.0001.desc.hunt:0 "#EMP [promoted_legend.GetChapterDescriptionByName('hunt')]#!"
 story_event_legends.0001.desc.intro:0 "Aqui está o final do livro de [legend_protagonist.GetTitledFirstName] e de seus nobres feitos, que eram incomparáveis em toda a terra. E aqui está o fim da [promoted_legend.GetName].\n\n"
 story_event_legends.0001.desc.outro:0 "\n\nE aqui estava escrito, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [GetCurrentDate.GetStringLong]."
 story_event_legends.0001.t:0 "No Fim da Lenda"
 story_event_legends.0002.a:0 "#EMP [legend_protagonist.GetHouse.GetMotto].#!"
 story_event_legends.0002.desc.battle:0 "#EMP [promoted_legend.GetChapterDescriptionByName('battle')]#!"
 story_event_legends.0002.desc.fallback:0 "$story_event_legends.0001.desc.fallback$"
 story_event_legends.0002.desc.famous_deed:0 "#EMP [promoted_legend.GetChapterDescriptionByName('famous_deed')]#!"
 story_event_legends.0002.desc.intro:0 "Aqui está o final do livro de [legend_protagonist.GetTitledFirstName] e de sua nobre família, [legend_protagonist.GetHouse.GetBaseName], cuja fama e legitimidade são conhecidas em toda a terra. E aqui está o fim de [promoted_legend.GetName].\n\n"
 story_event_legends.0002.desc.outro:0 "\n\nE aqui estava escrito, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [GetCurrentDate.GetStringLong]."
 story_event_legends.0002.t:0 "O Livro da Casa de [legend_protagonist.GetHouse.GetBaseNameNoTooltip]"
 story_event_legends.0003.a:0 "Assim seja."
 story_event_legends.0003.desc.fallback:0 "#EMP A lenda de [legend_protagonist.GetTitledFirstNamePossessiveNoTooltip|U] é repleta de maravilhas. [legend_protagonist.GetSheHe|U] realizou muitos milagres, incontáveis, e floresceu em muitas virtudes. Os doentes eram curados em sua presença, e plantas cresciam na terra árida.#!"
 story_event_legends.0003.desc.famous_deed:0 "#EMP [promoted_legend.GetChapterDescriptionByName('famous_deed')]#!"
 story_event_legends.0003.desc.intro:0 "Aqui está o final do livro de [legend_protagonist.GetTitledFirstName] e de seus milagres, que eram famosos entre todos os [legend_protagonist.GetFaith.GetAdherentNamePluralNoTooltip]. Ah, Todo-Poderoso [legend_protagonist.GetFaith.HighGodName], posso eu rezar por suas bênçãos sobre este livro, [promoted_legend.GetName].\n\n"
 story_event_legends.0003.desc.outro:0 "\n\nE aqui estava escrito, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], [GetCurrentDate.GetStringLong]."
 story_event_legends.0003.t:0 "Os Milagres de [legend_protagonist.GetTitledFirstNameNoTooltip]"
