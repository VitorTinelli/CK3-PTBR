l_spanish:
 absent_ruler:0 "Governante Ausente"
 absent_ruler_desc:0 "Este personagem responde à ameaça de uma iminente praga praticamente se recusando a sair de seus aposentos."
 allayed_fears:0 "Medos Acalmados"
 allayed_fears_desc:0 "As pessoas deste baronato tiveram seus medos sobre uma praga iminente amenizados."
 angelic_founder:0 "Fundação Angelical"
 angelic_founder_desc:0 "Os membros desta casa concordam que sua fundação foi posta em movimento por um anjo."
 angry_crowds:0 "Multidões Furiosas"
 angry_crowds_desc:0 "As pessoas deste baronato estão assustadas e irritadas com uma série de pregadores apocalípticos presos."
 apocalyptic_inquisition:0 "Inquisição Apocalíptica"
 apocalyptic_inquisition_desc:0 "Alguns membros da população deste condado convenceram-se de que a praga recente é um sinal do apocalipse. Toda a população agora foi submetida a uma inquisição, independentemente de acreditar no culto ou não."
 beset_by_revenants:0 "Assediado por Revenants"
 beset_by_revenants_desc:0 "As pessoas desta província acreditam que revenants estão ressurgindo de suas sepulturas e trazendo pestilência e doença com eles."
 blighted_by_plague:0 "Vulnerável à Peste"
 blighted_by_plague_desc:0 "A densidade populacional acima da média deste condado o torna vulnerável à propagação de pestes."
 border_defended:0 "Fronteira Defendida"
 border_defended_desc:0 "Recusar refugiados na fronteira deste baronato agradou a alguns, mas a desaceleração da imigração tem seus próprios custos."
 brutal_crackdown:0 "Repressão Brutal"
 brutal_crackdown_desc:0 "Uma repressão violenta aos refugiados na fronteira fortaleceu a autoridade, mas causou muita raiva neste baronato."
 cackling_loon:0 "Ganso Cacarejante"
 cackling_loon_desc:0 "A propensão deste personagem para rir de seus problemas tem #EMP alguns#! aspectos negativos..."
 cautious_rider:0 "Cavaleiro Cauteloso"
 cautious_rider_desc:0 "Este personagem se recusa a se arriscar com qualquer passeio pelo campo potencialmente infectado."
 ce1_accepted_mortality:0 "Em Paz"
 ce1_accepted_mortality_desc:0 "Este personagem recentemente confrontou sua mortalidade e encontrou conforto na natureza passageira da vida."
 ce1_avenging_child:0 "Criança Vingadora"
 ce1_avenging_child_desc:0 "Este personagem está determinado a vingar a morte de seu pai nas mãos de um animal selvagem."
 ce1_banishment_resistance:0 "Livre de Doença"
 ce1_banishment_resistance_desc:0 "Cortesãos gravemente doentes foram banidos da corte deste personagem, resultando em uma exposição muito reduzida à doença."
 ce1_black_thumb:0 "Polegar Preto"
 ce1_black_thumb_desc:0 "Este personagem não poderia estar menos interessado na natureza."
 ce1_bodies_in_the_street:0 "Corpos nas Ruas"
 ce1_bodies_in_the_street_desc:0 "Com os cemitérios cheios e o número de mortos aumentando, os corpos foram deixados para apodrecer nas ruas."
 ce1_common_graves:0 "Sepulturas Comuns"
 ce1_common_graves_desc:0 "Os plebeus estão sendo enterrados no cemitério deste condado."
 ce1_commoners_in_graves:0 "Cemitério Comum"
 ce1_commoners_in_graves_desc:0 "Este personagem recentemente abriu uma ala comum em seu cemitério real, agradando os locais, mas manchando sua reputação aos olhos de alguns nobres."
 ce1_consequentialist:0 "Consequencialista"
 ce1_consequentialist_desc:0 "Este personagem gosta de lembrar as pessoas que o destino é a parte importante, não a jornada."
 ce1_evil_spirit:0 "Espírito Malévolo"
 ce1_evil_spirit_desc:0 "Este personagem acredita que foi possuído por um espírito maligno e, como resultado, tem sido altamente irritável e errático."
 ce1_forgiveness:0 "Perdão Interior"
 ce1_forgiveness_desc:0 "Este personagem recentemente escolheu perdoar alguém que os prejudicou muito."
 ce1_forward_thinking:0 "Visionário"
 ce1_forward_thinking_desc:0 "Este personagem não se importa com as culturas do passado antigo, preferindo viver firmemente no presente."
 ce1_gone_dancing:0 "Juntou-se à Dança sem Fim"
 ce1_gone_dancing_desc:0 "Este personagem juntou-se aos camponeses em sua dança interminável."
 ce1_heartthrob:0 "Coração Ardente"
 ce1_heartthrob_desc:0 "Este personagem está em uma busca romântica lendária e se recusa a chamar até mesmo seu amante mais próximo de seu verdadeiro amor."
 ce1_heavily_ill:0 "Gravemente Doente"
 ce1_heavily_ill_desc:0 "A interação próxima com corpos doentes tem sido muito prejudicial para a saúde deste personagem."
 ce1_immortal:0 "Busca pela Imortalidade"
 ce1_immortal_desc:0 "Este personagem está em uma busca para encontrar uma maneira de se tornar imortal."
 ce1_lasting_line:0 "Linha Duradoura"
 ce1_legend_mocked:0 "Lenda Zombada"
 ce1_legend_mocked_desc:0 "A lenda deste personagem foi recentemente zombada em um festival cultural, fazendo com que outros se sentissem muito constrangidos para arriscar sua propagação."
 ce1_legendary_battle:0 "Batalha Lendária"
 ce1_legendary_battle_desc:0 "Este personagem recentemente se envolveu em uma batalha que poderia ser chamada de lendária por si só, um sinal de maiores feitos lendários por vir."
 ce1_legendary_feaster:0 "Festeiro Lendário"
 ce1_legendary_feaster_desc:0 "Este personagem tem percorrido o mundo, espalhando sua lenda em eventos e celebrações para todos que queiram ouvir."
 ce1_legendary_performance:0 "Performance Lendária"
 ce1_legendary_performance_desc:0 "Este personagem recentemente fez uma performance dramática de sua lenda. Embora não tenha alcançado seu público-alvo, os camponeses pareceram muito impressionados com isso."
 ce1_legendary_taverns:0 "Lendas Locais"
 ce1_legendary_taverns_desc:0 "A lenda deste personagem foi entusiasticamente abraçada pelos plebeus de seu reino, facilitando muito a velocidade com que ela se espalha. Homens viajam de taverna em taverna compartilhando a lenda."
 ce1_level_headed:0 "Pensamento Lúcido"
 ce1_level_headed_desc:0 "Este personagem entende que os sonhos são apenas isso. Nada mais."
 ce1_major_quarantine:0 "Quarentena em Toda a Região"
 ce1_major_quarantine_county:0 "Quarentena"
 ce1_major_quarantine_county_desc:0 "Ninguém tem permissão para entrar ou sair deste condado, reduzindo a propagação da praga."
 ce1_major_quarantine_desc:0 "Este personagem tem trancado os moradores em suas casas na tentativa de evitar a propagação da praga."
 ce1_modest_leader:0 "Líder Modesto"
 ce1_modest_leader_desc:0 "A lenda deste personagem em batalha cresce em conjunto com seu próprio comportamento quieto."
 ce1_non_heretical_solution:0 "Corpos Segregados"
 ce1_non_heretical_solution_desc:0 "Corpos afetados pela praga estão sendo separados dos saudáveis neste reino."
 ce1_quarantined_corpse:0 "Corpos em Quarentena"
 ce1_quarantined_corpse_desc:0 "Um exército hostil recentemente lançou corpos doentes em uma área deste condado, mas os corpos foram mantidos separados com sucesso da maioria da população."
 ce1_royal_touch:0 "O Toque Real"
 ce1_royal_touch_desc:0 "Os doentes e moribundos deste condado foram recentemente visitados por seu senhor, concedendo-lhes seu toque real na forma de moedas abençoadas."
 ce1_siege_corpse:0 "Corpos Doentes"
 ce1_siege_corpse_desc:0 "Um exército hostil recentemente lançou corpos doentes em uma área deste condado."
 ce1_unorthodox_epidemic_treatment:0 "Tratamento Não Ortodoxo"
 ce1_unorthodox_epidemic_treatment_bad:0 "Tratamento Herético Mal-sucedido"
 ce1_unorthodox_epidemic_treatment_bad_desc:0 "Através de práticas esotéricas e altamente heréticas, este personagem tem sido malsucedido na redução da taxa de propagação da praga."
 ce1_unorthodox_epidemic_treatment_desc:0 "Através de práticas esotéricas e altamente heréticas, este personagem tem reduzido com sucesso a taxa de propagação da praga."
 ce1_will_to_live:0 "Crise Existencial"
 ce1_will_to_live_desc:0 "Este personagem teme morrer."
 clear_beaches:0 "Praias Livres"
 clear_beaches_desc:0 "As praias desta província estão livres de doentes ou moribundos."
 coastal_quarantine:0 "Quarentena Costeira"
 coastal_quarantine_desc:0 "Mercadores que entram nesta província pelo mar têm que se isolar por um tempo antes de poderem vender suas mercadorias."
 commoners_turned_away:0 "Camponeses Rejeitados"
 commoners_turned_away_desc:0 "Os camponeses desta província foram rejeitados por seu senhor feudal em sua hora de necessidade, e muitos não estão satisfeitos com isso."
 commoners_welcomed_in:0 "Camponeses Recebidos"
 commoners_welcomed_in_desc:0 "Os camponeses desta província foram recebidos por seu senhor feudal, e todos estão gratos pela hospitalidade."
 contaminated_beaches:0 "Praias Contaminadas"
 contaminated_beaches_desc:0 "As praias desta província ocasionalmente recebem barcos cheios de mortos."
 corpse_piles:0 "Montes de Cadáveres"
 corpse_piles_desc:0 "Esta baronia sofre com montes de cadáveres contaminados sendo deixados apodrecer em suas praias."
 critical_epidemic_treatment:0 "Prevenção de Epidemia Mística"
 critical_epidemic_treatment_desc:0 "Um médico místico recomendou tratamentos radicais e estranhos para a epidemia iminente, e embora tenham irritado as autoridades religiosas, parecem ser altamente eficazes."
 critical_epidemic_treatment_failed:0 "Prevenção de Epidemia Mística Malfeita"
 critical_epidemic_treatment_failed_desc:0 "As medidas tomadas por este personagem para tratar aqueles infectados com a praga não apenas foram eficazes, mas sua natureza heterodoxa perturbou muito as autoridades religiosas."
 dangerous_rides:0 "Passeios Perigosos"
 dangerous_rides_desc:0 "As aventuras deste personagem na natureza selvagem colocam em perigo tanto eles quanto sua família, mas realmente melhoram seu humor."
 dead_boats:0 "Barcos de Mortos"
 dead_boats_desc:0 "Barcos cheios de mortos chegaram às praias aqui, espalhando infecção e ruína."
 disastrous_cull:0 "Abate Desastroso"
 disastrous_cull_desc:0 "A purga de grande parte da população local de ovelhas danificou a economia local."
 dismissed_peasantry:0 "Mortos Respeitados"
 dismissed_peasantry_desc:0 "Os camponeses desta província se sentem desconsiderados e marginalizados por seus governantes."
 divine_guidance:0 "Orientação Divina"
 divine_guidance_desc:0 "A população local deste condado foi recentemente convencida teologicamente a reduzir drasticamente a perseguição às minorias."
 draconian_lockdown:0 "Bloqueio Dracônico"
 draconian_lockdown_desc:0 "Um conjunto punitivo de regras levou a danos generalizados na economia local aqui."
 eager_populace:0 "População Ansiosa"
 eager_populace_desc:0 "As pessoas deste baronato ouviram as palavras dos pregadores locais e estão dispostas a fazer o que for necessário para se preparar."
 epidemic_closed_barracks:0 "Barracas Fechadas"
 epidemic_closed_barracks_desc:0 "Para evitar perdas desnecessárias, os soldados serão isolados, e nenhum treinamento será permitido."
 epidemic_increased_maintance:0 "Manutenção Aumentada"
 epidemic_increased_maintance_desc:0 "Este personagem está pagando salários mais altos para substituir os soldados que foram afetados pela epidemia."
 epidemic_pressed_levies:0 "Milícias Pressionadas"
 epidemic_pressed_levies_desc:0 "Esta província está pressionando os camponeses em seus regimentos de Homens de Armas."
 fealty_demanded:0 "Lealdade Exigida"
 fealty_demanded_desc:0 "Este personagem exige lealdade de seus subordinados."
 fears_allayed:0 "Medos Acalmados"
 fears_allayed_desc:0 "Os camponeses desta província sentiram que seus medos foram acalmados e seguem felizmente as instruções."
 fears_ignored:0 "Medos Ignorados"
 fears_ignored_desc:0 "Os camponeses desta província sentem que seus medos foram ignorados e continuam a resmungar."
 flagellants_acquiesce:0 "Flagelantes Apaziguados"
 flagellants_acquiesce_desc:0 "Este personagem apaziguou os flagelantes que vagam pelas cidades e vilarejos."
 flowers_planted:0 "Flora Abundante"
 flowers_planted_desc:0 "Um vasto campo de flores foi cultivado aqui para combater o ar ruim de uma praga."
 free_boats:0 "Barcos Gratuitos"
 free_boats_desc:0 "Este personagem se beneficiou de uma série de barcos abandonados que encalharam em suas praias, proporcionando-lhe melhores opções ao viajar."
 full_of_rabid_animals:0 "Cheio de Animais Raivosos"
 full_of_rabid_animals_desc:0 "Inúmeros animais de rua foram trazidos para este condado e têm espalhado doenças por toda a população."
 funeral_comfort:0 "Confortado"
 funeral_comfort_desc:0 "Este personagem recentemente confrontou sua própria mortalidade e encontrou conforto no significado encontrado em uma existência fugaz."
 funeral_existential_dread:0 "Angústia Existencial"
 funeral_existential_dread_desc:0 "Este personagem recentemente percebeu que um dia irá morrer. Eles não gostaram disso."
 funeral_unrelenting_devotion:0 "Devoção Inabalável"
 funeral_unrelenting_devotion_desc:0 "Este personagem jurou no túmulo de um ente querido se tornar um melhor governante."
 gravediggers_compensated:0 "Coveiros Compensados"
 gravediggers_compensated_desc:0 "Os coveiros deste baronato receberam um pagamento extra, elevando sua moral."
 gravediggers_replaced:0 "Coveiros Substituídos"
 gravediggers_threatened:0 "Coveiros Ameaçados"
 gravediggers_threatened_desc:0 "Os coveiros deste baronato foram ameaçados e extorquidos, deixando-os mais pobres e muito menos propensos a trabalhar."
 health_first:0 "Saúde em Primeiro Lugar"
 health_first_desc:0 "Este personagem tenta priorizar sua própria saúde em relação à dos outros."
 healthy_court:0 "Corte Saudável"
 healthy_court_desc:0 "As ações deste personagem levaram a uma corte saudável e feliz."
 herbalist_suspicions:0 "Suspeitas de Herbalista"
 herbalist_suspicions_desc:0 "A habilidade deste personagem com pomadas e ervas os tornou objeto de suspeita em tempos de praga."
 hiding_from_epidemic:0 "Escondendo-se da Praga"
 hiding_from_epidemic_desc:0 "Este personagem passa seu tempo trancado enquanto as pragas assolam seu reino.\n\n[infection_chance|E]: #P -75%#!"
 kids_legend_modifier:0 "Lenda Infantil"
 kids_legend_modifier_desc:0 "As crianças estão encenando a lenda deste personagem, aumentando a taxa com que ela se espalha."
 lacking_cats_and_dogs:0 "Animais Eliminados"
 lacking_cats_and_dogs_desc:0 "Um recente extermínio deixou este condado com uma população de animais de rua drasticamente reduzida, o que de alguma forma levou a um aumento na infectividade da doença."
 lacking_cats_and_dogs_good:0 "Animais da Praga Eliminados"
 lacking_cats_and_dogs_good_desc:0 "Um recente extermínio deixou este condado com uma população de animais de rua drasticamente reduzida, reduzindo a propagação da praga."
 legend_bloodthirsty_warrior:0 "Guerreiro Sanguinário"
 legend_bloodthirsty_warrior_desc:0 "Este personagem se orgulha de suas façanhas marciais."
 legend_bravely_ran_away:0 "Fugiu Corajosamente"
 legend_bravely_ran_away_desc:0 "Este personagem supostamente virou as costas quando a batalha estava próxima. O fato de eventualmente ter funcionado a seu favor impede que outros se comprometam totalmente com a zombaria, pelo menos."
 legend_bruised_head:0 "Testa Machucada"
 legend_bruised_head_desc:0 "Este personagem se machucou levemente, causando uma dor de cabeça ocasional."
 legend_cannibal_scarred:0 "Inimigo dos Canibais"
 legend_cannibal_scarred_desc:0 "Dizem que este personagem repeliu um ataque de canibais, deixando-os marcados."
 legend_character_culture_builders:0 "Bênção dos Construtores"
 legend_character_culture_builders_desc:0 "Este personagem tem sido feliz em tranquilizar os moradores de sua capital de que seus antepassados em comum construíram um assentamento tão poderoso, e mais ninguém."
 legend_charitable_donations:0 "Doações Caridosas"
 legend_charitable_donations_desc:0 "Esta província está se beneficiando de muitos exemplos de doações caridosas."
 legend_chaste_faithful:0 "Casto, Fiel"
 legend_chaste_faithful_desc:0 "Aqueles que seguem esta lenda são conhecidos por sua fidelidade."
 legend_claimed_stigmatic:0 "Estigmático Alegado"
 legend_claimed_stigmatic_desc:0 "Este personagem carrega uma marca que afirmam ser semelhante àquelas sofridas por Jesus. Isso provou ser extremamente controverso."
 legend_county_culture_builders:0 "Cultura da Capital"
 legend_county_culture_builders_desc:0 "Os cidadãos deste lugar se orgulham do fato de que seus antepassados foram aqueles que o construíram."
 legend_culturally_sensitive:0 "Sensível Culturalmente"
 legend_culturally_sensitive_desc:0 "Este personagem compreende o potencial de tensão entre diferentes culturas e toma precauções para garantir que essas tensões raramente se inflamem."
 legend_eagle_eyed:0 "Olho de Águia"
 legend_eagle_eyed_desc:0 "Segundo o boca a boca, este personagem provou sua habilidade com um arco contra qualquer um que os desafiasse."
 legend_edifices_enduring:0 "Edifícios, Duradouros"
 legend_edifices_enduring_desc:0 "Seguir os exemplos dos pedreiros do passado não é uma má ideia: de fato, o fato de suas criações ainda estarem erguidas hoje é um testemunho de suas habilidades."
 legend_errors_exonerated:0 "Exonerado"
 legend_errors_exonerated_desc:0 "Os caminhos pecaminosos deste personagem foram enterrados fundo devido ao apoio de seus pares."
 legend_esteemed_expanding:0 "Estimado, Expansivo"
 legend_esteemed_expanding_desc:0 "Entre os apoiadores desta lenda estimada estão alguns verdadeiros luminários."
 legend_fat_and_happy:0 "Gordo e Feliz"
 legend_fat_and_happy_desc:0 "Este personagem está um pouco acima do peso, mas eles absolutamente fizeram as pazes com isso."
 legend_gods_humble_servant:0 "Servo Humilde dos Deuses"
 legend_gods_humble_servant_desc:0 "Este personagem afirma que sua doença visual os humilhou e os tornou mais piedosos como resultado."
 legend_historical_bedecking:0 "Vestimenta Antiga"
 legend_historical_bedecking_desc:0 "Este personagem veste as roupas de seu povo de longa data, invocando deliberadamente sua memória."
 legend_holy_sacrifice:0 "Sacrifício Sagrado"
 legend_holy_sacrifice_desc:0 "Este personagem afirma que sacrificou um olho ao divino."
 legend_humble_king:0 "Rei Humilde"
 legend_humble_king_desc:0 "A humilde minimização das ações sagradas deste personagem lhes traz um pouco mais de prestígio aos olhos dos fiéis."
 legend_investments:0 "Investimentos Financeiros"
 legend_investments_desc:0 "Este condado teve uma série de investimentos provenientes dos negócios de seu senhor feudal, impulsionando sua economia."
 legend_irreverent_immoral:0 "Irreverente, Imoral"
 legend_irreverent_immoral_desc:0 "A sanção desta lenda por parte de pessoas além de qualquer reprovação a tem manchado gravemente."
 legend_lecherous_lewd:0 "Libidinoso, Obsceno"
 legend_lecherous_lewd_desc:0 "Aqueles que seguem esta lenda são famosos por seus modos devassos."
 legend_loose_lips:0 "Língua Solta"
 legend_loose_lips_desc:0 "Este personagem está disposto a permitir que sua influência seja comprada, deixando outros potencialmente dobrá-lo à sua vontade."
 legend_modern_ruler:0 "Governante Moderno"
 legend_modern_ruler_desc:0 "Este personagem se recusa a se curvar às regras do passado, forjando seu próprio caminho."
 legend_monophthalmic_mythical:0 "Monofálmico, Mítico"
 legend_monophthalmic_mythical_desc:0 "Ciclopes andam entre nós! Se você mantiver os olhos bem abertos, talvez você também consiga dar uma olhada..."
 legend_mothers_boy:0 "Respeitoso"
 legend_mothers_boy_desc:0 "A deferência deste personagem para com seus pais estabelece um padrão para todos seguirem."
 legend_nick_of_time:0 "No Momento Certo"
 legend_nick_of_time_desc:0 "Este personagem supostamente chegou no momento certo com reforços durante uma batalha decisiva."
 legend_palatial_palatable:0 "Palaciano, Palatável"
 legend_palatial_palatable_desc:0 "Realmente, nada é mais grandioso do que uma mesa cheia das carnes mais exóticas!"
 legend_prayer_callus:0 "Calo de Oração"
 legend_prayer_callus_desc:0 "Este personagem tem um 'zabiba' ou 'calo de oração', uma marca na testa que prova sua devoção enquanto se prostra."
 legend_principled_pious:0 "Principado, Piedoso"
 legend_principled_pious_desc:0 "Todos aqueles que promovem esta lenda se beneficiam de sua integridade aos olhos do povo comum."
 legend_renowned_herbalist:0 "Herbalista Renomado"
 legend_renowned_herbalist_desc:0 "Este personagem supostamente encontrou plantas raras das quais aprendeu muito."
 legend_saintly_sinless:0 "Santo, Sem Pecado"
 legend_saintly_sinless_desc:0 "Os propagadores desta lenda são tão elogiados que isso até mesmo realça a própria lenda."
 legend_secure_safe:0 "Seguro, Protegido"
 legend_secure_safe_desc:0 "Esta lenda é famosa por unir as pessoas, transformando inimigos em amigos mesmo em áreas desconhecidas."
 legend_sick_hospitals:0 "Hospedarias Bem Utilizadas"
 legend_sick_hospitals_desc:0 "Os cidadãos desta província sabem que devem ir em primeiro lugar a uma hospedaria se ficarem doentes."
 legend_sneaks_food:0 "Furtando Comida"
 legend_sneaks_food_desc:0 "Este personagem teme ser visto como impio por excesso, mas não consegue resistir a furtar alguns lanches aqui e ali."
 legend_stigmatic:0 "Estigmático"
 legend_stigmatic_desc:0 "Este personagem tem múltiplas feridas antigas em locais que espelham aqueles de Jesus."
 legend_tolerant_trusting:0 "Tolerante, Confiante"
 legend_tolerant_trusting_desc:0 "Esta lenda foi permitida a crescer livremente, seu dono incentivando a ornamentação por bardos viajantes."
 legend_visions_of_god:0 "Visões Divinas"
 legend_visions_of_god_desc:0 "Este personagem afirma que sua falta de visão se deve a uma visão sagrada que os deixou cegos."
 legend_well_organised:0 "Bem Organizado"
 legend_well_organised_desc:0 "A previsão deste personagem com a organização militar raramente os deixa desprevenidos quando a batalha chega."
 legend_wicked_ways:0 "Caminhos Perversos"
 legend_wicked_ways_desc:0 "Os supostamente pecaminosos caminhos deste personagem têm levado a algumas dificuldades em espalhar uma palavra positiva sobre suas ações."
 legendary_adventurer:0 "Espírito Aventureiro"
 legendary_adventurer_desc:0 "Este personagem está preparado para abandonar seu reino e espalhar sua lenda no exterior."
 legendary_holy_site:0 "Local de Peregrinação Lendário"
 legendary_holy_site_desc:0 "Apesar de não ter significado para a fé, peregrinos estão se dirigindo a este condado devido a um conto lendário que o equipara a um lugar sagrado."
 legendary_item:0 "Terra Estrangeira"
 legendary_item_desc:0 "O governante local trouxe terra de uma distante terra mística, fazendo muitos acreditarem que a terra tem propriedades mágicas."
 legendary_item_personal:0 "Jornada Lendária"
 legendary_item_personal_desc:0 "Este personagem viajou para uma terra muito distante, espalhando contos de sua lenda ao longo do caminho."
 major_epidemic_treatment:0 "Prevenção de Epidemia Grave"
 major_epidemic_treatment_desc:0 "O médico deste personagem recentemente tomou medidas extremas para prevenir a propagação da epidemia iminente."
 major_epidemic_treatment_failed:0 "Prevenção de Epidemia Grave Malfeita"
 major_epidemic_treatment_failed_desc:0 "Medidas radicais foram tomadas por este personagem para prevenir a propagação de uma epidemia iminente, o que não apenas levou à estagnação econômica, mas também foi totalmente ineficaz na prevenção da propagação da doença."
 man_of_the_people:0 "Nobre Popular"
 man_of_the_people_desc:0 "Este personagem dispensa simpatia aos seus inferiores mesmo em meio a uma praga."
 mass_panic:0 "Pânico em Massa"
 mass_panic_desc:0 "Este baronato mergulhou em um pânico em massa ao saber de uma poderosa praga a caminho."
 medicating_with_leeches_bad:0 "Tratamento Malsucedido com Sanguessugas"
 medicating_with_leeches_bad_desc:0 "Este personagem tem se tratado com sanguessugas, deixando-os sonolentos e letárgicos, sem sinais reais de melhoria."
 medicating_with_leeches_good:0 "Tratamento Bem-sucedido com Sanguessugas"
 medicating_with_leeches_good_desc:0 "Este personagem tem se tratado com sanguessugas, melhorando sua resistência geral a doenças."
 miasma_ignored:0 "Miasma Rampante"
 miasma_ignored_desc:0 "O ar ruim preenche esta província, e a classe dominante recusou-se a plantar flora aromática para combatê-lo."
 minor_epidemic_treatment:0 "Prevenção de Epidemia Leve"
 minor_epidemic_treatment_desc:0 "O médico deste personagem recentemente prescreveu algumas medidas moderadas para prevenir a propagação da epidemia iminente."
 minor_epidemic_treatment_failed:0 "Prevenção de Epidemia Leve Malfeita"
 minor_epidemic_treatment_failed_desc:0 "Embora de natureza moderada, os esforços feitos por este personagem para retardar a propagação da praga iminente foram prejudiciais."
 minority_persecution_forbidden:0 "Perseguição às Minorias Proibida"
 minority_persecution_forbidden_desc:0 "Os habitantes deste local recentemente tentaram expulsar à força as minorias, mas essa prática foi proibida pela nobreza local."
 miracle_worker:0 "Trabalhador de Milagres"
 miracle_worker_desc:0 "Este personagem foi visto aparentemente curando os doentes com um simples toque!"
 mysterious_sword_giver:0 "Água Ilustre"
 mysterious_sword_giver_desc:0 "$mysterious_sword_giver_great_desc$"
 mysterious_sword_giver_great:0 "Água Mística"
 mysterious_sword_giver_great_desc:0 "Dizem que uma grande pessoa mística habita nas águas deste condado, concedendo destinos místicos a quem os encontrar."
 out_of_touch:0 "Desconectado da Realidade"
 out_of_touch_desc:0 "O 'Toque Real' deste personagem não curou os doentes, apenas os eliminou de vez!"
 overly_fragrant:0 "Excessivamente Fragrante"
 overly_fragrant_desc:0 "A aplicação exagerada de vários sachês de ervas por este personagem pode não protegê-los realmente contra doenças, mas certamente os faz #EMP se#! sentirem melhor — embora à custa dos olhos lacrimejantes dos que estão por perto."
 overly_protective:0 "Superprotetor"
 overly_protective_desc:0 "A paranoia deste personagem os levou a se preparar muito bem para uma possível praga iminente."
 pacified_flagellants:0 "Flagelantes Pacificados"
 pacified_flagellants_desc:0 "As pessoas deste baronato não são mais importunadas pelos pregadores apocalípticos, pois os flagelantes itinerantes foram pacificados."
 persecuted_flagellants:0 "Flagelantes Perseguidos"
 persecuted_flagellants_desc:0 "A autoflagelação tornou-se extremamente comum neste condado, e os senhores locais têm perseguido brutalmente a prática com pouco sucesso."
 persecuted_minorities_expelled:0 "Minorias Expulsas"
 persecuted_minorities_expelled_desc:0 "Minorias foram expulsas deste condado, reduzindo drasticamente o comércio."
 persecuted_minorities_financial_sanctuary:0 "Santuário Financeiro"
 persecuted_minorities_financial_sanctuary_desc:0 "Comerciantes estrangeiros e minoritários foram oferecidos um santuário contra perseguição neste condado."
 persecuted_minorities_protected:0 "Minorias Perseguidas Protegidas"
 persecuted_minorities_protected_desc:0 "Minorias que teriam sido perseguidas em seu lar foram oferecidas santuário aqui."
 pestilent_beaches:0 "Praias Pestilentas"
 pestilent_beaches_desc:0 "As praias desta província estão cheias de mortos infectados, uma visão verdadeiramente horrível de se ver."
 pets_eradicated:0 "Animais de Estimação Purificados"
 pets_eradicated_desc:0 "A cruel erradicação de animais de estimação locais enfureceu muitos aqui."
 plague_alms_donations:0 "Doações de Esmolas"
 plague_alms_donations_desc:0 "Os pobres e necessitados desta baronia se beneficiaram das doações de esmolas, elevando sua moral e dando-lhes um lugar para ficar."
 plague_animals_loose:0 "Bestas da Praga"
 plague_animals_loose_desc:0 "Este condado está repleto de animais que os habitantes locais acreditam serem propagadores de praga e doença."
 plague_crippling_sorrow:0 "Tristeza Debilitante"
 plague_crippling_sorrow_desc:0 "A cidade capital deste personagem foi devastada pela peste, e a pura morte e destruição que ela causou os levou a profundezas de desespero."
 plague_cult:0 "Culto Apocalíptico"
 plague_cult_desc:0 "Inúmeros homens e mulheres neste condado acreditam que a recente praga é um sinal do apocalipse, espalhando medo e histeria por todo o condado."
 plague_cult_embraced:0 "Abraço ao Culto da Peste"
 plague_cult_embraced_desc:0 "Um padre popular e carismático tem pregado crenças heréticas nesta província, afirmando que trarão alívio da praga."
 plague_cult_persecuted:0 "Perseguição ao Culto da Peste"
 plague_cult_persecuted_desc:0 "Um padre popular e carismático foi recentemente executado por propagar heresia."
 plague_determined_recover:0 "Determinado a se Recuperar"
 plague_determined_recover_desc:0 "Embora a cidade capital deste personagem tenha sido devastada pela peste, eles estão determinados a que ela se recupere."
 plague_insights_gained:0 "Percepções da Praga Obtidas"
 plague_insights_gained_desc:0 "A dissecação oportuna de um cadáver deu a este personagem uma preciosa visão sobre os efeitos da Peste Bubônica."
 plague_minorities_sanctuary:0 "Santuário para Minorias"
 plague_minorities_sanctuary_boosted:0 "Grande Santuário para Minorias"
 plague_minorities_sanctuary_boosted_desc:0 "$plague_minorities_sanctuary_desc$"
 plague_minorities_sanctuary_desc:0 "Minorias que foram recentemente expulsas de suas casas foram oferecidas um lar aqui. Infelizmente, essas minorias foram expulsas durante uma praga e muitas vezes carregam a doença de seu lar consigo."
 plague_new_capital:0 "A Nova Capital"
 plague_new_capital_desc:0 "Uma recente peste devastou as terras e tornou este condado o candidato ideal para se tornar a nova capital do reino."
 plague_tales:0 "Contos da Praga"
 plague_tales_desc:0 "A paranoia deste personagem sobre uma praga distante foi ao menos canalizada para o trabalho ativo de proteger seu próprio reino."
 plague_the_long_road:0 "O Longo Caminho"
 plague_the_long_road_desc:0 "A cidade capital deste personagem foi devastada pela peste, e eles estão comprometidos com sua recuperação apesar de seus obstáculos."
 pleas_ignored:0 "Pleitos Ignorados"
 pleas_ignored_desc:0 "Este personagem ignorou os apelos do clero e se tornou um inimigo deles como resultado."
 plight_ignored:0 "Sofrimento Ignorado"
 plight_ignored_desc:0 "A praga nascente desta província foi amplamente ignorada por seu governante."
 present_ruler:0 "Governante Presente"
 present_ruler_desc:0 "Este personagem é um governante ativo e visível, mesmo em tempos de praga e ruína."
 protected_jews:0 "Protetor dos Judeus"
 protected_jews_desc:0 "Este personagem tem sido um defensor da segurança e proteção dos viajantes judeus dentro de seu reino, ganhando grande renome dentro das comunidades judaicas."
 rampant_flagellants:0 "Flagelação Rampante"
 rampant_flagellants_desc:0 "Um culto de extremistas religiosos tem praticado autoflagelação neste condado, apesar das autoridades religiosas condenarem a prática."
 rampant_witch_trials:0 "Julgamentos da Praga"
 rampant_witch_trials_desc:0 "Os habitantes locais deste condado têm realizado julgamentos para grupos que culpam pela recente praga."
 rats_eradicated:0 "Ratos Erradicados"
 rats_eradicated_desc:0 "A erradicação prudente de qualquer rato avistado levou a uma província mais próspera."
 ravaged_by_plague:0 "Susceptível à Peste"
 ravaged_by_plague_desc:0 "As ruas movimentadas dos assentamentos deste condado o tornam uma vítima propícia para a disseminação de pestes."
 refugees_coddled:0 "Refugiados Mimados"
 refugees_coddled_desc:0 "Os refugiados que fogem para este baronato foram permitidos entrar sem impedimentos."
 refused_to_repent:0 "Recusou-se a se Arrepender"
 refused_to_repent_desc:0 "Os habitantes deste condado recentemente exigiram que um nobre fosse publicamente envergonhado por seu pecado, e essa exigência foi recusada."
 regular_checkups:0 "Exames Regulares"
 regular_checkups_desc:0 "A dosagem regular de medicamentos caros administrada pelos médicos deste personagem os mantém o mais saudável possível."
 respected_dead:0 "Mortos Respeitados"
 respected_dead_desc:0 "Esta província presta plenos respeitos aos seus mortos, mesmo em meio a uma praga."
 revenant_expelled:0 "Revenant Expulso"
 revenant_expelled_desc:0 "O caixão de uma pessoa nobre foi recentemente pregado, acalmando as preocupações dos habitantes locais sobre a possibilidade de um revenant ressurgir de sua sepultura."
 revenants_expelled:0 "Revenants Expulsos"
 revenants_expelled_desc:0 "Cada caixão neste condado foi pregado antes de entrar na terra, acalmando as preocupações dos habitantes locais sobre a possibilidade de um revenant ressurgir de sua sepultura."
 royal_cats:0 "Animal Real: Gatos"
 royal_cats_desc:0 "Este personagem declarou que os gatos são o animal real do reino, e prejudicá-los é considerado um crime contra o trono."
 royal_dogs:0 "Animal Real: Cães"
 royal_dogs_desc:0 "Este personagem declarou que os cães são o animal real do reino, e prejudicá-los é considerado um crime contra o trono."
 rumours_proliferated:0 "Rumores Proliferados"
 rumours_proliferated_desc:0 "As tentativas de sufocar rumores nesta província falharam, e muitos agora entram em pânico com a ideia de uma praga alcançar suas terras."
 rumours_stifled:0 "Rumores Abafados"
 rumours_stifled_desc:0 "O trabalho confiante em sufocar rumores de uma praga distante deixou este baronato um lugar mais calmo."
 sachet_protection:0 "Sachê Protetor"
 sachet_protection_desc:0 "O sachê de ervas aromáticas que este personagem carrega consigo pode não protegê-los realmente contra doenças, mas certamente os faz e faz aqueles próximos #EMP se#! sentirem mais seguros."
 shanty_towns:0 "Bairros de Lata"
 shanty_towns_desc:0 "A construção de vários bairros de lata na fronteira deste baronato permitiu que os refugiados fossem alojados de maneira semi-permanente."
 shattered_by_plague:0 "Propenso à Peste"
 shattered_by_plague_desc:0 "Este condado vibrante e densamente povoado está a um simples espirro de uma pandemia importante."
 strange_levity:0 "Humor Moroso"
 strange_levity_desc:0 "O humor deste personagem está melancólico desde que uma peste varreu estas terras."
 strict_coastal_quarantine:0 "Quarentena Costeira Estrita"
 strict_coastal_quarantine_desc:0 "Mercadores que entram nesta província pelo mar têm que se isolar por muitos dias antes de poderem vender suas mercadorias."
 struck_by_plague:0 "Em Risco de Peste"
 struck_by_plague_desc:0 "Este condado abriga assentamentos de tamanho suficiente para facilitar um pouco mais a disseminação de pestes."
 studying_ancient_cultures:0 "Estudando Culturas Antigas"
 studying_ancient_cultures_desc:0 "Este personagem recentemente explorou uma ruína antiga que pertencia a um povo antigo e foi iluminado pelo que descobriu lá."
 supplies_sent:0 "Suprimentos Enviados"
 supplies_sent_desc:0 "Suprimentos foram enviados aqui para combater a ameaça da praga local."
 trusted_ruler:0 "Governante Confiável"
 trusted_ruler_desc:0 "Os governantes locais têm a plena confiança de seu senhor feudal aqui."
 uncaring_ruler:0 "Governante Despreocupado"
 uncaring_ruler_desc:0 "Os habitantes deste baronato se sentem abandonados por seu governante."
 under_the_weather:0 "Abaixo do Tempo"
 under_the_weather_desc:0 "Este personagem está se sentindo um pouco debilitado."
 unrestrained_flagellants:0 "Flagelantes Descontrolados"
 unrestrained_flagellants_desc:0 "Tentativas fracassadas de apaziguar os flagelantes neste baronato fizeram com que seu número aumentasse."
 vectors_reduced:0 "Vetores de Doenças Reduzidos"
 vectors_reduced_desc:0 "A purga de grande parte da população local de ovelhas reduziu a propagação de uma praga."
 war_doctor:0 "Médico de Guerra"
 war_doctor_desc:0 "Um médico renomado e seus seguidores têm percorrido os campos de batalha, fornecendo cuidados de alta qualidade aos soldados doentes e enfermos."
 witch_trials_obstructed:0 "Julgamentos de Bruxas Obstruídos"
 witch_trials_obstructed_desc:0 "$witch_trials_slowed_desc$"
 witch_trials_slowed:0 "Julgamentos da Praga Penalizados"
 witch_trials_slowed_desc:0 "$rampant_witch_trials_desc$ A prática foi amplamente condenada pela nobreza."
