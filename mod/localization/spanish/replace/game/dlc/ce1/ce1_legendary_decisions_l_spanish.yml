l_spanish:
 ADVENTURER_KINGDOM_NAME:0 "Aventureiro [target_kingdom.GetNameNoTierNoTooltip]"
 CE1_ADVENTURER_CB_NAME:0 "Aventura Lendária"
 CE1_ADVENTURER_TRUCE:0 "$FP1_VARANGIAN_ADVENTURER_INDEPENDENCE_TRUCE_NAME$"
 CE1_ADVENTURER_WAR:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]Aventura Lendária [ATTACKER.GetPrimaryTitle.GetAdjective] por [TITLE.GetBaseName]"
 CE1_ADVENTURER_WAR_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 DEMAND_FEALTY_CB_NAME:0 "Exigir Fidelidade"
 DEMAND_FEALTY_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]Vassalização [ATTACKER.GetPrimaryTitle.GetAdjective] a [DEFENDER.GetName]"
 DEMAND_FEALTY_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective][DEFENDER.GetPrimaryTitle.GetName]"
 adventuring_host:0 "Anfitrião Aventureiro"
 any_drifting_duchy_tt:0 "Ou:\n$BULLET_WITH_TAB$Deve haver um [duchy|E] com algum progresso de [de_jure_drift|E] em direção ao seu [primary_title|E]\n$BULLET_WITH_TAB$Você possui um [title|E] de [duchy|E] adicional"
 any_drifting_empire_tt:0 "Ou:\n$BULLET_WITH_TAB$Deve haver um [empire|E] com algum progresso de [de_jure_drift|E] em direção ao seu [primary_title|E]\n$BULLET_WITH_TAB$Você possui um [title|E] de [empire|E] adicional"
 any_drifting_kingdom_tt:0 "Qualquer um dos seguintes deve ser verdadeiro:\n$BULLET_WITH_TAB$ Deve haver um [kingdom|E] com qualquer progresso de [de_jure_drift|E] em direção ao seu [primary_title|E]\n$BULLET_WITH_TAB$ Você possui um [title|E] de [kingdom|E] adicional"
 bonus_holy_war_tt:0 "Obtenha acesso a um [casus_belli|E] de guerra santa de nível de [kingdom|E] adicional"
 ce1_decision_events.1000.a.empire:0 "[kingdom_01.GetNameNoTooltip] agora é [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
 ce1_decision_events.1000.a.kingdom:0 "[kingdom_01.GetNameNoTooltip] não existe mais."
 ce1_decision_events.1000.b.empire:0 "[kingdom_02.GetNameNoTooltip] é uma ótima adição ao império."
 ce1_decision_events.1000.b.kingdom:0 "[kingdom_02.GetNameNoTooltip] não é um verdadeiro reino afinal."
 ce1_decision_events.1000.c.empire:0 "[kingdom_03.GetNameNoTooltip] é a melhor opção."
 ce1_decision_events.1000.c.kingdom:0 "[kingdom_03.GetNameNoTooltip] será [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] para sempre."
 ce1_decision_events.1000.d:0 "Eu escolho [kingdom_04.GetNameNoTooltip]."
 ce1_decision_events.1000.desc:0 "Como um [ROOT.Char.GetTitleAsNameNoTooltip|U] grandioso e renomado, mantenho muitos títulos dentro do meu reino. Embora nem todos eles sejam considerados parte de [ROOT.Char.GetPrimaryTitle.GetName], minha custódia sobre eles certamente deixou sua marca.\n\nCom meu status agora lendário, minha palavra tem muito peso e sinto que há poucos que ousariam questionar-me. Se eu dissesse que o dia era noite, seria registrado como tal. Da mesma forma, se eu dissesse que [kingdom_01.GetName] era parte legítima de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], assim seria escrito."
 ce1_decision_events.1000.e:0 "Não consigo pensar em uma adição melhor do que [kingdom_05.GetNameNoTooltip]."
 ce1_decision_events.1000.f:0 "[kingdom_06.GetNameNoTooltip], então."
 ce1_decision_events.1000.t:0 "Integração Lendária"
 ce1_decision_events.1010.a:0 "[duchy_01.GetNameNoTooltip] é [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] agora!"
 ce1_decision_events.1010.b:0 "[duchy_02.GetNameNoTooltip] é uma ótima adição ao meu reino."
 ce1_decision_events.1010.c:0 "[duchy_03.GetNameNoTooltip] é a melhor opção."
 ce1_decision_events.1010.d:0 "Eu escolho [duchy_04.GetNameNoTooltip]."
 ce1_decision_events.1010.desc:0 "Como um [ROOT.Char.GetTitleAsNameNoTooltip|U] lendariamente renomado, meu nome é celebrado por todo o meu reino e além.\n\nAlgumas terras, como [duchy_01.GetName], têm um futuro incerto, dentro ou fora de [ROOT.Char.GetPrimaryTitle.GetName], mas com minha popularidade em seu auge e o status desses títulos em fluxo, posso usar meu status lendário para resolver a questão de uma vez por todas."
 ce1_decision_events.1010.e:0 "Não consigo pensar em uma adição melhor do que [duchy_05.GetNameNoTooltip]."
 ce1_decision_events.1010.f:0 "[duchy_06.GetNameNoTooltip], então."
 ce1_decision_events.1010.t:0 "$ce1_decision_events.1000.t$"
 ce1_decision_events.1015.a:0 "[empire_01.GetNameNoTooltip] agora é [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
 ce1_decision_events.1015.b:0 "[empire_02.GetNameNoTooltip] é uma excelente adição ao império."
 ce1_decision_events.1015.c:0 "[empire_03.GetNameNoTooltip] é a melhor opção."
 ce1_decision_events.1015.d:0 "Escolho [empire_04.GetNameNoTooltip]."
 ce1_decision_events.1015.desc:0 "Como um grande e renomado [ROOT.Char.GetTitleAsNameNoTooltip|U], detenho muitos títulos dentro do meu reino. Embora nem todos sejam considerados parte de [ROOT.Char.GetPrimaryTitle.GetName], meu comando sobre eles certamente deixou sua marca.\n\nCom meu status agora lendário, minha palavra carrega enorme peso e sinto que poucos ousariam me questionar. Se eu dissesse que dia é noite, assim seria registrado. Da mesma forma, se eu declarasse que [empire_01.GetDefinitiveName] é parte legítima de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip], assim seria."
 ce1_decision_events.1015.e:0 "Não há adição mais digna do que [empire_05.GetNameNoTooltip]."
 ce1_decision_events.1015.f:0 "[empire_06.GetNameNoTooltip] será."
 ce1_decision_events.1015.t:0 "$ce1_decision_events.1000.t$"
 ce1_decision_events.1020.a:0 "Eu baixo minha espada."
 ce1_decision_events.1020.b:0 "Tire este herege da minha corte."
 ce1_decision_events.1020.conversion:0 "[liege_convert.GetFirstName] se Converte!"
 ce1_decision_events.1020.desc:0 "Contos de um guerreiro que resolve conflitos não pela espada, mas com suas palavras e razão tornaram-se tremendamente populares por todo o reino. Embora eu ore para [ROOT.Char.GetFaith.HighGodName|U] da maneira tradicional do [ROOT.Char.GetFaith.GetName], não posso deixar de ser de alguma forma tocado por este conto de fé do [legendary_character.GetFaith.GetName].\n\nAgora, meu reino está cheio de conversas sobre essa figura lendária e o poder da paz que sua fé tem proporcionado a [legendary_character.GetSheHe]. Sou abordado na corte por um pregador do [legendary_character.GetFaith.GetName] vindo de [legendary_character.GetPrimaryTitle.GetName], e esta pode ser minha chance de converter-me para uma vida mais pacífica."
 ce1_decision_events.1020.t:0 "Paz em Nosso Tempo"
 ce1_decision_events.1021.a:0 "A paz é a única opção."
 ce1_decision_events.1021.b:0 "A paz nunca foi uma opção."
 ce1_decision_events.1021.desc:0 "Contos de um guerreiro que resolve conflitos não pela espada, mas com suas palavras e razão tornaram-se tremendamente populares por todo o reino. [legendary_character.GetName|U] tocou os corações de muitos, incluindo [liege_convert.Custom2('MyCharacterIntroduction', ROOT.Char)]. [liege_convert.GetSheHe|U] abraçou a fé do [legendary_character.GetFaith.GetName] e abandonou todos os pensamentos de violência, exigindo que todos os seus súditos façam o mesmo."
 ce1_decision_events.1021.t:0 "Uma Conversão Lendária"
 control_the_entirety_of_title_empire_tt:0 "Você deve controlar a totalidade do [empire|E]"
 control_the_entirity_of_title_tt:0 "Você deve controlar a totalidade do [kingdom|E]"
 every_same_faith_county_in_realm:0 "Cada [county|E] em seu [realm|E] de sua [faith|E]"
 every_same_faith_vassal:0 "Cada [vassal|E] de sua [faith|E]"
 fifteen_year_vassalization_tt:0 "Você terá quinze anos de acesso ao [casus_belli|E] Exigir Fidelidade."
 launch_a_legendary_adventure:0 "Iniciar uma Aventura Lendária"
 launch_a_legendary_adventure_confirm:0 "A lenda nunca acaba!"
 launch_a_legendary_adventure_desc:0 "Parece que minha lenda por aqui chegou ao fim, mas ainda sinto o anseio por mais grandes feitos antes de partir deste mundo. Deve haver mais lá fora, e pretendo levar minha lenda para terras distantes e míticas!"
 launch_a_legendary_adventure_tooltip:0 "$launch_a_legendary_adventure_tt$"
 launch_a_legendary_adventure_tt:0 "Obtenha acesso único ao [casus_belli|E] Aventura Lendária, permitindo que você abandone seu reino atual e busque sua fortuna em um [kingdom|E] estrangeiro."
 leg_conv_valid_county:0 "Deve haver pelo menos um [county|E] em seu [realm|E] que não siga a sua [faith|E]."
 leg_demand_fealty_cb:0 "$DEMAND_FEALTY_CB_NAME$"
 leg_demand_fealty_v_attacker:0 "[defender.GetName] torna-se seu [vassal|E]"
 leg_demand_fealty_v_neutral:0 "[defender.GetName] torna-se [vassal|E] de [attacker.GetNamePossessive]"
 legend_demand_fealty:0 "Exigir Submissão Local"
 legend_demand_fealty_confirm:0 "Todos se curvarão diante de mim."
 legend_demand_fealty_desc:0 "Contos lendários de feitos heróicos me cercam. Eu sou mais do que um mero mortal agora, sou uma lenda viva e todos devem se curvar diante de mim."
 legend_demand_fealty_tooltip:0 "$fifteen_year_vassalization_tt$"
 legendary_adventure.troops_raised.tt:0 "Os Aventureiros Chegam"
 legendary_adventure:0 "Aventura Lendária"
 legendary_adventure_cb_tt:0 "Desbloqueado via decisão"
 legendary_conversion:0 "Evangelizar para o Reino"
 legendary_conversion_confirm:0 "A verdadeira fé prevalecerá."
 legendary_conversion_desc:0 "Um conto lendário de piedade e devoção agarrou os corações de todos no reino. Com um pouco de incentivo, os não crentes do reino podem ser encorajados a adorar do mesmo modo que eu."
 legendary_conversion_tooltip:0 "$legendary_conversion_tt$"
 legendary_conversion_tt:0 "Conversão imediata de vastas extensões do seu [realm|E] para a sua [faith|E]"
 legendary_holy_war:0 "Reafirmar a Missão Sagrada"
 legendary_holy_war_confirm:0 "A bandeira da retidão se ergue!"
 legendary_holy_war_desc:0 "Minha lenda de piedade chegou ao fim, e embora seja louvada por verdadeiros crentes, pouco fez para conquistar os corações dos não crentes. Devemos continuar a espalhar nossas formas pacíficas da única maneira que conhecemos: pela espada."
 legendary_holy_war_tooltip:0 "$bonus_holy_war_tt$"
 legendary_integration_d:0 "Expandir o Reino"
 legendary_integration_d_confirm:0 "Minha vontade seja feita."
 legendary_integration_d_desc:0 "Lendas são contadas por todo o reino que cimentam a autoridade do meu governo. Essa legitimidade recém-adquirida poderia ser utilizada para expandir o que é considerado o território central do meu reino e exigir a fidelidade perpétua de um duque historicamente estrangeiro."
 legendary_integration_d_tooltip:0 "$select_duchy_to_drift_tt$"
 legendary_integration_e:0 "Exaltar o Reino"
 legendary_integration_e_confirm:0 "Que minha vontade seja feita."
 legendary_integration_e_desc:0 "Lendas são contadas por todo o reino que consolidam a autoridade do meu governo. Minha palavra é absoluta, e se eu declarasse que dois impérios são um só, assim seria."
 legendary_integration_e_tooltip:0 "$select_empire_to_drift_tt$"
 legendary_integration_k:0 "Consolidar o Reino"
 legendary_integration_k_confirm:0 "Minha vontade seja feita."
 legendary_integration_k_desc:0 "Lendas são contadas por todo o reino que cimentam a autoridade do meu governo. Minha palavra é absoluta, e se eu declarasse que dois reinos são um só, assim seria."
 legendary_integration_k_tooltip:0 "$select_kingdom_to_drift_tt$"
 legendary_pacifism_spread:0 "Evangelizar o Pacifismo"
 legendary_pacifism_spread_confirm:0 "A paz prevalecerá!"
 legendary_pacifism_spread_desc:0 "Contos piedosos se espalharam muito além de minhas fronteiras e agarraram os corações dos não crentes. Nossos contos de paz e coexistência ameaçam desafiar os senhores da guerra briguentos em nossas fronteiras, e com um pequeno empurrão, esses selvagens certamente verão o valor de uma vida não violenta."
 legendary_pacifism_spread_tooltip:0 "$legendary_pacifism_spread_tt$"
 legendary_pacifism_spread_tt:0 "Todos os reinos vizinhos terão a oportunidade de converter-se à sua fé."
 mythical_ancestor_war:0 "$ANCESTOR_WAR_NAME$"
 non_true_faith_neighbour:0 "Você deve ter pelo menos um governante vizinho que não siga a sua [faith|E]."
 not_already_de_jure_your_title_tt:0 "O título ainda não é parte [de_jure|E] do seu [primary_title|E]"
 select_duchy_to_drift_tt:0 "Você pode selecionar um [duchy|E] para [de_jure_drift|E] permanentemente para o seu domínio. O ducado deve ser mantido por você ou ter algum progresso de deriva para um dos seus títulos mantidos."
 select_empire_to_drift_tt:0 "Você pode selecionar um [empire|E] para [de_jure_drift|E] permanentemente em seu reino. O império deve ser possuído por você ou ter algum progresso de deriva em direção a um dos seus títulos."
 select_kingdom_to_drift_tt:0 "Você pode selecionar um [kingdom|E] para [de_jure_drift|E] permanentemente para o seu domínio. O reino deve ser mantido por você ou ter algum progresso de deriva para um dos seus títulos mantidos."
 unlock_legendary_adventure_tt:0 "Ganhe acesso à [decision|E] de #EMP $launch_a_legendary_adventure$#!, permitindo que você abandone seu domínio e comece uma nova vida em um [kingdom|E] distante."
 unlock_legendary_conversion_tt:0 "Ganhe acesso à [decision|E] #EMP $legendary_conversion$#!, convertendo imediatamente vastas áreas do seu [realm|E] para a sua [faith|E]."
 unlock_legendary_fealty_tt:0 "Ganhe acesso à [decision|E] de #EMP $legend_demand_fealty$#!, permitindo que você subjugue qualquer reino próximo."
 unlock_legendary_holy_war_tt:0 "Ganhe acesso à [decision|E] #EMP $legendary_holy_war$#!, concedendo-lhe um uso adicional do [casus_belli|E] $major_religious_war$."
 unlock_legendary_integration_d_tt:0 "Ganhe acesso à [decision|E] de #EMP $legendary_integration_d$#!, permitindo que você [Concept('de_jure_drift', 'Transfira')|E] imediatamente um título de [duchy|E] para o seu domínio."
 unlock_legendary_integration_e_tt:0 "Obtenha acesso à [decision|E] #EMP $legendary_integration_e$#!, permitindo que você [Concept('de_jure_drift', 'Transfira')|E] imediatamente um [empire|E] em seu reino."
 unlock_legendary_integration_k_tt:0 "Ganhe acesso à [decision|E] #EMP $legendary_integration_k$#!, permitindo que você [Concept('de_jure_drift', 'Transfira')|E] imediatamente um título de [kingdom|E] para o seu domínio."
 unlock_legendary_pacifism_spread_tt:0 "Ganhe acesso à [decision|E] #EMP $legendary_pacifism_spread$#!, permitindo que você evangelize sua [faith|E] para reinos estrangeiros em suas fronteiras."
