l_spanish:
 book_is_gibberish:0 "O livro é completo nonsense"
 every_infected_courtier_or_guest:0 "Cada cortesão ou convidado infectado"
 every_uninfected_courtier_or_guest:0 "Cada cortesão ou convidado saudável"
 may_get_cool_book_tt:0 "Você pode obter um [artifact|E]"
 minor_epidemic_treatment.tt:0 "Você opta pelo tratamento seguro"
 missing_epidemic:0 "se contorcendo de agonia"
 moderate_epidemic_treatment.tt:0 "Você opta por um tratamento mais arriscado"
 mystic_epidemic_treatment.tt:0 "Você opta por um tratamento místico"
 pharmaceuticals:0 "Farmacologia Segundo [Select_CString( physician.IsFemale, 'a', 'o' )] [physician.GetFirstName]"
 pharmaceuticals_desc:0 "Um compêndio de remédios à base de ervas e tratamentos radicais para várias condições, mas com um foco particular nos efeitos de [epidemic_scope.GetName]."
 physician_epidemic_events.1000.a:0 "Talvez devêssemos simplesmente manter os corpos longe dos vivos."
 physician_epidemic_events.1000.b.failure:0 "O tratamento falha"
 physician_epidemic_events.1000.b.success:0 "O tratamento funciona"
 physician_epidemic_events.1000.b:0 "Devemos fazer tudo o que pudermos para acabar com esta praga."
 physician_epidemic_events.1000.c:0 "Não vamos profanar esses corpos."
 physician_epidemic_events.1000.desc:0 "Meu [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] e [zealous_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] estão à beira de se agarrarem pelo pescoço sobre como lidar com a propagação de [epidemic_scope.GetName].\n\n\"Eu sou um médico!\" Talāra insiste. \"Deixe-me purgar esta peste!\"\n\n\"Heresia!\" Mahakala rosna. \"Devemos ungir os mortos e conceder-lhes os devidos ritos [zealous_courtier.GetFaith.GetAdjective].\""
 physician_epidemic_events.1000.t:0 "Tratamento Inconvencional"
 physician_epidemic_events.1010.a:0 "Fechem as estradas. Quarentenem os doentes."
 physician_epidemic_events.1010.b:0 "Isso é muito extremo."
 physician_epidemic_events.1010.desc:0 "À medida que [epidemic_scope.GetName] se espalha, meu [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] propõe uma medida drástica: isolar os doentes. \"O miasma se agarra aos cadáveres,\" [physician.GetSheHe] alerta, \"e o ar ruim alimenta a peste.\"\n\n[physician.GetSheHe|U] deseja quarentena — ninguém entra ou sai das terras infectadas.\n\n\"Em tempos desesperadores, meu Kaiser, devemos fazer o que for necessário.\""
 physician_epidemic_events.1010.t:0 "Quarentena"
 physician_epidemic_events.1020.a:0 "Uma abordagem suave é a melhor."
 physician_epidemic_events.1020.b:0 "Medidas desesperadas são necessárias."
 physician_epidemic_events.1020.c:0 "Quaisquer práticas esotéricas que forem necessárias, nós faremos."
 physician_epidemic_events.1020.d:0 "A melhor ação é a inação."
 physician_epidemic_events.1020.end.desc:0 "\n\nEm última análise, a estratégia exata para prevenir a propagação desta praga é minha para decidir."
 physician_epidemic_events.1020.mystic_recommendation.desc:0 "Esta peste nos foi enviada por [physician.GetFaith.DevilName], e é apenas pensando fora da caixa da medicina tradicional que podemos esperar desfazer esta maldição!"
 physician_epidemic_events.1020.risky_recommendation.desc:0 "Esta peste corre o risco de desestabilizar todo o reino, nosso povo e colheitas serão dizimados se não tomarmos medidas radicais."
 physician_epidemic_events.1020.safe_recommendation.desc:0 "Minha recomendação como profissional é que adotemos uma abordagem suave para prevenir a propagação. Afinal, não queremos prejudicar a economia."
 physician_epidemic_events.1020.start.desc2:0 "como nunca vi antes."
 physician_epidemic_events.1020.start.desc:0 "A luz fraca e cintilante da enfermaria de [physician.GetFirstNamePossessive] ilumina a cena enquanto o médico traça um plano de ataque.\n\n\"Os afligidos por [epidemic.GetName] são\""
 physician_epidemic_events.1020.t:0 "[epidemic.GetNameNoTooltip|U]: Prevenção Precoce"
 physician_epidemic_events.1021.a:0 "Maravilhoso!"
 physician_epidemic_events.1021.desc:0 "Parece que a abordagem moderada provou ser bem-sucedida, com uma desaceleração na propagação dos sintomas da doença entre os plebeus. Embora o impacto seja bastante mínimo, pelo menos deve conceder mais tempo para trabalhar em uma solução mais permanente."
 physician_epidemic_events.1021.t:0 "Prevenção Precoce: Sucesso"
 physician_epidemic_events.1022.desc:0 "Não apenas as medidas preventivas de [physician.GetNamePossessive] falharam, elas parecem ter irritado os humores e tornado a corrupção tanto mais infecciosa quanto mais severa."
 physician_epidemic_events.1022.t:0 "Prevenção Precoce: Falha"
 physician_epidemic_events.1023.a:0 "$physician_epidemic_events.1021.a$"
 physician_epidemic_events.1023.desc:0 "A doença que estava prestes a se espalhar como fogo sobre papel em todo o meu reino diminuiu para uma rasteira. As medidas radicais propostas [Select_CString( physician.IsFemale, 'pela', 'pelo' )] [physician.GetFirstName] cobraram um preço na economia a curto prazo, mas [epidemic.GetName] pode não ser exatamente a ameaça que todos temíamos."
 physician_epidemic_events.1023.t:0 "$physician_epidemic_events.1021.t$"
 physician_epidemic_events.1024.desc:0 "Além de ter um tremendo impacto na economia, os tratamentos de [physician.GetNamePossessive] levaram a incontáveis vidas perdidas. Os camponeses, já enfraquecidos pelos estragos da doença, não puderam suportar o ataque de sangrias e sanguessugas. Essa perda de vidas parece ter trazido consigo um aumento na propagação da doença, pois o miasma adere aos cadáveres e infesta os pulmões dos saudáveis."
 physician_epidemic_events.1024.t:0 "$physician_epidemic_events.1022.t$"
 physician_epidemic_events.1025.a:0 "$physician_epidemic_events.1021.a$"
 physician_epidemic_events.1025.desc:0 "Considerados heréticos por muitos, os tratamentos de [physician.GetNamePossessive] parecem ter funcionado muito bem em retardar a propagação da doença. Regimes de exercícios para suar a corrupção, sangrias para liberar os humores ruins e limpeza minuciosa para evitar o acúmulo de miasma parecem ser exatamente o necessário para deter [epidemic.GetName]!"
 physician_epidemic_events.1025.t:0 "$physician_epidemic_events.1021.t$"
 physician_epidemic_events.1026.desc:0 "Assumi um risco ao consentir nos tratamentos heréticos propostos por [physician.GetName], uma decisão que parece ter desagradado profundamente a [ROOT.Char.GetFaith.HighGodName]. Agora estou sendo punido no sangue do meu povo, já que os tratamentos de [physician.GetNamePossessiveNoTooltip] estão deixando os doentes e cansados exaustos e sem sangue nas ruas. 'Remédios' não terrenos e não comprovados são enfiados garganta abaixo antes que seu sangue seja drenado e seus corpos exauridos. Uma visão horrível para qualquer um presenciar e uma maneira verdadeiramente grotesca de tratar os moribundos."
 physician_epidemic_events.1026.t:0 "$physician_epidemic_events.1022.t$"
 physician_epidemic_events.1030.a.failure:0 "O livro é um absurdo"
 physician_epidemic_events.1030.a.success:0 "Um grande livro farmacêutico é compilado"
 physician_epidemic_events.1030.a:0 "Muito bem."
 physician_epidemic_events.1030.b:0 "Isso parece ser um desperdício de dinheiro."
 physician_epidemic_events.1030.desc:0 "Meu médico da corte se aproxima, livro em mãos e olhos brilhando de determinação.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetTitleAsNameNoTooltip|U], estudei muitas das chamadas curas para [epidemic_scope.GetName]. Com o seu patrocínio, eu poderia compilar um livro com minhas descobertas — um presente para as futuras gerações.\""
 physician_epidemic_events.1030.t:0 "Um Compendium Farmacêutico"
 physician_epidemic_events.1040.a:0 "Que sintam o toque real."
 physician_epidemic_events.1040.b:0 "Deixem os sacerdotes cuidarem dos pobres."
 physician_epidemic_events.1040.desc:0 "Meu médico da corte se curva profundamente antes de falar.\n\n\"Meu Duque, cuidar dos doentes tem esgotado nossos esforços — e o povo sussurra que a coroa não se importa mais. Se vossa graça abençoasse moedas e as distribuísse pessoalmente, isso talvez acalmasse sua raiva. Dizem que o toque real traz cura.\""
 physician_epidemic_events.1040.t:0 "Espectro"
 physician_epidemic_events.1050.a:0 "[physician.GetSheHe|U] tem minha permissão para continuar."
 physician_epidemic_events.1050.b:0 "Você serve apenas #EMP a mim#!"
 physician_epidemic_events.1050.desc:0 "Meus guardas arrastam [physician.Custom2('MyCharacterIntroduction', ROOT.Char)] até mim acorrentado. [physician.GetSheHe] tem tratado soldados feridos — aliados e inimigos — após cada batalha.\n\nEles chamam o abrigo [physician.GetHerHim] de \"Estalagem [ROOT.Char.GetPrimaryTitle.GetAdjective|U]\", e meus comandantes exigem que seja fechada. Mas Edaraja apenas diz: \"Eles sangram e sofrem como os nossos. Quem sou eu para afastá-los?\""
 physician_epidemic_events.1050.t:0 "A Estalagem [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip|U]"
 physician_epidemic_events.1060.a:0 "Tire todos eles imediatamente!"
 physician_epidemic_events.1060.b:0 "Que sugestão grosseira."
 physician_epidemic_events.1060.desc:0 "[gross_sick_person.Custom2('MyCharacterIntroduction', ROOT.Char)|U] jaz pálid[Select_CString( gross_sick_person.IsFemale, 'a', 'o' )] e arfando. A peste invadiu meus próprios salões.\n\n[physician.Custom2('MyCharacterIntroduction', ROOT.Char)|U] insiste em uma ação drástica: \"Os que já estão doentes devem ser removidos, meu soberano — ou corremos o risco de perder a todos.\" \n\nÉ um pensamento cruel. Mas seria mais cruel esperar?"
 physician_epidemic_events.1060.t:0 "Um Banimento Desesperado"
 rival_heretical_physician:0 "[CHARACTER.GetShortUIName|U] ficou enfurecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] com [TARGET_CHARACTER.GetShortUIName] quando um tratamento herético para a praga foi permitido"
 rival_heretical_physician_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] ficou enfurecid[Select_CString( TARGET_CHARACTER.IsFemale, 'a', 'o' )] com [CHARACTER.GetShortUIName] quando um tratamento herético para a praga foi permitido"
 rival_prevented_from_protecting_sick:0 "[TARGET_CHARACTER.GetShortUIName|U] impediu [CHARACTER.GetShortUIName] de fornecer tratamento médico para combatentes hostis"
 rival_prevented_from_protecting_sick_corresponding:0 "[CHARACTER.GetShortUIName|U] impediu [TARGET_CHARACTER.GetShortUIName] de fornecer tratamento médico para combatentes hostis"
