 steal_herd_ongoing.1001.a:0 "Alguém para testar minha coragem!"
 steal_herd_ongoing.1001.a_win:0 "Você impressiona [target_knight.GetFirstNameNoTooltip] com suas habilidades de combate"
 steal_herd_ongoing.1001.b:0 "Apreciando o domínio de [target.GetFirstNamePossessiveNoTooltip], claro."
 steal_herd_ongoing.1001.b_win:0 "[target_knight.GetFirstNameNoTooltip] aprecia seu sentimento"
 steal_herd_ongoing.1001.c:0 "Apreciando uma bebida! Vai se juntar?"
 steal_herd_ongoing.1001.c_win:0 "Você e [target_knight.GetFirstNameNoTooltip] bebem até o amanhecer"
 steal_herd_ongoing.1001.c_win_big:0 "Você convence [target_knight.GetFirstNameNoTooltip] embriagado(a) a se juntar à sua causa"
 steal_herd_ongoing.1001.d:0 "Nada, vou seguir meu caminho."
 steal_herd_ongoing.1001.desc:0 "Para roubar o rebanho de [target.GetTitledFirstNamePossessive], preciso conhecer a terra e o povo [target.GetHerHim]. Então, começo a observar quais pastos estão perto de sua casa, e quais são distantes e solitários.\n\nObservando as elevações próximas ao [target.GetCapitalLocation.GetTitle.GetName], guerreiros liderados por um[Select_CString( target_knight.IsFemale, 'a', '' )] [target_knight.GetWomanMan] a cavalo se aproximam do meu séquito por trás. \"Qual é o seu negócio aqui?\" [Select_CString( target_knight.IsFemale, 'A', 'O' )] líder deles, [target_knight.GetFirstName], pergunta."
 steal_herd_ongoing.1001.duel_desc:0 "Você tenta desviar a atenção de [target_knight.GetFirstNamePossessiveNoTooltip]"
 steal_herd_ongoing.1001.lose:0 "[target_knight.GetFirstNameNoTooltip] te vence"
 steal_herd_ongoing.1001.t:0 "$steal_herd_event_title$ Guarda"
 steal_herd_ongoing.1002.a:0 "Vai lá, [chosen_agent.GetFirstNameNoTooltip], ajude [target.GetSheHe]!"
 steal_herd_ongoing.1002.b:0 "E eu sei exatamente o que você deve dizer..."
 steal_herd_ongoing.1002.b_tt:0 "Você ajuda [chosen_agent.GetFirstName] com o disfarce [chosen_agent.GetHerHim]"
 steal_herd_ongoing.1002.c:0 "Na verdade, nunca minda."
 steal_herd_ongoing.1002.desc:0 "[chosen_agent.GetName] me diz que os pastores de [target.GetTitledFirstNamePossessive] frequentemente falham em guiar uma única ovelha em seu rebanho.\n\n\"Por que você não se veste de pastor? Vai até [target.GetFirstNameNoTooltip], e oferece sua 'ajuda' aos pastores incompetentes [target.GetHerHim]\", sugiro a [chosen_agent.GetFirstNameNoTooltip]. [chosen_agent.GetSheHe|U] me olha com preocupação, e suspira."
 steal_herd_ongoing.1002.duel_desc:0 "[chosen_agent.GetFirstName] se faz passar por um pastor"
 steal_herd_ongoing.1002.lose:0 "[chosen_agent.GetSheHe|U] não consegue convencer com o visual"
 steal_herd_ongoing.1002.t:0 "$steal_herd_event_title$ Pastor Disfarçado"
 steal_herd_ongoing.1002.win:0 "O disfarce [chosen_agent.GetHerHim] é convincente"
 steal_herd_outcome.1001.a:0 "Estou grato pela sua 'generosidade', [target.GetFirstNameNoTooltip]!"
 steal_herd_outcome.1001.desc:0 "M[Select_CString( courtier.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))], [courtier.GetName], entra no acampamento com orgulho. Seguindo [courtier.GetSheHe], um pastor desconhecido guia o rebanho em minha direção.\n\n\"Do acampamento de [target.GetTitledFirstName]!\" [courtier.GetSheHe|U] exclama. Ao redirecionar a condução do pastor com meus novos animais, não consigo deixar de sorrir de forma travessa. Meu rebanho cresce cada vez mais forte, e a um custo quase nulo para mim."
 steal_herd_outcome.1001.t:0 "$steal_herd_event_title$ Sucesso!"
 steal_herd_outcome.1002.a:0 "Que você viva eternamente em [ROOT.Char.GetFaith.NegativeAfterLife], [owner.GetFirstNameNoTooltip]!"
 steal_herd_outcome.1002.desc:0 "[spymaster.GetName] vem até mim com notícias graves. \"[ROOT.Char.GetFirstName], alguns dos animais que mantivemos no pátio desapareceram.\"\n\n[spymaster.GetSheHe|U] limpa a garganta, \"Após uma investigação minuciosa, parece que [owner.GetName] enviou alguns capangas para 'recuperar' o rebanho, e convenceu o pastor de que era por sua ordem.\""
 steal_herd_outcome.1002.desc_monies:0 "\n\nApós ouvir essa revelação, percebo um baú, antes meio cheio de joias finas, agora empobrecido. Sabendo que o criminoso é o mesmo, suspiro."
 steal_herd_outcome.1002.t:0 "$steal_herd_event_title$ Rebanho Roubado!"
 steal_herd_outcome.1003.a:0 "[courtier.GetFirstNameNoTooltip], pode explicar isso novamente?"
 steal_herd_outcome.1003.a_desc:0 "Você tenta roubar mais do [herd|E] de [target.GetFirstNamePossessiveNoTooltip]"
 steal_herd_outcome.1003.b:0 "Eu procuraria nos cofres de [target.GetFirstNameNoTooltip]."
 steal_herd_outcome.1003.b_desc:0 "Você tenta roubar ouro de [target.GetFirstNameNoTooltip]"
 steal_herd_outcome.1003.c:0 "[target.GetPrimarySpouse.GetFirstName] também pertence a [target.GetFirstNameNoTooltip], por enquanto."
 steal_herd_outcome.1003.c_tt:0 "Início de um [scheme|E] de [GetScheme('seduce').GetTypeName] contra [target.GetPrimarySpouse.GetFirstName] com uma #p Chance de Sucesso# aumentada!"
 steal_herd_outcome.1003.d:0 "A vida [target.GetHerHim], talvez?"
 steal_herd_outcome.1003.d_tt:0 "Início de um [scheme|E] de [GetScheme('murder').GetTypeName] contra [target.GetFirstName] com uma #p Chance de Sucesso# aumentada!"
 steal_herd_outcome.1003.desc:0 "[courtier.GetSheHe|U] explora os detalhes do nosso roubo, incluindo nossa maestria sobre as defesas de [target.GetFirstNamePossessiveNoTooltip]. Como infiltramos o acampamento de [target.GetFirstNamePossessiveNoTooltip] com tanta facilidade, me pergunto o que mais posso tirar das mãos [target.GetHerHim]..."
 steal_herd_outcome.1003.e:0 "Já peguei o suficiente por agora."
 steal_herd_outcome.1003.lose:0 "Você não conseguiu roubar mais"
 steal_herd_outcome.1003.win:0 "Seu roubo continua"
 steal_herd_outcome.2001.a:0 "[target.GetFirstNameNoTooltip] deve ter proteção divina..."
 steal_herd_outcome.2001.desc:0 "Meu plano de roubar o rebanho de [target.GetTitledFirstName] foi realizado como planejado, mas m[Select_CString( courtier.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))] [courtier.GetTitledFirstName] retorna de mãos vazias, trazendo nem mesmo um pedaço de lã para exibir seu triunfo.\n\n\"[owner.GetFirstNameNoTooltip], sinto muito. [target.GetFirstNameNoTooltip] estava nos perseguindo.\" [courtier.GetFirstNameNoTooltip] suspira. \"Felizmente, escapamos antes que os cavaleiros [target.GetHerHim] nos alcançassem.\""
 steal_herd_outcome.2001.t:0 "$steal_herd_event_title$ Falha"
 steal_herd_outcome.2002.a:0 "Como pudemos ser tão incompetentes?!"
 steal_herd_outcome.2002.desc:0 "[courtier.GetName] me leva para fora, e para meu desgosto, um rebanho está desaparecido!\n\n[courtier.GetFirstNameNoTooltip] explica que falhamos em roubar o rebanho de [target.GetTitledFirstName]. Mas, em vez de deixar nossos cavaleiros escaparem, [target.GetSheHe] imediatamente tomou sua retribuição, enviando um bando atrás de [courtier.GetFirstNameNoTooltip] e dos outros envolvidos, levando-os diretamente para os meus pastos. Os cavaleiros [target.GetHerHim] levaram ovelhas e outros animais, e partiram rapidamente."
 steal_herd_outcome.2003.a:0 "Seus fracassos me beneficiam hoje, [owner.GetFirstNameNoTooltip]!"
 steal_herd_outcome.2003.desc:0 "Uma confusão começa, e [courtier.GetName] se aproxima com ela. [courtier.GetSheHe|U] sorri, gesticulando para eu entrar no pátio.\n\nLá fora, [courtier.GetSheHe] aponta para um rebanho de ovelhas e cavalos, guiado por um dos meus cavaleiros. [courtier.GetFirstNameNoTooltip] me observa atentamente. \"A ousadia desse [owner.GetFirstNameNoTooltip]!\" [courtier.GetSheHe] afirma. \"[owner.GetSheHe|U] tentou minar #italic você#!, e pegar seu rebanho! Felizmente, [courtier.GetFaith.HighGodName] tinha outros planos. Esses animais pertencem a [owner.GetFirstNameNoTooltip] [owner.GetSheHe] mesmo.\""
 steal_herd_outcome.2003.t:0 "O Rebanho de [owner.GetTitledFirstName]"
 steal_herd_vassal_tt:0 "Cada [powerful_vassal|E] de [target.GetShortUIName]:\n$EFFECT_LIST_BULLET$Perde #n 15#! de [opinion|E] de #V você#! #weak (-0.60/ano) (Roubou o rebanho do meu senhor feudal)#!"
 stole_lieges_herd:0 "Roubou o Rebanho do Meu Senhor Feudal"
 stole_my_herd:0 "Roubou Meu Rebanho"
 stole_my_herd_crime:0 "Roubou Meu Rebanho"
 stole_vassals_herd:0 "Roubou o Rebanho do Meu Vassalo"
