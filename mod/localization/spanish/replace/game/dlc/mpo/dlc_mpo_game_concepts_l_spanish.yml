l_spanish:
 game_concept_absolute_nomadic:0 "Absoluta"
 game_concept_absolute_nomadic_desc:0 "$game_concept_absolute_nomadic$ é o segundo nível mais alto de [nomadic_authority|E]. Nesse nível, [migration|E] pode ter como alvo [titles|E] [de_jure|E] de [empire|E] dentro da [Concept('the_great_steppe', 'Grande Estepe')|E].\n\n[rulers|E] [Concept('independent', 'Independentes')|E] podem se estabelecer fora da estepe usando a [decision|E] #high $settle_the_steppe_decision$#!"
 game_concept_confederate:0 "Confederado"
 game_concept_confederate_desc:0 "Um [ruler|E] que está em uma [confederation|E]. Eles irão automaticamente se unir às [wars|E] defensivas de seus companheiros Confederados, e estão restritos de atacar ou [Concept('raiding', 'Saquear')|E] uns aos outros."
 game_concept_confederates:0 "Confederados"
 game_concept_confederation:0 "Confederação"
 game_concept_confederation_desc:0 "Uma relação que une [rulers|E] [Concept('tribal', 'Tribais')|E] ou [Concept('nomadic', 'Nômades')|E] em defesa mútua, similar a uma [alliance|E]. Formada através da [decision|E] #high $call_for_confederation_decision$#!, uma confederação exige que seus membros participem das [wars|E] defensivas uns dos outros. Confederações são visíveis na aba de Diplomacia.\n\nOs [confederates|E] também não podem atacar ou [Concept('raid', 'Saquear')|E] uns aos outros. Eles estão restritos de altos níveis da [tribal_authority|E] e [nomadic_authority|E], e não podem criar novos [titles|E].\n\n[confederates|E] podem usar a [decision|E] #high $leave_confederation_decision$#! ou [migrate|E] para se tornar [independent|E]. Se uma confederação ficar com apenas um membro, ela é destruída."
 game_concept_confederation_government:0 "Governo de Confederação"
 game_concept_confederations:0 "Confederações"
 game_concept_county_fertility:0 "Fertilidade do Condado"
 game_concept_county_fertility_desc:0 "$game_concept_county_fertility$ existe em [counties|E] localizados dentro da [the_great_steppe|E], e pode ser pastoreada pelos [rulers|E] [GetGovernment( 'nomad_government' ).GetName] para aumentar seu [herd|E].\n\nA Fertilidade de um Condado representa a qualidade de seus pastos.\n\nA Fertilidade se estabiliza ao redor do [fertility_equilibrium|E], permitindo que Governantes Nômades com um grande [domain_limit|E] sustentem o crescimento de seu Rebanho. A Fertilidade é afetada pelas [steppe_seasons|E] e é lentamente reabastecida pelos [herders|E].\n\nQuando a fertilidade de um [realm|E] está baixa, é um sinal para [migrate|E].\n\n[county_control|E] desacelera a taxa em que a Fertilidade cresce em uma porcentagem igual ao controle atual."
 game_concept_county_fertility_i:0 "@county_fertility_icon!"
 game_concept_disobedience_i:0 "@disobedience_icon!"
 game_concept_disobedient:0 "Desobediente"
 game_concept_disobedient_desc:0 "$game_concept_obedience_desc$"
 game_concept_domain_fertility:0 "Fertilidade do Domínio"
 game_concept_domain_fertility_desc:0 "A Fertilidade do Domínio é a [county_fertility|E] total de todos os seus [counties|E] possuídos."
 game_concept_dominance:0 "$game_concept_nomadic_authority$"
 game_concept_dominance_expansion:0 "Expansão de Domínio"
 game_concept_dominate_title:0 "Dominar Título"
 game_concept_dominate_title_desc:0 "[nomads|E] que desejam obter um [title|E] de [title_tier|E] superior sem [migrate|E] têm como alternativa lutar contra os habitantes locais da região pelo título, desde que possuam o nível adequado de [dominance|E].\n\nSe houver alguém detendo o título em questão, será iniciada uma guerra contra esse alvo para usurpar o título. Se não houver ninguém o segurando, o agressor lutará contra todos os que não forem [tributary|E] nem [ally|E] dentro da área [de_jure|E] do título.\n\nEm caso de vitória, o agressor obterá o título em questão, e todos os defensores se tornarão seus Tributários. Em caso de derrota, o agressor pagará [gold_i][gold|E] ao defensor e perderá uma quantidade significativa de [dread_i][dread|E].\n\nSe quem toma a [decision|E] já possuir toda a área De Jure, receberá o título imediatamente, pois não haverá defensores a enfrentar."
 game_concept_domination_war:0 "Guerra de Dominação"
 game_concept_equilibrium:0 "Equilíbrio"
 game_concept_expand_dominance:0 "Expandir Domínio"
 game_concept_expand_dominance_desc:0 "Uma guerra especial disponível para [rulers|E] [GetGovernment( 'nomad_government' ).GetName], seja por uma área dentro de suas terras [de_jure|E], ou para expandir sua área [de_jure|E] para novas fronteiras.\n\nTodos os Governantes Nômades com um título de [title_tier|E] [duchy|E] ou superior podem iniciar essa guerra dentro de seu De Jure. Em caso de vitória, tentarão [vassalize|E] o defensor ou forçá-lo a se tornar um [tributary|E], ou conquistar suas terras por completo se o inimigo possuir terras fora da região alvo da guerra.\n\nPara expandir seu domínio para terras estrangeiras, um Governante Nômade precisa ter um título de [kingdom|E] ou superior. Em caso de vitória, ele ainda tentará Vassalizar, Tornar Tributário ou conquistar as terras, mas essas terras também passarão imediatamente a fazer parte do título De Jure principal do governante Nômade."
 game_concept_fertility_equilibrium:0 "Equilíbrio de Fertilidade"
 game_concept_fertility_equilibrium_desc:0 "O Equilíbrio de Fertilidade é uma previsão de quão fértil o [county|E] se tornará ao longo de um período mais longo. É um valor para o qual a [county_fertility|E] se aproximará com o tempo.\n\nSe a [county_fertility|E] atual estiver abaixo do Equilíbrio, ela crescerá, e declinará se estiver acima dele.\n\nO Equilíbrio de Fertilidade e a velocidade da mudança são principalmente dependentes da razão entre os modificadores de Crescimento e Consumo para o [county|E]. Se tanto o Crescimento quanto o Consumo forem relativamente pequenos, qualquer mudança terá um efeito muito maior sobre o Equilíbrio."
 game_concept_gurkhan:0 "Grão-Cã"
 game_concept_gurkhan_desc:0 "A maior ameaça da [the_great_steppe|E]. O $game_concept_gurkhan$ é o [ruler|E] [GetGovernment( 'nomad_government' ).GetName] com o maior [herd|E] de toda a região, sendo um poderoso aliado ou um inimigo temível.\n\nApenas o $game_concept_gurkhan$ pode alcançar o nível mais alto de [nomadic_authority|E], o que permite que ele se torne o [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] e o marca como alvo."
 game_concept_herd:0 "Rebanho"
 game_concept_herd_desc:0 "$game_concept_herd$ representa o povo e o rebanho de animais, como cavalos, ovelhas e cabras, de um [ruler|E] [GetGovernment( 'nomad_government' ).GetName].\n\nPode ser obtido mantendo [counties|E] com alta [county_fertility|E], [vassals|E] ou [tributaries|E]. [traditions|E] Culturais, [dynasty_perks|E], [legitimacy|E], e certos [yurt|E] [yurt_buildings|E] podem oferecer bônus para o ganho de $game_concept_herd$.\n\nUma fração do Rebanho é convertida em [horde|E] quando um governante levanta seus [armies|E], e pode ser transformada em [men_at_arms|E] a um custo reduzido. Uma vez que esses exércitos são dissolvidos, a horda restante será convertida de volta em rebanho.\n\nO Rebanho fornece uma pequena quantidade de [gold|E], e também pode ser usado como moeda para tomar certas [decisions|E] ou aumentar a aceitação de [migration|E]."
 game_concept_herd_i:0 "@herd_icon!"
 game_concept_herder:0 "Pastor"
 game_concept_herder_desc:0 "Reinos de pastores são removidos de todos os aspectos da governança. Eles não comandam [armies|E], não possuem [buildings|E], não criam [alliances|E], nem declaram [wars|E]. Quando os [nomads|E] [migrate|E] para uma [holding|E], pastores lentamente reabastecem a [county_fertility|E] local devido ao seu rebanho menor.\n\nEles são intimidados por [rulers|E] [nomad|E] adequados e imediatamente entregam suas terras quando desafiados."
 game_concept_herder_holding:0 "Assentamento Pastoril"
 game_concept_herder_holding_desc:0 "Um $game_concept_herder_holding$ é o menor dos [holding_types|E]. Representa a presença de [herders|E] na área e fornece bônus para a [county_fertility|E]."
 game_concept_herder_i:0 "@government_type_herder!"
 game_concept_herders:0 "Pastores"
 game_concept_herders_desc:0 "$game_concept_herder_desc$"
 game_concept_high_nomadic:0 "Alta"
 game_concept_high_nomadic_desc:0 "$game_concept_high_nomadic$ é o nível intermediário de [nomadic_authority|E]. Nesse nível, [migration|E] pode ter como alvo [titles|E] [de_jure|E] de [kingdom|E] dentro da [Concept('the_great_steppe', 'Grande Estepe')|E], e o senhor feudal pode [retract|E] os vassalos de um [vassal|E]."
 game_concept_horde:0 "Horda Nômade"
 game_concept_horde_desc:0 "A $game_concept_horde$ é a representação da força militar de um [ruler|E] [GetGovernment( 'nomad_government' ).GetName]. É obtida como uma fração do seu [herd|E], e só aparece quando o [ruler|E] levanta seus [armies|E].\n\nEles são convertidos em [GetMaA('nomadic_riders').GetName] que podem ser atualizados para outros [men_at_arms|E] pagando um custo de [gold|E].\n\nCertas [traditions|E] Culturais, benefícios de legado da [dynasty|E] e [yurt_buildings|E] podem aumentar a taxa de conversão."
 game_concept_kurultai:0 "Curiltai"
 game_concept_kurultai_1_desc:0 "$game_concept_kurultai_desc$"
 game_concept_kurultai_2_desc:0 "$game_concept_kurultai_desc$"
 game_concept_kurultai_3_desc:0 "$game_concept_kurultai_desc$"
 game_concept_kurultai_4_desc:0 "$game_concept_kurultai_desc$"
 game_concept_kurultai_desc:0 "O Curiltai substitui o [council|E] para o [nomadic_government|E]. Os membros do Curiltai estão entre a elite do reino e devem ser ou apaziguados ou forçados à [obedience|E] para garantir uma [succession|E] tranquila.\n\nApós um evento de sucessão caótica, eles podem roubar parte do [herd|E], abandonar seu novo [liege|E], e ganhar uma [claim|E] sobre o [title|E] do [realm|E]."
 game_concept_kurultai_member:0 "Membro do Curiltai"
 game_concept_kurultai_members:0 "Membros do Curiltai"
 game_concept_kurultais:0 "Curiltais"
 game_concept_limited_nomadic:0 "Limitado"
 game_concept_limited_nomadic_desc:0 "$game_concept_limited_nomadic$ é o segundo nível mais baixo de [nomadic_authority|E]. [migration|E] pode ter como alvo [titles|E] [de_jure|E] de [duchy|E] dentro da [Concept('the_great_steppe', 'Grande Estepe')|E], [titles|E] podem ser revogados e o senhor feudal agora pode [imprison|E] [characters|E] em seu [realm|E].\n\nPode usar a [decision|E] #V $step_away_from_the_steppe_decision$#!"
 game_concept_migrate:0 "Migrar"
 game_concept_migrate_desc:0 "$game_concept_migration_desc$"
 game_concept_migrated:0 "Migrado"
 game_concept_migrates:0 "Migra"
 game_concept_migrating:0 "Migrando"
 game_concept_migration:0 "Migração"
 game_concept_migration_desc:0 "$game_concept_migration$ é essencial para os [nomads|E]. Quando a [county_fertility|E] em seus [realms|E] está baixa, eles frequentemente se movem em busca de pastos mais verdes.\n\nA migração só pode ter como alvo [titles|E] [de_jure|E], e os [title_tiers|E] acessíveis são limitados pela [nomadic_authority|E] do [ruler|E].\n\nUma proposta será enviada ao Nômade com o maior [herd|E] na área desejada, e ele poderá decidir se deixará suas terras de boa vontade ou se irá à guerra para defendê-las.\n\n[herders|E] sempre abandonarão suas terras, pois não têm meios para se defender."
 game_concept_nerge:0 "Nerge"
 game_concept_nerge_desc:0 "O Nerge é um tipo especial de [GetActivityType('activity_hunt').GetName] que pode ser realizado por [rulers|E] [GetGovernment( 'nomad_government' ).GetName]. Em vez de caçar um único animal, é uma caçada em larga escala onde centenas, senão milhares, de animais são abatidos.\n\nEm vez de usar a [hunt_success_chance|E] normal, ele utiliza uma pontuação de Resultado do Nerge baseada na quantidade de animais mortos, que define o tipo de recompensa que o [activity_host_short|E] e os [activity_guests_short|E] receberão.\n\nUm Nerge bem-sucedido geralmente concede:\n$BULLET_WITH_TAB$[legitimacy_i][legitimacy|E]\n$BULLET_WITH_TAB$[prestige_i][prestige|E]\n$BULLET_WITH_TAB$[dread_i][dread|E]\n$BULLET_WITH_TAB$[gold_i][gold|E]\nE em alguns casos pode conceder:\n$BULLET_WITH_TAB$[martial_i][martial|E]\n$BULLET_WITH_TAB$[command_modifier_i][commander_trait|E] ou [trait_level_track_xp|E]"
 game_concept_nerge_outcome:0 "Resultado do Nerge"
 game_concept_nomad:0 "Nômade"
 game_concept_nomad_desc:0 "$game_concept_nomadic_desc$"
 game_concept_nomad_i:0 "@government_type_nomad!"
 game_concept_nomadic:0 "Nômade"
 game_concept_nomadic_authority:0 "Dominância"
 game_concept_nomadic_authority_desc:0 "$game_concept_nomadic_authority$ representa o poder projetado de um [ruler|E] [GetGovernment( 'nomad_government' ).GetName]. Pode ser aumentada pelo tamanho do [herd|E] e desbloqueia opções adicionais de [migration|E].\n\nExistem cinco níveis diferentes de $game_concept_nomadic_authority$: [unruly_nomadic|E], [limited_nomadic|E], [high_nomadic|E], [absolute_nomadic|E] e [unrestricted_nomadic|E].\n\n#weak O último nível só pode ser alcançado por um governante por partida.#!"
 game_concept_nomadic_desc:0 "Os [rulers|E] nômades pastoreiam a [county_fertility|E] para fazer crescer seu [herd|E]. Eles podem usar o Rebanho como [horde|E], que pode ser aprimorada para [men_at_arms|E]. Eles possuem um [yurt|E].\n\nOs nômades podem [migrate|E] para encontrar terras mais férteis, embora grandes [realms|E] nômades possam fazer crescer seu rebanho através de [tributaries|E] ou alcançando um alto [fertility_equilibrium|E].\n\nNômades têm um máximo mais alto de [dread|E]."
 game_concept_nomadic_government:0 "Governo Nômade"
 game_concept_nomadic_holding:0 "Assentamento Nômade"
 game_concept_nomadic_holding_desc:0 "$game_concept_nomadic_holdings$ representa a existência de uma [yurt|E] no mapa. São os [holding_types|E] usados por [rulers|E] [GetGovernment( 'nomad_government' ).GetName] e fornecem pequenas quantidades de [county_control|E] e [county_opinion|E]."
 game_concept_nomadic_holdings:0 "Assentamento Nômade"
 game_concept_nomadic_holdings_desc:0 "$game_concept_nomadic_holding_desc$"
 game_concept_nomads:0 "Nômades"
 game_concept_nomads_desc:0 "$game_concept_nomadic_desc$"
 game_concept_obedience:0 "Obediência"
 game_concept_obedience_desc:0 "Nos [realms|E] [GetGovernment( 'nomad_government' ).GetName], a obediência determina a lealdade de um [character|E] ao seu [liege|E], [suzerain|E] ou ao dono de sua [court|E]. Personagens só podem ser obedientes a um único [ruler|E] por vez.\n\nPersonagens obedientes têm menos chance de participar de [hostile_schemes|E], entrar em [wars|E] ou se juntar as [factions|E] contra seu senhor feudal. Eles sempre apoiarão as preferências de seu senhor feudal durante a [succession|E] e não pressionarão suas [claims|E] contra ele. [tributaries|E] não obedientes podem tentar se libertar.\n\nQuando a pontuação de um personagem ultrapassa o [obedience_threshold|E], ele se torna obediente."
 game_concept_obedience_i:0 "@obedience_icon!"
 game_concept_obedience_threshold:0 "Limite de Obediência"
 game_concept_obedience_threshold_desc:0 "O $game_concept_obedience_threshold$ é a pontuação que os [characters|E] precisam alcançar para serem considerados [obedient|E].\n\nO limite é afetado por uma série de fatores: se são [close_family|E] do [overlord|E], se são o [primary_heir|E], seu nível de [friendship|E] ou [rivalry|E], seus [traits|E] e se estão ou não empregados em seu [kurultai|E] ou [court|E]. [children|E] têm mais chance de serem obedientes do que adultos.\n\n[rulers|E] [GetGovernment( 'nomad_government' ).GetName] podem usar a [decision|E] #EMP $mpo_desperate_stance_decision$#! para tornar todos obedientes, a [intent|E] #EMP $impose_obedience_intent$#! durante uma [GetActivityType( 'activity_hunt').GetName] para mirar em um personagem, e a [character_interaction|E] #EMP $mpo_demand_obedience_interaction$#! se tiverem [dread|E] suficiente."
 game_concept_obedient:0 "Obediente"
 game_concept_obedient_desc:0 "$game_concept_obedience_desc$"
 game_concept_overlord:0 "Soberano"
 game_concept_overlord_desc:0 "Um $game_concept_overlord$ é um [ruler|E] ao qual outro governante jurou obediência, seja como [vassal|E] ou como [tributary|E]. Tanto [suzerains|E] quanto [lieges|E] são considerados soberanos."
 game_concept_overlord_possessive:0 "do Soberano"
 game_concept_paiza:0 "Paiza"
 game_concept_paiza_desc:0 "Paiza, ou gerege, é uma pequena placa metálica emitida por [characters|E] poderosos nas [the_great_steppe|E], que estende o poder dos Cãs ao portador.\n\nMecanicamente, são [artifacts|E] que um [GetGovernment( 'nomad_government' ).GetName] governante poderoso concede a seus favoritos por meio da [character_interaction|E] #V$mpo_interaction_grant_paiza$#!.\nApós tomar a [decision|E] #V $mpo_establish_paiza_system_decision$#!, você terá acesso à [decision|E] #V $mpo_call_for_merchants_decision$#!, que permite envolver-se em comércio com povos sedentários, melhorado por vários [internal_upgrades|E] no [yurt_buildings|E] [GetDomicileBuilding('trade_yurt_01').GetName].\n\nNo entanto, [characters|E] portando [artifacts|E] Paiza com o nome de um [gurkhan|E] vivo têm acesso às [decision|E] #V $mpo_abuse_authority_paiza_decision$#! e à [character_interaction|E] #V $mpo_interaction_leverage_khan_authority$#!\n\n#weak Pelo poder do Céu Eterno. Pela proteção da Boa Fortuna Imperial. Um édito do Cã; qualquer pessoa que não o respeite será punida, morrerá.#"
 game_concept_raid_intent:0 "Intenção de Saque"
 game_concept_raid_intent_desc:0 "Uma $game_concept_raid_intent$ pode modificar os tipos de recompensas obtidas em um [raid|E], a velocidade de movimento do exército ou a capacidade de [loot|E]. Além do saque comum por [gold|E] e [prestige|E], há alternativas como tentar destruir [buildings|E] ou aumentar a chance de [imprison|E] [characters|E]."
 game_concept_raid_intents:0 "Intenções de Saque"
 game_concept_raid_intents_desc:0 "$game_concept_raid_intent_desc$"
 game_concept_seasonal_prediction:0 "Previsão Sazonal"
 game_concept_seasonal_prediction_desc:0 "Um habilidoso $court_position_court_astrologer$ pode prever a próxima [steppe_season|E] em uma região, oferecendo informações úteis ao seu senhor feudal para planejar seus próximos movimentos."
 game_concept_settlement_issue:0 "Questão de Colonização"
 game_concept_settlement_issue_desc:0 "Questões de Colonização são tarefas dadas a um [ruler|E] [nomad|E] após concluir uma [migration|E] para novas terras. Elas oferecem a oportunidade de resolver conflitos e aumentar o [county_control|E] local no novo [domain|E].\n\nEssas questões continuarão a ocorrer nos primeiros anos após a migração, enquanto o condado estiver com baixo controle."
 game_concept_settlement_issue_tier:0 "Nível da Questão de Colonização"
 game_concept_settlement_issue_tier_desc:0 "Cada [settlement_issue|E] possui um Nível de Questão de Colonização, que reflete as recompensas gerais da questão quando resolvida com sucesso. Resolver uma questão de nível mais alto normalmente concede mais recompensas além de [county_control|E]."
 game_concept_situation:0 "Situação"
 game_concept_situation_catalyst:0 "Catalisador de Situação"
 game_concept_situation_catalyst_catalyst:0 "Catalisador"
 game_concept_situation_catalyst_catalysts:0 "Catalisadores"
 game_concept_situation_catalyst_desc:0 "Certas [situation_situations|E] passam entre [situation_phases|E] quando um $game_concept_situation_catalyst$ ocorre.\n\nUma lista de quais $game_concept_situation_catalyst$ são importantes em cada $game_concept_situation_phase$ pode ser encontrada na janela $game_concept_situation$."
 game_concept_situation_desc:0 "$game_concept_situation_situations$ são assuntos de médio a longo prazo que envolvem personagens dentro de uma [situation_sub_region|E] geográfica, alternando entre diferentes [situation_phases|E]."
 game_concept_situation_participant_group:0 "Grupo Participante"
 game_concept_situation_participant_group_desc:0 "Grupos Participantes dentro de uma [situation|E] são uma coleção de personagens que compartilham os mesmos efeitos durante cada [situation_phase|E]."
 game_concept_situation_participant_groups:0 "Grupos de Participantes"
 game_concept_situation_phase:0 "Fase da Situação"
 game_concept_situation_phase_desc:0 "Cada $game_concept_situation_phase$ possui seus próprios modificadores e condições que afetam os personagens envolvidos.\n\nAlgumas $game_concept_situation_phases$ são ativadas por condições específicas, enquanto outras apenas seguem a passagem do tempo."
 game_concept_situation_phases:0 "Fases da Situação"
 game_concept_situation_phases_desc:0 "$game_concept_situation_phase_desc$"
 game_concept_situation_situations:0 "Situações"
 game_concept_situation_sub_region:0 "Região da Situação"
 game_concept_situation_sub_region_desc:0 "[situation_situations|E] podem ter mais de uma região, cada uma com [situation_phases|E] independentes."
 game_concept_situation_sub_regions:0 "Regiões da Situação"
 game_concept_situation_sub_regions_desc:0 "$game_concept_situation_sub_region_desc$"
 game_concept_steppe_season:0 "Estação da Estepe"
 game_concept_steppe_season_desc:0 "Uma $game_concept_steppe_season$ representa o clima atual da [the_great_steppe|E] e os efeitos que isso tem na [county_fertility|E], bem como nas ações disponíveis para os [rulers|E] envolvidos na [situation|E].\n\nAs $game_concept_steppe_seasons$ são independentes em cada região, e governantes [GetGovernment( 'nomad_government' ).GetName] podem querer se mover para aquelas com Estações ativas positivas.\n\nOcasionalmente, a mesma Estação pode ocorrer em mais de uma [situation_sub_region|E] ao mesmo tempo."
 game_concept_steppe_seasons:0 "Estações da Estepe"
 game_concept_steppe_seasons_desc:0 "$game_concept_steppe_season_desc$"
 game_concept_subject:0 "Súdito"
 game_concept_subject_desc:0 "Um $game_concept_subject$ é qualquer [ruler|E] que jurou lealdade a outro governante. Eles podem ter diversos tipos, como [vassals|E] ou [tributaries|E], cada um com suas próprias especificações."
 game_concept_subjects:0 "Súditos"
 game_concept_subjects_desc:0 "$game_concept_subject_desc$"
 game_concept_suzerain:0 "Suserano"
 game_concept_suzerain_desc:0 "Um $game_concept_suzerain$ é um [ruler|E] com pelo menos um [tributary|E]. Suseranos podem ser eles próprios Tributários de outro [ruler|E], mas nunca devem ser [vassals|E]."
 game_concept_suzerain_possessive:0 "do Suserano"
 game_concept_suzerains:0 "Suseranos"
 game_concept_suzerains_desc:0 "$game_concept_suzerain_desc$"
 game_concept_the_great_steppe:0 "A Grande Estepe"
 game_concept_the_great_steppe_desc:0 "$game_concept_the_great_steppe$ representa o mar interminável de grama da Estepe Eurasiática, as condições climáticas que a moldam, e é dividida em três regiões: Ocidental, Central e Oriental.\n\nAs diferentes [steppe_seasons|E] representam esses eventos positivos e adversos, oferecendo oportunidades para ações especiais disponíveis apenas nesse período e modificando a [county_fertility|E] de cada região.\n\nApenas [rulers|E] [GetGovernment( 'nomad_government' ).GetName] e [herder|E] participam dessa [situation|E], e o [gurkhan|E] representa o governante mais poderoso de toda a região."
 game_concept_tributaries:0 "Tributários"
 game_concept_tributaries_desc:0 "$game_concept_tributary_desc$"
 game_concept_tributary:0 "Tributário"
 game_concept_tributary_desc:0 "Um $game_concept_tributary$ é um [ruler|E] que firmou um acordo com outro governante, seu [suzerain|E].\n\nO $game_concept_tributary$ fornece um tributo periódico na forma de [herd|E], [taxes|E], [prestige|E] ou até [piety|E] (dependendo do tipo), e, em troca, recebe uma [truce|E] com o $game_concept_suzerain$.\n\nTributários são uma forma mais flexível de súdito que não pode entrar em [factions|E], mas pode se libertar caso suas exigências não sejam atendidas.\n\nSe o Suserano deixar de ser [landed|E] ou de [migrate|E], os Tributários se libertarão após um curto período."
 game_concept_tributary_possessive:0 "do Tributário"
 game_concept_unmanaged_holding:0 "Posse Não Administrada"
 game_concept_unmanaged_holdings:0 "Posse Não Administrada"
 game_concept_unmanaged_holdings_desc:0 "São [holdings|E] desativadas que não contam para o seu [domain_limit|E]."
 game_concept_unrestricted_nomadic:0 "Irrestrita"
 game_concept_unrestricted_nomadic_desc:0 "$game_concept_unrestricted_nomadic$ é o nível mais alto de [nomadic_authority|E]. Esse nível só pode ser alcançado por um único [character|E] em toda a partida, e ele se tornará o [GetTrait('greatest_of_khans').GetName( GetNullCharacter )].\n\n[rulers|E] [Concept('independent', 'Independentes')|E] podem usar as [decisions|E] #high $mpo_become_greatest_of_khans_decision$#! e #high $mpo_gok_world_conquest_decision$#!"
 game_concept_unruly_nomadic:0 "Nômades Indisciplinados"
 game_concept_unruly_nomadic_desc:0 "$game_concept_unruly_nomadic$ é o nível mais baixo de [nomadic_authority|E]. Nesse nível, [migration|E] só pode ter como alvo [titles|E] [de_jure|E] de [county|E] dentro da [Concept('the_great_steppe', 'Grande Estepe')|E] e [characters|E] não podem ser [Concept('imprisoned', 'Aprisionados')|E]."
 game_concept_yurt:0 "Capital Nômade"
 game_concept_yurt_building:0 "Edifício da Capital Nômade"
 game_concept_yurt_building_desc:0 "$game_concept_yurt_buildings_desc$"
 game_concept_yurt_buildings:0 "Edifícios da Capital Nômade"
 game_concept_yurt_buildings_desc:0 "$game_concept_yurt_buildings$ são melhorias únicas para a $game_concept_yurt$.\n\nMecanicamente, são [domicile_buildings|E] — embora muitas representem costumes sociais ou apenas áreas de foco da tribo $game_concept_nomad$, em vez de estruturas literais.\n\nOs bônus que podem conceder incluem:\n$EFFECT_LIST_BULLET$ Desbloqueio de [court_positions|E], [decisions|E] nômades e [character_interaction|E]s\n$EFFECT_LIST_BULLET$ Vários bônus para [herd|E] e [county_fertility|E], incluindo especializações por [terrain|E]\n$EFFECT_LIST_BULLET$ Desbloqueio e aprimoramento de [men_at_arms|E] nômades e aumento da força da [horde|E]\n$EFFECT_LIST_BULLET$ Bônus únicos de [culture_tradition|E] nômade\n$EFFECT_LIST_BULLET$ Formas de administrar seus [vassals|E] e [tributaries|E], além de influenciar [characters|E] em sua corte\n$EFFECT_LIST_BULLET$ Bônus de [kurultai|E] e [obedience|E]"
 game_concept_yurt_desc:0 "$game_concept_yurts$ são conjuntos móveis de tendas, gado, pessoas e cavalos. Eles podem ir de algumas ovelhas a uma horda estrondosa.\n\n[rulers|E] [GetGovernment( 'nomad_government' ).GetName] têm uma $game_concept_yurt$ que desenvolvem por meio de [yurt_buildings|E] e levam consigo ao [migrate|E]. Eles não podem construir [buildings|E] normais nas [holdings|E].\n\nA $game_concept_yurt$ possui uma [faith|E] e [culture|E] que representam a maioria do povo migrante, podendo ser diferentes das do [ruler|E].\n\nToda sua [court|E] viaja com eles, bem como sua [family|E], [kurultai|E] e [knights|E]."
 game_concept_yurts:0 "Capitais Nômades"
 game_concept_yurts_desc:0 "$game_concept_yurt_desc$"
 obedience_threshold_value:0 "[obedience_threshold|E]:"
 obedience_value:0 "[obedience|E]:"
