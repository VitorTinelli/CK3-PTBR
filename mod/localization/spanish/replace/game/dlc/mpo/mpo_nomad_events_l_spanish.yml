 mpo_assertion_modifier_desc:0 "Este personagem se impôs contra um conselheiro sedutor."
 mpo_bountiful_camels_modifier:0 "Rebanhos Abundantes de Camelos"
 mpo_bountiful_camels_modifier_desc:0 "O povo deste governante está bem-adaptado à vida no deserto, com muitos rebanhos de camelos."
 mpo_bountiful_horses_modifier:0 "Cavalos Bem Alimentados"
 mpo_bountiful_horses_modifier_desc:0 "Os anfitriões deste nômade montam corcéis fortes e rápidos, com muitos reservas."
 mpo_bountiful_hunting_cheaper_hunts_desc:0 "Custo da [GetActivityType( 'activity_hunt' ).GetName]: @gold_icon!#P -20%#!"
 mpo_bountiful_hunting_cheaper_hunts_tt:0 "Custo da [GetActivityType( 'activity_hunt' ).GetName]: @gold_icon!#P -20%#! por #high 10 anos#!"
 mpo_bountiful_hunting_modifier:0 "Acampamentos de Caça"
 mpo_bountiful_hunting_modifier_desc:0 "Os nômades deste governante se sustentam principalmente caçando animais selvagens."
 mpo_bountiful_sheep_cheaper_feasts.desc:0 "Custo da [GetActivityType( 'activity_feast' ).GetName] $feast_type_tsagaan_sar$: @gold_icon!#P -20%#!"
 mpo_bountiful_sheep_cheaper_feasts_tt:0 "Custo da [GetActivityType( 'activity_feast' ).GetName] $feast_type_tsagaan_sar$: @gold_icon!#P -20%#! por #high 10 anos#!"
 mpo_bountiful_sheep_modifier:0 "Rebanhos Abundantes de Ovelhas"
 mpo_bountiful_sheep_modifier_desc:0 "Lã, leite de ovelha e carne de cordeiro são algumas das principais preocupações deste governante e seu povo."
 mpo_eyes_everywhere_modifier:0 "Olhos em Todo Lugar"
 mpo_eyes_everywhere_modifier_desc:0 "Este personagem decidiu dedicar todos os esforços para impedir tramas contra si."
 mpo_good_memory_modifier:0 "Coração Aquecido"
 mpo_good_memory_modifier_desc:0 "As boas memórias enchem este personagem de alegria."
 mpo_hardened_modifier:0 "Resignado(a)"
 mpo_hardened_modifier_desc:0 "Este personagem aprendeu que a nostalgia pode ser perigosa."
 mpo_honorable_ruler:0 "Pastor Honrado"
 mpo_honorable_ruler_desc:0 "Este personagem devolveu um rebanho perdido ao seu verdadeiro dono."
 mpo_imprisoned_assassin_modifier:0 "Assassinos Aprisionados"
 mpo_imprisoned_assassin_modifier_desc:0 "Este personagem conseguiu aprisionar seu assassino."
 mpo_no_omens_modifier:0 "Destino Domado"
 mpo_no_omens_modifier_desc:0 "Este personagem não deixa sonhos decidirem seu destino."
 mpo_nomad_events.1080.a.flavor:0 "A força de [escaped_warrior.GetFirstNamePossessiveNoTooltip] não se deteriorará sob um #EMP cangue#!. Não, isso fortalecerá minha horda!"
 mpo_nomad_events.1080.a:0 "Este fugitivo parece habilidoso e capaz..."
 mpo_nomad_events.1080.b.flavor:0 "Fugitivo ou não, [Select_CString( neighbor_ruler.IsFemale, 'a', 'o' )] [neighbor_ruler.GetTitleAsNameNoTooltip] invadiu aqui — e deve ser enviado de volta em agonia!"
 mpo_nomad_events.1080.b:0 "Afugente [neighbor_ruler.GetFirstNameNoTooltip] com uma chuva de flechas."
 mpo_nomad_events.1080.c:0 "Nós vamos perseguir o cabrito fugitivo."
 mpo_nomad_events.1080.criminal:0 "criminoso"
 mpo_nomad_events.1080.desc_1:0 "saúda [neighbor_ruler.GetFirstNameNoTooltip], \"Caçamos um"
 mpo_nomad_events.1080.desc_2:0 "que fugiu para seu [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l]. Mesmo usando o [Glossary( 'cangue', 'CANGUE_GLOSS' )] de punição, este [escaped_warrior.GetFirstName] sobe como uma cabra; mesmo sem dormir, [escaped_warrior.GetSheHe] engana meus rastreadores.\n\n\"Nossa presa está em seu território, [ROOT.Char.GetTitleAsNameNoTooltip] — você irá caçar?\""
 mpo_nomad_events.1080.desc_high_intro:0 "[neighbor_ruler.GetTitledFirstName], cuja tenda se encontra nas proximidades de [neighbor_county.GetBaseNameNoTier], percorre minhas terras sem convite. E, como lobos para a caça, meus cavaleiros cercam o bando armado [neighbor_ruler.GetHerHim].\n\n\"Grande [ROOT.Char.GetTitleAsNameNoTooltip]!\""
 mpo_nomad_events.1080.desc_low_intro:0 "[neighbor_ruler.GetTitledFirstName], que governa em [neighbor_county.GetNameNoTier], percorre minhas terras. Com gritos de alarme ecoando, reúno meus [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] e encontro o bando armado [neighbor_ruler.GetHerHim].\n\n\"Você — [ROOT.Char.GetTitleAsNameNoTooltip]!\""
 mpo_nomad_events.1080.t:0 "O Usador do Cangue"
 mpo_nomad_events.1091.a.flavor:0 "[Select_CString( widow.IsFemale, 'A esposa', 'O marido' )] [Select_CString( dead_husband.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l], #EMP uma deusa#!, merece cada pedaço e resto da minha devoção."
 mpo_nomad_events.1091.a:0 "#EMP Finalmente ― [widow.GetSheHe] é minha!#!"
 mpo_nomad_events.1091.b.flavor:0 "...e a mim. Este casamento será vantajoso para mim."
 mpo_nomad_events.1091.b:0 "Nosso casamento agradará [widow_relative.GetTitledFirstNameNoTooltip]..."
 mpo_nomad_events.1091.c:0 "Eu terei #EMP todas#! as coisas boas [Select_CString( dead_husband.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l], sim."
 mpo_nomad_events.1091.d:0 "Minha família protege os seus. Sempre."
 mpo_nomad_events.1091.desc.concubine:0 "Nossos costumes me obrigariam a tomar s[Select_CString( widow.IsFemale, 'ua', 'eu' )] [widow.GetTitledFirstNameNoTooltip] como minha mulher."
 mpo_nomad_events.1091.desc.marry:0 "Nossos costumes me obrigariam a casar com s[Select_CString( widow.IsFemale, 'ua', 'eu' )] [widow.GetTitledFirstNameNoTooltip]."
 mpo_nomad_events.1091.desc:0 "M[Select_CString( dead_husband.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] está mort[Select_CString( dead_husband.IsFemale, 'a', 'o' )]. [dead_husband.GetFirstName] pertence ao vento. A viúva [dead_husband.GetHerHim], [widow.GetName], parte de nossa família desde o momento em que [widow.GetSheHe] entrou na tenda d[Select_CString( dead_husband.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l], chora e lamenta.\n\nO coração de [widow.GetFirstNamePossessiveNoTooltip|U] pode pertencer à [ROOT.Char.GetHouse.GetName], mas o lugar [widow.GetHerHim] conosco, a proteção [widow.GetHerHim], agora depende de mim... do meu dever de assumir o que m[Select_CString( dead_husband.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_husband'))|l] deixou para trás.\n\n"
 mpo_nomad_events.1091.e:0 "Agora você implora com os cães, [widow.GetWomanMan]."
 mpo_nomad_events.1091.t:0 "O Destino da Viúva"
 mpo_nomad_events.1100.a.flavor:0 "Conhecer um lugar é conhecer toda a abundância que ele oferece, prontamente e em segredo."
 mpo_nomad_events.1100.a:0 "Onde há [capital_province.GetTerrain.GetNameNoTooltip|l], somos mestres."
 mpo_nomad_events.1100.b:0 "Meu povo não tem amor por este lugar."
 mpo_nomad_events.1100.c.camel:0 "Troque outros animais por camelos!"
 mpo_nomad_events.1100.c.horse:0 "Uma terra para cavalos."
 mpo_nomad_events.1100.c.hunting:0 "Aqui, caçamos ou morremos de fome."
 mpo_nomad_events.1100.c.sheep:0 "Uma boa temporada de cordeiros está por vir."
 mpo_nomad_events.1100.desc.camel:0 "Mas, na secura e no calor, pouco cresce. Dos quatro animais de nosso rebanho, apenas um se dá bem com o vazio e relincha pela vontade de vagar pelas [capital_province.GetTerrain.GetNameNoTooltip|l] — o camelo.\n\nEnquanto nossos outros animais pastam nos melhores pontos, os camelos percorrem toda a [capital_province.GetTitle.GetNameNoTierNoTooltip]."
 mpo_nomad_events.1100.desc.horses:0 "Pela vontade de [ROOT.Char.GetFaith.HighGodNamePossessive], tal lugar foi reservado para os cavalos: um mar sereno de grama, onde pernas rápidas e almas nobres servem nossos cavalos com prazer.\n\nAqui, meus [ROOT.Char.GetCulture.GetCollectiveNoun] pastam seus corcéis até que todos estejam gordos e felizes."
 mpo_nomad_events.1100.desc.hunting:0 "Mas aqui a vegetação cresce muito: há pouca pastagem aberta. Nosso gado fica magro, enquanto meus [ROOT.Char.GetCulture.GetCollectiveNoun] recorrem aos arcos e aves de caça para sua alimentação.\n\nComerciamos peles de cervo em lugar da lã de ovelha."
 mpo_nomad_events.1100.desc.sheep:0 "O solo aqui é árido e rochoso. Sua alimentação grosseira não é do gosto de nossos cavalos e bois, mas para as ovelhas e cabras — isso é um paraíso.\n\nLeite e lã chegam aos meus [ROOT.Char.GetCulture.GetCollectiveNoun] em abundância."
 mpo_nomad_events.1100.desc:0 "Rebanhos de gado, pastores e cavaleiros perambulam pela [capital_province.GetTerrain.GetNameNoTooltip|l] ao redor de minha grande tenda. Estamos utilizando esta terra, [capital_province.GetTitle.GetNameNoTier], para cada arbusto e lâmina de grama que ela tem.\n\n"
 mpo_nomad_events.1100.t:0 "As Pastagens de [capital_province.GetTitle.GetNameNoTierNoTooltip]"
 mpo_nomad_events.1110.a:0 "Construa barcos para explorar essas ricas águas."
 mpo_nomad_events.1110.a_repeat:0 "Nossos barcos nos servirão bem."
 mpo_nomad_events.1110.b:0 "Vou #EMP afogar#! [Select_CString( dummy_gender.IsFemale, 'a', 'o' )] [dummy_gender.GetWomanMan] que sair do seu cavalo!"
 mpo_nomad_events.1110.c:0 "Redes, teçam muitas redes."
 mpo_nomad_events.1110.desc:0 "logo além do meu acampamento em [capital_province.GetTitle.GetNameNoTier].\n\nMeus [ROOT.Char.GetCulture.GetCollectiveNoun] ficam nas águas rasas, cantando vitória sobre um peixe tão longo quanto uma espada, com escamas marrom-dunas brilhando ao sol. Um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] local segura a criatura alta, se vangloriando da captura.\n\nO grande peixe é prova de que há boa carne a ser conquistada — caso meus [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] passem seus dias caçando criaturas que pastam na água."
 mpo_nomad_events.1110.desc_lake:0 "As águas de um calmo e azul lago descansam"
 mpo_nomad_events.1110.desc_river:0 "As águas de um rio verde cantam"
 mpo_nomad_events.1110.desc_sea:0 "As águas de um vasto mar se quebram na costa"
 mpo_nomad_events.1110.t:0 "Pastagens Úmidas"
 mpo_nomad_events.1120.a.flavor:0 "Nenhum predador em [capital_county.GetNameNoTierNoTooltip] poderia escapar dos meus exércitos..."
 mpo_nomad_events.1120.a:0 "Lobos? Bah! Meus cavaleiros são incontáveis."
 mpo_nomad_events.1120.b.failure:0 "Na confusão, os lobos escapam"
 mpo_nomad_events.1120.b.success:0 "Nenhum lobo é mais rápido que o seu cavalo"
 mpo_nomad_events.1120.b:0 "Cavalgue rápido — cerquem-nas!"
 mpo_nomad_events.1120.c.failure:0 "Suas flechas atingem cavalos e ovelhas"
 mpo_nomad_events.1120.c.success:0 "Suas flechas acabam com as bestas"
 mpo_nomad_events.1120.c:0 "#EMP Flechas! Flechas!#! Vou pegar suas peles!"
 mpo_nomad_events.1120.d.flavor:0 "Nesta estação, não há cordeiros a serem roubados: apenas os velhos e os doentes. Não devemos negar esses aos lobos."
 mpo_nomad_events.1120.d:0 "Parem! Eles só estão selecionando os fracos da manada."
 mpo_nomad_events.1120.desc:0 "O vento gelado não uiva sozinho em [capital_province.GetTitle.GetNameNoTier]. Não neste inverno maligno. Não nesta noite.\n\n#EMP \"Lobos! Lobos entre as ovelhas!\"#! vêm os gritos, enquanto meus cavaleiros e eu subimos apressados em nossas selas.\n\nAs ovelhas, reunidas, emitem sons horríveis de terror. Bestas de pelagem escura puxam suas pernas, seus pescoços, e se afastam para a selva sem luz."
 mpo_nomad_events.1120.t:0 "Lobos do Inverno"
 mpo_restless_for_migration_modifier:0 "Bando Inquieto"
 mpo_restless_for_migration_modifier_desc:0 "Cada um dos cavaleiros deste nômade está pronto para atacar novas terras."
 nomad_events.0001.a:0 "[achmach_scope.GetSheHe|U] está fora."
 nomad_events.0001.b:0 "Palavras de um rival invejoso."
 nomad_events.0001.desc:0 "Um pesado e barulhento pisar interrompe o silêncio da noite.\n\n\"Você certamente também vê isso, [ROOT.Char.Custom('FormOfAddressForLiege')],\" m[Select_CString( jealous_courtier.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jealous_courtier'))|l] [jealous_courtier.GetFirstName] repreende ao entrar na minha ger, \"[achmach_scope.GetTitledFirstName] se destaca demais no que faz. [achmach_scope.GetSheHe|U] fala demais, recebe apoio demais, vai e vem com frequência demais. Tudo sempre parece dar certo para [achmach_scope.GetSheHe].\"\n\nOs olhos de [jealous_courtier.GetFirstNamePossessiveNoTooltip] se estreitam, \"Não poderia ser, meu [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip], que [achmach_scope.GetSheHe] está usando... artes sombrias para conseguir o que quer?\""
 nomad_events.0001.t:0 "$nomad_events.ill_advised.header$?"
 nomad_events.0002.a:0 "\"Me arrependo de tê-lo afastado do meu lado.\""
 nomad_events.0002.b:0 "\"Minha decisão está tomada\""
 nomad_events.0002.desc.angry:0 "\"Meus [achmach_scope.Custom('EyeEyes')] não conseguem acreditar que nosso temido [ROOT.Char.GetTitleAsNameNoTooltip] foi enganado assim.\" [achmach_scope.GetTitledFirstNameNoTooltip] resmunga, virando o rosto para longe da fogueira. \"Se sua presença soberana dará ouvidos a boatos, espero que esteja certo de quais são verdadeiros.\""
 nomad_events.0002.desc.calm:0 "\"Seja honesto, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip],\" [achmach_scope.GetTitledFirstName] insiste, abaixando a voz até que fique quase indistinguível do estalar da fogueira. \"Eu poderia ter feito algo diferente? Como falhei com você?\""
 nomad_events.0002.desc.fallback:0 "\"Não perguntarei por quê, meu temido [ROOT.Char.GetTitleAsNameNoTooltip], fui afastado do seu lado, mas o alertarei sobre algo,\" [achmach_scope.GetTitledFirstNameNoTooltip] se volta para mim após beber seu [Glossary( 'kumis', 'KUMIS_GLOSS')]."
 nomad_events.0002.desc.outro:0 "\n\n\"Apenas reflita por um instante, e se pergunte... haveria alguma razão para [jealous_courtier.GetTitledFirstName] ter falado mal de mim? Talvez alguém esteja tentando afastá-lo de quem mais cuida de você.\""
 nomad_events.0002.t:0 "$nomad_events.ill_advised.header$: Questionamentos"
 nomad_events.0003.a:0 "Dá para entender o motivo..."
 nomad_events.0003.b:0 "Acabou."
 nomad_events.0003.c:0 "#EMP Ha, ha, ha!#!"
 nomad_events.0003.desc.intro:0 "A fogueira já virou quase toda cinzas neste ponto da noite. Conversas bêbadas vão ficando mais quietas antes de ficarem altas novamente. M[Select_CString( jealous_courtier_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('jealous_courtier_2'))|l] [jealous_courtier_2.GetFirstName] se aproxima de mim sem muita sutileza.\n\n"
 nomad_events.0003.desc.not_rehired:0 "\"Mesmo após afastar [achmach_scope.GetTitledFirstName] do seu lado, temo que as maquinações [achmach_scope.GetHerHim] não tenham parado.\""
 nomad_events.0003.desc.outro:0 "\n\n\"As dores causadas por [achmach_scope.GetHerHim] parecem não ter fim!\" [jealous_courtier_2.GetSheHe] suspira alto. \"Não há dúvida de que [achmach_scope.GetSheHe] sussurra encantamentos proibidos e feitiços perigosos, pois todas [Select_CString( dummy_attracted_gender.IsFemale, 'os nossos', 'as nossas' )] [dummy_attracted_gender.GetWomenMen] fugiram para os braços [achmach_scope.GetHerHim]!\""
 nomad_events.0003.desc.rehired:0 "\"Sua bondade é grande demais, [ROOT.GetCharacter.Custom('GetMongolHonorific')]. [achmach_scope.GetTitledFirstName] certamente usou demônios poderosos para enganá-lo assim.\""
 nomad_events.0003.t:0 "$nomad_events.ill_advised.header$: Onde Há Fumaça"
 nomad_events.0004.a:0 "Que gesto gentil."
 nomad_events.0004.desc:0 "Imploro que aceite este humilde presente que reuni com grande esforço.\n\nObrigado por sua grande confiança em mim."
 nomad_events.0004.opening:0 "Ao mais misericordioso [ROOT.Char.GetTitleAsNameNoTooltip],"
 nomad_events.0005.a:0 "O que é isso...?"
 nomad_events.0005.desc:0 "Abutres virão para despir você.\n\nCuidado."
 nomad_events.0006.a:0 "Vou extrair a verdade de você como se ordenhasse uma égua."
 nomad_events.0006.b:0 "A carta claramente falava sobre magia negra."
 nomad_events.0006.c.failure:0 "As intenções de [recipient.GetShortUINamePossessive] continuam incertas"
 nomad_events.0006.c.success:0 "[recipient.GetShortUIName] confessa"
 nomad_events.0006.c:0 "Por que está tão nervoso?"
 nomad_events.0006.d:0 "Transforme meus inimigos em carniça."
 nomad_events.0006.desc.achmach:0 "A tenda de [recipient.GetTitledFirstNamePossessive] é tão escura que é difícil enxergar sem apertar os olhos. [recipient.GetFirstNameNoTooltip] repousa sobre uma almofada [ROOT.Char.Custom('GetSimpleColor')].\n\n\"Ah, [ROOT.GetCharacter.Custom('GetMongolHonorific')], por que me abençoa assim?\""
 nomad_events.0006.desc.achmach_outro:0 "\n\n\"Ah, vejo que minha mensagem chegou até você. Eu já o avisei antes, temido. Posso deixar os cães com fome até que não consigam mais andar, para que não possam morder seu mestre.\""
 nomad_events.0006.desc.calm:0 "\n\nEntrego a mensagem a [recipient.GetSheHe], aguardando uma explicação."
 nomad_events.0006.desc.courtier:0 "[recipient.GetTitledFirstName] repousa em sua cama, tomando calmamente um pouco de [Glossary( 'boal', 'BOL_GLOSS')].\n\n\"[ROOT.GetCharacter.Custom('GetMongolHonorific')|U]!\" [recipient.GetSheHe] se levanta imediatamente quando entro, e me entrega sua própria tigela: \"Por favor, devo perguntar por que me visitaste?\""
 nomad_events.0006.desc.courtier_2:0 "[recipient.GetTitledFirstName] [recipient.Custom('quirk_pos_present')] quando entro na tenda [recipient.GetHerHim]. O cheiro de grama fresca ainda está presente nas roupas [recipient.GetHerHim].\n\n\"Meu [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.GetCharacter.GetLadyLord]! Por favor, diga-me, como posso servi-lo?\""
 nomad_events.0006.desc.courtier_outro:0 "\n\n\"Certamente você não acredita que isso se refere a mim, meu [ROOT.Char.GetTitleAsNameNoTooltip]. Apenas tentei protegê-lo!\""
 nomad_events.0006.desc.courtier_outro_2:0 "\n\n[recipient.GetFirstNameNoTooltip] coça nervosamente o pescoço antes de insistir: \"Não tenho nada a ver com isso.\""
 nomad_events.0006.desc.fallback:0 "\n\nJogo a mensagem aos pés [recipient.GetHerHim], exigindo uma explicação."
 nomad_events.0006.e:0 "Você não é confiável."
 nomad_events.0006.f:0 "Acredito que não se referia a você."
 nomad_events.0006.t:0 "$nomad_events.ill_advised.header$: Interrogatórios"
 nomad_events.0007.a:0 "#EMP Ha!#! Já vi isso um milhão de vezes."
 nomad_events.0007.aa:0 "Eu sabia! [achmach_scope.GetSheHe|U] está contra mim! Todos estão!"
 nomad_events.0007.b.failure:0 "As intenções de [achmach_scope.GetShortUINamePossessive] continuam incertas para você"
 nomad_events.0007.b.success:0 "Você tem certeza das intenções de [achmach_scope.GetShortUINamePossessive]"
 nomad_events.0007.b:0 "O que você está #EMP realmente#! fazendo?"
 nomad_events.0007.c:0 "Diga-me a verdade. #EMP Imediatamente.#!"
 nomad_events.0007.desc.fallback:0 "Vejo [achmach_scope.GetTitledFirstName] se desculpando das bebidas e das lutas, bem mais cedo do que o habitual. [achmach_scope.GetSheHe|U] passa por sua tenda e segue em direção à natureza selvagem."
 nomad_events.0007.desc.imprisoned:0 "Poucos se aproximam dos prisioneiros. A ausência de uma fogueira os faz tremer. Mas, ao me aproximar, percebo que [achmach_scope.GetTitledFirstName] não está em lugar algum."
 nomad_events.0007.desc.outro:0 "\n\nUm estalo repentino facilita seguir os passos [achmach_scope.GetHerHim], e encontro [achmach_scope.GetSheHe] agachado no chão, sua longa sombra pairando sobre algumas ferramentas.\n\n[achmach_scope.GetSheHe|U] quebra galhadas como se fossem gravetos frágeis, seus estilhaços voando em todas as direções."
 nomad_events.0007.t:0 "$nomad_events.ill_advised.header$: Um Galho Quebrado"
 nomad_events.0008.a:0 "Esse [achmach_scope.GetFaith.HighGodName] de quem você fala... conte-me mais sobre ele."
 nomad_events.0008.b:0 "Sempre usarei isto."
 nomad_events.0008.c:0 "Esse trabalho é impressionante! Por favor, concentre-se nisso."
 nomad_events.0008.desc:0 "$nomad_events.0008_0009.desc.intro$\"Que o favor de [achmach_scope.GetFaith.HighGodName] proteja o [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip], [ROOT.Char.Custom('FormOfAddressForLiege')]. Que seus inimigos caiam no chão como pedras de uma montanha alta.\"\n\n[achmach_scope.GetSheHe|U] se vira e me vê, [ROOT.Char.Custom2('QuirkPPPosOrNeg', SCOPE.sC('achmach_scope'))], \"[ROOT.GetCharacter.Custom('GetMongolHonorific')|U], o céu irá protegê-lo agora,\" [achmach_scope.GetSheHe] explica, entregando-me um amuleto feito de galhada."
 nomad_events.0008.t:0 "$nomad_events.ill_advised.header$: O Favor dos Céus"
 nomad_events.0008_0009.desc.intro:0 "Fumaça sai, pálida como carne de cadáver. [achmach_scope.GetTitledFirstName] recita um encantamento, e então, em voz mais alta, declara:\n\n"
 nomad_events.0009.a:0 "Vou rachar sua cabeça!"
 nomad_events.0009.b:0 "Para o pó com você! E me dê isso."
 nomad_events.0009.b_imprisoned:0 "O que você tem aí?"
 nomad_events.0009.c:0 "Esta é a #EMP última#! vez que me pegam desprevenido."
 nomad_events.0009.desc:0 "$nomad_events.0008_0009.desc.intro$\"Que a fúria de [achmach_scope.GetFaith.HighGodName] recaia sobre o indigno [ROOT.Char.GetTitledFirstNameNoTooltip]. Que sua vida seja curta e cheia de dor.\"\n\n[achmach_scope.GetSheHe|U] se vira e me vê, suas mãos imediatamente agarrando o amuleto sobre o peito em busca de proteção."
 nomad_events.0009.t:0 "$nomad_events.ill_advised.header$: Sangue no Osso"
 nomad_events.0010.a.failure:0 "O assassino fere [achmach_scope.GetShortUIName]"
 nomad_events.0010.a.success:0 "[achmach_scope.GetShortUIName] mata o assassino"
 nomad_events.0010.a:0 "[achmach_scope.GetShortUIName], pegue [assassin.GetHerHim]!"
 nomad_events.0010.aa:0 "Estou #EMP fora#! daqui!!"
 nomad_events.0010.aaa:0 "Você não faz ideia com quem está mexendo..."
 nomad_events.0010.b.failure:0 "Seus guardas estavam distraídos"
 nomad_events.0010.b.success:0 "Seus guardas estavam esperando do lado de fora"
 nomad_events.0010.b:0 "Guardas! Guardas!"
 nomad_events.0010.c.failure:0 "[dueling_enemy.GetShortUIName] fere você"
 nomad_events.0010.c.success:0 "Você vence a luta"
 nomad_events.0010.c:0 "Você vai pagar por isso!"
 nomad_events.0010.c_imprisoned:0 "Volte para o seu buraco!"
 nomad_events.0010.desc.disloyal:0 "[achmach_scope.GetTitledFirstName] está sobre mim, com uma faca no meu pescoço. Empurro [achmach_scope.GetHerHim] para baixo, mas [achmach_scope.GetSheHe] se levanta quase imediatamente."
 nomad_events.0010.desc.intro:0 "Sonho com o céu infinito, nuvens girando, desaparecendo, chuva e trovões sem fim. Sinto uma gota d'água escorrendo pelo meu peito e o frio me acorda.\n\n"
 nomad_events.0010.desc.loyal:0 "Uma figura encapuzada está sobre mim, com uma faca no meu pescoço.\n\n\"Abaixe-se!\" [achmach_scope.GetTitledFirstName] a empurra para longe de mim, e ela grunhe ao bater contra a parede."
 nomad_events.0010.t:0 "$nomad_events.ill_advised.header$: Uma Faca no Escuro"
 nomad_events.0100.a:0 "\"[vassal_2.GetTitledFirstNameNoTooltip] terá que devolver o rebanho.\""
 nomad_events.0100.aa:0 "\"Acho que esses eram meus.\""
 nomad_events.0100.b:0 "\"Não acredito nessas acusações.\""
 nomad_events.0100.c:0 "\"Você incomoda seu [ROOT.Char.GetTitleAsNameNoTooltip] com essas bobagens?\""
 nomad_events.0100.desc:0 "\"Você acredita nisso, [ROOT.Char.GetTitleAsNameNoTooltip]!?\" [vassal_1.GetTitledFirstName] trota em minha direção. \"Aquel[Select_CString( vassal_2.IsFemale, 'a', 'e' )] [vassal_2.Custom2('InsultAdjective', SCOPE.sC('vassal_1'))] [vassal_2.GetFirstName] roubou alguns dos meus animais durante a noite, entrando no curral como um verme por uma fenda.\"\n\n\"Exijo que tudo o que foi levado seja devolvido, ou irei tomá-los à força.\""
 nomad_events.0100.t:0 "Não É Meu Rebanho"
 nomad_events.0110.a:0 "\"$knight_culture_player_plural_no_tooltip$, peguem ele!\""
 nomad_events.0110.b.failure:0 "O animal te fere"
 nomad_events.0110.b.success:0 "Você consegue afugentar o animal"
 nomad_events.0110.b:0 "\"Vou quebrar seu pescoço, besta!\""
 nomad_events.0110.c.success:0 "[victim.GetShortUIName] corre como nunca antes"
 nomad_events.0110.c:0 "\"Corra, [victim.GetFirstNameNoTooltip]!\""
 nomad_events.0110.desc:0 "Neve. Árvores farfalhando. O que parece ser um uivo distante. Embora... não tão distante assim.\n\n\"Socorro! Socorro!\" Não é difícil reconhecer a voz de [victim.GetTitledFirstNamePossessive], e começo a correr na direção dela. #EMP \"Socorro, por favor!\"#!\n\nQuando chego, encontro [victim.GetFirstNameNoTooltip] abrigado atrás de algumas rochas, e um lobo solitário se aproximando de [victim.GetHerHim]."
 nomad_events.0110.t:0 "Encurralado"
 nomad_events.0120.a:0 "\"Deixe-me te conhecer.\""
 nomad_events.0120.b:0 "Uma chance de conhecer melhor [companion.GetFirstNameNoTooltip]..."
 nomad_events.0120.c:0 "Preciso focar na cavalgada."
 nomad_events.0120.desc:0 "As nuvens formam formas de animais sobre nossas cabeças e [companion.GetFirstName] e eu cavalgamos um pouco mais para longe do acampamento.\n\n\"Qual foi o lugar mais distante que você já foi, [ROOT.Char.GetTitleAsNameNoTooltip]?\"\n\n\"Pra mim não foi tão longe assim,\" há quase vergonha na voz [companion.GetHerHim]. \"Mas um dia, gostaria de ir para uma terra onde ninguém conheça minha língua.\""
 nomad_events.0120.t:0 "Passeio ao Entardecer"
 nomad_events.0130.a:0 "\"Vá. E deixe seus animais para trás.\""
 nomad_events.0130.b:0 "\"Um bom mercador me seria útil.\""
 nomad_events.0130.c:0 "\"Aceito de bom grado alguns.\""
 nomad_events.0130.d:0 "\"Não estou interessado.\""
 nomad_events.0130.desc:0 "Um rosto desconhecido puxa as rédeas de alguns cavalos, tentando acalmá-los.\n\n\"Calma agora,\" [merchant.GetSheHe] os acalma. \"Ah, que encontro feliz!\" [merchant.GetSheHe] se vira em minha direção com um largo sorriso.\n\n\"Se eu puder lhe interessar na compra de alguns de meus produtos,\" [merchant.GetSheHe] oferece, apontando para os cavalos, \"também tenho algumas ovelhas logo ali naquele campo.\""
 nomad_events.0130.t:0 "Um Bom Negócio"
 nomad_events.0140.a.tt:0 "Você recebe um desconto de #P 50%#! para se converter à fé do [merchant.GetFaith.GetName]"
 nomad_events.0140.a:0 "\"Conte-me mais sobre sua fé do [merchant.GetFaith.GetNameNoTooltip]...\""
 nomad_events.0140.b:0 "\"Meu acampamento lhe dá as boas-vindas.\""
 nomad_events.0140.c:0 "\"Vá embora. Imediatamente.\""
 nomad_events.0140.desc:0 "\"...Você viu [merchant.GetHerHim]?\", \"De onde acha que [merchant.GetSheHe] veio?\", \"E o que acha das roupas [merchant.GetHerHim]?\"\n\nOs sussurros são quase inevitáveis enquanto caminho pelo acampamento. A razão logo se revela: um[Select_CString( merchant.IsFemale, 'a', '' )] [merchant.GetWomanMan] vestida de forma estranha está ao lado da minha fogueira.\n\n\"Saudações, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.GetCharacter.GetTitleAsNameNoTooltip]. Sou [Select_CString( merchant.IsFemale, 'uma mercadora', 'um mercador' )] [merchant.GetFaith.GetAdjectiveNoTooltip], perdid[Select_CString( merchant.IsFemale, 'a', 'o' )] nesta terra estranha. Desejo passar alguns anos em sua corte.\""
 nomad_events.0140.t:0 "Longe de Casa"
 nomad_events.0150.a.tt:0 "Esta opção está disponível porque você tem um [rival|E]"
 nomad_events.0150.a:0 "\"Sabe quem é um verdadeiro covarde? Aquele idiota do [rival.GetFirstNameNoTooltip].\""
 nomad_events.0150.b:0 "\"Vamos sim!\""
 nomad_events.0150.c:0 "Uma ótima ocasião para mostrar minha resistência."
 nomad_events.0150.desc:0 "O [Glossary( 'kumis', 'KUMIS_GLOSS')] é passado de mão em mão em tigelas cheias até a borda. \"Aqui, aqui!\", [companion.GetTitledFirstName] gesticula, tentando conseguir mais. \"Seu [ROOT.Char.GetTitleAsNameNoTooltip] exige isso!\" [companion.GetSheHe] ri, sorrindo para mim. \"Vocês são mais lentos que potros! Apressem-se!\"\n\n\"Ah!\" Finalmente, uma tigela chega às mãos [companion.GetHerHim], e [companion.GetSheHe] prontamente a oferece para mim.\n\n\"Vamos beber, meu bom [ROOT.Char.GetTitleAsNameNoTooltip], pois a noite é jovem e em breve nós não seremos!\""
 nomad_events.0150.t:0 "Mais Uma Taça"
 nomad_events.0160.a:0 "\"Finalmente, você caiu na real.\""
 nomad_events.0160.b:0 "\"Também te amo, meu bem.\""
 nomad_events.0160.c:0 "\"Certifique-se de contar a todos.\""
 nomad_events.0160.desc.brave:0 "\"Sua coragem inspira [ROOT.Char.GetWomenMen] e enche seus corações com o desejo de segui-lo(a).\""
 nomad_events.0160.desc.dread:0 "\"Sua presença enche [ROOT.Char.GetWomenMen] de pavor. Eles gritam, fogem e imploram por sua misericórdia.\""
 nomad_events.0160.desc.generic:0 "\"Sua mente é tão forte quanto seu braço. [ROOT.Char.GetWomenMen|U] [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] seguirão aonde for.\""
 nomad_events.0160.desc.intro:0 "\"Há algo que não sai da minha cabeça,\" diz [spouse.GetFirstName], deitad[Select_CString( spouse.IsFemale, 'a', 'o' )] na cama. \"Notei algo sobre você ultimamente.\"\n\n"
 nomad_events.0160.desc.lover:0 "\"O amor que sinto por você cresce a cada dia. Como uma flor selvagem, ele nunca morre.\""
 nomad_events.0160.desc.outro:0 "Tenho prestado atenção. E estou impressionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\"\n\n[spouse.GetSheHe|U] faz um gesto para que eu me aproxime."
 nomad_events.0160.desc.prowess:0 "\"Sua destreza é incomparável. Outr[Select_CString( ROOT.Char.IsFemale, 'as', 'os' )] [ROOT.Char.GetWomenMen] lançam olhares invejosos a você, cheios de ciúmes.\""
 nomad_events.0160.t:0 "Uma Palavra Amável"
 nomad_events.0170.a:0 "\"Você me acha #EMP frac[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#!?\""
 nomad_events.0170.b:0 "\"Tenho escutado demais minha raiva.\""
 nomad_events.0170.c:0 "\"É o único caminho.\""
 nomad_events.0170.desc:0 "[spouse.GetFirstName] está sentad[Select_CString( spouse.IsFemale, 'a', 'o' )] junto à lareira quando entro na tenda. Assustad[Select_CString( spouse.IsFemale, 'a', 'o' )], [spouse.GetSheHe] solta um leve suspiro ao me ver, abaixando os olhos.\n\n[spouse.GetSheHe|U] não diz nada enquanto me dispo e jogo um pouco de água no rosto. Após algum tempo, o silêncio pesa demais:\n\n\"Preciso falar com você, meu/minha querido(a) [ROOT.Char.GetTitleAsNameNoTooltip],\" diz [spouse.GetSheHe] em voz baixa, \"Todos têm medo de você. E eu não sou diferente deles,\" [spouse.GetSheHe] confessa."
 nomad_events.0170.t:0 "Temido por Todos"
 nomad_events.0180.a:0 "\"Você #EMP nunca#! mais vai falar da minha família assim.\""
 nomad_events.0180.b:0 "Está na hora de [child.GetFirstNameNoTooltip] aprender."
 nomad_events.0180.c:0 "Que as palavras de [rival.GetFirstNamePossessiveNoTooltip] se percam ao vento."
 nomad_events.0180.desc:0 "Ouço a risada de [rival.GetTitledFirstNamePossessive] antes mesmo de ver [rival.GetHerHim]. De costas quase viradas para mim, seu hálito exala cheiro de [Glossary( 'kumis', 'KUMIS_GLOSS')].\n\n\"#EMP Quem#! vai nos governar quando [ROOT.Char.GetTitledFirstNameNoTooltip] nos deixar para os corvos? Vai ser [child.GetFirstName]? O braço [child.GetHerHim] é tão fraco que [child.GetSheHe] mal consegue impedir os próprios dedos de caírem.\"\n\n\"Não. Com certeza não será a doce e dócil [child.GetFirstNameNoTooltip].\""
 nomad_events.0180.t:0 "O Elo Mais Fraco"
 nomad_events.0190.a:0 "\"Você é tão próximo(a) ao meu coração quanto meu próprio sangue.\""
 nomad_events.0190.b:0 "\"Com você, me sinto em paz.\""
 nomad_events.0190.c:0 "\"Hah! E isso é só o começo!\""
 nomad_events.0190.d:0 "\"Que cada árvore ouça nossa história!\""
 nomad_events.0190.desc:0 "\"Você [Glossary( 'aceitou bem o chapéu', 'TAKE_HAT_GLOSS')], [Select_CString( ROOT.Char.IsFemale, 'minha boa', 'meu bom' )] [ROOT.Char.GetTitleAsNameNoTooltip],\" [friend.GetTitledFirstName] puxa as rédeas de seu cavalo e acaricia a cabeça dele até se acalmar, rindo. \"Ei! Com calma aí!\"\n\n[friend.GetSheHe|U] volta os olhos para mim, \"Não acredito que você ainda é o mesmo(a) de tantos anos atrás. Já pensou que acabaríamos assim?\"\n\nEnquanto [friend.GetSheHe] fala, não consigo evitar sorrir, pensando em quando [memory.GetDescription]."
 nomad_events.0190.t:0 "Velhos Tempos"
 nomad_events.0200.a:0 "\"Esculpirei meu próprio destino sobre ossos caídos.\""
 nomad_events.0200.b:0 "\"Por favor, descubra o que isso significa.\""
 nomad_events.0200.c:0 "\"Maus presságios apenas forjam [ROOT.Char.GetWomenMen] melhores.\""
 nomad_events.0200.d:0 "\"Será o que [ROOT.Char.GetFaith.HighGodName] desejar.\""
 nomad_events.0200.desc.bad:0 "do sol e foi devorado por um cão selvagem. Seu corpo jazia numa poça de sangue.\""
 nomad_events.0200.desc.good:0 "da lua e pousou em sua mão. Ele a acendeu com fogo e voou embora.\""
 nomad_events.0200.desc.intro:0 "[courtier.GetTitledFirstName] se senta ao meu lado enquanto termino meu [Glossary( 'boal', 'BOL_GLOSS')]. Com os olhos fixos nas chamas, [courtier.GetSheHe] começa a falar:\n\n\"Tive um sonho na noite passada. Um falcão branco desceu"
 nomad_events.0200.desc.outro:0 "\n\nO calor da fogueira parece ter aumentado. Meu rosto está coberto de suor."
 nomad_events.0200.t:0 "Nos Meus Sonhos"
 nomad_events.0210.a:0 "\"Não preciso da sua piedade.\""
 nomad_events.0210.aa:0 "[courtier.GetShortUINameNoTooltip] anda bem atraente ultimamente..."
 nomad_events.0210.b.child:0 "\"Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [Select_CString( family.IsFemale, 'minha filha', 'meu filho' )].\""
 nomad_events.0210.b.spouse:0 "\"Meu amor...\""
 nomad_events.0210.c:0 "\"Não vou permitir que você passe por isso.\""
 nomad_events.0210.desc.child:0 "\"[ROOT.Char.GetMotherFather|U]...\" [family.GetFirstName] se aproxima de mim, os olhos vermelhos e as mãos segurando um punhado de raízes. \"Recolhi isso para você... Me desculpe por não ter achado mais.\""
 nomad_events.0210.desc.intro:0 "Cães vagam pelo acampamento, seus números diminuindo, ossos visíveis sob a pele fina. Uma ovelha caiu morta na noite passada. Pela manhã, não restava nada.\n\n"
 nomad_events.0210.desc.spouse:0 "\"Meu amor...\" [family.GetFirstName] se aproxima de mim, [family.GetSheHe] aperta com força um punhado de raízes. \"Estive colhendo a manhã toda, mas foi tudo o que consegui encontrar.\""
 nomad_events.0210.t:0 "Nada Além de Raízes"
 nomad_events.0220.a:0 "\"Você tem razão. Isso precisa acabar.\""
 nomad_events.0220.b:0 "\"Vou treinar o máximo que puder.\""
 nomad_events.0220.c:0 "\"Não adianta lutar contra a natureza. Eu sou assim.\""
 nomad_events.0220.desc:0 "[spouse.GetFirstName] limpa os dentes com uma farpa, deitad[Select_CString( spouse.IsFemale, 'a', 'o' )] de lado. [spouse.GetSheHe|U] revira os olhos quando finalmente percebe que entrei na tenda.\n\n\"O que você fez hoje?\" pergunta [spouse.GetSheHe], \"Acariciou um cordeiro perdido ou beijou os calcanhares de seus inimigos?\"\n\n\"Não me casei para viver com um galho frágil. Você deve se manter firme como o(a) poderoso(a) [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')].\""
 nomad_events.0220.t:0 "Fraco é o Braço"
 nomad_events.0230.a:0 "\"Eu sei como é essa sensação.\""
 nomad_events.0230.b:0 "\"Farei deste o seu lar.\""
 nomad_events.0230.c:0 "\"Você precisa deixar o passado para trás.\""
 nomad_events.0230.desc:0 "Meus olhos estão pesados quando os abro. Não há sinal da luz da manhã. O choro silencioso de [spouse.GetFirstNamePossessive] se torna evidente conforme me acostumo a estar acordado(a).\n\n\"Eu... eu sinto muito. Não queria atrapalhar seu sono. É só que... tenho sentido falta de casa. Aqui não é o mesmo. As terras [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip] nunca serão como as [spouse.GetCulture.GetNameNoTooltip].\""
 nomad_events.0230.t:0 "Saudade de Casa"
 nomad_events.0240.a:0 "\"Fiquemos com todas, menos uma. Enviem sua cabeça para [ruler.GetFirstNameNoTooltip].\""
 nomad_events.0240.b:0 "\"Devolvam-nas para [ruler.GetShortUINameNoTooltip].\""
 nomad_events.0240.c:0 "\"Que dia de sorte.\""
 nomad_events.0240.desc:0 "O balido é incessante ao redor do acampamento. \"Façam-nos parar!\" ouço [courtier.GetTitledFirstName] lamentar, esfregando a testa com uma careta de dor.\n\n\"Ah, [ROOT.Char.GetTitleAsNameNoTooltip]! Finalmente você chegou!\" [courtier.GetSheHe] sorri, apontando para o rebanho de ovelhas ao lado de [courtier.GetHerHim].\n\n\"Nosso povo encontrou esse rebanho perdido na fronteira com o território de [ruler.GetTitledFirstNamePossessive]. Temos motivos para acreditar que pertencem a [ruler.GetHerHim].\""
 nomad_events.0240.t:0 "Convidados Inesperados"
 nomad_events.0250.a:0 "\"Reconheço uma profecia quando ouço uma.\""
 nomad_events.0250.b:0 "\"Intrigante... fique conosco.\""
 nomad_events.0250.c:0 "\"Besteira! Eu o(a) expulso!\""
 nomad_events.0250.desc:0 "\"[ROOT.GetCharacter.Custom('GetMongolHonorific')|U] [ROOT.Char.GetTitleAsNameNoTooltip],\" uma voz estranha chama. \"Por muitas luas [priest.GetFaith.HighGodName] me fez procurá-lo(a).\"\n\n\"Em meus sonhos, vi você deitar aos pés de um lobo, abrir sua boca ensanguentada, e dela caiu o símbolo da [priest.GetFaith.ReligiousSymbol].\""
 nomad_events.0250.t:0 "[priest.GetWomanMan|U] de [priest.GetFaith.HighGodName]"
 nomad_events.0260.a:0 "\"Você ousa desrespeitar minha fé!?\""
 nomad_events.0260.b:0 "\"Quero saber mais sobre o [priest.GetFaith.GetNameNoTooltip].\""
 nomad_events.0260.c.tt.crit_success:0 "Todos estão impressionados"
 nomad_events.0260.c.tt.failure:0 "Você parece um tolo"
 nomad_events.0260.c.tt.success:0 "[priest.GetShortUINameNoTooltip] está impressionado"
 nomad_events.0260.c:0 "\"Seu deus mesquinho não é páreo para [ROOT.Char.GetFaith.HighGodName].\""
 nomad_events.0260.d:0 "\"Saia da minha vista.\""
 nomad_events.0260.desc:0 "\"Saudações, [ROOT.Char.GetName]. Meu nome é [priest.GetFullName],\" [Select_CString( priest.IsFemale, 'a', 'o' )] [priest.GetWomanMan] estranh[Select_CString( priest.IsFemale, 'a', 'o' )] se curva diante de mim. \"Venho das distantes terras de [distant_realm.GetBaseName] por mandato [Select_CString( other_ruler.IsFemale, 'da minha', 'do meu' )] [other_ruler.GetLadyLord], [Select_CString( other_ruler.IsFemale, 'a', 'o' )] [other_ruler.GetTitledFirstName].\"\n\n\"É a pedido [other_ruler.GetHerHim] que estou aqui para lhe mostrar os caminhos da verdadeira fé, o [priest.GetFaith.GetName].\""
