l_spanish:
 BOKH_GLOSS:0 "O estilo tradicional e antigo de luta Mongólica, onde o objetivo principal é arrastar a parte superior do corpo do oponente para o chão. Alguns estilos permitem técnicas como agarrar e chutar as pernas, mas em geral é um teste de força bruta e imobilidade, e pode durar horas."
 COWED_BY_SEVERED_HEAD_MODIFIER:0 "Amedrontado pela decapitação do predecessor: $VALUE|+=0$"
 FORMER_NOMAD_DUCHY_NAME:0 "[attacker.GetCulture.GetNameNoTooltip] [target.GetBaseNameNoTierNoTooltip]"
 FORMER_NOMAD_DUCHY_NAME_ADJ:0 "[attacker.GetCulture.GetNameNoTooltip]"
 FORMER_NOMAD_KINGDOM_NAME:0 "[attacker.GetCulture.GetNameNoTooltip] [target.GetBaseNameNoTierNoTooltip]"
 FORMER_NOMAD_KINGDOM_NAME_ADJ:0 "[attacker.GetCulture.GetNameNoTooltip]"
 NADAAM_GLOSS:0 "O #bold Erin Gurban Naadam#! ou 'três jogos viris' são os esportes principais praticados pelos povos Mongólicos desde a era Neolítica, e os principais espetáculos de festivais e competições. Estes são: arco composto, luta e corrida de longa distância a cavalo."
 accolade_head_artifact_desc:0 "Os restos macabros de [beheaded_warrior.GetFirstName], um renomado [ROOT.Char.Custom('KnightCultureNoTooltip')|l] conhecido como '[beheaded_warrior_accolade.GetName].' Os guerreiros de [beheaded_warrior_foe.GetNamePossessive|U] afirmam a honra de ter derrubado [beheaded_warrior.GetSheHe] no campo de batalha de [beheaded_warrior_location.GetName]."
 attacked_family_opinion:0 "Atacou um Membro da Minha Família"
 attackers_counties_lose_development:0 "[counties|E] conquistadas perdem @development_icon![development|E]"
 begin_warhorse_story_tt:0 "Este cavalo se torna o seu querido favorito"
 capital_county_loses_fertility_tt:0 "Perde [EmptyScope.ScriptValue('medium_county_fertility_loss')|N0] [county_fertility|E]"
 capital_county_not_in_steppe_tt:0 "Sua [capital|E] não está em [the_great_steppe|E]"
 custom.every_beheaded_family:0 "Cada [close_family_member|E] de [beheaded_warrior.GetShortUIName]"
 custom.every_neighboring_herder:0 "Cada [herder|E] [county|E] vizinho do seu [domain|E]"
 executed_head_artifact:0 "[victim.GetTitledFirstNamePossessiveNoTooltip|U] Cabeça Real"
 executed_head_emperor_artifact_desc:0 "Ainda usando uma coroa, com seus lábios cinzentos e sobrancelhas aumentadas por cabelos de cavalo costuradas em uma expressão imperiosa, a cabeça cortada do [victim.GetTitleAsNameNoTooltip] de [victim.GetPrimaryTitle.GetNameNoTier] inspira admiração e terror.\n\nSe um soberano tão poderoso pode enfrentar um destino tão terrível, que horrores aguardam todos os outros?"
 executed_head_king_artifact_desc:0 "O último remanescente de [victim.GetName], preservado e decorado como convém ao seu posto na vida. Um testemunho da vontade implacável de seu guardião."
 former_nomad_army_name:0 "Seminômades Leais [army_getter.GetCulture.GetNameNoTooltip]"
 gain_famed_victim_head_artifact_tt:0 "Pode manter a cabeça de [victim.GetFirstNamePossessive] como um $famoso$ [inventory_artifact|E]"
 gain_illustrious_victim_head_artifact_tt:0 "Pode manter a cabeça de [victim.GetFirstNamePossessive] como um $ilustre$ [inventory_artifact|E]"
 gold_army_for_herd_tt:0 "[herd_i][herd|E] e [horde|E] de [former_nomad.GetShortUINamePossessive|U] são trocados por @gold_icon![gold|E] e [special_troops|E]"
 headless_heir_high_tier_warning_tt:0 "@alert_icon! #alert_trial Aviso: [headless_heir.GetShortUIName] não tem medo de você!#!"
 headless_heir_ignores_challenge_tt:0 "#P Se o destinatário recuar desse insulto:#!"
 headless_heir_rises_to_challenge_tt:0 "#N Se o sucessor ousadamente jurar vingança:#!"
 herder_county_loses_fertility_tt:0 "[capital|E] de [herder.GetShortUIName] perde [EmptyScope.ScriptValue('medium_county_fertility_loss')|N0] [county_fertility|E]"
 higher_prestige_cost_because_pagan_tt:0 "@warning_icon! #X O custo de @prestige_icon![prestige|E] é quadruplicado porque sua [faith|E] é [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName]"
 is_nomadic_tt:0 "Você tem [nomadic_government|E]"
 keep_warrior_head_tt:0 "Você mantém a cabeça de [head_artifact.GetName]"
 kin_head_artifact_desc:0 "O rosto decaído e irreconhecível de [beheaded_warrior.GetFirstName], um querido membro da Casa [beheaded_warrior.GetHouse.GetName], que foi abatido pelas forças de [beheaded_warrior_foe.GetNamePossessive] em [beheaded_warrior_location.GetName]."
 mpo_noble_warriors_grave_modifier:0 "Cova do Nobre Decapitado"
 mpo_noble_warriors_grave_modifier_desc:0 "Cortada do corpo na batalha, uma cabeça de alta reputação é enterrada no solo desta terra. Sua cova é um lugar sagrado, bem conhecido e frequentemente visitado."
 mpo_nomad_events.1000.a.flavor:0 "[beheaded_warrior.GetTitledFirstNameNoTooltip] será colocada em um tapete de feltro branco, onde minha casa apresentará a [beheaded_warrior.GetSheHe] com bebidas cerimoniais e realizará rituais."
 mpo_nomad_events.1000.a:0 "Eu honrarei a cabeça dest[Select_CString( beheaded_warrior.IsFemale, 'a', 'e' )] grande [beheaded_warrior.GetWomanMan]."
 mpo_nomad_events.1000.army_camp:0 "Os sobreviventes da sangrenta batalha em [beheaded_warrior_location.GetName] se juntam ao meu exército, esporeando seus cavalos até o último suspiro. Das rédeas de um deles balança uma cabeça ensanguentada — com o rosto mortal de"
 mpo_nomad_events.1000.b:0 "[beheaded_warrior.GetFirstNameNoTooltip] pertence ao seu povo."
 mpo_nomad_events.1000.c:0 "Faça meus [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] reverenciarem seu camarada caído."
 mpo_nomad_events.1000.capital:0 "Os sobreviventes da sangrenta batalha em [beheaded_warrior_location.GetName] enviam notícias dos campos de matança, e com as novas... a cabeça ensanguentada de"
 mpo_nomad_events.1000.councillor:0 "[beheaded_warrior.GetName], meu confiável conselheiro."
 mpo_nomad_events.1000.d:0 "Coloque [beheaded_warrior.GetFirstNameNoTooltip] no solo."
 mpo_nomad_events.1000.desc:0 "\n\n[beheaded_warrior.GetSheHe|U] morreu como guerreiro, lutando até o coração do bando de [beheaded_warrior_foe.GetTitledFirstNamePossessive] até que sua cabeça foi cortada de seus ombros! Por amor a [beheaded_warrior.GetSheHe], nossos cavaleiros recuperaram o que puderam.\n\nUm fim cruel... mas nossos sábios anciãos dizem que a cabeça de um guerreiro nobre mantém parte da vigor e destino [beheaded_warrior.GetHerHim]."
 mpo_nomad_events.1000.family:0 "[beheaded_warrior.GetFirstName], m[Select_CString( beheaded_warrior.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('beheaded_warrior'))]."
 mpo_nomad_events.1000.generic_knight:0 "[beheaded_warrior.GetName], meu honrado [ROOT.Char.Custom('KnightCultureNoTooltip')|l]."
 mpo_nomad_events.1000.t:0 "Uma Cabeça Resgatada"
 mpo_nomad_events.1000.vassal:0 "[beheaded_warrior.GetName], meu outrora poderoso subordinado."
 mpo_nomad_events.1011.a.flavor:0 "E que foi #EMP I#! quem pôs fim à vida gloriosa [victim.GetHerHim]!"
 mpo_nomad_events.1011.a:0 "Que ninguém se esqueça deste decapitado [victim.GetTitleAsNameNoTooltip]."
 mpo_nomad_events.1011.b.fail:0 "[headless_heir.GetTitledFirstNameNoTooltip] ousadamente jura vingança"
 mpo_nomad_events.1011.b.flavor:0 "O novo mestre de [victim.GetPrimaryTitle.GetNameNoTierNoTooltip] deve saber qual é o único fim para meus inimigos! #EMP [headless_heir.GetSheHe|U] irá olhar isso nos olhos!#!"
 mpo_nomad_events.1011.b.success:0 "Seu cruel insulto amedronta [headless_heir.GetTitledFirstNameNoTooltip]"
 mpo_nomad_events.1011.b:0 "Envie este 'presente' para [headless_heir.GetTitledFirstNameNoTooltip]."
 mpo_nomad_events.1011.c:0 "Deixe [victim.GetFirstNameNoTooltip] para os abutres."
 mpo_nomad_events.1011.desc:0 "\n\nEu encontro os olhos do governante [victim.GetCulture.GetName] enquanto eles giram descontrolados no último momento, enquanto o sangue [victim.GetHerHim] se infiltra no solo."
 mpo_nomad_events.1011.desc_bad_execution:0 "Não com um único golpe limpo, mas com muitos golpes bruscos, a cabeça de [victim.GetNamePossessive] é cortada de seu miserável corpo."
 mpo_nomad_events.1011.desc_cant_send:0 "[victim.GetFirstNameNoTooltip] é um pedaço gasto de carne, uma refeição para carniceiros..."
 mpo_nomad_events.1011.desc_execution_beg:0 "[victim.GetName] gagueja e implora pela vida [victim.GetHerHim]. Então, com um golpe forte, a cabeça [victim.GetHerHim] é cortada dos ombros."
 mpo_nomad_events.1011.desc_execution_pray:0 "Ainda murmurando orações, [victim.GetName] é forçado a cair de joelhos. Então, um único golpe pesado separa a sua cabeça dos ombros."
 mpo_nomad_events.1011.desc_execution_spite:0 "[victim.GetName] cospe maldições e, mesmo enquanto a lâmina arranca a cabeça [victim.GetHerHim], lança-me um olhar furioso."
 mpo_nomad_events.1011.desc_keep_head:0 "\n\n...ou talvez esta cabeça famosa pertença a [ROOT.Char.GetSheHe] que a tomou."
 mpo_nomad_events.1011.desc_send_head:0 "\n\nSe o sucessor de [victim.GetFirstNamePossessiveNoTooltip], [headless_heir.GetTitledFirstName], testemunhasse esta cena sombria — [headless_heir.GetSheHe] talvez aprenda a temer meu poder, minha vontade feroz..."
 mpo_nomad_events.1011.t:0 "Decapitação"
 mpo_nomad_events.1012.a:0 "Honrar os restos de [victim.GetFirstNamePossessiveNoTooltip] é o mais importante."
 mpo_nomad_events.1012.a_flavor:0 "Este 'insulto' nos permite lavar, decorar e fazer orações antes da cabeça nobre de [victim.GetTitledFirstNamePossessiveNoTooltip]."
 mpo_nomad_events.1012.b:0 "#EMP Este insulto será vingado!#!"
 mpo_nomad_events.1012.b_flavor:0 "Me foi enviada a face sangrenta da guerra. A voz mortal de [victim.GetFirstName] clama pelo sangue de [executioner.GetTitledFirstNamePossessive]!"
 mpo_nomad_events.1012.c:0 "Devo recuar, ou enfrentar esse destino..."
 mpo_nomad_events.1012.desc:0 "Eu me dou ao luxo de deixar o velho sangue pingar nos meus sapatos, de segurar a pele fria entre meus dedos — pois a cabeça cortada de [victim.GetName] me foi devolvida.\n\n\"Um insulto! Uma humilhação!\" soam os gritos nos meus ouvidos, enquanto crianças choram. Meus [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] batem suas espadas e juram vingança.\n\nMas será que essa cabeça arruinada foi enviada apenas para semear o medo em meu coração? Ou... [executioner.GetTitledFirstName] deseja minha ira?"
 mpo_nomad_events.1012.t:0 "O [victim.GetTitleAsNameNoTooltip] Retorna"
 mpo_nomad_events.1013.a.cowed:0 "Como um cordeiro, o [headless_heir.GetTitleAsNameNoTooltip] balança e geme!"
 mpo_nomad_events.1013.a.revenge:0 "E assim... [headless_heir.GetFirstNameNoTooltip] jura vingança."
 mpo_nomad_events.1013.desc_angeee:0 "Ao enviar a cabeça do mestre de [victim.GetPrimaryTitle.GetNameNoTierPossessive], você me enviou a face sangrenta da guerra; enviou lábios cinzentos ainda gritando por vingança.\n\nEu verei seu corpo vivo apodrecer. Derrubarei você como uma árvore velha.\n\nColocarei a cabeça de [victim.GetFirstNamePossessive] entre seus ossos."
 mpo_nomad_events.1013.desc_takes_it:0 "[victim.GetCulture.GetCollectiveNoun] esperavam olhar para [victim.GetSheHe] mais uma vez. Agora, sua cabeça repousa em sangue e seus corações estão negros com a visão antinatural.\n\nPor favor, permita que [victim.GetFirstName] tenha paz em [headless_heir.GetFaith.PositiveAfterLife]. Poupe-nos da sua terrível ira!"
 mpo_nomad_events.1013.desc_takes_it_sedentary:0 "Uma ameaça selvagem mancha meu [headless_heir.Custom('ResidenceBuilding')|l] — a cabeça arrancada de um magnata nobre, meu próprio antepassado.\n\nPor favor, senhor dos cavalos! Em [headless_heir.GetPrimaryTitle.GetNameNoTier], raramente lidamos com tais horrores, e temos pouco gosto por eles. Eu preferiria tratar de forma amigável com você do que ser tão brutalmente reduzido."
 mpo_nomad_events.1013:0 "Assassino de [victim.GetTitledFirstNameNoTooltip],"
 mpo_nomad_events.1020.a:0 "\"Cale-se, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))]. Saiba seu lugar.\""
 mpo_nomad_events.1020.b:0 "\"Ninguém pode me desafiar e #EMP viver!#!"
 mpo_nomad_events.1020.c.flavor:0 "Que o intruso tenha seus próprios rebanhos... sob minha dominação."
 mpo_nomad_events.1020.c:0 "\"Eu tenho terras de pasto de sobra.\""
 mpo_nomad_events.1020.d.flavor:0 "[rowdy_boy.GetFirstNameNoTooltip] terá tudo o que [rowdy_boy.GetSheHe] precisa para estabelecer [rowdy_boy.GetHerselfHimself]."
 mpo_nomad_events.1020.d:0 "\"Cavaleiro, vá longe e faça honra ao seu nome!\""
 mpo_nomad_events.1020.desc:0 "M[Select_CString( rowdy_boy.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))] [rowdy_boy.GetFirstName] tem estado inquieto ultimamente.\n\n\"Mastigando os ossos de sua refeição! Chupando coalhadas azedas à sombra da sua tenda! Isso é #EMP minha#! vida?\" [rowdy_boy.GetSheHe] cospe. \"Estou pronto para liderar, [rowdy_boy.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))]! E há aqueles entre seu [ROOT.Char.GetDomicile.GetCulture.GetName] que me seguiriam.\"\n\nEste orgulhoso guerreiro [rowdy_boy.GetHouse.GetName] que mantenho como um animal de estimação impotente... mostra suas presas."
 mpo_nomad_events.1020.e.failure:0 "[rowdy_boy.GetFirstNameNoTooltip] e seus apoiadores saem sorrateiramente"
 mpo_nomad_events.1020.e.success:0 "[rowdy_boy.GetFirstNameNoTooltip] concorda em permanecer e servir"
 mpo_nomad_events.1020.e:0 "\"Você não ficará, se s[Select_CString( root_scope.IsFemale, 'ua', 'eu' )] [rowdy_boy.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] desejar?\""
 mpo_nomad_events.1020.f.flavor:0 "O caminho selvagem e solitário da liberdade espera!"
 mpo_nomad_events.1020.f:0 "\"Você está banido, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))]! Vá embora!\""
 mpo_nomad_events.1020.t:0 "O Mais Faminto Entre os Filhotes"
 mpo_nomad_events.1020_duel_tt:0 "#V Duelo#! [rowdy_boy.GetFirstName].\n@death_icon! #X Este duelo é até a morte!#!\nSe você vencer, ganhará @skill_prowess_icon![prowess|E], @dread_icon![dread|E], @prestige_icon![prestige|E] e @stress_icon![stress|E]. Se perder, [rowdy_boy.GetShortUIName] assumirá seus [titles|E] como [primary_heir|E].\n\nSua [prowess|E]: [prowess_i]#V [root_scope.GetProwess]#!\n[prowess|E] de [rowdy_boy.GetFirstNamePossessive]: [prowess_i]#V [rowdy_boy.GetProwess]#!"
 mpo_nomad_events.1022.a:0 "Fiz o que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] deve."
 mpo_nomad_events.1022.desc:0 "Como a pantera que salta imprudentemente de um penhasco, como o falcão que mergulha na sua própria sombra, como o camelo macho que morde os calcanhares de seu potro... fui consumido pela fúria.\n\nNo final do nosso duelo de honra, [rowdy_boy.GetFirstName] – [Select_CString( rowdy_boy.IsFemale, 'minha própria', 'meu próprio' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rowdy_boy'))] – está morto.\n\nÀ medida que os tambores da minha justa raiva diminuem, começo a ouvir os sons de lamento. Meu povo chora a prova do meu poder."
 mpo_nomad_events.1022.t:0 "Morte de um Intruso"
 mpo_nomad_events.1030.a.flavor:0 "Esforçar-se até ficar sem fôlego e com dores é tudo o que importa!"
 mpo_nomad_events.1030.a:0 "Deixe-me para o meu treinamento!"
 mpo_nomad_events.1030.b:0 "Prove que você pode se manter firme como uma montanha."
 mpo_nomad_events.1030.c.flavor:0 "Um marmoto é mais astuto do que qualquer um dos alvos em nosso território... mas pelo menos é uma marca maior."
 mpo_nomad_events.1030.c:0 "Você ganhará o jantar com suas flechas."
 mpo_nomad_events.1030.d.flavor:0 "E sobre seu cavalo obediente, você poderá cantar e se juntar às grandes corridas."
 mpo_nomad_events.1030.d:0 "Ganhe a confiança de um corcel, [child.Custom('GirlBoy')]."
 mpo_nomad_events.1030.desc.outro:0 "à sutil arte do arco... ou talvez [child.GetSheHe] devesse dominar a arte de montar que guia nossos rebanhos e traz nossos saqueadores rapidamente para casa?"
 mpo_nomad_events.1030.desc:0 "Enquanto considero as habilidades guerreiras dos meus [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l], m[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] é trazido até mim.\n\n\"[child.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|U],\" o(a) filho(a) pergunta, \"qual é o principal entre os três?"
 mpo_nomad_events.1030.desc_mongolic:0 "[Glossary( 'nadaam', 'NADAAM_GLOSS')]?\n\nM[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] pode se comprometer ao brutal teste do [Glossary( 'bökh', 'BOKH_GLOSS')],"
 mpo_nomad_events.1030.desc_non_mongolic:0 "grandes esportes?\n\nM[Select_CString( child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] pode se comprometer ao brutal teste da luta,"
 mpo_nomad_events.1030.t:0 "Educação nos Três"
 mpo_nomad_events.1040.a:0 "Aqui termina o vagar do meu povo."
 mpo_nomad_events.1040.desc:0 "#EMP Fora, [defender.GetTitledFirstName]! Fora, [expelled_culture.GetCollectiveNoun]!#! Com suas crianças gordas nos ombros, com suas riquezas espalhadas atrás de vocês, fujam do cavaleiro [ROOT.Char.GetCulture.GetName] e das flechas [dummy_soldier.GetHerHim]!\n\n[target.GetBaseNameNoTier] é deixado ao meu povo. Não somos mais levados como poeira pelas planícies! Aqui, vidas assentadas são nossas: o trabalho dos locais restantes e de nossos próprios plebeus serve ao nosso conforto.\n\nEm [ROOT.Char.GetCapitalLocation.GetName], no opulento [ROOT.Char.Custom('ResidenceBuilding')] que domina seu [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l], meu corpo cansado de guerra descansará... enquanto minha mente começa a ponderar"
 mpo_nomad_events.1040.desc_clan:0 "um nobre clã [ROOT.Char.GetTitleAsNamePossessiveNoTooltip], e seus muitos impostos."
 mpo_nomad_events.1040.desc_duchy:0 "#EMP Fora, [defender.GetTitledFirstName]!#! Fora com os covardes, fora com [Select_CString( defender.IsFemale, 'a', 'o' )] [defender.Custom('MistressMaster')] derrotado deste lugar! [Select_CString( ROOT.Char.IsFemale, 'Uma nova', 'Um novo' )] [ROOT.Char.GetTitleAsName] governa os fracos [expelled_culture.GetCollectiveNoun] agora. Eles aprenderão a agradar [ROOT.Char.GetSheHe], ou descobrirão que este é apenas o início de sua subjugação!\n\n[target.GetBaseNameNoTier] será um ótimo lar para o meu povo. Não somos mais levados como poeira pelas planícies! Aqui, vidas assentadas são nossas, e o trabalho dos locais serve ao nosso conforto.\n\nEm [ROOT.Char.GetCapitalLocation.GetName], no opulento [ROOT.Char.Custom('ResidenceBuilding')] que domina seu [ROOT.Char.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l], meu corpo cansado de guerra descansará... enquanto minha mente começa a ponderar"
 mpo_nomad_events.1040.desc_feudal:0 "as leis de um [ROOT.Char.GetTitleAsNameNoTooltip] feudal."
 mpo_nomad_events.1040.desc_tribal:0 "onde um [ROOT.Char.GetTitleAsNameNoTooltip] estabelecido encontra força."
 mpo_nomad_events.1040.t:0 "Uma Casa Além das Estepes"
 mpo_nomad_events.1050.a:0 "Para mim, os limites tradicionais não significam #EMP nada#!."
 mpo_nomad_events.1050.b.flavor:0 "Farei deste goatherd fedorento e falador um cavaleiro honrado!"
 mpo_nomad_events.1050.b:0 "\"Empreste-me sua língua honesta, e sua coragem!\""
 mpo_nomad_events.1050.c.flavor:0 "Pois parece que meu rebanho cresceu além do meu controle..."
 mpo_nomad_events.1050.c:0 "\"Arruinarei aqueles que lhe prejudicaram.\""
 mpo_nomad_events.1050.d:0 "\"#EMP Fuja antes dos meus animais, goatherd!#!"
 mpo_nomad_events.1050.desc:0 "[herder.GetTitledFirstName], um[Select_CString( herder.IsFemale, 'a', '' )] [herder.GetWomanMan] maltrapilho com cheiro de urina de cabra, se declara o cuidador da [herder_county.GetNameNoTierPossessive] [herder.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l] próxima.\n\n\"Seus pastores [ROOT.Char.GetPrimaryTitle.GetAdjective] ignoram os limites tradicionais!\" [herder.GetSheHe] diz. \"Eu movo meu rebanho para novas terras, e o solo está estéril! O vento carrega o barulho dos seus cavaleiros, e o som dos seus cavalos gordos!\"\n\n\"Não podemos honestamente compartilhar a terra, [ROOT.Char.GetTitleAsName]?\""
 mpo_nomad_events.1050.t:0 "Terras de Pastagem Mais Amplas"
 mpo_nomad_events.1060.a.flavor:0 "Esses fracos assentados logo aprenderão que nós 'selvagens' não somos tão facilmente enganados..."
 mpo_nomad_events.1060.a:0 "Vocês acham que #EMP é isso#! o que vale uma moeda de prata...?"
 mpo_nomad_events.1060.b.failure:0 "Você abandona o saque para escapar por pouco"
 mpo_nomad_events.1060.b.flavor:0 "[Select_CString( ROOT.Char.IsFemale, 'Uma verdadeira', 'Um verdadeiro' )] [ROOT.Char.Custom('GetDaughterSon')] da estepe não negocia com os fracos!"
 mpo_nomad_events.1060.b.success:0 "Sua comitiva escapa com os bens roubados"
 mpo_nomad_events.1060.b:0 "\"Pegue tudo! #EMP E cavalgue rápido!#!"
 mpo_nomad_events.1060.c.flavor:0 "Trocar nossos bens com os assentamentos de [neighbor.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] só pode nos beneficiar."
 mpo_nomad_events.1060.c:0 "\"Tragam peles, iogurte, cavalos finos!\""
 mpo_nomad_events.1060.desc:0 "Logo além das minhas pastagens, está o assentamento de [neighbor_province.GetName], um lugar ressoando com martelos batendo, o gemido de rodas, o burburinho das [county_culture.GetName] multidões.\n\nVisitamos para trocar animais por bens refinados. Os comerciantes de barriga macia nos observam com desconfiança e medo.\n\n\"Olhem, armas trabalhadas em [neighbor.Custom('RegionalWeaponMetal')]! Roupas finas de [neighbor.Custom('RegionalFabric')]!\" exclamam meus companheiros. \"E moedas de metal precioso!\""
 mpo_nomad_events.1060.t:0 "Troca com as Ovelhas"
 mpo_nomad_events.1070.a:0 "Você é uma besta leal, não é?"
 mpo_nomad_events.1070.b:0 "Nunca mais! Juro, cavalo: #EMP nunca mais!#!"
 mpo_nomad_events.1070.c.flavor:0 "Não preciso entrar em pânico. Existem forças naturais aqui, amigas de [ROOT.Char.GetSheHe], e elas me guiarão para casa."
 mpo_nomad_events.1070.c:0 "[ROOT.Char.GetFaith.HighGodNamePossessive] me trouxe até este lugar sagrado."
 mpo_nomad_events.1070.d.failure:0 "Você não encontra o caminho para casa antes que a noite retorne"
 mpo_nomad_events.1070.d.flavor:0 "Mesmo quando seu crânio dói tanto que [ROOT.Char.GetSheHe] mal consegue enxergar..."
 mpo_nomad_events.1070.d.success:0 "Você refaz os rastros do cavalo"
 mpo_nomad_events.1070.d:0 "Para casa! Um nômade nunca se perde."
 mpo_nomad_events.1070.desc:0 "me esfrega, o vento geme através do [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l]. Nós dois estamos sozinhos na selva.\n\nMinha mente é uma pedra lisa — o que #EMP aconteceu#! entre o último crepúsculo e esta fria aurora? Meu povo... me abandonou? Não! As memórias vêm,"
 mpo_nomad_events.1070.desc_has_horse:0 "Enquanto meu corcel [ROOT.Char.Custom('WarhorseStoryName')]"
 mpo_nomad_events.1070.desc_intro:0 "Acordo, com o hálito do cavalo na boca.\n\n"
 mpo_nomad_events.1070.desc_mental_thing:0 "uivando minhas próprias maldições loucas da meia-noite: embora minha gente tenha tentado me acalmar, eu não poderia estar entre eles. Fui para a noite com apenas este cavalo silencioso..."
 mpo_nomad_events.1070.desc_new_drunk:0 "carregando pesadas tigelas de [Glossary( 'kumis', 'KUMIS_GLOSS')], batidas de cascos, e a sensação de uma crina escura pressionada contra minha bochecha..."
 mpo_nomad_events.1070.desc_new_horse:0 "Como um cavalo desconhecido"
 mpo_nomad_events.1070.desc_spiritual:0 "carregando os sussurros dos espíritos, contando sobre o transe sagrado que me acordou da cama, me levou até um cavalo solitário à luz da lua..."
 mpo_nomad_events.1070.e:0 "Certamente, cavalo, você se lembra do caminho de volta..."
 mpo_nomad_events.1070.t:0 "Perdido na Noite"
