l_spanish:
 DynamicIntroLanded:0 "Enquanto eu caminho pelos meus corredores"
 DynamicIntroWanderer:0 "Enquanto caminho pelo acampamento"
 cultural_acceptance_enjoyed_music:0 "A [cultural_acceptance|E] entre os [journey_province.GetCounty.GetCulture.GetCollectiveNoun] e os [journey_provice.GetCounty.GetCulture.GetCollectiveNoun] aumentou em [minor_cultural_acceptance_gain]."
 gifted_axe_desc:0 "Um machado de guerra, perfeitamente balanceado."
 gifted_axe_name:0 "Machado da Conquista"
 gifted_bone_desc:0 "Um osso de carneiro incrustado com cobre, usado em jogos de arremesso de ossos."
 gifted_bone_name:0 "Osso de Jogo com Peso de Cobre"
 gifted_toy_desc:0 "Um cavalo de brinquedo de madeira, esculpido de forma primorosa."
 gifted_toy_name:0 "Cavalo de Brinquedo"
 mpo_events_tova.0001.a.tt.failure:0 "Você não impressiona [demanding_relation.GetTitledFirstName]."
 mpo_events_tova.0001.a.tt.success:0 "Você impressiona [demanding_relation.GetTitledFirstName]."
 mpo_events_tova.0001.a:0 "Deixe-me contar sobre minhas viagens em vez disso."
 mpo_events_tova.0001.b.equipped_tt:0 "Comprado [wanderer_toy.GetName] para [demanding_relation.GetTitledFirstName]."
 mpo_events_tova.0001.b:0 "Vou ao mercado e compro algo para você."
 mpo_events_tova.0001.c.tt.failure:0 "[demanding_relation.GetTitledFirstName] não é facilmente enganad[Select_CString( demanding_relation.IsFemale, 'a', 'o' )]"
 mpo_events_tova.0001.c.tt.success:0 "Você convence [demanding_relation.GetTitledFirstName] de que o item é especial"
 mpo_events_tova.0001.c:0 "Estou disposto a mentir para uma criança?"
 mpo_events_tova.0001.desc:0 "Não muito depois de meu retorno, percebo que [demanding_relation.GetTitledFirstName] me segue com um olhar expectante em seu rosto. Não nos vemos há algum tempo, pois [demanding_relation.GetSheHe] permaneceu na corte durante minha última viagem, mas é claro que [demanding_relation.GetSheHe] deseja algo mais do que minha companhia.\n\n[demanding_relation.GetSheHe|U] me olha com olhos brilhantes e pergunta, \"Você me trouxe algo da sua viagem?\"\n\nProcuro nos meus bolsos, mas não encontro nada além de um [ROOT.Char.Custom('RandomWeirdObject')]. Não me lembro de como ele foi parar lá."
 mpo_events_tova.0001.t:0 "Uma Recepção Fria"
 mpo_events_tova.0002.a.tt:0 "Você pode ganhar experiência extra no [wanderer_lifestyle|E] se visitar [journey_province.GetName] em um [GetActivityType('activity_journey').GetName]."
 mpo_events_tova.0002.a:0 "Eu deveria visitar este lugar algum dia."
 mpo_events_tova.0002.b.flavor:0 "Certamente um conjunto é mais desejável do que um acorde solitário?"
 mpo_events_tova.0002.b.tt.failure:0 "Você não conseguiu convencer [musician.GetTitledFirstName] a se juntar a você"
 mpo_events_tova.0002.b.tt.success:0 "Você convenceu [musician.GetTitledFirstName] a se juntar a você"
 mpo_events_tova.0002.b:0 "Usarei meu amor pela música para recrutar [musician.GetSheHe]."
 mpo_events_tova.0002.c:0 "Sente-se por um tempo e aproveite a música."
 mpo_events_tova.0002.desc:0 "[ROOT.Char.Custom('DynamicIntroLoc')], ouço o leve fluxo de música vindo do pátio.\n\nOs acordes fluem para um coro harmonioso, que me para em seco e me atinge com uma profunda nostalgia. Não preciso ouvir a letra para saber que esta canção é sobre saudade.\n\nSeguindo o som, encontro meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('musician'))], [musician.GetTitledFirstName]. [musician.GetSheHe|U] viajou de longe de casa e está tocando sua música como se estivesse relembrando de onde [musician.GetSheHe] veio.\n\nDe fato, se fechar os olhos, posso imaginar o [journey_province.GetName] de [journey_province.Custom('TerrainInspirationLoc')]."
 mpo_events_tova.0002.t:0 "Acordes Distantes"
 mpo_events_tova.0003.a.tt.failure:0 "Sua mentira é descoberta e [unruly_province_owner.GetTitledFirstName] fica sabendo das suas ações"
 mpo_events_tova.0003.a.tt.success:0 "Você convence o carrasco de que os atores e seu destino pertencem a você"
 mpo_events_tova.0003.a.tt:0 "Recrutar os atores convencendo o carrasco de que eles são seus súditos e só você pode decidir sobre o destino deles."
 mpo_events_tova.0003.a:0 "\"Na verdade, os atores são meus e eu quero eles de volta.\""
 mpo_events_tova.0003.b.tt.failure:0 "Você falha em convencer o carrasco e [unruly_province_owner.GetTitledFirstName] desaprova sua intromissão"
 mpo_events_tova.0003.b.tt.success:0 "Você convence o carrasco a liberar os prisioneiros"
 mpo_events_tova.0003.b.tt:0 "Convencer o carrasco a poupar a vida dos prisioneiros."
 mpo_events_tova.0003.b:0 "\"Essa punição não é condizente com o crime.\""
 mpo_events_tova.0003.c.tt:0 "Eles devem ser justamente punidos por seus caminhos malignos!"
 mpo_events_tova.0003.c:0 "Eu tenho outros compromissos. Vamos seguir em frente."
 mpo_events_tova.0003.desc:0 "O grito ominoso de uma ave de rapina me recebe enquanto eu limpo a borda da floresta, onde sou recebido pela visão de laços vazios balançando levemente nos galhos de [unruly_province.Custom('GetRandomRegionalWood')]. Três homens algemados estão de joelhos abaixo dos laços. Um deles parece quase com [unruly_province_owner.GetTitledFirstName].\n\n\"Esses cães inferiores zombaram do legítimo governo de nosso [unruly_province_owner.GetTitleTierName]!\" grita o carrasco. \"São rebeldes camponeses se passando por atores, e sua campanha de difamação terminará em suas mortes.\"\n\n\"Por favor, nos ajude,\" clama um dos acusados para mim."
 mpo_events_tova.0003.t:0 "Uma Piada Que Foi Longe Demais"
 mpo_events_tova.0004.a.flavor:0 "Espero que os soldados descontentes não tomem medidas drásticas..."
 mpo_events_tova.0004.a.tt:0 "Você vende uma parte das provisões do exército."
 mpo_events_tova.0004.a:0 "Rações mais restritas vão ensiná-los disciplina."
 mpo_events_tova.0004.b.tt:0 "O jovem ousado é morto imediatamente."
 mpo_events_tova.0004.b:0 "Eu vou cortar a cabeça do líder."
 mpo_events_tova.0004.c:0 "Eu vou pagar por provisões melhores."
 mpo_events_tova.0004.desc:0 "A escuridão da noite é dissipada pela luz de um fogo crepitante, onde um grupo dos meus soldados estacionados compartilha uma refeição juntos.\n\n\"Mesmo que eu feche os olhos e aperte o nariz, estou lutando para engolir essa porcaria. Não consigo mais engolir essa papa, ou vasculhar grãos podres para as minhas refeições diárias!\"\n\nAssim fala o homem que parece ser o líder do grupo, pelo entusiasmo e fortes tapinhas nas costas que recebe dos outros."
 mpo_events_tova.0004.t:0 "Deslealdade Hierárquica"
 mpo_events_tova.0005.a:0 "Faça esses preguiçosos entrarem nos eixos."
 mpo_events_tova.0005.b:0 "Disciplina-os por não estarem vigilantes."
 mpo_events_tova.0005.c:0 "Tome suas palavras amáveis e felicidade como inspiração."
 mpo_events_tova.0005.desc:0 "Uma coluna de fumaça se ergue à frente, e mesmo de certa distância consigo sentir o aroma agradável e selvagem de um assado. Seguindo o cheiro, vejo um grupo de meus soldados estacionados desfrutando de nada menos que três codornas.\n\n\"Eu poderia me acostumar com essa vida,\" proclama o mais barulhento do grupo. \"A calma e o silêncio fazem bem à alma, e por onde passamos os fazendeiros têm comida de sobra. Somos sortudos por viver em tempos tão pacíficos, e servir a um [ROOT.Char.GetTitleTierName] que é bom para seu povo.\""
 mpo_events_tova.0005.t:0 "Soldados Felizes"
 mpo_events_tova.0006.a:0 "Esses cães!"
 mpo_events_tova.0006.desc:0 "Notícias solenes, meu senhor: Seus soldados saquearam e queimaram celeiros em [maa_province.GetCounty.GetName]. Eles falavam de seus estômagos vazios e faziam afirmações traiçoeiras de que o senhor, meu senhor, os forçou a roubar e pilhar por seu pão diário.\n\nAlguns fugiram para a wilderness da campina, os que não fugiram foram mortos na hora por aqueles leais a você. A fome parece tornar os homens desesperados."
 mpo_events_tova.0006.t:0 "Justa Retribuição"
 mpo_events_tova.0025.a.tt.failure:0 "Sua mente se mostrou embotada"
 mpo_events_tova.0025.a.tt.success:0 "Você venceu o jogo usando táticas excelentes"
 mpo_events_tova.0025.a:0 "Vamos enganar nossos oponentes."
 mpo_events_tova.0025.b.tt.failure:0 "Sua força se mostrou fraca"
 mpo_events_tova.0025.b.tt.success:0 "Você venceu o jogo usando sua força"
 mpo_events_tova.0025.b:0 "Eu vou esmagar os tokens dos nossos oponentes!"
 mpo_events_tova.0025.c:0 "Não hoje, amigo."
 mpo_events_tova.0025.desc:0 "Ouço a música familiar do concurso e #EMP — CRACK!#! — dos tokens de osso batendo contra seu alvo de madeira, muito antes d[Select_CString( challenger_anda.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('challenger_anda'))] [challenger_anda.GetTitledFirstName] se aproximar de mim com um olhar de desafio mais comum em seus olhos.\n\n\"O que me diz? Vamos fazer uma rodada de [Glossary( 'shagai', 'SHAGAI_GLOSS')]!\""
 mpo_events_tova.0025.t:0 "Tiro ao Osso"
 mpo_events_tova.0030.a:0 "Você é verdadeiramente abençoado com talentos especiais!"
 mpo_events_tova.0030.b:0 "Os céus devem me favorecer e minhas ações."
 mpo_events_tova.0030.c:0 "Uma bela história."
 mpo_events_tova.0030.desc:0 "O sol mal colore o horizonte quando m[Select_CString( visionary.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visionary'))] [visionary.GetTitledFirstName] corre até meu lado, as bochechas coradas e os olhos brilhando.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleTierName], preciso compartilhar uma visão que tive em meus sonhos!\" [visionary.GetSheHe] grita. \"Eu vi "
 mpo_events_tova.0030.desc_green:0 "um galo verde correndo sobre os raios do sol e batendo suas asas. Ele cantava "
 mpo_events_tova.0030.desc_outro:0 "dizendo que o grande [ROOT.Char.GetTitledFirstNameNoTooltip] está destinado a governar tanto os céus quanto a terra!"
 mpo_events_tova.0030.desc_red:0 "um boi vermelho com sinos nas hastes, balançando a cabeça de um lado para o outro. Ele rugia "
 mpo_events_tova.0030.desc_white:0 "uma onça branca saltando das nuvens e arranhando profundas linhas na areia. Ela rosnava "
 mpo_events_tova.0030.t:0 "Uma Visão Sublime"
 mpo_events_tova.0035.a.tt:0 "O filho pode nascer com uma habilidade notável."
 mpo_events_tova.0035.a:0 "Regozije-se! Os céus enviaram-lhe um filho."
 mpo_events_tova.0035.b:0 "Ela te alimenta com nada além de mentiras."
 mpo_events_tova.0035.c:0 "Essa é a coisa mais engraçada que já ouvi!"
 mpo_events_tova.0035.desc:0 "M[Select_CString( distressed_anda.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('distressed_anda'))] [distressed_anda.GetTitledFirstName] bate com força na aba de feltro e entra em minha tenda. Seu peito se ergue com frustração contida.\n\n\"Agora ouça isto!\" ele exclama. \"[pregnant_woman.GetTitledFirstName] está grávida e tenho certeza de que o filho não é meu.\"\n\n\"Quando confrontada, ela me contou que sonhou que um urso descia de uma grande montanha, e a fera se transformou em fumaça na forma de um homem, e então a fumaça se assentou sobre seu ventre. Na manhã seguinte, ela sentiu os primeiros sinais da gravidez.\""
 mpo_events_tova.0035.t:0 "O Homem da Montanha"
 mpo_events_tova.0045.a.equipped_tt:0 "Recebeu [gift.GetName]."
 mpo_events_tova.0045.a:0 "Obrigado pela oferta generosa."
 mpo_events_tova.0045.b:0 "Sua amizade é o único presente que preciso."
 mpo_events_tova.0045.desc:0 "\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsName], embora nossa amizade seja mais forte que o pescoço de uma ovelha, desejo lhe dar um presente como símbolo da minha lealdade inabalável,\" m[Select_CString( generous_anda.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_anda'))] [generous_anda.GetTitledFirstName] me diz, enquanto compartilhamos o calor da fogueira."
 mpo_events_tova.0045.desc_axe:0 "Ele revela um machado de guerra, finamente polido e, sem dúvida, igualmente afiado. Então, ele continua: \"Conquistei esta arma durante nossa última batalha juntos, arrancando-a das mãos frias de um inimigo caído.\""
 mpo_events_tova.0045.desc_herd:0 "Ele aponta para os pastos de ovelhas à distância e continua: \"Trouxe um rebanho de ovelhas que ganhei em uma partida de [Glossary( 'shagai', 'SHAGAI_GLOSS')]. Que ele alimente e sustente você e sua família.\""
 mpo_events_tova.0045.desc_knucklebone:0 "Ele enfia a mão no bolso e retira uma bolsa, que ao abrir revela uma peça de [Glossary( 'shagai', 'SHAGAI_GLOSS')] com peso de cobre. Então, ele continua: \"Venci muitos desafios com este osso e tenho certeza de que lhe trará boa sorte.\""
 mpo_events_tova.0045.t:0 "Um Amigo Precioso"
 mpo_heavens_favor_diplo_modifier.desc:0 "$mpo_heavens_favor_modifier.desc$"
 mpo_heavens_favor_diplo_modifier:0 "$mpo_heavens_favor_modifier$"
 mpo_heavens_favor_martial_modifier.desc:0 "$mpo_heavens_favor_modifier.desc$"
 mpo_heavens_favor_martial_modifier:0 "$mpo_heavens_favor_modifier$"
 mpo_heavens_favor_modifier.desc:0 "Este personagem é encorajado por visões afortunadas."
 mpo_heavens_favor_modifier:0 "Favor dos Céus"
 mpo_sharp_wits_modifier.desc:0 "Este personagem aprimora seus sentidos e inteligência através de feitos táticos no tiro ao osso."
 mpo_sharp_wits_modifier:0 "Inteligência Afiada"
 mpo_special_flavor_events.0001.a:0 "Que majestade..."
 mpo_special_flavor_events.0001.b:0 "Acho que vou ficar aqui por um tempo"
 mpo_special_flavor_events.0001.desc:0 "Ouvi histórias sobre o mar. Sobre sua beleza e seu terror, e como ele eclipsa até mesmo a estepe em ambos. Hoje, vejo a grande água pela primeira vez.\n\nE finalmente entendo o brilho nos olhos dos contadores de histórias enquanto se esforçavam para encontrar palavras para descrever a água sem fim. Sento-me e fico olhando para o horizonte, onde o céu claro e familiar de Tengri toca suavemente a água azul.\n\nSinto a névoa salgada acariciando suavemente meu rosto. O ritmo sereno das ondas preenche meus ouvidos. A tranquilidade do mar é avassaladora, se for apenas por um momento."
 mpo_special_flavor_events.0001.t:0 "A Estepe da Água Infinita"
 mpo_thunder_knuckles_modifier.desc:0 "Este personagem lança os ossos com força semelhante a um poderoso estrondo de trovão."
 mpo_thunder_knuckles_modifier:0 "Punhos Trovejantes"
