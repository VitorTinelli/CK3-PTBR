 mpo_desperate_stance_decision:0 "Tempos Desesperados"
 mpo_desperate_stance_decision_confirm:0 "Reúna o povo"
 mpo_desperate_stance_decision_desc:0 "A terra está estéril. Os bezerros morrem no ventre das mães, invisíveis sob o sol. Cavalos, tão magros quanto gravetos, desabam com estalos nauseantes.\n\nSó há um caminho: e é para fora."
