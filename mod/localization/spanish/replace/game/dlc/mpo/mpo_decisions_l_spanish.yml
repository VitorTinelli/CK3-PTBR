 leave_confederation_decision_confirm:0 "[ROOT.Char.GetFaith.HighGodName] protege. Eu não farei."
 leave_confederation_decision_desc:0 "Defendi meus companheiros confederados por tempo suficiente. Agora, estarei sozinho. E se a confederação não pode sobreviver sem mim — ela merece o esquecimento!"
