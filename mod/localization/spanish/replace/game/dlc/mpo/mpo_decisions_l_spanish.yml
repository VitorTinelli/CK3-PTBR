 mpo_decisions_events.0204.a:0 "Para a vitória!"
 mpo_decisions_events.0204.a_fail:0 "Você #n falha#! em ganhar um [commander_trait|E]"
 mpo_decisions_events.0204.a_fail_desc:0 "Você pode tentar novamente em #V 5#! anos"
 mpo_decisions_events.0204.a_success:0 "Você #p ganha#! um [commander_trait|E] aleatório"
 mpo_decisions_events.0204.a_success_desc:0 "Você pode tentar outro em #V 10#! anos"
 mpo_decisions_events.0204.desc:0 "Algum tempo se passou desde que comecei o treinamento, e acho que agora estou pronto para colher os frutos do meu trabalho. É hora de testar minha coragem e ver se realmente me tornei um mestre na arte do comando."
 mpo_decisions_events.0204.desc_mentor:0 "Claro, estou feliz por ter recebido a orientação de [commander_trait_mentor.GetNamePossessive]."
 mpo_decisions_events.0204.t:0 "Um Novo Caminho"
 mpo_decisions_events.0300.a:0 "[shaman.GetFaith.FertilityGodName], ajude-nos a lembrar."
 mpo_decisions_events.0300.b:0 "Eu me juntarei a [shaman.GetNameNoTooltip] em suas reflexões."
 mpo_decisions_events.0300.b_tt:0 "Os resultados da assembleia serão #V mais eficazes#!"
 mpo_decisions_events.0300.desc:0 "[shaman.GetTitledFirstName] olha para o céu, entoando versos detalhando sua devoção a [shaman.GetFaith.FertilityGodName].\n\n\"Vamos agora lembrar como aqueles que vieram antes de nós cuidaram bem desta terra,\" [shaman.GetSheHe] diz, convidando outros a compartilhar conselhos.\n\n\"O que nossos avós aprenderam sobre o cordeiro recém-nascido? O que nossas tias-avós diziam sobre o solo?"
 mpo_decisions_events.0300.t:0 "O Ritual da Terra"
 mpo_decisions_events.0300.tt:0 "A assembleia em [fertility_county.GetName] começou."
 mpo_decisions_events.0400.a:0 "Mantenha os portões abertos."
 mpo_decisions_events.0400.desc:0 "\"...Especiarias do extremo oriente!\", \"Pimenta autêntica, coletada de um covil de dragão!\", \"A seda mais fina, as cores mais ricas!\"\n\nOs mercadores gritam e acenam para todos dispostos a ouvir, exibindo seus produtos com entusiasmo insistente.\n\n\"Tem sido assim em todos os lugares, grande [ROOT.Char.GetTitleAsNameNoTooltip],\" [courtier.GetTitledFirstName] faz uma profunda reverência como saudação. \"O mundo todo agora está sob a proteção da dinastia [ROOT.Char.GetDynasty.GetBaseNameNoTooltip]. As pessoas vêm às suas cidades, atraídas pela prosperidade."
 mpo_decisions_events.0400.t:0 "A Paz da Terra"
 mpo_decisions_events.0500.a:0 "Siga-me!"
 mpo_decisions_events.0500.desc:0 "Camadas de gelo cobrem a grama murcha, os focinhos do gado agora estão feridos de tanto tentar alcançá-la.\n\nMeu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('courtier'))|U] [courtier.GetShortUIName|U] se aproxima de mim, seu corpo encolhido ao tamanho de uma boneca:\n\n\"[ROOT.GetCharacter.Custom('GetMongolHonorific')|U] [ROOT.Char.GetTitleAsNameNoTooltip], seu povo morre a cada amanhecer, por favor nos liberte deste inferno vazio.\""
 mpo_decisions_events.0500.t:0 "Medidas Desesperadas"
