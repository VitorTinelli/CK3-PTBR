 recruit_from_nomadic_capital_decision_desc:0 "De todo o horizonte da estepe, sob o céu sem fim, os [ROOT.Char.GetDomicile.GetFaith.GetAdjective] [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun] leais se reúnem ao meu chamado. Convoco os cavaleiros mais corajosos, os caçadores mais ágeis e as mentes mais afiadas para se apresentarem em serviço."
