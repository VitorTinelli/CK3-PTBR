 introduce_heir_decision_desc:0 "Se meu sucessor for dominar o destino [ROOT.Char.GetPlayerHeir.GetHerHim], [ROOT.Char.GetPlayerHeir.GetSheHe] precisará de amigos honrados. Preciso fazer com que [ROOT.Char.GetPlayerHeir.GetSheHe] seja conhecido, fazer com que [ROOT.Char.GetPlayerHeir.GetSheHe] tenha sua voz ouvida nas casas de seda dos poderosos.\n\nMarcado com o destino está [Select_CString( ROOT.Char.GetPlayerHeir.IsFemale, 'a', 'o' )] [ROOT.Char.GetPlayerHeir.GetWomanMan] que permanece sozinho sob o céu."
