 mpo_gok_world_conquest_decision:0 "Reformar o Grande Caganato"
 mpo_gok_world_conquest_decision_confirm:0 "Reúnam as mentes mais sábias do meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 mpo_gok_world_conquest_decision_desc:0 "[ROOT.Char.GetPrimaryTitle.GetName] se estende além de nossas vastas terras de pasto, além dos mares salgados, além dos sonhos que qualquer nômade já ousou sonhar.\n\nTudo isso foi conquistado a cavalo. Tudo pode ser mantido, pode ser governado... apenas a partir do trono. De lá, como [ROOT.Char.GetFaith.CreatorName], devo olhar e ver a criação de um novo universo: feito das leis [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip], de novas sabedorias, e do domínio eterno [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]."
 mpo_gok_world_conquest_decision_tooltip:0 "Garanta o lugar eterno de sua [dynasty|E] como soberanos poderosos: adote uma nova forma de [government|E] ou reivindique todo o seu [realm|E] apenas para os [nomads|E]."
