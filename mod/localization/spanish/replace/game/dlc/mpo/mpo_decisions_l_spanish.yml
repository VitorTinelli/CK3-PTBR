 mpo_decisions_events.0203.a:0 "Para garantir que [heir_person.GetName] possa governar como eu governei."
 mpo_decisions_events.0203.b:0 "Para que eu possa retornar para [ROOT.Char.Custom2('RelationToMeShort', love_person)], [love_person.GetFirstName]."
 mpo_decisions_events.0203.c:0 "Para matar meus inimigos."
 mpo_decisions_events.0203.c_rival:0 "Eu mesmo, para que eu viva para me regozijar na morte de [hate_person.GetNamePossessive]."
 mpo_decisions_events.0203.d:0 "Pela glória de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!"
 mpo_decisions_events.0203.d_landless:0 "Pelo povo que lidero."
 mpo_decisions_events.0203.desc:0 "Sangue é derramado nestas batalhas, e inúmeras vidas são perdidas. Mas não é em vão, nem com prazer. Neste momento, devo recordar os rostos dos que caíram, e os nomes dos que sobreviveram.\n\nPara quem estou fazendo isso, e por que?"
 mpo_decisions_events.0203.desc_intro:0 "Minha mente se afasta do campo de batalha, e me encontro em um lugar tranquilo. Estou sozinho, e o único som é o farfalhar das folhas ao vento lá fora."
 mpo_decisions_events.0203.desc_mentor:0 "[commander_trait_mentor.GetNameNoTooltip] está sentado perto de mim, e me observa com intenção. \"Vejo que está perturbado,\" [commander_trait_mentor.GetSheHe] diz. \"Mas deve perguntar a si mesmo, por quem está lutando, e por que?\""
