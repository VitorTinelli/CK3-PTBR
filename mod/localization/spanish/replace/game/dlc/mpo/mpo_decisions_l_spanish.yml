 leaver_left_confederation_tt:0 "[leaver.GetShortUIName] deixou a [confederation.GetName]"
 mpo_become_greatest_of_khans_decision:0 "Tornar-se o Maior de Todos os Cãs"
 mpo_become_greatest_of_khans_decision_confirm:0 "#EMP Soem os tambores de guerra!#!"
 mpo_become_greatest_of_khans_decision_desc:0 "Convoque os clãs! Proclame que o mundo é seu, ó Cã dos Cãs, e que — embora cãs e chefes se levantem para negá-lo — você se tornará [ROOT.Char.GetLadyLord|U] de tudo sob o Céu."
 mpo_become_greatest_of_khans_decision_genghis_warning:0 "\n\n#EMP Atenção!#! Os sinais indicam que um poderoso Filho do Céu, o mongol profetizado, um dia fará essa reivindicação. E, uma vez que ele conquiste, nenhum senhor dos cavalos igualará sua glória!"
 mpo_become_greatest_of_khans_decision_tooltip:0 "Proclame que você é [GetTrait('greatest_of_khans').GetName( GetNullCharacter )] e comece sua conquista do mundo — mas primeiro, será necessário vencer uma $mpo_great_war_of_defiance_cb$"
 mpo_confederation_member_modifier:0 "Pastagem de Confederação"
 mpo_confederation_member_modifier_desc:0 "Ao compartilhar as terras de pastagem dos confederados e tributários menores, a pressão sobre os pastos locais é aliviada."
 mpo_decision_introduce_heir:0 "Apresentar Herdeiro"
 mpo_decision_introduce_heir_confirm:0 "#EMP [ROOT.Char.GetPlayerHeir.GetTitledFirstNameNoTooltip], sela seu cavalo!#!"
 mpo_decisions_events.0001.a:0 "Devo buscar os dispostos."
 mpo_decisions_events.0001.b:0 "#EMP Bah! Covardia!#!"
 mpo_decisions_events.0001.desc:0 "Pelo capricho de [ROOT.Char.GetFaith.HighGodName], meu [ROOT.Char.GetPrimaryTitle.GetTierAsName] pode ser quebrado como o eixo de uma única flecha! Pois minha modesta tribo compartilha a terra de [home_kingdom.GetNameNoTier] com tais bandos de guerra como os temíveis [threat.GetCulture.GetCollectiveNoun] de [threat.GetTitledFirstName].\n\nMas — se as flechas do meu povo estivessem atadas às de amigos e parentes? Um inimigo conseguiria nos destruir tão facilmente?\n\n#EMP Irmãos, irmãs — não nomeiem mestre, mas uma voz para as tribos! Uma voz para desprezar [threat.GetTitledFirstNameNoTooltip], e todo o mundo!#!"
 mpo_decisions_events.0001.t:0 "Reunindo as Tribos"
 mpo_decisions_events.0002.a:0 "Eu sou tudo o que meu povo precisa."
 mpo_decisions_events.0002.desc:0 "A palavra enviada viaja rápido, e logo as vozes da [confederation.GetName] gritam em medo — [ROOT.Char.GetName] terminou com eles!\n\n"
 mpo_decisions_events.0002.desc_confederation_done:0 "Com apenas [other_confederate.GetTitledFirstName] ainda mantendo os juramentos... a confederação não existe mais. Paz? Prosperidade? Agora, pertencem apenas aos fortes."
 mpo_decisions_events.0002.desc_confederation_survives:0 "Em quem esses fracos poderão confiar agora? Em quem encontrarão misericórdia? #EMP Quem lhes trará a paz?#! A confederação só pode cair no caos.\n\nA prosperidade pertencerá a [ROOT.Char.GetPrimaryTitle.GetNameNoTier] sozinho."
 mpo_decisions_events.0002.t:0 "Abandonando a Confederação"
 mpo_decisions_events.0003.a:0 "Traidor!"
 mpo_decisions_events.0003.desc:0 "Uma sensação de presságio pesado paira sobre meu povo, pois [leaver.GetTitledFirstName] abandonou sua promessa de ficar ao nosso lado. [leaver.GetSheHe|U] abandonou nossa confederação. Não mais marcharemos com [leaver.GetPrimaryTitle.GetNameNoTier] contra os grandes e poderosos.\n\n"
 mpo_decisions_events.0003.desc_confederation_done:0 "Como eu #EMP sozinho#! permaneço leal aos meus juramentos, minha confederação não tem mais significado. Não existe mais."
 mpo_decisions_events.0003.desc_confederation_survives:0 "A [confederation.GetName] ficou enfraquecida com isso. Mas ainda resistimos."
 mpo_decisions_events.0003.t:0 "A Perda da Confederação"
 mpo_decisions_events.0004.a:0 "$mpo_decisions_events.0005.a$"
 mpo_decisions_events.0004.b:0 "Não farei parte disso."
 mpo_decisions_events.0004.desc:0 "Antes, governávamos por vontade própria, nossas milícias respondendo a ninguém além de nós mesmos. Agora, ajoelhamos — não como [ROOT.Char.GetWomenMen] derrotados, mas como vassalos.\n\nO que antes era uma reunião de iguais tornou-se um[Select_CString( new_king_ruler.IsFemale, 'a', '' )] [new_king_ruler.GetPrimaryTitle.GetTierAsName], e nossas lâminas são juradas a [new_king_ruler.GetTitledFirstNameNicknamed] — [Select_CString( new_king_ruler.IsFemale, 'a primeira', 'o primeiro' )] entre iguais...\n\nEss[Select_CString( new_king_ruler.IsFemale, 'a', 'e' )] [new_king_ruler.GetPrimaryTitle.GetTierAsName] pode durar, ou pode cair como todas as coisas caem."
 mpo_decisions_events.0004.t:0 "O Nascimento de um[Select_CString( new_king_ruler.IsFemale, 'a', '' )] [new_king_ruler.GetPrimaryTitle.GetTierAsNameNoTooltip|U]"
 mpo_decisions_events.0005.a:0 "Que prosperemos, juntos!"
 mpo_decisions_events.0005.desc:0 "Antes, éramos bandos de guerra unidos pela necessidade, nossa unidade tão passageira quanto as estações. Agora, somos um só. A Confederação tornou-se uma grande besta, e eu — a cabeça da criatura.\n\nOs chefes que cavalgavam ao meu lado: agora se ajoelham sob meu comando. Eles ladeiam meu trono, cantam à minha mesa grandiosa! Concordamos com uma sucessão justa, e assim os outros clãs aguardam honrosamente sua vez de governar.\n\nUm [new_king_ruler.GetPrimaryTitle.GetTierAsName] nasceu. E, enquanto eu viver, eu sou seu soberano."
 mpo_decisions_events.0005.t:0 "$mpo_decisions_events.0004.t$"
 mpo_decisions_events.0020.a:0 "M[Select_CString( target_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', target_1)], [target_1.GetFirstNameNoTooltip] de [target_1.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 mpo_decisions_events.0020.b:0 "M[Select_CString( target_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', target_2)], [target_2.GetFirstNameNoTooltip] de [target_2.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 mpo_decisions_events.0020.c:0 "M[Select_CString( target_3.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', target_3)], [target_3.GetFirstNameNoTooltip] de [target_3.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 mpo_decisions_events.0020.d:0 "M[Select_CString( target_4.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', target_4)], [target_4.GetFirstNameNoTooltip] de [target_4.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 mpo_decisions_events.0020.desc:0 "O sangue do meu sangue, m[Select_CString( heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', loc_heir)] [heir.GetFirstName], um dia precisará exigir a lealdade de todos os [ROOT.Char.GetHouse.GetName], e muitos outros povos. Sem amigos fortes para apoiar [heir.GetSheHe], a voz do meu herdeiro pode ser ignorada.\n\nEnquanto montamos nossos cavalos, conto aqueles que são fiéis a mim."
 mpo_decisions_events.0020.desc_multiple:0 "[Select_CString( target_1.IsFemale, 'A', 'O' )] [target_1.Custom('ComplimentAdjective')] [target_1.GetTitledFirstName] certamente dará a [heir.GetFirstNameNoTooltip] um lugar ao lado de seu fogo, mas quem [heir.GetSheHe] deve #EMP impressionar mais#!?"
 mpo_decisions_events.0020.desc_one:0 "Eles são poucos, e há apenas um que eu verdadeiramente confio..."
 mpo_decisions_events.0020.e:0 "M[Select_CString( target_5.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', target_5)], [target_5.GetFirstNameNoTooltip] de [target_5.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 mpo_decisions_events.0020.f:0 "Bah, esqueça isso."
 mpo_decisions_events.0020.t:0 "Apresentar Herdeiro"
 mpo_decisions_events.0021.a.fail:0 "Sua presença ofusca [heir.GetFirstNamePossessiveNoTooltip]"
 mpo_decisions_events.0021.a.flavor:0 "Confie na sua maestria em diplomacia."
 mpo_decisions_events.0021.a.success:0 "Você ajuda [friendship_target.GetFirstNameNoTooltip] a ver as qualidades mais nobres de [heir.GetFirstNamePossessiveNoTooltip]"
 mpo_decisions_events.0021.a:0 "Somente minhas palavras podem uni-los."
 mpo_decisions_events.0021.b.fail:0 "Eles brigam e se desentendem"
 mpo_decisions_events.0021.b.flavor:0 "Confie em uma semelhança entre seu herdeiro e s[Select_CString( friendship_target.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', friendship_target)]: ambos são [lifestyle_trait.GetNameNoTooltip( loc_heir )|l]."
 mpo_decisions_events.0021.b.success:0 "[heir.GetFirstNameNoTooltip] e [friendship_target.GetFirstNameNoTooltip] desfrutam de seu passatempo compartilhado"
 mpo_decisions_events.0021.b:0 "\"Assim como você, [heir.GetFirstNameNoTooltip] é um [lifestyle_trait.GetNameNoTooltip( loc_heir )|l]!\""
 mpo_decisions_events.0021.c.fail:0 "[heir.GetFirstNameNoTooltip] e [friendship_target.GetFirstNameNoTooltip] tratam um ao outro com dureza"
 mpo_decisions_events.0021.c.flavor:0 "Confie na experiência de [GetTrait('tourney_participant').GetName( GetNullCharacter )] que os dois compartilham."
 mpo_decisions_events.0021.c.success:0 "A amizade é forjada na competição"
 mpo_decisions_events.0021.c:0 "Ambos são habilidosos em esporte tradicional."
 mpo_decisions_events.0021.d.fail:0 "Suas semelhanças não os comovem"
 mpo_decisions_events.0021.d.flavor:0 "Confie nas características que os dois têm em comum."
 mpo_decisions_events.0021.d.success:0 "[heir.GetFirstNameNoTooltip] e [friendship_target.GetFirstNameNoTooltip] se conectam por características compartilhadas"
 mpo_decisions_events.0021.d:0 "Os dois são tão semelhantes."
 mpo_decisions_events.0021.desc:0 "\n\nSou eu quem deve reunir esses dois cavalos no mesmo curral, quem deve forjar uma confiança que durará além da minha carne viva..."
 mpo_decisions_events.0021.desc_cold:0 "m[Select_CString( friendship_target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', friendship_target)] [friendship_target.GetTitledFirstName] é cinza e impassível como um velho monte de pedras. E embora m[Select_CString( heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', loc_heir)] conheça minha vontade, [heir.GetFirstName] simplesmente [heir.Custom('quirk_pos_present')], e então saboreia tranquilamente o calor do fogo."
 mpo_decisions_events.0021.desc_intro:0 "Enquanto [friendship_target.GetSheHe] organiza a comida e bebida de boas-vindas,"
 mpo_decisions_events.0021.desc_warm:0 "m[Select_CString( friendship_target.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', friendship_target)] [friendship_target.GetTitledFirstName] parece se perguntar o que fazer conosco. [friendship_target.GetSheHe|U] nos apresenta a captura do dia. Falamos de grandes caçadas passadas. M[Select_CString( heir.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', loc_heir)] tem pouco a dizer e sorri tranquilamente."
 mpo_decisions_events.0021.e.fail:0 "[heir.GetFirstNameNoTooltip] vê apenas um estranho amigável"
 mpo_decisions_events.0021.e.flavor:0 "Confie nos laços culturais, familiares e pessoais entre você e [friendship_target.GetTitledFirstNameNoTooltip]."
 mpo_decisions_events.0021.e.success:0 "Você facilmente expõe o parentesco com [friendship_target.GetFirstNameNoTooltip]"
 mpo_decisions_events.0021.e:0 "\"Compartilhamos laços preciosos, e eles #EMP devem#! durar.\""
 mpo_decisions_events.0021.f.flavor:0 "Confie na felicidade da riqueza."
 mpo_decisions_events.0021.f:0 "Presentes levantarão seus espíritos..."
 mpo_decisions_events.0021.t:0 "O Costume da Saudação"
 mpo_decisions_events.0022.a:0 "\"#EMP Fora, palavras!#! Nosso vínculo será selado em sangue.\""
 mpo_decisions_events.0022.b:0 "\"Para [heir.GetSheHe] que é prometido, obedeço com prazer ao meu [root_scope.GetTitleAsNameNoTooltip]!\""
 mpo_decisions_events.0022.c:0 "\"Que você retorne frequentemente, para sentar-se ao meu fogo.\""
 mpo_decisions_events.0022.d:0 "Teremos uma noite esclarecedora de conversa. Pouco mais."
 mpo_decisions_events.0022.desc_gift:0 "[root_scope.GetFirstNameNoTooltip] me apresenta e a [heir.GetFirstNameNoTooltip] com [Glossary( 'deels', 'DEEL_GLOSS' )] forrados com cashmere e as rédeas de dois cavalos brancos. \"Como vocês são semelhantes na prosperidade,\" [root_scope.GetSheHe] diz, \"que vocês dois sejam semelhantes na amizade. Pois somente na amizade a prosperidade pode crescer.\""
 mpo_decisions_events.0022.desc_intro:0 "M[Select_CString( root_scope.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', root_scope)], [root_scope.GetName], veio para [ROOT.Char.GetCapitalLocation.GetName]. [heir.GetFirstName], s[Select_CString( heir.IsFemale, 'ua', 'eu' )] herdeir[Select_CString( heir.IsFemale, 'a', 'o' )] [heir.Custom('ComplimentAdjective')], me abraça.\n\nEnquanto coloco a pele de cordeiro [Glossary( 'khatag', 'KHATAG_GLOSS' )] ao redor do meu dedo anelar e ofereço sua extremidade como saudação,"
 mpo_decisions_events.0022.desc_kinship:0 "[heir.GetFirstNameNoTooltip] aperta meu ombro com força.\n\n\"Para m[Select_CString( root_scope.IsFemale, 'inha', 'eu' )] [heir.Custom2('RelationToMeShort', root_scope)], você é o cavalo leal que se recusa a se desviar. Mas você ficará conosco nos anos que virão? Você me encontrará quando seu corpo estiver frio?\""
 mpo_decisions_events.0022.desc_lifestyle:0 "[heir.GetFirstNameNoTooltip] diz: \"Um [lifestyle_trait.GetNameNoTooltip( loc_heir )|l] cumprimenta o outro! Juntos, falaremos sobre poder e parentesco — e faremos o que realmente amamos.\""
 mpo_decisions_events.0022.desc_outro:0 "\n\nMeus dois visitantes seguem em frente, contando como [heir.GetFirstNameNoTooltip] um dia liderará a [root_scope.GetHouse.GetName]... e sobre o lugar de honra que desfrutarei na seu [root_scope.Custom('ResidenceBuilding')|l]."
 mpo_decisions_events.0022.desc_personal_charm:0 "[root_scope.GetFirstNameNoTooltip] fala nobremente [Select_CString( heir.IsFemale, 'da sua', 'do seu' )] [root_scope.Custom2('RelationToMe', loc_heir)]: \"Um verdadeiro [heir.GetCulture.GetName]! Um[Select_CString( heir.IsFemale, 'a', '' )] [heir.GetWomanMan] marcado pelo destino! Eu contei a [heir.GetFirstNameNoTooltip] sobre o governo [friendship_target.Custom('ComplimentAdjective')] de [friendship_target.GetFirstNameNoTooltip]. [heir.GetSheHe|U] deseja conhecê-lo melhor do que eu.\""
 mpo_decisions_events.0022.desc_shared_traits:0 "[root_scope.GetFirstNameNoTooltip] ri. \"[heir.GetFirstNameNoTooltip] é realmente seu reflexo na água! [heir.GetSheHe|U] se comporta exatamente assim. Eu sempre digo a [heir.GetSheHe]: é você quem é mais parecido com ele, quem o entenderia melhor, quem o apoiaria mais!\""
 mpo_decisions_events.0022.desc_sports:0 "[heir.GetFirstNameNoTooltip] me convida para o campo aberto. \"Você e eu somos mestres do mesmo esporte! Enquanto falamos sobre parentesco e poder, vamos aprimorar as habilidades de um [ROOT.Char.GetCulture.GetName]!\""
 mpo_decisions_events.0022.t:0 "Visitantes de [root_scope.GetCapitalLocation.GetNameNoTooltip]"
 mpo_decisions_events.0023.a:0 "Um fiel apoiador para [heir.GetFirstNameNoTooltip]."
 mpo_decisions_events.0023.a_fail:0 "Uma decepção, mas ainda assim a noite está alegre."
 mpo_decisions_events.0023.desc:0 "As últimas brasas brilham.\n\nComemos e conversamos até tarde da noite, despertando crianças sonolentas com nossas risadas e assustando-as com nosso canto gutural. Eu mal preciso cantar — ou falar — enquanto [friendship_target.GetTitledFirstName] e [heir.GetFirstName] conversam sobre as festividades do dia, e sonham com as que virão.\n\nEu trouxe duas almas nobres para a amizade nesta noite."
 mpo_decisions_events.0023.desc_accidental_friend:0 "Talvez m[Select_CString( accidental_friend.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', accidental_friend)], que [friendship_target.GetTitledFirstName] #EMP parece#! completamente encantado, traga [heir.GetFirstName] para esse mesmo círculo!"
 mpo_decisions_events.0023.desc_fail:0 "As últimas brasas brilham.\n\nAinda assim, a risada é suave; as palavras agradáveis, mas voam ligeiramente como pequenos pássaros. Apesar de todo o meu esforço, o coração [friendship_target.Custom('ComplimentAdjective')] de [friendship_target.GetFirstName] parece estar escondido de meu herdeiro.\n\nSó posso esperar que, quando eu for apenas ossos e pó, eles possam então forjar alguma amizade."
 mpo_decisions_events.0023.t:0 "Além dos Costumes"
 mpo_decisions_events.0060.desc:0 "[herder.GetTitledFirstName] atendeu ao meu chamado e chegou à corte como meu convidado"
 mpo_decisions_events.0060.t:0 "Pastor Chegou"
 mpo_decisions_events.0070.a.aptitude:0 "A [aptitude|E] de [great_court_astrologer_option.GetFirstNamePossessiveNoTooltip] é [great_court_astrologer_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_astrologer_court_position' ) )]"
 mpo_decisions_events.0070.a:0 "[great_court_astrologer_option.GetFirstNameNoTooltip] vê os dias por vir."
 mpo_decisions_events.0070.b.aptitude:0 "A [aptitude|E] de [good_court_astrologer_option.GetFirstNamePossessiveNoTooltip] é [good_court_astrologer_option.GetCourtPositionAptitude( GetCourtPositionType( 'court_astrologer_court_position' ) )]"
 mpo_decisions_events.0070.b:0 "[good_court_astrologer_option.GetFirstNameNoTooltip] servirá."
 mpo_decisions_events.0070.c:0 "Não sinto discernimento aqui."
 mpo_decisions_events.0070.desc:0 "Meus tribais buscaram os [great_court_astrologer_option.Custom('GetDaughterSon')]s de xamãs, encontraram eremitas em suas tocas, estranhos com palavras sagradas nos lábios, exilados vagando pelos ermos — tudo em busca do meu novo $court_astrologer_court_position$.\n\nAs pessoas sagradas são trazidas até mim. Cada uma conta histórias sobre meu destino e fala dos sinais que se agitam na natureza."
 mpo_decisions_events.0070.t:0 "Olhos para os Céus"
 mpo_decisions_events.0080.a.aptitude:0 "A [aptitude|E] de [great_siege_engineer_option.GetFirstNamePossessiveNoTooltip] é [great_siege_engineer_option.GetCourtPositionAptitude( GetCourtPositionType( 'siege_engineer_court_position' ) )]"
 mpo_decisions_events.0080.a:0 "[great_siege_engineer_option.GetFirstNameNoTooltip] sabe o que faz."
 mpo_decisions_events.0080.b.aptitude:0 "A [aptitude|E] de [good_siege_engineer_option.GetFirstNamePossessiveNoTooltip] é [good_siege_engineer_option.GetCourtPositionAptitude( GetCourtPositionType( 'siege_engineer_court_position' ) )]"
 mpo_decisions_events.0080.b:0 "[good_siege_engineer_option.GetFirstNameNoTooltip] servirá."
 mpo_decisions_events.0080.c:0 "Não me interesso por nenhum deles."
 mpo_decisions_events.0080.desc:0 "Enviei mensagens por toda parte, em busca de alguém que pudesse me auxiliar com sua perícia em engenharia. Embora parecesse uma tarefa impossível a princípio, dois candidatos finalmente chegaram ao meu acampamento.\n\n[great_siege_engineer_option.GetFirstName] é a melhor opção dos dois, pelo que percebo, mas também muito mais caro que [good_siege_engineer_option.GetFirstName]. Em todo caso, finalmente terei alguém para ajudar meus exércitos onde mais falhamos."
 mpo_decisions_events.0080.t:0 "Especialista de Terras Distantes"
 mpo_decisions_events.0090.a.aptitude:0 "A [aptitude|E] de [great_foreign_emissary_option.GetFirstNamePossessiveNoTooltip] é [great_foreign_emissary_option.GetCourtPositionAptitude( GetCourtPositionType( 'foreign_emissary_court_position' ) )]"
 mpo_decisions_events.0090.a:0 "[great_foreign_emissary_option.GetFirstNameNoTooltip] tem muitas histórias para contar."
 mpo_decisions_events.0090.b.aptitude:0 "A [aptitude|E] de [good_foreign_emissary_option.GetFirstNamePossessiveNoTooltip] é [good_foreign_emissary_option.GetCourtPositionAptitude( GetCourtPositionType( 'foreign_emissary_court_position' ) )]"
 mpo_decisions_events.0090.b:0 "[good_foreign_emissary_option.GetFirstNameNoTooltip] parece simpático."
 mpo_decisions_events.0090.c:0 "Nenhum dos dois serve."
 mpo_decisions_events.0090.desc:0 "Afundo na cadeira e sinto o sono me dominar enquanto ouço [courtier.GetFirstName] repetir a mesma história pela décima quinta vez. Preciso de alguém, #emp qualquer um#!, que possa me contar algo novo.\n\nApós enviar mensagens por meio de comerciantes viajantes, dois indivíduos finalmente aparecem em [ROOT.Char.GetCapitalLocation.GetName]. Ambos contam histórias sobre terras exóticas, montanhas imponentes e desertos sem fim."
 mpo_decisions_events.0090.t:0 "Uma História ou Duas"
 mpo_decisions_events.0120.a:0 "\"Estas sempre foram as terras [nomad.GetHerHim].\""
 mpo_decisions_events.0120.b:0 "\"Não vim aqui para ser súdito de ninguém.\""
 mpo_decisions_events.0120.c:0 "\"Não há motivo para você partir.\""
 mpo_decisions_events.0120.d:0 "\"Assumiremos daqui em diante.\""
 mpo_decisions_events.0120.desc.intro:0 "Chegou o momento de transformar meu acampamento em algo mais: um assentamento móvel que avança pelas estepes com as mudanças das estações.\n\n\"Espero que estas terras lhes sirvam bem\", diz o pastor que liderava o povo antes de nós, acolhendo-nos em sua tenda."
 mpo_decisions_events.0120.desc.subject:0 "\n\n\"[nomad.GetTitledFirstName] é [Select_CString( nomad.IsFemale, 'minha soberana', 'meu soberano' )]\", continua [herder.GetSheHe] em tom de aviso, \"E tributo é o que [nomad.GetSheHe] exige.\""
 mpo_decisions_events.0120.t:0 "O Caminho do Nômade"
 mpo_decisions_events.0200.a:0 "Eu devo fazer isso sozinho."
 mpo_decisions_events.0200.alone:0 "Sua jornada será um tanto #bold imprevisível#! e #bold sem orientação#!"
 mpo_decisions_events.0200.desc:0 "Eu vou até a sala de armas, selecionando uma boa lâmina do suporte. Observo os soldados, seus movimentos, sua embriaguez e sua falta de disciplina. Antes que eu me sinta enojado, devo aprender a liderá-los. Por que um homem seguiria a lei, se a lei não o segue?\n\nQuando me despeço, percebo [commander_trait_mentor.GetName] me observando de longe. [commander_trait_mentor.GetSheHe|U] é [Select_CString( commander_trait_mentor.IsFemale, 'uma guerreira', 'um guerreiro' )] formidável, apesar de estar cercado pelos fracos nesta sala de armas. Talvez [commander_trait_mentor.GetSheHe] possa me ensinar uma coisa ou duas."
 mpo_decisions_events.0200.desc_mentor:0 "[commander_trait_mentor.GetSheHe|U] já ajudou outros nesta empreitada antes, então [commander_trait_mentor.GetSheHe] tem uma boa reputação."
 mpo_decisions_events.0200.desc_my_mentor:0 "[commander_trait_mentor.GetSheHe|U] já me ajudou nesta empreitada antes, então posso procurar [commander_trait_mentor.GetSheHe] novamente."
 mpo_decisions_events.0200.intrigue:0 "Vou ultrapassar meus inimigos e enganar meus adversários."
 mpo_decisions_events.0200.intrigue_flavor:0 "Você será #bold orientado#! pela sua astúcia, alimentada pelos sussurros da corte e da guerra."
 mpo_decisions_events.0200.learning:0 "Prefiro aprender com os anais da história e a sabedoria dos estudiosos."
 mpo_decisions_events.0200.learning_flavor:0 "Você será #bold orientado#! pela sabedoria das batalhas passadas e pelos escritos dos grandes comandantes."
 mpo_decisions_events.0200.martial:0 "Minha mente tática é afiada e será suficiente."
 mpo_decisions_events.0200.martial_flavor:0 "O caminho para a vitória é solitário, mas você será #bold orientado#! pelo seu conhecimento de guerra."
 mpo_decisions_events.0200.mentor:0 "Parece que [commander_trait_mentor.GetSheHe] ganhará um novo protegido."
 mpo_decisions_events.0200.mentor_flavor:0 "Você solicita a ajuda de [commander_trait_mentor.GetNameNoTooltip] em sua busca para se tornar um comandante melhor."
 mpo_decisions_events.0200.mentor_traits:0 "Por causa do [commander_trait|E] de [commander_trait_mentor.GetName]:"
 mpo_decisions_events.0200.my_mentor:0 "Nos encontramos novamente, [commander_trait_mentor.GetTitledFirstName]."
 mpo_decisions_events.0200.t:0 "Para $study_commander_trait_decision$"
 mpo_decisions_events.0201.desc_intro:0 "Agora que comecei meu treinamento a sério, devo investigar quais são meus pontos fortes e fracos. Sei que muitas vezes sou [ROOT.Char.Custom('DescriptorNegativeStandalone')], mas não posso deixar que esse pecado seja a minha ruína.\n\nDevo focar no meu ponto mais fraco."
 mpo_decisions_events.0201.desc_mentor:0 "\n\n\"Cada luta será diferente, [ROOT.Char.GetFirstName].\" diz [commander_trait_mentor.GetNameNoTooltip], \"Você deve estar preparado para qualquer coisa, e para tudo. O inimigo não vai esperar você estar pronto. Qual é sua fraqueza em batalha? Me diga.\""
 mpo_decisions_events.0201.intrigue_1:0 "Eu preciso entrar na mente dos outros."
 mpo_decisions_events.0201.intrigue_1_fail:0 "Ninguém parece ouvir o que você diz"
 mpo_decisions_events.0201.intrigue_1_flavor:0 "Você deseja melhorar sua habilidade de convencer, ou manipular seus inimigos e aliados"
 mpo_decisions_events.0201.intrigue_1_mentor:0 "[commander_trait_mentor.GetNameNoTooltip] te dá conselhos sobre manipulação"
 mpo_decisions_events.0201.intrigue_1_success:0 "A multidão é convencida, apesar da relutância inicial"
 mpo_decisions_events.0201.intrigue_1_tt:0 "Você reúne um grupo de camponeses e tenta convencê-los a fazer sua vontade"
 mpo_decisions_events.0201.intrigue_2:0 "Às vezes, a melhor maneira de vencer é não lutar."
 mpo_decisions_events.0201.intrigue_2_fail:0 "A multidão se enfurece ainda mais com suas palavras"
 mpo_decisions_events.0201.intrigue_2_flavor:0 "Você deseja melhorar sua habilidade de evitar conflitos"
 mpo_decisions_events.0201.intrigue_2_success:0 "A multidão concorda com seus termos, e você evita uma luta"
 mpo_decisions_events.0201.intrigue_2_tt:0 "Você tenta convencer uma multidão a baixar as armas"
 mpo_decisions_events.0201.learning_1:0 "Conhecer o inimigo é metade da batalha, navegar pelo campo é a outra metade."
 mpo_decisions_events.0201.learning_1_fail:0 "Você se perde na selva"
 mpo_decisions_events.0201.learning_1_flavor:0 "Sua fraqueza está na falta de conhecimento sobre a paisagem"
 mpo_decisions_events.0201.learning_1_mentor:0 "[commander_trait_mentor.GetNameNoTooltip] te auxilia na sua pesquisa"
 mpo_decisions_events.0201.learning_1_success:0 "Você encontra o local perfeito para emboscadas e defesas"
 mpo_decisions_events.0201.learning_1_tt:0 "Você percorre as terras, procurando o melhor lugar para montar uma posição."
 mpo_decisions_events.0201.learning_2:0 "Armas dão a maior vantagem, se você souber usá-las."
 mpo_decisions_events.0201.learning_2_fail:0 "As mudanças na história são demais para você compreender"
 mpo_decisions_events.0201.learning_2_flavor:0 "Você deseja aprimorar seu conhecimento sobre armas e máquinas de cerco"
 mpo_decisions_events.0201.learning_2_mentor:0 "[commander_trait_mentor.GetNameNoTooltip] explica as complexidades das armas"
 mpo_decisions_events.0201.learning_2_success:0 "Você é capaz de usar as armas de maneira mais eficaz, e pode até melhorar as que você possui"
 mpo_decisions_events.0201.learning_2_tt:0 "Você estuda os avanços nas armas, e como elas podem ser usadas a seu favor"
 mpo_decisions_events.0201.martial_1:0 "Em um campo, sou um entre muitos. Mas sozinho, sou fraco."
 mpo_decisions_events.0201.martial_1_fail:0 "O soldado te derrota"
 mpo_decisions_events.0201.martial_1_flavor:0 "Sua fraqueza é a incapacidade de lutar sozinho"
 mpo_decisions_events.0201.martial_1_mentor_fail:0 "[commander_trait_mentor.GetNameNoTooltip] te vence"
 mpo_decisions_events.0201.martial_1_mentor_success:0 "Você vence [commander_trait_mentor.GetNameNoTooltip] em um duelo"
 mpo_decisions_events.0201.martial_1_success:0 "Você derrota seu oponente"
 mpo_decisions_events.0201.martial_1_tt:0 "Na tentativa de aprimorar suas habilidades em duelos, você treina com um soldado no quartel"
 mpo_decisions_events.0201.martial_2:0 "Eu preciso aprender a lutar com os outros."
 mpo_decisions_events.0201.martial_2_fail:0 "Seus soldados estão desorganizados e facilmente derrotados"
 mpo_decisions_events.0201.martial_2_flavor:0 "Sua fraqueza é a incapacidade de lutar com os outros"
 mpo_decisions_events.0201.martial_2_success:0 "Você lidera uma defesa impenetrável"
 mpo_decisions_events.0201.martial_2_tt:0 "Você reúne um grupo de soldados para praticar formações no pátio"
 mpo_decisions_events.0201.none_1:0 "Ninguém seguirá aquele que os permite passar fome."
 mpo_decisions_events.0201.none_1_fail:0 "Seu plano falha, e seus soldados ficam com fome"
 mpo_decisions_events.0201.none_1_flavor:0 "Você deseja aprender a racionar suprimentos de maneira mais eficaz"
 mpo_decisions_events.0201.none_1_success:0 "A comida é abundante, e seus soldados estão bem alimentados"
 mpo_decisions_events.0201.none_1_tt:0 "Você especula sobre a melhor maneira de alimentar seus soldados"
 mpo_decisions_events.0201.none_2:0 "Ser forte é o primeiro passo."
 mpo_decisions_events.0201.none_2_flavor:0 "Você deseja melhorar sua força física"
 mpo_decisions_events.0201.t:0 "As Provas do Comando"
 mpo_decisions_events.0202.desc:0 "Sou recebido por [situation_alerter.GetName]. [situation_alerter.GetSheHe|U] começa a discutir um evento recente que [situation_alerter.GetSheHe] acredita ser de meu interesse."
 mpo_decisions_events.0202.desc_1_intro:0 "[situation_alerter.GetSheHe|U] descreve um local não muito longe daqui.\n\n\"E um grupo de bandidos se instalou lá,\" [situation_alerter.GetSheHe] afirma. \"Por causa do"
 mpo_decisions_events.0202.desc_1_outro:0 "O exército de pé não teve chance!\" [situation_alerter.GetSheHe] exclama."
 mpo_decisions_events.0202.desc_2:0 "[situation_alerter.GetSheHe|U] me conta sobre uma fortaleza sob cerco, e como os defensores perderam terreno rapidamente. \"Uma carga de trabuco, e as muralhas desabaram,\" [situation_alerter.GetSheHe] diz animado. \"Não é à toa que o Senhor lá foi tão rápido em se render, ele não teria resistido por muito tempo.\""
 mpo_decisions_events.0202.desc_3:0 "[situation_alerter.GetSheHe|U] me conta sobre um grupo de oficiais e soldados descontentes que se voltaram contra seu comandante, criando um plano para minar e derrubá-lo. \"E na calada da noite – esfaqueado!\" [situation_alerter.GetSheHe] diz, \"O comandante nunca viu isso chegando.\""
 mpo_decisions_events.0202.desc_battlefield:0 "Ao retornar do campo de batalha,"
 mpo_decisions_events.0202.desc_outro:0 "\n\n[situation_alerter.GetFirstNameNoTooltip] limpa a garganta [situation_alerter.GetHerHim], \"Então, o que você teria feito?\""
 mpo_decisions_events.0202.desc_study:0 "Ao retornar dos meus estudos,"
 mpo_decisions_events.0202.desc_terrain:0 "Ao retornar da minha viagem,"
 mpo_decisions_events.0202.desc_town:0 "Ao retornar da cidade,"
 mpo_decisions_events.0202.fail:0 "[situation_alerter.GetFirstNameNoTooltip] me olha com uma sobrancelha levantada"
 mpo_decisions_events.0202.intrigue_situation_1:0 "Bandidos? Eu teria usado a ganância deles contra eles."
 mpo_decisions_events.0202.intrigue_situation_1_flavor:0 "Você mostra a [situation_alerter.GetFirstNameNoTooltip] como explorar a fraqueza de um inimigo"
 mpo_decisions_events.0202.intrigue_situation_2:0 "Se o poder está nas armas deles, tire-o deles"
 mpo_decisions_events.0202.intrigue_situation_2_flavor:0 "Você sugere a [situation_alerter.GetFirstNameNoTooltip] que teria saboteado o equipamento de cerco"
 mpo_decisions_events.0202.intrigue_situation_3:0 "Finja aliança com os traidores e os destrua por dentro."
 mpo_decisions_events.0202.intrigue_situation_3_flavor:0 "Você sugere a [situation_alerter.GetFirstNameNoTooltip] que teria infiltrado os traidores e sabotado seus planos"
 mpo_decisions_events.0202.learning_situation_1:0 "De onde vieram os bandidos?"
 mpo_decisions_events.0202.learning_situation_1_flavor:0 "Você explica a [situation_alerter.GetFirstNameNoTooltip] que aprender sobre o inimigo é o primeiro passo para derrotá-lo"
 mpo_decisions_events.0202.learning_situation_2:0 "Para cada arma, há um contra."
 mpo_decisions_events.0202.learning_situation_2_flavor:0 "Você sugere estudar os designs das armas de cerco, procurando uma fraqueza ou até mesmo uma inovação"
 mpo_decisions_events.0202.learning_situation_3:0 "Saiba o plano deles e garanta que falhe."
 mpo_decisions_events.0202.learning_situation_3_flavor:0 "Você sugere a [situation_alerter.GetFirstNameNoTooltip] que teria dissecado o plano do inimigo e encontrado uma maneira de impedi-lo de longe"
 mpo_decisions_events.0202.martial_situation_1:0 "Eu teria aprendido o terreno, e usado isso a meu favor."
 mpo_decisions_events.0202.martial_situation_1_flavor:0 "Você conta a [situation_alerter.GetFirstNameNoTooltip] como é importante conhecer o terreno em que você está lutando"
 mpo_decisions_events.0202.martial_situation_2:0 "Por que se esconder atrás das suas muralhas? Destrua essa maldita coisa!"
 mpo_decisions_events.0202.martial_situation_2_flavor:0 "Você explica a [situation_alerter.GetFirstNameNoTooltip] que teria destruído o equipamento de cerco pela força"
