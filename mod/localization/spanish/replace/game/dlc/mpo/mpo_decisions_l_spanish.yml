 settle_people_decision:0 "Migrar para Terras Conquistadas"
 settle_people_decision_confirm:0 "Nossas novas terras nos aguardam!"
 settle_people_decision_culture_shift:0 "A [culture|E] [nomad_settling_down.GetDomicile.GetCulture.GetName] e a [faith|E] [nomad_settling_down.GetDomicile.GetFaith.GetAdjective] se espalharão por suas terras #weak (quanto maior seu [herd|E], mais [counties|E] se converterão)#!"
 settle_people_decision_desc:0 "Essas terras não nasceram para nós, mas se curvam à nossa vontade mesmo assim. Suas cidades têm nomes estrangeiros, seu solo foi cultivado por mãos que não são nossas — mas isso acabou.\n\nTomamos o que conquistamos e fincamos estacas na terra. Que nos chamem de conquistadores — nos tornaremos reis."
 settle_people_decision_tooltip:0 "Migre seu povo [ROOT.Char.GetDomicile.GetFaith.GetAdjective] [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun] para terras conquistadas, abandonando seus costumes [GetGovernment( 'nomad_government' ).GetName]."
 settle_people_decision_usurp_until_domain_limit:0 "Se possível, você irá [revoke|E] [counties|E] o suficiente para preencher seu [domain_limit|E]"
 settle_the_steppe_decision:0 "Assentar-se na Estepe"
 settle_the_steppe_decision_confirm:0 "Uma nova era nos chama."
 settle_the_steppe_decision_desc:0 "A estepe alimentou nossos rebanhos, carregou nossos cavaleiros e espalhou nossos inimigos ao vento. Mas agora colocamos pedras onde antes trovejavam cascos. Não mais perseguiremos o horizonte — pois faremos com que o horizonte venha até nós.\n\nContinuamos filhos da estepe. Mas criaremos raízes em seu solo, ergueremos muros em seu vento e transformaremos a fogueira em lareira."
 settle_the_steppe_decision_tooltip:0 "Assente seu povo [ROOT.Char.GetDomicile.GetFaith.GetAdjective] [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun] como [GetGovernment('tribal_government').GetName], [GetGovernment('feudal_government').GetName] ou [GetGovernment('clan_government').GetName], abandonando seus costumes [GetGovernment( 'nomad_government' ).GetName]."
 step_away_from_the_steppe_decision:0 "Abandonar o Nomadismo"
 step_away_from_the_steppe_decision_confirm:0 "Fora da sela e rumo ao trono"
 step_away_from_the_steppe_decision_desc:0 "A vida a cavalo pode ser tão cansativa. Você já viu como é nas cidades? Uma cama macia dentro de paredes sólidas... nada de feridas de sela, nem necessidade de estar sempre em movimento... às vezes, é tentador sair da sela e se deitar em um colchão."
