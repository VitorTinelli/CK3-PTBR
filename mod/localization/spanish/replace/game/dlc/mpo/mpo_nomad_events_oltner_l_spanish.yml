l_spanish:
 chaos_upgrade_maa_tt:0 "Outros [men_at_arms|E] podem ser melhorados"
 chaotic_kurultai_intro_1:0 "M[Select_CString( dead_parent.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dead_parent'))] [dead_parent.GetFirstNameNicknamed] [dead_parent.GetDeathReasonHideKiller]. O amanhecer do meu reinado começa. As vozes desunidas do Curiltai ecoam sobre o [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvincePrefix')] [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')].\n\n"
 chaotic_kurultai_intro_2:0 "O amanhecer do meu reinado começa. As vozes desunidas do Curiltai ecoam por todo o [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvincePrefix')] [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')]\n\n"
 chaotic_kurultai_title:0 "Sucessão Caótica:"
 liege_primary_title_chaos_desc:0 "Seu senhor feudal perdeu seu [primary_title|E] devido a uma [succession|E] caótica"
 mpo_chaotic_kurultai_succession.0001.a:0 "Eu provarei meu valor com o tempo."
 mpo_chaotic_kurultai_succession.0001.desc:0 "M[Select_CString( sibling_rival_1.IsFemale, 'inha', 'eu' )] #EMP '[sibling_rival_1.Custom('ComplimentAdjective')]'#! [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.GetFirstNameNicknamed] jura pela vida [sibling_rival_1.GetHerHim] que [sibling_rival_1.GetSheHe] deveria governar [ROOT.Char.GetPrimaryTitle.GetName]. Que eu ser [ROOT.Char.GetTitleAsName] é uma piada dos [sibling_rival_1.GetFaith.EvilGodNames]. [sibling_rival_1.GetSheHe|U] é [sibling_rival_1.Custom('DescriptorNegativeStandalone')] e fraco."
 mpo_chaotic_kurultai_succession.0001.desc_addition:0 "\n\nE parece que m[Select_CString( sibling_rival_2.IsFemale, 'inha', 'eu' )] [sibling_rival_2.Custom2('InsultNoun', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_2'))] [sibling_rival_2.GetFirstNameNicknamed] decidiu seguir o mesmo caminho."
 mpo_chaotic_kurultai_succession.0001.t:0 "$chaotic_kurultai_title$ Ciúmes"
 mpo_chaotic_kurultai_succession.0002.a:0 "[sibling_rival_1.GetSheHe|U] ousa tomar o que é meu?"
 mpo_chaotic_kurultai_succession.0002.desc:0 "M[Select_CString( sibling_rival_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.GetFirstNameNicknamed] achou conveniente liderar um grupo de [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] para as terras de meu tributário [tributary_usurped.GetTitledFirstNameNicknamed], tomando à força o reino [tributary_usurped.GetHerHim]."
 mpo_chaotic_kurultai_succession.0002.desc_addition:0 "Com o apoio de um membro traidor do Curiltai, [backing_kurultai.GetFirstNameNicknamed]."
 mpo_chaotic_kurultai_succession.0002.desc_end:0 "\n\nIsso foi um erro fatal."
 mpo_chaotic_kurultai_succession.0002.t:0 "$chaotic_kurultai_title$ Usurpação do Tributário"
 mpo_chaotic_kurultai_succession.0003.a:0 "Eu esmagarei [tributary_leaving.GetSheHe] por sua insolência!"
 mpo_chaotic_kurultai_succession.0003.desc:0 "[Select_CString( tributary_leaving.IsFemale, 'Minha tributária', 'Meu tributário' )] [tributary_leaving.GetFirstNameNicknamed] de [tributary_leaving.GetPrimaryTitle.GetName] decidiu cessar os pagamentos [tributary_leaving.GetHerHim]."
 mpo_chaotic_kurultai_succession.0003.desc_addition:0 "[backing_kurultai.GetFirstNameNicknamed], um membro rebelde do Curiltai, é cúmplice nesta traição."
 mpo_chaotic_kurultai_succession.0003.desc_end:0 "\n\nEu terei meu tributo, de um jeito ou de outro."
 mpo_chaotic_kurultai_succession.0003.t:0 "$chaotic_kurultai_title$ Tributo Cessado"
 mpo_chaotic_kurultai_succession.0004.a:0 "A ordem será restaurada, a seu tempo."
 mpo_chaotic_kurultai_succession.0004.desc:0 "Minhas terras de pastagem estão sendo invadidas por saqueadores, cães e vagabundos [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)]. Eles estão saqueando minhas tendas, matando meus cavalos e queimando meus estandartes."
 mpo_chaotic_kurultai_succession.0004.desc_addition:0 "Está claro que estão sendo incitados por [backing_kurultai.GetFirstNameNicknamed], um membro [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] do Curiltai."
 mpo_chaotic_kurultai_succession.0004.desc_end:0 "\n\nEles entrarão na linha."
 mpo_chaotic_kurultai_succession.0004.t:0 "$chaotic_kurultai_title$ Perda de Controle"
 mpo_chaotic_kurultai_succession.0005.a:0 "Minha honra será restaurada."
 mpo_chaotic_kurultai_succession.0005.desc:0 "Meu nome, arrastado pela sujeira. Pisoteado por cavalos. Desrespeitado, descartado."
 mpo_chaotic_kurultai_succession.0005.desc_addition:0 "E a maior parte da difamação vem diretamente da boca [Select_CString( backing_kurultai.IsFemale, 'da minha', 'do meu' )] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamedPossessive]."
 mpo_chaotic_kurultai_succession.0005.t:0 "$chaotic_kurultai_title$ Desonra"
 mpo_chaotic_kurultai_succession.0006.a:0 "Minha força retornará."
 mpo_chaotic_kurultai_succession.0006.desc:0 "Durante a noite, uma grande parte do meu rebanho desapareceu. Perdido ou roubado."
 mpo_chaotic_kurultai_succession.0006.desc_addition:0 "Suspeito que [Select_CString( backing_kurultai.IsFemale, 'minha', 'meu' )] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] tenha liberado-os para a noite."
 mpo_chaotic_kurultai_succession.0006.desc_end:0 "\n\nEles podem estar a meio caminho da [rustler.GetCapitalLocation.Custom('TerrainTypeProvince')] de [rustler.GetCapitalLocation.GetName], tanto faz. Eu não os verei novamente."
 mpo_chaotic_kurultai_succession.0006.t:0 "$chaotic_kurultai_title$ Rebanho Perdido"
 mpo_chaotic_kurultai_succession.0007.a:0 "Ainda tenho muitos súditos leais."
 mpo_chaotic_kurultai_succession.0007.desc:0 "Três dos meus melhores cortesãos desapareceram: [courtier_1.GetFirstNameNicknamed], [courtier_2.GetFirstNameNicknamed], e [courtier_3.GetFirstNameNicknamed] — sua ira foi provocada pelo debate da sucessão."
 mpo_chaotic_kurultai_succession.0007.desc_addition:0 "Com certeza incitados por [Select_CString( backing_kurultai.IsFemale, 'minha', 'meu' )] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed]."
 mpo_chaotic_kurultai_succession.0007.desc_end:0 "\n\nEles desprezam minha autoridade e agora cavalgam para [courtier_stealer.GetCapitalLocation.GetName], buscando um novo mestre."
 mpo_chaotic_kurultai_succession.0007.t:0 "$chaotic_kurultai_title$ Cortesãos Defeituosos"
 mpo_chaotic_kurultai_succession.0008.a:0 "Quem precisa deles?"
 mpo_chaotic_kurultai_succession.0008.desc:0 "No caos da sucessão, meus melhores [defecting_maa.GetName] ficaram desiludidos. Esses guerreiros [maa_stealer.Custom2('InsultAdjective', ROOT.Char)] agora me abandonam."
 mpo_chaotic_kurultai_succession.0008.desc_addition:0 "[Select_CString( backing_kurultai.IsFemale, 'Minha', 'Meu' )] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] provavelmente os incitou."
 mpo_chaotic_kurultai_succession.0008.desc_end:0 "\n\nA poeira das patas de seus cavalos segue em direção a [maa_stealer.GetPrimaryTitle.GetName]. Espero que pereçam lá."
 mpo_chaotic_kurultai_succession.0008.t:0 "$chaotic_kurultai_title$ Soldados Desertores"
 mpo_chaotic_kurultai_succession.0009.a:0 "A ganância deles será punida."
 mpo_chaotic_kurultai_succession.0009.desc:0 "Meus irmãos estão furiosos com o veredicto do Curiltai, saqueando os cofres por sua parte."
 mpo_chaotic_kurultai_succession.0009.desc_addition2:0 "\n\n[sibling_rival_1.GetFirstNameNicknamed], [sibling_rival_2.GetFirstNameNicknamed],"
 mpo_chaotic_kurultai_succession.0009.desc_addition3:0 "[sibling_rival_3.GetFirstNameNicknamed],"
 mpo_chaotic_kurultai_succession.0009.desc_addition4:0 "[sibling_rival_4.GetFirstNameNicknamed],"
 mpo_chaotic_kurultai_succession.0009.desc_addition5:0 "[sibling_rival_5.GetFirstNameNicknamed],"
 mpo_chaotic_kurultai_succession.0009.desc_addition:0 "M[Select_CString( sibling_rival_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.GetFirstNameNicknamed] está furioso com o veredicto do Curiltai, saqueando os cofres por sua parte.\n\n[sibling_rival_1.GetSheHe|U] pagará por essa traição."
 mpo_chaotic_kurultai_succession.0009.desc_end:0 "eles pagarão por essa traição."
 mpo_chaotic_kurultai_succession.0009.t:0 "$chaotic_kurultai_title$ Tesouro Dividido"
 mpo_chaotic_kurultai_succession.0010.a:0 "Preciso provar que estão errados..."
 mpo_chaotic_kurultai_succession.0010.desc:0 "Eles estão todos rindo de mim, me chamando de [ROOT.Char.Custom2('InsultAdjective', ROOT.Char)]. Dizem que sou fraco, inadequado para ser [ROOT.Char.GetTitleAsNameNoTooltip]."
 mpo_chaotic_kurultai_succession.0010.desc_addition:0 "M[Select_CString( backing_kurultai.IsFemale, 'inha', 'eu' )] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] está rindo mais alto que todos os outros."
 mpo_chaotic_kurultai_succession.0010.desc_end:0 "\n\nComo ousam insultar minha força!?"
 mpo_chaotic_kurultai_succession.0010.t:0 "$chaotic_kurultai_title$ Autoridade Enfraquecida"
 mpo_chaotic_kurultai_succession.0011.a:0 "Malditos animais medrosos!"
 mpo_chaotic_kurultai_succession.0011.desc:0 "No meio da noite, minha manada entrou em pânico — os incêndios ardiam, os animais estavam desesperados. Isso não foi um acidente; eles foram incitados, foram feridos."
 mpo_chaotic_kurultai_succession.0011.desc_addition:0 "M[Select_CString( backing_kurultai.IsFemale, 'inha', 'eu' )] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.GetFirstNameNicknamed] me cumprimenta com um sorriso de dentes afiados."
 mpo_chaotic_kurultai_succession.0011.desc_end:0 "\n\nRecuperei a maior parte deles. O restante ainda trota em direção a [rustler.GetCapitalLocation.GetName]."
 mpo_chaotic_kurultai_succession.0011.t:0 "$chaotic_kurultai_title$ Fuga em Massa!"
 mpo_chaotic_kurultai_succession.0012.a:0 "O Curiltai pagará por isso!"
 mpo_chaotic_kurultai_succession.0012.desc:0 "Está decidido. Eu herdarei apenas metade do reino. O resto ficará com m[Select_CString( sibling_rival_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.Custom2('InsultAdjective', ROOT.Char)] [sibling_rival_1.GetFirstNameNicknamed], que já se mudou para [sibling_rival_1.GetCapitalLocation.GetName]!\n\nMais da metade do Curiltai estava a favor disso. São tolos desavisados."
 mpo_chaotic_kurultai_succession.0012.t:0 "$chaotic_kurultai_title$ Reino Dividido"
 mpo_chaotic_kurultai_succession.0013.a:0 "Será minha..."
 mpo_chaotic_kurultai_succession.0013.desc:0 "O veredicto está claro — a maior parte das nossas terras é minha. O restante vai para m[Select_CString( sibling_rival_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sibling_rival_1'))] [sibling_rival_1.Custom2('InsultAdjective', ROOT.Char)] [sibling_rival_1.GetFirstNameNicknamed].\n\nQue [sibling_rival_1.GetSheHe] apodreça em [sibling_rival_1.GetCapitalLocation.GetName]."
 mpo_chaotic_kurultai_succession.0013.t:0 "$chaotic_kurultai_title$ Reino Fragmentado"
 mpo_chaotic_kurultai_succession.0014.a:0 "Eu forjarei meu reino novamente!"
 mpo_chaotic_kurultai_succession.0014.desc:0 "Irritados, aborrecidos, gritando, discutindo. Não há espaço para a lei, não há espaço para decisões. Apenas desunião.\n\nEste é o fim de [ROOT.Char.GetPrimaryTitle.GetName]."
 mpo_chaotic_kurultai_succession.0014.desc_alt:0 "Mas as vozes são fracas, impotentes. Não pode haver decisão, não pode haver direito, nem lei.\n\nEste é o fim de [ROOT.Char.GetPrimaryTitle.GetName]. Se ao menos meu predecessor tivesse escolhido membros suficientes para o Curiltai..."
 mpo_chaotic_kurultai_succession.0014.t:0 "$chaotic_kurultai_title$ Dissolução"
 mpo_chaotic_kurultai_succession.0015.a:0 "Minha manada está dizimada!"
 mpo_chaotic_kurultai_succession.0015.desc:0 "Começaram a dividir a manada, discutindo, brigando, até que a luta estourou. Os animais se dispersaram, correndo em todas as direções."
 mpo_chaotic_kurultai_succession.0015.desc_addition:0 "M[Select_CString( backing_kurultai.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [backing_kurultai.GetFirstNameNicknamed] impotentemente tentou cercar as bestas que [backing_kurultai.GetSheHe] mesm[Select_CString( backing_kurultai.IsFemale, 'a', 'o' )] havia assustado."
 mpo_chaotic_kurultai_succession.0015.desc_end:0 "\n\nPassei o dia tentando controlá-los. A maioria se perdeu em direção a [rustler.GetCapitalLocation.GetName]."
 mpo_chaotic_kurultai_succession.0015.t:0 "$chaotic_kurultai_title$ Trovão sem Cavaleiro"
 mpo_chaotic_kurultai_succession.0016.a:0 "Ovelhas para o abate."
 mpo_chaotic_kurultai_succession.0016.desc:0 "[tributary_leaving.GetFirstNameNicknamed] de [tributary_leaving2.GetPrimaryTitle.GetName], [tributary_leaving2.GetFirstNameNicknamed] de [tributary_leaving.GetPrimaryTitle.GetName], e [tributary_leaving3.GetFirstNameNicknamed] de [tributary_leaving3.GetPrimaryTitle.GetName] cessaram seu tributo de moedas e gado."
 mpo_chaotic_kurultai_succession.0016.desc_addition:0 "M[Select_CString( backing_kurultai.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [backing_kurultai.GetFirstNameNicknamed] lhes deu coragem para me desafiar."
 mpo_chaotic_kurultai_succession.0016.desc_end:0 "\n\nEles se ajoelharão novamente em breve."
 mpo_chaotic_kurultai_succession.0016.t:0 "$chaotic_kurultai_title$ Tributários Fugiram"
 mpo_chaotic_kurultai_succession.0017.a:0 "Eles me servirão novamente em breve."
 mpo_chaotic_kurultai_succession.0017.desc:0 "Meus tributários assistiram à discórdia se desenrolar. Eles viram fraqueza, zombaram e partiram. As discussões abafaram minhas palavras."
 mpo_chaotic_kurultai_succession.0017.desc_addition:0 "Mais que ninguém, m[Select_CString( backing_kurultai.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('backing_kurultai'))] [backing_kurultai.Custom2('InsultAdjective', ROOT.Char)] [backing_kurultai.GetFirstNameNicknamed] atiçou as chamas, dando-lhes coragem para virar as costas para mim."
 mpo_chaotic_kurultai_succession.0017.desc_end:0 "\n\nApenas os mansos permanecem."
 mpo_chaotic_kurultai_succession.0017.t:0 "$chaotic_kurultai_title$ Tributo Murchando"
 mpo_chaotic_kurultai_succession.1000.a:0 "Eu, é claro."
 mpo_chaotic_kurultai_succession.1000.b:0 "[ilkhanate_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.c:0 "[red_horde_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.d:0 "[white_horde_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.desc:0 "O império jaz dividido. Herdeiros disputam o controle, mas nenhum é forte o bastante para tomá-lo. Exceto por..."
 mpo_chaotic_kurultai_succession.1000.e:0 "[aarlud_khanate_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.f:0 "[togskol_khanate_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.g:0 "[baruun_khanate_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.h:0 "[golden_horde_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.i:0 "[chagatai_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.j:0 "[great_yuan_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.k:0 "[blue_horde_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.l:0 "[omnod_dalai_khanate_ruler.GetFullNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1000.t:0 "Sucessores do Canato"
 mpo_chaotic_kurultai_succession.1006.a:0 "Adicionem-nos aos meus rebanhos."
 mpo_chaotic_kurultai_succession.1006.b.title:0 "[rustler.GetFirstName] devolve seu Rebanho"
 mpo_chaotic_kurultai_succession.1006.b.tt:0 "[ruler_rustled.GetShortUINamePossessive] perdeu [herd|E] e foi devolvido"
 mpo_chaotic_kurultai_succession.1006.b:0 "Devolvam-nos a [ruler_rustled.GetFirstNameNoTooltip] como um presente."
 mpo_chaotic_kurultai_succession.1006.desc:0 "Um rebanho de cabras e ovelhas, perdido ou abandonado, apareceu durante a noite.\n\nOs animais são dóceis e poderiam facilmente aumentar meu próprio rebanho. Alguns dizem que a sucessão caótica de [ruler_rustled.GetTitledFirstNameNicknamed] de [ruler_rustled.GetPrimaryTitle.GetName] é a causa."
 mpo_chaotic_kurultai_succession.1006.desc_addition:0 "Meus cavaleiros relatam ter visto [backing_kurultai.GetTitledFirstNameNicknamed], um membro desobediente do Curiltai de [ruler_rustled.GetFirstNamePossessiveNoTooltip], espreitando nas imediações. Provavelmente foi obra [backing_kurultai.GetHerHim]."
 mpo_chaotic_kurultai_succession.1006.t:0 "Rebanho Perdido"
 mpo_chaotic_kurultai_succession.1007.a:0 "Eles me servirão bem."
 mpo_chaotic_kurultai_succession.1007.b.title:0 "[courtier_stealer.GetFirstName] devolve seus Cortesãos"
 mpo_chaotic_kurultai_succession.1007.b:0 "Devolva-os a [ruler_rustled.GetFirstNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1007.desc:0 "Três andarilhos, [courtier_1.GetFirstNameNicknamed], [courtier_2.GetFirstNameNicknamed], e [courtier_3.GetFirstNameNicknamed], vêm procurar um lugar em minha corte.\n\nEles vêm de [ruler_rustled.GetPrimaryTitle.GetName], expulsos por [ruler_rustled.GetTitledFirstNameNicknamedPossessive] sucessão caótica."
 mpo_chaotic_kurultai_succession.1007.desc_addition:0 "Eles provavelmente foram incitados por [backing_kurultai.GetTitledFirstNameNicknamed], uma voz desobediente no Curiltai de [ruler_rustled.GetFirstNamePossessiveNoTooltip]."
 mpo_chaotic_kurultai_succession.1007.t:0 "Novos Chegados"
 mpo_chaotic_kurultai_succession.1008.a:0 "Eu poderia usar esses soldados."
 mpo_chaotic_kurultai_succession.1008.b.title:0 "[maa_stealer.GetFirstName] devolve seus Soldados"
 mpo_chaotic_kurultai_succession.1008.b:0 "Devolva-os a [ruler_rustled.GetFirstNameNoTooltip]."
 mpo_chaotic_kurultai_succession.1008.desc:0 "Um grupo de bem armados [defecting_maa.GetName] se apresenta diante de mim. Eles não parecem bandidos; ao contrário, desejam servir em minhas fileiras.\n\nEles vêm de [ruler_rustled.GetPrimaryTitle.GetName], desiludidos com a sucessão caótica de [ruler_rustled.GetTitledFirstNameNicknamedPossessive]."
 mpo_chaotic_kurultai_succession.1008.desc_addition:0 "O fato de estarem aqui provavelmente é por causa de [backing_kurultai.GetTitledFirstNameNicknamed], um membro desobediente do Curiltai de [ruler_rustled.GetFirstNamePossessiveNoTooltip]."
 mpo_chaotic_kurultai_succession.1008.t:0 "Soldados [defecting_maa.GetNameNoTooltip] Dispostos"
 nomad_events_oltner.0001.a:0 "Vamos nos fartar com o(a) [sighting_county_1.Custom('GetAnimalType')] esta noite."
 nomad_events_oltner.0001.b:0 "Matar o(a) [sighting_county_2.Custom('GetAnimalType')] [sighting_county_2.Custom('GetAnimalAdjective')] provará meu valor."
 nomad_events_oltner.0001.c:0 "Outras questões exigem minha atenção."
 nomad_events_oltner.0001.desc:0 "Há muito jogo em minhas terras. Os caçadores me falam de um [sighting_county_1.Custom('GetAnimalGroup')] de [sighting_county_1.Custom('GetAnimalPlural')] nas [sighting_province_1.Custom('GetTerrainTypePlural')] de [sighting_county_1.GetBaseNameNoTier], e de um(a) [sighting_county_2.Custom('GetAnimalType')] [sighting_county_2.Custom('GetAnimalAdjective')] escondido nas [sighting_county_2.GetBaseNameNoTier] [sighting_province_2.Custom('GetTerrainType')].\n\nComo [ROOT.Char.GetTitleAsNameNoTooltip], devo escolher um para perseguir."
 nomad_events_oltner.0001.t:0 "Pegadas Frescas"
 nomad_events_oltner.0002.a:0 "Um(a) [sighting_county_1.Custom('GetAnimalType')] gorda logo estará cozinhando na minha panela."
 nomad_events_oltner.0002.b:0 "Prefiro treinar os cães."
 nomad_events_oltner.0002.c:0 "Não posso perder tempo com isso."
 nomad_events_oltner.0002.desc:0 "Rumores dizem de um [sighting_province_1.Custom('GetAnimalGroup')] de [sighting_county_1.Custom('GetAnimalPlural')] avistado nas [sighting_province_1.Custom('GetTerrainTypePlural')] de [sighting_county_1.GetBaseNameNoTier] — uma oportunidade perfeita para treinar nossos falcões.\n\nClaro, eu poderia escolher perseguir caça maior em vez disso."
 nomad_events_oltner.0002.t:0 "Trilhas de Penas"
 nomad_events_oltner.0003.a:0 "Minhas flechas irão perfurar os corações dos(a) [sighting_county_1.Custom('GetAnimalPlural')]."
 nomad_events_oltner.0003.b:0 "Meu [maa_regiment.GetNameNoTooltip] matará o [sighting_county_1.Custom('GetAnimalGroup')]."
 nomad_events_oltner.0003.c:0 "[ROOT.Char.GetFaith.FertilityGodName] fará com que se afastem."
 nomad_events_oltner.0003.desc:0 "Vinte ovelhas mortas, um pastor mutilado e pegadas levando para as [sighting_province_1.Custom('GetTerrainTypePlural')]. Um [sighting_county_1.Custom('GetAnimalAdjective')] [sighting_county_1.Custom('GetAnimalGroup')] de [sighting_county_1.Custom('GetAnimalPlural')] está matando o que é meu em [sighting_county_1.GetBaseNameNoTier].\n\nDevo preparar meu arco e aljava. Minha reputação como [ROOT.Char.GetTitleAsNameNoTooltip] está em jogo."
 nomad_events_oltner.0003.t:0 "Um [sighting_county_1.Custom('GetAnimalGroup')|U] de [sighting_county_1.Custom('GetAnimalPlural')|U]"
 nomad_events_oltner.0004.a:0 "Eu caçarei cada último [sighting_county_1.Custom('GetAnimalType')]!"
 nomad_events_oltner.0004.b:0 "Esqueça os(a) [sighting_county_1.Custom('GetAnimalPlural')]. Precisamos partir."
 nomad_events_oltner.0004.desc:0 "O [my_subregion.GetCurrentPhase.GetName] não oferece nada além de neve e gelo. Até que o [sighting_county_1.Custom('GetAnimalGroup')] de [sighting_county_1.Custom('GetAnimalPlural')] se instalou. Eles comem tudo o que veem. Agora também nos oferecem a morte.\n\nNão ficarei parado enquanto meu rebanho e meu povo morrem."
 nomad_events_oltner.0004.t:0 "[sighting_county_1.Custom('GetAnimalPlural')|U] no Zud"
 nomad_events_oltner.0005.a:0 "Eu buscarei uma besta feroz."
 nomad_events_oltner.0005.b:0 "Cavalgamos em busca de veados e alces!"
 nomad_events_oltner.0005.c:0 "As garras de nossos falcões buscam novas presas."
 nomad_events_oltner.0005.desc:0 "Este tempo de [my_subregion.GetCurrentPhase.GetName] chama por boa caça. A presa é abundante, reunindo-se nas [sighting_province_1.Custom('GetTerrainTypePlural')] de [sighting_county_1.GetBaseNameNoTier] em grande número — uma estação verdadeiramente abençoada por [ROOT.Char.GetFaith.WealthGodName].\n\nNão importa o que eu escolha caçar, terei minha escolha."
 nomad_events_oltner.0005.t:0 "Novas Trilhas a Seguir"
 nomad_events_oltner.0006.a:0 "[offered_master_of_the_hunt.GetFirstNameNoTooltip] me servirá bem."
 nomad_events_oltner.0006.b:0 "Uma oferta esplêndida, deixe-me recompensá-lo."
 nomad_events_oltner.0006.c:0 "Fique com [offered_master_of_the_hunt.GetSheHe], e que suas caçadas sejam bem-sucedidas."
 nomad_events_oltner.0006.desc:0 "\"Curvo-me diante de vós, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('FormalComplimentAdjective')] suseran[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )],\" diz meu tributário, [generous_tributary.GetTitledFirstName], prostrando-se diante de mim.\n\n\"Ofereço-lhe o serviço de [offered_master_of_the_hunt.GetFirstNameNicknamed], o melhor [GetCourtPositionType('master_of_hunt_court_position').CalcTriggeredNameNoTooltip( ROOT.Char )] de toda a [generous_tributary.GetPrimaryTitle.GetAdjective]. Que [offered_master_of_the_hunt.GetSheHe] derrube muitos veados em seu nome.\""
 nomad_events_oltner.0006.t:0 "Tributo da Caçada"
 nomad_events_oltner.0007.a:0 "Eu a chamarei de '[ROOT.Char.Custom('GetBirdName')|U]!'"
 nomad_events_oltner.0007.b:0 "Por favor, fique com ela."
 nomad_events_oltner.0007.desc:0 "\"[ROOT.Char.Custom('FormalComplimentAdjective')|U] suseran[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], ofereço-lhe este presente.\" [generous_tributary.GetTitledFirstName], meu tributário, ergue uma ave majestosa diante de mim.\n\n\"Este falcão vem das [tribute_capital.Custom('GetTerrainTypePlural')] de [tribute_capital_county.GetBaseNameNoTier], e a treinei pessoalmente desde que era um filhote. Ela derrubará centenas de patos e bustardos para você; isso eu juro.\""
 nomad_events_oltner.0007.t:0 "Tributo de Penas"
