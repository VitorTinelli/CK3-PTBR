l_spanish:
 KHOGSTE_GLOSS:0 "Uma armadilha de pé que foi enterrada e ancorada no chão, feita de vários tipos de pedra."
 mpo_events_anna.0001.a.toast.bad:0 "[child.GetFirstNameNoTooltip] cai do cavalo"
 mpo_events_anna.0001.a.toast.good:0 "[child.GetFirstNameNoTooltip] aprende a montar"
 mpo_events_anna.0001.a.toast.neutral:0 "[child.GetFirstNameNoTooltip] não aprende a montar"
 mpo_events_anna.0001.a.tt:0 "Eu amarro [child.GetFirstNameNoTooltip] a um cavalo com a corda."
 mpo_events_anna.0001.a:0 "Coloque [child.GetFirstNameNoTooltip] sozinh[Select_CString( child.IsFemale, 'a', 'o' )] no cavalo."
 mpo_events_anna.0001.b:0 "Cavalgar com [child.GetFirstNameNoTooltip] para que [child.GetSheHe] aprenda."
 mpo_events_anna.0001.c:0 "\"[child.GetFirstNameNoTooltip] vai entender como se faz com o tempo.\""
 mpo_events_anna.0001.desc:0 "M[Select_CString( pushy_adult.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('pushy_adult'))] [pushy_adult.GetFirstName] e eu estamos observando m[Select_CString( child.IsFemale, 'inha', 'eu' )] [child.Custom('GetDaughterSon')] [child.GetFirstName], enquanto [child.GetSheHe] salta alegremente pelo acampamento com algumas pedras nas mãos, pront[Select_CString( child.IsFemale, 'a', 'o' )] para brincar. [pushy_adult.GetFirstNameNoTooltip] se vira animadamente para mim com um enorme sorriso.\n\n\"Você não acha que já está na hora de [child.GetFirstNameNoTooltip] aprender a montar a cavalo ao invés de brincar com jogos infantis? Preparei um potro bem manso e uma corda que deve manter [child.GetSheHe] segur[Select_CString( child.IsFemale, 'a', 'o' )] durante sua primeira cavalgada.\""
 mpo_events_anna.0001.t:0 "Treinar Desde Jovem"
 mpo_events_anna.0005.a.tt:0 "Cavalos indomáveis com asas para voar, animais falando com humanos e clima tempestuoso controlado por deuses."
 mpo_events_anna.0005.a:0 "\"Conte-nos algo fantástico.\""
 mpo_events_anna.0005.b.tt:0 "Travessuras de velhos, pedidos mal interpretados e corridas que tomam rumos totalmente inesperados."
 mpo_events_anna.0005.b:0 "\"Talvez algumas risadas para animar a noite?\""
 mpo_events_anna.0005.c.tt:0 "Batalhas gloriosas, companheirismo e guerreiros lendários trazendo medo aos inimigos."
 mpo_events_anna.0005.c:0 "\"Lendas de heroísmo!\""
 mpo_events_anna.0005.desc:0 "À medida que a noite cai, as estrelas brilham intensamente nos cantos mais escuros do céu. Uma fogueira tremeluzente entre as iurtas forma uma cena convidativa para a multidão reunida.\n\n[storyteller.GetFirstName], [Select_CString( storyteller.IsFemale, 'nossa contadora', 'nosso contador' )] de histórias da noite, olha entre a multidão animada, aparentemente procurando por algo — ou por #EMP alguém#!.\n\nNossos olhos se encontram, e [storyteller.GetFirstNameNoTooltip] dá um salto repentino em minha direção, fazendo o grupo recuar, ligeiramente assustado com o salto. Um dedo é lentamente erguido por [storyteller.GetHerHim], apontando para mim. \"Agora é sua vez de escolher um conto antigo para ser recontado!\""
 mpo_events_anna.0005.t:0 "Histórias do Passado"
 mpo_events_anna.0010.a.tt.failure:0 "Você não entende as instruções de [whistler.GetFirstNamePossessiveNoTooltip]"
 mpo_events_anna.0010.a.tt.learning:0 "[learning skill|E] de [whistler.GetFirstName] aumentará sua chance de sucesso"
 mpo_events_anna.0010.a.tt.success:0 "Você consegue assobiar com sucesso"
 mpo_events_anna.0010.a:0 "Ouça atentamente as instruções."
 mpo_events_anna.0010.b:0 "\"Eu aprendo quando bem entender!\""
 mpo_events_anna.0010.desc:0 "À distância, vejo alguns dos cavalos do acampamento pastando pacificamente. Gostaria muito de conhecê-los melhor, mas atrair sua atenção tem sido difícil. Já tentei gesticular, andar de um lado para o outro e até gritar — só para ser completamente ignorado(a).\n\nFrustrado(a) com minhas tentativas inúteis, viro nos calcanhares e começo a voltar para o acampamento, apenas para dar de cara com [whistler.GetFirstName].\n\n\"Você vai precisar aprender novos truques para chamar seu cavalo. Siga meu exemplo.\""
 mpo_events_anna.0010.t:0 "Assobie Como uma Flecha"
 mpo_events_anna.0015.a:0 "Roubar a presa para reabastecer."
 mpo_events_anna.0015.b:0 "Mentir dizendo que a armadilha era minha desde o início."
 mpo_events_anna.0015.c:0 "Liberar o animal para ter uma chance de crescer."
 mpo_events_anna.0015.d:0 "Não é meu para tomar."
 mpo_events_anna.0015.desc:0 "Faint bestial cries and whimpers echo across the hills. Curious, I approach to take a closer look.\n\nHá um cervo abandonado preso em uma [Glossary( 'khogste', 'KHOGSTE_GLOSS' )], tentando desesperadamente puxar sua perna para fora enquanto chama pela proteção de sua mãe — mas sem sucesso.\n\nEmbora não seja algo que devamos tomar, devemos fazer tudo o que pudermos para sobreviver à árdua jornada que temos pela frente."
 mpo_events_anna.0015.t:0 "Um Pedaço de Carne"
 mpo_events_anna.0020.a.toast.bad:0 "Você não tratou as feridas do mensageiro"
 mpo_events_anna.0020.a.toast.good:0 "Você tratou com sucesso as feridas do mensageiro"
 mpo_events_anna.0020.a:0 "Trate as feridas [messenger.GetHerHim], rápido!"
 mpo_events_anna.0020.b.toast.bad:0 "Você se perdeu, não conseguindo entregar a mensagem"
 mpo_events_anna.0020.b.toast.good:0 "Você entregou com sucesso a mensagem para a próxima pessoa"
 mpo_events_anna.0020.b:0 "Assuma o último desejo [messenger.GetHerHim] de entregar a mensagem pessoalmente."
 mpo_events_anna.0020.c:0 "Eu não conheço essa pessoa e não sei se [messenger.GetSheHe] pode ser confiável."
 mpo_events_anna.0020.c_flavor:0 "#EMP Pilhar o corpo [messenger.GetHerHim], não é como se [messenger.GetSheHe] fosse precisar disso mais tarde#!"
 mpo_events_anna.0020.desc:0 "Cavalos trotam apressadamente pelos campos, indo em nossa direção. Aparece a silhueta de um[Select_CString( messenger.IsFemale, 'a', '' )] [messenger.GetWomanMan] a cavalo, fazendo seu máximo para não cair de sua montaria, lutando para se segurar.\n\n[messenger.GetSheHe|U] para abruptamente à nossa frente, descendo lentamente seu cavalo, claramente lutando. Uma ferida grave é vista nas costas [messenger.GetHerHim], é um milagre que [messenger.GetSheHe] ainda esteja de pé.\n\n“V-você d-d-e-eve e-entreg-ar… p-p-or-favor…” são as últimas palavras que [messenger.GetSheHe] consegue pronunciar enquanto aponta dolorosamente para o horizonte, com uma mensagem criptografada na mão, antes de fechar os olhos e cair para descansar…"
 mpo_events_anna.0020.t:0 "Corrida Contra o Tempo"
 mpo_events_anna.0020.war_impact.tt:0 "O resultado da sua escolha #EMP pode#! afetar outros em outro lugar"
 mpo_events_anna.0025.a.toast.failure:0 "Seu ritmo e tom estão um pouco fora"
 mpo_events_anna.0025.a.toast.success:0 "Você cantou com sucesso junto de [throat_singer.GetFirstName]"
 mpo_events_anna.0025.a:0 "Tentar imitar e cantar junto."
 mpo_events_anna.0025.b:0 "Ouvir e aproveitar."
 mpo_events_anna.0025.desc:0 "Canções podem nos fazer sentir mais conectados como povo por séculos, muito tempo depois de serem escritas. Outras podem inspirar, ou trazer-nos consolo e o alívio tão procurado durante as dificuldades. Algumas estão lá para revigorar nossos espíritos e nos manter lutando. Tais canções dificilmente são esquecidas, e elas fazem parte de nossa herança.\n\nUm encontro com um cantor sentado em cima de uma pedra me fez lembrar dessas coisas, enquanto sou seduzido por sua performance."
 mpo_events_anna.0025.t:0 "Melodias Familiares"
