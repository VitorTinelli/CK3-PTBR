l_spanish:
 mpo_the_great_steppe.0001.a:0 "Juntos, cavalgamos!"
 mpo_the_great_steppe.0001.desc:0 "Um mar interminável de grama e rochas. A estepe não é um lar misericordioso. Tendências são montadas e desmontadas com a mudança das estações — vilarejos inteiros movidos por uma forte nevasca ou um inimigo mais poderoso.\n\nO homem está à mercê das bestas. O que o rebanho precisa para sobreviver é o que o rebanho obterá.\n\nQuem conquistará os elementos e se erguerá como o Cã dos Khans?"
 mpo_the_great_steppe.0001.t:0 "A Grande Estepe"
 mpo_the_great_steppe.0002.a:0 "E assim o mundo continua girando."
 mpo_the_great_steppe.0002.desc.abundant_grazing:0 "A grama cresceu tanto que as crianças se perdem nela, as mães rindo enquanto as encontram.\n\nUm rebanho mais saudável seria impossível de imaginar, ou um tempo mais feliz."
 mpo_the_great_steppe.0002.desc.cold_zud:0 "O frio corta a pele de forma aguda, a pele ao redor das minhas bochechas começou a descascar. Os animais tremem sob os ventos fortes, sem energia para se alimentar."
 mpo_the_great_steppe.0002.desc.drought:0 "A terra está fragmentada e árida como um corte cicatrizado. A grama secou e os animais lutam pelas últimas palmeiras.\n\nChegou a hora de lutar ou fugir."
 mpo_the_great_steppe.0002.desc.havsarsan_zud:0 "Os rios secaram e os prados morreram estéreis. O gelo cobre o solo e nada pode crescer. Os animais caem mortos e logo seguimos.\n\n[ROOT.Char.GetFaith.HighGodName] nos ajude, pois devemos estar em [ROOT.Char.GetFaith.NegativeAfterLife]."
 mpo_the_great_steppe.0002.desc.obedience:0 "\n\nNo entanto, com menores chances de sobrevivência, as pessoas ficam muito mais suscetíveis a jurar sua obediência."
 mpo_the_great_steppe.0002.desc.sky_blessing:0 "Flores desabrocham e os animais crescem mais saudáveis do que nunca. As terras de pastagem se expandem para áreas consideradas mortas há gerações.\n\nCada criança nascida é abençoada com o amor de [ROOT.Char.GetFaith.HealthGodName] e a força de [ROOT.Char.GetFaith.WarGodName].\n\nSe eu fechar os olhos, posso imaginar que estamos no [ROOT.Char.GetFaith.PositiveAfterLife]."
 mpo_the_great_steppe.0002.desc.warm_nights:0 "Os pássaros cantam e as crianças brincam. Eu encontro [person.GetFirstName] deitad[Select_CString( person.IsFemale, 'a', 'o' )] na grama com seus olhos fechados, banhando-se no sol.\n\nGritos suaves vêm dos animais, bezerros e cordeiros recém-nascidos sendo cuidados com o maior carinho.\n\nSe ao menos pudesse sempre ser assim."
 mpo_the_great_steppe.0002.desc.white_zud:0 "Nenhuma grama pode ser vista sob as camadas de neve. Branca como a lua, a morte veio levar nossos animais."
 mpo_the_great_steppe.0002.t:0 "[my_subregion.GetNameNoTooltip]: [my_subregion.GetCurrentPhase.GetName]"
 mpo_the_great_steppe.0002.tt:0 "A estação da [steppe_season|E] mudou"
 mpo_the_great_steppe_0002_souvenirs_aplenty_tt:0 "Graças ao seu [perk|E] [GetPerk('souvenirs_aplenty_perk').GetName( GetPlayer )]"
 souvenirs_aplenty_perk_county_modifier:0 "Mudança das Estações"
 souvenirs_aplenty_perk_county_modifier_desc:0 "Graças à experiência de vida deles, este personagem aprendeu como lidar melhor com a mudança das estações."
