 mpo_abuse_authority_paiza_decision:0 "Abusar da Autoridade do Gurcã"
 mpo_abuse_authority_paiza_decision_confirm:0 "Em nome do [gurkhan|E]!"
 mpo_abuse_authority_paiza_decision_desc:0 "Carrego comigo o nome do Gurcã. As runas gravadas em minha paiza causam temor nos corações das pessoas. A terra ao meu redor é fértil, mas o povo que nela vive é fraco. Tomarei deles o que puder, não pela força bruta, mas em nome do Gurcã."
 mpo_abuse_authority_paiza_decision_tooltip:0 "O [gurkhan|E] fala por mim!"
 mpo_artifact_material_modifier:0 "Materiais para Artefato"
 mpo_artifact_material_modifier_desc:0 "Este personagem possui um amplo suprimento de matérias-primas para fabricar os artefatos mais ilustres.\n\nDesbloqueia a [decision|E] #V $commission_artifact_decision$#!"
 mpo_call_for_merchants:0 "Convocar Visitantes Ricos"
