 mpo_call_for_merchants_decision.buildings:0 "Várias [internal_upgrades|E] para a [yurt_building|E] [GetDomicileBuilding('trade_yurt_01').GetName] oferecem benefícios adicionais."
 mpo_call_for_merchants_decision.gold_needed:0 "Ofertas mais lucrativas exigem um investimento maior de [gold|E], até 2400 [gold_i|E]"
