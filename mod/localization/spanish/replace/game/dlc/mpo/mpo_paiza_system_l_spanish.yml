 mpo_paiza_abuse_counter_effect.indifferent:0 "O [gurkhan|E] está indiferente ao seu abuso de autoridade e não tomará nenhuma ação desta vez"
 mpo_paiza_abuse_counter_effect.khan_reaction_action:0 "@alert_icon! O [gurkhan|E] reagirá de forma #EMP violenta#!"
 mpo_paiza_abuse_counter_effect.khan_reaction_angry:0 "O [gurkhan|E] ficará #EMP furioso#!, mas não tomará nenhuma ação"
