 mpo_establish_paiza_system_decision.paiza_recently_established:0 "O Sistema de Paizas já foi estabelecido por [THIS.Char.GetName]. A vida [THIS.Char.GetHerHim] impede você de fundar um novo. Cada respiração patética [THIS.Char.GetHerHim] é um insulto à sua autoridade."
