 mpo_call_for_merchants_decision.merchant_will_arrive:0 "$mpo_call_for_merchants_decision.merchant_will_arrive_generic$\n$BULLET_WITH_TAB$Progresso aleatório em [innovation|E]"
 mpo_call_for_merchants_decision.merchant_will_arrive_generic:0 "Um estrangeiro rico viajará até sua corte, liderando uma caravana com destino às cidades povoadas e desenvolvidas. Após seu retorno, você poderá receber os seguintes benefícios:\n$BULLET_WITH_TAB$Cerca de #P 40%#! do seu investimento em [gold|E]\n$BULLET_WITH_TAB$Materiais para criação de [artifact|E] que desbloqueiam a [decision|E] #V $commission_artifact_decision$#!\n$BULLET_WITH_TAB$Armas para sua [horde|E] e [archer_cavalry|E]"
 mpo_call_for_merchants_decision.merchant_will_arrive_smol:0 "$mpo_call_for_merchants_decision.merchant_will_arrive_generic$\n$BULLET_WITH_TAB$Cerca de #P 20%#! do seu investimento em [gold|E]"
 mpo_call_for_merchants_decision.robbed_merchants:0 "O último forasteiro que atendeu seu chamado desapareceu violentamente, e isso já se espalhou. Levará um tempo até que outra alma imprudente ouse aparecer."
 mpo_call_for_merchants_decision:0 "$mpo_call_for_merchants$: Paiza"
 mpo_call_for_merchants_decision_confirm:0 "Enviar os emissários"
 mpo_call_for_merchants_decision_desc:0 "A Grande Estepe é muito mais magnífica do que aquelas cidades estrangeiras gordas e mimadas. Ainda assim, elas possuem bens, engenhocas e ideias que podem nos ser úteis. Talvez algum de seus tolos ricos se aventure até aqui."
 mpo_call_for_merchants_decision_is_gurkhan:0 "Você é o [gurkhan|E]"
 mpo_call_for_merchants_decision_tooltip:0 "$mpo_call_for_merchants_decision.merchant_will_arrive$"
 mpo_call_for_merchants_small_decision:0 "$mpo_call_for_merchants$: Ofertas Locais"
 mpo_call_for_merchants_small_decision_confirm:0 "Enviar o emissário"
 mpo_call_for_merchants_small_decision_desc:0 "$mpo_call_for_merchants_decision_desc$"
 mpo_call_for_merchants_small_decision_tooltip:0 "Melhore seus soldados ou habilite a criação de [artifact|E]."
 mpo_decisions_events.0099.a:0 "Minha vontade manifestada."
 mpo_decisions_events.0099.desc:0 "Meu poder é como as estepes: estende-se infinitamente além do horizonte. No entanto, sou como uma gota de chuva, fixa em apenas um lugar.\n\nAlém da estepe, o povo das cidades usa livros de registro para carregar conhecimento além de sua visão finita. Usarei essa ideia e distribuirei Paizas. Meus súditos leais carregarão as palavras mais importantes de todas: #EMP meu nome.#!\n\n[ROOT.Char.GetTitledFirstNameNoTooltip]: essas runas gravadas no artefato trarão medo e obediência absoluta."
 mpo_decisions_events.0099.t:0 "Sistema de Paizas Estabelecido"
 mpo_decisions_events.0100.a:0 "Tragam-me novas ideias."
 mpo_decisions_events.0100.a_not_unlocked:0 "Você não possui a [yurt_building|E] [GetDomicileBuilding('trade_yurt_01').GetName]"
 mpo_decisions_events.0100.b:0 "O aço será bem aproveitado."
 mpo_decisions_events.0100.c:0 "Armadura para minha Horda."
 mpo_decisions_events.0100.d.unlocked:0 "Você poderá selecionar os bens desejados após a troca de [herd|E].\n#weak Você tem acesso a esta opção porque possui a [yurt_building|E] [GetDomicileBuilding('herd_trade_yurt_01').GetName].#!"
 mpo_decisions_events.0100.d:0 "Vamos primeiro trocar o rebanho por ouro."
 mpo_decisions_events.0100.desc:0 "$mpo_decisions_events.2141.desc$"
 mpo_decisions_events.0100.e.warning:0 "@alert_icon! #alert_trial Nenhum outro visitante rico ousará aparecer em sua corte por duas décadas. Você não poderá realizar a [decision] #V $mpo_call_for_merchants_decision$#! durante esse período.#!"
 mpo_decisions_events.0100.e:0 "Sua riqueza. E sua vida. Agora."
 mpo_decisions_events.0100.t:0 "$mpo_call_for_merchants_decision$"
 mpo_decisions_events.0100.upon_merchant_return:0 "Quando [paiza_merchant.GetNameNoTooltip] retornar de sua viagem para [merchant_origin.GetName]:"
 mpo_decisions_events.0101.a:0 "Maravilhoso!"
 mpo_decisions_events.0101.b.desc:0 "[paiza_merchant.GetName] irá entretê-lo com histórias sobre as terras por onde [paiza_merchant.GetSheHe] passou."
 mpo_decisions_events.0101.b:0 "Conte-me histórias de terras distantes"
 mpo_decisions_events.0101.desc:0 "[paiza_merchant.GetName] chegou e agora saboreia [Glossary( 'kumis', 'KUMIS_GLOSS' )] na minha tenda, após uma longa e árdua jornada até [merchant_origin.GetName].\n\nOs bens preciosos que pedi estão sendo descarregados. O lobo da estepe e o cordeiro da cidade encontraram uma forma de coexistir, ainda que por um tempo limitado."
 mpo_decisions_events.0101.t:0 "O Estrangeiro Retorna"
 mpo_decisions_events.0110.a:0 "Reúnam tudo que se move!"
 mpo_decisions_events.0110.b.failure:0 "[paiza_patron.GetTitledFirstName] fica sabendo desse abuso"
 mpo_decisions_events.0110.b.success:0 "Sucesso"
 mpo_decisions_events.0110.b.success_desc:0 "Nenhuma palavra sobre o que aconteceu aqui chega a [paiza_patron.GetTitledFirstName]"
 mpo_decisions_events.0110.b:0 "\"Não digam uma palavra, cães!\""
 mpo_decisions_events.0110.c:0 "Mudei de ideia."
 mpo_decisions_events.0110.d:0 "Isso é #EMP errado.#! Vamos sair!"
 mpo_decisions_events.0110.desc:0 "Sou um súdito #EMP leal#! de [paiza_patron.GetTitledFirstName]. Carrego o nome [paiza_patron.GetHerHim] gravado no metal e sua vontade em minhas palavras e ações. Minha força é a [paiza_patron.GetHerHim].\n\nO fraco [local_boi.GetName] pode implorar o quanto quiser. Nada mudará o decreto do Gurcã que sai da minha boca.\n\nToda a riqueza, todos os animais apropriados dessas terras, devem ser reunidos imediatamente e trazidos a mim. Pois sua fraqueza insulta a autoridade de [paiza_patron.GetTitleAsNamePossessiveNoTooltip], e eu darei a tudo isso um... #EMP uso melhor#!."
 mpo_decisions_events.0110.t:0 "Em Nome de [paiza_patron.GetTitleAsNameNoTooltip]"
 mpo_decisions_events.0111.a.effects:0 "[paiza_patron.GetName] recebe um [imprisonment_reason|E] e um [execute_reason|E] contra você."
 mpo_decisions_events.0111.a.severe_effects:0 "[paiza_patron.GetName] recebe um [imprisonment_reason|E] e um [execute_reason|E] contra você e seus [close_family_members|E]."
 mpo_decisions_events.0111.a.survived_khans_wrath:0 "Apesar de sobreviver à ira do Gurcã, você não poderá abusar de sua autoridade novamente."
 mpo_decisions_events.0111.a:0 "Aceito o julgamento."
 mpo_decisions_events.0111.b:0 "\"Ah, mas meus atos foram justos, veja bem...\""
 mpo_decisions_events.0111.desc:0 "O Gurcã é como as estepes em si. O poder e a vontade de [paiza_patron.GetNamePossessive] se estendem por toda parte. O nome [paiza_patron.GetHerHim] é sussurrado pelo vento.\n\nCarreguei o nome [paiza_patron.GetHerHim] comigo, gravado no metal da Paiza. Usei-o para incutir medo e obediência nos corações das pessoas. Uma vez a mais do que devia, ao que parece.\n\nAgora é a minha vez de temer. O Gurcã soube de meus atos e os chamou de abuso da palavra [paiza_patron.GetHerHim], do nome [paiza_patron.GetHerHim]. E por isso, me tornarei um exemplo horrível para toda a estepe ver."
 mpo_decisions_events.0111.t:0 "A Ira do Gurcã"
 mpo_decisions_events.0112.a.desc:0 "Outros [characters|E] com suas [paiza|E]s ficarão menos propensos a abusar de sua autoridade se tanto [paiza_abuser.GetFirstName] quanto [paiza_abuser_1.GetFirstName] estiverem mortos."
 mpo_decisions_events.0112.a:0 "Tragam-me suas cabeças!"
 mpo_decisions_events.0112.b:0 "Vou deixar passar... por enquanto."
 mpo_decisions_events.0112.c.flavor:0 "Mais abusos de sua autoridade ocorrerão, mas você não será mais notificado."
 mpo_decisions_events.0112.c:0 "Nunca mais me incomodem com isso."
 mpo_decisions_events.0112.desc:0 "Sou como a própria estepe. Minha força e vontade se estendem por toda parte. Meu nome é sussurrado pelo vento.\n\nCavaleiros carregam meu nome com eles, gravado no metal de suas Paizas. Mas alguns o distorcem como serpentes, tolos gananciosos como [paiza_abuser.GetName] e [paiza_abuser_1.GetName]. Não faz tanto tempo que [paiza_abuser.GetSheHe] se prostrou diante de mim como um verme, agora [paiza_abuser.GetSheHe] abusa dos meus súditos leais, que olham para mim em busca de respostas, de justiça. Que o vento leve minha verdadeira vontade agora!\n\n\"Acabei de saber. Que saibam que [ROOT.Char.GetTitledFirstNameNoTooltip] enfrenta qualquer cão castrado, [paiza_abuser.GetFirstNameNoTooltip], [paiza_abuser_1.GetFirstNameNoTooltip], quem quer que seja. Meu nome é o meu nome!\""
 mpo_decisions_events.0112.t:0 "$mpo_decisions_events.0111.t$"
 mpo_decisions_events.2137.a:0 "Entendo."
 mpo_decisions_events.2137.b:0 "Conte-me mais!"
 mpo_decisions_events.2137.c:0 "Fique em minha tenda."
 mpo_decisions_events.2137.desc_interludium:0 "\n\n#![paiza_merchant.GetSheHe|U] recupera o fôlego e depois divaga sobre outro reino:\n#weak"
 mpo_decisions_events.2137.desc_intro:0 "[paiza_merchant.GetName] respira fundo, olha ao longe e começa a tecer uma história:\n#weak"
 mpo_decisions_events.2137.t:0 "As Viagens de [paiza_merchant.GetFirstNameNoTooltip]"
 mpo_decisions_events.2138.a:0 "Fechado."
 mpo_decisions_events.2138.b:0 "Dê mais, ganhe mais."
 mpo_decisions_events.2138.c.desc:0 "Você não realizará a troca de [herd|E] e voltará a discutir o objetivo da viagem de [paiza_merchant.GetNamePossessive]."
 mpo_decisions_events.2138.c:0 "Vamos voltar."
 mpo_decisions_events.2138.desc:0 "Você e [paiza_merchant.GetName] caminham até sua [GetDomicileBuilding('trade_yurt_01').GetName] para discutir os detalhes. [paiza_merchant.GetSheHe|U] explica:\n\n\"Posso comprar de você uma quantidade considerável de rebanho. Fiz algumas conexões enquanto viajava até aqui. Não há um comprador em grande escala, mas devo conseguir visitar criadores menores no caminho de volta e lucrar. Ou pelo menos não perder muito.\n\nFaço essa oferta em respeito a você e à sua majestade, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip].\""
 mpo_decisions_events.2138.desc_rate_1:0 "[GetDomicileBuilding('herd_trade_yurt_01').GetName] 6 [herd_i] por 1 [gold_i]"
 mpo_decisions_events.2138.desc_rate_2:0 "[GetDomicileBuilding('herd_trade_yurt_03').GetName] 4 [herd_i] por 1 [gold_i]"
 mpo_decisions_events.2138.desc_rate_3:0 "[GetDomicileBuilding('herd_trade_yurt_06').GetName] 2 [herd_i] por 1 [gold_i]"
 mpo_decisions_events.2138.t:0 "Rebanho por Ouro"
 mpo_decisions_events.2141.already_traded:0 "Você já trocou [herd|E] por [gold|E]"
 mpo_decisions_events.2141.b:0 "$mpo_decisions_events.0100.b$"
 mpo_decisions_events.2141.c:0 "$mpo_decisions_events.0100.c$"
 mpo_decisions_events.2141.d.unlocked:0 "$mpo_decisions_events.0100.d.unlocked$"
 mpo_decisions_events.2141.d:0 "$mpo_decisions_events.0100.d$"
 mpo_decisions_events.2141.desc:0 "[paiza_merchant.GetName] chegou mais cedo do que eu esperava, com poeira nas botas e um brilho nos olhos.\n\n\"Obrigado por permitir minha presença aqui, sábio e poderoso [ROOT.Char.GetTitleAsNameNoTooltip]. Ouvi dizer que você tem interesse em mercadorias de [merchant_origin.GetNameNoTier], mercadorias que posso trazer até sua tenda. Liderarei a caravana até lá e de volta.\n\nTrarei humildemente aquilo que deseja. É aço bruto das melhores fornalhas? Conjuntos de armadura que repelem qualquer golpe? Ou algo mais?\""
