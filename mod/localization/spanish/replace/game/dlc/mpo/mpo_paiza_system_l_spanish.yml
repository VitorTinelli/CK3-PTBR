 mpo_establish_paiza_system_decision:0 "Estabelecer o Sistema de Paizas"
 mpo_establish_paiza_system_decision_confirm:0 "Pelo poder do Céu Eterno"
 mpo_establish_paiza_system_decision_desc:0 "Um sistema de tabuletas especiais será estabelecido para atrair estrangeiros ricos e fortalecer os súditos leais de [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]. [ROOT.Char.GetSheHe|U] que carregar uma [paiza|E] com o nome de [ROOT.Char.GetTitledFirstNameNoTooltip] levará minha autoridade e terá passagem segura por minhas terras. Aqueles que ousarem desrespeitar meu nome serão mortos como cães."
