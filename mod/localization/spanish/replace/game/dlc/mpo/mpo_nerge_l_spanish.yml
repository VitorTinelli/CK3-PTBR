 hunt_make_example_title:0 "[root_scope.GetShortUINameNoTooltip] Fez um Exemplo de Alguns Cavaleiros Depois que Deixaram um Animal Fugir"
 hunt_martial_mastery_title:0 "[hunter.GetShortUINameNoTooltip|U] Conduziu um Contingente de Cavaleiros para Derrubar uma Besta Perigosa"
 hunt_prowess_mastery_title:0 "[hunter.GetShortUINameNoTooltip|U] Matou uma Besta Perigosa"
 hunt_successful_kill_title:0 "[hunter.GetShortUINameNoTooltip|U] Matou Vários Animais"
 hunt_successful_maneuver_title:0 "[hunter.GetShortUINameNoTooltip|U] Conduziu uma Manobra Bem-Sucedida"
 hunt_type_nerge:0 "Nerge"
 hunt_type_nerge_desc:0 "$BULLET$ Caçar centenas de animais para mostrar destreza e força\n$BULLET$ Ganhe [legitimacy_i][legitimacy|E], [gold_i][gold|E], [dread_i][dread|E] e [prestige_i][prestige|E] dependendo do resultado\n$BULLET$ Pode ganhar [martial_i][martial|E], [command_modifier_i][commander_traits|E], ou [trait_level_track_xp|E]\n$hunt_type_nerge_flavor$"
 hunt_type_nerge_flavor:0 "#weak O Nerge é uma grande caçada onde centenas, se não milhares, de animais são abatidos. É uma oportunidade para [Select_CString( GetPlayer.IsFemale, 'a', 'o' )] [GetPlayer.GetTitleAsNameNoTooltip] impressionar tanto vassalos quanto tributários com sua força.#!"
 hunt_very_successful_kill_title:0 "[hunter.GetShortUINameNoTooltip|U] Matou uma Dozen de Animais"
 hunt_worked_together_title:0 "[hunter.GetShortUINameNoTooltip|U] e [hunter_2.GetShortUINameNoTooltip] Trabalharam Juntos"
 mpo_nerge.0010.a:0 "Mostre-me a força de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]!"
 mpo_nerge.0010.desc.intro.master_of_hunt:0 "Cavaleiros estão alinhados atrás de mim, em uma coluna que se estende à esquerda e à direita. '[master_of_hunt.GetFirstName]', todos aguardam o sinal para começar.' [master_of_hunt.GetSheHe] me diz, enquanto [master_of_hunt.GetSheHe] se aproxima um pouco mais. 'Os preparativos estão prontos.'\n\n"
 mpo_nerge.0010.desc.intro:0 "Cavaleiros estão alinhados atrás de mim, em uma coluna que se estende à esquerda e à direita. Todos aguardam o sinal para começar, para que [ROOT.Char.GetTitleAsNameNoTooltip] inicie a grande caçada.\n\n"
 mpo_nerge.0010.desc.outro.alt.moh:0 "Eu dou uma aceno para [master_of_hunt.GetSheHe], e [master_of_hunt.GetSheHe] levanta o arco com a flecha já pronta. Ela canta enquanto [master_of_hunt.GetSheHe] solta a flecha, seguida de um grito de animal. A caça começou."
 mpo_nerge.0010.desc.outro.alt:0 "Eu dou uma aceno para um dos meus cavaleiros, e [ROOT.Char.GetSheHe] levanta o arco com a flecha já pronta. Ela canta enquanto [ROOT.Char.GetSheHe] solta a flecha, seguida de um grito de animal. A caça começou."
 mpo_nerge.0010.desc.outro:0 "Eu encaixo uma flecha, levanto o arco e solto a flecha. Com um grito de dor, vejo uma cabra gorda cair, contorcendo-se no chão. Seguem-se balidos em pânico enquanto o caos se espalha entre os animais, seguidos pelos batimentos rítmicos das patas dos cavalos enquanto os cavaleiros partem em busca da caça."
 mpo_nerge.0010.t:0 "A Grande Nerge Começa"
 mpo_nerge.0015.a:0 "E mesmo assim, eu serei o melhor caçador aqui!"
 mpo_nerge.0015.desc:0 "Após uma longa espera, finalmente nos alinhamos. Depois de um pouco de vai-e-vem, finalmente, [host.GetTitledFirstName] levanta o arco para matar o primeiro animal. Segue-se um grito de dor, seguido de balidos em pânico, enquanto os animais enlouquecem.\n\nNo momento em que ouvimos o grito, vários cavaleiros partem imediatamente. Todos estão tentando se provar, para si mesmos, para os outros e para [host.GetTitleAsNameNoTooltip]."
 mpo_nerge.0015.t:0 "$mpo_nerge.0010.t$"
 mpo_nerge.0110.a:0 "Que vergonha..."
 mpo_nerge.0110.desc:0 "Apesar de nossas melhores tentativas, a caça foi uma visão deprimente. Alguns animais caíram, mas não quase tantos quanto planejamos ou esperávamos.\n\nMeus companheiros cavaleiros olham para mim com olhos desanimados, a vergonha tão pesada neles quanto em mim. Como podemos mostrar nossos rostos em [ROOT.Char.GetCapitalLocation.GetName] depois disso?"
 mpo_nerge.0110.t:0 "Nerge Fracassada"
 mpo_nerge.0115.a:0 "A carne nos sustentará durante a temporada."
 mpo_nerge.0115.desc:0 "Finalmente, ao terminar a Nerge, olhamos para todos os animais mortos que conseguimos caçar. É uma cena e tanto, enquanto começamos a separar e a cortar os animais antes que estraguem.\n\nHá um bom clima enquanto fazemos o nosso trabalho, todos satisfeitos com os resultados da caça em si."
 mpo_nerge.0115.t:0 "Nerge Bem-Sucedida"
 mpo_nerge.0120.a:0 "Esta carne nos sustentará por várias temporadas."
 mpo_nerge.0120.desc:0 "Foi uma caça bastante bem-sucedida, com dezenas e mais dezenas de animais agora mortos aos nossos pés. Felizmente, há pessoas suficientes para processá-los, então podemos cortá-los e levar toda a carne excedente para casa.\n\nO cheiro de sangue e suor paira no ar, e ainda assim, todos estão felizes compartilhando suas melhores histórias da caçada uns com os outros."
 mpo_nerge.0120.t:0 "Nerge Digna"
 mpo_nerge.0125.a:0 "Que conquista!"
 mpo_nerge.0125.desc:0 "Nossa caça foi um grande sucesso, e eu lentamente caminho pelas pequenas colinas de animais abatidos. É uma visão impressionante, sem dúvida, e todos estão ocupados cortando as carnes das bestas.\n\nOuço vários caçadores se gabando de suas caçadas, cada um contando uma história mais exagerada que a outra. Com certeza haverá carne suficiente para nos sustentar em muitos banquetes que virão."
 mpo_nerge.0125.t:0 "Grande Nerge"
 mpo_nerge.0130.a:0 "Nosso povo se lembrará desta Nerge."
 mpo_nerge.0130.desc:0 "Um mar de carne e sangue mancham o solo, e o cheiro de sangue paira denso no ar. Apesar disso, só se encontra alegria entre todos os caçadores, que estão felizes enquanto se movem entre os animais abatidos.\n\nOs acompanhantes e os outros membros da caça estão todos ocupados cortando os animais, mas eu não consigo me afastar da cena. Como vamos levar toda essa carne para casa?"
 mpo_nerge.0130.t:0 "Nerge Excelente"
 mpo_nerge.1000.a.tt.failure:0 "Não há [activity.Custom('GetAnimalPlural')] para serem encontrados"
 mpo_nerge.1000.a.tt.success:0 "[ROOT.Char.Custom('EagleStoryNamePossessive')|U] encontra mais [activity.Custom('GetAnimalPlural')]"
 mpo_nerge.1000.a:0 "[ROOT.Char.Custom('EagleStoryName')], nos guie até os(a) [activity.Custom('GetAnimalPlural')]!"
 mpo_nerge.1000.b.tt.success:0 "Os cavaleiros encontram alguns(a) [activity.Custom('GetAnimalPlural')]"
 mpo_nerge.1000.b:0 "Meus melhores cavaleiros podem procurar por esse(a) [ROOT.Char.Custom('GetAnimalType')]..."
 mpo_nerge.1000.c:0 "Uma boa captura, mas há coisas melhores para serem encontradas."
 mpo_nerge.1000.desc:0 "Minha águia, [ROOT.Char.Custom('EagleStoryName')], passou sobre nosso grupo de caçadores, procurando por presas. [ROOT.Char.Custom('EagleStorySheHe')|U] retorna para o meu braço e pousa, trazendo a pele de [ROOT.Char.Custom('GetAnimalArticle')] [ROOT.Char.Custom('GetAnimalType')].\n\nO que [ROOT.Char.Custom('EagleStorySheHe')|U] trouxe pode guiar nossa caça, ou pode ser o resultado de uma boa sorte."
 mpo_nerge.1000.t:0 "Sinal de [ROOT.Char.Custom('EagleStoryNamePossessive')|U]"
 mpo_nerge.1005.a.tt.failure:0 "Seus cavaleiros falham em capturar qualquer presa"
 mpo_nerge.1005.a.tt.success:0 "Seu plano foi bem-sucedido"
 mpo_nerge.1005.a.tt:0 "Você lidera um pequeno grupo de cavaleiros para caçar mais [activity.Custom('GetAnimalPlural')]"
 mpo_nerge.1005.a:0 "Muito bem, eu vou te mostrar o poder."
 mpo_nerge.1005.b.tt.failure:0 "[dissenter.GetFirstNameNoTooltip] se envergonha"
 mpo_nerge.1005.b.tt.success:0 "[dissenter.GetFirstNameNoTooltip] consegue capturar alguns(a) [activity.Custom('GetAnimalPlural')]"
 mpo_nerge.1005.b.tt:0 "[dissenter.GetFirstNameNoTooltip] lidera um pequeno grupo de cavaleiros"
 mpo_nerge.1005.b:0 "Prove seu valor, [dissenter.GetFirstNameNoTooltip]!"
 mpo_nerge.1005.c:0 "Meu objetivo não é te impressionar."
 mpo_nerge.1005.desc:0 "Centenas de bestas selvagens foram abatidas, suas carcaças e sangue manchando o solo. Mas, apesar desse sucesso iminente, alguns não estão satisfeitos com nossos despojos.\n\n'Eu pensei que viemos aqui para testemunhar poder.' [dissenter.GetFirstName] diz, com sua voz se destacando no barulho da caça. 'Devemos fazer mais. Se eu tivesse disparado a primeira flecha, teríamos carne suficiente para nos sustentar por uma dúzia de invernos!'\n\n[dissenter.GetFirstNameNoTooltip] me olha, com os olhos ardendo com uma luz feroz. 'Você não concorda, [ROOT.Char.GetTitleAsNameNoTooltip]?'"
 mpo_nerge.1005.t:0 "Uma Voz de Dúvida"
 mpo_nerge.1010.a.tt.death:0 "[chaser.GetFirstNameNoTooltip] é atropelado pelos(a) [activity.Custom('GetAnimalPlural')]"
 mpo_nerge.1010.a.tt.injury:0 "[chaser.GetFirstNameNoTooltip] é ferido pelos(a) [activity.Custom('GetAnimalPlural')]"
 mpo_nerge.1010.a:0 "Deixe [chaser.GetSheHe] para os(a) [activity.Custom('GetAnimalPlural')]!"
 mpo_nerge.1010.b.tt.failure:0 "Somente alguns(a) [activity.Custom('GetAnimalPlural')] ficaram para trás"
 mpo_nerge.1010.b.tt.success:0 "Você consegue pegar vários(a) [activity.Custom('GetAnimalPlural')] que estavam escapando"
 mpo_nerge.1010.b:0 "Reagrupem-se e recolham o que pudermos dos restos."
 mpo_nerge.1010.c:0 "[chaser.GetSheHe|U] ainda é um de nós, esse erro é só humano."
 mpo_nerge.1010.c_obedience:0 "Enquanto [chaser.GetSheHe] se curvar para mim, [chaser.GetSheHe] será perdoado."
 mpo_nerge.1010.desc:0 "Com cada caçador em sua posição adequada, nossos cavaleiros se aproximam de um grupo de [activity.Custom('GetAnimalPlural')]. Alguns exploram as bestas troteando ligeiramente à frente de nossa formação, enquanto outros estão prontos para atacar.\n\nDe maneira imprudente, [chaser.GetFirstName] corre à frente, fazendo com que algumas dos(a) [activity.Custom('GetAnimalPlural')] se dispersem. As tentativas [chaser.GetHerHim] para reuni-las são em vão, e as bestas tentam fugir de nosso alcance."
 mpo_nerge.1010.t:0 "Quebrando o Círculo"
 mpo_nerge.1015.a.tt.failure:0 "As bestas ferem vários cavaleiros"
 mpo_nerge.1015.a.tt.success:0 "Os(a) [activity.Custom('GetAnimalPlural')] são atropelados(a)"
 mpo_nerge.1015.a:0 "Essa é a nossa chance, matem todas elas!"
 mpo_nerge.1015.b:0 "Deixe-as passar, mas abate os que ficam para trás."
 mpo_nerge.1015.c:0 "É natural que fugam, deixem-nas voltar para a natureza."
 mpo_nerge.1015.d:0 "[hunter_1.GetFirstNameNoTooltip] e [hunter_2.GetFirstNameNoTooltip] pagarão pelas perdas."
 mpo_nerge.1015.desc:0 "\"[GetPlayer.GetTitleAsNameNoTooltip]! Os(a) [activity.Custom('GetAnimalPlural')] quebraram o cerco!\" [hunter_1.GetFirstName] grita, com [hunter_2.GetFirstName] seguindo logo atrás.\n\nSobre o horizonte, dezenas de [activity.Custom('GetAnimalPlural')] correm em direção aos cavaleiros e ao acampamento. É claro que a caça deu errado, mas a retirada não é uma opção."
 mpo_nerge.1015.t:0 "Estampida das Estepes"
 mpo_nerge.1020.a.tt:0 "Alguns(a) [activity.Custom('GetAnimalPlural')] são deixados(a) para repovoar"
 mpo_nerge.1020.a:0 "Pegue o que precisamos e deixe o resto ir."
 mpo_nerge.1020.b:0 "Ceder é fraqueza. Devemos caçar!"
 mpo_nerge.1020.c.tt.failure:0 "Quase nenhum(a) [activity.Custom('GetAnimalPlural')] restou"
 mpo_nerge.1020.c.tt.success:0 "Os(a) [activity.Custom('GetAnimalPlural')] permanecem ilesos"
 mpo_nerge.1020.c.tt:0 "Você tenta abater apenas os(a) [activity.Custom('GetAnimalPlural')] menos viáveis"
 mpo_nerge.1020.c:0 "Observe esses(a) [activity.Custom('GetAnimalPlural')] — vamos encontrar os mais fracos."
 mpo_nerge.1020.desc:0 "\"Embora seja uma prova sólida do nosso progresso, receio que deixemos poucos(a) [activity.Custom('GetAnimalPlural')] vivos(a),\" [master_of_hunt.GetFirstName] explica. \"Não quero deixar a terra estéril.\"\n\nConseguimos abater o suficiente de [activity.Custom('GetAnimal')] para nos alimentar por muitas luas, mas a caça se tornou tediosa à medida que seus números diminuem. [master_of_hunt.GetFirstNameNoTooltip] orientou os cavaleiros a procurar mais enclaves, mas os(a) [activity.Custom('GetAnimalPlural')] estão se tornando cada vez mais raros(a)."
 mpo_nerge.1020.t:0 "Presas Dispersas"
 mpo_nerge.1025.a.flavor:0 "Que entrada perfeita para um banquete!"
 mpo_nerge.1025.a.tt:0 "Se você não organizar uma [GetActivityType('activity_feast').GetName] até o final do ano, você perderá [prestige|E] e [opinion|E]"
 mpo_nerge.1025.a:0 "A glória não importa, todos compartilharemos os despojos."
 mpo_nerge.1025.b.tt.hunter_1:0 "[hunter_1.GetFirstNameNoTooltip] vence a luta"
 mpo_nerge.1025.b.tt.hunter_2:0 "[hunter_2.GetFirstNameNoTooltip] vence a luta"
 mpo_nerge.1025.b.tt:0 "Os caçadores resolvem sua disputa com uma luta"
 mpo_nerge.1025.b:0 "Isso é mais fácil de decidir com um teste de força."
 mpo_nerge.1025.c.tt.failure:0 "Ninguém acredita na sua alegação"
 mpo_nerge.1025.c.tt.success:0 "Os outros caçadores se alinham com você"
 mpo_nerge.1025.c.tt:0 "Você tenta reivindicar a caça para si mesmo"
 mpo_nerge.1025.c:0 "Idiotas! Foi minha flecha que atingiu a besta!"
 mpo_nerge.1025.d:0 "Eu vi, [intent_target.GetFirstNameNoTooltip] atingiu a besta!"
 mpo_nerge.1025.desc:0 "Dezenas de [activity.Custom('GetAnimalPlural')] foram abatidas até agora, e a maior delas caiu por uma flecha desconhecida. Antes que alguém possa inspecionar a besta, [hunter_1.GetFirstName] se adianta para reivindicar a glória da caça. [hunter_2.GetFirstName] o segue, e os dois começam a discutir sobre quem merece a honra.\n\n\"Está claro como o dia que minha flecha atingiu a besta!\" [hunter_1.GetFirstName] exclama. \"Você estava muito atrás para sequer tê-la atingido!\"\n\n[hunter_2.GetFirstName] zombam. A tensão entre os dois cresce, e a discussão os distrai da tarefa em mãos..."
 mpo_nerge.1025.t:0 "O Maior Caçador"
 mpo_nerge.1026.a:0 "..."
 mpo_nerge.1026.desc:0 "Eu havia prometido aos caçadores um banquete com os despojos do nosso Nerge, mas, no final, a carne foi desperdiçada.\n\nÉ melhor não fazer promessas do que quebrá-las, e os caçadores não estão satisfeitos com a minha falha em cumprir."
 mpo_nerge.1026.t:0 "Promessas Quebradas"
 mpo_nerge.1030.a.tt.failure:0 "O [ROOT.Char.Custom('GetRegionalDeerType')] escapa"
 mpo_nerge.1030.a.tt.success:0 "O [ROOT.Char.Custom('GetRegionalDeerType')] cai pela sua flecha"
 mpo_nerge.1030.a:0 "Será minha!"
 mpo_nerge.1030.b.tt.effect:0 "[county.GetName] ganhará um [GetModifier('hunt_sighting_legendary_modifier').GetNameWithTooltip] dentro de 2 anos"
 mpo_nerge.1030.b.tt.failure:0 "O [ROOT.Char.Custom('GetRegionalDeerType')] escapa, mas permanece ileso"
 mpo_nerge.1030.b.tt.success:0 "Você ganha insights sobre o [ROOT.Char.Custom('GetRegionalDeerType')]"
 mpo_nerge.1030.b:0 "Devemos rastrear o [ROOT.Char.Custom('GetRegionalDeerType')], mas não machucá-lo."
 mpo_nerge.1030.c:0 "Estamos aqui para caçar, não para fazer turismo."
 mpo_nerge.1030.d:0 "Por que você está tentando me prender?"
 mpo_nerge.1030.desc:0 "Um pouco distante do grupo principal de caçadores, [master_of_hunt.GetFirstName] me conta sobre um belo [ROOT.Char.Custom('GetRegionalDeerType')] branco que foi avistado. \"Foi algo como nunca vi,\" [master_of_hunt.GetSheHe] diz, com os olhos arregalados. \"Não estava sozinho, no entanto. Havia outros menores com ele, todos brancos como a neve.\"\n\nEu já caçei lobos, cervos e gatos selvagens, mas abater uma criatura como essa pode me trazer grande renome."
 mpo_nerge.1030.t:0 "Uma Visão Rara"
 mpo_nerge.1031.t:0 "A Conservação compensa"
 mpo_nerge.1035.a.tt:0 "Esse método é #bold perigoso#!, mas trará melhores resultados."
 mpo_nerge.1035.a:0 "Ataque rápido e forte!"
 mpo_nerge.1035.b.tt:0 "Esse método terá um #bold rendimento menor#!, mas elevará a opinião de outros caçadores sobre você, ou até mesmo os tornará [obedient|E]."
 mpo_nerge.1035.b:0 "Dividam-se em grupos e coordenem."
 mpo_nerge.1035.c.tt:0 "Esse método é relativamente #bold seguro#!, mas não trará muitos resultados."
 mpo_nerge.1035.c:0 "Uma emboscada é o melhor."
 mpo_nerge.1035.d:0 "Deixe que nossas flechas decidam o resultado."
 mpo_nerge.1035.desc:0 "O impulso da caçada diminuiu, e muitos caçadores retornam ao acampamento para discutir seus planos, enquanto o resto observa os(a) [activity.Custom('GetAnimalPlural')] à distância.\n\n\"Devemos ser cruéis! Implacáveis, como somos com nossos inimigos!\" [hunter_1.GetFirstName] exclama. [hunter_2.GetFirstName] acenando com a cabeça em concordância acrescenta, \"Mas não haverá força nos números se não trabalharmos juntos.\" Antes que outra discussão comece, [hunter_3.GetFirstName] intervém para oferecer o seu próprio conselho. \"Podemos seguir a tradição,\" [hunter_3.GetFirstNameNoTooltip] afirma. \"Mas com paciência. Observe os animais, aproxime-se deles lentamente e ataque quando menos esperar.\"\n\nNo meio da conversa, eles se viram para mim, aguardando minha opinião."
 mpo_nerge.1035.t:0 "Táticas da Caçada"
 mpo_nerge.1035.tt.failure:0 "O plano falhou"
 mpo_nerge.1035.tt.success:0 "O plano foi bem-sucedido"
 mpo_nerge.1040.a:0 "\"Dê para o seu [ROOT.Char.GetTitleAsNameNoTooltip].\""
 mpo_nerge.1040.b:0 "\"Se está nas minhas terras, pertence a mim.\""
 mpo_nerge.1040.c.tt:0 "[hunter.GetShortUIName] fica com o [newly_created_artifact.GetName]"
 mpo_nerge.1040.c:0 "\"Você pode ficar com ele.\""
 mpo_nerge.1040.d:0 "\"Volte para o seu cavalo!\""
 mpo_nerge.1040.desc:0 "\"Espere!\" [hunter.GetTitledFirstName] desmonta abruptamente de seu cavalo, ajoelhando-se no chão. \"Achei que vi... aqui!\"\n\n\"Deve ter pertencido a caçadores menos afortunados,\" [hunter.GetSheHe] comenta sarcasticamente, apresentando um arco manchado de sangue, com a madeira lascada."
 mpo_nerge.1040.t:0 "Esquecido"
 mpo_nerge.1050.a.tt.failure:0 "O animal escapa"
 mpo_nerge.1050.a.tt.success:0 "O animal cai aos seus pés"
 mpo_nerge.1050.a:0 "\"[hunter.GetFirstNameNoTooltip], m[Select_CString( hunter.IsFemale, 'inha', 'eu' )] [hunter.Custom('SisterBrother')], movemo-nos como um!\""
 mpo_nerge.1050.b.tt.failure:0 "Você é humilhado"
 mpo_nerge.1050.b.tt.success:0 "Você mata o animal"
 mpo_nerge.1050.b:0 "\"Deixe comigo.\""
 mpo_nerge.1050.c.tt.failure:0 "O animal desvia das flechas"
 mpo_nerge.1050.c.tt.success:0 "O animal morre"
 mpo_nerge.1050.c:0 "\"Acerte bem.\""
 mpo_nerge.1050.d:0 "\"Não deixe que isso seja uma distração!\""
 mpo_nerge.1050.desc:0 "\"Um(a) [ROOT.Char.Custom('GetAnimalTypeMismanaged')] renegado,\" [hunter.GetTitledFirstName] anuncia em voz baixa. \"Uma flecha diretamente no coração e será nosso, [ROOT.Char.GetTitleAsNameNoTooltip].\"\n\n[hunter_2.GetTitledFirstName] acena com a cabeça e puxa seu arco, aguardando minhas instruções."
 mpo_nerge.1050.t:0 "Uma Demonstração de Força"
 mpo_nerge.1060.a:0 "\"Nunca vi uma armadilha mais óbvia.\""
 mpo_nerge.1060.b.tt.failure:0 "Você se envergonha"
 mpo_nerge.1060.b.tt.success:0 "Os animais perecem pelas suas mãos"
 mpo_nerge.1060.b:0 "\"Uma chance de mostrar minha destreza!\""
 mpo_nerge.1060.c.tt.failure:0 "Você mal pega algo"
 mpo_nerge.1060.c.tt.success:0 "Você caça um número impressionante"
 mpo_nerge.1060.c.tt_feast:0 "Sua próxima [GetActivityType('activity_feast').GetName] será #high gratuita#!"
 mpo_nerge.1060.c:0 "\"Pegue o máximo que puder!\""
 mpo_nerge.1060.d:0 "\"Não adianta seguir um bando perdido.\""
 mpo_nerge.1060.desc:0 "\"Olhem!\" [hunter.GetTitledFirstName] aponta para um grupo de [ROOT.Char.Custom('RegionalEdibleAnimalPlural')] selvagens, escondidos em um caminho à esquerda. \"Vamos caçá-los! Minha barriga ronca de antecipação!\""
 mpo_nerge.1060.t:0 "Uma Distração Deliciosa"
 mpo_nerge_1060_free_feast_desc:0 "Evento de Nerge"
 mpo_nerge_feast_discount:0 "Carne Preparada"
 mpo_nerge_feast_discount_desc:0 "Este personagem preparou carne de um recente Nerge e pode organizar um banquete por menos.\nCusto da [GetActivityType('activity_feast').GetTextIcon][GetActivityType('activity_feast').GetName]: -#P 50%#!"
 mpo_nerge_investigation:0 "Observação de Animais"
 mpo_nerge_investigation_desc:0 "Este personagem observou animais durante uma caçada e usa esse conhecimento para gerenciar seu rebanho."
 mpo_nerge_overhunting_modifier:0 "Caça Excessiva"
 mpo_nerge_overhunting_modifier_desc:0 "Este condado foi excessivamente caçado, e será mais difícil sustentar a vida aqui."
 mpo_nerge_promised_feast_fail:0 "Promessas Quebradas"
 mpo_nerge_promised_feast_fail_desc:0 "Este personagem fez uma promessa a alguém e falhou em cumpri-la."
 nerge_commander_trait_tt:0 "Pode ganhar um [command_modifier_i][commander_trait|E] ou [trait_level_track_xp|E]"
 nerge_evaded_trap_modifier:0 "Armadilha Evadida"
 nerge_evaded_trap_modifier_desc:0 "Este personagem acredita que identificou corretamente uma armadilha durante um nerge."
 nerge_outcome_boost_large:0 "Seu [nerge_outcome|E] se torna #P significativamente mais bem-sucedido#!"
 nerge_outcome_boost_medium:0 "Seu [nerge_outcome|E] se torna #P mais bem-sucedido#!"
 nerge_outcome_boost_small:0 "Seu [nerge_outcome|E] se torna #P um pouco mais bem-sucedido#!"
 nerge_outcome_boost_tiny:0 "Seu [nerge_outcome|E] se torna #P ligeiramente mais bem-sucedido#!"
 successful_nerge_intent:0 "Sucesso"
 successful_nerge_intent_desc:0 "Procure por qualquer oportunidade de garantir o sucesso do Nerge.\n#emp Aumentará o ganho de [nerge_outcome|E]#!"
