 hunt_failed_kill_title:0 "[hunter.GetShortUINameNoTooltip|U] Deixou um Animal Fugir Acidentalmente"
 hunt_failed_several_kills_title:0 "[hunter.GetShortUINameNoTooltip|U] Deixou Vários Animais Fugirem Acidentalmente"
