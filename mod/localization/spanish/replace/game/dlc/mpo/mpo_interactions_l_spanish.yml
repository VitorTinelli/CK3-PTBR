 mpo_interaction_ask_for_paiza_desc:0 "Faz com que você se torne [obedient|E] e concede a você um artefato Paiza"
 mpo_interaction_ask_for_paiza_notification:0 "Peço para cavalgar sob sua proteção. Conceda-me um paiza cunhado por sua mão, e eu lhe deverei obediência — meus rebanhos, meus cavaleiros e minha palavra."
 mpo_interaction_grant_paiza:0 "Conceder Paiza"
 mpo_interaction_grant_paiza_desc:0 "Concede a [recipient.GetShortUIName] um artefato Paiza [artifact|E] e a torna [obedient|E] a você, se possível"
 mpo_interaction_grant_paiza_notification:0 "Você cavalgou bem sob minha bandeira, e a estepe deve saber disso. Carregue este paiza como um sinal do meu favor, e que qualquer um que bloqueie seu caminho tema a mão que o cunhou."
 mpo_interaction_leverage_khan_authority:0 "Exercer Autoridade do Cã"
 mpo_interaction_leverage_khan_authority_desc:0 "Toma [herd|E] e [gold|E] de [recipient.GetShortUIName], e a torna [obedient|E], se possível.\n@alert_icon! O [gurkhan|E] pode reagir a esse abuso de autoridade."
 mpo_interaction_not_neighbouring_tt:0 "Deve ser um $RELATION_NEIGHBORING_RULER$"
 mpo_interactions_events.0002.a:0 "Vivermos ou morrermos, lado a lado!"
 mpo_interactions_events.0002.desc:0 "Com os [other_confederate.GetCulture.GetCollectiveNoun] de [other_confederate.GetTitledFirstNamePossessive] e os guerreiros de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] nos cercando, misturamos nosso sangue e prometemos confederação.\n\n\"Seremos muitos, [other_confederate.Custom('SisterBrother')], vigiando estas terras!\" — grita [other_confederate.GetFirstNameNoTooltip], me apertando com força. \"Lutando como lobos do mesmo bando. Nenhum melhor — nem mais faminto — que o outro!\"\n\n"
 mpo_interactions_events.0002.desc_joining:0 "E assim, uno-me à [confederation.GetName]. Minhas promessas pertencem a cada um de seus jovens lobos."
 mpo_interactions_events.0002.desc_new:0 "A [new_confederation.GetName] nasceu."
 mpo_interactions_events.0002.t:0 "A [confederation.GetName]"
 mpo_interactions_events.0003.a:0 "[recipient.GetSheHe|U] está conosco."
 mpo_interactions_events.0003.desc:0 "Honrarei os costumes da [confederation.GetName]. Juntos, permaneceremos firmes!\n\nUma espada lançada contra seu pescoço encontrará apenas minha lâmina. Uma flecha disparada contra seu coração não chegará antes do meu escudo."
 mpo_interactions_events.0003.opening:0 "M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('SisterBrother')], [Select_CString( ROOT.Char.IsFemale, 'minha nobre protetora', 'meu nobre protetor' )],"
 mpo_interactions_events.0004.a:0 "Um rato é esperto. Você não é."
 mpo_interactions_events.0004.desc:0 "A ideia de pertencer a um enxame te dá conforto, criatura pequena? Quando você poderia ser arrancado da terra e engolido por uma grande águia a qualquer momento?\n\n"
 mpo_interactions_events.0004.desc_join:0 "Corra, rato. Não precisamos de você."
 mpo_interactions_events.0004.desc_offer:0 "Não, não pertencerei a nenhuma confederação miserável."
 mpo_interactions_events.0004.opening:0 "Ao rato covarde, [ROOT.Char.GetTitledFirstName],"
 mpo_interactions_events.0006.a.flavor:0 "E nosso inimigo compartilhado, [shared_foe.GetTitledFirstNameNoTooltip], #EMP sofre mais do que todos!#!"
 mpo_interactions_events.0006.a:0 "Vemos nossos inimigos sofrerem."
 mpo_interactions_events.0006.b:0 "Todos sabem da alta posição de m[Select_CString( blood_bro.IsFemale, 'inha', 'eu' )] [blood_bro.Custom('SisterBrother')]..."
 mpo_interactions_events.0006.c:0 "M[Select_CString( blood_bro.IsFemale, 'inha', 'eu' )] [blood_bro.Custom('SisterBrother')], temível como um lobo!"
 mpo_interactions_events.0006.d:0 "Sempre, ouvirei a sabedoria de m[Select_CString( blood_bro.IsFemale, 'inha', 'eu' )] [blood_bro.Custom('SisterBrother')]."
 mpo_interactions_events.0006.desc:0 "nossas vidas se tornam uma! [ROOT.Char.Custom('SisterBrother')|U] — Eu juro te amar para sempre, e te proteger bem.\"\n\nEu juro o mesmo, inflijo a ferida, e selo meu sangue com [Select_CString( blood_bro.IsFemale, 'a da minha nova', 'o de meu novo' )] [blood_bro.Custom('SisterBrother')].\n\nNosso pacto selado, trocamos presentes finos, comemos bem, e compartilhamos uma única pele para o descanso da noite. Sonhamos com"
 mpo_interactions_events.0006.desc_anda:0 "nos tornamos [Glossary( 'anda', 'ANDA_GLOSS' )],"
 mpo_interactions_events.0006.desc_intro:0 "[blood_bro.GetFirstName] corta a carne da mão [blood_bro.GetHerHim], dizendo: 'Quando nós'"
 mpo_interactions_events.0006.desc_memories:0 "dias brilhantes do passado."
 mpo_interactions_events.0006.desc_no_anda:0 "dizemos essas palavras"
 mpo_interactions_events.0006.desc_outro:0 "as batalhas que virão."
 mpo_interactions_events.0006.desc_shared_foe:0 "ai de nossos inimigos, de dor e ruína para [shared_foe.GetTitledFirstName]!"
 mpo_interactions_events.0006.desc_war_allies:0 "batalhas vencidas, e nossos cornos de guerra clamando."
 mpo_interactions_events.0006.e:0 "Confio no coração nobre de meu [blood_bro.Custom('SisterBrother')]."
 mpo_interactions_events.0006.f:0 "M[Select_CString( blood_bro.IsFemale, 'inha', 'eu' )] [blood_bro.Custom('SisterBrother')]. Sangue do meu sangue."
 mpo_interactions_events.0006.t:0 "Sangue do Meu Sangue"
 mpo_interactions_events.0010.a:0 "Assim será."
 mpo_interactions_events.0010.desc:0 "Eu também entendo o chamado da terra, e não serei eu quem privará um homem irmão de andar com o vento."
 mpo_interactions_events.0010.opening:0 "Ao meu antigo vassalo, [ROOT.Char.GetTitledFirstName]"
 mpo_interactions_events.0011.a:0 "Entendido."
 mpo_interactions_events.0011.desc:0 "Por que deseja tanto me abandonar? Minhas terras não são férteis o suficiente? Meu coração é insípido demais?\n\nVocê é meu vassalo servil, e assim continuará."
 mpo_interactions_events.0011.opening:0 "Aos traidores, [ROOT.Char.GetTitledFirstName]"
 mpo_interactions_events.0020.a:0 "Serão bem cuidadas."
 mpo_interactions_events.0020.desc:0 "Tenha essas ovelhas manchadas e essas ovelhas marrons, como símbolo da minha amizade. Cuide delas bem e coma suas vísceras quando o momento for certo."
 mpo_interactions_events.0030.a:0 "Quando você chamar, serei seu guardião."
 mpo_interactions_events.0030.desc:0 "Jure honrar os caminhos da [confederation.GetName]. Jure lutar por nós até seu corpo se partir, até que seus guerreiros sejam apenas ossos e cinzas.\n\nDê seu juramento, e nós nos protegeremos mutuamente dos males deste mundo."
 mpo_interactions_events.0030.opening:0 "Nobre de coração [actor.GetFirstName],"
 mpo_interactions_events.0101.a.flavor:0 "[recipient.GetFirstNameNoTooltip] parece já entender o espírito do [target_trait.GetNameNoTooltip(GetPlayer)]."
 mpo_interactions_events.0101.a:0 "\"Você será um grande comandante um dia!\""
 mpo_interactions_events.0101.aggressive_attacker:0 "Avanço imediatamente sobre [recipient.GetSheHe] e ataco sem piedade a espada [recipient.GetHerHim].\n\n\"Lembre-se que numa batalha é você ou eles. Use toda a força que tiver e mais um pouco!\""
 mpo_interactions_events.0101.desc_aggressive_attacker:0 "$mpo_interactions_events.0101.aggressive_attacker$\n\nAntes que eu termine a frase, [recipient.GetFirstNameNoTooltip] pula sobre mim. Os golpes pesados [recipient.GetHerHim] fazem estilhaços voarem, quebrando minha espada. Sem nada para me defender, sou forçado a me render."
 mpo_interactions_events.0101.desc_cautious_leader:0 "Dou alguns golpes, passos e estocadas. [recipient.GetFirstNameNoTooltip] não tem aberturas. Bato os pés e grito, tentando intimidar [recipient.GetSheHe]. [recipient.GetSheHe|U] mantém a guarda firme, não importa o que.\n\n\"Basta!\" Perco a paciência e corro para cima [recipient.GetHerHim], mas esse foi o momento que [recipient.GetSheHe] estava esperando! Notando a abertura, [recipient.GetSheHe] me acerta, vencendo o duelo."
 mpo_interactions_events.0101.desc_desert_warrior:0 "$mpo_interactions_events.0101.desert_warrior$ areia no meu rosto, me cegando. Erro o golpe e deixo uma grande abertura para [recipient.GetSheHe] vencer o duelo."
 mpo_interactions_events.0101.desc_flexible_leader:0 "$mpo_interactions_events.0101.flexible_leader$ No entanto, [recipient.GetFirstNameNoTooltip] desvia e contra-ataca, encerrando o duelo antes mesmo de começar."
 mpo_interactions_events.0101.desc_forder:0 "$mpo_interactions_events.0101.forder$\n\n\"Você está muito lento, [ROOT.Char.GetWomanMan] velh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!\" — [recipient.GetFirstNameNoTooltip] surge na minha frente e me derruba na água."
 mpo_interactions_events.0101.desc_forest_fighter:0 "$mpo_interactions_events.0101.forest_fighter$"
 mpo_interactions_events.0101.desc_holy_warrior:0 "$mpo_interactions_events.0101.holy_warrior$\n\n\"Dai-me força para ter misericórdia dos meus inimigos!\" — [recipient.GetFirstNameNoTooltip] termina e assume uma postura imaculada."
 mpo_interactions_events.0101.desc_intro:0 "[recipient.GetName] parece entediado depois de passar horas olhando para táticas militares nos mapas. Me levanto, lanço uma espada de treino para [recipient.GetSheHe] e grito:\n\n\"Vamos lá fora, o primeiro golpe no corpo vence!\"\n\n"
 mpo_interactions_events.0101.desc_jungle_stalker:0 "$mpo_interactions_events.0101.jungle_stalker$\n\n\"Te peguei!\" — [recipient.GetFirstNameNoTooltip] salta de uma árvore sobre mim, me pegando de surpresa e vencendo o duelo."
 mpo_interactions_events.0101.desc_logistician:0 "$mpo_interactions_events.0101.logistician$ Dou início a uma pausa, mas [recipient.GetSheHe|U] se irrita e alcança o seu saco.\n\n\"Não, podemos continuar!\" — exclama, me entregando um pedaço de [recipient.Custom('GetLocalStreetFood')]."
 mpo_interactions_events.0101.desc_military_engineer:0 "$mpo_interactions_events.0101.military_engineer$, mas então uma pedra passa voando perto da minha cabeça.\n\n\"Quase acertei você!\" — grita [recipient.GetSheHe|U] enquanto recarrega uma pequena funda."
 mpo_interactions_events.0101.desc_open_terrain_expert:0 "$mpo_interactions_events.0101.terrain_expert$\n\n[recipient.GetFirstNameNoTooltip] vê uma clareira atrás de mim.\n\n\"Agora te peguei!\" — [recipient.GetSheHe|U] exclama e me empurra para a área aberta. Com o campo largo, seu movimento é rápido e imprevisível. [recipient.GetSheHe|U] acerta um golpe fácil em mim."
 mpo_interactions_events.0101.desc_organizer:0 "$mpo_interactions_events.0101.organizer$ Começo a me cansar, mas os movimentos [recipient.GetHerHim] continuam rápidos e precisos. Não consigo mais acompanhar. Com meu último fôlego, tento uma estocada, mas [recipient.GetSheHe] desvia facilmente e contra-ataca como se estivéssemos apenas começando o treino. Eu me rendo."
 mpo_interactions_events.0101.desc_reaver:0 "$mpo_interactions_events.0101.reaver$ [recipient.GetFirstNameNoTooltip] me puxa para um clinch. Lutamos até que [recipient.GetSheHe] de repente recua.\n\n\"Acredito que isto seja seu?\" — [recipient.GetSheHe|U] sorri maliciosamente enquanto experimenta #EMP meu#! anel."
 mpo_interactions_events.0101.desc_reckless:0 "$mpo_interactions_events.0101.reckless$ Tento sair do caminho, mas superestimei a velocidade [recipient.GetHerHim]. [recipient.GetSheHe] me acerta de cabeça."
 mpo_interactions_events.0101.desc_rough_terrain_expert:0 "$mpo_interactions_events.0101.rough_terrain_expert$\n\n[recipient.GetFirstNameNoTooltip] vê uma área de terreno acidentado atrás de mim.\n\n\"Agora te peguei!\" — [recipient.GetSheHe|U] exclama e me empurra para as rochas. Dentro das colinas rochosas, seu movimento é rápido e imprevisível. [recipient.GetSheHe|U] acerta um golpe fácil em mim."
 mpo_interactions_events.0101.desc_unyielding_defender:0 "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip] não vacila. Cada golpe é aparado ou bloqueado, não consigo atingir [recipient.GetSheHe] de jeito nenhum."
 mpo_interactions_events.0101.desc_winter_soldier:0 "$mpo_interactions_events.0101.winter_soldier$ neve no meu rosto. Distrair-se me deixa uma grande abertura para [recipient.GetSheHe] acertar e vencer o duelo."
 mpo_interactions_events.0101.desert_warrior:0 "Circulamos um ao outro, esperando uma abertura. Quando vejo uma, ataco imediatamente. [recipient.GetFirstNameNoTooltip] espera até o último instante para lançar um punhado de"
 mpo_interactions_events.0101.flexible_leader:0 "\"Trabalhe com os pés, mantenha a postura, procure aberturas, não se distraia!\" Avanço esperando pegar [recipient.GetSheHe] distraído com minhas instruções."
 mpo_interactions_events.0101.forder:0 "Descemos até o rio para começar o duelo. Após alguns golpes, sou empurrado para dentro d'água. Pulo entre os bancos de areia tentando encontrar um terreno firme."
 mpo_interactions_events.0101.forest_fighter:0 "$mpo_interactions_events.0101.terrain_expert$ [recipient.GetFirstNameNoTooltip] sobe em uma das árvores.\n\n\"Pegue isso!\" — [recipient.GetSheHe|U] quebra um galho e me lança. Eu desvio, mas já é tarde demais. Sinto a espada [recipient.GetHerHim] atingindo minha perna."
 mpo_interactions_events.0101.holy_warrior:0 "Antes da luta começar, faço uma prece:\n\n\"Ó querido [ROOT.Char.GetFaith.WarGodName]! Guia minhas mãos, para que meus golpes sejam rápidos e ferozes.\""
 mpo_interactions_events.0101.jungle_stalker:0 "[recipient.GetFirstNameNoTooltip] corre primeiro e se esconde na selva. Tento encontrar [recipient.GetSheHe], mas quanto mais avanço, mais escura e densa a floresta se torna."
 mpo_interactions_events.0101.logistician:0 "Puxo a espada de treino, pronto para lutar. [recipient.GetFirstNameNoTooltip] pega a sua e imediatamente entra no clima. Golpes ferozes, mas precisos. Lutamos por um bom tempo, mas sem um vencedor claro, o cansaço vence ambos.\n\n\"Vamos descansar, podemos continuar amanhã.\""
 mpo_interactions_events.0101.military_engineer:0 "Trocamos golpes equilibrados, mas nenhum atinge o alvo. Eventualmente, [recipient.GetFirstNameNoTooltip] se afasta e cai no chão.\n\n\"Você se machucou?\" — começo a me preocupar"
 mpo_interactions_events.0101.organizer:0 "Pegamos as espadas de treino e começamos a luta. Por horas."
 mpo_interactions_events.0101.reaver:0 "Como aquecimento, trocamos alguns golpes rápidos."
 mpo_interactions_events.0101.reckless:0 "Começamos a lutar imediatamente. Corte, erro; estocada, desvio; chute, acerto! [recipient.GetFirstNameNoTooltip] tropeça e cai no rio. [recipient.GetSheHe|U] se sacode e grita:\n\n\"Eu te odeio!\" — e tenta me atacar.\n\n\"Não, não faça isso!\""
 mpo_interactions_events.0101.rough_terrain_expert:0 "$mpo_interactions_events.0101.terrain_expert$"
 mpo_interactions_events.0101.t:0 "$influence_child_commander_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Sucesso"
 mpo_interactions_events.0101.terrain_expert:0 "Entramos em uma fenda próxima. A luta se arrasta por um tempo, já que não conseguimos nos alcançar entre os galhos. Eventualmente,"
 mpo_interactions_events.0101.winter_soldier:0 "$mpo_interactions_events.0101.desert_warrior$"
 mpo_interactions_events.0102.a.flavor:0 "Seu treino prova que ainda há um longo caminho para [recipient.GetFirstNameNoTooltip]."
 mpo_interactions_events.0102.a:0 "\"Talvez da próxima vez.\""
 mpo_interactions_events.0102.b.flavor:0 "Com #EMP perseverança#!, [recipient.GetFirstNameNoTooltip] pode alcançar qualquer coisa que você defina para [recipient.GetSheHe]."
 mpo_interactions_events.0102.b:0 "\"Vamos repetir o treino até você vencer!\""
 mpo_interactions_events.0102.desc_aggressive_attacker:0 "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip] começa a agitar a espada na frente [recipient.GetHerHim] e corre em minha direção com seus olhos fechados. Eu passo por [recipient.GetSheHe] e acerto um golpe."
 mpo_interactions_events.0102.desc_cautious_leader:0 "[recipient.GetSheHe|U] tenta alguns golpes, passos e estocadas. Eu não deixo nenhuma abertura. [recipient.GetSheHe|U] pisa forte e grita, tentando me intimidar. Mas eu não vacilo.\n\n\"Chega disso!\" [recipient.GetSheHe|U] perde o temperamento e corre em minha direção, mas esse foi o momento que eu estava esperando! Notando a abertura, eu acerto o golpe, vencendo o duelo."
 mpo_interactions_events.0102.desc_desert_warrior:0 "$mpo_interactions_events.0101.desert_warrior$ areia, mas eu desvio com meu escudo e a devolvo n[recipient.GetSheHe]. Cego, [recipient.GetSheHe] fica indefeso, eu acerto e venço com facilidade."
 mpo_interactions_events.0102.desc_flexible_leader:0 "$mpo_interactions_events.0101.flexible_leader$ [recipient.GetSheHe|U] nem estava pronto para me bloquear, então acerto um golpe limpo facilmente."
 mpo_interactions_events.0102.desc_forder:0 "$mpo_interactions_events.0101.forder$ [recipient.GetFirstNameNoTooltip] tenta me pegar, mas as pedras estão muito escorregadias. [recipient.GetSheHe|U] cai bem debaixo dos meus pés, então acerto um golpe fácil n[recipient.GetSheHe]!"
 mpo_interactions_events.0102.desc_forest_fighter:0 "$mpo_interactions_events.0101.forest_fighter$ Eu subo em uma das árvores.\n\n\"Pegue isso!\" Eu grito enquanto quebro um galho e jogo n[recipient.GetSheHe]. [recipient.GetSheHe|U] desvia, mas já é tarde demais. Eu voo bem atrás dele e acerto um golpe fácil no corpo [recipient.GetHerHim]."
 mpo_interactions_events.0102.desc_holy_warrior:0 "$mpo_interactions_events.0101.holy_warrior$\n\n\"Menos conversa, mais luta!\" [recipient.GetFirstNameNoTooltip] interrompe e me ataca.\n\n\"[ROOT.Char.GetFaith.HighGodName] me perdoe!\" sussurro e nocauteio [recipient.GetFirstNameNoTooltip] com um único golpe."
 mpo_interactions_events.0102.desc_intro:0 "$mpo_interactions_events.0101.desc_intro$"
 mpo_interactions_events.0102.desc_jungle_stalker:0 "$mpo_interactions_events.0101.jungle_stalker$\n\n\"A-ah! Cobra!\" [recipient.GetFirstNameNoTooltip] cai de uma das árvores, rolando até meus pés, me dando uma vitória fácil."
 mpo_interactions_events.0102.desc_logistician:0 "$mpo_interactions_events.0101.logistician$ [recipient.GetSheHe|U] inicia uma pausa, mas eu pego algo da minha bolsa e entrego a [recipient.GetSheHe] um pedaço de [ROOT.Char.Custom('GetLocalStreetFood')].\n\n\"Não, podemos continuar!\""
 mpo_interactions_events.0102.desc_military_engineer:0 "$mpo_interactions_events.0101.military_engineer$ quando ouço um leve gemido.\n\n\"Queria te acertar com meu estilingue, mas...\" [recipient.GetSheHe|U] explode em lágrimas e mostra seus dedos enroscados no estilingue."
 mpo_interactions_events.0102.desc_open_terrain_expert:0 "$mpo_interactions_events.0101.terrain_expert$\n\nEu vejo uma clareira atrás de [recipient.GetFirstNameNoTooltip].\n\nEu empurro [recipient.GetSheHe] para o campo aberto. Com a vantagem do terreno plano e amplo, meu movimento é rápido e imprevisível. [recipient.GetSheHe|U] não tem onde se esconder e eu acerto um golpe fácil."
 mpo_interactions_events.0102.desc_organizer:0 "$mpo_interactions_events.0101.organizer$ Eu noto a respiração ofegante [recipient.GetHerHim], os movimentos desacelerando e os golpes errando. [recipient.GetSheHe|U] já não consegue acompanhar mais. Com o último suspiro, [recipient.GetSheHe] tenta uma estocada, mas eu simplesmente me desvio. [recipient.GetSheHe|U] desaba de exaustão."
 mpo_interactions_events.0102.desc_reaver:0 "$mpo_interactions_events.0101.reaver$ Eu puxo [recipient.GetFirstNameNoTooltip] para um clinch. Lutamos até que eu consiga tirar um anel do dedo [recipient.GetHerHim].\n\n\"Você tem que ter cuidado, porque da próxima vez pode ser a sua mão inteira!\""
 mpo_interactions_events.0102.desc_reckless:0 "$mpo_interactions_events.0101.reckless$ Eu saio do caminho, fazendo [recipient.GetSheHe] perder o equilíbrio. [recipient.GetSheHe|U] escorrega e cai novamente."
 mpo_interactions_events.0102.desc_rough_terrain_expert:0 "$mpo_interactions_events.0101.rough_terrain_expert$\n\nEu vejo uma área de terreno áspero atrás de [recipient.GetFirstNameNoTooltip].\n\nEu empurro [recipient.GetSheHe] para as colinas rochosas. Com a vantagem do terreno irregular, meu movimento é rápido e imprevisível. [recipient.GetSheHe|U] não tem onde se esconder e eu acerto um golpe fácil."
 mpo_interactions_events.0102.desc_unyielding_defender:0 "$mpo_interactions_events.0101.aggressive_attacker$\n\n[recipient.GetFirstNameNoTooltip] quebra após mais alguns golpes. [recipient.GetSheHe|U] solta a espada e abre espaço para um golpe forte. Eu mal consigo #EMP não#! acertar com toda a força."
 mpo_interactions_events.0102.desc_winter_soldier:0 "$mpo_interactions_events.0101.winter_soldier$ neve, mas eu desvio. Deixando [recipient.GetSheHe] indefeso, eu acerto o golpe e venço com facilidade."
 mpo_interactions_events.0102.t:0 "$influence_child_commander_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Falha"
