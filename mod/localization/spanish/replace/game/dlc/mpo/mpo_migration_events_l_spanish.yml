l_spanish:
 astrologer_desired_area_modifier:0 "Migração Desejada"
 astrologer_desired_area_modifier_desc:0 "Graças a seguir os desejos de seu $court_astrologer_court_position$, o povo deste personagem está determinado a garantir o melhor cuidado possível para suas novas pastagens."
 cultural_acceptance_meal_of_hospitality:0 "Hospitalidade para migrantes e viajantes"
 cultural_acceptance_raiding_migrators:0 "Saques e pilhagem de migrantes"
 cultural_acceptance_recompense_for_raiding:0 "Reparações pela violência"
 custom.every_consort:0 "Cada [spouse|E] e [concubine|E]"
 migration_events.0001.a.tt:0 "Esta opção está disponível porque você seguiu os desejos de seu [GetCourtPositionType('court_astrologer_court_position').GetName()]"
 migration_events.0001.a:0 "Finalmente, chegamos ao lugar certo."
 migration_events.0001.aa.cb_tt:0 "Recebe um [casus_belli|E] de #EMP $retaliation_cb$#! contra você por #V 5#! anos"
 migration_events.0001.aa:0 "Não me curvo a ninguém."
 migration_events.0001.aaa:0 "Respeitarei os costumes desta terra."
 migration_events.0001.b:0 "Vamos montar as tendas."
 migration_events.0001.desc.bad:0 "A pastagem seca e amarelada morre enquanto o sol sangra. Não será fácil, mas uma vida fácil nunca fez um guerreiro valioso."
 migration_events.0001.desc.blessing:0 "Raios de sol banham as flores em flor que cobrem os campos até onde conseguimos ver. Inclino a cabeça para trás e me deixo aproveitar um pouco de seu calor.\n\n"
 migration_events.0001.desc.drought:0 "A terra rachada nos recebe com uma cor doentia. A seca não foi gentil aqui.\n\n"
 migration_events.0001.desc.good:0 "O cheiro de pastagem fresca é tão promissor quanto eu esperava. Estaremos bem."
 migration_events.0001.desc.havsarsan_zud:0 "Chuva, neve, ventos fortes. O clima não é tão acolhedor quanto esperávamos.\n\n"
 migration_events.0001.desc.herder:0 "[recipient.GetTitledFirstName] guia seu pequeno rebanho com alguma dificuldade, desaparecendo na distância.\n\n"
 migration_events.0001.desc.intro:0 "O céu sem nuvens está prestes a se tornar vermelho enquanto chegamos em [ROOT.Char.GetCurrentLocation.GetName]. A cor de uma ferida recém-aberta.\n\n"
 migration_events.0001.desc.meh:0 "A qualidade da pastagem não é tão boa quanto eu gostaria. Poucas coisas na vida são."
 migration_events.0001.desc.nomad:0 "\"Cuide da terra,\" [recipient.GetTitledFirstName] nos recebe na entrada do assentamento, embora a maioria das pessoas já tenha partido.\n\n"
 migration_events.0001.desc.nomad_angry:0 "[recipient.GetTitledFirstName] está no final da comitiva que deixa o acampamento. \"Boa sorte,\" [recipient.GetSheHe] diz secamente antes de se juntar a eles.\n\n"
 migration_events.0001.desc.nomad_obedient:0 "\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetTitleAsNameNoTooltip],\" [recipient.GetTitledFirstName] nos recebe na entrada do assentamento, \"É com grande honra que ofereço minhas terras a você.\n\n\""
 migration_events.0001.desc.tributary:0 "\"Estas terras prestam tributo diligente a [overlord.GetTitledFirstName]\", [recipient.GetTitledFirstName] nos avisa. \"Não espero que [overlord.GetSheHe] tolere outra coisa.\"\n\n"
 migration_events.0001.desc.white_zud:0 "A neve macia estala sob as cascos de nossos cavalos. A camada está tão espessa que cobre toda a grama.\n\n"
 migration_events.0001.t:0 "Um Lugar para Chamar de Lar"
 migration_events.0002.a:0 "É apenas justo."
 migration_events.0002.b.alt:0 "Hah, que [overlord.GetSheHe] venha se [overlord.GetSheHe] quiser meu ouro."
 migration_events.0002.b:0 "Eu conquistei minha terra!"
 migration_events.0002.desc.high_dominance:0 "Dizem que [overlord.GetTitledFirstName] é o soberano dessas terras, pois [recipient.GetTitledFirstName] pagava tributo regularmente a [overlord.GetSheHe]. Somos tão fortes quanto [overlord.GetSheHe], por que deveríamos cair aos pés [overlord.GetHerHim] e pedir proteção?"
 migration_events.0002.desc.intro:0 "Sangue escorre pelo meu cotovelo, manchando o solo. Conquistamos essas novas terras e nossas tendas logo estarão erguidas.\n\n"
 migration_events.0002.desc:0 "No entanto, o governante anterior costumava pagar tributo a [overlord.GetTitledFirstName], e [overlord.GetSheHe] não aceitará nada diferente de nós."
 migration_events.0002.t:0 "Migração: Terra Tomada"
 migration_events.1000.a.flavor:0 "Você caça um pouco da vida selvagem local."
 migration_events.1000.a:0 "Marmotas, sable... bons peles a serem obtidas aqui."
 migration_events.1000.b.flavor:0 "Você extorque os prósperos locais e saqueia seu acampamento."
 migration_events.1000.b:0 "\"#EMP Presentes! Tributo!#! Ou cairão sobre vocês como lobos!\""
 migration_events.1000.c:0 "Meu rebanho pastará aqui por um tempo."
 migration_events.1000.d:0 "Eu dou graças e monto meu cavalo."
 migration_events.1000.desc.ruler_away:0 "devem lealdade ao [local_ruler.GetTitledFirstName] [local_ruler.GetCulture.GetName], embora os cavaleiros [local_ruler.GetHerHim] não sejam vistos por aqui."
 migration_events.1000.desc.ruler_present:0 "respondem a [local_ruler.GetFirstName], um[Select_CString( local_ruler.IsFemale, 'a', '' )] [local_ruler.GetTitleAsNameNoTooltip] [local_ruler.GetCulture.GetName] insignificante."
 migration_events.1000.desc:0 "Os cavalos da minha tribo ofegam e bufam, ansiosos para saborear a grama local. Aqui, em [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier], ela cresce espessa e verde no solo. Aqui, os locais prósperos"
 migration_events.1000.desc_outro:0 "\n\nSomos recebidos calorosamente, oferecidos leite e carne... mas, com vozes trêmulas, meus [ROOT.Char.GetCulture.GetCollectiveNoun] são instados a seguir em frente."
 migration_events.1000.t:0 "Um Ponto Verde"
 migration_events.1010.a:0 "Meu corpo precisa de descanso."
 migration_events.1010.b:0 "\"Meu amado... pode haver um #EMP caminho acidentado#! à frente.\""
 migration_events.1010.c:0 "\"Eu cavalgarei à frente dos meus [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]. Sempre.\""
 migration_events.1010.d.flavor:0 "Depois de horas cavalgando... um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] anseia pelos solavancos e sacolejos do lar."
 migration_events.1010.d:0 "Subirei a bordo."
 migration_events.1010.desc:0 "Da grande tenda sobre rodas que, sob bandeiras de cauda de cavalo, marca o coração de nossa coluna, m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('spouse'))|l] [spouse.GetFirstName] vem.\n\n\"Será que o grande boi chora quando o peso de uma pessoa é adicionado ao seu fardo?\" ela pergunta. \"Não? Talvez, então, você venha sentar com sua família...?\"\n\nMinha casa é puxada por muitos tais bois. E há almofadas quentes dentro. Mas meus companheiros cavaleiros olham com julgamento."
 migration_events.1010.t:0 "Por Que Tropeçar Quando Você Pode Andar?"
 migration_events.1020.a:0 "\"Você me deve tributo, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l].\""
 migration_events.1020.b.flavor:0 "Você vê que s[Select_CString( aspirant.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l] está bem estabelecido aqui."
 migration_events.1020.b:0 "\"Vá, e empunhe o poder da [ROOT.Char.GetHouse.GetNameNoTooltip]!\""
 migration_events.1020.c:0 "\"Leve um pequeno grupo, e diga adeus aos seus parentes.\""
 migration_events.1020.d:0 "\"Fique com seu povo, [aspirant.GetFirstNameNoTooltip].\""
 migration_events.1020.desc:0 "\"[ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTier], chamam este lugar!\" cospe m[Select_CString( aspirant.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('aspirant'))|l], [aspirant.GetFirstName]. \"Suas ovelhas... quem as protege? Um cão, e [Select_CString( herder.IsFemale, 'uma', 'um' )] [herder.GetWomanMan] chamado [herder.GetTitledFirstName]!\"\n\n\"Alguns cavalos, alguns bons cavaleiros — #EMP [herder.GetFirstNamePossessiveNoTooltip] pescoço entre meus dedos#! — e o [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] poderia ser meu!\"\n\n[aspirant.GetFirstNameNoTooltip] olha cobiçosa para algumas cabras que passam... e aguarda a bênção de s[Select_CString( root_scope.IsFemale, 'ua', 'eu' )] [aspirant.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))|l]."
 migration_events.1020.t:0 "Um Mestre para Pastores"
 migration_events.1030.a:0 "O governante local #EMP nos deixará usar suas melhores terras."
 migration_events.1030.b.flavor:0 "Suas ofertas parecem morte, mas [local_ruler.GetNameNoTooltip] ainda pode ser convencido a comprar."
 migration_events.1030.b:0 "Eu poderia trocar os animais mais fracos..."
 migration_events.1030.c.flavor:0 "Abate os animais e faça um banquete para seu povo."
 migration_events.1030.c:0 "Se eles vão morrer... melhor que sejam comidos."
 migration_events.1030.d.failure:0 "Você não encontra nada, e os animais morrem de fome."
 migration_events.1030.d.success:0 "Você conduz seus rebanhos até a plenitude."
 migration_events.1030.d:0 "Devemos procurar boas pastagens nesta terra."
 migration_events.1030.desc:0 "Seguimos com as grandes massas de meus cavalos, gado, cabras e ovelhas. Se passássemos por bons pastos, os animais poderiam descansar e se alimentar... mas a terra aberta, onde a grama não foi comida, é escassa em [location_county.GetNameNoTier].\n\nDeixamos meus melhores cavalos pastarem a grama que existe. O resto cresce fraco de fome."
 migration_events.1030.t:0 "Uma Trilha Estéril"
 migration_events.1040.a:0 "\"#EMP Isso#! é tudo...? Isso é tudo o que você me dá...?"
 migration_events.1040.b:0 "Com alegria, troco presentes por presentes."
 migration_events.1040.c:0 "Não tenho tempo para você, [local_ruler.GetTitleAsNameNoTooltip][Select_CString( local_ruler.IsFemale, 'zinha', 'zinho' )]."
 migration_events.1040.camels:0 "água fresca de uma fonte local e uma linha de camelos altos."
 migration_events.1040.d:0 "Eu vou comer."
 migration_events.1040.desc:0 "Dando boas-vindas calorosas, o governante local — [local_ruler.GetName] — se aproxima. Meus [ROOT.Char.GetCulture.GetCollectiveNoun] e seus animais passam por nós.\n\n\"[ROOT.Char.GetTitleAsName], você se sentaria ao meu lado e compartilharia uma refeição quente?\" pergunta [local_ruler.GetFirstNameNoTooltip], como é costume para com os viajantes.\n\nOs atendentes [local_ruler.GetHerHim] me apresentam presentes:"
 migration_events.1040.furs:0 "ornamentos esculpidos em chifre, peles e um jovem garanhão animado."
 migration_events.1040.horses:0 "reins de couro fino e um par de cavalos fortes."
 migration_events.1040.t:0 "Bem-vindo em [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]"
 migration_events.1040.wool:0 "finas capas de lã, uma bandada de ovelhas e uma cabra alta como um cavalo."
 migration_events.1050.a:0 "A ferocidade de [warrior.GetFirstNamePossessiveNoTooltip] merece recompensa."
 migration_events.1050.b:0 "\"#EMP Caiam sobre todas as casas que passarmos, meus guerreiros!#!\""
 migration_events.1050.c:0 "Devolvam os despojos e peçam perdão ao mestre deles."
 migration_events.1050.d:0 "Distribuam os despojos entre meus guerreiros."
 migration_events.1050.desc:0 "Os exploradores de meu povo, espalhados muito além de nossos rebanhos e carroças, rondam as terras por onde passamos como panteras.\n\n\"Os locais soltaram a primeira flecha contra nós!\" reporta meu chefe dos exploradores, [warrior.GetFirstName], \"mas com fogo e espada, fizemos-os se arrepender! Trouxemos todos os despojos do acampamento deles — e este [newly_created_artifact.GetName]!\""
 migration_events.1050.e:0 "Eu reivindico os despojos de [ROOT.Char.GetCurrentLocation.GetTitle.GetNameNoTierNoTooltip]."
 migration_events.1050.t:0 "Passando Como Fogo"
 migration_events.1051_title:0 "Saque Migratório"
 migration_events.1051_tooltip:0 "Seu povo saqueou [raided_settlement.GetName]."
 migration_events.1060.a:0 "Eu encontrarei um caminho mais ameno e rápido."
 migration_events.1060.b:0 "\"Vá, explore nosso novo lar! Prepare-o bem.\""
 migration_events.1060.c:0 "\"Fique, e ajude os fracos. Eles precisam da sua força.\""
 migration_events.1060.desc:0 "\n\nM[Select_CString( warrior.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('warrior'))|l] [warrior.GetFirstName] não tem paciência para este ritmo miserável.\n\n\"Deixe-me reunir os cavaleiros mais jovens!\" [warrior.GetSheHe] implora. \"Nós galoparemos até [destination.GetNameNoTier], e nos prepararemos para sua chegada. Essa labuta, esse empurrar bois e cabras, está abaixo dos seus guerreiros!\""
 migration_events.1060.desc_desert:0 "Os animais do meu rebanho estão com sede, mas ao longo do nosso caminho por [root_location.GetName], há pouca água. Nós seguimos lentamente sob o sol ardente."
 migration_events.1060.desc_forest:0 "As árvores em [root_location.GetName] estão próximas como guerreiros a pé, e a vegetação é ainda mais densa. Os espinhos rasgam a lã das minhas ovelhas. Forçamos meu rebanho por um caminho estreito."
 migration_events.1060.desc_hilly:0 "Nosso caminho por [root_location.GetName] serpenteia por encostas íngremes, desce em desfiladeiros estreitos, e exaure tanto homens quanto bestas. Meus pastores colocam os ombros contra o gado relutante, gritam e puxam, mas ainda assim as criaturas exaustas mal conseguem subir."
 migration_events.1060.desc_wetlands:0 "Nosso caminho por [root_location.GetName] é como atravessar o intestino de uma besta: tudo é lama fedida e poças de água podre. Meus animais tropeçam molhados, chorando de tristeza. De vez em quando, meu povo precisa libertá-los do lamaçal."
 migration_events.1060.desc_winter:0 "A neve branca sufoca a terra em [root_location.GetName], e nosso caminho é feito apenas por chutes e passos lentos pelo frio. Os animais do meu rebanho se apertam para se aquecer, e são retardados pela fome."
 migration_events.1060.t:0 "Lento como a Ovelha"
 migration_raiding_effect_no_culture_tt:0 "[holdings|E] pelos quais você [migrate|E] fornecerão @gold_icon![gold|E] e @herd_icon![herd|E], mas você perderá [opinion|E] com o [holder|E] deles"
 migration_raiding_effect_tt:0 "[holdings|E] pelos quais você [migrate|E] fornecerão @gold_icon![gold|E] e @herd_icon![herd|E], mas você perderá [opinion|E] e [cultural_acceptance|E] com o [holder|E] deles"
 mpo_found_paths_for_herds_modifier:0 "Caminhos Suaves para o Rebanho"
 mpo_found_paths_for_herds_modifier_desc:0 "Este líder sábio guia seus animais com discrição e uma compreensão da terra."
 mpo_migrating_accolade_duke_modifier:0 "Bando de Guerra Migratório"
 mpo_migrating_accolade_emperor_modifier:0 "$mpo_migrating_accolade_duke_modifier$"
 mpo_migrating_accolade_king_modifier:0 "$mpo_migrating_accolade_duke_modifier$"
 mpo_migrating_without_labor_modifier:0 "Migração Sem Trabalho"
 mpo_migrating_without_labor_modifier_desc:0 "Este personagem move seus anfitriões pela terra sem a ajuda dos guerreiros mais jovens de seu povo."
 mpo_migration_events.1060.a.failure:0 "Um desvio exaustivo e tolo"
 mpo_migration_events.1060.a.success:0 "Você lidera seu povo por um caminho mais suave"
 mpo_migration_prepared_home_modifier:0 "Novo Lar Bem Preparado"
 mpo_migration_prepared_home_modifier_desc:0 "Os melhores locais para assentamentos nômades foram encontrados e limpos de obstruções locais."
 mpo_refusing_diplomatic_stops_modifier:0 "Rejeição a Paradas Diplomáticas"
 mpo_refusing_diplomatic_stops_modifier_desc:0 "Este nômade guia seu povo sempre em frente, além dos locais amigáveis e suas cortesia."
 msg_tributary_toast:0 "Oferta de Tributo"
 msg_tributary_toast_bad:0 "Recusa de Tributo"
 msg_tributary_toast_bad_tt:0 "[new_tributary.GetShortUIName] se mudou para as terras ocupadas por um de seus [tributaries|E]\nVocê recebe um [casus_belli|E] de $retaliation_cb$ contra [new_tributary.GetSheHe] por #V 5#! anos"
 msg_tributary_toast_tt:0 "[new_tributary.GetShortUIName] se mudou para as terras ocupadas por um de seus [tributaries|E] e se curvou diante de você"
 nomadic_comforts_modifier:0 "Confortos Nômades de Viagem"
 nomadic_comforts_modifier_desc:0 "Este raro nômade escolhe a segurança confortável sobre a sela."
