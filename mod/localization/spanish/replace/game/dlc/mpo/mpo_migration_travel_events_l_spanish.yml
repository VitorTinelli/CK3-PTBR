l_spanish:
 mpo_migration_travel_events.0001.a:0 "Aceito humildemente o presente [ruler.GetHerHim]."
 mpo_migration_travel_events.0001.b:0 "Diga a [ruler.GetFirstNameNoTooltip] que não estou interessado."
 mpo_migration_travel_events.0001.desc:0 "Um[Select_CString( messenger.IsFemale, 'a', '' )] [messenger.GetWomanMan] pastoreando ovelhas se aproxima, dizendo: \"Saudações, [ROOT.Char.GetTitledFirstNameNoTooltip].\"\n\n\"M[Select_CString( ruler.IsFemale, 'inha', 'eu' )] [ruler.GetTitleAsNameNoTooltip], [ruler.GetFirstName], e eu observamos seu rebanho diminuir a cada dia. Por favor, aceite este pequeno rebanho como presente. Tudo que [ruler.GetTitleAsNameNoTooltip] pede é um pequeno favor em troca.\""
 mpo_migration_travel_events.0001.t:0 "‘Presente’ de [ruler.GetFirstNamePossessiveNoTooltip]"
 mpo_migration_travel_events.0010.a:0 "[vassal_1.GetFirstNameNoTooltip] pode ficar com alguns, como presente de despedida."
 mpo_migration_travel_events.0010.b:0 "Invista nas terras de [vassal_2.GetFirstNamePossessiveNoTooltip] em vez disso."
 mpo_migration_travel_events.0010.c:0 "Deixe os animais excedentes para trás."
 mpo_migration_travel_events.0010.d:0 "Este é o meu rebanho, e o levarei comigo."
 mpo_migration_travel_events.0010.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip], você não pode ousar atravessar a estepe com um rebanho tão grande!\" exclama [messenger.GetFirstName]. \"Nossos pastores já lutaram por tanto tempo, certamente você não precisa de tudo isso!\"\n\n[messenger.GetFirstNameNoTooltip] recupera sua compostura. \"Em vez disso, imploro que conceda alguns de seus animais a um de seus súditos, apenas para aliviar a tensão entre nossos rebanhos. [vassal_1.GetTitledFirstName] o serve bem, mas [vassal_2.GetTitledFirstName] pode apreciar o gesto vindo de seu novo governante.\""
 mpo_migration_travel_events.0010.t:0 "Rebanho Excessivo"
 mpo_migration_travel_events.0020.a:0 "Ainda assim, [target_title.GetNameNoTierNoTooltip] será nosso lar."
 mpo_migration_travel_events.0020.b:0 "Voltemos! Não podemos sobreviver lá!"
 mpo_migration_travel_events.0020.c:0 "Reduzir nossos números pode ajudar na sobrevivência."
 mpo_migration_travel_events.0020.d:0 "[ROOT.Char.GetFaith.FertilityGodName], por favor, nos ajude!"
 mpo_migration_travel_events.0020.d_tt:0 "Você pede para [astrologer.GetFirstName] orar por fertilidade."
 mpo_migration_travel_events.0020.desc:0 "À medida que nosso rebanho avança, batedores trazem notícias preocupantes. As pastagens em [target_title.GetNameNoTier], o local onde pretendemos nos estabelecer, são escassas, e a terra parece quase inabitável."
 mpo_migration_travel_events.0020.lose:0 "As palavras de [astrologer.GetFirstNamePossessiveNoTooltip] se mostram inúteis"
 mpo_migration_travel_events.0020.t:0 "Terras Áridas"
 mpo_migration_travel_events.0020.win:0 "As orações de [astrologer.GetFirstNamePossessiveNoTooltip] foram atendidas!"
 mpo_migration_travel_events.0030.a:0 "Matem os animais doentes para evitar o contágio."
 mpo_migration_travel_events.0030.b:0 "Talvez um pastor local conheça esse mal."
 mpo_migration_travel_events.0030.b_bad:0 "O tratamento do pastor ajuda muito pouco"
 mpo_migration_travel_events.0030.b_good:0 "O tratamento do pastor se mostra inestimável"
 mpo_migration_travel_events.0030.c:0 "Devemos esperar a natureza seguir seu curso."
 mpo_migration_travel_events.0030.c_major:0 "O rebanho é enfraquecido pela doença"
 mpo_migration_travel_events.0030.c_massive:0 "A doença devasta o rebanho"
 mpo_migration_travel_events.0030.c_medium:0 "A doença passa com poucas perdas"
 mpo_migration_travel_events.0030.c_none:0 "A doença é contida"
 mpo_migration_travel_events.0030.desc:0 "M[Select_CString( messenger.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('messenger'))|l] vem até mim montado em um cavalo debilitado, com o rosto retorcido de preocupação.\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], nosso rebanho adoeceu. Os animais estão morrendo, e a doença se espalha a cada dia. Por favor, ajude-nos, ou não restará nada!\" implora [messenger.GetFirstName].\n\nAo ouvir o apelo [messenger.GetHerHim], vejo os animais doentes à distância e observo o cavalo de [messenger.GetFirstNamePossessiveNoTooltip] bufar nervosamente."
 mpo_migration_travel_events.0030.t:0 "$travel_danger_prefix$ Uma Praga Sobre o Rebanho"
 mpo_migration_travel_events.0040.a:0 "Vamos atravessar essas águas com força!"
 mpo_migration_travel_events.0040.a_tt:0 "Você conduz o rebanho através do rio"
 mpo_migration_travel_events.0040.b:0 "Balsas nos levarão em segurança."
 mpo_migration_travel_events.0040.b_flavor:0 "Você constrói balsas para ajudar o rebanho a cruzar."
 mpo_migration_travel_events.0040.c:0 "Será que há um vau por perto?"
 mpo_migration_travel_events.0040.c_christian:0 "Se [ROOT.Char.GetFaith.HighGodName] pôde abrir o mar, com certeza [ROOT.Char.GetFaith.HighGodSheHe] pode nos ajudar a atravessar."
 mpo_migration_travel_events.0040.desc:0 "Uma corrente repentina assusta meu cavalo quando nos aproximamos do rio próximo a [county.GetNameNoTier]. A água, ao que parece, está alta demais para atravessar, e os menores do rebanho podem ser levados pela correnteza.\n\nNão parece haver caminho fácil, e o rebanho começa a se agitar."
 mpo_migration_travel_events.0040.lose:0 "Você perde alguns animais para a correnteza"
 mpo_migration_travel_events.0040.t:0 "O Rio Furioso"
 mpo_migration_travel_events.0040.win:0 "O rebanho atravessa o rio em segurança"
 mpo_migration_travel_events.0050.a:0 "Vá onde seu coração desejar, [courtier.GetFirstNameNoTooltip]."
 mpo_migration_travel_events.0050.b:0 "Deixar s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip] em nome do amor? Hah!"
 mpo_migration_travel_events.0050.c:0 "Direcione seus sentimentos para mim, [courtier.GetFirstNameNoTooltip]."
 mpo_migration_travel_events.0050.c_tt:0 "Você tenta seduzir [courtier.GetFirstNameNoTooltip]"
 mpo_migration_travel_events.0050.d:0 "Como pôde se apaixonar por outr[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!?"
 mpo_migration_travel_events.0050.desc:0 "M[Select_CString( courtier.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('courtier'))|l], [courtier.GetFirstName], tem sido visto longe do rebanho com frequência. Enquanto nos preparamos para partir para o próximo destino, [courtier.GetSheHe] se aproxima, com os olhos cheios de saudade.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip], encontrei meu par aqui,\" confessa [courtier.GetFirstNameNoTooltip]. \"Desejo deixar o rebanho e permanecer com [local.GetSheHe], m[Select_CString( local.IsFemale, 'inha', 'eu' )] [local.GetFirstName]. Por favor, deixe-me ir.\""
 mpo_migration_travel_events.0050.lose:0 "[courtier.GetFirstNameNoTooltip] parte mesmo assim"
 mpo_migration_travel_events.0050.t:0 "Amor nas Estepes"
 mpo_migration_travel_events.0050.win:0 "[courtier.GetFirstNameNoTooltip] se rende aos seus encantos"
 mpo_migration_travel_events.0060.a:0 "Acabem com ele, rápido!"
 mpo_migration_travel_events.0060.a_bad:0 "O cavalo morre"
 mpo_migration_travel_events.0060.a_bad_tt:0 "@death_icon!#n Um cortesão morre#!"
 mpo_migration_travel_events.0060.a_tt:0 "Você sacrifica o cavalo para salvar [courtier.GetFirstNameNoTooltip] e os demais"
 mpo_migration_travel_events.0060.b:0 "Eu cuido disso. Afastem-se!"
 mpo_migration_travel_events.0060.c:0 "Esperemos que [courtier.GetFirstNameNoTooltip] seja a única vítima..."
 mpo_migration_travel_events.0060.desc:0 "O pânico se espalha pelo acampamento quando um cavalo se solta de sua amarra, quase derrubando [courtier.GetFirstName] de seu dorso. O animal enlouqueceu pela jornada, ou talvez tenha sido provocado, e agora corre descontrolado, ignorando todos que tentam acalmá-lo.\n\n[courtier.GetFirstNameNoTooltip] grita ao perceber que não está mais no controle da criatura e que está a ponto de cair a cada coice."
 mpo_migration_travel_events.0060.herd:0 "O cavalo atropela parte do rebanho"
 mpo_migration_travel_events.0060.lose:0 "O cavalo investe"
 mpo_migration_travel_events.0060.people:0 "O cavalo atropela mais membros da comitiva"
 mpo_migration_travel_events.0060.people_tt:0 "#n Mais alguns podem ter sido vítimas do cavalo#!"
 mpo_migration_travel_events.0060.t:0 "$travel_danger_prefix$ Cascos Selvagens"
 mpo_migration_travel_events.0060.tt:0 "Você tenta acalmar o cavalo"
 mpo_migration_travel_events.0060.win:0 "O cavalo é acalmado sem mais incidentes"
 no_longer_herd_limit_tt:0 "Você não está mais acima do seu limite de [herd|E]."
 nomad_keep_herd_modifier:0 "Rebanho Estagnado"
 nomad_keep_herd_modifier_desc:0 "O rebanho deste personagem cresceu demais e terá dificuldades para continuar se expandindo no mesmo ritmo."
 nomad_slow_horses_modifier:0 "Cavalos Lentos"
 nomad_weak_herd_modifier:0 "Rebanho Enfraquecido"
 nomad_weak_herd_modifier_desc:0 "O rebanho deste personagem foi enfraquecido por uma doença."
