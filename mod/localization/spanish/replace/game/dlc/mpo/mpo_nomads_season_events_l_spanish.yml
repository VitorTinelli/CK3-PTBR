l_spanish:
 given_herd:0 "Você tem esta opção porque anteriormente deu [herd|E] a este personagem."
 mpo_nomads_season_events.0001.a:0 "Amanhã, cavalgamos!"
 mpo_nomads_season_events.0001.b:0 "Devemos cuidar do nosso próprio abrigo."
 mpo_nomads_season_events.0001.desc:0 "\"Você vê a forma das nuvens? Parecem como se tivessem sido arranhadas pelas garras de um falcão\", diz m[Select_CString( storm_chaser.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('storm_chaser'))] [storm_chaser.GetTitledFirstName], apontando para o céu. \n\n\"Isso anuncia uma tempestade terrível. Eu digo que devemos usá-la a nosso favor. Vamos levar nossos cavalos e arcos para dentro da ventania furiosa, pegar [raid_target.GetTitledFirstName] desprevenido e roubar seu rebanho.\""
 mpo_nomads_season_events.0001.t:0 "Cavalgando a Tempestade"
 mpo_nomads_season_events.0005.a:0 "Seu povo não passará mais fome."
 mpo_nomads_season_events.0005.b:0 "O que você está disposto a dar em troca?"
 mpo_nomads_season_events.0005.c:0 "Não há nada para você aqui."
 mpo_nomads_season_events.0005.desc:0 "O vento uivante bate contra as paredes da minha iurta. \n\nFico surpreso com a chegada [Select_CString( hungry_neighbour.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hungry_neighbour'))] [hungry_neighbour.GetTitledFirstName], que enfrentou os perigos da tempestade para se prostrar diante de mim, colocando uma garrafa de [Glossary( 'kumis', 'KUMIS_GLOSS')] aos meus pés como oferenda. \n\n\"Estes são tempos terríveis, e meu povo está faminto. Não me resta outra opção senão pedir ajuda.\""
 mpo_nomads_season_events.0005.t:0 "Estômagos Vazios"
 mpo_nomads_season_events.0010.a:0 "Diga-me seu preço."
 mpo_nomads_season_events.0010.b:0 "Aceito sua oferenda."
 mpo_nomads_season_events.0010.c:0 "Não há dívida entre [rich_neighbour.Custom('SisterBrother')]s."
 mpo_nomads_season_events.0010.d.tt.failure:0 "[rich_neighbour.GetTitledFirstName] e os guardas pessoais [rich_neighbour.GetHerHim] conseguiram escapar"
 mpo_nomads_season_events.0010.d.tt.success:0 "Você derrotou [rich_neighbour.GetTitledFirstName] e os guardas pessoais [rich_neighbour.GetHerHim]"
 mpo_nomads_season_events.0010.d:0 "Me dê seu rebanho, ou me dê sua cabeça!"
 mpo_nomads_season_events.0010.desc:0 "O balido das ovelhas perturba minha paz matinal. Depois vem o cheiro delas, forte sob o sol escaldante. E por fim, chega seu dono. M[Select_CString( rich_neighbour.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rich_neighbour'))] [rich_neighbour.GetTitledFirstName] "
 mpo_nomads_season_events.0010.desc_fallback:0 "sujou a entrada da minha iurta com esterco ao entrar. \n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] #EMP querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]#! [ROOT.Char.GetTitleTierName]!\", declara [rich_neighbour.GetSheHe]. \"Tenho os céus a agradecer por um rebanho abundante. Tenho o suficiente para compartilhar, se tiver moedas.\""
 mpo_nomads_season_events.0010.desc_offered_herd:0 "remove cuidadosamente seus sapatos, para não pisar esterco dentro da minha iurta. \n\n\"Não me esqueci da generosidade que demonstrou quando meu povo estava faminto. Vim pagar minha dívida.\""
 mpo_nomads_season_events.0010.e:0 "Não preciso negociar."
 mpo_nomads_season_events.0010.t:0 "Estação da Abundância"
 mpo_nomads_season_events.0015.a:0 "Não chore por #EMP kumis#! derramado, [kurultai_2.GetTitledFirstNameNoTooltip]."
 mpo_nomads_season_events.0015.b.tt.failure:0 "[kurultai_2.GetTitledFirstName] se machuca na briga"
 mpo_nomads_season_events.0015.b.tt.success:0 "[kurultai_1.GetTitledFirstName] se machuca na briga"
 mpo_nomads_season_events.0015.b:0 "Vamos, lutem! Entretenham o resto de nós."
 mpo_nomads_season_events.0015.c:0 "Deixem isso pra lá, vocês dois."
 mpo_nomads_season_events.0015.desc:0 "Por toda parte que olho, vejo meus súditos raspando o fundo de tigelas vazias, tentando aproveitar cada migalha de nossos suprimentos cada vez menores. \n\nO silêncio é quebrado por um estrondo. A tigela de [kurultai_2.GetTitledFirstName] com [Glossary( 'kumis', 'KUMIS_GLOSS')] está virada no chão, com o conteúdo escorrendo pela terra seca. [kurultai_1.GetTitledFirstName] está de pé acima da cena, rindo, e diz: \"Eu não vi você aí.\" \n\n[kurultai_2.GetTitledFirstName] se levanta num pulo, ombros tensos. Parece que meus dois membros do Kurultai vão acabar brigando."
 mpo_nomads_season_events.0015.t:0 "Ânimos em Brasa"
 mpo_storm_shelter_modifier:0 "Protegido Contra a Tempestade"
 mpo_storm_shelter_modifier_desc:0 "Este acampamento tem suas iurtas bem presas ao chão, com os animais mantidos próximos uns dos outros, para se proteger contra tempestades."
