 nomad_title_name:0 "O Acampamento Nômade dos [holder.GetHouse.GetNameNoTooltip]"
 nomad_title_name_only_holder_scope:0 "O Acampamento Nômade dos [CHARACTER.GetHouse.GetNameNoTooltip]"
 nomadic_migration_contract_10_contract:0 "$nomadic_migration_contract_10_desc_title$"
 nomadic_migration_contract_10_desc:0 "Nosso acampamento em [TaskContract.GetLocation.GetName] foi abordado por pequenas comunidades que viviam na região antes de migrarmos para cá."
 nomadic_migration_contract_10_desc_title:0 "A Velha Tribo"
 nomadic_migration_contract_10_request:0 "$nomadic_migration_contract_request$"
 nomadic_migration_contract_1_contract:0 "$nomadic_migration_contract_1_desc_title$"
 nomadic_migration_contract_1_desc:0 "Após nos estabelecermos em [TaskContract.GetLocation.GetName], tivemos diversos conflitos com um grupo de pastores locais, segundo [TaskContract.GetEmployer.GetName]. Suas provocações já duram tempo demais — é hora de pôr fim a essa agitação."
 nomadic_migration_contract_1_desc_title:0 "Pastores Desagradáveis"
 nomadic_migration_contract_1_request:0 "$nomadic_migration_contract_request$"
 nomadic_migration_contract_2_contract:0 "$nomadic_migration_contract_2_desc_title$"
 nomadic_migration_contract_2_desc:0 "Um rebanho selvagem tem devastado os campos ao redor de [TaskContract.GetLocation.GetName]. Nossos próprios rebanhos sofrerão enquanto essas bestas forem deixadas soltas."
 nomadic_migration_contract_2_desc_title:0 "O Rebanho Selvagem"
 nomadic_migration_contract_2_request:0 "$nomadic_migration_contract_request$"
 nomadic_migration_contract_3_contract:0 "$nomadic_migration_contract_3_desc_title$"
 nomadic_migration_contract_3_desc:0 "Tem havido um conflito constante entre meus [TaskContract.GetTaker.Custom('KnightCulturePluralNoTooltip')] pelas melhores pastagens em torno de [TaskContract.GetLocation.GetName], que se agravou lentamente até que o orgulho os colocasse em forte desacordo."
 nomadic_migration_contract_3_desc_title:0 "Pastagens em Disputa"
 nomadic_migration_contract_3_request:0 "$nomadic_migration_contract_request$"
 nomadic_migration_contract_4_contract:0 "$nomadic_migration_contract_4_desc_title$"
 nomadic_migration_contract_4_desc:0 "A migração para [TaskContract.GetLocation.GetName] causou um impacto em nosso estoque de materiais e ferramentas. Sem reabastecimento, isso certamente afetará nossa tribo em breve."
 nomadic_migration_contract_4_desc_title:0 "Falta de Ferramentas"
 nomadic_migration_contract_4_request:0 "$nomadic_migration_contract_request$"
 nomadic_migration_contract_5_contract:0 "$nomadic_migration_contract_5_desc_title$"
 nomadic_migration_contract_5_desc:0 "Desconectada do restante do povo sob minha liderança, a tribo em [TaskContract.GetLocation.GetName] exigiu um chefe local."
 nomadic_migration_contract_5_desc_title:0 "Fragmentação da Tribo"
 nomadic_migration_contract_5_request:0 "$nomadic_migration_contract_request$"
 nomadic_migration_contract_6_contract:0 "$nomadic_migration_contract_6_desc_title$"
 nomadic_migration_contract_6_desc:0 "As terras ao redor de [TaskContract.GetLocation.GetName] parecem ter causado um efeito debilitante no nosso rebanho local, que adoeceu após se estabelecer ali."
 nomadic_migration_contract_6_desc_title:0 "Terras Venenosas"
 nomadic_migration_contract_6_request:0 "$nomadic_migration_contract_request$"
 nomadic_migration_contract_7_contract:0 "$nomadic_migration_contract_7_desc_title$"
 nomadic_migration_contract_7_desc:0 "Cavaleiros de uma tribo vizinha estão avançando sem vergonha por [TaskContract.GetLocation.GetName], trazendo consigo um grande rebanho de animais."
 nomadic_migration_contract_7_desc_title:0 "Vizinhos Problemáticos"
 nomadic_migration_contract_7_request:0 "$nomadic_migration_contract_request$"
 nomadic_migration_contract_8_contract:0 "$nomadic_migration_contract_8_desc_title$"
 nomadic_migration_contract_8_desc:0 "Aparentemente encontramos os vestígios de um grupo anterior de pessoas na área. Há um rebanho de animais e yurts quebradas ao redor do nosso novo acampamento em [TaskContract.GetLocation.GetName]."
 nomadic_migration_contract_8_desc_title:0 "Os Restos"
