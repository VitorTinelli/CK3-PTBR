 mpo_si_lacking_tools_3_desc:0 "$mpo_si_lacking_tools_desc$"
 mpo_si_lacking_tools_desc:0 "O povo deste personagem não tem as ferramentas necessárias para cuidar adequadamente do clã."
 mpo_si_old_tribe:0 "Tribo Estrangeira"
 mpo_si_slaughtered_animals:0 "Carne Armazenada"
 mpo_si_slaughtered_animals_desc:0 "Este personagem armazenou uma grande quantidade de carne.\n#emp Removido na próxima vez que você realizar uma [GetActivityType('activity_feast').GetName]#!\n\nCusto da [GetActivityType('activity_feast').GetName]: #P [gold_i]-50%#!"
 mpo_si_slaughtered_for_a_feast:0 "Grande Banquete"
 mpo_si_slaughtered_for_a_feast_desc:0 "Este personagem trouxe um verdadeiro banquete para seu povo."
 mpo_si_spurned_tribe:0 "Tribo Rejeitada"
