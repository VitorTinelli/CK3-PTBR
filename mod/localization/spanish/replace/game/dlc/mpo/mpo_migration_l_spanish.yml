 migration_contract_2_herd_reward_tt:0 "#V Você#! ganha [herd_i] #P [SCOPE.ScriptValue('miniscule_herd_value_static')]-[SCOPE.ScriptValue('minor_herd_value_static')]#! [herd|E]"
 migration_contract_county_alt_text:0 "Este [county|E] não está mais enfrentando este problema"
 migration_contract_county_ownership_text:0 "Este [county|E] não faz mais parte do nosso [realm|E]"
 migration_contract_county_text:0 "Este [county|E] não está mais sofrendo com baixo [control|E]"
 mpo_contract_events.0005.a.impressed:0 "Chegamos a um acordo"
 mpo_contract_events.0005.a.unimpressed:0 "Eles não se impressionam com nossos argumentos"
 mpo_contract_events.0005.a:0 "Junte-se a mim, seremos mais fortes juntos."
 mpo_contract_events.0005.b:0 "Trabalhem para mim, eu lidarei com seus problemas de comida."
 mpo_contract_events.0005.c:0 "Expulsem-nos de #emp nossas#! terras."
 mpo_contract_events.0005.desc:0 "Bastaram poucos momentos após encontrar um dos pastores em Karakorum para descobrir o cerne do problema. [herder_character.GetName] afirma que sua comunidade vive nestas terras há gerações, mas só agora estão enfrentando escassez de alimentos desde a nossa chegada.\n\nEmbora se recusem a abandonar sua terra ancestral, uma demonstração de autoridade pode convencê-los do contrário — a menos que, é claro, desejemos encontrar uma maneira de transformar sua presença em vantagem."
 mpo_contract_events.0005.t:0 "$nomadic_migration_contract_1_desc_title$"
 mpo_contract_events.0015.a.failure:0 "Você captura uma pequena parte do rebanho selvagem"
 mpo_contract_events.0015.a.successful:0 "Você captura uma grande parte do rebanho selvagem"
 mpo_contract_events.0015.a:0 "Vou capturar alguns desses para nossos rebanhos."
 mpo_contract_events.0015.b:0 "Abatam-nos e preparem um pequeno banquete."
 mpo_contract_events.0015.c:0 "Eles nos renderão uma pequena fortuna."
 mpo_contract_events.0015.desc:0 "Mesmo de longe, o rebanho pastando é uma visão impressionante. Eles se alimentaram vorazmente da terra, deixando pouco espaço para nossos próprios rebanhos prosperarem e se expandirem.\n\nNossos pastores aterrorizados pediram que lidássemos com eles antes que nosso próprio rebanho comece a passar fome e morrer."
 mpo_contract_events.0015.t:0 "$nomadic_migration_contract_2_desc_title$"
 mpo_contract_events.0025.a:0 "[task_contract.GetEmployer.GetFirstNameNoTooltip] está com a razão, a terra é [task_contract.GetEmployer.GetHerHim]."
 mpo_contract_events.0025.b:0 "Na verdade, [knight_2.GetFirstNameNoTooltip] apresenta os melhores argumentos."
 mpo_contract_events.0025.c:0 "Meu próprio rebanho prosperará nessas terras."
 mpo_contract_events.0025.desc:0 "Após migrarmos para [task_contract.GetLocation.GetName], surgiu uma disputa contínua entre [task_contract.GetEmployer.GetFirstName] e [knight_2.GetFirstName] pelas pastagens próximas.\n\nEmbora fosse uma dor de cabeça menor no início, o conflito se intensificou e agora o orgulho impede que qualquer lado recue. Devo intervir antes que piore ainda mais e afete o moral no acampamento."
 mpo_contract_events.0025.t:0 "$nomadic_migration_contract_3_desc_title$"
 mpo_contract_events.0035.a:0 "Nossos comerciantes cuidarão disso."
 mpo_contract_events.0035.b:0 "Vamos encontrar um comerciante para conseguir as ferramentas."
 mpo_contract_events.0035.c:0 "Meu nome é conhecido por todos, alguém vai cuidar disso."
 mpo_contract_events.0035.d:0 "O povo terá que se virar sem elas."
 mpo_contract_events.0035.desc:0 "A última migração para [task_contract.GetLocation.GetName] foi desgastante para meu povo, que agora carece de muitas ferramentas básicas usadas no dia a dia. Isso tem atrasado até mesmo as tarefas mais simples.\n\nSem um comerciante que nos traga os suprimentos necessários, meu povo continuará a sofrer."
 mpo_contract_events.0035.t:0 "$nomadic_migration_contract_4_desc_title$"
 mpo_contract_events.0045.a.failure:0 "Eles continuam não convencidos"
 mpo_contract_events.0045.a.successful:0 "Eu os convenci"
 mpo_contract_events.0045.a:0 "Podemos conversar sobre isso."
 mpo_contract_events.0045.b.tt:0 "[task_contract.GetLocation.GetName] pode se tornar uma [divergent_culture|E] de [task_contract.GetLocation.GetCulture.GetName]"
 mpo_contract_events.0045.b:0 "[new_chieftain.GetFirstNameNoTooltip], é isso? Então que [new_chieftain.GetSheHe] os governe."
 mpo_contract_events.0045.c:0 "Um pequeno presente os lembrará de tudo que faço por eles."
 mpo_contract_events.0045.d:0 "Eles vão acabar se acostumando."
 mpo_contract_events.0045.desc:0 "A tribo de [task_contract.GetLocation.GetName], mesmo antes de migrarmos para a região, já se mostrava um tanto desligada do restante de [ROOT.Char.GetPrimaryTitle.GetName]. Agora, mais do que nunca, parece que querem maior independência e um verdadeiro chefe próprio.\n\nQuando chego, é um[Select_CString( new_chieftain.IsFemale, 'a', '' )] [new_chieftain.GetWomanMan] chamad[Select_CString( new_chieftain.IsFemale, 'a', 'o' )] [new_chieftain.GetFirstName] quem parece ser seu representante. [new_chieftain.GetSheHe|U] parece uma pessoa razoável, disposto(a) a jurar obediência a mim, desde que seu povo possa viver da própria maneira."
 mpo_contract_events.0045.t:0 "$nomadic_migration_contract_5_desc_title$"
 mpo_contract_events.0055.a.failure:0 "O rebanho piora"
 mpo_contract_events.0055.a.successful:0 "O rebanho se recupera"
 mpo_contract_events.0055.a:0 "Eles vão resistir, eu cuidarei disso."
 mpo_contract_events.0055.b:0 "Vou mandar chamar alguém que possa ajudá-los."
 mpo_contract_events.0055.c:0 "Vamos abatê-los antes que a doença se espalhe ainda mais."
 mpo_contract_events.0055.desc:0 "Nosso rebanho está enfraquecido, seu passo firme agora vacila. Ao observar os animais, vejo vários deles simplesmente deitados, sem forças nem para se mover.\n\nEnquanto essa fraqueza continuar a se espalhar, todo o nosso rebanho em [task_contract.GetLocation.GetName] corre o risco de ser infectado. O que será da nossa tribo se isso acontecer?"
 mpo_contract_events.0055.t:0 "$nomadic_migration_contract_6_desc_title$"
 mpo_contract_events.0065.a.failure:0 "Não conseguimos detê-los"
 mpo_contract_events.0065.a.successful:0 "Eles pagam o preço"
 mpo_contract_events.0065.a:0 "Vamos deixá-los partir em paz, mas com um custo."
 mpo_contract_events.0065.b:0 "Estas são #emp nossas#! terras, e esses são #emp nossos#! rebanhos."
 mpo_contract_events.0065.c:0 "Deixem-nos em paz."
 mpo_contract_events.0065.desc:0 "Apesar de serem poucos, os cavaleiros de [neighbor_leader.GetPrimaryTitle.GetBaseName] estão avançando corajosamente por [task_contract.GetLocation.GetName] com um grande rebanho sob sua liderança. Ao que parece, estavam seguindo o rastro de um rebanho perdido quando nos estabelecemos na região.\n\nMesmo que essas terras parecessem vazias na chegada deles, não posso permitir que simplesmente atravessem meu domínio.\n\n#bold Estas terras são para o meu rebanho, e somente para o meu rebanho.#!"
 mpo_contract_events.0065.t:0 "$nomadic_migration_contract_7_desc_title$"
 mpo_contract_events.0075.a:0 "Eles serão uma ótima adição aos nossos rebanhos."
 mpo_contract_events.0075.b:0 "Expulsem-nos de [task_contract.GetLocation.GetNameNoTooltip]."
 mpo_contract_events.0075.c:0 "Abatam os animais."
 mpo_contract_events.0075.desc:0 "Ao passar pelos [barony_location.Custom('HoldingNoHoldingTerrainRoaming')], encontro o rebanho semi-domesticado que já havia sido observado várias vezes. Mesmo ao me aproximar, fica claro que eles já interagiram com humanos antes.\n\nSe forem deixados sozinhos, continuarão a pastar em terras que poderiam ser usadas por nosso rebanho. Devo levá-los de volta para [ROOT.Char.GetCapitalLocation.GetName], ou lidar com eles de outra forma? Qual seria a melhor solução para o meu povo?"
 mpo_contract_events.0075.t:0 "$nomadic_migration_contract_8_desc_title$"
 mpo_contract_events.0085.a:0 "As terras de pasto ficarão com [task_contract.GetLocation.GetNameNoTooltip]."
 mpo_contract_events.0085.b:0 "Pertence a [other_county.GetNameNoTooltip]."
 mpo_contract_events.0085.desc:0 "[task_contract.GetEmployer.GetName] me explicou detalhadamente a situação. Parece que, após migrarmos para a região, a tribo em [other_county.GetName] foi a primeira a tomar posse das terras de pasto, mas a área fica muito mais próxima de [task_contract.GetLocation.GetName].\n\nEmbora [task_contract.GetEmployer.GetSheHe] tenha tentado mediar, as tentativas de [task_contract.GetEmployer.GetNamePossessiveNoTooltip] não surtiram efeito. De qualquer forma, um dos dois lados ficará desapontado, mas uma decisão precisa ser tomada o quanto antes."
 mpo_contract_events.0085.t:0 "$nomadic_migration_contract_9_desc_title$"
 mpo_contract_events.0095.a:0 "Vamos acolhê-los."
 mpo_contract_events.0095.b:0 "Eles não pertencem a este lugar, expulsem-nos."
 mpo_contract_events.0095.desc:0 "Meu acampamento foi abordado por [new_chieftain.GetName], líder de apenas um punhado de pessoas. O dialeto [new_chieftain.GetHerHim] é estranho, mas [new_chieftain.GetSheHe] fala com confiança e orgulho sobre seu povo e suas dificuldades.\n\n#emp \"[ROOT.Char.GetTitleAsNameNoTooltip], se você puder encontrar espaço para nós entre suas yurts, ofereceremos nosso rebanho e eu o servirei pessoalmente. Caso contrário... Não há muito mais para nós nestas terras.\"#!"
 mpo_contract_events.0095.t:0 "$nomadic_migration_contract_10_desc_title$"
 mpo_si_accepting_cultures:0 "Aceitando a Fragmentação"
 mpo_si_accepting_cultures_desc:0 "Este personagem aceitou que tribos se fragmentem de sua própria tribo."
 mpo_si_lacking_tools:0 "Falta de Ferramentas"
 mpo_si_lacking_tools_2:0 "$mpo_si_lacking_tools$"
