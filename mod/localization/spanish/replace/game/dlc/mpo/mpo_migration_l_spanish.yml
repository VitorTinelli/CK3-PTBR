 msg_migration_into_realm_fellow_tributary_desc:0 "[actor.GetUIName|U] [Concept('migrated', 'migrou')|E] para o [target_title.GetBaseName] #weak ([target_title.GetName])#!, deslocando seu tributo aliado [tributary|E], [old_holder.GetShortUIName|U]"
