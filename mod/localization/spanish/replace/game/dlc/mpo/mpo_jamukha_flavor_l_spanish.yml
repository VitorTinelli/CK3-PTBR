l_spanish:
 blood_brother_gains_hook_other_tt:0 "#high Você#! recebe um [strong_hook|E] #EMP (Blood Brother)#! sobre [blood_bro.GetShortUIName]"
 blood_brother_gains_hook_tt:0 "Recebe um [strong_hook|E] #EMP (Blood Brother)#! sobre #high você#!"
 jamukha_choose_blood_brother_tt:0 "[jamukha.GetShortUIName] decidirá se seguirá em frente com o pacto de [blood_brothers|E]"
 jamukha_chose_loyalty_modifier:0 "Escolheu Lealdade a Temujin"
 jamukha_chose_loyalty_modifier_desc:0 "Jamukha provou ser um amigo nobre e verdadeiro, mesmo à custa de seu próprio ego."
 jamukha_gain_from_defectors_tt:0 "#weak @herd_icon![herd|E] e @prestige_icon![prestige|E] ganhos devido aos mongóis se reunindo para a guerra"
 jamukha_temujin_no_more_positive_tt:0 "@alert_icon! #X Todas as [relations|E] positivas entre #high você#! e [temujin.GetShortUIName] foram destruídas"
 jamukha_temujin_response_warning_tt:0 "@warning_icon! #X [temujin.GetShortUIName] pode prejudicar seu @prestige_icon![prestige|E] e @dread_icon![dread|E]#!"
 jamukha_temujin_rivals_tt:0 "[temujin.GetShortUIName] tornou-se seu [rival|E]"
 jamukha_warhorse_jamukha_tt:0 "[temujin.GetShortUIName] lhe dá um [GetModifier('horse_story_modifier').GetNameWithTooltip]"
 jamukha_warhorse_tt:0 "#high Você#! dará a [jamukha.GetShortUIName] um [GetModifier('horse_story_modifier').GetNameWithTooltip]"
 mpo_jamukha_flavor.0001.a.tt:0 "E trocaremos presentes dignos."
 mpo_jamukha_flavor.0001.a:0 "Darei a [temujin.GetFirstNameNoTooltip] minha promessa de irmandade."
 mpo_jamukha_flavor.0001.b:0 "Estou aqui para lutar pelo poder. Não pelo amor."
 mpo_jamukha_flavor.0001.desc:0 "[temujin.GetTitledFirstName] e eu sentamos ao redor da fogueira. Nossos povos estão unidos ao nosso redor em um grande acampamento.\n\nAnos se passaram desde que ofereci amizade a ele, o jovem guerreiro abandonado pelo clã de seu pai. Jogamos ossos de joelhos no gelo do Rio Onon. Juramos ser sempre amigos.\n\nFomos crianças então. Desde então, guerreamos juntos e nossa amizade cresceu. Agora, como homens, sabemos as palavras para nos tornarmos [Glossary( 'anda', 'ANDA_GLOSS' )] para a vida."
 mpo_jamukha_flavor.0001.t:0 "Anos de Irmandade"
 mpo_jamukha_flavor.0010.a:0 "Preciso buscar meu destino. Sem [temujin.GetFirstNameNoTooltip]."
 mpo_jamukha_flavor.0010.b:0 "Minha palavra me prende, como uma espada no cinto de [temujin.GetFirstNamePossessiveNoTooltip]."
 mpo_jamukha_flavor.0010.desc:0 "Tenho conduzido meu povo, há algum tempo, ao lado de [temujin.GetTitledFirstNamePossessive], leal aos seus caprichos, constante apesar de minha mente turbulenta.\n\nMulheres sussurram veneno no ouvido de [temujin.GetFirstNamePossessiveNoTooltip]. Seus guardas noturnos me observam de forma sombria quando me aproximo de sua tenda. Quanto tempo poderei suportar esses insultos?\n\n"
 mpo_jamukha_flavor.0010.desc_togrul:0 "E o poderoso [togrul.GetName] prometeu a proteção de [togrul.GetHerHis], caso eu abandone [temujin.GetFirstNamePossessiveNoTooltip]..."
 mpo_jamukha_flavor.0010.t:0 "Ofensas que Nenhum Mongol Pode Suportar"
 mpo_jamukha_flavor.0020.a:0 "#EMP \"Seu maldito cachorro, que já foi meu irmão!\"#!"
 mpo_jamukha_flavor.0020.a_war_win:0 "Vencer uma [war|E] #high ofensiva#! contra [temujin.GetShortUIName] concederá @legitimacy_icon![legitimacy|E] adicional e @prestige_icon![prestige|E]"
 mpo_jamukha_flavor.0020.b:0 "\"Sua morte será lamentável, [temujin.GetFirstNameNoTooltip]...\""
 mpo_jamukha_flavor.0020.b_murder:0 "Você ganha um bônus #P #EMP massivo#!#! para [schemes|E] de [GetScheme('murder').GetTypeName] visando [temujin.GetShortUIName]"
 mpo_jamukha_flavor.0020.c:0 "\"No campo de batalha, #EMP seu destino será meu!#!\""
 mpo_jamukha_flavor.0020.desc:0 "Cavalguei à noite até o acampamento de [temujin.GetTitledFirstNamePossessive], queimando de raiva e vergonha. O destino — pensamentos sombrios além da luz da minha mente — me impulsionou.\n\nQuando [temujin.GetFirstNameNoTooltip] e eu éramos pequenos, desmembramos o corpo de uma marmota. Sua carne permaneceu em meu estômago, como veneno, todos esses anos. As palavras de nossa amizade queimam minha mente, desfiguram meu rosto, quando as recordo. #EMP Como#! poderia jurar lealdade ao homem destinado a governar todos os Mongóis — #EMP meu#! destino? Com as promessas de criança, dei a mim mesmo a vida de um traidor.\n\n#EMP \"Eu vou te destruir!\"#! grito, enquanto [temujin.GetFirstNameNoTooltip] sorri zombeteiro. #EMP \"Eu, [ROOT.Char.GetFirstName], sou Cã dos [ROOT.Char.GetDomicile.GetCulture.GetCollectiveNoun]!\"#!"
 mpo_jamukha_flavor.0020.t:0 "Homens com Sonhos Sangrentos"
 mpo_nerge_promised_feast_failed:0 "Falsas Promessas de Carne"
 mpo_nerge_promised_feast_failed_desc:0 "Aos nobres caçadores, esta personagem prometeu uma montanha de boa carne. E não entregou."
 negotiate_togrul_alliance_effect_tooltip:0 "[jamukha.GetShortUIName] e [togrul.GetShortUIName] entram em uma [alliance|E] mútua"
 temujin_gain_from_defectors_tt:0 "$jamukha_gain_from_defectors_tt$"
 temujin_warhorse_jamukha_tt:0 "#high Você#! dá a [temujin.GetShortUIName] um [GetModifier('horse_story_modifier').GetNameWithTooltip]"
 temujin_warhorse_tt:0 "[jamukha.GetShortUIName] lhe dará um [GetModifier('horse_story_modifier').GetNameWithTooltip]"
