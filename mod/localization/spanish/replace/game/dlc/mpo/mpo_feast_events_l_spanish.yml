l_spanish:
 AIRAG_GLOSS:0 "#bold Airag#! ou #bold Kumis#! é uma bebida tradicional mongol e turcomana feita com leite de égua fermentado."
 HOOMEI_GLOSS:0 "O estilo de canto gutural mais popular, #bold Hoomei#! ou #bold Khoomei#!, pode ser descrito como um som zumbido, geralmente cantado na faixa média da voz do cantor."
 KARGYRAA_GLOSS:0 "O estilo profundo e quase gutural de canto é conhecido como #bold Kargyraa#!. Utilizando as cordas vocais falsas do cantor, é comparado ao som de um animal rosnando ou ao trovão ribombando."
 SHAGAI_GLOSS:0 "#bold Shagai#! é um jogo de adivinhação jogado com ossos do tornozelo de ovelhas ou cabras. Os ossos são lançados como dados e caem em um dos quatro lados: cavalo, ovelha, camelo ou cabra. O cavalo e o camelo são considerados sortudos, enquanto a ovelha e a cabra não são."
 SYGYT_GLOSS:0 "#bold Sygyt#! é um estilo de canto gutural que muitas vezes se assemelha a um assobio ou flauta. Por ser claro e agudo, é usado para imitar o som da brisa ou o canto dos pássaros."
 feast_tsagaan_sar_events.0001.a:0 "...os baús de moedas que receberei."
 feast_tsagaan_sar_events.0001.a_tt:0 "Você terá mais chance de receber [gold|E] dos convidados"
 feast_tsagaan_sar_events.0001.b:0 "...as bugigangas que receberei e as histórias que elas contam."
 feast_tsagaan_sar_events.0001.b_tt:0 "Você terá mais chance de receber [artifacts|E] dos convidados"
 feast_tsagaan_sar_events.0001.c:0 "...os convidados. Não seria nada sem eles."
 feast_tsagaan_sar_events.0001.c_tt:0 "Você terá mais chance de receber um [hook|E] dos convidados"
 feast_tsagaan_sar_events.0001.d:0 "...as bênçãos de [ROOT.Char.GetFaith.HighGodName] neste novo ano."
 feast_tsagaan_sar_events.0001.d_tt:0 "Você terá mais chance de receber [piety|E] dos convidados"
 feast_tsagaan_sar_events.0001.desc:0 "Cavalos se reúnem ao redor das yurts do acampamento, seus cavaleiros os acariciam uma última vez antes de irem socializar. Os jovens correm, brincando de pega-pega e fazendo pegadinhas com os mais velhos. Todos estão vestidos de branco radiante, seus mantos recém-costurados, tão novos quanto o ano.\n\nEnquanto os [ROOT.Char.Custom('GetWomenOrMenBasedOnFaith')] rolam e lutam, há uma paz no ar: suas disputas e apostas fortalecem sua irmandade. Os [ROOT.Char.Custom('GetWomenOrMenBasedOnFaithOpposite')] preparam as mesas da festa, e o cheiro de carneiro chega até mim.\n\nEste Banquete será memorável — contanto que eu preste atenção em..."
 feast_tsagaan_sar_events.0001.e:0 "...a comida!"
 feast_tsagaan_sar_events.0001.f:0 "...a celebração!"
 feast_tsagaan_sar_events.0001.t:0 "A Noite que Vem"
 feast_tsagaan_sar_events.0001_none:0 "Nenhum dos seus [activity_guests|E] conseguiu lhe dar um presente este ano"
 feast_tsagaan_sar_events.0001_tt:0 "#V [gifters_list_size]#! convidados #p irão#! lhe dar algo"
 feast_tsagaan_sar_events.0002.artifact:0 "Posso abrir mão de um dos meus itens."
 feast_tsagaan_sar_events.0002.artifact_tt:0 "Você escolherá um [artifact|E] para oferecer a [host.GetName]"
 feast_tsagaan_sar_events.0002.blessing:0 "[host.GetFaith.HighGodName] abençoará [host.GetSheHe], eu cuidarei disso."
 feast_tsagaan_sar_events.0002.blessing_tt:0 "Você concederá bênçãos a [host.GetFirstNameNoTooltip], oferecendo a [host.GetSheHe] parte da sua [piety_i] [piety|E]"
 feast_tsagaan_sar_events.0002.choose:0 "Talvez eu devesse escolher outra coisa."
 feast_tsagaan_sar_events.0002.choose_tt:0 "Você escolherá um presente diferente para [host.GetName]"
 feast_tsagaan_sar_events.0002.desc:0 "As festividades começaram, e embora eu seja grato a [host.GetName] pelo convite, fico pensando no presente que devo dar a [host.GetSheHe]. Isso vai além da tradição: trata-se de honra.\n\nObservo outros nobres trazendo baús de moedas estrangeiras, e camponeses com pequenos sacos de bens preciosos. Outros chegam montados em cavalos, prontos para entregá-los ao novo dono. Alguns convidados oferecem algo intangível, proferindo preciosos votos de fidelidade.\n\nMas surge a pergunta: o que posso oferecer [Select_CString( host.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], [host.GetFirstNameNoTooltip]?"
 feast_tsagaan_sar_events.0002.desc_again:0 "Mais uma vez, preciso pensar em como demonstrar meu respeito por [host.GetName]. Eu poderia muito bem resistir, torcendo para que [host.GetSheHe] não se importe, ou melhor ainda, nem perceba.\n\nO tempo não está ao meu favor; esta pode ser minha última chance de preparar algo para [host.GetSheHe]."
 feast_tsagaan_sar_events.0002.gold_1:0 "Acho que posso separar algumas moedas para [host.GetSheHe]."
 feast_tsagaan_sar_events.0002.gold_2:0 "Um saquinho de ouro será suficiente!"
 feast_tsagaan_sar_events.0002.gold_3:0 "Não me importo em dividir minha riqueza com [host.GetFirstNameNoTooltip]!"
 feast_tsagaan_sar_events.0002.gold_tt:0 "Você escolherá quanto [gold_i] [gold|E] oferecer a [host.GetName]"
 feast_tsagaan_sar_events.0002.herd_1:0 "Algumas ovelhas serão úteis para [host.GetSheHe]."
 feast_tsagaan_sar_events.0002.herd_2:0 "Tenho um cavalo sobrando..."
 feast_tsagaan_sar_events.0002.herd_3:0 "Bovinos ou ovelhas, o que escolher?"
 feast_tsagaan_sar_events.0002.herd_4:0 "Meu rebanho pode ser uma boa escolha, afinal."
 feast_tsagaan_sar_events.0002.herd_tt:0 "Você escolherá quanto [herd_i] [herd|E] oferecer a [host.GetName]"
 feast_tsagaan_sar_events.0002.loyalty:0 "Minha lealdade é o maior presente de todos."
 feast_tsagaan_sar_events.0002.none:0 "Na verdade, não darei nada a [host.GetFirstNameNoTooltip]."
 feast_tsagaan_sar_events.0002.nothing:0 "Parece que não há nada que eu possa oferecer..."
 feast_tsagaan_sar_events.0002.nothing_arrogant:0 "Minha presença já é suficiente para [host.GetSheHe]."
 feast_tsagaan_sar_events.0002.nothing_fickle:0 "Talvez eu decida depois?"
 feast_tsagaan_sar_events.0002.nothing_important:0 "@warning_icon! #warning Como você é importante para [host.GetFirstNameNoTooltip], [host.GetSheHe] ficará ofendido com isso.#!"
 feast_tsagaan_sar_events.0002.nothing_tt:0 "Como você não tem nada para oferecer a [host.GetFirstNameNoTooltip], [host.GetSheHe] não se importará."
 feast_tsagaan_sar_events.0002.nothing_unimportant:0 "@warning_icon! #warning Embora você não seja importante para [host.GetFirstNameNoTooltip], [host.GetSheHe] pode se ofender com sua falta de presente.#!"
 feast_tsagaan_sar_events.0002.prestige:0 "Falarei bem [host.GetHerHim]!"
 feast_tsagaan_sar_events.0002.prestige_tt:0 "Você espalhará a majestade de [host.GetFirstNamePossessiveNoTooltip], concedendo a [host.GetSheHe] parte do seu [prestige_i] [prestige|E]"
 feast_tsagaan_sar_events.0002.t:0 "Preparando o Presente"
 feast_tsagaan_sar_events.0003.gold:0 "Moedas são valiosas em qualquer lugar, e tenho certeza que [host.GetName] concorda. Meus cofres não são infinitos, porém, e [host.GetFirstNameNoTooltip] só pode levar uma parte."
 feast_tsagaan_sar_events.0003.herd:0 "Meu rebanho será um presente formidável para [host.GetName]. O povo [host.GetHerHim] prosperará ao migrar pelas estepes e lutar montado em meus cavalos. Mas ainda resta a questão: quanto estou disposto a ceder?"
 feast_tsagaan_sar_events.0003.major.gold:0 "Que o tesouro de [host.GetFirstNamePossessiveNoTooltip] transborde!"
 feast_tsagaan_sar_events.0003.major.herd:0 "[host.GetFirstNameNoTooltip] terá gado suficiente para quilômetros!"
 feast_tsagaan_sar_events.0003.major.piety:0 "O nome de [host.GetFirstNamePossessiveNoTooltip] será conhecido por todos os [host.GetFaith.GetAdherentNamePlural]!"
 feast_tsagaan_sar_events.0003.major.prestige:0 "O nome de [host.GetFirstNamePossessiveNoTooltip] ecoará pela terra e por [ROOT.Char.GetFaith.PositiveAfterLife] igualmente!"
 feast_tsagaan_sar_events.0003.medium.gold:0 "Um baú para o [host.GetTitleAsNameNoTooltip]!"
 feast_tsagaan_sar_events.0003.medium.gold_2:0 "[host.GetSheHe|U] merece mais do que um punhado."
 feast_tsagaan_sar_events.0003.medium.herd:0 "Alguns rebanhos de gado devem ser suficientes."
 feast_tsagaan_sar_events.0003.medium.herd_2:0 "Uma tropa de cavalos, o bastante para a família [host.GetHerHim]."
 feast_tsagaan_sar_events.0003.medium.piety:0 "Com minhas orações, [host.GetFirstNameNoTooltip] está destinado a [host.GetFaith.PositiveAfterLife]."
 feast_tsagaan_sar_events.0003.medium.prestige:0 "Cantarei músicas sobre [host.GetSheHe]!"
 feast_tsagaan_sar_events.0003.minor.gold:0 "Vou jogar algumas moedas no caminho [host.GetHerHim]."
 feast_tsagaan_sar_events.0003.minor.gold_2:0 "Um pequeno saquinho, de fato."
 feast_tsagaan_sar_events.0003.minor.herd:0 "Um cavalo deve bastar."
 feast_tsagaan_sar_events.0003.minor.herd_2:0 "Talvez uma ou duas ovelhas."
 feast_tsagaan_sar_events.0003.minor.piety:0 "Eu sei que [host.GetFirstNameNoTooltip] é um verdadeiro [host.GetFaith.GetAdherentName]!"
 feast_tsagaan_sar_events.0003.minor.prestige:0 "Meu povo conhecerá [host.GetFirstNameNoTooltip]."
 feast_tsagaan_sar_events.0003.piety:0 "[host.GetFaith.HighGodName] olhará com grande favor para [host.GetName], mas para isso, devo voltar-me para [host.GetFaith.PositiveAfterLife] e contar a [host.GetFaith.HighGodName] sobre as boas ações de [host.GetFirstNamePossessiveNoTooltip]."
 feast_tsagaan_sar_events.0003.prestige:0 "[host.GetName] é conhecido por seu povo como alguém [host.Custom('ComplimentAdjective')], e desejo espalhar esse sentimento."
 feast_tsagaan_sar_events.0004.a:0 "[artifact_1.GetName] será!"
 feast_tsagaan_sar_events.0004.b:0 "Eu nem precisava de [artifact_2.GetName] mesmo..."
 feast_tsagaan_sar_events.0004.c:0 "[host.GetSheHe|U] pode tirar [artifact_3.GetName] das minhas mãos!"
 feast_tsagaan_sar_events.0004.desc:0 "Felizmente, meu inventário não está vazio, e [host.GetTitledFirstName] poderia encontrar utilidade em um dos meus itens.\n\nA questão é qual deles [host.GetSheHe] apreciaria mais, ou talvez eu escolha aquele que menos me serve..."
 feast_tsagaan_sar_events.0010.a:0 "Traga os presentes!"
 feast_tsagaan_sar_events.0010.a_tt:0 "No total, você recebeu:\n$EFFECT_LIST_BULLET$ [gold_i] #V [GetPlayer.MakeScope.Var('feast_gold_total').GetValue]#! [gold|E]\n$EFFECT_LIST_BULLET$ [herd_i] #V [GetPlayer.MakeScope.Var('feast_herd_total').GetValue]#! [herd|E]\n$EFFECT_LIST_BULLET$ [piety_i] #V [GetPlayer.MakeScope.Var('feast_piety_total').GetValue]#! [piety|E] \n$EFFECT_LIST_BULLET$ [prestige_i] #V [GetPlayer.MakeScope.Var('feast_prestige_total').GetValue]#! [prestige|E]"
 feast_tsagaan_sar_events.0010.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip],\" [gift_collector.GetName] chama. \"É hora de coletar as ofertas dos convidados. Espero que você esteja pronto para recebê-las.\" [gift_collector.GetFirstNameNoTooltip] faz um gesto em direção à entrada da tenda, onde uma fila de convidados está esperando para apresentar seus presentes.\n\nEu aceno em concordância e me preparo para o resto da noite."
 feast_tsagaan_sar_events.0010.t:0 "O Tsagaan Sar"
 feast_tsagaan_sar_events.0100.a:0 "Vou escolher outro presente para [host.GetSheHe]."
 feast_tsagaan_sar_events.0100.b:0 "Acho que posso poupar um pouco mais..."
 feast_tsagaan_sar_events.0100.c:0 "Parece que [host.GetSheHe] ficará sem nada desta vez!"
 feast_tsagaan_sar_events.0100.c_paranoid:0 "Perdido, é? Não acredito nisso."
 feast_tsagaan_sar_events.0100.desc:0 "Um cortesão de [host.GetName], [gift_collector.GetName], se aproxima de mim. \"Olá, [ROOT.Char.Custom('ComplimentAdjective')] [host.GetTitleAsNameNoTooltip]. Ainda não recebemos sua oferenda para [host.GetTitledFirstNameNoTooltip],\" afirma [gift_collector.GetFirstNameNoTooltip]. \"Não me diga que apareceu de mãos vazias!\" [gift_collector.GetSheHe] brinca.\n\n\"Mas o que está dizendo?\" respondo. \"Já entreguei [ROOT.Char.Custom('GetTsagaanSarGiftDesc')], isso não basta para alguém como [host.GetFirstNameNoTooltip]?\" [gift_collector.GetFirstNameNoTooltip] suspira, \"Talvez não tenha sido registrada?\""
 feast_tsagaan_sar_events.0100.t:0 "Presente Mal Entregue"
 feast_tsagaan_sar_events.0101.a:0 "Aceito sua oferta."
 feast_tsagaan_sar_events.0101.b.duel:0 "Você pede a [horse_haver.GetFirstNameNoTooltip] para comprar o cavalo"
 feast_tsagaan_sar_events.0101.b.failure:0 "[horse_haver.GetFirstNameNoTooltip] não quer se desfazer da égua"
 feast_tsagaan_sar_events.0101.b.success:0 "[horse_haver.GetFirstNameNoTooltip] concorda em vender o cavalo para você"
 feast_tsagaan_sar_events.0101.b:0 "Estou interessado em um arranjo mais #EMP permanente#!."
 feast_tsagaan_sar_events.0101.c.duel:0 "Você tenta roubar o cavalo durante o passeio"
 feast_tsagaan_sar_events.0101.c.failure:0 "[horse_haver.GetFirstNameNoTooltip] alcança você"
 feast_tsagaan_sar_events.0101.c.success:0 "Você cavalga para fora da vista de [horse_haver.GetFirstNamePossessiveNoTooltip]"
 feast_tsagaan_sar_events.0101.c:0 "Claro, só um passeio 'rápido'."
 feast_tsagaan_sar_events.0101.desc:0 "Do outro lado do campo, avisto um cavalo magnífico, com pelagem branca como a lua. Ela é uma beleza, rivalizando até com as mais belas donzelas com sua longa e esvoaçante crina e olhos brilhantes como as estrelas.\n\nO cavaleiro, [horse_haver.GetName], nota meu olhar. \"Vejo que você tem bom gosto,\" diz [horse_haver.GetFirstNameNoTooltip]. \"Pode levá-la para um breve passeio, se quiser, mas tome cuidado. Ela é selvagem.\""
 feast_tsagaan_sar_events.0101.t:0 "Uma Égua Gloriosa"
 feast_tsagaan_sar_events.0200.a:0 "Qual é a graça sem risco?"
 feast_tsagaan_sar_events.0200.a_tt:0 "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('medium_gold_value')]#!"
 feast_tsagaan_sar_events.0200.b:0 "Posso apostar um pouco mais que uma quantia pequena."
 feast_tsagaan_sar_events.0200.b_tt:0 "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('minor_gold_value')]#!"
 feast_tsagaan_sar_events.0200.c:0 "Apostarei uma pequena fração da minha riqueza."
 feast_tsagaan_sar_events.0200.c_tt:0 "$ts_wager$#V [GetPlayer.MakeScope.ScriptValue('tiny_gold_value')]#!"
 feast_tsagaan_sar_events.0200.d:0 "Não, mas obrigado."
 feast_tsagaan_sar_events.0200.d_content:0 "Não tenho necessidade de apostar."
 feast_tsagaan_sar_events.0200.desc:0 "\"Saudações, [ROOT.Char.GetFirstNameNoTooltip]!\" chama [gambler.GetName]. \"Vejo que tem um momento livre. Gostaria de se juntar a mim em um jogo de [Glossary( 'Shagai', 'SHAGAI_GLOSS' )]?\" pergunta [gambler.GetSheHe], derramando alguns ossos do tornozelo na mão.\n\n[gambler.GetSheHe|U] senta-se de pernas cruzadas no chão, gesticulando para que eu faça o mesmo. [gambler.GetFirstNameNoTooltip] me relembra as regras, e passamos a jogar os ossos por turnos."
 feast_tsagaan_sar_events.0200.t:0 "Um Jogo de Shagai"
 feast_tsagaan_sar_events.0200_lose:0 "Você perde o jogo"
 feast_tsagaan_sar_events.0200_win:0 "Você vence o jogo"
 feast_tsagaan_sar_events.0210.a:0 "Perguntar a [herder.GetSheHe] como [herder.GetSheHe] mantém um rebanho tão grande."
 feast_tsagaan_sar_events.0210.b:0 "Perguntar sobre métodos inteligentes de pastoreio."
 feast_tsagaan_sar_events.0210.c:0 "Não preciso de conselhos."
 feast_tsagaan_sar_events.0210.desc:0 "Famílias estão reunidas ao redor de fogueiras e mesas, compartilhando comida e histórias. Estou sentado ao lado de um pastor experiente, [herder.GetName]. [herder.GetSheHe|U] se inclina em minha direção, apontando para um grande rebanho de ovelhas à distância. \"Aquelas são minhas,\" diz [herder.GetFirstNameNoTooltip]. \"Um presente para o [ROOT.Char.GetInvolvedActivity.GetHost.GetTitleAsNameNoTooltip] este ano.\"\n\nObservo as ovelhas, admirando sua tranquilidade e a grande quantidade. Talvez eu devesse pedir conselhos a [herder.GetFirstNameNoTooltip] sobre como cuidar do meu próprio rebanho."
 feast_tsagaan_sar_events.0210.t:0 "Sabedoria do Pastor"
 feast_tsagaan_sar_events.0210.tt:0 "Você paga a [herder.GetFirstNameNoTooltip] por conselhos"
 feast_tsagaan_sar_events.0220.a:0 "Concordo, a paz é o melhor caminho."
 feast_tsagaan_sar_events.0220.b:0 "Oh, podemos fazer algo #EMP muito mais#! interessante que isso."
 feast_tsagaan_sar_events.0220.b_flavor:0 "Uma faísca de paixão se acende, oculta pela tensão do passado."
 feast_tsagaan_sar_events.0220.c:0 "Por que não levar a anistia um passo adiante?"
 feast_tsagaan_sar_events.0220.d:0 "Não, acho que não."
 feast_tsagaan_sar_events.0220.d_vengeful:0 "Enquanto você viver, não!"
 feast_tsagaan_sar_events.0220.desc:0 "Dou de cara com [old_rival.GetName], uma criatura [old_rival.Custom2('InsultAdjectiveArticle', ROOT.Char)]. \"Ah... Vejo que está aqui, [ROOT.Char.GetFirstNameNoTooltip]. Espero que não tenha se esquecido do nosso passado, e dos males que me causou.\" [old_rival.GetFirstNameNoTooltip] diz com desdém.\n\nSinto a tensão nas palavras [old_rival.GetHerHim], mas [old_rival.GetSheHe] continua calmamente: \"À luz do novo ano, peço que deixemos nossas desavenças para trás.\""
 feast_tsagaan_sar_events.0220.t:0 "O Reencontro com um Rival"
 feast_tsagaan_sar_events.0220_lose:0 "[old_rival.GetSheHe|U] se afasta de você"
 feast_tsagaan_sar_events.0220_win:0 "[old_rival.GetSheHe|U] retribui seus sentimentos"
 feast_tsagaan_sar_events.0230.a:0 "[throat_singer.GetFirstNameNoTooltip] é realmente talentos[Select_CString( throat_singer.IsFemale, 'a', 'o' )]."
 feast_tsagaan_sar_events.0230.b:0 "[throat_singer.GetSheHe|U] poderia melhorar..."
 feast_tsagaan_sar_events.0230.b_tt:0 "Você vaia a apresentação de [throat_singer.GetFirstNamePossessiveNoTooltip], causando constrangimento [throat_singer.GetSheHe]"
 feast_tsagaan_sar_events.0230.c:0 "Talvez eu cante junto com [throat_singer.GetSheHe]."
 feast_tsagaan_sar_events.0230.d.duel:0 "Você tenta imitar o estilo [throat_singer.GetHerHim]"
 feast_tsagaan_sar_events.0230.d.failure:0 "Sua tentativa falha, mas você aprende um pouco mesmo assim"
 feast_tsagaan_sar_events.0230.d.success:0 "Sua tentativa é bem-sucedida"
 feast_tsagaan_sar_events.0230.d:0 "Ah, eu também quero cantar em [throat_singer.Custom('GetThroatSingingStyle')|U]!"
 feast_tsagaan_sar_events.0230.d_tt:0 "Você aprende o estilo de canto gutural [throat_singer.Custom('GetThroatSingingStyle')|U]"
 feast_tsagaan_sar_events.0230.desc_hoomei:0 "um zumbido que cresce como uma tempestade ou segue a corrente deixada por um pássaro em voo."
 feast_tsagaan_sar_events.0230.desc_intro:0 "Uma multidão de convidados se dirige a uma tenda ao longe, comentando sobre uma apresentação. Sigo a comoção e vejo todos os olhos se voltarem para [throat_singer.GetName]. [throat_singer.GetSheHe|U] começa a cantar, entoando sobre [throat_singer.Custom('GetRandomThroatSingingTheme')].\n\nO som se assemelha a"
 feast_tsagaan_sar_events.0230.desc_kargyraa:0 "um rosnado profundo e gutural, como o estrondo de uma tempestade ou o rugido de um urso."
 feast_tsagaan_sar_events.0230.desc_outro:0 "[observer.GetName] se vira para mim e sussurra: \"Seu [throat_singer.Custom('GetThroatSingingStyle')] é bastante impressionante, não acha?\"\n\nObservo enquanto [throat_singer.GetSheHe] termina a primeira canção, e a multidão aplaude."
 feast_tsagaan_sar_events.0230.desc_sygyt:0 "um assobio agudo e claro, como o vento soprando entre as árvores."
 feast_tsagaan_sar_events.0230.t:0 "Voz da Lua"
 feast_tsagaan_sar_events.0240.a:0 "Então considere como um presente."
 feast_tsagaan_sar_events.0240.d:0 "Não sou muito bom em me apresentar."
 feast_tsagaan_sar_events.0240.d_shy:0 "Eu não devia ter falado nada."
 feast_tsagaan_sar_events.0240.desc:0 "Aproveitando uma noite de bebidas e risadas com m[Select_CString( audience.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('audience'))], [audience.GetFirstName], [audience.GetSheHe] menciona o canto gutural. Comento brevemente minha experiência, e [audience.GetSheHe] sorri animadamente.\n\n\"Você sabe cantar em [ROOT.Char.Custom('GetThroatSingingStyle')]?\" pergunta [audience.GetFirstNameNoTooltip]. \"Eu adoraria ouvir uma música!\""
 feast_tsagaan_sar_events.0240.duel:0 "Você se apresenta para [audience.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0240.duel_new:0 "Você se apresenta para [audience.GetFirstNameNoTooltip], em um novo estilo"
 feast_tsagaan_sar_events.0240.hoomei:0 "Que tal uma melodia em [Glossary( 'hoomei', 'HOOMEI_GLOSS' )]?"
 feast_tsagaan_sar_events.0240.kargyraa:0 "Na verdade, gostaria de cantar em [Glossary( 'kargyraa', 'KARGYRAA_GLOSS' )]."
 feast_tsagaan_sar_events.0240.ok:0 "Sua apresentação impressiona um pouco [audience.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0240.success:0 "[audience.GetSheHe|U] fica encantad[Select_CString( audience.IsFemale, 'a', 'o' )] com seu talento"
 feast_tsagaan_sar_events.0240.success_hoomei_tt:0 "Você esquece seu estilo anterior e aprende o estilo de canto gutural hoomei"
 feast_tsagaan_sar_events.0240.success_kargyraa_tt:0 "Você esquece seu estilo anterior e aprende o estilo de canto gutural kargyraa"
 feast_tsagaan_sar_events.0240.success_sygyt_tt:0 "Você esquece seu estilo anterior e aprende o estilo de canto gutural sygyt"
 feast_tsagaan_sar_events.0240.sygyt:0 "Estava pensando em tentar uma canção em [Glossary( 'sygyt', 'SYGYT_GLOSS' )]..."
 feast_tsagaan_sar_events.0240.t:0 "Um Presente em Forma de Canção"
 feast_tsagaan_sar_events.0250.a:0 "[horse_rider_1.GetFirstNameNoTooltip] vai vencer!"
 feast_tsagaan_sar_events.0250.a_tt:0 "Você aposta que [horse_rider_1.GetFirstNameNoTooltip] vencerá a corrida"
 feast_tsagaan_sar_events.0250.after_tt:0 "A corrida começa..."
 feast_tsagaan_sar_events.0250.b:0 "[horse_rider_2.GetFirstNameNoTooltip] parece um[Select_CString( horse_rider_2.IsFemale, 'a', '' )] forte competidor[Select_CString( horse_rider_2.IsFemale, 'a', '' )]."
 feast_tsagaan_sar_events.0250.b_tt:0 "Você aposta que [horse_rider_2.GetFirstNameNoTooltip] vencerá a corrida"
 feast_tsagaan_sar_events.0250.c:0 "Eu posso vencer vocês dois!"
 feast_tsagaan_sar_events.0250.c_tt:0 "Você entra na corrida"
 feast_tsagaan_sar_events.0250.d:0 "Vou apenas assistir."
 feast_tsagaan_sar_events.0250.desc:0 "Um pastor traz um grupo de cavalos, com seus pelos brilhando ao luar. Os convidados se reúnem ao redor, admirando os animais. [horse_rider_1.GetName] corre empolgado para montar um cavalo, com [horse_rider_2.GetName] logo atrás.\n\n\"É você contra mim, [horse_rider_1.GetFirstNameNoTooltip]!\" grita [horse_rider_2.GetFirstNameNoTooltip]. [horse_rider_1.GetFirstNameNoTooltip] ri em resposta. \"Não sejamos apressados, [horse_rider_2.GetFirstNameNoTooltip]. Precisamos guardar energia para a corrida!\"\n\n[horse_rider_2.GetFirstNameNoTooltip] concorda com a cabeça. \"Alguém mais quer se juntar a nós? Ou talvez fazer uma aposta?\" pergunta [horse_rider_2.GetSheHe|U]."
 feast_tsagaan_sar_events.0250.t:0 "Os Cavaleiros de [ROOT.Char.GetInvolvedActivity.GetCurrentPhase.GetLocation.GetName]"
 feast_tsagaan_sar_events.0251.a:0 "Que cavaleiros impressionantes!"
 feast_tsagaan_sar_events.0251.after_tt:0 "A corrida continua..."
 feast_tsagaan_sar_events.0251.b.duel:0 "Você tenta derrubar [horse_rider_1.GetFirstNameNoTooltip] do cavalo"
 feast_tsagaan_sar_events.0251.b:0 "Um empurrãozinho em [horse_rider_1.GetFirstNameNoTooltip] deve resolver."
 feast_tsagaan_sar_events.0251.b_tt:0 "#p [horse_rider_1.GetFirstNameNoTooltip] está fora da corrida#!"
 feast_tsagaan_sar_events.0251.c.duel:0 "Você tenta derrubar [horse_rider_2.GetFirstNameNoTooltip] do cavalo"
 feast_tsagaan_sar_events.0251.c:0 "[horse_rider_2.GetFirstNameNoTooltip] parece perigoso..."
 feast_tsagaan_sar_events.0251.c_tt:0 "#p [horse_rider_2.GetFirstNameNoTooltip] está fora da corrida#!"
 feast_tsagaan_sar_events.0251.d.knocked_out_1:0 "[horse_rider_1.GetFirstNameNoTooltip] não consegue acompanhar"
 feast_tsagaan_sar_events.0251.d.knocked_out_2:0 "[horse_rider_2.GetFirstNameNoTooltip] fica para trás"
 feast_tsagaan_sar_events.0251.d.knocked_out_3:0 "Seu ritmo está muito lento"
 feast_tsagaan_sar_events.0251.d:0 "Vou manter meu ritmo."
 feast_tsagaan_sar_events.0251.d_title:0 "Alguém está fora da corrida!"
 feast_tsagaan_sar_events.0251.desc_intro:0 "Os cavaleiros estão prontos, e a multidão está ansiosa para ver o resultado. [horse_rider_1.GetName] e [horse_rider_2.GetName] estão preparados, e os outros convidados prontos para assistir."
 feast_tsagaan_sar_events.0251.desc_race:0 "Enquanto monto meu cavalo, [horse_rider_1.GetFirstNameNoTooltip] e [horse_rider_2.GetFirstNameNoTooltip] me lançam um olhar de lado. \"Você vai correr com a gente?\" pergunta [horse_rider_1.GetFirstNameNoTooltip]. \"Sim,\" respondo, e partimos, galopando pela [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')].\n\nCavalgamos em um ritmo constante, e rapidamente penso em como posso levar vantagem."
 feast_tsagaan_sar_events.0251.desc_watch:0 "Monto em um cavalo próximo e troto lentamente até uma colina, garantindo uma visão melhor do trajeto da corrida. Eles partem, e os convidados vibram enquanto galopam pela [ROOT.Char.GetCurrentLocation.Custom('GetTerrainType')]."
 feast_tsagaan_sar_events.0251.failure:0 "Você falha em atrapalhar o cavaleiro"
 feast_tsagaan_sar_events.0251.lose:0 "#n Você está fora da corrida#!"
 feast_tsagaan_sar_events.0251.success:0 "Você sabota o cavaleiro com sucesso"
 feast_tsagaan_sar_events.0252.a.duel:0 "Você tenta superar [final_opponent.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0252.a:0 "Com certeza [final_opponent.GetFirstNameNoTooltip] não se importará se eu vencer..."
 feast_tsagaan_sar_events.0252.after_tt:0 "A corrida chega ao fim"
 feast_tsagaan_sar_events.0252.b:0 "Vamos ver como isso termina..."
 feast_tsagaan_sar_events.0252.c:0 "Só mais um esforço!"
 feast_tsagaan_sar_events.0252.desc_knocked:0 "Observo os dois cavaleiros passarem por mim, e não consigo deixar de sentir um pouco de inveja. Eu é que deveria ter vencido, mas não consegui acompanhar a velocidade deles."
 feast_tsagaan_sar_events.0252.desc_knocked_1:0 "Olho para trás e vejo [horse_rider_1.GetFirstNameNoTooltip] cair no chão, restando apenas [horse_rider_2.GetFirstNameNoTooltip]. Estamos lado a lado, e os convidados vibram de empolgação."
 feast_tsagaan_sar_events.0252.desc_knocked_2:0 "Olho para trás e vejo [horse_rider_2.GetFirstNameNoTooltip] cair no chão, restando apenas [horse_rider_1.GetFirstNameNoTooltip]. Estamos lado a lado, e os convidados vibram de empolgação."
 feast_tsagaan_sar_events.0252.desc_watch:0 "[horse_rider_1.GetFirstNameNoTooltip] e [horse_rider_2.GetFirstNameNoTooltip] estão lado a lado, e o público está à beira de seus assentos. Os cavaleiros estão perto da linha de chegada, e os convidados os incentivam com entusiasmo."
 feast_tsagaan_sar_events.0252.failure:0 "[final_opponent.GetFirstNameNoTooltip] percebe seu plano"
 feast_tsagaan_sar_events.0252.success:0 "Você engana [final_opponent.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0253.a:0 "Que espetáculo!"
 feast_tsagaan_sar_events.0253.b:0 "Impressionante, [rider_winner.GetFirstNameNoTooltip]."
 feast_tsagaan_sar_events.0253.bet_tt:0 "Você ganhou sua aposta"
 feast_tsagaan_sar_events.0253.c:0 "Eu mereço uma vitória na próxima vez."
 feast_tsagaan_sar_events.0253.d:0 "Eu poderia usar um cavaleiro como você, [rider_winner.GetFirstNameNoTooltip]."
 feast_tsagaan_sar_events.0253.desc_lost:0 "[rider_winner.GetName] vira rapidamente seu cavalo, e eu fico para trás. Observo enquanto [rider_winner.GetSheHe] cruza a linha de chegada, e a multidão explode em excitação."
 feast_tsagaan_sar_events.0253.desc_watch:0 "[horse_rider_1.GetName] e [horse_rider_2.GetName] aceleram lentamente, e o vencedor ainda é incerto. De repente, [rider_winner.GetFirstNameNoTooltip] dispara à frente e cruza a linha de chegada primeiro. A multidão explode em excitação."
 feast_tsagaan_sar_events.0253.desc_won:0 "Faço um esforço final, e meu cavalo dispara à frente de [rider_winner.GetName]. Cruzo a linha de chegada, e a multidão explode em excitação."
 feast_tsagaan_sar_events.0253.winner:0 "Eu sou o melhor!"
 feast_tsagaan_sar_events.0260.a:0 "Elogie [drip_haver.GetSheHe] pelas suas vestimentas."
 feast_tsagaan_sar_events.0260.b:0 "Tome seu caminho."
 feast_tsagaan_sar_events.0260.b_shy:0 "Saia de maneira estranha."
 feast_tsagaan_sar_events.0260.desc:0 "Avisto [drip_haver.GetName] de longe, e fico olhando para suas vestimentas eloquentes. [drip_haver.GetSheHe|U] está adornado com um lindo [Glossary( 'deel', 'DEEL_GLOSS' )] branco de seda, decorado com penas suaves.\n\n[drip_haver.GetFirstNameNoTooltip] se aproxima de mim e [drip_haver.GetSheHe] sorri bêbad[Select_CString( drip_haver.IsFemale, 'a', 'o' )]. \"Ah, [ROOT.Char.GetFirstNameNoTooltip]! Espero que você tenha paz em seu coração esta noite.\" Aceno com a cabeça em concordância e penso no que dizer a seguir."
 feast_tsagaan_sar_events.0260.t:0 "Grande Conjunto de [drip_haver.GetFirstNamePossessiveNoTooltip]"
 feast_tsagaan_sar_events.0270.a:0 "Você está feito, [drinker.GetFirstNameNoTooltip]!"
 feast_tsagaan_sar_events.0270.b:0 "Já bebi o suficiente por hoje."
 feast_tsagaan_sar_events.0270.b_paranoid:0 "Espere... o que você acabou de me dar?"
 feast_tsagaan_sar_events.0270.desc:0 "[drinker.GetName] se aproxima de mim, um copo de [Glossary( 'airag', 'AIRAG_GLOSS' )] na mão. [drinker.GetSheHe|U] sorri e ergue o copo em um brinde. \"A você, [ROOT.Char.GetFirstNameNoTooltip]!\" exclama [drinker.GetFirstNameNoTooltip].\n\nEu pego o copo e o ergo até os lábios. O airag é forte, e sinto seus efeitos quase imediatamente. \"Aposto que consigo beber mais que você,\" desafia [drinker.GetFirstNameNoTooltip]."
 feast_tsagaan_sar_events.0270.lose:0 "[drinker.GetFirstNameNoTooltip] te supera"
 feast_tsagaan_sar_events.0270.t:0 "Desafio da Taça"
 feast_tsagaan_sar_events.0270.win:0 "Você bebe muito mais que [drinker.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0270.win_price:0 "Você bebe mais que [drinker.GetFirstNameNoTooltip], mas com um preço"
 feast_tsagaan_sar_events.0280.a:0 "Conte-me sobre minha família."
 feast_tsagaan_sar_events.0280.a_grow:0 "[elder.GetSheHe|U] sugere que você cresça sua família"
 feast_tsagaan_sar_events.0280.a_strength:0 "[elder.GetSheHe|U] sugere que você fortaleça os laços da sua família"
 feast_tsagaan_sar_events.0280.b:0 "Conte-me sobre a guerra."
 feast_tsagaan_sar_events.0280.b_attack:0 "[elder.GetSheHe|U] sugere que você foque em conquistar seus inimigos"
 feast_tsagaan_sar_events.0280.b_defense:0 "[elder.GetSheHe|U] sugere que você foque em defender sua terra"
 feast_tsagaan_sar_events.0280.c:0 "Conte-me sobre o meu rebanho."
 feast_tsagaan_sar_events.0280.c_migrate:0 "[elder.GetSheHe|U] sugere que você migre seu rebanho"
 feast_tsagaan_sar_events.0280.c_tend:0 "[elder.GetSheHe|U] sugere que você cuide do seu rebanho"
 feast_tsagaan_sar_events.0280.d:0 "Eu simplesmente desejo aproveitar sua companhia."
 feast_tsagaan_sar_events.0280.desc:0 "Em um momento de tranquilidade, avisto [elder.GetName] sentad[Select_CString( elder.IsFemale, 'a', 'o' )] sozinh[Select_CString( elder.IsFemale, 'a', 'o' )], perdid[Select_CString( elder.IsFemale, 'a', 'o' )] em pensamentos. Toquei suavemente no ombro [elder.GetHerHim] para ver se [elder.GetSheHe] ainda está acordad[Select_CString( elder.IsFemale, 'a', 'o' )], e [elder.GetSheHe] se assusta, levantando-se rapidamente.\n\n\"Ah, [ROOT.Char.GetFirstNameNoTooltip],\" [elder.GetFirstNameNoTooltip] ri. \"Peço desculpas. Já estive em muitas dessas celebrações, e ainda assim, acabo enchendo demais meu copo. Espero que você esteja aproveitando a noite.\" Faço uma reverência adequada, me sento ao lado [elder.GetHerHim], e compartilhamos um momento de silêncio. [elder.GetSheHe|U] agarra minha mão e começa a falar.\n\n\"Vejo que você é uma pessoa de grande potencial, [ROOT.Char.GetFirstNameNoTooltip]. Pergunte-me como lidar com qualquer assunto, e eu responderei da melhor forma possível.\""
 feast_tsagaan_sar_events.0280.t:0 "A Sabedoria do Ancião"
 feast_tsagaan_sar_events.0290.a:0 "Ao [ROOT.Char.Custom('GetLunarNewYearAnimal')]!"
 feast_tsagaan_sar_events.0290.b:0 "Uau, [wise_guy.GetFirstNameNoTooltip] é muito sábio."
 feast_tsagaan_sar_events.0290.desc:0 "A noite tem sido longa, com risos e o som de copos se chocando no ar. [wise_guy.GetName] se reúne ao redor da tenda para fazer um brinde. \"Irmãos e irmãs!\" [wise_guy.GetSheHe|U] grita.\n\n\"À medida que a lua nova nasce, reverenciamos o poder do [ROOT.Char.Custom('GetLunarNewYearAnimal')], e as bênçãos que ele traz. Que possamos [ROOT.Char.Custom('GetLunarNewYearAnimalToastDesc')].\" [wise_guy.GetFirstNameNoTooltip] levanta seu copo, e os convidados fazem o mesmo, aplaudindo em uníssono."
 feast_tsagaan_sar_events.0290.t:0 "Ano do [ROOT.Char.Custom('GetLunarNewYearAnimal')|U]"
 feast_tsagaan_sar_events.0300.a:0 "Obrigado pelo seu trabalho árduo, [cleaner.GetFirstNameNoTooltip]."
 feast_tsagaan_sar_events.0300.a_tt:0 "Você demonstra sua gratidão a [cleaner.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0300.b:0 "Ops, parece que você deixou um local sujo."
 feast_tsagaan_sar_events.0300.b_tt:0 "Você faz uma bagunça propositalmente para [cleaner.GetFirstNameNoTooltip] limpar"
 feast_tsagaan_sar_events.0300.c:0 "Ah, isso é bom."
 feast_tsagaan_sar_events.0300.desc:0 "A noite está chegando ao fim, e me encontro em um canto tranquilo da tenda. [cleaner.GetName] canta suavemente enquanto [cleaner.GetSheHe] apressa-se para arrumar o local, pegando cada pedaço e migalha que ficou para trás. Embora meus convidados possam se divertir sem a necessidade de trabalhar, [cleaner.GetFirstNameNoTooltip] se incumbiu de limpar após eles, mantendo o espaço fresco para o ano novo."
 feast_tsagaan_sar_events.0300.t:0 "Uma Mão Amiga"
 feast_tsagaan_sar_events.0310.a:0 "Você não tem lugar na minha casa."
 feast_tsagaan_sar_events.0310.b.duel:0 "Você tenta pegar um presente de [bragger.GetFirstNameNoTooltip]"
 feast_tsagaan_sar_events.0310.b.failure:0 "[bragger.GetFirstNameNoTooltip] se recusa a te dar um presente"
 feast_tsagaan_sar_events.0310.b.success:0 "[bragger.GetFirstNameNoTooltip] cede e escolhe um presente"
 feast_tsagaan_sar_events.0310.b:0 "É necessário um presente para ficar."
 feast_tsagaan_sar_events.0310.c:0 "Vou ignorar as palavras [bragger.GetHerHim] desta vez."
 feast_tsagaan_sar_events.0310.desc:0 "\"Um presente para [ROOT.Char.GetFirstName]? Ha! Eu prefiro ser devorado vivo por corvos,\" [bragger.GetName] se gaba para [bragger_friend.GetName]. \"Shh!\" [bragger_friend.GetFirstNameNoTooltip] sibilou, olhando em minha direção. \"Você nunca sabe quem pode estar ouvindo.\"\n\nMas o pedido de [bragger_friend.GetFirstNamePossessiveNoTooltip] foi tarde demais, e já ouvi o suficiente das palavras ousadas [bragger.GetHerHim] para saber que [bragger.GetFirstNameNoTooltip] não me presenteou com um presente neste ano."
 feast_tsagaan_sar_events.0310.t:0 "Confissões Impulsivas"
 feast_tsagaan_sar_events.0320.a:0 "Derrame presentes sobre eles!"
 feast_tsagaan_sar_events.0320.a_tt:0 "Cada [activity_guest|E] com mais de #V 50#!:\n$EFFECT_LIST_BULLET$Ganha #p 10#! [opinion|E] de #V você#!"
 feast_tsagaan_sar_events.0320.b:0 "Eles já foram o suficiente honrados."
 feast_tsagaan_sar_events.0320.desc:0 "Com o passar do tempo, a sabedoria cresce. Existem aqueles que sobreviveram a muitas luas, transmitindo suas histórias de conquistas e lições de vida. Seus corpos são frágeis, seus sentidos estão diminuindo, mas suas mentes estão afiadas, e suas palavras têm significado.\n\nÀ medida que o tempo deles na terra diminui, não custa mostrar um pouco de respeito com uma oferta."
 feast_tsagaan_sar_events.0320.t:0 "Honrando os Anciãos"
 feast_type_tsagaan_sar:0 "Tsagaan Sar"
 feast_type_tsagaan_sar_desc:0 "$EFFECT_LIST_BULLET$ O Brinde Final é uma ocasião para receber presentes, como [herd|E] e [gold|E]\n$EFFECT_LIST_BULLET$ Eventos proporcionarão oportunidades de ganhar [opinion|E]\n$EFFECT_LIST_BULLET$ Algumas opções permitirão perda de [stress|E]\n\n#weak Uma nova Lua Branca nasce – e nós celebramos!#!"
 feast_type_tsagaan_sar_valid_tt:0 "Você organizou uma [GetActivityType('activity_feast').GetName] Tsagaan Sar nos últimos 5 anos"
 feast_type_tsagaan_sar_valid_tt_time:0 "Um Tsagaan Sar só pode ser organizado de janeiro a março"
 friend_feast_rivalry:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] tornaram-se amigos após deixarem a rivalidade de lado durante um banquete."
 friend_played_party_games:0 "[CHARACTER.GetShortUIName|U] criou laços com [TARGET_CHARACTER.GetShortUIName] jogando jogos de aposta."
 friend_played_party_games_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] criou laços com [CHARACTER.GetShortUIName] jogando jogos de aposta."
 friend_throat_singing:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] criaram laços durante uma apresentação de canto gutural."
 friend_tsagaan_sar_compliment:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] se tornaram amigos depois que [CHARACTER.GetShortUIName|U] elogiou as vestimentas de [TARGET_CHARACTER.GetShortUINamePossessive|U]."
 gift_astrologer_prayer:0 "palavras para meu astrólogo orar por [ROOT.Char.GetInvolvedActivity.GetHost.GetSheHe]"
