 gift_some_flock:0 "parte do meu rebanho"
 gift_word:0 "esforço para espalhar o legado [ROOT.Char.GetInvolvedActivity.GetHost.GetHerHim]"
 lunar_new_year_animal_dog:0 "cachorro"
 lunar_new_year_animal_dog_desc:0 "seja amigo e amante de todos, e proteja aqueles que amamos"
 lunar_new_year_animal_dragon:0 "dragão"
 lunar_new_year_animal_dragon_desc:0 "construa nossa força, e tome decisões bem fundamentadas"
 lunar_new_year_animal_horse:0 "cavalo"
 lunar_new_year_animal_horse_desc:0 "esteja aberto a percorrer qualquer reino, assim como o cavalo está a qualquer cavaleiro"
 lunar_new_year_animal_monkey:0 "macaco"
 lunar_new_year_animal_monkey_desc:0 "seja tão astuto quanto ele, e tão rápido para se adaptar"
 lunar_new_year_animal_ox:0 "búfalo"
 lunar_new_year_animal_ox_desc:0 "mantenha-se quente e paciente, e administre nossas riquezas com sabedoria"
 lunar_new_year_animal_pig:0 "porco"
 lunar_new_year_animal_pig_desc:0 "viva uma vida disciplinada, e aproveite os frutos do nosso trabalho"
 lunar_new_year_animal_rabbit:0 "coelho"
 lunar_new_year_animal_rabbit_desc:0 "comunique-se com os outros, e ajude a manter uma paz duradoura"
 lunar_new_year_animal_rat:0 "rato"
 lunar_new_year_animal_rat_desc:0 "seja perspicaz e engenhoso, e sempre encontre uma maneira de sobreviver"
 lunar_new_year_animal_rooster:0 "galo"
 lunar_new_year_animal_rooster_desc:0 "mantenha a cabeça erguida, e persista como ele faz"
 lunar_new_year_animal_sheep:0 "ovelha"
 lunar_new_year_animal_sheep_desc:0 "suavize seu coração como a lã de uma ovelha, e cuide do seu rebanho"
 lunar_new_year_animal_snake:0 "cobra"
 lunar_new_year_animal_snake_desc:0 "mantenha a calma diante do perigo, e seja respeitado por aqueles que lideramos"
 lunar_new_year_animal_tiger:0 "tigre"
 lunar_new_year_animal_tiger_desc:0 "torne-se ousado e feroz, enquanto mantém nossa vitalidade"
 mpo_appreciate_fashion_modifier:0 "Apreciando Coisas Finas"
 mpo_appreciate_fashion_modifier_desc:0 "Este personagem ficou impressionado com a moda de outro e tem incorporado isso em sua própria corte."
 mpo_big_herd_modifier:0 "Rebanho em Crescimento"
 mpo_big_herd_modifier_desc:0 "Este rebanho está sendo cuidado por um pastor habilidoso e está crescendo em tamanho."
 mpo_efficent_herd_modifier:0 "Pastoreio Eficiente"
 mpo_efficent_herd_modifier_desc:0 "Este personagem aprendeu métodos eficientes de pastoreio com um pastor habilidoso."
 mpo_elder_family_grow_modifier:0 "Conselho do Ancião: Crescimento"
 mpo_elder_family_grow_modifier_desc:0 "Este personagem foi aconselhado por um ancião a expandir sua família."
 mpo_elder_family_strength_modifier:0 "Conselho do Ancião: Força"
 mpo_elder_family_strength_modifier_desc:0 "Este personagem foi aconselhado por um ancião a fortalecer os laços familiares."
 mpo_elder_flock_migrate_modifier:0 "Conselho do Ancião: Migração"
 mpo_elder_flock_migrate_modifier_desc:0 "Este personagem foi aconselhado por um ancião a migrar seu rebanho.\n\nAceitação da Migração: #p +5#!"
 mpo_elder_flock_tend_modifier:0 "Conselho do Ancião: Cuidar"
