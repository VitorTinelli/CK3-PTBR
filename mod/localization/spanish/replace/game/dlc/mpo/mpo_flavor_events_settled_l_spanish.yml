l_spanish:
 mpo_flavor_events_settled.0001.a:0 "\"Deixe-os vir!\""
 mpo_flavor_events_settled.0001.aa:0 "\"Saia daqui!\""
 mpo_flavor_events_settled.0001.b:0 "\"Precisamos nos preparar para esses nômades.\""
 mpo_flavor_events_settled.0001.c:0 "\"Você pode descansar agora.\""
 mpo_flavor_events_settled.0001.desc:0 "O vento frio corta minhas bochechas como estilhaços de vidro. O tempo tem estado incomumente frio ultimamente.\n\nO relinchar de um cavalo chama minha atenção justo quando me viro para voltar para dentro. Seu cavaleiro mal consegue segurar as rédeas.\n\n\"Ajuda...\" [nomad.GetSheHe] murmura, prestes a desabar. \"O grande inverno chegou. Meu povo morre, tentando fugir da estepe.\""
 mpo_flavor_events_settled.0001.t:0 "A Tempestade Se Aproxima"
 mpo_flavor_events_settled.0001.tt:0 "@alert_icon! #alert_trial [nomads|E] podem tentar tomar nossas terras#!"
 mpo_flavor_events_settled.0010.a:0 "\"Por favor, aceite meu tributo.\""
 mpo_flavor_events_settled.0010.b:0 "\"Tenho certeza de que podemos chegar a um entendimento.\""
 mpo_flavor_events_settled.0010.b_perk_tt:0 "Seu [perk|E] [GetPerk('defensive_measures_perk').GetName( GetNullCharacter )] permite que você negocie um preço melhor"
 mpo_flavor_events_settled.0010.c:0 "#EMP Cuspa no chão.#!"
 mpo_flavor_events_settled.0010.d:0 "\"Envie meus respeitos [Select_CString( nomad_lord.IsFemale, 'a sua', 'ao seu' )] [nomad_lord.GetLadyLord].\""
 mpo_flavor_events_settled.0010.desc:0 "#Emp \"Ksk! Ksk!\"#! Um[Select_CString( nomad.IsFemale, 'a', '' )] [nomad.GetWomanMan] estranh[Select_CString( nomad.IsFemale, 'a', 'o' )] bate na lateral de seu cavalo para acalmá-lo, depois avança em minha direção.\n\n\"Saudações, honrad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], sou um enviado do grande [nomad_lord.GetTitledFirstName]. M[Select_CString( nomad_lord.IsFemale, 'inha', 'eu' )] [nomad_lord.GetLadyLord] me enviou para propor uma trégua entre nossos povos.\""
 mpo_flavor_events_settled.0010.t:0 "O Senhor dos Cavalos"
 mpo_settled_preparations_building_county_modifier:0 "Preparativos para a Terra"
 mpo_settled_preparations_building_county_modifier_desc:0 "Este personagem está se preparando para uma iminente invasão nômade, garantindo que seus condados estejam prontos."
 mpo_settled_preparations_war_county_modifier:0 "Preparativos para Guerra"
 mpo_settled_preparations_war_county_modifier_desc:0 "Este personagem está se preparando para uma iminente invasão nômade, reforçando seus exércitos."
