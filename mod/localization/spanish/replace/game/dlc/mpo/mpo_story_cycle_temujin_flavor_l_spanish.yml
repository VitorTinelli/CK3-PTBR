l_spanish:
 TEMUJIN_JAMUKHA_MURDER_BONUS:0 "Você jurou assassinar [target.GetShortUIName]: $VALUE|+0=$"
 birth.1003.c.borte:0 "Não, [child.GetFirstName] não é meu [child.Custom('GetDaughterSon')]!"
 birth.1003.desc.borte:0 "\n\nNo entanto, a honestidade de [mother.EPossessiveNoTooltip] é admirável, e isso não deve me distrair do que está à minha frente."
 birth.1003.desc.empty:0 ""
 every_non_brave_compassionate_courtier:0 "Cada [courtier|E] que não for [GetTrait('brave').GetName( GetNullCharacter )] ou [GetTrait('compassionate').GetName( GetNullCharacter )]"
 mpo_temujin_flavor.0001.a:0 "\"Estarei com você até meus olhos ficarem brancos.\""
 mpo_temujin_flavor.0001.b:0 "\"O lobo não precisa da ovelha.\""
 mpo_temujin_flavor.0001.desc:0 "A noite escurece. Só restam [jamukha.GetTitledFirstName] e eu no acampamento.\n\n\"[ROOT.Char.GetFirstNameNoTooltip],\" [jamukha.GetFirstNameNoTooltip] aponta para mim com sua faca. \"Nos dias de guerra, lutei ao seu lado para trazer de volta sua esposa. Nos dias de paz, ouvirei seu conselho, trocarei presentes com você e o seguirei até meus pés não me servirem mais.\"\n\nA faca toca sua palma e corta uma ferida profunda: \"Que o sangue jure o que a língua não pode.\""
 mpo_temujin_flavor.0001.t:0 "Abandonado, Nunca Mais"
 mpo_temujin_flavor.0010.a.tt.failure:0 "Ninguém parece se importar"
 mpo_temujin_flavor.0010.a.tt.success:0 "[jamukha.GetShortUIName] é zombado"
 mpo_temujin_flavor.0010.a:0 "\"Você está forçando seu povo a comer terra.\""
 mpo_temujin_flavor.0010.aa:0 "\"Vá, então! Se esconda como a minhoca que você é.\""
 mpo_temujin_flavor.0010.aa_remove_blood_brother:0 "Você deixa de ser [blood_brothers|E] com [jamukha.GetShortUIName]"
 mpo_temujin_flavor.0010.b:0 "\"#EMP Fique.#!"
 mpo_temujin_flavor.0010.c:0 "\"Você fez sua escolha.\""
 mpo_temujin_flavor.0010.desc.blood_brothers:0 "\"Foi diante desta mesma fogueira que juramos um voto que pretendo cumprir. Mas meu povo exige liberdade.\""
 mpo_temujin_flavor.0010.desc.fallback:0 "\"Meu povo só quer a mesma liberdade que o seu povo.\""
 mpo_temujin_flavor.0010.desc.intro:0 "\"Chegou a hora, [ROOT.GetCharacter.Custom('GetMongolHonorific')] [ROOT.Char.GetFirstNameNoTooltip],\" [jamukha.GetFirstName] senta-se à frente da fogueira. \"Sob sua justa liderança, floresci, mas a semente não cresce à sombra da árvore.\"\n\nEle se levanta."
 mpo_temujin_flavor.0010.desc.rejected:0 "\"Você me rejeitou uma vez. Espero que entenda.\""
 mpo_temujin_flavor.0010.t:0 "Adeus"
 mpo_temujin_flavor.0020.a:0 "\"Você, quem eu chamei de irmão uma vez...\""
 mpo_temujin_flavor.0020.a_war_win:0 "Vencer uma [war|E] #high ofensiva#! contra [jamukha.GetShortUIName] concederá bônus adicionais de @legitimacy_icon![legitimacy|E] e @prestige_icon![prestige|E]"
 mpo_temujin_flavor.0020.b:0 "\"Minha faca encontrará seu pescoço.\""
 mpo_temujin_flavor.0020.b_murder:0 "Você ganha um bônus #P #EMP maciço#!#! para [schemes|E] de [GetScheme('murder').GetTypeName] direcionado a [jamukha.GetShortUIName]"
 mpo_temujin_flavor.0020.c:0 "\"Você vai se arrepender disso!\""
 mpo_temujin_flavor.0020.cb.tt:0 "[temujin.GetShortUIName] e [jamukha.GetShortUIName] recebem [casus_bellis|E] #high $retaliation_cb$#! um contra o outro"
 mpo_temujin_flavor.0020.desc.blood_brothers:0 "Pelo sangue que derramamos juntos."
 mpo_temujin_flavor.0020.desc.fallback:0 "Uma deferência que eu mostraria [Select_CString( ROOT.Char.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom('FormOfAddressForLiege')] anterior."
 mpo_temujin_flavor.0020.desc.friend:0 "Pela amizade que compartilhamos."
 mpo_temujin_flavor.0020.desc.intro:0 "\"[ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetFirstNameNoTooltip]!\" Uma voz familiar me acorda no meio da noite. \"Sinto muito, mas chegamos a isso,\" [jamukha.GetFirstName] está montado em seu cavalo, bem na porta da minha tenda.\n\n\"Estou aqui para te avisar."
 mpo_temujin_flavor.0020.desc.outro:0 "\n\n\"A partir deste momento, irei te caçar e te destruir. Cortarei as águas profundas e corroerei a pedra brilhante. Não há nada que eu não faça para te acabar — pois sou eu quem nasceu para liderar todos os Mongóis — #EMP não você!#!"
 mpo_temujin_flavor.0020.desc.rival:0 "Uma deferência que eu mostraria a um rival digno."
 mpo_temujin_flavor.0020.jamukha_gok_requirement:0 "[jamukha.GetShortUIName] deve ser derrotado para tomar a [decision|E] #high $mpo_become_greatest_of_khans_decision$#!"
 mpo_temujin_flavor.0020.remove_friend:0 "Você deixa de ser [friends|E] com [jamukha.GetShortUIName]"
 mpo_temujin_flavor.0020.t:0 "A Traição de [jamukha.GetFirstNamePossessiveNoTooltip]"
 mpo_temujin_flavor.0030.a.tt:0 "Você recebe um [casus_belli|E] #high $retaliation_cb$#! contra [mergid.GetShortUIName]"
 mpo_temujin_flavor.0030.a:0 "\"[mergid.GetSheHe|U] vai pagar por isso.\""
 mpo_temujin_flavor.0030.b:0 "\"#EMP Você#! é a coisa mais importante aqui."
 mpo_temujin_flavor.0030.c:0 "\"Por que você me incomoda com essa bobagem?\""
 mpo_temujin_flavor.0030.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip],\" [borte.GetFirstNameNoTooltip] chama suavemente, entrando na minha tenda. As bochechas [borte.GetHerHim] estão vermelhas e seu cabelo bagunçado. \"Desde que fui feito refém pelos [mergid.GetDynastyName], tenho me sentido mal.\"\n\n[borte.GetSheHe|U] cobre o ventre com mãos trêmulas."
 mpo_temujin_flavor.0030.pregnancy_tt:0 "[borte.GetShortUIName] logo mostrará sinais de gravidez"
 mpo_temujin_flavor.0030.t:0 "A Ofensa dos [mergid.GetDynastyNameNoTooltip]"
 pregnancy.1002.a.borte:0 "Agora está feito."
 pregnancy.1002.d.borte:0 "O temido momento chegou..."
 temujin_jamukha_truce:0 "Antigo soberano"
 temujin_jamukha_war_modifier:0 "A Vingança de um Irmão"
 temujin_jamukha_war_modifier_desc:0 "Este personagem foi traído por alguém muito próximo ao seu coração."
 temujin_jamukha_war_smaller_modifier:0 "Uma Vingança Sangrenta"
 temujin_jamukha_war_smaller_modifier_desc:0 "Este personagem foi traído por alguém em quem confiava."
