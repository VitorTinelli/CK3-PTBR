 RiverNameNotTheNile:0 "a [ROOT.Province.GetName]"
 RiverNameTheNile:0 "[ROOT.Province.GetName]"
 bp3_skill_travel_skill_learn_fail:0 "Simplesmente não consigo fazer isso"
 bp3_skill_travel_skill_learn_win:0 "Adotar os modos [lifestyle_character.GetHerHim]"
 church_investment_cost_modifier:0 "Investimentos Piedosos"
 church_investment_cost_modifier_desc:0 "$church_investment_modifier_desc$#emp Pode ser removido com a [decision|E] #color_white Fim dos Investimentos Piedosos#!#!"
 church_investment_modifier:0 "Patrono Piedoso"
 church_investment_modifier_desc:0 "Este personagem reservou riqueza e recursos pessoais para apoiar os clérigos locais.\n\n"
 end_investments_minor_decision:0 "Encerrar os Investimentos Piedosos"
 end_investments_minor_decision_confirm:0 "Encerrar Investimentos"
 end_investments_minor_decision_desc:0 "Esses parasitas já não tiveram o suficiente da minha riqueza? Tenho outras coisas para gastar!"
 end_investments_minor_decision_tooltip:0 "Encerre seus investimentos no [ROOT.Char.Custom('GetFaithTemple')]"
 heartless_modifier:0 "Sem Coração"
 heartless_modifier_desc:0 "Um governante sem coração que rouba de crianças órfãs."
 holy_knights_travel_modifier:0 "Viajando com Cavaleiros"
 holy_knights_travel_modifier_desc:0 "Este séquito está protegido por um grupo de valentes cavaleiros."
 holy_pilgrims_travel_modifier:0 "Guiando Peregrinos"
 holy_pilgrims_travel_modifier_desc:0 "Este séquito está protegendo um grupo de peregrinos em direção a um local sagrado."
 kind_ruler_modifier:0 "Governante Bondoso"
 kind_ruler_modifier_desc:0 "Conhecido por tratar até os mais humildes órfãos com bondade."
 knight_teacher_modifier:0 "Mestre dos Cavaleiros"
 knight_teacher_modifier_desc:0 "Um velho cavaleiro que passou a vida lutando e ensinando outros.\n\nMelhora a [education|E] do [ward|E]"
 mercenary_army_default:0 "Mercenários"
 modifier_church_investments_desc:0 "\t#weak Aumentado a cada dois anos passados#!"
 modifier_extra_building_resources_desc:0 "\t#weak Diminuído para cada uso restante#!"
 popular_beer_character_modifier:0 "Cerveja Popular"
 popular_beer_character_modifier_desc:0 "Uma cerveja famosa de longe que se tornou incrivelmente popular na corte."
 travel_events_bp3.1.a:0 "\"Já é hora de [ROOT.Char.Custom('GetSeason')] novamente, hein?\""
 travel_events_bp3.1.b.flavor:0 "\"Teremos mais do que tempo suficiente para observar a paisagem enquanto viajamos para [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetName].\""
 travel_events_bp3.1.b:0 "\"Volte para o seu cavalo, [friendly_character.GetFirstNameNoTooltip].\""
 travel_events_bp3.1.desc.autumn:0 "Um refrescante vento de outono atravessa o acampamento, levantando folhas e poeira do chão. O verão ficou para trás, é hora de nos prepararmos para o frio do outono e do inverno."
 travel_events_bp3.1.desc.autumn_desert:0 "Um refrescante vento de outono atravessa o acampamento, levantando areia e poeira do chão. O verão ficou para trás, é hora de nos prepararmos para o frio do outono e do inverno."
 travel_events_bp3.1.desc.dry_season:0 "Um vento seco atravessa o acampamento, deixando uma nuvem de poeira para trás. A estação seca chegou; esperamos que isso não afete muito nossa jornada."
 travel_events_bp3.1.desc.rainy_season:0 "Uma rajada de vento agarra minhas roupas por um segundo e começa a chover suavemente, mas as nuvens cinzentas escuras no céu gritam que uma tempestade está se formando."
 travel_events_bp3.1.desc.spring:0 "Uma brisa surpreendentemente quente acaricia meu rosto por um momento, uma mudança notável em relação ao clima frio que tivemos recentemente. Finalmente é primavera."
 travel_events_bp3.1.desc.summer:0 "Um vento quente balança minhas roupas por um segundo, e noto a luz do sol agradável brilhando sobre o acampamento. Sinais de dias mais quentes por vir."
 travel_events_bp3.1.desc.winter:0 "Aperto minhas roupas em volta de mim enquanto uma rajada de vento frio atinge minhas costas. O frio sussurra que é hora do inverno, mais uma vez."
 travel_events_bp3.1.desc.winter_snow:0 "Aperto minhas roupas em volta de mim enquanto uma rajada de vento frio atinge minhas costas, e vejo os primeiros sinais de neve. O frio sussurra que é hora do inverno, mais uma vez."
 travel_events_bp3.1.desc:0 "Enquanto nos preparamos para partir pela manhã, vejo [Select_CString( friendly_character.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', friendly_character)] parad[Select_CString( friendly_character.IsFemale, 'a', 'o' )] fora do acampamento, completamente sozinh[Select_CString( friendly_character.IsFemale, 'a', 'o' )]. Quando me aproximo para falar com [friendly_character.GetSheHe], percebo uma mudança no vento.\n\n"
 travel_events_bp3.1.t:0 "As Estações da Mudança"
 travel_events_bp3.10.a:0 "\"Venham, venham! Aproveitem nossa fogueira e nos contem sobre suas viagens!\""
 travel_events_bp3.10.b:0 "\"Podemos viajar para [holy_location.GetNameNoTooltip] juntos.\""
 travel_events_bp3.10.c.flavor:0 "Ninguém notará se alguns peregrinos se perderem em sua jornada, certo?"
 travel_events_bp3.10.c.holy_order:0 "\"#emp Emboscada! Defendam o acampamento!#!\""
 travel_events_bp3.10.c.pilgrims:0 "\"Ah, eu aliviarei seus problemas...\""
 travel_events_bp3.10.d:0 "\"Não, não há espaço para vocês aqui.\""
 travel_events_bp3.10.desc.holy_order:0 "Um grupo de cavaleiros, liderado por um[Select_CString( holy_order_character.IsFemale, 'a', '' )] [holy_order_character.GetWomanMan] de aparência orgulhosa. Cada um dos cavaleiros parece mais rico do que o outro.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], é um prazer conhecê-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]. Sou [holy_order_character.GetName] do [grandmaster.GetPrimaryTitle.GetName]. Estamos em uma longa jornada para chegar a [holy_location.GetName], e precisamos de algum descanso antes da última etapa. Podemos compartilhar sua fogueira?\""
 travel_events_bp3.10.desc.pilgrims:0 "Eles parecem um bando de peregrinos perdidos, liderados por um[Select_CString( pilgrim_character.IsFemale, 'a', '' )] [pilgrim_character.GetWomanMan] de aparência exausta. Apesar da minha primeira impressão, percebo que todos carregam algum tipo de objeto de valor.\n\n\"Por favor, [ROOT.Char.Custom('FormOfAddressForLiege')], podemos descansar junto à sua fogueira? Viemos de uma longa jornada...\""
 travel_events_bp3.10.desc:0 "Enquanto estamos ao redor da fogueira após um longo dia, um grupo de viajantes se aproxima de nós no escuro."
 travel_events_bp3.10.t:0 "Os Peregrinos para [holy_location.GetNameNoTooltip]"
 travel_events_bp3.100.a.flavor:0 "Está #emp mesmo#! um bom dia para pescar."
 travel_events_bp3.100.a:0 "\"Isso parece uma boa ideia, na verdade.\""
 travel_events_bp3.100.b.flavor:0 "Parece um bom lugar para descansar antes da próxima parte da nossa jornada."
 travel_events_bp3.100.b:0 "Vamos descansar aqui por alguns dias."
 travel_events_bp3.100.c:0 "\"Volte para o seu cavalo, [friend_character.GetFirstNameNoTooltip], temos lugares para ir!\""
 travel_events_bp3.100.desc:0 "Ao me levantar de manhã cedo, não posso evitar de dar um grande bocejo. Me espreguiçando, saio da minha tenda e vejo que as pessoas já estão se movimentando.\n\nPercebo [Select_CString( friend_character.IsFemale, 'a', 'o' )] [friend_character.GetFirstName] indo embora com o que parece ser uma vara de pescar improvisada, no meio do barulho e agitação do acampamento. \"Para onde você vai?\" pergunto a [friend_character.GetSheHe].\n\n [friend_character.GetSheHe|U] responde com um encolher de ombros despreocupado, \"Está um bom dia para pescar.\""
 travel_events_bp3.100.t:0 "Terra de Leite e... Peixe?"
 travel_events_bp3.105.a.blademaster:0 "\"Você pode me ensinar mais sobre a espada?\""
 travel_events_bp3.105.a.gardener:0 "\"O que é que você encontra de tão interessante nelas?\""
 travel_events_bp3.105.a.herbalist:0 "\"Você pode me contar mais sobre as ervas que encontrou?\""
 travel_events_bp3.105.a.hunter:0 "\"Você pode me ensinar a usar um arco?\""
 travel_events_bp3.105.a.mystic:0 "\"Eu gostaria de ouvir mais sobre o que você sabe.\""
 travel_events_bp3.105.a.physician:0 "\"Como você sabe tanto sobre doenças e enfermidades?\""
 travel_events_bp3.105.a.reveler:0 "\"Como posso ser mais extrovertido como você?\""
 travel_events_bp3.105.b:0 "\"Você é o orgulho dessa comitiva, [lifestyle_character.GetFirstNameNoTooltip].\""
 travel_events_bp3.105.desc.blademaster:0 "Toda manhã, [lifestyle_character.GetSheHe] está treinando, balançando sua espada.\n\nMesmo esta noite, enquanto todos os outros estão ocupados aproveitando a comida, [lifestyle_character.GetSheHe] está sozinho, passando por seus impressionantes exercícios. Não consigo evitar de querer emular algumas partes do estilo de vida [lifestyle_character.GetHerHim]."
 travel_events_bp3.105.desc.gardener:0 "Percebi que [lifestyle_character.GetSheHe] frequentemente é o primeiro a sair correndo quando chegamos a uma nova vila ou cidade.\n\nHoje encontrei [lifestyle_character.GetSheHe] estudando um pequeno jardim, enquanto visitávamos [ROOT.Char.GetCurrentLocation.GetName]. Foram várias tentativas até [lifestyle_character.GetSheHe] notar que eu estava ali, ou tentando falar com [lifestyle_character.GetSheHe]."
 travel_events_bp3.105.desc.herbalist:0 "Sempre colhendo ervas ou flores enquanto viajamos, guardando-as cuidadosamente para usos futuros.\n\nHoje ouvi [lifestyle_character.GetSheHe] falar por um bom tempo sobre as propriedades de uma erva que [lifestyle_character.GetSheHe] havia colhido. Como ela poderia ser usada tanto para o bem quanto para o mal. Talvez haja algo de interessante nesse hobby depois de tudo?"
 travel_events_bp3.105.desc.hunter:0 "Uma vez vi [lifestyle_character.GetSheHe] abater um pássaro no ar enquanto viajávamos, como se fosse a coisa mais fácil do mundo.\n\nHoje, [lifestyle_character.GetSheHe] e alguns outros saíram para caçar comida para o resto de nós, voltando vitoriosos. A popularidade, a quantidade de pessoas que se aglomeram ao redor [lifestyle_character.GetHerHim]... Não consigo evitar de querer tentar também."
 travel_events_bp3.105.desc.mystic:0 "[lifestyle_character.GetSheHe|U] parece saber as coisas mais estranhas, frequentemente se envolvendo em conversas curiosas com os outros ao redor [lifestyle_character.GetHerHim].\n\n[lifestyle_character.GetSheHe|U] chega a beirar a heresia com alguns dos pensamentos [lifestyle_character.GetHerHim], questionando frequentemente o que o resto de nós tomamos como garantido... E ainda assim não posso evitar de sentir que [lifestyle_character.GetSheHe] está certo em muitas das opiniões [lifestyle_character.GetHerHim]."
 travel_events_bp3.105.desc.physician:0 "[lifestyle_character.GetSheHe|U] frequentemente ajuda os outros com ferimentos e arranhões pequenos, fazendo pequenas emplastros como se fosse algo simples.\n\nQuando passamos por [ROOT.Char.GetCurrentLocation.GetName], vejo [lifestyle_character.GetSheHe] de repente correr até uma criança camponesa que estava tendo dificuldades para respirar e ficando de cor anormal em um beco, e antes que você perceba, o rosto da criança volta ao normal. Como [lifestyle_character.GetSheHe] fez isso?"
 travel_events_bp3.105.desc.reveler:0 "Sempre que fazemos uma parada, [lifestyle_character.GetSheHe] é o primeiro a explorar uma nova cidade ou vila.\n\nMesmo esta noite, [lifestyle_character.GetSheHe] está novamente puxando conversa e interagindo com todos. De alguma forma, [lifestyle_character.GetSheHe] faz com que todos se sintam em casa, mesmo aqui fora. Talvez haja algo que eu possa aprender com [lifestyle_character.GetSheHe]?"
 travel_events_bp3.105.desc:0 "Depois de viajarmos juntos por um tempo, percebi que há algo de especial [Select_CString( lifestyle_character.IsFemale, 'na', 'no' )] [lifestyle_character.GetFirstName]."
 travel_events_bp3.105.t:0 "Um[Select_CString( lifestyle_character.IsFemale, 'a', '' )] [lifestyle_character.GetWomanMan|U] de Habilidades Incomuns"
 travel_events_bp3.110.a.flavor:0 "Talvez ouvir sobre os problemas [friend_character.GetHerHim] possa aliviar o meu fardo?"
 travel_events_bp3.110.a:0 "\"E você?\""
 travel_events_bp3.110.b.flavor:0 "Isso é sobre mim e meus problemas, não sobre [Select_CString( friend_character.IsFemale, 'a', 'o' )] [friend_character.GetFirstName]."
 travel_events_bp3.110.b:0 "\"Você não vai acreditar no que eu tenho que passar...\""
 travel_events_bp3.110.desc.fallback:0 "todas as minhas decisões ultimamente."
 travel_events_bp3.110.desc.intro:0 "Muito depois de todos já estarem dormindo, ainda me encontro sentado ao redor da fogueira. \"O que há de errado?\" pergunta [Select_CString( friend_character.IsFemale, 'a', 'o' )] [friend_character.GetFirstName], enquanto [friend_character.GetSheHe] se senta ao meu lado, com uma expressão preocupada no rosto [friend_character.GetHerHim].\n\nA princípio não sei o que dizer, mas assim que começo a falar, tudo sai naturalmente, todo o meu estresse, minhas preocupações, os problemas do meu dia a dia. \"Eu só fico pensando sobre"
 travel_events_bp3.110.desc.negative_memory:0 "a vez em que [negative_memory.GetDescription]."
 travel_events_bp3.110.desc.outro:0 "Não posso deixar de me perguntar se deveria ter feito as coisas de maneira diferente."
 travel_events_bp3.110.t:0 "Conversa Sincera"
 travel_events_bp3.115.a:0 "Contar uma história minha..."
 travel_events_bp3.115.b.impressed:0 "Você os impressiona"
 travel_events_bp3.115.b.unimpressed:0 "Eles ficam desinteressados"
 travel_events_bp3.115.b:0 "... com algumas exagerações!"
 travel_events_bp3.115.c:0 "Pedir para [Select_CString( character_number_1.IsFemale, 'a', 'o' )] [character_number_1.GetFirstNameNoTooltip] me contar outra história!"
 travel_events_bp3.115.desc.1_character:0 "m[Select_CString( character_number_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', character_number_1)] [character_number_1.GetFirstName]."
 travel_events_bp3.115.desc.2_characters:0 "m[Select_CString( character_number_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', character_number_1)] [character_number_1.GetFirstName] e m[Select_CString( character_number_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', character_number_2)] [character_number_2.GetFirstName]."
 travel_events_bp3.115.desc.3_characters:0 "m[Select_CString( character_number_1.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', character_number_1)] [character_number_1.GetFirstName], m[Select_CString( character_number_2.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', character_number_2)] [character_number_2.GetFirstName] e m[Select_CString( character_number_3.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', character_number_3)] [character_number_3.GetFirstName]."
 travel_events_bp3.115.desc.intro:0 "Muito depois que a noite já se estabeleceu, me vejo rindo, contando histórias e bebendo com"
 travel_events_bp3.115.desc.outro:0 "Eu não sabia que [character_number_1.GetSheHe] tinha isso [Select_CString( character_number_1.IsFemale, 'nela', 'nele' )], mas [Select_CString( character_number_1.IsFemale, 'a', 'o' )] [character_number_1.GetFirstNameNoTooltip] acaba contando uma história particularmente picante sobre quatro camponeses que [character_number_1.GetSheHe] viu em [ROOT.Char.GetCapitalLocation.GetName].\n\nDepois de enxugar os olhos de tanto rir, e beber um pouco para limpar a garganta, eu vou..."
 travel_events_bp3.115.t:0 "Noite ao Redor da Fogueira"
 travel_events_bp3.120.a:0 "Claro, podemos ajudar."
 travel_events_bp3.120.b:0 "Por um preço, talvez..."
 travel_events_bp3.120.c:0 "\"Quanto foi mesmo que você disse que tem?\""
 travel_events_bp3.120.d:0 "\"Peço desculpas, mas estamos com pressa.\""
 travel_events_bp3.120.desc.intro.coast:0 "Enquanto viajamos pela costa de [ROOT.Char.GetCurrentLocation.GetName],"
 travel_events_bp3.120.desc.intro.river:0 "Enquanto viajamos pelo [river_province.Custom('RiverNameLoc')],"
 travel_events_bp3.120.desc:0 "percebemos um[Select_CString( merchant_character.IsFemale, 'a', '' )] [merchant_character.GetWomanMan] xingando alto sua vida e reclamando da sua tripulação traidora. Quando nos aproximamos, vemos [merchant_character.GetSheHe] parado ao lado dos restos de um pequeno barco mercante naufragado.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], posso pedir um momento de seu tempo? Eu ficaria feliz em pagar por um pouco de comida e ajuda para reparar meu barco.\" [merchant_character.GetSheHe|U] pergunta com um sorriso dolorido no rosto [merchant_character.GetHerHim]. Percebo que a maior parte dos bens [merchant_character.GetHerHim] parece bem conservada, apesar da desgraça [merchant_character.GetHerHim]."
 travel_events_bp3.120.t:0 "O Barco Naufragado"
 travel_events_bp3.15.a.tt:0 "Você pode descobrir um dos [secrets|E] d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetFirstNamePossessive]"
 travel_events_bp3.15.a:0 "\"Conte-me mais sobre [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNameNoTooltip].\""
 travel_events_bp3.15.b:0 "\"Você parece um[Select_CString( bard_character.IsFemale, 'a', '' )] [bard_character.GetWomanMan] interessante, gostaria de se juntar a mim?\""
 travel_events_bp3.15.c:0 "\"Segure a língua, vil camponês!\""
 travel_events_bp3.15.desc.craven:0 "#emp '[liege.GetFirstName], [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitleAsNameNoTooltip] covarde'#!"
 travel_events_bp3.15.desc.fool:0 "#emp '[liege.GetFirstName], [Select_CString( liege.IsFemale, 'a', 'o' )] pateta do [liege.GetPrimaryTitle.GetAdjective]'#!"
 travel_events_bp3.15.desc.gluttonous:0 "#emp '[liege.GetFirstName], [Select_CString( liege.IsFemale, 'a leitoa', 'o porco' )] da corte [liege.GetCulture.GetName]'#!"
 travel_events_bp3.15.desc.lustful.man:0 "#emp '[liege.GetFirstName], [Select_CString( liege.IsFemale, 'a devassa', 'o devasso' )] do [liege.GetPrimaryTitle.GetName]'#!"
 travel_events_bp3.15.desc.lustful.woman:0 "#emp '[liege.GetFirstName], [Select_CString( liege.IsFemale, 'a devassa', 'o devasso' )] do [liege.GetPrimaryTitle.GetName]'#!"
 travel_events_bp3.15.desc.murderer:0 "#emp '[liege.GetFirstName], [Select_CString( liege.IsFemale, 'a tirânica', 'o tirânico' )] sapo [liege.GetCulture.GetName]'#!"
 travel_events_bp3.15.desc.outro:0 "?!\" [bard_character.GetSheHe|U] grita para nós assim que estamos próximos o suficiente para ouvir. Antes que possamos responder, [bard_character.GetSheHe] começa a cantar uma animada melodia sobre as depravações d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstNameNoTooltip]."
 travel_events_bp3.15.desc:0 "Enquanto viajamos pelos arredores de [location.GetName], de repente avistamos um[Select_CString( bard_character.IsFemale, 'a', '' )] [bard_character.GetWomanMan] alegre à distância. Pulando, dançando e cantando para [bard_character.GetHerselfHimself], [bard_character.GetSheHe] parece uma figura peculiar.\n\n\"Gostariam de ouvir algumas das minhas canções sobre "
 travel_events_bp3.15.t:0 "As Canções d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstNameNoTooltip]"
 travel_events_bp3.20.a:0 "\"Em [new_home_province.GetNameNoTooltip]? Claro, por que não!\""
 travel_events_bp3.20.b.tt:0 "Tenho certeza de que ninguém se importará se contornarmos algumas leis e regulamentações para fazer este acordo funcionar."
 travel_events_bp3.20.b:0 "\"Me entregue o dinheiro diretamente, e eu posso fazer algo funcionar...\""
 travel_events_bp3.20.c:0 "\"Em vez disso, conte-me mais sobre seu negócio e sua bela cidade.\""
 travel_events_bp3.20.desc:0 "Enquanto meu séquito viaja por [ROOT.Char.GetCurrentLocation.GetName], acabamos em uma conversa com um[Select_CString( merchant_character.IsFemale, 'a', '' )] representante de [SCOPE.Custom('LocalGuildsLoc')], um[Select_CString( merchant_character.IsFemale, 'a', '' )] [merchant_character.GetWomanMan] [Select_CString( merchant_character.IsFemale, 'entusiasmada e carismática chamada', 'entusiasmado e carismático chamado' )] [merchant_character.GetFirstName].\n\n\"Do [ROOT.Char.GetPrimaryTitle.GetNameNoTier], você diz? Na verdade, temos interesse em abrir uma oficina em [new_home_province.GetName]. Você não poderia nos fazer um favor aqui, poderia?\" [merchant_character.GetSheHe|U] me dá uma piscadela e coloca uma moeda na mesa."
 travel_events_bp3.20.t:0 "O [SCOPE.Custom('LocalGuildsLoc')]"
 travel_events_bp3.25.a:0 "Vou doar algumas moedas para esses pobres coitados."
 travel_events_bp3.25.b.insulted:0 "Você insulta os sobreviventes"
 travel_events_bp3.25.b.martial:0 "Você ouve sobre os erros estratégicos [liege.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 travel_events_bp3.25.b.prowess:0 "Você ouve sobre como os [liege.GetPrimaryTitle.GetAdjectiveNoTooltip] lutaram"
 travel_events_bp3.25.b.stories:0 "Você ouve algumas histórias sobre as batalhas"
 travel_events_bp3.25.b:0 "Talvez tenham alguma sabedoria para compartilhar sobre suas batalhas?"
 travel_events_bp3.25.c:0 "Bem... Chega de desgraça e tristeza, temos lugares para ir."
 travel_events_bp3.25.desc.outro.sadistic:0 "E, no entanto, não consigo deixar de dar uma risada, ao ver esses tolos que arruinaram suas vidas."
 travel_events_bp3.25.desc.outro:0 "E ainda assim as palavras celebratórias empalidecem quando olho para os soldados feridos e seus familiares enlutados."
 travel_events_bp3.25.desc:0 "Enquanto caminhamos pelas ruas de [ROOT.Char.GetCurrentLocation.GetName], uma procissão de soldados emerge de uma rua lateral. A maioria deles está ferida e é auxiliada por civis abatidos.\n\nUm arauto orgulhosamente se levanta na frente da multidão reunida no mercado e declara em voz alta: \"Esmagamos esses cães [opponent.GetPrimaryTitle.GetAdjective] novamente! É apenas uma questão de tempo até que a vitória seja nossa!\"\n\n"
 travel_events_bp3.25.t:0 "As Duras Realidades da Guerra"
 travel_events_bp3.30.a:0 "\"O #emp melhor#!? Você chamou minha atenção...\""
 travel_events_bp3.30.b:0 "\"Estaria interessado em juntar-se ao meu bando?\""
 travel_events_bp3.30.c:0 "\"Tenho o trabalho #emp perfeito#! para vocês.\""
 travel_events_bp3.30.d:0 "\"Não, estou aqui apenas para aproveitar uma pequena pausa.\""
 travel_events_bp3.30.desc:0 "Estamos sentados em uma taverna tranquila em [ROOT.Char.GetCurrentLocation.GetName], quando um grupo barulhento de mercenários maltrapilhos invade o local. O líder brutal empurra um dos meus guardas para o lado e, audaciosamente, se senta à minha mesa.\n\n\"Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] nobre, hein? '[ROOT.Char.GetLadyLord]'? Interessado nos serviços do melhor bando de mercenários em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]? Homens mais leais você nunca encontrará! Pelo menos, se nos pagar adequadamente...\""
 travel_events_bp3.30.e:0 "\"#bold #emp Com licença? #!#!\""
 travel_events_bp3.30.t:0 "Os Mercenários de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]"
 travel_events_bp3.35.a.home:0 "\"Você estaria disposto a vir para [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] para ensinar?\""
 travel_events_bp3.35.a.travel:0 "\"Quero que você continue ensinando [Select_CString( kid_character.IsFemale, 'a', 'o' )] [kid_character.GetFirstNameNoTooltip].\""
 travel_events_bp3.35.a.tt:0 "Melhora o resultado da [education|E] do [ward|E] para [Select_CString( kid_character.IsFemale, 'a', 'o' )] [kid_character.GetFirstName]"
 travel_events_bp3.35.b.lose:0 "Eu perco o duelo, mas [soldier_character.GetSheHe] me ajuda a melhorar"
 travel_events_bp3.35.b.martial:0 "\"Claro, posso tentar.\""
 travel_events_bp3.35.b.non_martial:0 "\"Estou interessad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em tentar também...\""
 travel_events_bp3.35.b.win:0 "Eu venço o duelo"
 travel_events_bp3.35.c.home:0 "\"Não, estou apenas observando.\""
 travel_events_bp3.35.c.travel:0 "\"Obrigad[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] por encontrar m[Select_CString( kid_character.IsFemale, 'inha', 'eu' )] [kid_character.Custom('GetDaughterSon')].\""
 travel_events_bp3.35.desc.home:0 "Enquanto caminhamos pelas ruas de [ROOT.Char.GetCurrentLocation.GetName], vemos uma multidão de crianças camponesas reunidas ao redor de um[Select_CString( soldier_character.IsFemale, 'a', '' )] [soldier_character.GetWomanMan] velh[Select_CString( soldier_character.IsFemale, 'a', 'o' )] em uma pequena rua lateral. Várias delas estão brandindo espadas de madeira malformadas e gritando animadamente enquanto tentam acertar [soldier_character.GetSheHe].\n\n\"Quem se impressionaria com esses passos, hein?\" [soldier_character.GetSheHe|U] se vira para nós, depois de provocar uma das crianças,"
 travel_events_bp3.35.desc.traveling:0 "Enquanto caminhamos pelas ruas de [ROOT.Char.GetCurrentLocation.GetName], [kid_character.GetFirstName] de repente sai correndo em direção a uma rua lateral. Todo o séquito é pego de surpresa, e todos corremos atrás [kid_character.GetHerHim], apenas para encontrar [kid_character.GetSheHe] brandindo uma espada de madeira malformada contra um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [soldier_character.GetWomanMan] velh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\n\"É o melhor que você consegue, pequen[Select_CString( kid_character.IsFemale, 'a', 'o' )] [kid_character.Custom('GetPrincessPrince')]?\" El[Select_CString( kid_character.IsFemale, 'a', 'e' )] se vira para nós, depois de provocar um[Select_CString( kid_character.IsFemale, 'a', '' )] [kid_character.GetFirstNameNoTooltip] zangad[Select_CString( kid_character.IsFemale, 'a', 'o' )],"
 travel_events_bp3.35.outro.martial_gender:0 "e comenta com um sorriso irônico: \"Quer se juntar também, [ROOT.Char.Custom('FormOfAddressForLiege')]? Acho que você é um pouco mais velh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] que meu grupo habitual.\""
 travel_events_bp3.35.outro.non_martial_gender:0 "fazendo uma pequena reverência com a cabeça. \"Posso ser de alguma ajuda, [ROOT.Char.Custom('FormOfAddressForLiege')]? Espero não ter ofendido, estou apenas mostrando a algumas das crianças o básico sobre uma lâmina.\""
 travel_events_bp3.35.t:0 "O Mestre dos Cavaleiros"
 travel_events_bp3.40.a:0 "\"Eu farei isso.\""
 travel_events_bp3.40.b:0 "\"Vamos lá, você consegue [challenger_character.GetFirstNameNoTooltip]!\""
 travel_events_bp3.40.c:0 "Parece que é hora de partir..."
 travel_events_bp3.40.desc:0 "Enquanto passamos pelo mercado em [ROOT.Char.GetCurrentLocation.GetName], ouvimos um grito alto vindo de um canto atrás de uma das barracas, onde um grupo de pessoas observa [Select_CString( soldier_character.IsFemale, 'duas', 'dois' )] [soldier_character.GetWomenMen] lutando. À medida que nos aproximamos, um deles é levantado pelo outro e jogado a vários metros de distância, seguido pelo aplauso da multidão e pela troca de moedas.\n\n\"Quem é o próximo?!\" [Select_CString( soldier_character.IsFemale, 'A', 'O' )] [soldier_character.GetWomanMan] grita para a multidão, e enquanto os olhos [soldier_character.GetHerHim] percorrem a multidão, eles pousam em nosso grupo. O rosto [soldier_character.GetHerHim] se abre em um sorriso malicioso ao nos olhar."
 travel_events_bp3.40.fallback:0 "Seu rosto se divide em um sorriso malicioso, enquanto [soldier_character.GetSheHe] nos olha."
 travel_events_bp3.40.lose:0 "Perca o duelo"
 travel_events_bp3.40.outro.challenger:0 "Ao meu lado, [challenger_character.GetTitledFirstName] resmunga em resposta ao desafio."
 travel_events_bp3.40.t:0 "O Torneio Marcial"
 travel_events_bp3.40.win:0 "Vença o duelo"
 travel_events_bp3.45.a:0 "\"Um cavaleiro honrado como você deveria servir a um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetLadyLord], como eu.\""
 travel_events_bp3.45.b.flavor:0 "Talvez [knight_character.GetSheHe] tenha algumas histórias para contar?"
 travel_events_bp3.45.b:0 "\"Posso te oferecer uma bebida?\""
 travel_events_bp3.45.c:0 "Não tenho tempo para este vagabundo."
 travel_events_bp3.45.desc:0 "Enquanto caminhamos pelas ruas de [ROOT.Char.GetCurrentLocation.GetName], ouvimos uma grande confusão em uma das barracas do mercado, com [Select_CString( knight_character.IsFemale, 'duas', 'dois' )] [knight_character.GetWomenMen] gritando um com o outro. Antes que possamos nos aproximar, um[Select_CString( knight_character.IsFemale, 'a', '' )] [knight_character.GetWomanMan] já se colocou entre eles e acalmou a situação.\n\n\"Viu, vai ficar tudo bem?\" [knight_character.GetSheHe|U] diz [Select_CString( knight_character.IsFemale, 'a', 'ao' )] [knight_character.GetWomanMan] da barraca com um sorriso, entregando a el[Select_CString( knight_character.IsFemale, 'a', 'e' )] uma [ROOT.Char.GetCurrentLocation.Custom('GetByzantineCoinWithGloss')]. E com esse simples ato de generosidade, tudo volta ao normal.\n\n[knight_character.GetSheHe|U] se volta para nós enquanto nos aproximamos, sem estandarte ou marca que indique algum senhor feudal. Talvez um cavaleiro errante?"
 travel_events_bp3.45.diplomacy:0 "Histórias de cavalheirismo"
 travel_events_bp3.45.piety:0 "Histórias de piedade"
 travel_events_bp3.45.prestige:0 "Histórias de bravura"
 travel_events_bp3.45.prowess:0 "Histórias de valor"
 travel_events_bp3.45.t:0 "O Cavaleiro Errante"
 travel_events_bp3.5.a:0 "Uma oportunidade para descansar, eu diria."
 travel_events_bp3.5.b.rain:0 "Um pouco de chuva não fará mal a ninguém."
 travel_events_bp3.5.b.snow:0 "Um pouco de neve não fará mal a ninguém."
 travel_events_bp3.5.b.tt:0 "Os membros da [entourage|E] podem ganhar o [trait|E] #color_white [GetTrait('ill').GetName(GetNullCharacter)]#!"
 travel_events_bp3.5.desc.rain:0 "Justo quando estamos prestes a partir, começa a chover intensamente. Chuva, até onde a vista alcança. Não consigo evitar amaldiçoar minha má sorte, mas já havia notado as nuvens escuras se aproximando há algum tempo.\n\nSe quisermos chegar no prazo, precisamos partir, mas será uma jornada arriscada com o tempo do jeito que está."
 travel_events_bp3.5.desc.snow:0 "Justo quando estamos prestes a partir, começa a nevar. Não consigo evitar amaldiçoar minha má sorte, mas já havia notado as nuvens se aproximando há algum tempo. E não parece que a neve vá parar tão cedo.\n\nSe quisermos chegar no prazo, precisamos partir, mas atravessar uma nevasca é, no mínimo, arriscado."
 travel_events_bp3.5.t:0 "Pego do Lado de Fora"
 travel_events_bp3.50.a:0 "\"Aqui está um pouco de comida, criança.\""
 travel_events_bp3.50.b:0 "\"Venha, cuidarei de você.\""
 travel_events_bp3.50.c:0 "\"Seu cachorro? #bold Meu#! cachorro.\""
 travel_events_bp3.50.d:0 "Não tenho tempo para órfãos sujos."
 travel_events_bp3.50.desc:0 "Ao passar por um beco em [ROOT.Char.GetCurrentLocation.GetName], vejo uma criança solitária e seu cachorro sentados em um canto atrás de uma pequena parede. \"Aqui está, Valor.\" [child_character.GetSheHe|U] diz ao cachorro, enquanto entrega a ele um pequeno pedaço de pão, sem guardar nada para [child_character.GetHerselfHimself].\n\nOlhando para os dois, é claro que o cachorro foi muito melhor cuidado do que seu dono. A criança deve estar dando a ele tudo o que [child_character.GetSheHe] consegue encontrar."
 travel_events_bp3.50.t:0 "Uma Dupla Unida"
 travel_events_bp3.55.a.flavor:0 "Uma oportunidade perfeita para construir laços com [Select_CString( republic_ruler.IsFemale, 'a', 'o' )] [republic_ruler.GetTitledFirstName], se pudermos ajudar o retentor [republic_ruler.GetHerHim]."
 travel_events_bp3.55.a.tt:0 "Cria uma [alliance|E] com [republic_ruler.GetName]"
 travel_events_bp3.55.a:0 "Vamos ajudar [merchant_character.GetSheHe] antes que isso saia do controle."
 travel_events_bp3.55.b.flavor:0 "Vamos ver se conseguimos arrancar algumas mercadorias [merchant_character.GetHerHim] a um preço baixo."
 travel_events_bp3.55.b.lose:0 "Ser aproveitado"
 travel_events_bp3.55.b.win:0 "Aproveitar-se da situação"
 travel_events_bp3.55.b:0 "Parece o momento perfeito para ganhar algumas moedas..."
 travel_events_bp3.55.c:0 "Vou assistir ao espetáculo."
 travel_events_bp3.55.desc:0 "Enquanto eu passeio pelo mercado de [ROOT.Char.GetCurrentLocation.GetName], uma confusão vem de apenas algumas barracas adiante. Há um[Select_CString( merchant_character.IsFemale, 'a', '' )] [merchant_character.GetWomanMan] furios[Select_CString( merchant_character.IsFemale, 'a', 'o' )], animad[Select_CString( merchant_character.IsFemale, 'a', 'o' )] e gesticulando com as mãos. \"[republic_ruler.GetTitledFirstName] vai cortar sua cabeça por isso!\" [merchant_character.GetSheHe|U] grita para outro comerciante, que parece ainda mais irritado.\n\n\"Adoraria ver [republic_ruler.GetSheHe] tentar!\" O dono da barraca dispensa [Select_CString( merchant_character.IsFemale, 'a', 'o' )] comerciante com um gesto de mão. Virando-se com raiva para seus guarda-costas, [Select_CString( merchant_character.IsFemale, 'a', 'o' )] comerciante claramente pretende fechar um negócio de qualquer forma."
 travel_events_bp3.55.t:0 "Comerciantes Itinerantes"
 travel_events_bp3.60.a:0 "\"Vou comprar todos os seus materiais.\""
 travel_events_bp3.60.b:0 "\"Traga suas mercadorias para [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]!\""
 travel_events_bp3.60.c:0 "\"Saia do caminho já!\""
 travel_events_bp3.60.desc:0 "Enquanto caminhamos por [ROOT.Char.GetCurrentLocation.GetName], somos pegos em uma multidão de pessoas esperando que uma grande carroça cheia de materiais de construção saia do caminho.\n\n\"Não preciso dos seus produtos, já consegui mais barato em outro lugar!\" Um[Select_CString( merchant_character.IsFemale, 'a', '' )] [merchant_character.GetWomanMan] grita para outr[Select_CString( merchant_character.IsFemale, 'a', 'o' )]. [Select_CString( merchant_character.IsFemale, 'A', 'O' )] outr[Select_CString( merchant_character.IsFemale, 'a', 'o' )] parece desanimad[Select_CString( merchant_character.IsFemale, 'a', 'o' )] e confus[Select_CString( merchant_character.IsFemale, 'a', 'o' )].\n\n\"Mas-mas... O que devo fazer com esses, então?\" [merchant_character.GetSheHe|U] responde fracamente, mais para si mesm[Select_CString( merchant_character.IsFemale, 'a', 'o' )] do que para qualquer outra pessoa."
 travel_events_bp3.60.t:0 "Um Pequeno Negócio"
 travel_events_bp3.65.a:0 "\"Tenho uma oferta de trabalho para você, considere o dinheiro como seu primeiro pagamento.\""
 travel_events_bp3.65.b:0 "\"Ladrão imundo, acha que pode roubar de #bold #emp mim#!#!?\""
 travel_events_bp3.65.c:0 "\"Devolva o dinheiro, e podemos deixar isso por isso mesmo.\""
 travel_events_bp3.65.desc:0 "Enquanto examino as barracas do mercado em [ROOT.Char.GetCurrentLocation.GetName], sinto o cordão da minha bolsa ser cortado. Apesar de minha reação imediata, o ladrão desaparece na multidão.\n\nPor pura coincidência, um dos meus guardas vê [Select_CString( thief_character.IsFemale, 'a', 'o' )] [thief_character.GetWomanMan] entrando em um beco. \"Pare, ou vou cortar sua cabeça!\" Um dos meus guardas grita para [thief_character.GetSheHe], e o ladrão se vira, nos lançando um olhar raivoso e desconfiado."
 travel_events_bp3.65.t:0 "Perseguição pela Bolsa"
 travel_events_bp3.70.a.counties:0 "Pode [hybridize|E] com [root_scope.MakeScope.Var('special_culture_tooltip').Culture.GetName] mesmo que nenhum [counties|E] no seu [realm|E] tenha a [culture|E]"
 travel_events_bp3.70.a.cultural_acceptance:0 "[cultural_acceptance|E] necessário para [hybridize|E] com [root_scope.MakeScope.Var('special_culture_tooltip').Culture.GetName] reduzido em #color_white 25%#!"
 travel_events_bp3.70.a:0 "Gostaria que [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] fosse mais assim..."
 travel_events_bp3.70.b:0 "Isso parece exatamente como em casa!"
 travel_events_bp3.70.desc.entourage:0 "\"Este é um lugar tão amigável, não acha?\" [dancing_partner.GetFirstName] me pergunta, enquanto nós dois dançamos entre a multidão."
 travel_events_bp3.70.desc.local:0 "\"Bem-vindo a [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!\" Um[Select_CString( local_character.IsFemale, 'a', '' )] [local_character.GetWomanMan] com quem acabei dançando me diz entusiasmad[Select_CString( local_character.IsFemale, 'a', 'o' )], enquanto [local_character.GetSheHe] coloca a mão sobre a minha."
 travel_events_bp3.70.desc.outro:0 " Ouço uma grande comemoração de todos ao nosso redor quando os músicos terminam uma música e começam outra."
 travel_events_bp3.70.desc:0 "Ao entrarmos em [ROOT.Char.GetCurrentLocation.GetName], noto a atitude alegre e as decorações festivas pela cidade. Antes que percebamos, todo o meu séquito se envolve nas festividades também.\n\n"
 travel_events_bp3.70.t:0 "Festival de [ROOT.Char.GetCurrentLocation.GetCulture.GetNameNoTooltip]"
 travel_events_bp3.75.a:0 "\"[target_barony.GetNameNoTierNoTooltip] está precisando de alguém como você.\""
 travel_events_bp3.75.b:0 "\"Mude seu negócio para minhas terras e junte-se à minha corte.\""
 travel_events_bp3.75.c:0 "\"Obrigado, estava excelente!\""
 travel_events_bp3.75.desc:0 "Ao passar por uma pequena praça de mercado em [ROOT.Char.GetCurrentLocation.GetName], vejo um[Select_CString( brewmaster_character.IsFemale, 'a', '' )] [brewmaster_character.GetWomanMan] distribuindo bebidas para todos que passam. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" diz [brewmaster_character.GetSheHe] enquanto me entrega um copo. O aroma de [ROOT.Char.Custom('RegionalDrink')] imediatamente atinge meu nariz, e vejo a bebida girando levemente enquanto a aceito. Como todos os outros, bebo tudo de uma vez, e é #emp surpreendentemente#! boa.\n\n\"Está aceitável, [ROOT.Char.Custom('FormOfAddressForLiege')|U]?\" pergunta [brewmaster_character.GetSheHe|U] com um brilho curioso nos olhos, dando-me um olhar enfático enquanto continua. \"Se ao menos eu tivesse um lugar onde pudesse fazer mais como esta...\""
 travel_events_bp3.75.t:0 "Sonhos Fermentando"
 travel_events_bp3.80.a:0 "\"Se isso te fará feliz...\""
 travel_events_bp3.80.b:0 "\"Pense no seu futuro, [monk_character.GetFirstNameNoTooltip]!\""
 travel_events_bp3.80.desc.adult:0 "$travel_events_bp3.80.desc.monk$ \"Quero dedicá-la ao serviço de [ROOT.Char.GetFaith.HighGodName] aqui em [ROOT.Char.GetCurrentLocation.GetName].\""
 travel_events_bp3.80.desc.child:0 "$travel_events_bp3.80.desc.monk$ \"Quero dedicá-la ao serviço de [ROOT.Char.GetFaith.HighGodName].\""
 travel_events_bp3.80.desc.holy_order:0 "Enquanto visitamos um [ROOT.Char.Custom('GetFaithTemple')] em [ROOT.Char.GetCurrentLocation], noto [Select_CString( monk_character.IsFemale, 'a', 'o' )] [monk_character.GetFirstName] profundamente envolvid[Select_CString( monk_character.IsFemale, 'a', 'o' )] em uma conversa com um [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] viajante. [monk_character.GetSheHe|U] parece estar atent[Select_CString( monk_character.IsFemale, 'a', 'o' )] a cada palavra, com os olhos iluminados de interesse.\n\n\"[monk_character.Custom2('RelationToMeShort', ROOT.Char)|U], eu decidi o que quero fazer da minha vida.\" [monk_character.GetSheHe|U] me diz solenemente, enquanto me aproximo dos dois. O [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] acena e dá um leve tapinha nas costas [monk_character.GetHerHim], claramente tentando apoiar m[Select_CString( monk_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', monk_character)] e sua decisão. \"Quero dedicá-la ao serviço de [ROOT.Char.GetFaith.HighGodName] e d[Select_CString( grandmaster.IsFemale, 'a', 'o' )] [grandmaster.GetPrimaryTitle.GetName].\""
 travel_events_bp3.80.desc.monk:0 "Enquanto visitamos um [ROOT.Char.Custom('GetFaithTemple')] em [ROOT.Char.GetCurrentLocation], not[Select_CString( monk_character.IsFemale, 'a', 'o' )] [monk_character.GetFirstName] profundamente envolvid[Select_CString( monk_character.IsFemale, 'a', 'o' )] em uma conversa com um membro do clero local. [monk_character.GetSheHe|U] parece estar atent[Select_CString( monk_character.IsFemale, 'a', 'o' )] a cada palavra, com os olhos iluminados de interesse.\n\n\"[monk_character.Custom2('RelationToMeShort', ROOT.Char)|U], eu decidi o que quero fazer da minha vida.\" [monk_character.GetSheHe|U] me diz solenemente, enquanto me aproximo dos dois. O membro do clero me dá um sorriso, claramente tentando apoiar m[Select_CString( monk_character.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', monk_character)] e sua decisão."
 travel_events_bp3.80.t:0 "Uma Vida de Serviço"
 travel_events_bp3.85.a.tt:0 "Devido a uma tradição cervejeira em [brewery_county.GetName] com mais de #color_white [brewery_county.MakeScope.ScriptValue('brewery_counter_25')|0]#! anos de idade:"
 travel_events_bp3.85.a:0 "Não se compara com a cerveja tradicional de [brewery_county.GetAdjectiveNoTooltip]."
 travel_events_bp3.85.b:0 "Vou comprar um pouco para levar para casa."
 travel_events_bp3.85.c:0 "Não é à toa que é tão bem conhecida."
 travel_events_bp3.85.desc.monk:0 "Ao passar por [ROOT.Char.GetCurrentLocation.GetName], soubemos que precisávamos ver sua famosa cervejaria da abadia. Assim que entramos no prédio, vemos um grupo de pessoas sendo atendidas em uma pequena mesa perto da porta, enquanto monges realizam seu trabalho nos fundos."
 travel_events_bp3.85.desc.outro:0 "\n\nDepois de esperar o grupo anterior sair, finalmente recebemos algumas bebidas. Dou uma leve girada no copo e sinto o aroma distinto da cerveja subindo. Vendo todos experimentando, finalmente dou um gole também."
 travel_events_bp3.85.desc:0 "Ao passar por [ROOT.Char.GetCurrentLocation.GetName], soubemos que precisávamos ver sua famosa cervejaria local. Assim que entramos no prédio, vemos um grupo de pessoas sendo atendidas em uma pequena mesa perto da porta, enquanto cervejeiros realizam seu trabalho nos fundos."
 travel_events_bp3.85.t:0 "Cervejeiros de Fama"
 travel_events_bp3.90.a.flavor:0 "Com meu apoio, isso pode se tornar novamente um verdadeiro lugar de culto."
 travel_events_bp3.90.a:0 "\"Considere-me um patrono de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]!\""
 travel_events_bp3.90.b:0 "\"Claro, uma pequena doação é o mínimo.\""
 travel_events_bp3.90.c:0 "Parece que é hora de seguir em frente..."
 travel_events_bp3.90.desc:0 "No centro de [ROOT.Char.GetCurrentLocation.GetName] há um grande [ROOT.Char.Custom('GetFaithTemple')], com todo o resto da cidade se estabelecendo ao seu redor. Assim que entramos no edifício sagrado, um[Select_CString( priest_character.IsFemale, 'a', '' )] [priest_character.GetWomanMan] vem correndo até nós.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você parece ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] de posses, estaria disposto a fazer uma doação para o nosso [ROOT.Char.Custom('GetFaithTemple')]?\" Esfregando as mãos e se curvando, [priest_character.GetSheHe] estende a mão sem vergonha. Vejo que há alguns pequenos reparos sendo feitos ao redor do edifício, mas não é o suficiente para compensar todas as deficiências do [ROOT.Char.Custom('GetFaithTemple')]."
 travel_events_bp3.90.t:0 "Patron[Select_CString( priest_character.IsFemale, 'a', 'o' )] do [ROOT.Char.Custom('GetFaithTemple')|U]"
 travel_events_bp3.95.a.flavor:0 "Talvez eu consiga convencer [pilgrim_character.GetSheHe] a me contar mais sobre [unvisited_holy_site.GetProvince.GetCounty.GetName]?"
 travel_events_bp3.95.a.tt.wanderer:0 "Viajar para [unvisited_holy_site.GetName] em uma [pilgrimage|E] lhe dará [piety|E], [stress_loss|E] e experiência no [wanderer_lifestyle|E]"
 travel_events_bp3.95.a.tt:0 "Viajar para o [unvisited_holy_site.GetName] em uma [pilgrimage|E] lhe dará [piety|E] e [stress_loss|E]"
 travel_events_bp3.95.a:0 "\"Conte-me mais sobre [unvisited_holy_site.GetNameNoTierNoTooltip]!\""
 travel_events_bp3.95.b:0 "Que conto interessante."
 travel_events_bp3.95.desc:0 "Enquanto caminhamos pelo [ROOT.Char.Custom('GetFaithTemple')] em [ROOT.Char.GetCurrentLocation.GetName], ouço um grupo de viajantes conversando baixinho entre si. Um deles, um[Select_CString( pilgrim_character.IsFemale, 'a', '' )] [pilgrim_character.GetWomanMan], começa a descrever e comparar a igreja com a jornada dele para [unvisited_holy_site.GetNameNoTier].\n\nNão consigo evitar de ouvir a conversa enquanto [pilgrim_character.GetSheHe] continua dando detalhes sobre as coisas fantásticas que viu em [unvisited_holy_site.GetProvince.GetCounty.GetName]. Olhando ao redor, só posso imaginar o quanto deve ser melhor do que a visão delicada que vejo aqui..."
 travel_events_bp3.95.t:0 "O Conto de um Peregrino"
 travel_extra_building_resources_character_modifier:0 "Recursos Comerciais"
 travel_extra_building_resources_character_modifier_desc:0 "Uma valiosa rota comercial que proporciona fácil acesso a materiais de construção."
 travel_extra_building_resources_modifier:0 "Materiais de Construção Extra"
 travel_extra_building_resources_modifier_desc:0 "Esta província tem um grande estoque de recursos prontos para serem utilizados em novos projetos de construção.\n\n"
