l_spanish:
 bp3_decisions.0100.a:0 "Avante, meus seguidores!"
 bp3_decisions.0100.a_tt:0 "Cria até #V 3#! [justicar_task_contracts|E] no mapa"
 bp3_decisions.0100.b:0 "Apesar disso, anseio por terras..."
 bp3_decisions.0100.desc:0 "Para todos aqueles que me seguem, ofereço um lugar seguro para descansar e a chance de deixar sua marca no mundo.\n\nEm meu mundo, não há espaço para corrupção desenfreada ou artimanhas e tudo o que fazemos será para o bem dos reinos por onde vagamos, isso é o que significa ser um [GetPlayer.GetHouse.GetBaseName].\n\nEnquanto eu liderar [GetPlayer.GetPrimaryTitle.GetName], puniremos os ímpios!"
 bp3_decisions.0100.t:0 "$enact_legacy_of_adventurer_decision$"
 criminal_contracts_blocked_tt:0 "@warning_icon! #warning Você não poderá mais aceitar [task_contracts|E] [criminals|E]#!"
 enact_legacy_of_adventurer_decision:0 "Legado de [GetPlayer.GetHouse.GetBaseNameNoTooltip]"
 enact_legacy_of_adventurer_decision_confirm:0 "Pelo [GetPlayer.GetPrimaryTitle.GetNameNoTooltip]!"
 enact_legacy_of_adventurer_decision_desc:0 "Ao longo dos anos, meu humilde acampamento cresceu em tamanho e espírito.\n\nA cada tarefa que completamos, nosso vínculo com esta terra e seu povo se fortalece. Nossas façanhas são cantadas nas tabernas e nossos nomes sussurrados na escuridão, como será, por gerações."
 enact_legacy_of_adventurer_decision_tooltip:0 "Solidifique o lugar da [house|E] [GetPlayer.GetHouse.GetBaseNameNoTooltip] no reino dos [adventurers|E]"
 has_enough_contracts_tt:0 "Você completou #V [contract_tally]/50#! [task_contracts|E] Não-[criminals|E]"
 has_max_level_pavilion_tt:0 "Sua [building|E] [GetDomicileBuilding('camp_main_01').GetName] está no Nível #V 4#! #weak (#color_white [GetPlayer.MakeScope.ScriptValue('camp_pavillion_level')]#!)#!"
 have_enough_followers_tt:0 "Você tem pelo menos #V 15#! [followers|E] #weak (#color_white [GetPlayer.MakeScope.ScriptValue('tally_current_followers')]#!)#!"
 have_enough_patrons_tt:0 "Você tem pelo menos #V 5#! pessoas em sua [contact_list|E] #weak (#color_white [GetPlayer.MakeScope.ScriptValue('tally_roll_of_patrons')]#!)#!"
 legacy_adventurer_house_modifier:0 "Sangue de Aventureiro"
 legacy_adventurer_house_modifier_desc:0 "Esta casa valoriza o estilo de vida de um aventureiro, sem precisar se preocupar com questões da corte.\nRecompensas de [prestige|E] para [adventurer_i] [task_contract|E]: [prestige_i]#P +15%#!"
 legacy_adventurer_legitimacy_on_landing:0 "Se qualquer [adventurer|E] da [house|E] [GetPlayer.GetHouse.GetBaseName] se tornar um [ruler|E]:\n$BULLET$ Eles ganharão [legitimacy_i][GetPlayer.MakeScope.ScriptValue('massive_legitimacy_gain')|+0] [legitimacy|E]\n$BULLET$ Para cada [follower|E] que tiveram, ganharão [soldier_i] #P 25#! [levies|E]"
 remnants_adventurer_army:0 "Restos do [prev_title.GetNameNoTooltip]"
 task_successful_noncrim_contract_count_effect_tt:0 "Você faz progressos na [decision|E] $enact_legacy_of_adventurer_decision$"
