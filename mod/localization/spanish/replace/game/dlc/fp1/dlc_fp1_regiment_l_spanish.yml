l_spanish:
 bondi:0 "Bondí"
 bondi_flavor:0 "#F Os Bondí são parte de uma classe de proprietários de terra livres, frequentemente competentes marinheiros, que usam navios longos para negociar ou ir viking. Eles lutam usando lanças e escudos.#!"
 jomsviking_pirates:0 "Piratas Jomsviking"
 jomsviking_pirates_flavor:0 "#F Alguns dos saqueadores mais notórios a navegar no Báltico, os Jomsvikings se destacam ao injetar o caos na batalha, prolongando-o antes de se destacar no pós-batalha.#!"
 varangian_veterans:0 "Veteranos Varangianos"
 varangian_veterans_flavor:0 "#F Exploradores, aventureiros, guerreiros e mercenários de todas as colônias nórdicas distantes. Alguns até serviram na Guarda Varangiana.#!"
 vigmen:0 "Vigmen"
 vigmen_flavor:0 "#F Guerreiros na frente apresentam uma parede impenetrável de escudos para proteger arqueiros na retaguarda. Essa tática dissuade skirmishers enquanto permite um avanço constante.#!"
