l_spanish:
 action_can_challenge_to_single_combat:0 "Criminosos Distantes Podem Ser Desafiados"
 action_can_challenge_to_single_combat_HELP:0 "\n\n#help Como um [ruler|E], você não precisa desafiar todos os [criminals|E], e pode ser benéfico esperar até ter a chance de [imprison|E] em vez disso. Tenha cuidado ao desafiar $game_concept_characters$ com alta [prowess|E], já que todos os [trials_by_combat|E] são lutados como [single_combat_fight_plural|E].#!"
 action_can_challenge_to_single_combat_click:0 "#I Clique para desafiar [recipient.GetSheHe]#!"
 action_can_challenge_to_single_combat_combined_group_description:0 "Outros [characters|E] cometeram [crimes|E] contra você ([recipient.GetImprisonmentReasons(actor.Self)]), mas não podem ser [Concept('imprisoned', 'Aprisionados')|E], permitindo que você os desafie para [trials_by_combat|E].$action_can_challenge_to_single_combat_HELP$"
 action_can_challenge_to_single_combat_combined_group_label:0 "Pode desafiar criminosos para $game_concept_trial_by_combat$"
 action_can_challenge_to_single_combat_combined_group_name:0 "Pode desafiar criminosos para $game_concept_trial_by_combat$"
 action_can_challenge_to_single_combat_combined_label:0 "[recipient.GetShortUINameNoTooltip]"
 action_can_challenge_to_single_combat_combined_unimportant:0 "@warning_icon! #X Nenhum dos criminosos é importante para você#!"
 action_can_challenge_to_single_combat_desc:0 "[recipient.GetUIName] cometeu [crimes|E] contra você ([recipient.GetImprisonmentReasons(actor.Self)]), mas não pode ser [imprisoned|E], permitindo que você desafie [recipient.GetHerHim] para um [trial_by_combat|E].$action_can_challenge_to_single_combat_HELP$"
 action_can_challenge_to_single_combat_label:0 "Você pode desafiar [recipient.GetShortUINameNoTooltip] para um $game_concept_trial_by_combat$"
 action_can_challenge_to_single_combat_unimportant:0 "@warning_icon! #X [recipient.GetSheHe|U] não é importante para você#!"
 action_can_make_shieldmaiden:0 "Pode criar Escudeira"
 action_can_make_shieldmaiden_HELP:0 "\n\n#help Ter pelo menos uma [recipient.Custom('ShieldPersonFemaleMale')|U] pode ser muito benéfico. Eles vão melhorar continuamente suas habilidades e podem até mesmo te salvar de um [scheme|E] de [GetScheme('murder').GetTypeName].\n\nNo entanto, você não deve tornar todos da [close_family|E] em [recipient.Custom('ShieldPersonsFemaleMale')|U], a menos que você tenha mais [prestige|E] do que sabe o que fazer com ele.#!"
 action_can_make_shieldmaiden_click:0 "#I Clique para criar [recipient.Custom('ShieldPersonFemaleMale')|U]#!"
 action_can_make_shieldmaiden_combined_group_description:0 "Vários [Concept('close_family', 'Familiares')|E] têm uma alta [prowess|E] e aceitariam se tornar [recipient.Custom('ShieldPersonsFemaleMale')|U]. $action_can_make_shieldmaiden_HELP$"
 action_can_make_shieldmaiden_combined_group_label:0 "Pode criar [recipient.Custom('ShieldPersonsFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_group_name:0 "Pode criar [recipient.Custom('ShieldPersonsFemaleMale')|U]"
 action_can_make_shieldmaiden_combined_label:0 "[recipient.GetShortUINameNoTooltip]"
 action_can_make_shieldmaiden_desc:0 "[recipient.GetUIName] possui habilidades de alta [prowess|E] e aceitaria se tornar uma [recipient.Custom('ShieldPersonFemaleMale')|U].$action_can_make_shieldmaiden_HELP$"
 action_can_make_shieldmaiden_label:0 "Você pode transformar [recipient.GetShortUINameNoTooltip] em [recipient.Custom('ShieldPersonFemaleMale')|U]"
