l_spanish:
 fp1_other_decisions.0001.a.capital:0 "Talvez apenas o povo de [capital_county.GetNameNoTierNoTooltip] e a corte?"
 fp1_other_decisions.0001.a.other:0 "O povo de [fallback_location.GetNameNoTierNoTooltip] mantém a fé bem o suficiente para nos receber."
 fp1_other_decisions.0001.b:0 "Todos os homens e mulheres livres de meu domínio devem vir!"
 fp1_other_decisions.0001.c:0 "Cada [blotter.Custom('LadyLordNoble_GenderPreference')] e plebeu no [blotter.GetPrimaryTitle.GetTierAsNameNoTooltip] está convidado!"
 fp1_other_decisions.0001.d:0 "Pensando melhor, isso é muito caro..."
 fp1_other_decisions.0001.desc:0 "Embora festivais menores sejam realizados em muitas ocasiões ao longo do ano, uma vez a cada década, os [gf_faith.GetAdherentNamePlural] de [blotter.GetPrimaryTitle.GetNameNoTierNoTooltip] se reúnem para uma grande celebração e, mais importante, um grande #EMP sacrifício#!.\n\nEmbora muito sangue seja derramado em honra aos [gf_faith.PantheonTerm], a carne das oferendas é destinada aos fiéis. Uma festa tão rica geralmente resulta em uma comemoração incrível.\n\nClaro, um evento como esse é caro e certamente nem todos os [gf_faith.GetAdherentNamePluralNoTooltip] precisam ser convidados..."
 fp1_other_decisions.0001.prep_continue.tt:0 "As preparações para o [blotter.Custom('GruesomeFestivalName')] continuam..."
 fp1_other_decisions.0001.prep_start.tt:0 "As preparações para o [blotter.Custom('GruesomeFestivalName')] começam..."
 fp1_other_decisions.0001.t:0 "O Grande [blotter.Custom('GruesomeFestivalName')|U]"
 fp1_other_decisions.0002.a:0 "Uma boa variedade de sacrifícios animais será suficiente."
 fp1_other_decisions.0002.animals_only.appeased_humsac_haters:0 "Súditos que não endossam o sacrifício humano não perderão [opinion|E] ou [county_opinion|E]"
 fp1_other_decisions.0002.animals_only.magnificent.opinion:0 "[opinion|E] e [county_opinion|E] ganham com [gf_faith.GetAdherentNamePlural] serão equivalentes ao sacrifício humano"
 fp1_other_decisions.0002.animals_only.magnificent.piety.loss:0 "#valor_negativo [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i] será perdido $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.magnificent.piety:0 "#valor_positivo [THIS.Var('piety_gain_magnificent_animal').GetValue|0]#! [piety_i] será ganho $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.offended_humsac_haters:0 "Súditos que não endossam o sacrifício humano perderão amplamente [opinion|E] e [county_opinion|E]"
 fp1_other_decisions.0002.animals_only.regular.opinion:0 "[opinion|E] e [county_opinion|E] ganham com [gf_faith.GetAdherentNamePlural] serão menores do que com o sacrifício humano"
 fp1_other_decisions.0002.animals_only.regular.piety.loss:0 "#valor_negativo [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i] será perdido $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.animals_only.regular.piety:0 "#valor_positivo [THIS.Var('piety_gain_standard_animal').GetValue|0]#! [piety_i] será ganho $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.b:0 "Traga uma besta ou ave para cada [blotter.Custom('WomanManPerson_GenderPreference')]!"
 fp1_other_decisions.0002.blot_invalidation.costs_recouped.tt:0 "A maioria do meu [gold|E] e todo o meu [prestige|E] foi recuperado"
 fp1_other_decisions.0002.blot_invalidation.tt:0 "[blotter.Custom('GruesomeFestivalName')|U] Forçado a cancelar"
 fp1_other_decisions.0002.c:0 "Tradição importa. [gf_faith.PantheonTerm|U] deve provar sangue humano."
 fp1_other_decisions.0002.d:0 "Somente os melhores sacrifícios serão aceitos: [blotter.Custom('WomanManPerson_GenderPreference')] e animais iguais..."
 fp1_other_decisions.0002.desc.counties_dislike_humsac:0 "há plebeus em meu reino que acham a ideia repugnante,"
 fp1_other_decisions.0002.desc.courtiers_dislike_humsac:0 "há alguns na corte que estão repugnados com a ideia,"
 fp1_other_decisions.0002.desc.fallback:0 "não é estritamente necessário,"
 fp1_other_decisions.0002.desc.intro:0 "Um [blotter.Custom('GruesomeFestivalName')] pode ser tanto um evento grandioso quanto pequeno.\n\nPor tradição, eles incluem tanto sacrifícios humanos quanto de animais. Vários prisioneiros serão oferecidos a [gf_faith.PantheonTerm], talvez incluindo uma escolha especial minha, suas vidas oferecidas em tributo a [gf_faith.PantheonTerm].\n\nEmbora as crenças de [gf_faith.GetNameNoTooltip] exijam isso,"
 fp1_other_decisions.0002.desc.outro:0 "e a cerimônia pode prosseguir com sacrifícios puramente animais se eu quiser evitar controvérsias."
 fp1_other_decisions.0002.desc.vassals_dislike_humsac:0 "há aqueles entre meus vassalos que acham a ideia bárbara,"
 fp1_other_decisions.0002.human_sacrifice.become_cannibal:0 "Você se tornará um [GetTrait('cannibal').GetName( GetNullCharacter )] no [blotter.Custom('GruesomeFestivalName')]"
 fp1_other_decisions.0002.human_sacrifice.magnificent.opinion:0 "[opinion|E] e [county_opinion|E] ganharão com [gf_faith.GetAdherentNamePlural] tão alto quanto pode ser"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety.loss:0 "#negative_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i] será perdido $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.magnificent.piety:0 "#positive_value [THIS.Var('piety_gain_magnificent_human').GetValue|0]#! [piety_i] será ganho $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.optional_victim_picker:0 "Opcionalmente, você pode [designate_chief_sacrifice_article|E] entre seus [prisoners|E]"
 fp1_other_decisions.0002.human_sacrifice.regular.opinion:0 "[opinion|E] e [county_opinion|E] ganham com [gf_faith.GetAdherentNamePlural] serão equivalentes aos sacrifícios animais magníficos"
 fp1_other_decisions.0002.human_sacrifice.regular.piety.loss:0 "#negative_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i] será perdido $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.human_sacrifice.regular.piety:0 "#positive_value [THIS.Var('piety_gain_standard_human').GetValue|0]#! [piety_i] será ganho $fp1_other_decisions.0002.piety_gain.rump$"
 fp1_other_decisions.0002.piety_gain.rump:0 "no [blotter.Custom('GruesomeFestivalName')]"
 fp1_other_decisions.0002.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0003.a:0 "À [gf_faith.HighGodName]! À [gf_faith.FertilityGodName]! À [gf_faith.WealthGodName]!"
 fp1_other_decisions.0003.attendee_became_cannibal:0 "Você participou do banquete canibal de [blotter.GetTitledFirstNamePossessiveNoTooltip]"
 fp1_other_decisions.0003.b.clergy_list:0 "Cada clérigo [gf_faith.GetName] convidado com pelo menos uma [rank|E] de [count|E] e seu [GetPlayer.GetCouncillorPosition('councillor_court_chaplain').GetPositionName]"
 fp1_other_decisions.0003.b.nobility_list:0 "Todos os nobres [gf_faith.GetName] convidados com pelo menos uma [rank|E] de [count|E]"
 fp1_other_decisions.0003.b:0 "Esta parece uma excelente oportunidade para impressionar a nobreza."
 fp1_other_decisions.0003.c:0 "Hora de se misturar com a ralé comum!"
 fp1_other_decisions.0003.d:0 "Vou sair cedo; eu já fiz o suficiente como está."
 fp1_other_decisions.0003.desc.animals.magnificent:0 "uma poderosa coluna de animais sacrificiais é conduzida ao altar.\n\n"
 fp1_other_decisions.0003.desc.animals.regular:0 "uma respeitável parada de animais sacrificiais é levada ao altar.\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.plus_chief:0 "[sacrifice.GetFirstName] é puxado até o altar, o primeiro de uma longa fila de homens e animais que se estende para fora das portas.\n\n"
 fp1_other_decisions.0003.desc.humans.magnificent.sans_chief:0 "um grupo de prisioneiros ameaçadores e magníficos animais são conduzidos ao altar.\n\n"
 fp1_other_decisions.0003.desc.humans.regular.plus_chief:0 "[sacrifice.GetFirstName] é arrastado até o altar, o primeiro de vários prisioneiros e mais animais.\n\n"
 fp1_other_decisions.0003.desc.humans.regular.sans_chief:0 "um bando de prisioneiros aterrorizados são conduzidos em direção ao altar, animais seguindo atrás deles.\n\n"
 fp1_other_decisions.0003.desc.intro.large:0 "Os convidados do [blotter.Custom('GruesomeFestivalName')] são tão numerosos que eles cobrem a área ao redor da [gf_faith.HouseOfWorship], emitindo um rugido cacofônico enquanto"
 fp1_other_decisions.0003.desc.intro.medium:0 "A [gf_faith.HouseOfWorship] está cheia até transbordar com felizes [gf_faith.GetAdherentNamePlural], todos rugindo enquanto"
 fp1_other_decisions.0003.desc.intro.small:0 "Embora o encontro seja pequeno, o clima no [blotter.Custom('GruesomeFestivalName')] é entusiasmado, com felizes [gf_faith.GetAdherentNamePlural] se empurrando e zombando enquanto"
 fp1_other_decisions.0003.desc.outro.faithful:0 "\n\nRealmente, um espetáculo digno do [gf_faith.PantheonTerm]."
 fp1_other_decisions.0003.desc.outro.political:0 "\n\nEu posso não compartilhar da fé, mas súditos felizes fazem um [blotter.GetTitleAsNameNoTooltip] feliz."
 fp1_other_decisions.0003.desc.sacrifice.animal.fallback:0 "Um por um, [blotter.Custom('GruesomeFestivalAnimalPreference')] são trazidos, suas gargantas cortadas rapidamente e seus corpos entregues aos cozinheiros e à multidão faminta."
 fp1_other_decisions.0003.desc.sacrifice.animal.norse:0 "Um por um, [blotter.Custom('GruesomeFestivalAnimalPreference')] são trazidos, estrangulados e sangrados até a morte. A carne vai para as chamas, e depois para o banquete. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter:0 "é nocauteado para deixar o corpo relaxar. O medo estragaria a carne. Então, os [gf_faith.PriestNeuterPlural] descem, cortando a carne suculenta para as panelas de cozimento, mesmo enquanto o próximo [blotter.Custom('SacrificeTerm')] é trazido, ainda gritando."
 fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling:0 "Os seus companheiros de prisão assistem horrorizados enquanto o cadáver é eviscerado, sabendo que sua vez chegará. Talvez eles invejem a morte mais limpa dos animais, que vão direto para as fogueiras de cozimento após a morte."
 fp1_other_decisions.0003.desc.sacrifice.named.cannibals:0 "[sacrifice.GetSheHe|U] é atordoado à força primeiro, $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$."
 fp1_other_decisions.0003.desc.sacrifice.named.fallback:0 "[sacrifice.GetSheHe|U] luta admiravelmente, até que sua garganta é cortada.\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.named.norse:0 "[sacrifice.GetSheHe|U] $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.named.norse_cannibals:0 "[sacrifice.GetSheHe|U] luta inutilmente enquanto [sacrifice.GetSheHe] é estrangulado até a morte e então esvaziado de sangue. $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl:0 "Todo o sangue é coletado em uma tigela e os [gf_faith.PriestNeuterPlural] usam para pintar as paredes do [gf_faith.HouseOfWorship], por dentro e por fora."
 fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation:0 "A carne comestível é cortada para o banquete, enquanto os restos vão para a árvore enforcada do lado de fora, e o próximo [blotter.Custom('SacrificeTerm')] é lançado para fora."
 fp1_other_decisions.0003.desc.sacrifice.norse_throttling:0 "debate-se ferozmente enquanto os [gf_faith.PriestNeuterPlural] sufocam sua vida, a luz em seu/sua [sacrifice.Custom('EyeEyes')] durando até o primeiro animal ser abatido. Corpos humanos para a árvore enforcada, animais para as fogueiras de cozimento."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.cannibals:0 "O primeiro [blotter.Custom('SacrificeTerm')] é arrastado para o altar e atordoado à força, $fp1_other_decisions.0003.desc.sacrifice.generic_cannibal_slaughter$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.fallback:0 "O primeiro humano [blotter.Custom('SacrificeTerm')] continua lutando até que sua garganta seja cortada.\n\n$fp1_other_decisions.0003.desc.sacrifice.generic_human_disemboweling$?"
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse:0 "O primeiro [blotter.Custom('SacrificeTerm')] $fp1_other_decisions.0003.desc.sacrifice.norse_throttling$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.desc.sacrifice.unnamed.norse_cannibals:0 "A primeira vítima luta em vão, e seu estrangulamento é rápido. $fp1_other_decisions.0003.desc.sacrifice.norse_cannibal_excarnation$. $fp1_other_decisions.0003.desc.sacrifice.norse_blood_bowl$."
 fp1_other_decisions.0003.e:0 "Para [gf_faith.HighGodName]! Estou pronunciando isso corretamente?"
 fp1_other_decisions.0003.f:0 "Esses [gf_faith.GetAdherentNamePluralNoTooltip] certamente têm uma fé convidativa..."
 fp1_other_decisions.0003.happy_characters_list:0 "Todos os [gf_faith.GetName] convidados [character|E]"
 fp1_other_decisions.0003.happy_titles_list:0 "Todos os [counties|E] [gf_faith.GetName] convidados"
 fp1_other_decisions.0003.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0003.unhappy_characters_list:0 "Todos os [characters|E] do [realm|E] que não praticam o sacrifício humano"
 fp1_other_decisions.0003.unhappy_titles_list:0 "Todos os [counties|E] do [realm|E] que não praticam o sacrifício humano"
 fp1_other_decisions.0004.a:0 "Os [option_1.GetAdherentNamePlural] podem valer a pena apaziguar..."
 fp1_other_decisions.0004.b:0 "Então os [option_2.GetAdherentNamePlural] realmente me apoiariam?"
 fp1_other_decisions.0004.c:0 "Os festivais [option_3.GetAdjective] têm um certo fascínio."
 fp1_other_decisions.0004.d:0 "Isso seria, no máximo, uma heresia completa!"
 fp1_other_decisions.0004.desc:0 "Há aqueles dentro de minhas terras que acreditam em realizar grandes sacrifícios em homenagem a seus deuses fictícios. Minha própria fé iluminada [blotter.GetFaith.GetAdjective] não endossa tal carnificina, e no entanto uma propriedade curiosa de muitos desses [blotter.Custom('GruesomeFestivalNamePlural')] é que eles dependem da participação ativa do [blotter.GetTitleAsNameNoTooltip].\n\nNão preciso me converter às suas crenças para administrar seus caminhos, mas certamente ganharia muitos amigos entre meus súditos menos iluminados, camponeses e nobres igualmente, concordando em hospedar um grande [blotter.Custom('GruesomeFestivalName')] para sua fé."
 fp1_other_decisions.0004.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0011.a:0 "É apenas educado reservar um dia."
 fp1_other_decisions.0011.b.tt:0 "[blotter.GetFirstNameNoTooltip] pode notar sua ausência eventualmente."
 fp1_other_decisions.0011.b:0 "Maldito seja [blotter.GetFirstNameNoTooltip] e o cavalo em que o mensageiro [blotter.GetHerHim] chegou!"
 fp1_other_decisions.0011.c:0 "A carne sagrada! Mal posso esperar para provar pela primeira vez..."
 fp1_other_decisions.0011.d:0 "Eu irei, mas não vou comer carne humana."
 fp1_other_decisions.0011.desc.cannibal_blot:0 "Como acontece com muitos rituais especiais, o consumo ritual de carne humana seria obrigatório para alguém da minha posição."
 fp1_other_decisions.0011.desc.fallback:0 "Comida, entretenimento e coisas do tipo serão totalmente pagos por [blotter.GetTitledFirstNameNoTooltip]."
 fp1_other_decisions.0011.desc.intro:0 "[blotter.Custom('GruesomeFestivalNamePlural')|U] são uma parte vital da fé [gf_faith.GetName], e [blotter.Custom2('MyCharacterIntroduction', ROOT.Char)] está organizando um desses encontros.\n\nSerá um grande evento, com a presença de todos os [gf_faith.GetAdherentNamePluralNoTooltip] de [blotter.GetPrimaryTitle.GetNameNoTier], nobres e plebeus igualmente."
 fp1_other_decisions.0011.desc.outro:0 "\n\nMesmo que eu esteja ocupado, um emissário explicando minha situação é costumeiro. No entanto, se eu quiser ignorar meu [blotter.GetTitleAsNameNoTooltip], posso não responder de jeito nenhum..."
 fp1_other_decisions.0011.e.tt:0 ""
 fp1_other_decisions.0011.e:0 "Não há chance no [gf_faith.NegativeAfterLife] de eu fazer isso!"
 fp1_other_decisions.0011.t:0 "$fp1_other_decisions.0001.t$"
 fp1_other_decisions.0012.a.decliner_toast.t:0 "[blotter.GetTitledFirstNameNoTooltip] notou sua ausência no [blotter.Custom('GruesomeFestivalName')]."
 fp1_other_decisions.0012.a:0 "Maldição para [decliner_1.GetTitledFirstNameNoTooltip]!"
 fp1_other_decisions.0012.b.all_decliners_list:0 "Todos os que recusaram [vassals|E]"
 fp1_other_decisions.0012.b:0 "Que se dane todos eles!"
 fp1_other_decisions.0012.c.plural:0 "Ah, perda deles."
 fp1_other_decisions.0012.c.singular:0 "Ah, sua perda."
 fp1_other_decisions.0012.desc.intro:0 "Não é incomum que assuntos importantes faltem até mesmo em um grande [blotter.Custom('GruesomeFestivalName')], mas um emissário adequado para explicar o motivo e comparecer em seu lugar é considerado educado.\n\n"
 fp1_other_decisions.0012.desc.multiple_decliners:0 "[decliner_1.GetTitledFirstName] e vários outros estavam"
 fp1_other_decisions.0012.desc.outro:0 "conspicuamente ausente e não enviou mensagem antecipadamente. Isso é um claro insulto à minha autoridade, se não exatamente ilegal."
 fp1_other_decisions.0012.desc.single_decliner:0 "[decliner_1.GetTitledFirstName] estava"
 fp1_other_decisions.0012.t:0 "$fp1_other_decisions.0001.t$: Rostos Ausentes"
 fp1_other_decisions.0021.a.cynical:0 "Se nada mais, isso é uma afronta ao nosso povo!"
 fp1_other_decisions.0021.a.fallback:0 "Como terrível!"
 fp1_other_decisions.0021.a.zealous:0 "Que blasfêmia é essa?!"
 fp1_other_decisions.0021.cheaper_holy_wars.tt:0 "[holy_wars|E] contra [sacrificer.GetShortUIName] agora são significativamente mais baratas"
 fp1_other_decisions.0021.desc.allows_holy_wars:0 "Já as veias dos zelosos [sacrificed_hof.GetFaith.GetAdherentNamePlural] em todos os lugares ardem com a ira justa!\n\nEsse insulto não pode passar impune e toda taverna, fortaleza e palácio onde as palavras de [sacrificed_hof.GetFaith.WarGodName] têm poder, ferve com rumores de guerra sagrada."
 fp1_other_decisions.0021.desc.disallows_holy_wars:0 "Mesmo neste momento difícil, devemos lembrar dos caminhos de [sacrificed_hof.GetFaith.HighGodName], e não derramar sangue desnecessariamente. Nada trará [sacrificed_hof.GetTitledFirstNameNoTooltip] de volta, e [sacrificed_hof.GetSheHe] iria querer que lamentássemos [sacrificed_hof.GetSheHe] de forma justa e pacífica."
 fp1_other_decisions.0021.desc:0 "Notícias aterrorizantes de [sacrificer.GetPrimaryTitle.GetNameNoTierNoTooltip]! Parece que o desprezível [sacrificer.Custom('GetUnbelieverName')], [sacrificer.GetShortUIName], sacrificou a nobre [sacrificed_hof.GetTitledFirstName] para a sua fé repugnante.\n\n"
 fp1_other_decisions.0021.easier_holy_wars.tt:0 "[holy_wars|E] contra [sacrificer.GetShortUIName] requerem menos [piety_levels|E] do que o usual"
 fp1_other_decisions.0021.ghw_target_preference.tt:0 "[great_holy_wars|E] são mais propensas contra [sacrificer.GetShortUIName]"
 fp1_other_decisions.0021.t:0 "A Blasfêmia Definitiva"
 fp1_other_decisions.0022.a.craven:0 "Isso... pode ter sido um erro."
 fp1_other_decisions.0022.a.fallback:0 "Pah, deixe-os vir!"
 fp1_other_decisions.0022.a.pacifists:0 "Hah, talvez [unlucky_guest.GetFaith.HighGodName] me atinja?"
 fp1_other_decisions.0022.desc.allows_holy_wars:0 "Fiéis à sua fé guerreira, muitos deles clamam pela minha cabeça e pregam guerras santas até que meu reino seja varrido da face da Terra."
 fp1_other_decisions.0022.desc.disallows_holy_wars:0 "Fieis à sua fé pacifista, eles parecem contentes em se reunir e oferecer orações silenciosas ao seu [unlucky_guest.GetFaith.HighGodName] em vez de buscar vingança sangrenta."
 fp1_other_decisions.0022.desc:0 "Parece que os seguidores dos [unlucky_guest.GetTitleAsNameNoTooltip] do mundo não gostaram muito do meu sacrifício do seu falso-[unlucky_guest.GetTitleAsNameNoTooltip].\n\n"
 fp1_other_decisions.0022.t:0 "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0023.a:0 "Isso é imperdoável!"
 fp1_other_decisions.0023.b:0 "Que tipo de pessoa [blotter.GetWomanMan] é?!"
 fp1_other_decisions.0023.desc.does_not_have_excommunication:0 "Todos os justos [unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip] pedem que [blotter.GetShortUIName], amaldiçoado seja seu nome, seja expulso da fé."
 fp1_other_decisions.0023.desc.has_excommunication:0 "[blotter.GetShortUIName] foi sumariamente excomungado e suas ações blasfemas foram denunciadas a todos os bons [unlucky_guest.GetFaith.GetAdherentNamePluralNoTooltip]."
 fp1_other_decisions.0023.desc.intro:0 "Os [unlucky_guest.GetTitleAsNameNoTooltip] em todo lugar estão em choque. Nosso amado [unlucky_guest.GetShortUIName] foi sacrificado ao nojento [gf_faith.GetAdherentNamePlural] e, o que é pior, por ordem expressa de um dos nossos.\n\n"
 fp1_other_decisions.0023.desc.outro:0 "Que [unlucky_guest.GetFaith.NegativeAfterLife] em si engula [blotter.GetSheHe]!"
 fp1_other_decisions.0023.t:0 "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0024.a:0 "#EMP O que eu fiz?!#!"
 fp1_other_decisions.0024.b:0 "[unlucky_guest.GetSheHe|U] era apenas uma [unlucky_guest.GetWomanMan], não a divindade em si!"
 fp1_other_decisions.0024.c:0 "Foram meus súditos, não eu!"
 fp1_other_decisions.0024.desc.does_not_have_excommunication:0 "Até o menos observante dos [unlucky_guest.GetFaith.PriestNeuterPlural] não fará contato visual comigo."
 fp1_other_decisions.0024.desc.has_excommunication:0 "Nenhum mandado de excomunhão precisa chegar para que os [unlucky_guest.GetFaith.PriestNeuterPlural] se recusem a ouvir meus pecados."
 fp1_other_decisions.0024.desc.intro:0 "O que me possuíu? Qual serventuário de [unlucky_guest.GetFaith.DevilName] tomou raízes em meu cérebro que eu me permiti publicamente aprovar o sacrifício de [unlucky_guest.GetShortUIName] a ídolos estrangeiros? Minha blasfêmia é a fofoca do jantar de todos os [unlucky_guest.GetFaith.GetAdherentName] justos do mundo!\n\n"
 fp1_other_decisions.0024.desc.outro:0 "Estou perdido e condenado no que diz respeito à [unlucky_guest.GetFaith.GetReligion.GetName]."
 fp1_other_decisions.0024.t:0 "$fp1_other_decisions.0021.t$"
 fp1_other_decisions.0063.desc:0 "[designated_sacrifice.GetTitledFirstNameNoTooltip] morreu antes que [designated_sacrifice.GetSheHe] pudesse ser sacrificado."
 fp1_other_decisions.0063.t:0 "$game_concept_designate_chief_sacrifice_chief_sacrifice$ morreu antes de [ROOT.Char.Custom('GruesomeFestivalName')|U]"
 fp1_other_decisions.0101.a.tt:0 "A pedra rúnica irá falar sobre sua família falecida..."
 fp1_other_decisions.0101.a:0 "[Select_CString( ancestor.IsFemale, 'Minha falecida', 'Meu falecido' )] [ROOT.Char.Custom2('RelationToMeShort',ancestor)], [ancestor.GetFirstNameNoTooltip]."
 fp1_other_decisions.0101.b.tt:0 "A pedra rúnica irá falar sobre suas vitórias na conquista..."
 fp1_other_decisions.0101.b:0 "Talvez [Select_CString( foe.IsFemale, 'minha inimiga derrotada', 'meu inimigo derrotado' )], [foe.GetTitledFirstNameNoTooltip]?"
 fp1_other_decisions.0101.c.tt:0 "A pedra rúnica falará de como você chegou ao poder..."
 fp1_other_decisions.0101.c:0 "Minha ascensão ao trono de [new_title.GetNameNoTierNoTooltip]!"
 fp1_other_decisions.0101.d:0 "Você quer que eu pague #EMP QUANTO#! por uma enorme pedra pintada?"
 fp1_other_decisions.0101.desc:0 "Cada pedra rúnica conta uma mensagem de algum evento significativo na vida do comissionador. Desde o menor camponês até um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] como eu, a pedra registra tudo.\n\nSobre o que falará este monumento?"
 fp1_other_decisions.0101.t.root_title:0 "Rochas Através das Eras"
 fp1_other_decisions.0101.t:0 "$fp1_other_decisions.0101.t.root_title$: Assunto"
 fp1_other_decisions.0111.a:0 "[location_a.GetNameNoTierNoTooltip|U] seria um bom lugar."
 fp1_other_decisions.0111.b:0 "[location_b.GetNameNoTierNoTooltip|U] parece bastante decente?"
 fp1_other_decisions.0111.c:0 "[location_c.GetNameNoTierNoTooltip|U] é uma ótima escolha!"
 fp1_other_decisions.0111.desc.ancestor:0 "Memoriais da família, como [ancestor.GetFirstName], encorajam respeito e lealdade. Eles são melhor colocados em áreas que pensam pouco em mim, onde posso dar exemplo de minha dedicação e servidão a poderes superiores."
 fp1_other_decisions.0111.desc.conquest:0 "Memoriais de vitória, como minha vitória sobre [foe.GetTitledFirstName], são um lembrete constante do glorioso fim de uma guerra. Eles são melhor colocados em áreas que precisam de incentivo para cooperar."
 fp1_other_decisions.0111.desc.intro:0 "Agora que decidi o que colocar em minha pedra rúnica, a questão permanece: onde colocá-la?\n\n"
 fp1_other_decisions.0111.desc.outro:0 "\n\nClaro, uma ou duas opções me ocorrem..."
 fp1_other_decisions.0111.desc.promotion:0 "Monumentos de nobilitação, como minha ascensão a [ROOT.Char.GetTitleAsNameNoTooltip] de [new_title.GetNameNoTierNoTooltip], incentivam as pessoas a servir seu governante através de altos e baixos. Eles são melhor colocados em áreas urbanas, onde mais jovens podem ser inspirados a se apresentar para o levantamento."
 fp1_other_decisions.0111.t:0 "$fp1_other_decisions.0101.t.root_title$: Localização"
 fp1_other_decisions.1000.a:0 "Vejo você em [ROOT.Char.GetFaith.NegativeAfterLife]!"
 fp1_other_decisions.1000.desc:0 "Estou encarando a multidão cantante, todos os olhos fixos em mim. [blotter.GetFirstName] está na frente com um sorriso no rosto, pronto e preparado para acabar com minha vida.\n\n\"Poderoso [blotter.GetFaith.HighGodName]! Aceite este sacrifício!\" [blotter.GetSheHe] grita.\n\nÉ o fim para mim.\n\nA escuridão desce.\n\nAcabou."
 fp1_other_decisions.1000.t:0 "Sacrificado!"
