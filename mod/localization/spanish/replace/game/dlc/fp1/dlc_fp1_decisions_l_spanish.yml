l_spanish:
 elevate_mann_and_the_isles_decision:0 "Elevar o Reino de Mann e as Ilhas"
 elevate_mann_and_the_isles_decision_confirm:0 "À infâmia e imortalidade!"
 elevate_mann_and_the_isles_decision_desc:0 "A $c_isle_of_man$ está unicamente posicionada para atuar como um refúgio para saqueadores nórdicos, com fácil acesso não só às Ilhas Britânicas, mas a toda a Europa Ocidental.\n\nTudo o que precisa é alguém para mostrar a todos os bons vikings o caminho, para realizar seu potencial e pavimentar a ilha com ouro e ferro!"
 elevate_mann_and_the_isles_decision_tooltip:0 "Torne-se o governante pirata mais infame de todos os tempos"
 forge_the_jomsvikings_decision.tt.empty_castle_or_city:0 "Deve ter pelo menos um [castle|E] ou [city|E] vazio, além da [county_capital|E]"
 forge_the_jomsvikings_decision.tt.is_in_correct_region:0 "Está na [GetGeographicalRegion('dlc_fp1_region_non_scandinavian_southern_baltic').GetName] [region|E]"
 forge_the_jomsvikings_decision:0 "Forjar os Jomsvikings"
 forge_the_jomsvikings_decision_confirm:0 "Valhalla apenas para os dignos!"
 forge_the_jomsvikings_decision_desc:0 "Os velhos caminhos estão morrendo. Diariamente, os abraâmicos seduzem nossos plebeus com promessas de vida eterna para todos, nossos aventureiros e colonos adotam deuses estrangeiros onde quer que desembarquem, e até reformistas dentro da Escandinávia querem nos tornar mais semelhantes aos povos da Cruz e da Lua.\n\nChega. Todos os leais [GetPlayer.GetFaith.GetAdherentNamePluralNoTooltip] devem se unir, para se guardarem contra a mudança e a blasfêmia!"
 forge_the_jomsvikings_decision_tooltip:0 "Encontre um grupo de vikings piedosos para defender os velhos caminhos"
 found_capital_of_the_rus_decision:0 "Fundar a Capital dos Rus'"
 found_capital_of_the_rus_decision_before_last_date:0 "A data é 1100.1.1 ou anterior"
 found_capital_of_the_rus_decision_confirm:0 "Uma grande capital para sempre!"
 found_capital_of_the_rus_decision_desc:0 "Nórdicos empreendedores saem da Escandinávia e pelas ricas águas dos ferozes eslavos do leste. Embora inúmeros assentamentos e reinos menores lutem pelo poder, tanto eslavos quanto nórdicos, apenas #EMP um#! pode verdadeiramente representar a unificação dos dois povos..."
 found_capital_of_the_rus_decision_tooltip:0 "Estabeleça sua capital como o verdadeiro lar de todos os Rus'"
 fp1_raise_runestone_vassals:0 "$EFFECT_LIST_BULLET$Todos os [direct_vassals|E] que também usam pedras rúnicas"
 fp1_valid_norse_faith_for_jomsvikings_trigger_tt:0 "O [THIS.Char.GetFaith.GetName] faz parte da [religion|E] [GetReligionByKey('germanic_religion').GetAdjective] e é não-reformada"
 hold_gruesome_festival_decision_blot_name:0 "Realizar Grande Blót"
 hold_gruesome_festival_decision_confirm:0 "Na morte, renascimento."
 hold_gruesome_festival_decision_desc.gf_humsac_practitioner:0 "Já passou da hora de todos os [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] se reunirem para fazer sacrifícios a [ROOT.Char.GetFaith.PantheonTerm]. Esses rituais não apenas unem os fiéis, mas também confirmam meu lugar como [ROOT.Char.GetTitleAsNameNoTooltip] de toda a terra."
 hold_gruesome_festival_decision_desc.non_gf_practioner:0 "Há entre meus súditos aqueles que praticam grandes ritos de sacrifício abençoados por seus [GetPlayer.GetTitleAsNameNoTooltip]. Concordar em realizar uma variante limitada certamente me garantiria a aprovação deles, embora abraçar seus costumes mais... bárbaros possa me render o desprezo daqueles que rejeitam seus modos."
 hold_gruesome_festival_decision_fallback_name:0 "Realizar Grande Sacrifício"
 hold_gruesome_festival_decision_tooltip:0 "Você convida seus súditos a participar de um ritual sagrado e custoso."
 hold_gruesome_festival_decision_tt.piety_gain:0 "#indent_newline:0 Ganhar [piety|E], já que você é um [GetPlayer.GetFaith.GetAdherentName]"
 hold_gruesome_festival_decision_tt.piety_lose:0 "#indent_newline:0 #EMP Perder#! [piety|E], já que você é um [GetPlayer.GetFaith.GetAdherentName]"
 hold_gruesome_festival_decision_tt:0 "Você organiza um grande [Select_CString( Character.IsLocalPlayer, GetPlayer.Custom('GruesomeFestivalName') , '$gruesomefestivalname_festival|q$' )], envolvendo:\n#indent_newline:0 $EFFECT_LIST_BULLET$ Decidir a escala do festival\n#indent_newline:0 $EFFECT_LIST_BULLET$ Selecionar o que sacrificar, inclusive escolhendo um de seus [prisoners|E] como o [designate_chief_sacrifice_chief_sacrifice|E]\n#indent_newline:0 $EFFECT_LIST_BULLET$ Ganhar ou perder [county_opinion|E] e a [opinion|E] de [character|E] dependendo dos [core_tenets|E] da [faith|E] de seus súditos"
 north_sea_kingdom_coastal_modifier:0 "Pax Nórdica"
 raise_stele_decision_ancestor:0 "Você tem um ancestral recentemente falecido"
 raise_stele_decision_confirm:0 "Mas o que gravar?"
 raise_stele_decision_desc:0 "É costumeiro entre os [GetPlayer.GetCulture.GetNameNoTooltip] erguer monumentos esculpidos para comemorar eventos importantes. A morte de um ente querido, a solução de uma disputa, a aquisição de terras e assim por diante. Talvez eu possa me beneficiar de tal rocha..."
 raise_stele_decision_name:0 "Erguer Pedra Rúnica"
 raise_stele_decision_rank:0 "Você ganhou recentemente um título"
 raise_stele_decision_tooltip:0 "Pague pela gravação de uma pedra rúnica em um dos seus condados"
 raise_stele_decision_tt.effects_list:0 "Um de seus [counties|E] receberá um dos seguintes [modifiers|E]:\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_ancestors_strong').GetNameWithTooltip]\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_conquest_strong').GetNameWithTooltip]\n#indent_newline:0 $EFFECT_LIST_BULLET$ [GetModifier('fp1_stele_promotion_strong').GetNameWithTooltip]"
 raise_stele_decision_tt.variable_strength:0 "Todos os modificadores são mais fortes quando erguidos em [cultures|E] que usam pedras rúnicas"
 raise_stele_decision_victory:0 "Você conquistou recentemente território"
 secure_high_kingdom_custom_every_coastal:0 "Cada [province|e] costeira"
 secure_high_kingdom_denmark_held_years:0 "[temp_scope.GetName] mantido por #V 10#! anos #weak (atualmente [SCOPE.ScriptValue('north_sea_held_value')|0V])#!"
 secure_high_kingdom_neustria:0 "Você ganha o [title|E] #V Reino da Nêustria#!"
 secure_high_kingdom_north_sea_custom_powerful_vassals:0 "Cada [powerful_vassal|E]"
 secure_high_kingdom_north_sea_decision:0 "Assegure o Alto Reino do Mar do Norte"
 secure_high_kingdom_north_sea_decision_confirm:0 "Acima de tudo, um Grande Rei!"
 secure_high_kingdom_north_sea_decision_desc:0 "Os reinos de $k_england$, $k_denmark$ e $k_norway$ são uma combinação natural. Ricos, ferozes e unidos pelo comércio e sangue nobre. Se apenas alguém pudesse superar seu individualismo, unindo os três permanentemente..."
 secure_high_kingdom_north_sea_decision_solve_danelaw:0 "$k_danelaw$ atualmente tem [counties|E] [de_jure|E], e $k_england$ deve ser desparticionado primeiro."
 secure_high_kingdom_north_sea_decision_tooltip:0 "Una $k_england$, $k_denmark$ e $k_norway$ em um [realm|E] [de_jure|E]"
 secure_high_kingdom_north_sea_scripted_effect.daneland_reabsorbed.tt:0 "Todos os [duchies|E] [completely_controlled|E] do $k_daneland$ serão [Concept('de_jure_drift_drifted', 'Transferidos')|E] de volta para $k_england$"
 secure_high_kingdom_north_sea_scripted_effect:0 "Você recebe um [strong_hook|E] #weak (Lealdade)#! em [powerful_vassals|E]"
