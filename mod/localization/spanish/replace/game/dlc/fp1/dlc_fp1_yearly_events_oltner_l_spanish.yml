l_spanish:
 bondi_tt:0 "#F Bondí são resilientes e excelentes lutadores nas planícies ou terras cultiváveis de terras estrangeiras#!"
 brand_new_hunting_tools:0 "Novas Ferramentas de Caça"
 brand_new_hunting_tools_desc:0 "Este personagem gastou muito ouro em novos equipamentos de caça."
 fp1_yearly.2000.a.tt:0 "#V Duelo#! para fazer [child_to_leave.GetFirstName] ficar!\n#weak Este duelo NÃO é até a morte.#!\nSe você vencer, ganhará [prestige_i] [prestige|E]\n\nSua [prowess|E]: [prowess_i]#V [parent.GetProwess]#!\n[prowess|E] de [child_to_leave.GetFirstNamePossessive]: [prowess_i]#V [child_to_leave.GetProwess]#!"
 fp1_yearly.2000.a:0 "\"Venha aqui, querido [child_to_leave.Custom('GetDaughterSon')], acredito que é hora de um pouco de #EMP amor duro#.\""
 fp1_yearly.2000.b.failure:0 "[child_to_leave.GetFirstNameNoTooltip] não é convencido pelos seus argumentos"
 fp1_yearly.2000.b.success:0 "[child_to_leave.GetFirstNameNoTooltip] desiste de seus sonhos e esperanças"
 fp1_yearly.2000.b.tt:0 "Fica em sua [court|E]"
 fp1_yearly.2000.b:0 "\"Escute aqui, há #EMP glória# a ser alcançada em casa.\""
 fp1_yearly.2000.c.tt:0 "[child_to_leave.GetFirstName] fica em sua [court|E]"
 fp1_yearly.2000.c:0 "\"Talvez #EMP isso#! faça você esquecer de partir?\""
 fp1_yearly.2000.d.tt:0 "#weak \"...você vai lembrar que pertence a mim.\"#!"
 fp1_yearly.2000.d:0 "\"Você vai voltar, logo você verá...\""
 fp1_yearly.2000.desc:0 "\"Estou partindo, [parent.GetMotherFather]. Eu e [lover_of_child.GetFirstNameNoTooltip] estamos #EMP apaixonados#!!\"\n\nVocê revira os olhos para [child_to_leave.GetFirstNameNoTooltip]. O que seu tolo de [child_to_leave.Custom('GetDaughterSon')] está aprontando agora?#!\n\n\"[lover_of_child.GetFirstNameNoTooltip] e eu buscaremos aventura! O mundo é vasto, e há glória a ser encontrada! Eu quero gritar #EMP '[child_to_leave.GetHouse.GetMotto]'#! para o mundo, até que ele lembre do meu nome!\"\n\nÉ evidente que meu #EMP amado#! [child_to_leave.Custom('GetDaughterSon')] está falando sério. Vou ter que fazer algo."
 fp1_yearly.2000.t:0 "Sede de Aventura"
 fp1_yearly.2000.trigger_failure:0 "Meu duelo contra [child_to_leave.GetFirstNameNoTooltip] foi invalidado"
 fp1_yearly.2003.a:0 "\"[parent.GetMotherFather|U] sabe o que é melhor, [Select_CString( child_to_leave.IsFemale, 'querida', 'querido' )] [child_to_leave.Custom('GirlBoy')].\""
 fp1_yearly.2003.b:0 "\"E termine com aquele '[lover_of_child.GetFirstNameNoTooltip]', também!\""
 fp1_yearly.2003.desc:0 "\"Eu cedo! Eu cedo, [parent.GetMotherFather]! Não aguento mais!\" exclama [Select_CString( child_to_leave.IsFemale, 'minha', 'meu' )] [child_to_leave.Custom('GetDaughterSon')].\n\n\"Eu vou ficar aqui na corte. [lover_of_child.GetFirstNameNoTooltip] não é mais importante para mim do que a minha vida!\" diz [child_to_leave.GetFirstNameNoTooltip], com [lover_of_child.GetFirstNameNoTooltip] parecendo desaprovador.\n\nFinalmente, parece que [child_to_leave.GetFirstNameNoTooltip] está vendo a razão!"
 fp1_yearly.2003.t:0 "Sede de Aventura: Amor Duro"
 fp1_yearly.2004.a:0 "Criança insolente..."
 fp1_yearly.2004.desc:0 "Estou caído, enfraquecido pela luta, enquanto [child_to_leave.GetFirstNameNoTooltip] se aproxima de mim com arma na mão.\n\n\"Eu já disse, estou #EMP saindo#! [parent.GetMotherFather]. Pelos meus problemas, estarei levando um saco do tesouro. Tenho certeza que você entende.\"\n\nNão posso fazer nada além de assistir enquanto meu [child_to_leave.Custom('GetDaughterSon')] sai, com [lover_of_child.GetFirstNameNoTooltip] em um braço e #EMP meu ouro#! segurado no outro."
 fp1_yearly.2004.t:0 "Vontade de Viajar: Derrotado"
 fp1_yearly.2100.a.tt:0 "[lover_1.GetFirstName] e [lover_2.GetFirstName] #V Duelo#! até a morte."
 fp1_yearly.2100.a:0 "Sangrento #EMP emocionante!#! Sim! Lutem por meu amor!"
 fp1_yearly.2100.b.failure:0 "Suas palavras caem em ouvidos surdos"
 fp1_yearly.2100.b.success:0 "Suas palavras amorosas acalmam ambos"
 fp1_yearly.2100.b.tt:0 "[lover_1.GetFirstName] e [lover_2.GetFirstName] se acalmam."
 fp1_yearly.2100.b:0 "Isso é #EMP loucura!#! Eu imploro, por favor, parem com isso imediatamente!"
 fp1_yearly.2100.c.failure:0 "Você não chega a tempo"
 fp1_yearly.2100.c.success:0 "Você separa os briguentos"
 fp1_yearly.2100.c.tt:0 "Você impede [lover_1.GetFirstName] e [lover_2.GetFirstName] de brigar."
 fp1_yearly.2100.c:0 "Eu vou detê-los eu mesmo!"
 fp1_yearly.2100.desc:0 "\"S[Select_CString( lover_2.IsFemale, 'ua', 'eu' )] [lover_2.Custom2('InsultNounSexual', SCOPE.sC('lover_1'))] [lover_2.Custom2('InsultAdjective', SCOPE.sC('lover_1'))]! S[Select_CString( lover_2.IsFemale, 'ua', 'eu' )] [lover_2.Custom2('InsultNoun', SCOPE.sC('lover_1'))] [lover_2.Custom2('InsultAdjective', SCOPE.sC('lover_1'))]! [lover_2.Custom2('InsultSentence', SCOPE.sC('lover_1'))|U], s[Select_CString( lover_2.IsFemale, 'ua', 'eu' )] [lover_2.Custom2('InsultNounSexual', SCOPE.sC('lover_1'))]!\" [lover_1.GetFirstName] grita com toda a força de seus pulmões.\n\nParece que seus amantes estão se pegando.\n\n\"Seu [lover_1.Custom2('PointOfRidicule', SCOPE.sC('lover_2'))] faz [lover_quarrel_target.GetSheHe] se contorcer de repulsa, s[Select_CString( lover_1.IsFemale, 'ua', 'eu' )] [lover_1.Custom2('InsultNounSexual', SCOPE.sC('lover_2'))]. [lover_quarrel_target.GetFirstNameNoTooltip] não poderia amar um[Select_CString( lover_1.IsFemale, 'a', '' )] [lover_1.Custom2('InsultNounSexual', SCOPE.sC('lover_2'))] [lover_1.Custom2('InsultAdjective', SCOPE.sC('lover_2'))] como você! #EMP [lover_quarrel_target.GetSheHe|U] será apenas meu!#!\" [lover_2.GetFirstName] grita, puxando [lover_2.Custom('SignatureWeaponArticle')] [lover_2.Custom('signature_weapon')] de seu cinto...\n\nIsso está prestes a ficar sangrento."
 fp1_yearly.2100.t:0 "Competição Aquecida"
 fp1_yearly.2101.a:0 "Oh, meu [winning_lover.Custom('RomanticComplimentNoun')]! Você sabe como conquistar um [lover_quarrel_target.GetWomanMan]!"
 fp1_yearly.2101.b:0 "[losing_lover.GetFirstNameNoTooltip], não! #EMP Você vai pagar por isso, [winning_lover.GetFirstNameNoTooltip]!#!"
 fp1_yearly.2101.c:0 "Uma aventura amorosa? Por que não."
 fp1_yearly.2101.d:0 "Apenas... me deixe por agora."
 fp1_yearly.2101.desc:0 "\"Agora você é todo meu, m[Select_CString( lover_quarrel_target.IsFemale, 'inha', 'eu' )] [lover_quarrel_target.Custom('RomanticComplimentAdjective')] [lover_quarrel_target.GetFirstNameNoTooltip]! Aquel[Select_CString( lover_2.IsFemale, 'a', 'e' )] [lover_2.Custom2('InsultNounSexual', SCOPE.sC('winning_lover'))] [losing_lover.GetFirstName] nunca mais irá nos separar!\" [winning_lover.GetFirstName] sussurra em uma voz doce enquanto [winning_lover.GetSheHe] coloca seu(a) [winning_lover.Custom('signature_weapon')] no chão.\n\n\"Venha, [Select_CString( lover_quarrel_target.IsFemale, 'minha', 'meu' )] [lover_quarrel_target.Custom('RomanticComplimentAdjective')] [lover_quarrel_target.Custom('RomanticComplimentNoun')]. Essa farsa tem sido cansativa, por que não recuamos para seus [ROOT.Char.Custom('GetChamber')]?\" [winning_lover.GetFirstNameNoTooltip] sugere, sedutoramente."
 fp1_yearly.2101.t:0 "Concorrência acirrada: coração partido"
 fp1_yearly.2200.a.tt:0 "#V Duelo#! Desafie [new_berserker.GetFirstName] para que [new_berserker.GetSheHe] sirva como seu [potential_employer.Custom('KnightCultureNoTooltipLowercase')]!\n#weak Este duelo NÃO é até a morte.#!\nMesmo se você perder, talvez a raiva de [new_berserker.GetFirstNamePossessiveNoTooltip] seja acalmada...\n\nSua [prowess|E]: [prowess_i]#V [potential_employer.GetProwess]#!\n[prowess|E] de [new_berserker.GetFirstNamePossessive]: [prowess_i]#V [new_berserker.GetProwess]#!"
 fp1_yearly.2200.a:0 "Ninguém me chama de covarde, seu [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('new_berserker'))] [new_berserker.Custom2('InsultNoun', ROOT.Char)]!"
 fp1_yearly.2200.b:0 "Eu trarei muitas [new_berserker.Custom('FavoriteTreatDemand')] - se você se juntar às minhas fileiras."
 fp1_yearly.2200.c.failure:0 "[new_berserker.GetFirstNameNoTooltip] causa estragos em sua corte"
 fp1_yearly.2200.c.success:0 "[new_berserker.GetFirstNameNoTooltip] concorda em se juntar às suas fileiras"
 fp1_yearly.2200.c:0 "Nós vamos em uma incursão em breve, por que você não se junta como meu [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')]?"
 fp1_yearly.2200.d.success:0 "[new_berserker.GetFirstNameNoTooltip] é morto"
 fp1_yearly.2200.d:0 "Guardas! Pare aquele [new_berserker.GetWomanMan]!"
 fp1_yearly.2200.desc:0 "\"Eis-me aqui! Eu sou [new_berserker.GetFirstNameNoTooltip], o [ROOT.Char.Custom2('DescriptorNegative', SCOPE.sC('new_berserker'))|U] — tragam-me canecas de cerveja, [new_berserker.Custom('AttractionWomanManMultiple')], e [new_berserker.Custom('FavoriteTreatDemand')]! A menos que vocês ousem tentar minha ira!?\" o [new_berserker.GetWomanMan] grita para a multidão reunida.\n\nEvidentemente, este guerreiro maciço está entediado e procurando encrenca. Talvez sua raiva possa ser melhor usada em minhas fileiras?\n\n\"Não há ninguém que ouse me enfrentar? Covardes! O que eu não daria por uma boa briga...\""
 fp1_yearly.2200.fail.tt:0 "[new_berserker.GetFirstNameNoTooltip] machuca [potential_victim.GetFirstName] em sua fúria!"
 fp1_yearly.2200.t:0 "O Berserker Entediado"
 fp1_yearly.2200.trigger_failure:0 "Meu duelo contra [new_berserker.GetFirstNameNoTooltip] foi invalidado"
 fp1_yearly.2203.a:0 "\"Sinto muito, mas seu caminho termina aqui.\""
 fp1_yearly.2203.b:0 "\"Seria uma honra lutar ao seu lado!\""
 fp1_yearly.2203.c:0 "\"Você causou estragos suficientes. Vá embora, agora.\""
 fp1_yearly.2203.desc:0 "\"Você é mais forte do que parece!\" [new_berserker.GetFirstNameNoTooltip] balbucia.\n\nA [new_berserker.GetWomanMan] jaz ensanguentada no chão, sua raiva saciada... por enquanto.\n\n\"Eu ficaria feliz em lutar ao seu lado, juntos seríamos #EMP imbatíveis!#!\" ele grita."
 fp1_yearly.2203.t:0 "O Berserker Entediado: Fúria Saciada"
 fp1_yearly.2204.a:0 "\"E eu ficaria feliz em tê-lo como amigo!\""
 fp1_yearly.2204.b:0 "\"Por favor, apenas vá embora...\""
 fp1_yearly.2204.desc:0 "\"Sinto muito.\" [new_berserker.GetFirstNameNoTooltip] diz, em um tom emocionado. \"Eu fico com raiva quando estou com fome.\"\n\nO(a) [new_berserker.GetWomanMan] enorme me oferece sua mão para me ajudar a levantar. Sua raiva parece saciada... por enquanto.\n\n\"Eu gostei da nossa luta. Eu ficaria feliz em me juntar a você, amigo.\" ele diz."
 fp1_yearly.2204.t:0 "O Berserker Entediado: Gigante Gentil"
 fp1_yearly.2300.a:0 "Vou trazer os huscarls para minha casa."
 fp1_yearly.2300.b:0 "Os jovens são inexperientes, mas são muitos!"
 fp1_yearly.2300.c:0 "Hora de dobrar o preço da cerveja!"
 fp1_yearly.2300.d:0 "Juntem-se a mim, bravos guerreiros! Eu os levarei à vitória!"
 fp1_yearly.2300.desc:0 "As tavernas de [tavern_location.GetNameNoTier] têm visto uma onda de guerreiros em busca de glória ultimamente.\n\nEntre eles, há um grupo de veteranos experientes e endurecidos em batalha, huscarls procurando uma nova [recruiting_character.Custom('MistressMaster')].\n\nHá também uma multidão de jovens entusiasmados que falam sem parar sobre encontrar a glória em terras estrangeiras.\n\nTalvez eu deva tentar empregar alguns deles?"
 fp1_yearly.2300.t:0 "Buscadores de Glória"
 fp1_yearly.2400.a:0 "O que eu preciso é de um novo cão de caça!"
 fp1_yearly.2400.b:0 "Lanças recém-forjadas e flechas emplumadas com penas de corvo."
 fp1_yearly.2400.c:0 "O que tenho é suficiente. Só preciso de tempo para me preparar."
 fp1_yearly.2400.desc:0 "A natureza está me chamando. Já faz muito tempo desde a última vez que cacei. Lá fora, nas [ROOT.Char.Custom('TerrainType')] de [hunting_province.GetName], há [ROOT.Char.Custom('GetAnimalPlural')] [ROOT.Char.Custom('GetAnimalAdjective')]. Um deles ficaria bem na minha mesa de jantar hoje à noite!\n\nMas algo está faltando. Será que minhas lanças de caça estão velhas e sem corte? Ou falta um companheiro?\n\nDevo me certificar de preparar bem."
 fp1_yearly.2400.eagle:0 "Uma águia de caça me serviria bem!"
 fp1_yearly.2400.free_hunt:0 "Sua próxima [GetActivityType('activity_hunt').GetName] não custará nenhum [gold|E]"
 fp1_yearly.2400.t:0 "Preparativos para a Caçada"
 fp1_yearly.2500.desc:0 "Depois de uma longa caminhada pelas [runestone_location.Custom('TerrainTypeCountyScope')] de [runestone_location.GetNameNoTier], chego ao local da pedra rúnica da minha família. Embora pareça que eu não estou sozinho, meu convidado [deviant_guest.GetTitledFirstName] também está aqui - como [deviant_guest.GetSheHe] encontrou este lugar!?\n\n\"Não é o que parece, meu [ROOT.Char.GetTitleTierName]!\" [deviant_guest.GetSheHe] afirma.\n\nO fato de [deviant_guest.GetSheHe] estar seminu(a), e no processo de se esfregar vigorosamente contra a pedra rúnica da minha família, me diz que é, de fato, exatamente o que parece."
 fp1_yearly.2500.t:0 "Pedra Rúnica Devassa"
 fp1_yearly.2600.a.tt:0 "Tentar se tornar um [GetTrait('berserker').GetName(GetNullCharacter)]\n#weak Pode haver riscos...#!"
 fp1_yearly.2600.a:0 "Deixe-me pegar minha pele de urso!"
 fp1_yearly.2600.b.tt:0 "Desistir da oportunidade de se tornar um [GetTrait('berserker').GetName(GetNullCharacter)]"
 fp1_yearly.2600.b:0 "Não, eu prefiro estar completamente no controle."
 fp1_yearly.2600.desc:0 "\"[ROOT.GetCharacter.GetFirstNameNoTooltip], você é um grande guerreiro, mas seus inimigos #EMP realmente#! te temem?\" diz [berserker_teacher.GetFirstName].\n\nEu já vi [berserker_teacher.GetFirstNameNoTooltip] se transformar em uma fúria inumana no campo de batalha, e vi incontáveis inimigos fugirem diante de sua forma uivante. Testemunhar a berserkergang de [berserker_teacher.GetFirstNamePossessiveNoTooltip] é como testemunhar a fúria do próprio [ROOT.GetCharacter.GetFaith.HighGodName].\n\n\"Junte-se a mim em frente à fogueira. Vamos evocar sua fúria.\" [berserker_teacher.GetSheHe|U] convida."
 fp1_yearly.2600.t:0 "Fúria dos Nórdicos"
 fp1_yearly.2601.a:0 "Mal posso esperar pela próxima batalha!"
 fp1_yearly.2601.b:0 "Isso deve ter sido obra de [ROOT.Char.GetFaith.TricksterGodName]..."
 fp1_yearly.2601.c:0 "Bom, pelo menos me sinto ótimo!"
 fp1_yearly.2601.desc:0 "Sentamos ao redor da fogueira, entoando palavras de grande poder - eu seguro meus dentes e fecho meus olhos. Arrepios correm pelo meu corpo, algo está se agitando dentro de mim... me abraçando.\n\nEu acordo de minha frenesi, "
 fp1_yearly.2601.fail_fall_asleep:0 "Sentindo-me tão revigorado quanto um recém-nascido! [berserker_teacher.GetFirstName] olha para mim com um olhar desaprovador.\n\n\"Teve um cochilo agradável? E eu pensando que você tinha potencial...\" [berserker_teacher.GetFirstNameNoTooltip] diz, sacudindo a cabeça.\n\nEu suponho que meu frenesi foi apenas um sonho!"
 fp1_yearly.2601.success_harm_close_one:0 "[berserker_teacher.GetFirstName] agarrando-me pelos ombros.\n\n\"Volte a si! [harmed_victim.GetFirstName] não é seu inimigo!\" [berserker_teacher.GetFirstNameNoTooltip] grita.\n\nPor [ROOT.GetCharacter.GetFaith.HighGodName], o que eu fiz!?"
 fp1_yearly.2601.success_kill_berserker:0 "O cadáver mutilado de [berserker_teacher.GetFirstNamePossessive] ao meu lado. Olho para meus punhos cerrados, ambos agarrando machados ensanguentados...\n\nPor [ROOT.GetCharacter.GetFaith.HighGodName], o que eu fiz!?"
 fp1_yearly.2601.success_kill_everyone:0 "Sangue está ao meu redor. Todo mundo está morto. #EMP Todo mundo está morto.#!\n\n#EMP O que eu fiz!?#!"
 fp1_yearly.2601.success_no_one_harmed:0 "[berserker_teacher.GetFirstName] ao meu lado.\n\n\"Você convocou uma raiva verdadeiramente impressionante! Aquelas toras não tiveram chance!\" [berserker_teacher.GetFirstNameNoTooltip] sorri.\n\nAparentemente trabalhei em um frenesi durante toda a noite! Pelo menos não ficaremos sem lenha por semanas..."
 glory_seekers:0 "Buscadores de Glória"
 grizzled_veterans:0 "Veteranos Calejados"
 hurt_someone_close_to_me_crime:0 "Magoar Alguém Próximo a Mim"
 huscarls_tt:0 "#F Huscarls são combatentes de linha de frente resistentes capazes de infligir muito dano às tropas mais fracas#!"
 lust_for_adventure:0 "Sede de Aventura"
 lust_for_adventure_desc:0 "Este personagem está com sede de aventura e viagem. Eles provavelmente não voltarão para a corte de seus pais."
 mellowed_spirit:0 "Espírito Apaziguado"
 mellowed_spirit_desc:0 "Este personagem foi convencido por um dos pais de que a aventura não é para eles e que seu lugar é em casa."
