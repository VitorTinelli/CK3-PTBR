l_spanish:
 TRUCE_TRADE_DEAL:0 "\nTrégua assinada em troca do cessar dos saques"
 fp1_trade_events.0000.t:0 "Saque ou Comércio"
 fp1_trade_events.0002.a.accepted:0 "Se sua oferta for aceita"
 fp1_trade_events.0002.a.rejected:0 "Se sua oferta for rejeitada"
 fp1_trade_events.0002.a.tt:0 "Você continua saqueando [county.GetNameNoTierNoTooltip]"
 fp1_trade_events.0002.a:0 "Talvez o(a) [county.GetHolder.GetTitleAsNameNoTooltip] local esteja disposto(a)?"
 fp1_trade_events.0002.b:0 "Uma trégua com o(a) governante [county.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip] poderia ser inestimável..."
 fp1_trade_events.0002.c.tt:0 "$fp1_trade_events.0002.a.tt$"
 fp1_trade_events.0002.c:0 "Sim, provavelmente #EMP poderíamos#! ganhar dinheiro com o comércio. Saqueie mesmo assim."
 fp1_trade_events.0002.d.tt:0 "Você saqueia [county.GetNameNoTierNoTooltip] e se recusa a pensar em negociar em vez de saquear pelo resto de sua vida."
 fp1_trade_events.0002.d:0 "Que tipo de covarde feudal #EMP deixa de#! saquear e ganhar dinheiro?"
 fp1_trade_events.0002.desc:0 "Enquanto eu e minhas tropas nos preparamos para saquear as terras de [county.GetNameNoTierNoTooltip], nossos primeiros batedores relatam de volta.\n\nParece que as cidades locais são ricas, mas muitas são altamente fortificadas e poderíamos ser surpreendidos por exércitos vingativos antes de chegarmos aos alvos mais suculentos.\n\nTudo não está perdido: a arte de um bom saque é explorar oportunidades, e poderíamos talvez negociar comércio e tributo em troca de suspendermos nossas lâminas."
 fp1_trade_events.0002.t:0 "$fp1_trade_events.0000.t$?"
 fp1_trade_events.0003.a.tt_success:0 "Sua oferta é aceita!"
 fp1_trade_events.0003.a:0 "Uma oferta inesperada, mas altamente bem-vinda."
 fp1_trade_events.0003.b.tt_failure:0 "Sua oferta é rejeitada!"
 fp1_trade_events.0003.b:0 "#EMP Negociar#! Com esses bandidos?!"
 fp1_trade_events.0003.desc:0 "Uma horda desordeira de bandidos, piratas e outros canalhas fortemente armados entrou em [county.GetNameNoTierNoTooltip], liderados por [raider.GetFirstName]!\n\nInicialmente, meus batedores pensaram que eles estavam aqui para saquear, mas um emissário de seu [raider.GetTitleAsNameNoTooltip] afirma que eles prefeririam negociar em vez disso. Sua força é rica em espólios, novos e antigos, e isso daria aos moradores locais a chance de comprar produtos exóticos de todo o mundo.\n\nO subtexto é claro. Negociar sob termos preferenciais e eles partirão em paz, ou rejeitar sua oferta e eles tomarão o que quiserem."
 fp1_trade_events.0003.t:0 "$fp1_trade_events.0000.t$?"
 fp1_trade_events.0011.a.accepted:0 "Sua oferta é aceita"
 fp1_trade_events.0011.a.rejected:0 "Sua oferta é rejeitada"
 fp1_trade_events.0011.a:0 "Uma grande oferta!"
 fp1_trade_events.0011.b.tt:0 "O acordo silenciosamente expirará"
 fp1_trade_events.0011.b:0 "Isso já deu o que tinha que dar..."
 fp1_trade_events.0011.desc.first_renewal:0 "Por muitos anos"
 fp1_trade_events.0011.desc.outro:0 "Agora, eu tenho um entendimento com [recipient.GetTitledFirstName]. Meus saqueadores mantêm suas armas em seus cintos nas suas terras, e os seus súditos compram as luxúrias exóticas que tomamos de reinos menos diplomáticos.\n\nOs termos de nosso acordo estão quase chegando ao fim, e muitos entre minha comitiva relutam em desistir de seus convenientes contatos comerciais.\n\nTalvez [recipient.GetFirstNameNoTooltip] esteja aberto a uma extensão?"
 fp1_trade_events.0011.desc.subsequent_renewal:0 "Por décadas"
 fp1_trade_events.0011.t:0 "$fp1_trade_events.0000.t$: Acomodação Confortável"
 fp1_trade_events.0012.a.tt_success:0 "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0012.a:0 "Uma proposta muito agradável!"
 fp1_trade_events.0012.b.tt:0 "$fp1_trade_events.0011.b.tt$"
 fp1_trade_events.0012.b.tt_failure:0 "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0012.b:0 "Eu terminei com esta [raider.GetWomanMan]."
 fp1_trade_events.0012.desc.first_renewal:0 "$fp1_trade_events.0011.desc.first_renewal$"
 fp1_trade_events.0012.desc.outro:0 "Meu acordo com [raider.GetTitledFirstName] permaneceu firme: [raider.GetSheHe] mantém seus cães presos em minhas terras, e meus comerciantes compram os saques que [raider.GetSheHe] rouba de outras regiões.\n\nCom o fim iminente do acordo, [raider.GetFirstNameNoTooltip] entrou em contato para perguntar sobre uma extensão.\n\nPrivadamente, vários dos seus guerreiros mais ricos ofereceram presentes escolhidos se eu continuasse dando a eles acesso gratuito aos nossos mercados, e é #EMP agradável#! não ter que se preocupar com os raides de [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] enfurecidos saqueando o campo..."
 fp1_trade_events.0012.desc.subsequent_renewal:0 "$fp1_trade_events.0011.desc.subsequent_renewal$"
 fp1_trade_events.0012.t:0 "$fp1_trade_events.0011.t$"
 fp1_trade_events.0021.a:0 "Eu poderia usar alguém para contar meu dinheiro..."
 fp1_trade_events.0021.b:0 "Bem-vindo ao meu serviço, [priest.GetFirstNameNoTooltip]!"
 fp1_trade_events.0021.c:0 "E quem está acompanhando você no fundo?"
 fp1_trade_events.0021.d:0 "Sigam em frente, estrangeiros, meu acordo é com [partner.GetFirstNameNoTooltip]."
 fp1_trade_events.0021.desc:0 "Meu acordo comercial com [partner.GetTitledFirstName] garante um fluxo constante de meus comerciantes e nobres visitando as suas terras, vendendo suas mercadorias e importando luxos estrangeiros. Decididamente menos comum é uma expedição de [partner.GetPrimaryTitle.GetNameNoTier] chegando em [ROOT.Char.GetPrimaryTitle.GetNameNoTier], muitas vezes algo como um evento em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]. Pode ser raro ver tantos estrangeiros distantes com as mãos desamarradas. Os líderes de tal expedição conseguiram uma audiência para pedir por patronato: um eloquente [priest.GetFaith.PriestNeuter] e um comerciante perspicaz."
 fp1_trade_events.0021.t:0 "$fp1_trade_events.0000.t$: Visitantes de Longe"
 fp1_trade_events.0031.a:0 "As espadas[warrior.GetWomenMen] de [raider.GetPrimaryTitle.GetNameNoTierNoTooltip] são lendárias!"
 fp1_trade_events.0031.b:0 "Vá embora, bandido."
 fp1_trade_events.0031.desc:0 "Os saqueadores de [raider.GetTitledFirstNameNoTooltip] são um grupo temível, o suficiente para que eu seja frequentemente grato por contarmos um com o outro como amigos cautelosos em vez de inimigos sanguinários. Um dos mais #EMP ferozes#! dos seus pequenos terrores é [warrior.GetFirstName], um saqueador de grande reputação. Quando [warrior.GetSheHe] pediu uma audiência, eu estava meio esperando uma tentativa de assassinato, mas estou #EMP agradavelmente#! surpreso ao descobrir que o jovem ambicioso guerreiro deseja oferecer seus serviços."
 fp1_trade_events.0031.t:0 "$fp1_trade_events.0021.t$"
 fp1_trade_events.0041.a.advanced:0 "Eles poderiam construir um palácio no estilo [partner.GetCulture.GetNameNoTooltip]?"
 fp1_trade_events.0041.a.fallback:0 "Mãos habilidosas são sempre bem-vindas..."
 fp1_trade_events.0041.a.offer_accepted:0 "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0041.a.offer_rejected:0 "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0041.b:0 "Vamos manter isso informal."
 fp1_trade_events.0041.desc:0 "Meu acordo com [partner.GetTitledFirstName] é mutuamente benéfico, mas às vezes me perguntou se ele está atingindo todo o seu potencial. Minhas terras se beneficiariam do toque de [partner.GetHerHis] mestres de obras e carpinteiros veteranos, e embora [partner.GetSheHe] esteja a salvo dos meus saqueadores, muitos outros não têm tal acordo.\n\nCom um pequeno gasto conjunto para facilitar o trânsito de nossos servos, poderíamos resolver ambos os problemas juntos: [partner.GetFirstNameNoTooltip] envia artesãos hábeis para me servir por um tempo e, em troca, empresto a [partner.GetHerHim] saqueadores idosos e colonos ávidos como conselheiros para ajudar a manter as terras de [partner.GetHerHis] seguras."
 fp1_trade_events.0041.foreign_architects_growth.tt:0 "Seus [counties|E] do [domain|E] subdesenvolvido(s)"
 fp1_trade_events.0041.foreign_architects_no_growth.tt:0 "Seus [counties|E] do [domain|E] com pelo menos 15 de [development|E]"
 fp1_trade_events.0041.partner.benefiting_counties.tt:0 "[counties|E] no [duchy|E] nomeado"
 fp1_trade_events.0041.partner_gets_raid_aid.tt:0 "Um dos [duchies|E] vulneráveis de [partner.GetFirstNamePossessiveNoTooltip] se torna mais difícil de [Concept('raid', 'Saquear')|E]"
 fp1_trade_events.0041.raider_gets_civic_aid.tt:0 "O [domain|E] de [raider.GetFirstNamePossessiveNoTooltip] ganha crescimento em [development|E] e descontos em construção"
 fp1_trade_events.0041.t:0 "$fp1_trade_events.0000.t$: Beligerantes com Benefícios"
 fp1_trade_events.0051.a:0 "[option_1.GetNameNoTierNoTooltip] poderia usar alguns especialistas..."
 fp1_trade_events.0051.b:0 "[option_2.GetNameNoTierNoTooltip] pode ser um bom lugar para eles?"
 fp1_trade_events.0051.c:0 "Acho que prefiro fortalecer [option_3.GetNameNoTierNoTooltip]."
 fp1_trade_events.0051.d:0 "Que proposta ultrajante!"
 fp1_trade_events.0051.desc:0 "Meu parceiro comercial ocasional, [raider.GetTitledFirstName], enviou notícias de uma oferta intrigante. Embora seja verdade que minhas terras estão seguras contra saqueadores [raider.GetHerHis], o mesmo não se aplica a muitos outros criminosos e vagabundos, ao passo que as terras de [raider.GetHerHis] são pobres e subdesenvolvidas.\n\nSe ambos arcarmos com os custos de viagem de nossos servos, [raider.GetFirstNameNoTooltip] sugere um tipo de programa de intercâmbio: guerreiros veteranos e colonos das terras de [raider.GetHerHis] serão enviados para ajudar a proteger uma das minhas fronteiras vulneráveis contra ladrões menos táteis, e pedreiros e carpinteiros habilidosos do meu reino servirão por um período no domínio de [raider.GetHerHis]."
 fp1_trade_events.0051.offer_accepted:0 "$fp1_trade_events.0011.a.accepted$"
 fp1_trade_events.0051.offer_rejected:0 "$fp1_trade_events.0011.a.rejected$"
 fp1_trade_events.0051.t:0 "$fp1_trade_events.0041.t$"
 fp1_trade_events.1131.a:0 "Nunca! De volta para o seu inferno congelado, escória!"
 fp1_trade_events.1131.b:0 "Se é terra que eles querem, por que não dar a eles?"
 fp1_trade_events.1131.c.tt:0 "Você paga um gafol diretamente às tropas de [attacker.GetFirstNamePossessiveNoTooltip] para que elas se dissolvam."
 fp1_trade_events.1131.c:0 "Na minha experiência, os soldados preferem ouro a glória..."
 fp1_trade_events.1131.d.tt:0 "Você luta contra os Nords à moda antiga"
 fp1_trade_events.1131.d:0 "Vamos banir esses invasores como sempre fizemos."
 fp1_trade_events.1131.desc:0 "Uma horda de piratas desconexos, homens livres sem terra, filhos menores desesperados e outros delinquentes diversos se juntaram a [attacker.GetFirstName] em sua proposta de ataque aos meus domínios.\n\nEmbora o tamanho da força seja formidável, eles carecem de disciplina ou lealdade, com cada mercenário caçado focado exclusivamente no que podem conseguir da guerra, em primeiro lugar e acima de tudo.\n\nAo contrário de um inimigo convencional, pode ser possível simplesmente lidar diretamente com os invasores. Talvez um acordo possa ser feito..."
 fp1_trade_events.1131.t:0 "A Ameaça Northerner"
 fp1_trade_events.1171.a:0 "[partner.GetSheHe|U] #EMP faz#! um argumento bastante convincente..."
 fp1_trade_events.1171.b.tt:0 "Todos os efeitos acima, além de..."
 fp1_trade_events.1171.b:0 "Que gesto bonito! Para uma amizade eterna!"
 fp1_trade_events.1171.c.cynical:0 "Ah, eu esperava um suborno melhor do que isso."
 fp1_trade_events.1171.c.fallback:0 "Nenhum suborno pode me tentar a abandonar ao [raider.GetFaith.GetNameNoTooltip]."
 fp1_trade_events.1171.desc:0 "Apesar de ter começado sob circunstâncias #EMP incomuns#!, meu relacionamento com [partner.GetTitledFirstName] só se fortaleceu com o tempo.\n\nMais forte do que eu imaginava, parece que sua última carta expressou uma sincera preocupação pelo destino da minha alma.\n\nNum esforço para me induzir a me converter para o [partner.GetFaith.GetName], [partner.GetFirstNameNoTooltip] está oferecendo a mão da [prospective_spouse.Custom('GetDaughterSon')], uma grande cerimônia para me dar as boas-vindas à fé e #EMP e#! um belo dote."
 fp1_trade_events.1171.t:0 "$fp1_trade_events.0000.t$: Uma Mão Santa Auxiliadora"
