l_spanish:
 fp1_ep1_tbc.0101.e.tt:0 "[knight_alternative.GetTitledFirstName] lutará por você"
 fp1_ep1_tbc.0101.e:0 "Meu $champion_court_position$ já designado, [knight_alternative.GetTitledFirstNameNoTooltip], me representará."
 fp1_tbc.0000.t:0 "Duelo a Golpes"
 fp1_tbc.0001.a.tt:0 "O [trial_by_combat|E] começa!"
 fp1_tbc.0001.a:0 "Que o melhor [actor.GetWomanMan] vença."
 fp1_tbc.0001.desc.intro:0 "Chego no local designado perto de [duel_location.GetBaseNameNoTier] a tempo e encontro [champion.GetTitledFirstName] já me esperando, junto com um pequeno grupo de testemunhas."
 fp1_tbc.0001.desc.outro:0 "\n\nAs formalidades são breves. Todos sabemos por que estamos aqui e estamos muito além do ponto de falar. As armas são distribuídas e nossos grupos de segurança recuam para observar de uma distância segura."
 fp1_tbc.0001.desc.recipient_fighting:0 "\n\nO que quer que [champion.GetSheHe] possa ser, [champion.GetFirstNameNoTooltip] está apto a lutar e disposto a arriscar um encontro entre eu [champion.GetWomanMan] e [actor.GetWomanMan]."
 fp1_tbc.0001.desc.recipient_has_champion:0 "Como [recipient.GetTitledFirstName] está incapacitado para lutar [recipient.GetHerselfHimself], [champion.GetFirstNameNoTooltip] concordou em ser o campeão [recipient.GetHerHim]."
 fp1_tbc.0001.t:0 "$fp1_tbc.0000.t$: [duel_location.GetBaseNameNoTierNoTooltip]"
 fp1_tbc.0001.trigger_failure.actor:0 "Meu [trial_by_combat_trial|E] contra [recipient.GetFirstNameNoTooltip] foi invalidado."
 fp1_tbc.0001.trigger_failure.actor_puppeteer:0 "A [trial_by_combat_trial|E] de [puppet_or_actor.GetShortUIName] contra [recipient.GetFirstNameNoTooltip] foi invalidada"
 fp1_tbc.0001.trigger_failure.recipient:0 "Meu [trial_by_combat_trial|E] contra [actor.GetFirstNameNoTooltip] foi invalidado."
 fp1_tbc.0021.trigger_failure.actor:0 "$fp1_tbc.0001.trigger_failure.actor$"
 fp1_tbc.0021.trigger_failure.actor_puppeteer:0 "$fp1_tbc.0001.trigger_failure.actor_puppeteer$"
 fp1_tbc.0021.trigger_failure.recipient:0 "$fp1_tbc.0001.trigger_failure.recipient$"
 fp1_tbc.0031.a:0 "Que [recipient.Custom2('InsultNoun', SCOPE.sC('actor'))] [recipient.Custom2('InsultAdjective', SCOPE.sC('actor'))]!"
 fp1_tbc.0031.desc:0 "Luta #EMP você#!? Talvez devesse considerar se aposentar e virar um bobo da corte. Não há nenhuma chance no [recipient.GetFaith.NegativeAfterLife].\n\nSinta-se à vontade para continuar enviando mais provocações por escrito para [recipient.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 fp1_tbc.0031.opening:0 "[recipient.Custom2('AppropriateGreeting',actor)]"
 fp1_tbc.0031.toast_puppeteer:0 "[recipient.GetShortUIName] recusou o desafio de julgamento por combate de [puppet_or_actor.GetShortUINamePossessive]"
 fp1_tbc.0041.a:0 "A justiça foi feita."
 fp1_tbc.0041.desc.intro:0 "Descansando tranquilamente de volta em [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], exulto em meu sucesso, minha [actor.Custom('signature_weapon')] repousando em meu colo.\n\n"
 fp1_tbc.0041.desc.opponent_died:0 "O sangue de [champion.GetTitledFirstNamePossessive] ainda gruda em sulcos e entalhes frescos ao longo do [actor.Custom('SignatureWeaponEndType')] da arma, me lembrando dos últimos momentos da [recipient.GetWomanMan]."
 fp1_tbc.0041.desc.opponent_lives.recipient_fighting:0 "As dores e dores satisfatórias que se espalham por todo o meu corpo me lembram de pequenos momentos na luta, pequenas vitórias e derrotas ferozmente lutadas, cada uma levando à perda de [recipient.GetTitledFirstNamePossessive]."
 fp1_tbc.0041.desc.opponent_lives.recipient_has_champion:0 "Num mundo ideal, eu teria sido capaz de desferir o golpe vencedor diretamente em [recipient.GetTitledFirstName]. Infelizmente, não foi possível; bater [champion.GetTitledFirstName] até ficar uma polpa teria que bastar."
 fp1_tbc.0041.desc.outro:0 "\n\nOntem, colocamos nossa disputa diante de [actor.GetFaith.PantheonTerm], e [actor.GetFaith.PantheonTerm] respondeu sabiamente."
 fp1_tbc.0041.desc.reward.gold:0 "\n\nUm saco de prata descansa contra minha canela, o peso satisfatório é um testemunho da justiça bem feita. Eu contei cada moeda, uma por uma, na frente de #EMP todos#! antes de voltarmos para casa."
 fp1_tbc.0041.desc.reward.humiliation:0 "\n\nA longa e arrastada desculpa, a humilhação, tudo testemunhado por um bando de poetas contratados... simplesmente #EMP glorioso#!. Pode levar anos até que [recipient.GetFirstNameNoTooltip] se recupere dessa humilhação."
 fp1_tbc.0041.desc.reward.weak_hook:0 "\n\nLevou uma hora ou mais para que o último dos juramentos fosse prestado diante de nossas testemunhas reunidas. Um dia, eu vou invocar esses juramentos e receber meu pagamento integral."
 fp1_tbc.0041.t:0 "$fp1_tbc.0000.t$: Vitória!"
 fp1_tbc.0041.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] venceu o julgamento por combate contra [recipient.GetShortUIName]"
 fp1_tbc.0051.a:0 "Pah, não houve justiça aqui."
 fp1_tbc.0051.desc.intro:0 "Como isso chegou a esse ponto? Eu fui diante de [actor.GetFaith.PantheonTerm] para buscar #EMP justiça#!, e sou recompensado com sofrimento e humilhação. Não disse uma palavra durante toda a viagem de volta para [actor.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\n"
 fp1_tbc.0051.desc.opponent_lives.recipient_fighting:0 "Não entendo como [recipient.GetTitledFirstName] me venceu. Eu estava no #EMP meio#!. Eu era #EMP suposto#! a vencer, esse é o ponto de um $game_concept_trial_by_combat$."
 fp1_tbc.0051.desc.opponent_lives.recipient_has_champion:0 "Em uma luta justa eu teria #EMP obviamente#! vencido [recipient.GetFirstName]! Maldição [champion.GetTitledFirstName], e essas tradições limitantes!"
 fp1_tbc.0051.desc.outro:0 "\n\nAgora o mundo todo considera nossos problemas resolvidos e a justiça ter sido aplicada."
 fp1_tbc.0051.t:0 "$fp1_tbc.0000.t$: Derrota!"
 fp1_tbc.0051.toast_puppeteer:0 "[puppet_or_actor.GetShortUIName] perdeu o julgamento por combate contra [recipient.GetShortUIName]"
 fp1_tbc.0101.a.tt:0 "[knight_best.GetTitledFirstName] lutará por você"
 fp1_tbc.0101.a:0 "[knight_best.GetTitledFirstNameNoTooltip] está entre os maiores de meus $knight_culture_player_plural_no_tooltip_lowercase$!"
 fp1_tbc.0101.b.tt:0 "[knight_alternative.GetTitledFirstName] lutará por você"
 fp1_tbc.0101.b:0 "[knight_alternative.GetTitledFirstNameNoTooltip] é uma boa alternativa..."
 fp1_tbc.0101.bout_moves_forward:0 "A luta segue em frente..."
 fp1_tbc.0101.c.tt:0 "[knight_exotic.GetTitledFirstName] lutará por você"
 fp1_tbc.0101.c:0 "Dizem que [knight_exotic.GetTitledFirstNameNoTooltip] é especialista em combate?"
 fp1_tbc.0101.d.tt:0 "[knight_opinion.GetTitledFirstName] lutará por você"
 fp1_tbc.0101.d:0 "O amor de [knight_opinion.GetTitledFirstNameNoTooltip] me protegerá."
 fp1_tbc.0101.desc:0 "Concordei com o pedido de [actor.GetTitledFirstNamePossessive] para um $game_concept_trial_by_combat$, mas seria inapropriado para mim lutar pessoalmente com [actor.GetSheHe].\n\nA tradição exige que eu escolha um campeão para lutar em meu nome, mas quem escolher?"
 fp1_tbc.0101.t:0 "$fp1_tbc.0000.t$: Selecionando um Campeão"
 fp1_tbc.0111.a:0 "$fp1_tbc.0041.a$"
 fp1_tbc.0111.desc.intro:0 "[recipient.GetFaith.PantheonTerm|U] sorriu calorosamente para mim ontem!"
 fp1_tbc.0111.desc.opponent_died.recipient_fighting:0 "\n\nFechando os olhos, ainda posso sentir a adrenalina fluindo pelo meu sistema, músculos tremendo com o fantasma da luta, congelados no instante em que a vida de [actor.GetTitledFirstNamePossessive] foi interrompida e minha vitória assegurada."
 fp1_tbc.0111.desc.opponent_lives.recipient_fighting:0 "\n\nNão só pude bater em [actor.GetFirstName] até deixá-lo ensanguentado por sua temeridade, mas também provei conclusivamente que suas acusações caluniosas eram completamente infundadas."
 fp1_tbc.0111.desc.opponent_lives.recipient_has_champion:0 "\n\nAssistir a [champion.GetFirstName] espancar [actor.GetFirstName] até que ele ficasse quase morto foi ainda mais doce sabendo que a sua vitória me absolve de toda culpa."
 fp1_tbc.0111.desc.outro:0 "\n\nTalvez o próximo tolo pense duas vezes antes de desafiar [recipient.GetTitledFirstNameNicknamedNoTooltip] para uma luta!"
 fp1_tbc.0111.t:0 "$fp1_tbc.0000.t$: Vitória!"
 fp1_tbc.0121.a:0 "$fp1_tbc.0051.a$"
 fp1_tbc.0121.desc.champion_lives.recipient_fighting:0 "As dores e cortes que percorrem meu corpo são testemunho disso, cada um um presente da [actor.GetFirstNamePossessive] [actor.Custom('signature_weapon')]. Tenho sorte de estar vivo."
 fp1_tbc.0121.desc.champion_lives.recipient_has_champion:0 "Quando escolhi [champion.GetTitledFirstName], senti-me tão certo de que [champion.GetSheHe] venceria [actor.GetTitledFirstName], mas [champion.GetSheHe] teve apenas sorte de estar vivo."
 fp1_tbc.0121.desc.intro:0 "[recipient.GetFaith.PantheonTerm|U] não sorriu para mim ontem."
 fp1_tbc.0121.desc.outro:0 "\n\nA vitória foi para um tolo e um mendigo."
 fp1_tbc.0121.desc.reward.gold:0 "\n\nQuando [actor.GetFirstNameNoTooltip] pegou sua prata, [actor.GetSheHe] insistiu em parar para contá-la, moeda por moeda, nos obrigando a assistir enquanto eu me deleitava com o desgosto de minha comitiva."
 fp1_tbc.0121.desc.reward.humiliation:0 "\n\nLer a \"desculpa\" confusa de [actor.GetFirstNamePossessiveNoTooltip] levou uma eternidade, meus dentes rangendo o tempo todo enquanto eu engasgava com as palavras. Os seus poetas contratados simplesmente riam ao fundo, registrando cada uma das minhas expressões na memória."
 fp1_tbc.0121.desc.reward.weak_hook:0 "\n\nPareceu uma hora até que o último dos juramentos de dívida fosse feito e selado na frente de nossas testemunhas. Algum dia, [actor.GetFirstNameNoTooltip] voltará para cobrar a dívida."
 fp1_tbc.0121.t:0 "$fp1_tbc.0000.t$: Derrota!"
