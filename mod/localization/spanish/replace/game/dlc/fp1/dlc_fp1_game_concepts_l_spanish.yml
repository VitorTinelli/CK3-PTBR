l_spanish:
 game_concept_designate_chief_sacrifice:0 "Designar Sacrifício do Chefe"
 game_concept_designate_chief_sacrifice_article:0 "Designar um Sacrifício do Chefe"
 game_concept_designate_chief_sacrifice_chief_sacrifice:0 "Sacrifício do Chefe"
 game_concept_designate_chief_sacrifice_desc:0 "Ao realizar um grande festival sacrificial, [characters|E] podem designar um de seus [prisoners|E] para ser o sacrifício principal. Este $game_concept_prisoner$ é morto primeiro e pode fazer com que o personagem que realiza o sacrifício ganhe mais [piety|E].\n\nSacrifícios preferíveis são:\n$EFFECT_LIST_BULLET$ $game_concept_characters$ sem terra cuja [faith|E] seja [faith_hostile|L] ou [faith_evil|L]\n$EFFECT_LIST_BULLET$ $game_concept_characters$ [landed|E] de pelo menos uma [rank|E] de [count|E]\n$EFFECT_LIST_BULLET$ [heads_of_faith|E] (embora isso possa ter repercussões)"
 game_concept_trial_by_combat:0 "Julgamento por Combate"
 game_concept_trial_by_combat_combat:0 "Combate"
 game_concept_trial_by_combat_desc:0 "Em algumas [cultures|E], questões que não podem ser resolvidas por palavras ou guerra são motivo para um $game_concept_trial_by_combat$ em vez disso. Se aceito, os dois [characters|E] se envolvem em um [single_combat_duel|E] para um acordo pré-selecionado. Se a parte ofensiva vencer, ela prova sua inocência.\n\nOs requisitos gerais para tal $game_concept_trial_by_combat_trial$ são:\n$EFFECT_LIST_BULLET$Ambos devem ser de uma cultura válida.\n$EFFECT_LIST_BULLET$Você deve ter uma [imprisonment_reason|E] contra eles (que será usada).\n$EFFECT_LIST_BULLET$Eles não devem ser seu [liege|E], [vassal|E], nem o [guest|E] ou [courtier|E] de você ou de um de seus $game_concept_vassals$.\n\n$game_concept_characters$ que não são capazes de lutar podem ser desafiados desde que sejam [rulers|E], nomeando um [knight|E] para lutar em seu lugar.\n\nUm $game_concept_trial_by_combat_combat$ só pode optar por ser lutado até a [character_death_death|E] se a parte ofendida for [tribal|E] e ambos $game_concept_characters$ estiverem lutando pessoalmente no $game_concept_single_combat_duel$; se a parte ofensiva tiver que nomear um campeão para lutar em seu nome, então a $game_concept_character_death_death$ não é uma opção."
 game_concept_trial_by_combat_trial:0 "Julgamento"
 game_concept_trials_by_combat:0 "Julgamentos por Combate"
 game_concept_varangian_adventure:0 "Aventura Varangiana"
 game_concept_varangian_adventure_adventure:0 "Aventura"
 game_concept_varangian_adventure_desc:0 "Este é um tipo especial de [war|E], em que o atacante pretende mover seu [realm|E] para o [war_target|E] inteiro.\n\nSe vencerem, eles anexarão imediatamente os [counties|E] apropriados e moverão sua [capital|E] para lá. Seus antigos vassalos se tornarão independentes e seus antigos $game_concept_counties$ serão dados a senhores da guerra locais em ascensão. As $game_concept_varangian_adventures$ estão disponíveis #EMP APENAS#! para [duke|E] e [rulers|E] de $game_concept_count$ de [title_tier|E] progressivamente mais caros a cada $game_concept_varangian_adventure_adventure$ bem-sucedida.\n\nEste [casus_belli|E] #EMP NUNCA#! está disponível após a [era|E] $culture_era_tribal$ e não pode ser usado contra outras [cultures|E] que possam $game_concept_varangian_adventure_adventure$ ou contra $game_concept_rulers$ vizinhos.\n\n$north_germanic_group_collective_noun$ lançando sua primeira $game_concept_varangian_adventure$ recebem um bônus de até [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] [special_troops|E], sendo o valor aumentado com cada condado de mesma [faith|E] e mesma [culture|E] completamente controlado dentro de [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName]."
 game_concept_varangian_adventures:0 "Aventuras Varangianas"
 game_concept_varangian_adventuring:0 "Aventurando"
