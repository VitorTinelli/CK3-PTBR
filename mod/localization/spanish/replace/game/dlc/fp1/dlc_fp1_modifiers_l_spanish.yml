l_spanish:
 capital_of_rus_misc_benefits_modifier:0 "Capital Varangiana"
 capital_of_rus_misc_benefits_modifier_desc:0 "Este assentamento é o centro regional dos eslavos e nórdicos, e desfruta de amplos benefícios por ser o lar de inúmeras bandas de aventureiros, conquistadores e piratas."
 capital_of_rus_opinion_modifier:0 "Uma Capital em Crescimento"
 capital_of_rus_opinion_modifier_desc:0 "A constante entrada de bens, comerciantes e escravos para este condado deixou seu povo totalmente satisfeito."
 commoners_grand_sacrifice_fp1_modifier:0 "Foi ao Grande Sacrifício do Povo"
 commoners_grand_sacrifice_fp1_modifier_desc:0 "Os camponeses deste condado ainda falam sobre como se misturaram livremente com a nobreza no último grande banquete realizado em honra de seus deuses."
 defiant_high_king_conversion_boost_modifier:0 "Alto-Rei Desafiante"
 defiant_high_king_conversion_boost_modifier_desc:0 "Este personagem adora os Deuses Antigos e fará qualquer coisa para mostrar que outros também deveriam.\n\nSignificativo impulso à velocidade de [convert_county|E] contra [faiths|E] [organized|E]"
 defiant_high_queen_conversion_boost_modifier:0 "Alta-Rainha Desafiante"
 defiant_high_queen_conversion_boost_modifier_desc:0 "$defiant_high_king_conversion_boost_modifier_desc$"
 draugr_healthy_hiking_fp1_modifier:0 "Caminhadas Saudáveis"
 draugr_healthy_hiking_fp1_modifier_desc:0 "Este personagem passou uma quantidade imensa de tempo caminhando sem sucesso pelos terrenos selvagens de seu reino, caçando monstros."
 draugr_monstrous_bear_fp1_modifier:0 "Terras Selvagens Inseguras"
 draugr_monstrous_bear_fp1_modifier_desc:0 "Um urso colossal ataca aleatoriamente neste condado, às vezes levando apenas uma vaca, outras vezes assassinando famílias inteiras."
 draugr_monstrous_wolfpack_fp1_modifier:0 "Uivos na Noite"
 draugr_monstrous_wolfpack_fp1_modifier_desc:0 "Uma alcateia anormalmente faminta e agressiva de lobos ronda as terras selvagens deste condado, rasgando o gado e os viajantes solitários em pedaços."
 draugr_nithing_fp1_modifier:0 "Fora-da-lei Fantasmagórico"
 draugr_nithing_fp1_modifier_desc:0 "Alguns os chamam de um cadáver ambulante, outros apenas de um ladrão silencioso, mas todos concordam que um fantasma cleptomaníaco assedia os moradores locais."
 draugr_nothing_found_fp1_modifier:0 "Camponeses Supersticiosos"
 draugr_nothing_found_fp1_modifier_desc:0 "Apesar dos melhores esforços de seu senhorio para provar o contrário, a população local insiste que são perseguidos pelos mortos-vivos ressuscitados."
 draugr_remedies_failed_fp1_modifier:0 "Draugr Assombra os Locais"
 draugr_remedies_failed_fp1_modifier_desc:0 "Apesar dos melhores esforços dos vivos, este condado está infestado de pragas, maldições e infortúnios."
 draugr_remedies_succeeded_fp1_modifier:0 "Draugr Expulso"
 draugr_remedies_succeeded_fp1_modifier_desc:0 "De uma forma ou de outra, o cadáver ressuscitado que certamente assombrou este condado foi eliminado."
 embraced_local_traditions_modifier:0 "Abraçou as Tradições Locais"
 embraced_local_traditions_modifier_desc:0 "Este personagem anteriormente escandinavo abraçou a cultura e a fé de sua nova terra natal, embora ainda possa erguer #V Pedras Rúnicas#!."
 exotic_foreign_lord_fp1_modifier:0 "Senhor Estrangeiro Exótico"
 exotic_foreign_lord_fp1_modifier_desc:0 "Este personagem é conhecido no mundo islâmico como o senhor feudal de um reino pagão estranho e intrigante."
 fp1_0511_carries_stinking_trophy_modifier:0 "Troféu Fedorento"
 fp1_0511_carries_stinking_trophy_modifier_desc:0 "Este personagem é acompanhado por um troféu apodrecido e cheio de larvas literalmente em todos os lugares que ele vai. Alguns dizem que o mau cheiro se estende por quilômetros."
 fp1_abased_before_highgod_modifier:0 "Onde o verdadeiro poder reside"
 fp1_abased_before_highgod_modifier_desc:0 "Este personagem se recusa a usar sua coroa, insistindo que o verdadeiro poder reside apenas no divino."
 fp1_avoiding_the_snow_modifier:0 "Evitando a Neve"
 fp1_avoiding_the_snow_modifier_desc:0 "Este personagem foi repreendido por passar muito tempo ao frio."
 fp1_bathing_attraction_modifier:0 "Apresentação Impecável"
 fp1_bathing_attraction_modifier_desc:0 "Este personagem está sempre impecavelmente arrumado: dentes raspados, cabelos penteados, orelhas limpas, pele lavada e sem sequer um sussurro de piolho."
 fp1_bathing_health_modifier:0 "Banho Rigoroso"
 fp1_bathing_health_modifier_desc:0 "Este personagem mantém uma agenda de banho impecável, lava as mãos antes das refeições e sempre tem uma toalha quente para os convidados."
 fp1_cursed_by_nithing_pole_modifier:0 "Amaldiçoado pelo Poste Nithing"
 fp1_cursed_by_nithing_pole_modifier_desc:0 "Este personagem foi fatalmente amaldiçoado por um poste nithing. Eles sabem que sua morte está chegando, apenas não sabem quando, e o medo está consumindo-os."
 fp1_daydreaming_about_diplomacy_modifier:0 "Sonhando com Diplomacia"
 fp1_daydreaming_about_diplomacy_modifier_desc:0 "Este personagem passou muito tempo mentalmente planejando políticas diplomáticas."
 fp1_daydreaming_about_intrigue_modifier:0 "Sonhando com Conspirações"
 fp1_daydreaming_about_intrigue_modifier_desc:0 "Este personagem passou muito tempo mentalmente avaliando quem está próximo na lista."
 fp1_daydreaming_about_learning_modifier:0 "Sonhando com Livros"
 fp1_daydreaming_about_learning_modifier_desc:0 "Este personagem passou muito tempo pensando em seus livros preferidos."
 fp1_daydreaming_about_martial_modifier:0 "Sonhando com Estratégia"
 fp1_daydreaming_about_martial_modifier_desc:0 "Este personagem passou muito tempo mentalmente planejando guerras futuras."
 fp1_daydreaming_about_stewardship_modifier:0 "Sonhando com Ouro"
 fp1_daydreaming_about_stewardship_modifier_desc:0 "Este personagem passou muito tempo mentalmente planejando como aumentar os impostos futuros."
 fp1_excellent_longships_modifier:0 "Excelentes Navios Longos"
 fp1_excellent_longships_modifier_desc:0 "A frota deste personagem corta as ondas como uma lâmina através de um monge."
 fp1_flagship_dragon_modifier:0 "Flagship de Dragão"
 fp1_flagship_dragon_modifier_desc:0 "O navio pessoal deste personagem é lendário, sua aparência distinta é conhecida em todo o mundo."
 fp1_flagship_leviathan_modifier:0 "Flagship Leviathan"
 fp1_flagship_leviathan_modifier_desc:0 "O navio pessoal deste personagem é enorme e capaz de transportar uma quantidade ridícula de tesouros."
 fp1_flagship_monster_modifier:0 "Flagship Monstruoso"
 fp1_flagship_monster_modifier_desc:0 "O navio pessoal deste personagem é adornado com esculturas de animais, monstros, mitos e sofrimento. Muitas das figuras se assemelham aos seus vassalos e inimigos."
 fp1_focusing_on_rule_modifier:0 "Focando na Governança"
 fp1_focusing_on_rule_modifier_desc:0 "Este personagem está focado em governar, e apenas governar, à custa de outras demandas da vida."
 fp1_ignoring_annoyances_modifier:0 "Ignorando Irritações"
 fp1_ignoring_annoyances_modifier_desc:0 "Este personagem não tem tempo para irritações e caprichos infantis."
 fp1_jomsvikings_caused_faith_crisis_modifier:0 "Crise de Fé"
 fp1_jomsvikings_caused_faith_crisis_modifier_desc:0 "Uma altercação com o líder de uma ordem sagrada fez com que este personagem duvidasse de suas crenças."
 fp1_legacy_of_piracy_modifier:0 "Legado da Pirataria"
 fp1_legacy_of_piracy_modifier_desc:0 "Esta dinastia traça uma descendência recente do maior pirata e saqueador da época; o mar, o sal e a fumaça estão sempre em seu sangue e em seus lábios.\n\nPode [Concept('raid', 'Saquear')|E], independentemente do tipo de [government|E]\nPode Saquear ultramar & navegar em Rios Principais"
 fp1_mann_pirate_capital_modifier:0 "A cidade roubada"
 fp1_mann_pirate_capital_modifier_desc:0 "A capital local ganhou seu apelido através de sangue, medo e trabalho árduo. O trabalho árduo é de origem local, mas o sangue e o medo vêm do exterior. Regularmente."
 fp1_reprieve_from_sa_modifier:0 "Alívio dos Aventureiros Escandinavos"
 fp1_reprieve_from_sa_modifier_desc:0 "De alguma forma, este personagem conseguiu obter um alívio dos incansáveis hordeiros vikings.\n$EFFECT_LIST_BULLET$ Não será atacado por Aventureiros Escandinavos sem terras."
 fp1_rotting_longships_modifier:0 "Longships Apodrecendo"
 fp1_rotting_longships_modifier_desc:0 "A frota deste personagem mal consegue navegar."
 fp1_stele_ancestors_strong:0 "Pedra Rúnica Ancestral"
 fp1_stele_ancestors_strong_custom_desc:0 "[ROOT.Char.Custom2_Title('SteleCommemoratesAncestors', SCOPE.sTitle('stele_location'))]"
 fp1_stele_ancestors_weak:0 "$fp1_stele_ancestors_strong$"
 fp1_stele_conquest_strong:0 "Pedra Rúnica de Conquista"
 fp1_stele_conquest_strong_custom_desc:0 "[ROOT.Char.Custom2_Title('SteleCommemoratesConquest', SCOPE.sTitle('stele_location'))]"
 fp1_stele_conquest_weak:0 "$fp1_stele_conquest_strong$"
 fp1_stele_promotion_strong:0 "Pedra Rúnica de Prestígio"
 fp1_stele_promotion_strong_custom_desc:0 "[ROOT.Char.Custom2_Title('SteleCommemoratesPromotion', SCOPE.sTitle('stele_location'))]"
 fp1_stele_promotion_weak:0 "$fp1_stele_promotion_strong$"
 fp1_trade_events_foreign_architects_modifier:0 "Arquitetos estrangeiros"
 fp1_trade_events_foreign_architects_modifier_desc:0 "Arquitetos estrangeiros trazem as últimas tendências e técnicas de construção do exterior."
 fp1_trade_events_foreign_architects_no_growth_modifier:0 "Assistência estrangeira"
 fp1_trade_events_foreign_architects_no_growth_modifier_desc:0 "Arquitetos estrangeiros trazem as últimas tendências do exterior, embora não possam fazer muito para melhorar as sofisticadas construções locais."
 fp1_trade_events_raid_consultants_modifier:0 "Veteranos dos saques residem aqui"
 fp1_trade_events_raid_consultants_modifier_desc:0 "Grupos de veteranos saqueadores foram pagos com um prêmio para proteger este condado contra outros de sua laia."
 fp1_yearly_0071_troll_attacks_modifier:0 "Ataques de trolls"
 fp1_yearly_0071_troll_attacks_modifier_desc:0 "Há algo #EMP assustador#! nas selvas deste condado, aterrorizando e até matando os moradores locais."
 fp1_yearly_0071_troll_victory_bear_modifier:0 "Matador de Ursos"
 fp1_yearly_0071_troll_victory_bear_modifier_desc:0 "Este personagem é reputado por ter matado um troll ou o maior urso do mundo."
 fp1_yearly_0071_troll_victory_lynx_modifier:0 "Matador de Lince"
 fp1_yearly_0071_troll_victory_lynx_modifier_desc:0 "Este personagem matou uma lince tão silenciosa que os plebeus acreditaram ser um troll."
 fp1_yearly_0071_troll_victory_moose_modifier:0 "Matador de Alces"
 fp1_yearly_0071_troll_victory_moose_modifier_desc:0 "Este personagem matou um alce tão raivoso que os plebeus acreditaram ser um troll."
 fp1_yearly_0071_troll_victory_wolf_modifier:0 "Matador de Lobos"
 fp1_yearly_0071_troll_victory_wolf_modifier_desc:0 "Este personagem matou um lobo tão rápido que o povo comum acreditou que era um troll."
 fp1_yearly_0071_troll_victory_wolverine_modifier:0 "Matador de Wolverines"
 fp1_yearly_0071_troll_victory_wolverine_modifier_desc:0 "Este personagem matou um wolverine tão feroz que o povo comum acreditou que era um troll, mantendo as terras selvagens seguras."
 fp1_yearly_0551_absent_lord_modifier:0 "Governante Ausente"
 fp1_yearly_0551_absent_lord_modifier_desc:0 "Este personagem, por alguma razão, parece nunca estar presente na própria corte. Especialmente durante a hora do jantar."
 fp1_yearly_0591_building_modifier:0 "Vindicado em Ting"
 fp1_yearly_0591_building_modifier_desc:0 "Capital político no Ting local permitiu a este condado reivindicar vários territórios fronteiriços menores, dando espaço suficiente para expandir assentamentos existentes."
 fp1_yearly_0591_levy_modifier:0 "Apoiado em Ting"
 fp1_yearly_0591_levy_modifier_desc:0 "Pequenos dramas no Ting local recentemente concederam a este condado terras fronteiriças, fazendo surgir novas vilas."
 fp1_yearly_0591_otherwise_occupied_modifier:0 "Ocupado de outra forma"
 fp1_yearly_0591_otherwise_occupied_modifier_desc:0 "Este condado está ocupado lutando contra seus rivais próximos para incitar a agitação contra seu senhor."
 fp1_yearly_0591_spurned_modifier:0 "Se Sente Rejeitado"
 fp1_yearly_0591_spurned_modifier_desc:0 "Os moradores deste condado sabem com #EMP certeza#! que seu senhor prefere um condado rival ao deles."
 generous_host_fp1_modifier:0 "Anfitrião Generoso"
 generous_host_fp1_modifier_desc:0 "Este personagem é conhecido por tratar os viajantes com respeito, cortesia e uma refeição quente."
 gruesome_festivals_designated_sacrifice_fp1_modifier:0 "Em breve será sacrificado"
 gruesome_festivals_designated_sacrifice_fp1_modifier_desc:0 "Este personagem é um [designate_chief_sacrifice_chief_sacrifice|E] designado."
 harald_tanglehairs_reminder_modifier:0 "Voto dos Cabelos Emaranhados Cumprido"
 harald_tanglehairs_reminder_modifier_desc:0 "Este personagem cumpriu com sucesso um voto vitalício: não cortar ou pentear seus cabelos até se tornar o Rei da Noruega. Ele continua a mantê-lo agora como uma lembrança de sua jornada."
 harald_tanglehairs_vow_broken_modifier:0 "Voto dos Cabelos Emaranhados Quebrado"
 harald_tanglehairs_vow_broken_modifier_desc:0 "Este personagem falhou em cumprir um voto vitalício: como ele não se tornou o primeiro rei da Noruega, ele nunca poderá cortar ou pentear seus cabelos."
 harald_tanglehairs_vow_modifier:0 "Voto dos Cabelos Emaranhados"
 harald_tanglehairs_vow_modifier_desc:0 "Este personagem fez um voto vitalício: ele nunca irá cortar ou pentear seus cabelos até se tornar o primeiro rei da Noruega."
 held_grand_sacrifice_fp1_modifier:0 "Participou do Grande Sacrifício"
 held_grand_sacrifice_fp1_modifier_desc:0 "Os camponeses deste condado descansam tranquilos, sabendo que os deuses sorriem para aqueles que pagam tributo."
 held_human_sacrifice_fp1_modifier:0 "Horrorizado com o Sacrifício Humano"
 held_human_sacrifice_fp1_modifier_desc:0 "A população camponesa está em armas por ser governada por um personagem que pratica o assassinato ritual de outros seres humanos."
 high_king_of_the_seas_fp1_modifier:0 "Alto-Rei dos Mares"
 high_king_of_the_seas_fp1_modifier_desc:0 "Este personagem é o governante incontestável do Mar do Norte, um supremo talassocrata."
 high_queen_of_the_seas_fp1_modifier:0 "Alta-Rainha dos Mares"
 high_queen_of_the_seas_fp1_modifier_desc:0 "$high_king_of_the_seas_fp1_modifier_desc$"
 horrifying_foreign_lord_fp1_modifier:0 "Senhor Estrangeiro Horrível"
 horrifying_foreign_lord_fp1_modifier_desc:0 "Histórias abundam no mundo islâmico sobre os sacrifícios pagãos horripilantes que infestam o reino deste personagem."
 nithing_exiled_fp1_modifier:0 "Nithing Local Exilado"
 nithing_exiled_fp1_modifier_desc:0 "As comunidades locais podem ficar tranquilas sabendo que um canalha foi punido devidamente."
 nithing_fp1_modifier:0 "Nithing"
 nithing_fp1_modifier_desc:0 "Este personagem não é nada para os $north_germanic_group_collective_noun$, considerado morto, abaixo até de um escravo."
 nithing_harboured_fp1_modifier:0 "Nithing Local Abrigado"
 nithing_harboured_fp1_modifier_desc:0 "As comunidades locais detestam o apoio do senhorio a um canalha conhecido."
 nithing_in_limbo_fp1_modifier:0 "Tensões de Classe"
 nithing_in_limbo_fp1_modifier_desc:0 "Certos elementos da corte entram em conflito regularmente com as comunidades locais."
 phantom_island_critique_fp1_modifier:0 "Pensador Crítico"
 phantom_island_critique_fp1_modifier_desc:0 "Este personagem é notado por seu ceticismo em relação às histórias mirabolantes que alguns marinheiros contam."
 phantom_island_trivia_fp1_modifier:0 "Mistérios do Atlântico"
 phantom_island_trivia_fp1_modifier_desc:0 "Este personagem lembra muitas histórias interessantes das ilhas misteriosas do Atlântico."
 scandinavian_adventurer_fp1_modifier:0 "Exilado Viking"
 scandinavian_adventurer_fp1_modifier_desc:0 "Este personagem fugiu da Escandinávia com um exército de bandidos e aventureiros, buscando conquistar um reino em outro lugar."
 settled_norse_dynasty_modifier:0 "Dinastia Estabelecida"
 settled_norse_dynasty_modifier_desc:0 "Esta dinastia escandinava se estabeleceu em terras estrangeiras.\n#weak Enquanto este modificador durar, os governantes desta dinastia não serão alvos de aventureiros escandinavos.#!"
 shieldmaiden_level_intrigue_1_fp1_modifier:0 "Traiçoeira Astuta"
 shieldmaiden_level_intrigue_1_fp1_modifier_desc:0 "Este personagem está sempre procurando oportunidades para tirar vantagem de seus inimigos."
 shieldmaiden_level_intrigue_2_fp1_modifier:0 "Traidora Notória"
 shieldmaiden_level_intrigue_2_fp1_modifier_desc:0 "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"
 shieldmaiden_level_intrigue_3_fp1_modifier:0 "Traidora Infame"
 shieldmaiden_level_intrigue_3_fp1_modifier_desc:0 "$shieldmaiden_level_intrigue_1_fp1_modifier_desc$"
 shieldmaiden_level_martial_1_fp1_modifier:0 "Comandante Experiente"
 shieldmaiden_level_martial_1_fp1_modifier_desc:0 "Este personagem trabalhou mais do que muitos para melhorar o seu comando de soldados."
 shieldmaiden_level_martial_2_fp1_modifier:0 "Comandante Veterano"
 shieldmaiden_level_martial_2_fp1_modifier_desc:0 "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_martial_3_fp1_modifier:0 "Comandante Incansável"
 shieldmaiden_level_martial_3_fp1_modifier_desc:0 "$shieldmaiden_level_martial_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_1_fp1_modifier:0 "Lutadora Experiente"
 shieldmaiden_level_prowess_1_fp1_modifier_desc:0 "Este personagem parece nunca parar de praticar com uma espada."
 shieldmaiden_level_prowess_2_fp1_modifier:0 "Lutadora Famosa"
 shieldmaiden_level_prowess_2_fp1_modifier_desc:0 "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 shieldmaiden_level_prowess_3_fp1_modifier:0 "Lutadora Lendária"
 shieldmaiden_level_prowess_3_fp1_modifier_desc:0 "$shieldmaiden_level_prowess_1_fp1_modifier_desc$"
 stingy_host_fp1_modifier:0 "Anfitrião Mão-de-Vaca"
 stingy_host_fp1_modifier_desc:0 "Este personagem é conhecido por recusar até mesmo uma refeição quente para pessoas sem importância em sua corte."
 trade_instead_of_raid_fp1_modifier:0 "Ligações Comerciais de Saqueadores"
 trade_instead_of_raid_fp1_modifier_desc:0 "Este condado se beneficiou amplamente do comércio com possíveis saqueadores em vez de lutar contra eles, os habitantes mais ricos usando trajes e bugigangas exóticas arrancadas de terras estrangeiras."
 ultimate_blasphemer_modifier:0 "Blasfemador Supremo"
 ultimate_blasphemer_modifier_desc:0 "Este personagem sacrificou seu próprio [head_of_faith|E] para as divindades de outra [faithpossessive|E]. Ninguém o considera um verdadeiro membro dos fiéis."
