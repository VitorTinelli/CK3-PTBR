l_spanish:
 fp1_jomsvikings.0001.a:0 "[retainer_a.GetFirstNameNoTooltip] parece um estrategista formidável!"
 fp1_jomsvikings.0001.b:0 "Que guerreiro imponente é [retainer_b.GetFirstNameNoTooltip]..."
 fp1_jomsvikings.0001.c:0 "Já tenho guerreiros em abundância, obrigado."
 fp1_jomsvikings.0001.desc.ambitious:0 "que deseja morrer com a morte mais gloriosa já vista,"
 fp1_jomsvikings.0001.desc.arrogant:0 "que teria sido o próximo [leader.GetTitleAsNameNoTooltip],"
 fp1_jomsvikings.0001.desc.brave:0 "que venceu um troll em uma luta de punhos,"
 fp1_jomsvikings.0001.desc.connector:0 "ou [retainer_b.GetFirstName],"
 fp1_jomsvikings.0001.desc.diligent:0 "que nunca para de treinar,"
 fp1_jomsvikings.0001.desc.fickle:0 "cuja mente caprichosa enganou [leader.GetFaith.DevilName] [leader.GetFaith.DevilHerselfHimself],"
 fp1_jomsvikings.0001.desc.gregarious:0 "que se tornou amigo dos próprios deuses,"
 fp1_jomsvikings.0001.desc.impatient:0 "que é mais rápido que um raio,"
 fp1_jomsvikings.0001.desc.intro:0 "Acomodados em sua fortaleza de [leader.GetCapitalLocation.GetTitle.GetNameNoTier], a [leader.GetPrimaryTitle.GetNameNoTier] é uma ordem guerreira dedicada a proteger os Velhos Costumes da fé do [leader.GetFaith.GetName] contra mudanças, desonras e outras religiões.\n\nPor minha piedade e virtude, [leader.GetTitledFirstName] me enviou uma escolha de dois mantenedores: [retainer_a.GetFirstName],"
 fp1_jomsvikings.0001.desc.outro:0 "bem como os elogios [leader.GetHerHim] pela minha devoção.\n\nUm ficará, e o outro retornará para [leader.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 fp1_jomsvikings.0001.desc.stubborn:0 "que derrubou uma montanha pedra por pedra,"
 fp1_jomsvikings.0001.desc.vengeful:0 "que nunca deixou uma vingança passar em branco,"
 fp1_jomsvikings.0001.desc.viking:0 "que mata dez camponeses por dia no exterior,"
 fp1_jomsvikings.0001.desc.wrathful:0 "que uma vez rasgou um urso em dois,"
 fp1_jomsvikings.0001.desc.zealous:0 "que saqueou cem igrejas,"
 fp1_jomsvikings.0001.t:0 "Uma mão amiga de [leader.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 fp1_jomsvikings.0011.a.tt_failure:0 "[leader.GetTitledFirstNameNoTooltip] causa estragos enquanto foge"
 fp1_jomsvikings.0011.a.tt_success:0 "Os piratas são cercados e destruídos"
 fp1_jomsvikings.0011.a:0 "Agarre quem pudermos, às armas!"
 fp1_jomsvikings.0011.b.benefactor:0 "Talvez [benefactor.GetTitledFirstNameNoTooltip] possa simplesmente nos enviar novos [ROOT.Char.GetFaith.PriestNeuterPlural]?"
 fp1_jomsvikings.0011.b.fallback:0 "Lamentável, mas podemos importar [ROOT.Char.GetFaith.PriestNeuterPlural] de reposição..."
 fp1_jomsvikings.0011.c.tt:0 "[leader.GetTitledFirstName] recua sem incidentes"
 fp1_jomsvikings.0011.c:0 "`Recolha o gafol; é mais barato a longo prazo."
 fp1_jomsvikings.0011.d.tt:0 "Você deixa [target_county.GetNameNoTier] queimar"
 fp1_jomsvikings.0011.d:0 "Como isso pode ser algo além de um problema local?"
 fp1_jomsvikings.0011.desc.economic:0 "Embora os [leader.GetPrimaryTitle.GetNameNoTierNoTooltip] não tenham ressentimentos particulares contra um [ROOT.Char.GetFaith.GetAdherentName] como eu, eles ainda dependem de pilhagem e saque para sobreviver, e minhas terras são um alvo tentador. Talvez... talvez pagá-los com um pesado tributo ainda possa poupar meus súditos?"
 fp1_jomsvikings.0011.desc.ideological_other:0 "[leader.GetFaith.GetAdherentNamePlural] fundamentalistas, esses piratas consideram [ROOT.Char.GetFaith.GetReligion.GetName] uma ameaça ao seu modo de vida. Mais do que simplesmente saquear, os reavers estão massacrando [ROOT.Char.GetFaith.PriestNeuterPlural], queimando [ROOT.Char.GetFaith.HouseOfWorshipPlural], e gritando imprecações sangrentas sobre seus falsos deuses."
 fp1_jomsvikings.0011.desc.ideological_reformist:0 "Rotulando o [ROOT.Char.GetFaith.GetName] uma perversão repugnante da fé de nossos antepassados, esses malditos piratas estão massacrando nossos [ROOT.Char.GetFaith.PriestNeuterPlural] em massa, incendiando nossas [ROOT.Char.GetFaith.HouseOfWorshipPlural], e afirmam estar fazendo tudo em nome de [leader.GetFaith.HighGodName]!"
 fp1_jomsvikings.0011.desc.intro:0 "Desastre! Um ataque relâmpago por [leader.GetTitledFirstName] do [leader.GetPrimaryTitle.GetNameNoTier] em [target_county.GetNameNoTier] ameaça colocar metade do condado em chamas!\n\n"
 fp1_jomsvikings.0011.desc.outro:0 "\n\nNão há tempo para levantar um exército. Posso atacar com quaisquer forças que tenha à mão, ou posso suportar a situação até que eles partam."
 fp1_jomsvikings.0011.t.fallback:0 "[leader.GetPrimaryTitle.GetNameNoTierNoTooltip] Piratas"
 fp1_jomsvikings.0011.t.reformed_norse:0 "Ira dos Velhos Caminhos"
 fp1_jomsvikings.0011.t.reformed_other:0 "Ira dos Deuses Antigos"
 fp1_jomsvikings.0021.a.tt:0 "O [army|E] incluirá [men_at_arms|E] especiais de $jomsviking_pirates$ e difíceis de matar"
 fp1_jomsvikings.0021.a:0 "Piratas que recebem ordens? Intrigante..."
 fp1_jomsvikings.0021.b.tt:0 "O [army|E] incluirá [men_at_arms|E] de $bondi$ recrutáveis"
 fp1_jomsvikings.0021.b:0 "Apenas os marinheiros respeitáveis, acho."
 fp1_jomsvikings.0021.c:0 "Prefiro meus soldados um pouco mais... disciplinados."
 fp1_jomsvikings.0021.desc:0 "É com certa desconfiança que recebo uma delegação de bandidos desordeiros do [leader.GetPrimaryTitle.GetNameNoTier], apresentando uma carta de [leader.GetTitledFirstName].\n\nFerozes saqueadores tanto no mar quanto em terra, esses fundamentalistas religiosos são alguns dos piratas mais notórios e mortais do mundo.\n\nComo bom [ROOT.Char.GetFaith.GetAdherentName], tenho escutado as histórias de sua piedade e destreza com uma mistura de admiração e medo. Agora parece que seu [leader.GetTitleAsNameNoTooltip] está me oferecendo o comando desse bando de voluntários, desde que eu os use para saquear e pilhar em nome de [ROOT.Char.GetFaith.PantheonTerm]."
 fp1_jomsvikings.0021.t:0 "Negociando com Piratas"
 fp1_jomsvikings.0041.a.tt:0 "Você entra imediatamente em uma [single_combat_fight|E]"
 fp1_jomsvikings.0041.a.tt_failure:0 "[leader.GetTitledFirstName] vence a luta"
 fp1_jomsvikings.0041.a.tt_success:0 "Você vence a luta"
 fp1_jomsvikings.0041.a:0 "Eu te enviarei para Valhalla com um sorriso!"
 fp1_jomsvikings.0041.b.tt_failure:0 "[leader.GetTitledFirstName] escapa audaciosamente"
 fp1_jomsvikings.0041.b.tt_success:0 "[leader.GetTitledFirstName] é algemado e levado para a masmorra"
 fp1_jomsvikings.0041.b:0 "Você foi um tolo em vir sozinho. Guardas!"
 fp1_jomsvikings.0041.c:0 "Você sabe que é apenas um pirata pretensioso, certo? Fuja daqui."
 fp1_jomsvikings.0041.desc:0 "\"#EMP [ROOT.Char.GetFirstNameNoTooltip]#!!\" Uiva [leader.GetTitledFirstName] ao entrar em minha sala do trono, seminus.\n\n\"Seus caminhos pecaminosos e desonra flagrante são uma vergonha para os [leader.GetFaith.GetAdherentNamePlural] em todos os lugares, e o [leader.GetPrimaryTitle.GetNameNoTier] não tolerará mais isso! Sem desculpas, sem truques, faremos holmgang, #EMP aqui#! e #EMP agora#!!\"\n\nMeus guardas, confusos, seguram suas armas, prontos para agir contra o intruso a qualquer momento.\n\nQualquer que seja minha escolha, as notícias das minhas ações, sem dúvida, se espalharão pelo mundo."
 fp1_jomsvikings.0041.t:0 "Uma Desgraça para os Deuses"
 fp1_jomsvikings.0042.trigger_failure:0 "Sua luta contra [leader.GetTitledFirstNameNoTooltip] foi invalidada"
 fp1_jomsvikings.0044.a:0 "Alguém #EMP mais# quer tentar?"
 fp1_jomsvikings.0044.b:0 "A justiça do meu governo é mais uma vez comprovada!"
 fp1_jomsvikings.0044.c:0 "Isso simplesmente mostra quão indigna é a fé do [leader.GetFaith.GetNameNoTooltip]..."
 fp1_jomsvikings.0044.desc:0 "Com [leader.GetTitledFirstName] caído sem vida aos meus pés, a sala do trono fica mortalmente silenciosa. Nem um sussurro pode ser ouvido, nenhuma respiração além dos meus próprios arfantes.\n\nSilenciosamente, visto minhas roupas novamente.\n\nUm por um, faço contato visual com todas as pessoas ainda aqui."
 fp1_jomsvikings.0044.t:0 "$fp1_jomsvikings.0041.t$: Vindicação"
 fp1_jomsvikings.1001.a.tt:0 "Os Jomsvikings não concederão mais bênçãos aos piedosos"
 fp1_jomsvikings.1001.a:0 "Os deuses nos abandonaram!"
 fp1_jomsvikings.1001.b.tt:0 "Os Jomsvikings não saquearão mais descrentes"
 fp1_jomsvikings.1001.b:0 "Ainda bem que se livraram dessa escória!"
 fp1_jomsvikings.1001.c.tt:0 "$fp1_jomsvikings.1001.b.tt$"
 fp1_jomsvikings.1001.c:0 "Jô-quem?"
 fp1_jomsvikings.1001.desc.fallback:0 "No final, eles simplesmente não foram suficientes para impedir a maré de crenças estrangeiras, e "
 fp1_jomsvikings.1001.desc.intro:0 "Com a queda de sua última fortaleza, os [title.GetNameNoTier] foram completamente extintos.\n\n"
 fp1_jomsvikings.1001.desc.outro:0 "agora parece inevitável que a fé do [leader.GetFaith.GetName] esteja fadada ao lixo da história."
 fp1_jomsvikings.1001.desc.reformed_asatru_exists:0 "Apesar de seus melhores esforços para conter a maré de mudanças, a dissidência chegou a sua fé, como aconteceu com o Cristianismo e o Islã antes dela.\n\nSe os reformistas vencerem ou se os fiéis sucumbirem a crenças estrangeiras, "
 fp1_jomsvikings.1001.holy_order_destroyed:0 "Os [title.GetNameNoTier] foram destruídos."
 fp1_jomsvikings.1001.t:0 "Declínio dos Velhos Caminhos"
