l_spanish:
 fp1_berserk_roar_evtopt:0 "#BER RAAAAARGH!#!"
 fp1_yearly.0001.a.tt_failure:0 "O thrall escapa com o seu dinheiro"
 fp1_yearly.0001.a.tt_success:0 "O thrall é encontrado e capturado"
 fp1_yearly.0001.a:0 "Mandar uma descrição para todas as vilas!"
 fp1_yearly.0001.b.tt_failure:0 "$fp1_yearly.0001.a.tt_failure$"
 fp1_yearly.0001.b.tt_success:0 "Você captura o thrall antes que ele possa fugir"
 fp1_yearly.0001.b:0 "Pegue minha capa, eu mesmo caçarei [dummy_gender.GetSheHe]!"
 fp1_yearly.0001.c:0 "[scapegoat.GetFirstNameNoTooltip], isso é culpa sua, então você pode pagar!"
 fp1_yearly.0001.d:0 "Você está perdoado, [scapegoat.GetFirstNameNoTooltip]. Estas coisas acontecem."
 fp1_yearly.0001.desc:0 "Thralls são uma realidade na cultura [ROOT.Char.GetCulture.GetNameNoTooltip]. Humanos inferiores, capturados de outros lugares ou nascidos de outros thralls, trabalham em nossos campos e cuidam de nossos lares.\n\nTeoricamente.\n\nNa noite passada, um desses escravos decidiu que já havia tido o suficiente e fugiu, levando consigo uma quantidade valiosa de joias! O pior de tudo, [scapegoat.Custom2('MyCharacterIntroduction',ROOT.Char)] #EMP viu#! o thrall correndo para a escuridão e não pensou em contar para ninguém até a manhã seguinte."
 fp1_yearly.0001.gold_stays_lost.tt:0 "Seu dinheiro ficará perdido"
 fp1_yearly.0001.t:0 "Fuga de um Thrall"
 fp1_yearly.0011.a:0 "Eles estão certos, [offensive_courtier.GetSheHe] deve ser deserdado e banido!"
 fp1_yearly.0011.b:0 "Eles estão certos, [offensive_courtier.GetSheHe] deve ser banido!"
 fp1_yearly.0011.c:0 "Camponeses! [offensive_courtier.GetFirstNameNoTooltip] é inocente."
 fp1_yearly.0011.d:0 "Isto não é assunto para o [ROOT.Char.GetTitleAsNameNoTooltip]..."
 fp1_yearly.0011.desc.priest:0 "[priest.Custom2('MyCharacterIntroduction',ROOT.Char)|U] insiste que o seu comportamento é #EMP na verdade#! bastante piedoso, mas os burgueses rosnantes afirmam que [priest.GetFirstNameNoTooltip] simplesmente não tem que lidar com as consequências de tal 'virtude'."
 fp1_yearly.0011.desc:0 "Uma parada de locais importantes de [capital_barony.GetNameNoTier] passou o dia percorrendo minha sala, cada um com uma queixa única contra meu [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('offensive_courtier'))], [offensive_courtier.GetTitledFirstName].\n\nAlguns reclamam do seu comportamento, outros de sua honra, mas todos concordam em uma coisa: [offensive_courtier.GetSheHe] é uma desgraça para a corte.\n\nAs massas clamam por nada menos que uma declaração de nithing, expulsando [offensive_courtier.GetSheHe]."
 fp1_yearly.0011.t:0 "Pedidos para que [offensive_courtier.GetFirstNameNoTooltip] seja declarado Nithing"
 fp1_yearly.0021.a.tt_failure:0 "[second_knight.GetFirstNameNoTooltip] vence o holmgang"
 fp1_yearly.0021.a.tt_success:0 "[first_knight.GetFirstNameNoTooltip] vence o holmgang"
 fp1_yearly.0021.a:0 "Eles podem lutar por isso se quiserem."
 fp1_yearly.0021.b.tt_failure:0 "Seus $knight_culture_player_plural_no_tooltip_lowercase$ concordam de má vontade, mas zombam de você"
 fp1_yearly.0021.b.tt_success:0 "Seu comando inspira obediência aterrorizada"
 fp1_yearly.0021.b:0 "Pueril! Eu proíbo isso!"
 fp1_yearly.0021.c.tt_failure:0 "$fp1_yearly.0021.a.tt_failure$"
 fp1_yearly.0021.c.tt_success:0 "$fp1_yearly.0021.a.tt_success$"
 fp1_yearly.0021.c:0 "Claro, e eu até vou apostar em [first_knight.GetFirstNameNoTooltip]."
 fp1_yearly.0021.d.tt_failure:0 "$fp1_yearly.0021.a.tt_success$"
 fp1_yearly.0021.d.tt_success:0 "$fp1_yearly.0021.a.tt_failure$"
 fp1_yearly.0021.d:0 "Por todos os meios, embora eu aposte em [second_knight.GetFirstNameNoTooltip]."
 fp1_yearly.0021.desc.board_game:0 "os dois estavam jogando hnefatafl e começaram a discutir sobre as regras exatas. Em minutos, o tabuleiro foi jogado de lado e os punhos começaram a voar."
 fp1_yearly.0021.desc.defiled_longboat.woman:0 "[unfortunate_knight.GetFirstNameNoTooltip] encontrou [defiling_knight.GetFirstNameNoTooltip] #EMP se divertindo#! com a figura de proa do barco de [unfortunate_knight.GetFirstNamePossessiveNoTooltip], arruinando completamente a pintura e sua aura uma vez temida."
 fp1_yearly.0021.desc.defiled_longboat:0 "[defiling_knight.GetFirstNameNoTooltip] #EMP se divertiu#! descontroladamente em cada assento do barco de [unfortunate_knight.GetFirstNamePossessiveNoTooltip], deixando toda a embarcação #EMP fedendo#!."
 fp1_yearly.0021.desc.doggo:0 "[first_knight.GetFirstNameNoTooltip] espetou o cão de [second_knight.GetFirstNamePossessiveNoTooltip] por acidente enquanto caçavam um(a) [ROOT.Char.Custom('LocalAnimal')] juntos, e [second_knight.GetFirstNameNoTooltip] se recusa a permitir que [first_knight.GetFirstNameNoTooltip] simplesmente pague por um novo."
 fp1_yearly.0021.desc.escalating_prank_war:0 "começou como uma competição inofensiva de quem fazia a piada mais engraçada, cada um jogando brincadeiras cada vez mais dramáticas no outro, e a diversão gradualmente se transformou em pura raiva."
 fp1_yearly.0021.desc.intro:0 "Uma recente discussão entre dois dos meus $knight_culture_player_plural_no_tooltip_lowercase$, [first_knight.GetTitledFirstName] e [second_knight.GetTitledFirstName], escalou drasticamente. Aparentemente,"
 fp1_yearly.0021.desc.outro:0 "\n\nAgora, ambos os $knight_culture_player_plural_no_tooltip_lowercase$ desafiaram abertamente um ao outro para um holmgang. O duelo certamente será dramático, mas como membros juramentados de minha casa, eles precisam da minha permissão para seguir em frente com a luta."
 fp1_yearly.0021.desc.religious_differences:0 "tudo se resume a simples diferenças de fé, com os [first_knight.GetFaith.GetAdherentNamePlural] e os [second_knight.GetFaith.GetAdherentNamePlural] ambos se atacando por conta da natureza do divino."
 fp1_yearly.0021.desc.spit_of_land:0 "[first_knight.GetFirstNameNoTooltip] comprou um pedaço remoto de terra que [second_knight.GetFirstNameNoTooltip] afirma ser [second_knight.GetHerHim]. O terreno seria sem valor, exceto pelo fato de que supostamente cresce as melhores couves em todo [capital_barony.GetNameNoTierNoTooltip]."
 fp1_yearly.0021.desc.stolen_pig:0 "o ponto chave da discórdia é um porco gigante, que [first_knight.GetFirstNameNoTooltip] roubou de [second_knight.GetFirstNameNoTooltip]. Ou [second_knight.GetFirstNameNoTooltip] de [first_knight.GetFirstNameNoTooltip]. Honestamente, com todo o barulho, está bastante confuso."
 fp1_yearly.0021.desc.unrepeatable_insult:0 "eles começaram a trocar insultos do nada, e [first_knight.GetFirstNameNoTooltip] disse algo inaudível sobre [second_knight.GetFirstNameNoTooltip], uma cabra e um bom chifre de bebida."
 fp1_yearly.0021.t:0 "Uma Questão de Vida ou Morte"
 fp1_yearly.0031.a:0 "Você simplesmente #EMP deve#! ficar na corte, [lying_warrior.GetFirstNameNoTooltip]!"
 fp1_yearly.0031.b.tt_failure:0 "[lying_warrior.GetFirstNameNoTooltip] rodeia você verbalmente"
 fp1_yearly.0031.b.tt_success:0 "As mentiras de [lying_warrior.GetFirstNamePossessiveNoTooltip] são expostas"
 fp1_yearly.0031.b:0 "Isso soa... exagerado."
 fp1_yearly.0031.c:0 "Fale bem da nossa hospitalidade em sua próxima parada!"
 fp1_yearly.0031.desc.charged_city:0 "\"... carreguei diretamente para as muralhas da cidade, subi escalando, e abri caminho até o palácio real. Derreti a coroa do rei para pagar por um novo par de botas.\""
 fp1_yearly.0031.desc.charged_city_fruit_knife:0 "\"... dez mil do inimigo lá dentro, armados com cimitarras, e eu armado apenas com uma faca pequena para descascar frutas. #EMP Eu consegui#!, graças à minha fiel faca de frutas!\""
 fp1_yearly.0031.desc.hunted_troll:0 "\"... claro, esta ferida mais recente é do próprio troll. Grande como uma casa, silencioso como um rato, garras como a prole bastarda de [lying_warrior.GetFaith.DevilName]. Ainda assim, apunhalando algo por tempo suficiente, e ele morre.\""
 fp1_yearly.0031.desc.intro:0 "Foi uma noite longa, muito longa na companhia de [lying_warrior.GetFirstName]. O andarilho parou em [capital_barony.GetBaseNameNoTierNoTooltip] para a noite, pagando por sua estadia com histórias de suas proezas que duraram #EMP horas#!.\n\n"
 fp1_yearly.0031.desc.kept_iceland_afloat:0 "\"... e se os dois gigantes realmente #EMP tivessem#! realizado o holmgang deles, a Islândia certamente teria afundado de volta ao mar. Sorte minha que eu os convenci a recuar.\""
 fp1_yearly.0031.desc.outro:0 "\n\nConto após conto, a saga continua, cada anedota mais longa e maior que a anterior."
 fp1_yearly.0031.desc.sunk_longboat:0 "\"... então lá estava eu, no meio do Mar do Norte, com o barco longo afundando por causa de tanto maldito saque. Bem, eu não podia levar comigo, então pulei na água e nadei até a Noruega!\""
 fp1_yearly.0031.desc.wooed_heir:0 "\"... [disparaged_king.GetTitledFirstNamePossessive] [invented_heir.Custom('GetDaughterSon')], agora #EMP essa#! é a melhor que eu já tive. [disparaged_king.GetTitledFirstNameNoTooltip] não gostou muito de mim depois disso, e eu fugi da sua corte rapidinho, eu lhe digo!\""
 fp1_yearly.0031.desc.wrestled_whale:0 "\"... sabia que eu tinha que abandonar minha tripulação ou lutar contra a baleia sozinho. Peguei minha faca, mergulhei no oceano e lutei contra a fera até a praia, sozinho!\""
 fp1_yearly.0031.t:0 "Contos Altos na Mesa"
 fp1_yearly.0041.a.tt_failure:0 "Seus costumes pagãos desagradam [explorer.GetFirstNameNoTooltip]"
 fp1_yearly.0041.a.tt_success:0 "Seu cerimonial impressiona [explorer.GetFirstNameNoTooltip]"
 fp1_yearly.0041.a:0 "Talvez [explorer.GetSheHe] possa observar um de nossos pequenos rituais?"
 fp1_yearly.0041.b:0 "Me fale mais sobre este... [explorer.GetFaith.HighGodName]?"
 fp1_yearly.0041.c:0 "Não há lugar para estrangeiros arrogantes em #EMP minha#! corte."
 fp1_yearly.0041.desc:0 "[explorer.GetFirstName], um explorador, acadêmico e enviado de [sponsoring_liege.GetTitledFirstName] de [sponsoring_liege.GetPrimaryTitle.GetName] tem estado percorrendo minhas terras ultimamente. Um erudito e devoto [explorer.GetFaith.GetAdherentNameNoTooltip], [explorer.GetSheHe] mantém um diário detalhado de suas experiências, enviando cartas irregulares de volta para sua terra natal para relatar a vida neste extremo do mundo. \n\n[explorer.GetFirstNameNoTooltip] agora chegou a [capital_barony.GetNameNoTier] e busca permissão para ficar alguns dias a fim de observar nossos costumes locais e falar com nossos mais sábios anciãos.\n\nApesar da maneira formal de seu pedido, o tom de [explorer.GetFirstNamePossessiveNoTooltip] praticamente #EMP transborda!# de condescendência."
 fp1_yearly.0041.t:0 "Exploradores do Sul"
 fp1_yearly.0051.a.tt:0 "Você decide investigar pessoalmente..."
 fp1_yearly.0051.a:0 "Eu visitarei o seu túmulo pessoalmente."
 fp1_yearly.0051.b.body_destroyed:0 "O povoado se alegra"
 fp1_yearly.0051.b.list:0 "Familiares e amigos de [draugr.GetFirstNameNoTooltip]"
 fp1_yearly.0051.b:0 "Apenas desenterre o corpo e queime-o."
 fp1_yearly.0051.c.tt_failure:0 "Seus rituais são insuficientes"
 fp1_yearly.0051.c.tt_success:0 "Suas poções e feitiços tranquilizam os camponeses"
 fp1_yearly.0051.c:0 "Talvez possamos resolver isso com feitiços protetores?"
 fp1_yearly.0051.desc:0 "A morte de [draugr.GetTitledFirstNamePossessive] há algum tempo não passou despercebida pelo povo comum de [capital_county.GetNameNoTier]. Qualquer que tenha sido a outra coisa que [draugr.GetSheHe] tenha sido, [draugr.GetFirstNameNoTooltip] não era popular entre os camponeses locais, e tornou-se comum culpar o cadáver ambulante [draugr.Custom('WomanManPossessive')].\n\nNão passa uma semana sem que todo agricultor, florestal e catador de estrume a uma distância de cuspir da capital não se queixe do draugr de [draugr.GetFirstNamePossessiveNoTooltip].\n\n#EMP Alguma coisa#! deve ser feita."
 fp1_yearly.0051.t:0 "Os Mortos Inquietos"
 fp1_yearly.0061.a.tt_failure:0 "Você mal escapa com vida"
 fp1_yearly.0061.a.tt_success:0 "Você incentiva seus homens e mata os lobos!"
 fp1_yearly.0061.a:0 "Soldados! Comigo!"
 fp1_yearly.0061.b:0 "FUJA!"
 fp1_yearly.0061.desc:0 "Minha comitiva e eu acabamos de chegar na sepultura de [draugr.GetFirstNamePossessiveNoTooltip] quando o primeiro rosnado ecoa do interior.\n\nÀ medida que o maior lobo que já vi sai da entrada escura, o resto de sua matilha parece surgir do solo. Deve haver uma dúzia ou mais, cada um do tamanho de um homem, e já em uma corrida mortal de todas as direções.\n\nOs camponeses estavam errados sobre o draugr, mas não sobre a maldição!"
 fp1_yearly.0061.t:0 "$fp1_yearly.0051.t$: Lobos"
 fp1_yearly.0062.a.tt_failure:0 "Sua comitiva o arrasta para longe da morte certa"
 fp1_yearly.0062.a.tt_success:0 "Você derruba o monstro"
 fp1_yearly.0062.a:0 "Eu vou te transformar em um tapete!"
 fp1_yearly.0062.b:0 "$fp1_yearly.0061.b$"
 fp1_yearly.0062.desc:0 "A sepultura de [draugr.GetFirstNamePossessiveNoTooltip] é fria e sombria. Embora nem minha comitiva nem eu vejamos nenhum cadáver andante, há arranhões longos e profundos em algumas das paredes, e ossos de animais mortos cobrem o chão.\n\nUm repentino barulho vindo do canto chama minha atenção, e o que eu tomaria por uma pilha de folhas começa a se levantar, revelando o maior urso que já vi, facilmente com nove ou dez côvados de altura. Ele pisca sonolentamente para nós, parecendo quase amigável.\n\nEntão ele ruge."
 fp1_yearly.0062.t:0 "$fp1_yearly.0051.t$: Urso"
 fp1_yearly.0063.a.tt_failure.draugr_nithing_escapes:0 "[draugr_nithing.GetFirstNameNoTooltip] vagueia pela natureza, continuando a causar problemas"
 fp1_yearly.0063.a.tt_failure:0 "[draugr_nithing.GetFirstNameNoTooltip] percebe que algo está errado e foge"
 fp1_yearly.0063.a.tt_success:0 "A armadilha funciona"
 fp1_yearly.0063.a:0 "Todos, silêncio, encostem-se nas paredes!"
 fp1_yearly.0063.b:0 "Que desperdício de meu tempo maldito!"
 fp1_yearly.0063.desc:0 "[draugr.GetFirstNamePossessiveNoTooltip] túmulo não contém nenhum monstro, tesouros funerários, nem mesmo um cadáver. Uma breve busca na área encontra [draugr.GetFirstNameNoTooltip] virado em uma vala e coberto crudamente com folhagem a pouca distância.\n\nEm vez disso, o túmulo parece ter sido convertido em uma moradia tosca, que algum bandido sem escrúpulos tomou das mãos frias dos mortos.\n\nEnquanto discuto o que fazer com minha comitiva, um assobio alegre se torna audível ao longe, ficando mais próximo. O bandido se aproxima!"
 fp1_yearly.0063.t:0 "$fp1_yearly.0051.t$: Nithing"
 fp1_yearly.0064.a.tt:0 "[draugr_orphan.GetFirstNameNoTooltip] vagueia pela natureza..."
 fp1_yearly.0064.a:0 "Fora daqui, criança. Você não pode ficar aqui."
 fp1_yearly.0064.b:0 "Criança ou não, para a masmorra com este ladrão!"
 fp1_yearly.0064.c:0 "Venha para a corte, [Select_CString(draugr_orphan.IsFemale,'menina','menino')]: um túmulo não é lugar para os vivos."
 fp1_yearly.0064.d:0 "Certamente... certamente toda criança merece um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetMotherFather]?"
 fp1_yearly.0064.desc:0 "Os camponeses podem ter insistido que o cadáver ambulante de [draugr.GetFirstNamePossessiveNoTooltip] estava roubando sua comida, enfeitiçando seu gado e se esgueirando em suas janelas à noite, mas quando chego ao seu túmulo, encontro uma criatura muito diferente.\n\nEm meio a um ninho de peles roubadas e comida meio comida, está uma criança órfã, olhando para mim, olhos arregalados de terror absoluto."
 fp1_yearly.0064.t:0 "$fp1_yearly.0051.t$: Órfão"
 fp1_yearly.0065.a.locals_grumble:0 "Os Camponeses Estão Descontentes"
 fp1_yearly.0065.a:0 "Talvez tenha sido o vento?"
 fp1_yearly.0065.desc:0 "[draugr.GetFirstNamePossessiveNoTooltip] túmulo está praticamente como quando [draugr.GetSheHe] foi enterrado(a). Assim como todos os outros túmulos que os camponeses me pedem para verificar. \n\nNem encontro nada em qualquer caverna supostamente amaldiçoada, bosque assombrado por trolls ou gruta de gigante: após algumas semanas, estou começando a questionar o quão certos estamos de que tais monstros realmente existem!? \n\nPelo menos o exercício faz bem para mim."
 fp1_yearly.0065.t:0 "$fp1_yearly.0051.t$: Afinal, quieto"
 fp1_yearly.0071.a.tt:0 "Você parte com um grupo de guerreiros"
 fp1_yearly.0071.a:0 "Eu matarei a besta eu mesmo!"
 fp1_yearly.0071.b.tt_failure:0 "A besta escapa do [marshal.GetFirstNameNoTooltip]"
 fp1_yearly.0071.b.tt_success:0 "Seu marechal e suas tropas caçam o monstro"
 fp1_yearly.0071.b:0 "[marshal.GetTitledFirstNameNoTooltip], cuide disso."
 fp1_yearly.0071.c:0 "Parece ser um urso. Lidem com isso vocês mesmos, covardes."
 fp1_yearly.0071.desc.intro:0 "Os camponeses de [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] são um bando supersticioso, frequentemente me procurando com alegações de feiticeiros, gigantes e deuses disfarçados.\n\nNormalmente, eu ignoro tais alegações como teatro de camponeses, mas desta vez eles trouxeram evidências:"
 fp1_yearly.0071.desc.outro.fallback:0 "\n\nOs moradores insistem que isto é nada menos que obra de um troll e exigem que eu vasculhe as florestas próximas para eliminá-lo."
 fp1_yearly.0071.desc.outro.loveli_lakes:0 "\n\nEu revirei a bagunça por apenas um curto período quando [loveli_lakes.GetTitledFirstName] avança.\n\n\"Isto não é um troll, [ROOT.Char.GetFirstNameNoTooltip], isto é obra de um møøse selvagem! Eu conheço a besta bem, incluindo sua mordida desagradável, e gravaria minha marca em seu cadáver.\""
 fp1_yearly.0071.desc.troll_type.bear:0 "um jovem camponês, com a cabeça esmagada em pó e polpa, e os pais chorando a morte do filho."
 fp1_yearly.0071.desc.troll_type.lynx:0 "uma dúzia de porcos abatidos, cada um despedaçado com cuidado demais para um animal selvagem descoordenado, mas claramente obra de garras, e não de uma faca."
 fp1_yearly.0071.desc.troll_type.moose:0 "o cadáver manchado de sangue de uma ovelha, claramente despedaçada, mas não comida, nem mesmo mastigada, grosseiramente triturada por garras que eu nunca vi."
 fp1_yearly.0071.desc.troll_type.wolf:0 "o cadáver de um famoso caçador, o peito rasgado, com a carne macia do coração devorada."
 fp1_yearly.0071.desc.troll_type.wolverine:0 "um monte de ossos e fragmentos de carne rasgada que eles insistem ter sido recentemente uma lavadeira idosa."
 fp1_yearly.0071.t:0 "Nos Lugares Profundos do Mundo"
 fp1_yearly.0081.a.tt_failure:0 "O urso te rasga ao meio"
 fp1_yearly.0081.a.tt_success:0 "Você mata o urso"
 fp1_yearly.0081.a:0 "Que a morte te leve, monstro!"
 fp1_yearly.0081.b.tt:0 "Você rasga a fera ao meio em uma fúria de berserker"
 fp1_yearly.0081.b:0 "#BER RAAAAAAAAAAAGH!#!"
 fp1_yearly.0081.c.tt_failure.tt:0 "Você sofre uma lesão grave #warning PERMANENTE#!"
 fp1_yearly.0081.c.tt_failure:0 "A fera te fere e escapa"
 fp1_yearly.0081.c.tt_success:0 "Você inspira seus soldados a matar o urso"
 fp1_yearly.0081.c:0 "Em cima, #EMP em cima#! e neles, lobos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!"
 fp1_yearly.0081.d:0 "#EMP FUJAAAAA!#!"
 fp1_yearly.0081.desc.finisher:0 "Não é um troll, mas ainda é nossa presa!"
 fp1_yearly.0081.desc.prelude:0 "As madeiras sussurram suavemente enquanto avançamos, segurando minha pequena equipe de funcionários em um abraço apertado e sombrio. Eu imagino que seja apenas o vento, mas alguns dizem que os trolls cantam como o vento quando estão sozinhos...\n\nVários desaparecimentos aconteceram perto desta clareira, tornando-a um acampamento provável para a fera. Pelo menos, é o que dizem os moradores locais.\n\n"
 fp1_yearly.0081.desc:0 "$fp1_yearly.0081.desc.prelude$Um rugido ensurdecedor reverbera pela floresta, e algo que eu tinha tomado como uma pedra se ergue, mostrando-se como um urso absolutamente #EMP imponente#!.\n\n$fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0081.hunt_invalidated.tt:0 "Circunstâncias imprevistas chamam sua atenção para longe"
 fp1_yearly.0081.hunt_invalidated:0 "Caça ao Troll de [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTierNoTooltip] encerrada"
 fp1_yearly.0081.t:0 "$fp1_yearly.0071.t$: Morte Iminente"
 fp1_yearly.0082.a.tt_failure:0 "O lobo te arranca a garganta"
 fp1_yearly.0082.a.tt_success:0 "Você mata o lobo"
 fp1_yearly.0082.a:0 "$fp1_yearly.0081.a$"
 fp1_yearly.0082.b.tt:0 "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0082.b:0 "$fp1_yearly.0081.b$"
 fp1_yearly.0082.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0082.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0082.c.tt_success:0 "Você encurrala, cerca e mata o lobo"
 fp1_yearly.0082.c:0 "Rally! Formem um círculo!"
 fp1_yearly.0082.d:0 "$fp1_yearly.0081.d$"
 fp1_yearly.0082.desc:0 "$fp1_yearly.0081.desc.prelude$Há um rosnado arrepiante atrás de nós, o som de pés se movendo, e então alguém na retaguarda da equipe grita. Eu giro a tempo de evitar o lobo gigante, com pelagem salpicada de prata pela idade e vermelha de sangue, enquanto ele passa correndo. $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0082.t:0 "$fp1_yearly.0071.t$: Morte Rápida"
 fp1_yearly.0083.a.tt_failure:0 "O texugo rasga suas entranhas"
 fp1_yearly.0083.a.tt_success:0 "Você mata o texugo"
 fp1_yearly.0083.a:0 "$fp1_yearly.0081.a$"
 fp1_yearly.0083.b.tt:0 "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0083.b:0 "$fp1_yearly.0081.b$"
 fp1_yearly.0083.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0083.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0083.c.tt_success:0 "Você atrai a besta para perto da cabana e a domina com o número de pessoas"
 fp1_yearly.0083.c:0 "Há uma cabana de caça aqui perto, recuem para pedir ajuda!"
 fp1_yearly.0083.d:0 "$fp1_yearly.0081.d$"
 fp1_yearly.0083.desc:0 "$fp1_yearly.0081.desc.prelude$O primeiro vislumbre da besta é quando ela arranca a garganta do soldado à minha esquerda: uma bola de pelo e dentes em rápida movimentação, mal maior que um cachorro, mas mais rápido que uma espada em queda. Um texugo enfurecido! $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0083.t:0 "$fp1_yearly.0071.t$: Morte Rabiosa"
 fp1_yearly.0084.a.tt_failure:0 "O lince quebra seu pescoço"
 fp1_yearly.0084.a.tt_success:0 "Você mata o lince"
 fp1_yearly.0084.a:0 "$fp1_yearly.0081.a$"
 fp1_yearly.0084.b.tt:0 "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0084.b:0 "$fp1_yearly.0081.b$"
 fp1_yearly.0084.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0084.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0084.c.tt_success:0 "Você supera o lince em astúcia e caça"
 fp1_yearly.0084.c:0 "Quietos! Vocês dois, flanqueiem-no, nós o empurraremos em direção a vocês..."
 fp1_yearly.0084.d:0 "$fp1_yearly.0081.d$"
 fp1_yearly.0084.desc:0 "$fp1_yearly.0081.desc.prelude$Eu congelo. De alguma forma, ela não nos viu, mas eu consigo apenas distinguir a forma agachada de um lince do outro lado do clareira. Um passo mais descuidado poderia ter sido meu último. $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0084.t:0 "$fp1_yearly.0071.t$: Morte Silenciosa"
 fp1_yearly.0085.a.tt_failure:0 "O alce destroça seus ossos"
 fp1_yearly.0085.a.tt_success:0 "Você mata o alce com a espada"
 fp1_yearly.0085.a:0 "$fp1_yearly.0081.a$"
 fp1_yearly.0085.b.tt:0 "$fp1_yearly.0081.b.tt$"
 fp1_yearly.0085.b:0 "$fp1_yearly.0081.b$"
 fp1_yearly.0085.c.tt_failure.tt:0 "$fp1_yearly.0081.c.tt_failure.tt$"
 fp1_yearly.0085.c.tt_failure:0 "$fp1_yearly.0081.c.tt_failure$"
 fp1_yearly.0085.c.tt_success:0 "Você derruba o alce sem ser pisoteado"
 fp1_yearly.0085.c:0 "Ponto fraco na base do pescoço! Lanças e arcos apenas!"
 fp1_yearly.0085.d:0 "$fp1_yearly.0081.d$"
 fp1_yearly.0085.desc.fallback:0 "$fp1_yearly.0081.desc.prelude$O silêncio é quebrado com um poderoso #EMP estrondo#! enquanto um titânico alce raivoso irrompe na cena, duas vezes a altura de uma [ROOT.Char.GetWomanMan], narinas espumando de raiva. $fp1_yearly.0081.desc.finisher$"
 fp1_yearly.0085.desc.loveli_lakes:0 "Com [loveli_lakes.GetTitledFirstName] liderando o caminho, é uma viagem curta até o covil da fera raivosa na floresta.\n\nSe tivéssemos a sorte de pegá-la dormindo, mas não, e o monstro titânico e feroz se ergue quando entramos em sua clareira, facilmente duas vezes a altura de uma [ROOT.Char.GetWomanMan].\n\nEle respira erraticamente, seus olhos girando com uma violência doentia da mente, cascos fendidos pisando.\n\nEntão ele ataca."
 fp1_yearly.0085.t:0 "$fp1_yearly.0071.t$: Morte Rampante"
 fp1_yearly.0091.a:0 "Um leviatã, para carregar meus espólios!"
 fp1_yearly.0091.b:0 "Um monstro, para intimidar meus vassalos!"
 fp1_yearly.0091.c:0 "Um dragão, para rugir meu nome!"
 fp1_yearly.0091.d:0 "Eu não preciso de uma embarcação cara."
 fp1_yearly.0091.desc:0 "Um navio longo [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] diz muito sobre [ROOT.Char.GetSheHe]. Isso lhe diz o quão rico [ROOT.Char.GetSheHe] é, quão bem-sucedido, que imagem [ROOT.Char.GetSheHe] deseja projetar para o resto do mundo.\n\nEu olho para minha embarcação atual e a considero...insuficiente. Como se para pontuar o pensamento, um pedaço da amarração se solta com um estalo, a embarcação inteira rangendo sinistramente enquanto redistribui a pressão.\n\nComissionar um novo navio é simples o suficiente, mas uma simples substituição é boa o bastante? Eu não mereço uma embarcação que conte ao mundo sobre #EMP mim#!?"
 fp1_yearly.0091.t:0 "Uma Embarcação digna de um [ROOT.Char.GetTitleAsNameNoTooltip]"
 fp1_yearly.0101.a.every_courtier_and_guest:0 "Cada [courtier|E] e [guest|E]"
 fp1_yearly.0101.a.tt_failure:0 "[riddler.GetFirstNameNoTooltip] te vence"
 fp1_yearly.0101.a.tt_success:0 "Você vence o jogo"
 fp1_yearly.0101.a:0 "Você testa #EMP minha#! capacidade de fala? Isso vai ser divertido!"
 fp1_yearly.0101.b:0 "Acho que li alguns livros sobre adivinhações..."
 fp1_yearly.0101.c.tt:0 "As pessoas podem lembrar de sua reação exagerada..."
 fp1_yearly.0101.c.tt_nickname:0 "Seus cortesãos sussurram pelas suas costas..."
 fp1_yearly.0101.c:0 "Para começar: quem não tem cérebro e está indo para a masmorra?"
 fp1_yearly.0101.d:0 "Obrigado, mas eu sou um [ROOT.Char.GetTitleAsNameNoTooltip], e tenho coisas a fazer."
 fp1_yearly.0101.desc:0 "Adivinhações são um passatempo amado entre os [ROOT.Char.GetCulture.GetNameNoTooltip]. Dois ou mais jogadores trocarão problemas cada vez mais difíceis, muitas vezes rimando e mergulhados em alegoria ou mito.\n\nEm um dia particularmente longo e preguiçoso, [riddler.Custom2('MyCharacterIntroduction',ROOT.Char)] pensa em me desafiar para um jogo, com o que deve ser metade das pessoas na corte assistindo."
 fp1_yearly.0101.t:0 "Um Jogo de Adivinhações"
 fp1_yearly.0111.a:0 "Isso cheira a [suspect_a.GetTitledFirstNameNoTooltip]!"
 fp1_yearly.0111.b:0 "Talvez... [suspect_b.GetTitledFirstNameNoTooltip]..."
 fp1_yearly.0111.c:0 "[suspect_c.GetTitledFirstNameNoTooltip] parece provável."
 fp1_yearly.0111.d.tt_failure:0 "[accursed.GetSheHe|U] sofre uma crise mental"
 fp1_yearly.0111.d.tt_success:0 "Você acalma [accursed.GetFirstName]"
 fp1_yearly.0111.d:0 "[accursed.GetFirstNameNoTooltip], você não vê que é tudo coisa da sua mente?"
 fp1_yearly.0111.desc.first_connector:0 "O texto real da maldição"
 fp1_yearly.0111.desc.intro:0 "[accursed.GetTitledFirstName] está silencioso enquanto eu caminho em volta do totem de pele de cavalo que fica em frente aos seus aposentos, inspecionando-o de todos os ângulos. [accursed.GetSheHe|U] está certa, é definitivamente um poste de nithing, uma maldição #EMP poderosa#! que ameaça sua própria vida.\n\nAs runas gravadas em seu cabo"
 fp1_yearly.0111.desc.outro:0 "\n\nNão temos testemunhas e nenhuma evidência #color_blue_gray além do próprio poste amaldiçoado."
 fp1_yearly.0111.desc.second_connector:0 "terminando com uma nota"
 fp1_yearly.0111.desc.skill.fallback:0 "são #color_blue_gray indecifráveis#!."
 fp1_yearly.0111.desc.skill.intrigue_high:0 "são #color_blue_gray intrincadas e floreadas, prometendo um destino retorcido e doloroso#!."
 fp1_yearly.0111.desc.skill.intrigue_low:0 "são #color_blue_gray cruéis, mas vagas, como se os pensamentos sanguinários do trapaceiro vagassem#!."
 fp1_yearly.0111.desc.skill.learning_high:0 "são #color_blue_gray profundas e manchadas de sangue, claramente trabalhadas por um feiticeiro erudito#!."
 fp1_yearly.0111.desc.skill.learning_low:0 "estão #color_blue_gray em mau estado e encharcadas de sangue, o sinal de um feiticeiro amador#!."
 fp1_yearly.0111.desc.trait_1.brave_or_trusting:0 "#color_blue_gray é audaciosa e marcante, confiante em sua justiça#!,"
 fp1_yearly.0111.desc.trait_1.callous_or_ambitious:0 "#color_blue_gray sugere uma completa falta de consideração pelos outros seres humanos#!,"
 fp1_yearly.0111.desc.trait_1.calm_or_patient:0 "é #color_blue_gray quase assustadoramente calmo e insidioso#!,"
 fp1_yearly.0111.desc.trait_1.deceitful_or_craven:0 "#color_blue_gray se torce e se contorce repetidamente em si mesma#!,"
 fp1_yearly.0111.desc.trait_1.fallback:0 "#color_blue_gray é uma bagunça aleatória#!,"
 fp1_yearly.0111.desc.trait_1.lazy_or_arbitrary:0 "#color_blue_gray parece indeciso e preguiçoso#!,"
 fp1_yearly.0111.desc.trait_1.paranoid_or_vengeful:0 "#color_blue_gray parece cheia de um ódio pessoal absoluto#!,"
 fp1_yearly.0111.desc.trait_1.sadistic_or_arrogant:0 "#color_blue_gray fala de um grande ego ou de uma imaginação horripilante#!,"
 fp1_yearly.0111.desc.trait_1.wrathful_or_impatient:0 "está #color_blue_gray fervilhando com uma raiva inquieta#!,"
 fp1_yearly.0111.desc.trait_2.brave_or_trusting:0 "de confiança sincera no destino [accursed.GetFirstNamePossessiveNoTooltip]#! de #color_blue_gray."
 fp1_yearly.0111.desc.trait_2.callous_or_ambitious:0 "de finalidade brutal e indiferente#! de #color_blue_gray."
 fp1_yearly.0111.desc.trait_2.calm_or_patient:0 "de inevitabilidade aterrorizante#! de #color_blue_gray."
 fp1_yearly.0111.desc.trait_2.deceitful_or_craven:0 "de covardia torcida#! de #color_blue_gray."
 fp1_yearly.0111.desc.trait_2.fallback:0 "de anticlímax#! de #color_blue_gray."
 fp1_yearly.0111.desc.trait_2.lazy_or_arbitrary:0 "isso é algo de um anticlímax mal explicado#! de #color_blue_gray."
 fp1_yearly.0111.desc.trait_2.paranoid_or_vengeful:0 "que culpa [accursed.GetFirstNameNoTooltip] pelo seu destino#! de #color_blue_gray."
 fp1_yearly.0111.desc.trait_2.sadistic_or_arrogant:0 "de gênio horrível#! de #color_blue_gray."
 fp1_yearly.0111.desc.trait_2.wrathful_or_impatient:0 "de raiva rabiscada às pressas#! de #color_blue_gray."
 fp1_yearly.0111.e:0 "Não se preocupe, eu tenho um contra-feitiço!"
 fp1_yearly.0111.t:0 "Maldição"
 fp1_yearly.0111.tt.correct_accusation.tt:0 "[accursed.GetTitledFirstName] é libertado da maldição e eternamente grato"
 fp1_yearly.0111.tt.correct_accusation:0 "Você encontra amplas evidências da culpa de [culprit.GetFirstNamePossessiveNoTooltip]"
 fp1_yearly.0111.tt.correct_guess:0 "Se o seu palpite estiver correto"
 fp1_yearly.0111.tt.false_accusation.tt:0 "[accursed.GetTitledFirstName] está convencido de que seu fim virá dolorosamente em breve"
 fp1_yearly.0111.tt.false_accusation:0 "Suas acusações provam ser infundadas"
 fp1_yearly.0111.tt.wrong_guess:0 "Se o seu palpite estiver errado"
 fp1_yearly.0501.a.tt_failure:0 "O navio afunda com todos a bordo"
 fp1_yearly.0501.a.tt_success:0 "Você salva a tripulação"
 fp1_yearly.0501.a:0 "Pare e tente ajudá-los!"
 fp1_yearly.0501.b.tt_failure:0 "Os sobreviventes escapam para a costa"
 fp1_yearly.0501.b.tt_success:0 "Você aborda o barco facilmente"
 fp1_yearly.0501.b:0 "Podemos ficar com o saque se matarmos os sobreviventes..."
 fp1_yearly.0501.c:0 "Vamos apenas continuar navegando."
 fp1_yearly.0501.desc:0 "Há muitas razões para eu navegar nas águas perto de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] em tempos de paz: mostrar poder, dissuadir piratas, até mesmo pescar ou desfrutar da brisa do mar.\n\nEstamos em uma dessas viagens simples quando avisto uma embarcação local lutando na distância.\n\nMesmo daqui, está claro que ela sofreu danos enquanto estava em um ataque, sua tripulação mal mantendo-a a flutuar enquanto esvaziam a água com taças de prata e tigelas de cerâmica. A visão seria cômica se não fosse tão séria."
 fp1_yearly.0501.t:0 "Em um passeio de barco"
 fp1_yearly.0511.a:0 "É muito legal, [stinker.GetFirstNameNoTooltip]. Muito, muito legal."
 fp1_yearly.0511.b:0 "Pelo [ROOT.Char.GetFaith.HighGodName], [ROOT.Char.GetFaith.HealthGodName] e [ROOT.Char.GetFaith.HouseholdGodName] também, se #EMP livre#! disso!"
 fp1_yearly.0511.c:0 "$fp1_berserk_roar_evtopt$"
 fp1_yearly.0511.d:0 "E se conseguíssemos uma #EMP nova#! troféu amanhã à noite?"
 fp1_yearly.0511.desc:0 "#EMP Este cheiro é completamente insuportável#!.\n\nJá faz um mês desde que [stinker.GetFirstName] derrubou aquele maldito [ROOT.Char.Custom('LocalAnimal')] durante uma caçada, e [stinker.GetSheHe] ainda está carregando sua cabeça cheia de larvas.\n\nTodo mundo em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] está cansado disso, mas [stinker.GetSheHe] se recusa a se livrar da maldita coisa.\n\nParece que o resto da corte finalmente teve o suficiente e forçou [stinker.GetSheHe] a vir até mim para uma decisão."
 fp1_yearly.0511.e:0 "Sim, [stinker.GetFirstNameNoTooltip], é repugnante. Agora por favor saia."
 fp1_yearly.0511.t:0 "O Cheiro do Sucesso"
 fp1_yearly.0521.a.tt:0 "Você e [child.GetFirstNameNoTooltip] jogam bolas de neve até as pontas dos dedos congelarem"
 fp1_yearly.0521.a:0 "Bom arremesso! Venha aqui, seu pestinha!"
 fp1_yearly.0521.b.tt:0 "Você deixa [child.GetFirstNameNoTooltip] atirar em você à vontade"
 fp1_yearly.0521.b:0 "#EMP Ah! Não! Você me pegou!#!"
 fp1_yearly.0521.c.tt:0 "Criança ou não, isso é uma batalha e você pretende vencer!"
 fp1_yearly.0521.c.tt_failure:0 "[child.GetFirstNameNoTooltip] te derrota"
 fp1_yearly.0521.c.tt_success:0 "Você derrota a criança com sucesso"
 fp1_yearly.0521.c:0 "Você acha que pode enfrentar #EMP eu#! numa #EMP guerra de neve#!?"
 fp1_yearly.0521.d.tt:0 "Você vence a batalha de bolas de neve sem esforço"
 fp1_yearly.0521.d:0 "Isso é uma emboscada? #EMP Verdadeira#! estratégia exige #EMP astúcia#!!"
 fp1_yearly.0521.desc:0 "Isso veio do nada, me atingindo limpo na têmpora. Eu nem vi o projétil vindo, muito menos tentei esquivar, e por um momento eu cambaleio, cegado.\n\nUm som agudo de risadinhas ecoa atrás de mim, e eu me viro.\n\n[child.GetFirstName] se levanta de seu esconderijo, outra bola de neve já agarrada em sua mãozinha vingativa."
 fp1_yearly.0521.e.tt:0 "A bola de neve acende sua fúria descontrolada"
 fp1_yearly.0521.e:0 "$fp1_berserk_roar_evtopt$"
 fp1_yearly.0521.f:0 "Estou ocupado, [child.GetFirstNameNoTooltip]. Vá incomodar outra pessoa."
 fp1_yearly.0521.t:0 "Sangue na Neve"
 fp1_yearly.0531.a.tt_failure:0 "Você simplesmente frustra [child.GetSheHe] ainda mais"
 fp1_yearly.0531.a.tt_success:0 "[child.GetFirstNameNoTooltip] ganha confiança e equilíbrio"
 fp1_yearly.0531.a:0 "É fácil! Aqui, deixe-me explicar para você..."
 fp1_yearly.0531.b:0 "Não temos servos para você perturbar?"
 fp1_yearly.0531.c:0 "Vá brincar dentro de casa, você vai pegar um resfriado."
 fp1_yearly.0531.desc:0 "\"[ROOT.Char.Custom('GetMaPa')|U]!\" grita [child.GetFirstName], puxando minha manga assim que chegamos ao lago. \"Não adianta, eu sou inútil. Não consigo patinar, o gelo me odeia.\"\n\nUm olhar rápido sugere que [child.GetSheHe] pode estar certo: o lugar parece que um exército passou por aqui, com a quantidade de gelo quebrado que [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')] deixou em seu rastro."
 fp1_yearly.0531.t:0 "A Família [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] no Gelo"
 fp1_yearly.0541.a:0 "Isso é, honestamente, muito engraçado."
 fp1_yearly.0541.b:0 "[child.GetFirstNameNoTooltip], você precisa ser punido."
 fp1_yearly.0541.c:0 "Você incomoda #EMP meu#! [child.Custom('GetDaughterSon')]? Você está exilado!"
 fp1_yearly.0541.d:0 "Realmente, #EMP profundamente#! não me importo."
 fp1_yearly.0541.desc:0 "\"Meu [ROOT.Char.GetTitleAsNameNoTooltip]\", resmunga [courtier.GetTitledFirstName] enquanto [courtier.GetSheHe] marcha até mim, arrastando minha [child.Custom('GetDaughterSon')] [child.GetFirstName] pela orelha.\n\n\"Essa criança irritante tem ficado à espreita em esquinas, vestindo uma pele de [ROOT.Char.Custom('LocalAnimal')] como fantasia, só para pular gritando e assustando as pessoas!\""
 fp1_yearly.0541.t:0 "A Besta de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 fp1_yearly.0551.a.tt_failure:0 "[antisocialite.GetFirstNameNoTooltip] está incrivelmente insultado"
 fp1_yearly.0551.a.tt_success:0 "Você expressa seu ponto de vista com eloquência"
 fp1_yearly.0551.a:0 "Sente-se, [antisocialite.GetFirstNameNoTooltip]. Precisamos conversar."
 fp1_yearly.0551.b.tt:0 "[antisocialite.GetFirstNameNoTooltip] continuará a fedorentar o lugar"
 fp1_yearly.0551.b:0 "Talvez eu possa simplesmente mudar de quarto?"
 fp1_yearly.0551.b_alt.tt:0 "Você e [antisocialite.GetFirstNameNoTooltip] vão fedorentar juntos"
 fp1_yearly.0551.b_alt:0 "Hum... você tem mais disso?"
 fp1_yearly.0551.c:0 "Você sabe o que? Dungeon. #EMP Agora!#."
 fp1_yearly.0551.d:0 "Que pena, parece que minha atenção é necessária #EMP muito# longe!"
 fp1_yearly.0551.desc:0 "Começou como um agrado ocasional. Um hábito incomum, mas eu sou uma boa [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan], e que [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan] nunca comeu algum arenque duvidoso em sua vida?\n\nNas últimas semanas, no entanto, a predileção de [antisocialite.GetTitledFirstNamePossessive] por peixes #EMP podres#! tem passado de uma idiossincrasia tolerável para uma onipresença fedorenta.\n\nEsta manhã, quando descobri o que [antisocialite.GetSheHe] fez com a latrina, decidi que já era suficiente. Encontrei [antisocialite.GetSheHe] no corredor, com o rosto encharcado em salmoura fétida, meio olho de peixe escorrendo preguiçosamente pelo queixo."
 fp1_yearly.0551.t:0 "Negócios Suspeitos"
 fp1_yearly.0561.a.tt_failure:0 "[knight.GetFirstNameNoTooltip] vence"
 fp1_yearly.0561.a.tt_success:0 "Você vence [knight.GetFirstNameNoTooltip]"
 fp1_yearly.0561.a:0 "Você me desafia?"
 fp1_yearly.0561.b.tt:0 "Você vence facilmente três vezes seguidas"
 fp1_yearly.0561.b:0 "#EMP estala os dedos#!"
 fp1_yearly.0561.c.tt_failure:0 "[knight.GetFirstNameNoTooltip] descobre sua duplicidade"
 fp1_yearly.0561.c.tt_success:0 "Você trapaceia e vence dramaticamente"
 fp1_yearly.0561.c:0 "Claro, eu conheço um truque ou dois..."
 fp1_yearly.0561.d:0 "[knight.GetFirstNameNoTooltip], estou comendo. Vá incomodar outra pessoa."
 fp1_yearly.0561.desc:0 "\"O que você acha, [ROOT.Char.GetFirstNameNoTooltip]?\" arrota [knight.Custom2('MyCharacterIntroduction', ROOT.Char)] entre goles de sua caneca. A [knight.Custom('GetYoungMiddleAgedOld')] [knight.GetWomanMan] flexiona seus músculos com orgulho. \n\n\"Você acha que pode me vencer em queda de braço? Vamos lá, o primeiro a três.\"\n\nMeu garfo pausa no caminho para minha boca, mas a taverna explode em gritos e vivas, membros menores da minha comitiva ansiosos para testemunhar o duelo."
 fp1_yearly.0561.t:0 "Meu Braço Contra o Seu"
 fp1_yearly.0571.a:0 "Deixe [Select_CString( child.IsFemale, 'a', 'o' )] [child.Custom('GirlBoy')] comigo, eu vou conversar com [child.GetSheHe]."
 fp1_yearly.0571.b.2:0 "Está tudo bem, eu posso pagar por isso."
 fp1_yearly.0571.b.tt:0 "A pedra rúnica é reparada"
 fp1_yearly.0571.b:0 "Vou cobrar o custo dos reparos de #EMP suas#! coisas, [child.GetFirstNameNoTooltip]!"
 fp1_yearly.0571.c:0 "[child.GetSheHe|U] é apenas uma criança, [courtier.GetFirstNameNoTooltip], acalme-se."
 fp1_yearly.0571.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" grita [courtier.Custom2('MyCharacterIntroduction', ROOT.Char)]. Atrás [courtier.GetSheHe], o [courtier.GetWomanMan] puxa meu [child.Custom('GetDaughterSon')] [child.GetFirstName], os dois tão ocupados franzindo a testa um para o outro que mal fazem contato visual comigo. \n\n\"Essa criança foi pega vandalizando sua pedra rúnica em [vandal_site.GetNameNoTier], pintando órgãos genitais nos dragões e arranhando obscenidades no lugar das palavras.\""
 fp1_yearly.0571.t:0 "Vandalismo Mesquinho"
 fp1_yearly.0571.tt_failure:0 "[child.GetFirstNameNoTooltip] não entende qual é o problema"
 fp1_yearly.0571.tt_success:0 "[child.GetFirstNameNoTooltip] vê o erro de seus caminhos"
 fp1_yearly.0581.a.tt:0 "[child.GetFirstNameNoTooltip] é significativamente mais propenso(a) a se tornar uma [GetTrait('shieldmaiden').GetName(child.Self)]"
 fp1_yearly.0581.a:0 "Minha criança, você fará o próprio mundo #EMP tremer#!"
 fp1_yearly.0581.b.tt:0 "$fp1_yearly.0581.a.tt$"
 fp1_yearly.0581.b:0 "Um objetivo nobre! Vá em frente, aventureiro!"
 fp1_yearly.0581.c:0 "Talvez, se você se provar contra [victim.GetFirstNameNoTooltip]..."
 fp1_yearly.0581.d:0 "Pare de me incomodar com sonhos tolos."
 fp1_yearly.0581.desc.intro:0 "Uma dor repentina e aguda na parte de trás da minha canela é acompanhada por um grito ensurdecedor vindo de trás de mim. Eu viro, pronta para me defender, e sou confrontada com a pequena forma de [child.GetFirstName] empunhando um pesado pedaço de madeira como um porrete."
 fp1_yearly.0581.desc.outro:0 "\n\n\"Temam-me! O terrível viking [child.GetFirstNameNoTooltip] veio atrás do seu ouro e dos seus monges!\" grita meu [child.Custom('GetDaughterSon')], acompanhando com um golpe na minha perna. Seu capacete de lata escorrega sobre seus olhos, então tudo o que eu posso ver é um sorriso banguela me olhando.\n\n\"[ROOT.Char.Custom('GetMaPa')|U], eu posso ser uma [child.Custom('ShieldPersonFemaleMale')] quando eu crescer?\""
 fp1_yearly.0581.desc.victim:0 "Por trás, [child.GetSheHe] sorri [victim.Custom2('MyCharacterIntroduction', ROOT.Char)]."
 fp1_yearly.0581.e:0 "Hah! Veremos, pequenino."
 fp1_yearly.0581.t:0 "Quando Eu Crescer"
 fp1_yearly.0591.a:0 "O povo de [county_a.GetNameNoTierNoTooltip] está correto."
 fp1_yearly.0591.b:0 "[county_b.GetNameNoTierNoTooltip] tem meu apoio!"
 fp1_yearly.0591.c:0 "Os bons [county_a.GetNameNoTierNoTooltip][dummy_gender.GetWomenMen] vão deixar isso para #EMP [county_b.GetNameNoTierNoTooltip] #EMP!?"
 fp1_yearly.0591.d:0 "Todos eles vão cansar eventualmente."
 fp1_yearly.0591.desc.bad_luck:0 "estão chorando que foram enfeitiçados e amaldiçoados por conjuradores de [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.border_dispute:0 "estão discutindo sobre uma vila ao longo da fronteira com [county_b.GetNameNoTier], com ambos os grupos reivindicando a terra."
 fp1_yearly.0591.desc.disrupted_wedding:0 "exigem restituição por um casamento que foi jogado no caos por convidados bêbados de [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.drunken_arson:0 "protestam por sua inocência em uma série de incêndios criminosos cometidos por alcoólatras em [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.fly_tipping:0 "estão sendo teimosos ao despejar lixo de uma cidade ao longo da fronteira com [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.kidnapped_child:0 "estão gritando com seus colegas de [county_b.GetNameNoTier] por supostamente sequestrar uma criança."
 fp1_yearly.0591.desc.lost_dog:0 "afirmam que o cão icônico de uma vila foi roubado por desordeiros ciumentos de [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.sheltered_criminal:0 "deram abrigo a um criminoso de [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc.stolen_flocks:0 "acusam um magnata proeminente de [county_b.GetNameNoTier] de roubar seus rebanhos."
 fp1_yearly.0591.desc.suspicious_will:0 "estão insistindo na validade de um testamento que deixa grandes faixas de terra para eles em [county_b.GetNameNoTier]."
 fp1_yearly.0591.desc:0 "As reuniões ting são uma tarefa necessária para qualquer [ROOT.Char.GetTitleAsNameNoTooltip] decente, com todas as [dummy_gender.GetWomenMen] livres da área comparecendo para discutir assuntos locais, o mercado e disputar privilégios.\n\nComo é de se esperar com grandes reuniões, elas têm o hábito de ficar acaloradas, e este Ting não é exceção.\n\nEu luto para acompanhar os detalhes através de todo o barulho, mas parece que [dummy_gender.GetWomenMen] de [county_a.GetNameNoTier]"
 fp1_yearly.0591.t:0 "Vozes Elevadas na Reunião Ting"
 fp1_yearly.0601.a.tt_failure:0 "Você cai de sua cadeira."
 fp1_yearly.0601.a.tt_success:0 "Você persevera e permanece composto(a)."
 fp1_yearly.0601.a:0 "Preciso. Ficar. Acordado(a)."
 fp1_yearly.0601.b:0 "Eu poderia estar fazendo coisas tão úteis com esse tempo..."
 fp1_yearly.0601.c:0 "$fp1_yearly.0601.b$"
 fp1_yearly.0601.d:0 "$fp1_yearly.0601.b$"
 fp1_yearly.0601.desc:0 "Por sua própria natureza, as reuniões de Ting podem ser extremamente entediantes.\n\nSe os ânimos não se exaltam e ninguém se torna dramático, então é apenas uma longa lista de funcionários de baixo escalão discutindo assuntos insignificantes e ficando debaixo da chuva. No entanto, como [ROOT.Char.GetTitleAsNameNoTooltip], sou obrigado a estar aqui.\n\nEnvelhecendo a cada segundo.\n\nObservando as [dummy_gender.GetWomenMen] de [county.GetNameNoTier] conversarem até a morte.\n\nDesejando por uma guerra para me salvar deste inferno vivo."
 fp1_yearly.0601.e:0 "$fp1_yearly.0601.b$"
 fp1_yearly.0601.f:0 "$fp1_yearly.0601.b$"
 fp1_yearly.0601.g.nickname:0 "Suas palhaçadas resultam em um novo apelido"
 fp1_yearly.0601.g:0 "Isso é inútil, vou tirar uma soneca."
 fp1_yearly.0601.t:0 "A Parte Mais Difícil de Governar"
 fp1_yearly.0611.a.tt_failure:0 "Apenas falar gera sentimentos de amargura"
 fp1_yearly.0611.a.tt_success:0 "[child_a.GetFirstNameNoTooltip] entende e pede desculpas"
 fp1_yearly.0611.a:0 "Escute, guerra não é brincadeira!!"
 fp1_yearly.0611.b:0 "Ha! Você está seguindo os passos do seu velho [ROOT.Char.Custom('GetMaPa')], [child_a.GetFirstNameNoTooltip]!"
 fp1_yearly.0611.c:0 "Certo, [child_b.GetFirstNameNoTooltip], deixe-me te ensinar a se defender de valentões."
 fp1_yearly.0611.d:0 "Crianças, levem isso para a sua enfermeira."
 fp1_yearly.0611.desc:0 "\"[ROOT.Char.Custom('GetMaPa')|U]!\" grita [child_b.GetFirstNameNoTooltip], correndo até mim, chorando, com [child_a.GetFirstNameNoTooltip], que parece culpado, em reboque. Uma grande ferida marca o rosto do meu [child_b.Custom('GetDaughterSon')], superficial, mas ainda jorrando sangue. \"[child_a.GetSheHe|U] me bateu com uma espada de verdade! Disse que [child_a.GetSheHe] ia ser um guerreiro como você!\".\n\n[child_a.GetFirstNameNoTooltip] não consegue me encarar nos olhos.\n\n\"Foi um acidente. Só estávamos brincando...\""
 fp1_yearly.0611.t:0 "Liderando pelo Exemplo"
 fp1_yearly.0621.a:0 "Claro que pode pegá-lo!"
 fp1_yearly.0621.b:0 "Nada agora: talvez quando for mais velho, possa ganhar o seu próprio."
 fp1_yearly.0621.c:0 "Fora daqui! Isso é para os adultos!"
 fp1_yearly.0621.desc:0 "Estamos apenas descarregando o último dos tesouros frescos dos navios quando minha [child.Custom('GetDaughterSon')] [child.GetFirstName] chega, toda sorridente e pedindo histórias. Quantos [dummy_gender.GetWomenMen] eu derrubei? Quando [child.GetSheHe] pode vir em um ataque? Eu vi algum dragão marinho?\n\nO bombardeio de perguntas só termina quando [Select_CString( child.IsFemale, 'a', 'o' )] [child.Custom('GirlBoy')] vê um enorme cálice de prata sobre o maior baú do tesouro, o sangue seco de seu antigo dono ainda descamando suavemente do lado.\n\n\"[ROOT.Char.Custom('GetMaPa')|U], isso é lindo! Posso... posso ficar com ele?\""
 fp1_yearly.0621.t:0 "Um Brinquedo Novo e Brilhante"
 fp1_yearly.0631.a.tt_failure:0 "[cynic.GetFirstNameNoTooltip] faz você parecer um tolo"
 fp1_yearly.0631.a.tt_success:0 "Você consegue envergonhar [cynic.GetSheHe]"
 fp1_yearly.0631.a:0 "[cynic.GetFirstNameNoTooltip], você está quase blasfemando!"
 fp1_yearly.0631.b:0 "Hmm, boa ideia. Toda ajuda é bem-vinda..."
 fp1_yearly.0631.c:0 "Ah, não é da minha conta."
 fp1_yearly.0631.desc:0 "Ao retornar de um ataque bem-sucedido, [Select_CString( cynic.IsFemale, 'toda boa', 'todo bom' )] [cynic.GetWomanMan] [ROOT.Char.GetCulture.GetNameNoTooltip] sabe que deve sacrificar um pouco de seus ganhos para [ROOT.Char.GetFaith.PantheonTerm].\n\nTodo bom [ROOT.Char.GetCulture.GetNameNoTooltip], exceto [cynic.GetTitledFirstName].\n\nEnquanto o resto de nós divide os despojos, se vangloriando das melhores peças e discutindo qual vamos oferecer em agradecimento à boa sorte e aos ventos favoráveis, eu percebo que [cynic.GetSheHe] permanece em silêncio.\n\nAo confrontar o [cynic.GetWomanMan], [cynic.GetSheHe] até admite: 'Não vi a mão de [cynic.GetFaith.PantheonTerm] em nosso ataque, meu [ROOT.Char.GetTitleAsNameNoTooltip], apenas minhas próprias mãos fazendo meu próprio trabalho. Minha parte é para mim.'"
 fp1_yearly.0631.t:0 "Uma Tendência Cínica"
 fp1_yearly.0641.a.tt:0 "Os navios são reparados sem problemas"
 fp1_yearly.0641.a:0 "Não deve custar tanto para consertá-los..."
 fp1_yearly.0641.b.tt_failure:0 "Você é pego e tem que fugir"
 fp1_yearly.0641.b.tt_success:0 "Você consegue roubar os melhores navios de [neighbour.GetFirstNamePossessiveNoTooltip]"
 fp1_yearly.0641.b:0 "Não [neighbour.GetTitledFirstNameNoTooltip] tem uma frota nova?"
 fp1_yearly.0641.c:0 "Vai economizar a longo prazo pagar pelo melhor agora."
 fp1_yearly.0641.d:0 "Ah, deixe-os apodrecer. Qual é o problema?"
 fp1_yearly.0641.desc:0 "Os navios longos são, de muitas maneiras, o coração do poder de um [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]. Sem acesso ao mar, o que somos senão lobos encurralados, incapazes de caçar ou vagar?\n\nÉ com grande alarme, então, que minha última inspeção dos nossos barcos armazenados mostra que muitos estão começando a apodrecer e perecer, seus cascos cuidadosamente encaixados em perigo de se desfazerem ao retornar à água."
 fp1_yearly.0641.t:0 "Digno do Oceano"
 fp1_yearly.0651.a.tt_failure:0 "A besta escapa de você"
 fp1_yearly.0651.a.tt_success:0 "Você mata a baleia e a leva para a costa"
 fp1_yearly.0651.a:0 "Peguem as arpoadas!"
 fp1_yearly.0651.b:0 "Deixem os outros lidarem com isso, apenas me tragam o cadáver."
 fp1_yearly.0651.c.tt:0 "Você enfrenta um #EMP verdadeiro#! leviatã dos abismos"
 fp1_yearly.0651.c.tt_failure:0 "$fp1_yearly.0651.a.tt_failure$"
 fp1_yearly.0651.c.tt_success:0 "$fp1_yearly.0651.a.tt_success$"
 fp1_yearly.0651.c:0 "Que presa #EMP magnífica#!"
 fp1_yearly.0651.d.tt:0 "A baleia vai livre"
 fp1_yearly.0651.d:0 "Uma criatura de majestade temível, deixe-a ir."
 fp1_yearly.0651.desc:0 "É dever de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] forte [ROOT.Char.GetTitleAsNameNoTooltip] passar tempo no mar, com o ar salgado em seu rosto e uma bela embarcação sob os seus pés. Hoje, minha embarcação pessoal e um pequeno esquadrão de escolta estão em um treino, prática e prazer.\n\nA curta viagem foi uma mudança revigorante de ritmo da vida em [ROOT.Char.Custom('GetCourt')], quando a avistamos: uma distante pluma de água, seguida por uma pequena ilha de carne vinho-escura rolando nas ondas.\n\nA maior besta de todas as profundezas.\n\nUm #EMP baleia#!."
 fp1_yearly.0651.t:0 "Leviatã"
 fp1_yearly.0661.a.2.tt:0 "Você vence facilmente"
 fp1_yearly.0661.a.2:0 "Na neve? Eu aceito."
 fp1_yearly.0661.a.tt_failure:0 "[knight.GetFirstNameNoTooltip] escorrega para a vitória"
 fp1_yearly.0661.a.tt_success:0 "É por pouco, mas você vence!"
 fp1_yearly.0661.a:0 "Que incomum! Eu aceito."
 fp1_yearly.0661.b.tt_failure:0 "Você é descoberto danificando os esquis de [knight.GetFirstNamePossessiveNoTooltip]"
 fp1_yearly.0661.b.tt_success:0 "Você marca uma vitória #EMP sem esforço#!"
 fp1_yearly.0661.b:0 "Hmm, talvez eu pudesse usar uma pequena #EMP vantagem#!..."
 fp1_yearly.0661.c:0 "#EMP Competir#! esquiando? Sem caça? Parece chato."
 fp1_yearly.0661.desc:0 "Tudo o que estou dizendo, [ROOT.Char.GetTitledFirstNameNoTooltip], é que esquiar é divertido mesmo sem caçar. Não deveria ser tão incomum esquiar pela alegria, não apenas pela utilidade\", lamenta [knight.GetTitledFirstName] durante o jantar.\n\nSinto como se estivesse nessa conversa por toda a minha vida. A obcecada [knight.Custom('WomanManPossessive')].\n\n\"Deveríamos experimentar, agora, enquanto a neve está espessa e fresca! Há uma colina íngreme não muito longe daqui. Aposto que posso chegar ao fundo antes de você, e ambos teremos um ótimo tempo!\""
 fp1_yearly.0661.t:0 "Um Desafio Novo"
 fp1_yearly.0671.a:0 "Hah, deixe-me arranjar uma mesa para nós!"
 fp1_yearly.0671.b:0 "Vamos, vamos pegar uma bandeja com os cozinheiros!"
 fp1_yearly.0671.c:0 "Vá perguntar para [Select_CString( sibling.IsFemale, 'sua', 'seu' )] [sibling.Custom('SisterBrother')]."
 fp1_yearly.0671.d:0 "Vá embora, [ROOT.Char.GetMotherFather] está descansando."
 fp1_yearly.0671.desc:0 "\"[ROOT.Char.Custom('GetMaPa')|U]!\" grita [child.GetFirstNameNoTooltip], diretamente em meu ouvido. Meus olhos abrem relutantemente, um de cada vez. Suponho que essa é uma maneira de acordar.\n\nA pequena criança ao lado da minha cama está vibrando de emoção, segurando luvas e um caro prato de madeira.\n\n\"Está nevando lá fora e eu quero ir #EMP brincar de trenó#! Você vai me levar?\""
 fp1_yearly.0671.t:0 "Uma Escorregada Perigosa"
 fp1_yearly.0681.a:0 "Vou deixar você para proteger [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], está bem?"
 fp1_yearly.0681.b.haughty_knights:0 "Cada cavaleiro arrogante [knight|E]"
 fp1_yearly.0681.b:0 "#EMP Hah!#! Você nunca será um guerreiro #EMP verdadeiro#!, criança."
 fp1_yearly.0681.c:0 "Nós falaremos sobre isso quando você for mais velho."
 fp1_yearly.0681.desc:0 "Meus $knight_culture_player_plural_no_tooltip_lowercase$ e eu estamos desfrutando de uma noite agradável em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], compartilhando histórias de batalhas antigas e saques passados, rindo, se gabando e mergulhando profundamente em nossas bebidas. Um bom momento, em resumo.\n\nBorrosamente, percebo uma sombra rondando a porta do meu estudo e chamo o intruso para dentro. As mãos voam para as espadas ao redor da sala.\n\nEm vez de um assassino, minha [child.Custom('GetDaughterSon')] [child.GetFirstName] emerge, com o rosto determinado, [child.Custom('HandHands')] agarradas em pequenos [child.Custom('Fist_ArticleBlank')][child.Custom('FistFists')].\n\n\"[ROOT.Char.Custom('GetMaPa')|U], eu também quero ir saquear! Não é justo que eu seja deixado para trás só porque sou jovem!\""
 fp1_yearly.0681.t:0 "Por que não posso ir?"
 fp1_yearly.0691.a.tt_failure:0 "[knight.GetSheHe|U] se recusa a ver a razão"
 fp1_yearly.0691.a.tt_success:0 "Você traz [knight.GetFirstNameNoTooltip] de volta à luz"
 fp1_yearly.0691.a:0 "Certamente posso convencê-lo desta fé estrangeira?"
 fp1_yearly.0691.b.same_faith_courtiers_and_guests:0 "[courtiers|E] e [guests|E] do mesmo [faith|E]"
 fp1_yearly.0691.b:0 "[knight.GetFaith.GetReligion.GetNameNoTooltip]? Você ficou louco. Guardas!"
 fp1_yearly.0691.c:0 "Você pode partir se quiser."
 fp1_yearly.0691.desc:0 "É tarde quando [knight.GetTitledFirstName] se aproxima de mim, com uma bolsa cheia pendurada em suas costas.\n\n\"[ROOT.Char.GetTitledFirstNameNoTooltip], sinto muito em ter que lhe dizer isso, mas não posso mais continuar em seu serviço.\n\n\"Desde o ataque a [county.GetNameNoTier], tenho sido consumido pela culpa por minhas ações e meus servos [knight.GetFaith.GetAdherentNamePlural] me dizem que somente aceitando [knight.GetFaith.HighGodName] em meu coração poderei salvar minha alma.\n\n\"Com um coração pesado, devo deixar sua corte pecaminosa e as coisas terríveis que faço em seu emprego.\""
 fp1_yearly.0691.t:0 "Tentativa de Expiação"
 fp1_yearly.1001.a:0 "[stranger.GetSheHe|U] provavelmente é inofensivo."
 fp1_yearly.1001.b:0 "Vagabundo? Eu farei [stranger.GetSheHe] um convidado de honra!"
 fp1_yearly.1001.c:0 "Guardas! Expulsem esse mendigo!"
 fp1_yearly.1001.desc.behaviour_1.confident:0 "[stranger.GetSheHe|U] anda confiantemente #EMP por toda parte#!,"
 fp1_yearly.1001.desc.behaviour_1.earnest:0 "[stranger.GetSheHe|U] passa horas tendo conversas sérias com cortesãos,"
 fp1_yearly.1001.desc.behaviour_1.eats_their_fill:0 "[stranger.GetSheHe|U] nunca deixa um bocado intocado no jantar,"
 fp1_yearly.1001.desc.behaviour_1.leaves_early:0 "[stranger.GetSheHe|U] sempre sai cedo do jantar,"
 fp1_yearly.1001.desc.behaviour_1.sneaks:0 "[stranger.GetSheHe|U] se esgueira pelo lugar,"
 fp1_yearly.1001.desc.behaviour_1.talkative:0 "[stranger.GetSheHe|U] passa horas conversando com qualquer pessoa e todos,"
 fp1_yearly.1001.desc.behaviour_2.confident:0 "e caminha confiante por toda parte."
 fp1_yearly.1001.desc.behaviour_2.earnest:0 "e passa horas tendo conversas sérias com meus cortesãos."
 fp1_yearly.1001.desc.behaviour_2.eats_their_fill:0 "e nunca deixa um bocado sem comer no jantar."
 fp1_yearly.1001.desc.behaviour_2.leaves_early:0 "e nunca fica mais tempo no jantar do que o necessário."
 fp1_yearly.1001.desc.behaviour_2.sneaks:0 "e se esgueira pelo lugar até tarde da noite."
 fp1_yearly.1001.desc.behaviour_2.talkative:0 "e passa horas conversando com qualquer pessoa que cruzar o seu caminho."
 fp1_yearly.1001.desc.intro:0 "Várias vezes nos últimos dias, tenho notado um vagabundo misterioso, [stranger.GetFirstName], na corte. Não me lembro nem do seu rosto nem do anúncio de sua chegada.\n\n"
 fp1_yearly.1001.desc.outro:0 "Talvez [stranger.GetSheHe] não seja nada, mas algo sobre [stranger.GetSheHe] me deixa inquieto.\n\nQue tipo de malandragem um vagabundo pode fazer em um ou dois dias?"
 fp1_yearly.1001.guest_of_honour.tt:0 "Isso terá efeitos dramáticos."
 fp1_yearly.1001.mysterious_stranger_disappears.tt:0 "O estranho misterioso desaparece..."
 fp1_yearly.1001.probably_harmless.tt:0 "Isso terá efeitos mínimos."
 fp1_yearly.1001.t:0 "Estranho na Corte"
 fp1_yearly.1011.a:0 "Certamente isso não pode #EMP realmente#! ter sido o Pai de Todos?"
 fp1_yearly.1011.b:0 "Bastardo!"
 fp1_yearly.1011.desc.critical_epilogue:0 "\n\nAssim, [stranger.GetNameNoTooltip] se vai, e eu instintivamente sei que não haverá vestígios de [stranger.GetSheHe] pela manhã."
 fp1_yearly.1011.desc.critical_preamble:0 "A estranheza de [stranger.GetNameNoTooltip] cresce em proporção ao bom tratamento recebido, mas suas excentricidades nunca se tornam alarmantes. Depois de decidir deixar assim, fico chocado quando [stranger.GetNameNoTooltip] aparece uma noite, sem aviso, em meus aposentos privados.\n\n"
 fp1_yearly.1011.desc.same_faith.critical:0 "$fp1_yearly.1011.desc.critical_preamble$\"Sua hospitalidade é digna de elogio, [ROOT.Char.GetFirstNameNoTooltip], e vejo que você é astuto, devoto ou ambos. De qualquer forma, os sábios [stranger.GetFaith.PriestNeuterPlural] da terra saberão que você hospedou Grímnir e tratou bem o Senhor dos Aesir.\"$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.same_faith.standard:0 "$fp1_yearly.1011.desc.standard_preamble$\"Você foi observado por olhos mais velhos, [ROOT.Char.GetFirstNameNoTooltip], e considerado insuficiente\", grita [stranger.GetFirstNameNoTooltip], com saliva voando por toda parte. \"Grímnir vagueia em sua corte, e você não faz nada, não vê nada? Os [stranger.GetFaith.PriestNeuterPlural] da terra saberão que você foi visitado pelos Aesir, e que os deuses o observam para melhorar!\"$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.desc.same_religion.critical:0 "$fp1_yearly.1011.desc.critical_preamble$\"Você adora os deuses pobremente, [ROOT.Char.GetFirstNameNoTooltip], mas os honra bem. Por mais que sua fé ofenda os Aesir, você agradou o Enforcado, e eu, Grímnir, deixarei os [stranger.GetFaith.PriestNeuterPlural] da terra saberem.\"$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.same_religion.standard:0 "$fp1_yearly.1011.desc.standard_preamble$\"Você adora os deuses pobremente e falha em ver a verdadeira divindade dentro de sua corte, mesmo quando Grímnir se esgueira pelos corredores e senta em sua mesa. Eu tenho pena de você, [ROOT.Char.GetWomanMan]ling, pois você nunca verá meus salões de Valhalla!\"$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.desc.separate_religion.critical:0 "$fp1_yearly.1011.desc.critical_preamble$\"\"Descrente!\" Grita o ingrato. \"Você acha que pode comprar minha fé com boas maneiras à mesa e travesseiros de penas de ganso?! Eu sou um verdadeiro [stranger.GetFaith.GetAdherentNameNoTooltip], e nunca abandonarei os Deuses Antigos! Em vez disso, direi a todos os seus [ROOT.Char.GetFaith.PriestNeuterPlural] [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] que você abrigou um pagão!\"$fp1_yearly.1011.desc.critical_epilogue$"
 fp1_yearly.1011.desc.separate_religion.standard:0 "$fp1_yearly.1011.desc.standard_preamble$\"\"Se eu fosse uma [stranger.GetWomanMan] menor, eu te mataria aqui e agora por sua fé blasfema. Felizmente para você, minha honra vale mais do que sua vida, e eu me contentei em espalhar a palavra do [stranger.GetFaith.HighGodName] em sua corte.\"$fp1_yearly.1011.desc.standard_epilogue$"
 fp1_yearly.1011.desc.standard_epilogue:0 "\n\nTão rapidamente quanto [stranger.GetSheHe] chegou, [stranger.GetFirstNameNoTooltip] volta para a sombra. As equipes de busca não encontram nada, nem um pedaço, e eu fico com nada além de perguntas."
 fp1_yearly.1011.desc.standard_preamble:0 "[stranger.GetNameNoTooltip] continua a esgueirar-se pela corte, mas [stranger.GetSheHe] parece fazer pouco além de deixar as pessoas desconfortáveis, no máximo. Até que, em uma noite, [stranger.GetSheHe] aparece em meus aposentos privados após o anoitecer.\n\n"
 fp1_yearly.1011.possible_converts_specific_list:0 "Pelo menos um [courtier|E]"
 fp1_yearly.1011.t:0 "$fp1_yearly.1001.t$: Goði"
 fp1_yearly.1012.a.recoup_lost_piety.tt:0 "Toda [piety|E] gasta com o missionário é recuperada"
 fp1_yearly.1012.a:0 "Conte-me mais sobre o [stranger.GetFaith.GetNameNoTooltip]..."
 fp1_yearly.1012.b:0 "Você #EMP o quê#!? Saia agora."
 fp1_yearly.1012.c:0 "S[Select_CString( stranger.IsFemale, 'ua', 'eu' )] [stranger.Custom2('InsultNoun', ROOT.Char)] [stranger.Custom2('InsultAdjective', ROOT.Char)]! #EMP GUARDAS!#! Prendam [stranger.GetSheHe]!"
 fp1_yearly.1012.d:0 "Aceito seu serviço."
 fp1_yearly.1012.desc.different_faith.critical:0 "$fp1_yearly.1012.desc.preamble$\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Já faz algum tempo que não sou tratado tão bem, e agradeço pela hospitalidade. Receio, no entanto, ter que confessar algo a você: sou um [stranger.GetFaith.GetAdherentNameNoTooltip], um servo de [stranger.GetFaith.HighGodName], e tenho estado educando seus súditos os Seus ensinamentos."
 fp1_yearly.1012.desc.different_faith.standard:0 "$fp1_yearly.1012.desc.preamble$\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsNameNoTooltip], eu sei que você já não me considera particularmente favorável, mas receio que venho aqui com uma confissão. Durante minha estadia em sua corte, tenho estado discutindo as obras de [stranger.GetFaith.HighGodName] com seus súditos, educando quem quiser ouvir na fé [stranger.GetFaith.GetAdjectiveNoTooltip]."
 fp1_yearly.1012.desc.preamble:0 "[stranger.GetNameNoTooltip] prova ser um convidado animado e erudito, passando noites discutindo com o resto da corte.\n\nHoje à noite, [stranger.GetSheHe] me visita, com um sorriso largo estampado em seu rosto.\n\n"
 fp1_yearly.1012.desc.same_faith.critical:0 "$fp1_yearly.1012.desc.preamble$\"Querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]! Gostaria de agradecê-lo por me tratar tão bem durante todo o meu tempo aqui. Como uma [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)] reverente e companheiro [stranger.GetFaith.GetAdherentNameNoTooltip], escrevi cartas para teólogos influentes em todo o reino elogiando sua piedade.\"$fp1_yearly.1012.desc.same_faith_epilogue$"
 fp1_yearly.1012.desc.same_faith.standard:0 "$fp1_yearly.1012.desc.preamble$\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], não fui totalmente honest[Select_CString( stranger.IsFemale, 'a', 'o' )] com você. Embora eu pareça um mendig[Select_CString( stranger.IsFemale, 'a', 'o' )], sou na verdade um[Select_CString( stranger.IsFemale, 'a', '' )] [Select_CString(stranger.IsFemale,stranger.GetFaith.DevoteeFemale,stranger.GetFaith.DevoteeMale)], e passei meu tempo na corte educando e dando palestras sobre as obras de [stranger.GetFaith.HealthGodName]. Embora você possa não ter encorajado isso, agradeço por me mostrar tanta hospitalidade.\"$fp1_yearly.1012.desc.same_faith_epilogue$"
 fp1_yearly.1012.desc.same_faith_epilogue:0 "\n\n[stranger.GetFirstNameNoTooltip] pausa, incerto. \"Se desejar, eu ficaria honrado em permanecer em sua corte permanentemente?\""
 fp1_yearly.1012.e:0 "Já tenho conselheiros e teólogos suficientes, obrigado."
 fp1_yearly.1012.possible_converts_specific_list:0 "$fp1_yearly.1011.possible_converts_specific_list$"
 fp1_yearly.1012.t:0 "$fp1_yearly.1001.t$: Missionário [stranger.GetFaith.GetAdjectiveNoTooltip]"
 fp1_yearly.1013.a.sodomite:0 "Viver tal vida..."
 fp1_yearly.1013.a:0 "Maldição!"
 fp1_yearly.1013.b:0 "Não descansarei até encontrar aquele nithing!"
 fp1_yearly.1013.desc.critical:0 "#EMP Desastre!#! [stranger.GetNameNoTooltip] recompensou minha hospitalidade roubando-me durante a noite, levando consigo todas as peças de metal brilhantes ou têxteis exóticos que [stranger.GetSheHe] pôde encontrar antes de fugir em meu melhor cavalo!"
 fp1_yearly.1013.desc.outro.sodomite:0 "\n\nParece que o estranho misterioso era na verdade um nithing em fuga: ostracizado pela comunidade, [stranger.GetSheHe] vagava de corte em corte, procurando um porto seguro.\n\nQuando meus cortesãos provaram ser tão conservadores quanto o seu último anfitrião, [stranger.GetSheHe] cortou relações e fugiu em vez de ficar e sofrer."
 fp1_yearly.1013.desc.outro:0 "Parece que o estranho misterioso era na verdade um nithing em fuga: condenado por um crime considerado tão hediondo que [stranger.GetSheHe] agora é sem juramento, sem honra e considerado legalmente morto por sua família. Esse insulto corta fundo."
 fp1_yearly.1013.desc.standard:0 "[stranger.GetNameNoTooltip] fugiu durante a noite, levando consigo todas as coisas valiosas que [stranger.GetSheHe] pôde encontrar."
 fp1_yearly.1013.t:0 "$fp1_yearly.1001.t$: Nithing"
 fp1_yearly.1014.a:0 "Magnífico! Você valerá bem o seu preço!"
 fp1_yearly.1014.b:0 "Tenho guerreiros capazes o suficiente que não testam minha paciência."
 fp1_yearly.1014.desc.critical:0 "[stranger.GetNameNoTooltip] parece agradavelmente surpreso por ser tratado como convidado de honra e se aproxima de mim em particular no final do dia.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu não fui totalmente honesto com você. Embora possa parecer fraco, na verdade, sou um guerreiro de renome temível! Tenho procurado por um senhor digno dos meus serviços, e sua conduta me leva a acreditar que esse poderia ser você.\""
 fp1_yearly.1014.desc.outro:0 "\n\nNão é o processo usual para adquirir $knight_culture_player_plural_no_tooltip_lowercase$, com certeza, mas é #EMP!# lisonjeiro ter passado no seu desafio."
 fp1_yearly.1014.desc.standard:0 "[stranger.GetNameNoTooltip] continua circulando na corte por um tempo, eventualmente conseguindo de alguma forma uma audiência privada comigo.\n\n\"Grande [ROOT.Char.GetTitleAsNameNoTooltip], desejo oferecer-lhe minha espada. Sou um guerreiro errante que tem procurado um bom senhor há algum tempo, e minha estadia em sua corte me faz pensar que você poderia ser esse senhor.\""
 fp1_yearly.1014.t:0 "$fp1_yearly.1001.t$: Guerreiro"
 fp1_yearly.1015.a:0 "Claro que você pode ficar."
 fp1_yearly.1015.b:0 "O quê?! Absurdo, saia!"
 fp1_yearly.1015.desc.critical:0 "[stranger.GetFirstNameNoTooltip] está confuso, sobrecarregado e eufórico com o tratamento que recebe. Ser considerado nobreza menor parece ser uma experiência completamente nova para [stranger.GetSheHe], e leva um bom tempo antes que a ficha caia."
 fp1_yearly.1015.desc.outro:0 "\n\nParece que [stranger.GetSheHe] é na verdade apenas um vagabundo errante que entrou pelos muros!\n\nEnquanto pondero sobre o que fazer, [stranger.GetFirstNameNoTooltip] vem até mim, com o chapéu na mão, e implora para ser permitido ficar permanentemente."
 fp1_yearly.1015.desc.standard:0 "[stranger.GetFirstNameNoTooltip] continua inofensivo o suficiente, se metendo em poucas travessuras previsíveis em seu curto tempo em minha casa. Não é até que eu ouço [stranger.GetSheHe] tendo uma conversa em voz baixa que eu entendo."
 fp1_yearly.1015.t:0 "$fp1_yearly.1001.t$: Vagabundo"
 fp1_yearly.1062.a.tt:0 "Preparativos para o funeral começam..."
 fp1_yearly.1062.a:0 "Um pequeno barco de pedra simbólico será suficiente."
 fp1_yearly.1062.b:0 "Um grande barco de pedra, para impressionar [ship_funeral_candidate.GetFaith.WarGodName]!"
 fp1_yearly.1062.c:0 "Um barco ornamental a vela; [ship_funeral_candidate.GetFirstNameNoTooltip] merece o melhor."
 fp1_yearly.1062.d:0 "Isso é tudo #EMP extremamente#! caro..."
 fp1_yearly.1062.desc:0 "A recente morte de [ship_funeral_candidate.Custom2('MyCharacterIntroduction',mourner)] deixou os seus entes queridos lamentando a perda de uma grande [ship_funeral_candidate.GetWomanMan].\n\nComo um dos mais próximos do falecido, eu poderia assumir a responsabilidade de realizar um funeral adequado.\n\nÉ uma tradição entre os bons [ship_funeral_candidate.GetFaith.GetAdherentNamePluralNoTooltip] que enterremos nossos mais nobres em um barco, para melhor levá-los para [ship_funeral_candidate.GetFaith.PositiveAfterLife], e certamente [ship_funeral_candidate.GetFirstNameNoTooltip] merece essa alta distinção?"
 fp1_yearly.1062.t:0 "Uma Vida a Ser Lembrada: [ship_funeral_candidate.GetFirstNameNoTooltip]"
 fp1_yearly.1063.a:0 "Feche o monte."
 fp1_yearly.1063.desc.achievements.double.connector:0 "quanto"
 fp1_yearly.1063.desc.achievements.double.intro:0 "era uma pessoa de talento raro e interesses diversos. Tanto"
 fp1_yearly.1063.desc.achievements.double.outro:0 "nada pode preencher o vazio que a perda [ship_funeral_candidate.GetHerHim] deixa em nossas vidas."
 fp1_yearly.1063.desc.achievements.lifestyles.duelling:0 "um duelista verdadeiramente mortal,"
 fp1_yearly.1063.desc.achievements.lifestyles.hunting:0 "o melhor atirador de todos em [hunting_lands.GetNameNoTierNoTooltip],"
 fp1_yearly.1063.desc.achievements.lifestyles.magickerationing:0 "um especialista nas artes místicas,"
 fp1_yearly.1063.desc.achievements.lifestyles.partying:0 "uma fonte de alegria e risos,"
 fp1_yearly.1063.desc.achievements.piety.high:0 "um servo devoto de [ship_funeral_candidate.GetFaith.HighGodName],"
 fp1_yearly.1063.desc.achievements.piety.max:0 "um verdadeiro ícone da fé do [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.piety.very_high:0 "um modelo incomparável de virtude do [ship_funeral_candidate.GetFaith.GetNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.prestige.high:0 "um ilustre [ship_funeral_candidate.GetWomanMan],"
 fp1_yearly.1063.desc.achievements.prestige.max:0 "uma verdadeira lenda de [ship_funeral_candidate.GetWomanMan],"
 fp1_yearly.1063.desc.achievements.prestige.very_high:0 "um exaltado [ship_funeral_candidate.GetWomanMan],"
 fp1_yearly.1063.desc.achievements.single.intro:0 "tinha uma determinação singular. Talvez seja por isso que [ship_funeral_candidate.GetSheHe] foi considerado"
 fp1_yearly.1063.desc.achievements.single.outro:0 "uma realização que talvez nunca seja superada por [ship_funeral_candidate.GetSheHe]."
 fp1_yearly.1063.desc.achievements.title.duchy:0 "um bom [ship_funeral_candidate.GetTitleAsNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.title.empire:0 "um magnífico [ship_funeral_candidate.GetTitleAsNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.title.kingdom:0 "um resplandecente [ship_funeral_candidate.GetTitleAsNameNoTooltip],"
 fp1_yearly.1063.desc.achievements.triple.connector:0 "$fp1_yearly.1063.desc.achievements.double.connector$"
 fp1_yearly.1063.desc.achievements.triple.intro:0 "era tantas coisas. [ship_funeral_candidate.GetSheHe|U] era"
 fp1_yearly.1063.desc.achievements.triple.outro:0 "mas para mim, acima de tudo, [ship_funeral_candidate.GetSheHe] era meu [ship_funeral_candidate.Custom2('RelationToMe', mourner)]. Nunca veremos alguém como [ship_funeral_candidate.GetSheHe] novamente."
 fp1_yearly.1063.desc.intro:0 "Estou diante da pequena multidão de enlutados, meus olhos varrendo cada um dos chorosos enlutados por sua vez, e começo meu discurso.\n\n\"[ship_funeral_candidate.GetFirstNameNoTooltip]"
 fp1_yearly.1063.desc.outro:0 "\n\nOs criados carregam os últimos tesouros funerários, e então, finalmente, o corpo de [ship_funeral_candidate.GetFirstNamePossessiveNoTooltip] é colocado sobre sua plataforma de enterro."
 fp1_yearly.1063.desc.ship_stone_grand:0 "\n\nO grande túmulo atrás de mim já contém uma imensa réplica de um navio, traçada em pedras rúnicas e cheia de seixos, cada grande pedra contando histórias da vida do falecido."
 fp1_yearly.1063.desc.ship_stone_small:0 "\n\nO túmulo atrás de mim já contém uma pequena réplica de um navio, traçada em pedras pesadas e cheia de seixos, já enterrada sob um peso de terra."
 fp1_yearly.1063.desc.ship_wood_ornate:0 "\n\nO barco atrás de mim já contém uma embarcação feita sob medida, produto de madeiras exóticas e nossos melhores construtores navais. Ele nunca navegará pelos oceanos mortais, mas pode agradar [ship_funeral_candidate.GetFaith.PantheonTerm] e trazer bênçãos ao falecido."
 fp1_yearly.1063.t:0 "$fp1_yearly.1062.t$"
 fp1_yearly.1063.trigger_failure.tt:0 "Circunstâncias interromperam o funeral público de [ship_funeral_candidate.GetFirstNamePossessiveNoTooltip]."
 fp1_yearly.1071.a:0 "Higiene é a chave para uma vida longa!"
 fp1_yearly.1071.b:0 "Eu poderia me cuidar um pouco mais..."
 fp1_yearly.1071.c:0 "Apenas o de sempre está bom."
 fp1_yearly.1071.desc:0 "O povo [ROOT.Char.GetCulture.GetNameNoTooltip] é, famosamente, meticulosamente limpo.\n\nUm dos grandes prazeres da vida é ouvir até nossos piores inimigos amargamente admitirem que nenhuma barba de homem é melhor penteada, nenhum cabelo de [ROOT.Char.Custom('WomanManPossessive')] mais regularmente ensaboado, nenhum rosto de [ROOT.Char.GetWomanMan] tão limpo de manchas quanto o de um bom [ROOT.Char.GetCulture.GetNameNoTooltip][ROOT.Char.GetWomanMan].\n\nHoje é dia de banho, mas sinto como se uma mudança na rotina pudesse me fazer bem. Afinal, se todos os [ROOT.Char.GetCulture.GetNameNoTooltip] são bem-cuidados, não cabe a um [ROOT.Char.GetTitleAsNameNoTooltip] ser o melhor cuidado? #EMP"
 fp1_yearly.1071.t:0 "Brilhantemente Limpo"
 fp1_yearly.1081.a:0 "Fascinante. Por favor, comece do início novamente!"
 fp1_yearly.1081.b:0 "Você não pode #EMP possivelmente#! estar me dizendo a verdade, velho [norse_explorer.GetWomanMan]."
 fp1_yearly.1081.c.sunset_empire:0 "Talvez devêssemos parar os navios de navegar para o oeste..."
 fp1_yearly.1081.c:0 "Contos de terras distantes são sempre reconfortantes..."
 fp1_yearly.1081.desc.antilia:0 "uma ilha habitada por exilados [antilia_culture.GetNameNoTooltip]. Ricos e abastados seguidores do $christianity_religion_adherent_plural$, vivendo em castelos bem-defendidos, descendentes de refugiados que fugiram da Ibéria durante a invasão moura."
 fp1_yearly.1081.desc.ard_majhulah:0 "uma terra estranha, mencionada apenas em textos antigos islâmicos, considerada perdida há anos. Os locais têm cada um pilhas de ouro e prata tão grandes que as usam como palitos de dente e para tecer suas roupas."
 fp1_yearly.1081.desc.fortunate_isles.hellenist:0 "a última exclave sobrevivente do $hellenic_paganismo$, uma pequena ilha a oeste povoada por $greek_collective_noun$ que compartilham mais com a antiga $b_athens$ do que com a moderna $b_constantinople$. Os locais passam todo o dia discutindo filosofia e brindando à glória dos Olímpicos!"
 fp1_yearly.1081.desc.fortunate_isles.other:0 "o refúgio dos últimos poucos adoradores pagãos $hellenic_paganismo$, imitando de maneira rudimentar seus ancestrais distantes em $b_athens$ e $b_thebes$. Os locais passam seus dias em preguiça, discutindo estranhas filosofias e praticando sua fé rudimentar."
 fp1_yearly.1081.desc.great_ireland.abrahamic:0 "uma terra distante a oeste, onde os habitantes vestem apenas branco, carregam lanças cruéis e lutam ferozmente uns contra os outros e até mesmo contra os mais nobres visitantes. Os locais adoram deuses pagãos antigos, há muito esquecidos pelos [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip] sensatos."
 fp1_yearly.1081.desc.great_ireland.other:0 "uma terra distante a oeste, onde os habitantes vestem apenas branco, carregam lanças cruéis e lutam com força e ferocidade inumanas. Tão lendária é sua destreza, que nenhum guerreiro desta terra jamais caiu perante uma lâmina estrangeira."
 fp1_yearly.1081.desc.greenland:0 "uma terra de $norse_collective_noun$ pobres e lutando que vivem na neve perto do topo do mundo. A terra é tão congelada e fria que eles devem importar toda a madeira e comer quase inteiramente carne e peixe."
 fp1_yearly.1081.desc.hy_brasil:0 "uma ilha que permanece invisível grande parte do tempo, escondida atrás de neblinas impenetráveis, exceto por um dia a cada sete anos. Mesmo no único dia em que as neblinas permitem a viagem, nenhum marinheiro conseguiu pousar com sucesso."
 fp1_yearly.1081.desc.intro:0 "Minha noite foi consumida por um explorador idoso, [norse_explorer.GetFirstName], desejando me contar as histórias exóticas de suas explorações e aventuras no Oceano Atlântico.\n\nApesar da idade, os olhos de [norse_explorer.GetFirstNamePossessiveNoTooltip] permanecem afiados enquanto [norse_explorer.GetSheHe] me conta sobre"
 fp1_yearly.1081.desc.isle_of_the_blessed.christian:0 "uma ilha cheia de $breton_collective_noun$ devotos, orando e vivendo vidas de contemplação silenciosa. Tão forte é a sua fé que cada um deles é imune às armas mortais, totalmente protegido por [norse_explorer.GetFaith.HighGodName]."
 fp1_yearly.1081.desc.isle_of_the_blessed.other:0 "uma ilha cheia de $breton_collective_noun$ devotos, rica em tesouros de ouro. Tão forte era a sua fé que a ilha era preenchida com hinos cantados belamente, mesmo depois que a tripulação de [norse_explorer.GetFirstNamePossessiveNoTooltip] os matou com espadas."
 fp1_yearly.1081.desc.outro:0 "\n\nEmbora a hora esteja ficando tarde, [norse_explorer.GetFirstNameNoTooltip] parece mais do que disposto a continuar se eu desejar."
 fp1_yearly.1081.desc.purple_islands:0 "um grupo de ilhas ao sul, repleto de flores vibrantes, muitas delas tons de roxo exótico, completamente desprovido de qualquer vestígio de vida humana. A beleza sinistra do lugar atrai até mesmo marinheiros endurecidos a se deitar e morrer, em paz com o mundo."
 fp1_yearly.1081.desc.st_brendans_island:0 "uma ilha oculta por estranhas névoas, onde o tempo parece passar mais devagar do que fora dela. Dos mistérios mais profundos da ilha, [norse_explorer.GetFirstNameNoTooltip] permanece em silêncio, embora às vezes lágrimas turvem os olhos dela."
 fp1_yearly.1081.desc.sunset_empire:0 "um império no lado oposto do ponto mais largo do Atlântico, uma terra de sangue, crânios e conquistadores famintos, espreitando logo abaixo do horizonte ocidental. Seus mestres cruéis esperam pelo próprio Ragnarok, quando pretendem arrancar os corações pulsantes de todos os bons [norse_explorer.GetFaith.GetAdherentNamePluralNoTooltip]."
 fp1_yearly.1081.desc.the_sticky_sea:0 "um mar lamentoso no Atlântico, uma bagunça pegajosa e malcheirosa de águas, onde serpentes e algas conspiram para arrastar os marinheiros para a morte. Somente as tripulações mais fortes têm uma chance de se libertar."
 fp1_yearly.1081.desc.thule:0 "uma vasta terra muito, muito ao norte, onde toda a matéria se desfaz. Homens respiram água e terra tão facilmente quanto o ar, baleias monstruosas nadam pelo chão e céu, e todas as distinções se tornam acadêmicas."
 fp1_yearly.1081.desc.vinland:0 "uma terra tão distante a oeste quanto a Cathay é a leste, onde as uvas e trigo crescem livremente a ponto de parecer que se plantam sozinhas, e as colheitas de vinho são incomparáveis. Cada local é um guerreiro temível, não tolerando nenhuma intrusão."
 fp1_yearly.1081.t:0 "Explorador do Oeste"
