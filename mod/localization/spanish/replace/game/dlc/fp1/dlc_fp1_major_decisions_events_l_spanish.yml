l_spanish:
 fp1_founder_founded_the_jomsviking_tt:0 "Uma [holy_order|E] da [faith|E] de [founder.GetTitledFirstNamePossessiveNoTooltip] foi fundada\n$EFFECT_LIST_BULLET$[founder.GetFirstNameNoTooltip] tornou-se o patrono da ordem."
 fp1_major_decisions.0001.a:0 "Um reino duradouro e poderoso!"
 fp1_major_decisions.0001.desc:0 "Há muito tempo tenho o objetivo de unir os grandes reinos do Mar do Norte sob uma única coroa permanente. Por anos tenho lutado, ganhando reconhecimento como grande governante de cada um dos meus reinos, e hoje realizo meu sonho.\n\nDepois de extrair juramentos cuidadosamente formulados de fidelidade perpétua de vassalos-chave, saxões, noruegueses e dinamarqueses reconheceram minha posição como Alto [founder.Custom('GetQueenKing')], o soberano do Mar do Norte.\n\nTalvez meus descendentes continuem a governar os reinos como um só. Talvez não importe mais.\n\nQualquer que use as coroas menores, #EMP todos#! deverão se curvar diante da [founder.GetHouse.GetBaseNameNoTooltip] [founder.GetTitleAsNameNoTooltip]!"
 fp1_major_decisions.0001.t:0 "O Alto [founder.Custom('GetQueenKing')] do Norte"
 fp1_major_decisions.0002.a:0 "Viva o [founder.GetTitleAsNameNoTooltip]!"
 fp1_major_decisions.0002.b:0 "Um falso [founder.Custom('GetQueenKing')], quatro vezes."
 fp1_major_decisions.0002.desc:0 "Por muitos anos, meu senhor feudal, [founder.Custom('GetQueenKing')] [founder.GetFirstName], deixou claro que deseja que seu reino sobreviva a ele.\n\nEmbora nossos reinos estejam ligados por laços de parentesco e conflito, a grande distância e diferenças entre eles fizeram com que esse objetivo parecesse inatingível.\n\nHoje, essas dúvidas foram provadas infundadas, com [founder.GetFirstNameNoTooltip] distribuindo anos de juramentos escritos de fidelidade mutuamente vinculativos entre todos os vassalos do reino.\n\nO $title_high_kingdom$ do $e_north_sea$ nasceu!"
 fp1_major_decisions.0002.t:0 "$fp1_major_decisions.0001.t$"
 fp1_major_decisions.0003.a:0 "Um reino para todos os bons do [ROOT.GetCharacter.GetFaith.GetNameNoTooltip]!"
 fp1_major_decisions.0003.b:0 "Proteja-nos, oh [ROOT.GetCharacter.GetFaith.HighGodName], da ira de [founder.GetFirstNameNoTooltip]!"
 fp1_major_decisions.0003.c:0 "[founder.GetSheHe|U] não passa de um bárbaro pretensioso!"
 fp1_major_decisions.0003.desc:0 "Há muito tempo é a ambição aberta de [founder.GetFirstName], [founder.Custom('GetQueenKing')] da $k_norway$, $k_england$ e $k_denmark$, garantir que seu reino não se desfaça com sua morte.\n\nHoje, após anos de governo e tensas negociações, [founder.GetSheHe] finalmente conseguiu o que queria.\n\nOs vassalos dos três reinos concordaram que, não importa quem sente no trono de cada um, todos se curvarão diante do [founder.GetTitleAsNameNoTooltip]."
 fp1_major_decisions.0003.t:0 "$fp1_major_decisions.0001.t$"
 fp1_major_decisions.0011.a:0 "$c_kiev$ será uma boa capital!"
 fp1_major_decisions.0011.b:0 "[new_rus_capital.GetNameNoTier] é verdadeiramente a fonte de nossa grandeza!"
 fp1_major_decisions.0011.desc:0 "Do $river_volga$ ao $river_dnieper$ e além, os varangianos navegam pelos rios e estradas das terras do coletivo eslavo oriental. Nós saqueamos, conquistamos, nos misturamos com os locais. Quando sentimos a necessidade, fundamos novos assentamentos, ou os tomamos à força.\n\nAté hoje, esses pequenos centros têm competido para atrair aventureiros e senhores da guerra, buscando alcançar a verdadeira primazia sobre o resto da Rus'.\n\nNão mais! Pelos meus feitos poderosos e minha reputação feroz, eu atrairei nórdicos e eslavos igualmente, construindo uma capital digna de [founder.GetPrimaryTitle.GetNameNoTier]!"
 fp1_major_decisions.0011.t:0 "Uma Capital para toda a Rus'"
 fp1_major_decisions.0012.a:0 "Uma capital digna!"
 fp1_major_decisions.0012.b:0 "Bah, nada mais do que um covil de escória e vilania."
 fp1_major_decisions.0012.desc:0 "Usando o poder do seu nome e reputação, meu senhor feudal, [founder.GetTitledFirstName], começou a estabelecer uma grande capital em [new_rus_capital.GetNameNoTier]. [founder.GetSheHe|U] espera que, um dia, este assentamento seja o centro de todas as terras da Rus'."
 fp1_major_decisions.0012.t:0 "$fp1_major_decisions.0011.t$"
 fp1_major_decisions.0013.a:0 "Essa [new_rus_capital.GetNameNoTierNoTooltip] parece... próspera..."
 fp1_major_decisions.0013.b:0 "Eles ainda são apenas estrangeiros atrasados."
 fp1_major_decisions.0013.c:0 "Eu realmente não vejo como isso me diz respeito?"
 fp1_major_decisions.0013.desc:0 "Usando o poder do seu nome e reputação, [founder.GetTitledFirstName], um senhor da guerra bárbaro, convocou a lealdade de todos os varangianos errantes e os eslavos sedentos de sangue.\n\nMesmo agora, aventureiros, piratas, saqueadores e ladrões se reúnem sob a sua bandeira, aumentando dramaticamente a população de [new_rus_capital.GetNameNoTier]."
 fp1_major_decisions.0013.t:0 "$fp1_major_decisions.0011.t$"
 fp1_major_decisions.0021.a:0 "Sou [Select_CString( founder.IsFemale, 'a', 'o' )] [founder.GetLadyLord|U] do Sangue e do Ouro!"
 fp1_major_decisions.0021.b:0 "Finalmente, meu sonho é alcançado..."
 fp1_major_decisions.0021.desc:0 "Por anos, naveguei pelos caminhos aquáticos do mundo, saqueando, atacando e destruindo. Roubei mais ouro do que a maioria dos reis jamais verá, e meu nome é amaldiçoado do Mar da Irlanda até Catay.\n\nSou, sem dúvida, a mais infame [founder.GetWomanMan] viva, Flagelo dos Mares, e investi meu saque e reputação no pesado assentamento e fortificação da $c_isle_of_man$.\n\nPessoas em todo o mundo me consideram o pirata mais malvado que já ouviram falar.\n\nMas eles #EMP já#! ouviram falar de mim."
 fp1_major_decisions.0021.t:0 "Um Reino de Piratas"
 fp1_major_decisions.0022.a:0 "Pense em todo o ouro que vamos ganhar!"
 fp1_major_decisions.0022.b:0 "Um #EMP [founder.GetTitleAsNameNoTooltip]#!? [founder.GetSheHe|U] é pior do que um barão ladrão!"
 fp1_major_decisions.0022.desc:0 "Por anos, foi um segredo aberto que [founder.GetFirstName] se recusou a aceitar ou tomar qualquer coroa além de uma: [founder.GetPrimaryTitle.GetNameNoTier].\n\nSeu coração está tão definido nisso que meu senhor feudal parecia ter dedicado sua vida à legitimação do poder e autoridade de sua ilha natal.\n\nDepois de incontáveis ​​saques, guerras e matanças gerais, [founder.GetSheHe] conseguiu.\n\nSupostamente cada joia na sua nova coroa foi retirada de um saque diferente. Alguns na corte sussurram até que ainda há soquetes vazios para [founder.GetTitledFirstNameNoTooltip] preencher."
 fp1_major_decisions.0022.t:0 "$fp1_major_decisions.0021.t$"
 fp1_major_decisions.0023.a:0 "[founder.GetSheHe|U] não vai nos atacar #EMP, certo?"
 fp1_major_decisions.0023.b:0 "Não mais do que um [founder.GetTitleAsNameNoTooltip] dos Ladrões!"
 fp1_major_decisions.0023.desc:0 "Até o mais humilde camponês das Ilhas Britânicas ouviu falar do monstro [founder.GetFirstName], Flagelo dos Mares, e de sua busca de uma vida inteira para obter reconhecimento para o reino dos piratas saqueadores.\n\nÉ uma lenda que causa medo tanto nos lordes quanto nos pobres servos, mas parece que a linha entre mito e história se confundiu ultimamente.\n\nA partir de hoje #EMP [founder.GetTitleAsNameNoTooltip]#! [founder.GetFirstNameNoTooltip] anunciou que o trabalho de sua vida está concluído.\n\nBritânia conta com um novo reino em suas costas, e é terrível de se ver."
 fp1_major_decisions.0023.t:0 "$fp1_major_decisions.0021.t$"
 fp1_major_decisions.0031.a.cynical:0 "Contanto que eles lutem em minhas guerras..."
 fp1_major_decisions.0031.a.fallback:0 "Os Velhos Caminhos são os melhores caminhos!"
 fp1_major_decisions.0031.desc:0 "Com meu poder e prestígio, eu reuni um grupo dos mais viscerais e zelosos [founder.GetFaith.GetAdherentNamePlural] em toda a Escandinávia e os transformei em uma irmandade guerreira!\n\nAtravessando as águas do mar, nas terras dos eslavos e bálticos, estes $d_jomsvikings$ prosperarão. Saquear e entrar em conflito com os habitantes locais os tornará ferozes e encorajará apenas seguidores dignos a procurá-los.\n\nPor sua vez, eles recompensarão a honra com guerreiros e saque e punirão covardes, convertidos e reformadores.\n\nA partir deste dia até o Ragnarok, o [founder.GetFaith.GetNameNoTooltip] perdurará."
 fp1_major_decisions.0031.t:0 "Forjar os Jomsvikings"
 fp1_major_decisions.0032.a:0 "Glória e sangue para [founder.GetFaith.HighGodName]!"
 fp1_major_decisions.0032.b:0 "Então, eles são piratas?"
 fp1_major_decisions.0032.desc:0 "Em um esforço para deter a onda de conversões abraâmicas e as alarmantes noções reformistas de alguns dos jarls mais cínicos, [founder.Custom2('MyCharacterIntroduction',ROOT.Char)] reuniu um grupo de zelosos [founder.GetFaith.GetAdherentNamePlural] em uma irmandade guerreira formal, com a intenção de defender os Velhos Caminhos.\n\nAlojados na poderosa fortaleza de $b_jomsberg$, estes exemplares da virtude [founder.GetFaith.GetAdjectiveNoTooltip] pretendem navegar pelo Báltico, recompensando a piedade e punindo a desonra e a covardia."
 fp1_major_decisions.0032.t:0 "$fp1_major_decisions.0031.t$"
 fp1_major_decisions.0033.a:0 "Todos conhecerão a ira de [founder.GetFaith.HighGodNamePossessive]!"
 fp1_major_decisions.0033.b.competition:0 "Humpf, competição, você diz?"
 fp1_major_decisions.0033.b.heathens:0 "#EMP Suspiro#! ... Mais invasores pagãos?"
 fp1_major_decisions.0033.desc.autofounded:0 "[founder.GetTitledFirstName], um aventureiro nórdico empreendedor, lançou uma invasão feroz contra [victim.GetTitledFirstName], varrendo as terras de [coup_target.GetNameNoTier] sob [victim.GetSheHe] em um ataque surpresa.\n\nO que torna isso incomum é que a invasão parece ter tido uma motivação religiosa: [founder.GetFirstNameNoTooltip] se associou a um fanático [founder.GetFaith.GetAdjective] chamado [leader.GetFirstNameNoTooltip] para criar uma irmandade guerreira que eles chamam de $d_jomsvikings$."
 fp1_major_decisions.0033.desc.decision_founded:0 "Após anos de campanha, [founder.GetTitledFirstName], um fanático [founder.GetFaith.GetAdjective], finalmente reuniu seguidores suficientes para tornar seu sonho realidade: na recém-criada fortaleza de $b_jomsberg$, [founder.GetSheHe] reuniu uma nova irmandade guerreira para defender sua fé.\n\nOs $d_jomsvikings$ nasceram."
 fp1_major_decisions.0033.desc.outro:0 "\n\nO grupo afirma que fará cumprir as Tradições Antigas, atacando abraâmicos, reformistas e pagãos rivais, saqueando uma trilha sangrenta pelas águas do Báltico."
 fp1_major_decisions.0033.t:0 "$fp1_major_decisions.0031.t$"
 fp1_major_decisions.1001.a.tt:0 "Você e sua corte fazem uma viagem à beira-mar..."
 fp1_major_decisions.1001.a:0 "Para a praia!"
 fp1_major_decisions.1001.b:0 "Até mesmo palavras doces são apenas palavras."
 fp1_major_decisions.1001.desc.dumb:0 "Eu levo uma vida bastante privilegiada. Como [ROOT.Char.GetTitleAsNameNoTooltip], todos me conhecem como sábio, benevolente e #EMP poderoso#! além da medida, como se o próprio mundo me considerasse a [ROOT.Char.Custom('GetDaughterSon')] favorita de [ROOT.Char.GetFaith.HighGodNamePossessive].\n\nTodos os meus cortesãos concordam e me dizem frequentemente, especialmente [sycophant.Custom2('MyCharacterIntroduction',ROOT.Char)].\n\nPor que [sycophant.GetFirstNameNoTooltip] até mesmo afirma que a maré obedece meus comandos, e se curvaria com apenas um sussurro meu..."
 fp1_major_decisions.1001.desc.smart:0 "Como [ROOT.Char.GetTitleAsNameNoTooltip], eu me encontro positivamente #EMP cercado#! por pessoas se desdobrando para me dizer como eu sou grande e poderoso.\n\nNormalmente, eu ignoro: essa bajulação é apenas esperada para os desesperados quando expostos à minha posição.\n\nHoje, no entanto, atingiu alturas #EMP intoleráveis#!. [sycophant.Custom2('MyCharacterIntroduction',ROOT.Char)] achou apropriado me interromper no café da manhã para me dizer que [sycophant.GetSheHe] acha que a própria maré recuaria com um mero aceno meu.\n\nApesar da nauseantemente óbvia mentira de tudo isso, isso me dá uma ideia..."
 fp1_major_decisions.1001.t:0 "[ROOT.Char.GetTitleAsNameNoTooltip] do Mar do Norte"
 fp1_major_decisions.1002.a:0 "Eu sou apenas uma [ROOT.Char.GetWomanMan] mortal, e conheço meus limites. Você também deveria."
 fp1_major_decisions.1002.b:0 "Veja como é #EMP inútil#! o poder dos [ROOT.Char.Custom('GetQueenKing')]s comparado ao de [ROOT.Char.GetFaith.HighGodName]!"
 fp1_major_decisions.1002.c:0 "#EMP FUJA!#! O Mar se alinhou com [ROOT.Char.GetFaith.DevilName]!"
 fp1_major_decisions.1002.d.tt:0 "Você chicoteia a água para submissão"
 fp1_major_decisions.1002.d:0 "Miserável marujo de um oceano! Me passe aquele chicote!"
 fp1_major_decisions.1002.desc.dumb:0 "Passamos toda a tarde à beira-mar, minha corte tremendo com os ventos frios e amargos do norte.\n\nMinuto a minuto, hora a hora, eu proclamo para o oceano: você não passará! Eu sou o [ROOT.Char.GetTitleAsNameNoTooltip], e não me digno a ser molhado por alguém como você!\n\nRebelde, a água sobe cada vez mais perto, até começar a bater em meus pés. Meus seguidores parecem desajeitados, cada um se recusando a encontrar meus olhos, presumivelmente #EMP envergonhados#! em testemunhar tal momento de completa #EMP fraqueza#! em seu governante."
 fp1_major_decisions.1002.desc.smart:0 "Sem nada mais a fazer hoje, eu forço toda a minha corte a passar a tarde à beira-mar, me observando sentado no meu trono com minhas vestes de coroação, gritando para o mar cessar sua marcha em direção ao interior. \n\nDesnecessário dizer que a água falha em ouvir. \n\nApós cinco minutos, meus seguidores entendem minha intenção. \n\nApós cinco horas, quando as ondas finalmente lambem meus pés, eles finalmente entendem minha determinação. \n\nEu sou o [ROOT.Char.GetTitleAsNameNoTooltip], e não serei o tolo de ninguém."
 fp1_major_decisions.1002.e:0 "Talvez haja ainda mais para mim dominar além de apenas governar ..."
 fp1_major_decisions.1002.t:0 "$fp1_major_decisions.1001.t$"
 fp1_major_decisions.1011.a:0 "Minha promessa cumprida!"
 fp1_major_decisions.1011.b:0 "[gyda.GetFirstNameNoTooltip] e eu finalmente podemos ficar juntos!"
 fp1_major_decisions.1011.c.tt:0 "Você continuará a ser conhecido como $nick_tanglehair$"
 fp1_major_decisions.1011.c:0 "Meu cabelo fica; é uma marca de todas as lutas que conheci."
 fp1_major_decisions.1011.desc.gyda:0 "Pelo amor de [gyda.GetTitledFirstName],"
 fp1_major_decisions.1011.desc.intro:0 "Há muitos anos, eu fiz uma promessa de nunca cortar meu cabelo, não até que obtivesse o título elevado de Rei da $k_norway$."
 fp1_major_decisions.1011.desc.oath:0 "Pela glória da minha casa e pelo legado dos meus filhos,"
 fp1_major_decisions.1011.desc.outro:0 "Eu conquistaria cem reinos. \n\nAgora a tarefa está cumprida, e não estou mais obrigado a manter meu cabelo comprido e desgrenhado. \n\nA questão permanece: o que farei com meus cabelos?"
 fp1_major_decisions.1011.t:0 "Um Rei para $k_norway$"
 fp1_major_decisions.1012.t:0 "[king_of_norway.GetTitledFirstNameNoTooltip] reivindicou $k_norway$ primeiro"
