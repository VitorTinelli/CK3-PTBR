l_spanish:
 fp1_accepted_shieldmaiden_without_question:0 "Todos os [courtiers|E] e [vassal|E] que pensam que [shieldmaiden.GetWomenMen] não podem lutar"
 fp1_shieldmaiden.0001.a.tt_failure:0 "[shieldmaiden.GetFirstNameNoTooltip] é vitorioso(a)"
 fp1_shieldmaiden.0001.a.tt_success:0 "[challenged_knight.GetFirstNameNoTooltip] triunfa"
 fp1_shieldmaiden.0001.a:0 "Muito bem, você pode duelar [challenged_knight.GetTitledFirstNameNoTooltip]."
 fp1_shieldmaiden.0001.b.tt_failure:0 "[shieldmaiden.GetFirstNameNoTooltip] te faz cambalear"
 fp1_shieldmaiden.0001.b.tt_success:0 "Você derrota [shieldmaiden.GetFirstNameNoTooltip]"
 fp1_shieldmaiden.0001.b:0 "[challenged_knight.GetFirstNameNoTooltip]? Oh não, você lutará #EMP contra mim#!!"
 fp1_shieldmaiden.0001.c:0 "O próprio pedido é corajoso o suficiente."
 fp1_shieldmaiden.0001.d:0 "Uma [shieldmaiden.Custom('ShieldPersonFemaleMale')]? Ridículo!"
 fp1_shieldmaiden.0001.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], venho perante vós pedir uma chance para provar meu valor,\" diz minha [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('shieldmaiden'))], [shieldmaiden.GetTitledFirstName]. Eu me movo um pouco em meu trono, intrigado, enquanto a corte ao nosso redor se esforça para ouvir.\n\n\"Apesar de ser igual a qualquer um dos seus $knight_culture_player_plural_no_tooltip_lowercase$, sou proibida de ocupar um lugar em sua parede de escudos ou comandar suas tropas. Eu desafiaria [challenged_knight.GetTitledFirstName] para um duelo, para mostrar minha coragem em combate.\""
 fp1_shieldmaiden.0001.t:0 "Uma [shieldmaiden.Custom('ShieldPersonFemaleMale')] em Potencial"
 fp1_shieldmaiden.0011.a:0 "Espere, não, não— AARRGH!"
 fp1_shieldmaiden.0011.desc:0 "Escolher a fechadura da minha cela se prova mais fácil do que o esperado. Escapar de guarda em guarda é mais difícil, mas consigo, esgueirando-me como uma sombra longe da minha prisão.\n\nSó percebo que praticamente posso #EMP saborear# a liberdade quando ela me é arrancada. Virando a esquina, [shieldmaiden.GetTitledFirstName], [shieldmaiden.Custom('ShieldPersonFemaleMale')|L] de [imprisoner.GetFirstNamePossessive], emerge das sombras.\n\nSó percebo o seu porrete quando ele está vindo direto para o meu rosto."
 fp1_shieldmaiden.0011.t:0 "[shieldmaiden.Custom('ShieldPersonFemaleMale')] Impede Fuga"
 fp1_shieldmaiden.0012.a:0 "Ótimo trabalho, [shieldmaiden.GetFirstNameNoTooltip]."
 fp1_shieldmaiden.0012.b:0 "Por que você o espancou com tanta força?!"
 fp1_shieldmaiden.0012.desc:0 "[prisoner.GetTitledFirstName] foi devolvido à prisão nas primeiras horas da manhã de hoje, após quase ter escapado com sucesso durante a noite.\n\nO prisioneiro conseguiu passar pela maioria dos guardas, aparentemente, antes de ser notado por [shieldmaiden.GetTitledFirstName], que estava dando uma volta inquieta pela noite.\n\nMinha [shieldmaiden.Custom('ShieldPersonFemaleMale')] acabou espancando [prisoner.GetFirstNameNoTooltip] até deixá-lo ensanguentado, só conseguindo levá-lo de volta aos carcereiros depois de muito esforço."
 fp1_shieldmaiden.0012.t:0 "$fp1_shieldmaiden.0011.t$"
 fp1_shieldmaiden.0021.a:0 "Acabou..."
 fp1_shieldmaiden.0021.b:0 "...Não acabou até que eu diga que acabou!"
 fp1_shieldmaiden.0021.desc.assassin:0 "Meu assassino falhou em matar [target.GetTitledFirstName]! Aparentemente, [target.GetFirstNamePossessiveNoTooltip] [shieldmaiden.Custom('ShieldPersonFemaleMale')] [shieldmaiden.GetTitledFirstName] interveio, aparecendo segundos antes que o assassinato fosse concluído e eliminando o meu assassino contratado."
 fp1_shieldmaiden.0021.desc.child_pushed:0 "[Select_CString( target.IsFemale, 'A bobinha', 'O bobinho' )] da [target.Custom('GirlBoy')], que seria [target.GetTitleAsNameNoTooltip], foi tolo o suficiente para cair em minha armadilha! [target.GetFirstName] subiu até a borda da varanda como planejado, e meu agente a empurrou para o ar...\n\n...Mas o que deveria ter sido uma queda mortal não foi, quando [target.GetSheHe] foi pega por sseu/sua [shieldmaiden.Custom('ShieldPersonFemaleMale')]. [target.GetSheHe|U] vive para ver outro dia, e é improvável que caia nessa trama novamente."
 fp1_shieldmaiden.0021.desc.lured_into_forest:0 "Eu pensei que meu plano de fazer [target.GetTitledFirstName] se perder na floresta tinha sido perfeito, quando a noite chegou sem sinal [Select_CString( target.IsFemale, 'da', 'do' )] [target.Custom('GirlBoy')] errante.\n\nInfelizmente, quando eu estava prestes a ir para a cama, recebi a notícia de que [shieldmaiden.GetFirstNameNoTooltip], minha [shieldmaiden.Custom('ShieldPersonFemaleMale')], emergiu da floresta com [Select_CString( target.IsFemale, 'uma', 'um' )] [target.Custom('GirlBoy')] em seu encalço. Aparentemente, [shieldmaiden.GetSheHe] assumiu a responsabilidade de seguir o rastro de [target.GetFirstNamePossessiveNoTooltip] através da floresta e encontrou-o justo antes dos animais famintos."
 fp1_shieldmaiden.0021.desc.mob:0 "Embora a multidão que eu incitei para matar [target.GetTitledFirstName] tenha conseguido arrancar [target.GetSheHe] de seu cavalo, eles não conseguiram concluir o trabalho antes que [target.GetFirstNamePossessiveNoTooltip] [shieldmaiden.Custom('ShieldPersonFemaleMale')] interviesse. [shieldmaiden.GetSheHe|U] eliminou impiedosamente os camponeses ao alcance de [target.GetFirstNameNoTooltip] e assustou os outros para que fugissem."
 fp1_shieldmaiden.0021.desc.thugs:0 "Os capangas que eu contratei para matar [target.GetTitledFirstName] falharam em sua missão! Apesar de sua brutalidade, [target.GetFirstNamePossessiveNoTooltip] [shieldmaiden.Custom('ShieldPersonFemaleMale')] conseguiu manter [target.GetSheHe] a salvo tempo suficiente para que seus guardas pudessem se reunir e derrotar os restantes bandidos."
 fp1_shieldmaiden.0021.shieldmaiden_dies:0 "\n\nPelo menos [shieldmaiden.GetFirstNameNoTooltip] não me incomodará mais, pois [shieldmaiden.GetSheHe] morreu devido a seus ferimentos."
 fp1_shieldmaiden.0021.t:0 "$murder_save_header$ [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
 fp1_shieldmaiden.0022.a:0 "Quem gostaria de me ver #EMP morto(a)#!"
 fp1_shieldmaiden.0022.b:0 "[owner.GetSheHe|U] vai sofrer por isso!"
 fp1_shieldmaiden.0022.desc.assassin.shieldmaiden_dies:0 "\n\nInfelizmente, [shieldmaiden.GetFirstNameNoTooltip] pagou o preço final. Embora o assassino esteja morto, seus ferimentos se mostraram fatais."
 fp1_shieldmaiden.0022.desc.assassin:0 "Eu quase morri hoje! Se [shieldmaiden.GetFirstNameNoTooltip] não tivesse notado algo errado e me seguido até meus aposentos, eu seria um cadáver agora.\n\nA primeira coisa que ouvi do assassino foi [shieldmaiden.GetFirstNameNoTooltip] jogando alguém ao chão imediatamente atrás de mim, e então tudo foi um borrão de facas e punhos até que o agressor jazia morto."
 fp1_shieldmaiden.0022.desc.child_pushed:0 "\n\n#EMP WHUMP#!\n\nCaí nos braços de minha [shieldmaiden.Custom('ShieldPersonFemaleMale')], [shieldmaiden.GetFirstNameNoTooltip]. \"Criança tola! Se eu não tivesse chegado a tempo... esqueça. Vamos te levar para algum lugar seguro.\""
 fp1_shieldmaiden.0022.desc.lured_into_forest:0 "Eu estava brincando de esconde-esconde com alguns cortesãos na floresta quando percebi que fazia muito tempo desde que alguém me procurava. Tempo demais.\n\nChamo por alguém, mas não ouço nada. Fui abandonado... Tento encontrar meu caminho para casa, mas não sei para onde ir, e escurece rápido.\n\nLogo começo a ouvir as feras se movendo entre as árvores, mas antes que elas possam me alcançar, minha [shieldmaiden.Custom('ShieldPersonFemaleMale')] [shieldmaiden.GetFirstName] está lá, ofegante e brandindo uma tocha flamejante. O fogo parece dissuadir as feras, que mantêm a distância enquanto [shieldmaiden.GetSheHe] ofega \"Vamos... te levar para casa... meu senhor feudal...\""
 fp1_shieldmaiden.0022.desc.mob.shieldmaiden_dies:0 "\n\nNo momento em que eu me libero da pilha de cadáveres, a rua está deserta, exceto pelos corpos dos caídos - [shieldmaiden.GetFirstNameNoTooltip] entre eles."
 fp1_shieldmaiden.0022.desc.mob.shieldmaiden_lives:0 "\n\nDepois que os sons da luta cessam, [shieldmaiden.GetFirstNameNoTooltip] rola os corpos para longe de mim e me ajuda a ficar de pé. Além de nós, a rua agora está deserta, todos os conspiradores mortos ou fugidos."
 fp1_shieldmaiden.0022.desc.mob:0 "Estou cavalgando pelas ruas de [home_province.GetName] quando uma multidão de camponeses gritando e berrando desce sobre meu séquito. Antes que eu perceba o que está acontecendo, os plebeus me arrancam do meu cavalo e começam a me espancar!\n\nMinha [shieldmaiden.Custom('ShieldPersonFemaleMale')] [shieldmaiden.GetFirstName] corre para me defender com [shieldmaiden.Custom('signature_weapon')] em mãos, impiedosamente [shieldmaiden.Custom('SignatureWeaponWoundVerb1PresentParticiple')] os camponeses que estavam me golpeando e, talvez não tão gloriosamente, me protegendo de mais danos enquanto eu fico enterrado sob seus corpos."
 fp1_shieldmaiden.0022.desc.thugs.shieldmaiden_dies:0 "É apenas quando a luta acaba que [shieldmaiden.GetSheHe] desaba no chão, e eu descubro seus ferimentos graves. [shieldmaiden.GetSheHe] realmente me protegeu até o último momento..."
 fp1_shieldmaiden.0022.desc.thugs:0 "Estou viajando com meu séquito quando um grito vem de um bosque de árvores. 'Ataque! Vá para [ROOT.Char.GetTitleTierName]!' Uma emboscada!\n\nEsses não são meros bandidos atrás do meu ouro, mas bandidos atrás da minha vida! Minha [shieldmaiden.Custom('ShieldPersonFemaleMale')] [shieldmaiden.GetFirstNameNoTooltip] corre para me defender, colocando seu corpo entre os bandidos sanguinários e eu.\n\n[shieldmaiden.GetFirstNameNoTooltip|U] faz uma retirada lutando enquanto meus inimigos convergem em nossa posição com as lâminas balançando, mas logo meus outros guardas são capazes de se juntar à nossa defesa e abater os atacantes restantes."
 fp1_shieldmaiden.0022.owner_discovered:0 "\n\nSó uma pessoa poderia ser responsável por este ataque: [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 fp1_shieldmaiden.0022.t:0 "$murder_save_header$ [shieldmaiden.Custom('ShieldPersonFemaleMale')]"
 fp1_shieldmaiden.0032.a.courtier:0 "Veja como [shieldmaiden.GetSheHe] comanda aquela parede de escudos!"
 fp1_shieldmaiden.0032.a.root:0 "Minha parede de escudos é inquebrável!"
 fp1_shieldmaiden.0032.b.courtier:0 "Veja [shieldmaiden.GetSheHe] balançando sua espada!"
 fp1_shieldmaiden.0032.b.root:0 "Eu balanço tão forte quanto [shieldmaiden.GetFaith.WarGodName]!"
 fp1_shieldmaiden.0032.c.courtier:0 "[shieldmaiden.GetSheHe|U] sempre consegue encontrar uma abertura!"
 fp1_shieldmaiden.0032.c.root:0 "Eu vejo todas as fraquezas em meus inimigos!"
 fp1_shieldmaiden.0032.desc.courtier:0 "Observar [shieldmaiden.GetTitledFirstName] treinando é sempre uma experiência. [shieldmaiden.GetSheHe|U] luta com tanta ferocidade, tanta fúria, que é fácil esquecer que [shieldmaiden.GetSheHe] está apenas simulando um combate.\n\nEquipamentos quebrados e soldados machucados se espalham pelo campo. Uma pausa na ação envia um coro de gemidos aliviados de seus parceiros enfraquecidos de sparring.\n\nMas, quase que instantaneamente, a pausa acaba, e [shieldmaiden.GetFirstNameNoTooltip] volta à ação."
 fp1_shieldmaiden.0032.desc.root:0 "Entre guerras, é importante manter suas habilidades afiadas.\n\nEssa é a política que me encontra no campo de treinamento, brutalmente espancando, brigando e repreendendo meus soldados em minha terceira batalha simulada do dia.\n\nEles gemem quando eu os chamo de volta para a quarta. Que gemam o quanto quiserem: tenho treinamento a fazer."
 fp1_shieldmaiden.0032.t:0 "[shieldmaiden.Custom('ShieldPersonFemaleMale')] Ganha Experiência"
