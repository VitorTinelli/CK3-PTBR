l_spanish:
 KYRIE_ELEISON_GLOSS:0 "#bold Kýrie, eléison#! — \"Senhor[Select_CString( ROOT.Char.IsFemale, 'a', '' )], tem misericórdia de mim!\" — é uma oração cristã de múltiplos usos. É cantada em coroações, nas inaugurações de papas; também é usada pelas forças bizantinas como grito de guerra."
 akolouthos_aptitude_option_unlock:0 "Esta opção está disponível devido à alta [aptitude|E] do seu [GetCourtPositionType('akolouthos_court_position').GetName()]"
 assaulted_by_greek_fire_modifier:0 "Assolados pelo Fogo Grego"
 assaulted_by_greek_fire_modifier_desc:0 "A força deste personagem foi desmoralizada, dispersa, e muitos foram queimados vivos em um ataque naval com fogo grego."
 attentive_varangians_modifier:0 "Varangianos Diligentes"
 attentive_varangians_modifier_desc:0 "Bem recompensados por seus serviços, a Guarda Varangiana evita brigas e desordens em favor de uma proteção diligente."
 defenders_immolated_modifier:0 "Defensores Imolados"
 defenders_immolated_modifier_desc:0 "O porto aqui está sem frota, e as muralhas são guarnecidas por sobreviventes queimados e enfaixados."
 disrespected_varangians_modifier:0 "Desrespeitou os Varangianos"
 disrespected_varangians_modifier_desc:0 "Desafiar o direito da Guarda Varangiana a um bônus prejudicou seriamente sua lealdade, e a de tropas contratadas semelhantes."
 eager_varangian_army:0 "Multidão Varangiana"
 ep3_emperor_yearly.3000.a.flavor:0 "\"[varangian_leader.GetFirstNameNoTooltip]! Você foi nomeado líder da Guarda para controlar a Guarda. #EMP Faça isso!#!\""
 ep3_emperor_yearly.3000.a:0 "\"Pare-os, Akolouthos! Recupere meu ouro!\""
 ep3_emperor_yearly.3000.b.flavor:0 "Deixem que recebam seu pagamento — mas o palácio imperial deve manter sua dignidade. Exemplos devem ser feitos!"
 ep3_emperor_yearly.3000.b:0 "Costume ou não, eu repreenderei esses brutos!"
 ep3_emperor_yearly.3000.c.flavor:0 "Os Varangianos renunciam a salários regulares ricos e viajam de longe em busca deste grande prêmio."
 ep3_emperor_yearly.3000.c:0 "A lealdade tem seu preço."
 ep3_emperor_yearly.3000.desc:0 "Os Varangianos corpulentos e peludos cambaleiam pelos meus novos salões imperiais, seus braços carregados de ouro e joias.\n\nCom a morte de [dead_emperor.GetTitledFirstName], aqueles que o teriam defendido até o fim invadiram as câmaras do tesouro. É seu direito tradicional, e ninguém ousa impedir esses estrangeiros de elite de reivindicarem seus brilhantes bônus.\n\nEste é o preço a pagar para manter meus [GetMaA('varangian_guards').GetName], meus cães juramentados, satisfeitos em suas coleiras.\n\n"
 ep3_emperor_yearly.3000.desc_leader:0 "E assim, sob [varangian_leader.GetFullName], eles alcançam a bolsa do monarca escolhido de [ROOT.Char.GetFaith.HighGodName]."
 ep3_emperor_yearly.3000.desc_no_leader:0 "E assim, os homens do Norte alcançam a bolsa do monarca escolhido de [ROOT.Char.GetFaith.HighGodName]."
 ep3_emperor_yearly.3000.t:0 "O Direito de Pilhagem do Palácio"
 ep3_emperor_yearly.3011.a.critical_fail:0 "Seus navios se arruinam"
 ep3_emperor_yearly.3011.a.fail:0 "Um dano considerável foi causado"
 ep3_emperor_yearly.3011.a.success:0 "O ataque incinera o inimigo"
 ep3_emperor_yearly.3011.a:0 "Incendeie a própria #EMP água#!"
 ep3_emperor_yearly.3011.b:0 "Não posso arriscar a frota."
 ep3_emperor_yearly.3011.commander_attacking:0 "enviar a flotilha de [invading_commander.GetTitledFirstName]"
 ep3_emperor_yearly.3011.desc:0 "para as serenas águas de [army.GetLocation.GetNameNoTooltip], melhor do que desafiar a cidade escolhida por [ROOT.Char.GetFaith.HighGodName].\n\nOs [Glossary( 'dromons', 'DROMONS_GLOSS' )] da minha frota, com seus sifões de bronze em forma de dragão, afastam-se de seus cais. Se as águas estiverem calmas e os capitães coordenarem bem o ataque... meus inimigos queimarão.\n\nSe [ROOT.Char.GetFaith.HighGodName] exigir um preço por nossos pecados, muitos defensores de [ROOT.Char.GetCapitalLocation.GetCounty.GetCulture.GetName] serão imolados também — fogo líquido é o caos encarnado!"
 ep3_emperor_yearly.3011.intro:0 "O [invader.GetTitleAsName] de [invader.GetPrimaryTitle.GetNameNoTier] deveria saber melhor do que"
 ep3_emperor_yearly.3011.kyrie_eleison:0 "[Glossary( 'Kýrie, eléison', 'KYRIE_ELEISON_GLOSS' )]!"
 ep3_emperor_yearly.3011.liege_attacking:0 "navegar"
 ep3_emperor_yearly.3011.no_commander:0 "enviar flotilha sem comandante"
 ep3_emperor_yearly.3011.t:0 "Nosso Fogo Secreto"
 ep3_emperor_yearly.3012.a_crit_fail:0 "Uma catástrofe!"
 ep3_emperor_yearly.3012.a_fail:0 "Até o fogo de [ROOT.Char.GetFaith.PositiveAfterLife] tem suas limitações."
 ep3_emperor_yearly.3012.a_success:0 "Antes, invasores — agora, #EMP cinzas!#!"
 ep3_emperor_yearly.3012.attack_crit_fail:0 "Mas, infelizmente — #EMP minha frota queima!#! Pois, à medida que as ondas indisciplinadas lançam as chamas de meus sifões sobre seus próprios conveses de dromons, os navios [invader.GetPrimaryTitle.GetAdjectiveNoTooltip] permanecem fora do nosso alcance.\n\nApenas alguns navios aliados sobrevivem para voltar, mancando, ao grande porto de Constantinopla."
 ep3_emperor_yearly.3012.attack_fail:0 "Alguns navios [invader.GetPrimaryTitle.GetAdjectiveNoTooltip] são incendiados, suas tripulações desesperadas gritam de agonia, mas outros navios se dispersam e escapam do ataque. Logo, meus dromons retornam aos seus portos, exalando o cheiro de piche e nafta.\n\nA força inimiga, embora carbonizada e enfraquecida, ainda tem alguma força."
 ep3_emperor_yearly.3012.attack_success:0 "Como grandes piras funerárias, os navios de [invader.GetTitledFirstName] se inflamam. Corpos carbonizados, uivando, saltam deles, clamando pela libertação de [invader.GetFaith.HighGodName] — mas mesmo na água, meus inimigos encontram apenas o fogo justo!\n\nEnquanto o mar brilha, meus dromons retornam vitoriosos."
 ep3_emperor_yearly.3012.intro:0 "Meus [Glossary( 'dromons', 'DROMONS_GLOSS' )] avançam com força, remando de perto para que suas armas de terror possam alcançar a frota [invader.GetPrimaryTitle.GetAdjective].\n\nEstrondos trovejantes ecoam sobre [army.GetLocation.GetNameNoTooltip]! Grandes caudas de fogo iluminam um campo de batalha sufocado pela fumaça, ensurdecido por gritos infernais.\n\n"
 ep3_emperor_yearly.3012.t:0 "Dragões no Bósforo"
 loyal_varangians_modifier:0 "Varangianos Valentes"
 loyal_varangians_modifier_desc:0 "Fortalecidos por Varangianos inabaláveis, as formações de infantaria pesada deste personagem permanecem firmes e atacam com força."
 major_gold_to_varangians_tooltip:0 "Você paga [gold_i]#negative_value 75#! devido a #high 3#! detentores da posição de [court_position|E] Varangiana"
 medium_gold_to_varangians_tooltip:0 "Você paga [gold_i]#negative_value 50#! devido a #high 2#! detentores da posição de [court_position|E] Varangiana"
 minor_gold_to_varangians_tooltip:0 "Você paga [gold_i]#negative_value 25#! a um detentor da posição de [court_position|E] Varangiana"
 ravaged_by_greek_fire_modifier:0 "Devastados pelo Fogo Grego"
 ravaged_by_greek_fire_modifier_desc:0 "As tropas sobreviventes deste exército estão terrivelmente queimadas e completamente desmoralizadas."
 three_knights_killed_tooltip:0 "#high 3#! [knights|E] foram feridos"
 two_knights_killed_tooltip:0 "@death_icon!#high 2#! [knights|E] foram mortos"
 two_knights_wounded_tooltip:0 "#high 2#! [knights|E] foram feridos"
 unable_to_use_fire_ships_tooltip:0 "@alert_icon! #alert_trial Seus navios com Fogo Grego estarão indisponíveis por #high 30 dias#!"
