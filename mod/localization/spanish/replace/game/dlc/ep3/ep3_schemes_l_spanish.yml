 receive_slanderous_nickname_tt:0 "Um [nickname|e] negativo para [target.GetShortUINameNoTooltip] surge"
 recipient_secondary_start_found_despotate_interaction:0 "Senhor Feudal"
 recipient_secondary_start_subsume_province_interaction:0 "Senhor Feudal"
 scheme_critical_moments.1132.a:0 "Que sujeira deliciosa que amontoei!"
 scheme_critical_moments.1132.desc:0 "O discurso público está repleto dos frutos de meus designs sutis. Minha campanha escandalosa de rumores, acusações veladas e fofocas sem sentido causou uma profunda mudança no sentimento em relação [Select_CString( target.IsFemale, 'a', 'ao' )] [target.GetTitledFirstName]. A reputação [target.GetHerHim|U] está em ruínas!\n\nUma figura fina é tão facilmente despojada de todo douramento, tão avidamente manchada, pelas palavras e nas mentes dos outros..."
 scheme_critical_moments.1132.desc_discovered:0 "\n\n[target.GetFirstNameNoTooltip] sabe do meu envolvimento, mas isso pouco importa! Já é tarde demais: o dano à reputação [target.GetHerHim] está feito!"
 scheme_critical_moments.1132.desc_secret:0 "\n\n[target.GetFirstNameNoTooltip] permanece perplexo com sua degradação, totalmente alheio ao meu envolvimento!"
 scheme_critical_moments.1132.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.1133.a:0 "Apenas um pequeno revés..."
 scheme_critical_moments.1133.desc:0 "Nada. Meses de planejamento e intrigas, espalhando rumores e pagando subornos, e ainda assim a reputação d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] continua tão impenetrável como sempre!"
 scheme_critical_moments.1133.desc_discovered:0 "\n\nPara piorar a situação, não apenas desperdicei tempo e recursos, mas [target.GetFirstNameNoTooltip] também foi informado das minhas más intenções mal executadas!"
 scheme_critical_moments.1133.desc_secret:0 "\n\nPelo menos, [target.GetFirstNameNoTooltip] permanece completamente alheio de que algo estava acontecendo..."
 scheme_critical_moments.1133.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.1133.tt.failed:0 "[scheme.GetOwner.GetShortUIName] tentou [scheme.GetSchemeType.GetTypeName] contra você, mas falhou!"
 scheme_critical_moments.1133.tt:0 "[scheme.GetName] Descoberto"
 scheme_critical_moments.1134.a:0 "Que astúcia..."
 scheme_critical_moments.1134.desc:0 "Quando falo com os outros, vejo dúvida, preocupação, até mesmo divertimento em seus olhos; risinhos e sussurros me seguem onde quer que eu vá.\n\nMinhas palavras não têm mais o peso de antes, e minha posição entre meus pares parece suspeitosamente frágil. Os rumores mais absurdos e comprometedores circulam sobre #EMP mim#!... e parece que todos acreditam neles."
 scheme_critical_moments.1134.desc_discovered:0 "\n\nMeus agentes têm certeza: foi [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] quem orquestrou essa calúnia contra meu nome..."
 scheme_critical_moments.1134.desc_given_nickname:0 "\n\nAlém disso, sou informado de que vozes maldosas se referem a mim por um novo apelido. Eles ousam me chamar de [ROOT.Char.GetNickname]!"
 scheme_critical_moments.1134.t:0 "Caluniado"
 scheme_critical_moments.1142.a:0 "Excelentes resultados."
 scheme_critical_moments.1142.desc_other:0 "Tanto tempo e tantos recursos dedicados à promoção das candidaturas d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] deram alguns frutos.\n\nA posição [target.GetHerHim|U] entre seus pares melhorou, novos apoiadores agora estão convencidos do valor [target.GetHerHim], e sua nomeação está agora um passo mais perto!"
 scheme_critical_moments.1142.desc_self:0 "Todo o esforço investido em minha campanha de autopromoção valeu a pena.\n\nMinha posição entre meus pares melhorou, novos apoiadores estão aderindo às minhas candidaturas, e meu objetivo está mais próximo do que nunca!"
 scheme_critical_moments.1142.t:0 "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1142.tt:0 "Candidatura Promovida!"
 scheme_critical_moments.1143.a:0 "Uma oportunidade desperdiçada."
 scheme_critical_moments.1143.desc_other:0 "Apesar dos meus melhores esforços, simplesmente não havia como tornar [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] um candidato mais atraente...\n\nSuponho que terei que pensar em outra coisa para garantir a [target.GetSheHe] uma boa posição."
 scheme_critical_moments.1143.desc_self:0 "Todas as energias e recursos investidos em minha campanha de autopromoção simplesmente não foram suficientes. Ninguém foi convencido do meu valor ou persuadido por minhas promessas — e subornos — então minha posição permanece inalterada.\n\nTerei que pensar em algo diferente para promover minha candidatura."
 scheme_critical_moments.1143.t:0 "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1152.a:0 "Excelente."
 scheme_critical_moments.1152.desc:0 "Após analisar inúmeros tomos antigos, bajular, subornar e mentir para incontáveis burocratas, e forjar documentos, finalmente posso apresentar uma reivindicação convincente para [target.GetName]."
 scheme_critical_moments.1152.desc_discovered:0 "\n\nQue pena que não foi possível manter meu #EMP envolvimento#! em segredo, mas as evidências — falsas ou não — agora são abundantes demais para serem ignoradas."
 scheme_critical_moments.1152.desc_secret:0 "\n\nNinguém pareceu achar suspeito o surgimento repentino da minha #EMP reivindicação perfeitamente documentada#!."
 scheme_critical_moments.1152.t:0 "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1153.a:0 "Decepcionante."
 scheme_critical_moments.1153.desc:0 "Não importa quantas pessoas eu suborne ou documentos que eu forge, parece que minha reivindicação a [target.GetName] continua soando inverossímil para a maioria."
 scheme_critical_moments.1153.desc_discovered:0 "\n\nTambém se tornou de conhecimento comum que eu estava me esforçando um pouco demais."
 scheme_critical_moments.1153.desc_secret:0 "\n\nPelo menos, ninguém saberá do meu fracasso."
 scheme_critical_moments.1153.t:0 "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1172.a:0 "[target.GetFirstNameNoTooltip] aprendeu seu lugar."
 scheme_critical_moments.1172.desc:0 "Nos últimos meses, não desperdicei uma única ocasião para fazer [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] parecer um tolo em público. Enganei [target.GetSheHe] a cometer gafes na corte, o superei no conhecimento dos Clássicos e o levei a apoiar medidas financeiras insustentáveis apenas para intervir e corrigi-las.\n\nApós um debate religioso muito bem-sucedido em que habilmente fiz parecer que [target.GetFirstNameNoTooltip] estava promovendo crenças heréticas, posso me considerar satisfeito com os resultados obtidos."
 scheme_critical_moments.1172.t:0 "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1173.a:0 "[target.GetFirstNameNoTooltip] é um osso duro de roer."
 scheme_critical_moments.1173.desc:0 "Fracasso. Não importa quantas vezes tentei, [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] parece sempre estar um passo à minha frente.\n\nO conhecimento [target.GetHerHim|U] em literatura é soberbo, a compreensão [target.GetHerHim] sobre questões políticas é profunda, e o domínio [target.GetHerHim] sobre os aspectos mais intricados de nossa fé é inabalável. Ou pelo menos, são muito mais sólidos que os meus."
 scheme_critical_moments.1173.t:0 "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1174.a:0 "Não consigo acreditar nisso..."
 scheme_critical_moments.1174.desc:0 "Estou envergonhado em admitir que durante minhas últimas aparições públicas, todos os confrontos com [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] me fizeram parecer um tolo e humilhado.\n\nNão sei como isso continua acontecendo, mas sempre que estou preso em um debate com [owner.GetSheHe], pareço esquecer toda a etiqueta da corte, minhas referências se confundem, e [owner.GetSheHe] me faz soar como um idiota na melhor das hipóteses, e como um simpatizante de heréticos na pior.\n\nPreciso dar um passo para trás e reavaliar tudo o que digo por um tempo."
 scheme_critical_moments.1174.t:0 "Status Desafiado"
 scheme_critical_moments.1182.a:0 "Isso é apenas o começo."
 scheme_critical_moments.1182.desc:0 "Sucesso! O nome da Família [ROOT.Char.GetHouse.GetName] agora carrega mais peso em [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseName] — pelo menos para mim.\n\nSubornos, favores, doações, colocando a pessoa certa no lugar certo: nenhuma ferramenta foi deixada de lado. Minhas reservas de influência se aprofundam junto com minhas capacidades políticas."
 scheme_critical_moments.1182.t:0 "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1183.a:0 "Uma porta se fecha..."
 scheme_critical_moments.1183.desc:0 "As pessoas simplesmente não me apreciam.\n\nSubornos, favores, doações, intimidação — #EMP nada#! funcionou para aumentar minha influência!\n\nAcho que terei que direcionar minha atenção para outro lugar..."
 scheme_critical_moments.1183.t:0 "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.4001.a:0 "Sempre um prazer, [Select_CString( target.IsFemale, 'minha', 'meu' )] [target.GetLadyLord]."
 scheme_critical_moments.4001.desc.byzantium:0 "Os mosaicos brilham com a primeira luz da manhã, e eu me levanto do meu assento:"
 scheme_critical_moments.4001.desc.intro:0 "Levo o [ROOT.Char.Custom('RegionalAlcoholicDrink')] aos lábios com uma expressão de satisfação. Protegi a legitimidade de meu [target.GetTitleAsNameNoTooltip]... e a visão [target.GetHerHim] sobre mim.\n\n"
 scheme_critical_moments.4001.desc.other:0 "Ao notar [ROOT.Char.Custom('GetRandomInteriorDetail')] eu me levanto do meu assento:"
 scheme_critical_moments.4001.desc.outro:0 "\n\n\"À [target.GetTitledFirstName]! E à reivindicação legítima [target.GetHerHim] ao trono!\""
 scheme_critical_moments.4001.t:0 "$foster_legitimacy_scheme$: Sucesso!"
 scheme_critical_moments.4001.tt:0 "Legitimidade Promovida!"
 scheme_critical_moments.4002.a:0 "Bem, eu tinha que tentar."
 scheme_critical_moments.4002.desc:0 "Uma decepção. Suspiro ao jogar fora a carta recém-chegada da capital: \"O [target.GetTitleAsNameNoTooltip] agradece calorosamente por seus esforços.\"\n\nUm agradecimento é tão bom quanto nada. E um agradecimento do [target.GetTitleAsNameNoTooltip] é tão bom quanto um chute na canela.\n\n\"Você me decepcionou,\" [target.GetSheHe] poderia ter dito simplesmente."
 scheme_critical_moments.4002.t:0 "$foster_legitimacy_scheme$: Falha"
 scheme_critical_moments.4011.a:0 "Traga-me a tinta."
 scheme_critical_moments.4011.desc:0 "Dou uma olhada na carta que um dos meus servos acabou de colocar. O pergaminho é rico, até perfumado. Uma carta da capital, sem dúvida.\n\n\"O [target.GetTitleAsNameNoTooltip], seu senhor feudal, está passando por uma situação bastante desagradável...\"\n\nUm sorriso surge em meu rosto. Não preciso ler mais. A legitimidade [target.GetHerHim] foi prejudicada — uma oportunidade perfeita para atacar."
 scheme_critical_moments.4011.t:0 "$damage_legitimacy_scheme$: Sucesso!"
 scheme_critical_moments.4011.tt:0 "Legitimidade Prejudicada!"
 scheme_critical_moments.4012.a:0 "Paciência."
 scheme_critical_moments.4012.desc.byzantium:0 "talvez pedindo a algum cortesão para entretê-lo."
 scheme_critical_moments.4012.desc.intro:0 "Houve algumas vezes — não muitas — em que fiquei feliz por algo ter dado errado. Esta não é uma delas.\n\n[target.GetTitledFirstName] provavelmente está sentado todo pomposo em seu trono neste exato momento, "
 scheme_critical_moments.4012.desc.other:0 "provavelmente malabaristas saltando ao redor, talvez algum músico estrangeiro trazido especialmente para a ocasião."
 scheme_critical_moments.4012.desc.outro:0 "\"Viva o [target.GetTitleAsNameNoTooltip]!\" pode ser ouvido nas ruas.\n\n\"Paciência, [ROOT.Char.GetTitleAsNameNoTooltip], paciência,\" digo a mim mesmo.\n\nA caça favorece aqueles que podem esperar."
 scheme_critical_moments.4012.t:0 "$damage_legitimacy_scheme$: Falha"
 scheme_critical_moments.8002.a:0 "[target_title.GetNameNoTierNoTooltip] é #EMP meu#!."
 scheme_critical_moments.8002.desc:0 "Depois de muita disputa, debate e pressão, minhas sementes cuidadosamente plantadas finalmente deram frutos. A dança lânguida entre os burocratas [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip], o volúvel [owner.GetTopLiege.GetTitleAsNameNoTooltip], e os representantes de [target_title.GetNameNoTier] finalmente decidiram que o [target_title.GetTierAsNameNoTooltip] ficaria sob a autoridade de [ROOT.Char.GetPrimaryTitle.GetAdjective].\n\nAs tentativas patéticas d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] de se agarrar às minhas terras, e resistir à minha ampla influência na corte, foram totalmente inúteis."
 scheme_critical_moments.8002.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.8003.a:0 "Pah, não importa."
 scheme_critical_moments.8003.desc:0 "Apesar de todas as minhas súplicas, favores e lisonjas cuidadosamente colocados, meus protestos acabaram por cair em ouvidos surdos...\n\nOs burocratas [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] e o volúvel [owner.GetTopLiege.GetTitleAsNameNoTooltip] apenas confirmaram as fronteiras atuais do [owner.GetPrimaryTitle.GetAdjective] e do [target.GetPrimaryTitle.GetAdjective] [target.GetPrimaryTitle.GetTierAsNameNoTooltip]..."
 scheme_critical_moments.8003.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.8003.tt.failed:0 "[scheme.GetOwner.GetShortUIName] tentou disputar suas fronteiras, mas falhou!"
 scheme_critical_moments.8004.a:0 "E o [target.GetPrimaryTitle.GetNameNoTierNoTooltip], diminuído..."
 scheme_critical_moments.8004.desc:0 "Eu acompanhei as notícias das intrigas covardes d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] na corte imperial, e observei com desgosto enquanto a influência e as conexões [owner.GetHerHim] davam credibilidade indevida ao jogo de poder [owner.GetHerHim].\n\nA decisão de hoje confirma o pior: [target_title.GetNameNoTier] é a partir de agora considerado parte do [owner.GetPrimaryTitle.GetNameNoTier] [owner.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 scheme_critical_moments.8004.t:0 "Fronteira Disputada: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8012.a:0 "[target_title.GetNameNoTierNoTooltip] é #EMP meu#!."
 scheme_critical_moments.8012.desc:0 "Foi necessário algum esforço, mas meu alcance na corte esteve à altura da tarefa.\n\nMeus argumentos, e os subornos e favores não ditos, foram demais para os burocratas e o [owner.GetTopLiege.GetTitleAsNameNoTooltip]. [target.GetTitledFirstName] não ficará satisfeit[Select_CString( target.IsFemale, 'a', 'o' )], mas o que importa isso agora?\n\nEstá feito; estou para governar [target_title.GetNameNoTier] ao lado do [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], e seus territórios devem ser imediatamente subordinados à minha autoridade."
 scheme_critical_moments.8012.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.8013.a:0 "Malditos eunucos."
 scheme_critical_moments.8013.desc:0 "Apesar de todas as minhas súplicas, favores e bajulações cuidadosamente colocados, meus protestos acabaram caindo em ouvidos surdos...\n\nOs burocratas [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] e o volúvel [owner.GetTopLiege.GetTitleAsNameNoTooltip] apenas confirmaram a separação dos territórios [owner.GetPrimaryTitle.GetAdjective] e [target.GetPrimaryTitle.GetAdjective]..."
 scheme_critical_moments.8013.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.8013.tt.failed:0 "[scheme.GetOwner.GetShortUIName] tentou subsumir sua Governança, mas falhou!"
 scheme_critical_moments.8014.a:0 "Esta ferida não será esquecida tão cedo."
 scheme_critical_moments.8014.desc:0 "Por trás das portas elevadas dos palácios imperiais, as teias de [owner.GetTitledFirstName] continuaram a ser tecidas. Hoje, uma breve mensagem com o selo escarlate de [owner.GetTopLiege.GetTitleAsName] confirmou o pior.\n\nOs territórios de [target_title.GetNameNoTier] devem ser imediatamente subordinados [Select_CString( owner.IsFemale, 'a', 'ao' )] [owner.GetTitledFirstName], essencialmente como extensões do [owner.GetPrimaryTitle.GetAdjective] [owner.GetPrimaryTitle.GetTierAsNameNoTooltip] — ..."
 scheme_critical_moments.8014.t:0 "Governança Subsumida: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8015.a:0 "Interessante."
 scheme_critical_moments.8015.desc:0 "Após semanas de pressão política e manobras na corte, [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] conseguiu a responsabilidade pelos territórios de [target_title.GetNameNoTier], que agora são extensões do seu [owner.GetPrimaryTitle.GetTierAsNameNoTooltip] [owner.GetPrimaryTitle.GetAdjective]."
 scheme_critical_moments.8015.fallback:0 "\n\nEste #EMP golpe#! certamente levará a Casa [ROOT.Char.GetHouse.GetBaseName] a novas alturas..."
 scheme_critical_moments.8015.liege:0 "\n\nAs engrenagens da burocracia [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] estão sempre girando, e seu impulso é quase imparável — mesmo para um [owner.GetTopLiege.GetTitleAsNameNoTooltip].\n\nSó espero que [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] use suas energias a serviço do [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], não [owner.GetHerselfHimself]..."
 scheme_critical_moments.8015.same_house:0 "\n\nSó podemos esperar que esse movimento acabe beneficiando toda a Casa [ROOT.Char.GetHouse.GetName]..."
 scheme_critical_moments.8015.t:0 "Governança Subsumida: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8015.target_house:0 "\n\nEsse ultraje é um golpe severo para o status da Casa [ROOT.Char.GetHouse.GetBaseName]..."
 scheme_critical_moments.8015.vassal:0 "\n\nAs engrenagens da burocracia [owner.GetTopLiege.GetPrimaryTitle.GetAdjectiveNoTooltip] estão sempre girando, e seu impulso é quase imparável — mesmo para o [owner.GetTopLiege.GetTitleAsNameNoTooltip]."
 scheme_critical_moments.8022.a:0 "[owner.GetTitleAsNameNoTooltip]... eu gosto do som disso."
 scheme_critical_moments.8022.desc:0 "Os debates em [owner.GetTopLiege.GetCapitalLocation.GetName] foram longos e cansativos, mas os burocratas inevitavelmente cederam à sabedoria das minhas propostas. [destroyed_title.GetNameNoTier] está obsoleto, seus antigos territórios são apenas uma fração do novo [target_title.GetTierAsNameNoTooltip] de [target_title.GetNameNoTier], e #EMP eu#! sou seu [owner.GetTitleAsNameNoTooltip].\n\nUma grande mudança é iminente — para minha administração; para o [owner.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip]; para o status da Casa [owner.GetHouse.GetBaseName]!"
 scheme_critical_moments.8022.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.8023.a:0 "Malditos burocratas."
 scheme_critical_moments.8023.desc:0 "Minhas cuidadosas manobras em [owner.GetTopLiege.GetCapitalLocation.GetNameNoTooltip] — meses de planejamento meticuloso e diplomacia sutil — foram em vão.\n\nOs burocratas se recusaram a reconhecer a sabedoria das minhas propostas. A simplificação da administração da região sob um abrangente escritório [target_title.GetAdjective] foi descartada como \"desnecessária\" e \"impraticável\"..."
 scheme_critical_moments.8023.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.8023.tt.failed:0 "[scheme.GetOwner.GetShortUIName] tentou fundar um despotado, mas falhou!"
 scheme_critical_moments.8024.a:0 "Intrigante..."
 scheme_critical_moments.8024.desc:0 "Por semanas, rumores de debates efusivos ecoaram nos bastidores de [owner.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], e finalmente foi feita uma anunciada: [owner.GetFirstName] será feito um [owner.GetTitleAsNameNoTooltip], governando sobre o vasto território de [target_title.GetNameNoTier]."
 scheme_critical_moments.8024.fallback:0 "\n\nEste movimento da Casa [ROOT.Char.GetHouse.GetBaseName] mudará substancialmente o equilíbrio de poder no [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]..."
 scheme_critical_moments.8024.liege:0 "\n\nSe os burocratas concordaram por razões administrativas legítimas, ou simplesmente cederam à pressão, nunca saberei — isso ficou fora das minhas mãos.\n\nSó podemos confiar que essa mudança será benéfica para todo [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], e não apenas para [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName]..."
 scheme_critical_moments.8024.other:0 "\n\nSe os burocratas concordaram por razões administrativas legítimas, ou simplesmente cederam à pressão, nunca saberemos..."
 scheme_critical_moments.8024.t:0 "Despotado Fundado: [target_title.GetNameNoTierNoTooltip]"
 scheme_critical_moments.8024.vassalised:0 "\n\nSe os burocratas concordaram por razões administrativas legítimas, ou simplesmente cederam à pressão, agora sou seu subordinado!"
 scheme_critical_moments.8032.a.secret:0 "Uma celebração é o que se pede!"
 scheme_critical_moments.8032.a:0 "Pah, deixe [target.GetSheHe] gritar."
 scheme_critical_moments.8032.crime:0 "\n\nInfelizmente, está claro que nossa participação no assunto não passou despercebida, e [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] garantirá que todos os [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] ouçam sobre essa \"traição da [owner.GetHouse.GetBaseName].\""
 scheme_critical_moments.8032.desc:0 "Finalmente, a manhã traz notícias da propriedade [target.GetHouse.GetBaseName] em [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip], e confirmação de nosso sucesso!\n\n[Select_CString( target.IsFemale, 'As', 'Os' )] [target.Custom2('InsultNounPlural', ROOT.Char)] foram peg[Select_CString( target.IsFemale, 'as', 'os' )] completamente de surpresa"
 scheme_critical_moments.8032.emperor:0 "\n\nEu sou o [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], e não há nada que eles possam fazer para me parar..."
 scheme_critical_moments.8032.fallback:0 "e foram derrubados, para que todos [owner.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] testemunhem!"
 scheme_critical_moments.8032.imprison:0 "e estão sem dúvida procurando [Select_CString( flavor_victim.IsFemale, 'pela', 'pelo' )] [target.Custom2('RelationToMeShort', flavor_victim)] de [target.GetFirstNameNoTooltip], [Select_CString( flavor_victim.IsFemale, 'a', 'o' )] [flavor_victim.GetTitledFirstName], que agora languidece em grilhões!"
 scheme_critical_moments.8032.kill:0 "e [target.Custom2('RelationToMeShort', flavor_victim)] de [target.GetFirstNameNoTooltip], [Select_CString( flavor_victim.IsFemale, 'a', 'o' )] [flavor_victim.GetTitledFirstName], jaz morto — os sobreviventes terão que viver com esse fracasso..."
 scheme_critical_moments.8032.maim:0 "e [target.Custom2('RelationToMeShort', flavor_victim)] de [target.GetFirstNameNoTooltip], [Select_CString( flavor_victim.IsFemale, 'a', 'o' )] [flavor_victim.GetTitledFirstName], carregará as cicatrizes desse fracasso pelo resto dos dias [flavor_victim.GetHerHim]..."
 scheme_critical_moments.8032.permission:0 "\n\nTemos o apoio de [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], e esses tolos não encontrarão recurso..."
 scheme_critical_moments.8032.secret:0 "\n\nComo um bônus adicional, parece que eles não estão cientes de que estávamos por trás do ataque, e lamentavelmente não podemos esfregar essa vitória da [owner.GetHouse.GetBaseName] na cara d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] publicamente — ainda."
 scheme_critical_moments.8032.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.8033.a:0 "Toda aquela preparação... para #EMP nada#!!"
 scheme_critical_moments.8033.captured:0 "\n\nParece que [Select_CString( captured.IsFemale, 'minha', 'meu' )] [owner.Custom2('RelationToMeShort', SCOPE.sC('captured'))], [Select_CString( captured.IsFemale, 'a', 'o' )] [captured.GetTitledFirstName], foi capturado na debandada, e quaisquer esperanças de ocultar o envolvimento da [owner.GetHouse.GetBaseName] foram destruídas..."
 scheme_critical_moments.8033.desc:0 "Finalmente, a manhã traz notícias da propriedade [target.GetHouse.GetBaseName] em [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip], embora não seja o que gostaríamos de ouvir...\n\n[Select_CString( target.IsFemale, 'As', 'Os' )] [target.Custom2('InsultNounPlural', ROOT.Char)] estavam de alguma forma prontos para o ataque e frustraram nossos infiltradores antes que tivessem a chance de causar qualquer dano."
 scheme_critical_moments.8033.discovered:0 "\n\nNo entanto, parece que de alguma forma eles perceberam que a [owner.GetHouse.GetBaseName] está por trás do ataque e clamará por reparação..."
 scheme_critical_moments.8033.fallback:0 "\n\nPelo menos podemos descansar tranquilos, pois parece que eles não estão cientes de nosso envolvimento nesta trama..."
 scheme_critical_moments.8033.secret:0 "\n\nApesar desse contratempo, parece que podemos descansar na certeza de que eles ainda não suspeitam da Casa [owner.GetHouse.GetBaseName]."
 scheme_critical_moments.8033.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.8034.a.discovered:0 "Aqueles cães da [owner.GetHouse.GetBaseNameNoTooltip] pagarão por isso!"
 scheme_critical_moments.8034.a:0 "Como isso pôde acontecer...?"
 scheme_critical_moments.8034.captured:0 "\n\nNossos guardas conseguiram capturar um dos infiltradores, e a presença [Select_CString( flavor_victim.IsFemale, 'da', 'do' )] [captured.GetTitledFirstName], [owner.Custom2('RelationToMeShort', captured)] d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName], confirma que a Casa [owner.GetHouse.GetBaseName] estava por trás disso."
 scheme_critical_moments.8034.crime:0 "\n\nEsse ultraje ousado apenas serve para sublinhar a depravação daquele clã maligno e a necessidade de livrar o [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] deles!"
 scheme_critical_moments.8034.desc:0 "Ao amanhecer, rumores apressados de um ataque à propriedade familiar em [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] chegam rapidamente até mim,"
 scheme_critical_moments.8034.discovered:0 "\n\nNa sequência, todos concordam que este foi claramente um trabalho da Casa [owner.GetHouse.GetBaseName]..."
 scheme_critical_moments.8034.emperor:0 "\n\nEsse ultraje, e pelas mãos do próprio [owner.GetTopLiege.GetTitleAsNameNoTooltip]... o que devemos fazer?!"
 scheme_critical_moments.8034.failure:0 "e suspiro aliviado ao confirmar que o ataque foi frustrado."
 scheme_critical_moments.8034.fallback:0 "\n\nAnalisando a cena, os guardas não encontram pistas sobre quem estava por trás disso..."
 scheme_critical_moments.8034.imprison:0 "Dizem-me que [Select_CString( flavor_victim.IsFemale, 'minha', 'meu' )] [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))], [Select_CString( flavor_victim.IsFemale, 'a', 'o' )] [flavor_victim.GetTitledFirstName], foi aprisionado, acorrentado como um cão..."
 scheme_critical_moments.8034.kill:0 "\n\nDizem-me que [Select_CString( flavor_victim.IsFemale, 'minha', 'meu' )] [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))], [Select_CString( flavor_victim.IsFemale, 'a', 'o' )] [flavor_victim.GetTitledFirstName], está morto, abatido como um animal por algum demônio..."
 scheme_critical_moments.8034.maim:0 "\n\nDizem-me que [Select_CString( flavor_victim.IsFemale, 'minha', 'meu' )] [target.Custom2('RelationToMeShort', SCOPE.sC('flavor_victim'))], [Select_CString( flavor_victim.IsFemale, 'a', 'o' )] [flavor_victim.GetTitledFirstName], foi horrivelmente mutilado e mal sobreviveu à provação..."
 scheme_critical_moments.8034.permission:0 "\n\nA reação do [owner.GetTopLiege.GetTitleAsNameNoTooltip] deixa muito a desejar — e se [owner.GetTopLiege.GetSheHe] tivesse alguma participação nisso...?"
 scheme_critical_moments.8034.success:0 "e meu coração para ao ouvir os relatos da destruição e dos ultrajes."
 scheme_critical_moments.8034.t.known:0 "Propriedade Raided: [owner.GetHouse.GetBaseNameNoTooltip] Ataque"
 scheme_critical_moments.8034.t:0 "Propriedade Raided: Assailantes Desconhecidos"
 scheme_critical_moments.8035.a.tt:0 "Se o [scheme|E] for bem-sucedido, membros da Casa [target.GetHouse.GetBaseName] encontrados serão mortos"
 scheme_critical_moments.8035.a:0 "Mate qualquer cachorro da [target.GetHouse.GetBaseNameNoTooltip] que você encontrar."
 scheme_critical_moments.8035.b.tt:0 "Se o [scheme|E] for bem-sucedido, os membros encontrados da Casa [target.GetHouse.GetBaseName] ganharão os [traits|E] [GetTrait('blind').GetName( GetNullCharacter )], [GetTrait('disfigured').GetName( GetNullCharacter )] ou [GetTrait('eunuch_1').GetName( GetNullCharacter )]"
 scheme_critical_moments.8035.b:0 "Deixe-os viver — com algo para se lembrarem de nós."
 scheme_critical_moments.8035.c.tt:0 "Se o [scheme|E] for bem-sucedido, os membros encontrados da Casa [target.GetHouse.GetBaseName] serão [Concept('imprisoned', 'Aprisionados')|E] por você"
 scheme_critical_moments.8035.c.warning:0 "@warning_icon! #X Não há chance de que seu envolvimento permaneça em [secret|E]#!"
 scheme_critical_moments.8035.c:0 "Que qualquer cativo seja devolvido a mim."
 scheme_critical_moments.8035.crime:0 "\n\nSe meu envolvimento for descoberto, o [owner.GetTopLiege.GetTitleAsName] com certeza ouvirá sobre isso..."
 scheme_critical_moments.8035.d:0 "Poupem-nos, não queremos o sangue deles."
 scheme_critical_moments.8035.desc:0 "Após semanas de planejamento meticuloso, a Casa [owner.GetHouse.GetBaseName] está pronta para lançar nosso ataque. Nossos homens estão em posição, a propriedade d[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] em [target_domicile.GetLocation.GetBaronyNameExplicitlyNoTooltip] foi reconhecida, e os detalhes do ataque foram acordados.\n\nApenas uma pergunta permanece: como os [target.GetHouse.GetBaseName] serão tratados após nosso inevitável triunfo?"
 scheme_critical_moments.8035.emperor:0 "\n\nÉ hora de mostrar ao [owner.GetPrimaryTitle.GetTierAsNameNoTooltip] o que acontece com aqueles que me atravessam..."
 scheme_critical_moments.8035.permission:0 "\n\nCom o apoio do [owner.GetTopLiege.GetTitleAsName], não há necessidade de contenção excessiva..."
 scheme_critical_moments.8035.t:0 "[scheme.GetNameNoTooltip]: Preparativos Finais"
 scheme_critical_moments.8035.tt:0 "O [scheme|E] irá concluir"
 scheme_critical_moments.8042.a:0 "Isso acabou sendo bom!"
 scheme_critical_moments.8042.desc:0 "[Select_CString( target.IsFemale, 'Minha', 'Meu' )] [owner.Custom2('RelationToMeShort', target)], [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], parece ter apreciado profundamente meu conselho sobre questões administrativas.\n\nNa verdade, quase foi um prazer passar horas discutindo livros contábeis e as minúcias da burocracia [target.GetPrimaryTitle.GetAdjective] com [target.GetSheHe].\n\nAcho que até aprendi uma coisa ou outra ao longo do caminho!"
 scheme_critical_moments.8042.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.8043.a:0 "Que desperdício de tempo..."
 scheme_critical_moments.8043.desc:0 "Embora [Select_CString( target.IsFemale, 'minha', 'meu' )] [owner.Custom2('RelationToMeShort', target)], [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName], tenha estado receptivo a princípio à minha oferta de conselho, [target.GetSheHe] tem sido tudo menos compreensivo.\n\nSemanas de discussão próxima, analisando os registros administrativos [target.GetPrimaryTitle.GetAdjective], e oferecendo conselhos não deixaram quase nenhuma marca n[Select_CString( target.IsFemale, 'a', 'o' )] [target.GetWomanMan].\n\n[target.GetFirstNameNoTooltip] ignorou, mal interpretou ou contradisse quase cada migalha de sabedoria oferecida a [target.GetSheHe]..."
 scheme_critical_moments.8043.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.8043.tt.failed:0 "[scheme.GetOwner.GetShortUIName] tentou contestar suas fronteiras, mas falhou!"
 scheme_critical_moments.8044.a.success:0 "Um bom conselho é uma rara bênção!"
 scheme_critical_moments.8044.a:0 "Um agradecimento tático e final deve silenciar [owner.GetSheHe]."
 scheme_critical_moments.8044.desc:0 "Por semanas, recebi visitas inesperadas e constantes missivas [Select_CString( owner.IsFemale, 'da minha', 'do meu' )] [target.Custom2('RelationToMeShort', owner)], [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName]. [owner.GetSheHe|U] deixou escapar uma enxurrada de conselhos não solicitados, todos a respeito da administração adequada de um [target.GetPrimaryTitle.GetTierAsNameNoTooltip]...\n\n"
 scheme_critical_moments.8044.failure:0 "Meu ceticismo logo se confirmou, pois houve lamentavelmente pouca sabedoria a ser extraída entre as anedotas divagantes e os mantras confusos [owner.GetHerHim] — embora possam parecer pitorescas..."
 scheme_critical_moments.8044.success:0 "Meu ceticismo inicial logo deu lugar à surpresa e respeito. As palavras [owner.GetHerHim|U] foram uma fonte de sabedoria que nunca considerei, muito do qual agora se manifestou em minha administração do [target.GetPrimaryTitle.GetNameNoTier]!"
 scheme_critical_moments.8044.t:0 "Governança Mentorada"
 scheme_critical_moments.8045.a:0 "Será um prazer."
 scheme_critical_moments.8045.desc:0 "Sou muito grato pela sua oferta de aconselhar sobre a governança do [recipient.GetPrimaryTitle.GetNameNoTier]!"
 scheme_critical_moments.8045.fallback:0 "Sou muito grato pela sua oferta de aconselhar sobre as vagalidades da governança!"
 scheme_critical_moments.8045.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 scheme_critical_moments.8045.rump:0 "\n\nAguardo ansiosamente para ouvir seus pensamentos."
 scheme_critical_moments.8046.a:0 "Hmph."
 scheme_critical_moments.8046.desc:0 "Embora eu tenha me sentido lisonjeado pela sua oferta de aconselhar sobre a governança do [recipient.GetPrimaryTitle.GetNameNoTier],"
 scheme_critical_moments.8046.fallback:0 "Embora eu tenha me sentido lisonjeado pela sua oferta de me aconselhar sobre as vagalidades da governança,"
 scheme_critical_moments.8046.opening:0 "[recipient.Custom2('AppropriateGreeting', actor)]"
 scheme_critical_moments.8046.rump:0 "Acho que tenho uma boa compreensão disso por conta própria."
 scheme_critical_moments.8052.a:0 "Exatamente."
 scheme_critical_moments.8052.desc:0 "Por semanas, meus mensageiros atacaram a propriedade da [target.GetHouse.GetBaseName], levando missivas elogiosas exaltando suas grandes virtudes e linhagem.\n\nHoje eu abri a tão esperada resposta, sua bajulação e deferência confirmando que [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] finalmente captou a mensagem.\n\n#EMP \"Sempre considerei a [owner.GetHouse.GetBaseName] entre as maiores casas do [owner.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], e estou orgulhoso de contar com vocês como amigos.\"#!"
 scheme_critical_moments.8052.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.8053.a:0 "Uma resposta ousada."
 scheme_critical_moments.8053.desc:0 "Meus mensageiros têm entregado minhas palavras melosas à propriedade da [target.GetHouse.GetBaseName] há semanas, mas a resposta esperada não apareceu.\n\nFinalmente, uma missiva com [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] é colocada diante de mim, mas sem as palavras cativantes que eu aguardava.\n\n#EMP \"Bom [owner.GetFirstNameNoTooltip], ninguém negaria o poder e a glória da Casa [owner.GetHouse.GetBaseName], mas não somos seus cães de lapso.\"#!"
 scheme_critical_moments.8053.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.8054.a.success:0 "Estamos abertos a discussões..."
 scheme_critical_moments.8054.a:0 "Não somos cães de lapso da [owner.GetHouse.GetBaseNameNoTooltip]!"
 scheme_critical_moments.8054.desc:0 "Por semanas, missivas d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstName] se acumularam sobre minha mesa, cada uma elogiando a Casa [target.GetHouse.GetBaseName] e sutilmente buscando nossa amizade com a família [owner.GetHerHim].\n\n"
 scheme_critical_moments.8054.failure:0 "Essas cartas curiosas e insultuosas só podem nos fazer questionar os motivos [owner.GetHerHim], e reafirmar o orgulho da independência de nossa família."
 scheme_critical_moments.8054.success:0 "É claro que [owner.GetSheHe] busca ganhar nosso apoio, e é difícil negar as vantagens de uma aliança com uma família tão poderosa quanto a Casa [owner.GetHouse.GetBaseName]."
 scheme_critical_moments.8054.t:0 "Família Agradada"
 scheme_critical_moments.8061.a:0 "Dragões guardam o Mar de Mármara."
 scheme_critical_moments.8061.desc:0 "Profundamente nos depósitos empoeirados, meus engenheiros armazenam os últimos barris de fogo líquido. Enquanto isso, o [Glossary( 'Boukoleon Palace', 'BOUKOLEON_PALACE_GLOSS')] é o anfitrião de um exercício aterrorizante: sob a colossal estátua de leão e touro em guerra, um orgulhoso navio de guerra jorra fogo líquido.\n\nE como as chamas assassinas dançam por muito tempo! Meus inimigos seriam sábios ao evitar as águas calmas entre a Europa e a Anatólia..."
 scheme_critical_moments.8061.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.8062.a:0 "Suponho que nunca saberei..."
 scheme_critical_moments.8062.desc:0 "Fogo do Inferno! Fogo do Inferno!\n\nUm inferno incontrolável engole mais uma embarcação armada com sifões. Enquanto sua tripulação grita e assa viva, sou forçado a pensar sobre todas as tinturas caóticas, os sifões vazando, os marinheiros mortos envolvidos nesta empreitada...\n\nComo tal substância maligna #EMP algum dia#! foi controlada? Como?!?!"
 scheme_critical_moments.8062.t:0 "[scheme.GetNameNoTooltip]: Falha"
 scheme_critical_moments.8066.a:0 "\"Estou aqui para servir, [hegemon.GetTitleAsNameNoTooltip].\""
 scheme_critical_moments.8066.b:0 "\"Vou repassar sua generosidade aos meus funcionários.\""
 scheme_critical_moments.8066.desc:0 "\"Estou satisfeito com as percepções que você obteve. Encontrou, o quê? [secrets_found_value]? Nada mal...\" [hegemon.GetName] se inclina para frente em [hegemon.GetHerHis] trono.\n\n\"Não esperava menos do meu [ROOT.Char.Custom('CouncilPosition')]. Confio que você #EMP vai#! continuar o bom trabalho!\" [hegemon.GetSheHe|U] acena para os servos, que trazem um pagamento generoso."
 scheme_critical_moments.8066.t:0 "[scheme.GetNameNoTooltip]: Sucesso"
 scheme_critical_moments.8067.a:0 "Saí-me bem, desta vez."
 scheme_critical_moments.8067.desc:0 "\"Estive aguardando seu relatório, mas nada chegou. Fiquei preocupado... talvez você tenha esquecido seu dever?\" [hegemon.GetName] me repreende.\n\n\"Tive meus agentes em cada esquina em [target.GetCapitalLocation.GetName], sem sucesso,\" explico. \"Ou os cortesãos de [target.GetTitledFirstNamePossessive] são leais ou simplesmente não há nada digno de rumor.\"\n\n\"Uma desculpa pueril... pensei que poderia fazer melhor. Ao menos alguma mentira charmosa. Considerando que sua posição está em jogo!\" Balançando a cabeça [hegemon.GetHerHim], sinaliza que eu seja dispensado."
 scheme_critical_moments.8067.t:0 "[scheme.GetNameNoTooltip]: Falha"
