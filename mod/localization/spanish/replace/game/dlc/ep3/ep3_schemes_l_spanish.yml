 raid_estate:0 "Saquear Propriedade"
 raid_estate_action:0 "Saquear"
 raid_estate_desc:0 "A Casa [SCHEME.GetTargetTitle.GetHolder.GetHouse.GetBaseName] está se tornando muito confiante — uma invasão colocará [Select_CString( SCHEME.GetTargetTitle.GetHolder.IsFemale, 'a', 'o' )] [SCHEME.GetTargetTitle.GetHolder.GetTitledFirstName] no seu lugar."
 raid_estate_desc_general:0 "$raid_estate$ é um [hostile_scheme|E] que visa saquear o [domicile|E] de outra [house|E]. Baseia-se em [intrigue|E], [domicile|E] e prestígio da [house|E], podendo recrutar [agents|E].\n\nUm $raid_estate$ bem-sucedido pode resultar no roubo do [gold|E] do alvo, danos ao seu [domicile|E], e até a morte de membros da [house|E]."
