l_spanish:
 critically_low_provisions_alert:0 "Provisões Criticamente Baixas"
 critically_low_provisions_alert_desc:0 "Suas [provisions|E] estão prestes a acabar!"
 ep3_laamps_provisions.1000.a:0 "Pare de se preocupar, vai ficar tudo bem!"
 ep3_laamps_provisions.1000.b:0 "Compre algo gostoso na próxima cidade!"
 ep3_laamps_provisions.1000.desc:0 "\"[concerned.Custom2('RelationToMeShort', ROOT.Char)|U],\" começa [concerned.GetFirstName], \"Não pude deixar de notar que estamos com cerca de metade de nossas provisões...\"\n\n\"Não deveríamos começar a reduzir nossas rações ou — ainda melhor — planejar uma parada para reabastecer? Não é uma emergência ainda, mas essas situações não demoram muito para piorar. Um simples atraso, e podemos nos ver forçados a comer as solas de nossas botas!\""
 ep3_laamps_provisions.1000.t:0 "Racionamento"
 ep3_laamps_provisions.1010.a:0 "Fracos!"
 ep3_laamps_provisions.1010.desc:0 "Esta manhã, outro grupo de soldados desapareceu.\n\nEsse padrão tem ocorrido há vários dias, e devo aceitar que eles não estão simplesmente se perdendo durante a patrulha ou sendo atacados por animais selvagens enquanto montam guarda. Eles estão desertando.\n\nAdmito que as coisas têm sido difíceis: comida e água estão escassas, e o dia de pagamento pode demorar mais do que o esperado. Ainda assim, não posso tolerar tal covardia!"
 ep3_laamps_provisions.1010.t:0 "Desertores Famintos"
 ep3_laamps_provisions.1020.a:0 "Vá embora, covarde!"
 ep3_laamps_provisions.1020.desc:0 "\"#EMP Não aguento mais!#!\"\n\nEnquanto eu emergia sonolento da minha tenda, vejo um[Select_CString( leaver.IsFemale, 'a', '' )] furios[Select_CString( leaver.IsFemale, 'a', 'o' )] [leaver.GetTitledFirstName] reclamando e arrastando uma bolsa com seus poucos pertences para fora do acampamento.\n\n\"Não sinto mais meus pés, minhas costas doem o tempo todo e não lembro a última vez que tive uma refeição quente! Ou uma refeição satisfatória! Ou qualquer refeição, na verdade! #EMP Maldição para você, maldito [ROOT.Char.GetFirstNameNoTooltip]!#!\""
 ep3_laamps_provisions.1020.t:0 "Covardes"
 ep3_laamps_provisions.1025.a:0 "Adeus."
 ep3_laamps_provisions.1025.desc:0 "\"Eu #EMP realmente#! tentei apoiar você, [ROOT.Char.GetFirstNameNoTooltip], dei o meu melhor, mas isso foi longe demais!\" diz [leaver.Custom2('MyCharacterIntroduction', ROOT.Char)], lágrimas de frustração nos olhos e uma expressão assassina no rosto.\n\n\"Você vai nos levar à morte! Tudo por sua ambição boba e mesquinharia ridícula! Mas eu não vou segui-lo para um túmulo precoce! Estou indo embora. AGORA!\""
 ep3_laamps_provisions.1025.t:0 "Não Vale a Pena"
 ep3_laamps_provisions.1030.a:0 "Ainda assim, continuamos marchando."
 ep3_laamps_provisions.1030.desc:0 "Alguns dos meus soldados ainda estão desertando; a maioria, no entanto, não tem nem forças para partir.\n\nDia após dia, o número dos meus seguidores diminui, à medida que a fome, a sede e uma série de doenças os abatem um por um."
 ep3_laamps_provisions.1030.t:0 "Soldados Famintos"
 ep3_laamps_provisions.1040.a:0 "Estou apenas exausto..."
 ep3_laamps_provisions.1040.desc:0 "Uma tosse persistente sacode meu corpo. Um pouco de água poderia ajudar, mas acabou ontem. Minhas mãos tremem, e provavelmente estou com febre.\n\nEu me sinto fraco e doente — uma condição que parece ser compartilhada por muitos dos meus seguidores.\n\nPrecisamos reabastecer as provisões, e precisamos fazer isso #EMP agora#!, antes que seja tarde demais."
 ep3_laamps_provisions.1040.t:0 "Corpo Enfraquecido"
 ep3_laamps_provisions.1050.a:0 "Adeus, amigo."
 ep3_laamps_provisions.1050.a_1:0 "[dead.GetSheHe|U] não merecia isso."
 ep3_laamps_provisions.1050.a_tt:0 "Seu animal de estimação morreu"
 ep3_laamps_provisions.1050.b:0 "Pelo menos conseguimos um pouco de carne fresca com isso!"
 ep3_laamps_provisions.1050.c:0 "Afinal de contas... Por que não...?"
 ep3_laamps_provisions.1050.d.tt:0 "Você come a carcaça de seu pobre animal"
 ep3_laamps_provisions.1050.d:0 "Desculpa... Eu estou tão, tão #EMP arrependido#!..."
 ep3_laamps_provisions.1050.desc_follower:0 "\n\nNossos animais têm caído como moscas, soldados desabando à beira da estrada, e agora isso; [ROOT.Char.GetFaith.DeathDeityName] visitou meu acampamento e levou [dead.Custom2('MyCharacterIntroduction', ROOT.Char)]! O peso de todas as dificuldades nesta jornada mal planejada foi demais para [dead.GetSheHe]...\n\nEsta morte pesa fortemente em minha consciência."
 ep3_laamps_provisions.1050.desc_pet:0 "Sempre me lembrarei da maneira como seus olhos inteligentes costumavam sorrir para mim em dias melhores, mas o brilho perdido, apagado pela dor e tristeza, quando você levantou a cabeça para mim pela última vez, é tudo o que consigo ver.\n\nQue [ROOT.Char.GetFaith.HighGodName] me perdoe pela minha tolice que nos trouxe até aqui. Eu não acho que posso me perdoar."
 ep3_laamps_provisions.1050.desc_pet_cat:0 "Meu pobre [ROOT.Char.Custom( 'CatStoryName' )]!\n\nAs dificuldades da nossa jornada foram demais para um gatinho tão pequeno..."
 ep3_laamps_provisions.1050.desc_pet_dog:0 "Meu pobre [ROOT.Char.Custom( 'DogStoryName' )]!\n\nAs dificuldades da nossa jornada foram demais, até mesmo para um cão tão corajoso..."
 ep3_laamps_provisions.1050.desc_pet_horse:0 "Meu pobre [ROOT.Char.Custom( 'WarhorseStoryName' )]!\n\nAs dificuldades da nossa jornada foram demais, até mesmo para um corcel tão poderoso..."
 ep3_laamps_provisions.1050.desc_pet_no:0 "Que tragédia!"
 ep3_laamps_provisions.1050.t:0 "O Toque da Morte"
 ep3_laamps_provisions.1060.a:0 "O que devo fazer?"
 ep3_laamps_provisions.1060.desc:0 "O silêncio paira pesado sobre meu acampamento hoje, interrompido apenas pelos gemidos fracos dos doentes.\n\nDurante a noite, muitos dos meus seguidores começaram a mostrar sintomas de alguma doença. Pela manhã, parecia uma verdadeira epidemia. Meu povo, já enfraquecido pela longa marcha e pelo acesso limitado a comida e água, mal consegue reunir forças para se levantar, muito menos para andar.\n\nSe eu quiser salvar alguém, precisamos parar agora."
 ep3_laamps_provisions.1060.t:0 "Ar Mau"
 ep3_laamps_provisions.1070.a1:0 "Você morre de fome"
 ep3_laamps_provisions.1070.a2:0 "Seu estômago fica permanentemente danificado"
 ep3_laamps_provisions.1070.a3:0 "Sua força te abandona"
 ep3_laamps_provisions.1070.a4:0 "O desespero te empurra a fazer uma refeição profana"
 ep3_laamps_provisions.1070.a5:0 "Você adoece"
 ep3_laamps_provisions.1070.a6:0 "Algo em sua mente se quebra"
 ep3_laamps_provisions.1070.a7:0 "A luz desaparece de seus olhos"
 ep3_laamps_provisions.1070.a8:0 "Seu corpo fica permanentemente atrofiado"
 ep3_laamps_provisions.1070.a:0 "Eu não... posso continuar..."
 ep3_laamps_provisions.1070.desc:0 "Não consigo me lembrar da última vez que comi.\n\nMinha garganta parece papel.\n\nTudo #EMP dói#!.\n\nNão consigo nem lembrar para onde estou indo, apenas que preciso continuar.\n\nEu não quero continuar, só quero que isso tudo #EMP acabe...#!"
 ep3_laamps_provisions.1070.t:0 "Eu Vejo uma Luz?"
 ep3_laamps_provisions.1070.tt:0 "Inanição"
 ep3_laamps_provisions.1080.a:0 "Ainda assim, devemos continuar."
 ep3_laamps_provisions.1080.b:0 "Precisamos descansar antes que seja tarde demais."
 ep3_laamps_provisions.1080.c.tt:0 "Seu [travel|E] será cancelado e redirecionado para [landfall.GetBaronyNameExplicitly] ([landfall.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetName])"
 ep3_laamps_provisions.1080.c:0 "Defina um curso para a terra, #EMP agora#!!"
 ep3_laamps_provisions.1080.desc_alone:0 "Eu realmente pensei que conseguiria. Era um pouco forçado, mas eu não esperava que as coisas piorassem tão rapidamente.\n\nAgora me encontro isolado, sem provisões para sustentar minha marcha, faminto, sedento e extremamente fraco.\n\nO objetivo se aproxima a cada passo, mas pela primeira vez sinto a dúvida incômoda de que talvez eu não consiga chegar lá com vida."
 ep3_laamps_provisions.1080.desc_companion:0 "\"Eu entendo sua pressa — acredite, #EMP eu entendo#!! Mas eu imploro para que reconsidere sua urgência.\" Os olhos de [complainer.GetFirstName] parecem tristes e fundos enquanto [complainer.GetSheHe] me encara.\n\n\"Por favor, não seja tão teimoso. Estamos completamente sem comida e água limpa; se não pararmos imediatamente para descansar e reabastecer nossas provisões, estaremos marchando direto para a morte!\""
 ep3_laamps_provisions.1080.sea:0 "Você está no mar, não há onde descansar, exceto em seu próprio navio!"
 ep3_laamps_provisions.1080.t:0 "Bolsas Vazias e Estômagos Vazios"
 every_follower_custom:0 "Todo [follower|E]"
 every_maa_regiment_custom:0 "Todo regimento de Homens-de-Armas"
 hunger_sickness_modifier:0 "Doença da Fome"
 hunger_sickness_modifier_desc:0 "Desde que quase morreu de fome, este personagem não é mais o mesmo: sua pele está marcada por feridas, e seu corpo e mente estão mais fracos."
 starving_opinion:0 "Deixe-me Morrer de Fome"
 weak_stomach_modifier:0 "Estômago Fraco"
 weak_stomach_modifier_desc:0 "Depois de sobreviver com pouca ou nenhuma comida por um tempo, o estômago desse personagem não suporta mais refeições grandes ou elaboradas, tornando-o facilmente enjoado."
