l_spanish:
 ep3_restoring_rome_citizen_army_name:0 "Exército Cidadão"
 ep3_roman_restoration.0001.a.tt:0 "A [decision|E] [GetDecisionWithKey('restore_roman_empire_decision').GetName] agora está disponível"
 ep3_roman_restoration.0001.a:0 "#EMP Ecce Romani!#!"
 ep3_roman_restoration.0001.desc:0 "O quente ar mediterrâneo carrega murmúrios de um império à beira da eternidade.\n\nAqui, dentro dessas paredes históricas de [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly], a ambição de uma era passada clama. O sonho eterno de Justiniano — sua incessante busca para reunir os fragmentos dispersos de Roma — me chama.\n\nÉ meu fardo ou meu privilégio ressuscitar esses sonhos? Costurar domínios fraturados sob uma única bandeira, como ele uma vez procurou fazer?"
 ep3_roman_restoration.0001.t:0 "O Sonho de Justiniano"
 ep3_roman_restoration.0100.a:0 "Não haverá medidas pela metade."
 ep3_roman_restoration.0100.b:0 "Que haja moderação em todas as coisas."
 ep3_roman_restoration.0100.c:0 "Podemos nos adaptar sem perder nosso caminho."
 ep3_roman_restoration.0100.desc:0 "É um dia auspicioso, pois hoje o Império dos Romanos realiza seu antigo potencial.\n\nDe todos os cantos do império, podem ser ouvidos gritos de júbilo e orgulho: #EMP Ecce Romani! Salve César!#!\n\nMas agora devo guiar as velas deste vasto empreendimento. O que faremos com esta Roma? Entre meus muitos predecessores e as inúmeras encarnações do poder romano, a escolha se estreita.\n\nContinuaremos, fiéis à nossa cultura recente? Ou abraçaremos plenamente as tradições de nossos ancestrais?"
 ep3_roman_restoration.0100.t:0 "O Sonho de Justiniano Realizado"
 ep3_roman_restoration.0101.a:0 "[ROOT.Char.GetFaith.HighGodName] nos ajude a todos..."
 ep3_roman_restoration.0101.fallback:0 "Seja abraçando uma crença não convencional ou aderindo às suas crenças ancestrais, o [scoped_emperor.GetTitleAsNameNoTooltip] marcou sua ascensão com observâncias únicas que refletem suas inclinações religiosas distintas, preparando o terreno para uma identidade cultural diversificada dentro do império.\n\n"
 ep3_roman_restoration.0101.hellenic:0 "Nenhuma medida pela metade foi tomada. Com a revivificação do [scoped_emperor.GetFaith.GetName], os antigos deuses são adorados mais uma vez em grandes templos, ecoando com cantos para [scoped_emperor.GetFaith.HighGodName] e [scoped_emperor.GetFaith.KnowledgeGodName]. Este ressurgimento de rituais pagãos contrasta fortemente com a dominância cristã na Europa, apresentando um desafio ousado às ordens religiosas estabelecidas.\n\n"
 ep3_roman_restoration.0101.intro:0 "Uma declaração foi emitida do assento imperial de [scoped_emperor.GetCapitalLocation.GetBaronyNameExplicitly] pela mão de [scoped_emperor.GetName]. Terras distantes que pertenciam aos antigos romanos estão unificadas novamente pelos [scoped_emperor.GetCulture.GetCollectiveNoun], com ambições tão grandiosas quanto as dos antigos Césares.\n\n"
 ep3_roman_restoration.0101.orthodox:0 "Sustentado pelo profundo apoio da Igreja do [scoped_emperor.GetFaith.GetName], a coroação foi uma afirmação solene do direito divino, abençoada por [scoped_emperor.GetFaith.GetReligiousHead.GetTitledFirstName] [scoped_emperor.GetFaith.GetReligiousHead.GetHerselfHimself]. As raízes espirituais do império são profundas, entrelaçando a fé de perto com a ambição imperial.\n\n"
 ep3_roman_restoration.0101.outro:0 "Um poder formidável agora projeta sua sombra sobre a Terra, prometendo um futuro onde a força e a coragem de seus vizinhos serão testadas como nunca antes."
 ep3_roman_restoration.0300.a.failure:0 "Condados perdem Opinião Popular"
 ep3_roman_restoration.0300.a.success:0 "Você recupera um pouco de Opinião Popular"
 ep3_roman_restoration.0300.a:0 "Eu consertarei isso pessoalmente."
 ep3_roman_restoration.0300.b:0 "Você está demitido."
 ep3_roman_restoration.0300.c:0 "Um leão não se importa com as opiniões das ovelhas."
 ep3_roman_restoration.0300.desc:0 "\"Meu Imperador, as notícias que trago são de grave preocupação. Vim implorar seu perdão pela minha falha de julgamento. Algumas políticas que implementei trouxeram agitação e tumulto ao [inefficient_governor.GetPrimaryTitle.GetName],\" [inefficient_governor.GetTitledFirstName] me diz.\n\n\"Os mercados estão desertos, o povo comum sussurra sobre rebelião, e a nobreza local está enfurecida. A estabilidade do meu tema está por um fio, enquanto a opinião popular em todo o meu domínio despenca.\"\n\n\"A confiança do povo em seu governo — através das ações de um [inefficient_governor.GetTitleAsNameNoTooltip] mal orientado — enfrenta seu teste mais severo...\""
 ep3_roman_restoration.0300.efficiency:0 "Isso aconteceu por causa da pobre [governor_efficiency|E] de [inefficient_governor.GetName] #WEAK ([inefficient_governor.MakeScope.ScriptValue('governor_efficiency_presented')|0])#!"
 ep3_roman_restoration.0300.every_sub_realm_county:0 "Cada [county|E] mantido por [inefficient_governor.GetName]"
 ep3_roman_restoration.0300.t:0 "Governança Mal Orientada"
 ep3_roman_restoration.0500.a:0 "Que [target_kingdom.GetSheHe] teste minha determinação e veja o que [target_kingdom.GetSheHe] encontra."
 ep3_roman_restoration.0500.desc:0 "\"[ROOT.Char.GetTitleAsNameNoTooltip], venho até você hoje ágil,\" começa [Select_CString( marshal.IsFemale, 'minha', 'meu' )] [marshal.GetCouncilTitle] [marshal.GetFirstName]. \"Pois os batedores relataram que forças sob a bandeira de [target_kingdom.GetName] cruzaram nossas fronteiras sob a escuridão da noite.\n\n\"Eles têm [target_county.GetName] como seu principal alvo, saqueando nossas terras e ameaçando a segurança de nosso povo. Claramente o [target_kingdom.GetTitleAsNameNoTooltip] acredita que um poder tão vasto e imenso como nós não notaria essa transgressão.\""
 ep3_roman_restoration.0500.t:0 "Incursões na Fronteira"
 ep3_roman_restoration.easy_mode:0 "#P;BOLD;EMP O jogo prosseguirá normalmente#!"
 ep3_roman_restoration.end_hard_mode:0 "@alert_icon! #alert_bold Estas provas terminarão uma vez que você conquiste todo o mapa ou ao tomar a [decision|E] [GetDecisionWithKey( 'split_roman_empire_decision' ).GetName]"
 ep3_roman_restoration.hard_mode:0 "@warning_icon! #XB;EMP Você enfrentará os seguintes desafios:#! #indent_newline:4 #X \n$EFFECT_LIST_BULLET$Todas as [peasant_factions|E] em seu [realm|E] irão te atacar\n$EFFECT_LIST_BULLET$Aumento de [wars|E] de outros [titles|E] de reinos\n$EFFECT_LIST_BULLET$Invasão Mongol acelerada#!#!"
 ep3_roman_restoration.household_gods_tenet:0 "O [core_tenet|E] [GetFaithDoctrine('tenet_household_gods').GetBaseName] está desbloqueado para [GetFaithByKey( 'hellenic_pagan' ).GetName]"
 ep3_roman_restoration.invasion_cb:0 "Você ganha acesso ao [pax_romana_invasion_casus_belli|E]"
