l_spanish:
 HIPPEROS_GLOSS:0 "#bold Hipperos#! é uma palavra grega antiga que descreve uma obsessão por cavalos."
 ep3_yearly.1010.a.tt.failure:0 "[horse_owner.GetTitledFirstNameNoTooltip] rejeita sua oferta"
 ep3_yearly.1010.a.tt.success:0 "[horse_owner.GetTitledFirstNameNoTooltip] aceita sua oferta"
 ep3_yearly.1010.a:0 "Talvez o preço certo persuadisse [horse_owner.GetFirstNameNoTooltip]..."
 ep3_yearly.1010.b.tt.failure:0 "[horse_owner.GetTitledFirstNameNoTooltip] rejeita sua oferta"
 ep3_yearly.1010.b.tt.success:0 "[horse_owner.GetTitledFirstNameNoTooltip] acede à sua influência"
 ep3_yearly.1010.b:0 "[horse_owner.Custom('WarhorseStoryName')] é apropriado para alguém de posição mais elevada."
 ep3_yearly.1010.c.flavor:0 "Você encarrega [Select_CString( spymaster.IsFemale, 'sua Espiã', 'seu Espião' )], [spymaster.GetTitledFirstNameNoTooltip], de roubar o [horse_owner.Custom('HorseStoryMareStallion')]"
 ep3_yearly.1010.c.tt.failure:0 "[spymaster.GetFirstNameNoTooltip] falha em roubar o cavalo"
 ep3_yearly.1010.c.tt.success:0 "[spymaster.GetFirstNameNoTooltip] rouba o cavalo"
 ep3_yearly.1010.c:0 "\"[spymaster.GetFirstNameNoTooltip], este cavalo será meu — por quaisquer meios necessários.\""
 ep3_yearly.1010.d.dead_horse:0 "[horse_owner.Custom('WarhorseStoryName')] morre"
 ep3_yearly.1010.d.failure:0 "[horse_owner.GetFirstNameNoTooltip] descobre você"
 ep3_yearly.1010.d.success:0 "[horse_owner.GetFirstNameNoTooltip] não percebe"
 ep3_yearly.1010.d.tt:0 "Você envenena o cavalo [Select_CString( horse_owner.IsFemale, 'da', 'do' )] [horse_owner.GetTitledFirstNameNoTooltip]"
 ep3_yearly.1010.d:0 "Nunca olhe um cavalo dado na boca, [horse_owner.GetFirstNameNoTooltip]."
 ep3_yearly.1010.greek_flavor:0 "[Glossary( 'Hipperos', 'HIPPEROS_GLOSS' )] corre fundo na tradição grega."
 ep3_yearly.1010.intro:0 "#EMP Clip, clop. Clip, clop.#!\n\nMontado em seu cavalo, [horse_owner.Custom('WarhorseStoryName')], [Select_CString( horse_owner.IsFemale, 'minha', 'meu' )] colega governador, [horse_owner.GetTitledFirstName], trota orgulhosamente pelo meu pátio. O [horse_owner.Custom('HorseStoryMareStallion')] exibe-se com orgulho, sempre ciente de sua ilustre linhagem.\n\n[horse_owner.GetFirstNameNoTooltip] é a inveja de todos os governadores de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTooltip] — e eu não sou exceção."
 ep3_yearly.1010.outro:0 "\n\n[horse_owner.Custom('WarhorseStoryName')] deve ser meu! Mas como?"
 ep3_yearly.1010.t:0 "Hipomania"
 ep3_yearly.1010.tt:0 "[horse_owner.Custom('WarhorseStoryName')] se torna seu"
