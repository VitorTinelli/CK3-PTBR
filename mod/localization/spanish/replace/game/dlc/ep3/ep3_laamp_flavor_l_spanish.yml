l_spanish:
 NECROMANCER_GLOSS:0 "Apesar do nome, a necromancia histórica abrangia uma mistura de esoterismos abraâmicos, geralmente envolvendo súplicas a espíritos considerados #EMP impuros#! pela Igreja, sejam eles demônios, os mortos ou figuras bíblicas mais nebulosas."
 SCHEME_ET_TU_BRUTE:0 "Você descobriu os planos de [target.GetShortUINameNoTooltip]: $VALUE|+0=$"
 agreed_to_shoot_vultures:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] se uniram durante uma refeição pútrida."
 agreed_to_shoot_vultures_corresponding:0 "[TARGET_CHARACTER.GetShortUIName] e [CHARACTER.GetShortUIName|U] se uniram durante uma refeição pútrida."
 benevolent_to_mutiniers_opinion:0 "Benevolente com os Mutiantes"
 bribed_opinion:0 "Subornado"
 burdensome_prisoner_modifier:0 "Peso Morto"
 devotee_agent_desc:0 "[recipient.GetShortUIName] é seu $agent_devotee$"
 dream_ambitious:0 "Ambições Regais"
 dream_content:0 "Liberdade de Responsabilidades"
 dream_envious:0 "Inveja de Terras"
 ep3_arrogant_schemer_modifier:0 "Conspirador Prestigioso"
 ep3_arrogant_schemer_modifier_desc:0 "A boa reputação deste personagem o ajuda em suas tramas pessoais."
 ep3_camp_temperament.0001.a:0 "\"Vamos todos comer juntos!\""
 ep3_camp_temperament.0001.b:0 "\"Você deve ter envenenado isso!\""
 ep3_camp_temperament.0001.c:0 "Posso vender isso por algum ouro..."
 ep3_camp_temperament.0001.d:0 "\"#EMP Você#!, amigo, é um verdadeiro tesouro.\""
 ep3_camp_temperament.0001.desc:0 "\"Nós talvez não possamos lhe dar as melhores carnes,\" a voz de [potential_friend.GetFirstName] me surpreende, com um sorriso largo no rosto [potential_friend.GetHerHim], \"mas errantes não podem ser exigentes.\"\n\n[potential_friend.GetSheHe|U] levanta uma taça e gesticula em direção aos outros seguidores, sentados ao redor de uma fogueira fracamente iluminada. Sacos de frutas frescas estão abertos ao lado deles.\n\n\"Não pense que não vemos o que você faz por nós,\" [potential_friend.GetSheHe] continua, mais baixo agora, \"todos precisamos fazer a nossa parte.\""
 ep3_camp_temperament.0001.e:0 "\"Obrigado pelos seus esforços.\""
 ep3_camp_temperament.0001.t:0 "Alimentar um Amigo"
 ep3_camp_temperament.0010.a.flavor:0 "#EMP E você também, [enemy.GetFirstNameNoTooltip]?#!"
 ep3_camp_temperament.0010.a:0 "Não... você não."
 ep3_camp_temperament.0010.b:0 "Agora você trabalha para mim."
 ep3_camp_temperament.0010.c:0 "Você pagará por isso."
 ep3_camp_temperament.0010.d:0 "Alguma comida pode persuadi-los."
 ep3_camp_temperament.0010.desc.child:0 "Mal posso acreditar. Meu próprio filho."
 ep3_camp_temperament.0010.desc.friend:0 "Mal posso acreditar. Meu mais querido amigo."
 ep3_camp_temperament.0010.desc.intro:0 "A chuva fez com que a maioria dos meus seguidores buscasse abrigo sob o mesmo [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')], enquanto [Select_CString( enemy.IsFemale, 'a', 'o' )] [enemy.GetTitledFirstNameNoTooltip] vocifera ardentemente no meio da multidão, e eu procuro ocultar minha presença.\n\n\"Aquel[Select_CString( ROOT.Char.IsFemale, 'a', 'e' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('enemy'))], aquel[Select_CString( ROOT.Char.IsFemale, 'a', 'e' )] complet[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], inútil tol[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]! Você não vê que [ROOT.Char.GetSheHe] é incapaz de governar seu próprio acampamento? Como podemos esperar que [ROOT.Char.GetSheHe] governe algo maior que uma poça?\""
 ep3_camp_temperament.0010.desc.spouse:0 "Mal posso acreditar. Meu próprio cônjuge."
 ep3_camp_temperament.0010.e:0 "Eles não precisam gostar de mim."
 ep3_camp_temperament.0010.t:0 "Em Todos os Cantos"
 ep3_camp_temperament.0020.a:0 "'Um segredo faria uma ótima história...'"
 ep3_camp_temperament.0020.b:0 "'Você fez um excelente trabalho.'"
 ep3_camp_temperament.0020.c:0 "'O que você estava fazendo na taverna...?'"
 ep3_camp_temperament.0020.d:0 "'Conte-me de uma vez!'"
 ep3_camp_temperament.0020.desc:0 "A porta da minha tenda se abre e [Select_CString( secret_giver.IsFemale, 'a', 'o' )] [secret_giver.GetTitledFirstName] está bem na minha frente. Com uma leve reverência, [secret_giver.GetSheHe] começa: 'Peço desculpas por interrompê-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.Custom('FormOfAddressForLiege')], mas trago notícias que podem lhe interessar.'\n\n'Estava descansando em [ROOT.Char.Custom('GetPubName')], bebendo com um grupo que se revelou como servos [Select_CString( secret_owner.IsFemale, 'da', 'do' )] [secret_owner.GetTitledFirstName].'\n\n'Eles não tinham nenhum problema em falar sobre seu senhor. \"E quanto a [secret_owner.GetSheHe]?\" perguntei, e consegui descobrir o segredo [secret_owner.GetHerHim] para seu benefício.'"
 ep3_camp_temperament.0020.e:0 "Isso é entre [Select_CString( secret_owner.IsFemale, 'a', 'o' )] [secret_owner.GetTitledFirstNameNoTooltip] e [ROOT.Char.GetFaith.HighGodName]."
 ep3_camp_temperament.0020.t:0 "Boato"
 ep3_camp_temperament.0030.a:0 "'Na verdade... er... foi culpa de [bus_follower.GetShortUINameNoTooltip]!'"
 ep3_camp_temperament.0030.b.failure:0 "Você perde a luta"
 ep3_camp_temperament.0030.b.success:0 "Você vence a luta"
 ep3_camp_temperament.0030.b:0 "'Eu vou te mostrar!'"
 ep3_camp_temperament.0030.c:0 "'O que você acabou de dizer?'"
 ep3_camp_temperament.0030.d:0 "'Vocês estão todos livres para ir.'"
 ep3_camp_temperament.0030.desc.intro:0 "\"Ah, [ROOT.Char.GetTitledFirstName], que honra estar em sua companhia esta exata noite\", [cocky_follower.GetTitledFirstName] me cumprimenta ao me aproximar da fogueira. [cocky_follower.GetSheHe|U] é o único ainda bebendo ao redor dela. \"Por favor\", [cocky_follower.GetSheHe] aponta para um baú em frente a [cocky_follower.GetHerHim], e espera até que eu esteja sentado para continuar:\n\n\"Não pega bem, pega? O acampamento inteiro parece irritado com você... e talvez haja um motivo para isso,"
 ep3_camp_temperament.0030.desc.no_food:0 "com a comida acabando... você nunca sabe.'"
 ep3_camp_temperament.0030.desc.other:0 "'não acha?'"
 ep3_camp_temperament.0030.desc.outro:0 "\n\n'Que pena seria se alguém... aproveitasse o momento.'"
 ep3_camp_temperament.0030.e:0 "'Distribua este ouro entre o seu povo.'"
 ep3_camp_temperament.0030.t:0 "Motim!"
 ep3_camp_temperament.0040.a:0 "'Você está certo! Eu sou ótimo!'"
 ep3_camp_temperament.0040.b:0 "'Eu terminarei o trabalho #EMP sozinho.#!'"
 ep3_camp_temperament.0040.c:0 "'Que grande demonstração de lealdade!'"
 ep3_camp_temperament.0040.d.tt:0 "[follower.GetShortUIName|U] preenche uma nova vaga de [agent|E] $game_concept_success_chance_max_i$ [GetAgentSlotType('agent_devotee').GetName] no esquema de [my_scheme.GetName] contra [my_scheme.GetTargetCharacter.GetTitledFirstName]"
 ep3_camp_temperament.0040.d:0 "'Fique à vontade.'"
 ep3_camp_temperament.0040.desc:0 "'Um momento, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetTitleAsNameNoTooltip],' [follower.GetTitledFirstName] me interrompe enquanto observo o acampamento. [follower.GetSheHe|U] ainda está ofegante quando se dirige a mim, [follower.Custom('quirk_pos_pp')]:\n\n'Não pense que seus esforços passam despercebidos. Os [dummy_gender.GetWomenMen] o admiram, as crianças fingem ser você quando brincam, e todo o acampamento parece pensar que você é [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] maior [ROOT.Char.GetWomanMan] viv[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]!'\n\n'Desejo ajudá-lo da mesma maneira que você nos ajuda. Sei de seus... esforços atuais, e acredito que seria uma adição valiosa.'"
 ep3_camp_temperament.0040.e:0 "'Certifique-se de que #EMP todos#! saibam o quão grande eu sou.'"
 ep3_camp_temperament.0040.t:0 "Um Seguidor Devoto"
 ep3_camp_temperament_0010_tt:0 "Você ganha um #positive_value médio#! bônus para os [schemes|E] de [GetScheme('murder').GetTypeName] e [GetScheme('sway').GetTypeName] direcionados a [enemy.GetName]"
 ep3_camp_temperament_0020_d_tt:0 "Você descobre o [secret|E] de [secret_owner.GetShortUIName]"
 ep3_determined_modifier:0 "Movido por Despeito"
 ep3_determined_modifier_desc:0 "Este personagem está determinado a limpar seu nome, custe o que custar."
 ep3_heartbreak_modifier:0 "Inimigo Familiar"
 ep3_heartbreak_modifier_desc:0 "Este personagem foi difamado para seu acampamento por um membro próximo da família."
 ep3_inspired_by_life:0 "Inspirado pela Vida"
 ep3_inspired_by_life_desc:0 "Este personagem usa os segredos que conhece para escrever histórias envolventes."
 ep3_laamp_flavor.0001.a.cannibal:0 "Já comi pior."
 ep3_laamp_flavor.0001.a.fine:0 "Comendo Carniça"
 ep3_laamp_flavor.0001.a.sick:0 "Comendo Carniça"
 ep3_laamp_flavor.0001.a:0 "Uma excelente sugestão."
 ep3_laamp_flavor.0001.b:0 "Eles teriam um gosto absolutamente #EMP horrível#!"
 ep3_laamp_flavor.0001.c:0 "Comer carniça é conhecido por causar doenças."
 ep3_laamp_flavor.0001.d:0 "Aposto que posso abater mais aves que [vulture_shooter.GetFirstNameNoTooltip]."
 ep3_laamp_flavor.0001.desc1:0 "Abutres circulam acima enquanto o sol escaldante bate no meu estômago vazio. Reviro as rações restantes; estamos reduzidos a biscoitos duros e até isso está acabando rápido. Precisaremos reabastecer em breve ou enfrentar a fome.\n\nChamei a atenção dos outros para nossa situação desesperadora. Nenhuma das opções parecia atraente, para dizer o mínimo. Flexionando o braço com o arco [vulture_shooter.GetHerHim], [vulture_shooter.GetFirstName] se voluntaria para abater alguns comedores de carniça para reabastecer nossos suprimentos escassos."
 ep3_laamp_flavor.0001.desc2:0 "Gaivotas circulam acima enquanto o balanço do navio só serve para destacar a dor no meu estômago vazio. Reviro as rações restantes; estamos reduzidos a biscoitos duros e até isso está acabando rápido. Precisaremos reabastecer em breve ou enfrentar a fome.\n\nChamei a atenção dos outros para nossa situação desesperadora. Nenhuma das opções parecia atraente, para dizer o mínimo. Flexionando o braço com o arco [vulture_shooter.GetHerHim], [vulture_shooter.GetFirstName] se voluntaria para abater alguns comedores de carniça para reabastecer nossos suprimentos escassos."
 ep3_laamp_flavor.0001.desc:0 "Corvos circulam acima enquanto meu estômago dói de fome. Reviro as rações restantes; estamos reduzidos a biscoitos duros e até isso está acabando rápido. Precisaremos reabastecer em breve ou enfrentar a fome.\n\nChamei a atenção dos outros para nossa situação desesperadora. Nenhuma das opções parecia atraente, para dizer o mínimo. Flexionando o braço com o arco [vulture_shooter.GetHerHim], [vulture_shooter.GetFirstName] se voluntaria para abater alguns comedores de carniça para reabastecer nossos suprimentos escassos."
 ep3_laamp_flavor.0001.notsick:0 "Mal comestível, mas sobrevivível"
 ep3_laamp_flavor.0001.sick:0 "Carne de necrófago não me cai bem"
 ep3_laamp_flavor.0001.t1:0 "Comedores de Carniça"
 ep3_laamp_flavor.0001.t2:0 "Engolindo o Orgulho"
 ep3_laamp_flavor.0020.a:0 "Vou pagar a multa por [thieving_follower.GetFirstNameNoTooltip]."
 ep3_laamp_flavor.0020.b:0 "[thieving_follower.GetFirstNameNoTooltip] deve aceitar a punição."
 ep3_laamp_flavor.0020.c:0 "Por favor, [town_leader.GetTitledFirstNameNoTooltip], eu imploro. Deixe [thieving_follower.GetFirstNameNoTooltip] ir!"
 ep3_laamp_flavor.0020.d.tt.fail:0 "A luta foi perdida, e [thieving_follower.GetFirstName] deve pagar o preço"
 ep3_laamp_flavor.0020.d.tt.success:0 "Nós somos vitoriosos na batalha, e [thieving_follower.GetFirstName] é absolvido"
 ep3_laamp_flavor.0020.d:0 "Exigimos julgamento por combate!"
 ep3_laamp_flavor.0020.desc1:0 "\"tipicamente uma surra severa se a multa habitual não puder ser paga. No entanto, como um conhecido membro de uma gangue de vagabundos criminosos, não estou inclinado a ser tão misericordioso.\""
 ep3_laamp_flavor.0020.desc:0 "\"tipicamente uma surra severa. No entanto, estou disposto a renunciar a esta punição se uma multa apropriada puder ser paga.\""
 ep3_laamp_flavor.0020.intro:0 "Corri para a praça principal assim que soube da notícia; [thieving_follower.GetFirstName] foi pego em flagrante roubando de uma barraca do mercado. Preside do alto ninguém menos que [Select_CString( town_leader.IsFemale, 'a', 'o' )] [town_leader.GetTitledFirstName], que me encara com um olhar que poderia matar. Por contraste, [thieving_follower.GetFirstNameNoTooltip] parece muito mais feliz em me ver de sua situação no pelourinho.\n\n\"A penalidade por roubo em [town_location.GetName] é,\" explica [Select_CString( town_leader.IsFemale, 'a', 'o' )] [town_leader.GetTitledFirstName],"
 ep3_laamp_flavor.0020.t:0 "Ladrão!"
 ep3_laamp_flavor.0030.a:0 "Vou tornar meu sonho realidade."
 ep3_laamp_flavor.0030.b:0 "Foi um sonho agradável enquanto durou."
 ep3_laamp_flavor.0030.c:0 "Estou feliz por estar livre daquela vida."
 ep3_laamp_flavor.0030.desc:0 "As mesas do banquete se estendem longe! Meu alto trono brilha com rubis e safiras! Convidados dos quatro cantos do mundo celebram meus vinte anos de reinado abençoado.\n\n“Mais uma taça de doce ambrosia, glorioso Imperador?” O Supremo Arquimordomo [dream_friend.GetFirstName] pergunta, oferecendo um esplêndido cálice. Bebo ansiosamente.\n\n“Dance para mim, bobo!” Eu brado ao humilhado e desgraçado [dream_rival.GetFirstName]. Tal é o destino daqueles que me enfrentam. Fecho os olhos por um momento.\n\nAo abri-los novamente, encontro-me em uma cama de palha muito familiar. Suspiro. Apenas um sonho."
 ep3_laamp_flavor.0030.t:0 "Doces Sonhos"
 ep3_laamp_flavor.0040.a:0 "Venha conosco, vamos levá-lo para casa."
 ep3_laamp_flavor.0040.b:0 "Bem-vindo ao nosso alegre bando."
 ep3_laamp_flavor.0040.c:0 "Mal posso esperar para escrever a carta de resgate."
 ep3_laamp_flavor.0040.desc:0 "Enquanto explorava o [location_scope.GetTerrain.GetNameNoTooltip] de [ROOT.Char.GetCurrentLocation.GetName], avistei uma figura dando água a um cavalo à beira da estrada. Ao nos aproximarmos, reconheço [runaway_child.GetSheHe] como [runaway_child.GetFullName], [runaway_child.Custom('GetDaughterSon')] [Select_CString( local_ruler.IsFemale, 'da', 'do' )] [local_ruler.GetTitledFirstName]. Os olhos [runaway_child.GetHerHim|U] refletem medo e confusão, e suas roupas finas estão rasgadas e sujas.\n\nApós uma curta e tensa conversa, descubro que [runaway_child.GetFirstNameNoTooltip] fugiu de casa após algum tipo de discussão familiar, cujos detalhes mal consigo entender. Não demorou para que [runaway_child.GetSheHe] ficasse completamente perdido na natureza. Com lágrimas nos olhos, [runaway_child.GetFirstNameNoTooltip] pergunta se pode viajar conosco ou, no mínimo, se podemos escoltar [runaway_child.GetSheHe] de volta para [Select_CString( local_ruler.IsFemale, 'sua', 'seu' )] [local_ruler.GetMotherFather]."
 ep3_laamp_flavor.0040.t:0 "Senhorzinho Perdido"
 ep3_laamp_flavor.0050.a:0 "Você cessará essa feitiçaria imunda imediatamente!"
 ep3_laamp_flavor.0050.b:0 "Interessante! O que você pode me ensinar sobre demonologia?"
 ep3_laamp_flavor.0050.c:0 "Você pode instruir [Select_CString( player_heir_scope.IsFemale, 'minha', 'meu' )] [player_heir_scope.Custom('GetDaughterSon')], [player_heir_scope.GetFirstNameNoTooltip], nas artes das trevas?"
 ep3_laamp_flavor.0050.d.tt.fail:0 "O necromante o sobrepuja, forçando uma retirada"
 ep3_laamp_flavor.0050.d.tt.success:0 "O nefasto necromante é expulso"
 ep3_laamp_flavor.0050.d:0 "Terrível! Eu devo fugir!"
 ep3_laamp_flavor.0050.desc:0 "Incapaz de dormir, um passeio noturno no [location_scope.GetTerrain.GetNameNoTooltip|l] faz minha mente vagar sem rumo quando ouço... #EMP cânticos#!?\n\nSeguindo o som até sua fonte, encontro um círculo de tochas iluminando uma cena curiosa e inquietante.\n\nUm homem de manto, seus olhos fixos em seu grimório, invoca os nomes de demônios que ele busca subjugar à sua vontade. Diante dele está um círculo ritual desenhado com giz, complicado, elegante e completamente insano — esse homem é claramente um [Glossary('necromante', 'NECROMANCER_GLOSS')]!\n\nChocado, tropeço e caio, anunciando ruidosamente minha presença."
 ep3_laamp_flavor.0050.t:0 "O Necromante"
 ep3_laamp_flavor.0060.a:0 "[prisoner.GetFirstNameNoTooltip] já viveu o suficiente."
 ep3_laamp_flavor.0060.b:0 "Você não precisa ir para casa, mas não pode ficar aqui."
 ep3_laamp_flavor.0060.c:0 "Esse prisioneiro é valioso para mim, deixe [prisoner.GetSheHe] em paz."
 ep3_laamp_flavor.0060.desc:0 "“Chega de suas lamúrias incessantes! Eu também não como há dias, e não tenho o luxo de ser carregado como um príncipe!” [follower.GetFirstName] bate com os punhos contra as barras de ferro da gaiola puxada por cavalo de [prisoner.GetFirstName].\n\n“Estamos morrendo de fome e esse rato é um completo desperdício de nossas rações. Devíamos enforcar [prisoner.GetSheHe] e acabar com isso.” [follower.GetFirstNameNoTooltip] gesticula para uma árvore morta à frente."
 ep3_laamp_flavor.0060.t:0 "Peso Morto"
 ep3_poopy_pants:0 "Motim Fracassado"
 ep3_poopy_pants_desc:0 "Este personagem foi publicamente humilhado quando tentou iniciar um motim contra seu líder."
 ep3_self_employed_scheme_modifier:0 "Autônomo"
 learned_in_demonology:0 "Aprendeu Demonologia"
 no_vulture_eating:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] brigaram sobre a ideia de comer carniça."
 no_vulture_eating_corresponding:0 "[TARGET_CHARACTER.GetShortUIName] e [CHARACTER.GetShortUIName|U] brigaram sobre a ideia de comer carniça."
 returned_my_child_opinion:0 "Devolveu Meu Filho em Segurança"
 stole_my_child_opinion:0 "Roubou Meu Filho"
 thievery_helper_opinion:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] se uniram quando [CHARACTER.GetShortUIName] ajudou [TARGET_CHARACTER.GetShortUIName] a escapar das consequências de suas ações."
 thievery_helper_opinion_corresponding:0 "[TARGET_CHARACTER.GetShortUIName] e [CHARACTER.GetShortUIName|U] se uniram quando [CHARACTER.GetShortUIName] ajudou [TARGET_CHARACTER.GetShortUIName] a escapar das consequências de suas ações."
 thievery_rivalry_opinion:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] tornaram-se ressentidos um com o outro por causa de um ato de furto."
