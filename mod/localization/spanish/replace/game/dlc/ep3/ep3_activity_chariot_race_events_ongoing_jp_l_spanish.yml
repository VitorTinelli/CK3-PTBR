l_spanish:
 cancel_wager_effect_tt:0 "Sua aposta foi #N cancelada#!"
 chariot_race_ongoing_jp.0100.b.bored:0 "Um bocejo bem cronometrado, seguido de uma revirada de olhos."
 chariot_race_ongoing_jp.0100.b.fan:0 "\"Honre seus patronos! Acene! O que vocês estão #EMP jogando#!?\""
 chariot_race_ongoing_jp.0100.b.tt.failure:0 "[intent_target.GetFirstNameNoTooltip] te rejeita"
 chariot_race_ongoing_jp.0100.b.tt.neutral:0 "[intent_target.GetFirstNameNoTooltip] te ignora"
 chariot_race_ongoing_jp.0100.b.tt.success:0 "[intent_target.GetFirstNameNoTooltip] gosta do seu estilo"
 chariot_race_ongoing_jp.0100.b.wager:0 "\"Vamos, #EMP [intent_target.MakeScope.Var('wager_target').Char.GetFirstNameNoTooltip]#!! [intent_target.Custom('GetChariotTeamColorPlural')]! [intent_target.Custom('GetChariotTeamColorPlural')]!\""
 chariot_race_ongoing_jp.0100.b:0 "Envie uma nota para [intent_target.GetSheHe]."
 chariot_race_ongoing_jp.0100.d.best.tt:0 "[intent_target.GetTitledFirstName] já tem um dos melhores assentos"
 chariot_race_ongoing_jp.0100.d.better.tt:0 "[intent_target.GetTitledFirstName] já tem um assento melhor que o seu"
 chariot_race_ongoing_jp.0100.d.host_flavor:0 "Quem poderia resistir a um assento no Kathisma?"
 chariot_race_ongoing_jp.0100.d.tt.critical_failure:0 "[intent_target.GetFirstNameNoTooltip] te ignora"
 chariot_race_ongoing_jp.0100.d.tt.failure:0 "[intent_target.GetFirstNameNoTooltip] está apenas grato"
 chariot_race_ongoing_jp.0100.d.tt.partial_success:0 "[intent_target.GetFirstNameNoTooltip] está lisonjeado"
 chariot_race_ongoing_jp.0100.d.tt.success:0 "[intent_target.GetFirstNameNoTooltip] está nas nuvens"
 chariot_race_ongoing_jp.0100.d:0 "Vou acenar para [intent_target.GetSheHe], estes assentos são melhores!"
 chariot_race_ongoing_jp.0100.desc.count:0 "sentado em uma arquibancada modesta salpicada com os servos [intent_target.GetHerHim]."
 chariot_race_ongoing_jp.0100.desc.courtier:0 "sentado em uma arquibancada simples na seção da corte."
 chariot_race_ongoing_jp.0100.desc.duke:0 "sentado entre o grupo [intent_target.GetHerHim] em uma das melhores arquibancadas."
 chariot_race_ongoing_jp.0100.desc.important:0 "sentado tranquilamente no camarote grandioso [Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'da', 'do' )] [ROOT.Char.GetTopLiege.GetTitleAsName]."
 chariot_race_ongoing_jp.0100.desc.important_liege:0 "que está sentado de lado no meu camarote grandioso."
 chariot_race_ongoing_jp.0100.desc.intro:0 "Enquanto a multidão ruge impacientemente, meus olhos estão fixos [Select_CString( intent_target.IsFemale, 'na minha', 'no meu' )] [ROOT.Char.Custom2('RelationToMeShort', intent_target)], [intent_target.GetTitledFirstName],"
 chariot_race_ongoing_jp.0100.desc.king:0 "cercado por seu grupo, que se espalha por várias das melhores arquibancadas."
 chariot_race_ongoing_jp.0100.desc.liege:0 "flanqueado por confidentes no camarote grandioso [intent_target.GetHerHim]."
 chariot_race_ongoing_jp.0100.desc.target_personality.bored:0 "[Select_CString( intent_target.IsFemale, 'A', 'O' )] [intent_target.GetWomanMan] abanava-se languidamente, olhando em volta do Hipódromo com pouco interesse na corrida."
 chariot_race_ongoing_jp.0100.desc.target_personality.fallback:0 "[Select_CString( intent_target.IsFemale, 'A', 'O' )] [intent_target.GetWomanMan] está conversando com espectadores próximos, discutindo as chances de [intent_target.GetHerHIs] corredor."
 chariot_race_ongoing_jp.0100.desc.target_personality.fan:0 "[Select_CString( intent_target.IsFemale, 'A', 'O' )] [intent_target.GetWomanMan] está na beirada de seu assento, aguardando a corrida com atenção intensa."
 chariot_race_ongoing_jp.0100.desc.target_personality.wager:0 "Mais cedo, ouvi alguém dizer que [intent_target.GetSheHe] apostou uma grande quantia em [intent_target.MakeScope.Var('wager_target').Char.GetFirstName] da equipe [intent_target.Custom('GetChariotTeamColorPlural')] para [intent_target.Custom('GetWinPlaceShow')]."
 chariot_race_ongoing_jp.0100.desc:0 "\n\nEnquanto os [Glossary('téthrippa', 'QUADRIGA_GLOSS')] desfilam pelas arquibancadas, a cabeça [intent_target.GetHerHim] se vira para mim para segui-los."
 chariot_race_ongoing_jp.0100.e.host:0 "Um aceno de reconhecimento pode ir longe."
 chariot_race_ongoing_jp.0100.e:0 "Um aceno de reconhecimento deve bastar."
 chariot_race_ongoing_jp.0100.t:0 "Espetáculo Compartilhado"
 chariot_race_ongoing_jp.0200.a:0 "Tenho certeza de que podemos aprender muito um com o outro."
 chariot_race_ongoing_jp.0200.b.failure:0 "[other.GetFirstNameNoTooltip] está confus[Select_CString( other.IsFemale, 'a', 'o' )]"
 chariot_race_ongoing_jp.0200.b.partial_success:0 "[other.GetFirstNameNoTooltip] está gratificad[Select_CString( other.IsFemale, 'a', 'o' )]"
 chariot_race_ongoing_jp.0200.b.success:0 "[other.GetFirstNameNoTooltip] está encantad[Select_CString( other.IsFemale, 'a', 'o' )]"
 chariot_race_ongoing_jp.0200.b:0 "Eu não poderia ter pedido um vizinho melhor!"
 chariot_race_ongoing_jp.0200.c.failure:0 "[other.GetFirstNameNoTooltip] está confus[Select_CString( other.IsFemale, 'a', 'o' )]"
 chariot_race_ongoing_jp.0200.c.partial_success:0 "[other.GetFirstNameNoTooltip] está gratificad[Select_CString( other.IsFemale, 'a', 'o' )]"
 chariot_race_ongoing_jp.0200.c.success:0 "[other.GetFirstNameNoTooltip] está encantad[Select_CString( other.IsFemale, 'a', 'o' )]"
 chariot_race_ongoing_jp.0200.c:0 "Sou abençoado por ter um vizinho tão atraente."
 chariot_race_ongoing_jp.0200.d.tt:0 "Sua [rank|E] deve ser diferente de [other.GetTitledFirstName]"
 chariot_race_ongoing_jp.0200.d:0 "Linhas de crédito são sempre apreciadas."
 chariot_race_ongoing_jp.0200.desc.higher_rank:0 "$chariot_race_ongoing_jp.0200.desc.landed_intro$ $chariot_race_ongoing_jp.0200.desc.party_intro$ e, embora [other.GetSheHe] não seja uma grande figura do reino, [other.GetPrimaryTitle.GetNameNoTier] pode ainda fornecer #EMP algo#! útil para [ROOT.Char.GetPrimaryTitle.GetNameNoTier]..."
 chariot_race_ongoing_jp.0200.desc.intro:0 "Misturando-se pelas arquibancadas está uma multidão de vassalos imperiais, oficiais e seguidores, todos supostamente aqui para desfrutar de uma corrida. Na verdade, este é um dos melhores lugares do império para fechar acordos, expandir sua influência e talvez subir na hierarquia.\n\n[Select_CString( other.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', other)], [other.GetFirstName],"
 chariot_race_ongoing_jp.0200.desc.landed_intro:0 "um[Select_CString( other.IsFemale, 'a', '' )] [other.GetTitleAsName] a serviço de [other.GetTopLiege.GetTitleAsNameNoTooltip],"
 chariot_race_ongoing_jp.0200.desc.lower_rank:0 "$chariot_race_ongoing_jp.0200.desc.landed_intro$ $chariot_race_ongoing_jp.0200.desc.party_intro$ apresentando uma rara oportunidade de se aproximar dos poderosos — [other.GetPrimaryTitle.GetNameNoTier] tem #EMP muito#! mais influência no império do que [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 chariot_race_ongoing_jp.0200.desc.lower_rank_courtier:0 "um mero aspirante social aguardando por sua chance, está sentado perto — embora até as bestas mais humildes sejam conhecidas por ter sua utilidade..."
 chariot_race_ongoing_jp.0200.desc.party_intro:0 "reivindicou uma arquibancada próxima para seu grupo,"
 chariot_race_ongoing_jp.0200.desc.same_rank_courtier:0 "um colega em busca de ascensão social, esperando por sua chance, está sentado perto — talvez possamos ser úteis um ao outro..."
 chariot_race_ongoing_jp.0200.desc.same_rank_ruler:0 "um[Select_CString( other.IsFemale, 'a', '' )] [other.GetTitleAsName] colega no serviço [Select_CString( other.GetTopLiege.IsFemale, 'da', 'do' )] [other.GetTopLiege.GetTitleAsNameNoTooltip], $chariot_race_ongoing_jp.0200.desc.party_intro$ apresentando uma oportunidade de discutir #EMP assuntos urgentes#! que afetam [ROOT.Char.GetPrimaryTitle.GetNameNoTier] e [other.GetPrimaryTitle.GetNameNoTier]."
 chariot_race_ongoing_jp.0200.e:0 "Dívida abre muitas portas, se bem administrada."
 chariot_race_ongoing_jp.0200.f.available_tt:0 "Esta opção está disponível devido ao seu conhecimento do [secret|E] de [given_secret.GetName] [Select_CString( given_secret.GetOwner.IsFemale, 'da', 'do' )] [given_secret.GetOwner.GetTitledFirstName]"
 chariot_race_ongoing_jp.0200.f.failure:0 "[other.GetTitledFirstName] não revela nada"
 chariot_race_ongoing_jp.0200.f.success:0 "[other.GetTitledFirstName] troca um segredo"
 chariot_race_ongoing_jp.0200.f.tt:0 "[other.GetTitledFirstName] pode revelar um [secret|E] em troca"
 chariot_race_ongoing_jp.0200.f:0 "Um bom lugar para negociar segredos."
 chariot_race_ongoing_jp.0200.g:0 "Meu serviço pode abrir portas para [other.GetSheHe]."
 chariot_race_ongoing_jp.0200.h:0 "Prefiro apenas assistir à corrida."
 chariot_race_ongoing_jp.0200.t:0 "Mistura Imperial"
 chariot_race_ongoing_jp.0201.a:0 "Estas são as melhores pessoas."
 chariot_race_ongoing_jp.0201.b.tt:0 "Esta opção está disponível porque você é [Select_CString( THIS.Char.IsFemale, 'a', 'o' )] [THIS.Char.GetTitleAsNameNoTooltip|V]"
 chariot_race_ongoing_jp.0201.b:0 "Venha, [other.GetFirstNameNoTooltip], sente-se ao meu lado."
 chariot_race_ongoing_jp.0201.c:0 "Um bom lugar para negociar segredos."
 chariot_race_ongoing_jp.0201.d:0 "Acho que deveríamos ter o camarote só para nós, na verdade."
 chariot_race_ongoing_jp.0201.desc.emperor:0 "Entre os que se juntam a mim em meu camarote hoje está [Select_CString( other.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', other)], [other.GetTitledFirstName], claramente aproveitando o privilégio de acesso a mim, e o que isso comunica."
 chariot_race_ongoing_jp.0201.desc.intro:0 "Enquanto as massas lotam as arquibancadas e a nobreza serpenteia por suas seções privilegiadas, aqui no [Glossary( 'Kathisma', 'KATHISMA_GLOSS')] podemos, felizmente, desfrutar de alguma calma. Servos carregando toda sorte de refrescos aguardam nossos caprichos, enquanto os cocheiros exercem seu perigoso ofício abaixo.\n\n"
 chariot_race_ongoing_jp.0201.desc.other:0 "Entre os outros agraciados com acesso está [Select_CString( other.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', other)], [other.GetTitledFirstName], que está sentad[Select_CString( other.IsFemale, 'a', 'o' )] por perto, claramente aproveitando a exclusividade."
 chariot_race_ongoing_jp.0201.desc.other_emperor:0 "Tenho sorte de ter meu próprio assento no camarote de [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip] — uma oportunidade cobiçada para obter o favor de [Select_CString( other.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', other)]."
 chariot_race_ongoing_jp.0201.desc:0 "Talvez [other.GetSheHe] gostaria de uma conversa..."
 chariot_race_ongoing_jp.0201.e:0 "Conversar em vez de apreciar esta vista seria uma tragédia."
 chariot_race_ongoing_jp.0201.f:0 "Esta é a melhor companhia!"
 chariot_race_ongoing_jp.0201.h:0 "Você está radiante hoje, [other.GetFirstNameNoTooltip]."
 chariot_race_ongoing_jp.0201.t:0 "Sociedade Selecionada"
 chariot_race_ongoing_jp.0300.a.failure:0 "[host.GetFirstNameNoTooltip] recusa"
 chariot_race_ongoing_jp.0300.a.success:0 "[host.GetFirstNameNoTooltip] concede acesso"
 chariot_race_ongoing_jp.0300.a.tt:0 "[THIS.Char.GetShortUIName|U] entrará no Kathisma"
 chariot_race_ongoing_jp.0300.a:0 "Eu simplesmente #EMP pedirei#!."
 chariot_race_ongoing_jp.0300.b.failure:0 "[host.GetTitledFirstName] recusa"
 chariot_race_ongoing_jp.0300.b.success:0 "[host.GetTitledFirstName] aceita"
 chariot_race_ongoing_jp.0300.b:0 "Um presente pode abrir muitas portas."
 chariot_race_ongoing_jp.0300.c:0 "Felizmente, [host.GetSheHe] #EMP me deve#!."
 chariot_race_ongoing_jp.0300.d:0 "Bah, não vou me rebaixar."
 chariot_race_ongoing_jp.0300.desc.intro:0 "Embora nós, da nobreza, tenhamos as melhores arquibancadas do Hipódromo, elas não são nada comparadas aos assentos imponentes do [Glossary( 'Kathisma', 'KATHISMA_GLOSS')] e tudo o que ele representa.\n\nJunto com sua família próxima, [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] costuma conceder acesso àqueles que têm seu favor ou que podem, de outra forma, torcer seu braço..."
 chariot_race_ongoing_jp.0300.t:0 "Adquirindo Acesso"
 chariot_race_ongoing_jp.0301.a:0 "Tudo bem, deixe [weasel.GetSheHe] entrar."
 chariot_race_ongoing_jp.0301.b.failure:0 "[weasel.GetTitledFirstName] se recusa"
 chariot_race_ongoing_jp.0301.b.success:0 "[weasel.GetTitledFirstName] paga"
 chariot_race_ongoing_jp.0301.b.tt:0 "[weasel.GetTitledFirstName] não pode pagar um presente #weak (@gold_icon![THIS.Char.MakeScope.ScriptValue('minor_gold_value')|0])#!"
 chariot_race_ongoing_jp.0301.b:0 "Tais privilégios vêm com certos custos..."
 chariot_race_ongoing_jp.0301.c:0 "Suponho que não tenho muita escolha..."
 chariot_race_ongoing_jp.0301.d:0 "Não acho que seja uma boa ideia."
 chariot_race_ongoing_jp.0301.desc.ask:0 "que colocou um bilhete de súplica nas mãos do guarda do palácio..."
 chariot_race_ongoing_jp.0301.desc.gold:0 "\n\nEmbora, ouvi dizer que [weasel.GetSheHe] é bastante ric[Select_CString( weasel.IsFemale, 'a', 'o' )]."
 chariot_race_ongoing_jp.0301.desc.hook:0 "que está exercendo minha dívida com [weasel.GetSheHe] com a típica grosseria..."
 chariot_race_ongoing_jp.0301.desc.intro:0 "Embora a nobreza tenha as melhores arquibancadas no Hipódromo, elas não são nada comparadas aos assentos de comando do meu [Glossary( 'Kathisma', 'KATHISMA_GLOSS')] e tudo o que ele representa.\n\nCada um deles cobiça um lugar aqui, e parece que ninguém mais do que [weasel.GetName],"
 chariot_race_ongoing_jp.0301.t:0 "Solicitando Acesso"
 chariot_race_ongoing_jp.0400.a:0 "#EMP Vamos lá, [wager_target.GetFirstNameNoTooltip]#!!"
 chariot_race_ongoing_jp.0400.b:0 "Na próxima vez, apostarei melhor, com certeza..."
 chariot_race_ongoing_jp.0400.c:0 "Que corrida!"
 chariot_race_ongoing_jp.0400.d:0 "#EMP Vai! [wager_target.GetWomanMan], VAI!#!"
 chariot_race_ongoing_jp.0400.intro:0 "Os atendentes abaixam o marcador de golfinho [ROOT.Char.Custom('GetChariotMiddlingLapCount')] enquanto [first_place_charioteer.GetFirstName], da [first_place_charioteer.Custom('GetChariotTeamColorPlural')],"
 chariot_race_ongoing_jp.0400.intro_flavor1:0 "passa em disparada pelas brilhantes estátuas de antigos cocheiros, levantando brevemente o braço com o chicote em um triunfo prematuro."
 chariot_race_ongoing_jp.0400.intro_flavor2:0 "contorna a barreira, mal conseguindo se manter de pé, e faz com que os gritos frenéticos das massas atinjam novos níveis."
 chariot_race_ongoing_jp.0400.intro_flavor3:0 "impulsiona sua equipe de cavalos furiosamente à frente, com o chicote piscando como um instrumento de [ROOT.Char.GetFaith.HighGodName]."
 chariot_race_ongoing_jp.0400.intro_flavor4:0 "passa rapidamente por eles, lançando um olhar sobre o ombro, que é uma mistura de escárnio e preocupação."
 chariot_race_ongoing_jp.0400.intro_flavor5:0 "derrapa na curva. As seções que não estão tossindo sob a grande nuvem de poeira levantada por [first_place_charioteer.GetSheHe] explodem de alegria."
 chariot_race_ongoing_jp.0400.losing_place:0 "\n\nGrande [ROOT.Char.GetFaith.FateGodName]! O que você está fazendo na posição #EMP [wager_target.Custom('GetChariotRacePlacement')]#!, [wager_target.GetFirstNameNoTooltip]?!"
 chariot_race_ongoing_jp.0400.out:0 "\n\nSó posso refletir tristemente sobre minha aposta lamentável em [wager_target.GetFirstName]..."
 chariot_race_ongoing_jp.0400.second1:0 "\n\n[second_place_charioteer.GetFirstName] segue logo atrás de seus calcanhares,"
 chariot_race_ongoing_jp.0400.second2:0 "\n\nApenas alguns metros atrás, seguem os cavalos de [second_place_charioteer.GetFirstName], revolvendo a mesma areia,"
 chariot_race_ongoing_jp.0400.second3:0 "\n\n[second_place_charioteer.GetFirstName] segue de perto e pode ainda fechar a lacuna,"
 chariot_race_ongoing_jp.0400.second4:0 "\n\nQuase diretamente atrás [first_place_charioteer.GetHerHim], os impacientes garanhões de [second_place_charioteer.GetFirstName] seguem,"
 chariot_race_ongoing_jp.0400.second5:0 "\n\n[second_place_charioteer.GetFirstName] está um pouco atrás, mas ainda não de forma irreversível,"
 chariot_race_ongoing_jp.0400.t:0 "Outra Volta"
 chariot_race_ongoing_jp.0400.third1:0 "[second_place_charioteer.GetHerselfHimself] sendo perseguid[Select_CString( second_place_charioteer.IsFemale, 'a', 'o' )] de perto por um determinado [third_place_charioteer.GetFirstName]."
 chariot_race_ongoing_jp.0400.third2:0 "enquanto [third_place_charioteer.GetFirstName] segue atrás, procurando uma oportunidade."
 chariot_race_ongoing_jp.0400.third3:0 "enquanto [third_place_charioteer.GetFirstName] está logo atrás, com os cavalos aparentemente à distância de uma mordida."
 chariot_race_ongoing_jp.0400.third4:0 "enquanto [third_place_charioteer.GetFirstName] persegue impacientemente, pressionando por uma oportunidade de ultrapassar."
 chariot_race_ongoing_jp.0400.third5:0 "enquanto [third_place_charioteer.GetFirstName] está lentamente se aproximando, desesperad[Select_CString( third_place_charioteer.IsFemale, 'a', 'o' )] para ultrapassar."
 chariot_race_ongoing_jp.0400.winning_place:0 "\n\nGrande [ROOT.Char.GetFaith.FateGodName]! Se [wager_target.GetFirstNameNoTooltip] puder apenas manter sua posição!"
 chariot_race_ongoing_jp.0500.a:0 "Que bravura!"
 chariot_race_ongoing_jp.0500.alive:0 "[evil_knievel.GetFirstName] retorna graciosamente à posição usual de um cocheiro, sorrindo como um rei enquanto o Hipódromo delira."
 chariot_race_ongoing_jp.0500.alive_overtaken:0 "[evil_knievel.GetFirstName] retorna apressadamente à posição correta, sacudindo o punho para seu ultrapassador."
 chariot_race_ongoing_jp.0500.b:0 "Oh #EMP [ROOT.Char.GetFaith.HighGodName]#!!"
 chariot_race_ongoing_jp.0500.c:0 "Ha! Fique de olho no prêmio, [overtaking_charioteer.GetFirstNameNoTooltip]!"
 chariot_race_ongoing_jp.0500.d:0 "Seu #EMP grande tolo#!, [evil_knievel.GetFirstNameNoTooltip]!"
 chariot_race_ongoing_jp.0500.dead:0 "Os aplausos atingem o auge, quando [evil_knievel.GetFirstName] de repente perde o equilíbrio! Um emaranhado de madeira, carne de cavalo e poeira rola pela areia e colide com as barreiras..."
 chariot_race_ongoing_jp.0500.filler:0 "\n\nAs massas rugem de alegria"
 chariot_race_ongoing_jp.0500.first:0 "e [Select_CString( evil_knievel.IsFemale, 'a', 'o' )] [evil_knievel.GetWomanMan] claramente sabe disso, pois [evil_knievel.GetSheHe]"
 chariot_race_ongoing_jp.0500.gain:0 "\n\nHa! Isso vai ensinar [evil_knievel.GetSheHe] a agir como um tolo."
 chariot_race_ongoing_jp.0500.high:0 "quando [evil_knievel.GetFirstName], não muito atrás,"
 chariot_race_ongoing_jp.0500.intro:0 "Todos os olhos estão no carro de [first_place_charioteer.GetFirstName], e na liderança constante que [first_place_charioteer.GetSheHe] está esculpindo,"
 chariot_race_ongoing_jp.0500.last:0 "quando [evil_knievel.GetFirstName], muito atrás em último lugar,"
 chariot_race_ongoing_jp.0500.loss:0 "\n\nEu olho em descrença. 'Seu #EMP tolo#!, [evil_knievel.GetFirstNameNoTooltip]!'"
 chariot_race_ongoing_jp.0500.loss_dead:0 "\n\nEu enterro o rosto nas minhas mãos... '[Select_CString( evil_knievel.IsFemale, 'Sua tola', 'Seu tolo' )], [evil_knievel.GetFirstNameNoTooltip]... !'"
 chariot_race_ongoing_jp.0500.low:0 "quando [evil_knievel.GetFirstName], ficando para trás com os perdedores,"
 chariot_race_ongoing_jp.0500.maintained:0 "enquanto [evil_knievel.GetFirstNameNoTooltip] de alguma forma mantém sua posição, impedindo as ultrapassagens, apesar de tudo!"
 chariot_race_ongoing_jp.0500.maintained_last:0 "parece que [evil_knievel.GetSheHe] quer #EMP alguma#! glória, mesmo que vá terminar em último."
 chariot_race_ongoing_jp.0500.middle:0 "quando [evil_knievel.GetFirstName], perdid[Select_CString( evil_knievel.IsFemale, 'a', 'o' )] no meio,"
 chariot_race_ongoing_jp.0500.overtake:0 "mas [overtaking_charioteer.GetFirstName] está menos impressionad[Select_CString( overtaking_charioteer.IsFemale, 'a', 'o' )]: vendo sua oportunidade, [overtaking_charioteer.GetSheHe] rapidamente ultrapassa para a posição de [overtaking_charioteer.Custom('GetChariotRacePlacement')]."
 chariot_race_ongoing_jp.0500.t:0 "Exibindo-se"
 chariot_race_ongoing_jp.0500.trick_flavor1:0 "de repente salta para a frente de seu carro, dirigindo com uma mão enquanto acena para as arquibancadas!"
 chariot_race_ongoing_jp.0500.trick_flavor2:0 "salta dentro da carruagem e, de costas, continua a dirigir enquanto manda beijos para as arquibancadas!"
 chariot_race_ongoing_jp.0500.trick_flavor3:0 "salta para fora da carruagem e sobe nas costas de seu cavalo líder, com o braço levantado em triunfo!"
 chariot_race_ongoing_jp.0500.trick_flavor4:0 "salta para fora da carruagem e sobe nas costas de seu cavalo líder, acenando para as arquibancadas!"
 chariot_race_ongoing_jp.0600.a:0 "Ah, dê o fora, [castigator.GetFirstNameNoTooltip]! Estou tentando assistir à corrida!"
 chariot_race_ongoing_jp.0600.b:0 "Acho que eu poderia reduzir minha aposta..."
 chariot_race_ongoing_jp.0600.c:0 "Você está #EMP cert[Select_CString( castigator.IsFemale, 'a', 'o' )]!#! Rápido! Traga [bookmaker.GetFirstNameNoTooltip] de volta!"
 chariot_race_ongoing_jp.0600.desc:0 "\n\n'Não me diga! Você está apostando #EMP todo#! o seu dinheiro?' [castigator.GetSheHe] continua, [castigator.Custom('quirk_neg_adverb')]. 'Você não terá nada sobrando! E quanto às #EMP contingências?!#' O corretor de apostas some de vista, recuando diante do olhar penetrante de [castigator.GetFirstNameNoTooltip]."
 chariot_race_ongoing_jp.0600.intro:0 "Mal o corretor de apostas, [bookmaker.GetTitledFirstName], saiu, a bolsa em seu cinto tilintando alegremente com meu suado dinheiro, quando ouço [Select_CString( castigator.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('castigator'))], [castigator.GetTitledFirstName], gritando incrédul[Select_CString( castigator.IsFemale, 'a', 'o' )]:\n\n'#EMP Oh...!#! Pelo #EMP amor#! de [castigator.Custom2('RelationToMeShort', ROOT.Char)]!'"
 chariot_race_ongoing_jp.0600.kathisma:0 "Um silêncio toma conta do [Glossary('kathisma', 'KATHISMA_GLOSS')] enquanto cálices caem e cabeças se viram."
 chariot_race_ongoing_jp.0600.stands:0 "Um silêncio toma conta das arquibancadas circundantes enquanto todos se voltam para admirar esta explosão."
 chariot_race_ongoing_jp.0600.t:0 "Bolsos Vazios"
 halve_wager_effect_tt:0 "Sua aposta é #M reduzida pela metade#!"
