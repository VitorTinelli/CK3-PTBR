 ep3_agitated_populace:0 "População Agitada"
 ep3_agitated_populace_desc:0 "Um pregador carismático recentemente realizou um culto inflamável denunciando os males da classe dominante neste condado."
 ep3_hasan_advance_radicalism:0 "Avance sua missão sagrada"
 ep3_hasan_assassin_war:0 "Dissolução dos Assassinos"
 ep3_religious_doubts:0 "Dúvidas Religiosas"
 ep3_religious_doubts_desc:0 "Um missionário carismático recentemente pregou sua religião estrangeira nesta província. Embora não tenha conseguido converter a maioria das pessoas, isso perturbou a fé dos camponeses na religião tradicional."
 friend_supported_my_claim:0 "[CHARACTER.GetShortUIName|U] apoiou a reivindicação de [TARGET_CHARACTER.GetShortUIName]"
 friend_supported_my_claim_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] apoiou a reivindicação de [CHARACTER.GetShortUIName]"
 has_tougher_to_convert_tt:0 "Não possui o [modifier|E] [GetModifier( 'tougher_to_convert' ).GetNameWithTooltip|L]"
 hasan_agitate_the_populace:0 "Agitar a População Local"
 hasan_agitate_the_populace_confirm:0 "Eles verão a verdade"
 hasan_agitate_the_populace_desc:0 "Nem todos no reino estão cientes dos males de seus governantes. Algumas palavras do livro sagrado devem orientá-los na direção certa."
 hasan_agitate_the_populace_tooltip:0 "Tentar reduzir a [county_opinion|E] de um condado próximo."
 hasan_evangelize_the_faith:0 "Evangelizar a Fé"
 hasan_evangelize_the_faith_confirm:0 "Realizar o sermão"
 hasan_evangelize_the_faith_desc:0 "Minha missão divina é espalhar a palavra de Allah e de seu profeta escolhido."
 hasan_evangelize_the_faith_tooltip:0 "Tentar espalhar sua [faith|E] em um condado próximo"
 hasan_expand_the_assassins:0 "Expandir os Assassinos"
 hasan_expand_the_assassins_confirm:0 "Um novo lar"
 hasan_expand_the_assassins_desc:0 "Precisamos de mais propriedades para expandir a influência dos Assassinos. A partir daí, podemos ver a queda dos blasfemos."
 hasan_expand_the_assassins_tooltip:0 "Expandir sua [holy_order|E]"
 hasan_fanatics:0 "Fanáticos de [ROOT.Char.GetTitledFirstNameNoTooltip|U]"
 hasan_found_the_assassins:0 "Fundar os Assassinos"
 hasan_found_the_assassins_confirm:0 "Bismillah!"
 hasan_found_the_assassins_desc:0 "Blasfemos e hereges infestam a terra e ficou claro que palavras sozinhas não os acalmarão. Chegou a hora de escalar este conflito teológico para um militar, e os inimigos dos fiéis enfrentarão a lâmina."
 hasan_found_the_assassins_tooltip:0 "Estabelecer uma [holy_order|E] para proteger sua [faith|E]"
 hasan_ignite_the_flames:0 "Começar a Revolução"
 hasan_ignite_the_flames_confirm:0 "Nossa hora é agora"
 hasan_ignite_the_flames_desc:0 "Os fiéis estão reunidos e chegou a hora de acabar com a vilania que governa estas terras."
 hasan_ignite_the_flames_tooltip:0 "Declarar uma [war|E] para desmantelar o império"
 hasan_sabbah.1000.a:0 "Você conseguiu ferir e prejudicar minha crença."
 hasan_sabbah.1000.b:0 "A verdade não pode ser buscada fora dos limites do Islã."
 hasan_sabbah.1000.desc:0 "[amira.GetName|U], um crente e seguidor do Califa Egípcio, tem pregado a [amira.GetHerHis] visão não ortodoxa sobre o Islã no coração de [location.GetName]. Não tenho dúvidas sobre a verdade do Islã e [ROOT.Char.GetFaith.HighGodName|U], e nunca antes duvidei que tal verdade possa ser encontrada em qualquer lugar além do [ROOT.Char.GetFaith.GetName], mas as palavras de [amira.GetFirstNameNoTooltip] soam diferentes em meu ouvido.\n\nPasso grande parte do restante do dia discutindo livros sagrados e hadith com [amira.GetFirstNameNoTooltip], e ouço a verdade na filosofia [GetFaithByKey('ismaili').GetAdjective|U] pela primeira vez."
 hasan_sabbah.1000.t:0 "[GetFaithByKey('ismaili').GetAdjectiveNoTooltip|U] Pregadores"
 hasan_sabbah.1010.a.lose:0 "A multidão permanece inconsciente"
 hasan_sabbah.1010.a.win:0 "A multidão é convencida"
 hasan_sabbah.1010.a:0 "Em nome de [ROOT.Char.GetFaith.HighGodName|U], o mais perdoador e misericordioso..."
 hasan_sabbah.1010.desc:0 "O povo se reuniu ao meu redor no coração de [location.GetNameNoTier], seus olhos apagados na ausência da luz de [ROOT.Char.GetFaith.HighGodName|U].\n\nCom passagens de [ROOT.Char.GetFaith.ReligiousText|U] memorizadas, começo a falar..."
 hasan_sabbah.1010.t:0 "Evangelismo [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U]"
 hasan_sabbah.1020.a.tt:0 "Você viajará para [cairo.GetProvince.GetBaronyNameExplicitly]"
 hasan_sabbah.1020.a:0 "[ROOT.Char.GetFaith.HighGodName|U] tem um plano para mim lá."
 hasan_sabbah.1020.b:0 "Sou mais necessário onde estou."
 hasan_sabbah.1020.desc:0 "Um emissário de [ismaili_caliph.GetName] me cumprimenta hoje com uma reverência cortês e uma mensagem.\n\n\"O Califa ouviu sobre seu grande trabalho aqui e deseja que você avance seus estudos como um missionário [ismaili_caliph.GetFaith.GetAdjective] em [cairo.GetNameNoTier].\""
 hasan_sabbah.1020.t:0 "Chamado Divino"
 hasan_sabbah.1022.a:0 "Eu fico ao lado de [nizar.GetFirstNameNoTooltip|U]!"
 hasan_sabbah.1022.b:0 "Devo manter o curso."
 hasan_sabbah.1022.desc:0 "Cheguei e já a situação no Califado é de fato bastante grave. [nizar.GetFirstName|U], o legítimo e preferido sucessor de [ismaili_caliph.GetName], foi removido da linha de sucessão. Isso claramente não é o que o profeta tinha em mente para o futuro do Islã.\n\nAs intrigas e mentiras dos homens corromperam o plano de [ROOT.Char.GetFaith.HighGodName|U], e algo deve ser feito!"
 hasan_sabbah.1022.t:0 "O Califado [GetFaithByKey('ismaili').GetAdjectiveNoTooltip|U]"
 hasan_sabbah.1030.a:0 "Não perecerei na descrença!"
 hasan_sabbah.1030.b:0 "[new_ismaili_caliph.GetFirstNameNoTooltip|U] é o califa legítimo."
 hasan_sabbah.1030.c:0 "Apoiarei qualquer candidato [GetFaithByKey('ismaili').GetAdjective]."
 hasan_sabbah.1030.desc:0 "[ismaili_caliph.GetName|U] finalmente foi unido a [ROOT.Char.GetFaith.HighGodName|U] e está em paz, mas aqueles de nós que ficaram para trás devem enfrentar o peso da ausência de [ismaili_caliph.GetHerHis]. Através de manobras políticas e forças além da compreensão, "
 hasan_sabbah.1030.desc_caliph_heir:0 "$hasan_sabbah.1030.desc$ [new_ismaili_caliph.GetName] sucedeu [ismaili_caliph.GetHerHim] $hasan_sabbah.1030.desc_outro$"
 hasan_sabbah.1030.desc_caliph_no_heir:0 "$hasan_sabbah.1030.desc$ o Califado não tem sucessor $hasan_sabbah.1030.desc_outro$"
 hasan_sabbah.1030.desc_outro:0 ", e as reivindicações [GetFaithByKey('nizari').GetAdjective] foram ignoradas.\n\nEu sei com certeza que [nizar.GetName] era o candidato preferido, mas se eu tornar minha lealdade conhecida, certamente farei um inimigo."
 hasan_sabbah.1030.t:0 "Morte de um Califa"
 hasan_sabbah.1031.a:0 "[seljuk_equivalent.GetSheHe|U] deve perecer!"
 hasan_sabbah.1031.b:0 "Sinto que o verdadeiro inimigo está em outro lugar..."
 hasan_sabbah.1031.desc:0 "Ao completar meu sermão, olho para a multidão de rostos iluminados que me encaram. Minha mente se volta para seu mestre, [seljuk_equivalent.GetFirstName], aquele que os afastou de [ROOT.Char.GetFaith.HighGodName] para começar. Enquanto [seljuk_equivalent.GetSheHe] desfruta de uma vida decadente, [seljuk_equivalent.GetHerHis] súditos clamam na lama, obscurecidos da verdade do todo-poderoso.\n\nSinto que não posso suportar isso por mais tempo e desejo apenas ver [seljuk_equivalent.GetHerHis] povo livre de [seljuk_equivalent.GetHerHim], unido na filosofia [ROOT.Char.GetFaith.GetAdjective]!"
 hasan_sabbah.1031.t:0 "O Inimigo do [ROOT.Char.GetFaith.GetNameNoTooltip|U]"
 hasan_sabbah.1040.a.lose:0 "$hasan_sabbah.1010.a.lose$"
 hasan_sabbah.1040.a.win:0 "$hasan_sabbah.1010.a.win$"
 hasan_sabbah.1040.a:0 "[ultimate_foe.GetFirstNameNoTooltip|U] é [ROOT.Char.GetFaith.DevilName|U] encarnado!"
 hasan_sabbah.1040.desc:0 "Os olhos desinteressados e sem vida da multidão encaram vagamente na minha direção enquanto seguro meu [ROOT.Char.GetFaith.ReligiousText|U] e me preparo para falar."
 hasan_sabbah.1040.t:0 "Um Sermão Empolgante"
 hasan_sabbah.1050.a:0 "Assim começa a era de [hasan_home.GetNameNoTierNoTooltip|U]."
 hasan_sabbah.1050.b:0 "Continuamos nossa batalha eterna."
 hasan_sabbah.1050.desc:0 "Finalmente, o império [defender.Custom2('InsultAdjective', ROOT.Char)] [defender.GetName] foi enviado de volta a [ROOT.Char.GetFaith.NegativeAfterLife] onde pertence. Nas cinzas do império, meus seguidores olham para mim em busca de nosso futuro, e o futuro do [ROOT.Char.GetFaith.GetName].\n\nNa confusão da ausência de [defender.GetFirstNameNoTooltip], [hasan_home.GetName] está maduro para a conquista e pode servir como um centro para quaisquer empreendimentos futuros que possamos ter na região."
 hasan_sabbah.1050.t:0 "O Velho da Montanha"
 hasan_stroy_cycle_ultimate_foe:0 "Tem que progredir no caminho dos Assassinos pelo menos #V 15#! vezes ou [caliph.GetName] está morto, e você escolheu um inimigo supremo do [hasan.GetFaith.GetName] #weak (progresso atual: [radical_points])#!"
 is_held_by_hof_tt:0 "Não deve ser mantido por seu [head_of_faith|E]"
 is_mountainous_desc:0 "O [terrain|E] local é [GetTerrain( 'mountains' ).GetName] ou [GetTerrain( 'desert_mountains' ).GetName]"
 look_for_another_enemy_tt:0 "Você pode procurar outro inimigo em outro lugar"
 nemesis_eternal_enemy:0 "[CHARACTER.GetShortUIName|U] declarou que [TARGET_CHARACTER.GetShortUIName] [CharAreIs(TARGET_CHARACTER)] o agente supremo do mal na Terra"
 nemesis_eternal_enemy_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] declarou que [CHARACTER.GetShortUIName] [CharAreIs(CHARACTER)] o agente supremo do mal na Terra"
 or_a_neigbouring_county_tt:0 "Um [county|E] vizinho no mesmo [realm|E] atende aos requisitos acima"
 story_hasan:0 "A Lenda de Hasan Sabbah"
 story_hasan_desc:0 "Mais do que exércitos, a força da fé pode derrubar impérios e tecer novas histórias! Você estabelecerá os Assassinos e libertará seu povo do jugo Seljúcida? Você pode ascender e se tornar o Velho da Montanha?"
 unlock_evangelize_decision_tt:0 "Você ganha acesso à decisão [GetDecisionWithKey('hasan_evangelize_the_faith').GetName]"
 unlock_final_hasan_decisions_1_tt:0 "Ganhe acesso à [decision|E] [GetDecisionWithKey('hasan_agitate_the_populace').GetName]"
 unlock_final_hasan_decisions_2_tt:0 "Ganhe acesso à [decision|E] [GetDecisionWithKey('hasan_found_the_assassins').GetName]"
 unlock_final_hasan_decisions_3_tt:0 "Ganhe acesso à [decision|E] [GetDecisionWithKey('hasan_ignite_the_flames').GetName]"
