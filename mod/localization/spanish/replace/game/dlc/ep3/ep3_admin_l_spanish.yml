 ep3_admin_events.0001.a:0 "Como isso afeta #EMP eu#!?"
 ep3_admin_events.0001.b:0 "Preciso preparar tantos documentos."
 ep3_admin_events.0001.c:0 "Nada mudará."
 ep3_admin_events.0001.clan:0 "\"Um reino é governado por famílias. Somos apenas tão fortes quanto nosso elo mais fraco. A terra é apenas um reflexo de nossas casas: uma casa unida nos levará à glória.\""
 ep3_admin_events.0001.fallback:0 "\"Os antigos modos de nossa administração se foram.\""
 ep3_admin_events.0001.feudal:0 "\"É a lealdade entre os homens que mantém os impérios fortes, não alguns documentos dispersos. O [liege.GetTitleAsNameNoTooltip|U] implora pela sua amizade e lealdade, e em troca [liege.GetSheHe] cuidará da sua segurança como seu vassalo.\""
 ep3_admin_events.0001.intro:0 "A palavra de [liege.GetTitledFirstName] chegou através de um dos seus escribas — é hora de uma mudança.\n\n[Select_CString( scribe.IsFemale, 'A', 'O' )] [scribe.GetWomanMan] [scribe.Custom('quirk_pos_present')] antes de ler o edito:\n\n"
 ep3_admin_events.0001.t:0 "Uma Mudança de Direção"
 ep3_admin_events.0001.tribal:0 "\"Devemos abraçar os modos tribais. O prestígio é a ferramenta mais importante que um governante possui. Saqueando, lutando, dueling. O [liege.GetTitleAsNameNoTooltip|U] exorta todos os seus súditos a se esforçarem para se tornarem homens e mulheres de honra admirável.\""
 ep3_admin_events.0002.a:0 "Não há tempo a perder."
 ep3_admin_events.0002.alive:0 "Com a reatribuição de [previous_governor.GetTitledFirstName], foi anunciado que a governança do [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] agora cai sobre mim."
 ep3_admin_events.0002.appointment:0 "[ROOT.Char.GetLiege.GetTitledFirstNameNoTooltip] ordenou pessoalmente minha nomeação imediata por um decreto imperial. Ninguém pode desafiar a legitimidade do meu novo status no [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_admin_events.0002.appointment_succession:0 "Longas noites de lobby e busca por favores finalmente valeram a pena. Disseram-me que minha seleção como o novo [ROOT.Char.GetTitleAsNameNoTooltip] foi quase uma conclusão inevitável."
 ep3_admin_events.0002.conquest:0 "As forças de [previous_governor.GetTitledFirstNameNoTooltip] não foram páreo para minhas armas superiores, provando minha maior legitimidade como defensor da província em nome do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_admin_events.0002.dead:0 "Com a passagem de [previous_governor.GetTitledFirstName], que [previous_governor.GetDeathReasonHideKiller], foi anunciado que a governança do [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] agora cai sobre mim."
 ep3_admin_events.0002.desc:0 "\n\nApós receber minhas insígnias e fazer os juramentos de ofício, posso finalmente me mudar para minha sede provincial em [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] e começar meu mandato adequadamente."
 ep3_admin_events.0002.house:0 "Agora cabe a mim garantir a contínua governança da Casa [ROOT.Char.GetHouse.GetBaseName] nesta província."
 ep3_admin_events.0002.house_alive:0 "Com a reatribuição de [Select_CString( previous_governor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('previous_governor'))], [previous_governor.GetTitledFirstName], foi anunciado que a governança do [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] agora cai sobre mim."
 ep3_admin_events.0002.house_dead:0 "Com a passagem de [Select_CString( previous_governor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('previous_governor'))], [previous_governor.GetTitledFirstName], que [previous_governor.GetDeathReasonHideKiller], foi anunciado que a governança do [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] agora cai sobre mim."
 ep3_admin_events.0002.inspection:0 "Preciso inspecionar as terras imediatamente."
 ep3_admin_events.0002.liege:0 "O [ROOT.Char.GetLiege.GetTitleAsName], em sua infinita sabedoria, decidiu que a governança do [governor_title.GetAdjective] [governor_title.GetTierAsNameNoTooltip] deve cair sobre mim."
 ep3_admin_events.0002.new:0 "[ROOT.Char.GetLiege.GetTitledFirstName] anunciou que [ROOT.Char.GetLiege.GetSheHe] confiou a governança do [governor_title.GetTierAsNameNoTooltip] [governor_title.GetAdjective] a mim."
 ep3_admin_events.0002.prosperity:0 "Devo desenvolver essas novas terras."
 ep3_admin_events.0002.t:0 "O [ROOT.Char.GetTitleAsNameNoTooltip] de [governor_title.GetNameNoTierNoTooltip]"
 ep3_admin_events.0002.tt:0 "Você agora é o [governor|E] do [governor_title.GetName]"
 ep3_admin_events.0002.tt_inspection:0 "Sua próxima [activity|E] [GetActivityType('activity_survey').GetName] será gratuita"
 ep3_admin_events.0004.a:0 "Vamos, [reacting_spouse.GetFirstName]. Fica tudo bem."
 ep3_admin_events.0004.b:0 "Sim, vamos."
 ep3_admin_events.0004.c:0 "Não há sentido em olhar para trás..."
 ep3_admin_events.0004.desc:0 "Em uma reviravolta cruel e distorcida dos eventos, me vejo sem emprego e sem lar. #EMP Tudo#! pelo que trabalhei desapareceu em um instante.\n\nEu pego o que consigo carregar e olho para minha propriedade uma última vez."
 ep3_admin_events.0004.desc_spouse_upset:0 "\n\n[Select_CString( reacting_spouse.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('reacting_spouse'))] [reacting_spouse.GetFirstName] lança um olhar preocupado para mim. \"Eu tenho minhas coisas. Não faz sentido prolongar isso, suponho...\""
 ep3_admin_events.0004.desc_spouse_very_upset:0 "\n\n\"Como... Como isso pôde acontecer?!\" [reacting_spouse.GetShortUIName] chora alto atrás de mim. \"Perdemos tudo... O que eu devo fazer...\""
 ep3_admin_events.0004.t:0 "Administrativo Nunca Mais"
 ep3_admin_events.0005.a:0 "Vamos deixar o passado para trás e olhar para o futuro!"
 ep3_admin_events.0005.desc_lost_admin:0 "Como as circunstâncias se apresentaram, nosso grande reino foi perdido. E com ele, a burocracia que governava nosso modo de vida foi reduzida a cinzas. Não tenho outra escolha a não ser adaptar meu governo a essa nova realidade."
 ep3_admin_events.0005.desc_still_admin:0 "Nosso outrora grande reino não existe mais, pois me encontro fora da influência de [gov_liege.GetFirstName]. O que me deixa responsável por [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Além da minha independência e liberdade, poucas coisas mudarão. A burocracia está enraizada em nosso modo de vida e permanecerá assim."
 ep3_admin_events.0005.intro:0 "[Select_CString( messenger.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('messenger'))], [messenger.GetShortUIName], traz notícias sombrias da capital.\n\n"
 ep3_admin_events.0005.t:0 "Um Reino Só Meu"
