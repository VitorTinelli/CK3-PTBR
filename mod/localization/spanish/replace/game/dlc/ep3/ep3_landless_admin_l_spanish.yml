l_spanish:
 MODIFIER_DEFINITION_VALUE_PER_ESTATE_BUILDING:0 " \t#weak Aumento por nível da [building|E] $estate_main_01_domicile_building$#!"
 SCHEME_SECRET_DOMICILE_TUNNEL:0 "Você pode usar seus túneis secretos: $VALUE|+0=$"
 ep3_extra_security_modifier:0 "Paredes Aumentadas!"
 ep3_extra_security_modifier_desc:0 "Este personagem reforçou a segurança de sua propriedade em sua preocupação com espiões."
 ep3_good_estate_modifier:0 "Em Boa Propriedade"
 ep3_good_estate_modifier_desc:0 "Os locais estão impressionados com a manutenção deste $estate_main_01_domicile_building$."
 ep3_landless_admin.1000.a:0 "\"Um[Select_CString( proposed_councillor.IsFemale, 'a', '' )] [proposed_councillor.GetWomanMan] habilidos[Select_CString( proposed_councillor.IsFemale, 'a', 'o' )] é sempre necessári[Select_CString( proposed_councillor.IsFemale, 'a', 'o' )].\""
 ep3_landless_admin.1000.b.failure:0 "[proposed_councillor.GetShortUIName] se sente insultado"
 ep3_landless_admin.1000.b.mid:0 "[proposed_councillor.GetShortUIName] parece convencido"
 ep3_landless_admin.1000.b.success:0 "[proposed_councillor.GetShortUIName] está muito impressionado"
 ep3_landless_admin.1000.b:0 "\"Certamente, seria #EMP uma honra para você#! me servir.\""
 ep3_landless_admin.1000.c:0 "\"Não preciso de companhia estranha.\""
 ep3_landless_admin.1000.desc:0 "Uma leve batida na porta da propriedade me surpreende durante minha caminhada.\n\n\"Entre.\"\n\nUm[Select_CString( proposed_councillor.IsFemale, 'a', '' )] [proposed_councillor.GetWomanMan] bem vestid[Select_CString( proposed_councillor.IsFemale, 'a', 'o' )] está na porta, segurando sua bolsa.\n\n\"Venho oferecer meus serviços à virtuosa casa de [ROOT.Char.GetHouse.GetBaseNameNoTooltip]. Sou bastante habilidoso e servirei você bem.\""
 ep3_landless_admin.1000.t:0 "À Porta"
 ep3_landless_admin.1010.a:0 "\"O que você está fazendo na minha propriedade...? Espiões!\""
 ep3_landless_admin.1010.b:0 "\"Precisamos de algumas contribuições...\""
 ep3_landless_admin.1010.c:0 "\"Certifique-se de que #EMP todos#! saibam.\""
 ep3_landless_admin.1010.d:0 "\"Talvez você quisesse ficar?\""
 ep3_landless_admin.1010.desc:0 "\"Que visão! Dizem que há duzentos quartos dentro e todas as suas portas são feitas de ouro maciço! E no porão — ah! Saudações, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\nUm[Select_CString( local.IsFemale, 'a', '' )] [local.GetWomanMan] tão simples quanto poderia ser para no meio do meu jardim. Uma criança pequena está se escondendo atrás das roupas [local.GetHerHim].\n\n\"Estávamos apenas fazendo uma visita à propriedade, pois os locais estão maravilhados com sua magnificência!\""
 ep3_landless_admin.1010.t:0 "Em Boa Propriedade"
 ep3_landless_admin.1020.a:0 "\"Um mercado é o coração de cada cidade.\""
 ep3_landless_admin.1020.b:0 "\"Consigo me imaginar descansando nesses jardins...\""
 ep3_landless_admin.1020.c:0 "\"Segurança é a medida mais importante.\""
 ep3_landless_admin.1020.d:0 "\"Artífices! Como eu os amo!\""
 ep3_landless_admin.1020.desc.barracks:0 "os quartéis"
 ep3_landless_admin.1020.desc.garden:0 "o jardim"
 ep3_landless_admin.1020.desc.guardhouse:0 "a casa de guarda"
 ep3_landless_admin.1020.desc.intro:0 "O som de uma bolsa de moedas é difícil de confundir. [steward.GetTitledFirstName] abre a porta, [steward.Custom('quirk_pos_pp')].\n\n\"Meu lorde! Que propriedade resplandecente esta é! Os servos têm maravilhado-se com"
 ep3_landless_admin.1020.desc.market:0 "o mercado"
 ep3_landless_admin.1020.desc.olive:0 "o pomar de oliveiras"
 ep3_landless_admin.1020.desc.outro:0 "desde a manhã,\" [steward.GetFirstNameNoTooltip] faz um gesto vago em sua direção.\n\n\"Seria um grande prazer para mim ajudá-lo a garantir que obtenhamos o máximo benefício disso.\""
 ep3_landless_admin.1020.desc.tea:0 "plantação de chá"
 ep3_landless_admin.1020.desc.vineyard:0 "o vinhedo"
 ep3_landless_admin.1020.desc.workshop:0 "a oficina"
 ep3_landless_admin.1020.e:0 "\"Meus homens receberão o melhor treinamento.\""
 ep3_landless_admin.1020.f:0 "\"Mal posso esperar para degustar esse vinho!\""
 ep3_landless_admin.1020.g:0 "\"Óleo é o ingrediente mais básico.\""
 ep3_landless_admin.1020.h.flavor:0 "Aquele ouro estaria muito mais seguro comigo..."
 ep3_landless_admin.1020.h:0 "\"Precisamos de #EMP cada#! moeda para manter assim.\""
 ep3_landless_admin.1020.j:0 "“Bom chá é o verdadeiro sinal de refinamento.”"
 ep3_landless_admin.1020.t:0 "Por um Pouco de Ouro..."
 ep3_landless_admin.1030.a:0 "\"O que te impede de divulgar #EMP meus#! segredos!?\""
 ep3_landless_admin.1030.b:0 "\"Um[Select_CString( courtier.IsFemale, 'a', '' )] [courtier.GetWomanMan] sem honra não merece recompensa.\""
 ep3_landless_admin.1030.c:0 "\"Que oferta interessante...\""
 ep3_landless_admin.1030.d.failure:0 "[courtier.GetShortUIName] está desapontado"
 ep3_landless_admin.1030.d.success:0 "Você convence [courtier.GetShortUIName]"
 ep3_landless_admin.1030.d:0 "\"Minha gratidão deveria ser pagamento suficiente.\""
 ep3_landless_admin.1030.desc:0 "Um convidado chegou diretamente da corte [Select_CString( liege.IsFemale, 'da', 'do' )] [liege.GetTitledFirstName], nada menos! Um[Select_CString( courtier.IsFemale, 'a', '' )] [courtier.GetWomanMan] está na minha frente, [courtier.Custom('quirk_pos_pp')].\n\n\"Uma palavra, [ROOT.Char.Custom('FormOfAddressForLiege')]. Dizem que você tem interesse em nosso comum suserano... Conheço [liege.GetSheHe]. Todos na corte conhecem [liege.GetSheHe]. Um segredo é tão forte quanto seu elo mais fraco,\" [courtier.GetSheHe] sorri.\n\n\"Um segredo por um segredo, eu proponho.\""
 ep3_landless_admin.1030.e:0 "\"Não me envolva nisso.\""
 ep3_landless_admin.1030.t:0 "Um Segredo por um Segredo"
 ep3_landless_admin.1040.a:0 "\"Rumores! Se não é a coisa que eu faço melhor!\""
 ep3_landless_admin.1040.b:0 "\"Bem, isso é lamentável. Estarei em meus aposentos.\""
 ep3_landless_admin.1040.c:0 "\"Vale a pena tentar.\""
 ep3_landless_admin.1040.d.failure:0 "Sua influência diminui"
 ep3_landless_admin.1040.d.success:0 "Você prejudica a candidatura de [rival.GetShortUIName]"
 ep3_landless_admin.1040.d:0 "\"Mas você não ouviu... que [rival.GetSheHe] é #EMP inadequado#!?\""
 ep3_landless_admin.1040.desc.child:0 "Meu próprio filho... posso me atrever a fazer isso?"
 ep3_landless_admin.1040.desc.family:0 "Sangue do meu sangue... não deveria eu te proteger?"
 ep3_landless_admin.1040.desc.intro:0 "O ar está denso com o perfume das flores, e caminho ao lado [Select_CString( spymaster.IsFemale, 'da', 'do' )] [spymaster.GetTitledFirstName] ao longo de um pequeno riacho, brilhante e claro.\n\n\"Você já considerou, [ROOT.Char.Custom('FormOfAddressForLiege')]? Que [Select_CString( rival.IsFemale, 'a', 'o' )] [rival.GetTitledFirstName] está perigosamente próximo do [my_title.GetName]. Alguns dizem que [rival.GetSheHe] já está planejando os edictos [rival.GetHerHim]...\"\n\n\"Mas não precisa ser assim. Rumores são baratos.\"\n\n"
 ep3_landless_admin.1040.desc.spouse:0 "Meu próprio cônjuge... prometi estar sempre ao seu lado."
 ep3_landless_admin.1040.e:0 "\"Deixe os dados caírem onde puderem.\""
 ep3_landless_admin.1040.t:0 "Próximo na Linha"
 ep3_landless_admin.1040.tt:0 "A pontuação de candidato de [rival.GetShortUIName] para [my_title.GetName] diminui em #negative_value [EmptyScope.ScriptValue('appointment_score_medium_value')|0]#!"
 ep3_landless_admin.1050.a:0 "Quem... quem construiu isso!?"
 ep3_landless_admin.1050.b:0 "Seria uma pena se alguém se perdesse lá dentro..."
 ep3_landless_admin.1050.c.failure:0 "Seus esforços não dão frutos"
 ep3_landless_admin.1050.c.success:0 "Você reforça sua prisão"
 ep3_landless_admin.1050.c:0 "Não podemos arriscar que nossos prisioneiros escapem."
 ep3_landless_admin.1050.d.success:0 "Você encontra algo"
 ep3_landless_admin.1050.d:0 "Deve haver um tesouro lá embaixo!"
 ep3_landless_admin.1050.desc.intro:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [servant.GetTitledFirstName] me chama, com suor escorrendo pela testa [servant.GetHerHim] enquanto caminhamos. \"Os trabalhadores encontraram alguns túneis sob"
 ep3_landless_admin.1050.desc.outro:0 "Espalhando-se em todas as direções.\n\nO que vejo é impressionante. Isso não é algo que qualquer um de nossos pedreiros poderia ter construído.\n\nHá uma presença muito antiga nessas paredes... pedra tão velha que se desmorona."
 ep3_landless_admin.1050.desc.prison:0 "a cela da prisão."
 ep3_landless_admin.1050.desc.servants:0 "os aposentos dos servos."
 ep3_landless_admin.1050.desc.wine:0 "a adega."
 ep3_landless_admin.1050.e.success:0 "Você limpa os destroços dos túneis"
 ep3_landless_admin.1050.e:0 "Podemos usar isso para #EMP nossos#! agentes..."
 ep3_landless_admin.1050.f:0 "Deixe como está."
 ep3_landless_admin.1050.t:0 "Logo Abaixo de Nós"
 ep3_no_secrets_modifier:0 "Sem Segredos"
 ep3_no_secrets_modifier_desc:0 "Este personagem é muito cauteloso com seus segredos."
 ep3_secret_tunnels_abduct:0 "Seus [schemes|E] de [GetScheme('abduct').GetTypeName] terá uma [success_chance|E] maior"
 ep3_tunnel_investigation_modifier:0 "Investigação de Túneis"
 ep3_tunnel_investigation_modifier_desc:0 "Este personagem descobriu alguns túneis sob sua propriedade e decidiu investigá-los."
 ep3_tunnel_prison_modifier:0 "Ninguém Sai"
 ep3_tunnel_prison_modifier_desc:0 "Este personagem reforçou sua prisão."
 ep3_tunnel_servants_modifier:0 "Atalho Rápido"
 ep3_tunnel_servants_modifier_desc:0 "Este personagem usa os túneis sob sua propriedade como um atalho."
 ep3_well_rested_modifier:0 "Bem Descansado"
 ep3_well_rested_modifier_desc:0 "Este personagem decidiu priorizar seu descanso em relação à política."
