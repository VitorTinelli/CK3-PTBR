l_spanish:
 CID_LIEGE:0 "Seu Suserano Informal"
 CID_LOYALTY_MAX_LABEL:0 "#difficulty_easy Leal#!"
 CID_LOYALTY_MIN_LABEL:0 "#difficulty_hard Desleal#!"
 EL_CID_CUSTOM_STRING_KEY:0 "Ao longo de suas jornadas, você poderá provar sua [Concept( 'cid_loyalty', 'Lealdade' )|E] a [Story.MakeScope.Var('cid_liege').Char.GetShortUIName], que pode eventualmente lhe oferecer terras como [vassal|E].\n\nVocê também pode forjar seu próprio caminho ao se envolver em [wars|E] na [GetGeographicalRegion('world_europe_west_iberia').GetName]. Isso pode recompensá-lo com suas espadas históricas e pode lhe dar uma oportunidade alternativa de obter terras."
 EL_LOYALTY_COUNTER_TOOLTIP:0 "Valor atual de [Concept( 'cid_loyalty', 'Lealdade' )|E]: [Story.MakeScope.Var('cid_loyalty_counter').GetValue|V0]"
 cid.0001.a.flavor:0 "#EMP E assim o Campeador exilado da terra foi.#!"
 cid.0001.a:0 "Eu sempre serei leal a você, meu [liege.GetTitleAsNameNoTooltip]."
 cid.0001.b.flavor:0 "#EMP Então soube meu Cid que não havia mais esperança da graça de [liege.GetTitleAsNameNoTooltip] [liege.GetFirstNameNoTooltip].#!"
 cid.0001.b:0 "Que assim seja. Aqueles que me amam me seguirão."
 cid.0001.desc.alfonso:0 "Eu havia seguido tão lealmente seu irmão, teria seguido ele também."
 cid.0001.desc.children:0 "comigo. Crianças... sejam boas.\""
 cid.0001.desc.courtier:0 "Inimigos na corte envenenaram a mente [liege.GetHerHim]. Inimigos que sempre buscaram me fazer mal, pois o [liege.GetTitleAsNameNoTooltip|l] me amava demais."
 cid.0001.desc.garcia_ordonez:0 "Eu já o havia derrotado uma vez, em uma batalha que ele não conseguia esquecer."
 cid.0001.desc.intro:0 "Coloco meu pé no estribo, bato na cabeça do meu cavalo e dou uma última olhada no lugar que sempre chamarei de lar.\n\nExílio. As palavras [Select_CString( liege.IsFemale, 'da', 'do' )] [liege.GetTitledFirstName] não deixaram margem para erro.\n\n"
 cid.0001.desc.liege_hate:0 "Caído da graça do [liege.GetTitleAsNameNoTooltip]. Quão bom pode ser um vassalo, se seu senhor feudal não o ama?"
 cid.0001.desc.no_children:0 "comigo.\""
 cid.0001.desc.outro:0 "\n\nUm corvo voa à nossa direita — um mau presságio."
 cid.0001.t:0 "Por Ordem do [liege.GetTitleAsNameNoTooltip]"
 cid.1000.a.flavor:0 "#EMP Nossos bens, nossos lares, nossos próprios olhos, tudo isso está em jogo.#!"
 cid.1000.a:0 "Não pressionaremos essas pobres pessoas."
 cid.1000.b.flavor:0 "#EMP E pequeno será o ganho para ti, mesmo que encontremos ruína por tua causa.#!"
 cid.1000.b:0 "\"Abra a porta ou teremos que arrombá-la!\""
 cid.1000.desc:0 "Escura é a noite, e fria. Envio um dos meus homens para bater na porta mais próxima, buscando um anfitrião gentil.\n\nA resposta não vem imediatamente. Ouço murmúrios e passos até que uma figura finalmente aparece na entrada.\n\n\"É a ordem do [liege.GetTitleAsNameNoTooltip]; não ousamos acolher-te, ó meu senhor! Selada com o selo real [liege.GetHerHim], chegou a carta [liege.GetHerHim] proibindo o povo de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] de abrir as portas ou abrigar-te.\"\n\n[liege.GetTitledFirstName] não perde tempo."
 cid.1000.t:0 "$cid_exile_title$ Portas Fechadas"
 cid.1010.a:0 "\"[cook.GetFirstNameNoTooltip], cozinhe #EMP qualquer coisa#! que puder encontrar.\""
 cid.1010.b.flavor:0 "#EMP Se eu viver, te pagarei o dobro.#!"
 cid.1010.b:0 "\"Obrigado, meu querido amigo.\""
 cid.1010.c:0 "\"Não posso arriscar a ira do [liege.GetTitleAsNameNoTooltip].\""
 cid.1010.desc:0 "Exilados dificilmente são mestres confiáveis. Não há garantia de que poderei pagar meus seguidores, ou mesmo alimentá-los. Quem arriscaria a segurança de suas famílias por um homem desonrado?\n\nAs conversas no acampamento são tão abertas quanto possível.\n\nOlho para cima e vejo [Select_CString( friend.IsFemale, 'a', 'o' )] [friend.GetTitledFirstName] caminhando em minha direção, com pão e vinho [friend.GetHerHim] próprio:\n\n\"Campeador, nascido em boa hora, devemos partir, pois pagarei por esses homens, e ganharei a ira [Select_CString( liege.IsFemale, 'da', 'do' )] [liege.GetTitledFirstName], porque servi a você.\""
 cid.1010.t:0 "$cid_exile_title$ Sem Ouro ou Prata"
 cid.1020.a:0 "\"[my_priest.GetFirstNameNoTooltip], talvez você possa interceder por nós?\""
 cid.1020.b.flavor:0 "#EMP Como quando a unha é arrancada da carne.#!"
 cid.1020.b:0 "\"Que a espera seja curta.\""
 cid.1020.c.flavor:0 ""
 cid.1020.c:0 "\"Não posso te deixar.\""
 cid.1020.desc.intro:0 "[spouse.GetFirstName] lança [spouse.GetHerselfHimself] nos degraus diante do altar, rezando fervorosamente a [spouse.GetFaith.HighGodName] para me proteger do mal.\n\nAperto [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetHerHim] no meu coração, e [spouse.GetSheHe] beija minha mão, como alguém tomado pela tristeza está [spouse.GetSheHe].\n\n\"Somente [ROOT.Char.GetFaith.HighGodName] sabe se nos encontraremos novamente\", eu digo, \"você estará mais seguro aqui. Não posso te sujeitar ao que está por vir"
 cid.1020.t:0 "$cid_exile_title$ Adeus, Meu Querido"
 cid.1030.a:0 "[artifact.GetName] será um ótimo presente."
 cid.1030.b:0 "Ouro nunca é demais."
 cid.1030.c:0 "Bah! Eu #EMP ganhei#! isso!"
 cid.1030.desc:0 "Ouro. Prata. Joias. Meu cofre finalmente está crescendo.\n\nAnéis de ouro, colares e estandartes. [liege.GetTitledFirstName] não seria estranho a essa exibição.\n\nMas isso não é completamente meu. [liege.GetSheHe|U] ainda é meu senhor feudal, e, como tal, parte da minha fortuna também deveria ser [liege.GetHerHim]."
 cid.1030.t:0 "$cid_exile_title$ Pelo Amor do [liege.GetTitleAsNameNoTooltip]"
 cid.1040.a:0 "Nosso acampamento será um exemplo de devoção."
 cid.1040.b:0 "Por favor, [ROOT.Char.GetFaith.HighGodName], guie [liege.GetSheHe] de volta à luz."
 cid.1040.c:0 "Para o [ROOT.Char.GetFaith.NegativeAfterLife] com [liege.GetSheHE]."
 cid.1040.desc:0 "Alguns corações são endurecidos e demoram a lembrar como a suavidade se sente.\n\nNão importa o que eu faça, o coração [Select_CString( liege.IsFemale, 'da', 'do' )] [liege.GetTitledFirstName] está longe do meu alcance.\n\n\"[ROOT.Char.GetFaith.HighGodName],\" eu começo, ajoelhando-me em frente ao altar. Meus homens todos me cercam, curiosos. \"Que sua bondade mude o coração [Select_CString( liege.IsFemale, 'da', 'do' )] [liege.GetTitledFirstNameNoTooltip] e faça [liege.GetSheHe] lembrar do amor [liege.GetHerHim] por mim.\""
 cid.1040.t:0 "$cid_exile_title$ [ROOT.Char.GetFaith.HighGodName] Tem Misericórdia"
 cid.2000.a.flavor:0 "#EMP Esta foi a batalha, este foi o dia, quando ele ganhou a grande espada.#!"
 cid.2000.a:0 "Esta espada! Que beleza!"
 cid.2000.b.flavor:0 "#EMP Desejo enviá-lo [Select_CString( liege.IsFemale, 'a', 'ao' )] [liege.GetTitledFirstNameNoTooltip], meu senhor natural, com cem cavalos deste espólio, para que beije a mão [liege.GetHerHim] por mim."
 cid.2000.b:0 "Envie um emissário para [liege.GetShortUIName]. Este prêmio é [liege.GetSheHe]."
 cid.2000.desc.fallback:0 "o inimigo, vestindo seus brasões na couraça. \"Vamos,\" eu impulso meu corcel e começo a investir contra ele. Apenas um duelo pode acabar com tudo.\n\nAté o cinto, através do elmo e da cota de malha, corto o inimigo ao meio."
 cid.2000.desc.intro:0 "A batalha estoura ao meu redor. A sombra dos pássaros sobre os exércitos fica cada vez mais densa.\n\nNão é difícil localizar"
 cid.2000.desc.loser:0 "[loser.GetTitledFirstName], vestindo seus brasões na couraça. \"Vamos,\" eu impulso meu corcel e começo a investir contra [loser.GetSheHe]. Apenas um duelo pode acabar com tudo.\n\nAté o cinto, através do elmo e da cota de malha, corto o inimigo ao meio."
 cid.2000.desc.outro:0 "Do cotovelo para baixo, pingando de sangue."
 cid.2000.t:0 "$cid_restoration_title$ Do Cotovelo para Baixo"
 cid.2001.a.flavor:0 "#EMP Bem sabe que os ganhei de forma cavalheiresca.#!"
 cid.2001.a.tt:0 "Você se torna o dono de [newly_created_artifact.GetName]"
 cid.2001.a:0 "Muitas mais batalhas à nossa frente!"
 cid.2001.b:0 "Um presente digno de um [liege.GetTitleAsNameNoTooltip]."
 cid.2001.desc.fallback:0 "O inimigo marcha em minha direção. \"[ROOT.Char.GetFirstNameNoTooltip],\" ele me cumprimenta e eu inclino a cabeça em resposta. \"Não há tempo para cortesias.\"\n\nVez após vez, nossas espadas se encontram no ar até que eu corto a mão dele."
 cid.2001.desc.intro:0 "Espada em punho, centímetro por centímetro, a pé, disputo o terreno. A chuva fica mais forte. Está muito frio.\n\n"
 cid.2001.desc.loser:0 "[loser.GetTitledFirstName] marcha em minha direção. \"[ROOT.Char.GetFirstNameNoTooltip],\" [loser.GetSheHe] me cumprimenta e eu inclino a cabeça em resposta. \"Não há tempo para cortesias.\"\n\nVez após vez, nossas espadas se encontram no ar até que eu corto a mão [loser.GetHerHim]."
 cid.2001.desc.outro.tizona:0 "\n\nUm companheiro digno para minha Tizona."
 cid.2001.desc.outro:0 "Um grito estridente. A espada cai no chão, dançando em um brilho pálido."
 cid.2001.t:0 "$cid_restoration_title$ De Um Mestre Corajoso"
 cid.2010.a.flavor:0 "#EMP Em seus braços deixo [Select_CString( child.IsFemale, 'minha', 'meu' )] [child.Custom('GetDaughterSon')], brilhante como o sol.#!"
 cid.2010.a:0 "\"Com grande alegria aceito esta honra!\""
 cid.2010.b:0 "\"Posso encontrar um cônjuge para [child.GetSheHe] sozinho, obrigado.\""
 cid.2010.desc:0 "O arauto [Select_CString( liege.IsFemale, 'da', 'do' )] [liege.GetTitledFirstName] faz seu caminho até minha tenda com a primeira luz da manhã.\n\n\"Ouçam, todos os presentes, condes e senhores!\", [herald.GetSheHe] anuncia. \"[Select_CString( liege.IsFemale, 'Minha', 'Meu' )] [liege.GetLadyLord] [liege.GetTitledFirstNameNoTooltip] faz um pedido [Select_CString( ROOT.Char.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTitledFirstNameNoTooltip]. [liege.GetFaith.HighGodName] permita que seja para sua vantagem, [liege.GetSheHe] pede [Select_CString( child.IsFemale, 'sua', 'seu' )] [child.Custom('GetDaughterSon')] [child.GetFirstNameNoTooltip] para [child.GetWifeHusband] [Select_CString( proposed_spouse.IsFemale, 'da', 'do' )] [proposed_spouse.GetTitledFirstName].\"\n\nUma lágrima escorre pela minha bochecha. Este é o primeiro passo para a reconciliação?"
 cid.2010.t:0 "$cid_restoration_title$ Uma Oferta Favorável"
 cid.2020.a.flavor:0 "#EMP E alegre estava meu Cid e todos os seus homens quando seu estandarte repousou no cume da fortaleza.#!"
 cid.2020.a:0 "Tudo valeu a pena."
 cid.2020.b.flavor:0 "#EMP Ele de Vivar voltou-se para seus homens e os orientou a reunir os despojos que haviam conquistado.#!"
 cid.2020.b:0 "Não posso deixar meu acampamento para trás."
 cid.2020.c:0 "É hora de seguir caminhos separados."
 cid.2020.desc:0 "É com grande surpresa que recebo um novo convidado em minha tenda: [liege.GetTitledFirstName] está cercado por seus guardas reais, um sorriso no rosto [liege.GetHerHim].\n\n\"Amigo!\" [liege.GetSheHe] exclama, \"Você que sempre me foi leal, mesmo quando tão lamentavelmente te rejeitei. Aqui eu te perdoo e concedo meu amor ao longo de meu [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] a partir deste dia.\" \n\n\"[Select_CString( liege.IsFemale, 'Minha', 'Meu' )] [liege.GetLadyLord]! Fui banido e despojado de honra, e com grande esforço conquistei o que possuo. Graças a [ROOT.Char.GetFaith.HighGodName] por sua graça!\""
 cid.2020.t:0 "$cid_restoration_title$ Um Homem Honrado"
 cid.4000.a:0 "Vamos."
 cid.4000.desc:0 "Sua falta de comprometimento me deixa perplexo. Se permanecer leal a mim era sua intenção, você falhou; se pretendia mostrar seu descontentamento — você falhou igualmente.\n\nVamos esquecer esses infortúnios."
 cid.4000.opening:0 "Para o inconstante [ROOT.Char.GetFirstNameNoTooltip],"
 cid.4010.a.flavor:0 "#EMP Nove meses completos ele ficou diante dela, e quando chegou o décimo, tiveram que se render.#!"
 cid.4010.a:0 "\"Conquistei minhas próprias terras.\""
 cid.4010.b.flavor:0 "#EMP E aqui está a história do meu Cid Campeador.#!"
 cid.4010.b:0 "\"A estrada me chama.\""
 cid.4010.c.flavor:0 "#EMP Pelo amor [Select_CString( liege.IsFemale, 'da', 'do' )] [liege.GetTitledFirstNameNoTooltip] que me baniu.#!"
 cid.4010.c:0 "\"Ainda respeitarei o governo legítimo [liege.GetHerHim].\""
 cid.4010.desc:0 "Uma batida forte na porta anuncia [Select_CString( herald.IsFemale, 'a', 'o' )] [herald.GetTitledFirstName].\n\n\"Pelo amor de [herald.GetFaith.HighGodName], [ROOT.Char.GetFirstNameNoTooltip], precisava tornar tudo isso tão difícil?\"\n\n\"Não fui eu quem começou\", respondo, com a maior seriedade que consigo. \"Se o [liege.GetTitleAsNameNoTooltip|l] queria que eu permanecesse leal, [liege.GetSheHe] não deveria ter me exilado.\"\n\n\"Não devo mais lealdade a [liege.GetSheHe], pois [liege.GetSheHe] não é mais meu legítimo suserano. Você pode dizer isso a [liege.GetSheHe].\""
 cid.4010.t:0 "$cid_restoration_title$ Mio Cid"
 cid.5000.a:0 "Acho que isso resolve tudo."
 cid.5000.desc:0 "Uma palavra para você, [Select_CString( ROOT.Char.IsFemale, 'minha boa', 'meu bom' )] [ROOT.Char.GetLadyLord]: seu legítimo suserano, [el_cid_story.MakeScope.Var('cid_liege').GetCharacter.GetTitledFirstName], faleceu.\n\nQuaisquer assuntos que você tivesse com [el_cid_story.MakeScope.Var('cid_liege').GetCharacter.GetSheHe] não têm importância para mim."
 cid.5000.opening:0 "[sender.Custom2('AppropriateGreeting', ROOT.Char)],"
 cid_1010_no_invite_var_desc:0 "Você baniu [recipient.GetSheHe]: $VALUE|=+0$"
 cid_1040_a_tt:0 "Esta opção está disponível por causa do seu $baggage_train_shrine_domicile_building$"
 cid_2000_liege_tt:0 "Ganha [newly_created_artifact.GetNameNoTooltip] [artifact|E]"
 cid_2020_b_tt:0 "Você continua como um [adventurer|E]"
 cid_exile_title:0 "Exílio:"
 cid_family_good_modifier:0 "Como Unha e Carne"
 cid_family_good_modifier_desc:0 "Este personagem recusou-se a deixar para trás sua família, desobedecendo as ordens de seu senhor feudal."
 cid_loyalty_counter_label:0 "[Concept( 'cid_loyalty', 'Lealdade' )|E]"
 cid_loyalty_counter_negative:0 "Isso irá #negative_value questionar#! a [Concept('cid_loyalty', 'Lealdade')|E] ao [liege.GetTitleAsNameNoTooltip]"
 cid_loyalty_counter_positive:0 "Isso irá #positive_value mostrar#! [Concept('cid_loyalty', 'Lealdade')|E] ao [liege.GetTitleAsNameNoTooltip]"
 cid_loyalty_counter_very_negative:0 "Isso irá #negative_value questionar muita#! a [Concept('cid_loyalty', 'Lealdade')|E] ao [liege.GetTitleAsNameNoTooltip]"
 cid_loyalty_counter_very_positive:0 "Isso irá #positive_value mostrar muita#! [Concept('cid_loyalty', 'Lealdade')|E] ao [liege.GetTitleAsNameNoTooltip]"
 cid_opened_doors_modifier:0 "Portas Abertas"
 cid_opened_doors_modifier_desc:0 "Este personagem forçou a abertura das portas do povoado para garantir abrigo a seus seguidores."
 cid_own_prayer:0 "Misericórdia para Mim"
 cid_own_prayer_desc:0 "Este personagem decidiu focar suas preces em si mesmo."
 cid_refused_betrothal:0 "Recusou o Suserano"
 cid_refused_betrothal_desc:0 "Este personagem recusou a oferta de casamento de seu suserano para seu filho e decidiu encontrar seu próprio."
 cid_restoration_title:0 "Restauração:"
 cid_treason_title:0 "Traição:"
 game_concept_cid_loyalty:0 "Lealdade do Rodrigo"
 game_concept_cid_loyalty_desc:0 "Ao permanecer #V leal#! ao seu senhor feudal mesmo no exílio, El Cid pode recuperar o favor deles e restaurar sua posição vantajosa.\n\nAo se tornar #V desleal#!, El Cid pode ganhar opções especiais para se erguer como um governante independente."
 story_el_cid:0 "[Concept( 'story_content_el_cid', 'A Canção de El Cid' )|E]"
 story_el_cid_desc:0 "Injustamente exilado por seu amigo e suserano, Sancho II de Castela, após uma guerra contra Alfonso VI, você agora parte para iniciar sua lenda. Você forjará seu próprio caminho ou permanecerá leal?"
 story_el_cid_tt:0 "#EMP A Canção de El Cid#! começa"
