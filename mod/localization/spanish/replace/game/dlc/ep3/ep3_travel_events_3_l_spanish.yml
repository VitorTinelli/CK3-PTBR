l_spanish:
 AKRITAI_GLOSS:0 "O termo grego #bold akritai#!, derivado da palavra #EMP akron#! ou \"fronteira\", refere-se aos soldados de fronteira às vezes glorificados como defensores contra a incursão dos #EMP ghazi#! e ocasionalmente condenados como bandidos."
 AL_THUGHUR_GLOSS:0 "#bold Al-thughūr#! é um descritivo árabe usado para as marchas Cilicianas, comparando fortificações e estreitos passes montanhosos às lacunas entre os dentes."
 CHONSARIOI_GLOSS:0 "#bold Chonsarioi#! são formações bizantinas de cavaleiros recrutados dos Bálcãs, valorizados por suas habilidades como batedores e saqueadores."
 CYRIL_AND_METHODIUS_GLOSS:0 "#bold Cyril e Methodius#!, conhecidos como os \"Apóstolos dos Eslavos\": dois irmãos venerados como santos por cristianizar os eslavos do sul e criar o alfabeto glagolítico."
 DACIANS_GLOSS:0 "#bold Dacianos#!: habitantes antigos das terras próximas às montanhas da Cárpatos, a oeste do Mar Negro. Após a conquista de Trajano, foram por um curto período integrados ao império como Dácia Romana."
 EREMOS_GLOSS:0 "#bold Eremos#! é um termo grego usado em referência a lugares desolados adequados à solidão contemplativa."
 ERES_YISRAEL_GLOSS:0 "#bold 'Ereṣ Yisrā'ēl#! é a versão hebraica tiberiana de \"Terra de Israel\""
 GHAZIS_GLOSS:0 "#bold Ghazis#! são guerreiros muçulmanos que participam de expedições militares contra não-muçulmanos. Durante o Califado Rashidun, os saques #EMP ghazi#! na Anatólia ocorreram com uma devastadora frequência e escopo."
 HADITHS_GLOSS:0 "#bold Hadiths#! são coleções de ditos e ações atribuídas ao profeta Maomé; uma fonte importante de orientação para a maioria das seitas muçulmanas."
 SCYTHIAN_GLOSS:0 "#bold Scythian#!: um membro de uma cultura steppe iraniana agora extinta. O termo continua a servir aos gregos como um descriptor indiscriminado para nômades do norte e eslavos."
 SPECIAL_RIGHTS_GLOSS:0 "#bold Direitos especiais#! para comerciar sem tarifas e estabelecer mais instalações em Constantinopla eram uma causa inveterada dos mercadores venezianos."
 artifact_water_of_the_jordan:0 "Água do Jordão"
 artifact_water_of_the_jordan_desc:0 "Gotas sagradas da fonte abençoada que irriga a Terra Santa, o Rio Jordão. Levemente marrons."
 cultural_acceptance_gain_honored_by_visiting_emperor:0 "O respeito de um Imperador visitante"
 cultural_acceptance_loss_insulted_by_visiting_emperor:0 "Os insultos de um Imperador visitante"
 ep3_guide_from_the_borderlands_modifier:0 "Guia da Selva Anatoliana"
 ep3_guide_from_the_borderlands_modifier_desc:0 "A cautela sábia de um ranger do difícil interior anatoliano guia este personagem em suas viagens."
 ep3_travel_events.3000.a_christian:0 "Água mais sagrada — para batismos abençoados!"
 ep3_travel_events.3000.a_jewish:0 "Água de milagres, a ser valorizada!"
 ep3_travel_events.3000.a_muslim:0 "Inshallah, algumas gotas para cada ablução!"
 ep3_travel_events.3000.b.flavor:0 "Sim, é isso que contarei!"
 ep3_travel_events.3000.b:0 "Ainda... Fui limpo pelas águas."
 ep3_travel_events.3000.b_zealot:0 "Fui limpo pelas águas!"
 ep3_travel_events.3000.c:0 "Alguma água entrou na minha boca! Eu devo — #EMP *hurk!*#!"
 ep3_travel_events.3000.c_flavor:0 "Você discretamente 'descarrega' a si mesmo."
 ep3_travel_events.3000.c_zealot:0 "Mas — #EMP *hurk!*#! — realmente tem um gosto #EMP estranho#!..."
 ep3_travel_events.3000.christian:0 "A Palestina, uma terra onde o solo conhece o pisar de Deus, onde o grande Rio Jordão conhece seu corpo.\n\nAo entrar nas águas daquele rio, eu me banho onde João Batista uma vez realizou seus rituais, onde o próprio Cristo foi batizado..."
 ep3_travel_events.3000.desc:0 "Os homens falam apenas sobre a maravilha de"
 ep3_travel_events.3000.greek_christian:0 "A Palestina, onde cada deserto é um [Glossary( 'eremos', 'EREMOS_GLOSS' )] sagrado, cada pedra é sagrada, cada riacho flui para o Rio Jordão.\n\nAo entrar nas águas daquele rio, eu me banho onde João Batista uma vez realizou seus rituais, onde o próprio Cristo foi batizado..."
 ep3_travel_events.3000.israel:0 "a [Glossary( ''Ereṣ Yisrā'ēl', 'ERES_YISRAEL_GLOSS' )], irrigada pelo nobre Rio Jordão como o jardim de [ROOT.Char.GetFaith.HighGodName].\n\nNeste lugar de milagres, eu entro nas águas, banhando-me onde Eliseu curou um leproso, onde os israelitas de Josué deram os passos finais em direção a casa..."
 ep3_travel_events.3000.muslim:0 "A Palestina, uma terra de grandes triunfos islâmicos, irrigada pelo nobre Rio Jordão.\n\nEu entro nesse rio agora, buscando começar minhas abluções. Quase à vista dos locais de descanso dos companheiros do Profeta — que a paz esteja com eles — este lugar é ideal para minha observância dos [Glossary( 'hadiths', 'HADITHS_GLOSS' )]..."
 ep3_travel_events.3000.outro:0 "\n\nE — parece imundo! Minha pele é vagarosamente acariciada por uma lama morna e leitosa; lodo vegetal borbulha entre meus dedos dos pés. Sem cerimônia, eu subo de volta para a margem lamacenta."
 ep3_travel_events.3000.outro_rapture:0 "\n\nE, embora haja plantas escorregadias sob os pés, espumas leitosas carregadas por correntes lamacentas — isso é digno de ser um dos quatro rios do Paraíso! Nunca me senti tão limpo."
 ep3_travel_events.3000.t:0 "Águas do Jordão"
 ep3_travel_events.3001.a_greek:0 "Os #EMP akritai#! sejam louvados!"
 ep3_travel_events.3001.a_non_greek:0 "Um lugar fatídico."
 ep3_travel_events.3001.b:0 "Sombrio."
 ep3_travel_events.3001.distrust_outro:0 "\n\nEnquanto seguimos em frente, formas furtivas imitam nosso progresso nas encostas..."
 ep3_travel_events.3001.foe:0 "\n\nHomens astutos e rudes infestam as Portas Cilicianas, mantendo vigilância sobre o [lords_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] [lords_liege.GetTitleAsName]. De suas altas fortalezas, emboscadas atacam bandidos e pobres inocentes igualmente — tudo supostamente em defesa da terra natal."
 ep3_travel_events.3001.friend:0 "\n\nDiz-se que esses guardiões das Portas Cilicianas, em suas altas fortalezas, uma vez defenderam contra uma inundação de pagãos devastadores. Agora, eles mantêm uma vigilância contra nômades saqueadores e pequenos ladrões, embora alguns digam que não são melhores do que bandidos eles mesmos. Ainda assim..."
 ep3_travel_events.3001.greek:0 "\n\nEsses [Glossary( 'akritai', 'AKRITAI_GLOSS' )], guardiões das Portas Cilicianas em suas altas fortalezas, não defendem mais contra a investida devastadora dos tempos heraclianos — ainda assim, eles mantêm uma vigilância contra os inimigos que se aproximam, nômades saqueadores e os pequenos ladrões que assombram esses passes estreitos."
 ep3_travel_events.3001.intro:0 "Lutamos através dos passes guardiães, os desfiladeiros acidentados entre a Ásia e a Europa. Acima, nas alturas atormentadas pelo vento, olhos de [current_location.GetCulture.GetName] nos observam."
 ep3_travel_events.3001.islamic_arabic:0 "\n\nHomens astutos e rudes infestam as Portas Cilicianas, estes históricos [Glossary( 'al-thughūr', 'AL_THUGHUR_GLOSS')], mantendo vigilância sobre o [lords_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] [lords_liege.GetTitleAsName]. Durante o grande Califado Rashidun, tropas de fronteira perseguiam os portadores do Islã aqui — através deste traiçoeiro caminho de carnificina."
 ep3_travel_events.3001.praise_outro:0 "\n\nAqui, alguns recrutas comuns em pequenas fortalezas desprotegidas salvaguardaram um império."
 ep3_travel_events.3001.t:0 "As Portas Cilicianas"
 ep3_travel_events.3002.a.flavor:0 "Uma visita impressionante pode consolidar minha reputação entre esse povo... e em casa."
 ep3_travel_events.3002.a:0 "Que eles contemplem um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom('GetDaughterSon')] do império!"
 ep3_travel_events.3002.a_byzantine:0 "Venho como um filho de Roma poderosa."
 ep3_travel_events.3002.a_failure:0 "O [local_lord.GetTitleAsNameNoTooltip] despreza minha pompa"
 ep3_travel_events.3002.a_success:0 "O [local_lord.GetTitleAsNameNoTooltip] está maravilhado"
 ep3_travel_events.3002.admin:0 "Este [local_lord.GetCulture.GetNameNoTooltip] [local_lord.GetTitleAsNameNoTooltip|l], felizmente, adota uma administração [ROOT.Char.GetCulture.GetName]-estilo iluminada. Viajar através de [local_lord.GetPrimaryTitle.GetTierAsNameNoTooltip|l] é familiar e seguro.\n\n"
 ep3_travel_events.3002.armenian:0 "À medida que os cavaleiros se aproximam, eu penso nos valorosos armênios que defenderam o império em anos sombrios, tão relutantes em entregar suas espadas quanto foram em abraçar a doutrina. Estranhos companheiros... mas amigos e admiradores dos romanos."
 ep3_travel_events.3002.b.flavor:0 "Um bom meio de evitar formalidades... só preciso ignorar quaisquer diferenças religiosas."
 ep3_travel_events.3002.b:0 "Visitarei sua [local_lord.GetFaith.HouseOfWorshipPlural] local."
 ep3_travel_events.3002.bulgarian:0 "À medida que meio-domados [Glossary( 'Citas', 'SCYTHIAN_GLOSS' )] levam cabras pela estrada, eu penso em [Glossary( 'São Cirilo e São Metódio', 'CYRIL_AND_METHODIUS_GLOSS' )]... e como eles foram sortudos por ter a glória do império atrás deles: uma glória que agora carrego."
 ep3_travel_events.3002.c:0 "Esses provincianos apreciam calor e humildade."
 ep3_travel_events.3002.c_foreign:0 "Esses estrangeiros apreciam calor e humildade."
 ep3_travel_events.3002.generic:0 "Dada a ligação entre nossos povos, é esperado que eu apareça diante de magnatas como esses, impressionando-os com a virtude [ROOT.Char.GetCulture.GetNameNoTooltip]..."
 ep3_travel_events.3002.georgian:0 "É estranho visitar os [local_lord.GetCulture.GetCollectiveNounNoTooltip]. Assim como nós, eles há muito cantam a verdadeira crença, construíram grandes banhos, lidaram com armênios... mas olham sobre estepes sem fim e confiam em suas altas montanhas."
 ep3_travel_events.3002.intro:0 "Um centro de poder está próximo: a [local_lord_capital.GetProvince.GetHolding.GetType.GetName|l] de [local_lord_capital.GetName], de onde [Select_CString( local_lord.IsFemale, 'a', 'o' )] [local_lord.GetTitledFirstName] observa os [local_lord.GetCulture.GetCollectiveNoun] locais.\n\n"
 ep3_travel_events.3002.latin:0 "Seus funcionários se aproximam de nós. Uma vez, esses latinos teriam dignidade romana, falado e se comportado com elegância. Agora, eles tagarelam como bárbaros e gritam por riqueza, por [Glossary( 'direitos especiais', 'SPECIAL_RIGHTS_GLOSS' )] em nossas grandes cidades..."
 ep3_travel_events.3002.non_admin:0 "Dependendo de laços pessoais histriônicos e de uma força feia para manter coesa a parte de terra [local_lord.GetHerHim], este [local_lord.GetCulture.GetNameNoTooltip] [local_lord.GetTitleAsNameNoTooltip|l] é apenas um pequeno lordezinho [local_lord.GetGovernment.GetNameNoTooltip|l].\n\n"
 ep3_travel_events.3002.serbian:0 "Um grupo de cavaleiros nos cumprimenta aqui. Estes ferozes cavaleiros armados com couraça fariam excelentes [Glossary( 'chonsarioi', 'CHONSARIOI_GLOSS' )]... mas não trago bastão de comando. Sou apenas um romano visitante."
 ep3_travel_events.3002.t:0 "Onde [local_lord.GetCulture.GetCollectiveNounNoTooltip] Governam"
 ep3_travel_events.3002.vlach:0 "Meus pensamentos estão em carnes vlachs e queijos de ovelha — sua hospitalidade efusiva. Os nômades [local_lord.GetTitleAsNamePossessiveNoTooltip] eram uma vez ferozes [Glossary( 'Dacians', 'DACIANS_GLOSS' )], dizem... até que um romano veio à sua porta."
 ep3_travel_events.3010.a.flavor:0 "Talvez alguns trinkets esquecidos; talvez algumas cabras perdidas para levar! Não parece que haja alguém aqui para ver."
 ep3_travel_events.3010.a:0 "Vamos saquear suas casas, sem oposição!"
 ep3_travel_events.3010.a_failure:0 "Você não encontra nada que valha a pena pegar"
 ep3_travel_events.3010.a_success:0 "Você consegue alguns bens esquecidos"
 ep3_travel_events.3010.b.flavor:0 "Alguma hospitalidade seria boa; um guia local para nos levar por essas terras áridas, ainda melhor."
 ep3_travel_events.3010.b:0 "Farei com que eles saiam: precisamos de alguma experiência local."
 ep3_travel_events.3010.b_failure:0 "Você grita no silêncio"
 ep3_travel_events.3010.b_success:0 "Você encontra e garante ajuda local"
 ep3_travel_events.3010.c.flavor:0 "Sem plebeus barulhentos, sem gado ruidoso... se ao menos todo o mundo fosse assim."
 ep3_travel_events.3010.c:0 "O silêncio... é bem agradável."
 ep3_travel_events.3010.c_fairy_towers:0 "Estranho, vasto, silencioso... mas bonito."
 ep3_travel_events.3010.fairy_towers:0 "\"Aqueles monólitos malucos, as antigas torres-fada de [current_location.GetName]: seus buracos abrigam portas trancadas,\" murmuram meus companheiros."
 ep3_travel_events.3010.foreigners:0 "\"Esses povos aprenderam há muito tempo a enfrentar tempos difíceis fazendo-se escassos. E parece que nos confundiram com um grupo de saqueadores.\""
 ep3_travel_events.3010.native_knowledge:0 "\"Essas pessoas aprenderam há muito tempo a se esconder em tempos difíceis, dos [Glossary( 'ghazis', 'GHAZIS_GLOSS' )], nômades... e provavelmente nos confundiram com algo ainda pior: os odiados coletores de impostos.\""
 ep3_travel_events.3010.normal_holes:0 "\"Encolhidos em algum buraco, algum túnel, algum esconderijo no topo da colina,\" murmuram meus companheiros."
 ep3_travel_events.3010.t:0 "Silêncio Anatoliano"
 ep3_travel_events.3010:0 "Nossos chamados ecoam em becos de vilarejos desertos, buscando, lamentosamente, até mesmo um murmúrio, até mesmo um balido de boas-vindas. Somente o vento responde.\n\n"
 haunted_by_hostile_troops_modifier:0 "Assombrado por Tropas Hostis"
 haunted_by_hostile_troops_modifier_desc:0 "Este personagem está inquieto com memórias de olhares vigilantes nos passes montanhosos Cilicianos."
 holy_water_mortal_stomach_modifier:0 "Água Sagrada, Estômago Mortal"
 holy_water_mortal_stomach_modifier_desc:0 "Desde que me tornei um pouco #EMP demais#! imerso no êxtase do Rio Jordão, este personagem sofreu uma enfermidade."
 honored_by_visiting_emperor:0 "Ligações históricas honradas por um Basileus viajante"
 impressive_visit_vassalization_acceptance_bonus:0 "[local_lord.GetShortUIName] aumentou #V $offer_vassalization_interaction$#! Aceitação por #V 5 anos#!"
 insulted_by_visiting_emperor:0 "Os insultos de um Basileus visitante"
