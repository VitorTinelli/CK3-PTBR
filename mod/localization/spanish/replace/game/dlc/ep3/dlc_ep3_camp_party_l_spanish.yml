 activity_camp_party:0 "Folia do Acampamento"
 activity_camp_party_conclusion_desc:0 "A [GetActivityType('activity_camp_party').GetName] foi concluída"
 activity_camp_party_cooldown:0 "Você precisa esperar pelo menos 3 meses antes de realizar outra festa!"
 activity_camp_party_desc:0 "Realize uma pequena celebração em seu acampamento, financiada por [gold_i][gold|E], mas modificada por seus estoques de [provisions_i][provisions|E]. Os convidados incluirão todos do acampamento, além de governantes locais, opcionalmente.\n\nFestas no acampamento oferecem uma oportunidade de fazer amizade com seus seguidores, ganhar [task_contracts|E] especiais e gerenciar o [stress|E]."
 activity_camp_party_destination_selection:0 "A [GetActivityType('activity_camp_party').GetName] só pode ser realizada dentro de seu Acampamento"
 activity_camp_party_guest_desc:0 "$BULLET_WITH_TAB$ Os participantes podem perder [stress|E]"
 activity_camp_party_guest_help_text:0 "Todos no acampamento devem razoavelmente esperar participar de tal evento de festejo e celebração.\n\nO governante local pode ser convidado como Convidado de Honra, mas cuidado: aqueles de certas [ranks|E] provavelmente considerarão abaixo de seus padrões comparecer."
 activity_camp_party_host_desc:0 "$BULLET_WITH_TAB$Pode perder [stress_i][stress|E]\n$BULLET_WITH_TAB$Pode ganhar [provisions_i][provisions|E]\n$BULLET_WITH_TAB$Pode ganhar pontos de [skills|E]\n$BULLET_WITH_TAB$Pode ganhar [task_contracts|E]\n$BULLET_WITH_TAB$Pode ganhar [artifacts|E]\n$BULLET_WITH_TAB$Pode recrutar novos [followers|E]"
