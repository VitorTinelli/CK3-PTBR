 ep3_camp_party.0001.a:0 "Mal posso esperar!"
 ep3_camp_party.0001.desc:0 "Finalmente todos estão reunidos, todos os suprimentos preparados, o fogo crepitando alegremente em nosso meio.\n\nA vida na estrada pode ser dura. As festividades serão uma chance para todos relaxarem e esquecerem a árdua busca pela sobrevivência.\n\nQue a revelry comece!"
 ep3_camp_party.0001.t:0 "Pronto para Começar"
 ep3_camp_party.0009.a:0 "Foi uma revelry maravilhosa."
 ep3_camp_party.0009.desc:0 "O fogo diminui, suas brasas agora apenas brilhando onde antes rugiam. Os festeiros, da mesma forma, começam a se dispersar em direção aos seus locais de descanso.\n\nTodos se divertiram, mas a hora chegou para encerrar a diversão por agora."
 ep3_camp_party.0009.t:0 "O Tempo Voa"
 ep3_camp_party.1000.a.tt:0 "Talvez possamos recriá-lo, com madeira e metal suficientes..."
 ep3_camp_party.1000.a:0 "Com o que você acertou ele mesmo?"
 ep3_camp_party.1000.b.failure:0 "Sua história não é muito cativante"
 ep3_camp_party.1000.b.success:0 "Sua história prova ser ainda melhor"
 ep3_camp_party.1000.b.tt:0 "[storyteller.GetFirstNameNoTooltip] se ofende com sua tentativa de superá-lo"
 ep3_camp_party.1000.b:0 "Eu também tenho uma história!"
 ep3_camp_party.1000.c.failure:0 "A próxima história não tem o mesmo impacto"
 ep3_camp_party.1000.c.success:0 "A próxima história é ainda melhor"
 ep3_camp_party.1000.c:0 "Sim! Mais uma!"
 ep3_camp_party.1000.d:0 "Uma ótima história."
 ep3_camp_party.1000.desc:0 "\"E então! E então!\" [storyteller.GetFirstName] gesticula de forma exagerada enquanto [storyteller.GetSheHe] conta uma história que já faz bastante tempo que está sendo preparada. \"Ele caiu como um saco de tijolos! Acertei ele bem na cabeça, eu acertei.\"\n\n[storyteller.GetFirstNameNoTooltip] absorve os aplausos da multidão com um sorriso satisfeito. Foi, de fato, uma grande história de bravura.\n\nA companhia reunida ainda parece muito impressionada, tentando persuadir [storyteller.GetFirstNameNoTooltip] a contar outra história."
 ep3_camp_party.1000.t:0 "Histórias Contadas"
 ep3_camp_party.1005.a.tt.positive:0 "#weak O rastro de fumaça traz mais atenção além do [wanderer.GetFirstNameNoTooltip] perambulante...#!"
 ep3_camp_party.1005.a:0 "Coloque mais lenha na fogueira, para guiar [wanderer.GetSheHe] de volta para casa."
 ep3_camp_party.1005.b.failure:0 "Você se depara com um animal selvagem ao encontrar [wanderer.GetFirstNameNoTooltip]"
 ep3_camp_party.1005.b.neutral:0 "[wanderer.GetFirstNameNoTooltip] retorna, junto com algumas frutas silvestres que [wanderer.GetSheHe] encontrou"
 ep3_camp_party.1005.b.success:0 "Suas habilidades de rastreamento se mostram imediatamente eficazes"
 ep3_camp_party.1005.b:0 "Pegue uma tocha e comece a procurar. Não vá muito longe."
 ep3_camp_party.1005.c.critfailure:0 "[wanderer.GetFirstNameNoTooltip] realmente se perdeu"
 ep3_camp_party.1005.c.failure:0 "[wanderer.GetFirstNameNoTooltip] reaparece, ferido(a)"
 ep3_camp_party.1005.c.success:0 "[wanderer.GetFirstNameNoTooltip] encontra o caminho de volta"
 ep3_camp_party.1005.c:0 "Vamos sentar e esperar."
 ep3_camp_party.1005.desc:0 "\"Ah... [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]?\" [attendee.GetFirstName] se aproxima, torcendo as mãos de preocupação. \"Eu não sei onde [wanderer.GetFirstName] está. Já faz bastante tempo...\"\n\nRealmente #EMP faz#! bastante tempo desde que vi [wanderer.GetFirstNameNoTooltip] pela última vez. Enquanto isso, os céus escurecem ameaçadoramente à medida que o crepúsculo se aproxima.\n\nPara onde [wanderer.GetSheHe] terá vagado?"
 ep3_camp_party.1005.t:0 "Vagando"
 ep3_camp_party.1006.a:0 "\"Talvez você gostaria de ficar #EMP permanentemente#!?\""
 ep3_camp_party.1006.b:0 "\"Venha, sente-se! Me ensine seus métodos medicinais!\""
 ep3_camp_party.1006.desc:0 "Mal sentamos [wanderer.GetFirstName] quando um farfalhar nos arbustos denuncia a presença de outro. Levanto-me de imediato, mas, à medida que a luz revela a figura que se aproxima de nós, fica claro que [newcomer.GetSheHe] não representa uma ameaça.\n\n\"Por favor,\" [newcomer.GetSheHe] começa, \"não estou aqui para causar problemas. Sou apenas um curandeiro viajante, pagando meu caminho com a medicina.\"\n\n\"Eu avistei os rastros de fumaça. Ficarei em dívida se puder permanecer um tempo e participar das suas festividades; aqui, leve um pouco de comida pelo inconveniente.\""
 ep3_camp_party.1006.t:0 "Visitantes Inesperados"
 ep3_camp_party.1010.a:0 "\"Fácil. A resposta é '[ROOT.Char.Custom('GetCampPartyRiddleAnswer')]'.\""
 ep3_camp_party.1010.answer_riddle_01:0 "ferro"
 ep3_camp_party.1010.answer_riddle_02:0 "a lua"
 ep3_camp_party.1010.answer_riddle_03:0 "uma mesa"
 ep3_camp_party.1010.answer_riddle_04:0 "uma agulha"
 ep3_camp_party.1010.answer_riddle_05:0 "um cogumelo"
 ep3_camp_party.1010.answer_riddle_06:0 "uma doença"
 ep3_camp_party.1010.answer_riddle_07:0 "nada"
 ep3_camp_party.1010.answer_riddle_08:0 "problema"
 ep3_camp_party.1010.b.failure:0 "Sua adivinhação está errada"
 ep3_camp_party.1010.b.success.title:0 "A resposta correta era '[ROOT.Char.Custom('GetCampPartyRiddleAnswer')]'"
 ep3_camp_party.1010.b.success:0 "Você adivinha corretamente"
 ep3_camp_party.1010.b:0 "Talvez a resposta seja..."
 ep3_camp_party.1010.c.tt:0 "Não importa a verdade, é provavelmente melhor para a harmonia fingir que são..."
 ep3_camp_party.1010.c:0 "\"Oh [riddler.GetFirstNameNoTooltip], suas charadas são difíceis demais para mim!\""
 ep3_camp_party.1010.desc:0 "Sorriso malicioso de [riddler.GetFirstName] sobre a borda da sua taça não me parece promissor.\n\n\"Vamos lá então, [ROOT.Char.GetFirstNameNoTooltip]. Vamos ver se sua mente ainda está afiada depois de todos esses dias na estrada!\" [riddler.GetSheHe|U] gesticula com a taça com um floreio. \"Que tal uma charada?\" Sem esperar minha concordância, [riddler.GetSheHe] começa."
 ep3_camp_party.1010.desc_outro:0 "\nO que eu sou?\"#!"
 ep3_camp_party.1010.desc_riddle_01:0 "\n\n#EMP \"Arrancado do ventre de minha mãe,\nBatido e queimado,\nEu me torno um assassino sedento de sangue.\"#!"
 ep3_camp_party.1010.desc_riddle_02:0 "\n\n#EMP \"Às vezes sou amarelo e às vezes branco,\nMetade de mim é escura e a outra metade é clara.\"#!"
 ep3_camp_party.1010.desc_riddle_03:0 "\n\n#EMP \"Tenho quatro pernas,\nmas não consigo andar.\"#!"
 ep3_camp_party.1010.desc_riddle_04:0 "\n\n#EMP \"Tenho um olho,\nmas não consigo ver.\"#!"
 ep3_camp_party.1010.desc_riddle_05:0 "\n\n#EMP \"Sou uma sala,\nmas não tenho portas nem janelas.\"#!"
 ep3_camp_party.1010.desc_riddle_06:0 "\n\n#EMP \"Posso ser capturado,\nmas não posso ser lançado.\"#!"
 ep3_camp_party.1010.desc_riddle_07:0 "\n\n#EMP \"Os pobres me têm,\nOs ricos precisam de mim,\nSe você me comer, você perece.\"#!"
 ep3_camp_party.1010.desc_riddle_08:0 "\n\n#EMP \"Sou fácil de entrar,\nmas difícil de sair.\"#!"
 ep3_camp_party.1010.t:0 "Teste sua Mente"
 ep3_camp_party.1015.a.critfailure:0 "[archer.GetFirstNameNoTooltip] erra, mas seu erro é bem pior..."
 ep3_camp_party.1015.a.failure:0 "Seu tiro erra, e [archer.GetFirstNameNoTooltip] acerta"
 ep3_camp_party.1015.a.success:0 "Seu tiro acerta a maçã"
 ep3_camp_party.1015.a.tt:0 "[apple_holder.GetFirstNameNoTooltip] será perfeito como suporte para elas."
 ep3_camp_party.1015.a:0 "\"Vamos tornar isso interessante, certo? Traga duas maçãs.\""
 ep3_camp_party.1015.b.critfailure:0 "[archer.GetFirstNameNoTooltip] acidentalmente te acerta com o tiro [archer.GetHerHim]"
 ep3_camp_party.1015.b.failure:0 "[archer.GetFirstNameNoTooltip] reivindica a primeira morte"
 ep3_camp_party.1015.b.success:0 "Você faz a primeira morte"
 ep3_camp_party.1015.b:0 "\"Por que não caçamos? Quem fizer a primeira morte vence.\""
 ep3_camp_party.1015.c.failure:0 "Você perde"
 ep3_camp_party.1015.c.success:0 "Você vence"
 ep3_camp_party.1015.c:0 "\"Então venha, você escolhe o alvo!\""
 ep3_camp_party.1015.d:0 "\"Eu jamais presumiria competir com alguém do seu calibre!\""
 ep3_camp_party.1015.desc:0 "Mal eu me levantei para pegar mais bebidas, [archer.GetFirstName] se levanta de imediato também.\n\n\"Acho que todos poderíamos usar um pouco de #EMP competição amistosa#!!\" [archer.GetSheHe|U] começa, arco em mãos. \"Que tal um leve concurso de arco? Tenho um arco para você aqui, [ROOT.Char.GetFirstNameNoTooltip]...\"\n\nMinha bebida pode esperar."
 ep3_camp_party.1015.t:0 "Prepare suas Cordas de Arco"
 ep3_camp_party.1020.a:0 "\"Por que não ficar?\""
 ep3_camp_party.1020.b:0 "Podemos poupar um pouco de comida."
 ep3_camp_party.1020.c:0 "As poucas rações que temos devem permanecer nossas."
 ep3_camp_party.1020.cannibal:0 "[local.GetSheHe|U] usa um colar estranho de ossos. É claro que [local.GetSheHe] está faminto, mas seus olhos só realmente se arregalaram com antecipação ao perguntar sobre a... #EMP carne#! que tínhamos disponível.\n\n"
 ep3_camp_party.1020.ending:0 "\"Tudo o que peço é uma noite de descanso seguro e um pouco de comida, [ROOT.Char.Custom('FormOfAddressForLiege')],\" diz [local.GetSheHe|U], \"e eu estaria em grande dívida com você por isso.\""
 ep3_camp_party.1020.mangled:0 "A pobre alma está fisicamente mutilada quase além do reconhecimento. Uma perna e um braço faltando, cicatrizes no rosto e no corpo remanescente [local.GetHerHim]. Eu estremeço ao perceber a quantidade de danos.\n\n"
 ep3_camp_party.1020.mystic:0 "Há uma sabedoria profunda nos olhos de [local.GetFirstNameNoTooltip]. Pequenos incensos balançam no cinto [local.GetHerHim] enquanto [local.GetSheHe] une suas mãos em um gesto de súplica.\n\n"
 ep3_camp_party.1020.opening:0 "Nossas festividades são subitamente interrompidas: uma figura cambaleia em nossa direção vindo da periferia do acampamento. Claramente faminto e cansado, [local.GetSheHe] nos conta que seu nome é [local.GetFirstName].\n\n"
 ep3_camp_party.1020.siblings:0 "Mal eu abri a boca para responder, uma segunda figura, curvada e claramente em dor, junta-se a nós. [local.GetFirstNameNoTooltip] imediatamente vai até seu lado e ternamente, de forma possessiva, segura [local_sibling.GetSheHe] pra perto.\n\n\"Por favor.\" [local.GetFirstNameNoTooltip] me olha suplicante. \"[local_sibling.GetFirstName|U] é [Select_CString( local_sibling.IsFemale, 'minha', 'meu' )] [local_sibling.Custom('SisterBrother')]. [local_sibling.GetSheHe|U] precisa de descanso e água.\"\n\nSeu vínculo é claramente próximo. #EMP Muito#! próximo. Mas o que são essas manchas rubi escuras em suas roupas...?"
 ep3_camp_party.1020.t:0 "Quem Vai Lá?"
 ep3_camp_party.1020.witch:0 "[local.GetFirstNameNoTooltip] está nervoso e fraco, mas ainda há uma clareza forte em seus olhos. As roupas simples [local.GetHerHim|U] estão adornadas com amuletos e ícones desconhecidos.\n\n"
 ep3_camp_party.1021.a.face:0 "#EMP ARGHHHH!#!"
 ep3_camp_party.1021.a.ill:0 "Eu realmente não #DIE1 estou me sentindo muito bem...#!"
 ep3_camp_party.1021.a.sad:0 "Bem, tinha que ser feito."
 ep3_camp_party.1021.b:0 "Excelente. De volta à festa!"
 ep3_camp_party.1021.callous:0 "Enquanto digo minha parte, o rosto de [local.GetFirstName] escurece, mas já estou me virando. Ao fazer isso, gesticulo para os outros removerem os intrusos do acampamento.\n\nEnquanto são arrastados, meu ânimo se ilumina."
 ep3_camp_party.1021.cannibal:0 "[local.GetFirstNameNoTooltip|U] esboça um sorriso sarcástico com minha resposta.\n\n\"Nem vai ajudar um[Select_CString( local.IsFemale, 'a', '' )] [local.GetWomanMan] necessitado, hein? Pensar que já há alguém como eu em suas fileiras. Sim, posso ver, posso ver que você sabe o que esses ossos significam.\"\n\nCom um último aceno de cabeça desdenhoso, [local.GetSheHe] manca na escuridão, sem oferecer mais explicações."
 ep3_camp_party.1021.mangled:0 "[local.GetFirstNameNoTooltip] não parece estar com raiva, mas sim simplesmente triste.\n\n\"Mais uma marca na coluna da vida, em sua longa luta contra a minha existência.\" [local.GetSheHe|U] sorri de forma nostálgica e sai sem mais palavras.\n\nPosso sentir os olhos dos meus companheiros penetrando na parte de trás do meu crânio enquanto assisto [local.GetSheHe] mancando lentamente. Essa não foi uma decisão popular."
 ep3_camp_party.1021.mystic:0 "A retribuição de [local.GetFirstNameNoTooltip] foi rápida e sem muito aviso. Um lábio curvado, um insulto cuspido, e então, de repente, minha visão fica turva. [local.GetFirstName] se retira tão rapidamente quanto [local.GetSheHe] jogou a mistura arenosa em meu rosto, fugindo do acampamento enquanto meus seguidores correm ao meu lado.\n\nParece que não há efeitos imediatos, mas... meu estômago está se sentindo um pouco enjoado..."
 ep3_camp_party.1021.normal:0 "Uma mistura de tristeza, raiva e desesperança aparece no rosto de [local.GetFirstName]. [local.GetSheHe|U] não oferece hostilidade ao sair.\n\nEu reprimo uma crescente sensação de culpa enquanto voltamos às nossas festividades."
 ep3_camp_party.1021.siblings:0 "O rosto de [local.GetFirstName] se contorce, uma máscara repentina de ódio gravada nele. É a última coisa que vejo antes da pedra escondida na mão [local.GetHerHim] se espatifar na órbita do meu olho.\n\nEu caio ao chão segurando meu rosto, vagamente ciente da fuga apressada dos dois irmãos enquanto meus seguidores se reúnem para ajudar."
 ep3_camp_party.1021.t:0 "Rejeitado"
 ep3_camp_party.1021.witch:0 "Os olhos claros de [local.GetFirstNameNoTooltip] se endurecem implacavelmente, em raiva e vergonha.\n\n\"Você vai se arrepender disso.\" [local.GetSheHe|U] olha ao redor de todos nós, com um desdém nos lábios [local.GetHerHim]. \"Já há um dos nossos entre vocês. Eles se encarregarão de garantir que você sofra.\"\n\nCom essas palavras finais, [local.GetSheHe] desaparece na escuridão crescente."
 ep3_camp_party.1025.a:0 "Eu prefiro ouvir mais das suas!"
 ep3_camp_party.1025.b.failure:0 "Você não consegue escolher uma boa história"
 ep3_camp_party.1025.b.success:0 "Suas histórias são bem recebidas"
 ep3_camp_party.1025.b:0 "Claro!"
 ep3_camp_party.1025.c.tt:0 "Talvez, se eu for sutil, [friend.GetSheHe] não perceba a mudança de assunto..."
 ep3_camp_party.1025.c:0 "Oh sim. Diga, você ouviu que..."
 ep3_camp_party.1025.desc:0 "A festa continua, mas [friend.GetFirstName] está claramente se sentindo um pouco introspectivo.\n\n\"Isso realmente me lembra da minha infância.\" [friend.GetSheHe|U] olha ao redor nostálgico. \"Tanta travessura e festa. Posso recordar de uma centena de noites de tal travessura agora!\" [friend.GetSheHe|U] me olha.\n\n\"Que tal você? Tem alguma história de quando você era um jovem [ROOT.Char.Custom('GetLassLad')]?\""
 ep3_camp_party.1025.t:0 "Trocando Histórias"
 ep3_camp_party.1030.a:0 "Um? Abra #EMP dois!#!"
 ep3_camp_party.1030.b.success:0 "Sua festa é reconhecida"
 ep3_camp_party.1030.b:0 "Vamos viver um pouco, não vamos?"
 ep3_camp_party.1030.c:0 "Não podemos perder o controle só por uma noite de festa."
 ep3_camp_party.1030.desc:0 "A bebida em meu copo escorre para nada, as últimas gotas drenadas. Viro-me para procurar outra, mas só encontro um pequeno grupo de pessoas na mesma situação que eu.\n\n\"Estamos sem.\" [reveler.GetFirstName] vasculha as rações, com uma lanterna para iluminá-las. \"Nós #EMP poderíamos#! abrir outro barril, mas se não terminarmos pode estragar..."
 ep3_camp_party.1030.t:0 "Abrir um Barril"
 ep3_camp_party.1035.a.success:0 "Sua ideia se mostra válida"
 ep3_camp_party.1035.a:0 "\"Espere. Temos aqueles barris e caixas velhas...\""
 ep3_camp_party.1035.b.critfailure:0 "A árvore cai em um ângulo estranho..."
 ep3_camp_party.1035.b.failure:0 "Você não consegue encontrar uma árvore adequada para derrubar"
 ep3_camp_party.1035.b.success:0 "A derrubada vai conforme o planejado"
 ep3_camp_party.1035.b:0 "\"Tudo bem, me dê isso aqui.\""
 ep3_camp_party.1035.c:0 "\"Não há tempo para derrubar uma árvore. Vamos retirar aqueles arbustos para conseguir gravetos.\""
 ep3_camp_party.1035.desc:0 "Estou tão imerso na conversa que mal percebo a falta de luz. É só quando tenho dificuldade em identificar um novato na conversa que dou uma olhada para o fogo.\n\nAs suas brasas brilham fracamente, quase esgotadas. [treefeller.GetFirstName] balança a cabeça em resposta ao meu olhar rápido pelo acampamento.\n\n\"Usamos a última da lenha. Precisamos conseguir mais.\" [treefeller.GetSheHe|U] salta para seus pés, pegando um machado próximo e levantando uma sobrancelha para mim."
 ep3_camp_party.1035.t:0 "Escassez de Lenha"
 ep3_camp_party.1040.a:0 "Eu quero a grande!"
 ep3_camp_party.1040.b:0 "Um daqueles trinkets seria legal."
 ep3_camp_party.1040.c:0 "Afaste-se, oportunista!"
 ep3_camp_party.1040.desc:0 "Um alvoroço! Minhas orelhas se agitam e me viro para ver alguns dos meus seguidores engajados em uma discussão com um[Select_CString( merchant.IsFemale, 'a', '' )] [merchant.GetWomanMan] ao lado de um carro puxado por cavalo.\n\n\"Somente as melhores mercadorias!\" [merchant.GetSheHe|U] proclama com um sorriso astuto. \"Eu vi e ouvi suas festividades de longe e, #EMP claro#! tive que desviar para oferecer a vocês uma chance de adquiri-las!\"\n\nAproximo-me, tentando focar através da minha ligeira embriaguez. Elas certamente são brilhantes..."
 ep3_camp_party.1040.t:0 "Um Comerciante Errante"
 ep3_camp_party.2000.a:0 "\"[first_follower.GetFirstNameNoTooltip], o que você acha sobre...\""
 ep3_camp_party.2000.ambitious:0 "somente o trabalho duro levará você #EMP a algum lugar#! na vida"
 ep3_camp_party.2000.arbitrary:0 "#EMP espontaneidade e intuições#! é o segredo para uma vida pacífica"
 ep3_camp_party.2000.arrogant:0 "as pessoas se tornaram muito mais #EMP obtusas#! hoje em dia"
 ep3_camp_party.2000.b:0 "\"Que ponto de vista interessante, [second_follower.GetFirstNameNoTooltip]!\""
 ep3_camp_party.2000.brave:0 "conquistar seus medos é a #EMP coisa mais importante#! na vida"
 ep3_camp_party.2000.c:0 "\"A noite é jovem! Vamos debater #EMP ambos#! os tópicos mais a fundo!\""
 ep3_camp_party.2000.callous:0 "as pessoas estão tão #EMP sensíveis#! hoje em dia"
 ep3_camp_party.2000.calm:0 "os problemas #EMP são#! mais fáceis de resolver sob uma atitude calma"
 ep3_camp_party.2000.chaste:0 "nós somos #EMP melhores#! do que os animais imundos, capazes de controlar nossa luxúria a qualquer momento"
 ep3_camp_party.2000.compassionate:0 "ajudar aqueles em necessidade #EMP é#! a recompensa, por si só"
 ep3_camp_party.2000.content:0 "a festividade está boa até agora, sem nada realmente para reclamar"
 ep3_camp_party.2000.craven:0 "o mundo se tornou tão #EMP perigoso#! nos últimos tempos"
 ep3_camp_party.2000.d.tt:0 "[THIS.Char.GetDomicile.GetName] não #bold tem#! um edifício de nível [GetDomicileBuilding('mess_tent_03').GetName] #V 3#! ou superior"
 ep3_camp_party.2000.d:0 "\"Venham! Vamos desfrutar de uma refeição juntos em vez disso!\""
 ep3_camp_party.2000.deceitful:0 "#EMP algumas#! pessoas acham que [other_follower.GetFirstName] é bastante [other_follower.Custom('quirk_neg_adjective')], mas #EMP eu#! sempre considerei [other_follower.GetSheHe] apenas [other_follower.Custom('quirk_pos_adjective')]"
 ep3_camp_party.2000.desc:0 "\"... e #EMP isso#! é por isso que [ROOT.Char.Custom('GetFirstFollowerTraitMonologue')],\" meu [ROOT.Char.Custom2('RelationToMe', first_follower)], [first_follower.GetFirstName] termina, enquanto [first_follower.GetSheHe] toma mais um gole da sua caneca de [ROOT.Char.Custom('RegionalDrink')].\n\nEstou #EMP intrigado#! pelo tópico de [first_follower.GetFirstNameNoTooltip], mas hesito quando ouço [second_follower.GetFirstName] monologando sobre \"... como [ROOT.Char.Custom('GetSecondFollowerTraitMonologue')].\"\n\nLevemente estressado, tento decidir qual conversa retomar:"
 ep3_camp_party.2000.diligent:0 "é #EMP satisfatório#! ter todas as tarefas de trabalho concluídas e entregues"
 ep3_camp_party.2000.eccentric:0 "a lua tem uma meleca no seu nariz esta noite"
 ep3_camp_party.2000.fickle:0 "é tão difícil #EMP talvez às vezes talvez#! tomar uma decisão"
 ep3_camp_party.2000.forgiving:0 "o conceito de dar a outra face está presente em #EMP mais#! de uma religião"
 ep3_camp_party.2000.generous:0 "é bom #EMP compartilhar#! qualquer pequena posse que alguém possa ter com os outros"
 ep3_camp_party.2000.gluttonous:0 "devemos #EMP aproveitar#! comida deliciosa e boa sempre que tivermos a oportunidade"
 ep3_camp_party.2000.greedy:0 "o preço de [ROOT.Char.Custom('RegionalRootVegetablePlural')] se tornou tão #EMP caro#! recentemente"
 ep3_camp_party.2000.gregarious:0 "as festividades são #EMP tão#! relaxantes, e é #EMP benéfico#! simplesmente aproveitar a companhia dos outros"
 ep3_camp_party.2000.honest:0 "o #EMP esforço#! que foi colocado no primeiro prato foi admirável, mas não era #EMP particularmente#! bom"
 ep3_camp_party.2000.humble:0 "uma pessoa #EMP não deveria#! se fazer passar por algo que não é"
 ep3_camp_party.2000.impatient:0 "está #EMP demorando tanto tempo#! para conseguir uma bebida por aqui"
 ep3_camp_party.2000.just:0 "nós #EMP precisamos#! seguir as leis e regras locais, ao contrário dos #EMP selvagens#!"
 ep3_camp_party.2000.lazy:0 "uma pessoa está #EMP muito#! mais preparada para dificuldades se descansar profusamente"
 ep3_camp_party.2000.lustful:0 "é simplesmente saudável engajar-se em #EMP tentações#! de tempos em tempos"
 ep3_camp_party.2000.paranoid:0 "tudo está #EMP conectado#!; como a seca do ano passado em relação a como tão escassamente qualquer galinha fornece um ovo todos os dias!"
 ep3_camp_party.2000.patient:0 "é bom simplesmente #EMP sentar#! por um momento, ponderando sobre o ambiente"
 ep3_camp_party.2000.sadistic:0 "a dor física #EMP pode#! moldar um sujeito para ser mais útil"
 ep3_camp_party.2000.shy:0 "a timidez é simplesmente um sinal de #EMP inteligência#!; #EMP não#! inferioridade"
 ep3_camp_party.2000.stubborn:0 "você #EMP deve#! perseguir ferozmente qualquer coisa que valha a pena ter"
 ep3_camp_party.2000.t:0 "Uma Conversa na Mão..."
 ep3_camp_party.2000.temperate:0 "é recompensador #EMP não#! dormir com a barriga cheia"
 ep3_camp_party.2000.trusting:0 "precisamos ter fé em nossos semelhantes para #EMP cuidar#! de seu próximo"
 ep3_camp_party.2000.vengeful:0 "#EMP vingança#! é um prato que deve ser servido frio"
 ep3_camp_party.2000.wrathful:0 "pessoas que #EMP simplesmente não veem razão#! são #EMP tolos#!"
 ep3_camp_party.2000.zealous:0 "o plano divino #EMP guiará#! nosso caminho, se apenas nos submetermos"
 ep3_camp_party.2100.t:0 "Conversa ao Redor da Fogueira"
 ep3_camp_party_sad_lonesome:0 "Festa Solitária no Acampamento"
 ep3_camp_party_sad_lonesome_desc:0 "Este personagem organizou uma [GetActivityType('activity_camp_party').GetName] apenas para si e é assombrado pela memória do silêncio perturbador da solidão"
 ep3_camp_party_shadows_in_the_dark:0 "Sombras Assustadoras no Escuro"
 ep3_camp_party_shadows_in_the_dark_desc:0 "Este personagem passou por sua [GetActivityType('activity_camp_party').GetName] sozinho, e muito, muito quieto"
 ep3_fireside_chat_diplomacy:0 "Conversa ao Redor da Fogueira: Diplomacia"
 ep3_fireside_chat_diplomacy_desc:0 "Este personagem aprendeu várias frases eloquentes, bem como como se prostrar diante da realeza, em uma conversa encantadora ao redor da fogueira crepitante"
 ep3_fireside_chat_intrigue:0 "Conversa ao Redor da Fogueira: Intriga"
 ep3_fireside_chat_intrigue_desc:0 "Este personagem aprendeu vários truques sobre como tirar o dinheiro e a vida dos outros em uma demonstração grotescamente cativante ao redor da fogueira crepitante"
 ep3_fireside_chat_learning:0 "Conversa ao Redor da Fogueira: Aprendizado"
 ep3_fireside_chat_learning_desc:0 "Este personagem aprendeu bastante sobre os mistérios dos céus e da terra em uma conversa envolvente ao redor da fogueira crepitante"
 ep3_fireside_chat_martial:0 "Conversa ao Redor da Fogueira: Marcial"
 ep3_fireside_chat_martial_desc:0 "Este personagem aprendeu bastante sobre investidas de cavalaria, táticas de batalha e logística de campanhas em uma conversa intensa ao redor da fogueira crepitante"
 ep3_fireside_chat_modifier_1:0 "Conversa ao Redor da Fogueira: A Fonte de Sabedoria"
 ep3_fireside_chat_modifier_1_desc:0 "Este personagem aprendeu muito com várias histórias compartilhadas ao redor da fogueira crepitante"
 ep3_fireside_chat_modifier_2:0 "Conversa ao Redor da Fogueira: O Tesouro de Sabedoria"
 ep3_fireside_chat_modifier_2_desc:0 "$ep3_fireside_chat_modifier_1_desc$"
 ep3_fireside_chat_modifier_3:0 "Conversa ao Redor da Fogueira: A Cornucópia de Sabedoria"
 ep3_fireside_chat_modifier_3_desc:0 "$ep3_fireside_chat_modifier_1_desc$"
 ep3_fireside_chat_stewardship:0 "Conversa ao Redor da Fogueira: Governança"
 ep3_fireside_chat_stewardship_desc:0 "Este personagem aprendeu bastante sobre a governança de pessoas e bestas em uma conversa agradável ao redor da fogueira crepitante"
 ep3_makeshift_mace:0 "Maça Improvisada"
 ep3_makeshift_mace_description:0 "Uma maça pesada improvisada, feita conforme a especificação de uma história. Sua eficácia é tão inegável quanto sua rusticidade, e as lições aprendidas ao fazê-la certamente levarão a maiores economias no futuro."
 fireside_chat_intent:0 "Conversa ao Redor da Fogueira"
 fireside_chat_intent_desc:0 "Reúna-se ao redor da fogueira. Compartilhe histórias. Compartilhe bebidas. Atraia estranhos úteis."
 phase_camp_party:0 "Revelry do Acampamento"
 phase_camp_party_desc:0 "Histórias e festas ao redor da fogueira, o que poderia ser melhor?"
 resplendent_armour_desc:0 "Este impressionante conjunto de armadura brilha onde a luz o atinge, refletindo os finos filigranas incrustados em padrões intrincados por todo ele. Os materiais endurecidos oferecem excelente resistência a qualquer agressor em potencial."
 resplendent_armour_name:0 "Armadura Resplandecente"
