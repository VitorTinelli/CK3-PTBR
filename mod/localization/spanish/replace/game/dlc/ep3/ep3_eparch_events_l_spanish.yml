l_spanish:
 duel_aptitude_challenge:0 "Desafio de [aptitude|E]"
 duel_aptitude_challenge_first:0 "$duel_aptitude_challenge$"
 duel_aptitude_challenge_first_past:0 "$duel_aptitude_challenge$"
 duel_aptitude_challenge_global:0 "[CHARACTER.GetShortUIName|U]:\n $duel_aptitude_challenge$"
 duel_aptitude_challenge_global_past:0 "[CHARACTER.GetShortUIName|U]:\n $duel_aptitude_challenge$"
 duel_aptitude_challenge_third:0 "[CHARACTER.GetShortUIName|U]:\n $duel_aptitude_challenge$"
 duel_aptitude_challenge_third_past:0 "[CHARACTER.GetShortUIName|U]:\n $duel_aptitude_challenge$"
 ep3_eparch_event.0001.a:0 "A capital #EMP deve#! ser protegida!"
 ep3_eparch_event.0001.b:0 "Algumas melhorias moderadas devem ser suficientes."
 ep3_eparch_event.0001.c:0 "Certamente [capital.GetTitle.GetNameNoTierNoTooltip] não está em nenhum #EMP real#! perigo?"
 ep3_eparch_event.0001.desc_intro:0 "O [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip] está em guerra. Cercado pelos [attacker.GetCulture.GetCollectiveNounNoTooltip] e pel[Select_CString( attacker.IsFemale, 'a', 'o' )] [attacker.GetTitledFirstName] [attacker.Custom2('InsultAdjective', ROOT.Char)].\n\n"
 ep3_eparch_event.0001.desc_losing_war:0 "[emperor.GetTitledFirstName] está lutando uma batalha difícil. É provável que seja apenas uma questão de tempo até que a guerra se espalhe ainda mais."
 ep3_eparch_event.0001.desc_outro:0 "\n\n[capital.GetTitle.GetNameNoTier] permanece seguro. #EMP Por enquanto#!. No entanto, seria prudente que nos preparássemos bem caso a guerra chegue à nossa porta..."
 ep3_eparch_event.0001.desc_undecided_war:0 "É cedo para dizer qual será o resultado, pois nenhum dos lados ainda obteve uma vantagem considerável."
 ep3_eparch_event.0001.desc_winning_war:0 "[emperor.GetTitledFirstName] parece ter a vantagem, mas deve-se ter cuidado em proclamar vitória antes da guerra estar realmente ganha."
 ep3_eparch_event.0001.t:0 "$eparch_court_position$: Fortificando a Capital"
 ep3_eparch_event.0002.a:0 "Tal diligência deve ser recompensada!"
 ep3_eparch_event.0002.b:0 "[eparch.GetSheHe|U] está apenas fazendo seu trabalho."
 ep3_eparch_event.0002.desc:0 "M[Select_CString( eparch.IsFemale, 'inha', 'eu' )] [emperor.Custom2('RelationToMeShort',eparch)] [eparch.GetTitledFirstName] tomou precauções significativas para manter a capital segura nestes tempos de guerra.\n\n"
 ep3_eparch_event.0002.desc_at_home:0 "\"Olhe aqui!\" diz [eparch.GetFirstNameNoTooltip], liderando o caminho com passos entusiasmados. \"Essas muralhas foram fortalecidas e significativamente melhoradas. Lá você também pode ver os novos quartéis, abrindo caminho para uma guarnição muito maior.\"\n\n\"Ouso dizer que [capital.GetTitle.GetNameNoTier] está pronta para um cerco prolongado, m[Select_CString( emperor.IsFemale, 'inha', 'eu' )] [emperor.GetLadyLord], caso a guerra chegue à nossa amada cidade.\""
 ep3_eparch_event.0002.desc_away:0 "A carta em minhas mãos descreve uma série de seções das muralhas que foram fortificadas e melhoradas. Além de detalhar os soldados adicionais designados à guarnição. Parece que [capital.GetTitle.GetNameNoTier] está em boas mãos e bastante preparada para um cerco potencial."
 ep3_eparch_event.0005.a:0 "Vamos pagar por algumas mãos extras para patrulhar as ruas."
 ep3_eparch_event.0005.b:0 "Talvez possamos virar os criminosos uns contra os outros?"
 ep3_eparch_event.0005.b_failure:0 "Tentativa de Manipulação Falhou"
 ep3_eparch_event.0005.b_failure_tt:0 "Você falha em virar os criminosos uns contra os outros"
 ep3_eparch_event.0005.b_success:0 "Tentativa de Manipulação Bem-Sucedida"
 ep3_eparch_event.0005.b_success_tt:0 "Você consegue manipular os criminosos"
 ep3_eparch_event.0005.c:0 "[marshal.GetCouncilTitleFirstNameNoTooltip] pode ser de ajuda?"
 ep3_eparch_event.0005.d:0 "Não há necessidade de exagerar. A situação não está #EMP tão#! desesperadora."
 ep3_eparch_event.0005.desc:0 "O controle sobre [capital.GetTitle.GetNameNoTier] está se esvaindo...\n\nCriminosos estão rapidamente aproveitando a situação e se movendo livremente pelas ruas neste exato momento. É #EMP minha#! responsabilidade garantir a segurança da cidade e de todos os cidadãos que residem dentro dessas muralhas."
 ep3_eparch_event.0005.failure_liege:0 "$eparch_court_position$ Falha em Aumentar o [control|E]"
 ep3_eparch_event.0005.success_liege:0 "$eparch_court_position$ Aumenta com Sucesso o [control|E]"
 ep3_eparch_event.0005.t:0 "$eparch_court_position$: Perdendo o Controle"
 ep3_eparch_event.0010.a:0 "Medidas drásticas são necessárias. Coloque a cidade em quarentena!"
 ep3_eparch_event.0010.b:0 "Vasculhe a cidade em busca de médicos e coloque-os para trabalhar."
 ep3_eparch_event.0010.c:0 "[Select_CString( physician.IsFemale, 'Minha médica', 'Meu médico' )] [physician.GetFirstNameNoTooltip] pode ajudar!"
 ep3_eparch_event.0010.c_failure:0 "[physician.GetTitledFirstName] Falha"
 ep3_eparch_event.0010.c_failure_tt:0 "[physician.GetTitledFirstName] falha em aliviar a praga"
 ep3_eparch_event.0010.c_success:0 "[physician.GetTitledFirstName] Tem Sucesso"
 ep3_eparch_event.0010.c_success_tt:0 "[physician.GetTitledFirstName] consegue aliviar a praga"
 ep3_eparch_event.0010.d:0 "Temo que não haja nada que possamos fazer..."
 ep3_eparch_event.0010.desc:0 "[capital.GetTitle.GetNameNoTier] é atingida por uma doença!\n\n[capital_plague.GetName] se espalha pela capital. Infecta cidadãos por toda a cidade, independentemente de classe, fama ou posição na corte. Como sempre, aqueles infelizes que não têm meios e ouro para consultar um médico serão os mais atingidos por esse surto.\n\n[ROOT.Char.GetTopLiege.GetTitledFirstName] vai esperar que eu tome uma atitude e faça o que for possível para evitar um desastre potencial."
 ep3_eparch_event.0010.t:0 "$eparch_court_position$: Doença Ataca"
 ep3_eparch_event.0015.a:0 "Acontece que eu conheço o candidato perfeito!"
 ep3_eparch_event.0015.b.msg.desc:0 "O $eparch_court_position$ nomeou [teacher_powerful_family.GetShortUIName] como professor na Universidade de [capital.GetTitle.GetNameNoTier]"
 ep3_eparch_event.0015.b.msg.t:0 "Professor Nomeado"
 ep3_eparch_event.0015.b:0 "A família [powerful_house_head.GetHouse.GetBaseNameNoTooltip] é digna da posição."
 ep3_eparch_event.0015.c:0 "Com certeza há um acadêmico que eu possa contratar na cidade."
 ep3_eparch_event.0015.d:0 "Na verdade, que tal você vir trabalhar para mim, [teacher_local_scholar.GetFirstNameNoTooltip]?"
 ep3_eparch_event.0015.desc:0 "A universidade em [capital.GetTitle.GetNameNoTier] enviou uma carta explicando sua necessidade de mais professores.\n\nA carta entra em detalhes sobre como fornecer uma educação de alta qualidade é de extrema importância e, sem pessoal adicional, eles não serão capazes de atender às expectativas de [emperor.GetTitledFirstNamePossessive]. A universidade implora para que eu contrate um candidato adequado com a devida urgência."
 ep3_eparch_event.0015.e:0 "Eles terão que se contentar com o que têm por enquanto."
 ep3_eparch_event.0015.t:0 "$eparch_court_position$: A Universidade Precisa de Professores"
 ep3_eparch_event.0020.a:0 "Obrigado, m[Select_CString( emperor.IsFemale, 'inha', 'eu' )] [emperor.GetLadyLord]!"
 ep3_eparch_event.0020.desc_artifact:0 "O servo dá um passo à frente. Com um movimento rápido, o servo puxa um pedaço de pano, revelando o artefato embaixo."
 ep3_eparch_event.0020.desc_emperor_hook:0 "\"Se você precisar de algo, e eu quero dizer #EMP qualquer coisa#!, não hesite em me avisar. Farei o que for possível para ajudá-lo.\""
 ep3_eparch_event.0020.desc_gold:0 "[emperor.GetSheHe|U] faz um gesto para que o servo se aproxime. O servo abre a tampa de um pequeno baú, revelando seu conteúdo. Está cheio de moedas, joias preciosas e outros itens valiosos!"
 ep3_eparch_event.0020.desc_hook_removal:0 "[Select_CString( emperor.IsFemale, 'A', 'O' )] [emperor.GetTitleAsNameNoTooltip] continua: \"Eu conversei com [peer_with_hook.GetShortUIName] e convenci [peer_with_hook.GetSheHe] a abrir mão de qualquer favor que você possa ter devido. [peer_with_hook.GetSheHe|U] não causará mais problemas para você.\""
 ep3_eparch_event.0020.desc_intro:0 "Enquanto caminho pelo corredor mal iluminado, meus pensamentos são interrompidos quando ouço alguém me chamar pelo nome. Me viro e vejo [emperor.GetShortUIName] se aproximando, com um servo a reboque.\n\n\"[eparch.GetFirstNameNoTooltip]! Você se saiu admiravelmente em suas funções supervisionando [capital.GetTitle.GetNameNoTier]. Tal diligência merece ser recompensada, e estou mais do que feliz em atender seu pedido.\"\n\n"
 ep3_eparch_event.0020.t:0 "$eparch_court_position$: Pelos Serviços Prestados"
 ep3_eparch_event.9000.a:0 "Completamente inaceitável! Você está demitido! #EMP saia#!!"
 ep3_eparch_event.9000.b:0 "Considere isso um aviso. Mas você me #EMP deverá#! algo!"
 ep3_eparch_event.9000.c:0 "Farei vista grossa para isso. Por enquanto."
 ep3_eparch_event.9000.desc:0 "Como $eparch_court_position$, é dever de [eparch.GetTitledFirstNamePossessive] administrar e cuidar de todas as necessidades de [capital.GetTitle.GetNameNoTierPossessive] como se a cidade fosse a sua própria casa!\n\nAinda assim, [eparch.GetSheHe] negligenciou gravemente essa importante responsabilidade, traindo a minha confiança no processo e desperdiçando o #EMP privilégio#! que eu confiei a [eparch.GetSheHe]! E para quê? Uma tentativa de servir aos próprios interesses [eparch.GetHerHim].\n\n[eparch.GetFirstNameNoTooltip] aguarda o meu julgamento..."
 ep3_eparch_event.9000.t:0 "$eparch_court_position$: Negligência no Dever"
 ep3_eparch_event.9001.a:0 "O quê? #EMP Demitido?!#!"
 ep3_eparch_event.9001.b:0 "Isso poderia ter terminado muito pior..."
 ep3_eparch_event.9001.c:0 "Talvez eu devesse me considerar sortudo."
 ep3_eparch_event.9001.desc_fired:0 "\"Você me decepcionou, [eparch.GetFirstNameNoTooltip]. Confiei [capital.GetTitle.GetNameNoTier] aos seus cuidados e você me agradece #EMP completamente#! ignorando as necessidades da cidade! Seu comportamento é inaceitável.\"\n\n[Select_CString( emperor.IsFemale, 'A', 'O' )] [emperor.GetTitleAsName] se levanta; \"Você está removido do cargo de [GetCourtPositionType('eparch_court_position').GetNameNoTooltip]. Considere-se afortunado por eu não tomar mais medidas.\""
 ep3_eparch_event.9001.desc_nothing:0 "Rapidamente fica claro que algo não está certo. O silêncio e a tensão no ar falam por si mesmos.\n\n[emperor.GetSheHe|U] #EMP sabe#! que eu tenho ignorado meus deveres como administrador de [capital.GetTitle.GetNameNoTierPossessive], não sabe [emperor.GetSheHe]? Eu espero minha vez.\n\nMinutos se passam, mas nada acontece. [emperor.GetFirstNameNoTooltip] me olha brevemente e depois se afasta. Parece que [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsName] optou por ignorar minha transgressão. Por enquanto."
 ep3_eparch_event.9001.desc_warned:0 "\"Chegou ao meu conhecimento que você tem negligenciado seus deveres, [eparch.GetFirstNameNoTooltip].\" [emperor.GetFirstNameNoTooltip] balança a cabeça. \"Considere isso um aviso. Decidi ser leniente com você. #EMP Por enquanto#!. Espero que seja óbvio que você me deverá algo.\"\n\n[Select_CString( emperor.IsFemale, 'A', 'O' )] [emperor.GetTitleAsNameNoTooltip] me dispensa com um aceno de sua mão."
 ep3_eparch_event.9001.intro:0 "Chego à sala do trono após ter sido convocado p[Select_CString( emperor.IsFemale, 'ela', 'elo' )] [emperor.GetTitledFirstName] e me aproximo rapidamente do altar.\n\n"
 eparch_hook_warning:0 "@alert_icon! #alert_trial [eparch.GetTitledFirstName] tem uma vantagem sobre você - Esta ação terá consequências adicionais#!"
 eparch_neglecting_duty_warning_tt:0 "@alert_icon! #alert_trial A contínua negligência no dever pode fazer com que seu [liege|E] perceba e tome uma atitude#!"
 eparch_reward_msg_title:0 "Recompensado pelos Deveres"
 friend_rewarding_duties:0 "[CHARACTER.GetShortUIName|U] deu a [TARGET_CHARACTER.GetShortUIName] uma recompensa generosa por deveres bem cumpridos"
 friend_rewarding_duties_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] deu a [CHARACTER.GetShortUIName] uma recompensa generosa por deveres bem cumpridos"
 teacher_moves_to_capital_tt:0 "[teacher_tt.GetShortUIName|U] se muda para [capital.GetTitle.GetNameNoTier] como professor"
