 recreate_byzantine_empire_decision:0 "Restaurar o Império Bizantino"
 recreate_byzantine_empire_decision_confirm:0 "Roma renasce!"
 recreate_byzantine_empire_decision_desc:0 "A fragmentação de [GetTitleByKey('e_byzantium').GetName] foi uma tragédia sem precedentes para nosso povo, mas nós perseveramos. Afinal, enquanto um único [Glossary( 'Romaios', 'ROMAIOS_GLOSS' )] ainda estiver de pé, Roma ainda está de pé.\n\nUm dia, um soberano legítimo se sentará novamente no trono de Constantinopla, e o Império renascerá."
 recreate_byzantine_empire_decision_tooltip:0 "Criar [GetTitleByKey('e_byzantium').GetName] e reinstituir seus antigos costumes"
 refound_pandidakterion_decision:0 "Refundar o Pandidakterion"
 refound_pandidakterion_decision_confirm:0 "Começar"
 refound_pandidakterion_decision_desc:0 "O Imperador [GetScriptedCharacterByHistoryID( '70533' ).GetFirstName] fundou o [Glossary( 'Pandidakterion', 'PANDIDAKTERION_GLOSS' )] em 425 d.C., um dos maiores centros de estudo do mundo. Muitos séculos se passaram desde então, e os tempos mudaram. Se quisermos que o Pandidakterion continue na vanguarda do conhecimento humano, a instituição precisa ser renovada e reorganizada."
 refound_pandidakterion_decision_tooltip:0 "Expandir e reorganizar a antiga Universidade de Constantinopla"
 reinstitute_grain_dole_decision:0 "Reinstaurar a Distribuição de Grãos"
 reinstitute_grain_dole_decision_confirm:0 "Abrir os celeiros!"
 reinstitute_grain_dole_decision_desc:0 "Por séculos, os cidadãos de Roma, e mais tarde de Constantinopla, desfrutaram do maior benefício de viver na Capital do Mundo: distribuições regulares de pão gratuito ou com preço controlado. A tradição foi perdida junto com o Celeiro de Roma — Egito — mas qualquer Imperador que a reinstaurar aumentaria imediatamente sua popularidade com as massas."
