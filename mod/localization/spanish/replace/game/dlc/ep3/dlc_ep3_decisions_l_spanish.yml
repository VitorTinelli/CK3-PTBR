 convert_to_administrative_celestial_desc:0 "Você #bold não#! cumpre pelo menos um dos seguintes:\n$EFFECT_LIST_BULLET$Você possui a [GetTitleByKey('h_china').GetName]\n$EFFECT_LIST_BULLET$Você é vassalo da [GetTitleByKey('h_china').GetNameNoTier]\n$EFFECT_LIST_BULLET$A [culture|E] do [top_liege|E] é [GetCultureByKey('han').GetName]\n$EFFECT_LIST_BULLET$A [culture|E] do [top_liege|E] descende de [GetCultureByKey('han').GetName]"
 convert_to_administrative_decision:0 "Adotar Administração Centralizada"
 convert_to_administrative_decision_confirm:0 "Adotar Métodos Administrativos"
 convert_to_administrative_decision_confirm_multiple:0 "Adotar Métodos Burocráticos"
 convert_to_administrative_decision_desc:0 "[ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] deve ser governado por leis, instituições e mérito, não por família, herança e lealdades pessoais!\n\nUm reino tão grande quanto este nunca será governado de forma eficiente sem uma administração de burocratas capazes, centrada em nossa bela capital."
