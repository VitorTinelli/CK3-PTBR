 embrace_heresy_decision:0 "Abraçar a Heresia"
 embrace_heresy_decision_confirm:0 "Abraçar a heresia"
 embrace_heresy_decision_desc:0 "Apesar da existência de uma fé oficial endossada por [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip], crenças heréticas proliferam em nossa terra. Se eu abraçasse publicamente uma delas e me colocasse à sua frente, poderia canalizar o potencial bruto de uma fé descontrolada para aumentar meu poder e seguir minha agenda política."
 embrace_heresy_decision_tooltip:0 "Abraçar uma heresia e se tornar seu líder"
 embrace_heresy_tt:0 "Você abraçará a heresia escolhida [faith|E]"
 embrace_responsibilities_decision.tt.effects_delayed:0 "#WEAK Pode levar alguns meses até que a [succession|E] se estabeleça em seu novo lugar#!"
