 embrace_responsibilities_decision:0 "Abraçar Responsabilidades"
 embrace_responsibilities_decision_confirm:0 "Vou ao moinho"
 embrace_responsibilities_decision_desc:0 "Não posso negar que uma vida despreocupada me convinha uma vez, mas as necessidades do dever nos acorrentam a todos, com o tempo. Se ao menos eu tivesse um pouco mais disso..."
 embrace_responsibilities_decision_tooltip:0 "Permita-se herdar [titles|E] novamente"
 empire_tier_tt:0 "Você é um [emperor|E] ou [hegemon|E]"
 ending_of_restore_rome_trials_tt:0 "Os efeitos da restauração inicial de Roma serão revertidos:\n$EFFECT_LIST_BULLET$Todas as [peasant_factions|E] em seu [realm|E] não mais o terão como alvo\n$EFFECT_LIST_BULLET$Diminuição das [wars|E] de outros títulos de Reino\n$EFFECT_LIST_BULLET$Diminuição da frequência de [epidemic|E]\n$EFFECT_LIST_BULLET$A linha do tempo da Invasão Mongol retornará ao normal#!"
