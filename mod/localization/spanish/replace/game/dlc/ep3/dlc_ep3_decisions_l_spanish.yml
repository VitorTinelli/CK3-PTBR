 ep3_decisions_event.5030.a:0 "Simplesmente deslumbrante!"
 ep3_decisions_event.5030.desc:0 "É com um elegante floreio que [local_artisan.GetFirstName], mestre artesão na Magnaneria da minha família, me apresenta um conjunto de robes de seda da melhor qualidade.\n\n\"Sua encomenda está pronta, [ROOT.Char.Custom('FormOfAddressForLiege')]. Espero que a considere à altura de seus padrões.\"\n\nA seda flui como água entre meus dedos, enquanto meus olhos lutam para captar todos os detalhes minuciosos da decoração."
 ep3_decisions_event.5030.t:0 "Ornamento de Seda Completa"
 ep3_decisions_event.6001.a:0 "Às armas. #EMP Agora.#!"
 ep3_decisions_event.6001.b:0 "Precisamos nos preparar primeiro."
 ep3_decisions_event.6001.c:0 "[liege.GetShortUINameNoTooltip|U] não é estranho para mim. [liege.GetSheHe|U] ouvirá."
 ep3_decisions_event.6001.d:0 "Preciso pensar mais sobre isso."
 ep3_decisions_event.6001.desc.intro:0 "Uma brisa fria acompanha a vista do acampamento. Os [county.Custom('TerrainTypeCountyScope')] parecem infinitos. É aqui que pertenço, onde meu povo pertence. Eu respiro fundo.\n\n"
 ep3_decisions_event.6001.desc.no_spouse:0 "Um [liege.GetCulture.GetName]? O governante do povo [ROOT.Char.GetCulture.GetName]? A mera ideia me enojam. E eu sei que não sou o único.\n\n"
 ep3_decisions_event.6001.desc.outro:0 "Não importa onde eu olhe, eu sei que os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] não ficarão em silêncio. É hora de recuperar o que é nosso."
 ep3_decisions_event.6001.desc.spouse_common:0 "\"Pode ser tudo seu, você sabe?\" a doce voz de [spouse.GetFirstName] interrompe meus pensamentos."
 ep3_decisions_event.6001.desc.spouse_diff_culture:0 "\"Mesmo sendo um [spouse.GetCulture.GetName], eu sei que essas pessoas o admiram. Elas o veem como seu herói. Não as decepcione.\""
 ep3_decisions_event.6001.desc.spouse_same_culture:0 "$ep3_decisions_event.6001.desc.spouse_common$ \"Eles o admiram, eles o seguiriam até o fim.\""
 ep3_decisions_event.6001.t:0 "O Campeão dos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]"
 ep3_decisions_event.6002.a:0 "Estamos livres."
 ep3_decisions_event.6002.desc:0 "\"Pelos [ROOT.Char.GetCulture.GetCollectiveNoun]! Pelos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]! Pelos #EMP [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], arghhh#!!\"\n\nEu tomo um momento para respirar, meu peito é abalado pela emoção, minha voz ainda treme. Os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]. Não posso esquecer por quem estou lutando.\n\n\"[loser.GetTitledFirstName] está no chão, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" O anúncio vem de um garoto, coberto de sujeira. \"Vencemos!\""
 ep3_decisions_event.6002.t:0 "Um Líder Popular"
 ep3_decisions_event.7000.a.crit_failure:0 "Você está ferid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 ep3_decisions_event.7000.a.crit_success:0 "Você traz muita comida"
 ep3_decisions_event.7000.a.failure:0 "Você não encontra nada"
 ep3_decisions_event.7000.a.success:0 "Você trouxe comida"
 ep3_decisions_event.7000.a:0 "Posso encontrar algumas coisas para comermos."
 ep3_decisions_event.7000.a_flavor:0 "#medium A coleta é afetada pelo [terrain|E] e pelo [winter|E]\n#flavor Muito eficaz em:#!\n     $EFFECT_LIST_BULLET$Terras agrícolas, Florestas, Colinas, Planícies, Oásis, Planícies alagadas\n#flavor Um tanto eficaz em:#!\n    $EFFECT_LIST_BULLET$Terras secas, Montanhas, Selva, Zonas úmidas, Estepes\n#flavor Não eficaz em:#!\n    $EFFECT_LIST_BULLET$Desertos, Montanhas desérticas, Taiga#!"
 ep3_decisions_event.7000.a_flavor_golden_aplomb:0 "#medium A coleta é afetada pelo [terrain|E] e pelo [winter|E]\n#flavor Muito eficaz em:#!\n     $EFFECT_LIST_BULLET$Terras agrícolas, Florestas, Colinas, Planícies, Oásis,\n     $EFFECT_LIST_BULLET$Planícies alagadas, Terras secas, Montanhas, Selva, Zonas úmidas, Estepes (graças ao [perk|e] [GetPerk('golden_aplomb_perk').GetName(GetPlayer)])\n#flavor Não eficaz em:#!\n    $EFFECT_LIST_BULLET$Desertos, Montanhas desérticas, Taiga#!"
 ep3_decisions_event.7000.a_foraging:0 "[SelectLocalization(ObjectsEqual(ROOT.Char.MakeScope.Var('has_golden_aplomb_perk').GetFlagName,'yes'),'ep3_decisions_event.7000.a_flavor_golden_aplomb','ep3_decisions_event.7000.a_flavor')]"
 ep3_decisions_event.7000.b:0 "Com minhas armadilhas, alimentarei todos nós."
 ep3_decisions_event.7000.b_flavor:0 "#medium A armadilha é afetada pelo [terrain|E]\n#flavor Muito eficaz em:#!\n     $EFFECT_LIST_BULLET$Selva, Florestas, Colinas, Planícies, Oásis, Terras secas\n#flavor Um tanto eficaz em:#!\n    $EFFECT_LIST_BULLET$Desertos, Montanhas desérticas, Montanhas, Taiga, Estepes\n#flavor Não eficaz em:#!\n    $EFFECT_LIST_BULLET$Terras agrícolas, Planícies alagadas, Zonas úmidas#!"
 ep3_decisions_event.7000.b_flavor_golden_aplomb:0 "#medium A armadilha é afetada pelo [terrain|E]\n#flavor Muito eficaz em:#!\n$EFFECT_LIST_BULLET$Selva, Florestas, Colinas, Planícies, Oásis, Terras secas, Desertos, Montanhas desérticas, Montanhas, Taiga, Estepes (graças ao [perk|e] [GetPerk('golden_aplomb_perk').GetName(GetPlayer)])\n#flavor Não eficaz em:#!\n    $EFFECT_LIST_BULLET$Terras agrícolas, Planícies alagadas, Zonas úmidas#!"
 ep3_decisions_event.7000.b_trapping:0 "[SelectLocalization(ObjectsEqual(ROOT.Char.MakeScope.Var('has_golden_aplomb_perk').GetFlagName,'yes'),'ep3_decisions_event.7000.a_flavor_golden_aplomb','ep3_decisions_event.7000.a_flavor')]"
 ep3_decisions_event.7000.c.crit_failure:0 "[chief_forager.GetFirstNameNoTooltip] está ferid[Select_CString( chief_forager.IsFemale, 'a', 'o' )]"
 ep3_decisions_event.7000.c.crit_success:0 "[chief_forager.GetFirstNameNoTooltip] traz muita comida"
 ep3_decisions_event.7000.c.failure:0 "[chief_forager.GetFirstNameNoTooltip] não encontra nada"
 ep3_decisions_event.7000.c.named:0 "Reúna uma equipe de forrageadores, [chief_forager.GetFirstNameNoTooltip]."
 ep3_decisions_event.7000.c.success:0 "[chief_forager.GetFirstNameNoTooltip] traz comida"
 ep3_decisions_event.7000.c:0 "Envie os forrageadores."
 ep3_decisions_event.7000.d.crit_failure:0 "[huntperson.GetFirstNameNoTooltip] está ferid[Select_CString( huntperson.IsFemale, 'a', 'o' )]"
 ep3_decisions_event.7000.d.crit_success:0 "[huntperson.GetFirstNameNoTooltip] traz muita comida"
 ep3_decisions_event.7000.d.failure:0 "[huntperson.GetFirstNameNoTooltip] não encontra nada"
 ep3_decisions_event.7000.d.named:0 "Você é um caçador, [huntperson.GetFirstNameNoTooltip]: vá e caça!"
 ep3_decisions_event.7000.d.success:0 "[huntperson.GetFirstNameNoTooltip] traz comida"
 ep3_decisions_event.7000.d:0 "Meu caçador irá nos fornecer alguma caça."
 ep3_decisions_event.7000.desc:0 "Saindo do meu acampamento, examino os [forage_province.Custom('TerrainTypeProvince')] ao redor, em busca de qualquer sinal de caça ou forragem.\n\n"
 ep3_decisions_event.7000.difficult_forage:0 "Vasculhar o [forage_province.Custom('GetProvinceGroundDesc')] e os [forage_province.Custom('GetTerrainTypePlural')] de [forage_province.GetName] oferece pouco encorajamento: o lugar está desprovido de qualquer coisa digna de nosso estômago. Nossa melhor esperança é caçar."
 ep3_decisions_event.7000.difficult_hunt:0 "Embora haja muitos cogumelos, raízes e bagas para serem encontrados ao redor de [forage_province.GetName], este não é um paraíso para caçadores. Não há nem mesmo uma lebre à vista."
 ep3_decisions_event.7000.fallback:0 "[forage_province.GetName] deve nos tratar bem. Os [forage_province.Custom('GetTerrainTypePlural')] estão cheios de vida, e é necessário apenas tomar o tempo e o cuidado adequados para encontrar comida aqui."
 ep3_decisions_event.7000.good:0 "Estamos com sorte: o clima de [forage_province.GetName] é ameno e rico. Aonde quer que se olhe, os presentes da natureza transbordam pelos [forage_province.Custom('GetTerrainTypePlural')]. Faremos bem aqui."
 ep3_decisions_event.7000.no_provisions_tt:0 "Nenhuma [Concept('provisions', 'Provisão')|E] encontrada"
 ep3_decisions_event.7000.t:0 "A Riqueza de [forage_province.GetNameNoTooltip]"
 ep3_decisions_event.7000.winter_forage:0 "[forage_province.GetName] pode oferecer mais nas estações amenas, mas o amargo frio do inverno endurece o [forage_province.Custom('GetProvinceGroundDesc')], e envolve os [forage_province.Custom('GetTerrainTypePlural')] em geada. Não encontraremos muito aqui..."
 ep3_decisions_event.9001.a.tt:0 "#weak Vou passar algum tempo sozinho, refletindo.#!"
 ep3_decisions_event.9001.a:0 "As águas me chamam e somente a mim."
 ep3_decisions_event.9001.b.tt:0 "#weak Um momento a sós com [potential_friend.GetNameNoTooltip] pode aprofundar nosso relacionamento.#!"
 ep3_decisions_event.9001.b:0 "Uma oportunidade de passar algum tempo com [potential_friend.GetNameNoTooltip]!"
 ep3_decisions_event.9001.c.tt:0 "#weak Um barco na água é mais provável de pegar um belo peixe comparado a pescar da margem.#!"
 ep3_decisions_event.9001.c:0 "Há um barco que podemos alugar por perto, talvez?"
 ep3_decisions_event.9001.desc:0 "Enquanto vou em direção à margem do rio, o cheiro de sal e peixe enche meu nariz. Algumas pessoas estão terminando, deixando toda a costa para eu usar. Um dia como este não aparece todos os dias e eu devo aproveitar ao máximo."
 ep3_decisions_event.9001.fishing:0 "\n\nUm dia de relaxamento me aguarda!"
 ep3_decisions_event.9001.friend:0 "\n\n[Select_CString( potential_friend.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', potential_friend)] [potential_friend.GetName] decidiu me acompanhar hoje. Uma oportunidade de conexão se apresenta, ou posso escolher pescar sozinho."
 ep3_decisions_event.9001.ice_fishing:0 "O vasto corpo de água congelada nos aguarda, tudo o que preciso fazer é encontrar um bom lugar para fazer um pequeno buraco."
 ep3_decisions_event.9001.t:0 "Fui Pescar"
 ep3_decisions_event.9010.a:0 "Agarre firme e puxe!"
 ep3_decisions_event.9010.b.nothing:0 "A vara flutua longe de você"
 ep3_decisions_event.9010.b.trait:0 "A paz domina sua mente"
 ep3_decisions_event.9010.b:0 "Deixe a vara deslizar entre seus dedos."
 ep3_decisions_event.9010.desc:0 "Inalo profundamente e exalo enquanto lanço minha linha na água. O anzol cai com um suave 'plop' e o mundo se torna silencioso.\n\nMinha visão vaga ao longo da costa, tendo um momento sozinho para processar meus pensamentos. A vida como um aventureiro não é tão ruim, mas nenhuma vida está livre de estresse. Fecho os olhos por um momento para descansar quando sou repentinamente despertado por algo puxando a vara de pescar das minhas mãos."
 ep3_decisions_event.9010.t:0 "Um Momento Para Refletir"
 ep3_decisions_event.9020.a:0 "Você se diverte tanto que quase esquece por que está aqui."
 ep3_decisions_event.9020.b:0 "Deixe isso pra lá, tem um peixe na linha!"
 ep3_decisions_event.9020.desc:0 "Eu e [potential_friend.GetNameNoTooltip] temos nos dado bem ultimamente. Rimos das mesmas piadas, nos preocupamos com os mesmos problemas e o vínculo entre nós parece ser maior do que apenas um [ROOT.Char.GetTitleAsNameNoTooltip|U] e [Select_CString( potential_friend.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('RelationToMeShort', potential_friend)].\n\nCada um de nós lança nossas linhas na água e pacientemente espera por uma mordida, enquanto conversamos e rimos.\n\nEsta viagem provou que trabalhamos bem juntos e gostaria de passar mais tempo com eles no futuro."
 ep3_decisions_event.9020.t:0 "Conexões Peixonas"
 ep3_decisions_event.9030.a.fish:0 "#weak Você pega um [ROOT.Char.Custom('GetRegionalFish')]! #!"
 ep3_decisions_event.9030.a.fishfriend:0 "#weak [potential_friend.GetNameNoTooltip] pega um [ROOT.Char.Custom('GetRegionalFish')]! #!"
 ep3_decisions_event.9030.a.nofish:0 "#weak Nada morde... #!"
 ep3_decisions_event.9030.a:0 "Vamos fazer esta contagem!"
 ep3_decisions_event.9030.b:0 "Quero que você tente, [potential_friend.GetNameNoTooltip]."
 ep3_decisions_event.9030.desc:0 "Depois de remar por um tempo, a costa de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] desaparece de vista. Só agora percebo que só trouxe isca suficiente para uma tentativa."
 ep3_decisions_event.9030.friend:0 "\n\nOlho para [potential_friend.GetNameNoTooltip] e confesso, mas eles parecem despreocupados.\n\n\"E daí!\" exclamam. \"Estamos aqui para relaxar. Vá em frente e lance sua linha, vamos ver o que tem lá fora!\""
 ep3_decisions_event.9030.t:0 "Não Sem Problemas"
 ep3_decisions_event.a.tt:0 "A agitação surgirá em sua Capital se nenhuma vitória vier"
 ep3_decisions_event.a.tt_no:0 "Você ainda pode impressioná-los vencendo uma guerra"
 ep3_decisions_event.b.tt:0 "A agitação surgirá em sua Capital se rebeliões acontecerem"
 ep3_decisions_event.b.tt_no:0 "Você ainda pode impressioná-los não enfrentando nenhuma rebelião"
 ep3_decisions_event.c.tt:0 "A agitação surgirá em sua Capital se o império não se sair bem"
 ep3_decisions_event.c.tt_no:0 "Você ainda pode impressioná-los fazendo o império se sair bem"
 ep3_decisions_event.failure:0 "A multidão não está convencida"
 ep3_decisions_event.success:0 "A multidão acredita em você"
 ep3_decisions_event_5002_a_tt:0 "#bold A compra de terras#! se tornará #high 50%#! mais barata"
 ep3_decisions_event_triumph:0 "Triunfo:"
 ep3_gallowsbait_army:0 "Escória da Forca"
 ep3_knight_of_the_swan_house_modifier:0 "Canção do Cisne"
 ep3_knight_of_the_swan_house_modifier_desc:0 "Esta casa é famosa por seu forte senso de cavalheirismo e honra."
 ep3_laamp_decision_event.1100.a.desc:0 "Desde que você visitou [THIS.Var('poi_visited').GetValue] $game_concept_points_of_interest$:"
 ep3_laamp_decision_event.1100.a.flavor:0 "Posso falar e falar, mas o ouvinte retém apenas as palavras que espera."
 ep3_laamp_decision_event.1100.a:0 "Minhas memórias pertencem somente a mim."
 ep3_laamp_decision_event.1100.b.desc:0 "#weak Este artefato fornecerá [lifestyle_experience|E] para #color_yellow futuros portadores#!, sua qualidade aumentada a cada dúzia de $game_concept_points_of_interest$ visitados.#!"
 ep3_laamp_decision_event.1100.b.flavor:0 "...pois sei que não seria acreditado."
 ep3_laamp_decision_event.1100.b:0 "\"Não contei metade do que vi...\""
 ep3_laamp_decision_event.1100.c.desc:0 "Você adia a decisão de escrever a história de suas viagens."
 ep3_laamp_decision_event.1100.c.flavor:0 "Sem pedras, não há arco."
 ep3_laamp_decision_event.1100.c:0 "Minha caneta permanecerá seca por enquanto."
 ep3_laamp_decision_event.1100.desc:0 "O sol brilhante nascendo sobre picos de montanhas nevadas, os esgotos efervescentes de cidades em expansão, os templos que abrigam as almas mais piedosas e as mais miseráveis.\n\nAs obras dos homens ao longo dos séculos, as maravilhas da Natureza moldadas pela mão de [ROOT.Char.GetFaith.HighGodName] Todo-Poderoso. Eu vi tudo isso.\n\nFalei com nobres e plebeus, vi pessoas viverem de inúmeras maneiras. Um verdadeiro tesouro de observações perspicazes, de minhas lembranças impecáveis, seria uma maravilha apreciada por qualquer um que tenha um mínimo de curiosidade... se eu decidir escrevê-las."
 ep3_laamp_decision_event.1100.t:0 "$seasoned_visitor_decision$"
 ep3_laamp_decision_event.1101.a.desc:0 "$zealous_missionary_prep_decision_reward_desc$\nPara continuar em seu caminho piedoso, você precisa se mover para terras infiéis."
 ep3_laamp_decision_event.1101.a:0 "Eu me banho na glória de [ROOT.Char.GetFaith.HighGodName|U]!"
 ep3_laamp_decision_event.1101.desc:0 "Poucos são os lugares nesta Terra onde o poder de [ROOT.Char.GetFaith.HighGodName] Todo-Poderoso pode ser testemunhado como em [holy_site_location.GetNameNoTooltip]. Abençoados são os fiéis que viajam aqui para sentir o seu poder.\n\nPara a maioria, este solo sagrado é o fim de sua jornada, o auge de suas vidas. Mas para mim, este é apenas o começo do meu caminho.\n\nE para aqueles que estou prestes a trazer a sua luz, esta é a única chance de salvação."
 ep3_laamp_decision_event.1101.t:0 "$zealous_missionary_prep_decision$"
 ep3_laamp_decision_event.1102.a.desc:0 "$zealous_missionary_prep_decision_reward_desc$\n#weak Você terá 10 anos para espalhar sua [faith|E] enquanto viaja."
 ep3_laamp_decision_event.1102.a:0 "E eles conhecerão o nome de [ROOT.Char.GetFaith.HighGodName]!"
 ep3_laamp_decision_event.1102.b.desc:0 "Você adia a decisão para mais tarde."
 ep3_laamp_decision_event.1102.b:0 "Ainda preciso de tempo para me preparar."
 ep3_laamp_decision_event.1102.desc:0 "Estão longe os solos sagrados de [ROOT.Var('holy_site_ascension').Province.GetName]. Ainda assim, sinto a força de [ROOT.Char.GetFaith.HighGodName] dentro de mim, mais forte do que nunca.\n\nÉ meu destino, sempre foi, fazer o seu trabalho, preencher aquelas terras e as almas que aqui vivem com a sua luz. A salvação os aguarda, e eu sou o seu humilde instrumento."
 ep3_laamp_decision_event.1102.t:0 "$zealous_missionary_start_decision$"
 ep3_laamp_decision_event.1103.a.alternative:0 "Vamos orar pela salvação de [current_location.GetCounty.GetCulture.GetNameNoTooltip]."
 ep3_laamp_decision_event.1103.a.desc:0 "#weak Falar a língua local aumenta a chance de sucesso."
 ep3_laamp_decision_event.1103.a.failure:0 "Conversão falhou"
 ep3_laamp_decision_event.1103.a.success:0 "Conversão bem-sucedida"
 ep3_laamp_decision_event.1103.a:0 "Tu ouvirás a voz de [ROOT.Char.GetFaith.HighGodName]!"
 ep3_laamp_decision_event.1103.b.alternative:0 "Ou [ROOT.Char.GetFaith.HighGodNameSheHe|U] ou minha espada entrará em seus corações!"
 ep3_laamp_decision_event.1103.b.desc:0 "#weak Ter mais tropas e cavaleiros do que a guarnição local também aumenta a chance de sucesso."
 ep3_laamp_decision_event.1103.b.flavor:0 "Converter pessoas em cadáveres é mais fácil do que [ROOT.Char.GetFaith.GetAdherentNamePlural]"
 ep3_laamp_decision_event.1103.b:0 "Somente os fiéis permanecerão!"
 ep3_laamp_decision_event.1103.c.alternative:0 "Vamos não perder tempo com [current_location.GetCounty.GetName]"
 ep3_laamp_decision_event.1103.c.desc:0 "Você não tentará converter a população local."
 ep3_laamp_decision_event.1103.c.flavor:0 "Se o [ROOT.Char.GetFaith.DevilName] criou [current_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] como alguns dizem, este é o lugar onde ele descansou no sétimo dia."
 ep3_laamp_decision_event.1103.c:0 "Que lugar imundo."
 ep3_laamp_decision_event.1103.desc.alternative:0 "O caminho de um [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] piedoso não é fácil, os esforços [ROOT.Char.GetHerHim] são longos e sem recompensa terrena. Há apenas esperança para me manter em pé. [ROOT.Char.GetSheHe|U] que caminha em pura fé se entrega nas mãos de [ROOT.Char.GetFaith.HighGodName|U], como uma criança nos braços de sua mãe.\n\nEu avanço, pois o trabalho e a sua glória permanecem incompletos, pois os corações dos [current_location.GetCounty.GetFaith.GetAdherentNamePlural] aqui permanecem cheios de mentiras e falsas superstições.\n\nMas não por muito tempo. Hoje, meu julgamento continua e o deles começa."
 ep3_laamp_decision_event.1103.desc:0 "O momento mais importante para [current_location.GetCounty.GetName] chegou com minha chegada, pois hoje trago a luz de [ROOT.Char.GetFaith.HighGodName|U], e [ROOT.Char.GetFaith.HighGodNameSheHe|U] entrará em seus corações e permanecerá lá por gerações.\n\nOs nobres locais, [current_location.GetCounty.GetTitle.GetHolder.GetName] e sua coterie torta, são teimosos demais, muito corrompidos pelos rituais falsos do [current_location.GetCounty.GetFaith.GetName]. Mas as almas dos pobres [current_location.GetCounty.GetCulture.GetCollectiveNoun] estão clamando por mim, ansiando pela sua graça. E elas a terão!"
 ep3_laamp_decision_event.1103.difficulty.desc:0 "#weak Condados de maior desenvolvimento são mais difíceis de converter."
 ep3_laamp_decision_event.1103.t:0 "O Caminho [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — Aquisição"
 ep3_laamp_decision_event.1104.a:0 "A recompensa de [ROOT.Char.GetFaith.HighGodNamePossessive] me aguarda em [ROOT.Char.GetFaith.PositiveAfterLife|U]."
 ep3_laamp_decision_event.1104.b:0 "[ROOT.Char.GetFaith.HighGodName] perdoe-me, pois eu falhei."
 ep3_laamp_decision_event.1104.desc.failure:0 "Eu fui abençoado! Há dez anos, em [ROOT.Var('holy_site_ascension').Province.GetName], [ROOT.Char.GetFaith.HighGodName] veio a mim, entrou em meu coração e o preencheu com alegria e beleza eternas. E a única coisa que [ROOT.Char.GetFaith.HighGodNameSheHe|U] pediu em troca foi que eu seguisse em frente e compartilhasse até meu último suspiro.\n\nAinda assim, eu, como uma alma miserável não tocada por [ROOT.Char.GetFaith.HighGodSheHe|U], a mantive para mim mesmo. Eu tentei compartilhar com afinco suficiente? Foi o miserável [ROOT.Char.GetFaith.DevilName] que me tirou do meu caminho? A mancha em minha alma, a mancha de falha, de impiedade, permanecerá lá por toda a eternidade."
 ep3_laamp_decision_event.1104.desc:0 "Sou abençoado! Há dez anos, em [ROOT.Var('holy_site_ascension').Province.GetName], [ROOT.Char.GetFaith.HighGodName] veio a mim, entrou em meu coração e o preencheu com alegria e beleza eternas. E desde então, eu vagava pela sua Terra, pregando a sua palavra.\n\nPor onde eu passei, o seu poder estava comigo, espalhando-se por terras e corações das pessoas.\n\nE hoje, meu caminho como missionário termina, na glória de [ROOT.Char.GetFaith.HighGodName], sabendo que cumpri minha parte no seu grande plano."
 ep3_laamp_decision_event.1104.t:0 "O Caminho [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] — Fim"
 ep3_laamp_decision_event.1110.a.desc:0 "$become_conqueror_decision_reward$"
 ep3_laamp_decision_event.1110.a.flavor:0 "...o difícil é desmontar e governar."
 ep3_laamp_decision_event.1110.a:0 "Conquistar o mundo a cavalo é fácil..."
 ep3_laamp_decision_event.1110.desc.has_kill:0 "Ainda me lembro da morte de [first_kill.GetTitledFirstNamePossessive], a primeira pessoa que eu lembro de morrer à minha vontade. Eu tinha um gosto por isso mesmo então? Será que essa... #EMP fome#! dentro de mim, essa necessidade de mais, se acendeu naquele instante, ou simplesmente queimou forte o suficiente para finalmente ser vista?\n\nMuitos mais se juntaram a [first_kill.GetSheHe] desde então."
 ep3_laamp_decision_event.1110.desc.hasnt_kill:0 "É um pensamento estranho, na verdade. Não tenho uma forte recordação da primeira pessoa morta por minhas ordens, muito menos por minha mão. Você pensaria que isso ficaria na memória de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan], mas eu nunca me importei muito com os rostos ou nomes dos mortos.\n\nNão consigo contar quantos enviei para seus túmulos, nem pensar exatamente em #EMP quem#!."
 ep3_laamp_decision_event.1110.desc.outro:0 "Para a maioria, tal massacre seria suficiente — mas não para mim.\n\nNão consigo evitar sorrir ao olhar para o horizonte. Não pelos que morreram. Eu sorrio pelos que morrerão."
 ep3_laamp_decision_event.1110.desc:0 "Anos atrás, matei [first_kill.GetName] em batalha. A memória ficou comigo desde então. O peito [first_kill.GetHerHim|U] despedaçado pelo meu golpe, seus olhos arregalados em descrença, o sangue [first_kill.GetHerHim] pingando no chão, tornando o solo fértil.\n\nMuitos mais se juntaram a [first_kill.GetSheHe] desde então. Para a maioria, tal massacre seria suficiente. Mas não para mim.\n\nNão consigo evitar sorrir ao olhar para o horizonte. Não pelos que morreram. Eu sorrio pelos que morrerão."
 ep3_laamp_decision_event.1110.t:0 "$become_conqueror_decision$"
 ep3_laamp_decision_event.1120.a.flavor:0 "Só precisamos vesti-los adequadamente, para que não congelem até a morte esta noite. E talvez trocar os paus por alabardas apropriadas."
 ep3_laamp_decision_event.1120.a:0 "$bandit_king_decision_confirm$"
 ep3_laamp_decision_event.1120.desc:0 "Quando seu coração é perfurado por uma adaga enferrujada, você não se importa com a linhagem de quem a empunha. Cavaleiros em armaduras brilhantes, com suas preciosas armas importadas de toda a Criação? Eles morrem assim como os pobres vestidos em trapos, segurando galhos afiados quebrados da árvore mais próxima.\n\nLords e ladies com seus títulos pomposos podem manter seus mercenários supervalorizados — e temer a traição toda vez que alguém com um bolso mais cheio passa.\n\nOuçam-me e reúnam-se, vocês que não puderam escolher seu caminho na vida, pois a violência e o sangue marcaram vocês desde o nascimento!"
 ep3_laamp_decision_event.1120.t:0 "$bandit_king_decision$"
 ep3_laamp_decision_event.1130.a.desc:0 "$start_city_construction_decision_more_rewards$"
 ep3_laamp_decision_event.1130.a:0 "Vamos começar!"
 ep3_laamp_decision_event.1130.b.desc:0 "Você abandona a construção. Parte do ouro gasto será reembolsado."
 ep3_laamp_decision_event.1130.b:0 "Mudei de ideia, desculpe."
 ep3_laamp_decision_event.1130.desc:0 "O solo sob mim está intocado por mãos humanas. Ainda.\n\nMas já posso ver onde a prefeitura ficará. Onde os mercadores pesarão suas mercadorias e pagarão os impostos sob os olhos atentos dos guardas. Posso ouvir os sinos tocando na torre.\n\nOs suprimentos estão reunidos, meus seguidores estão inquietos. Tudo que é necessário é minha palavra."
 ep3_laamp_decision_event.1130.t:0 "Cidade de [city_location.GetNameNoTooltip] — Início"
 ep3_laamp_decision_event.1131.a:0 "...eu conquistei!"
 ep3_laamp_decision_event.1131.b.desc:0 "A cada ano, a cidade pagará dividendos. O valor depende do número combinado de níveis da [building|E] em [city_location.GetName] e do [development|E] de [city_location.GetCounty.GetName]."
 ep3_laamp_decision_event.1131.b:0 "...eu parti para alcançar mais em outro lugar."
 ep3_laamp_decision_event.1131.desc:0 "Anos atrás, eu estava aqui, quando era apenas mais um ponto no meio da selva. Agora, é uma cidade orgulhosa. Que maravilha! Mas me pergunto se [city_location.GetCounty.GetTitle.GetHolder.GetName] é a pessoa certa para garantir o futuro de meu novo assentamento.\n\nDécadas a partir de agora, histórias serão contadas sobre como eu cheguei a [city_location.GetNameNoTooltip], trouxe à tona seu potencial e..."
 ep3_laamp_decision_event.1131.t:0 "Cidade de [city_location.GetNameNoTooltip] — Fim"
 ep3_laamp_decision_event.1133.a:0 "Esplêndido!"
 ep3_laamp_decision_event.1133.b:0 "Vou investir nisso."
 ep3_laamp_decision_event.1133.c:0 "Não posso arcar com isso."
 ep3_laamp_decision_event.1133.desc:0 "Há um riacho fluindo preguiçosamente nas proximidades. Com a experiência certa, como a minha, e com o trabalho adequado, como o dos meus seguidores, podemos redirecioná-lo para mais perto da cidade.\n\nDepois, construir um moinho d'água em cima deve ser trivial. Pode ser até um moinho maior, se houver recursos para isso."
 ep3_laamp_decision_event.1133.t:0 "Cidade de [city_location.GetName] — O Poder da Água"
 ep3_laamp_decision_event.1134.a:0 "Maravilhoso!"
 ep3_laamp_decision_event.1134.b:0 "Deixe-me pegar minha bolsa."
 ep3_laamp_decision_event.1134.c:0 "Talvez não."
 ep3_laamp_decision_event.1134.desc:0 "A construção está progredindo bem, o esqueleto da cidade já é visível. Temos construtores suficientes para continuar levantando edifícios, mas não temos o bastante para preencher todos os edifícios, cada comércio que pode ser necessário.\n\nFelizmente, posso usar minha autoridade para atrair mais colonos. Claro, com um modesto incentivo em ouro e prata."
 ep3_laamp_decision_event.1134.t:0 "Cidade de [city_location.GetNameNoTooltip] — Colonos"
 ep3_laamp_decision_event.1135.a:0 "Peguem as tochas!"
 ep3_laamp_decision_event.1135.b:0 "Reúnam todos, nenhuma árvore deve permanecer!"
 ep3_laamp_decision_event.1135.c:0 "Pensando bem, não."
 ep3_laamp_decision_event.1135.desc:0 "As pessoas que viverão aqui precisarão de um suprimento adequado de alimentos. As terras inicialmente marcadas para cultivo devem ser suficientes para começar, mas mais campos garantirão sua prosperidade por décadas.\n\nHá uma oportunidade — as florestas de [city_location.GetCounty.GetTitle.GetHolder.GetName] estão fazendo fronteira com meus campos, esperando para serem convertidas em terras aráveis. Tive a previsão de garantir boas relações com [city_location.GetCounty.GetTitle.GetHolder.GetSheHe], então comprar algumas mansi não deve ser um problema. Depois, as árvores precisam ser queimadas e arrancadas, e o solo fértil surgirá."
 ep3_laamp_decision_event.1135.t:0 "Cidade de [city_location.GetNameNoTooltip] — Desmatamento"
 ep3_laamp_decision_event.1136.a:0 "Incrível!"
 ep3_laamp_decision_event.1136.b:0 "Temos um acordo."
 ep3_laamp_decision_event.1136.c:0 "Definitivamente não."
 ep3_laamp_decision_event.1136.desc:0 "Consumir o que o campo tem a oferecer, provar o melhor de terras distantes, produzir bens e serviços únicos — o ciclo natural de qualquer cidade próspera.\n\nPodemos esperar e deixar as conexões comerciais se desenvolverem naturalmente ao longo do tempo — ou agir preventivamente, garantindo que a primeira carroça comercial esteja rolando pelas portas da cidade quando o último tijolo for colocado em suas paredes.\n\nConheço alguns mercadores que podem fazer isso acontecer. Eles me pedem ouro agora — uma quantia ínfima comparada à riqueza que logo fluirá aqui!"
 ep3_laamp_decision_event.1136.t:0 "Cidade de [city_location.GetNameNoTooltip] — Conexões Comerciais"
 ep3_laamp_decision_event.1137.a:0 "[ROOT.Char.GetFaith.HighGodName] seja abençoado!"
 ep3_laamp_decision_event.1137.b:0 "Vou doar para esta causa."
 ep3_laamp_decision_event.1137.c:0 "Infelizmente, não."
 ep3_laamp_decision_event.1137.desc:0 "Uma cidade que sobrevive por décadas, até séculos, precisa de cidadãos fortes que tenham fé na cidade e em si mesmos. E pastores para guiá-los no momento de fraqueza. Esta cidade precisa de mais [ROOT.Char.GetFaith.GetAdherentNamePlural] piedosos.\n\nSou percebido como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] piedoso de consideráveis meios. Com apenas a quantia certa de ouro e orações de pregadores convincentes, terei meu rebanho aqui, junto com o aparato religioso para mantê-lo firmemente nas boas graças de [ROOT.Char.GetFaith.HighGodNamePossessive]."
 ep3_laamp_decision_event.1137.t:0 "Cidade de [city_location.GetName] — Conexões Pias"
 ep3_laamp_decision_event.1140.toast:0 "[city_location.GetName] paga dividendos"
 ep3_laamp_decision_event.1201.a.own_dog:0 "Adeus, bons meninos."
 ep3_laamp_decision_event.1201.a:0 "O uivar, o triste #EMP uivar#!..."
 ep3_laamp_decision_event.1201.b.own_dog:0 "Eh, posso conseguir outro."
 ep3_laamp_decision_event.1201.b:0 "Carne é carne."
 ep3_laamp_decision_event.1201.desc.eaten.kennels.have_dog:0 "Os cães uivam como demônios enquanto são levados para o abate, sentindo o sangue, a morte e os corpos empilhados de seus companheiros. Vou cuidar de [ROOT.Char.Custom('DogStoryName')] eu mesmo, devo isso a [ROOT.Char.Custom('DogStorySheHe')] ."
 ep3_laamp_decision_event.1201.desc.eaten.kennels.no_dog:0 "Os cães uivam como demônios enquanto são levados para o abate, sentindo o sangue, a morte e os corpos empilhados de seus companheiros. Conhecia alguns deles pelo nome, embora pelo menos não possa me considerar um [ROOT.Char.Custom('MistressMaster')] para nenhum."
 ep3_laamp_decision_event.1201.desc.eaten.many.have_dog:0 "Temos a sorte de ter muitos cães disponíveis, incluindo meu próprio [ROOT.Char.Custom('DogStoryName')], embora eles pareçam inquietos — como se suspeitassem do que os aguarda. Depois que o primeiro é levado para morrer, eles começam a uivar."
 ep3_laamp_decision_event.1201.desc.eaten.many.no_dog:0 "Temos a sorte de ter muitos cães disponíveis, muita comida em potencial para nos sustentar, embora eles pareçam inquietos — como se suspeitassem do que os aguarda. Depois que o primeiro é levado para morrer, eles começam a uivar."
 ep3_laamp_decision_event.1201.desc.eaten.one.have_dog:0 "Com apenas meu querido [ROOT.Char.Custom('DogStoryName')] ao meu lado, há apenas uma garganta para cortar. Mesmo assim, [ROOT.Char.Custom('DogStorySheHe')] parece perceber que algo está errado, algo #EMP estranho#! sobre mim."
 ep3_laamp_decision_event.1201.desc.eaten.one.no_dog:0 "Com apenas um cão no acampamento, não é muito um abate, mas a besta parece entender que seu destino se aproxima mesmo assim."
 ep3_laamp_decision_event.1201.desc.eaten.some.have_dog:0 "Com tão poucos cães disponíveis para nós, não há dúvida de que meu próprio [ROOT.Char.Custom('DogStoryName')] deve se juntar ao abate. O primeiro é abatido de forma limpa, mas os demais logo sentem o cheiro do abate e começam a uivar e a gemer."
 ep3_laamp_decision_event.1201.desc.eaten.some.no_dog:0 "Com tão poucos cães disponíveis para nós, devemos estar desesperados por comida. O primeiro é abatido de forma limpa, mas os demais logo sentem o cheiro do abate e começam a uivar e a gemer."
 ep3_laamp_decision_event.1201.desc.intro:0 "É uma coisa horrível, matar um animal que você não criou para comida. Principalmente um cão, o companheiro mais leal que qualquer [ROOT.Char.GetWomanMan] provavelmente conhecerá.\n\n"
 ep3_laamp_decision_event.1201.desc.outro:0 "\n\nMuitos dos meus seguidores me olham com desgosto, mas outros parecem entender que isso é uma necessidade.\n\nPelo menos em breve será silencioso."
 ep3_laamp_decision_event.1201.t:0 "O Último Ladrido de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l]"
 ep3_laamp_decision_event.1201.tt.dog_lost:0 "O cão de [THIS.Char.GetTitledFirstNameNicknamedPossessive], [THIS.Char.Custom('DogStoryName')], é abatido"
 ep3_laamp_decision_event.1201.tt.followers_with_cats:0 "Todo [follower|E] com um gato"
 ep3_laamp_decision_event.1201.tt.followers_with_dogs:0 "Todo [follower|E] com um cão"
 ep3_laamp_decision_event.1201.tt.your_dog_lost:0 "Seu cão, [THIS.Char.Custom('DogStoryName')], é abatido"
 ep3_laamp_decision_event.1202.a.own_cat:0 "Nossa companhia régia chega ao fim, [ROOT.Char.Custom('CatStoryName')]."
 ep3_laamp_decision_event.1202.a:0 "Não temos outra escolha."
 ep3_laamp_decision_event.1202.b.own_cat:0 "Eh, é só um gato."
 ep3_laamp_decision_event.1202.b:0 "Sim, sim, corta, corta. Heh."
 ep3_laamp_decision_event.1202.desc.eaten.many.have_cat:0 "Você pensaria que a maioria deles conseguiria escapar, mas não, quando seu senso de perigo deveria prevalecer, a maioria dos felinos [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] confia em seus mestres.\n\nAté mesmo [ROOT.Char.Custom('CatStoryName')]."
 ep3_laamp_decision_event.1202.desc.eaten.many.no_cat:0 "Você pensaria que a maioria deles conseguiria escapar, mas não, quando seu senso de perigo deveria prevalecer, a maioria dos felinos [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessive] confia em seus mestres.\n\nUm erro tolo."
 ep3_laamp_decision_event.1202.desc.eaten.one.have_cat:0 "Eu... não queria que as coisas com [ROOT.Char.Custom('CatStoryName')] terminassem assim, de verdade, mas precisamos de cada pedaço e migalha de comida que conseguirmos reunir.\n\nMesmo que seja [Select_CString( CatStory.IsFemale, 'minha', 'meu' )] leal e confiável [ROOT.Char.Custom('CatStoryGirlBoy')]."
 ep3_laamp_decision_event.1202.desc.eaten.one.no_cat:0 "Especialmente quando só há um felino a ser encontrado em todo o acampamento, mas precisamos #EMP de#! comida, #EMP qualquer#! comida."
 ep3_laamp_decision_event.1202.desc.eaten.some.have_cat:0 "Não há nem tantos para capturarmos, e uma vez que os reunimos, os pobres bichos estão em grande parte indefesos. Em confinamento, não podem fazer nada além de sibilos de irritação ou ronronos confusos."
 ep3_laamp_decision_event.1202.desc.eaten.some.no_cat:0 "$ep3_laamp_decision_event.1202.desc.eaten.some.have_cat$\n\nAté mesmo [ROOT.Char.Custom('CatStoryName')]."
 ep3_laamp_decision_event.1202.desc.intro:0 "Não é difícil matar um gato, nem mesmo é um pouco esportivo.\n\n"
 ep3_laamp_decision_event.1202.desc.outro:0 "\n\nUma vez que são capturados e colocados em jaulas, são facilmente eliminados, mesmo que nenhum dos meus seguidores pareça especialmente orgulhoso de si mesmos — ou de mim — por isso."
 ep3_laamp_decision_event.1202.t:0 "Um Acampamento Sem Gatos"
 ep3_laamp_decision_event.1202.tt.cat_lost:0 "O gato de [THIS.Char.GetTitledFirstNameNicknamedPossessive], [THIS.Char.Custom('CatStoryName')], é abatido"
 ep3_laamp_decision_event.1202.tt.your_cat_lost:0 "Seu gato, [THIS.Char.Custom('CatStoryName')], é abatido"
 ep3_laamp_decision_event.1203.a.many_steeds:0 "Mesmo na morte, eles nos levam adiante."
 ep3_laamp_decision_event.1203.a.single_steed:0 "Mesmo na morte, [ROOT.Char.Custom('HorseStorySheHe')] me leva adiante."
 ep3_laamp_decision_event.1203.b:0 "Honestamente, deveríamos estar comendo mais #EMP deles#!, isso está delicioso."
 ep3_laamp_decision_event.1203.desc.eaten.both:0 "abatendo não apenas nossos cavalos sobressalentes, mas meu próprio [ROOT.Char.Custom('WarhorseStoryName')]."
 ep3_laamp_decision_event.1203.desc.eaten.own_horse:0 "mesmo que o único cavalo que podemos dispensar seja meu próprio [ROOT.Char.Custom('WarhorseStoryName')]."
 ep3_laamp_decision_event.1203.desc.eaten.reserve_steeds:0 "abatendo nossos cavalos reservas em massa, apesar de sua confusão e pânico."
 ep3_laamp_decision_event.1203.desc.intro:0 "A carne de cavalo é magra e abundante, não estranha a muitas dietas — #EMP se#! você puder arcar com seu consumo.\n\nDadas as circunstâncias difíceis em que nos encontramos, [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] mal pode se dar ao luxo de não reduzir o rebanho,"
 ep3_laamp_decision_event.1203.desc.outro:0 "\n\nEssa abundância vem ao custo de alguma velocidade, mas deve nos comprar tempo para encontrar uma fonte de sustento mais confiável.\n\nPelo menos, eu espero."
 ep3_laamp_decision_event.1203.t:0 "Carne de Cavalo para os Famintos"
 ep3_laamp_decision_event.1204.a:0 "A morte deles é nossa salvação."
 ep3_laamp_decision_event.1204.b:0 "Pela [ROOT.Char.GetFaith.HealthGodName], o tamanho desses #EMP bifes#!."
 ep3_laamp_decision_event.1204.desc:0 "Após os primeiros, o rebanho parece perceber que algo está errado.\n\nÉ apenas com muito esforço que conseguimos controlá-los e realmente começamos a abater — naturalmente focando nos velhos, nos enfermos, nos fracos e nos jovens.\n\nUm a um, colocamos nossa reserva de elefantes primeiro sob a espada, depois sob a faca do açougueiro.\n\nUm trabalho macabro e sangrento, dificultado ainda mais pelos gritos agudos e aterrorizados deles.\n\nMas somos nós ou eles."
 ep3_laamp_decision_event.1204.t:0 "Cemitério de Elefantes"
 ep3_laamp_decision_event.1205.a.tt:0 "Você nunca poderá utilizar a elefanteria de forma eficaz novamente"
 ep3_laamp_decision_event.1205.a:0 "Maldição e explosão, essas bestas recalcitrantes!"
 ep3_laamp_decision_event.1205.desc:0 "Já se passou um ano desde que a desespero de nossa jornada #EMP nos forçou#! a tomar... medidas drásticas.\n\nEmbora sejam criaturas sábias, há muita carne em um elefante, e quando se tratou de suas vidas contra as nossas, a escolha se mostrou simples o suficiente.\n\nPegamos facão e machado e abatemos nosso rebanho, cortando os velhos e os jovens com determinação sombria, sabendo que seu sacrifício era necessário.\n\nNo entanto, parece que o restante de nossos elefantes — aqueles empregados por nossos guerreiros — #EMP lembram#! do massacre. Os bichos são problemáticos, recusando nossas ordens e fazendo muito do que não envolve auto-preservação ou alimentação.\n\nEles são até #EMP frustrantemente#! hostis comigo pessoalmente, parecendo me responsabilizar como líder do rebanho humano."
 ep3_laamp_decision_event.1205.t:0 "$ep3_laamp_decision_event.1204.t$: Repercussões"
 ep3_laamp_decision_event_1205_modifier:0 "Elefantes Nunca Esquecem"
 ep3_laamp_decision_event_1205_modifier_desc:0 "Nem perdoam."
 ep3_mass_arrests_house_power_malus:0 "Recentemente preso por [liege|E]"
 ep3_master_todor_modifier:0 "Ícone Local"
 ep3_master_todor_modifier_desc:0 "Este personagem é admirado por seu povo por sua resistência em abrir mão de sua cultura."
 ep3_poachers_army:0 "Homens Alegres"
 ep3_religious_volunteers_army:0 "Voluntários Religiosos"
 ep3_renounced_estate:0 "Inverno Pacífico"
 ep3_renounced_estate_desc:0 "Este personagem se aposentou de todas as funções para viver o resto de sua vida longe do público."
 ep3_renounced_governorship:0 "Nas Sombras"
 ep3_renounced_governorship_desc:0 "Este personagem optou por renunciar ao seu governo e esperar pelo momento certo para atacar."
 ep3_renounced_governorship_merit:0 "De Volta à Escola"
 ep3_renounced_governorship_merit_desc:0 "Este personagem escolheu renunciar ao seu governo e estudar para o próximo [examination|E]."
 ep3_separatist_uprising:0 "Levante Separatista"
 ep3_separatist_uprising_desc:0 "Este personagem colocou todos os seus esforços em garantir terras para sua cultura."
 ep3_theme_not_backwater.desc:0 "Cada [county|E] em [target_theme.GetNameNoTierNoTooltip] perdeu o [county_modifier|E] [GetModifier('backwater_county_modifier').GetName]"
 ep3_theme_not_backwater.t:0 "[target_theme.GetNameNoTierNoTooltip] Restaurado"
 ep3_triumph_influence_cost_desc:0 "\n\n@alert_icon! #alert_trial O custo de Realizar um Triunfo é aumentado se você não venceu uma [war|E] em 5 anos!#!"
 ep3_valiant_knight_modifier:0 "Cavaleiro Valente"
 ep3_valiant_knight_modifier_desc:0 "Este personagem fez da defesa dos inocentes sua prioridade máxima."
 establish_silk_production_decision:0 "Estabelecer Produção de Seda"
 establish_silk_production_decision_confirm:0 "Enviar o pagamento"
 establish_silk_production_decision_desc.boilerplate:0 "Desde que os antigos contrabandeavam os primeiros bichos-da-seda das terras mais remotas do Leste para Constantinopla, a fabricação e venda de seda sempre foram um monopólio imperial."
