 commission_silk_regalia_decision_confirm:0 "Chamar o artesão"
 commission_silk_regalia_decision_desc:0 "Nossa família está entre os poucos produtores e vendedores autorizados imperialmente da mais fina seda bizantina. Nossa atividade nos traz ouro e influência — e algumas #EMP vantagens extras#! — mas raramente desfrutamos dos benefícios diretamente. Eu acho que mereço algo #EMP extra legal#! para mim, uma vez!"
