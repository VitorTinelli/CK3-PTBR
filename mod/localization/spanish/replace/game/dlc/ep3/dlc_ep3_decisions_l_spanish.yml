 defensive_fire_dromons_buildings_desc:0 "#weak Construir a [building|E] [GetBuilding('common_tradeport_01').GetName] e [GetBuilding('curtain_walls_01').GetName] em [GetTitleByKey('b_constantinople').GetNameNoTier] melhorará este efeito#!"
