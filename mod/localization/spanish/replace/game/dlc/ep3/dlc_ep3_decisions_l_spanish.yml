 convert_to_feudalism_from_administrative_decision_desc:0 "Menos burocracia e mais #EMP ação#! é o que este reino precisa. Se [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l] deve florescer, devemos cortar nossos laços com aquilo que nos impede."
