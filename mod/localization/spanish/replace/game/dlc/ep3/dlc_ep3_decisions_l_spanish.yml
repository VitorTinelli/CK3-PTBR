 reconfirm_grain_dole_decision_desc:0 "Após sua reintrodução formal, os cidadãos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] se acostumaram aos luxos oferecidos pela Doação de Grãos — as distribuições regulares de pão gratuito ou com preço controlado. É um instrumento poderoso nas mãos de qualquer Imperador para garantir a produtividade de seu povo e sua própria popularidade."
