 ep3_bandits_army:0 "Os Desgraçados & Os Perdidos"
 ep3_black_sheep:0 "Ovelha Negra"
 ep3_black_sheep_desc:0 "Este personagem se opôs a um membro da família que o chamou de desgraça para sua família por seu estilo de vida errante."
 ep3_consolidated_rule_modifier:0 "Regra Consolidada"
 ep3_courteous_knight_modifier:0 "Cavaleiro Cortês"
 ep3_courteous_knight_modifier_desc:0 "Este personagem entende que o amor é a maior alegria da vida."
 ep3_courteous_knight_var_tt:0 "Sua [success_chance|E] em [schemes|E] de [GetScheme('courting').GetTypeName] será amplamente aumentada"
 ep3_decisions_event.0001.a.flavor:0 "Quero realmente causar uma impressão em meus súditos!"
 ep3_decisions_event.0001.a.tt:0 "O triunfo seguirá em direção ao Hipódromo"
 ep3_decisions_event.0001.a:0 "O Hipódromo é o melhor lugar."
 ep3_decisions_event.0001.b.flavor:0 "A religião é a base do meu poder."
 ep3_decisions_event.0001.b.tt:0 "O triunfo seguirá em direção à Hagia Sophia"
 ep3_decisions_event.0001.b:0 "Para o [ROOT.Char.Custom('TriumphReligiousLocation')]!"
 ep3_decisions_event.0001.desc:0 "Meus soldados me seguem orgulhosamente, compartilhando a glória da vitória sobre [triumph_enemy_defeated.GetTitledFirstName], enquanto os cidadãos zombam dos prisioneiros e admiram os despojos da guerra."
 ep3_decisions_event.0001.desc_const:0 "\n\nAssim como meus mais estimados predecessores fizeram antes de mim, entro na cidade sagrada de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly] pela [Glossary( 'Portão Dourado', 'GOLDEN_GATE_GLOSS' )], desfilando pelo centro da cidade entre as antigas estátuas e monumentos de glórias passadas, e paro no [Glossary( 'Milion', 'MILION_GLOSS' )] onde todas as medições do império começam."
 ep3_decisions_event.0001.desc_end:0 "\n\nMas onde deve terminar o desfile triunfal?"
 ep3_decisions_event.0001.desc_no_war:0 "Soldados, servos portando riquezas e altos funcionários em suas vestes oficiais me seguem orgulhosamente, representando a prova viva do poder e da majestade do meu reinado."
 ep3_decisions_event.0001.desc_other:0 "\n\nApós entrar em [t_location.GetNameNoTier] pela porta principal, seguimos pela rua principal diretamente para o coração pulsante da cidade."
 ep3_decisions_event.0001.intro:0 "Sento-me alto em meu cavalo, radiante em meu traje mais régio, liderando uma majestosa procissão através de duas alas de uma multidão aplaudindo."
 ep3_decisions_event.0001.t:0 "$ep3_decisions_event_triumph$ Uma Processão Impressionante"
 ep3_decisions_event.0002.a.tt:0 "Farei um espetáculo de como eu escolher lidar com eles!"
 ep3_decisions_event.0002.a:0 "A punição pública dos prisioneiros!"
 ep3_decisions_event.0002.b.tt:0 "Todos adoram sentir que fazem parte da vitória!"
 ep3_decisions_event.0002.b:0 "A distribuição dos despojos de guerra ao povo."
 ep3_decisions_event.0002.c.tt:0 "Todos amam coisas grátis, certo?"
 ep3_decisions_event.0002.c:0 "Comida e ouro serão distribuídos à multidão adoradora!"
 ep3_decisions_event.0002.d.custom_tooltip:0 "Você escolhe um tópico para seu discurso"
 ep3_decisions_event.0002.d.tt:0 "Preciso escolher cuidadosamente como me apresentar aos meus súditos."
 ep3_decisions_event.0002.d:0 "Mas meu discurso, é claro!"
 ep3_decisions_event.0002.desc_artifact:0 "Entre os despojos de guerra, a peça central é o [sacked_artifact.GetName], saqueado durante um cerco."
 ep3_decisions_event.0002.desc_conclusion:0 "\n\nAs massas estão expectantes e o ar ressoa com excitação e uma cacofonia de gritos. Eu darei ao povo o que eles desejam."
 ep3_decisions_event.0002.desc_enemy:0 "Enquanto faço minha entrada triunfante no Hipódromo, o lugar natural para o poder estabelecido se comunicar com os plebeus, pretendo comunicar uma única coisa: #EMP Vitória#!."
 ep3_decisions_event.0002.desc_hostage:0 "Na caixa imperial, eu vislumbro [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] com uma expressão carrancuda."
 ep3_decisions_event.0002.desc_no_prisoner:0 "\n\nNa verdade, riquezas, artefatos, despojos de guerra e símbolos de realeza são desfilados atrás — mais do que suficiente para elicitar aplausos impressionados da multidão."
 ep3_decisions_event.0002.desc_no_war:0 "O Hipódromo é o único lugar onde o povo geralmente pode me ver, então é importante que eles vejam exatamente o que eu preciso que eles vejam: poder, riqueza e controle."
 ep3_decisions_event.0002.desc_prisoner:0 "\n\nUma interminável procissão de prisioneiros, amarrados e vestidos com trapos, segue. A maioria deles são soldados comuns, mas à frente da linha está [valid_prisoner.GetTitledFirstName], montado em um burro para a diversão da multidão."
 ep3_decisions_event.0002.e.tt:0 "Todos devem sentir que fazem parte da vitória e da total humilhação do inimigo!"
 ep3_decisions_event.0002.e:0 "Queimar o [sacked_artifact.GetNameNoTooltip] e distribuir os despojos."
 ep3_decisions_event.0002.t:0 "$ep3_decisions_event_triumph$ No Hipódromo"
 ep3_decisions_event.0003.a:0 "Recebo a bênção de [ROOT.Char.GetFaith.HighGodNameAlternate]."
 ep3_decisions_event.0003.b:0 "Consagrarei minha vitória a [ROOT.Char.GetFaith.HighGodName]."
 ep3_decisions_event.0003.c.tt:0 "Um gesto de paz sancionado religiosamente certamente contribuirá para a diminuição das tensões com o povo de [triumph_enemy_defeated.GetTitledFirstNamePossessiveNoTooltip]."
 ep3_decisions_event.0003.c:0 "A paz esteja com você e seu povo, [enemy_hostage.GetFirstNameNoTooltip]."
 ep3_decisions_event.0003.d.tt_artifact:0 "Doarei o [sacked_artifact.GetName] no altar."
 ep3_decisions_event.0003.d:0 "Dedicarei os despojos a [ROOT.Char.GetFaith.HighGodNameAlternate]."
 ep3_decisions_event.0003.desc:0 "\"Os humanos são seres frágeis, e mesmo as maiores vitórias desaparecem diante da grandeza de [ROOT.Char.GetFaith.HighGodName],\" penso comigo mesmo de forma sombria ao passar pelas portas. Sou imediatamente impressionado pela majestade e grandeza do edifício.\n\nO povo certamente apreciará um gesto humilde e devoto da minha parte como um corolário à minha brilhante vitória sobre [triumph_enemy_defeated.GetTitledFirstName]."
 ep3_decisions_event.0003.desc_hostage:0 "É também por isso que convenientemente pedi a [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] para se juntar a mim aqui."
 ep3_decisions_event.0003.desc_no_war:0 "A soberania é o pior inimigo dos poderosos e dos fortes.\n\nMas ainda pior é #EMP dar a impressão de soberania#! a seus súditos! Afinal, o [ROOT.Char.GetTitleAsNameNoTooltip|U] é apenas o representante de [ROOT.Char.GetFaith.HighGodName] na terra. Poder, riquezas e majestade são apenas um reflexo da glória da Corte Divina, por isso é importante fazer um espetáculo de respeito à hierarquia."
 ep3_decisions_event.0003.t:0 "$ep3_decisions_event_triumph$ Em [ROOT.Char.Custom('TriumphReligiousLocationCapitalized')]"
 ep3_decisions_event.0004.a:0 "Eles serão cegados."
 ep3_decisions_event.0004.b:0 "Executá-los publicamente."
 ep3_decisions_event.0004.c:0 "A misericórdia imperial os alcançou: deixem-nos andar livres."
 ep3_decisions_event.0004.desc:0 "Fileiras e fileiras de prisioneiros entram no Hipódromo. Sujos, emaciados, com as cabeças raspadas, poder-se-ia quase ter pena deles, se não fossem os inimigos odiados que tão recentemente humilhamos no campo de batalha.\n\n[valid_prisoner.GetTitledFirstName|U] os lidera agora em desgraça, como [valid_prisoner.GetSheHe] fez na guerra, mas montado em um burro de costas e vestido com trapos, [valid_prisoner.GetSheHe] parece muito menos intimidador."
 ep3_decisions_event.0004.desc_hostage:0 "A expressão no rosto de [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] escurece ainda mais."
 ep3_decisions_event.0004.t:0 "$ep3_decisions_event_triumph$ O Desfile dos Prisioneiros"
 ep3_decisions_event.0005.a.failure:0 "Eles não estão convencidos por suas palavras doces."
 ep3_decisions_event.0005.a.success:0 "Eles acreditam em sua promessa e esperarão vitórias militares de você."
 ep3_decisions_event.0005.a:0 "Com a orientação de [ROOT.Char.GetFaith.WarGodName], muitas vitórias virão!"
 ep3_decisions_event.0005.b.success:0 "Eles acreditam em sua promessa e esperarão paz interna."
 ep3_decisions_event.0005.b:0 "Que [ROOT.Char.GetFaith.HealthGodName] sempre conduza o Império à segurança!"
 ep3_decisions_event.0005.c.success:0 "Eles acreditam em sua promessa e esperarão que o império prospere."
 ep3_decisions_event.0005.c:0 "Sob a proteção de [ROOT.Char.GetFaith.HighGodName], o Império prosperará!"
 ep3_decisions_event.0005.desc_hostage:0 "Com o canto do olho, avisto [enemy_hostage.Custom2('MyCharacterIntroduction', ROOT.Char)] sentado, imóvel e com uma expressão de pedra."
 ep3_decisions_event.0005.desc_no_war:0 "As multidões são volúveis, e não me escapa que não tenho nenhuma grande vitória para justificar meu triunfo ou oferecer qualquer credibilidade sobre a qual eu possa construir meu discurso. No entanto, preciso impressioná-los de alguma forma, porque a estabilidade do meu reinado baseia-se em grande parte no apoio popular."
 ep3_decisions_event.0005.desc_politics:0 "\n\nAs guerras são superestimadas, então talvez eu devesse desviar a atenção deles para outro lugar, por exemplo, para a estabilidade interna ou a prosperidade."
 ep3_decisions_event.0005.desc_prisoner:0 "\n\nTalvez eu devesse apontar para os ricos despojos de guerra adquiridos e a segurança renovada em nossas fronteiras, embora os muitos prisioneiros capturados durante a guerra, como [valid_prisoner.GetTitledFirstName], desfilando diante da multidão falem por si mesmos. Talvez eu devesse focar na política interna em vez disso?"
 ep3_decisions_event.0005.desc_victory:0 "Ao subir na caixa imperial do Hipódromo, debato a melhor forma de capitalizar sobre a vitória contra [triumph_enemy_defeated.GetTitledFirstName]."
 ep3_decisions_event.0005.t:0 "$ep3_decisions_event_triumph$ O Discurso Imperial"
 ep3_decisions_event.0005.tt:0 "O povo da sua capital se lembrará disso e o julgará de acordo!"
 ep3_decisions_event.0006.a:0 "Eu sempre cumpro minhas promessas."
 ep3_decisions_event.0006.b:0 "Exceto quando não cumpro."
 ep3_decisions_event.0006.desc:0 "Meu último triunfo aconteceu anos atrás, e as promessas que fiz na época estão longe da minha mente atualmente. No entanto, os cidadãos de [t_location.GetName] não se esqueceram, como me lembra [talker.Custom2('MyCharacterIntroduction', ROOT.Char)].\n\n\"O povo tem comentado, meu [ROOT.Char.GetTitleAsNameNoTooltip|U]."
 ep3_decisions_event.0006.desc_no:0 "\n\nEu me lembro. E sei que falhei. Mas eu só precisava de mais tempo! Afinal, eu sempre cumpro minhas promessas."
 ep3_decisions_event.0006.desc_prosperity:0 "Você se lembra que prometeu a eles um império próspero e bem-sucedido?"
 ep3_decisions_event.0006.desc_stability:0 "Você se lembra que prometeu a eles estabilidade e um reino pacífico?"
 ep3_decisions_event.0006.desc_victory:0 "Você se lembra que prometeu a eles grandes vitórias militares?"
 ep3_decisions_event.0006.desc_yes:0 "\n\nEu me lembro. E acho que tudo acabou bem!"
 ep3_decisions_event.0006.t:0 "$ep3_decisions_event_triumph$ Cumprindo a Palavra"
 ep3_decisions_event.0007.a.tt:0 "Seu triunfo chega ao fim"
 ep3_decisions_event.0007.a:0 "Viva a glória de [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip]."
 ep3_decisions_event.0007.desc:0 "E com isso, o [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )] foi apaziguado mais uma vez. Meu poder e a legitimidade do meu governo foram reafirmados.\n\n"
 ep3_decisions_event.0007.hagia_sophia:0 "Dentro das paredes sagradas da Hagia Sophia, estou cercado por uma grandeza solene. Os cantos do meu povo sobem em harmonia, ecoando através do vasto espaço sagrado. Aqui, no abraço divino desta maravilha arquitetônica, sinto-me conectado a algo maior do que eu mesmo.\n\nMeu triunfo neste lugar sagrado transcende o mero poder terrestre — é uma união de fé e liderança, um símbolo da bênção divina sobre meu reinado.\n\nEnquanto estou sob a majestosa cúpula, não sou apenas o imperador de Constantinopla, mas um guardião de seu coração espiritual.\n\n\"[Glossary('Hyper tes basileias soterias', 'TRIUMPH_HAGIA_SOPHIA_CONC_GLOSS')],\" eu sussurro."
 ep3_decisions_event.0007.hippodrome:0 "Enquanto me movimento para deixar o Hipódromo, os gritos do meu povo enchem o ar, ecoando nas antigas pedras que testemunharam a glória dos imperadores passados. Sinto o peso da história sobre mim, os olhos de Constantinopla fixos em seu imperador.\n\nHoje, sob o brilho do sol poente, meu triunfo não é apenas uma celebração, mas um testemunho do espírito duradouro e da força do império.\n\n\"[Glossary('Aien aristeuein', 'TRIUMPH_HIPPODROME_CONC_GLOSS')],\" eu sussurro."
 ep3_decisions_event.0007.t:0 "$ep3_decisions_event_triumph$ Conclusão"
 ep3_decisions_event.1000.a.aptitude:0 "[mediocre_charioteer.GetUINamePossessive] [aptitude|E] é [mediocre_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 ep3_decisions_event.1000.a:0 "[mediocre_charioteer.GetFirstNameNoTooltip] merece minha fé... e meu dinheiro."
 ep3_decisions_event.1000.b.aptitude:0 "[good_charioteer.GetUINamePossessive] [aptitude|E] é [good_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 ep3_decisions_event.1000.b:0 "[good_charioteer.GetFirstNameNoTooltip] tem a experiência que estou procurando!"
 ep3_decisions_event.1000.c.aptitude:0 "[stolen_charioteer.GetUINamePossessive] [aptitude|E] é [stolen_charioteer.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 ep3_decisions_event.1000.c:0 "Estou de olho em [stolen_charioteer.GetFirstNameNoTooltip] há algum tempo."
 ep3_decisions_event.1000.d:0 "Pensando bem..."
 ep3_decisions_event.1000.desc.stolen_charioteer:0 "\n\nEu #EMP poderia#! também fazer uma oferta persuasiva para o condutor de [stolen_charioteer.GetEmployer.GetTitledFirstNamePossessive], [stolen_charioteer.GetFirstName]. Talvez [stolen_charioteer.GetSheHe] deseje um empregador mais generoso..."
 ep3_decisions_event.1000.desc:0 "Meus servos trouxeram uma seleção de candidatos para contratar como meu Condutor — aquele que será meu resplandecente representante no Hipódromo.\n\n[mediocre_charioteer.GetFirstName] carece de experiência, mas pode se provar uma escolha positiva. Por outro lado, [good_charioteer.GetFirstName] é um competidor comprovado."
 ep3_decisions_event.1000.t:0 "Meu [GetCourtPositionType('charioteer_court_position').GetNameNoTooltip|U]"
 ep3_decisions_event.1010.a.aptitude:0 "[mediocre_bookmaker.GetUINamePossessive] [aptitude|E] é [mediocre_bookmaker.GetCourtPositionAptitude( GetCourtPositionType( 'bookmaker_court_position' ) )]"
 ep3_decisions_event.1010.a:0 "[mediocre_bookmaker.GetFirstNameNoTooltip] merece minha fé... e meu dinheiro."
 ep3_decisions_event.1010.b.aptitude:0 "[good_bookmaker.GetUINamePossessive] [aptitude|E] é [good_bookmaker.GetCourtPositionAptitude( GetCourtPositionType( 'bookmaker_court_position' ) )]"
 ep3_decisions_event.1010.b:0 "[good_bookmaker.GetFirstNameNoTooltip] tem a experiência que estou procurando!"
 ep3_decisions_event.1010.desc:0 "Meus servos trouxeram uma seleção de candidatos para contratar como meu Agente de Apostas — aquele que gerenciará as apostas e as finanças das corridas de quadrigas no Hipódromo.\n\n[mediocre_bookmaker.GetFirstName] carece de experiência, mas pode se provar uma escolha positiva. Por outro lado, escolher [good_bookmaker.GetFirstName] seria o mais prudente."
 ep3_decisions_event.1010.t:0 "Meu [GetCourtPositionType('bookmaker_court_position').GetNameNoTooltip|U]"
 ep3_decisions_event.2001.a.tt.court:0 "Você recebe [confirmation_vassal.GetTitledFirstName] em seu [royal_court|E]"
 ep3_decisions_event.2001.a.tt:0 "Você recebe [confirmation_vassal.GetTitledFirstName]"
 ep3_decisions_event.2001.a:0 "Arranje a cerimônia imediatamente."
 ep3_decisions_event.2001.b.tt:0 "Você despacha [confirmation_vassal.GetTitledFirstName]"
 ep3_decisions_event.2001.b:0 "Estou muito ocupado para ver #EMP [confirmation_vassal.GetSheHe]#!."
 ep3_decisions_event.2001.desc:0 "Cheguei a [confirmation_liege.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] em busca da sua confirmação da minha nomeação contínua como [confirmation_vassal.GetTitleAsNameNoTooltip] do [confirmation_vassal.GetPrimaryTitle.GetName].\n\nAguardo sua conveniência, é claro."
 ep3_decisions_event.2001.opening:0 "Saudações, glorioso [ROOT.Char.GetTitleAsNameNoTooltip],"
 ep3_decisions_event.2002.a:0 "#EMP O quê?!#!"
 ep3_decisions_event.2002.desc:0 "Receio que estou muito ocupado para realizar uma cerimônia de confirmação neste momento. Muitas responsabilidades disputam meu tempo, como você pode entender.\n\nBoa viagem de volta para [confirmation_vassal.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 ep3_decisions_event.2002.opening:0 "[confirmation_liege.Custom2('AppropriateGreeting', ROOT.Char )]"
 ep3_decisions_event.2010.a:0 "\"Governe bem, [confirmation_vassal.GetTitleAsNameNoTooltip].\""
 ep3_decisions_event.2010.desc:0 "Meus funcionários do palácio se aglomeram na [ROOT.Char.Custom('GetThroneRoom')], onde uma fila interminável de nomeados imperiais aguarda.\n\nO mais notável deles é [confirmation_vassal.GetTitledFirstName] [confirmation_vassal.GetDynastyHouseName], que viajou aqui de [confirmation_vassal.GetCapitalLocation.GetNameNoTooltip]. [Select_CString( confirmation_vassal.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', confirmation_vassal)] governa [confirmation_vassal.GetPrimaryTitle.GetName]:"
 ep3_decisions_event.2010.desc_accepted_faith:0 "— e [ROOT.Char.GetFaith.HouseOfWorshipPlural] de sua fé [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetAdjective]."
 ep3_decisions_event.2010.desc_cool_foreigners:0 "lar de confiáveis, [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetEthos.GetNameNoTooltip|l] [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetCollectiveNoun]"
 ep3_decisions_event.2010.desc_decrepit:0 "\n\nSeus anos como um peso morto nas costas encurvadas [confirmation_vassal.GetHerHim], [confirmation_vassal.GetTitledFirstNameNoTooltip] se esforça para se levantar da suplicação. O ancião enrugado tem muita experiência da qual tirar proveito... e, esperançosamente, ainda alguns bons anos para fazê-lo."
 ep3_decisions_event.2010.desc_generic_outro:0 "\n\n[confirmation_vassal.GetTitledFirstNameNoTooltip] se inclina profundamente, pega seu cetro simbólico de autoridade, jurando servir fielmente [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 ep3_decisions_event.2010.desc_hate:0 "\n\nMesmo olhando para a parte de trás da cabeça de [confirmation_vassal.GetTitledFirstNamePossessiveNoTooltip], posso sentir seu desprezo ardente. [Select_CString( confirmation_vassal.IsFemale, 'A', 'O' )] [confirmation_vassal.GetWomanMan] murmura maldições [second.Custom('quirk_neg_adverb')]... enquanto sonha em me espancar até a morte com seu cetro de ofício."
 ep3_decisions_event.2010.desc_heretic_faith:0 "— ímpios [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetAdjective] hereges!"
 ep3_decisions_event.2010.desc_incompetent:0 "\n\nPor todos os relatos, agora confirmo a nomeação de alguém que administra mal, [second.Custom('quirk_neg_adverb')]. Mas desprezar [confirmation_vassal.GetTitledFirstNameNoTooltip], enquanto [confirmation_vassal.GetSheHe] promete o serviço perfeito que [confirmation_vassal.GetSheHe] não pode dar, será de pouco uso..."
 ep3_decisions_event.2010.desc_love:0 "\n\n[second.Custom('quirk_pos_adverb')|U], [confirmation_vassal.GetTitledFirstNameNoTooltip] realiza os ritos. Pegando seu cetro de ofício, e [second.Custom('quirk_pos_pp')], [second.GetSheHe] jura prestar leal serviço."
 ep3_decisions_event.2010.desc_my_faith:0 "— e alguns bons [ROOT.Char.GetFaith.HouseOfWorshipPlural] da verdadeira fé [ROOT.Char.GetFaith.GetAdjective]."
 ep3_decisions_event.2010.desc_same_culture:0 "lar de provinciais [ROOT.Char.GetCulture.GetCollectiveNoun]"
 ep3_decisions_event.2010.desc_skilled:0 "\n\n[Select_CString( confirmation_vassal.IsFemale, 'A', 'O' )] [confirmation_vassal.GetWomanMan] que se suplicou diante de mim governa com um [confirmation_vassal.Custom('ComplimentAdjective')] toque. Quaisquer que sejam as políticas que [confirmation_vassal.GetSheHe] defenda, quais quer que sejam as mentiras em seu coração: [confirmation_vassal.GetTitledFirstNameNoTooltip] é um crédito para o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_decisions_event.2010.desc_state_faith:0 "e adeptos da fé [ROOT.Char.GetPrimaryTitle.GetAdjective] [confirmation_vassal.GetCapitalLocation.GetCounty.GetFaith.GetName]"
 ep3_decisions_event.2010.desc_theme_balanced:0 "uma região de tamanho razoável de valor multifacetado para o reino,"
 ep3_decisions_event.2010.desc_theme_big:0 "uma jurisdição vasta de grande importância,"
 ep3_decisions_event.2010.desc_theme_civilian:0 "um centro agitado de produção e comércio,"
 ep3_decisions_event.2010.desc_theme_frontier:0 "uma região fronteiriça acidentada e um dos grandes bastiões do reino,"
 ep3_decisions_event.2010.desc_theme_imperial:0 "uma joia do reino com muitos privilégios raros,"
 ep3_decisions_event.2010.desc_theme_military:0 "uma região dominada por alojamentos barulhentos e tropas em treinamento,"
 ep3_decisions_event.2010.desc_theme_naval:0 "uma região costeira de estaleiros e portos,"
 ep3_decisions_event.2010.desc_theme_small:0 "um pequeno enclave de importação menor,"
 ep3_decisions_event.2010.desc_weird_foreigners:0 "lar de estranhos, [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetEthos.GetNameNoTooltip|l] [confirmation_vassal.GetCapitalLocation.GetCounty.GetCulture.GetCollectiveNoun]"
 ep3_decisions_event.2010.desc_young:0 "\n\nMal um jovem de rosto fresco, [confirmation_vassal.GetTitledFirstNameNoTooltip] entoa os ritos com seu cetro de ofício apertado em mãos suaves. Com este, muito ainda precisa ser provado..."
 ep3_decisions_event.2010.t:0 "$admin_confirmation_event_header$ Servo do Império"
 ep3_decisions_event.2011.a:0 "Salve você, [confirmation_liege.GetTitleAsNameNoTooltip]."
 ep3_decisions_event.2011.desc:0 "No [confirmation_liege.Custom('GetThroneRoom')] do palácio principal de [confirmation_liege.GetCapitalLocation.GetTitle.GetNameNoTierPossessive], [confirmation_liege.GetTitledFirstNameRegnal] — regente [confirmation_liege.GetFaith.HighGodNamePossessive] na Terra — senta-se em esplendor.\n\n"
 ep3_decisions_event.2011.desc_child:0 "Aguardando, entre outros altos funcionários, enquanto um jovem com cara de espinha se queixa e se mexe em seu trono é... bastante estranho."
 ep3_decisions_event.2011.desc_gender:0 "Um[Select_CString( confirmation_liege.IsFemale, 'a', '' )] [confirmation_liege.GetWomanMan], entronizada. É bom que nós, funcionários visitantes, sejamos proibidos de olhar para nosso soberano!"
 ep3_decisions_event.2011.desc_hate:0 "O [confirmation_liege.GetTitleAsNameNoTooltip] se dirige a mim [second.Custom('quirk_neg_adverb')]; [confirmation_liege.GetSheHe] derrama desprezo sobre minha cabeça suplicante, enquanto meu manto é balançado acima.\n\n"
 ep3_decisions_event.2011.desc_heretic:0 "O herege que governa o [confirmation_liege.GetPrimaryTitle.GetTierAsName] dos [confirmation_liege.GetCapitalLocation.GetCounty.GetFaith.GetAdherentNamePlural]. Mesmo aqui, em meio aos [confirmation_liege.GetFaith.PriestNeuterPlural] e prelados da corte, o clima é tenso."
 ep3_decisions_event.2011.desc_love:0 "No entanto, a voz do [confirmation_liege.GetTitleAsNamePossessiveNoTooltip] é calorosa e [second.Custom('quirk_pos_adjective')] enquanto [confirmation_liege.GetSheHe] se dirige a mim e apresenta meu manto.\n\n"
 ep3_decisions_event.2011.desc_meh:0 "O [confirmation_liege.GetTitleAsNameNoTooltip] se dirige a cada nomeado por turno, conferindo seus mantos e recebendo juramentos, até que [confirmation_liege.GetSheHe] chegue até mim.\n\n"
 ep3_decisions_event.2011.desc_outro:0 "\n\nEu expresso todas as respostas apropriadas. E, inclinando-me profundamente diante de meu senhor feudal, finalmente pego o cetro da autoridade provincial."
 ep3_decisions_event.2011.desc_poorly_run:0 "E em caos. Criaturas do palácio zombam enquanto nós, funcionários, somos empurrados para o lugar, e poucos rituais são observados."
 ep3_decisions_event.2011.desc_theme_balanced:0 "\"Seu ofício é concedido por [confirmation_liege.GetFaith.HighGodName] e seu [confirmation_liege.GetTitleAsNameNoTooltip],\" diz [confirmation_liege.GetSheHe], \"lembre-se disto e governe [confirmation_vassal.GetPrimaryTitle.GetNameNoTier] bem.\""
 ep3_decisions_event.2011.desc_theme_big:0 "\"Um vasto domínio como [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" diz [confirmation_liege.GetSheHe], entre formalidades, \"uma poderosa besta, a ser domada apenas pelo mestre certo...\""
 ep3_decisions_event.2011.desc_theme_civilian:0 "\"A paz de [confirmation_liege.GetFaith.PositiveAfterLife] pode ainda viver em [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" diz [confirmation_liege.GetSheHe], \"é um jardim, a ser gentilmente cuidado.\""
 ep3_decisions_event.2011.desc_theme_frontier:0 "\"Durma pouco,\" ordena [confirmation_liege.GetSheHe], \"mantenha sua posição. [confirmation_vassal.GetPrimaryTitle.GetNameNoTier] é onde tudo o que é [confirmation_liege.GetPrimaryTitle.GetAdjective] vive ou morre.\""
 ep3_decisions_event.2011.desc_theme_imperial:0 "\"Em [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" diz [confirmation_liege.GetSheHe], \"você deve ser a imagem do [confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip] em si. Poucos, a não ser os ímpios, podem conhecer tais liberdades.\""
 ep3_decisions_event.2011.desc_theme_military:0 "\"Você deve afiar a espada de [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" diz [confirmation_liege.GetSheHe], \"e tê-la empunhada apenas pelos justos.\""
 ep3_decisions_event.2011.desc_theme_naval:0 "\"No sal das costas de [confirmation_vassal.GetPrimaryTitle.GetNameNoTierPossessive],\" diz [confirmation_liege.GetSheHe], \"sinta o sangue deste [confirmation_liege.GetPrimaryTitle.GetTierAsNameNoTooltip]; veja as lágrimas de suas viúvas.\""
 ep3_decisions_event.2011.desc_theme_small:0 "\"Uma jurisdição modesta, [confirmation_vassal.GetPrimaryTitle.GetNameNoTier],\" diz [confirmation_liege.GetSheHe], \"mas digna.\""
 ep3_decisions_event.2011.desc_typical_palace:0 "Sou conduzido a me juntar a uma fila de altos funcionários. Com o clamor de todos, músicos e arautos, nossas grandes cerimônias começam."
 ep3_decisions_event.2011.desc_war:0 "Enquanto nós, funcionários, nos ajoelhamos e nossa cerimônia começa, oficiais militares bufam impacientemente. Sua guerra, parece, não tem consideração por nossas honras."
 ep3_decisions_event.2011.desc_well_run:0 "Uma fila interminável de funcionários aguarda; todos em admiração, todos ansiosos para se ajoelhar diante de nosso soberano."
 ep3_decisions_event.2080.a:0 "Hora de repensar as coisas..."
 ep3_decisions_event.2080.a_court:0 "Avante, para coisas maiores."
 ep3_decisions_event.2080.a_liege:0 "Mais vexatório..."
 ep3_decisions_event.2080.a_prison:0 "Droga."
 ep3_decisions_event.2080.desc.court:0 "Agora que sou [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], minha jornada não é mais necessária..."
 ep3_decisions_event.2080.desc.imprisoned:0 "$ep3_decisions_event.2080_shared_intro$ Fui capturado por [ROOT.Char.GetImprisonedBy.GetTitledFirstName]."
 ep3_decisions_event.2080.desc.imprisoned_me:0 "$ep3_decisions_event.2080_shared_intro$ [ROOT.Char.GetImprisonedBy.GetTitledFirstName] me jogou na prisão."
 ep3_decisions_event.2080.desc.liege_dead:0 "$ep3_decisions_event.2080_shared_intro$ [confirmation_liege.GetTitledFirstName] [confirmation_liege.GetDeathReasonHideKiller]... \n\n"
 ep3_decisions_event.2080.desc.liege_dead_me:0 "$ep3_decisions_event.2080_shared_intro$ Acabei matando [confirmation_liege.GetTitledFirstName]... \n\n"
 ep3_decisions_event.2080.desc.liege_imprisoned:0 "$ep3_decisions_event.2080_shared_intro$ [confirmation_liege.GetTitledFirstName] foi capturado por [confirmation_liege.GetImprisonedBy.GetTitledFirstName]."
 ep3_decisions_event.2080.desc.liege_imprisoned_me:0 "$ep3_decisions_event.2080_shared_intro$ Acabei capturando [confirmation_liege.GetTitledFirstName]!"
 ep3_decisions_event.2080.desc.new_liege:0 "Se eu for confirmado, deve ser por meu novo senhor feudal, [ROOT.Char.GetLiege.GetTitledFirstNameRegnal]."
 ep3_decisions_event.2080.desc:0 "\n\nIsso certamente muda a situação."
 ep3_decisions_event.2080.t:0 "$admin_confirmation_event_header$ Invalidado"
 ep3_decisions_event.2080_shared_intro:0 "Depois de todo o trabalho preparando minha cerimônia de confirmação,"
 ep3_decisions_event.3000.a:0 "Glória a [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 ep3_decisions_event.3000.desc:0 "Excelente trabalho restaurando as terras de [ROOT.Char.GetPrimaryTitle.GetNameNoTier] à sua antiga glória! Estou devidamente impressionado.\n\nNão mais o [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] manchará a reputação do império."
 ep3_decisions_event.3001.a:0 "Que a glória de nosso reino seja conhecida!"
 ep3_decisions_event.3001.desc:0 "Enquanto meu conselho e alguns estrategistas selecionados fornecem notícias sobre o reino, [Select_CString( interlocutor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', interlocutor)] [interlocutor.GetFirstName] fala.\n\n\"Eu seria remisso em não notar, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [interlocutor.Custom2('RelationToMeShort', ROOT.Char)], que os esforços do império para restaurar as terras gregas ao seu status histórico como bastiões da civilização foram bem-sucedidos.\"\n\n\"Os estrategistas se cansaram incansavelmente para desenvolver suas terras e, assim, aumentar a glória de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip|l]!\""
 ep3_decisions_event.3001.not_admin_desc:0 "Enquanto os súditos mais leais trazem notícias sobre o reino, meu [ROOT.Char.Custom2('RelationToMeShort', interlocutor)] [interlocutor.GetFirstName] se manifesta.\n\n\"Não posso deixar de notar, meu [interlocutor.Custom2('RelationToMeShort', ROOT.Char)], que nossos esforços para elevar as terras gregas esquecidas à altura de nossa glória deram frutos.\"\n\n \"Nossos servos mais hábeis trabalharam incansavelmente para desenvolver essas terras e torná-las úteis para [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!\"\n\nEu sorrio. Longe das glórias e fardos do passado, um novo capítulo está sendo escrito."
 ep3_decisions_event.3001.opening:0 "[ROOT.Char.GetTopLiege.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_decisions_event.3001.t:0 "Grécia Restaurada"
 ep3_decisions_event.3100.a:0 "Colocarei Constantinopla para trabalhar."
 ep3_decisions_event.3100.b:0 "Os latinos construirão nossos navios com prazer."
 ep3_decisions_event.3100.c:0 "Construir uma frota que provavelmente irá se queimar? Não."
 ep3_decisions_event.3100.desc:0 "Como [ROOT.Char.GetTitleAsName], devo ser o mestre indiscutível das minhas águas territoriais. Este é um direito concedido por [ROOT.Char.GetFaith.HighGodName], e protegido através de cerco e ataque pelo nosso domínio das chamas de [ROOT.Char.GetFaith.PositiveAfterLife], nossa maestria sobre o fogo líquido.\n\nSe Constantinopla deve ser protegida, nossos estaleiros devem abrigar mais do que navios mercantes indefesos!\n\nOnde estão meus rápidos [Glossary( 'dromons', 'DROMONS_GLOSS' )]? Onde estão os habilidosos artesãos como [Glossary( 'Calínico de Heliópolis', 'KALLINIKOS_GLOSS' )], que forjarão grandes projetores de chamas para lançar faíscas sobre os proas dos meus navios?"
 ep3_decisions_event.3100.t:0 "Naphta, Cal Hidráulica... e Temeridade"
 ep3_decisions_event.3200.a:0 "Casa [pf_1.GetNameNoTooltip]"
 ep3_decisions_event.3200.b:0 "Casa [pf_2.GetNameNoTooltip]"
 ep3_decisions_event.3200.c:0 "Casa [pf_3.GetNameNoTooltip]"
 ep3_decisions_event.3200.d:0 "Casa [pf_4.GetNameNoTooltip]"
 ep3_decisions_event.3200.desc:0 "Como um bando de lobos cercando sua presa, as casas poderosas do reino me perseguem. Posso sentir a corda apertando ao meu redor.\n\nPrender uma família lembrará as outras da minha autoridade. Um exemplo deve ser feito..."
 ep3_decisions_event.3200.e:0 "Casa [pf_5.GetNameNoTooltip]"
 ep3_decisions_event.3200.f:0 "Por outro lado..."
 ep3_decisions_event.3200.t:0 "Prisão em Massa"
 ep3_decisions_event.3201.a:0 "Não sou nada se não for misericordioso."
 ep3_decisions_event.3201.b:0 "Não."
 ep3_decisions_event.3201.desc:0 "[imprisoned_house_head.GetName] é trazid[Select_CString( imprisoned_house_head.IsFemale, 'a', 'o' )] diante de mim algemad[Select_CString( imprisoned_house_head.IsFemale, 'a', 'o' )]. O uma vez influente cabeça da Casa [imprisoned_house_head.GetHouse.GetName] se ajoelha diante de mim, sua expressão refletindo uma mistura de desafio e desespero.\n\n\"Sua Majestade,\" [imprisoned_house_head.GetSheHe] começa, a voz rachada de vergonha, \"imploro-lhe, liberte-me dessas correntes. A ambição cega, mas agora vejo onde é o meu verdadeiro lugar.\"\n\n\"Conceda-me misericórdia, e eu juro ser seu mais leal súdito, despojado do meu antigo orgulho.\""
 ep3_decisions_event.3201.t:0 "Prisão em Massa: Um Apelo"
 ep3_decisions_event.4000.a:0 "Um dia glorioso para os romanos em toda parte!"
 ep3_decisions_event.4000.desc:0 "Durante séculos, a Segunda Roma — nossa gloriosa Bizâncio — tem recuado, perdendo Província após Província, mas não mais!\n\nHoje é um dia de celebração, pois a [Glossary( 'Pars Orientis', 'PARS_ORIENTIS_GLOSS' )] foi retornada à sua antiga glória e extensão. Assim como quando [GetScriptedCharacterByHistoryID( '70534' ).GetFirstName] o Grande a designou para seu primogênito, o reinado de Constantinopla se estende da Mésia ao Egito, e da Cirenaica à Síria.\n\nUm império unificado para um [ROOT.Char.GetTitleAsNameNoTooltip] vitorioso!"
 ep3_decisions_event.4000.t:0 "As Fronteiras de Teodósio"
 ep3_decisions_event.4010.a:0 "Nós ajudaremos você — pela motivação certa!"
 ep3_decisions_event.4010.b.tt:0 "[ROOT.Char.GetTitledFirstNameNoTooltip] pede ao seu Chefe da Fé"
 ep3_decisions_event.4010.b.tt_2:0 "Apenas [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] pode decidir que tipo de ajuda a cristandade pode oferecer a seus irmãos extraviados."
 ep3_decisions_event.4010.b:0 "Devemos deferir você à autoridade de [ROOT.Char.GetFaith.GetReligiousHeadTitle.GetNameNoTooltip]."
 ep3_decisions_event.4010.c.tt:0 "[called.GetTitledFirstNameNoTooltip|U] recusou ajuda"
 ep3_decisions_event.4010.c:0 "Desculpe, não podemos ajudar você."
 ep3_decisions_event.4010.desc:0 "[called.Custom('SisterBrother')|U] em Cristo, nossa posição como o baluarte oriental do cristianismo está em perigo, pois a atual guerra contra os infiéis colocou uma pressão sobre nossos recursos.\n\nPor favor, ajude-nos a repelir o inimigo comum."
 ep3_decisions_event.4010.t:0 "[caller.Custom2('AppropriateGreeting', called )]"
 ep3_decisions_event.4011.b:0 "Se você prometer apoiá-los, o Exército de Cristo marchará com você!"
 ep3_decisions_event.4011.c:0 "Não podemos ajudar os fiéis extraviados."
 ep3_decisions_event.4012.a.tt:0 "[pope.GetTitledFirstNameNoTooltip] enviará ajuda"
 ep3_decisions_event.4012.a:0 "Nós ajudaremos, mas não de graça."
 ep3_decisions_event.4012.b.tt:0 "[pope.GetTitledFirstNameNoTooltip] pode convocar uma [pope.GetFaith.GHWName]!"
 ep3_decisions_event.4012.b:0 "Se eles prometerem apoio, o Exército de Cristo marchará com eles!"
 ep3_decisions_event.4012.desc:0 "Recebi um pedido de ajuda de [caller.GetTitledFirstName]. Embora extraviados em suas crenças, seu povo ainda é nosso irmão e irmã em Cristo, e atuaram como o baluarte oriental do cristianismo.\n\nHá alguma maneira de estendermos uma mão útil a eles?"
 ep3_decisions_event.4012.t:0 "[sponsor.Custom2('AppropriateGreeting', called )]"
 ep3_decisions_event.4013.a.tt:0 "Você promete enviar @gold_icon![caller.MakeScope.ScriptValue('massive_gold_value')|V0] para o cofre de guerra da [pope.GetFaith.GHWName] ."
 ep3_decisions_event.4013.a:0 "Aceito sua oferta."
 ep3_decisions_event.4013.b.tt:0 "[caller.GetTitledFirstNameNoTooltip|U] se retirou"
 ep3_decisions_event.4013.b:0 "Isso não é o que eu pedi!"
 ep3_decisions_event.4013.desc:0 "Ouvimos o pedido de nossos irmãos e irmãs em Cristo e desejamos ajudar. Se você prometer seu apoio, os exércitos do cristianismo se unirão em sua defesa em uma [pope.GetFaith.GHWName] sagrada!"
 ep3_decisions_event.4013.t:0 "[called.Custom2('AppropriateGreeting', caller )]"
 ep3_decisions_event.4014.a.tt:0 "[pope.GetTitledFirstNameNoTooltip] convocou uma [pope.GetFaith.GHWName]!"
 ep3_decisions_event.4014.a:0 "#EMP Deus Vult!#!"
 ep3_decisions_event.4014.desc:0 "Com um coração grato, aceitamos sua oferta de ajuda e aguardamos ansiosamente a chegada dos exércitos de apoio.\n\nPor favor, apresse-se."
 ep3_decisions_event.4015.a.tt:0 "[caller.GetTitledFirstNameNoTooltip|U] aceitou sua oferta"
 ep3_decisions_event.4015.a:0 "Assim seja."
 ep3_decisions_event.4015.b:0 "Não pedi por condições."
 ep3_decisions_event.4015.desc:0 "Ouvimos o pedido de nossos irmãos e irmãs em Cristo, e nossos corações sangram por seus sofrimentos. No entanto, a ajuda não vem barata.\n\nSe você puder apoiar nossos esforços com uma compensação monetária, prometemos enviar tropas em seu auxílio."
 ep3_decisions_event.4020.a.tt:0 "[evangelizer.GetFirstNameNoTooltip] parte para a capital de [pagan.GetTitledFirstNamePossessiveNoTooltip]."
 ep3_decisions_event.4020.a:0 "Que [ROOT.Char.GetFaith.HighGodName] te guie!"
 ep3_decisions_event.4020.desc:0 "O Reino dos Céus pertence aos fiéis, mas nosso vizinho, [pagan.GetTitledFirstName], está completamente alheio a isso e persiste em acreditar em suas superstições e falsos deuses.\n\nSalvar a alma [pagan.GetHerHim] e a de seu povo é um empreendimento nobre por si só, mas também existem #EMP vantagens#! terrenas em sua conversão — para começar, reduzindo sua hostilidade em relação a nós e trazendo-os para nossa própria esfera de influência.\n\nMeu missionário escolhido, [evangelizer.GetFirstName], está pronto para partir."
 ep3_decisions_event.4020.t:0 "Evangelizando os [pagan.GetCulture.GetCollectiveNounNoTooltip]"
 ep3_decisions_event.4022.a.tt:0 "Você cria uma [alliance|E] com o senhor feudal de [evangelizer.GetTitledFirstNamePossessiveNoTooltip], [sender.GetTitledFirstName]"
 ep3_decisions_event.4022.a:0 "Por favor, me conte mais."
 ep3_decisions_event.4022.b:0 "Não precisamos de novos deuses."
 ep3_decisions_event.4022.c.tt:0 "Isso certamente enviará uma mensagem: seus pregadores não são bem-vindos aqui! Mas devemos estar prontos para represálias..."
 ep3_decisions_event.4022.c:0 "Blasfêmia ridícula!"
 ep3_decisions_event.4022.desc:0 "Emissários de nossos vizinhos vão e vêm com frequência suficiente para que todos se misturem em minha mente. No entanto, o enviado de hoje de [GetTitleByKey('e_byzantium').GetName] se destaca como nenhum outro.\n\n[evangelizer.GetSheHe|U] parece ser algum tipo de [evangelizer.GetWomanMan] sagrad[Select_CString( evangelizer.IsFemale, 'a', 'o' )], para começar, e em vez de avançar com demandas políticas, este [evangelizer.GetFirstName] prega sobre um Deus onipotente, honrado em templos de ouro e prata que sempre cheiram a incenso."
 ep3_decisions_event.4023.a:0 ""
 ep3_decisions_event.4023.desc:0 ""
 ep3_decisions_event.4023.t:0 ""
 ep3_decisions_event.4025.a.tt:0 "Você cria uma [alliance|E] com o recém-convertido [pagan.GetTitledFirstName]."
 ep3_decisions_event.4025.a:0 "Excelente!"
 ep3_decisions_event.4025.b:0 "É apenas um retrocesso temporário."
 ep3_decisions_event.4025.desc_failure:0 "\n\n\"Trago notícias sombrias, meu senhor feudal. Infelizmente, [pagan.GetTitledFirstName] foi muito indiferente à Palavra de Deus e me mandou embora de mãos vazias.\""
 ep3_decisions_event.4025.desc_new:0 "Meu predecessor [sender.GetFirstName] investiu na evangelização dos [pagan.GetCulture.GetCollectiveNounNoTooltip], mas, infelizmente para [sender.GetSheHe], sou eu quem colherá os benefícios dos esforços [sender.GetHerHim]. O missionário [evangelizer.GetFirstName], na verdade, acaba de retornar."
 ep3_decisions_event.4025.desc_old:0 "Meses atrás, enviei meu confiável [evangelizer.GetFirstName] para trazer o conhecimento de Deus aos [pagan.GetCulture.GetCollectiveNounNoTooltip]. É com grande alegria que recebo [sender.GetSheHe] de volta hoje, pois estava ansiosamente aguardando o relatório [evangelizer.GetHerHim]."
 ep3_decisions_event.4025.desc_success:0 "\n\n\"Trago grandes notícias, meu senhor feudal! [pagan.GetTitledFirstName|U] estava ansioso para ouvir as Boas Novas e se converteu ao [evangelizer.GetFaith.GetName], acompanhado por muitos de seu povo.\""
 ep3_decisions_event.4026.a:0 "Escandaloso!"
 ep3_decisions_event.4026.desc:0 "Notícias terríveis!\n\nChegou a notícia da terra dos [pagan.GetCulture.GetCollectiveNounNoTooltip] e, aparentemente, meu missionário [evangelizer.GetFirstName] foi morto pelo bárbaro [pagan.GetTitledFirstName], que não se satisfez em rejeitar qualquer tentativa de conversão, mas foi tão longe a ponto de cometer a última profanação e assassinar um[Select_CString( evangelizer.IsFemale, 'a', '' )] [evangelizer.GetWomanMan] de Deus!"
 ep3_decisions_event.4030.a:0 "A glória de Roma continuará a crescer!"
 ep3_decisions_event.4030.desc:0 "Pela morte dos fiéis, pelo fogo da retórica, pela própria vontade de [ROOT.Char.GetFaith.HighGodName] — #EMP [GetTitleByKey('e_byzantium').GetName|U] vive novamente!#!\n\nEu olho sobre a Rainha das Cidades, uma brisa quente do Mar de Mármara brincando com minhas vestes reais. Canções belas ecoam da grande casa da Santa Sabedoria. Cidadãos dançam nas ruas, expressando gratidão e alegria.\n\nNossos dias de vergonha, com todo o mundo desprezando os caídos [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )], devem certamente ter chegado ao fim. Um legítimo [ROOT.Char.GetTitleAsNameNoTooltip] se senta novamente no trono de [GetScriptedCharacterByHistoryID( '70523' ).GetFirstName].\n\n#EMP Eu.#!"
 ep3_decisions_event.4030.t:0 "Um Império Renascente"
 ep3_decisions_event.4040.a:0 "Que eles comam pão!"
 ep3_decisions_event.4040.desc:0 "O povo tem todo motivo para celebrar com o retorno da antiga e amada tradição da Doação de Grãos para [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]!\n\nMais uma vez, a capital do mundo, graças aos esforços de #EMP meu#!, [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] recebe um fluxo constante de grãos baratos do Egito, assim como acontecia séculos atrás.\n\nE como disse o antigo poeta de forma acertada, tudo o que precisamos para manter o povo comum feliz são pão e jogos!"
 ep3_decisions_event.4040.t:0 "A Distribuição de Grãos"
 ep3_decisions_event.4050.a:0 "Eu gostaria que fosse #EMP longo#!."
 ep3_decisions_event.4050.b:0 "Sou um ávido defensor da prosperidade."
 ep3_decisions_event.4050.c:0 "Apenas lembre-se de quem #EMP você#! serve."
 ep3_decisions_event.4050.desc.hate:0 "[head_of_faith.GetTitledFirstName] me olha com grande desagrado — a única coisa que impede os insultos rugindo de deixarem a boca [head_of_faith.GetHerHim] é a mais básica etiqueta."
 ep3_decisions_event.4050.desc.intro:0 "A calma do [ROOT.Char.GetFaith.HouseOfWorship] foi perturbada por uma horda de cortesãos, governadores e camponeses, todos reunidos aqui para celebrar... #EMP eu!#!\n\n"
 ep3_decisions_event.4050.desc.other:0 "O [head_of_faith.GetTitledFirstName] me gesticula, um sorriso acolhedor no rosto [head_of_faith.GetHerHim], e me aproximo [head_of_faith.GetHerHim]. '[Select_CString( ROOT.Char.IsFemale, 'Minha mais querida', 'Meu mais querido' )] [ROOT.Char.GetTitleAsNameNoTooltip],' [head_of_faith.GetSheHe] me cumprimenta."
 ep3_decisions_event.4050.desc.outro:0 "\n\n'Hoje agradecemos a [ROOT.Char.GetFaith.HighGodName] por ter um protetor tão bondoso vigiando sobre nós,' [head_of_faith.GetSheHe] continua, dirigindo-se à multidão, 'que o reinado [ROOT.Char.GetHerHim] seja longo e próspero!'"
 ep3_decisions_event.4050.t:0 "Regra: Consolidada"
 ep3_decisions_event.4060.a:0 "A lei agora governa estas terras!"
 ep3_decisions_event.4060.de_jure.desc:0 "Algumas partes do reino permanecem intocadas por essa reforma. O [non_de_jure_vassal.GetPrimaryTitle.GetNameNoTooltip|U] está fora do novo estado que construímos. Isso não podemos tolerar por muito tempo.\n\n"
 ep3_decisions_event.4060.desc:0 "Reorganizar um reino do tamanho de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l] não é uma tarefa pequena. O que antes era uma rede de lealdades pessoais agora é um estado com governadores e oficiais.\n\n"
 ep3_decisions_event.4060.outro.desc:0 "À medida que o legalismo se espalha pelo reino, sem dúvida, as noções de família e vassalagem cederão lugar ao orgulho cívico e à centralização."
 ep3_decisions_event.4060.resistance.desc:0 "Algumas partes do reino permanecem intocadas por essa reforma. [obstinate_vassal.GetName] desconfia tanto de mim quanto das minhas reformas. Isso não podemos tolerar por muito tempo.\n\n"
 ep3_decisions_event.4060.state_faith.desc:0 "Algumas partes do reino permanecem intocadas por essa reforma. [non_state_faith_vassal.GetName] desconfia da própria ideia de uma fé estatal e rejeita minhas reformas. Isso não pode ser tolerado por muito tempo.\n\n"
 ep3_decisions_event.4060.t:0 "$major_decisions.0001.t$"
 ep3_decisions_event.4065.a:0 "Por [actor.GetPrimaryTitle.GetNameNoTierNoTooltip|l]!"
 ep3_decisions_event.4065.b:0 "Não abrirei mão dos meus direitos."
 ep3_decisions_event.4065.c:0 "Interessante"
 ep3_decisions_event.4065.desc:0 "O reino está sendo reorganizado, com o mérito como princípio orientador. Não há mais espaço para detentores de terras hereditárias.\nEspero que cada vassalo se conforme e se junte às fileiras dos meus Governadores."
 ep3_decisions_event.4065.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_decisions_event.4070.a:0 "Devemos nos adaptar às circunstâncias em mudança."
 ep3_decisions_event.4070.desc:0 "Às vezes, é melhor voltar ao que é testado e comprovado.\n\nEmbora a abordagem administrativa tenha apenas atrapalhado [actor.GetPrimaryTitle.GetNameNoTierNoTooltip|l], os velhos modos de vida têm seus benefícios inegáveis e uma estrutura tradicional para nos ajudar a alcançar novas alturas."
 ep3_decisions_event.4070.t:0 "$major_decisions.0200.t$"
 ep3_decisions_event.4075.a:0 "$ep3_decisions_event.4065.a$"
 ep3_decisions_event.4075.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_decisions_event.4080.a:0 "O culminar do meu trabalho, e de tantos outros."
 ep3_decisions_event.4080.desc.intro:0 "Está quase concluído. Um lugar permanente para poetas se reunirem, interagirem e formarem a próxima geração está sendo construído diante dos meus olhos.\n\n"
 ep3_decisions_event.4080.desc.outro:0 "um centro próspero e movimentado para as artes aqui em [location.GetName], está finalmente se concretizando.\n\nÀ medida que as últimas tábuas de madeira são colocadas para o piso, o cheiro de tijolos recém-pintados paira pelo pátio. Um grito se ergue das multidões que assistem enquanto eu trago crianças órfãs locais para começar suas aulas.\n\nTudo o que desejo é que permaneça de pé agora por gerações."
 ep3_decisions_event.4080.heir:0 "O sonho do meu mentor,"
 ep3_decisions_event.4080.t:0 "Salão Estabelecido"
 ep3_decisions_event.4080.wallada:0 "Meu sonho,"
 ep3_decisions_event.4090.a:0 "Estarei em busca de oportunidades."
 ep3_decisions_event.4090.a_merit:0 "Estarei estudando."
 ep3_decisions_event.4090.desc:0 "Além dos muros da propriedade, crianças gritam enquanto brincam, carroças rangem ao passar e comerciantes anunciam suas mercadorias.\n\nServi a [liege.GetTitledFirstName] por tempo suficiente.\n\nEssas paredes não vão se construir sozinhas — e uma casa precisa de bases sólidas, mais do que qualquer outra coisa."
 ep3_decisions_event.4090.t:0 "Um Passo Para Atrás"
 ep3_decisions_event.5000.a:0 "Obrigado."
 ep3_decisions_event.5000.desc:0 "[local_artisan.GetFirstName], o pintor a quem confiei a encomenda do ícone, retornou ao tribunal para me oferecer o fruto do trabalho [local_artisan.GetHerHim].\n\n\"[ROOT.Char.GetFaith.HighGodName]-abençoado [ROOT.Char.GetTitleAsNameNoTooltip], humildemente apresento-lhe este ícone sagrado que pintei, segundo a tradição e as habilidades que [ROOT.Char.GetFaith.HighGodNameAlternate] me deu. Que ele sempre inspire você no caminho da devoção e retidão.\""
 ep3_decisions_event.5000.t:0 "Ícone Realizado"
 ep3_decisions_event.5001.a:0 "\"E ainda não ajudei o suficiente.\""
 ep3_decisions_event.5001.b:0 "\"Posso oferecer #EMP numerosos#! tipos de ajuda.\""
 ep3_decisions_event.5001.desc.intro:0 "\"O mais nobre de sua espécie,\" a voz de [adoring_fan.GetFirstNamePossessiveNoTooltip] me surpreende. \"Estive procurando por você em todos os lugares.\"\n\n\"Estão contando histórias sem sentido sobre você no acampamento,\" [adoring_fan.GetSheHe] solta uma risada,"
 ep3_decisions_event.5001.desc.spouse:0 "\"O mais nobre de sua espécie,\" a voz de meu querido [adoring_fan.GetFirstNamePossessiveNoTooltip] é seguida por um beijo suave em meu ombro. \"Estive procurando por você em todos os lugares.\"\n\n\"Estão contando histórias sem sentido sobre você no acampamento,\" [adoring_fan.GetSheHe] se inclina para sussurrar,"
 ep3_decisions_event.5001.desc:0 "\"dizem que você uma vez atravessou uma ponte feita de espadas, que entrou em uma floresta encantada onde resgatou um[Select_CString( dummy_opposite_gender.IsFemale, 'a', '' )] [dummy_opposite_gender.GetWomanMan] just[Select_CString( dummy_opposite_gender.IsFemale, 'a', 'o' )]... que um maravilhoso [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')] lhe deu seu casaco milagroso.\"\n\n[adoring_fan.GetSheHe|U] sinaliza para um servo trazer uma armadura perlada.\n\n\"Um presente, de todos aqueles que você ajudou.\""
 ep3_decisions_event.5001.t:0 "O $knight_culture_player_no_tooltip$ do [ROOT.Char.CustomFixedRandom('GetKnightErrantAnimal')|U]"
 ep3_decisions_event.5002.a:0 "\"Talvez seja hora de me estabelecer...\""
 ep3_decisions_event.5002.b:0 "\"Não tenho tempo para [my_rival.GetWomenMen] desonrosos.\""
 ep3_decisions_event.5002.desc:0 "\"Eu não imaginaria que você sofreria tal desgraça passivamente.\" Um cavalo para bem ao lado do nosso acampamento. Reconheço seu cavaleiro como meu #EMP [Select_CString( my_rival.IsFemale, 'cara', 'caro' )]#! [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_rival'))], [my_rival.GetTitledFirstName].\n\n\"O que aconteceu com você? Brincando de $knight_culture_player_plural_no_tooltip_lowercase$, fingindo viver em um conto de fadas,\" [my_rival.GetSheHe] desmonta, cuspindo no chão.\n\n\"Quando você vai voltar a seus sentidos? Arranje-se alguma terra, antes de continuar a desonrar o bom nome da nossa família.\""
 ep3_decisions_event.5002.t:0 "Uma Desgraça para a Família"
 ep3_decisions_event.5010.a.aptitude:0 "[mediocre_eunuch.GetUINamePossessive] [aptitude|E] é [mediocre_eunuch.GetCourtPositionAptitude( GetCourtPositionType( 'chief_eunuch_court_position' ) )]"
 ep3_decisions_event.5010.a:0 "[mediocre_eunuch.GetFirstNameNoTooltip] tem a atitude certa!"
 ep3_decisions_event.5010.b.aptitude:0 "[good_eunuch.GetUINamePossessive] [aptitude|E] é [good_eunuch.GetCourtPositionAptitude( GetCourtPositionType( 'chief_eunuch_court_position' ) )]"
 ep3_decisions_event.5010.b:0 "[good_eunuch.GetFirstNameNoTooltip] me inspira mais confiança."
 ep3_decisions_event.5010.desc:0 "Meus servos procuraram longe e perto por um digno $chief_eunuch_court_position$ para se juntar ao meu tribunal.\n\nDois candidatos, em particular, chamaram minha atenção: [mediocre_eunuch.GetFirstName] está ferozmente determinado a provar seu valor, mas [good_eunuch.GetFirstName] parece ser mais habilidoso."
 ep3_decisions_event.5010.t:0 "Um [GetCourtPositionType('chief_eunuch_court_position').GetNameNoTooltip|U] Digno"
 ep3_decisions_event.5020.a:0 "[heresy_1.GetNameNoTooltip|U] é o caminho."
 ep3_decisions_event.5020.b:0 "Talvez [heresy_2.GetNameNoTooltip] pareça mais promissora?"
 ep3_decisions_event.5020.c:0 "[heresy_3.GetNameNoTooltip|U] tem o maior potencial."
 ep3_decisions_event.5020.d:0 "Talvez eu esteja sendo precipitado..."
 ep3_decisions_event.5020.desc:0 "A oportunidade é clara, e eu só preciso aproveitá-la.\n\nA fé [heresy_1.GetAdjective|U] está em ascensão em [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTooltip] e precisa de um guia forte e influente para representá-la no palco político. Claro, colocar-me na posição de ser considerado um herege é um risco, mas o potencial inexplorado de reunir uma minoria perseguida em torno de uma bandeira compartilhada é tentador."
 ep3_decisions_event.5020.desc_more:0 "\n\nA cena religiosa do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] é tão fragmentada que não preciso me limitar à minha primeira escolha também."
 ep3_decisions_event.5020.t:0 "Abraçando a Heresia"
 ep3_decisions_event.5021.a.tt:0 "Fé do Estado Alterada"
