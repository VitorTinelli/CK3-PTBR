 convert_to_administrative_decision_tooltip_multiple:0 "Transforme [government|E] em um [government_bureaucratic_gov|E] de sua escolha"
 convert_to_administrative_japanese_desc:0 "Você #bold não#! cumpre ao menos um dos seguintes requisitos:\n$EFFECT_LIST_BULLET$O [government|E] [top_liege_possessive|E] é [GetGovernment('japan_administrative_government').GetName] ou [GetGovernment('japan_feudal_government').GetName]\n$EFFECT_LIST_BULLET$Seu [government|E] é [GetGovernment('japan_feudal_government').GetName]"
 convert_to_administrative_meritocratic_desc:0 "Você #bold não#! cumpre pelo menos um dos seguintes:\n$EFFECT_LIST_BULLET$Seu [realm|E] faz fronteira com um [ruler|E] com um [government|E] usando [merit|E]\n$EFFECT_LIST_BULLET$Sua [capital|E] está localizada em [GetGeographicalRegion('world_asia').GetName], [GetGeographicalRegion('world_tibet').GetName], [GetGeographicalRegion('world_burma').GetName] ou [GetGeographicalRegion('world_steppe_east').GetName]"
