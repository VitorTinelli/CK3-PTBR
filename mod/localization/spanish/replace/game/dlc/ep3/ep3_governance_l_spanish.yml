l_spanish:
 AUREUS_GLOSS:0 "O aureus era uma moeda de ouro emitida regularmente da Última República Romana até o início do século IV d.C., quando foi substituída pelo solidus. Originalmente, um aureus valia 25 denários de prata, mas, devido à inflação desenfreada do Império Tardio, o novo solidus valia toda uma fortuna de 275000 denários!"
 SCHEME_TIER_DIFFICULTY:0 "[task_contract_tier|E]: $VALUE|+=0$"
 admin_contract_failure_tt:0 "Você pode sofrer penalidades menores, como perder [prestige_i|E][prestige|E] ou [influence_i|E][influence|E]"
 admin_contract_invalidated_desc:0 "Ongoing [governance_issue|E] foi invalidado"
 admin_contract_invalidated_title:0 "[GetPlayer.Custom('GetContractOrIssue')] Invalidado"
 admin_contract_merit_bullet:0 "\n$EFFECT_LIST_BULLET$[merit_i|E][merit|E]"
 admin_contract_success_tt_rewards:0 "Você pode escolher entre uma variedade de recompensas, incluindo:#indent_newline:3 \n$EFFECT_LIST_BULLET$$admin_contract_success_tt_xp$\n$EFFECT_LIST_BULLET$[gold_i|E][gold|E]\n$EFFECT_LIST_BULLET$[influence_i|E][influence|E]\n$EFFECT_LIST_BULLET$[prestige_i|E][prestige|E]\n$EFFECT_LIST_BULLET$[piety_i|E][piety|E]\n$EFFECT_LIST_BULLET$Melhorias em seus [counties|E] ou [holdings|E][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_has_merit' ), 'admin_contract_merit_bullet' )]#!"
 admin_contract_success_tt_trait:0 "Você pode ganhar o [trait|E] [GetTrait('governor').GetName( GetNullCharacter )]"
 admin_contract_success_tt_xp:0 "[trait_level_track_xp|E] no [trait|E] [GetTrait('governor').GetName( GetNullCharacter )]"
 admin_request_choose_opportunity:0 "Esta situação permite que você escolha um resultado"
 administrator_trait_desc:0 "[trait|E] [GetTrait('administrator').GetName( GetNullCharacter )]: $VALUE|=+0$"
 bountiful_harvest_contract:0 "Colheita Abundante"
 bountiful_harvest_desc:0 "Relatos de abundância maravilhosa, de culturas altas e campos verdejantes, chegam de toda a [GetPlayer.Custom('GetProvinceConceptNoTooltip')]. Um benefício tão significativo deve ser bem utilizado. Não deixe as colheitas estragarem!"
 bountiful_harvest_desc_title:0 "$task_contract_governance_desc_title$"
 bountiful_harvest_request:0 "$admin_request_choose_opportunity$"
 buried_treasure:0 "Tesouro Enterrado"
 buried_treasure_contract:0 "$buried_treasure$"
 buried_treasure_desc:0 "Um camponês local encontrou um tesouro de ouro enterrado, e uma disputa surgiu sobre a quem ele pertence."
 buried_treasure_desc_title:0 "$task_contract_governance_desc_title$"
 buried_treasure_request:0 "$admin_request_choose_opportunity$"
 discontent_soldiers:0 "Soldados Descontentes"
 discontent_soldiers_contract:0 "$discontent_soldiers$"
 discontent_soldiers_desc:0 "O descontentamento se espalha entre suas tropas. Os guardas murmuram em seus postos. Oficiais menores pouco se importam com a disciplina."
 discontent_soldiers_desc_title:0 "$task_contract_governance_desc_title$"
 discontent_soldiers_request:0 "$admin_request_choose_opportunity$"
 ep3_abundant_game_modifier:0 "Caça Abundante"
 ep3_abundant_game_modifier_desc:0 "A caça é abundante nesta área, tornando as caçadas mais bem-sucedidas."
 ep3_better_paid_soldiers_modifier:0 "Tropas Incentivadas"
 ep3_better_paid_soldiers_modifier_desc:0 "Este personagem é conhecido por pagar suas tropas mais do que o necessário, e tropas felizes são tropas eficazes."
 ep3_church_investigation_modifier:0 "Investigação da Igreja"
 ep3_church_investigation_modifier_desc:0 "A Igreja se envolveu em uma investigação sobre potenciais usuários de magia demoníaca."
 ep3_contract_infrastructure_modifier:0 "Infraestrutura em Desenvolvimento"
 ep3_contract_infrastructure_modifier_desc:0 "Estradas, estações de mensageiros, fornecimento de água, e tudo o que um condado precisa para crescer."
 ep3_doom_repressed_modifier:0 "Culto do Profeta Perseguido"
 ep3_doom_repressed_modifier_desc:0 "Um culto do apocalipse liderado por um profeta louco foi erradicado pela força."
 ep3_ferocious_pets_modifier:0 "Animais de Estimação Feroces"
 ep3_ferocious_pets_modifier_desc:0 "Este personagem desenvolveu um gosto caro por animais de estimação ferozes."
 ep3_food_distribution_modifier:0 "Distribuição de Alimentos"
 ep3_food_distribution_modifier_desc:0 "Um superávit de dinheiro no governo local foi utilizado para importar alimentos baratos para a população em geral."
 ep3_governance_festivities:0 "Festividades Organizadas"
 ep3_governance_festivities_desc:0 "Um oficial local foi #EMP persuadido#! a hospedar uma série de feiras e festivais."
 ep3_governance_great_harvest:0 "Grande Distribuição de Grãos"
 ep3_governance_great_harvest_desc:0 "Este condado está se beneficiando de uma significativa distribuição de grãos, organizada pelo governador local."
 ep3_governance_harvest:0 "Distribuição de Grãos"
 ep3_governance_harvest_desc:0 "Este condado está se beneficiando da distribuição de grãos ao povo, a pedido do governador local."
 ep3_governance_infrastructure:0 "Infraestrutura Melhorada"
 ep3_governance_infrastructure_desc:0 "Um oficial local gastou muitos fundos para melhorar a infraestrutura da área."
 ep3_governance_mercenary_troops:0 "Tropas Mercenárias"
 ep3_governance_mercenary_troops_desc:0 "Este personagem recrutou um número de ex-bandidos como mercenários, apesar do que outros possam pensar."
 ep3_governance_rampant_bandits:0 "Bandidos Rampantes"
 ep3_governance_rampant_bandits_desc:0 "Este condado é assombrado por bandidos; atacantes violentos contra viajantes e mercadores são comuns."
 ep3_governance_stationed_troops:0 "Guarnição Reforçada"
 ep3_governance_stationed_troops_desc:0 "Por ordem do governador, esta localidade possui uma guarnição reforçada para garantir um ambiente produtivo."
 ep3_governance_tax_relief:0 "Alívio Fiscal"
 ep3_governance_tax_relief_desc:0 "Este condado recebeu um alívio fiscal do governador da região, para satisfação da população local."
 ep3_governance_workforce:0 "Força de Trabalho Recrutada"
 ep3_governance_workforce_desc:0 "Este condado possui um grande número de pessoas recrutadas para uma força de trabalho que serve à comunidade."
 ep3_invested_military_modifier:0 "Militar Aprimorado"
 ep3_invested_military_modifier_desc:0 "Uma quantidade significativa de ouro foi investida nas tropas estacionadas neste condado."
 ep3_land_confiscate_modifier:0 "Terras Confiscadas"
 ep3_land_confiscate_modifier_desc:0 "Este é o lugar perfeito para expandir minha propriedade!"
 ep3_lands_reinstated_modifier:0 "Pequenos Proprietários"
 ep3_lands_reinstated_modifier_desc:0 "A presença de pequenos proprietários foi reinstalada na área."
 ep3_local_practices_modifier:0 "Práticas Tradicionais Mantidas"
 ep3_local_practices_modifier_desc:0 "O governador local apoiou abertamente as práticas tradicionais — alguns as chamam de superstições — para lidar com demônios."
 ep3_longer_breaks_province_modifier:0 "Tropas em Descanso"
 ep3_longer_breaks_province_modifier_desc:0 "As tropas estacionadas nesta província receberam períodos de descanso mais longos para aumentar a moral."
 ep3_mismanaged_administration_modifier:0 "Incompetência na Administração"
 ep3_mismanaged_administration_modifier_desc:0 "Um dos principais centros deste condado está tão mal administrado que toda a área está sofrendo."
 ep3_peasant_border_raids_modifier:0 "Incursões Fronteiriças dos Camponeses"
 ep3_peasant_border_raids_modifier_desc:0 "Os camponeses locais se armaram e estão ativamente protegendo suas fronteiras."
 ep3_peasant_workers_modifier:0 "De Volta aos Campos"
 ep3_peasant_workers_modifier_desc:0 "A milícia local foi desmobilizada e os camponeses enviados de volta aos campos."
 ep3_rationalist_gov_modifier:0 "Racionalista"
 ep3_rationalist_gov_modifier_desc:0 "Este personagem tem a reputação de valorizar a razão acima da religião, uma opinião um tanto impopular."
 ep3_rebuild_effort_modifier:0 "Esforço de Rebuild"
 ep3_rebuild_effort_modifier_desc:0 "O governador local está focando na reconstrução desta área após ter sido duramente atingida por uma epidemia."
 ep3_religious_debate_modifier:0 "Debate Religioso Vencido"
 ep3_religious_debate_modifier_desc:0 "Este personagem brilhou em um debate religioso contra um profeta louco, mostrando ao povo o erro em seus caminhos."
 ep3_religiously_pacified_modifier:0 "Religiosamente Pacificado"
 ep3_religiously_pacified_modifier_desc:0 "A fé e a confiança da população local nas instituições foram fortalecidas pela intervenção eficaz contra um culto do apocalipse em ascensão."
 ep3_repayed_church_titles_modifier:0 "Ouro Reaproveitado"
 ep3_repayed_church_titles_modifier_desc:0 "O ouro acumulado através da venda ilegal de ofícios religiosos foi bem utilizado por seus legítimos proprietários religiosos."
 ep3_settled_troops_province_modifier:0 "Tropas Estacionadas"
 ep3_settled_troops_province_modifier_desc:0 "Os oficiais das tropas estacionadas nesta província receberam lotes de terra locais para se estabelecer."
 ep3_tight_control_modifier:0 "Controle Rigoroso"
 ep3_tight_control_modifier_desc:0 "Alguns episódios #EMP infelizes#! neste condado forçaram o governador a colocar tudo sob observação especial."
 ep3_treasure_distributed_modifier:0 "Tesouro Distribuído"
 ep3_treasure_distributed_modifier_desc:0 "A população local desfruta de alguma prosperidade com a redistribuição de um tesouro descoberto."
 ep3_treasure_invest_modifier:0 "Tesouro Investido"
 ep3_treasure_invest_modifier_desc:0 "Um tesouro de ouro foi transformado em investimentos locais, para o benefício de todo o condado."
 ep3_war_compensations_modifier:0 "Compensações de Guerra"
 ep3_war_compensations_modifier_desc:0 "Este condado está recebendo apoio específico para continuar prosperando apesar de qualquer guerra em andamento."
 ep3_war_lodgings_modifier:0 "Alojamentos para a Guerra"
 ep3_war_lodgings_modifier_desc:0 "Este condado está garantindo que as tropas aliadas sejam bem tratadas."
 ep3_war_lookout_modifier:0 "Sentinelas de Guerra"
 ep3_war_lookout_modifier_desc:0 "Um sistema organizado de sentinelas protege este condado."
 ep3_war_supplies_modifier:0 "Suprimentos de Guerra"
 ep3_war_supplies_modifier_desc:0 "Este condado está direcionando todos os recursos para apoiar as tropas em trânsito."
 ep3_war_support_modifier:0 "Apoio à Guerra"
 ep3_war_support_modifier_desc:0 "Nenhum esforço foi poupado neste condado para apoiar as guerras do senhor feudal."
 ep3_wild_predators_modifier:0 "$wild_predators$"
 ep3_wild_predators_modifier_desc:0 "Uma abundância de predadores selvagens ronda estas terras, matando camponeses e animais de caça igualmente."
 evil_presence:0 "Uma Presença Maligna"
 evil_presence_contract:0 "$evil_presence$"
 evil_presence_desc:0 "Camponeses aterrorizados afirmam estar sendo perseguidos por uma presença maligna. Incapazes de confortar este rebanho sobrecarregado, os clérigos locais solicitam sua intervenção."
 evil_presence_desc_title:0 "$task_contract_governance_desc_title$"
 evil_presence_request:0 "$admin_request_choose_opportunity$"
 governor_contract_event.1000.a:0 "Vamos iniciar uma investigação!"
 governor_contract_event.1000.desc:0 "Meus escribas insistem que uma vila em [tax_destination.GetName] está significativamente atrasada com seus impostos.\n\nSeria uma séria negligência da minha parte ignorar o assunto. Os livros contábeis deixam claro: os impostos #EMP estão#! ausentes. Os envios nunca foram enviados.\n\nNo momento, a causa dessas omissões é desconhecida. Este assunto pode ser uma questão para oficiais... ou para soldados."
 governor_contract_event.1000.t:0 "Impostos Vencidos"
 governor_contract_event.1001.a.failure:0 "Não consigo aprender nada com os vilarejos"
 governor_contract_event.1001.a.success:0 "Eu persuado os vilarejos a falar"
 governor_contract_event.1001.a:0 "Um método inquisitivo servirá melhor."
 governor_contract_event.1001.a_tt:0 "Viaje para [tax_destination.GetName] e investigue o problema"
 governor_contract_event.1001.b.failure:0 "Não consigo aprender o que preciso da vila"
 governor_contract_event.1001.b.success:0 "Inspeciono a vila e aprendo o que preciso"
 governor_contract_event.1001.b:0 "Vamos olhar ao redor e ver o que surge."
 governor_contract_event.1001.desc:0 "Meu séquito luta ao longo de um caminho rural mal conservado, entre flores espalhadas [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] e o ocasional [ROOT.Char.Custom('RegionalFarmAnimal')]... meu destino, a vila devedora de impostos, realmente é bastante rústica e #EMP bastante#! sem importância — apesar de não estar a mais de um dia de jornada de [tax_destination.GetName] propriamente dito.\n\nAlguns dos locais, vestidos com suas vestimentas tradicionais distintas, se reuniram no centro da vila. Sou recebido pacificamente, embora sem calor.\n\nDevo considerar como abordar minha investigação."
 governor_contract_event.1001.failure:0 "Sua investigação falhou"
 governor_contract_event.1001.success:0 "Sua investigação foi um sucesso"
 governor_contract_event.1003.a:0 "Reunir o que pudermos, e vender metade para desenvolver melhor a área."
 governor_contract_event.1003.b:0 "Eles deverão pagar integralmente. E não um #EMP único#! grão a menos."
 governor_contract_event.1003.c:0 "Essas pessoas decentes precisam pagar apenas parcialmente."
 governor_contract_event.1003.d:0 "Estacionar uma guarnição aqui incentivará o pagamento adequado."
 governor_contract_event.1003.desc_diplomacy:0 "Falar com os vilarejos provou ser inesperadamente frutífero!\n\nOs chefes de família estavam ansiosos para listar os membros de suas famílias e se alegraram em exaltar a produtividade de suas terras. Alguns até #EMP se gabaram#! de seu gado! Os agricultores me conduziram por seus campos, explicando quanto esperavam ganhar com a colheita."
 governor_contract_event.1003.desc_outro:0 "\n\nAlguma supervisão inexplicável, intencional ou não, parece ser a causa da falha desta vila em pagar suas obrigações. Mas uma tarefa permanece: decidir como melhor remediar a situação..."
 governor_contract_event.1003.desc_stewardship:0 "Fazer um levantamento cuidadoso de cada [ROOT.Char.Custom('RegionalFarmAnimal')], cada talo de cevada, cada cobertor artesanal e pote de barro resultou em uma boa estimativa dos impostos que esses servos #EMP deveriam#! pagar."
 governor_contract_event.1003.e:0 "Vamos designar um administrador para supervisionar a vila."
 governor_contract_event.1003.f:0 "Um alívio fiscal pode ajudar essas pessoas a prosperar?"
 governor_contract_event.1003.t:0 "Impostos Vencidos: Sucesso"
 governor_contract_event.1004.a:0 "#EMP Tarnação!#!"
 governor_contract_event.1004.desc:0 "Embora eu olhe em porões e armazéns, embora eu ande pelos campos, converse com os líderes da vila... não há sinal de riqueza retida em lugar algum neste vilarejo. Os vilarejos, por todas as aparências, são realmente, absolutamente pobres e incapazes de fornecer o que devem.\n\nSem evidências de que fui enganado, pouco resta para eu fazer aqui. Meus livros devem simplesmente absorver a perda."
 governor_contract_event.1004.t:0 "Impostos Vencidos: Falha"
 governor_contract_event.1010.a:0 "Terei que resolver isso pessoalmente."
 governor_contract_event.1010.a_tt:0 "Viaje para [mayor_destination.GetName] e converse com o prefeito"
 governor_contract_event.1010.desc:0 "Recebi uma série de relatórios de que [Select_CString( hoarding_mayor.IsFemale, 'a', 'o' )] [hoarding_mayor.GetTitledFirstName], que está supervisionando [mayor_destination.GetName], está retendo a vasta maioria dos impostos da cidade para [hoarding_mayor.GetHerselfHimself].\n\nEmbora seja esperado que um prefeito possa realmente reter quaisquer impostos remanescentes, os valores relatados são #EMP excessivos#!. Eles facilmente beiram o corrupto. E, para piorar a situação: as ações [hoarding_mayor.GetHerHim] refletem muito mal sobre #EMP mim#!!"
 governor_contract_event.1010.t:0 "Prefeito Acumulador"
 governor_contract_event.1011.a:0 "Invista na cidade. Eu cuidarei de qualquer moeda restante."
 governor_contract_event.1011.b:0 "Você me dará #EMP toda#! a moeda excedente."
 governor_contract_event.1011.c:0 "Use-a bem. Invista na infraestrutura local."
 governor_contract_event.1011.d:0 "Devolva-a ao povo organizando festividades."
 governor_contract_event.1011.desc_fear:0 "Assustad[Select_CString( hoarding_mayor.IsFemale, 'a', 'o' )], [hoarding_mayor.GetFirstName] derrama sua bebida sobre [hoarding_mayor.GetHerselfHimself] — claramente tomada de surpresa com a minha mera presença! O rosto [hoarding_mayor.GetHerHim|U] fica cada vez mais pálido enquanto eu expõe minhas acusações.\n\n\"Espere! Por favor! Certamente, isso é apenas um mal-entendido. Podemos resolver isso, não podemos?\""
 governor_contract_event.1011.desc_intro:0 "Não perco tempo ao chegar em [mayor_destination.GetName] e sigo rapidamente para a residência do prefeito. Eu entro, sem ser anunciado, e sou imediatamente recompensado com o meu espetáculo.\n\n"
 governor_contract_event.1011.desc_upset:0 "[hoarding_mayor.GetFirstName] me olha, por um breve momento perplexo, antes de recuperar [hoarding_mayor.GetHerselfHimself]. Enquanto [hoarding_mayor.GetSheHe] escuta minhas acusações, uma carranca se espalha pelo rosto do ministro.\n\n\"Que acusações viles! Eu poderia...\" [hoarding_mayor.GetFirstNameNoTooltip] pausa e respira fundo. \"Tudo bem. Como você sugere que prossigamos?\""
 governor_contract_event.1011.desc_worried:0 "[hoarding_mayor.GetFirstName] se vira e me observa, sem palavras. [hoarding_mayor.GetSheHe|U] se estabiliza com a mão na mesa enquanto eu repreendo [hoarding_mayor.GetSheHe], lançando acusação após acusação.\n\n\"Eu... estou certo de que há um mal-entendido, mas eu, claro, ajudarei você a resolver a situação! Da maneira que você achar melhor!\""
 governor_contract_event.1011.e:0 "Receio que apenas uma punição severa servirá."
 governor_contract_event.1011.f:0 "Eu poderia deixar isso passar... mas não esqueça."
 governor_contract_event.1012.a:0 "Pensando bem, vamos!"
 governor_contract_event.1012.a_tt:0 "Você começa a viajar novamente"
 governor_contract_event.1012.b:0 "Tenho assuntos mais importantes para lidar."
 governor_contract_event.1012.desc:0 "Não poderei fazer muito sobre a questão atual sem viajar para seu local. Espera-se que eu lide com esse tipo de problema diretamente, mas talvez eu precise olhar para o outro lado e focar minha atenção em questões mais urgentes..."
 governor_contract_event.1012.t:0 "Questão de Governança: Cancelar Viagem"
 governor_contract_event.1020.a:0 "Faça a distribuição igual em toda a província."
 governor_contract_event.1020.b:0 "Distribua ao lado do grão regular."
 governor_contract_event.1020.c:0 "A capital provincial deve se beneficiar."
 governor_contract_event.1020.d:0 "Vamos doar para caridade e para aqueles que precisam."
 governor_contract_event.1020.desc:0 "[ROOT.Char.GetFaith.FertilityGodName] tem sido gentil conosco! Em muitas das vilas do [ROOT.Char.GetPrimaryTitle.GetNameNoTier], feixes de grãos aparentemente intermináveis são coletados de campos bem irrigados por chuvas constantes. E que [ROOT.Char.Custom('RegionalRootVegetablePlural')]! Um rendimento significativamente maior do que a última colheita é alegremente antecipado.\n\nIsso é, claro, uma ótima notícia. Preciso organizar uma força de trabalho extraordinária e ver a logística o mais rápido possível.\n\nAgora, para onde meus vagões levarão esses grandes montes de [ROOT.Char.Custom('GetSeason')] produção...?"
 governor_contract_event.1020.e:0 "Preencha os celeiros e venda o excedente."
 governor_contract_event.1020.f:0 "Transfira #EMP tudo#! para a minha propriedade."
 governor_contract_event.1020.t:0 "Colheita Abundante"
 governor_contract_event.1030.a:0 "Reúna um contingente de soldados. Partiremos imediatamente!"
 governor_contract_event.1030.b:0 "Eles serão tratados a seu tempo..."
 governor_contract_event.1030.desc:0 "Eu leio o relatório novamente. #EMP Bandidos#!, para quem meus contribuintes respeitadores da lei são apenas ovelhas gordas para tosquiar!\n\nE de fato, os bandidos brutais colocaram meu povo sob a lâmina... vilas aterrorizadas, caravanas perdidas.\n\nUm grupo particularmente desagradável de matadores estabeleceu uma firme base na [task_contract_location.GetProvince.GetTerrain.GetNameNoTooltip|l] perto de [bandit_destination.GetName]. Até que sejam expulsos, a região permanecerá incontrolável."
 governor_contract_event.1030.t:0 "Bandidos Descontrolados"
 governor_contract_event.1031.a:0 "Ataquem! Vamos pegá-los de surpresa!"
 governor_contract_event.1031.b.failure:0 "Sua escolha de táticas deixa muito a desejar."
 governor_contract_event.1031.b.success:0 "Sua tática é um triunfo."
 governor_contract_event.1031.b:0 "Vamos traçar uma tática antes de atacarmos."
 governor_contract_event.1031.c.failure:0 "Sua armadilha não engana ninguém."
 governor_contract_event.1031.c.success:0 "Sua armadilha é impecável."
 governor_contract_event.1031.c:0 "Atrair eles para uma armadilha pode nos poupar muitos problemas."
 governor_contract_event.1031.desc:0 "Os habitantes de [bandit_destination.GetName] nos conduzem alegremente direto para a entrada da toca do [ROOT.Char.Custom('RegionalFerociousAnimal')]... o acampamento de foras da lei fica logo além, obscurecido por vegetação e terreno irregular.\n\nPelo que ouço, julgo esses inimigos como guerreiros nômades: pessoas duras vivendo nas margens da sociedade estabelecida, tão fartos da riqueza da minha terra que transformaram suas incursões em uma estadia prolongada.\n\nO inimigo ainda não está alerta para a presença do meu grupo. Temos a oportunidade de atacar da maneira que eu achar melhor."
 governor_contract_event.1031.failure:0 "Você falha e os bandidos escapam."
 governor_contract_event.1031.success:0 "Você consegue e derrota os bandidos."
 governor_contract_event.1032.a:0 "Devolva os bens roubados; coloque os criminosos para trabalhar."
 governor_contract_event.1032.b:0 "Perdoe seus crimes."
 governor_contract_event.1032.c:0 "Que tal ganhar um dinheiro honesto para viver?"
 governor_contract_event.1032.d:0 "Eles terão que pagar uma multa."
 governor_contract_event.1032.desc_charge:0 "Uma carga trovejante é uma surpresa desagradável para qualquer inimigo, mas os gritos confusos dos meus inimigos criminosos falam sobre o quão #EMP verdadeiramente#! despreparados eles estão!\n\nA luta corpo a corpo entre minhas tropas fortemente armadas e os guerreiros semi-nus cambaleando em direção aos seus montes dura apenas alguns momentos. Os nômades sobreviventes são então organizados em fila na minha frente."
 governor_contract_event.1032.desc_outro:0 "\n\nEles estão à minha mercê."
 governor_contract_event.1032.desc_tactical:0 "Meu inimigo indisciplinado não pode esperar resistir a tropas bem treinadas! Seus projéteis não são mais lançados em direção à carne de camponeses desprotegidos; eles batem inofensivamente nos escudos da nossa linha de batalha. Os criminosos quebram a formação e fogem, mas cavaleiros em nossos flancos cortam toda a retirada.\n\nEu olho para os mortos. Considero os sobreviventes capturados."
 governor_contract_event.1032.desc_trap:0 "Minha armadilha é muito astuta.\n\nUm jovem soldado quase nu, com um jantar roubado na mão, corre de volta em nossa direção; os foras da lei, os #EMP idiotas#!, o seguem logo atrás! Saltamos de nosso esconderijo — uivando, o inimigo aterrorizado reconhece seu erro — e caímos sobre eles! Momentos antes da morte, os nômades se rendem às minhas tropas.\n\nEste grupo de criminosos é deixado inofensivo, impotente."
 governor_contract_event.1032.e:0 "Pendure-os."
 governor_contract_event.1032.f:0 "Confisque qualquer coisa de valor e os coloque na prisão."
 governor_contract_event.1033.a:0 "Vamos esquecer este incidente."
 governor_contract_event.1033.desc:0 "[ROOT.Char.Custom('CulturalCurse')|U]!\n\nO ataque dos meus soldados foi denunciado por pássaros assustados; chegamos ao nosso inimigo tão rapidamente quanto pudemos, mas os astutos nômades já estavam em seus cavalos e spurrando quase instantaneamente!\n\nAlguns dos bandidos em fuga foram capturados e mortos... mas muito poucos para dissuadir os demais de mais roubos e saques.\n\nExaustos, devemos voltar para casa."
 governor_contract_event.1038.a:0 "Eu preciso proteger essas pessoas!"
 governor_contract_event.1038.a_tt:0 "Viaje para [bandit_destination.GetName] e lide com os bandidos"
 governor_contract_event.1038.b:0 "O povo terá que se virar sozinho."
 governor_contract_event.1038.desc:0 "Esses bandidos provavelmente não partirão pacificamente. O povo de [bandit_destination.GetName] pode sofrer seus ataques por um bom tempo, a menos que eu intervenha.\n\nAlém disso, como oficial nomeado, a segurança deles é minha responsabilidade."
 governor_contract_event.2000.a:0 "Vou conceder a cada oficial sênior um lote de terra."
 governor_contract_event.2000.b:0 "Eles não têm tão mau quanto as tropas d[Select_CString( other_gov.IsFemale, 'a', 'o' )] [other_gov.GetTitledFirstNameNoTooltip]!"
 governor_contract_event.2000.c:0 "Eles merecem um tempo de folga."
 governor_contract_event.2000.d:0 "Eles serão punidos por sua insubordinação!"
 governor_contract_event.2000.desc:0 "As notícias dos meus postos, das tropas provinciais sob meu comando, estão todas de acordo: o descontentamento cresce entre os soldados. Seus períodos de serviço são longos demais, seu pagamento é baixo demais, as prostitutas locais são feias demais, os acampamentos são muito precários...\n\nPara aqueles que vivem em um acampamento militar, as causas para reclamar são sempre muitas, mas mesmo com uma pequena intervenção, eu poderia esperar melhorar o espírito deles... isso certamente ajudaria a aumentar minha popularidade e a segurança da minha posição."
 governor_contract_event.2000.e:0 "Mais dinheiro os deixará felizes."
 governor_contract_event.2000.t:0 "$discontent_soldiers$"
 governor_contract_event.2010.a:0 "Deveria visitar [mayor_destination.GetNameNoTooltip]."
 governor_contract_event.2010.desc:0 "Eu examino a lista de queixas enviadas de [mayor_destination.GetName], anotando acusações contra \"aquel[Select_CString( inept_mayor.IsFemale, 'a', 'e' )] [inept_mayor.Custom2('InsultNoun', ROOT.Char)], [inept_mayor.GetFirstName]\"; como, com [Select_CString( inept_mayor.IsFemale, 'a', 'o' )] \"[inept_mayor.Custom2('InsultAdjective', ROOT.Char)] criminalidade,\" [inept_mayor.GetSheHe] alegadamente drenou os fundos do [inept_mayor.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nDe fato, há algo profundamente #EMP errado#! com a contabilidade da cidade: riquezas parecem desaparecer do balanço inexplicavelmente, o número de funcionários pagos pelo estado muda dia após dia, e a documentação sobre a propriedade da terra está repleta de inconsistências."
 governor_contract_event.2010.t:0 "$inept_mayor$"
 governor_contract_event.2011.a:0 "Mostre-me os livros contábeis."
 governor_contract_event.2011.b:0 "Você não é digno de seu cargo."
 governor_contract_event.2011.c:0 "Estou chamando meus especialistas da capital."
 governor_contract_event.2011.d:0 "Você pagará pessoalmente por todas as perdas!"
 governor_contract_event.2011.desc_fear:0 "\n\n\"É sobre, ah, aquele envio de grãos?\" gagueja o prefeito. \"A importação de seda? Sim, meus contatos são um pouco não convencionais, mas eles foram perdoados por seus crimes! Bem... #EMP a maioria deles.#! Eu cancelarei esses pedidos, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsName], todos eles; você não precisa se preocupar!"
 governor_contract_event.2011.desc_intro:0 "Quando chego a [mayor_destination.GetName], apresso-me para os escritórios do prefeito local, [inept_mayor.GetFirstName]. Parecendo surpreso, o burocrata rapidamente manda seus servos embora. Os livros contábeis estão apertados em seus braços.\n\n\"Eu vim verificar a contabilidade da sua administração,\" afirmo, franzindo a testa solene."
 governor_contract_event.2011.desc_upset:0 "\n\n\"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsName], certamente você não pode duvidar da minha total devoção ao meu cargo? Minha competência bem testada?!\" O prefeito se exalta, avaliando-me para um confronto.\n\nMas eu sou seu superior."
 governor_contract_event.2011.desc_worried:0 "\n\n\"Notícias problemáticas, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsName]?\" [inept_mayor.GetFirstNameNoTooltip] ri de forma pouco convincente, \"Os grandes locais têm línguas inchadas e imaginações vívidas; é melhor simplesmente evitar os mais barulhentos...\""
 governor_contract_event.2020.a:0 "Infraestrutura é a chave para o sucesso."
 governor_contract_event.2020.b:0 "Fazer o trabalho de [ROOT.Char.GetFaith.HighGodName] na terra é um privilégio."
 governor_contract_event.2020.c:0 "Vamos erguer uma grande estátua em homenagem [Select_CString( emperor.IsFemale, 'a', 'ao' )] [emperor.GetTitledFirstNameNoTooltip]!"
 governor_contract_event.2020.c_tt:0 "Infelizmente, isso implica em #EMP reapropriar#! materiais de construção de toda a área..."
 governor_contract_event.2020.d:0 "Os comerciantes locais poderiam usar a ajuda extra."
 governor_contract_event.2020.desc:0 "Como é bom quando uma governança diligente encontra resultados excelentes!\n\nO tesouro de [ongoing_destination.GetName] está cheio até a borda, e fui encarregado pela administração central de reinvestir o excedente localmente."
 governor_contract_event.2020.e:0 "Nossos valentes soldados merecem mais!"
 governor_contract_event.2020.f:0 "Alimentos para o povo é a solução!"
 governor_contract_event.2020.failure:0 "O investimento é uma falha."
 governor_contract_event.2020.success:0 "O investimento é um sucesso."
 governor_contract_event.2020.t:0 "$prov_investment$"
 governor_contract_event.2021.a:0 "Um trabalho bem feito."
 governor_contract_event.2021.desc:0 "\n\nEsta escolha de investimento provou ser sagaz. Com apenas os primeiros resultados à vista, já sou elogiado e festejado pelo povo sob meus cuidados."
 governor_contract_event.2021.desc_church:0 "Os planos para a nova [ROOT.Char.GetFaith.HouseOfWorship] em [task_contract_location.GetNameNoTier] são uma imagem imaculada de inspiração divina, embora — comparado aos grandes lugares sagrados do mundo — o nosso seja apenas um humilde local. Que os fiéis se reúnam!"
 governor_contract_event.2021.desc_food:0 "Até o mais baixo dos mendigos em [task_contract_location.GetNameNoTier] dorme com o estômago cheio esta noite. Minha distribuição de grãos fez com que famílias de rostos alegres levantassem feixes até as vigas; toda a região cheira a pão fresco assado."
 governor_contract_event.2021.desc_infrastructure:0 "As vias mais movimentadas em [task_contract_location.GetNameNoTier] são as primeiras a serem renovadas. Meus trabalhadores contratados labutam e, com uma remuneração exemplar em oferta, o progresso é rápido."
 governor_contract_event.2021.desc_military:0 "Os sons da celebração sobem dos quartéis; com a riqueza que acumulei sobre eles, a lealdade e a condição de combate das minhas tropas estão mais do que garantidas! Meus capitães lideram os outros em gritar meu nome."
 governor_contract_event.2021.desc_monument:0 "O rosto de [emperor.GetFaith.WealthGodName], um dos principais patronos d[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitledFirstName], é amorosamente — e de forma bastante lisonjeira — recriado por meus artesãos. O nome do grande soberano está inscrito abaixo... assim como o meu."
 governor_contract_event.2021.desc_traders:0 "Bens estão inundando! O comércio prospera, alimentado apenas pela minha proclamação de alívio em algumas tarifas chave. Agora, é hora de limpar o gado fedido daquele canto inutilizado do fórum local..."
 governor_contract_event.2021.t:0 "$prov_investment$: Sucesso"
 governor_contract_event.2022.a:0 "Infeliz."
 governor_contract_event.2022.desc:0 "\n\nIsso, infelizmente, não se desenrolou como eu esperava. E o superávit da minha província se perdeu."
 governor_contract_event.2022.desc_military:0 "As tropas não estavam muito #EMP equilibradas#! em relação ao seu repentino bônus salarial... com abandono selvagem, jogaram seus pagamentos em uma orgia de festejos inconvenientes.\n\nAgora, os capitães amados enfrentam acusações criminais, soldados apresentam feridas de brigas com os locais, e de alguma forma sou eu quem é responsabilizado."
 governor_contract_event.2022.desc_monument:0 "Informei a administração da capital sobre meu mais novo monumento, a estátua ornamentada de joias com grandeza ostensiva... e não ouvi nada em troca. [emperor.GetTitledFirstName] não se digna a me honrar por meu ato de lealdade, se de fato [emperor.GetSheHe] sabe disso."
 governor_contract_event.2022.desc_traders:0 "Com meu ajuste de impostos e tarifas, os comerciantes cantam de alegria com os novos lucros... mas não vemos aumento na receita. Além disso, artesãos e trabalhadores locais reclamam da minha administração: diante da recente barateação das importações, eles lutam para vender seus produtos."
 governor_contract_event.2022.t:0 "$prov_investment$: Falha"
 governor_contract_event.2030.a.tt:0 "Você viaja para [ongoing_destination.GetNameNoTooltip]"
 governor_contract_event.2030.a:0 "Preciso ver isso pessoalmente."
 governor_contract_event.2030.desc:0 "Notícias preocupantes vieram de [ongoing_destination.GetName].\n\nAparentemente, um grupo de camponeses locais armou-se e, em gangues descontroladas, aventurou-se além de nossas fronteiras para o território de [neighbor.GetCulture.GetNameNoTooltip].\n\nA prática em si é improvável de causar preocupações diplomáticas, mas ações militares — e a posse de armas — são prerrogativas do exército. Portanto, qualquer violação da lei deve ser investigada."
 governor_contract_event.2030.t:0 "$raiding_peasants$"
 governor_contract_event.2031.a:0 "Vocês todos trabalharão para mim — legalmente."
 governor_contract_event.2031.b:0 "Banditismo é punido com a morte."
 governor_contract_event.2031.c:0 "Você precisa de alguma ajuda #EMP não oficial#!?"
 governor_contract_event.2031.d:0 "Você deveria estar trabalhando em seus campos."
 governor_contract_event.2031.desc:0 "Quando chego a [ongoing_destination.GetName], minhas informações se provam corretas. Não demora para meus guardas reunir um considerável grupo de locais, todos na posse de armas não autorizadas.\n\n\"Precisamos delas para nos defender e proteger nossas famílias!\" eles protestam. \"Aqueles canalhas de [neighbor.GetCulture.GetNameNoTooltip] não podem ser confiáveis! Eles precisam aprender a ficar bem longe de nós!\""
 governor_contract_event.2031.e:0 "Me dê todo o ouro que você roubou e poderá ir embora!"
 governor_contract_event.2040.a:0 "Preciso fazer algo."
 governor_contract_event.2040.desc:0 "As notícias de [ongoing_destination.GetName] são sombrias e contadas com medo.\n\nA vida selvagem local está se tornando cada vez mais escassa, seus números colapsando devido a uma crescente presença d[ROOT.Char.Custom('RegionalFerociousAnimal')]. Esses demônios, tornados mais corajosos por seu número crescente, não estão contentes em despovoar a selva, mas agora podem ser vistos espreitando ao redor dos assentamentos do meu povo.\n\nO gado e as crianças estão sendo vigiados de perto, mas ainda assim... as periferias de [ongoing_destination.GetName] não são seguras."
 governor_contract_event.2040.t:0 "$wild_predators$"
 governor_contract_event.2041.a.tt:0 "Você envia venenos especialistas para matar seletivamente os predadores fora de controle com iscas."
 governor_contract_event.2041.a:0 "Eu conheço os profissionais certos."
 governor_contract_event.2041.b.fail:0 "Seu grupo de caça mergulha no caos."
 governor_contract_event.2041.b.success:0 "A grande caça vai bem."
 governor_contract_event.2041.b:0 "Eu mesmo caçarei as criaturas!"
 governor_contract_event.2041.c.fail:0 "Poucos se interessam em perseguir [ROOT.Char.Custom('RegionalFerociousAnimal')]."
 governor_contract_event.2041.c.success:0 "Muitos caçadores vêm reivindicar as bestas."
 governor_contract_event.2041.c:0 "Precisamos de mais caçadores."
 governor_contract_event.2041.d.fail:0 "Os camponeses são apenas presas."
 governor_contract_event.2041.d.success:0 "A habilidade local prevalece."
 governor_contract_event.2041.d:0 "Os camponeses locais podem lidar com isso."
 governor_contract_event.2041.desc:0 "Minha chegada em [ongoing_destination.GetName] é em meio à tragédia e preocupação. Os locais murmuram que — em segurança de um cercado — um prêmio [ROOT.Char.Custom('RegionalFarmAnimal')] foi recentemente despedaçado pel[ROOT.Char.Custom('RegionalFerociousAnimal')] enorme.\n\nUm rápido passeio pela região prova que essa informação é confiável; é raro ver animais selvagens, e os sinais de ataques d[ROOT.Char.Custom('RegionalFerociousAnimal')] estão por toda parte.\n\nDizem que um bebê está desaparecido. Dizem que pequenos ossos quebrados foram encontrados."
 governor_contract_event.2041.e.fail:0 "Suas jaulas permanecem vazias."
 governor_contract_event.2041.e.success:0 "Cada [ROOT.Char.Custom('RegionalFerociousAnimal')] é aprisionado."
 governor_contract_event.2041.e.tt:0 "Envie seus guardas para capturar o maior número possível de animais."
 governor_contract_event.2041.e:0 "Sempre quis um animal de estimação exótico..."
 governor_contract_event.2041.f:0 "Basta importar e soltar mais presas!"
 governor_contract_event.2042.a:0 "Eu assumo total crédito por este sucesso."
 governor_contract_event.2042.desc:0 "Vitória!\n\n[ongoing_destination.GetName] está livre dos terrores da selva, purgada de seu problema d[ROOT.Char.Custom('RegionalFerociousAnimal')] — minha intervenção determinada livrou os camponeses do medo!\n\nNo [ongoing_destination.GetTerrain.GetNameNoTooltip|l] onde estou, as inocentes criaturas pastando de [ROOT.Char.GetFaith.HighGodName] voltarão a vaguear livremente em breve."
 governor_contract_event.2043.a:0 "Só posso esperar que comecem a se devorar #EMP uns aos outros...#!"
 governor_contract_event.2043.desc:0 "Dentes rangendo, garras como pontas de lanças, grandes bocas babando logo atrás — cegos de terror, fugimos do [ongoing_destination.GetTerrain.GetNameNoTooltip|l] de [ongoing_destination.GetName], mal escapando com nossas vidas!\n\nA ameaça d[ROOT.Char.Custom('RegionalFerociousAnimal')] aqui é verdadeiramente incontrolável. Talvez seja, até mesmo, os servos selvagens de [ROOT.Char.GetFaith.DevilName] que assombram esta aldeia?\n\n[ROOT.Char.Custom('CulturalCurse')|U]! Só posso partir, deixando os locais aterrorizados pelas criaturas..."
 governor_contract_event.2050.a:0 "Suponho que uma investigação seja necessária."
 governor_contract_event.2050.desc:0 "Os [ongoing_destination.GetCounty.GetFaith.PriestNeuterPlural] locais de [ongoing_destination.GetName] escrevem para mim, em pânico, agarrando minha atenção com advertências urgentes sobre violência iminente.\n\nA população local está em frenesim devido a uma série de eventos suspeitos: presságios ruins, como"
 governor_contract_event.2050.t:0 "$evil_presence$"
 governor_contract_event.2051.a:0 "Vou solicitar um exorcista oficial da capital."
 governor_contract_event.2051.b:0 "Traga um [ROOT.Char.GetFaith.PriestNeuter] renomado para um exorcismo."
 governor_contract_event.2051.c:0 "Deve haver um feiticeiro maligno!"
 governor_contract_event.2051.d:0 "O que seus anciãos sugerem?"
 governor_contract_event.2051.desc:0 "O bom povo de [ongoing_destination.GetName] está fora de si de terror.\n\nO pânico e a paranoia estão em alta. Em tenências precárias e na [ROOT.Char.Custom('ResidenceBuilding')] do magistrado local, minha comitiva é recebida com portas trancadas, acusações contra amigos e parentes das mais horríveis práticas, e cidadãos honestos que veem monstros em cada sombra. Atividades produtivas estão praticamente suspensas.\n\nDe uma forma ou de outra, essa situação deve ser encerrada. Sem fé na proteção de [ongoing_destination.GetCounty.GetFaith.HighGodName]... os fios desta sociedade mal conseguem se desgastar mais."
 governor_contract_event.2051.desc_a:0 "peixes estragados,"
 governor_contract_event.2051.desc_b:0 "febres,"
 governor_contract_event.2051.desc_c:0 "cônjuges brigando,"
 governor_contract_event.2051.desc_d:0 "crianças acordando gritando à noite,"
 governor_contract_event.2051.desc_e:0 "dores de cabeça em massa,"
 governor_contract_event.2051.desc_end:0 "\n\nO povo está aterrorizado de que um demônio — ou algum outro mal indizível — tenha se instalado entre eles."
 governor_contract_event.2051.desc_f:0 "caçadas mal sucedidas,"
 governor_contract_event.2051.desc_g:0 "vacas doentes,"
 governor_contract_event.2051.desc_h:0 "produção arruinada,"
 governor_contract_event.2051.desc_i:0 "campos arruinados,"
 governor_contract_event.2051.desc_l:0 "e aparições estranhas de cães."
 governor_contract_event.2051.desc_m:0 "e aparições estranhas de cavalos."
 governor_contract_event.2051.desc_n:0 "e aparições estranhas de águias."
 governor_contract_event.2051.desc_o:0 "e aparições estranhas de gatos."
 governor_contract_event.2051.desc_p:0 "e aparições estranhas de sapos."
 governor_contract_event.2051.desc_q:0 "e aparições estranhas de cobras."
 governor_contract_event.2051.e:0 "Você só está vendo coisas. Bobagem."
 governor_contract_event.2060.a:0 "Este charlatão será punido de forma exemplar."
 governor_contract_event.2060.b:0 "Eu poderia usar alguém com sua #EMP criatividade#!."
 governor_contract_event.2060.c:0 "Devolva as relíquias, e eu posso esquecer que isso aconteceu."
 governor_contract_event.2060.d:0 "Uma multa sólida é uma punição adequada."
 governor_contract_event.2060.desc:0 "Um caso interessante e um indivíduo muito incomum são trazidos diante de mim para julgamento.\n\nEst[Select_CString( scammer.IsFemale, 'a', 'e' )] [scammer.GetWomanMan], [scammer.GetName], é acusado de ser um falso inválido: um charlatão que ganha a vida enganando os fiéis. [scammer.GetSheHe|U] [scammer.Custom('quirk_pos_present')], de maneira charmosa, enquanto as relíquias doadas são dispostas diante de mim.\n\nTestemunhas afirmam ter visto este homem \"cego\" no patamar de sua [ROOT.Char.GetFaith.HouseOfWorshipPlural], apelando à sua boa natureza; [scammer.GetSheHe] aquece os corações das congregações ao ser miraculosa e repetidamente curado... mas apenas após receber moedas ou itens sagrados."
 governor_contract_event.2060.e:0 "A única possível penitência é a prisão."
 governor_contract_event.2060.f:0 "[ROOT.Char.GetFaith.HighGodName] age de maneiras misteriosas."
 governor_contract_event.2060.t:0 "$miraculous_healing$"
 governor_contract_event.2070.a:0 "Um evento realmente curioso!"
 governor_contract_event.2070.desc:0 "Os anciãos de uma pequena comunidade perto de [ongoing_destination.GetName] me contataram para tomar uma decisão sobre um evento raro.\n\nUma família de camponeses desenterrou uma quantidade substancial de moedas de ouro enquanto trabalhava nos campos! Seus vizinhos rapidamente se dividiram em facções: alguns acreditam que o ouro deve ir para os descobridores, enquanto outros argumentam que a bonança deve ser compartilhada por toda a aldeia.\n\nA palavra de uma autoridade superior poderia saciar a ganância desses simples camponeses e poupá-los de descer a uma violência mesquinha."
 governor_contract_event.2070.t:0 "$buried_treasure$"
 governor_contract_event.2071.a:0 "Reinvista o ouro em sua própria comunidade."
 governor_contract_event.2071.b:0 "Todos os ganhos especiais devem ser taxados. #EMP Pesadamente.#!"
 governor_contract_event.2071.c:0 "O que é encontrado em terras públicas pertence ao reino."
 governor_contract_event.2071.d:0 "O tesouro é legalmente seu para fazer o que quiser."
 governor_contract_event.2071.desc.byz:0 "É um baú de aparência antiga cheio até a borda com [Glossary( 'aurei', 'AUREUS_GLOSS')] de ouro, todos cunhados sob o mesmo imperador. Para fazer uma suposição educada, isso poderia ser o tesouro de alguma legião antiga; talvez, até mesmo um ano de salário."
 governor_contract_event.2071.desc.end:0 "\n\n[peasant.GetFirstNameNoTooltip] — e aparentemente todos os servos de sua comunidade — assistem expectantes, sem fôlego: 'O que será feito com o tesouro, sábi[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName]?'"
 governor_contract_event.2071.desc.fallback:0 "É um baú de aparência modesta cheio até a borda com uma variedade de moedas de ouro cunhadas na região em diferentes períodos. Meu palpite seria que o camponês encontrou um esconderijo enterrado de algum grupo de foras da lei há muito falecido."
 governor_contract_event.2071.desc:0 "Ao chegar em [ongoing_destination.GetName], sou apresentado ao principal camponês descobridor de tesouros — um[Select_CString( peasant.IsFemale, 'a', '' )] [peasant.GetWomanMan] chamad[Select_CString( peasant.IsFemale, 'a', 'o' )] [peasant.GetFirstName] — e ao próprio tesouro.\n\n"
 governor_contract_event.2071.e:0 "Este tesouro pertence a toda a comunidade."
 governor_contract_event.2080.a:0 "Eu deveria intervir."
 governor_contract_event.2080.desc:0 "De acordo com os relatos de [ongoing_destination.GetName], um[Select_CString( magnate.IsFemale, 'a', '' )] magnata local, [magnate.GetTitledFirstName], tem usado todos os truques do livro para aumentar a extensão das terras que [magnate.GetSheHe] possui diretamente.\n\nClaramente, nem todos esses métodos são legais, e alguns são francamente #EMP desprezíveis#!."
 governor_contract_event.2080.t:0 "$public_land$"
 governor_contract_event.2081.a:0 "A terra será dividida entre pequenos proprietários."
 governor_contract_event.2081.b:0 "$ep3_land_confiscate_modifier_desc$"
 governor_contract_event.2081.c:0 "Eu poderia esquecer o acidente por uma boa #EMP doação#!..."
 governor_contract_event.2081.d:0 "Vamos fingir que isso nunca aconteceu, #EMP amigo#!!"
 governor_contract_event.2081.desc:0 "Ao chegar em [ongoing_destination.GetName], sou imediatamente recebido [Select_CString( magnate.IsFemale, 'pelo', 'pela' )] [magnate.GetTitledFirstName] em sua mansão.\n\n'Não vamos falar de frivolidades,' abro sternamente. 'Uma boa quantidade de irregularidades e negócios ilegais surgem quando se considera mais de perto suas recentes aquisições de terras.'\n\n[magnate.GetFirstNameNoTooltip] parece tímido, mas sem remorso. '#EMP Meu bom amigo#!, você sabe como essas coisas são... há tanta burocracia, e os camponeses sem instrução são tão muito ignorantes e lentos para entender a lei. Às vezes, deseja-se ver seus negócios resolvidos rapidamente! Você pode me culpar por isso?'"
 governor_contract_event.2081.e:0 "Fique com a terra, mas deixe os locais cultivá-la."
 governor_contract_event.2090.a:0 "Preciso investigar a situação."
 governor_contract_event.2090.desc:0 "Recebi notícias preocupantes de [ongoing_destination.GetName].\n\nAparentemente, o [ongoing_destination.GetTitle.GetTierAsNameNoTooltip|l] está em turbulência porque algum profeta auto-proclamado tem espalhado pânico com previsões absurdas sobre a iminência do Fim dos Tempos.\n\nEles provavelmente são apenas os delírios de um lunático, mas quando esses delírios comprometem a segurança e a ordem pública, é meu dever intervir."
 governor_contract_event.2090.t:0 "$mad_prophet$"
 governor_contract_event.2091.a.tt:0 "Sua autoridade, retórica habilidosa e presença calmante conseguem controlar a multidão."
 governor_contract_event.2091.a:0 "Está tudo sob controle!"
 governor_contract_event.2091.b:0 "Devemos calar [prophet.GetSheHe]."
 governor_contract_event.2091.c:0 "Guards, prendam o perturbador."
 governor_contract_event.2091.d:0 "Você está errad[Select_CString( prophet.IsFemale, 'a', 'o' )], [prophet.GetFirstNameNoTooltip], e eu vou te provar!"
 governor_contract_event.2091.desc:0 "\"#EMP O FIM ESTÁ PRÓXIMO! ARREPENDA-SE! ARREPENDA-SE AGORA OU SERÁ DESTRUÍDO!#!\"\n\nQuando chego em [ongoing_destination.GetName], encontro facilmente o profeta. Atravessando camponeses admirados e divertidos, sigo o som estridente até sua fonte.\n\nUm[Select_CString( prophet.IsFemale, 'a', '' )] [prophet.GetWomanMan] em trapos censura a multidão inquieta e aterrorizada com uma ira divina. As palavras de [prophet.GetName] tornam reais suas suspeitas do desconhecido; [prophet.GetSheHe] fala sobre seu medo do caos, seu terror de [prophet.GetFaith.NegativeAfterLife], e nossa crença comum no fim de todas as coisas."
 governor_contract_event.2091.e.tt:0 "Você organiza uma grande procissão religiosa."
 governor_contract_event.2091.e:0 "Apenas a oração pode nos salvar."
 governor_contract_event.2091.f:0 "O clero local pode cuidar disso."
 governor_contract_event.2092.a:0 "Adoro um trabalho bem feito!"
 governor_contract_event.2092.desc_debate:0 "\"... E isso prova de forma conclusiva que o fim não está #EMP perto#! de jeito nenhum, e que a ira de [ROOT.Char.GetFaith.HighGodName] não está #EMP sobre nós#!.\"\n\nO profeta fica sem palavras diante da minha culta dissertação; a multidão aplaude, apreciando um bom debate religioso, antes de voltar para casa."
 governor_contract_event.2092.desc_persecute:0 "Fico feliz em observar que meus guardas conseguiram dispersar a multidão e acabar com toda essa bobagem.\n\nOs cidadãos de [ongoing_destination.GetName] podem ficar tranquilos sabendo que vivem em um império civilizado, devoto e forte, imune a superstições e seguro contra desordens!"
 governor_contract_event.2093.a:0 "Uma exibição vergonhosa."
 governor_contract_event.2093.desc_debate:0 "\"Então, pela natureza de [ROOT.Char.GetFaith.HighGodName]... Não — a palavra é #EMP essência#!, certo? Ou é energia? De qualquer forma, o que é não pode não ser. Ou algo assim...\"\n\nNão preciso ver a confusão nos rostos das pessoas à minha frente, nem ouvir as risadinhas do meu adversário para saber que só fiz papel de tolo.\n\nTenho certeza de que os locais conseguirão resolver a questão sozinhos. Estou saindo."
 governor_contract_event.2093.desc_persecute:0 "Infelizmente, enviar os guardas não foi a escolha certa.\n\nA população aterrorizada se aglomerou ao redor do profeta para proteger [prophet.GetSheHe], e muitos — tanto soldados quanto civis — se feriram na briga que se seguiu.\n\nO profeta perturbador conseguiu escapar do caos e desaparecer sem deixar vestígios."
 governor_contract_event.2100.a:0 "O ouro deve ser doado às instituições religiosas."
 governor_contract_event.2100.b:0 "O ouro adquirido ilegalmente está aqui confiscado."
 governor_contract_event.2100.c:0 "Arrependa-se! E devolva o dinheiro aos seus compradores."
 governor_contract_event.2100.d:0 "Eu poderia usar um favor de alguém como você..."
 governor_contract_event.2100.desc:0 "O caso que me pedem para julgar hoje é bastante delicado: um [priest.GetFaith.PriestNeuter] local foi pego oferecendo títulos e ofícios religiosos aos filhos não qualificados de notáveis locais.\n\n[Select_CString( priest.IsFemale, 'A', 'O' )] [priest.GetWomanMan], [priest.GetName], enche sua bolsa às custas de [priest.GetFaith.HighGodName] e de seus superiores.\n\nA prática é — obviamente — muito ilegal. Devido à natureza religiosa do crime em si e das partes envolvidas, também é bastante controversa. Há grande risco de que, ao intervir necessariamente em seus assuntos, o clero fique descontente."
 governor_contract_event.2100.t:0 "$titles_sale$"
 governor_contract_event.2110.a:0 "Preciso ouvir mais sobre isso."
 governor_contract_event.2110.desc:0 "As notícias de [ongoing_destination.GetName] são particularmente preocupantes.\n\nAs medidas do governo para ajudar a área após uma recente peste foram aparentemente inadequadas; uma fome atingiu os assentamentos locais. Alguns habitantes foram levados a práticas desesperadas e abomináveis para sobreviver."
 governor_contract_event.2110.desc_animal:0 "\n\nDe acordo com este relatório, vários camponeses foram pegos matando e consumindo animais religiosamente impuros, atraindo assim a ira do clero local."
 governor_contract_event.2110.desc_cannibal:0 "\n\nDe acordo com este relatório, vários camponeses foram pegos consumindo a carne de seus semelhantes que morreram de fome!"
 governor_contract_event.2110.desc_murder:0 "\n\nDe acordo com este relatório, vários camponeses foram pegos matando e despedaçando seus semelhantes para consumir sua carne!"
 governor_contract_event.2110.t:0 "$hungry_times$"
 governor_contract_event.2111.a:0 "Eu nunca deveria ter deixado esta comunidade sozinha."
 governor_contract_event.2111.b:0 "Os crimes mais desesperados pedem o maior perdão."
 governor_contract_event.2111.c:0 "Os culpados pagarão. Assim diz a lei."
 governor_contract_event.2111.d:0 "Toda a comunidade está manchada por esta abominação!"
 governor_contract_event.2111.desc:0 "Quando chego a [ongoing_destination.GetName], os acusados aguardam acorrentados, os olhos voltados para baixo, suas vestes rasgadas e ensanguentadas.\n\nOs réus, liderados [Select_CString( cannibal.IsFemale, 'pela', 'pelo' )] [cannibal.GetFirstName], acorrentados e tremendo, com os olhos voltados para baixo, são insultados por uma grande multidão de rostos esqueléticos. Punhos magros são erguidos; vozes finas clamam por uma punição exemplar.\n\nMostram-me as evidências... fêmures quebrados e cabeças podres e cortadas. Algo horrível aconteceu aqui; foi realmente uma abominação diante de [ROOT.Char.GetFaith.HighGodName]."
 governor_contract_event.2111.e:0 "Crimes tão hediondos merecem minha atenção total."
 governor_contract_event.2120.a:0 "Naturalmente, ofereceremos nosso apoio completo!"
 governor_contract_event.2120.b:0 "Nossos suprimentos estão a serviço d[Select_CString( ROOT.Char.GetLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]."
 governor_contract_event.2120.c:0 "Providenciaremos alojamentos para as tropas."
 governor_contract_event.2120.d:0 "Estou certo de que algum ouro ajudará."
 governor_contract_event.2120.desc:0 "Uma carta com aparência oficial, portando o emblema d[Select_CString( ROOT.Char.GetLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] [ROOT.Char.GetLiege.GetHerselfHimself], aguarda em meu escritório hoje:\n\n\"Os exércitos invencíveis de nosso [ROOT.Char.GetLiege.GetPrimaryTitle.GetBaseNameNoTier] marcham contra o deplorável inimigo. E caso tropas amigas atravessem as terras atribuídas à sua governança, você está ordenado a fornecer todo o conforto e suporte apropriados.\n\nNestes tempos de dificuldades, o [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip] aprecia muito os sacrifícios de seus súditos [ROOT.Char.GetLiege.GetCulture.GetName].\""
 governor_contract_event.2120.e:0 "Nossos vigias apoiarão o esforço militar."
 governor_contract_event.2120.f:0 "É mais importante apoiar nosso povo durante a guerra."
 governor_contract_event.2120.t:0 "$wartime_measures$"
