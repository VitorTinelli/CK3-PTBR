 chariot_race.0110.d:0 "I believe I'll hedge my bets..."
 chariot_race.0110.desc:0 "Os [root_scope.Custom('GetChariotTeamColorPluralGlossed')] estão apresentando um excelente grupo de motoristas habilidosos, cujos nomes certamente estão entre os elogiados nos mercados, falados reverentemente por crianças. Até mesmo a corte imperial se derrete e se deslumbra por eles!\n\nEu #EMP poderia#! colocar minha aposta em qualquer um desses corredores celebridades, mas talvez nenhum competidor único seja de longe a melhor perspectiva..."
 chariot_race.0110.number_betting_blue:0 "[activity.MakeScope.Var('characters_betting_blue').GetValue] participantes apostando nos [Glossary( 'Venetoi', 'BLUE_VENETOI_GLOSS' )]"
 chariot_race.0110.number_betting_green:0 "[activity.MakeScope.Var('characters_betting_green').GetValue] participantes apostando nos [Glossary( 'Prasinoi', 'GREEN_PRASINOI_GLOSS' )]"
 chariot_race.0110.number_betting_red:0 "[activity.MakeScope.Var('characters_betting_red').GetValue] participantes apostando nos [Glossary( 'Rhousioi', 'RED_RHOUSIOI_GLOSS' )]"
 chariot_race.0110.number_betting_white:0 "[activity.MakeScope.Var('characters_betting_white').GetValue] participantes apostando nos [Glossary( 'Leukoi', 'WHITE_LEUKOI_GLOSS' )]"
 chariot_race.0110.t:0 "Heróis do Circuito"
 chariot_race.0120.a.info:0 "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_win').GetValue|1]%#! $chariot_chance_to_win$ #weak ([root_scope.MakeScope.Var('wager_target').Var('odds_win_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_win_b').GetValue] odds)#!\n$chariot_win_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('win_payout').GetValue|1]x#!"
 chariot_race.0120.a:0 "Eu espero uma vitória, é claro!"
 chariot_race.0120.b.info:0 "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_place').GetValue|1]%#! $chariot_chance_to_place$ #weak ([root_scope.MakeScope.Var('wager_target').Var('odds_place_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_place_b').GetValue] odds)#!\n$chariot_place_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('place_payout').GetValue|1]x#!"
 chariot_race.0120.b.tt:0 "O alvo da sua aposta deve terminar em primeiro ou segundo lugar."
 chariot_race.0120.b:0 "Primeiro ou segundo: colocar é suficiente."
 chariot_race.0120.c.info:0 "#V [root_scope.MakeScope.Var('wager_target').Var('percent_chance_to_show').GetValue|1]%#! $chariot_chance_to_show$ #weak ([root_scope.MakeScope.Var('wager_target').Var('odds_show_a').GetValue]:[root_scope.MakeScope.Var('wager_target').Var('odds_show_b').GetValue] odds)#!\n$chariot_show_desc$\n$chariot_payout$ #P [root_scope.MakeScope.Var('wager_target').Var('show_payout').GetValue|1]x#!"
 chariot_race.0120.c.tt:0 "O alvo da sua aposta deve terminar em primeiro, segundo ou terceiro lugar."
 chariot_race.0120.c:0 "Apenas mostrar é bom o suficiente."
 chariot_race.0120.desc.team:0 "\"Mais sábio, mais sábio...\" murmura o [GetCourtPositionType('bookmaker_court_position').GetName()], \"e que tipo de aposta você deseja fixar nos carros revestidos com a cor [ROOT.Char.Custom('GetChariotTeamColor')|l]?\""
 chariot_race.0120.desc:0 "\"Uma perspectiva intrigante, de fato...\" murmura o [GetCourtPositionType('bookmaker_court_position').GetName()], \"e que tipo de aposta você deseja fazer sobre o ágil [ROOT.Var('wager_target').GetCharacter.GetFirstName]?\""
 chariot_race.0120.t:0 "$chariot_race.0100.t$"
 chariot_race.0130.a:0 "@gold_icon!200"
 chariot_race.0130.b:0 "@gold_icon!150"
 chariot_race.0130.c:0 "@gold_icon!100"
 chariot_race.0130.d:0 "@gold_icon!50"
 chariot_race.0130.desc:0 "Minhas previsões estão anotadas, um testemunho da qualidade do meu julgamento... espero que também da minha presciência e conhecimento do esporte. Talvez toda a conversa sobre o assunto recentemente tenha me deixado em boa posição.\n\n\"Finalmente, nobre [ROOT.Char.GetTitleAsNameNoTooltip]: que quantia você deseja apostar?"
 chariot_race.0130.t:0 "$chariot_race.0100.t$"
 chariot_race.0200.a.flavor:0 "Um panegírico resplandecente para o lugar de [honorary_guest.GetFirstNameNoTooltip] em minha estima imperial: que o povo cante o nome [honorary_guest.GetHerHim]!"
 chariot_race.0200.a:0 "Elogiar altamente meu convidado honrado."
 chariot_race.0200.b.flavor:0 "Uma alegoria sedutora para [honorary_guest.GetFirstNameNoTooltip]: que todos conheçam meu afeto por [honorary_guest.GetSheHe]!"
 chariot_race.0200.b:0 "Uma alegoria clássica, repleta de romance e vivacidade..."
 chariot_race.0200.c.flavor:0 "As massas contemplarão [honorary_guest.GetTitledFirstNameNoTooltip] lá no alto, ouvirão seu caminho para o púrpura pronunciado e virão a amar [honorary_guest.GetSheHe]."
 chariot_race.0200.c:0 "Eu apresentarei o herdeiro ao meu lado."
 chariot_race.0200.d.flavor:0 "Devo soltar os transgressores? Cortar impostos odiados? Renovar a cidade? Perseguir os desprezados? A multidão deve ser saciada..."
 chariot_race.0200.d:0 "Prometo abordar os problemas do povo."
 chariot_race.0200.desc:0 "Enquanto o mar de espectadores aguarda, considero a substância do meu discurso de abertura. É claro que irei entoar as formalidades antigas e impressionantes, mas também..."
 chariot_race.0200.e.failure:0 "A multidão assobia e vaias"
 chariot_race.0200.e.flavor:0 "Que a multidão cante em louvor ao seu [ROOT.Char.GetTitleAsNameNoTooltip]! Que eles #EMP saibam#! minha aptidão para as regalias soberanas!"
 chariot_race.0200.e.success:0 "Um discurso poderoso e digno"
 chariot_race.0200.e:0 "Farei menção às minhas conquistas imperiais."
 chariot_race.0200.f.flavor:0 "Quem melhor para fornecer veracidade — para as mentes de milhares — do que o governante escolhido de [ROOT.Char.GetFaith.HighGodName] seja [ROOT.Char.GetHerselfHimself]?"
 chariot_race.0200.f:0 "Expanda a história de [promoted_legend.GetName]."
 chariot_race.0200.g.failure:0 "A multidão grita o nome de [claimant.GetTitledFirstNameNoTooltip]"
 chariot_race.0200.g.flavor:0 "Quão facilmente o entusiasmo do dia pode se transformar em desprezo, com até o mais baixo dos pobres escarnecendo [claimant.GetNameNoTooltip] como um sucessor imperial!"
 chariot_race.0200.g.success:0 "Você humilha totalmente [claimant.GetTitledFirstNameNoTooltip]"
 chariot_race.0200.g:0 "Denigre publicamente um aspirante ao trono."
 chariot_race.0200.h.flavor:0 "Não está garantida a vitória contra [foe.GetPrimaryTitle.GetNameNoTooltip], se posso estar aqui desfrutando de festividades ociosas? Vamos nos empolgar com o prestígio iminente da vitória!"
 chariot_race.0200.h:0 "Gabar-me da minha guerra justa!"
 chariot_race.0200.i.flavor:0 "Não sangrou o tesouro para os prazeres dos comuns? Para que os detentores de cargos prosperem? Aqueles que buscam mais bondades devem procurar agradar seu [ROOT.Char.GetTitleAsNameNoTooltip]..."
 chariot_race.0200.i:0 "Falar sobre minha benevolência... e a lealdade que espero em troca"
 chariot_race.0200.intro_guest:0 "É hora. Liderando meu lar — e gentilmente incentivando meu convidado, [honorary_guest.GetTitledFirstName], com um gesto de meu braço — subo ao [Glossary( 'kathisma', 'KATHISMA_GLOSS')], nosso lugar honorário acima do pandemônio do Hipódromo.\n\n"
 chariot_race.0200.intro_no_guest:0 "É hora. Liderando meu lar, subo ao [Glossary( 'Kathisma', 'KATHISMA_GLOSS')], nosso lugar honorário acima do pandemônio do Hipódromo.\n\n"
 chariot_race.0200.t:0 "O Doador dos Jogos"
 chariot_race.0201.a.flavor:0 "Qual é a utilidade dessas diversões sem libações?"
 chariot_race.0201.a:0 "Com os discursos encerrados — um brinde à Fortuna!"
 chariot_race.0201.aa.discredit:0 "O trono pertence a [host.GetHouse.GetNameNoTooltip]!"
 chariot_race.0201.aa.honorary_guest:0 "[honorary_guest.GetTitledFirstNameNoTooltip] está em ascensão!"
 chariot_race.0201.ab:0 "[claimant.GetTitledFirstNameNoTooltip] reinará!"
 chariot_race.0201.angry_crowd:0 "\n\nA multidão está longe de ficar satisfeita. Seus aplausos massivos se misturam com gritos de exigências, insultos e cânticos vulgares."
 chariot_race.0201.appease_populace:0 "Promessas jorram: recuar impostos, liberar agitadores e lançar ouro onde as massas desejam. O [host.GetTitleAsNameNoTooltip] está se curvando — totalmente — à vontade da multidão tumultuada."
 chariot_race.0201.b.flavor:0 "Plante uma ideia na mente dos notáveis próximos: um verdadeiro orador ou mestre da política poderia ter realmente impressionado!"
 chariot_race.0201.b:0 "Que discurso indigno..."
 chariot_race.0201.c.flavor:0 "#EMP Sobreponha-se ao [host.GetTitleAsNameNoTooltip]! Deixe as massas intimidarem o tolo pomposo e clamarem por seu substituto!#!"
 chariot_race.0201.c:0 "Tenha agentes para instigar um contra-cântico!"
 chariot_race.0201.d.flavor:0 "E assim, ganhar minha parte do crédito pela nossa vitória atual."
 chariot_race.0201.d:0 "Eu irei contribuir para a causa!"
 chariot_race.0201.discredit_claimant_fail:0 "Diante de todos os presentes, [host.GetSheHe] difama o nome de [claimant.GetName], reclama das perspectivas [claimant.GetHerHim] e fica vermelho ao imaginar [claimant.GetSheHe] no trono."
 chariot_race.0201.discredit_claimant_self:0 "E quão rapidamente meu nome está nos lábios de todos! Pois o [host.GetTitleAsNameNoTooltip], tolo que [host.GetSheHe] é, difama publicamente minhas perspectivas e jura que nunca verei seu apoio ao trono!"
 chariot_race.0201.discredit_claimant_success:0 "Diante de todos os presentes, [host.GetSheHe] condena o nome de [claimant.GetName], eviscera sua perspectivas e jura que [claimant.GetSheHe] nunca sentará no trono!"
 chariot_race.0201.e.flavor:0 "[Select_CString( host.IsFemale, 'Minha', 'Meu' )] nobre [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))] — quem mais poderia oferecer as mesmas gentilezas?"
 chariot_race.0201.e:0 "Devo agradecer efusivamente ao [host.GetTitleAsNameNoTooltip]."
 chariot_race.0201.emperor_distant:0 "Com sussurros passando a mensagem distante, [host.GetTitledFirstNameNoTooltip] faz um discurso."
 chariot_race.0201.emperor_nervous:0 "O [host.GetTitleAsNameNoTooltip], um parapeito escondendo uma de suas mãos tremendo, fala ao povo."
 chariot_race.0201.emperor_unfazed:0 "O [host.GetTitleAsNameNoTooltip] absorve a expectativa em massa do povo e começa a pronunciar um discurso."
 chariot_race.0201.f:0 "Elogie nosso [host.GetTitleAsNameNoTooltip]!"
 chariot_race.0201.gain_influence:0 "[host.GetSheHe|U] descreve atos de caridade imperial e a lavishness das corridas que estão por vir. Quão grande é a generosidade [host.GetHerHim]! Quão bem recompensados são aqueles com fé no [host.GetTitleAsNameNoTooltip], aqueles que servem [host.GetSheHe] bem!"
 chariot_race.0201.happy_crowd:0 "\n\nAs massas rugem sua aclamação, embriagadas pelo ar do Hipódromo, uma cidade unida em louvor."
 chariot_race.0201.increase_legitimacy_fail:0 "A sua é uma história pálida e vazia: os elogios do [host.GetTitleAsNameNoTooltip] soam falsos. [host.GetSheHe|U] convoca o julgamento da multidão... enquanto parece muito com um bebê birrento vestido com o ornamento soberana."
 chariot_race.0201.increase_legitimacy_success:0 "A sua é uma história poderosa e digna: de uma vida nobre, de tribulações conquistadas. O [host.GetTitleAsNameNoTooltip] convoca o julgamento da multidão: não estava o ornamento soberano destinado desde o início?"
 chariot_race.0201.intro:0 "Dispostas ao redor do monumental Hipódromo em fileiras infinitas, a audiência inquieta aguarda seus corredores e seu [host.GetTitleAsName]. Finalmente, na imponente caixa imperial, uma pequena figura coroada de ouro aparece. As cerimônias de abertura começam.\n\n"
 chariot_race.0201.kathisma:0 "O clamor de milhares cresce cada vez mais alto. Sou levado junto com [Select_CString( host.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))], [host.GetTitledFirstName], enquanto o séquito [host.GetHerHim] sobe a escada em espiral para o alto [Glossary( 'kathisma', 'KATHISMA_GLOSS')] e as cerimônias de abertura das corridas começam.\n\n"
 chariot_race.0201.present_heir:0 "Parece que [host.GetSheHe] está usando esta ocasião para apresentar um herdeiro ao povo. Convidando aplausos de aclamação, o [host.GetTitleAsNameNoTooltip] proclama [honorary_guest.GetName] como digno dos ornamentos púrpuras."
 chariot_race.0201.present_heir_self:0 "Parece que [host.GetSheHe] está usando esta ocasião para apresentar um herdeiro ao povo. Convidando aplausos de aclamação, o [host.GetTitleAsNameNoTooltip] proclama que #EMP EU#! sou um candidato mais digno dos ornamentos púrpuras!"
 chariot_race.0201.seduce:0 "Com metáforas floridas e tumulantes e alusões clássicas, [host.GetSheHe] parece estar elogiando algum querido amado... ou uma personificação encantadora do [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]?"
 chariot_race.0201.seduce_self:0 "Com metáforas românticas floridas e tumulantes e alusões clássicas, [host.GetSheHe] parece estar elogiando uma personificação encantadora do [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]... ou #EMP eu?#!"
 chariot_race.0201.spread_legend:0 "Habilidosamente entrelaçadas nas frases usuais estão alucinações sobre [promote_legend.GetName]. A antiga cerimônia se torna indistinguível da narrativa imperial."
 chariot_race.0201.sway:0 "Um panegírico para [honorary_guest.GetName] toma forma. Acoplados a uma posição de honra na caixa imperial, esses elogios atraem [Select_CString( honorary_guest.IsFemale, 'a', 'o' )] [host.Custom2('RelationToMeShort', SCOPE.sC('honorary_guest'))] de [host.GetTitleAsNameNoTooltip] para a aura de grandeza palaciana."
 chariot_race.0201.sway_self:0 "[host.GetSheHe|U] oferece elogios às minhas virtudes e ao presente da minha companhia. Aqui, na caixa imperial, vejo que estou sendo atraído para a aura de grandeza palaciana."
 chariot_race.0201.t:0 "O Endereço de [host.GetTitleAsNameNoTooltip]"
 chariot_race.0201.war_support:0 "As suas exortações para a guerra justa contra [foe.GetName] caem sobre a multidão, as promessas de vitória [host.GetHerHim]. Esses jogos de guerra, [host.GetSheHe] proclama, são prova de que não tememos inimigo algum!"
 chariot_race.0202.desc:0 "As multidões indisciplinadas que assistem à sua Corrida de Carros estão incitadas contra você."
 chariot_race.0202.title:0 "Contra-Cânticos Contra o Discurso"
 chariot_race.0250.a:0 "Que os jogos comecem!"
 chariot_race.0250.desc:0 "Banho nas tonalidades douradas do sol do meio-dia, os gritos estrondosos da multidão saudam os carros. [activity.MakeScope.Var('first_place').Char.GetFirstName|U], [activity.MakeScope.Var('second_place').Char.GetFirstName], e [activity.MakeScope.Var('third_place').Char.GetFirstName], são os favoritos para vencer hoje. Eles estão prontos na linha de partida com as rédeas esticadas e os olhos em chamas de determinação.\n\nQuando as trompetas imperiais soam, os carros avançam, as rodas levantando poeira em um redemoinho de velocidade e habilidade. O chão sob meus pés treme com o trovão dos cascos e a corrida se desenrola com uma energia palpável."
 chariot_race.0250.t:0 "Que a Corrida Comece"
 chariot_race.0400.a:0 "Uma vitória bem merecida."
 chariot_race.0400.desc_emperor:0 "Como imperador, é uma grande honra para mim conceder a tradicional folha de palmeira a [activity.MakeScope.Var('first_place').Char.GetName] para marcar a vitória [activity.MakeScope.Var('first_place').Char.GetHerHim]. [activity.MakeScope.Var('second_place').Char.GetName] e [activity.MakeScope.Var('third_place').Char.GetName] recebem suas comendações, cada prêmio um testemunho de seu excepcional talento na arena."
 chariot_race.0400.desc_spectators:0 "Enquanto [activity.MakeScope.Var('first_place').Char.GetName] é apresentado com uma folha da palmeira para comemorar a vitória [activity.MakeScope.Var('first_place').Char.GetHerHim], a multidão explode em aplausos. [activity.MakeScope.Var('second_place').Char.GetName] e [activity.MakeScope.Var('third_place').Char.GetName] recebem suas comendações, cada prêmio um testemunho de seu excepcional talento na arena."
 chariot_race.0400.t:0 "Um Prêmio para o Vencedor"
 chariot_race.0500.a:0 "Até a próxima."
 chariot_race.0500.desc:0 "Enquanto o Hipódromo ecoa com os aplausos que vão se apagando dos [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')], eu tiro um momento para refletir sobre as exibições deslumbrantes de habilidade e competição que compõem nossa cultura.\n\nPara os vitoriosos, triunfo e glória; para a multidão, paixão ardente. O coração do império pulsa com fervor inigualável."
 chariot_race.0500.t:0 "O Fim dos Jogos"
 chariot_race.0600.a.dead:0 "Uma tragédia terrível..."
 chariot_race.0600.a.individual:0 "\"Excelente direção, [ROOT.Var('wager_target').Char.GetFirstNameNoTooltip]!\""
 chariot_race.0600.a.lost:0 "Melhor sorte na próxima vez..."
 chariot_race.0600.a.team:0 "\"Muito bem, [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]#EMP !#! \""
 chariot_race.0600.desc.bookmaker.no_money:0 "\n\nMeu [GetCourtPositionType('bookmaker_court_position').GetName()], [bookmaker.GetFirstName], relata que houve um número sem precedentes de apostas bem-sucedidas... e, consequentemente, lucros escassos para o império."
 chariot_race.0600.desc.bookmaker:0 "\n\nMeu [GetCourtPositionType('bookmaker_court_position').GetName()] [bookmaker.GetFirstName] trouxe uma quantia considerável das apostas. O império é [ROOT.Var('gold_gained_emperor').GetValue|V0] ouro mais rico. [bookmaker.GetFirstNameNoTooltip], é claro, levou sua parte habitual de dez por cento."
 chariot_race.0600.desc.dead:0 "Infelizmente, [ROOT.Var('wager_target').Char.GetFirst] não viveu para cruzar a linha de chegada."
 chariot_race.0600.desc.lost_individual:0 "Minha aposta em [ROOT.Var('wager_target').Char.GetFirstNameNoTooltip] foi mal concebida..."
 chariot_race.0600.desc.lost_team:0 "Minha aposta nos [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] foi mal concebida..."
 chariot_race.0600.desc.won_individual:0 "Minha aposta em [ROOT.Var('wager_target').Char.GetFirstNameNoTooltip] foi bem colocada!"
 chariot_race.0600.desc.won_team:0 "Minha aposta nos [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] foi bem colocada!"
 chariot_race.0600.intro:0 "Os três primeiros aurigas cruzam a linha de chegada! Aplausos irrompem para [activity.MakeScope.Var('first_place').Char.GetName], [activity.MakeScope.Var('second_place').Char.GetName] e [activity.MakeScope.Var('third_place').Char.GetName]. Uma exibição de velocidade e habilidade de tirar o fôlego marca o encerramento da corrida. A multidão rugindo, tomada de admiração, acrescenta aclamações estrondosas ao espetáculo.\n\n"
 chariot_race.0600.t:0 "Vitória para os [activity.MakeScope.Var('first_place').Char.Custom('GetChariotTeamColorPlural')]!"
 chariot_race.2050.c:0 "Muito bem, [last_place_charioteer.GetFirstNameNoTooltip]!"
 chariot_race.2050.d:0 "[ROOT.Char.GetFaith.HighGodName|U] ama alguns dos seus filhos mais do que outros..."
 chariot_race.3000.a.flavor:0 "As outras facções estão tumultuadas, armadas sobre essa jogada atrevida: é hora de deixar os [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] também agitados!"
 chariot_race.3000.a:0 "Tenha os agentes se juntando à briga iminente."
 chariot_race.3000.b.flavor:0 "Todos nós [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] devemos nos sentir empolgados por uma vitória iminente!"
 chariot_race.3000.b:0 "Um grande sacrifício pelos [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]#EMP !#!"
 chariot_race.3000.backing_sacrifice:0 "O motorista, que roda com minha moeda na cabeça [charioteer_sacrifice.GetHerHim], [charioteer_sacrifice.GetName], começa a desviar descontroladamente — para a esquerda, depois para a direita, e novamente para a esquerda. Por [ROOT.Char.GetFaith.HighGodName], é agonizantemente lento! Mas o grupo principal está preso atrás da barreira sinuosa [charioteer_sacrifice.GetHerHim]!\n\nEnquanto isso, [charioteer_leading.GetName], outro dos [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')], avança sem impedimentos."
 chariot_race.3000.c.flavor:0 "Os pobres apoiadores enganados de [charioteer_sacrifice.GetFirstNameNoTooltip] merecem alguma consideração!"
 chariot_race.3000.c:0 "Parece que alguns prosperam... mas outros não."
 chariot_race.3000.d:0 "\"Não! #EMP [charioteer_about_to_be_passed.GetFirstNameNoTooltip]!#!"
 chariot_race.3000.intro:0 "O grupo de carros está agrupado perto — tão perto que apenas um poderia desestabilizar todos os outros. Minha equipe é a primeira a aproveitar isso.\n\n"
 chariot_race.3000.not_backing_but_employs_sacrifice:0 "Meu auriga, [charioteer_sacrifice.GetName], começa a desviar descontroladamente — para a esquerda, depois para a direita, e novamente para a esquerda. Que esperteza, que ousadia! [charioteer_sacrifice.GetSheHe|U] está prendendo o grupo principal atrás da barreira sinuosa [charioteer_sacrifice.GetHerHim].\n\nEnquanto isso, outro dos [charioteer_leading.Custom('GetChariotTeamColorPluralGlossed')], [charioteer_leading.GetName], avança felizmente sem impedimentos!"
 chariot_race.3000.not_backing_sacrifice:0 "Um dos nossos motoristas, [charioteer_sacrifice.GetName], começa a desviar descontroladamente — para a esquerda, depois para a direita, e novamente para a esquerda. Que esperteza, que ousadia! [charioteer_sacrifice.GetSheHe|U] está prendendo o grupo principal atrás da barreira sinuosa [charioteer_sacrifice.GetHerHim].\n\nEnquanto isso, meu corredor escolhido, [charioteer_leading.GetName], avança felizmente sem impedimentos!"
 chariot_race.3000.t:0 "Escudo dos [ROOT.Char.Custom('GetChariotTeamColorPlural')]"
 chariot_race.3010.a.failure:0 "A multidão continua a entrar em pânico"
 chariot_race.3010.a.failure_title:0 "$chariot_race.3010.a.failure$"
 chariot_race.3010.a.success:0 "A multidão se acalma"
 chariot_race.3010.a.success_title:0 "$chariot_race.3010.a.success$"
 chariot_race.3010.a:0 "Faça um discurso para acalmar a multidão."
 chariot_race.3010.b:0 "Comissione uma estátua em honra a [first_place_charioteer.GetSheHe]."
 chariot_race.3010.c:0 "\"[first_place_charioteer.GetFirstNameNoTooltip] terá um funeral digno de suas conquistas.\""
 chariot_race.3010.desc:0 "Por um breve momento, [first_place_charioteer.GetFirstName] teve asas. [first_place_charioteer.GetSheHe|U] voou à frente do grupo, garantindo o primeiro lugar e colocando distâncias entre [first_place_charioteer.GetHerselfHimself] e os outros aurigas.\n\nPor um breve momento, o glorioso carro [first_place_charioteer.GetHerHim] iluminou o Hipódromo... mas [first_place_charioteer.GetFirstNameNoTooltip] não era um Helios. Voando muito perto da grandeza, nosso próprio [Glossary( 'Phaethon', 'PHAETHON_GLOSS' )] caiu. O corpo contorcido [first_place_charioteer.GetHerHim|U] e um longo rastro de sangue agora dominam a poeira da pista — o último testemunho da ambição [first_place_charioteer.GetHerHim]."
 chariot_race.3010.t:0 "Descanse, [first_place_charioteer.GetFirstNameNoTooltip]"
 chariot_race.3020.a.flavor:0 "Violência - #EMP em meu nome!#!"
 chariot_race.3020.a:0 "Incite os fãs de [wager_target.GetFirstNameNoTooltip] à violência!"
 chariot_race.3020.b:0 "Um momento para distribuir libações..."
 chariot_race.3020.c:0 "Em quem você aposta para ganhar, [special_guest.GetFirstNameNoTooltip]?"
 chariot_race.3020.d.placement_bad:0 "Ainda há tempo. [wager_target.GetSheHe|U] ainda tem uma chance."
 chariot_race.3020.d.placement_first:0 "Vamos... só mais um pouco!"
 chariot_race.3020.d.placement_good:0 "Continue assim, [wager_target.GetFirstNameNoTooltip]!"
 chariot_race.3020.d.placement_last:0 "Esta é a última vez que aposto nos [wager_target.Custom('GetChariotTeamColorPluralGlossed')]..."
 chariot_race.3020.intro:0 "Tendo apostado [ROOT.Var('wager_value').GetValue] ouro em [wager_target.GetFirstName] para [ROOT.Char.Custom('GetWinPlaceShow')], me esforço para manter um olhar atento sobre o desempenho [wager_target.GetHerHim]. [wager_target.GetSheHe|U] está atualmente em... #EMP;ALTA [wager_target.Custom('GetChariotRacePlacement')] posição!#!\n\n"
 chariot_race.3020.placement_bad:0 "As probabilidades não estão a nosso favor..."
 chariot_race.3020.placement_first:0 "Estou ansioso para exultar no iminente triunfo de [wager_target.GetFirstNameNoTooltip]! Aqui vem o pagamento!"
 chariot_race.3020.placement_good:0 "Antecipando uma possível reviravolta, observo atentamente enquanto [wager_target.GetFirstNameNoTooltip] navega pela competição de sua posição vantajosa."
 chariot_race.3020.placement_last:0 "#EMP ÚLTIMO LUGAR?!#! Meu coração afunda enquanto [wager_target.GetFirstNameNoTooltip] enfrenta desafios na pista, atualmente ficando em último lugar, e eu rezo por alguma reviravolta inesperada."
 chariot_race.3020.t:0 "As Perspectivas da Minha Aposta"
 chariot_race.3030.a:0 "Levantem um brinde ao sucesso de [trailing_charioteer.GetFirstNameNoTooltip]."
 chariot_race.3030.b:0 "Se você não pode vencê-los... faça-os seus."
 chariot_race.3030.c:0 "Mau sorte, [leading_charioteer.GetFirstNameNoTooltip]."
 chariot_race.3030.desc:0 "Em uma surpreendente virada, [trailing_charioteer.GetFirstName] [trailing_charioteer.Custom('GetVictoriousChariotMovement')] e ultrapassa [leading_charioteer.GetFirstName] para a [trailing_charioteer.Custom('GetChariotRacePlacement')] posição!\n\nA multidão vai à loucura!"
 chariot_race.3030.desc_teams:0 "Aqueles que apoiam os [trailing_charioteer.Custom('GetChariotTeamColorPluralGlossed')] exibem suas cores e levantam um grande brado... enquanto os que apoiam os [leading_charioteer.Custom('GetChariotTeamColorPluralGlossed')] resmungam de descontentamento."
 chariot_race.3030.t:0 "[trailing_charioteer.GetShortUINameNoTooltip] Passa [leading_charioteer.GetShortUINameNoTooltip]!"
 chariot_race.3040.a:0 "Essas almas corajosas terão um funeral luxuoso."
 chariot_race.3040.b.both_survive:0 "Ambos os aurigas sobrevivem"
 chariot_race.3040.b.chariot_one_survives:0 "[charioteer_1.GetFirstNameNoTooltip|U] sobrevive"
 chariot_race.3040.b.chariot_two_survives:0 "[charioteer_2.GetFirstNameNoTooltip|U] sobrevive"
 chariot_race.3040.b.no_survivors:0 "Nenhum dos aurigas sobrevive"
 chariot_race.3040.b.tt:0 "Sobreviventes serão puxados dos destroços"
 chariot_race.3040.b:0 "Aguarde a próxima volta! Eles ainda podem estar vivos!"
 chariot_race.3040.c:0 "Que espetáculo! ISSO é uma corrida de carruagens!"
 chariot_race.3040.d:0 "Que horror... Eu vou rezar por eles."
 chariot_race.3040.desc:0 "[charioteer_1.GetName|U] e [charioteer_2.GetName] lutam pela posição, cada um de seus carros raspando e batendo no outro. Eles agarram as rédeas enquanto se aproximam da curva. Os carros não conseguem se soltar um do outro!\n\nA roda de [charioteer_1.GetFirstName|U] se despedaça em fragmentos. O carro [charioteer_1.GetHerHim|U] desvia descontroladamente e colide com o carro de [charioteer_2.GetFirstName]. Os gritos dos cavalos e o fedor de seu sangue se elevam da destruição. Nenhum dos dois aurigas parece estar se movendo."
 chariot_race.3040.t:0 "Um Emaranhado Traiçoeiro"
 chariot_race.3050.a:0 "#EMP [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] reina supremo!#!"
 chariot_race.3050.b:0 "[last_place_charioteer.GetSheHe|U] será meu."
 chariot_race.3050.desc:0 "O ar estala de tensão.\n\n[last_place_charioteer.GetFirstName], um auriga antes ignorado, desafia todas as probabilidades, [last_place_charioteer.Custom('GetChariotComebackMovement')] em uma verdadeira [Glossary( 'aristeia', 'GLOSS_ARISTEIA')].\n\nSustos ecoam pelas arquibancadas enquanto as cores vibrantes dos [last_place_charioteer.Custom('GetChariotTeamColorPluralGlossed')] avançam. A multidão, inicialmente silenciosa em descrença, irrompe em um rugido estrondoso!"
 chariot_race.3050.t:0 "Um Triunfo Improvável"
 chariot_race.4000.a.critical_failure:0 "[target_governor.GetFirstNameNoTooltip] se torna seu rival"
 chariot_race.4000.a.critical_failure_title:0 "$chariot_race.4000.a.critical_failure$"
 chariot_race.4000.a.critical_success:0 "[target_governor.GetFirstNameNoTooltip] se torna seu fã adorador"
 chariot_race.4000.a.critical_success_title:0 "$chariot_race.4000.a.critical_success$"
 chariot_race.4000.a.failure:0 "Você falha em convencer [target_governor.GetFirstNameNoTooltip] de seu valor"
 chariot_race.4000.a.failure_title:0 "$chariot_race.4000.a.failure$"
 chariot_race.4000.a.success:0 "Você convence [target_governor.GetFirstNameNoTooltip] de seu valor"
 chariot_race.4000.a.success_title:0 "$chariot_race.4000.a.success$"
 chariot_race.4000.a:0 "Devo exaltar taticamente minhas virtudes como governante."
 chariot_race.4000.b:0 "Eu me pergunto que agentes [target_governor.GetFirstNameNoTooltip] tem aqui..."
 chariot_race.4000.c.failure:0 "[target_governor.GetFirstNameNoTooltip] não está interessado em sua lenda"
 chariot_race.4000.c.success:0 "[target_governor.GetFirstNameNoTooltip] começa a promover sua lenda"
 chariot_race.4000.c:0 "Eu me pergunto se [target_governor.GetFirstNameNoTooltip] ouviu as histórias que contam sobre mim?"
 chariot_race.4000.d.failure:0 "Você falha em manipular [target_governor.GetTitledFirstName]"
 chariot_race.4000.d.success:0 "Você manipula com sucesso [target_governor.GetTitledFirstName]"
 chariot_race.4000.d:0 "Ah, uma oportunidade de expandir meu alcance político!"
 chariot_race.4000.desc:0 "\"Ah, veja só! [activity.MakeScope.Var('first_place').Char.GetName] está na liderança!\" [target_governor.GetTitledFirstName|U] se aproxima de mim. O sorriso [target_governor.GetHerHim|U] é tão largo que [last_place.GetFirstName] se vira.\n\n\"[target_governor.Custom('GetGovernorChitChat')] Como você está, querido [ROOT.Char.GetFirstNameNoTooltip]?\"\n\nUma conversa tão educada entre governadores poderia ser direcionada a tópicos mais produtivos..."
 chariot_race.4000.f:0 "Nunca subestime o valor de amigos em altos postos."
 chariot_race.4000.g.flavor:0 "Você solta um insulto que quebra a ambição de [target_governor.GetFirstNameNoTooltip]"
 chariot_race.4000.g:0 "Talvez seja hora de colocar [target_governor.GetFirstNameNoTooltip] em seu lugar..."
 chariot_race.4000.t:0 "Raspando Cotovelos"
 chariot_race.4010.a:0 "[unpopular_official.GetTitledFirstNameNoTooltip|U] será destituído de sua posição."
 chariot_race.4010.b.tt.failure:0 "Os gritos apenas aumentam"
 chariot_race.4010.b.tt.success:0 "A multidão está encantada"
 chariot_race.4010.b:0 "Acalme a multidão. Envie servos para lhes lançar prêmios!"
 chariot_race.4010.c:0 "Inaceitável. Eu preciso das habilidades de [unpopular_official.GetFirstNameNoTooltip]."
 chariot_race.4010.d:0 "Junte-se ao canto! Fora com [unpopular_official.GetTitledFirstNameNoTooltip]!"
 chariot_race.4010.desc:0 "Um rugido se eleva da multidão, depois se espalha, repete a si mesmo, tornando-se um canto. Eu me inclino para frente, esforçando-me para captar as palavras. O [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] está pisando, apontando, gritando um nome: #EMP \"Fora com [unpopular_official.GetTitledFirstName]! Fora com [unpopular_official.GetTitledFirstNameNoTooltip]!\"#!\n\nEu soube que [unpopular_official.GetTitledFirstNameNoTooltip] estava ganhando uma certa reputação, mas não imaginei que as pessoas estivessem tão zangadas!"
 chariot_race.4010.e:0 "Inicie um novo canto! #EMP \"[ROOT.Char.GetFaith.HighGodName] proteja [emperor_scope.GetTitledFirstNameNoTooltip]!\"#!"
 chariot_race.4010.f:0 "Sente-se em um silêncio desconfortável."
 chariot_race.4010.t:0 "Fora com [unpopular_official.GetTitledFirstNameNoTooltip]!"
 chariot_race.4020.a.failure:0 "[notable.GetFirstNameNoTooltip] aprecia sua alta consideração"
 chariot_race.4020.a.flavor:0 "E em [ROOT.Char.GetCapitalLocation.GetNameNoTooltip], que todos os nossos parentes estejam unidos!"
 chariot_race.4020.a.success:0 "[notable.GetFirstNameNoTooltip] se torna um valioso confidente"
 chariot_race.4020.a:0 "Você sempre será bem-vindo em meu palácio!"
 chariot_race.4020.b:0 "Venha, venha! Um emprego digno aguarda!"
 chariot_race.4020.c.flavor:0 "[notable.GetTitledFirstNameNoTooltip] não precisa residir lá em tempo integral... mas ele #EMP deve#! honrar tal ato de generosidade."
 chariot_race.4020.c:0 "Vou equipar uma bela casa de campo para você."
 chariot_race.4020.d.flavor:0 "E a propriedade de [notable.GetTitledFirstNameNoTooltip] lida com eles prodigiosamente..."
 chariot_race.4020.d:0 "Mas são os #EMP comerciantes#! de [current_estate.GetNameNoTooltip] que realmente precisamos."
 chariot_race.4020.desc:0 "\"[Glossary( 'thermae', 'THERMAE_GLOSS')] opulentas, você diz?\" reflete [notable.GetName], suas palavras quase perdidas no tumulto da multidão, \"Eu não imaginava que [ROOT.Char.GetCapitalLocation.GetName] fosse um lugar de tamanha sofisticação...\"\n\nEnquanto falo dos meus planos para [ROOT.Char.GetPrimaryTitle.GetNameNoTier], um ar sonhador toma conta do olhar distante de [notable.GetTitledFirstNamePossessiveNoTooltip].\n\n\""
 chariot_race.4020.desc_capital_estate:0 "\"Na verdade,\" [notable.GetSheHe] diz, \"As vozes dos meus parentes estão perdidas no alvoroço, nas disputas, da capital, e nossos filhos expostos a todos os vícios... talvez uma casa [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] se encaixasse bem na Casa [notable.GetHouse.GetName]."
 chariot_race.4020.desc_provincial_estate:0 "\"Na verdade,\" diz [notable.GetSheHe], \"Minha família janta com frequência demais com caipiras e desconhecidos em [current_estate.GetName]... e parece que seu ministério poderia fazer bom uso de oficiais com o nome de [notable.GetHouse.GetName].\""
 chariot_race.4020.t:0 "Os Encantos de [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]"
 chariot_race.4030.a.failure:0 "[john.GetFirstNameNoTooltip] te repreende publicamente"
 chariot_race.4030.a.flavor:0 "...e uma vez que [john.GetTitledFirstNameNoTooltip] tenha se divertido com suas nojentas diversões, eu ficarei sabendo de um segredo sujo!"
 chariot_race.4030.a.success:0 "Você leva [john.GetFirstNameNoTooltip] para as sombras"
 chariot_race.4030.a:0 "#EMP Ou#! eu poderia atrair uma parte interessada..."
 chariot_race.4030.b.failure:0 "[seduce_interest.GetFirstNameNoTooltip] está completamente escandalizada"
 chariot_race.4030.b.flavor:0 "Eu estaria #EMP muito#! disposto a levar ess[Select_CString( seduce_interest.IsFemale, 'a', 'e' )] [seduce_interest.GetWomanMan] fantasios[Select_CString( seduce_interest.IsFemale, 'a', 'o' )] para algum lugar ilícito e anônimo!"
 chariot_race.4030.b.success:0 "[seduce_interest.GetFirstNameNoTooltip] se entrega a você"
 chariot_race.4030.b:0 "Algo para vermos nós mesmos, [Select_CString( seduce_interest.IsFemale, 'minha', 'meu' )] [seduce_interest.GetLadyLord]...?"
 chariot_race.4030.c.flavor:0 "Dizem que as prostitutas de [host.GetCapitalLocation.GetNameNoTooltip] são habilidosas como nenhuma outra [prostitute.GetWomenMen]..."
 chariot_race.4030.c:0 "Isso realmente soa... atraente..."
 chariot_race.4030.d:0 "Agora vou apenas assistir à corrida."
 chariot_race.4030.desc:0 "Finalmente consegui me aproximar de [seduce_interest.GetName]. [seduce_interest.GetSheHe|U] parece estar de bom humor.\n\n\"Você pode acreditar, bom [ROOT.Char.GetFirstName],\" sussurra a linda [seduce_interest.GetFirstNameNoTooltip], \"Prostitutas da capital — como aquel[Select_CString( prostitute.IsFemale, 'a', 'e' )] [prostitute.GetWomanMan] — levam os nobres [ROOT.Char.GetWomenMen] para debaixo das arquibancadas... e...\"\n\n[seduce_interest.GetSheHe|U] cora profundamente.\n\n\"Imagine ter tal coragem! Deve ser como outro mundo lá embaixo: os negócios sussurrados no calor abafado, enquanto todos são renascidos como estranhos na escuridão..."
 chariot_race.4030.desc_no_seduction:0 "O espetáculo da carruagem não é a única diversão do dia — não é só isso que acende as paixões de [ROOT.Char.GetWomenMen]. À medida que os espíritos se aquecem, prostitutas deslizam pela multidão e praticam seu ofício.\n\nUm rosto pintado — um especialmente formoso — sorri para mim de forma convidativa. Que ousadia [prostitute.GetHerHim] se aproximar desses lugares de honra! Mas mesmo aqui... eu poderia facilmente pegar a mão [prostitute.GetHerHim] e seguir seu corpo perfumado para um lugar isolado..."
 chariot_race.4030.t:0 "As Bebidas do Hipódromo"
 chariot_race.4031.a.flavor:0 "Na próxima vez, porém, vamos estar sob os lençóis!"
 chariot_race.4031.a:0 "Certamente não estou deixando você escapar."
 chariot_race.4031.b.flavor:0 "...uma ocasião única sem qualquer significado duradouro, sim."
 chariot_race.4031.b:0 "Que ocasião são as corridas!"
 chariot_race.4031.desc:0 "Torções e reviravoltas intermináveis, sempre descendentes, nos levam a uma aviário vazio. Enquanto as pombas cooam pela vinda da paz, [besexed.GetTitledFirstName] e eu nos unimos.\n\nCada músculo tensionado, cada momento olhando furtivamente para a porta, mantenho [besexed.GetSheHe] perto até, finalmente, alcançar a satisfação. Ligeiramente, a multidão ruge.\n\n"
 chariot_race.4031.desc_prostitute:0 "\"Você é como poucos outros, [ROOT.Char.Custom('FormOfAddressForLiege')],\" sussurra [besexed.GetFirstNameNoTooltip], traçando desenhos como cordões de bolsa na minha pele nua. \"Ouso sonhar que você me procurará novamente?\""
 chariot_race.4031.desc_seduced:0 "\"Que escandaloso,\" sussurra [besexed.GetFirstNameNoTooltip], saboreando nossa sórdida fantasia. \"Ouso sonhar que isso significa que agora estou a seu serviço, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
 chariot_race.4031.t:0 "O Primeiro a Terminar"
 chariot_race.4040.a.flavor:0 "Garanta secretamente a ajuda desse bajulador e da turba violenta [common_fan.GetHerHim]."
 chariot_race.4040.a:0 "Hmm... esses leais vagabundos parecem úteis..."
 chariot_race.4040.b.failure:0 "Você falha em incitar alguém"
 chariot_race.4040.b.flavor:0 "Incentive os membros da deme a emigrar para um futuro bastião dos [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]."
 chariot_race.4040.b.success:0 "A deme ruge seu nome"
 chariot_race.4040.b:0 "[ROOT.Char.GetCapitalLocation.GetNameNoTooltip] é onde os verdadeiros [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')] pertencem!"
 chariot_race.4040.c.flavor:0 "E assim me tornar o foco de toda a camaradagem deles."
 chariot_race.4040.c:0 "Eu liderarei um poderoso comício de #EMP todos#! [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]!"
 chariot_race.4040.d:0 "Melhor celebrar apenas com os nobres [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]..."
 chariot_race.4040.desc:0 "\"#EMP [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]! [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]! [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]!\"#! vem o canto de baixo, crescendo mais alto à medida que o comum suado [common_fan.GetName] tropeça de joelhos diante de [noble_fan.GetTitledFirstName] e eu.\n\n\"Nobres prelados,\" vozes [common_fan.GetSheHe], \"vocês estão entre os maiores e verdadeiros apoiadores do nosso amado [ROOT.Char.Custom('GetChariotTeamColorPluralGlossed')]! Você se importaria em se juntar a nós — erguer um copo com alguns compatriotas leais e robustos? Prometo manter os meninos longe de brigas e arremessos de pedras, eu juro!\"\n\n[noble_fan.GetFirstNameNoTooltip] e os outros nobres parecem estar de bom humor, mas mesmo assim... todos se encolhem ao pensar na multidão."
 chariot_race.4040.discord_tt:0 "#high $sow_discord_intent$#! Os efeitos da [intent|E] são aprimorados"
 chariot_race.4040.t:0 "Os [ROOT.Char.Custom('GetChariotTeamColorPlural')], Unidos!"
 chariot_race.4040.team_popularity_rally_tt:0 "Este resultado é afetado pela popularidade da sua equipe"
 chariot_race.4040.team_popularity_tt:0 "Esse @influence_icon![influence|E] é baseado na popularidade da sua equipe"
 chariot_race.4040.thugs_tt:0 "Sua [intent|E] #high $murder_attendee_intent$#! tem mais chances de sucesso"
 chariot_race.4050.a.failure:0 "Seu assassino é interceptado"
 chariot_race.4050.a.flavor:0 "[victim.GetFirstNameNoTooltip] emprestará o glamour da morte ao espetáculo do dia."
 chariot_race.4050.a.success:0 "[victim.GetFirstNameNoTooltip] sofre uma queda misteriosa"
 chariot_race.4050.a:0 "É hora de meus agentes enviarem [victim.GetSheHe] rolando..."
 chariot_race.4050.b.failure:0 "[victim.GetFirstNameNoTooltip] resiste a você"
 chariot_race.4050.b.flavor:0 "Você agarra [victim.GetFirstNameNoTooltip] e #EMP muito#! de forma pouco sutil tenta jogar o corpo odioso [victim.GetHerHim] sobre a balaustrada."
 chariot_race.4050.b.success:0 "Você envia [victim.GetFirstNameNoTooltip] despencando"
 chariot_race.4050.b:0 "#EMP Eu#! lançarei esse porco para SUA DESGRAÇA!"
 chariot_race.4050.c:0 "Muito, muito público."
 chariot_race.4050.desc.kathisma:0 "para baixo da alta caixa imperial, todo o orgulho do lugar perdido para o corpo quebrado [victim.GetHerHim], enquanto jaz esparramado entre os comuns gritando.\n\nO clima do Hipódromo se torna cada vez mais jovial, cada vez mais enamorado por seu concurso. Com guardas imperiais ao redor, não pode haver momento perfeito para colocar as mãos em [victim.GetName], mas #EMP isso#! parece tão bom quanto qualquer outro."
 chariot_race.4050.desc.lackey:0 "Preciso apenas passar a palavra para meu leal executor [lackey.GetFirstName]."
 chariot_race.4050.desc.non_abrahamic:0 "[victim.Custom2('InsultNoun', ROOT.Char)] [victim.Custom2('InsultAdjective', ROOT.Char)|U] que [victim.GetSheHe] é, [Select_CString( victim.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] merece cair... para baixo, para baixo...."
 chariot_race.4050.desc.outro:0 "\n\nQuão perto está o tolo de uma ruína horrenda..."
 chariot_race.4050.desc.track:0 "para baixo na areia ardente, onde as rodas das carruagens quebrarão os ossos [victim.GetHerHim], onde cascos de ferro destruirão aquele maldito rosto.\n\nCom a corrida se intensificando, [victim.GetTitledFirstName] ocupa um lugar à frente das arquibancadas, praticamente se inclinando sobre a balaustrada enquanto [victim.GetSheHe] saboreia a ação abaixo."
 chariot_race.4050.desc:0 "Como um anjo rebelde, como meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))] merece cair... para baixo,"
 chariot_race.4050.might_be_imprisoned:0 "[host.GetShortUIName] pode [imprison|E] você"
 chariot_race.4050.might_die:0 "@death_icon! Você pode ser morto"
 chariot_race.4050.t:0 "Para baixo..."
 chariot_race.4051.a:0 "Uma aposta pobre..."
 chariot_race.4051.a_triumph:0 "Um triunfo digno para o Hipódromo!"
 chariot_race.4051.agents_fail_secret:0 "Mas, infelizmente — quando meu agente avança sobre seu alvo, os companheiros de [victim.GetFirstName] pulam para a briga! Durante a luta que se segue, por sorte para mim, o assassino é esfaqueado até a morte.\n\n[victim.GetNameNoTooltip] aprendeu que [victim.GetSheHe] não está seguro nessas corridas... mas [victim.GetSheHe] não sabe quem suspeitar por isso."
 chariot_race.4051.agents_fail_snitch:0 "Mas, infelizmente — quando meu agente avança sobre seu alvo, os companheiros de [victim.GetFirstName] saltam para a briga! Meu assassino é rapidamente dominado. Então, enquanto sofre alguns chutes, pisões e golpes nas partes baixas, o incompetente #EMP entrega meu nome!#!\n\nEstou começando a me sentir bastante indesejado neste Hipódromo..."
 chariot_race.4051.agents_success:0 "Um grande clamor é levantado — [victim.GetFirstNameNoTooltip] é erguido sobre a balaustrada e, com suas vestes e sedas rodopiando, [victim.GetSheHe] despenca de cabeça! Como um pássaro extravagante atingido, o corpo [victim.GetHerHim] cai à terra."
 chariot_race.4051.kathisma_attempt:0 "Um servo é moldado ao meu desejo: compelido à sua certa ruína com promessas de rica recompensa. O assassino entra no [Glossary( 'kathisma', 'KATHISMA_GLOSS')]#!, carregado de iguarias, e se aproxima de [victim.GetTitledFirstName].\n\n"
 chariot_race.4051.self_attempt:0 "O ódio firme me rege. Avançando para o ataque, agarro as roupas de [victim.GetTitledFirstName], desvio a resistência chocada [victim.GetHerHim] e lanço [victim.GetSheHe] em direção ao abismo ensolarado.\n\n"
 chariot_race.4051.self_failed_death:0 "Mas meu alvo não cai livremente. E — por [ROOT.Char.GetFaith.HighGodName] — minhas pernas estão sem força! Eu colapso no assento de [victim.GetFirstNameNoTooltip]. Sangue jorra de uma ferida de faca em meu peito.\n\n[victim.GetNameNoTooltip] fica sobre mim, com uma adaga na mão, gritando furiosamente. Mas [ROOT.Char.GetFaith.DeathDeityName] me chama para longe..."
 chariot_race.4051.self_failed_survive:0 "Mas meu alvo não cai livremente. [victim.GetFirstNameNoTooltip] agarra meu manto com força; [victim.GetSheHe] puxa meu cabelo, me arrasta para uma luta feia. Espectadores rapidamente me agarram e me jogam de volta na companhia de meus guardas.\n\nUm momento desconfortável de impasse é mantido, antes que eu me retire furioso."
 chariot_race.4051.self_failed_survive_kathisma:0 "Mas meu alvo não cai livremente. [victim.GetFirstNameNoTooltip] agarra meu manto com força; [victim.GetSheHe] puxa meu cabelo, me arrasta para uma luta feia. Guardas imperiais rapidamente me seguram.\n\nLá em cima, acima da vasta multidão, sou algemado."
 chariot_race.4051.stands_attempt:0 "Observando à distância, consigo apenas distinguir a cabeça pesada do meu robusto assassino, enquanto ele se esgueira pelas arquibancadas lotadas em direção a [victim.GetTitledFirstName].\n\n"
 chariot_race.4051.success_death_stands:0 "\n\nEspectadores se aglomeram nas arquibancadas no local do impacto, suas revelações se espalhando: [victim.GetNameNoTooltip] está morto!"
 chariot_race.4051.success_death_track:0 "\n\nO timing não poderia ser melhor. As carruagens desviam selvagemente, buscando evitar seu novo obstáculo, mas uma [Glossary( 'quadriga', 'QUADRIGA_GLOSS')] ainda atropela brutalmente a forma encurvada de [victim.GetFirstNameNoTooltip]. É instantaneamente aparente: [victim.GetNameNoTooltip] está morto!"
 chariot_race.4051.success_infirm_stands:0 "\n\nEspectadores se aglomeram nas arquibancadas no local do impacto, suas revelações se espalhando: [victim.GetNameNoTooltip] vive, embora apenas por um triz!"
 chariot_race.4051.success_infirm_track:0 "\n\nAtendentes correm até a forma encurvada de [victim.GetFirstNameNoTooltip], deitada na areia. A notícia se espalha: [victim.GetNameNoTooltip] ainda vive, embora apenas por um triz!"
