l_spanish:
 5_percent_governor_efficiency_tooltip:0 "[governor_efficiency|E]: @governor_efficiency!#positive_value +5%#!"
 CHARIOTEERS_WINDOW_LABEL:0 "Charioteiros"
 CHARIOTEER_APTITUDE_GUI_TOOLTIP:0 "[aptitude|E] de [Character.GetFirstNameNoTooltip] para condução de carroças é [Character.GetCourtPositionAptitude( GetCourtPositionType( 'charioteer_court_position' ) )]"
 CHARIOTEER_SORT_METHOD_APTITUDE:0 "Ordenado por [aptitude|E]"
 CHARIOTEER_SORT_METHOD_PLACE:0 "Ordenado por posição"
 DEMES_GLOSS:0 "Organizações esportivas e políticas centradas nas corridas de carroças. Uma vez, os #EMP demes#! eram de grande importância na vida cívica, mas desde então diminuíram e foram trazidos sob o controle imperial."
 GLOSS_ARISTEIA:0 "Uma #EMP aristeia#! descreve um momento inspirado divinamente em que um herói consegue realizar feitos extraordinários e impressionantes."
 GLOSS_PLACE:0 "Um competidor fica em posição se terminar em primeiro ou segundo lugar."
 GLOSS_SHOW:0 "Um competidor mostra se terminar em primeiro, segundo ou terceiro lugar."
 GLOSS_WIN:0 "Um competidor só vence se terminar em primeiro."
 HOI_POLLOI_GLOSS:0 "Literalmente significando 'os muitos', este termo grego antigo refere-se às classes mais baixas dentro da sociedade bizantina."
 KATHISMA_GLOSS:0 "A caixa imperial do Hipódromo. Uma escada em espiral ligava esta área de observação ao palácio, proporcionando ao Basileus facilidade de entrada... e uma saída segura."
 PHAETHON_GLOSS:0 "Na mitologia grega antiga, Phaethon foi atingido pelo raio de Zeus depois de tentar conduzir a carruagem de seu pai Helios pelo céu."
 QUADRIGA_GLOSS:0 "Uma carroça puxada por quatro cavalos. Rápida, perigosa e cara, a #EMP téthrippa#!, ou #EMP quadrigae#!, tem sido o veículo favorito de reis, imperadores e deuses desde os tempos antigos."
 THERMAE_GLOSS:0 "Um complexo de banhos de origem romana, que servia não apenas para limpar o corpo, mas para facilitar uma variedade de interações sociais."
 YOUR_CHARIOTEER_TOOLTIP:0 "Você emprega [Character.GetShortUIName] como seu [GetCourtPositionType( 'charioteer_court_position' ).GetName]."
 YOUR_WAGER_TOOLTIP:0 "[GetPlayer.Custom('BuildChariotRaceWagerTooltip')]"
 activity_chariot_race:0 "Corrida de Carroças"
 activity_chariot_race_conclusion_desc:0 "A [GetActivityType( 'activity_chariot_race' ).GetName] foi concluída."
 activity_chariot_race_desc:0 "Como [GetPlayer.GetTitleAsNameNoTooltip], sou eu quem pode organizar espetaculares corridas de carroças para emocionar o [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] e atrair os notáveis do [GetPlayer.GetPrimaryTitle.GetTierAsNameNoTooltip|l] para a capital.\n\nAtravés dessas ocasiões públicas, o povo passa a me conhecer como seu mestre; no rugido da multidão, posso esperar ouvir aclamações."
 activity_chariot_race_destination_selection:0 "Você só pode organizar Corridas de Carroças em sua [capital|E]."
 activity_chariot_race_guest_desc:0 "\n#weak Embora seja esperado de todos no reino, assistir às Corridas de Carroças no Hipódromo oferece uma chance de se misturar com a elite imperial e aumentar sua [influence|E].\n\nUma pequena taxa de admissão de [gold_i][EmptyScope.ScriptValue('chariot_race_entrance_fee')|0] é exigida de todos os convidados."
 activity_chariot_race_guest_help_text:0 "Embora seja esperado de todos no reino, assistir às Corridas de Carroças no Hipódromo oferece uma chance de se misturar com a elite imperial e aumentar sua [influence|E].\n\nUma pequena taxa de admissão de [gold_i][EmptyScope.ScriptValue('chariot_race_entrance_fee')|0] é exigida de todos os convidados."
 activity_chariot_race_host_desc:0 "$BULLET_WITH_TAB$ Pode ganhar @influence_icon![influence|E]\n$BULLET_WITH_TAB$ Pode ganhar [GetLocalPlayerLegitimacyTextIcon][legitimacy|E]\n$BULLET_WITH_TAB$ Pode ganhar @gold_icon![gold|E]\n$BULLET_WITH_TAB$ Pode ganhar #N #EMP ou perder#!#! [county_opinion|E]"
 activity_chariot_race_pay_entrance_fee:0 "Taxa de Entrada Paga"
 activity_chariot_race_predicted_cost:0 "O custo de [GetActivityType( 'activity_chariot_race' ).GetNameNoTooltip] é principalmente afetado pelas [activity_options|E] que você selecionar."
 activity_chariot_race_selection_tooltip:0 "Organize grandes corridas de carroças para agradar ao público e consolidar sua posição como [GetPlayer.GetTitleAsNameNoTooltip]\n\nRecompensas Esperadas:\n$BULLET_WITH_TAB$@influence_icon![influence|E]\n$BULLET_WITH_TAB$@gold_icon![gold|E]"
 activity_invite_rule_charioteers:0 "Condutores de Carroças"
 activity_window_character_chariot_race_honorary_guest:0 "[honorary_guest|E]\n[Character.GetShortUINameNoTooltip|U]"
 activity_window_character_chariot_race_honorary_guest_traveling:0 "$activity_window_character_chariot_race_honorary_guest$"
 appease_populace_intent:0 "Apaziguar a População"
 appease_populace_intent_desc:0 "Você pretende aumentar sua [legitimacy|E] e [county_opinion|E] em sua [realm_capital|E], [GetPlayer.GetCapitalLocation.GetNameNoTooltip]. Isso irá contrabalançar os participantes que usam a [intent|E] $sow_discord_intent$ por hostilidade em relação a você."
 appease_populace_speech_log:0 "[CHARACTER.GetShortUIName|U] abriu as corridas com declarações que agradaram a multidão, oferecendo uma série de concessões políticas aos plebeus."
 appease_populace_speech_log_title:0 "Discurso Imperial Carregado de Promessas"
 attendee_falls_off_stands_log:0 "[CHARACTER.GetShortUIName|U] foi de alguma forma lançado sobre as balustradas do Hipódromo, sem ninguém para culpar além de guardas incompetentes e nobres desajeitados."
 attendee_falls_off_stands_log_title:0 "Espectador Sofre Queda"
 attendee_hurled_attendee_off_stands_fail_log:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] se envolveram em uma luta violenta, após [TARGET_CHARACTER.GetShortUINameNoTooltip] lançar um ataque repentino e mortal."
 attendee_hurled_attendee_off_stands_fail_log_title:0 "Luta Entre Notáveis"
 attendee_hurled_attendee_off_stands_log:0 "Em uma chocante demonstração de violência pública, [CHARACTER.GetShortUIName] dominou [TARGET_CHARACTER.GetShortUIName] e arremessou [TARGET_CHARACTER.GetShortUINameNoTooltip] no ar vazio."
 attendee_hurled_attendee_off_stands_log_title:0 "Nobre Lança Vítima do Alto dos Assentos"
 attendee_hurled_off_stands_fail_log:0 "[TARGET_CHARACTER.GetShortUIName|U] escapou por pouco de ser lançado a uma morte violenta. Os supostos assassinos nomearam [CHARACTER.GetShortUIName] como seu empregador."
 attendee_hurled_off_stands_fail_log_title:0 "Tentativa de Assassinado Falha"
 attendee_hurled_off_stands_fail_secret_log:0 "[CHARACTER.GetShortUIName|U] foi cercado, quase morto, por um grupo de atacantes sem nome, nenhum dos quais revelou quem era seu empregador."
 attendee_hurled_off_stands_fail_secret_log_title:0 "Espectador Assaltado"
 calmed_after_charioteer_died_spectator:0 "Pânico no Hipódromo"
 calmed_after_charioteer_died_spectator_desc:0 "A população presente no Hipódromo entrou em pânico após a morte de um charioteiro líder. O Imperador não conseguiu acalmá-los, então outro assumiu a responsabilidade."
 change_appointment_investment_medium_gain:0 "Seu [candidate_score|E] para [target_title.GetName] aumenta em [EmptyScope.ScriptValue('appointment_score_medium_value')|P0]"
 change_appointment_investment_medium_loss:0 "Seu [candidate_score|E] para [target_title.GetName] diminui em [EmptyScope.ScriptValue('appointment_score_medium_value')|N0]"
 change_appointment_investment_minor_gain:0 "Seu [candidate_score|E] para [target_title.GetName] aumenta em [EmptyScope.ScriptValue('appointment_score_minor_value')|P0]"
 change_appointment_investment_minor_loss:0 "Seu [candidate_score|E] para [target_title.GetName] diminui em [EmptyScope.ScriptValue('appointment_score_minor_value')|N0]"
 chariot_chance_to_place:0 "chance de #HIGH Colocar#!"
 chariot_chance_to_show:0 "chance de #HIGH Mostrar#!"
 chariot_chance_to_win:0 "chance de #HIGH Ganhar#!"
 chariot_entertainment_bad:0 "Diversões Insignificantes"
 chariot_entertainment_bad_desc:0 "$EFFECT_LIST_BULLET$ Pequeno ganho de [legitimacy|E]\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Ajustado por [county_opinion|E] na [capital|E]#!\n\n#weak Durante centenas de anos, as corridas cimentaram o vínculo entre governante e povo, atestando grandeza e generosidade. Se as cerimônias forem bem executadas, nada mais deve ser necessário.#!"
 chariot_entertainment_good:0 "Delícias para as Massas"
 chariot_entertainment_good_desc:0 "$EFFECT_LIST_BULLET$ Grande ganho de [legitimacy|E] e [county_opinion|E]\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Ajustado por [county_opinion|E] na [capital|E]#!\n\n#weak Nossos visitantes mais estimados serão agraciados com pavões, sables, perfumes: finos presentes imperiais! E artistas de toda sorte lotarão o Hipódromo, com pão e moedas sendo lançados para as arquibancadas.#!"
 chariot_entertainment_normal:0 "Cerimônias Tradicionais"
 chariot_entertainment_normal_desc:0 "$EFFECT_LIST_BULLET$ Ganho moderado de [legitimacy|E] e [county_opinion|E]\n$EFFECT_LIST_BULLET$@alert_icon! #alert_trial Ajustado por [county_opinion|E] na [capital|E]#!\n\n#weak Entre as corridas, o povo se divertirá com mímicos, acrobatas e prisioneiros em cadeias. Os notáveis visitantes serão tratados com recepções imperiais formais.#!"
 chariot_odds_to_place:0 "Odds para #HIGH Colocar#!:"
 chariot_odds_to_show:0 "Odds para #HIGH Mostrar#!:"
 chariot_odds_to_win:0 "Odds para #HIGH Ganhar#!:"
 chariot_option_entertainment:0 "Espectáculos"
 chariot_payout:0 "Pagamento:"
 chariot_place_desc:0 "O alvo da sua aposta deve chegar em #HIGH primeiro#! ou #HIGH segundo#!"
 chariot_race.0001.a:0 "Que as demes sejam despertadas!"
 chariot_race.0001.desc:0 "Abaixo do meu alto [Glossary( 'kathisma', 'KATHISMA_GLOSS')], as grandes estátuas do Hipódromo estão polidas, a areia cuidadosamente varrida, e os lugares para milhares de espectadores limpos.\n\nAs ruas de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] estão, por sua vez, enlouquecidas de expectativa. Atores políticos de todos os tipos gritam suas mensagens enquanto viajantes começam a se acomodar... e, mesmo no palácio, todas as conversas giram em torno dos Prasinoi e Venetoi."
 chariot_race.0001.desc_spectator:0 "[host.GetCapitalLocation.GetTitle.GetNameNoTier] está inundada de barulho e expectativa: as corridas estão prestes a começar! Das tabernas à beira da rua, especulações transbordam sobre a aparição pública de [host.GetTitleAsName]. Promessas serão exigidas? Preocupações da [Glossary( 'hoi polloi', 'HOI_POLLOI_GLOSS')] serão abordadas? E quais respostas serão gritadas, cantadas?\n\nJá os sentimentos das ruas agitam-se entre aqueles despertados por agentes imperiais e os motivados por outras paixões. Mas, mais do que tudo, há uma grande e acalorada disputa: qual corredor conquistará a vitória no Hipódromo!"
 chariot_race.0001.t:0 "Uma Cidade à Espera"
 chariot_race.0100.a:0 "Eu apoio os #charioteer_blue Venetoi#!#!."
 chariot_race.0100.b:0 "Eu apoio os #difficulty_easy Prasinoi#!."
 chariot_race.0100.c:0 "Eu apoio os #bold Leukoi#!."
 chariot_race.0100.d:0 "Eu apoio os #difficulty_hard Rhousioi#!."
 chariot_race.0100.desc.emperor:0 "De acordo com meu mais alto ofício, o [GetCourtPositionType('bookmaker_court_position').GetNameNoTooltip] é apresentado a mim, e [bookmaker.GetHerselfHimself] se prostra enquanto considero minha aposta. Esta decisão não é pequena: as consequências de apoiar um condutor ou uma equipe são tanto financeiras quanto políticas."
 chariot_race.0100.desc.others:0 "As apostas dos espectadores mais ilustres são feitas por algum funcionário apressado. Uma boa quantidade de moeda pode ser ganha ou perdida... e o status também, entre fãs e rivais."
 chariot_race.0100.desc:0 "#EMP Ding! Ding! Ding!#!\n\nO sino do [GetCourtPositionType('bookmaker_court_position').GetName()] sinaliza que as apostas podem agora ser feitas nas equipes tradicionais das corridas.\n\n"
 chariot_race.0100.e:0 "Não fazer aposta."
 chariot_race.0100.t:0 "Apostas Abertas"
