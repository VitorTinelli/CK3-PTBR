l_spanish:
 PORPHURA_GLOSS:0 "Desde os tempos do final do Império Romano, era proibido para qualquer um, exceto o imperador, usar roupas tingidas com o inestimável púrpura de Tiro, feito das secreções do molusco marinho murex do Mediterrâneo."
 ep3_emperor_yearly.8000.a:0 "Sim, traga homens de [county_1.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip]."
 ep3_emperor_yearly.8000.b:0 "A capital vem antes de [county_2.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip]."
 ep3_emperor_yearly.8000.c:0 "[county_3.GetCountyData.GetCapital.GetBaronyNameExplicitlyNoTooltip] deve fazer sacrifícios."
 ep3_emperor_yearly.8000.d:0 "É simplesmente um tempo de escassez."
 ep3_emperor_yearly.8000.desc:0 "\n\nConflitos recentes cobraram seu preço: os recrutadores têm cada vez mais dificuldade em cumprir suas cotas, e a escassez de mão de obra de todos os tipos surge por toda a cidade.\n\n[Select_CString( suggestor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', suggestor)], [suggestor.GetTitledFirstName], compilou uma lista de províncias prósperas, cuja fortuna pode ajudar a capital em seu momento de necessidade."
 ep3_emperor_yearly.8000.intro:0 "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], nossa grande capital, geme sob o peso das muitas demandas de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] sobre seu povo."
 ep3_emperor_yearly.8000.intro_byz:0 "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], a luz imperecível do império, sofre nestes tempos difíceis."
 ep3_emperor_yearly.8000.t:0 "Compartilhando a Carga"
 ep3_emperor_yearly.8010.a:0 "Sua diligência será recompensada, [governor.GetFirstNameNoTooltip]."
 ep3_emperor_yearly.8010.b:0 "Esse #EMP era#! meu selo! Libere [liar.GetSheHe] imediatamente!"
 ep3_emperor_yearly.8010.c.tt:0 "Prisioneiro transferido"
 ep3_emperor_yearly.8010.c:0 "Muito bem, envie o desgraçado para mim."
 ep3_emperor_yearly.8010.d:0 "Forjar selos imperiais deve ser punido de forma decisiva."
 ep3_emperor_yearly.8010.desc:0 "Um[Select_CString( liar.IsFemale, 'a', '' )] [liar.GetWomanMan] chamad[Select_CString( liar.IsFemale, 'a', 'o' )] [liar.GetFirstName] me procurou em busca de emprego, alegando portar uma carta de recomendação do \"[ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetHerselfHimself].\"\n\nO selo foi considerado uma falsificação, e agora mantenho o ousado impostor em minha masmorra."
 ep3_emperor_yearly.8010.opening:0 "Saudações, [ROOT.Char.GetTitledFirstNameNoTooltip],"
 ep3_emperor_yearly.8010.opening_byz:0 "Saudações [ROOT.Char.GetTitleAsNameNoTooltip],"
 ep3_emperor_yearly.8020.a.claimant:0 "Reivindicações como a de [purpler_1.GetFirstNameNoTooltip] devem ser reconhecidas."
 ep3_emperor_yearly.8020.a.friend:0 "Meu amigo, [purpler_1.GetFirstNameNoTooltip], é uma exceção."
 ep3_emperor_yearly.8020.a.vassal:0 "Acho que [purpler_1.GetFirstNameNoTooltip] vestiria bem."
 ep3_emperor_yearly.8020.b.claimant:0 "[purpler_2.GetFirstNameNoTooltip] tem uma reivindicação digna."
 ep3_emperor_yearly.8020.b.friend:0 "[purpler_2.GetFirstNameNoTooltip] é meu digno amigo."
 ep3_emperor_yearly.8020.b.vassal:0 "[purpler_2.GetFirstNameNoTooltip] parece digno."
 ep3_emperor_yearly.8020.c.claimant:0 "Os reclamantes têm direitos especiais: [purpler_3.GetFirstNameNoTooltip]."
 ep3_emperor_yearly.8020.c.friend:0 "A amizade vem primeiro: [purpler_3.GetFirstNameNoTooltip]."
 ep3_emperor_yearly.8020.c.vassal:0 "Pode muito bem ser [purpler_3.GetFirstNameNoTooltip]..."
 ep3_emperor_yearly.8020.d:0 "A púrpura não pode ser #EMP comprada#!!"
 ep3_emperor_yearly.8020.desc:0 "\n\nApós muitas sugestões nada sutis sobre os benefícios de um patrocínio bem posicionado e as necessidades desconfortáveis, [Select_CString( suggestor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', suggestor)], [suggestor.GetTitledFirstName], finalmente fala claramente.\n\n\"Grande [ROOT.Char.GetTitleAsNameNoTooltip]... embora usar a [Glossary( 'porphúra', 'PORPHURA_GLOSS' )] seja uma prerrogativa imperial, não é incomum que tais direitos sejam concedidos a... #EMP súditos comprometidos#!.\""
 ep3_emperor_yearly.8020.intro.bankrupt:0 "Os cofres imperiais estão vazios, e as notas promissórias do contador são tudo o que mantém o exército e a burocracia de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] em movimento dia após dia."
 ep3_emperor_yearly.8020.intro.really_bankrupt:0 "As salas do tesouro vazias não contêm sequer um grão de ouro, e [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] geme sob o peso de tal iliquidez."
 ep3_emperor_yearly.8020.intro:0 "O fluxo de moedas está em baixa, e é cada vez mais difícil encontrar os fundos necessários para meus planos, sem falar no funcionamento regular de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l]."
 ep3_emperor_yearly.8020.t:0 "Patrocínio Porfírio"
 ep3_emperor_yearly.8030.a.failure:0 "A besta é imparável"
 ep3_emperor_yearly.8030.a.flavor:0 "Armem as galés, tragam-me sua carne!"
 ep3_emperor_yearly.8030.a.success:0 "A besta é parada"
 ep3_emperor_yearly.8030.a:0 "Deve ser parado, a qualquer custo!"
 ep3_emperor_yearly.8030.c:0 "Decrete armamentos, comboios e rotas seguras."
 ep3_emperor_yearly.8030.d.flavor:0 "Só podemos rezar por salvação..."
 ep3_emperor_yearly.8030.d:0 "Os marinheiros devem buscar [ROOT.Char.GetFaith.WaterGodName]."
 ep3_emperor_yearly.8030.desc:0 "Uma temível baleia devasta a navegação ao longo dos estreitos, [Select_CString( complainer.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', complainer)], [complainer.GetTitledFirstName] lamenta: 'Pescadores, mercadores — até mesmo capitães navais! Todos temem deixar seus portos.'\n\nRelatos empoeirados das lutas de [justinian.GetFirstNameRegnal] com 'Porphyrios', flagelo por décadas antes de encalhar em uma praia e ser esquartejado, são trazidos à tona — alguns até sugerem que a nova ameaça seja um descendente vingativo...\n\nEstratégias duvidosas são oferecidas para lidar com esse terror das profundezas, enquanto os relatos de suas proezas se acumulam."
 ep3_emperor_yearly.8030.t:0 "Flagelo do Bósforo"
 ep3_emperor_yearly.8040.a:0 "É hora de verdadeiramente acabar com toda idolatria!"
 ep3_emperor_yearly.8040.b:0 "Não cederei à heresia."
 ep3_emperor_yearly.8040.debt:0 "— o tesouro está vazio, os órgãos do estado dependentes apenas de crédito e boa vontade —"
 ep3_emperor_yearly.8040.desc:0 "e o povo está ficando inquieto...\n\nNão posso deixar de me perguntar: os Iconoclastas estão certos? Seriam os problemas do império meramente o castigo de [ROOT.Char.GetFaith.HighGodName] por ignorar os seus mandamentos?\n\n"
 ep3_emperor_yearly.8040.family:0 "[Select_CString( family.IsFemale, 'Minha própria', 'Meu próprio' )] [ROOT.Char.Custom2('RelationToMeShort', family)], [family.GetFirstName], estava de fato convencido de tais noções. Talvez eu tenha sido cego..."
 ep3_emperor_yearly.8040.intro:0 "Meu governo tem sido assolado por reveses e infortúnios"
 ep3_emperor_yearly.8040.leo:0 "A doutrina de [leo.GetTitledFirstNameRegnal] e os Isaurianos trouxeram grande conflito ao império e à cristandade — mas apenas por um tempo..."
 ep3_emperor_yearly.8040.past_plague:0 "— a doença assolou o império, não poupando nem mesmo [constantinople.GetNameNoTooltip] de seu infortúnio —"
 ep3_emperor_yearly.8040.plague:0 "— a maldita [epidemic.GetName] devasta até mesmo [constantinople.GetNameNoTooltip], sobrecarregando os hospitais —"
 ep3_emperor_yearly.8040.predecessor:0 "Olho para o governo de [predecessor.GetTitledFirstNameRegnal], e questiono os fundamentos de minhas próprias crenças..."
 ep3_emperor_yearly.8040.t:0 "Ira de [ROOT.Char.GetFaith.HighGodNameAlternate]"
 ep3_emperor_yearly.8040.truce_holder:0 "— até mesmo a grande vitória sobre [truce_holder.GetTitledFirstName] teve seus custos —"
 ep3_emperor_yearly.8040.truce_target:0 "— o mais irritante de todos, nossa grande derrota pela mão de [truce_target.GetTitledFirstName] —"
 ep3_emperor_yearly.8050.a:0 "Pague o preço irrisório."
 ep3_emperor_yearly.8050.b.byz:0 "Eu poderia usar um varangiano tão audacioso."
 ep3_emperor_yearly.8050.b:0 "Eu poderia usar um forasteiro tão audacioso."
 ep3_emperor_yearly.8050.c.failure:0 "Os invasores são evasivos"
 ep3_emperor_yearly.8050.c.success:0 "Os longships são dispersos"
 ep3_emperor_yearly.8050.c:0 "Envie as galés atrás desses cães!"
 ep3_emperor_yearly.8050.desc:0 "Navios de todos os cantos do mundo pesam nos portos de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l], e [marshal.GetTitledFirstName] relata que uma pequena frota de embarcações ancorou recentemente nas margens de [raid_target.GetProvince.GetBaronyNameExplicitlyNoTooltip].\n\nSeu capitão, um bárbaro chamado [raider.GetFirstName], exige um pagamento, ameaçando pirataria se o pedido [raider.GetHerHim] não for atendido.\n\nOs invasores marítimos do distante norte são temidos, e parece que este grupo espera lucrar apenas com essa reputação."
 ep3_emperor_yearly.8050.t:0 "Visitantes Não Convidados"
 ep3_emperor_yearly.8060.a:0 "\"Prendam a fera, eu comando!\""
 ep3_emperor_yearly.8060.b:0 "Lembre [defector.GetFirstNameNoTooltip] das virtudes da lealdade."
 ep3_emperor_yearly.8060.c:0 "Deixe que o cão faça o que [defector.GetSheHe] quiser."
 ep3_emperor_yearly.8060.culture:0 "o império vem antes das meras tradições e línguas locais!"
 ep3_emperor_yearly.8060.defect:0 "[defector.GetTitledFirstName] deserta"
 ep3_emperor_yearly.8060.dynasty:0 "que se danem os antigos laços familiares entre os [defector.GetDynastyHouseName] e os [sponsor.GetDynastyHouseName]."
 ep3_emperor_yearly.8060.every_title:0 "Você ganha [claims|E] sobre todos os [titles|E] de [defector.GetTitledFirstName]"
 ep3_emperor_yearly.8060.failure:0 "[defector.GetTitledFirstNameNoTooltip] escapa"
 ep3_emperor_yearly.8060.faith:0 "o império vem antes da religião, por mais equivocadas que sejam as crenças!"
 ep3_emperor_yearly.8060.faith_and_culture:0 "quaisquer que sejam nossas diferenças de tradição e culto!"
 ep3_emperor_yearly.8060.fallback:0 "o império vem antes de quaisquer relacionamentos pessoais mesquinhos!"
 ep3_emperor_yearly.8060.family:0 "a lealdade ao império vem antes do dever [Select_CString( sponsor.IsFemale, 'a', 'ao' )] [defector.Custom2('RelationToMeShort', sponsor)]!"
 ep3_emperor_yearly.8060.house:0 "seus laços de parentesco com [defector.GetDynastyHouseName]"
 ep3_emperor_yearly.8060.intro:0 "Más notícias chegaram de [defector.GetPrimaryTitle.GetNameNoTier]: sussurros de que [Select_CString( defector.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', defector)], [defector.GetTitledFirstName], colabora com [sponsor.GetName], e talvez até planeje desertar!\n\nNão pode haver desculpas aceitas, nem clemência dada, para tal traição ardilosa contra o [ROOT.Char.GetTitleAsNameNoTooltip] —"
 ep3_emperor_yearly.8060.no_defect:0 "[defector.GetTitledFirstName] permanece leal"
 ep3_emperor_yearly.8060.spouse:0 "o dever imperial deve vir antes da devoção [Select_CString( sponsor.IsFemale, 'a', 'ao' )] [defector.Custom2('RelationToMeShort', sponsor)]!"
 ep3_emperor_yearly.8060.success:0 "Você age antes que [defector.GetSheHe] esteja pronto"
 ep3_emperor_yearly.8060.t:0 "Fronteira Agitada"
 every_bosporos_coast_county_tt:0 "[THIS.Char.GetCapitalLocation.GetName], e outras [counties|E] costeiras dos estreitos"
 every_bosporos_sea_province_tt:0 "$sea_bosporus$, $sea_marmara$, e $sea_dardanelles$"
