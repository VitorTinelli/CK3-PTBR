l_spanish:
 1025_every_orphan:0 "Todo Órfão"
 artifact_double_moon_book:0 "O Tomo da Dupla Lua"
 artifact_double_moon_book_description:0 "Um livro pesado, ricamente ornamentado, cheio de poesia."
 artifact_double_moon_book_description_append:0 "$artifact_double_moon_book_description$ As páginas contêm:\n"
 double_moon_tome_desc_10:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'O Peso das Palavras'"
 double_moon_tome_desc_11:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Moeda Fala, Homens Ouvem'"
 double_moon_tome_desc_12:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Versos sobre a Beleza'"
 double_moon_tome_desc_13:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Lords e Ladies'"
 double_moon_tome_desc_14:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Filhos de Alá'"
 double_moon_tome_desc_1:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Um Braço Tensionado'"
 double_moon_tome_desc_2:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Ode a um Guarda-costas'"
 double_moon_tome_desc_3:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Lições sobre Gastos'"
 double_moon_tome_desc_4:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Palavras Gentis'"
 double_moon_tome_desc_5:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Um Coração Curado'"
 double_moon_tome_desc_6:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Carta a um Cortejado'"
 double_moon_tome_desc_7:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Grandes Ocasões'"
 double_moon_tome_desc_8:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Da Família, do Coração'"
 double_moon_tome_desc_9:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Aquilo que nos Divide'"
 ep3_story_cycle_violet_poet.0001.a.tt:0 "Esta é minha casa. Talvez em outra vida eu caminhe por outro caminho."
 ep3_story_cycle_violet_poet.0001.a:0 "Eu ficarei em [cordoba.GetNameNoTooltip] por agora."
 ep3_story_cycle_violet_poet.0001.b.travel:0 "Iniciar sua viagem para [toledo.GetName]"
 ep3_story_cycle_violet_poet.0001.b.tt:0 "Pense em todas as oportunidades que ainda estão por florescer!"
 ep3_story_cycle_violet_poet.0001.b:0 "É hora de ir embora."
 ep3_story_cycle_violet_poet.0001.desc:0 "Por décadas, andei nos passos de intelectuais e enfrentei a ira dos homens. Minha poesia cresceu inexoravelmente em renome, e ainda assim...\n\nAlgo está faltando. Agora que meus anos crepusculares estão sobre mim, talvez seja hora de deixar [cordoba.GetName] e me proporcionar uma ampla visão do mundo?\n\nOutra parte inextricável de mim ainda me puxa o coração para ficar. Construi uma vida aqui não apenas para mim, mas também para os muitos aprendizes que foram treinados aqui ao longo dos anos.\n\nSeja devido aos estudiosos que caminham por suas ruas ou à pátina familiar de suas paredes, #EMP algo#! me mantém atado a esta cidade, minha casa."
 ep3_story_cycle_violet_poet.0001.t:0 "Adequado para Altas Posições"
 ep3_story_cycle_violet_poet.0002.a.tt:0 "Você pondera a situação..."
 ep3_story_cycle_violet_poet.0002.a:0 "Infelizmente, tais indivíduos são escassos."
 ep3_story_cycle_violet_poet.0002.b.flavor:0 "...embora eu devesse começar #EMP em breve#!."
 ep3_story_cycle_violet_poet.0002.b.tt:0 "@alert_icon! #alert_trial Se você morrer antes que um herdeiro seja designado, sua dinastia pode acabar!#!"
 ep3_story_cycle_violet_poet.0002.b:0 "Não há necessidade de se preocupar com isso ainda."
 ep3_story_cycle_violet_poet.0002.desc:0 "Uma coisa tem me atormentado nas últimas semanas. Quem irá continuar meu legado? Quem continuará a ser um patrono das artes e treinar a juventude em seus caminhos?\n\nTenho muito a transmitir: [double_moon_book.GetName] é uma parte fácil, é claro, mas há muito mais além disso. O último legado da dinastia [ROOT.Char.GetHouse.GetName] é uma proposta muito mais pesada do que mesmo aquele tomo volumoso.\n\nMas isso é apenas um relíquia em desvanecimento, na verdade. O mais importante é o modo de viver, a força vital de qualquer poeta como eu. Poesia, amor, uma apreciação pelo mundo que [ROOT.Char.GetFaith.HighGodName] criou ao nosso redor!\n\n#EMP Isso#! é algo que eu devo encontrar. Alguém que entenda esse fluxo intangível para o mundo."
 ep3_story_cycle_violet_poet.0002.t:0 "Construindo um Legado"
 ep3_story_cycle_violet_poet.0003.a:0 "[heir1.GetFirstNameNoTooltip] deve ser minha escolha."
 ep3_story_cycle_violet_poet.0003.b:0 "[heir2.GetFirstNameNoTooltip] será meu herdeiro."
 ep3_story_cycle_violet_poet.0003.beautiful:0 "notavelmente bela e"
 ep3_story_cycle_violet_poet.0003.c:0 "Sabe, há algo sobre [heir3.GetFirstNameNoTooltip]..."
 ep3_story_cycle_violet_poet.0003.diplomat:0 "[heir1.GetFirstName], por exemplo. O amor de [heir1.GetHerHis|U] pela poesia é tão evidente e apaixonado."
 ep3_story_cycle_violet_poet.0003.ending:0 "tão talentosa com a prosa!\n\nA julgar pela equipe de admiradores que [heir3.GetSheHe] parece estar reunindo, potencialmente também uma pessoa #EMP violet#! bastante..."
 ep3_story_cycle_violet_poet.0003.heir3:0 "\n\nUma saraivada de palavras ressoa, aguda e staccato. Eu noto [heir3.GetFirstName], um novo arrivista no salão, terminando um verso elegante. [heir3.GetSheHe|U] é jovem,"
 ep3_story_cycle_violet_poet.0003.intelligent:0 "fiercemente inteligente e "
 ep3_story_cycle_violet_poet.0003.opening:0 "Eu ouço com um ouvido o feroz debate poético vindo de fora. Quem posso escolher?\n\n"
 ep3_story_cycle_violet_poet.0003.poet:0 "[heir1.GetFirstName], por exemplo. O domínio de [heir1.GetHerHis|U] sobre o ritmo é tão instintivo e impressionante..."
 ep3_story_cycle_violet_poet.0003.t:0 "Excesso de Opções"
 ep3_story_cycle_violet_poet.0003.woman:0 "Ou talvez [heir2.GetFirstName]? Como um [heir2.GetWomanMan], [heir2.GetSheHe] ao menos entenderia minhas palavras profundamente quando eu partir."
 ep3_story_cycle_violet_poet.0003.young:0 "Ou talvez [heir2.GetFirstName]? Uma alma jovem tem muito a recomendar pela sua maleabilidade."
 ep3_story_cycle_violet_poet.0004.a:0 "Farei o meu melhor."
 ep3_story_cycle_violet_poet.0004.desc:0 "Oh [wallada.GetFirstName]! Meu mentor, meu amigo, minha inspiração. Você viveu cem vidas em sua existência, e ainda assim não parece suficiente.\n\nDesembrulho o pacote que [wallada.GetSheHe] me deixou, [wallada.GetHerHis] último presente em uma longa linha deles. O embrulho cai de [double_moon_book.GetName], o livro de poesia cuidadosamente cultivado de [wallada.GetHerHis].\n\n[wallada.GetFirstNameNoTooltip|U] sempre falou sobre continuar um legado, e agora entendo que esse legado me cabe continuar. Eu devo viver a vida ao máximo, assim como [wallada.GetSheHe] fez, e aproveitar cada alegria que ela tem a oferecer. Eu também devo cronicá-la, em verso, nessas mesmas páginas."
 ep3_story_cycle_violet_poet.0004.t:0 "Lembrado com Carinho"
 ep3_story_cycle_violet_poet.0010.title:0 "Poema Muwashshah Vendido"
 ep3_story_cycle_violet_poet.0011.message:0 "[double_moon_book.GetName] recebe um Modificador aleatório"
 ep3_story_cycle_violet_poet.0011.title:0 "Poema Muwashshah Mantido"
 ep3_story_cycle_violet_poet.0012.title:0 "Poema Muwashshah Distribuído"
 ep3_story_cycle_violet_poet.1000.a.book:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Uma Caminhada Entre as Árvores'"
 ep3_story_cycle_violet_poet.1000.a:0 "A adversidade gera grande inspiração!"
 ep3_story_cycle_violet_poet.1000.b:0 "Devo buscar suprimentos."
 ep3_story_cycle_violet_poet.1000.desc:0 "Parece que passar algum tempo ao ar livre foi a coisa certa a fazer. As vistas, os sons e o cheiro do ar fresco estão fazendo maravilhas pelo meu bem-estar.\n\nÉ durante esta caminhada longe do meu acampamento que tropeço em uma bela fonte na floresta. O sussurro calmante do riacho borbulhante e das árvores folhosas me acalma, ao ponto de perceber que horas se passaram.\n\nSinto meu estômago reclamar e a fome crescer. Há algumas plantas comestíveis que passei logo no caminho, mas há uma certa inclinação poética em estar sozinho e faminto..."
 ep3_story_cycle_violet_poet.1000.t:0 "A Generosidade da Natureza"
 ep3_story_cycle_violet_poet.1005.a.tt:0 "Eu simplesmente #EMP devo#! levar tal talento sob minha asa."
 ep3_story_cycle_violet_poet.1005.a:0 "Você, garota! Como você gostaria de um lugar para aprender?"
 ep3_story_cycle_violet_poet.1005.b.book:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'O Poeta Órfão'"
 ep3_story_cycle_violet_poet.1005.b:0 "Que história é essa!"
 ep3_story_cycle_violet_poet.1005.c.tt:0 "Mas seu talento é tão precoce que devo pelo menos financiá-lo!"
 ep3_story_cycle_violet_poet.1005.c:0 "Talvez meu acampamento não seja lugar para crianças."
 ep3_story_cycle_violet_poet.1005.desc:0 "Explorando as ruas de [location.GetName], eu me vejo parado no limiar de um dos orfanatos da cidade. Meus ouvidos se aguçam com a familiar sonoridade de rimas recitadas, flutuando pela porta aberta.\n\nLentamente, me inclino contra a parede, ouvindo. Uma das jovens órfãs está engajada em uma batalha verbal com outra, com uma verdadeira devoção e habilidade para alguém tão jovem.\n\nEssa criança empunha palavras como se fossem lâminas afiadas, cortando através do gaguejar infantil de seu oponente.\n\nBravo, digo, excelente trabalho!"
 ep3_story_cycle_violet_poet.1005.t:0 "Um Bom Aprendiz"
 ep3_story_cycle_violet_poet.1010.a.failure:0 "[ruler_spouse.GetSheHe|U] recusa educadamente"
 ep3_story_cycle_violet_poet.1010.a.success:0 "[ruler_spouse.GetSheHe|U] fica encantado com sua 'elocução rítmica'"
 ep3_story_cycle_violet_poet.1010.a:0 "Talvez eu possa oferecer a [ruler_spouse.GetSheHe] uma 'aula de poesia particular'..."
 ep3_story_cycle_violet_poet.1010.b.book:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'O Fruto Proibido'"
 ep3_story_cycle_violet_poet.1010.b:0 "Por que o destino deve me tentar tanto?"
 ep3_story_cycle_violet_poet.1010.c.tt:0 "Aumenta a [success_chance|E] do seu [scheme|E] de [GetScheme('courting').GetTypeName]"
 ep3_story_cycle_violet_poet.1010.c:0 "Eu devo ter [ruler_spouse.GetHerHim]!"
 ep3_story_cycle_violet_poet.1010.desc:0 "Ser recebido na corte de [ruler.GetTitledFirstNamePossessiveRegnal] é uma grande honra. Poder apresentar alguns dos meus antigos poemas para ele, uma ainda maior.\n\nNo entanto, é difícil me concentrar na entrega de meus versos quando uma beleza tão radiante está diante de mim. [ruler_spouse.GetFirstName], [ruler.GetFirstNamePossessiveNoTooltip] [ruler_spouse.GetWifeHusband] chamou minha atenção; tal elegância extraordinária, tal graça maravilhosa! Eu me encontrei encantado com essa [ruler_spouse.GetWomanMan].\n\nMinhas paixões são profundas. Quero amar! Quero escrever!"
 ep3_story_cycle_violet_poet.1010.t:0 "O Romance da Poesia"
 ep3_story_cycle_violet_poet.1015.a.failure:0 "[stranger.GetSheHe|U] sai em disgust"
 ep3_story_cycle_violet_poet.1015.a.success:0 "[stranger.GetSheHe|U] concorda entusiasticamente"
 ep3_story_cycle_violet_poet.1015.a:0 "'Eu deveria te agradecer #EMP devidamente#!.'"
 ep3_story_cycle_violet_poet.1015.b:0 "Poderíamos usar um viajante do mundo como uma ajuda."
 ep3_story_cycle_violet_poet.1015.c:0 "Que palavras gentis!"
 ep3_story_cycle_violet_poet.1015.desc:0 "Um shuffle desajeitado anuncia a presença de um estranho em nosso meio, cansado e exausto. Enquanto [stranger.GetSheHe] toma um momento para beber a água que oferecemos e se senta ao nosso fogo, [stranger.GetSheHe] me observa com um sorriso deslumbrante.\n\n 'Você é [ROOT.Char.GetFirstNameNoTooltip], correto? Eu estive te rastreando por dias. Seus poemas mudaram minha vida de maneiras que nem consigo descrever em palavras simples! Palavras que imagino que você não teria #EMP dificuldade#! em formar!'\n\n Pensar que essa pessoa me rastreou por dias apenas para me dar um elogio? Há algo romantically belo na dedicação em exibição."
 ep3_story_cycle_violet_poet.1015.t:0 "Um Seguidor, Enamorado"
 ep3_story_cycle_violet_poet.1020.a.book:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'Mãos Ajudadoras'"
 ep3_story_cycle_violet_poet.1020.a.tt:0 "Você não tem [followers|E] com mais de #high 20#! [diplomacy|E]"
 ep3_story_cycle_violet_poet.1020.a:0 "Preciso de alguém para me inundar de ideias."
 ep3_story_cycle_violet_poet.1020.b.failure:0 "Não funciona"
 ep3_story_cycle_violet_poet.1020.b.success:0 "Funciona"
 ep3_story_cycle_violet_poet.1020.b:0 "Posso suportar!"
 ep3_story_cycle_violet_poet.1020.c.failure:0 "Sua mente ainda está ofuscada"
 ep3_story_cycle_violet_poet.1020.c.success:0 "Você encontra um lugar de calma"
 ep3_story_cycle_violet_poet.1020.c:0 "Talvez seja hora de fazer uma pausa?"
 ep3_story_cycle_violet_poet.1020.desc:0 "Estou amaldiçoado! Apesar dos meus melhores esforços, estes últimos dias foram preenchidos apenas com uma névoa interminável que ofusca minha mente.\n\nNenhuma palavra flui para a página, nenhuma devoção romântica, nenhuma palavra contundente. Parece que minha sequência de inspiração finalmente chegou ao fim.\n\nO que devo fazer? Como me libertar dessa tortura intelectual!"
 ep3_story_cycle_violet_poet.1020.t:0 "Uma Névoa que Ofusca Tudo"
 ep3_story_cycle_violet_poet.1025.a.tt:0 "Eu devo adotá-los todos!"
 ep3_story_cycle_violet_poet.1025.a:0 "Não posso deixar esse potencial passar despercebido."
 ep3_story_cycle_violet_poet.1025.b.success:0 "Seu cuidado dá frutos"
 ep3_story_cycle_violet_poet.1025.b.tt:0 "Então, devo fazer este contar."
 ep3_story_cycle_violet_poet.1025.b:0 "Só posso arcar com um..."
 ep3_story_cycle_violet_poet.1025.c.failure:0 "[holder.GetTitledFirstNameNoTooltip] se recusa a pagar"
 ep3_story_cycle_violet_poet.1025.c.success:0 "[holder.GetTitledFirstNameNoTooltip] aceita o fardo"
 ep3_story_cycle_violet_poet.1025.c.tt:0 "Talvez envergonhar [holder.GetHerHim] funcione..."
 ep3_story_cycle_violet_poet.1025.c:0 "O governante local deve acomodá-los."
 ep3_story_cycle_violet_poet.1025.desc:0 "Passo muito do meu tempo em meu salão, mas uma boa parte do restante é gasta vagando pelas ruas de [location.GetName]. Inevitavelmente, isso frequentemente me leva aos orfanatos, onde aquelas crianças infelizes deslocadas pela guerra, fome ou até mesmo simplesmente abandono são cuidadas.\n\nHoje, vários rostos novos são visíveis em seu parquinho. Meu coração, como sempre, chora por essas pobres almas. Tantas delas...\n\nUma pequena voz abafada quebra o silêncio. Uma pequena [orphan.Custom('GirlBoy')] está no canto, pronunciando as palavras de um poema de um pedaço de pergaminho desgastado. Tão jovem e claramente não ensinado, mas pode haver um verdadeiro potencial nessas crianças..."
 ep3_story_cycle_violet_poet.1025.t:0 "A Próxima Geração"
 ep3_story_cycle_violet_poet.1030.a:0 "Eu serei seu tutor."
 ep3_story_cycle_violet_poet.1030.b:0 "Infelizmente, não posso dispensar o tempo."
 ep3_story_cycle_violet_poet.1030.c.tt:0 "Um pouco para mim, um pouco para [courtier_poet.GetFirstNameNoTooltip] por [courtier_poet.GetHerHis] problemas..."
 ep3_story_cycle_violet_poet.1030.c:0 "Talvez eu possa oferecer um tutor alternativo?"
 ep3_story_cycle_violet_poet.1030.desc:0 "Um chamado de uma corte nobre é algo que deve ser ouvido, e assim me encontro em um dos palácios mais bonitos de [location.GetName]. Me cumprimenta [noblewoman.GetFirstName], em um estado de grande excitação.\n\n'É uma grande honra conhecê-lo!' [noblewoman.GetSheHe|U] exclama. 'Estou precisando de algumas aulas, você vê...'\n\nAcontece que [noblewoman.GetFirstNameNoTooltip] tem tentado estudar poesia, com algum sucesso limitado. Tão limitado, na verdade, que isso pode me dar alguma #EMP vantagem#!..."
 ep3_story_cycle_violet_poet.1030.t:0 "Os Grandes e os Bons"
 ep3_story_cycle_violet_poet.2000.a.book:0 "[double_moon_book.GetDesc]\n$EFFECT_LIST_BULLET$'As Algemas do Desejo'"
 ep3_story_cycle_violet_poet.2000.a.tt:0 "Redija uma missiva para seu antigo amor"
 ep3_story_cycle_violet_poet.2000.a:0 "Talvez eu deva escrever uma carta para [zaydun.GetHerHim]..."
 ep3_story_cycle_violet_poet.2000.b:0 "Um poema em memória de um amor perdido. Isso aliviará minha alma."
 ep3_story_cycle_violet_poet.2000.c:0 "Esses dias passaram. Eu devo seguir em frente."
 ep3_story_cycle_violet_poet.2000.desc:0 "Conforme os dias passam, me pego relembrando os relacionamentos da minha juventude. Um nome em particular vem à mente; [zaydun.GetFirstName]. Ibn Zaydun, chamavam [zaydun.GetHerHim], com [zaydun.GetHerHis] sagacidade e língua prateada.\n\nAh, aqueles dias passando poemas de um lado para o outro, viajando pelas terras só para passar uma noite juntos. Isso me deixa nostálgico. Nosso relacionamento pode não ter sido perfeito, mas essas memórias repousam carinhosamente em meu coração.\n\nNão vejo [zaydun.GetHerHim] há muitos, muitos anos. Fui tão duro em nossa separação, tão mordaz. Os arrependimentos pesam muito sobre mim."
 ep3_story_cycle_violet_poet.2000.t:0 "Quando a Escuridão Cai"
 ep3_story_cycle_violet_poet.2001.a.flavor:0 "Eu preciso ver [zaydun.GetHerHim] novamente."
 ep3_story_cycle_violet_poet.2001.a.tt:0 "Convide [zaydun.GetFirstNameNoTooltip] para visitar."
 ep3_story_cycle_violet_poet.2001.a:0 "Oh, meu precioso [zaydun.GetFirstNameNoTooltip]..."
 ep3_story_cycle_violet_poet.2001.b:0 "Isso é... um pouco demais."
 ep3_story_cycle_violet_poet.2001.desc:0 "Longo esperei até mesmo a menção mais fugaz do meu nome em seus lábios.\n\nMeu corpo envelheceu, mas meu coração está tão parado quanto estava no momento em que você me deixou; congelado, quebrado, aguarda seu toque para bater mais uma vez."
 ep3_story_cycle_violet_poet.2001.t:0 "Para a lua no meu céu noturno,"
 ep3_story_cycle_violet_poet.2005.a.tt:0 "Não devo me deixar apaixonar novamente..."
 ep3_story_cycle_violet_poet.2005.a:0 "\"Não consigo acreditar que é realmente você.\""
 ep3_story_cycle_violet_poet.2005.b:0 "Bem, a presença dele sozinha eleva o perfil do meu salão..."
 ep3_story_cycle_violet_poet.2005.desc:0 "Lá está [zaydun.GetSheHe], de repente, parado na porta. A idade mudou [zaydun.GetHerHim] tanto e ainda assim... não mudou nada. Existem mais marcas no rosto de [zaydun.GetHerHis], mas ainda é o rosto de [zaydun.GetHerHis]. A postura de [zaydun.GetHerHis|U] se curva um pouco mais, mas ainda é o corpo que segurou o meu tão apertado naquela época. Até mesmo a forma como [zaydun.GetSheHe] se move...\n\nE [zaydun.GetSheHe] se move, cobrindo a distância entre nós em meros momentos, e então estou nos braços de [zaydun.GetHerHis] novamente. Uma sensação tão distante, tão impregnada nas poeiras dos anos e desbotada pela luz da memória, e ainda assim tão intimamente familiar.\n\nAo nos separarmos relutantemente, sinto que uma parte de mim que nem sabia que estava faltando foi de repente devolvida, velhas feridas costuradas."
 ep3_story_cycle_violet_poet.2005.t:0 "Reencontrados"
 ep3_story_cycle_violet_poet.2010.a:0 "\"Nós dois somos velhos, [zaydun.GetFirstNameNoTooltip]. Mas com a idade vem a sabedoria.\""
 ep3_story_cycle_violet_poet.2010.b:0 "\"Eu trabalho sozinha.\""
 ep3_story_cycle_violet_poet.2010.desc:0 "Sentamos e rimos, assim como nos velhos tempos, bebendo chá à sombra. O intelecto e a sagacidade de [zaydun.GetFirstNamePossessive] ainda são afiados como uma lâmina, e a idade não diminuiu o charme com o qual [zaydun.GetSheHe] me conquistou.\n\n\"O que você tem aqui?\" [zaydun.GetSheHe|U] pergunta, gesticulando para [double_moon_book.GetName] que está sobre a mesa ao meu lado. Eu entrego a obra.\n\n\"Este é um trabalho lindo. Sua obra continua tão elegante como sempre foi.\" O sorriso encantado de [zaydun.GetHerHis|U] ainda me abala um pouco. \"Não suponho que você estaria disposto a escrever uma colaboração nos próximos dias, estaria? Supondo que este velho [zaydun.GetWomanMan] ainda consiga acompanhar você, é claro.\""
 ep3_story_cycle_violet_poet.2010.t:0 "Trabalho Colaborativo"
 ep3_story_cycle_violet_poet.2015.a.failure:0 "[zaydun.GetSheHe|U] recusa, e vai embora"
 ep3_story_cycle_violet_poet.2015.a.success:0 "[zaydun.GetSheHe|U] concorda em ficar"
 ep3_story_cycle_violet_poet.2015.a:0 "\"...fique comigo. Aqui, em [ROOT.Char.GetCurrentLocation.GetNameNoTooltip]. Você #EMP deve.#!\""
 ep3_story_cycle_violet_poet.2015.artifact:0 "[newly_created_artifact.GetDesc]\n\nÉ um design simples, exceto por um detalhe: uma pequena inscrição em seu interior lê \"Para meu amor, o último sonho da minha alma.\""
 ep3_story_cycle_violet_poet.2015.b.tt:0 "...caso nos encontremos novamente."
 ep3_story_cycle_violet_poet.2015.b:0 "Até nos encontrarmos novamente, meu amor perdido."
 ep3_story_cycle_violet_poet.2015.c.tt:0 "A culpa consome você."
 ep3_story_cycle_violet_poet.2015.c:0 "Não posso perdoar os erros do passado."
 ep3_story_cycle_violet_poet.2015.desc:0 "Os últimos dias foram alguns dos mais felizes da minha vida, mas todas as coisas chegam ao fim. Um servo passa com mais pertenças de [zaydun.GetFirstNamePossessive] enquanto dizemos nossas despedidas. [zaydun.GetSheHe|U] segura minhas mãos em [zaydun.GetHerHis].\n\n\"Ver você novamente trouxe a luz de volta à minha vida.\" [zaydun.GetSheHe|U] se perde em palavras, o mais famoso criador de palavras na Ibéria de repente sem palavras. Em vez disso, [zaydun.GetSheHe] alcança seu bolso e pressiona algo em minha palma.\n\n\"Por favor, aceite isto. É nada, um mero trinket, mas... se você usá-lo de vez em quando, isso trará grande alegria ao meu coração. Ao preenchê-lo com seu dedo, também preencherá o buraco no meu coração onde sua memória vive.\""
 ep3_story_cycle_violet_poet.2015.t:0 "Despedida, Novamente"
 ep3_story_cycle_violet_poet.book.tt:0 "[double_moon_book.GetName] ganha um novo poema"
 story_cycle_violet_poet:0 "A Poetisa Violeta"
 story_cycle_violet_poet_desc:0 "Você é filha do Califa de Córdoba e uma das últimas omíadas. Você caminha sem véu por um mundo austero, afiando as mentes das mulheres de todas as camadas."
