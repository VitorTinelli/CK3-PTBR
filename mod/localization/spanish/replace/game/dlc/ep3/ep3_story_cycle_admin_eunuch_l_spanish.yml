 admin_eunuch_liege_8_modifier_desc:0 "$admin_eunuch_liege_4_modifier_desc$"
 admin_eunuch_puppet_modifier:0 "Atenção do Eunuco"
 admin_eunuch_puppet_modifier_desc:0 "Este personagem tem recebido a atenção cuidadosa de um eunuco imperial."
 admin_eunuch_raise_taxes_modifier:0 "Impostos Aumentados"
 admin_eunuch_raise_taxes_modifier_desc:0 "Este personagem impôs impostos adicionais através das artimanhas de um eunuco."
 admin_eunuch_rivalry_tt:0 "[THIS.Char.GetShortUIName] se aproxima de formar uma rivalidade com [eunuch.GetShortUIName]"
 admin_eunuch_upgrade_modifier_tt:0 "#weak [modifiers|E] são melhorados#!"
 ep3_story_cycle_admin_eunuch.1001.a:0 "Eu tenho apenas o trabalho para [eunuch.GetSheHe]."
 ep3_story_cycle_admin_eunuch.1001.arrivals:0 "\n\nVindo de uma humilde família [origin.GetDeJureLiege.GetAdjective], os parentes [eunuch.GetHerHim] recentemente se juntaram a [eunuch.GetSheHe] em [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]..."
 ep3_story_cycle_admin_eunuch.1001.b:0 "Um a ser observado..."
 ep3_story_cycle_admin_eunuch.1001.desc:0 "\n\n[eunuch.GetFirstName] rapidamente subiu na hierarquia, e o talento, probidade e discrição em todas as coisas [eunuch.GetHerHim] recebe elogios incomuns entre as fileiras palacianas."
 ep3_story_cycle_admin_eunuch.1001.intro:0 "O reino está sempre em necessidade de administradores e servos de confiança para garantir um governo suave e a segurança do palácio, e os eunucos estão entre os mais valorizados no [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTootlip]."
 ep3_story_cycle_admin_eunuch.1001.intro_byz:0 "Durante séculos, os [Glossary( 'eunoukhoi', 'EUNOUKOS_GLOSS' )] serviram na burocracia e palácios do [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] como conselheiros e confidentes, desempenhando papéis importantes nos duelos políticos da época."
 ep3_story_cycle_admin_eunuch.1001.t:0 "$admin_eunuch_header$ [eunuch.GetFullNameNoTooltip]"
 ep3_story_cycle_admin_eunuch.2010.a:0 "Sim, você deve cuidar de tais assuntos [eunuch.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2010.b:0 "Os arranjos atuais são adequados."
 ep3_story_cycle_admin_eunuch.2010.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], se aproxima de mim em minha corte, falando em tons baixos enquanto seus olhos vagam pela sala.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [eunuch.GetSheHe] fala, \"Está claro para mim que os arranjos do governo poderiam ser tratados de forma muito mais suave do que estão... atualmente."
 ep3_story_cycle_admin_eunuch.2010.t:0 "$admin_eunuch_header$ Mãos Confiáveis"
 ep3_story_cycle_admin_eunuch.2015.a:0 "Você é uma grande ajuda, [eunuch.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2015.b:0 "Posso cuidar das coisas muito bem."
 ep3_story_cycle_admin_eunuch.2015.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], tem sido uma grande ajuda ultimamente, suportando muitos dos odiosos fardos do meu reino.\n\nEnquanto trabalhamos em pilhas de documentos, queimando o suprimento de cera do palácio com impressão após impressão do meu selo imperial, [eunuch.GetSheHe] suavemente oferece, \"Meu senhor, "
 ep3_story_cycle_admin_eunuch.2015.fallback:0 "você está tão sobrecarregado pelas mazelas do estado,"
 ep3_story_cycle_admin_eunuch.2015.hunter:0 "você não tem tempo para sua caça preciosa,"
 ep3_story_cycle_admin_eunuch.2015.outro:0 "e não me custaria nada aliviar você dessas cansativas responsabilidades...\""
 ep3_story_cycle_admin_eunuch.2015.t:0 "$admin_eunuch_header$ Compartilhe a Carga"
 ep3_story_cycle_admin_eunuch.2015.war:0 "seu tempo e atenção estão sobrecarregados pela guerra,"
 ep3_story_cycle_admin_eunuch.2021.a.grant:0 "Muito bem, [title.GetNameNoTierNoTooltip] é [governor.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2021.a:0 "Muito bem, [governor.GetFirstNameNoTooltip] será colocado na lista."
 ep3_story_cycle_admin_eunuch.2021.b:0 "[Select_CString( governor.IsFemale, 'Sua', 'Seu' )] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('governor'))] deve usar os canais adequados..."
 ep3_story_cycle_admin_eunuch.2021.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], organizou uma reunião privada, e fico surpreso ao ver [eunuch.GetSheHe] chegar com alguém à tiracolo. \"Ah, [ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] exclamou, \"Você conhece [Select_CString( governor.IsFemale, 'minha', 'meu' )] [governor.Custom('ComplimentAdjective')] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('governor'))], [governor.GetTitledFirstName]?\"\n\nCom precisão ensaiada, [Select_CString( governor.IsFemale, 'a', 'o' )] [governor.GetWomanMan] faz um grande espetáculo de [governor.GetHerselfHimself] para meu benefício.\n\n\"Meu senhor, [governor.GetFirstNameNoTooltip] seria um #EMP excelente#! candidato a governador do [title.GetAdjective] [title.GetTierAsNameNoTooltip] — muito melhor que a alternativa, de qualquer maneira..."
 ep3_story_cycle_admin_eunuch.2021.t:0 "$admin_eunuch_header$ Alto Cargo"
 ep3_story_cycle_admin_eunuch.2023.a.tt:0 "[eunuch.GetFirstName] tentará convencer [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitledFirstName] a conceder a você um [governorship|E]"
 ep3_story_cycle_admin_eunuch.2023.a:0 "Faça isso, eunuco!"
 ep3_story_cycle_admin_eunuch.2023.b.toast:0 "Sugestão Rejeitada"
 ep3_story_cycle_admin_eunuch.2023.b:0 "Eu não tenho tempo para isso."
 ep3_story_cycle_admin_eunuch.2023.desc:0 "Assistindo do palácio, lamento o desperdício de seus talentos e a ascensão de [governor.GetWomenMen] inferiores como governadores [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\nPelo bem do [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip], se não por [emperor.GetHerselfHimself], o [emperor.GetTitleAsNameNoTooltip] deve reconhecer seus talentos. Com alguns fundos, eu poderia garantir que [governor.GetSheHe] soubesse tanto..."
 ep3_story_cycle_admin_eunuch.2024.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], desliza para dentro da sala, caminhando timidamente em direção ao meu assento.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] grita feliz, \"Fico tão feliz em encontrá-lo! Estava apenas considerando a situação do [title.GetBaseNameNoTier]: o [title.GetTierAsNameNoTooltip] realmente poderia usar uma liderança forte e confiável.\"\n\n\"Como acontece, eu acho que conheço exatamente [Select_CString( governor.IsFemale, 'a', 'o' )] [governor.GetWomanMan] para o trabalho. Na minha humilde opinião, [governor.GetTitledFirstName], seria um #EMP formidável#! — e leal — governador, sua majestade."
 ep3_story_cycle_admin_eunuch.2024.t:0 "$admin_eunuch_header$ Cargo Nobre"
 ep3_story_cycle_admin_eunuch.2031.a:0 "[Select_CString( new_patriarch.IsFemale, 'Sua', 'Seu' )] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))] #EMP deverá#! ser [old_patriarch.GetTitleAsNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2031.b:0 "Vamos lá, isso é uma #EMP sugestão absurda#!..."
 ep3_story_cycle_admin_eunuch.2031.desc:0 "e ainda mais quando descubro [eunuch.GetSheHe] com [Select_CString( new_patriarch.IsFemale, 'sua', 'seu' )] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('new_patriarch'))], [new_patriarch.GetFirstName], que parece estar tentando alguma estranha aproximação da piedade [ROOT.Char.GetFaith.GetAdjectiveNoTooltip].\n\n[eunuch.GetFirstNameNoTooltip] fala bem — tão bem, na verdade, que quase não percebo a gravidade dos argumentos convincentes [eunuch.GetHerHim].\n\n\"Meu senhor,\" [eunuch.GetSheHe] balbucia, com uma expressão estranha no rosto [eunuch.GetHerHim], \"Deve, portanto, ser a vontade de [ROOT.Char.GetFaith.HighGodNameAlternate] que [new_patriarch.GetFirstNameNoTooltip] se torne o novo [old_patriarch.GetTitleAsName] dos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2031.intro:0 "Fico intrigado quando [Select_CString( eunuch.IsFemale, 'minha eunuca', 'meu eunuco' )], [eunuch.GetTitledFirstName], pede para nos encontrarmos em"
 ep3_story_cycle_admin_eunuch.2031.intro_byz:0 "a Hagia Sophia"
 ep3_story_cycle_admin_eunuch.2031.intro_fallback:0 "o [ROOT.Char.GetFaith.HouseOfWorship]"
 ep3_story_cycle_admin_eunuch.2031.t:0 "$admin_eunuch_header$ Sant[Select_CString( new_patriarch.IsFemale, 'a', 'o' )] [new_patriarch.GetMotherFather|U]"
 ep3_story_cycle_admin_eunuch.2040.a.toast:0 "Nomeação no Conselho"
 ep3_story_cycle_admin_eunuch.2040.a:0 "Uma excelente ideia, [eunuch.GetFirstNameNoTooltip], comece imediatamente."
 ep3_story_cycle_admin_eunuch.2040.b:0 "Eu não gostaria que você se distraísse de suas outras obrigações."
 ep3_story_cycle_admin_eunuch.2040.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], me aborda enquanto examino correspondências, \"Ah, [ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] grita, fechando a porta delicadamente. \"Um momento do seu tempo?\"\n\n\"Me dói ver o trabalho do seu conselho ser dificultado por seus... responsáveis.\" Levanto uma sobrancelha.\n\n[eunuch.GetSheHe|U] limpa a garganta, \"Eu ficaria muito feliz em assumir algumas das responsabilidades e cuidar de seus interesses, e os do [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], mais de perto.\""
 ep3_story_cycle_admin_eunuch.2040.t:0 "$admin_eunuch_header$ Assento à Mesa"
 ep3_story_cycle_admin_eunuch.2041.a:0 "Muito bem, como você disser, [eunuch.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2041.b:0 "Vou pensar sobre isso..."
 ep3_story_cycle_admin_eunuch.2041.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], aparece na porta da câmara do conselho, sorrindo ao me ver, e entra acompanhado de um de seus parentes.\n\n\"Meu [ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] treme, \"Refletindo sobre os... talentos um tanto escassos de seus conselheiros, de repente me ocorreu! [Select_CString( councillor.IsFemale, 'Minha', 'Meu' )] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('councillor'))], [councillor.GetFirstName], aqui poderia ser um grande ativo para sua senhoridade!\""
 ep3_story_cycle_admin_eunuch.2041.t:0 "$admin_eunuch_header$ Outra Voz"
 ep3_story_cycle_admin_eunuch.2043.a.tt:0 "[eunuch.GetFirstName] tentará convencer [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitledFirstName] a torná-lo um [councillor|E]"
 ep3_story_cycle_admin_eunuch.2043.a:0 "Por todos os meios, [eunuch.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2043.b.toast:0 "Sugestão Rejeitada"
 ep3_story_cycle_admin_eunuch.2043.b:0 "Não estou interessado."
 ep3_story_cycle_admin_eunuch.2043.desc:0 "Como um eunuco do palácio, vejo muita má administração, e é claro para mim que você é um dos [emperor.GetTitleAsName] sujeitos mais valiosos e negligenciados.\n\nCom seu apoio, eu poderia expressar os méritos de seu conselho com mais vigor — para o bem do [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2044.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], limpa a garganta de forma estridente enquanto nos preparamos para discutir alguns assuntos de estado.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip]\", [eunuch.GetSheHe] provoca, considerando as palavras [eunuch.GetHerHim], \"Embora seu governo seja — #EMP naturalmente#! — eficaz, não se pode deixar de se perguntar sobre certas... oportunidades perdidas.\"\n\n\"Há bons, #EMP sólidos#! [councillor.GetWomenMen] que passam despercebidos para os mais altos cargos. [councillor.GetWomenMen|U] como [councillor.GetTitledFirstName], por exemplo! [councillor.GetSheHe|U] seria um grande ativo para sua senhoridade!\""
 ep3_story_cycle_admin_eunuch.2044.t:0 "$admin_eunuch_header$ Conselho Poderoso"
 ep3_story_cycle_admin_eunuch.2050.a:0 "Excelente, uma grande iniciativa!"
 ep3_story_cycle_admin_eunuch.2050.b:0 "Não é necessário, [eunuch.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2050.candidacy:0 "\"Depois de ouvir muitas vozes por todo o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], vejo uma grande oportunidade para ajudar a candidatura [Select_CString( boon_target.IsFemale, 'da sua', 'do seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('boon_target'))], [boon_target.GetFirstName], ao [boon_title.GetAdjective] [boon_title.GetTierAsNameNoTooltip]!\""
 ep3_story_cycle_admin_eunuch.2050.debase:0 "\"O [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] sempre poderia usar mais moedas, e eu fiz as contas. Com um pequeno ajuste em nossa estratégia de cunhagem, poderíamos economizar uma grande quantia de moedas!\""
 ep3_story_cycle_admin_eunuch.2050.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], se aproxima de mim com um sorriso satisfeito nos lábios, tagarelando: \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu tenho a proposta mais deliciosa para você!\"\n\n"
 ep3_story_cycle_admin_eunuch.2050.fabricate_hook:0 "\"As notícias viajam rapidamente em [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], e assim fazem os rumores! Eu tenho exatamente a vantagem que você precisa para garantir que [boon_victim.GetTitledFirstName] saiba seu lugar!\""
 ep3_story_cycle_admin_eunuch.2050.imprison_rebel:0 "\"Todos sabemos o quão problemático [boon_victim.GetTitledFirstName] tem sido, e eu tenho a solução!\""
 ep3_story_cycle_admin_eunuch.2050.influence:0 "\"Eu tenho muitas fontes, assim como porta-vozes; eles só precisam de um pouco de direção. Nunca se pode ter advogados demais, isso é o que sempre digo.\""
 ep3_story_cycle_admin_eunuch.2050.outro:0 "\n\n\"Então, devo dar a ordem, glorioso [ROOT.Char.GetTitleAsNameNoTooltip]?\""
 ep3_story_cycle_admin_eunuch.2050.raise_taxes:0 "\"O [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] sempre poderia usar mais fundos e, nesse sentido, eu criei uma proposta para um aumento de impostos #EMP modesto#!.\""
 ep3_story_cycle_admin_eunuch.2050.t:0 "$admin_eunuch_header$ Iniciativa Abundante"
 ep3_story_cycle_admin_eunuch.2051.a.tt:0 "Você descobre um dos [secrets|E] de [secret_owner.GetTitledFirstName]"
 ep3_story_cycle_admin_eunuch.2051.a:0 "Conte-me tudo, [eunuch.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2051.b:0 "Acho que prefiro não saber..."
 ep3_story_cycle_admin_eunuch.2051.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], organizou uma reunião privada entre nós e [Select_CString( secret_owner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('secret_owner'))], [secret_owner.GetTitledFirstName], que, a julgar pela expressão no rosto [secret_owner.GetHerHim], está inseguro sobre o que pensar.\n\nO castrato risonho coloca o medo de [ROOT.Char.GetFaith.HighGodName] no pobre [secret_owner.GetWomanMan], insinuando-se em direção a algum segredo obscuro [Select_CString( secret_owner.IsFemale, 'da', 'do' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('secret_owner'))] que [secret_owner.GetSheHe] desenterrou.\n\nFinalmente, [Select_CString( eunuch.IsFemale, 'a', 'o' )] [eunuch.Custom2('InsultNoun', ROOT.Char)] arrogante se volta para mim com um sorriso doentio, \"Bem, [ROOT.Char.Custom('FormOfAddressForLiege')], você quer saber o que #EMP eu#! sei?\""
 ep3_story_cycle_admin_eunuch.2051.t:0 "$admin_eunuch_header$ Pássaros Pequenos"
 ep3_story_cycle_admin_eunuch.2052.a.tt:0 "Você expõe um dos [hostile_schemes|E] de [scheme_owner.GetTitledFirstName]"
 ep3_story_cycle_admin_eunuch.2052.a:0 "Conte-me tudo, [eunuch.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2052.b:0 "Acho que prefiro não saber..."
 ep3_story_cycle_admin_eunuch.2052.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], organizou uma reunião privada entre nós e [Select_CString( scheme_owner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scheme_owner'))], [scheme_owner.GetFirstName], que, a julgar pela expressão no rosto [scheme_owner.GetHerHim], está profundamente preocupado com as palavras de [eunuch.GetFirstNameNoTooltip].\n\nO castrato risonho está colocando o medo de [ROOT.Char.GetFaith.HighGodName] n[Select_CString( scheme_owner.IsFemale, 'a', 'o' )] pobre [scheme_owner.GetWomanMan], insinuando-se em direção a algum plano obscuro [Select_CString( scheme_owner.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('scheme_owner'))] que [eunuch.GetSheHe] afirma ter desenterrado.\n\nFinalmente, [Select_CString( eunuch.IsFemale, 'a', 'o' )] [eunuch.Custom2('InsultNoun', ROOT.Char)] arrogante se volta para mim com um sorriso, \"Bem, [ROOT.Char.Custom('FormOfAddressForLiege')], você quer saber o que [Select_CString( scheme_owner.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('scheme_owner'))] tem feito?\""
 ep3_story_cycle_admin_eunuch.2052.t:0 "$admin_eunuch_header$ Algo em Andamento"
 ep3_story_cycle_admin_eunuch.2060.a:0 "Sim, sim, é seu [eunuch.GetFirstNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.2060.b:0 "Não, tenho outras ideias..."
 ep3_story_cycle_admin_eunuch.2060.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], se aproxima de mim com uma pequena tosse enquanto aguardo uma audiência, antes de iniciar, \"Ah, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [eunuch.Custom2('RelationToMeShort', ROOT.Char)], havia algo que eu queria lhe perguntar.\"\n\n\"Enquanto aprecio muito meu lugar em seu tribunal, realmente acho que poderia ser de mais assistência. Na verdade, tenho um papel em mente..."
 ep3_story_cycle_admin_eunuch.2060.t:0 "$admin_eunuch_header$ Mais Responsabilidades"
 ep3_story_cycle_admin_eunuch.2061.a:0 "[positioner.GetFirstNameNoTooltip] é uma boa sugestão!"
 ep3_story_cycle_admin_eunuch.2061.b:0 "Não estou convencido..."
 ep3_story_cycle_admin_eunuch.2061.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], se aproxima de mim, seguido por um[Select_CString( positioner.IsFemale, 'a', '' )] [positioner.GetWomanMan] de aparência comum. \"Aí está, [ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] sorri, \"Eu trouxe para você [Select_CString( positioner.IsFemale, 'minha talentosa', 'meu talentoso' )] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('positioner'))], [positioner.GetTitledFirstName]!\"\n\nCom precisão ensaiada, [positioner.GetWomanMan] faz um grande show de [positioner.GetHerselfHimself] para meu benefício.\n\n\"Meu senhor feudal, [positioner.GetFirstNameNoTooltip] seria um #EMP excelente#! candidato para um cargo em seu tribunal — verdadeiramente [positioner.GetSheHe] é desperdiçado em qualquer outro lugar..."
 ep3_story_cycle_admin_eunuch.2061.t:0 "$admin_eunuch_header$ Promoção Familiar"
 ep3_story_cycle_admin_eunuch.2070.a:0 "[eunuch_marry.GetFirstNameNoTooltip] é uma boa combinação para [emperor_marry.GetFirstNameNoTooltip]!"
 ep3_story_cycle_admin_eunuch.2070.b:0 "Acho que não..."
 ep3_story_cycle_admin_eunuch.2070.desc:0 "[Select_CString( eunuch.IsFemale, 'Minha eunuca', 'Meu eunuco' )], [eunuch.GetTitledFirstName], aparece diante de mim, com um membro da sua família ao lado. \"[ROOT.Char.GetTitleAsNameNoTooltip]!\" [eunuch.GetSheHe] ri, \"Eu tenho a proposta mais deliciosa para você!\n\n\"[Select_CString( eunuch_marry.IsFemale, 'Minha', 'Meu' )] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('eunuch_marry'))], [eunuch_marry.GetTitledFirstName], aqui seria um #EMP dos mais#! elegíveis cônjuges para [Select_CString( emperor_marry.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emperor_marry'))], [emperor_marry.GetTitledFirstName], tenho certeza de que você concorda!\"\n\nCom uma precisão quase ensaiada demais, [Select_CString( eunuch_marry.IsFemale, 'a', 'o' )] [eunuch_marry.GetWomanMan] orgulhosamente se apresenta para mim."
 ep3_story_cycle_admin_eunuch.2070.t:0 "$admin_eunuch_header$ Ascensão Social"
 ep3_story_cycle_admin_eunuch.3000.a:0 "Curioso."
 ep3_story_cycle_admin_eunuch.3000.desc:0 "Tem havido uma grande quantidade de conversas ultimamente sobre a atenção especial que [Select_CString( eunuch.IsFemale, 'minha eunuca', 'meu eunuco' )], [eunuch.GetTitledFirstName], parece dar [Select_CString( protege.IsFemale, 'a sua', 'ao seu' )] [eunuch.Custom2('RelationToMeShort', SCOPE.sC('protege'))], [protege.GetFirstName].\n\nO eunuco trata [protege.GetSheHe] quase como [Select_CString( protege.IsFemale, 'a', 'o' )] [protege.Custom('GetDaughterSon')] que [eunuch.GetSheHe] nunca poderia ter..."
 ep3_story_cycle_admin_eunuch.3000.t:0 "$admin_eunuch_header$ O Protégé"
 ep3_story_cycle_admin_eunuch.3001.a:0 "Outro eunuco útil, suponho."
 ep3_story_cycle_admin_eunuch.3001.desc:0 "Parece que [Select_CString( eunuch.IsFemale, 'minha eunuca', 'meu eunuco' )], [eunuch.GetTitledFirstName], pegou outro eunuco sob suas asas e o orienta nos caminhos da administração [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\n[student.GetFirstName] é frequentemente visto junto com [eunuch.GetSheHe], o par examinando números e discutindo a economia do [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] — só podemos supor..."
 ep3_story_cycle_admin_eunuch.3001.t:0 "$admin_eunuch_header$ O Estudante"
 ep3_story_cycle_admin_eunuch.3010.a:0 "Estou certo de que eles resolverão suas diferenças..."
 ep3_story_cycle_admin_eunuch.3010.desc:0 "Os modos da secretaria de eunuco são um mistério para meros mortais como eu, mas é claro que a rápida ascensão e ampla influência de [eunuch.GetFirstName] fez [eunuch.GetSheHe] como inimigos até lá.\n\n[rival.GetFirstName], outro eunuco, deixou clara a sua inimizade, e eles parecem estar fazendo o máximo para se atrapalharem mutuamente."
 ep3_story_cycle_admin_eunuch.3010.t:0 "$admin_eunuch_header$ O Rival"
 ep3_story_cycle_admin_eunuch.4000.a:0 "Explique-se, neste instante!"
 ep3_story_cycle_admin_eunuch.4000.b.reason:0 "Esta opção está disponível porque você já conhecia o [segredo|E]"
 ep3_story_cycle_admin_eunuch.4000.b:0 "Oh sim, estou ciente."
 ep3_story_cycle_admin_eunuch.4000.c:0 "Aquel[Select_CString( spouse.IsFemale, 'a', 'e' )] [spouse.Custom2('InsultNounSexual', ROOT.Char)] miserável! Prenda [spouse.GetSheHe] imediatamente!"
 ep3_story_cycle_admin_eunuch.4000.desc:0 "Caminhando para a cama, cruzo-me com um [eunuch.GetFirstName] com uma expressão abatida, que ofega, \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], estou tão feliz por ter encontrado você! Oh, é a notícia mais angustiante!\"\n\n[eunuch.GetSheHe|U] se aproxima, sussurrando em meu ouvido, \"É [Select_CString( spouse.IsFemale, 'sua', 'seu' )] [spouse.Custom('WifeHusband')], [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [eunuch.Custom2('RelationToMeShort', ROOT.Char)]! Parece que [spouse.GetSheHe] tem estado... se envolvendo! Fora do casamento! Fazendo a besta com duas costas! Com alguém na corte!\"\n\nEu olho para [eunuch.GetSheHe], procurando palavras."
 ep3_story_cycle_admin_eunuch.4000.failure:0 "Você encontra apenas dúvidas"
 ep3_story_cycle_admin_eunuch.4000.innocent:0 "Não há evidências de um caso."
 ep3_story_cycle_admin_eunuch.4000.success.tt:0 "Um [segredo|E] ou [plano|E] pode ser revelado"
 ep3_story_cycle_admin_eunuch.4000.success:0 "Você encontra a verdade"
 ep3_story_cycle_admin_eunuch.4000.t:0 "$admin_eunuch_header$ Acusações"
 ep3_story_cycle_admin_eunuch.4010.a:0 "Veremos quão profunda essa conspiração é..."
 ep3_story_cycle_admin_eunuch.4010.c:0 "Prenda os três, de uma vez!"
 ep3_story_cycle_admin_eunuch.4010.d:0 "Talvez não seja #EMP tão#! ruim?"
 ep3_story_cycle_admin_eunuch.4010.desc:0 "Rumores têm se espalhado ultimamente, e quanto mais eu reflito sobre seu conteúdo, mais sentido vejo neles...\n\n[Select_CString( spouse.IsFemale, 'Minha', 'Meu' )] [spouse.Custom('WifeHusband')] e [seducer.GetFirstName]! Como [spouse.GetTitledFirstName] poderia fazer isso comigo...? Eu revisei e revisei os fatos em minha mente e não cheguei mais perto do fio da verdade.\n\nSuspeito da mão daquel[Select_CString( eunuch.IsFemale, 'a', 'e' )] [seducer.Custom2('RelationToMeShort', SCOPE.sC('eunuch'))] patife, [eunuch.GetFirstName], nisso, mas como posso saber com certeza?"
 ep3_story_cycle_admin_eunuch.4010.failure.tt:0 "Você não encontrou nada"
 ep3_story_cycle_admin_eunuch.4010.t:0 "$admin_eunuch_header$ Indiscrições"
 ep3_story_cycle_admin_eunuch.5000.a:0 "Oh, não seja ridículo! [eunuch.GetSheHe|U] é um servo leal."
 ep3_story_cycle_admin_eunuch.5000.b:0 "Talvez você esteja certo..."
 ep3_story_cycle_admin_eunuch.5000.desc:0 "[Select_CString( whinger.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('whinger'))], [whinger.GetTitledFirstName], entra no meu escritório cheio de bravata, escaneando o ambiente. Por fim, [whinger.GetSheHe] se aproxima, suspirando, \"Bom, aquela #EMP criatura fétida#! não está aqui!\"\n\nEu pondero por um momento sobre quem [whinger.GetSheHe] poderia estar se referindo, mas não há muita necessidade. \"[whinger.Custom2('RelationToMeShort', ROOT.Char)|U]! Você #EMP deve#! fazer algo sobre aquele eunuco, [eunuch.GetFirstName]! [eunuch.GetSheHe|U] está com o dedo em cada torta e um ouvido em cada privado. Eu lhe digo, [eunuch.GetSheHe] não está fazendo o bem!"
 ep3_story_cycle_admin_eunuch.5000.t:0 "$admin_eunuch_header$ Fazendo Inimigos"
 ep3_story_cycle_admin_eunuch.5010.a:0 "[ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival'))|U], confio em [eunuch.GetFirstNameNoTooltip], e você deve confiar também."
 ep3_story_cycle_admin_eunuch.5010.b:0 "Sim, o eunuco ultrapassa os limites."
 ep3_story_cycle_admin_eunuch.5010.desc:0 "\"Você não vê como esta aranha tece suas teias contra você, [rival.Custom2('RelationToMeShort', ROOT.Char)]?\" [rival.GetFirstName] interrompe um [eunuch.GetFirstName] visivelmente surpreso, que olha para mim.\n\nDesavenças entre [Select_CString( rival.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival'))] e [eunuch.GetFirstNameNoTooltip] têm piorado ultimamente e ameaçam se tornar uma grande distração na corte.\n\n[eunuch.GetFirstNameNoTooltip] se recompõe antes de retrucar, \"Essa é uma acusação escandalosa, [ROOT.Char.Custom('FormOfAddressForLiege')]! Eu me preocupo apenas com os melhores interesses do [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]!\""
 ep3_story_cycle_admin_eunuch.5010.t:0 "$admin_eunuch_header$ Revidar"
 ep3_story_cycle_admin_eunuch.5020.a:0 "Uma dupla improvável."
 ep3_story_cycle_admin_eunuch.5020.desc:0 "Dizem-me que [Select_CString( puppet.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('puppet'))], [puppet.GetTitledFirstName], tem passado cada vez mais de seus dias na companhia do eunuco, [eunuch.GetFirstName], e os dois são constantemente vistos juntos, conversando privadamente e intensamente.\n\nDizem até que [puppet.GetFirstNameNoTooltip] tem recebido tutoria de uma espécie, como se [eunuch.GetFirstNameNoTooltip] estivesse preparando [puppet.GetSheHe] para um cargo na secretaria do eunuco!"
 ep3_story_cycle_admin_eunuch.5020.t:0 "$admin_eunuch_header$ Menos Resistência"
 ep3_story_cycle_admin_eunuch.6000.a.failure:0 "O golpe é bem-sucedido"
 ep3_story_cycle_admin_eunuch.6000.a.success:0 "O golpe foi frustrado"
 ep3_story_cycle_admin_eunuch.6000.a:0 "Isto é #EMP TRAIÇÃO#!. Guardas! Prendam-nos!"
 ep3_story_cycle_admin_eunuch.6000.body:0 "\n\nO eunuco suspira pesadamente, \"Sinto muito que tenha chegado a isso, sua majestade. É #EMP mais#! infeliz. Fui instruído a informar que seu governo não é mais sustentável.\"\n\n"
 ep3_story_cycle_admin_eunuch.6000.c:0 "Saia agora, e talvez eu deixe você manter sua cabeça."
 ep3_story_cycle_admin_eunuch.6000.co_caesar:0 "\"Foi decidido: você passará o manto para [Select_CString( coupist.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('RelationToMeShort', coupist)], [coupist.GetTitledFirstName], para o bem do império!\""
 ep3_story_cycle_admin_eunuch.6000.d:0 "Muito bem... Eu farei o que você pede."
 ep3_story_cycle_admin_eunuch.6000.desc:0 "Enquanto caminho pela sala do trono, avisto [eunuch.GetFirstName] se aproximando com propósito, seguido por um grupo de eunuco. \"[ROOT.Char.GetTitleAsNameNoTooltip]!\" ele clama. \"Eu preciso falar com você!\""
 ep3_story_cycle_admin_eunuch.6000.eunuch_family:0 "\"Foi decidido: você passará o manto para [Select_CString( coupist.IsFemale, 'minha', 'meu' )] [eunuch.Custom2('RelationToMeShort', coupist)], [coupist.GetTitledFirstName], para o bem de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!"
 ep3_story_cycle_admin_eunuch.6000.fallback:0 "\"Foi decidido: você passará o manto para [Select_CString( coupist.IsFemale, 'a', 'o' )] [coupist.GetTitledFirstName], para o bem do império!\""
 ep3_story_cycle_admin_eunuch.6000.family:0 "\"Foi decidido: você passará o manto para [Select_CString( coupist.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('RelationToMeShort', coupist)], [coupist.GetTitledFirstName], para o bem do império!\""
 ep3_story_cycle_admin_eunuch.6000.regent:0 "\"Foi decidido: você passará o manto para [Select_CString( coupist.IsFemale, 'sua', 'seu' )] regente, [coupist.GetTitledFirstName], para o bem do império!\""
 ep3_story_cycle_admin_eunuch.6000.t:0 "$admin_eunuch_header$ Um Golpe Muito [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 ep3_story_cycle_admin_eunuch.8000.a:0 "[eunuch.GetFirstNameNoTooltip] deve ir."
 ep3_story_cycle_admin_eunuch.8000.b:0 "É hora de [student.GetFirstNameNoTooltip] assumir."
 ep3_story_cycle_admin_eunuch.8000.c:0 "[rival.GetFirstNameNoTooltip] é um par de mãos mais estáveis."
 ep3_story_cycle_admin_eunuch.8000.d:0 "Não vou desestabilizar o equilíbrio de poder."
 ep3_story_cycle_admin_eunuch.8000.desc:0 "[previous_story_owner.GetTitledFirstName], administração — [eunuch.GetSheHe] ainda exerce alguma influência no palácio...\n\n[eunuch.GetSheHe|U] não perdeu tempo em buscar minha boa vontade, fazendo exibições obsequiosas de deferência na corte. Talvez [eunuch.GetSheHe] possa se mostrar útil."
 ep3_story_cycle_admin_eunuch.8000.intro:0 "[Select_CString( eunuch.IsFemale, 'A eunuca', 'O eunuco' )], [eunuch.GetTitledFirstName], se impunha em meu"
 ep3_story_cycle_admin_eunuch.8000.intro_byz:0 "[Select_CString( eunuch.IsFemale, 'A', 'O' )] [Glossary( 'eunoukhos', 'EUNOUKOS_GLOSS' )], [eunuch.GetTitledFirstName], se impunha em meu"
 ep3_story_cycle_admin_eunuch.8000.intro_enemy:0 "inimigo,"
 ep3_story_cycle_admin_eunuch.8000.intro_fallback:0 "antecessor,"
 ep3_story_cycle_admin_eunuch.8000.intro_family:0 "[ROOT.Char.Custom2('RelationToMeShort', previous_story_owner)],"
 ep3_story_cycle_admin_eunuch.8000.t:0 "$admin_eunuch_header$ Agarrando-se ao Poder"
 ep3_story_cycle_admin_eunuch.8010.d:0 "As coisas certamente vão mudar..."
 ep3_story_cycle_admin_eunuch.8010.desc:0 "Um valioso servo de [admin_title.GetDefinitiveName] infelizmente está morto, [eunuch.GetFirstName], um dos eunuques mais influentes dos tempos recentes, foi [eunuch.GetDeathReasonHideKiller]...\n\nQue [ROOT.Char.GetFaith.HighGodName] não demore em providenciar ao [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] outro servo da estatura e habilidade [eunuch.GetHerHim]."
 ep3_story_cycle_admin_eunuch.8010.t:0 "$admin_eunuch_header$ Uma Vida de Serviço"
 ep3_story_cycle_admin_eunuch.8020.a:0 "[eunuch.GetFirstNameNoTooltip] é útil demais para ser trancado..."
 ep3_story_cycle_admin_eunuch.8020.d:0 "Uma perda para [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip]."
 ep3_story_cycle_admin_eunuch.8020.desc:0 "Uma vez um valioso servo de [admin_title.GetDefinitiveName], o influente eunuco da corte, [eunuch.GetFirstName], agora se contorce contra as suas correntes [background_dungeon_scope.GetPrimaryTitle.GetAdjectiveNoTooltip].\n\n[eunuch.GetSheHe|U] poderia, talvez, ser devolvido ao meu serviço, se tal empreendimento fosse considerado válido..."
 ep3_story_cycle_admin_eunuch.8020.t:0 "$admin_eunuch_header$ Fechadura e Chave"
 ep3_story_cycle_admin_eunuch.8030.a:0 "Aquele eunuco é #EMP meu#!."
 ep3_story_cycle_admin_eunuch.8030.b:0 "[student.GetFirstNameNoTooltip] foi ensinado por [eunuch.GetSheHe], e pode continuar o trabalho [eunuch.GetHerHim]."
 ep3_story_cycle_admin_eunuch.8030.c:0 "Seu velho rival [rival.GetFirstNameNoTooltip] pode consertar as coisas."
 ep3_story_cycle_admin_eunuch.8030.d:0 "Infelizmente, este escapou..."
 ep3_story_cycle_admin_eunuch.8030.desc:0 "Uma vez um valioso servo de [admin_title.GetDefinitiveName], o influente eunuco da corte, [eunuch.GetFirstName], agora serve [eunuch.GetLiege.GetName].\n\n[eunuch.GetSheHe|U] poderia, talvez, ser tentado a voltar ao meu serviço, se tal empreendimento fosse considerado válido..."
 ep3_story_cycle_admin_eunuch.8030.t:0 "$admin_eunuch_header$ Indisposto"
 ep3_story_cycle_admin_eunuch.8040.d:0 "Uma pena."
 ep3_story_cycle_admin_eunuch.8040.desc:0 "Uma vez um valioso servo da corte [admin_title.GetAdjective], o influente eunuco, [eunuch.GetFirstName], avançou para coisas maiores.\n\n"
 ep3_story_cycle_admin_eunuch.8040.laamp:0 "Parece que [eunuch.GetSheHe] está buscando uma vida mais aventureira..."
 ep3_story_cycle_admin_eunuch.8040.noble_family:0 "Parece que minha perda é o ganho da propriedade [eunuch.GetHouse.GetBaseName]..."
 ep3_story_cycle_admin_eunuch.8040.ruler:0 "Parece que minha perda é o ganho do [eunuch.GetPrimaryTitle.GetName]..."
 ep3_story_cycle_admin_eunuch.8040.t:0 "$admin_eunuch_header$ Coisas Maiores"
 ep3_story_cycle_admin_eunuch.toast:0 "Eunuco Eminente"
 ep3_story_cycle_admin_eunuch_downgrade_modifier_tt:0 "A influência [Select_CString( TARGET_CHARACTER.IsFemale, 'da', 'do' )] [TARGET_CHARACTER.GetTitledFirstNameNoTooltip] diminui:"
 ep3_story_cycle_admin_eunuch_upgrade_modifier_tt:0 "A influência [Select_CString( TARGET_CHARACTER.IsFemale, 'da', 'do' )] [TARGET_CHARACTER.GetTitledFirstNameNoTooltip] cresce:"
 friend_admin_eunuch_puppet:0 "[CHARACTER.GetShortUIName|U], um eunuco imperial, preparou [TARGET_CHARACTER.GetShortUIName] para fins políticos"
 friend_admin_eunuch_puppet_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] foi preparado para fins políticos por [CHARACTER.GetShortUIName], um eunuco imperial"
 friend_admin_eunuch_vassal:0 "[CHARACTER.GetShortUIName|U], um eunuco imperial, alinhou [CHARACTER.GetHerselfHimself] com [TARGET_CHARACTER.GetShortUIName]"
 friend_admin_eunuch_vassal_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] alinhou [TARGET_CHARACTER.GetHerselfHimself] com [CHARACTER.GetShortUIName], um eunuco imperial"
 influence_hook:0 "Gancho de Influência"
 rival_admin_eunuch:0 "[CHARACTER.GetShortUIName|U], um eunuco imperial, fez um inimigo político de [TARGET_CHARACTER.GetShortUIName]"
 rival_admin_eunuch_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] se tornou um inimigo político de [CHARACTER.GetShortUIName], um eunuco imperial"
 rival_admin_eunuch_family:0 "[CHARACTER.GetShortUIName|U], um eunuco imperial, fez um inimigo político de [TARGET_CHARACTER.GetShortUIName]"
 rival_admin_eunuch_family_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] se tornou um inimigo político de [CHARACTER.GetShortUIName], um eunuco imperial"
 strong_influence_hook:0 "Gancho de Influência"
