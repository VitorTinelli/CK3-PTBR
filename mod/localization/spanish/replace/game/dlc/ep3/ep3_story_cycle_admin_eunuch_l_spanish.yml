 admin_eunuch_liege_3_modifier:0 "Eunuco Desprezado #weak (I/III)#!"
 admin_eunuch_liege_3_modifier_desc:0 "$admin_eunuch_liege_1_modifier_desc$"
 admin_eunuch_liege_4_modifier:0 "Eunuco Influente #weak (I/V)#!"
 admin_eunuch_liege_4_modifier_desc:0 "Este personagem é servido por um influente eunuco da corte."
 admin_eunuch_liege_5_modifier:0 "Eunuco Influente #weak (II/V)#!"
 admin_eunuch_liege_5_modifier_desc:0 "$admin_eunuch_liege_4_modifier_desc$"
 admin_eunuch_liege_6_modifier:0 "Eunuco Influente #weak (III/V)#!"
 admin_eunuch_liege_6_modifier_desc:0 "$admin_eunuch_liege_4_modifier_desc$"
