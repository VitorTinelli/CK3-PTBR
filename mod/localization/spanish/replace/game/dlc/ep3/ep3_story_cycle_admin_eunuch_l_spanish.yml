l_spanish:
 EUNOUKOS_GLOSS:0 "Eunucos, literalmente \"guardas do quarto\" devido ao seu papel comum como camareiros, eram servos masculinos castrados. Extraídos de estratos sociais variados, muitas vezes altamente educados e confiáveis por não terem distrações carnais ou interesses paternos, rapidamente se tornaram atores poderosos na política bizantina."
 SCHEME_TARGET_IS_ADMIN_EUNUCH_TARGET:0 "Eunuco Desprezado"
 SCHEME_TARGET_IS_ADMIN_EUNUCH_UPSET_COURTIER:0 "Eunuco Influente"
