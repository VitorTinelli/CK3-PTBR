l_spanish:
 ep3_powerful_families.8000.a.lose:0 "[influential_family_member.GetFirstNameNoTooltip] é pego"
 ep3_powerful_families.8000.a.win:0 "[influential_family_member.GetFirstNameNoTooltip] tem sucesso"
 ep3_powerful_families.8000.a:0 "Uma oportunidade deliciosa!"
 ep3_powerful_families.8000.b.tt:0 "[influential_family_member.GetFirstNameNoTooltip] pode descobrir segredos de [liege.GetNameNoTooltip]"
 ep3_powerful_families.8000.b.win.no_secret:0 "[influential_family_member.GetFirstNameNoTooltip] não encontra segredos"
 ep3_powerful_families.8000.b.win.secret:0 "[influential_family_member.GetFirstNameNoTooltip] descobre um segredo"
 ep3_powerful_families.8000.b:0 "Pesquise nos arquivos por segredos!"
 ep3_powerful_families.8000.c:0 "Apenas seja um servo leal."
 ep3_powerful_families.8000.desc:0 "Hoje, abro uma carta de [influential_family_member.Custom2('MyCharacterIntroduction', ROOT.Char)]. A natureza baixa e astuta [influential_family_member.GetHerHim|U] está em plena exibição enquanto [influential_family_member.GetSheHe] propõe que tiremos proveito de sua posição para acessar e modificar documentos em posse de [liege.GetTitleAsNameNoTooltip].\n\nA nomeação de [influential_family_member.GetNameNoTooltip|U] na corte de [liege.GetName] tem sido um ativo vital até agora para avançar os interesses da família, e embora a proposta [influential_family_member.GetHerHim] busque nos levar ainda mais adiante, pode colocar em risco a posição [influential_family_member.GetHerHim] para sempre..."
 ep3_powerful_families.8000.t:0 "Em Altos Lugares"
 ep3_powerful_families.8010.a.lose:0 "[liege.GetTitleAsNameNoTooltip|U] se torna cauteloso"
 ep3_powerful_families.8010.a.win:0 "Sua influência cresce"
 ep3_powerful_families.8010.a:0 "Alguma ajuda monetária ganhará a confiança [liege.GetHerHim]."
 ep3_powerful_families.8010.b:0 "Devemos prometer nossas tropas diretamente para a guerra!"
 ep3_powerful_families.8010.c:0 "Devemos explorar este momento de fraqueza."
 ep3_powerful_families.8010.d:0 "Agora não é a hora."
 ep3_powerful_families.8010.desc:0 "A [war.GetName|U] continua e, após uma série de batalhas e cercos malsucedidos, [liege.GetName] acabou em uma posição desfavorável. Em todo o [liege.GetPrimaryTitle.GetName], as famílias e cortesãos influentes estão murmurando e tramando para avançar seus próprios interesses no momento de fraqueza de [liege.GetTitleAsNameNoTooltip|U], e talvez agora seja a nossa vez de fazer o mesmo.\n\nSe ajudarmos [liege.GetTitleAsNameNoTooltip|U], podemos ganhar o favor [liege.GetHerHim] e entrelaçar nossa influência ao redor do trono como uma poderosa videira..."
 ep3_powerful_families.8010.t:0 "[liege.GetTitleAsNameNoTooltip|U] em Apuros"
 ep3_powerful_families.8011.a:0 "Que generosidade."
 ep3_powerful_families.8011.desc:0 "Seus valentes esforços na [war.GetName] não passaram despercebidos pela minha família. Pegue sua parte de nossa riqueza e que isso ajude a trazer vitória para todos nós!"
 ep3_powerful_families.8011.t:0 "[generous_family.Custom2('AppropriateGreetingPositive', liege )]"
 ep3_powerful_families.8012.a.toast:0 "[liege.GetFirstName] aceita sua oferta"
 ep3_powerful_families.8012.a:0 "Muito bem."
 ep3_powerful_families.8012.b.toast:0 "[liege.GetFirstName] rejeita sua oferta"
 ep3_powerful_families.8012.b:0 "Não serei explorado!"
 ep3_powerful_families.8012.desc:0 "Não é segredo que a [war.GetName] não está indo tão bem quanto esperávamos, e as famílias em disputa já começaram a tramar maneiras de preencher o crescente vácuo de poder no reino. [generous_family.GetName|U], no entanto, busca fazer isso de uma maneira mais útil para mim.\n\nEm sua carta, [generous_family.GetSheHe] oferece para comprometer os exércitos [generous_family.GetHerHim] para a guerra, apenas em troca de um número substancial de títulos e poderes honorários."
 ep3_powerful_families.8012.t:0 "Uma Família Que Guerra Juntas"
 ep3_powerful_families.8020.a.lose:0 "Seus esforços são em vão"
 ep3_powerful_families.8020.a.win:0 "Você suprime a influência deles por enquanto"
 ep3_powerful_families.8020.a:0 "Precisamos abafá-los."
 ep3_powerful_families.8020.b.lose:0 "[new_family.GetFirstName] não fica impressionado"
 ep3_powerful_families.8020.b.win:0 "[new_family.GetFirstName] fica impressionado"
 ep3_powerful_families.8020.b:0 "Devemos deixá-los saber que somos amigos."
 ep3_powerful_families.8020.c:0 "Basta evitá-los."
 ep3_powerful_families.8020.desc:0 "Em todo o reino, o poder de uma nova família parece estar se enraizando. Como uma erva daninha, eles espalharam sua influência por todos os cantos de nossa sociedade e raramente passa um dia em que se possa evitar ouvir o nome \"[new_family.GetHouse.GetBaseName].\"\n\nNão se pode negar que esta família floresceu em uma das maiores do reino, e minha família agora olha para mim em busca de orientação sobre como devemos abordar esse novo poder."
 ep3_powerful_families.8020.t:0 "No Broto"
 ep3_powerful_families.8030.a.lose:0 "Você não recebe resposta"
 ep3_powerful_families.8030.a.win:0 "Você convence [friendly_family.GetSheHe]"
 ep3_powerful_families.8030.a:0 "Preciso entrar em contato com [friendly_family.GetSheHe] imediatamente!"
 ep3_powerful_families.8030.b:0 "Isso não é para isso que os amigos servem."
 ep3_powerful_families.8030.desc:0 "[faction.GetName|U] ainda é um movimento em ascensão, mas, é claro, conta com o apoio da minha grande família. Algumas famílias, no entanto, não parecem ainda ver a retidão da causa e até agora desprezaram a oportunidade de se juntar a nós.\n\nEnquanto redijo cartas coordenando os próximos passos da facção, não consigo deixar de me perguntar por que [friendly_family.Custom2('MyCharacterIntroduction', ROOT.Char)] ainda não manifestou apoio à causa."
 ep3_powerful_families.8030.t:0 "Famílias Que Tramam Juntas..."
 ep3_powerful_families.8040.a.lose:0 "A visita foi um desastre"
 ep3_powerful_families.8040.a.win:0 "A visita vai bem"
 ep3_powerful_families.8040.a:0 "Precisamos convidar [other_family.GetSheHe] imediatamente!"
 ep3_powerful_families.8040.b.lose:0 "Seu plano é exposto"
 ep3_powerful_families.8040.b.win:0 "Sua influência se espalha"
 ep3_powerful_families.8040.b:0 "Precisamos trabalhar para fazer estas terras nossas."
 ep3_powerful_families.8040.c:0 "Preciso apenas manter a cabeça baixa."
 ep3_powerful_families.8040.desc:0 "Desde que [location.GetName] caiu na posse da Casa [other_family.GetHouse.GetName], comecei a me sentir como um convidado em minha própria propriedade. É claro que as terras dentro da casa são minhas, mas tudo além dos portões pertence a [other_family.GetName].\n\nEnquanto faço minha caminhada matinal pelos jardins, não consigo evitar me perguntar se seria politicamente vantajoso ter [other_family.GetFirstNameNoTooltip] caminhando ao meu lado..."
 ep3_powerful_families.8040.t:0 "Cordiais"
 ep3_powerful_families.8060.a.lose:0 "Você é pego"
 ep3_powerful_families.8060.a.win:0 "Você extrai sua riqueza"
 ep3_powerful_families.8060.a:0 "Atingir suas finanças."
 ep3_powerful_families.8060.b:0 "Subornar seus servos."
 ep3_powerful_families.8060.c:0 "Preciso tolerar a presença deles por enquanto."
 ep3_powerful_families.8060.desc:0 "Faço uma caminhada tranquila por [location.GetNameNoTier] com meu habitual séquito de confidentes e protetores e me maravilho com os magníficos edifícios que lá estão. Estou embriagado de deleite pelas terras que governo, mas então meu humor se azeda ao avistar uma grotesca propriedade da família [other_family.GetHouse.GetName].\n\nAs propriedades deles são como uma scatela de verrugas em minhas terras de outra forma perfeitas, e sinto meu sangue começar a ferver ao pensar em tolerar a presença deles por mais tempo."
 ep3_powerful_families.8060.t:0 "Uma Vila Vilanesca"
 ep3_powerful_families.8070.a.lose:0 "[child.GetFirstNameNoTooltip|U] é pego"
 ep3_powerful_families.8070.a.win:0 "[child.GetFirstNameNoTooltip|U] se torna seu informante"
 ep3_powerful_families.8070.a:0 "\"Continue indo lá e me conte tudo.\""
 ep3_powerful_families.8070.b.crit_win:0 "[child.GetFirstNameNoTooltip|U] acaba com a rivalidade"
 ep3_powerful_families.8070.b.lose:0 "[child.GetFirstNameNoTooltip|U] falha"
 ep3_powerful_families.8070.b.win:0 "[child.GetFirstNameNoTooltip|U] faz progressos"
 ep3_powerful_families.8070.b:0 "\"Tente acabar com essa rivalidade tola nossa.\""
 ep3_powerful_families.8070.c:0 "\"Saia da minha vista.\""
 ep3_powerful_families.8070.desc:0 "Meus guardas jogam um tremendo [child.GetName] aos meus pés. O rosto [child.GetHerHim] é uma imagem de vergonha, e não consigo imaginar o que [child.GetSheHe] fez.\n\n\"Encontramos ess[Select_CString( child.IsFemale, 'a', 'e' )] [child.Custom2('InsultNoun', ROOT.Char)] se familiarizando na propriedade da família [other_family.GetHouse.GetName]. Você não precisa se perguntar onde estão as verdadeiras lealdades [child.GetHerHim].\"\n\nA ideia de meu próprio parente fraternizando com meus inimigos é repulsiva, mas talvez a conexão [child.GetHerHim] possa ser aproveitada."
 ep3_powerful_families.8070.t:0 "Loucuras"
 ep3_powerful_families.8080.a:0 "Uma oportunidade perfeita para humilhar a casa [other_family.GetHouse.GetNameNoTooltip]!"
 ep3_powerful_families.8080.b:0 "Eu irei ajudar."
 ep3_powerful_families.8080.desc:0 "Um cálice tilintando chama toda a atenção para [other_family.GetName], que se levanta para fazer um discurso. [other_family.GetSheHe|U] começa bem, mas uma pequena hesitação logo se transforma em um longo e desconfortável silêncio.\n\n[other_family.GetSheHe|U] me olha com um olhar de medo e desespero no rosto, implorando silenciosamente para que eu venha em auxílio [other_family.GetHerHim]."
 ep3_powerful_families.8080.t:0 "Silêncio Tremulante"
 ep3_powerful_families.8090.a.lose:0 "[liege.GetFirstNameNoTooltip|U] está entediado"
 ep3_powerful_families.8090.a.win:0 "[liege.GetFirstNameNoTooltip|U] fica impressionado"
 ep3_powerful_families.8090.a:0 "\"E a casa [ROOT.Char.GetHouse.GetNameNoTooltip], meu liege?\""
 ep3_powerful_families.8090.b:0 "A noite acabará eventualmente."
 ep3_powerful_families.8090.desc:0 "Nesta noite, estou preso entre [liege.GetName] e [Select_CString( other_family.IsFemale, 'a', 'o' )] [other_family.Custom2('InsultAdjective', ROOT.Char)] d[Select_CString( other_family.IsFemale, 'a', 'o' )] [other_family.GetName]. Sou forçado a ouvir aquele bajulador tagarelar incessantemente sobre a lealdade e o talento professados da casa [other_family.GetHouse.GetName].\n\nA única coisa mais nauseante do que as palavras saindo da boca [other_family.GetHerHim] são os respingos de comida que as acompanham. Preciso encontrar uma maneira de silenciar ess[Select_CString( other_family.IsFemale, 'a', 'e' )] [other_family.Custom2('InsultNoun', ROOT.Char)], se apenas para aliviar minha dor de cabeça."
 ep3_powerful_families.8090.t:0 "Savageria Civil"
 ep3_powerful_families.8100.a.lose:0 "[cp_fam.GetFirstNameNoTooltip|U] é rejeitado"
 ep3_powerful_families.8100.a.win:0 "[cp_fam.GetFirstNameNoTooltip|U] é nomeado"
 ep3_powerful_families.8100.a:0 "\"[cp_fam.GetFirstNameNoTooltip|U] é um excelente poeta, meu senhor feudal!\""
 ep3_powerful_families.8100.b:0 "\"Fico feliz que você também aprecie as coisas mais finas.\""
 ep3_powerful_families.8100.desc:0 "Nesta noite, tenho a sorte de ficar preso em uma conversa com [liege.GetName]. [liege.GetSheHe|U] lamenta passar muitas noites sem ouvir poesia doce.\n\nLembro que [cp_fam.GetName|U] tem dedicado muitos de seus dias vagando pelos jardins praticando seu domínio da língua [cp_fam.GetCulture.GetLanguage.GetNameNoTooltip]. Esse hobby [cp_fam.GetHerHim] poderia ser aproveitado, espalhando nossa influência na corte [liege.GetPrimaryTitle.GetAdjective]..."
 ep3_powerful_families.8100.t:0 "Serviço Civil"
