 ep3_governor_yearly_8160_promoted_modifier:0 "Minoria Promovida"
 ep3_governor_yearly_8160_promoted_modifier_desc:0 "Membros desta comunidade foram concedidos acesso aos postos burocráticos da administração de seu governador."
 ep3_governor_yearly_8160_suppressed_modifier:0 "Minoria Suprimida"
 ep3_governor_yearly_8160_suppressed_modifier_desc:0 "Membros desta comunidade foram negados acesso aos postos burocráticos da administração de seu governador e reprimidos."
 ep3_governor_yearly_8170_failure_modifier:0 "Defesas Defeituosas"
 ep3_governor_yearly_8170_failure_modifier_desc:0 "As defesas desta comarca contra ataques foram fundamentalmente comprometidas por medidas inadequadas."
 ep3_governor_yearly_8170_success_modifier:0 "Medidas Defensivas"
 ep3_governor_yearly_8170_success_modifier_desc:0 "As defesas desta comarca contra ataques foram significativamente melhoradas por medidas astutas."
 ep3_governor_yearly_8170_warning_system_modifier:0 "Sistema de Aviso"
 ep3_governor_yearly_8170_warning_system_modifier_desc:0 "Esta comarca possui um sistema de aviso antecipado, proporcionando maior proteção contra ataques."
 ep3_grammar_school_county_modifier:0 "Escola para o Povo"
 ep3_grammar_school_county_modifier_desc:0 "O governante deste condado investiu em uma escola para os plebeus."
 ep3_grave_robber_modifier:0 "Ladrão de Túmulos"
 ep3_grave_robber_modifier_desc:0 "Este personagem adquiriu uma reputação negativa por pilhar os túmulos de seus predecessores imperiais para pagar suas dívidas."
 ep3_guides_and_guards_modifier:0 "Guias e Guardas Locais"
 ep3_guides_and_guards_modifier_desc:0 "Um benfeitor local ofereceu guardas e guias experientes para a peregrinação deste personagem."
 ep3_harried_modifier:0 "Apreensivo"
 ep3_harried_modifier_desc:0 "Esta posse sofreu sob o jugo normando, seus habitantes inquietos incorrendo em uma repressão implacável de seus governantes."
 ep3_healthy_orphanages_modifier:0 "Orfanatos Saudáveis"
 ep3_healthy_orphanages_modifier_desc:0 "Este condado possui orfanatos bem financiados, garantindo que aqueles deixados desamparados sejam bem cuidados."
 ep3_hereward_caution_modifier:0 "Organizador Cauteloso"
 ep3_hereward_caution_modifier_desc:0 "Este personagem leva seu tempo ao se preparar, sempre garantindo que tenha o melhor disponível antes de se comprometer."
 ep3_honourable_jailor_modifier:0 "Carcereiro Honorável"
 ep3_honourable_jailor_modifier_desc:0 "A abordagem deste personagem para manter prisioneiros é elogiada como correta e honrada."
 ep3_iconoclast_modifier:0 "Iconoclasta"
 ep3_iconoclast_modifier_desc:0 "Este imperador adotou a doutrina do iconoclasmo diante de grandes dificuldades."
 ep3_impassioned_populace_modifier:0 "População Apaixonada"
 ep3_impassioned_populace_modifier_desc:0 "O povo deste condado ouviu falar de resistência contra a ocupação estrangeira de além de suas fronteiras, e alguns estão inspirados a se juntar à causa."
 ep3_imperial_tombs_violated_province_modifier:0 "Túmulos Imperiais Violados"
 ep3_imperial_tombs_violated_province_modifier_desc:0 "Os gloriosos túmulos dos antigos imperadores foram saqueados por um sucessor ganancioso para pagar suas dívidas."
 ep3_inflexible_worshipper_modifier:0 "Venerador Inflexível"
 ep3_inflexible_worshipper_modifier_desc:0 "Este personagem é inflexível em suas crenças e não tolera hereges."
 ep3_innovative_farming_techniques:0 "Técnicas de Agricultura Inovadoras"
 ep3_innovative_farming_techniques_desc:0 "Este condado se beneficia de técnicas agrícolas impressionantemente avançadas, melhorando a eficiência da produção de alimentos."
 ep3_integration_promoter_modifier:0 "Promotor de Integração"
 ep3_integration_promoter_modifier_desc:0 "Este personagem é muito ativo na promoção da integração da área ao redor de sua propriedade.\nAumenta [candidate_score|E] para o [governorship|E] onde a [family_estate|E] está localizada."
 ep3_law_and_order_modifier:0 "Lei e Ordem"
 ep3_law_and_order_modifier_desc:0 "Este personagem reprimiu desordens locais em sua capital com sangue."
 ep3_lay_of_the_land_modifier:0 "Conhecimento do Terreno"
 ep3_lay_of_the_land_modifier_desc:0 "Este personagem viaja mais rápido após receber instruções claras de um local."
 ep3_leviathan_failure_character_modifier:0 "Derrotado pela Besta"
 ep3_leviathan_failure_character_modifier_desc:0 "A tentativa deste personagem de derrotar uma besta que devastava os estreitos do Bósforo deu terrivelmente errado."
 ep3_leviathan_loose_county_modifier:0 "Flagelo dos Estreitos"
 ep3_leviathan_loose_county_modifier_desc:0 "O comércio deste condado está paralisado pela besta que devastava os estreitos do Bósforo."
 ep3_leviathan_loose_province_modifier:0 "Flagelo dos Estreitos"
 ep3_leviathan_loose_province_modifier_desc:0 "Esta via aquática está se tornando perigosa devido à besta que devastava os estreitos do Bósforo."
 ep3_leviathan_mandate_county_modifier:0 "Fantasma dos Estreitos"
 ep3_leviathan_mandate_county_modifier_desc:0 "O comércio deste condado é um pouco prejudicado pela besta que devastava os estreitos do Bósforo."
 ep3_leviathan_mandate_province_modifier:0 "Fantasma dos Estreitos"
 ep3_leviathan_mandate_province_modifier_desc:0 "Esta via aquática está se tornando um pouco perigosa devido à besta que devastava os estreitos do Bósforo."
 ep3_leviathan_success_character_modifier:0 "Venceu a Besta"
 ep3_leviathan_success_character_modifier_desc:0 "Este personagem derrubou uma besta que estava devastando os estreitos do Bósforo."
 ep3_life_of_the_party:0 "A Alma da Festa"
 ep3_life_of_the_party_desc:0 "Este personagem é algo como um facilitador quando se trata de festas!"
 ep3_life_threatened_modifier:0 "Vida Ameaçada"
 ep3_life_threatened_modifier_desc:0 "Este personagem não pensa, eles #EMP sabem#! que há outros querendo pegá-los. Seus vassalos não se impressionam com tal preocupação.\n\n#weak Este [modifier|E] aumenta a probabilidade de vassalos se juntarem a [claimant_factions|E].\n#!"
 ep3_long_contested_province_county_modifier:0 "Província Longamente Contestada Restaurada"
 ep3_long_contested_province_county_modifier_desc:0 "Este condado, situado fora do alcance do Império por tempo demais, foi reconquistado."
 ep3_long_contested_province_modifier:0 "$ep3_long_contested_province_county_modifier$"
 ep3_long_contested_province_modifier_desc:0 "Este personagem solidificou as fronteiras do Império reconquistando uma área longamente contestada."
 ep3_long_lost_province_county_modifier:0 "Província Longamente Perdida Restaurada"
 ep3_long_lost_province_county_modifier_desc:0 "Esta área, há muito perdida para os Romanos, foi devolvida ao Império."
 ep3_long_lost_province_modifier:0 "$ep3_long_lost_province_county_modifier$"
 ep3_long_lost_province_modifier_desc:0 "Este personagem reconquistou uma Província Romana que havia estado longamente perdida para o Império."
 ep3_lust_for_land_modifier:0 "Desejo por Terras"
 ep3_lust_for_land_modifier_desc:0 "Este personagem está disposto a parar em nada para se tornar proprietário de terras.\n\n#weak Este [modifier|E] reduz pela metade o custo do [casus_belli|E] $EP3_LAAMP_INVASION_CB_NAME$.\n#!"
 ep3_man_of_god:0 "Homem de Deus"
 ep3_man_of_god_desc:0 "Este personagem é amigo dos sacerdotes, e sua santidade foi exaltada por toda a terra."
 ep3_master_of_ceremonies:0 "Mestre de Cerimônias"
 ep3_master_of_ceremonies_desc:0 "Este personagem provou ser um grande festeiro em um Camp Revelry!"
 ep3_maximum_border_county_modifier:0 "Fronteira Final Restaurada"
 ep3_maximum_border_county_modifier_desc:0 "A mais distante fronteira do Império dos Romanos foi restabelecida."
 ep3_maximum_border_modifier:0 "$ep3_maximum_border_county_modifier$"
 ep3_maximum_border_modifier_desc:0 "Este personagem restaurou a mais distante fronteira do Império dos Romanos."
 ep3_medi_gem_county_modifier:0 "Joia Mediterrânea Restaurada"
 ep3_medi_gem_county_modifier_desc:0 "Este precioso enclave no Mediterrâneo é novamente parte do Império."
 ep3_medi_gem_modifier:0 "$ep3_medi_gem_county_modifier$"
 ep3_medi_gem_modifier_desc:0 "Este personagem assegurou um antigo enclave Romano no Mediterrâneo."
 ep3_mercenaries_abroad_modifier:0 "Tropas Prometidas no Exterior"
 ep3_mercenaries_abroad_modifier_desc:0 "Este personagem prometeu suas tropas a outro governante em troca de sua liberdade."
 ep3_mercenaries_from_abroad_modifier:0 "Tropas do Exterior"
 ep3_mercenaries_from_abroad_modifier_desc:0 "Este personagem está recebendo tropas de outro governante que libertou da prisão."
 ep3_missing_supplies:0 "Suprimentos Faltando"
 ep3_missing_supplies_desc:0 "Este condado está sem um grande envio de armas e armaduras, e a qualidade de suas tropas sofre como resultado."
 ep3_monastic_quiet_county_modifier:0 "Silêncio Monástico"
 ep3_monastic_quiet_county_modifier_desc:0 "O silêncio e a santidade dos mosteiros locais têm prioridade sobre as atividades produtivas externas."
 ep3_murderers_loose:0 "Assassinos Soltos"
 ep3_murderers_loose_desc:0 "Este condado foi alvo de uma onda de assassinatos. Curiosamente, todas as vítimas eram normandas..."
 ep3_new_justinian_county_modifier:0 "Província de Justiniano Restaurada"
 ep3_new_justinian_county_modifier_desc:0 "Este condado, uma vez conquistado pelos exércitos de Justiniano, foi devolvido ao Império dos Romanos novamente."
 ep3_new_justinian_modifier:0 "$ep3_new_justinian_county_modifier$"
 ep3_new_justinian_modifier_desc:0 "Este personagem é um Novo Justiniano reconquistando as Províncias Ocidentais."
 ep3_new_tastes_cannibal_modifier:0 "Novos 'Sabores'"
 ep3_new_tastes_cannibal_modifier_desc:0 "Este personagem insiste em servir pratos suspeitos em suas mesas. O que #EMP é#! essa carne...?"
 ep3_new_tastes_modifier:0 "Novos Sabores"
 ep3_new_tastes_modifier_desc:0 "Este personagem se beneficiou de uma dieta mais variada recentemente, aliviando tanto a mente quanto o corpo."
 ep3_non_blessed_union_modifier:0 "União Ilegal"
 ep3_non_blessed_union_modifier_desc:0 "O Chefe de Fé deste personagem se recusou a legitimar o mais recente casamento deste personagem."
 ep3_open_granary_county_modifier:0 "Celeiros do Proprietário Abertos"
 ep3_open_granary_county_modifier_desc:0 "Um proprietário local foi forçado a abrir seus celeiros e redistribuir o grão que estava acumulando."
 ep3_paid_grains:0 "Importações de Grãos"
 ep3_paid_grains_desc:0 "Este condado se beneficiou de grãos importados, aliviando uma fome crescente."
 ep3_persecuting_saints_county_modifier:0 "Santo Não Reconhecido"
 ep3_persecuting_saints_county_modifier_desc:0 "O Governador local falhou em reconhecer os sinais de um verdadeiro homem santo."
 ep3_pilgrim_protector_other_modifier:0 "$ep3_pilgrim_protector_same_modifier$"
 ep3_pilgrim_protector_other_modifier_desc:0 "Este personagem demonstrou sua caridade ao hospedar e proteger peregrinos de outra fé."
 ep3_pilgrim_protector_same_modifier:0 "Protetor de Peregrinos"
 ep3_pilgrim_protector_same_modifier_desc:0 "Este personagem demonstrou seu zelo ao hospedar e proteger peregrinos que passam por suas terras."
 ep3_plundered_modifier:0 "Saqueado"
 ep3_plundered_modifier_desc:0 "Esta província viu uma onda de roubos violentos, com a riqueza sendo lentamente drenada como resultado."
 ep3_poets_salon_modifier:0 "Salão de Poesia"
 ep3_poets_salon_modifier_desc:0 "Esta província abriga um salão de poesia, um centro amplamente conhecido para as artes."
 ep3_politics_before_all_modifier:0 "Política Antes de Tudo"
 ep3_politics_before_all_modifier_desc:0 "Este personagem tem uma abordagem pragmática para a política que ignora sentimentos e preconceitos culturais."
 ep3_population_boost:0 "Aumento Populacional"
 ep3_population_boost_desc:0 "Esta posse teve um influxo de pessoas forçosamente movidas de uma vizinha, embora seu ânimo não seja dos mais otimistas como resultado."
 ep3_population_control_county_modifier:0 "Tudo à Vista"
 ep3_population_control_county_modifier_desc:0 "O Governador está ativamente perseguindo e desmantelando a rede local de túneis e esconderijos."
 ep3_power_couple_modifier:0 "Relação Simbiótica"
 ep3_power_couple_modifier_desc:0 "Este personagem tem um relacionamento próximo com outro, auxiliando seu trabalho e aumentando sua fama.\n\n#weak Este [modifier|E] aumenta as chances de poetas de nível superior chegarem da [decision|E] [GetDecisionWithKey('invite_poets_decision').GetName] e diminui o custo da [decision|E] [GetDecisionWithKey('found_salon_decision').GetName].#!\n\n"
 ep3_priest_friend_different_modifier:0 "Amigo de Todos os Santos"
 ep3_priest_friend_different_modifier_desc:0 "Este personagem é bem conhecido como amigo dos devotos, embora nem sempre da mesma fé..."
 ep3_priest_friend_same_modifier:0 "Amigo dos Santos"
 ep3_priest_friend_same_modifier_desc:0 "Este personagem é bem conhecido como amigo dos devotos."
 ep3_publicly_recognized_modifier:0 "Reconhecido Publicamente"
 ep3_publicly_recognized_modifier_desc:0 "Este personagem foi reconhecido publicamente como um membro valioso da administração."
 ep3_pushed_too_hard:0 "Se Esforçou Demais"
 ep3_pushed_too_hard_desc:0 "Este personagem se esforçou demais para alcançar seus objetivos e está em um estado mais frágil como resultado."
 ep3_quality_control_modifier:0 "Controle de Qualidade"
 ep3_quality_control_modifier_desc:0 "Este personagem mantém um controle rigoroso sobre suas obras.\n\n#weak Este [modifier|E] aumenta o menor potencial [gold_i][gold|E] recebido da [decision|E] [GetDecisionWithKey('write_muwashshah_poem_decision').GetName].#!\n\n"
 ep3_raider_unchecked_modifier:0 "Piratas Descontrolados"
 ep3_raider_unchecked_modifier_desc:0 "Este condado tem sido atacado por saqueadores do norte, devastando o comércio e saqueando as costas."
 ep3_rampaging_disorders_county_modifier:0 "Desordens Descontroladas"
 ep3_rampaging_disorders_county_modifier_desc:0 "Os distúrbios locais contra comerciantes estrangeiros foram deixados para se desenvolver nesta comarca."
 ep3_redistributed_equipment:0 "Equipamento Redistribuído"
 ep3_redistributed_equipment_desc:0 "Este personagem se beneficia de um influxo de armas e armaduras de alta qualidade, mas mal adquiridas."
 ep3_refreshed_and_relaxed:0 "Refrescado e Relaxado"
 ep3_refreshed_and_relaxed_desc:0 "Este personagem entende o valor de limpar a mente e se refrescar mentalmente, de vez em quando.\n\n#weak Este [modifier|E] habilita a [decision|E] [GetDecisionWithKey('meditate_in_seclusion_decision').GetName].#!"
 ep3_resettled_village:0 "Habitações Reassentadas"
 ep3_resettled_village_desc:0 "Muitos dos residentes desta posse foram forçosamente reassentados em outro lugar, deixando-a desprovida."
 ep3_responsible_with_money:0 "Responsável com Dinheiro"
 ep3_responsible_with_money_desc:0 "Mesmo quando um pouco mentalmente comprometido, este personagem mantém um controle firme sobre as finanças."
 ep3_rested_and_refreshed_modifier:0 "Descansado e Refrescado"
 ep3_rested_and_refreshed_modifier_desc:0 "Este personagem se beneficiou de algumas noites em ambientes mais luxuosos do que está acostumado."
 ep3_restored_pentarchy_seat_county_modifier:0 "Cátedra do Pentárquico Restaurada"
 ep3_restored_pentarchy_seat_county_modifier_desc:0 "Este condado é novamente uma Cátedra do Pentárquico."
 ep3_restored_pentarchy_seat_modifier:0 "$ep3_restored_pentarchy_seat_county_modifier$"
 ep3_restored_pentarchy_seat_modifier_desc:0 "Este personagem reconquistou uma Cátedra do Pentárquico para o Império."
 ep3_reunited_modifier:0 "Reunido"
 ep3_reunited_modifier_desc:0 "Este personagem foi reunido com uma antiga paixão, para sua alegria."
 ep3_roaming_shepherds_county_modifier:0 "Pastores Errantes"
 ep3_roaming_shepherds_county_modifier_desc:0 "Os pastores são autorizados a vagar com seus rebanhos onde quiserem."
 ep3_sabotaged_roads:0 "Estradas Sabotadas"
 ep3_sabotaged_roads_desc:0 "As estradas nesta posse sofreram sabotagens, tornando-as mais perigosas para viajar."
 ep3_school_building_county_modifier:0 "Construindo uma Escola"
 ep3_school_building_county_modifier_desc:0 "O governante deste condado desviou parte da produção para uma escola para os plebeus."
 ep3_sensible_provisions:0 "Senso com Provisões"
 ep3_sensible_provisions_desc:0 "Este personagem não se permite ser levado a desperdiçar provisões desnecessariamente."
 ep3_sent_help_to_east_modifier:0 "Enviou Exército para Ajudar"
 ep3_sent_help_to_east_modifier_desc:0 "Este personagem enviou um corpo de voluntários para ajudar alguns irmãos cristãos em sua guerra."
 ep3_settling_nomads_county_modifier:0 "Assentando Nômades"
 ep3_settling_nomads_county_modifier_desc:0 "Este condado está recebendo um fluxo lento de pessoas nômades da fronteira."
 ep3_sketchy_guides_modifier:0 "Guias Vagos"
 ep3_sketchy_guides_modifier_desc:0 "Este personagem aparentemente continua escolhendo guias que fornecem informações incorretas, seja por acidente ou pura má sorte."
 ep3_smouldering_village:0 "Edifícios em Brasa"
 ep3_smouldering_village_desc:0 "Os edifícios nesta posse sofreram um incêndio que devastou a área, causando danos tanto à infraestrutura quanto à psique dos habitantes."
 ep3_standing_alone_modifier:0 "Firme e Sozinho"
 ep3_standing_alone_modifier_desc:0 "Este personagem está comprometido em defender suas crenças, mesmo que ninguém esteja ao seu lado."
 ep3_star_crossed_modifier:0 "Estrela Cruzada"
 ep3_star_crossed_modifier_desc:0 "Este personagem anseia por um amor perdido, que nunca será recuperado."
 ep3_stolen_equipment:0 "Equipamento Roubado"
 ep3_stolen_equipment_desc:0 "Este personagem reapropriou armas e armaduras roubadas, e as está utilizando de forma eficaz."
 ep3_supply_issues_modifier:0 "Problemas de Suprimento"
 ep3_supply_issues_modifier_desc:0 "O acampamento deste personagem está sofrendo de problemas para encontrar comida, levando a estômagos roncando e seguidores insatisfeitos."
 ep3_surplus_manpower:0 "Excedente de Mão de Obra"
 ep3_surplus_manpower_desc:0 "Este condado tem um excedente de camponeses aptos em idade de lutar."
 ep3_the_conqueror_modifier:0 "Conquistador Implacável"
 ep3_the_conqueror_modifier_desc:0 "A resposta brutal deste personagem às revoltas em seu reino causou respeito, medo e aversão em igual medida."
 ep3_the_restful_modifier:0 "Tranquilo"
 ep3_the_restful_modifier_desc:0 "Este personagem se afastou de seu destino, levando a uma vida pacífica, mas não realizada."
 ep3_triumph_of_god_modifier:0 "Triunfo Compartilhado com o Divino"
 ep3_triumph_of_god_modifier_desc:0 "Este personagem dedicou seu triunfo ao Divino, participando de sua glória em pé de igualdade."
 ep3_triumph_promised_prosperity_modifier:0 "Prosperidade Prometida"
 ep3_triumph_promised_prosperity_modifier_desc:0 "Este personagem excitou a imaginação de seus súditos com promessas de prosperidade do império."
 ep3_triumph_promised_stability_modifier:0 "Estabilidade Prometida"
 ep3_triumph_promised_stability_modifier_desc:0 "Este personagem excitou a imaginação de seus súditos com promessas de estabilidade do império."
 ep3_triumph_promised_victories_modifier:0 "Vitória Prometida"
 ep3_triumph_promised_victories_modifier_desc:0 "Este personagem excitou a imaginação de seus súditos com promessas de vitórias militares."
 ep3_triumph_public_executioner_modifier:0 "Realizou Execuções Públicas"
 ep3_triumph_public_executioner_modifier_desc:0 "Este personagem sabe como manter a ordem pública: fazendo um espetáculo de execuções em massa."
 ep3_triumph_traditional_punishments_modifier:0 "Manter Punições Tradicionais"
 ep3_triumph_traditional_punishments_modifier_desc:0 "Cegar inimigos capturados, rebeldes e rivais ao trono é uma prática bizantina antiga, como este personagem bem sabe."
 ep3_tuition_paid:0 "Mensalidade Paga"
 ep3_tuition_paid_desc:0 "Este personagem é bem conhecido por sua caridade em nutrir os talentos de jovens poetas."
 ep3_tunnels_encouraged_county_modifier:0 "Túneis Defensivos"
 ep3_tunnels_encouraged_county_modifier_desc:0 "O Governador incentivou a expansão de uma rede local de túneis e esconderijos para proteger a população."
 ep3_tutoring_noblewoman_modifier:0 "Tutoria de Nobreza"
 ep3_tutoring_noblewoman_modifier_desc:0 "Este personagem está recebendo dinheiro em troca de tutoria a uma nobre local, embora isso tenha, compreensivelmente, erodido seu tempo para outras atividades."
 ep3_unbeliever_in_signs_modifier:0 "Não Acredita nos Sinais"
 ep3_unbeliever_in_signs_modifier_desc:0 "Este personagem não acredita em profecias ou sinais do além."
 ep3_under_suspicion_modifier:0 "Sob Suspeita"
 ep3_under_suspicion_modifier_desc:0 "Este personagem é visto com suspeita devido a estranhas ocorrências com aqueles a quem se opõem."
 ep3_uneasy_modifier:0 "Inquieto"
 ep3_uneasy_modifier_desc:0 "Este personagem sente uma leve sensação de pressentimento e desconforto geral."
 ep3_ungodly_hospitality_modifier:0 "Hospitalidade Ímpia"
 ep3_ungodly_hospitality_modifier_desc:0 "Este personagem afastou os devotos, negando-lhes hospitalidade em seu momento de necessidade."
 ep3_unlocked_silk:0 "Direitos de Produção de Seda"
 ep3_unlocked_silk_desc:0 "Esta casa obteve uma dispensa imperial para produzir sua própria seda."
 ep3_voluntary_laamp_character_modifier:0 "Aventureiro Voluntário"
 ep3_voluntary_laamp_character_modifier_desc:0 "Este personagem deixou para trás seu antigo reino para abrir um novo caminho no mundo."
 ep3_warm_and_content:0 "Aconchegado e Contente"
