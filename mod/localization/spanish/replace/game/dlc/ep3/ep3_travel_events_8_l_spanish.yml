l_spanish:
 ep3_travel_events.8000.a:0 "\"Seu lugar é com [prospective_prince.GetFirstNameNoTooltip], não com [Select_CString( ROOT.Char.IsFemale, 'uma velha', 'um velho' )] [ROOT.Char.Custom2('InsultNoun', ROOT.Char)] como eu.\""
 ep3_travel_events.8000.b:0 "\"[prospective_prince.GetFirstNameNoTooltip|U] pode simplesmente vir conosco!\""
 ep3_travel_events.8000.c:0 "\"Vamos, [romantic_child.GetFirstNameNoTooltip].\""
 ep3_travel_events.8000.desc.intro:0 "Desde seu encontro fortuito em [location.GetName], [Select_CString( romantic_child.IsFemale, 'minha querida', 'meu querido' )] [ROOT.Char.Custom2('RelationToMeShort', romantic_child)] [romantic_child.GetName] e [prospective_prince.GetName] tornaram-se absolutamente inseparáveis. [Select_CString( prospective_prince.IsFemale, 'A', 'O' )] [prospective_prince.Custom('GetDaughterSon')] de [prince_parent.GetTitleAsNameNoTooltip|U] está completamente embriagado de infatuation. Um encantador cortejo a se contemplar, mas devemos avançar, e eles em breve serão separados.\n\n\"Oh, [ROOT.Char.GetMotherFather],"
 ep3_travel_events.8000.desc.mid2.bold_child:0 "Estou tão cansado de viajar. Desejo permanecer aqui com [prospective_prince.GetNameNoTooltip]!\""
 ep3_travel_events.8000.desc.mid2.timid_child:0 "Sinto que talvez nunca mais encontre outr[Select_CString( prospective_prince.IsFemale, 'a', 'o' )] [prospective_prince.GetWomanMan] como [prospective_prince.GetSheHe] novamente. Você acha que um dia poderemos nos estabelecer e criar raízes próprias?\""
 ep3_travel_events.8000.outro.dislikes_child:0 "\n\nEsta pode ser minha única oportunidade de me livrar deste parasita para sempre."
 ep3_travel_events.8000.outro:0 "\n\nVejo a angústia pintada no rosto [romantic_child.GetHerHim] e não posso deixar de me perguntar se o lugar [romantic_child.GetHerHim] realmente é comigo qualquer mais."
 ep3_travel_events.8000.t:0 "Pertencer a Algum Lugar"
 ep3_travel_events.8001.a:0 "\"Você tem minha bênção.\""
 ep3_travel_events.8001.b:0 "\"De jeito nenhum!\""
 ep3_travel_events.8001.desc:0 "[prospective_prince.Custom2('MyCharacterIntroduction', ROOT.Char )|U] retorna para casa de seu passeio com [Select_CString( romantic_child.IsFemale, 'uma estranha', 'um estranho' )] [romantic_child.GetWomanMan] jovem de braços dados com [prospective_prince.GetSheHe]. Esta criatura está claramente descuidada e cansada da estrada, com sujeira salpicando a roupa modesta [romantic_child.GetHerHim].\n\n\"[ROOT.Char.GetMotherFather|U]! Este é [romantic_child.GetFirstName], [romantic_child.Custom('GetDaughterSon')] de [laamp.GetName], o famoso aventureiro. [romantic_child.GetSheHe|U] também é [Select_CString( romantic_child.IsFemale, 'a', 'o' )] [romantic_child.GetWomanMan] de quem me apaixonei, e se você der sua bênção, nos casaremos!\""
 ep3_travel_events.8001.t:0 "Raízes Próprias"
 ep3_travel_events.8002.a:0 "\"Calma.\""
 ep3_travel_events.8002.desc:0 "Assim que o último de nossos suprimentos é embalado e nos preparamos para nos aventurar novamente pela estrada sem fim, sou interrompido pelos gritos desesperados [Select_CString( romantic_child.IsFemale, 'da minha', 'do meu' )] [romantic_child.Custom('GetDaughterSon')]. Quando [romantic_child.GetSheHe] finalmente chega até mim, sou abraçado em um abraço apertado. Parece que [prince_parent.GetName] não abençoou esta união, e [romantic_child.GetName] volta para se juntar a mim em minhas viagens."
 ep3_travel_events.8002.t:0 "Em Outro Tempo"
 ep3_travel_events.8010.a.lose:0 "Seu grupo é pego"
 ep3_travel_events.8010.a.win:0 "Você pilha alguns bens do túmulo sem interrupção"
 ep3_travel_events.8010.a:0 "Estou certo de que ninguém notaria."
 ep3_travel_events.8010.b:0 "Não vou profanar os mortos!"
 ep3_travel_events.8010.desc:0 "Enquanto continuamos por [location.GetName], meu olhar é atraído por um túmulo elaboradamente decorado em meio a uma rede de sepulturas comuns. O túmulo parece estar crackeado, e só dentro de sua boca vejo o brilho de algum tesouro desconhecido.\n\nApenas meu grupo parece estar por perto, e certamente quem quer que tenha possuído o conteúdo deste túmulo não me julgaria por levar o que de outra forma ficaria sem uso?"
 ep3_travel_events.8010.t:0 "Não Serei Sentido"
