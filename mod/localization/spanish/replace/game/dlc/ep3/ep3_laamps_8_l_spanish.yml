 laamp_familiar_lands:0 "Terras Familiares"
 laamp_familiar_lands_desc:0 "Este personagem está desfrutando do apoio popular dos camponeses nas terras que viaja."
 laamp_legitimist_support_contract:0 "Apoio Legitimista"
 laamp_legitimist_support_contract_contract:0 "$laamp_legitimist_support_contract$"
 laamp_legitimist_support_contract_desc:0 "A notícia sobre sua reivindicação legítima se espalhou amplamente e criou uma oportunidade para discutirmos nosso apoio."
 laamp_legitimist_support_contract_desc_title:0 "Para o herdeiro legítimo,"
 laamp_legitimist_support_contract_failure:0 "As negociações falharam. Você precisará buscar ajuda em outro lugar."
 laamp_legitimist_support_contract_request:0 "Você está convidado a comparecer diante de nós. Vamos conversar sobre como podemos ajudá-lo em sua justa busca. Temos certeza de que chegaremos a um entendimento sobre o apoio extraordinário que podemos fornecer. E um pequeno pagamento que coletaremos no futuro."
 laamp_legitimist_support_contract_success:0 "Após aceitar esta [task_contract|E] e viajar para [recipient.GetCurrentLocation.GetName], você poderá negociar até #color_yellow 1800 ouro#! e #color_yellow 3000 tropas de elite#!, em troca de pagamentos consideráveis posteriormente."
 laamp_prepping_for_invasion:0 "Herói do Povo"
 laamp_prepping_for_invasion_desc:0 "Os camponeses passaram a considerar este personagem como um herói do povo que os salvará dos altos impostos e da tirania."
 laamps_8090_preparing_invasion:0 "Preparando Invasão"
 laamps_8090_preparing_invasion_desc:0 "Este personagem está se preparando para invadir terras estrangeiras e fazer um novo lar para seu povo lá."
 request_laamp_legitimist_have_claim_on_target:0 "Você tem uma [claim|E] sobre este [realm|E] personagem"
 request_laamp_legitimist_support:0 "Solicitar Apoio Legitimista"
 request_laamp_legitimist_support_already_supporting:0 "Este personagem já está apoiando um Legitimista"
 request_laamp_legitimist_support_interaction_desc:0 "Solicite um convite para discutir o nível e as condições de apoio à sua reivindicação Legitimista"
