l_spanish:
 PACTA_SUNT_SERVANTA_GLOSS:0 "Latim para 'Os acordos devem ser cumpridos'"
 YOU_HAVE_HOOK_REASON:0 "Você tem uma vantagem sobre [recipient.GetShortUIName|U]: $VALUE|=+0$"
 artifact_durable_materials_02:0 "Materiais Duráveis"
 cultural_acceptance_distant_hero:0 "Abraçado por um grande herói"
 cultural_acceptance_fled_persecution:0 "Um aventureiro ajudou algumas minorias a escaparem da perseguição."
 ep3_laamp.8103.turns_left:0 "\n\n#italic Você tem #color_yellow [ROOT.Var('legitimist_turns').GetValue] #!turnos de negociações restantes"
 ep3_laamps.8000.a:0 "Estou aqui para retomar o que é meu!"
 ep3_laamps.8000.b:0 "O apoio deles ajudará minhas viagens."
 ep3_laamps.8000.desc.outro.sinner:0 "Eu me pergunto se eles realmente se lembram de como eu era..."
 ep3_laamps.8000.desc.outro:0 "É claro que eles apenas validam a correção da minha reivindicação, mas encorajá-los pode fazer com que [claim_holder.GetNameNoTooltip] me veja como uma ameaça."
 ep3_laamps.8000.desc:0 "Desde que dei meu primeiro passo triunfante de volta em [claimed_land.GetName], a notícia da minha chegada se espalhou rapidamente entre os camponeses. Cada cidade pela qual passo me trata como se eu ainda fosse o governante dessas terras, me presenteando com dons e louvores.\n\nAs pessoas condenam os males de [claim_holder.GetName] e cantam músicas sobre o dia em que eu derrubarei [claim_holder.GetSheHe] e restaurarei a justiça e a decência às terras.\n\n"
 ep3_laamps.8000.t:0 "A Verdade"
 ep3_laamps.8010.a:0 "Venha comigo."
 ep3_laamps.8010.desc:0 "A mais recente ninhada dos canis é apresentada diante de mim. Recém-desmamados de sua mãe, eles rastejam ao redor latindo para o mundo, tão fresco e novo diante deles. Um filhote robusto e forte ignora tudo e rasteja direto para mim, seus olhos bem abertos e sua cauda chicoteando descuidadamente seus irmãos enquanto me olha com admiração e adoração."
 ep3_laamps.8010.t:0 "O Companheiro Leal"
 ep3_laamps.8020.a.2:0 "'Eu o aceito, mas você terá que trabalhar para me impressionar.'"
 ep3_laamps.8020.a:0 "'Venha comigo.'"
 ep3_laamps.8020.b:0 "'Corra de volta para o seu mestre.'"
 ep3_laamps.8020.desc:0 "Quando vou me deitar à noite, ouço uma comoção vinda de meus guardas. Mal posso acreditar em meus olhos ao ver que [wouldbe_companion.GetName], um membro da própria corte de [holder.GetFirstName], é a fonte dessa perturbação, enquanto [wouldbe_companion.GetSheHe] discute com meus guarda-costas.\n\n[wouldbe_companion.GetSheHe|U] grita para mim do outro lado do acampamento.\n\n'Por favor, ouça-me, [ROOT.Char.GetLadyLord]! A vida na corte é um tédio insuportável, não suporto mais um dia! Desejo acompanhá-lo na interminável estrada à frente, se você me aceitar.'"
 ep3_laamps.8020.t:0 "A Jornada de uma Vida"
 ep3_laamps.8030.a.lose:0 "[armorer.GetFirstNameNoTooltip] comete um erro"
 ep3_laamps.8030.a.win:0 "Seu artefato foi melhorado"
 ep3_laamps.8030.a:0 "'Ótima ideia!'"
 ep3_laamps.8030.b:0 "'Apenas repare meu equipamento.'"
 ep3_laamps.8030.c:0 "'Esses minerais devem ser vendidos!'"
 ep3_laamps.8030.desc:0 "[armorer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim no acampamento, polindo minha [artifact.GetName].\n\n'[ROOT.Char.GetLadyLord|U], [location.GetName] é rica em depósitos de metais de alta qualidade, melhores do que qualquer um que já vi antes. Com sua permissão, eu ficaria encantado em melhorar sua [artifact.GetNameNoTooltip] com esses materiais lucrativos.'"
 ep3_laamps.8030.t:0 "Uma Oportunidade Rara"
 ep3_laamps.8040.a.lose:0 "Você é atacado"
 ep3_laamps.8040.a.win:0 "Você mata o lobo"
 ep3_laamps.8040.a:0 "Eu vou matar a fera."
 ep3_laamps.8040.b:0 "Os filhotes seriam ótimos animais de estimação."
 ep3_laamps.8040.c:0 "Parece o início de nosso novo canil!"
 ep3_laamps.8040.d:0 "Precisamos de uma nova tenda."
 ep3_laamps.8040.desc:0 "Um grito agudo me arranca do sono de volta à escuridão da noite. Sigo até a fonte do som e encontro [frightened_courtier.Custom2('MyCharacterIntroduction', ROOT.Char)] encolhido em frente à sua tenda.\n\n'[ROOT.Char.GetFirstName|U]! Não entre, há um lobo na minha cama!'\n\nAbro a tenda e encontro um lobo, sua barriga cheia com filhotes. Ele rosna e me encara, sem dúvida com medo do que posso fazer a seus bebês que estão para nascer."
 ep3_laamps.8040.t:0 "Deixe os Cães Dormirem"
 ep3_laamps.8050.a:0 "Claro!"
 ep3_laamps.8050.b:0 "Ajude [minority.GetSheHe] a encontrar um lar em outro lugar."
 ep3_laamps.8050.c:0 "Vá embora, vagabundo."
 ep3_laamps.8050.desc.intro:0 "Sou interrompido em meu passeio próximo de [ROOT.Char.Custom('GetRandomCampBuilding')] pela aproximação de um estranho nervoso — um[Select_CString( minority.IsFemale, 'a', '' )] [minority.GetWomanMan] que se apresenta como [minority.GetName], claramente tão estrangeiro em [ROOT.Char.GetCurrentLocation.GetName] quanto eu.\n\n\"[ROOT.Char.GetLadyLord|U],"
 ep3_laamps.8050.desc.mid.alsohated:0 "você e eu sabemos que estas terras não aceitam aqueles que adoram de forma diferente dos lordes e damas."
 ep3_laamps.8050.desc.mid.fallback:0 "Sinto-me desconfortável nestas terras e eu... eu esperava que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] tão experiente quanto você pudesse estar disposto a acolher um [minority.GetFaith.GetAdherentName] sem lar?\""
 ep3_laamps.8050.desc.mid.samefaith:0 "você e eu sabemos que os [minority.GetFaith.GetAdherentNamePlural] não são bem-vindos por aqui. Sem dúvida, você também já encontrou o preconceito que os fiéis de [minority.GetFaith.HighGodName|U] enfrentam nestas terras."
 ep3_laamps.8050.desc.outro:0 "\n\nMomentaneamente, [minority.GetSheHe] pausa, fortalecendo [minority.GetHerselfHimself] para uma rejeição claramente esperada.\n\n'Eu entendo se você já tiver muitas pessoas para cuidar, mas se me aceitar, servirei fielmente todos os seus dias.'"
 ep3_laamps.8050.t:0 "Sem Amigos ou Proteção"
 ep3_laamps.8060.a.lose:0 "Você não encontra nada"
 ep3_laamps.8060.a.win:0 "Você encontra uma fonte"
 ep3_laamps.8060.a:0 "Precisamos encontrar mais imediatamente!"
 ep3_laamps.8060.b:0 "Bem, é hora de começarmos a reciclar..."
 ep3_laamps.8060.c.lose:0 "[idiot.GetFirstNameNoTooltip|U] falha"
 ep3_laamps.8060.c.win:0 "[idiot.GetFirstNameNoTooltip|U] encontra um pouco de água"
 ep3_laamps.8060.c:0 "'[idiot.GetFirstNameNoTooltip|U]! Resolva isso!'"
 ep3_laamps.8060.d.lose:0 "Você é pego!"
 ep3_laamps.8060.d:0 "É hora de saquear algumas caravanas locais."
 ep3_laamps.8060.desc:0 "Eu aproveito o sol do deserto, desfrutando de um momento de paz nessa vida agitada que escolhi para mim. Mas então, o som de madeira se partindo, um grito e o som de água caindo fazem meu coração afundar.\n\nVejo [idiot.Custom2('MyCharacterIntroduction', ROOT.Char)] parado ao lado dos restos encharcados e quebrados de nosso barril de água. Aparentemente, [idiot.GetSheHe] o deixou cair em algumas pedras afiadas enquanto descarregava, e agora o último de nossos suprimentos de água está se infiltrando profundamente na areia."
 ep3_laamps.8060.e:0 "Teremos que sobreviver sem."
 ep3_laamps.8060.t:0 "Nem Uma Gota"
 ep3_laamps.8070.a:0 "Me pergunto o que [forager.GetFirstNameNoTooltip] faria com isso."
 ep3_laamps.8070.b:0 "Ah! Eu reconheço esses frutos!"
 ep3_laamps.8070.c.lose:0 "Você comeu veneno"
 ep3_laamps.8070.c.win:0 "Os frutos estavam deliciosos"
 ep3_laamps.8070.c:0 "A vida é uma aventura, até mesmo para o estômago."
 ep3_laamps.8070.d:0 "Devemos sobreviver sem eles."
 ep3_laamps.8070.desc:0 "Em minhas andanças fora do acampamento, encontro uma clareira na floresta rica com todo tipo de bagas coloridas adornando os arbustos. Elas são diferentes de qualquer outra que eu tenha visto antes, e parecem tão deliciosamente tentadoras, que meus seguidores levariam menos de uma hora para colhê-las todas.\n\nSerá que isso é um presente muito necessário de [ROOT.Char.GetFaith.CreatorName|U], ou um truque de [ROOT.Char.GetFaith.TricksterGodName|U] para nos testar?"
 ep3_laamps.8070.t:0 "Frutos Estrangeiros"
 ep3_laamps.8080.a:0 "\"Ahhha! Você é um gênio!\""
 ep3_laamps.8080.b:0 "\"Precisamos de um velho marinheiro no acampamento.\""
 ep3_laamps.8080.c.lose:0 "Suas histórias não impressionam"
 ep3_laamps.8080.c.win:0 "Suas histórias impressionam"
 ep3_laamps.8080.c:0 "\"Você acha que #EMP isso#! foi uma boa história?\""
 ep3_laamps.8080.d:0 "\"Saia de perto de mim.\""
 ep3_laamps.8080.desc.intro:0 "Me vi passando a noite em uma taverna local, trocando histórias com um falador velho marinheiro, [sailor.GetFirstNameNicknamed].\n\n"
 ep3_laamps.8080.desc.intro_sea:0 "Ancorado para a noite, fui até uma taverna local, onde logo me vi trocando histórias com um velho marinheiro bem peculiar chamado [sailor.GetFirstNameNicknamed].\n\n"
 ep3_laamps.8080.desc.outro:0 "\"Você conta uma história de uma [ROOT.Char.Custom('WomanManOpposite')], [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [sailor.GetSheHe] ri, interrompendo outra de minhas histórias. \"Olhe para o meu velho [sailor.Custom('GetInjuredBodyPart')]! Pois é, uma vez meu navio tinha um vazamento para tapar, e não tinha nada além disso para resolver!\"\n\n\"Esses eram os dias de glória, [ROOT.Char.Custom('FormOfAddressForLiege')], ah sim...\" [sailor.GetSheHe] suspira. \"E eu anseio por revivê-los novamente...\""
 ep3_laamps.8080.t:0 "Um Marinheiro Estranho"
 ep3_laamps.8090.a:0 "Pode um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] não ser ambos [ROOT.Char.GetCulture.GetNameNoTooltip] #EMP e#! [county.GetCountyData.GetCulture.GetNameNoTooltip]?"
 ep3_laamps.8090.b:0 "Quem quer que eu esteja prestes a ser, [ROOT.Char.GetSheHe] será maravilhoso!"
 ep3_laamps.8090.c:0 "Talvez todos os [ROOT.Char.GetCulture.GetNameNoTooltip] devessem encontrar um lar aqui."
 ep3_laamps.8090.desc.intro:0 "Eu passeio pelo mercado desta terra estranha. Os vendedores chamam em uma língua alienígena, e estou perdido em um mar de cheiros estrangeiros, mas, estranhamente, tudo isso me parece familiar.\n\n"
 ep3_laamps.8090.desc.outro:0 "\n\nUm[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] caminha por [county.GetNameNoTierNoTooltip], mas [ROOT.Char.GetSheHe] ainda é [ROOT.Char.GetFirstNameNicknamed]?"
 ep3_laamps.8090.desc.world_africa:0 "Eu ouço as doces melodias dos tambores ecoando pelo mercado, cães uivando na natureza, e sinto que estou começando a pertencer. Meus pés descansam na areia estrangeira, e pássaros estranhos voam no céu, e finalmente me sinto satisfeito."
 ep3_laamps.8090.desc.world_asia_china:0 "As montanhas imponentes fornecem sombra para os campos de arroz abaixo. O ar fresco e úmido gruda no meu rosto enquanto afasto um mosquito. Encontrei verdadeira prosperidade nos vales montanhosos e sinto como se tivesse encontrado um paraíso pessoal na Terra."
 ep3_laamps.8090.desc.world_asia_japan:0 "O som das ondas batendo contra a costa enche meus ouvidos, e com uma respiração profunda o ar salgado do mar preenche meu nariz e pulmões. Uma calma percorre todo o meu corpo, e sinto uma ânsia pela vida. Quero não fazer nada além de permanecer nesta terra, nem que seja por um momento. Para saborear tudo."
 ep3_laamps.8090.desc.world_asia_korea:0 "Como a espinha do mundo, vejo longas cadeias de montanhas se estenderem até o horizonte, cobertas de neve em seus picos. As pessoas aqui são gentis e generosas, e fazem de tudo para me fazer sentir bem-vindo."
 ep3_laamps.8090.desc.world_asia_southeast:0 "Folhas densas me protegem do sol escaldante enquanto admiro as belas paisagens à minha frente. Vejo uma libélula pousar em um lírio d'água e não posso deixar de refletir sobre minha própria jornada. Sou aquela libélula, e este lugar é verdadeiramente único e mágico, e me apaixonei completamente."
 ep3_laamps.8090.desc.world_burma:0 "O calor crescente dá um brilho opalescente de pavão a tudo ao redor, os homens e mulheres movimentando-se sob as imponentes pagodas. O aroma das folhas de chá permeia e se espalha por essas ruas, misturando-se com a madeira recém-cortada de teca para proporcionar um coquetel inebriante. O sol está alto acima deste vale esculpido pelo poderoso Irrawaddy, e as cem culturas que vivem nele me recebem como um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom('SisterBrother')] há muito perdido."
 ep3_laamps.8090.desc.world_europe:0 "Onde mais eu poderia ter o prazer de cheirar lavanda fresca, ou de ver o sol se pôr sobre as ruínas da velha Roma, ou ouvir o coro jubilante de uma igreja, ou passar o inverno aquecido pela lareira de um estranho amigável? Em nenhum lugar, exceto na Europa."
 ep3_laamps.8090.desc.world_india:0 "Onde mais eu poderia provar o delicado equilíbrio de especiarias aromáticas e lavar tudo com um delicioso mango lassi? Ouvir as melodias suaves de um tocador de bansuri, ou ver as magníficas flores de lótus florescerem ao longo do Ganges? Somente na Índia."
 ep3_laamps.8090.desc.world_middle_east:0 "Ver o céu do deserto vivo com estrelas, cruzar as areias em meio aos camelos da caravana, contemplar a magnificência das mais antigas civilizações da humanidade no Cairo, Bagdá, Persépolis. Que terra poderia reivindicar ser o coração de toda a humanidade, se não aqui?"
 ep3_laamps.8090.desc.world_steppe:0 "Onde mais um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] é livre, senão na estepe interminável, com nada além de [ROOT.Char.GetFaith.CreatorName|U] grande céu azul acima [ROOT.Char.GetHerHim]? Eu quase sinto que poderia correr e cavalgar por toda a vida, sentir o vento no rosto, a grama sob os pés e perseguir o horizonte para sempre."
 ep3_laamps.8090.desc.world_tibet:0 "À distância, ouço o som raro de pessoas cantando com a garganta e sinto vontade de me juntar ao coro. A beleza interminável dos Himalaias se estende à minha frente, e me sinto compelido a descobrir cada recanto oculto e utopia secreta que espreita dentro."
 ep3_laamps.8090.t:0 "As Costas Distantes"
 ep3_laamps.8101.a.desc:0 "Esta escolha não poderá ser alterada mais tarde. Novas negociações com outros benfeitores também terão como alvo este título."
 ep3_laamps.8101.a:0 "[title_1.GetName]"
 ep3_laamps.8101.b:0 "[title_2.GetName]"
 ep3_laamps.8101.c:0 "[title_3.GetName]"
 ep3_laamps.8101.d:0 "[title_4.GetName]"
 ep3_laamps.8101.desc:0 "\"Bem-vindo, ah bem-vindo. Estou tão feliz que você veio,\" diz [petitioned_ruler.GetName], enquanto sou levado em segredo diante [petitioned_ruler.GetHerHim].\n\n\"Temos muito a discutir. Mas primeiro, vamos resolver a questão da seleção de seus esforços. Você parece ter várias reivindicações sobre diversos títulos, e embora desejemos ver você conquistá-los todos eventualmente, é necessário começar com um objetivo claro, para que seus esforços não sejam desperdiçados perseguindo muitas caudas nos pássaros proverbiais.\n\nOuvi dizer que [title_2.GetName] está muito agradável nesta época do ano, mas realmente, a escolha é sua. Qual será, hm?\""
 ep3_laamps.8101.t:0 "$laamp_legitimist_support_contract$ — Muitas Reivindicações"
 ep3_laamps.8102.a.desc:0 "Você começará as negociações sem pedir mais"
 ep3_laamps.8102.a:0 "\"O mais importante, Vossa Graça...\""
 ep3_laamps.8102.b.desc:0 "Você começará as negociações com um nível de apoio aumentado"
 ep3_laamps.8102.b.failure:0 "Você perde um turno de negociações"
 ep3_laamps.8102.b.success:0 "Você convence [petitioned_ruler.GetShortUIName]"
 ep3_laamps.8102.b:0 "Deslumbre [petitioned_ruler.GetSheHe] com sua genialidade."
 ep3_laamps.8102.c.desc:0 "Você terá mais turnos para negociar com [petitioned_ruler.GetName]"
 ep3_laamps.8102.c:0 "Confunda [petitioned_ruler.GetSheHe] com bobagens."
 ep3_laamps.8102.d.desc:0 "$ep3_laamps.8102.c.desc$"
 ep3_laamps.8102.d:0 "O tempo nunca é desperdiçado entre amigos!"
 ep3_laamps.8102.desc:0 "\"Podemos oferecer-lhe ouro e nossos melhores guerreiros, em troca de, digamos, metade da renda anual de [claimed_title.GetName].\" [petitioned_ruler.GetName] claramente não quer perder tempo.\n\n\"Mal podemos esperar para ver a cabeça de [claimed_title.GetHolder.GetName] em uma lança. Ah, e por favor, não nos entedie demais enquanto inevitavelmente pede mais, há um limite para nossa tolerância.\"\n\n#italic Você terá [ROOT.Var('legitimist_turns').GetValue] turnos para negociar os detalhes do acordo."
 ep3_laamps.8102.e.desc:0 "$ep3_laamps.8102.b.desc$"
 ep3_laamps.8102.e:0 "\"Vamos acertar uma dívida antiga primeiro.\""
 ep3_laamps.8102.t:0 "$laamp_legitimist_support_contract$ — Prelúdio"
 ep3_laamps.8103.a.desc:0 "Você receberá uma quantia maior de apoio agora, por um pagamento adicional no futuro."
 ep3_laamps.8103.a:0 "Ainda é necessário mais."
 ep3_laamps.8103.b.desc:0 "Você convence [petitioned_ruler.GetNameNoTooltip] a fornecer mais apoio sem aumentar o pagamento de sua parte"
 ep3_laamps.8103.b.failure:0 "$ep3_laamps.8102.b.failure$"
 ep3_laamps.8103.b.success:0 "$ep3_laamps.8102.b.success$"
 ep3_laamps.8103.b:0 "A glória vale mais que ouro!"
 ep3_laamps.8103.c.desc:0 "Você tentará convencer [petitioned_ruler.GetNameNoTooltip] a reduzir o número de pagamentos em um."
 ep3_laamps.8103.c.failure:0 "$ep3_laamps.8102.b.failure$"
 ep3_laamps.8103.c.success:0 "$ep3_laamps.8102.b.success$"
 ep3_laamps.8103.c:0 "Não posso esgotar meu reino!"
 ep3_laamps.8103.d.desc:0 "@warning_icon! #color_red Esta opção encerra as negociações#!"
 ep3_laamps.8103.d:0 "É... aceitável."
 ep3_laamps.8103.intro_1:0 "[petitioned_ruler.GetName] se ajeita em sua cadeira, o olhar [petitioned_ruler.GetHerHim] perfurando você.\n\n"
 ep3_laamps.8103.intro_2:0 "O ar está tenso, pois o que está em jogo é alto. Pela postura de [petitioned_ruler.GetName], você percebe a importância dessa questão para [petitioned_ruler.GetSheHe].\n\n"
 ep3_laamps.8103.intro_3:0 "As velas foram trocadas, as bebidas reabastecidas. Os servos de [petitioned_ruler.GetName] saíram sem uma palavra desnecessária, pois os superiores vão falar.\n\n"
 ep3_laamps.8103.mid_1:0 "\"Vemos isso como uma base para o futuro brilhante que nos aguarda. Acreditamos que você tem a capacidade de entregar, não desapontar. E não cometemos erros em tais julgamentos.\""
 ep3_laamps.8103.mid_2:0 "\"Sim, sim, isso pode funcionar. Com a graça de [petitioned_ruler.GetFaith.HighGodName], funcionará! Como você não veio até nós antes? Certamente, você deve trabalhar no seu timing, se quiser ter sucesso.\""
 ep3_laamps.8103.mid_3:0 "\"Ha! Gostaríamos de ver a expressão no rosto de [claimed_title.GetHolder.GetName] quando você entrar em [capital_barony.GetNameNoTier] com nossas tropas. Por favor, seja gentil e peça a alguém para anotar todos os detalhes.\""
 ep3_laamps.8103.no_more_turns_flavor:0 "\"Já falamos o suficiente\" — diz [petitioned_ruler.GetSheHe] severamente. — \"Esta é nossa oferta final. Você pode demonstrar sua sabedoria aceitando-a.\""
 ep3_laamps.8103.obligations:0 "\n#italic Após conquistar [claimed_title.GetName], você terá que pagar #color_yellow [ROOT.Var('legitimist_obligations').GetValue] #!vezes a cada dois anos, cada vez #color_yellow metade de sua renda anual.#!"
 ep3_laamps.8103.one_obligations:0 "\n#italic Após conquistar [claimed_title.GetName], você terá que pagar #color_yellow metade de sua renda anual.#!"
 ep3_laamps.8103.support_1:0 "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] prometeu #EMP #color_yellow Apoio Padrão #! - #color_yellow 300 moedas de ouro e 500 tropas de elite.#!"
 ep3_laamps.8103.support_2:0 "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] prometeu #EMP #color_yellow Apoio Modesto #! - #color_yellow 600 moedas de ouro e 1000 tropas de elite.#!"
 ep3_laamps.8103.support_3:0 "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] prometeu #EMP #color_yellow Apoio Substancial #! - #color_yellow 900 moedas de ouro e 1500 tropas de elite.#!"
 ep3_laamps.8103.support_4:0 "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] prometeu #EMP #color_yellow Apoio Considerável #! - #color_yellow 1200 moedas de ouro e 2000 tropas de elite.#!"
 ep3_laamps.8103.support_5:0 "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] prometeu #EMP #color_yellow Apoio Formidável #! - #color_yellow 1500 moedas de ouro e 2500 tropas de elite.#!"
 ep3_laamps.8103.support_6:0 "\n#italic [petitioned_ruler.GetShortUINameNoTooltip] prometeu #EMP #color_yellow Apoio Avassalador #! - #color_yellow 1800 moedas de ouro e 3000 tropas de elite.#!"
 ep3_laamps.8103.t:0 "$laamp_legitimist_support_contract$ — Debate"
 ep3_laamps.8105.a.desc:0 "Você pedirá mais tempo para se preparar para a guerra."
 ep3_laamps.8105.a.failure:0 "Você terá 4 anos para reivindicar [claimed_title.GetName]"
 ep3_laamps.8105.a.success:0 "Você terá 8 anos para reivindicar [claimed_title.GetName]"
 ep3_laamps.8105.a:0 "Paciência é a chave nos assuntos militares."
 ep3_laamps.8105.b.desc:0 "Você concorda com as condições. $ep3_laamps.8105.a.failure$"
 ep3_laamps.8105.b:0 "Ao futuro de [claimed_title.GetNameNoTooltip]!"
 ep3_laamps.8105.c.desc:0 "@warning_icon! #color_red Você rompe as negociações.#! [petitioned_ruler.GetName] não o apoiará e certamente terá uma opinião pior sobre você."
 ep3_laamps.8105.c:0 "Isso foi uma perda de tempo."
 ep3_laamps.8105.desc:0 "Dois governantes presos em uma negociação acalorada, um com a coroa nas têmporas [petitioned_ruler.GetHerHim], enquanto a minha ainda está descoberta. Mas é o cansaço que sinto, aquele peso repentino em minha cabeça, ou a coroa de [claimed_title.GetName] está tão próxima agora?\n\nUma careta deve ter traído meus pensamentos, pois [petitioned_ruler.GetName] sorri com conhecimento. \"Você será um excelente [claimed_title.GetHolder.GetTitleAsNameNoTooltip], e em breve — quatro anos no máximo. Nossas tropas e ouro garantirão isso. E por favor, não se preocupe, vamos lembrá-lo se você... por acaso esquecer sua parte do acordo.\"\n\n[petitioned_ruler.GetSheHe|U] ergue seu cálice, um brinde final para selar o acordo."
 ep3_laamps.8105.invalidations_reasons:0 "@warning_icon! #color_red Tornar-se senhor de um título diferente de [claimed_title.GetName] ou mudar o propósito do acampamento cancelará o acordo.#!\nO herdeiro de [petitioned_ruler.GetPrimaryTitle.GetName] herdará as obrigações. #weak Pode haver maneiras de escapar de pagar..."
 ep3_laamps.8105.t:0 "$laamp_legitimist_support_contract$ — Conclusão"
 ep3_laamps.8106.a.desc:0 "Teremos que agir, se quisermos viver em um mundo diferente."
 ep3_laamps.8106.a:0 "[claimed_title.GetHolder.GetShortUIName] sentirá o aço frio!"
 ep3_laamps.8106.b.desc:0 "Você terá mais 2 anos para reivindicar [claimed_title.GetName]"
 ep3_laamps.8106.b.failure:0 "Suas obrigações aumentaram"
 ep3_laamps.8106.b.success:0 "$ep3_laamps.8102.b.success$"
 ep3_laamps.8106.b:0 "Ainda não é a hora certa."
 ep3_laamps.8106.c.desc:0 "@warning_icon! Você rompe o acordo. [petitioned_ruler.GetName] ficará #EMP extremamente descontente"
 ep3_laamps.8106.c:0 "Vejo minha fortuna em outro lugar."
 ep3_laamps.8106.desc:0 "Anos atrás, [petitioned_ruler.GetName] me forneceu soldados excelentes e ouro, para me ajudar a recuperar o que é meu por direito.\n\nO trono de [claimed_title.GetName] — ocupado pelo vil usurpador [claimed_title.GetHolder.GetShortUIName]!\n\n[petitioned_ruler.GetShortUIName] espera que eu ataque em breve e fica mais impaciente a cada dia que passa. Mas minhas forças estão prontas? Conquistei apoio suficiente? O povo de [claimed_title.GetName] chora o suficiente por meu retorno triunfante?"
 ep3_laamps.8106.t:0 "$laamp_legitimist_support_contract$ — Chegou a Hora"
 ep3_laamps.8107.a.desc:0 "Você falhou em garantir sua reivindicação sobre [claimed_title.GetName]"
 ep3_laamps.8107.a:0 "O destino tinha outros planos."
 ep3_laamps.8107.desc:0 "Palavras não podem expressar o quão decepcionados estamos com você. #EMP Verme#! Tínhamos um futuro tão brilhante pela frente, e você decidiu abandonar tudo.\nConsidere-nos profundamente desagradados e a si mesmo um verme. Seja cortês o suficiente para desaparecer da Terra silenciosa e lamentavelmente."
 ep3_laamps.8107.t:0 "Nosso Indigno [ROOT.Char.GetFirstName],"
 ep3_laamps.8108.a:0 "[Glossary( 'Pacta Sunt Servanda', 'PACTA_SUNT_SERVANTA_GLOSS' )]"
 ep3_laamps.8108.b.desc:0 "Você adiará o pagamento para o próximo ano. Ainda precisará pagar o valor acordado posteriormente."
 ep3_laamps.8108.b.failure:0 "Seu argumento é visto como uma desculpa fraca"
 ep3_laamps.8108.b.success:0 "Você formula um argumento convincente"
 ep3_laamps.8108.b:0 "Pagarei, mas não agora."
 ep3_laamps.8108.c.desc:0 "@warning_icon! Você não pagará uma única moeda quebrada a [petitioned_ruler.GetName]. [petitioned_ruler.GetSheHe|U] deveria saber melhor."
 ep3_laamps.8108.c:0 "[petitioned_ruler.GetShortUINameNoTooltip], você é um tolo absoluto!"
 ep3_laamps.8108.desc:0 "Quão jubilante foi minha chegada vitoriosa a [claimed_title.GetName]! Depois de tanto tempo percorrendo estradas inóspitas, sempre sendo um convidado em terras estrangeiras, sem um lar, sem minha reivindicação legítima, minha doce [claimed_title.GetTierAsNameNoTooltip]. Finalmente, tudo está certo, como deveria estar desde o início. Sou um poderoso [ROOT.Char.GetTitleAsNameNoTooltip].\n\nHá, no entanto, um espinho nesse buquê. [petitioned_ruler.GetName], que me ajudou imensamente a alcançar isso, exige que eu pague o que combinamos todos esses anos atrás. Certamente, o honorável [ROOT.Char.GetHouse.GetNameNoTooltip] sempre paga suas dívidas, não?"
 ep3_laamps.8108.legitimist_too_poor:0 "#italic Devido ao seu [income|E] escasso, você reembolsa apenas o valor exato a cada vez: #color_yellow 300 #! [gold_i]"
 ep3_laamps.8108.no_payments_left:0 "Este é o último pagamento para [petitioned_ruler.GetName]."
 ep3_laamps.8108.payments_left:0 "#color_yellow [petitioned_ruler.MakeScope.Var('legitimist_obligations_left').GetValue] Pagamentos #!restantes"
 ep3_laamps.8108.t:0 "$laamp_legitimist_support_contract$ — O Pedágio"
 ep3_laamps.8109.a.desc:0 "Daqui a um ano, um pagamento de metade da renda anual do reino será esperado por [petitioned_ruler.GetShortUIName]"
 ep3_laamps.8109.a:0 "$ep3_laamps.8108.a$"
 ep3_laamps.8109.desc:0 "Tal tristeza preenche nosso coração, ao saber que nossa querida [previous_ruler.GetName] não está mais no trono, que [petitioned_ruler.GetFaith.HighGodName] abençoe a alma [previous_ruler.GetHerHim]. Infelizmente, ainda há uma questão de pagamento não resolvido pelo nosso apoio para colocar [previous_ruler.GetSheHe] no trono. Esperamos que você tenha sido informado sobre os detalhes e que seja honrado o suficiente para cumprir sua parte."
 ep3_laamps.8109.t:0 "Para [ROOT.Char.GetNameNoTooltip]"
 ep3_laamps.8110.a:0 "Que maravilha!"
 ep3_laamps.8110.desc_dead:0 "faleceu deste mundo"
 ep3_laamps.8110.desc_imprisoned:0 "foi jogado em minhas masmorras"
 ep3_laamps.8110.desc_intro:0 "Há muito tempo, um acordo foi feito — [petitioned_ruler.GetName] forneceu apoio para a retomada de [claimed_title.GetName], na forma de soldados e ouro antecipados, em troca de uma parte significativa da renda do meu reino.\n\nNo entanto, [petitioned_ruler.GetSheHe] não poderia prever que [petitioned_ruler.GetSheHe] "
 ep3_laamps.8110.desc_killer_root:0 "foi morto por minhas mãos"
 ep3_laamps.8110.desc_outro:0 "antes que a dívida fosse completamente paga. Parece que ninguém importante o suficiente no reino [petitioned_ruler.GetHerHim] estava ciente dos detalhes do acordo. Agora está claro — ninguém virá cobrar.\n\nUma reviravolta estranha, quase como se a mão astuta de alguém tivesse guiado os fluxos do destino."
 ep3_laamps.8110.desc_unlanded:0 "perdeu sua honra e título"
 ep3_laamps.8110.desc_war:0 "seria envolvido em uma guerra mortal comigo"
 ep3_laamps.8110.t:0 "$laamp_legitimist_support_contract$ — Conclusão Inesperada"
 ep3_laamps.8111.desc:0 "Você precisará pagar [Select_CString( petitioned_ruler.IsFemale, 'a', 'ao' )] [petitioned_ruler.GetShortUINameNoTooltip] [TopScope.GetValue('incoming_payment_value')] [gold_i] em #color_yellow seis #! meses!"
 ep3_laamps.8111.t:0 "Pagamento Legitimista Pendente"
 ep3_laamps.8200.a:0 "Bem-vindo, [new_person.GetFirstNameNoTooltip]!"
 ep3_laamps.8200.b:0 "Por favor, vá embora."
 ep3_laamps.8200.c.tt:0 "Os personagens não tentarão se juntar ao seu acampamento aleatoriamente pelos próximos 20 anos."
 ep3_laamps.8200.c:0 "Vá embora e espalhe a palavra: Fiquem longe!"
 ep3_laamps.8200.desc_1:0 "Enquanto tento medir a logística de nosso próximo movimento, um imponente transeunte levanta facilmente um de nossos carros. Um de meus seguidores corre até mim e implora:\n\n\"[ROOT.Char.Custom('MistressMaster')|U], [new_person.GetSheHe] levantou o carro inteiro sobre sua cabeça! [new_person.GetSheHe|U] pode ficar? [new_person.GetSheHe] nem precisa de uma arma, [new_person.GetSheHe] pode simplesmente pegar e jogar nossos inimigos!\"\n\nUm[Select_CString( new_person.IsFemale, 'a', '' )] [new_person.GetWomanMan] poderia se mostrar [new_person.GetHerselfHimself] útil, carregando minha mochila também. [new_person.GetSheHe|U] vai comer muitas provisões, porém."
 ep3_laamps.8200.desc_2:0 "Uma única risada quebra o silêncio da noite. Depois outra, e vejo meus seguidores severos se transformando em um grupo de crianças rindo. O que está causando essa comoção?\n\n\"Ah, [ROOT.Char.GetTitledFirstNameNoTooltip], finalmente nos encontramos! Permita-me apresentar, sou [new_person.GetName], um bobo da corte extraordinário. Já me apresentei para o grande [location_top_liege.GetName], mas agora me ofereço a você e ao seu humor!\""
 ep3_laamps.8200.desc_3:0 "Estamos hospedados em [location.GetTerrain.GetNameNoTooltip|l] [location.GetCulture.GetName] de [location_county.GetNameNoTier] há algum tempo. Os locais têm visitado nosso acampamento frequentemente, para trocar ou simplesmente para socializar. Recentemente vi um[Select_CString( new_person.IsFemale, 'a', '' )] [new_person.GetWomanMan] ficando por mais tempo que o resto.\n\n\"Aqui, em [location_county.GetNameNoTier], tivemos anos magros e anos gordos. E eu aposto que os anos magros estão voltando. Não quero morrer onde nasci, ficar aqui, por mais tempo. Humildemente peço, permita-me juntar-me ao seu grupo, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord|U].\""
 ep3_laamps.8200.t:0 "Um Novo Rosto no Acampamento"
