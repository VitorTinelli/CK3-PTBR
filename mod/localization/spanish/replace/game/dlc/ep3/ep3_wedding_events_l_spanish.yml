l_spanish:
 ep3_wedding.0001.a.flavor_non_spouse:0 "Eu nunca desejaria trair a confiança [same_family_spouse.GetHerHim], nem com a menor indiscrição!"
 ep3_wedding.0001.a.flavor_spouse:0 "Eu nunca desejaria trair a confiança [other_family_spouse.GetHerHim], nem com a menor indiscrição!"
 ep3_wedding.0001.a_non_spouse:0 "Este dia é para [Select_CString( same_family_spouse.IsFemale, 'a', 'o' )] [same_family_spouse.GetFirstNameNoTooltip], só para [same_family_spouse.GetSheHe]!"
 ep3_wedding.0001.a_spouse:0 "Este dia é para [Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] [other_family_spouse.GetFirstNameNoTooltip], só para [other_family_spouse.GetSheHe]!"
 ep3_wedding.0001.b.caught.desc.tt:0 "Você é peg[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] — no meio do ato!"
 ep3_wedding.0001.b.fail.desc.tt:0 "Desgostos[Select_CString( flirting_in_law.IsFemale, 'a', 'o' )], [flirting_in_law.GetSheHe] te rejeita."
 ep3_wedding.0001.b.flavor:0 "Abordar [flirting_in_law.GetNameNoTooltip] pode ser um erro, talvez... mas um interessante."
 ep3_wedding.0001.b.success.desc.tt:0 "Embriagad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de desejo, você se escorrega para fora juntos."
 ep3_wedding.0001.b:0 "Vamos #EMP celebrar#!."
 ep3_wedding.0001.c.flavor:0 "Somos todos uma família agora, afinal! O que há de estranho ou suspeito em compartilhar pequenos confortos com a família...?"
 ep3_wedding.0001.c:0 "Não há mal algum em uma simples dança amigável."
 ep3_wedding.0001.desc:0 "A dança começou! A música flui como um rio impetuoso, como o vento que agita até as árvores mais imponentes. [flirting_in_law.GetName], [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] do [other_family_spouse.Custom('GetBrideGroom')], dança no meio dos outros, seu corpo como uma folha ao vento. O olhar [flirting_in_law.GetHerHim] não está nos outros dançarinos, não... seus olhos estão fixos em mim. #EMP De forma convidativa.#!\n\nA noite vai se tornando cada vez mais tarde. Olhares ardentes d[Select_CString( flirting_in_law.IsFemale, 'a', 'o' )] [flirting_in_law.GetFirstNamePossessiveNoTooltip] são acompanhados por breves toques delicados, e seus flancos agitados começam a despertar algo em mim."
 ep3_wedding.0001.desc_guest:0 "E não somos #EMP nós#! os que estamos selando uma união sagrada hoje!\n\nTalvez haja um espaço em algum canto escuro para algo profanamente desleixado..."
 ep3_wedding.0001.desc_own_wedding:0 "Com [Select_CString( other_family_spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))] [other_family_spouse.GetFirstName] sumid[Select_CString( other_family_spouse.IsFemale, 'a', 'o' )], talvez #EMP isso#! seja o que eu devo fazer para provar os encantos da família [other_family_spouse.GetHerHim]...?\n\nMas no meu próprio casamento? #EMP Com [Select_CString( flirting_in_law.IsFemale, 'a', 'o' )] [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] [Select_CString( other_family_spouse.IsFemale, 'da minha', 'do meu' )] [other_family_spouse.Custom('WifeHusband')]?!?"
 ep3_wedding.0001.t:0 "Não exatamente o [other_family_spouse.Custom('GetBrideGroom')|U]"
 ep3_wedding.0002.a.fail.desc.tt:0 "[flirting_in_law.GetSheHe|U] ficou lisonjead[Select_CString( flirting_in_law.IsFemale, 'a', 'o' )], mas não é nada mais."
 ep3_wedding.0002.a.flavor:0 "Cometi um grande crime contra [Select_CString( other_family_spouse.IsFemale, 'a minha nova', 'o meu novo' )] [other_family_spouse.Custom('WifeHusband')], mas pela maior causa que existe: o coração!"
 ep3_wedding.0002.a.flavor_non_spouse:0 "De fato, tal coisa foi ordenada, neste tempo de amor santificado!"
 ep3_wedding.0002.a.success.desc.tt:0 "[flirting_in_law.GetSheHe|U] também está se apaixonando por você."
 ep3_wedding.0002.a:0 "\"Eu... eu acho que te amo, [flirting_in_law.GetFirstNameNoTooltip].\""
 ep3_wedding.0002.b:0 "\"Você vai dançar para mim novamente, não vai...?\""
 ep3_wedding.0002.c:0 "\"Vamos voltar para a festa!\""
 ep3_wedding.0002.highborn:0 "mas eu gostei de brincar entre os galhos da árvore genealógica da família [other_family_spouse.GetHouse.GetName]."
 ep3_wedding.0002.intro:0 "[flirting_in_law.GetName], [Select_CString( flirting_in_law.IsFemale, 'a', 'o' )] intoxicante [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] de [other_family_spouse.Custom('GetBrideGroom')], nunca realmente parou de dançar. À medida que a roupa luxuosa [flirting_in_law.GetHerHim] caía peça por peça na escuridão, enquanto [Select_CString( flirting_in_law.IsFemale, 'a', 'o' )] [flirting_in_law.GetFirstNameNoTooltip] pressionava sua carne quente contra a minha...  o balanço [flirting_in_law.GetHerHim] só ficava mais forte, mais urgente.\n\nCom a ação agora consumada, eu caio em uma explosão de risos eufóricos;"
 ep3_wedding.0002.lowborn:0 "mas eu gostei de brincar entre os galhos da árvore genealógica de sua família."
 ep3_wedding.0002.others_wedding:0 "[Select_CString( flirting_in_law.IsFemale, 'minha parceira', 'meu parceiro' )] na indiscrição me dá uma última dança nua.\n\nA festa de casamento nos espera, sim..."
 ep3_wedding.0002.own_wedding:0 "[Select_CString( flirting_in_law.IsFemale, 'a', 'o' )] [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] d[Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] [other_family_spouse.Custom('WifeHusband')] me dá uma última dança nua.\n\n[Select_CString( other_family_spouse.IsFemale, 'Minha nova', 'Meu novo' )] [other_family_spouse.Custom('WifeHusband')] me espera, sim..."
 ep3_wedding.0002.t:0 "Ritmos da Escuridão"
 ep3_wedding.0003.a.flavor:0 "Você não sente vontade de celebrar seu casamento, [Select_CString( other_family_spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))]... só nós três?"
 ep3_wedding.0003.a:0 "Você fica #EMP tão#! lind[Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] quando está brav[Select_CString( other_family_spouse.IsFemale, 'a', 'o' )]..."
 ep3_wedding.0003.b:0 "Fale sobre isso e você morre, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))]."
 ep3_wedding.0003.c.fail.desc:0 "[other_family_spouse.GetFirstNameNoTooltip] denuncia suas mentiras."
 ep3_wedding.0003.c.flavor:0 "Sim, há um espírito maligno me possuindo — e se ele não for satisfeito pela carne, ele... uh... #EMP vai me destruir#! Eu realmente não tenho outra escolha!"
 ep3_wedding.0003.c.success.desc:0 "[other_family_spouse.GetFirstNameNoTooltip] chora pela sua aflição."
 ep3_wedding.0003.c:0 "Fui tomad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pela loucura, #EMP LOUCURA#!, por um demônio do desejo!"
 ep3_wedding.0003.d.flavor:0 "Vá tagarelar sobre isso em outro lugar, seu tolo chorão."
 ep3_wedding.0003.d:0 "Você acha que eu #EMP me importo#! que essa diversão toda está 'errada'...?"
 ep3_wedding.0003.desc_guest:0 "\"#EMP [other_family_spouse.GetFaith.DevilName] leve meus olhos!#!\" grita a voz inconfundível d[Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] [other_family_spouse.GetTitledFirstNamePossessive]. \"#EMP O que eu encontrei?!?#!\"\n\n[Select_CString( flirting_in_law.IsFemale, 'Sua', 'Seu' )] [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] se afasta da minha carne escorregadia, ainda arfando... mas [Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] [other_family_spouse.GetFirstName] já viu tudo, e parece pouco divertido."
 ep3_wedding.0003.desc_intro:0 "[flirting_in_law.GetTitledFirstName] grita — chegamos aos momentos finais e espasmódicos da união-\n\n"
 ep3_wedding.0003.desc_own_wedding:0 "\"#EMP [other_family_spouse.GetFaith.DevilName] leve meus olhos!#!\" grita a inconfundível voz [Select_CString( other_family_spouse.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('other_family_spouse'))]. \"#EMP Que imundície eu encontrei?!?#!\"\n\n[Select_CString( flirting_in_law.IsFemale, 'Sua', 'Seu' )] [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))] se afasta da minha carne escorregadia, ainda arfando... mas [Select_CString( other_family_spouse.IsFemale, 'a', 'o' )] [other_family_spouse.GetFirstName] já viu tudo, e se engasga com esse insulto repulsivo aos nossos votos matrimoniais."
 ep3_wedding.0003.e.flavor:0 "Uma vez consumid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pelo fogo proibido... meu coração agora está partido em pedaços."
 ep3_wedding.0003.e:0 "Por favor, não conte a ninguém! Estou muito arrependid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]."
 ep3_wedding.0003.t:0 "Esse é [Select_CString( flirting_in_law.IsFemale, 'a minha', 'o meu' )] [other_family_spouse.Custom2('RelationToMeShort', SCOPE.sC('flirting_in_law'))|U]!"
 ep3_wedding.001.b.got_caught:0 "@warning_icon!#X  Seu romance foi descoberto! Você provavelmente enfrentará consequências#!"
 lust_demon_success_chance:0 "#weak [success_chance|E] vastamente aumentada para o [scheme|E] de [GetScheme('seduce').GetTypeName]  contra personagens piedosos"
 lust_demon_success_chance_tt:0 "Você ganha uma melhoria significativa de [success_chance|E] no [scheme|E] de [GetScheme('seduce').GetTypeName] contra personagens [GetTrait('zealous').GetName( GetNullCharacter )] por #high 10 anos#!"
 own_wedding_difficulty_tooltip:0 "@warning_icon! #X Chance de sucesso reduzida — porque #EMP este é o seu próprio casamento#!"
 possessed_by_lust_demon_modifier:0 "Possuído pelos Demônios do Desejo"
 possessed_by_lust_demon_modifier_desc:0 "Este personagem afirma que vive sob a ameaça de um mal faminto, que trará destruição se não for saciado pela carne carnal."
 unflappable_boudoir_confidence_modifier:0 "Confiança Imperturbável no Boudoir"
 unflappable_boudoir_confidence_modifier_desc:0 "Este lothário é absolutamente sem vergonha quanto aos seus desejos... de uma forma que muitos acham escandalosa, e outros tantos acham encantadora."
