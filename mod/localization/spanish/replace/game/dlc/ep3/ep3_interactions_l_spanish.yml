 ep3_interactions_events.0030.desc.accepted_child:0 "O garotinho me observa nos olhos de forma fraca, chorosa, amorosa.\n\n"
 ep3_interactions_events.0030.desc.accepted_youth:0 "Mordendo os dentes, apertando os olhos cheios de lágrimas, o jovem acena uma vez.\n\n"
 ep3_interactions_events.0030.desc.child_address:0 "diz meu regente"
 ep3_interactions_events.0030.desc.child_resents_castration:0 "Essas palavras não fazem nada. O garotinho grita em pânico, tenta desesperadamente se afastar.\n\n"
 ep3_interactions_events.0030.desc.greek:0 "\"como um [Glossary( 'vestes', 'VESTES_GLOSS')], um [Glossary( 'patrikios', 'PATRIKIOS_GLOSS')] — talvez até mesmo o [Glossary( 'parakoimomenos', 'PARAKOIMOMENOS_GLOSS')] imperial! Uma vez que você esteja livre dos desejos e aspirações da masculinidade, como será confiável! [recipient.GetFirstNameNoTooltip], você deixará sua família tão orgulhosa.\"\n\n"
 ep3_interactions_events.0030.desc.intro:0 "Enquanto abraço [Select_CString( recipient.IsFemale, 'minha', 'meu' )] [actor.Custom2('RelationToMe', SCOPE.sC('recipient'))] [recipient.GetFirstName] perto, ele treme.\n\n\"Pense no seu futuro,\""
 ep3_interactions_events.0030.desc.non_greek:0 "\"como um camareiro, um senescal — talvez até um poderoso regente! Uma vez que você esteja livre dos desejos e aspirações da masculinidade, como será confiável! [recipient.GetFirstNameNoTooltip], você deixará sua família tão orgulhosa.\"\n\n"
 ep3_interactions_events.0030.desc.normal_address:0 "Eu sussurro,"
 ep3_interactions_events.0030.desc.resents_castration:0 "Minhas palavras não fazem nada. O garotinho grita em pânico, tenta desesperadamente se afastar.\n\n"
 ep3_interactions_events.0030.desc:0 "Atrás de nós, meu médico afia uma lâmina."
 ep3_interactions_events.0030.good_castration.t:0 "Castracão Elegante"
