 ep3_interactions_events.0012.opening:0 "[intermediary.Custom2('AppropriateGreetingNegative', actor)]"
 ep3_interactions_events.0013.desc:0 "Estou triste ao ouvir que você decidiu apoiar as alegações infundadas [Select_CString( actor.IsFemale, 'da', 'do' )] [actor.GetTitledFirstName].\n\nNo entanto, a lei é clara, e não renunciarei à minha posição legitimamente adquirida."
