 rival_unpayed_laamp:0 "[CHARACTER.GetShortUIName|U] não pagou [TARGET_CHARACTER.GetShortUIName] pelo trabalho de mercenário."
 scheme_critical_moments.1162.a:0 "Está feito."
 scheme_critical_moments.1162.desc:0 "A culminação de meses de conspirações meticulosas finalmente se desenrolou quando [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstName] renunciou ao seu cargo como Governador de [highest_title.GetName].\n\nRumores habilidosamente espalhados e evidências convenientemente plantadas mancharam a reputação [target.GetHerHim] além da reparação, e [target.GetSheHe] ficou sem outra escolha a não ser renunciar espontaneamente."
 scheme_critical_moments.1162.desc_discovered:0 "\n\nÉ claro para todos que só eu tive o poder e a influência para fazer isso acontecer, mas [target.GetSheHe] dificilmente está em posição de fazer algo sobre esse conhecimento."
 scheme_critical_moments.1162.desc_secret:0 "\n\nClaro, tal impulso poderoso não poderia ter vindo de ninguém além de mim, e ainda assim [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitledFirstNameNoTooltip] não tem nada para provar as suspeitas [target.GetHerHim]."
 scheme_critical_moments.1162.t:0 "$scheme_critical_moments.1132.t$"
 scheme_critical_moments.1162.tt:0 "[target.GetShortUIName] renunciou como Governador de [highest_title.GetName] e deu lugar a [new_governor.GetShortUIName]"
 scheme_critical_moments.1163.a:0 "Deve haver outra maneira."
 scheme_critical_moments.1163.desc:0 "Apesar dos meus esforços para semear dúvidas por meio de rumores cuidadosamente colocados e evidências fabricadas, o carisma e os apoiadores leais [Select_CString( target.IsFemale, 'da', 'do' )] [target.GetTitledFirstName] protegeram [target.GetSheHe] de qualquer tempestade iminente."
 scheme_critical_moments.1163.desc_discovered:0 "\n\nAlém disso, [target.GetSheHe] foi tornado plenamente ciente de que todo o complô veio de mim."
 scheme_critical_moments.1163.desc_secret:0 "\n\n[target.GetSheHe|U] ainda está de pé, sua reputação intacta, aparentemente alheio à intriga que buscou minar [target.GetSheHe]."
 scheme_critical_moments.1163.t:0 "$scheme_critical_moments.1133.t$"
 scheme_critical_moments.1163.tt.desc:0 "[scheme.GetOwner.GetShortUIName] tentou forçá-lo a renunciar, mas falhou!"
 scheme_critical_moments.1163.tt:0 "[scheme.GetName] Descoberto"
 scheme_critical_moments.1164.a:0 "Eu voltarei."
 scheme_critical_moments.1164.desc:0 "Sussurros de suspeita, insinuando todo tipo de má conduta, corrupção e até mesmo traição de minha parte têm se espalhado pela corte durante meses, lançando sombras sobre minha reputação como Governador.\n\nDói-me admitir, mas eles tiveram sucesso. À luz das esmagadoras e comprometedoras evidências que surgiram contra mim — apesar de suas falsidades quase ocultas — encontro-me forçado a renunciar ao meu papel público."
 scheme_critical_moments.1164.desc_discovered:0 "\n\nSei que ninguém além [Select_CString( owner.IsFemale, 'da', 'do' )] [owner.GetTitledFirstName] está por trás da minha queda. Pode não ser hoje, mas eu juro que um dia terei minha vingança."
 scheme_critical_moments.1164.desc_secret:0 "\n\nPoucos poderiam exercer tal influência sobre a opinião pública, então tenho minhas suspeitas sobre o cérebro por trás da minha queda, mas não tenho provas para apoiar minhas alegações."
 scheme_critical_moments.1164.t:0 "Forçado a Renunciar"
