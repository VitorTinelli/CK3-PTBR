 ep3_interactions_events.0031.a_failure:0 "[recipient.GetFirstNameNoTooltip] escapa dos seus buscadores"
 ep3_interactions_events.0031.a_success:0 "[recipient.GetFirstNameNoTooltip] é encontrad[Select_CString( recipient.IsFemale, 'a', 'o' )] e castrad[Select_CString( recipient.IsFemale, 'a', 'o' )]"
 ep3_interactions_events.0031.desc:0 "Nos aposentos d[Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetFirstName], roupas e pertences estão espalhados pelo chão, e o garoto ausente. Meus funcionários vasculham as ruas, mas em lugar algum se encontra [Select_CString( recipient.IsFemale, 'minha', 'meu' )] [actor.Custom2('RelationToMe', SCOPE.sC('recipient'))]!\n\nO jovem tolo, desprovido de respeito pela minha autoridade, por nossas #EMP tradições#!, fugiu ao primeiro sussurro da minha intenção.\n\nOnde, em toda [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], poderia [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetFirstName] estar se escondendo? Em algum beco escuro, talvez, segurando com força sua preciosa masculinidade... o prêmio guardado que lhe rendeu o exílio."
 ep3_interactions_events.0031.t:0 "Fugiu Antes da Lâmina"
 ep3_interactions_events.0031_callous:0 "Um filhote que não se importa com sacrifícios. Boa viagem!"
 ep3_interactions_events.0031_kind:0 "Talvez eu o tenha julgado mal..."
 ep3_interactions_events.0040.a:0 "Viva [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip]!"
 ep3_interactions_events.0040.desc:0 "Sua diligência e eficácia como Governador não passaram despercebidas. É meu desejo que você receba um sinal de minha apreciação e um reconhecimento público de suas contribuições."
 ep3_interactions_events.0040.opening:0 "[actor.Custom2('AppropriateGreetingPositive', recipient)]"
 ep3_interactions_events.0101.a:0 "Gosto da confiança de [knight_to_rent_1.GetNameNoTooltip]!"
 ep3_interactions_events.0101.b:0 "Vou compartilhar grandes vitórias com [knight_to_rent_2.GetNameNoTooltip]!"
 ep3_interactions_events.0101.c:0 "[knight_to_rent_3.GetNameNoTooltip] parece promissor!"
 ep3_interactions_events.0101.d:0 "Não estou impressionado."
 ep3_interactions_events.0101.desc:0 "\"Com um olho em quem posso dispensar...\" fala [recipient.GetName]. \"Escolhi alguns de meus [recipient.Custom('KnightCulturePluralNoTooltip')|l] mais inquietos. Apresentem-se!\"\n\n"
 ep3_interactions_events.0101.desc_knight_1:0 "\"Isso deve falar por si só!\" [knight_to_rent_1.GetName] flexiona seus músculos.\n\n"
 ep3_interactions_events.0101.desc_knight_1_trait:0 "\"Sou um [cool_trait_1.GetName(knight_to_rent_1)] renomado!\" se gaba [knight_to_rent_1.GetName].\n\n"
 ep3_interactions_events.0101.desc_knight_2:0 "\"Serei seu melhor [ROOT.Char.Custom('KnightCultureNoTooltip')|l]!\" afirma [knight_to_rent_2.GetName], exuberantemente.\n\n"
 ep3_interactions_events.0101.desc_knight_2_trait:0 "\"Escolha-me, e serei seu [cool_trait_2.GetName(knight_to_rent_2)] de escolha!\" grita [knight_to_rent_2.GetName].\n\n"
 ep3_interactions_events.0101.desc_knight_3:0 "\"Sou um lutador excepcional.\" se gaba confiantemente [knight_to_rent_3.GetName]."
 ep3_interactions_events.0101.desc_knight_3_trait:0 "\"Sou conhecido por ser um bom [cool_trait_3.GetName(knight_to_rent_3)],\" afirma confiante [knight_to_rent_3.GetName]."
 ep3_interactions_events.0101.t:0 "Pedido de Patrono: Alugar um [recipient.Custom('KnightCultureNoTooltip')]"
 ep3_interactions_events.0102.a:0 "Que [ROOT.Char.GetFaith.HighGodName] esteja com você!"
 ep3_interactions_events.0102.desc:0 "Meu período como seu [ROOT.Char.Custom('KnightCultureNoTooltip')|l] terminou. Espero que nos encontremos novamente, do mesmo lado do campo de batalha."
 ep3_interactions_events.0102.opening:0 "[rented_knight.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_interactions_events.0111.a:0 "Talvez seja hora de me estabelecer em... [new_primary_title.GetNameNoTierNoTooltip]?"
 ep3_interactions_events.0111.actor_decides:0 "Se [actor.GetShortUIName] aceitar sua oferta:"
 ep3_interactions_events.0111.b:0 "Eu quero [actor_artifact.GetNameNoTooltip]."
 ep3_interactions_events.0111.c:0 "Vamos fazer disso uma aliança oficial."
 ep3_interactions_events.0111.d:0 "Force [actor.GetSheHe] a ser meu $game_concept_contact_list_contact$!"
 ep3_interactions_events.0111.desc:0 "Estou curioso sobre a oferta de [actor.GetName] e ficaria honrado em lutar ao lado dos banner [actor.GetHerHim].\n\nNo entanto, algumas moedas de ouro não são suficientes para arriscar a vida dos meus bravos seguidores. Devo pedir mais!"
 ep3_interactions_events.0111.e:0 "Precisamos de provisões!"
 ep3_interactions_events.0111.f:0 "Na verdade, eu não quero me juntar de jeito nenhum."
 ep3_interactions_events.0111.join_wars:0 "[recipient.GetShortUIName|U] se juntará a todas as [wars|E] com [actor.GetShortUIName] como [war_leader|E]"
 ep3_interactions_events.0111.refuse:0 "[recipient.GetTitledFirstName] Recusou se Juntar às Guerras"
 ep3_interactions_events.0111.refuse_5_years.tt:0 "Você não será questionado sobre Trabalho Mercenário por #V 5#! anos"
 ep3_interactions_events.0111.refuse_5_years:0 "Trabalho mercenário não me interessa."
 ep3_interactions_events.0111.refuse_puppeteer:0 "[recipient.GetShortUIName|U] recusou-se a participar das guerras de [puppet_or_actor.GetShortUIName]"
 ep3_interactions_events.0111.t:0 "Negociar Entrada nas Guerras"
 ep3_interactions_events.0112.a:0 "Ainda assim, é um bom negócio para mim."
 ep3_interactions_events.0112.b:0 "Você está fora de si?!"
 ep3_interactions_events.0112.c:0 "Tenho outras maneiras de convencê-lo!"
 ep3_interactions_events.0112.desc:0 "Fico honrado com sua oferta e adoraria lutar ao lado de seus banner. No entanto, em vez de receber um pagamento antecipado, eu deveria receber"
 ep3_interactions_events.0112.desc_alliance:0 "uma aliança oficial!"
 ep3_interactions_events.0112.desc_artifact:0 "[actor_artifact.GetName] do seu tesouro!"
 ep3_interactions_events.0112.desc_contact_list:0 "prioridade em futuros negócios!"
 ep3_interactions_events.0112.desc_land:0 "[new_primary_title.GetName] e me tornar seu vassalo!"
 ep3_interactions_events.0112.desc_provisions:0 "provisões para meu povo!"
 ep3_interactions_events.0112.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 ep3_interactions_events.0112.refuse:0 "[actor.GetTitledFirstName] Recusou Sua Oferta"
 ep3_interactions_events.0121.a:0 "Eu não poderia ter feito isso sem você."
 ep3_interactions_events.0121.b:0 "É um pouco demais, não é?"
 ep3_interactions_events.0121.c:0 "Não posso pagar isso agora."
 ep3_interactions_events.0121.desc:0 "A luta finalmente acabou, e nosso contrato foi cumprido.\n\nAgora, é hora de você quitar sua dívida com [laamp_temp.GetPrimaryTitle.GetNameNoTooltip]!"
 ep3_interactions_events.0121.opening:0 "[laamp.Custom2('AppropriateGreetingPositive', employer)]"
 ep3_interactions_events.0122.a:0 "Recomendo meus serviços no futuro."
 ep3_interactions_events.0122.b:0 "Um pouco mesquinho, mas eu aceito."
 ep3_interactions_events.0122.c:0 "Isto é um escândalo! Que [employer.Custom2('InsultNoun', ROOT.Char)]!"
 ep3_interactions_events.0122.desc:0 "Você lutou bem em minhas guerras."
 ep3_interactions_events.0122.desc_accept:0 "Você ganhou cada moeda que concordamos."
 ep3_interactions_events.0122.desc_not_pay:0 "No entanto, não posso lhe pagar nada mais do que já lhe dei."
 ep3_interactions_events.0122.desc_pay_less:0 "No entanto, neste momento, só posso lhe dar tanto quanto eu tenho."
 ep3_interactions_events.0122.opening:0 "[employer.Custom2('AppropriateGreeting', laamp)]"
 ep3_interactions_events.0201.a:0 "Ótimas notícias!"
 ep3_interactions_events.0201.desc:0 "Apoio com prazer [secondary_recipient.GetShortUIName] para [target.GetBaseNameNoTier]! Na verdade, já enviei mensagens a vários associados para garantir a candidatura [secondary_recipient.GetHerHim]."
 ep3_interactions_events.0201.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 ep3_interactions_events.0202.a:0 "Valeu a tentativa..."
 ep3_interactions_events.0202.desc:0 "Receio que não seja do meu interesse apoiar a candidatura de [secondary_recipient.GetShortUIName] para [target.GetBaseNameNoTier]."
 ep3_interactions_events.0202.opening:0 "[recipient.Custom2('AppropriateGreeting', actor)]"
 ep3_interactions_events.0210.a:0 "Bom. #EMP Bom.#!"
 ep3_interactions_events.0210.desc:0 "Devo dizer que sua proposta foi #EMP atraente#!.\n\n[secondary_recipient.GetShortUIName] será derrotado e [target.GetBaseNameNoTier] será submetido ao poder do [recipient.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTier]!"
 ep3_interactions_events.0210.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 ep3_interactions_events.0211.a:0 "Infelizmente..."
 ep3_interactions_events.0211.desc:0 "Não estarei animado para lutar contra [secondary_recipient.GetShortUIName]! Lute suas próprias batalhas."
 ep3_interactions_events.0211.opening:0 "[recipient.Custom2('AppropriateGreetingNegative', ROOT.Char)]"
 ep3_interactions_events.0400.a:0 "Você será bem recebido!"
 ep3_interactions_events.0400.desc:0 "Aceito de todo o coração seu convite para me trazer para sua família, e ficarei orgulhoso em me chamar de membro da Casa [actor.GetHouse.GetBaseName]!"
 ep3_interactions_events.0400.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 ep3_interactions_events.0421.a:0 "Excelente."
 ep3_interactions_events.0421.desc:0 "Considerei sua carta e suas preocupações em relação à Casa [secondary_recipient.GetHouse.GetBaseName].\n\nFique tranquilo, qualquer calamidade que possa acontecer com [Select_CString( secondary_recipient.IsFemale, 'a', 'o' )] [secondary_recipient.GetTitledFirstName] ou sua família não é de minha preocupação..."
 ep3_interactions_events.0421.opening:0 "[recipient.Custom2('AppropriateGreetingPositive', actor)]"
 ep3_interactions_events.0500.a.tt.need_soldiers:0 "Sem pelo menos [EmptyScope.ScriptValue('ep3_interactions_events_0500_troops_count_value')|0] soldados a seu nome, você não pode esperar resistir [Select_CString( actor.IsFemale, 'a', 'ao' )] [actor.GetTitleAsName]"
 ep3_interactions_events.0500.a:0 "[Select_CString( actor.IsFemale, 'Aquela cretina', 'Aquele cretino' )] d[Select_CString( actor.IsFemale, 'a', 'o' )] [actor.GetTitleAsNameNoTooltip] me ameaça #EMP?!"
 ep3_interactions_events.0500.b:0 "Isto... isto é sério..."
 ep3_interactions_events.0500.desc:0 "Considere-se avisado: você e sua espécie se acomodaram demais em [actor.GetPrimaryTitle.GetDefinitiveNameNoTooltip|l].\n\nSe você não levar seu acampamento para longe, serei forçado a considerar você um fugitivo, e #EMP fazer#! você sair."
 ep3_interactions_events.0500.opening:0 "[actor.Custom2('AppropriateGreetingNegative', recipient)]"
 ep3_interactions_events.0501.toast_puppeteer:0 "[recipient.GetShortUIName] ignorou a ordem de despejo de [puppet_or_actor.GetShortUINamePossessive]"
 ep3_interactions_events.0600.a.fail:0 "Você não deve mais favores"
 ep3_interactions_events.0600.a.success:0 "Uma relação de benefício mútuo é forjada"
 ep3_interactions_events.0600.a:0 "Devemos sempre apoiar um ao outro."
 ep3_interactions_events.0600.b.flavor:0 "Eu sou totalmente, #EMP totalmente#!, [Select_CString( ROOT.Char.IsFemale, 'minha própria', 'meu próprio' )] [ROOT.Char.GetWomanMan] — castigar esse oportunista provará isso a todos!"
 ep3_interactions_events.0600.b:0 "Eu não devo nada a esse #EMP agiota#! além de desprezo!"
 ep3_interactions_events.0600.c.flavor:0 "Comprometo-me a servir [supporter.GetSheHe] diligentemente, da maneira que eu puder."
 ep3_interactions_events.0600.c:0 "Meu grande advogado merece lealdade sem fim!"
 ep3_interactions_events.0600.d:0 "Um presente com valor que só cresce: minha amizade."
 ep3_interactions_events.0600.desc:0 "Minha tentativa de garantir um mandato sobre o [ROOT.Char.GetPrimaryTitle.GetNameNoTier] deu ricas frutas. Agora, como [ROOT.Char.GetTitleAsName], estou cercado de novos conselheiros, ministros e cuidadores... criaturas que me instigam a recompensar bem meus amigos e benfeitores.\n\n[supporter.GetName] — embora ele não seja da [ROOT.Char.GetHouse.GetName] — foi um defensor vocal da minha candidatura e é meu principal credor político. Ignorar a generosidade [supporter.GetHerHim] seria como um insulto."
 ep3_interactions_events.0600.e:0 "Envie [Select_CString( supporter.IsFemale, 'a', 'ao' )] [supporter.GetWomanMan] algo lustroso."
 ep3_interactions_events.0600.f:0 "Quem?"
 ep3_interactions_events.0600.t:0 "Meu Advogado Aguarda"
 ep3_interactions_events.0601.a_repaid:0 "Uma nomeação digna para um[Select_CString( new_landed_admin.IsFemale, 'a', '' )] [new_landed_admin.GetWomanMan] mais dign[Select_CString( new_landed_admin.IsFemale, 'a', 'o' )]!"
 ep3_interactions_events.0601.a_scorned:0 "O jogo da política não é jogado assim, #EMP ingrato!#!"
 ep3_interactions_events.0601.b:0 "Eu sou um benfeitor! Um patrono! Não seu parceiro igual."
 ep3_interactions_events.0601.desc:0 "Alguns dizem que, se não fosse por seu apoio ardente, a governança do [new_landed_admin.GetPrimaryTitle.GetNameNoTier] nunca teria se tornado minha.\n\n"
 ep3_interactions_events.0601.desc_ally:0 "Então, que sua defesa seja o primeiro ato de nossa longa e frutífera parceria! Você deseja apoio mútuo, não deseja?"
 ep3_interactions_events.0601.desc_friendship:0 "Enquanto me estabeleço neste [new_landed_admin.GetPrimaryTitle.GetTierAsNameNoTooltip], eu gostaria de lhe oferecer um presente de valor crescente: minha amizade."
 ep3_interactions_events.0601.desc_gift:0 "Que este presente, de alguma forma, retribua minha dívida para com você. E que [new_landed_admin.GetFaith.WealthGodName] cuide de você."
 ep3_interactions_events.0601.desc_hook:0 "Eu lhe devo uma grande dívida e, como tal, servirei diligentemente como [Select_CString( new_landed_admin.IsFemale, 'sua', 'seu' )] [new_landed_admin.GetWomanMan] jurad[Select_CString( new_landed_admin.IsFemale, 'a', 'o' )]."
 ep3_interactions_events.0601.desc_ignore:0 "Eu lutei #EMP arduamente#! para atingir minha posição, ganhei-a com meu suor e minhas graças, e estou... bastante insultado com implicações em contrário."
 ep3_interactions_events.0601.desc_insult:0 "Talvez, eu me pergunto, meu avanço tenha sido arranjado por algum homem do campo sem escolaridade ou criança idiota? Acredito ter ouvido algumas vozes [supporter.Custom2('InsultAdjective', ROOT.Char)] tagarelando meu nome."
 ep3_interactions_events.0601.desc_repay:0 "Eles falam a verdade."
 ep3_interactions_events.0601.desc_scorn:0 "Estou incerto."
 ep3_interactions_events.0601.opening:0 "[Select_CString( supporter.IsFemale, 'Minha', 'Meu' )] [new_landed_admin.Custom2('RelationToMeShort', SCOPE.sC('supporter'))] e advogado,"
 ep3_interactions_events.0610.a:0 "Eu não sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetLadyLord] com terras... mas tenho novas perspectivas."
 ep3_interactions_events.0610.desc:0 "[emperor.GetPrimaryTitle.GetName|U]. Onde burocratas riscam leis entediantes, onde bocas pintadas sussurram entre maravilhas palacianas... e onde comprei uma bela propriedade.\n\n"
 ep3_interactions_events.0610.desc_conversion:0 "E, à vontade [recipient.GetHerHim], sou um recém-ungido [ROOT.Char.GetFaith.GetAdherentName]."
 ep3_interactions_events.0610.desc_emperor:0 "Pela benevolência [Select_CString( emperor.IsFemale, 'da', 'do' )] [emperor.GetTitledFirstNameRegnal] [emperor.GetHerselfHimself] tenho um lugar aqui, aninhado no barulho do grandioso [emperor.GetCapitalLocation.GetTitle.GetNameNoTier]."
 ep3_interactions_events.0610.desc_emperor_outro:0 "\n\nMeu novo soberano, que detém poder sobre todas as honras, todos os cargos em [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip], provavelmente não esquecerá que eu — o mais novo residente da capital — sou agora sua criatura."
 ep3_interactions_events.0610.desc_governor:0 "A advocacia de [recipient.GetName] me concede acesso ao mundo político [recipient.GetHerHim], tornando-me bem-vindo em sua provincial [recipient.GetCapitalLocation.GetTitle.GetNameNoTier]."
 ep3_interactions_events.0610.desc_non_governor_outro:0 "\n\nPortanto, estou em dívida com [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitledFirstNameNoTooltip], sim... mas é [Select_CString( emperor.IsFemale, 'a', 'ao' )] [emperor.GetFirstNameRegnal] a quem eu me rebaixarei, pois a administração d[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip] governa tudo."
 ep3_interactions_events.0610.t:0 "Uma Casa para os [ROOT.Char.GetHouse.GetNameNoTooltip]"
 ep3_interactions_events.0611.a:0 "Valorize seu conforto, você cobra."
 ep3_interactions_events.0611.desc:0 "Devo recusar seu pedido. Temo que a vida em [recipient.GetCapitalLocation.GetTitle.GetNameNoTier] não lhe conviesse... e as sutilezas do meu clima político ainda menos.\n\nDespreze a ideia de um escritório empoeirado em uma propriedade tranquila, eu o exorto — valorize a poeira da estrada em suas botas."
 ep3_interactions_events.0611.opening:0 "Nobre vagabundo,"
 ep3_interactions_events.0620.a:0 "Juntos, por uma causa justa!"
 ep3_interactions_events.0620.b:0 "#EMP [recipient.GetFaith.PriestNeuterPlural|U]!#! Não há melhores políticos."
 ep3_interactions_events.0620.c:0 "Parece que minhas orações serão atendidas."
 ep3_interactions_events.0620.desc:0 "Há maneiras de mover montanhas além do poder secular, e meios de poder além da vulgaridade secular.\n\nPara a salvação eterna, olhe para [recipient.GetFaith.HighGodName]. Para sua libertação na terra, sua família pode contar com o apoio de nossos ministros [recipient.GetFaith.GetAdjective]."
 ep3_interactions_events.0620.desc_byz:0 "Em Sua igreja, nosso Senhor colocou apóstolos, professores, trabalhadores de milagres, aqueles dotados para o governo... e com uma diversidade de línguas.\n\nEstas, nossas vozes sagradas, falarão em favor da [actor.GetHouse.GetName]."
 ep3_interactions_events.0620.opening:0 "Fervente [actor.GetFirstName],"
 ep3_interactions_events.0621.a:0 "Bah! Como se suas mãos piedosas estivessem limpas!"
 ep3_interactions_events.0621.desc:0 "Você pediria àqueles cujas mentes devem estar na salvação, cujo trabalho é pastorear e ensinar, que se intrometam nos assuntos mundanos em seu nome?\n\nImpertinência vergonhosa!"
 ep3_interactions_events.0621.opening:0 "Ó criança perniciosa,"
 ep3_interactions_events.0630.a:0 "#EMP Fui roubado! Fui humilhado!#!"
 ep3_interactions_events.0630.b:0 "Uma vez nomeado, e agora demitido."
 ep3_interactions_events.0630.c:0 "No [actor.GetPrimaryTitle.GetTierAsNameNoTooltip], a roda do destino gira sempre..."
 ep3_interactions_events.0630.desc:0 "Com todo o palácio em concordância, eu por meio deste encerro seu mandato como [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.GetTitleAsNameNoTooltip]. Todos os títulos que você possui, juntamente com as receitas e honras do cargo, devem ser renunciados.\n\nPor todos os trabalhos em serviço de [recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] e [actor.GetPrimaryTitle.GetTierAsName], tanto seu povo quanto seu soberano são gratos."
 ep3_interactions_events.0630.desc_family:0 "Eu ordenei sua remoção do cargo. Para nós, escionistas de [actor.GetHouse.GetName], não é mais vantajoso que você governe o [recipient.GetPrimaryTitle.GetNameNoTooltip].\n\nPor favor, pense em seu dever para com seu clã e entregue seu bastão de ofício sem ressentimentos. Sua família espera por você em [actor.GetCapitalLocation.GetTitle.GetNameNoTier]."
 ep3_interactions_events.0630.desc_guilt:0 "Com solícita tristeza, ordeno sua renúncia do cargo. Você serviu bem e diligentemente ao [actor.GetPrimaryTitle.GetTierAsName], mas fazê-lo a partir da sede de seu [recipient.GetPrimaryTitle.GetTierAsNameNoTooltip] não será mais possível.\n\nPor favor, confie que esta é a vontade de [recipient.GetFaith.HighGodName], assim como é o comando [Select_CString( actor.IsFemale, 'da sua', 'do seu' )] [actor.GetTitleAsName]."
 ep3_interactions_events.0630.desc_spite:0 "Pelas leis do nosso grande [actor.GetPrimaryTitle.GetTierAsName], a governança é concedida pela minha vontade apenas e retirada a meu bel-prazer.\n\nVocê deve — com grande rapidez — remover-se do ofício do [recipient.GetPrimaryTitle.GetNameNoTooltip]. Renuncie a todo poder. Esqueça o que você foi.\n\n[Select_CString( actor.IsFemale, 'Sua sábia e graciosa', 'Seu sábio e gracioso' )] [actor.GetTitleAsName] ordena."
 ep3_interactions_events.0630.opening:0 "M[Select_CString( recipient.IsFemale, 'inha', 'eu' )] [recipient.GetTitleAsName] do [recipient.GetPrimaryTitle.GetNameNoTier],"
 ep3_interactions_events.0800.a:0 "Excelente."
 ep3_interactions_events.0800.desc:0 "Sua causa é justa! Juntos, vamos colocar [Select_CString( secondary_recipient.IsFemale, 'a', 'o' )] [secondary_recipient.GetTitledFirstName] em seu devido lugar!\n\nMinhas forças se reúnem e logo estarão prontas para fazer campanha ao seu lado."
 ep3_interactions_events.0801.a:0 "Droga."
 ep3_interactions_events.0801.desc:0 "Receio que não posso ajudar sua causa sem esperança.\n\nQue [recipient.GetFaith.HighGodName], e [Select_CString( secondary_recipient.IsFemale, 'a', 'o' )] [secondary_recipient.GetTitledFirstName] sejam misericordiosos!"
 ep3_interactions_events.0810.a:0 "Excelente."
 ep3_interactions_events.0810.desc:0 "Agora vejo que escolhi o lado errado nesta luta. Só espero que não tenha mudado de rumo tarde demais.\n\nQue nossos exércitos triunfem contra [Select_CString( secondary_recipient.IsFemale, 'a', 'o' )] [secondary_recipient.GetTitledFirstName]!"
 ep3_interactions_events.0811.a:0 "Droga."
 ep3_interactions_events.0811.desc:0 "Eu não sou um traidor de lado! Ambos fizemos nossas camas e devemos deitá-las.\n\nSubmeta-se [Select_CString( secondary_recipient.IsFemale, 'a', 'ao' )] [secondary_recipient.GetTitledFirstName], antes que seja tarde demais..."
