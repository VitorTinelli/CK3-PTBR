 ep3_laamps.0401.a:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] é #EMP meu#!!"
 ep3_laamps.0401.death:0 "Aquel[Select_CString( target.IsFemale, 'a', 'e' )] [target.Custom2('InsultAdjective', ROOT.Char)] falso-[ROOT.Char.GetTitleAsNameNoTooltip], [target.GetFirstName] — muito fraco para sua coroa — está morto."
 ep3_laamps.0401.desc:0 "Os planos foram verificados e rechecados, cada eventualidade preparada, cada conspirador pronto. Invadir o [target.Custom('ResidenceBuilding')|l] foi fácil o suficiente sob o pretexto de emprego...\n\nO caos se instalou quando o alarme foi disparado, mas através do tumulto, corte e golpe, finalmente emergimos, exaustos, mas vitoriosos!\n\n"
 ep3_laamps.0401.imprison:0 "Eu tenho aquel[Select_CString( target.IsFemale, 'a', 'e' )] [target.Custom2('InsultAdjective', ROOT.Char)] fals[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]-[ROOT.Char.GetTitleAsNameNoTooltip], [target.GetFirstName], arrastado diante de mim, em sua própria sala do trono, minha prisioneira para fazer o que eu quiser!"
 ep3_laamps.0401.outro:0 "[Select_CString( target.IsFemale, 'Aquela maldita', 'Aquele maldito' )] [target.Custom2('InsultAdjective', ROOT.Char)] falso-[ROOT.Char.GetTitleAsNameNoTooltip], [target.GetFirstName], conseguiu escapar — uma ameaça à minha posição enquanto [target.GetSheHe] estiver livre."
 ep3_laamps.0401.t:0 "$seize_realm$: [Select_CString( ROOT.Char.IsFemale, 'A Nova', 'O Novo' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 ep3_laamps.0402.a:0 "Damn you, eu estava #EMP tão perto#!"
 ep3_laamps.0402.b:0 "Maldita fortuna..."
 ep3_laamps.0402.c:0 "Droga!"
 ep3_laamps.0402.death:0 "Lutamos com afinco, mas logo fomos cercados.\n\nAo me virar para correr, vejo que não há escape, e soldados correm em minha direção, espadas erguidas!"
 ep3_laamps.0402.desc:0 "Quase desde o início, meus melhores planos foram assustadoramente arruinados. Tomar uma coroa é mais difícil do que eu imaginava...\n\nMal conseguimos entrar no seu [target.Custom('ResidenceBuilding')|l] antes que os guardas nos cercassem do nada, nossos planos hostis expostos."
 ep3_laamps.0402.imprison:0 "Lutamos com afinco, mas logo fomos cercados.\n\nAcorrentado, sou arrastado diante [Select_CString( target.IsFemale, 'da', 'do' )] [target.GetTitleAsNameNoTooltip] que deixa claro seu furor..."
 ep3_laamps.0402.outro:0 "Lutamos com afinco, e tivemos sorte de sair de lá vivos.\n\n[target.GetFirstNameRegnal] ainda é [Select_CString( target.IsFemale, 'a', 'o' )] [target.GetTitleAsNameNoTooltip] do [target.GetPrimaryTitle.GetNameNoTier], seguro em seu [target.Custom('ResidenceBuilding')|l], e sem dúvida buscando minha captura rápida..."
 ep3_laamps.0402.t:0 "$seize_realm$: Esperanças Desfeitas"
 ep3_laamps.0410.a:0 "Eu voltarei!"
 ep3_laamps.0410.b:0 "Você, sapo nojento!"
 ep3_laamps.0410.c:0 "Droga!"
 ep3_laamps.0410.death:0 "Buscando fugir, me vejo engolido no tumulto caótico, uma lâmina se aproximando de mim!"
 ep3_laamps.0410.desc:0 "O que começou como um dia comum em [target.GetCapitalLocation.GetBaronyNameExplicitly] tomou um rumo repentino e sinistro. O [target.Custom('ResidenceBuilding')|l] está cheio com os sons de guardas gritando e servos correndo pelos corredores.\n\nFinalmente, um sargento ofegante explica que um grupo de canalhas conseguiu entrar sob falso pretexto e está lutando caminho até a sala do trono!\n\n"
 ep3_laamps.0410.imprison:0 "Soldados de repente irrompem pela porta, e logo sou arrastado diante de seu líder, [owner.GetFirstName], que levanta minha coroa com desprezo."
 ep3_laamps.0410.outro:0 "Eu me esgueiro pelos aposentos dos servos, disfarçando-me como um plebeu, e me junto à massa que foge do [target.Custom('ResidenceBuilding')|l]..."
 ep3_laamps.0410.t:0 "$seize_realm$: Coroa Roubada"
 ep3_laamps.0411.a:0 "Você vai #EMP pagar#! por isso."
 ep3_laamps.0411.b:0 "[owner.GetSheHe|U] aprendeu o que acontece com os usurpadores!"
 ep3_laamps.0411.c:0 "Maldit[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.Custom2('InsultNoun', ROOT.Char)]!"
 ep3_laamps.0411.death:0 "O corpo d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetFirstName], um ninguém sem terras, é arrastado diante de mim, seu plano de usurpar minha coroa à força um total fracasso."
 ep3_laamps.0411.desc:0 "O que começou como um dia comum em [target.GetCapitalLocation.GetBaronyNameExplicitly] tomou um rumo repentino e sinistro. O [target.Custom('ResidenceBuilding')|l] está cheio com os sons de guardas gritando e servos correndo pelos corredores.\n\nFinalmente, um sargento ofegante explica que um grupo de canalhas conseguiu entrar sob falso pretexto e está lutando caminho até a sala do trono!\n\nMeus soldados logo trazem as coisas sob controle, e os sons de luta lentamente se extinguem."
 ep3_laamps.0411.imprison:0 "[owner.GetFirstName], um ninguém sem terras, é arrastado diante de mim, seu plano de usurpar minha coroa à força exposto."
 ep3_laamps.0411.outro:0 "Fui informado de que [Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetFirstName], um ninguém sem terras, liderou o ataque, buscando usurpar minha coroa à força. O covarde já se foi."
