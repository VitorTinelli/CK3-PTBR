 THEME_CONCEPT_PLURAL_NO_TOOLTIP:0 "$game_concept_themes$"
 game_concept_admin_confirmation:0 "$admin_confirmation_decision$"
 game_concept_admin_confirmation_desc:0 "[governors|E] podem ter suas nomeações formal e publicamente confirmadas por seu [liege|E]."
 game_concept_administrative:0 "Administrativo"
 game_concept_administrative_desc:0 "$game_concept_administrative$ é uma [government_form|E] [government_bureaucratic_type|E] que nomeia [characters|E] como [governors|E], para gerenciar e presidir sobre terras, chamadas [provinces|E], em nome de seu [liege|E].\n\n$game_concept_administrative$ Os Personagens têm acesso a [influence|E] e alguns também possuem uma [family_estate|E] pessoal.\n\nApenas [rulers|E] [Concept('independent', 'Independentes')|E] de um [realm|E] $game_concept_administrative$ têm [legitimacy|E], enquanto [vassals|E] não têm.\n\n$admin_cannot_declare_internal_wars$"
 game_concept_administrative_government:0 "Governo Administrativo"
 game_concept_administrative_governments:0 "Governos Administrativos"
 game_concept_administrative_i:0 "@government_type_administrative!"
 game_concept_adventurer:0 "Aventureiro"
 game_concept_adventurer_camp:0 "Acampamento de Aventureiro"
 game_concept_adventurer_camps:0 "Acampamentos de Aventureiros"
 game_concept_adventurer_desc:0 "Um $game_concept_adventurer$ é um [character|E] [unlanded|E] que lidera um [camp|E].\n\nEles não têm [vassals|E], nem ganham renda passivamente da forma usual — em vez disso, devem aceitar [task_contracts|E] para ganhar seu dinheiro ou pedir favores de sua [contact_list|E].\n\nOs $game_concept_adventurers$ podem vagar livremente pelo mapa. Sua principal preocupação é garantir que tenham [provisions|E] suficientes para sobreviver em movimento.\n\nEm vez da [crown_authority|E], a maioria dos $game_concept_adventurers$ definirá um [camp_purpose|E]. Isso indica que tipo de grupo eles têm e por que permanecem juntos.\n\n#WEAK Filhos mais novos sem herança, nômades ambiciosos, fugitivos petulantes, estudiosos curiosos, mercenários ferozes e nobres depostos também preenchem as fileiras desses incansáveis vagantes.\n\nSeu único fator unificador é uma fome por algo mais do que uma vida tranquila de obscuridade e a vontade de fazer algo a respeito.#!"
 game_concept_adventurer_i:0 "@government_type_adventurer!"
 game_concept_adventurer_possessive:0 "do Aventureiro"
 game_concept_adventurer_siege_replenishment:0 "Reabastecimento de Cerco"
 game_concept_adventurer_siege_replenishment_desc:0 "Quando um [adventurer|E] faz um [siege|E] em uma [holding|E] com sucesso, uma parte de seus [men_at_arms|E] será reabastecida.\n\nTodos os [regiments|E] de Homens de Arma no [army|E] serão reabastecidos por #V x2#! vezes o valor de [loot|E] da Propriedade.\n\n#weak O aumento é composto por novos recrutas, a contratação forçada de locais e simplesmente pagando aqueles que se afastaram durante o cerco.#!"
 game_concept_adventurers:0 "Aventureiros"
 game_concept_adventurers_possessive:0 "dos Aventureiros"
 game_concept_appointment:0 "Nomeação"
 game_concept_appointment_level:0 "Nível de Nomeação"
 game_concept_appointment_level_desc:0 "Um $game_concept_appointment_level$ é usado por algumas [appointment_succession_laws|E] como requisito para que [characters|E] se tornem candidatos elegíveis.\n\nOs níveis são baseados no nível de uma moeda específica, e cada lei pode usar uma moeda diferente como requisito. Um [title|E] de nível mais alto normalmente exigirá um nível mais elevado.\n\n#weak Por exemplo: [GetLaw('celestial_appointment_succession_law').GetName] requer [merit|E] - Um [duchy|E] requer um [merit_level|E] de [GetModifier( 'merit_level_3' ).GetNameWithTooltip|L] ou mais, enquanto um [kingdom|E] requer [GetModifier( 'merit_level_5' ).GetNameWithTooltip|L] ou mais.#!"
 game_concept_appointment_levels:0 "Níveis de Nomeação"
 game_concept_appointment_succession:0 "Sucessão por Nomeação"
 game_concept_appointment_succession_law:0 "Lei de Sucessão por Nomeação"
 game_concept_appointment_succession_law_desc:0 "Sob a $game_concept_appointment_succession_law$, o [title|E] e suas [holdings|E] associadas serão herdadas pelo Candidato com a maior [candidate_score|E].\n\nOs tipos são:\n$EFFECT_LIST_BULLET$[GetLaw('appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('acclamation_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_ministry_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('celestial_grand_marshal_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('meritocratic_military_appointment_succession_law').GetName]\n$EFFECT_LIST_BULLET$[GetLaw('japanese_appointment_succession_law').GetName]"
 game_concept_appointment_succession_laws:0 "Leis de Sucessão por Nomeação"
 game_concept_appointments:0 "Nomeações"
 game_concept_camp:0 "Acampamento"
 game_concept_camp_building:0 "Melhoria de Acampamento"
 game_concept_camp_building_desc:0 "$game_concept_camp_buildings$ são melhorias únicas para um [camp|E].\n\nMecanicamente, eles são [domicile_buildings|E] — embora muitos representem costumes sociais ou simplesmente áreas de foco para o $game_concept_camp$, em vez de serem estruturas literais.\n\nOs bônus que podem conferir incluem:\n$EFFECT_LIST_BULLET$ Desbloqueio de novos [officers|E]\n$EFFECT_LIST_BULLET$ Poderosos bônus de [skill|E] para [followers|E]\n$EFFECT_LIST_BULLET$ Aumento da força dos [men_at_arms|E]\n$EFFECT_LIST_BULLET$ Desbloqueio de ações que [rulers|E] [landed|E] consideram garantidas.\n\n#WEAK Quando um [adventurer|E] se torna [landed|E], seus $game_concept_camp_buildings$ são liquidadas e uma parte reembolsada como [gold|E].#!"
 game_concept_camp_buildings:0 "Melhorias de Acampamento"
 game_concept_camp_desc:0 "$game_concept_camps$ são uma confusão portátil de tendas, animais de carga e pessoas. Eles variam em tamanho de um pequeno círculo a grandes exércitos vagantes.\n\nCada [GetGovernment( 'landless_adventurer_government' ).GetName] tem um $game_concept_camp$ [domicile|E] que se move pelo mapa com eles.\n\n[camp_buildings|E] podem ser construídos aqui, proporcionando poderosos bônus ao $game_concept_adventurer$ em vez de [counties|E] próprios. [followers|E], como sua [family|E] e [knights|E], viajam com o $game_concept_camp$ e podem ser nomeados como [officers|E].\n\n#WEAK Assim como [courts|E], $game_concept_camps$ incluem alguns [characters|E] sem nome que não são importantes o suficiente para serem retratados — embora menos deles.\n\nMesmo quando não estão [traveling|E] entre $game_concept_counties$, os $game_concept_camps$ geralmente não são estáticos no [location|E] em que estão, e se moverão a cada poucas noites.#!"
 game_concept_camp_purpose:0 "Propósito do Acampamento"
 game_concept_camp_purpose_desc:0 "$game_concept_camp_purposes$ são o que pode ser considerado lei na anarquia de espírito livre dos [camps|E].\n\nEles representam a força vinculativa que motiva o $game_concept_camp$ a permanecer unido, seja uma inclinação acadêmica, habilidades de mercenário ou um ardente desejo de restaurar um governante legítimo ao seu trono.\n\nDiferentes $game_concept_camp_purpose_purposes$ desbloqueiam diferentes [camp_buildings|E] (e, por sua vez, [officers|E] únicos), levam a diferentes eventos ou opções de eventos, e afetam quais [task_contracts|E] são gerados.\n\n#WEAK $game_concept_camp_purpose$ também afeta o título do $game_concept_adventurer_possessive$ e as roupas de seus [followers|E].#!"
 game_concept_camp_purpose_purpose:0 "Propósito"
 game_concept_camp_purpose_purposes:0 "Propósitos"
 game_concept_camp_purposes:0 "Propósitos do Acampamento"
 game_concept_camp_temperament:0 "Temperamento do Acampamento"
 game_concept_camp_temperament_desc:0 "Diferente da rígida hierarquia de uma [court|E], os $game_concept_camps$ são lugares em grande parte informais onde os resmungos de [characters|E] importantes #EMP outros#! além do [adventurer|E] líder podem importar muito.\n\n#P $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_POSITIVE$#! Os $game_concept_camps$ conferem [character_modifiers|E] positivos ao seu $game_concept_adventurer$. Eles requerem que a maioria da [opinion|E] de todos os [characters|E] nomeados seja [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_HIGH')|=P0] ou mais.\n\n#N $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEGATIVE$#! Os $game_concept_camps$ aplicam $game_concept_character_modifiers$ negativos ao seu $game_concept_adventurer$. Eles requerem que a maioria das $game_concept_opinions$ de todos os $game_concept_characters$ nomeados seja [GetDefine('NDomicile', 'TEMPERAMENT_THRESHOLD_LOW')|=N0] ou menos.\n\n#V $DOMICILE_WINDOW_BOOKMARK_FOLLOWERS_TEMPERAMENT_NEUTRAL$#! Os $game_concept_camps$ são qualquer lugar onde a faixa de $game_concept_opinions$ cai entre esses dois extremos. Eles não aplicam $game_concept_modifiers$.\n\n#WEAK Os efeitos do $game_concept_camp_temperament$ escalam com o [prestige_level|E] do $game_concept_adventurer_possessive$. Quanto mais famoso o $game_concept_adventurer$, mais dramáticos os benefícios — e desvantagens — potenciais da atmosfera em seu $game_concept_camp$.#!"
 game_concept_camps:0 "Acampamentos"
 game_concept_candidate_score:0 "Pontuação de Candidato"
 game_concept_candidate_score_desc:0 "[characters|E] na [line_of_succession|E] para um [title|E] com [administrative_government|E] têm uma $game_concept_candidate_score$.\n\nEssa pontuação dita quem receberá o título na [succession|E] e pode ser alterada por vários meios, desde [scheming|E] até gastar [influence|E]."
 game_concept_candidate_scores:0 "Pontuações dos Candidatos"
 game_concept_contact_list:0 "Lista de Patronos"
 game_concept_contact_list_contact:0 "Patrono"
 game_concept_contact_list_contacts:0 "Patronos"
 game_concept_contact_list_desc:0 "[adventurers|E] estão sem [land|E], mas não sem #EMP conexões#!.\n\nA $game_concept_contact_list$ é uma lista de cada [character|E] para quem eles completaram com sucesso um [task_contract|E], bem como outros que têm algum motivo para apoiá-los — [family|E] com alta [opinion|E] deles, [friends|E], [lovers|E], e assim por diante.\n\n$game_concept_contact_list_contacts$ podem ser explorados para obter apoio extra através da $contact_list_request_interaction|V$ [character_interaction|E]."
 game_concept_contract_scheme:0 "Esquema de Contrato"
 game_concept_contract_scheme_contract:0 "Contrato"
 game_concept_contract_scheme_desc:0 "Muitos $game_concept_task_contracts$ exigem que [adventurers|E] completem com sucesso um [scheme|E].\n\nEsses podem ser prejudiciais (como assassinar um [contractor_possessive|E] [rival|E]), agradáveis (como simplesmente contar histórias para entreter sua [court|E] por alguns meses), ou inócuos (como transcrever textos para eles).\n\nSe o $game_concept_scheme$ for falhado ou abandonado por qualquer motivo, o $game_concept_task_contract$ também será considerado falhado."
 game_concept_contract_scheme_possessive:0 "do Esquema de Contrato"
 game_concept_contract_schemes:0 "Esquemas de Contrato"
 game_concept_contract_schemes_possessive:0 "dos Esquemas de Contrato"
 game_concept_contractor:0 "Contratante"
 game_concept_contractor_desc:0 "Um $game_concept_contractor$ é o [character|E] que está oferecendo um $game_concept_task_contract$.\n\nO $game_concept_task_contract$ geralmente afeta principalmente o contratante, e ele normalmente é quem paga os salários de um [adventurer_possessive|E].\n\n#N [criminal_task_contracts|E] geralmente não são #BOL oferecidas#! por seu $game_concept_contractor$, e em vez disso se concentram em explorá-las — por exemplo, enganando alguém para lhe dar [gold|E] porque sinalizou sua credulidade.#!"
 game_concept_contractor_possessive:0 "do Contratante"
 game_concept_contractors:0 "Contratantes"
 game_concept_contractors_possessive:0 "dos Contratantes"
 game_concept_criminal_task_contract:0 "Contrato Criminal"
 game_concept_criminal_task_contract_desc:0 "Um $game_concept_criminal_task_contract$ normalmente envolve contratos escusos que podem ser lucrativos, mas irão premiá-lo com @gallowsbait_icon![GetTrait('gallowsbait').GetName(GetNullCharacter)] [trait_level_track_xp|E].\n\nAumentar o nível do [trait|E] $trait_gallowsbait$ fará com que a maioria do mundo o odeie mais e o respeite menos, e eventualmente fará com que [followers|E] seus que desaprovam sua bandidagem deixem seu emprego dramaticamente.\n\n#WEAK $trait_gallowsbait$ é um $game_concept_trait$ altamente negativo, significando que um personagem é um criminoso pequeno da mais baixa estirpe — pelo menos um assassinato na corte tem algum tipo de #EMP classe#!.\n\nEle pode ser limpo com a [decision|E] [GetDecisionWithKey('wipe_slate_decision').GetName].#!"
 game_concept_criminal_task_contract_possessive:0 "do Contrato Criminal"
 game_concept_criminal_task_contracts:0 "Contratos Criminais"
 game_concept_criminal_task_contracts_possessive:0 "dos Contratos Criminais"
 game_concept_diplomacy_task_contract:0 "Contrato de Diplomacia"
 game_concept_diplomacy_task_contract_desc:0 "Um $game_concept_diplomacy_task_contract$ normalmente envolve resolver disputas locais ou negociar acordos vantajosos usando sua sagacidade."
 game_concept_diplomacy_task_contract_possessive:0 "do Contrato de Diplomacia"
 game_concept_diplomacy_task_contracts:0 "Contratos de Diplomacia"
 game_concept_diplomacy_task_contracts_possessive:0 "dos Contratos de Diplomacia"
 game_concept_domicile:0 "Domicílio"
 game_concept_domicile_build_speed:0 "Tempo de Construção do [domicile_building|E]"
 game_concept_domicile_building:0 "Edifício Domiciliar"
 game_concept_domicile_building_desc:0 "Todos os [domiciles|E] podem ser melhorados com certos $game_concept_domicile_buildings$, que concedem renda, recursos como [prestige|E] e muitos outros benefícios ao proprietário.\n\nA disponibilidade de edifícios depende do tipo de $game_concept_domicile$, pois cada tipo tem um conjunto de edifícios muito diferente.\n\nAlguns $game_concept_domicile_buildings$ podem ter [internal_upgrades|E]."
 game_concept_domicile_building_slot:0 "Espaço de $game_concept_domicile_building$"
 game_concept_domicile_building_slot_desc:0 "Cada [domicile|E] possui apenas um número limitado de potenciais $game_concept_domicile_building_slot_slots$ para novos edifícios.\n\nNovos $game_concept_domicile_building_slot_slots$ podem ser desbloqueados ao atualizar o $game_concept_domicile_building$ central, como o [estate|E] [GetDomicileBuilding('estate_main_01').GetName] ou o [camp|E] de [GetDomicileBuilding('camp_main_01').GetName].\n\n#WEAK Espaços de $game_concept_domicile_building_slot$ bloqueados são mostrados na visão do $game_concept_domicile$ — não há como obter espaços de $game_concept_domicile_building_slot$ adicionais além destes.#!"
 game_concept_domicile_building_slot_slot:0 "Espaço"
 game_concept_domicile_building_slot_slots:0 "Espaços"
 game_concept_domicile_building_slots:0 "Espaços de $game_concept_domicile_building$"
 game_concept_domicile_building_upgrade:0 "Melhoria Interna"
 game_concept_domicile_building_upgrade_desc:0 "Alguns $game_concept_domicile_buildings$ podem ser melhorados com $game_concept_internal_upgrades$.\n\nUma Melhoria, embora semelhante a outros $game_concept_domicile_buildings$, só pode ser construída dentro de um edifício específico. Cada edifício com acesso a Melhorias tem seu próprio conjunto único de Melhorias disponíveis."
 game_concept_domicile_buildings:0 "Edifícios Domiciliares"
 game_concept_domicile_desc:0 "Um $game_concept_domicile$ é a propriedade privada de certos [characters|E] que possuem uma determinada [government_form|E], como [administrative|E] e [adventurer|E].\n\nO $game_concept_domicile$ funciona como a principal base de poder do proprietário em vez das [holdings|E], e pode ser melhorado com [domicile_buildings|E].\n\nCada $game_concept_domicile$ está localizado dentro de um [barony|E] designada e pode ser movido para um novo local. Restrições podem se aplicar dependendo do Tipo de $game_concept_domicile$.\n\nCada $game_concept_domicile$ possui um [title|E] especial sem terras e segue sua [succession|E]."
 game_concept_domicile_travel_speed:0 "Velocidade de Viagem do [domicile|E]"
 game_concept_domiciles:0 "Domicílios"
 game_concept_dominant:0 "Dominante"
 game_concept_dominant_families:0 "Famílias Dominantes"
 game_concept_dominant_family:0 "Família Dominante"
 game_concept_dominant_family_desc:0 "Uma $game_concept_dominant_family$ é uma [powerful_family|E] que expandiu seu controle amplamente. É considerada a [house|E] mais influente dentro de um [realm|E].\n\nUm membro de uma $game_concept_dominant_family$ é ainda mais habilidoso em [political_schemes|E] e tem ainda mais chances de conseguir o que deseja ao [interacting|E] com outros [characters|E].\n\nUma $game_concept_house$ deve controlar pelo menos [EmptyScope.ScriptValue('dominant_family_threshold_value')|V0%] do Reino para se tornar Dominante."
 game_concept_ep3_become_landless_adventurer_decision:0 "Decisão de $become_landless_adventurer_decision$"
 game_concept_ep3_become_landless_adventurer_decision_desc:0 "Uma [decision|E] desbloqueada por certas [traditions|E] que permite a um [ruler|E] de um pequeno [realm|E] deixar voluntariamente e se tornar um [adventurer|E]."
 game_concept_ep3_laamp_adventurer_invasion_war:0 "$EP3_LAAMP_INVASION_CB_NAME$"
 game_concept_ep3_laamp_adventurer_invasion_war_desc:0 "Um [casus_belli|E] que permite a um [adventurer|E] declarar [war|E] para tentar criar um novo [realm|E]."
 game_concept_ep3_negotiate_settlement_interaction:0 "$negotiate_settlement_interaction$"
 game_concept_ep3_negotiate_settlement_interaction_desc:0 "Uma [interaction|E] que permite a um [ruler|E] conceder a um [adventurer|E] desordeiro um assentamento em seu [realm|E]."
 game_concept_ep3_purchase_land_interaction:0 "$purchase_land_interaction$"
 game_concept_ep3_purchase_land_interaction_desc:0 "Uma [interaction|E] que permite a um [adventurer|E] comprar terras de um [ruler|E] e se estabelecer em seu [realm|E]."
 game_concept_estate:0 "Propriedade"
 game_concept_estate_building:0 "Edifício de Propriedade"
 game_concept_estate_building_desc:0 "$game_concept_estate_buildings$ são melhorias únicas e persistentes de [estate|E] de uma [noble_family_possessive|E].\n\nUma grande variedade de estruturas está disponível para construção e pode ser construída pelo proprietário da Propriedade para gerar renda privada, expandir a [influence|E] da família e ganhar acesso a uma série de [decisions|E], [interactions|E] e mais."
 game_concept_estate_buildings:0 "Edifícios de Propriedade"
 game_concept_estate_desc:0 "Uma $game_concept_estate$ é um tipo de [domicile|E] mantido pelo [house_head|E] de notáveis [noble_families|E] dentro de um [realms|E] [administrative|E]. Elas representam propriedades privadas não vinculadas a nenhum [title|E] de [land|E] específico.\n\n[estate_buildings|E] podem ser construídos aqui para expandir a riqueza e [influence|E] da família, e a $game_concept_estate$ será herdada por gerações futuras."
 game_concept_estates:0 "Propriedades"
 game_concept_family_attribute:0 "Atributo da Família"
 game_concept_family_estate:0 "Propriedade Familiar"
 game_concept_family_estates:0 "Propriedades Familiares"
 game_concept_follower:0 "Seguidor"
 game_concept_follower_desc:0 "Um $game_concept_follower$ é um [character|E] [unlanded|E] que acompanha um [adventurer|E].\n\nMecanicamente, eles são equivalentes aos [courtiers|E], embora estejam sob menos obrigação de mostrar respeito ou permanecer se não gostarem de seu líder.\n\nA [opinion|E] coletiva dos $game_concept_followers$ de um personagem determina seu [camp_temperament|E].\n\n$game_concept_followers$ podem:\n$BULLET_WITH_TAB$Servir como [officers|E]\n$BULLET_WITH_TAB$Servir em [armies|E] como [commanders|E] ou [knights|E]\n$BULLET_WITH_TAB$Deixar seu [adventurer|E] pressionar suas [claims|E] em [war|E]"
 game_concept_followers:0 "Seguidores"
 game_concept_following:0 "Seguindo"
 game_concept_governance_issue:0 "$TASK_CONTRACT_ISSUE$"
 game_concept_governance_issue_desc:0 "Um $game_concept_governance_issue$ é uma tarefa para um [governor|E] realizar.\n\nA questão aparece em uma [province|E] a cada poucos anos, e frequentemente envolve um problema que o $game_concept_governor$ deve resolver. No entanto, as questões também podem apresentar oportunidades.\n\nResolver questões com sucesso geralmente recompensa com [gold|E], [influence|E] e experiência no [trait|E] [GetTrait('governor').GetName(GetNullCharacter)]. Dependendo da questão em questão, outras recompensas podem estar disponíveis também.\n\nCada $game_concept_governance_issue$ tem um [governance_issue_tier_tier|E] que afeta as recompensas que fornece."
 game_concept_governance_issue_i:0 "@task_contract_icon!"
 game_concept_governance_issue_possessive:0 "$TASK_CONTRACT_ISSUE_POSSESSIVE$"
 game_concept_governance_issue_tier:0 "$TASK_CONTRACT_ISSUE$ Tier"
 game_concept_governance_issue_tier_desc:0 "Cada [governance_issue|E] tem um $game_concept_governance_issue_tier$, que reflete as recompensas gerais de uma questão quando resolvida com sucesso. Resolver uma questão com um tier mais alto normalmente resultará em maiores quantidades de [gold|E] ou [influence|E], além de uma maior quantidade de experiência ganha no [trait|E] [GetTrait('governor').GetName(GetNullCharacter)]."
 game_concept_governance_issue_tier_i:0 "@task_contract_tier_icon!"
 game_concept_governance_issue_tier_tier:0 "Tier"
 game_concept_governance_issues:0 "$TASK_CONTRACT_ISSUE_PLURAL$"
 game_concept_governance_issues_possessive:0 "$TASK_CONTRACT_ISSUE_POSSESSIVE_PLURAL$"
 game_concept_governed:0 "Governado"
 game_concept_governor:0 "Governador"
 game_concept_governor_desc:0 "Um $game_concept_governor$ é o vassalo primário de um [liege|E] com um [government_bureaucratic_gov|E]. Eles são nomeados por seu Senhor Feudal para presidir sobre as terras dentro do [realm|E], utilizando sua [governor_efficiency|E].\n\nO [title|E] de um $game_concept_governor$, bem como os [counties|E] que ele inclui, é referido como uma [province|E]. [governance_issues|E] podem aparecer dentro de uma Província, que o $game_concept_governor$ deve resolver.\n\nOs $game_concept_governors$ podem acumular [influence|E] e manipular a [succession|E] de outras $game_concept_governorships$."
 game_concept_governor_efficiency:0 "Eficiência do Governador"
 game_concept_governor_efficiency_desc:0 "$game_concept_governor_efficiency$ é uma medida de quão bom um [governor|E] é em seu trabalho e quão bem ele gerencia as [holdings|E] aos quais está atribuído.\n\nA eficiência afeta quanto [taxes|E] e [levies|E] uma $game_concept_holding$ fornece, e a eficácia dos [title_men_at_arms|E].\n\nA $game_concept_governor_efficiency$ de um personagem é principalmente decidida por suas [skills|E] e pelo [trait|E] [GetTrait('governor').GetName( GetNullCharacter )]."
 game_concept_governor_efficiency_i:0 "@governor_efficiency!"
 game_concept_governor_possessive:0 "do Governador"
 game_concept_governors:0 "Governadores"
 game_concept_governors_possessive:0 "do Governadores"
 game_concept_governorship:0 "Governadoria"
 game_concept_governorships:0 "Governadorias"
 game_concept_hireling_task_contract:0 "Contrato de Mercenário"
 game_concept_hireling_task_contract_desc:0 "Um $game_concept_hireling_task_contract$ geralmente envolve trabalhos de força contratada, como proteger governantes, mercadores e reforçar guarnições."
 game_concept_hireling_task_contract_possessive:0 "do Contrato de Mercenário"
 game_concept_hireling_task_contracts:0 "Contratos de Mercenário"
 game_concept_hireling_task_contracts_possessive:0 "dos Contratos de Mercenário"
 game_concept_house_attribute:0 "Atributo da Casa"
 game_concept_house_attribute_desc:0 "Em certos [governments|E], [houses|E] podem ter um $game_concept_house_attribute$ que afeta os membros da Casa.\n\nOs diferentes Atributos da Casa são:\n$EFFECT_LIST_BULLET$[powerful_family_attribute|E]\n$EFFECT_LIST_BULLET$[house_aspiration|E]\n$EFFECT_LIST_BULLET$[mandala_aspect|E]"
 game_concept_hunting_task_contract:0 "Contrato de Caça"
 game_concept_hunting_task_contract_desc:0 "Um $game_concept_hunting_task_contract$ normalmente envolve ajudar o governante local a eliminar a vida selvagem e ajudar a reforçar os suprimentos."
 game_concept_hunting_task_contract_possessive:0 "do Contrato de Caça"
 game_concept_hunting_task_contracts:0 "Contratos de Caça"
 game_concept_hunting_task_contracts_possessive:0 "dos Contratos de Caça"
 game_concept_imperial:0 "Imperial"
 game_concept_imperial_bureaucracy:0 "Burocracia Imperial"
 game_concept_imperial_bureaucracy_desc:0 "$game_concept_imperial_bureaucracy$ representa um nível de centralização [administrative|E] dos [realms|E] e o poder geral que o [ruler|E] exerce sobre seus [vassals|E].\n\nApenas o [top_liege|E] pode mudar o $game_concept_imperial_bureaucracy$. Os $game_concept_vassals$ administrativos usam o mesmo nível que seu $game_concept_liege$.\n\nExistem quatro níveis de $game_concept_imperial_bureaucracy$:\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_0$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_1$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_2$\n$EFFECT_LIST_BULLET$$imperial_bureaucracy_3$\n\nAumentar o $game_concept_imperial_bureaucracy$ custa uma quantidade de [prestige|E] dependendo do [realm_size|E] e da [learning_skill|E] do governante."
 game_concept_imperial_families:0 "Famílias Imperiais"
 game_concept_imperial_family:0 "Família Imperial"
 game_concept_imperial_family_desc:0 "A $game_concept_imperial_family$ é a principal [house|E] em um [realm|E] [administrative|E]."
 game_concept_influence:0 "Influência"
 game_concept_influence_desc:0 "$game_concept_influence$ representa o alcance e a autoridade política de [character_possessive|E] em um [realm|E] que tem o [administrative_government|E].\n\n$game_concept_influence$ é uma ferramenta essencial e pode ser adquirida de várias maneiras. Por exemplo, tornando-se um [governor|E], melhorando um [estate|E] ou sendo aliado ao [house_head|E] de uma [noble_family|E].\n\nA principal maneira de gastar e utilizar o $game_concept_influence$ é adquirir uma [governorship|E], mas também é um recurso valioso para persuadir outros Personagens a fazer sua vontade.\n\nToda vez que um Personagem ganha $game_concept_influence$, ele também avança em direção ao seu próximo [influence_level|E]."
 game_concept_influence_i:0 "@influence_icon!"
 game_concept_influence_level:0 "Nível de Influência"
 game_concept_influence_level_desc:0 "Um Nível de Influência do [character|E] mede seu poder político geral e alcance.\n\nCada vez que um Personagem ganha [influence|E], ele também ganha progresso em direção ao próximo $game_concept_influence_level$.\n\nOs Níveis são:\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'influence_level_5' ).GetNameWithTooltip|L]"
 game_concept_influence_level_impact:0 "Impacto do Nível de Influência"
 game_concept_influence_level_impact_desc:0 "O Impacto do Nível de Influência aumenta ou diminui os [modifiers|E] obtidos do seu atual [influence_level|E]."
 game_concept_influence_levels:0 "Níveis de Influência"
 game_concept_influential:0 "Influente"
 game_concept_internal_upgrades:0 "Melhorias Internas"
 game_concept_intrigue_task_contract:0 "Contrato de Intriga"
 game_concept_intrigue_task_contract_desc:0 "Um $game_concept_intrigue_task_contract$ normalmente envolve assistência em questões que vão de reconhecimento a fugas."
 game_concept_intrigue_task_contract_possessive:0 "do Contrato de Intriga"
 game_concept_intrigue_task_contracts:0 "Contratos de Intriga"
 game_concept_intrigue_task_contracts_possessive:0 "dos Contratos de Intriga"
 game_concept_investment_cap:0 "Capacidade de Investimento"
 game_concept_investment_cap_desc:0 "Este é o máximo que um personagem pode investir em seu próprio ou no [candidate_score|E] de outra pessoa para um [governorship|E].\n\nIdade, [powerful_family_rating_mid|E], [influence_level|E] e [estate_buildings|E] são os principais fatores que determinam esse limite. Crianças têm uma pequena penalização escalonada a esse limite, enquanto os limites dos adultos aumentam à medida que envelhecem."
 game_concept_justicar_task_contract:0 "Contrato de Justiciar"
 game_concept_justicar_task_contract_desc:0 "Um $game_concept_justicar_task_contract$ normalmente envolve eliminar criminosos enquanto traz justiça e adere à lei local."
 game_concept_justicar_task_contract_possessive:0 "do Contrato de Justiciar"
 game_concept_justicar_task_contracts:0 "Contratos de Justiciar"
 game_concept_justicar_task_contracts_possessive:0 "dos Contratos de Justiciar"
 game_concept_learning_task_contract:0 "Contrato de Aprendizado"
 game_concept_learning_task_contract_desc:0 "Um $game_concept_learning_task_contract$ normalmente envolve copiar textos ou facilitar ações de solidariedade."
 game_concept_learning_task_contract_possessive:0 "do Contrato de Aprendizado"
 game_concept_learning_task_contracts:0 "Contratos de Aprendizado"
 game_concept_learning_task_contracts_possessive:0 "dos Contratos de Aprendizado"
 game_concept_mercenary_task_contract:0 "Contrato de Mercenário"
 game_concept_mercenary_task_contract_desc:0 "Um $game_concept_mercenary_task_contract$ envolve ajudar um [character|E] em uma [war|E] em andamento, ou em uma que pretendem iniciar com sua ajuda. O pagamento é baseado na [war_contribution|E], bem como no resultado real."
 game_concept_mercenary_task_contract_possessive:0 "do Contrato de Mercenário"
 game_concept_mercenary_task_contracts:0 "Contratos de Mercenário"
 game_concept_mercenary_task_contracts_possessive:0 "dos Contratos de Mercenário"
 game_concept_noble_families:0 "Famílias Nobres"
 game_concept_noble_family:0 "Família Nobre"
 game_concept_noble_family_desc:0 "As $game_concept_noble_families$ são poderosas [houses|E] em um [realm|E] [administrative|E]. Elas possuem um [estate|E], controlado e gerenciado pelo [house_head|E], e permanecem uma parte integral do Reino em todos os momentos, pois tentarão reunir [influence|E] e assegurar [provinces|E] para si mesmas.\n\nUma $game_concept_noble_family$ influente pode se tornar uma [powerful_family|E] ou uma [dominant_family|E]."
 game_concept_noble_family_possessive:0 "da Família Nobre"
 game_concept_officer:0 "Oficial"
 game_concept_officer_desc:0 "$game_concept_officers$ são funções especializadas que [followers|E] podem receber para ajudar seu [camp|E].\n\nMecanicamente, eles operam de forma muito semelhante a [court_positions|E]. Assim como eles, os benefícios que você obtém dos $game_concept_officers$ são determinados pela [aptitude|E] do detentor para a posição.\n\nDiferente dos $game_concept_court_positions$, nomear $game_concept_officers$ é gratuito e eles não recebem um salário mensal, embora revogá-los ainda custe [prestige|E].#!\n\n#WEAK Os $game_concept_officers$ são desbloqueados por muitos [camp_buildings|E].#!"
 game_concept_officers:0 "Oficiais"
 game_concept_powerful:0 "Poderoso"
 game_concept_powerful_families:0 "Famílias Poderosas"
 game_concept_powerful_family:0 "Família Poderosa"
 game_concept_powerful_family_attribute:0 "Atributo de Família Poderosa"
 game_concept_powerful_family_attribute_desc:0 "Um $game_concept_powerful_family_attribute$ é um conjunto de bônus associado a uma [house|E] dentro de um [realm|E] [administrative|E]. O Atributo beneficia os membros da $game_concept_house$, assim como o [liege|E].\n\nOs Atributos só estão ativos enquanto a $game_concept_house$ for considerada uma [powerful_family|E], e o $game_concept_family_attribute$ de uma [dominant_family|E] não beneficia seu [liege|E].\n\nO [house_head|E] pode substituir livremente o Atributo a qualquer momento."
 game_concept_powerful_family_desc:0 "Uma $game_concept_powerful_family$ representa uma das [houses|E] e [noble_families|E] mais influentes em um [realm|E] [administrative|E].\n\nUm membro de uma $game_concept_powerful_family$ é mais habilidoso em [political_schemes|E] e tem mais chances de conseguir o que deseja ao [interacting|E] com outros [characters|E].\n\nSó pode haver um número limitado de $game_concept_powerful_families$ a qualquer momento, e são as $game_concept_noble_families$ mais bem avaliadas que são consideradas poderosas com base em seu [powerful_family_rating_short|E]. A Casa do [top_liege|E] é uma exceção, sendo sempre considerada Poderosa.\n\nUma Família que controla uma parte significativa das terras de um Reino pode se tornar uma [dominant_family|E]."
 game_concept_powerful_family_rating:0 "Classificação de Família Poderosa"
 game_concept_powerful_family_rating_desc:0 "$game_concept_powerful_family_rating$ é uma medida de quão influente uma [powerful_family|E] é.\n\nEmbora existam muitas maneiras de aumentar a $game_concept_powerful_family_rating_short$ de uma Família, o principal fator é o número de [governorships|E] detidos.\n\nUma [house|E] deve ter uma $game_concept_powerful_family_rating_short$ de pelo menos [GetDefine('NHouse', 'POWERFUL_HOUSE_MINIMUM_POWER')|V0] para ser considerada Poderosa."
 game_concept_powerful_family_rating_mid:0 "Classificação da Família"
 game_concept_powerful_family_rating_short:0 "Classificação"
 game_concept_province:0 "Província"
 game_concept_province_administration:0 "Administração da Província"
 game_concept_province_administration_desc:0 "Cada [province|E] de um [realm|E] [administrative|E] possui uma $game_concept_province_administration$, que pode ser definido pelo [liege|E] e pelo [governor|E] para especializar a Província.\n\nApenas uma $game_concept_province_administration$ pode estar ativo por Província."
 game_concept_province_administration_short:0 "Administração"
 game_concept_province_administrations:0 "Administrações de Província"
 game_concept_province_desc:0 "Uma $game_concept_province$ é um [title|E] detido por um [governor|E] dentro de um [realm|E] com o [administrative_government|E].\n\nUma Província possui uma [province_administration|E] associada que impacta significativamente os benefícios que a Província fornece."
 game_concept_provinces:0 "Províncias"
 game_concept_provincial:0 "Provincial"
 game_concept_provincial_armies:0 "Exércitos Provinciais"
 game_concept_provincial_army:0 "Exército Provincial"
 game_concept_provincial_army_desc:0 "Um Exército Provincial é um exército recrutado e mantido por um [governor|E] em um [realm|E] com o [government|E] [administrative|E].\n\nEles são compostos exclusivamente por [title_men_at_arms|E]. A eficácia dos [men_at_arms|E] é afetada pela [governor_efficiency|E] do [governor].\n\nO [liege|E] pode gastar [influence|E] para ganhar controle sobre os Exércitos.\n\nOs [governors] podem tomar tropas emprestadas de seus pares em certas circunstâncias, como sendo [allies|E] ou usando um [hook|E].\n\nUm Exército emprestado é devolvido se o [character] que o tomou emprestado morrer ou quando ele terminar todas as [wars|E] em andamento. Exércitos também podem ser devolvidos manualmente."
 game_concept_reinforce_soldiers:0 "Reforçar Manualmente"
 game_concept_reinforce_soldiers_desc:0 "[adventurers|E] e [nomads|E] podem recrutar [men_at_arms|E], mas eles não se reforçam automaticamente como o [ruler|E] [landed|E]. Em vez disso, os recrutas devem ser atraídos usando interações."
 game_concept_reinforcements:0 "Reforços"
 game_concept_seize_peripheral_duchy:0 "Tomar Ducado Periférico"
 game_concept_seize_peripheral_duchy_desc:0 "Um [casus_belli|E] disponível para [rulers|E] que fazem fronteira com um [realm|E] governado por uma [government_form|E] [government_bureaucratic_type|E].\n\nPermite ao atacante tomar um [duchy|E] vizinho que esteja fora da hierarquia [de_jure|E] da capital do defensor."
 game_concept_stewardship_task_contract:0 "Contrato de Administração"
 game_concept_stewardship_task_contract_desc:0 "Um $game_concept_stewardship_task_contract$ normalmente envolve realizar um censo ou até mesmo construir edifícios."
 game_concept_stewardship_task_contract_possessive:0 "do Contrato de Administração"
 game_concept_stewardship_task_contracts:0 "Contratos de Administração"
 game_concept_stewardship_task_contracts_possessive:0 "dos Contratos de Administração"
 game_concept_strategoi:0 "Estratégoi"
 game_concept_strategoi_possessive:0 "dos Estratégoi"
 game_concept_strategos:0 "Estratégos"
 game_concept_strategos_possessive:0 "do Estratégos"
 game_concept_task_contract:0 "Contrato"
 game_concept_task_contract_desc:0 "$game_concept_task_contracts$ são a principal forma que os [adventurers|E] têm de ganhar [gold|E] ou [prestige|E]. Eles também podem premiar [provisions|E], [piety|E] e até mesmo [artifacts|E].\n\nCada um é uma tarefa colocada por um [ruler|E] local — geralmente exigindo que o $game_concept_adventurer$ realize um [scheme|E], complete uma [travel|E] ou os ajude em uma [war|E] — e pode ser realizado por uma recompensa e para colocar o [contractor|E] na [contact_list|E].\n\nMais $game_concept_task_contracts$ são gerados ao viajar longas distâncias ou para novos [kingdoms|E].\n\nQuanto maior o [title_tier|E] ou o $game_concept_ruler$ que oferece um $game_concept_task_contract$, maior será o [task_contract_tier_tier|E] do $game_concept_task_contract_possessive$. Tiers mais altos pagam #EMP substancialmente#! melhor.\n\n#alert_trial Cuidado com [criminal_task_contracts|E]: suas recompensas são frequentemente excelentes, mas o mundo tem muito menos compreensão para os crimes menores de um vagrante sem-teto do que para um [liege|E] [landed|E].#!"
 game_concept_task_contract_possessive:0 "do Contrato"
 game_concept_task_contract_tier:0 "$TASK_CONTRACT_CONTRACT$ Tier"
 game_concept_task_contract_tier_desc:0 "$game_concept_task_contract_tier$ é reflexo do [title_tier|E] do [contractor|E].\n\n[barons|E] e [counts|E] são de uma estrela, [dukes|E] são de duas estrelas, e [kings|E] e [emperors|E] são de três estrelas.\n\n$game_concept_contractors$ não oferecerão trabalho a [adventurers|E] com [prestige_level|E] insuficiente para sua [rank|E]. Se você é #EMP apenas#! [GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L], então [kings|E] e [emperors|E] nem mesmo considerarão você.\n\nQuanto maior o $game_concept_task_contract_tier$, maior será o pagamento — embora a dificuldade da tarefa geralmente também seja maior.\n\n#WEAK [personality|E] também afeta o pagamento: [GetTrait('greedy').GetName( GetNullCharacter )] [characters|E] pagarão abaixo da média, enquanto [GetTrait('generous').GetName( GetNullCharacter )] ou [GetTrait('profligate').GetName( GetNullCharacter )] $game_concept_characters$ pagarão muito mais do que isso.#!"
 game_concept_task_contract_tier_i:0 "@task_contract_tier_icon!"
 game_concept_task_contract_tier_tier:0 "Tier"
 game_concept_task_contracts:0 "Contratos"
 game_concept_task_contracts_i:0 "@task_contract_icon!"
 game_concept_task_contracts_possessive:0 "dos Contratos"
 game_concept_thematic:0 "Temático"
 game_concept_thematic_armies:0 "Exércitos Temáticos"
 game_concept_thematic_army:0 "Exército Temático"
 game_concept_theme:0 "Tema"
 game_concept_theme_administration:0 "Administração de Tema"
 game_concept_theme_administrations:0 "Administrações de Tema"
 game_concept_themes:0 "Temas"
 game_concept_title_men_at_arms:0 "Título de Homens de Armas"
 game_concept_title_men_at_arms_desc:0 "$game_concept_title_men_at_arms$ são [men_at_arms|E] que existem para um dado [title|E]. Em vez de serem possuídos pessoalmente pelo [ruler|E], essas tropas sempre seguem o $game_concept_title$ ao qual pertencem. Isso significa que quem possui o $game_concept_title$ também possui e controla as tropas correspondentes.\n\n$game_concept_title_men_at_arms$ são usados por certas [government_forms|E], como [administrative|E]."
 game_concept_transport_task_contract:0 "Contrato de Transporte"
 game_concept_transport_task_contract_desc:0 "Um $game_concept_transport_task_contract$ normalmente envolve transportar bens, como [artifacts|E], ou escoltar personagens importantes como [wards|E] por distâncias intermediárias."
 game_concept_transport_task_contract_possessive:0 "do Contrato de Transporte"
 game_concept_transport_task_contracts:0 "Contratos de Transporte"
 game_concept_transport_task_contracts_possessive:0 "dos Contratos de Transporte"
 game_concept_treasure_map_task_contract:0 "Contrato de Mapa do Tesouro"
 game_concept_treasure_map_task_contract_desc:0 "Leve um velho e desgastado aventureiro para encontrar seu tesouro final."
 game_concept_treasure_map_task_contract_possessive:0 "do Contrato de Mapa do Tesouro"
 game_concept_treasure_map_task_contracts:0 "Contratos de Mapa do Tesouro"
 game_concept_treasure_map_task_contracts_possessive:0 "dos Contratos de Mapa do Tesouro"
