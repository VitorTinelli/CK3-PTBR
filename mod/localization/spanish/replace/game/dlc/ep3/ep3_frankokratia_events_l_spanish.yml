l_spanish:
 1_byzantine_regiment_given_over_tooltip:0 "#high 1#! [regiment|E] de [men_at_arms|E] [claimant.GetPrimaryTitle.GetAdjective] foi destruído"
 2_byzantine_regiments_given_over_tooltip:0 "#high 2#! [regiments|E] de [men_at_arms|E] [claimant.GetPrimaryTitle.GetAdjective] foram destruídos"
 BLACHERNAE_PALACE_GLOSS:0 "Construído perto das Muralhas Teodosianas c. 500 d.C., este complexo palaciano em terraços foi cada vez mais utilizado durante a Alta Idade Média como a principal residência imperial."
 HERAKLEIOS_GLOSS:0 "O #bold imperador Herakleios do século VII#! enfrentou crises militares durante grande parte de seu reinado, lutando contra os persas sasânidas e o califado rashidun. Ele implementou reformas cruciais que permitiram à ênfase do Império Bizantino sobreviver."
 SERAPHIM_GLOSS:0 "Uma ordem de seres celestiais presentes em todas as tradições abraâmicas; no cristianismo, os #bold serafins#! têm seis asas e pertencem à mais alta ordem de anjos."
 THRONE_OF_SOLOMON_GLOSS:0 "O suposto trono do Rei Salomão, o rei mais sábio do antigo Israel, é um dos objetos salomônicos mantidos pela corte imperial de Bizâncio."
 TROJANS_FRANKOKRATIA_GLOSS:0 "Através da lenda da fuga de Eneias de Tróia, os latinos medievais traçaram sua linhagem até aquela cidade lendária; a vingança por esses supostos ancestrais foi uma motivação reivindicada para o ataque a Bizâncio grego."
 abandon_crusade_emp_tooltip:0 "@alert_icon! #alert_trial Quando a [great_holy_war|E] [GetFaithByKey('catholic').GetAdherentName|U] for iniciada, os Atacantes envolvidos serão removidos dela#!"
 abandon_crusade_tooltip:0 "@alert_icon! #alert_trial Quando a [great_holy_war|E] começar, você e outros Atacantes voluntários serão removidos dela#!"
 abandoned_crusade_general_tooltip:0 "@alert_icon! #alert_trial [byz_claimant_champion.GetShortUIName] e outros Atacantes deixaram a [great_holy_war|E] [GetFaithByKey('catholic').GetAdjective]#!"
 become_daddy_2_vassal_tt:0 "Você se tornará [vassal|E] de #high [daddy_2.GetName]#!"
 become_daddys_vassal_tt:0 "Você se tornará [vassal|E] de #high [daddy.GetName]#!"
 bent_before_crusaders_modifier:0 "Curvado Diante dos Cruzados"
 bent_before_crusaders_modifier_desc:0 "Em vez de deixar de cumprir promessas impossíveis, este personagem pagou dívidas saqueando seu próprio reino."
