 continue_frankokratia_crusade_tooltip:0 "Você continua redirecionando os Cruzados para [byz_emperor.GetPrimaryTitle.GetNameNoTier]"
 crippled_by_imperial_debt_modifier:0 "Dificultado por Medidas Imperiais"
 crippled_by_imperial_debt_modifier_desc:0 "Tropas locais foram enviadas embora e o serviço civil esvaziado. As praças do mercado estão silenciosas."
 crusade_claim_lose_tooltip:0 "[defender.GetShortUIName|U] ganhou o #high $CRUSADING_CLAIM_CB_NAME$#!"
