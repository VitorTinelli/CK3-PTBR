 crusaders_may_be_paid_tooltip:0 "Você pode ser recompensado com @gold_icon![gold|E], @piety_icon![piety|E] e [special_troops|E]"
 crusading_claim_crusader_rewards_tooltip:0 "#high Atacantes#! são recompensados a critério de [claimant.GetShortUIName]"
 crusading_claim_gain_byz_emp_tooltip:0 "[claimant.GetShortUIName] obtém [GetTitleByKey('e_byzantium').GetName] e menores [titles|E]"
 cultural_acceptance_latins_legitimized:0 "[GetTitleByKey('e_latin_empire').GetName] estabeleceu domínio legítimo"
 custom.every_county_latin_kingdom:0 "Cada [county|E] deste [kingdom|E]"
 custom.every_realm_county:0 "Cada [county|E] em seu [realm|E]"
 custom.greek_anarchy_rulers:0 "Todo [ruler|E] com terras [GetTitleByKey('e_latin_empire').GetAdjective] ou [GetTitleByKey('e_byzantium').GetAdjective]"
 custom.post_byz_greeks:0 "Todo Ex-[vassal|E] [GetTitleByKey('e_byzantium').GetAdjective]"
 despoiler_of_byzantium_tooltip:0 "Ganhou o [trait|E] #high [GetTrait('despoiler_of_byzantium').GetName( GetNullCharacter )]#!"
 eager_for_empire_modifier:0 "Ansioso pelo Império"
 eager_for_empire_modifier_desc:0 "Este aspirante está encorajado por sonhos de majestade imperial bizantina; fortalecido pela pura convicção, e protegido de perto por seus benfeitores."
 egregious_trading_rights_modifier:0 "Direitos Comerciais Egregios"
 egregious_trading_rights_modifier_desc:0 "Como parasitas famintos, comerciantes empoderados por direitos usurários sufocam os mercados locais em benefício próprio."
 emulating_byz_punishment_tt:0 "Imperadores [GetTitleByKey('e_latin_empire').GetAdjective] e seus [vassals|E] podem Castrar ou Cegar [prisoners|E]"
 end_frankokratia_crusade_war_tooltip:0 "@alert_icon! #alert_trial Você não atacará [byz_emperor.GetPrimaryTitle.GetNameNoTier] ou redirecionará qualquer Cruzado#!"
 ep3_frankokratia.0041_effects_from_a_tooltip:0 "@warning_icon! #X Os efeitos da primeira opção se desenrolam"
 ep3_frankokratia_crusader_joining:0 "Cruzado Pede ao Reivindicador"
 ep3_frankokratia_events.0001.a.crit_success:0 "[ghw_sponsor.GetTitledFirstNameNoTooltip] abençoa seu plano inteligente"
 ep3_frankokratia_events.0001.a.failure:0 "[ghw_sponsor.GetTitledFirstNameNoTooltip] condena seu plano perigoso"
 ep3_frankokratia_events.0001.a.flavor:0 "Esses cristãos desafiando a autoridade do Santo Padre! Seria tão errado usar nossos peregrinos contra eles...?"
 ep3_frankokratia_events.0001.a.success:0 "[ghw_sponsor.GetTitledFirstNameNoTooltip] aceita, para remendar o Cisma"
 ep3_frankokratia_events.0001.a:0 "Uma empreitada inteligente! Que o Papa certamente abençoará."
 ep3_frankokratia_events.0001.b.flavor:0 "Os líderes dos exércitos de Deus podem tomar suas próprias decisões. Pois eles, e não o Papa, serão os primeiros a desembarcar em Bizâncio."
 ep3_frankokratia_events.0001.b:0 "Farei os cruzados jurarem pessoalmente por esta causa."
 ep3_frankokratia_events.0001.c.flavor:0 "E uma traição mais ímpia mal pode ser imaginada!"
 ep3_frankokratia_events.0001.c:0 "Uma noção desastrosamente tola."
 ep3_frankokratia_events.0001.crusader_intro:0 "Nós, peregrinos armados para a terra além-mar, contratamos [financier.GetPrimaryTitle.GetNameNoTier] para construir nossos navios... uma empreitada caríssima, e devotada a uma empresa incerta."
 ep3_frankokratia_events.0001.desc:0 "\n\n\"Um desperdício terrível!\" lamenta [byz_claimant.GetFirstName], [Select_CString( byz_claimant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('byz_claimant'))]. \"Os cavaleiros latinos mais valentes, empobrecidos — forçados a sofrer perante os infiéis! Como os [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )] poderiam ajudá-los...\" \n\nComo um pretendente [byz_emperor.GetPrimaryTitle.GetAdjective], [byz_claimant.GetFirstNameNoTooltip] fala diretamente sobre os #EMP Romaioi#!. Talvez... se nossos cruzados marchassem em nome [byz_claimant.GetHerHim], sua causa poderia ser fortalecida por soldados gregos e generosos presentes imperiais? Será que uma Cruzada tão heterodoxa serviria melhor à missão de Cristo... e Seus guerreiros cristãos?"
 ep3_frankokratia_events.0001.non_crusader_intro:0 "Chegaram notícias da Cruzada. Aqueles comprometidos contrataram [financier.GetPrimaryTitle.GetNameNoTier] para construir seus navios... uma empreitada caríssima, e devotada a uma empresa incerta."
 ep3_frankokratia_events.0001.t:0 "A Desapropriação Injusta"
 ep3_frankokratia_events.0002.a:0 "Bem... para Bizâncio, eu vou!"
 ep3_frankokratia_events.0002.b:0 "Eu me arrependo, Santo Padre! #EMP Eu me arrependo da minha tolice!#!"
 ep3_frankokratia_events.0002.desc_condemns:0 "Você realmente — da proteção do descendente de São Pedro — arrancaria a espada de Gabriel? Você, desprovido de amor filial e piedade cristã, cravaria essa lâmina santíssima nos peitos de seus irmãos gregos?\n\nIsso é uma abominação que você considera. Nenhum cristão deveria ser ferido pelas mãos de peregrinos."
 ep3_frankokratia_events.0002.desc_endorses:0 "Com orgulho pecaminoso, os prelados dos gregos desprezam o representante escolhido do Senhor na Terra. Portanto, em Seu nome divino, ordeno que você reúna os soldados Dele atrás de si, para conquistar a vitória, e nomear um novo e justo soberano no leste.\n\nSe Deus quiser, por seus esforços, os fiéis poderão um dia reivindicar todas as terras além-mar."
 ep3_frankokratia_events.0002.desc_wasnt_asked:0 "Deus pune aqueles que, como Lúcifer, presumem sobre os reinos e impérios de Sua luz — mas Ele recompensa os constantes. O que começou entre Seus Cruzados, não desfarei.\n\nMas você dependerá da absolvição santa para o derramamento de sangue cristão. Proceda sabiamente e nobremente ao serviço de Cristo, e poderá recebê-la; ore enquanto estiver diante dos gregos."
 ep3_frankokratia_events.0002.opening:0 "Ousadíssim[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('GetDaughterSon')] de Cristo,"
 ep3_frankokratia_events.0003.a:0 "Nossa promessa pela sua, que assim seja."
 ep3_frankokratia_events.0003.desc:0 "Aqueles que carregam a cruz têm muitos navios recém-construídos de [financier.GetPrimaryTitle.GetAdjective] à sua disposição — mas não podem arcar justamente com seu custo. Convenci nosso Conselho a buscar pagamento por outros meios.\n\nPrometa-nos compensação do tesouro imperial ou com terras imperiais. Se o fizer, nossos navios levarão seus $knight_culture_player_plural_no_tooltip_lowercase$ através do mar. Nossos bravos marinheiros escalarão as muralhas de seus inimigos. Logo os gregos lamentarão o desprezo por nós!"
 ep3_frankokratia_events.0003.opening:0 "Inimigo de [byz_emperor.GetTitleAsNameNoTooltip],"
 ep3_frankokratia_events.0004.a.flavor:0 "Talvez um assassinato brutal desanuvie seus olhos? Certamente, isso deixará os latinos sem motivo para nos atacar."
 ep3_frankokratia_events.0004.a:0 "Suponho... [byz_claimant.GetFirstNameNoTooltip] precisa morrer."
 ep3_frankokratia_events.0004.b.flavor:0 "Enquanto isso, os Bispos de Roma ficam cada vez mais intoxicados por suas próprias falsidades... enganando gravemente seu rebanho selvagem."
 ep3_frankokratia_events.0004.b:0 "[ROOT.Char.GetFaith.HighGodName] me designou. [ROOT.Char.GetFaith.HighGodName] me defenderá."
 ep3_frankokratia_events.0004.desc:0 "Nossos espiões entre os latinos trazem notícias bizarras... se eu não fosse tão versado em todas as outras formas de avareza de [financier.GetPrimaryTitle.GetAdjective], acharia que fui enganado!\n\nEnquanto [byz_claimant_champion.GetFaith.GetAdherentNamePlural] atacam mais uma vez os infiéis, uma grande massa de seus peregrinos armados prometeu vir #EMP aqui#!. Liderados por [byz_claimant_champion.GetName] e [financier.GetTitledFirstName], eles proclamam [byz_claimant.GetName], aquele mendigo lastimável, como o governante legítimo dos [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )]!\n\nLogo, esses fanáticos estarão morrendo fora de minhas muralhas pela causa fraca [byz_claimant.GetHerHim]! Como poderiam contemplar tal ataque contra seus irmãos cristãos?"
 ep3_frankokratia_events.0004.t:0 "Hubris no Oeste"
 ep3_frankokratia_events.0005.a:0 "[ROOT.Char.GetFaith.HighGodName] deve amar o tirano dos gregos..."
 ep3_frankokratia_events.0005.desc:0 "Você não pode mais esperar vestir o pretendente [claimant.GetName] de púrpura imperial.\n\nNão sonhe mais com os luxos gregos. Não viva mais em desafio, mas busque a penitência. A causa que uma vez o afastou da missão santa de Deus teve um fim justificadamente sem cerimônia."
 ep3_frankokratia_events.0005.opening:0 "Meu filho desobediente,"
 ep3_frankokratia_events.0020.a:0 "Eu me juntarei apenas como #EMP líder#! desse ousado empreendimento."
 ep3_frankokratia_events.0020.b:0 "Conte comigo entre os dispostos!"
 ep3_frankokratia_events.0020.c.flavor:0 "É uma blasfêmia total! #EMP E enfraquece nossa santa Cruzada!#!"
 ep3_frankokratia_events.0020.c:0 "Esse plano... não faz sentido."
 ep3_frankokratia_events.0020.desc:0 "A discórdia floresce entre os guerreiros de Cristo... pois o infiel é poderoso, a travessia do Mediterrâneo nos custará caro, e o construtor naval [financier.GetName] é um credor duro e astuto.\n\n[redirecter.GetName] detalha um empreendimento bastante diferente: com nosso zelo combinado, por que não deveríamos, ao invés disso, instalar o pretendente [byz_claimant.GetName] no trono de [byz_emperor.GetPrimaryTitle.GetName]? A rica recompensa que ganharíamos não fortificaria bem os fiéis?"
 ep3_frankokratia_events.0020.pope_condemns:0 "\n\n[pope.GetTitledFirstName] discorda, proibindo essa empreitada e ameaçando com a danação. Os dispostos permanecem imperturbáveis."
 ep3_frankokratia_events.0020.pope_endorses:0 "\n\nE embora [pope.GetSheHe] ainda esteja tentando liderar uma Cruzada, [pope.GetTitledFirstName] concedeu a bênção de São Pedro a essa empreitada!"
 ep3_frankokratia_events.0020.pope_resents:0 "\n\n[pope.GetTitledFirstName] não condenou completamente essa empreitada, mas os prelados [pope.GetHerHim] não endossam tal cisão da Cruzada..."
 ep3_frankokratia_events.0020.t:0 "Contra o Desviado"
 ep3_frankokratia_events.0030.a:0 "#EMP Glória a Deus nas alturas!#!"
 ep3_frankokratia_events.0030.desc:0 "[ghw_sponsor.GetTitledFirstName] chama, mas não responderemos. Não ainda. Em vez disso, sob a direção de [byz_claimant_champion.GetTitledFirstName], marchamos sobre [byz_emperor.GetPrimaryTitle.GetNameNoTier].\n\nOnde nossos peregrinos embarcam em navios [financier.GetPrimaryTitle.GetAdjective], inumeráveis escudos heráldicos estão pendurados nas proas e popas, revestidos de couro para resistir ao mar. Poderosos cavalos de guerra são levados abaixo do convés. Como se florescessem, grandes velas se estendem para capturar o sol! Em outros lugares, colunas de Cruzados partem a pé atrás da cruz, com antigas estradas levando-os para o leste.\n\nVamos vingar os [Glossary( 'Trojans', 'TROJANS_FRANKOKRATIA_GLOSS')]! Que os gregos tremam em seus palácios! Que se curvem a [byz_claimant.GetFullName], seu legítimo senhor, e nós, Cruzados, como seus libertadores!"
 ep3_frankokratia_events.0030.t:0 "Herdeiros de Constantino"
 ep3_frankokratia_events.0031.a:0 "Isso está... realmente acontecendo?"
 ep3_frankokratia_events.0031.desc_byz:0 "Em desafio a todo amor comum por Cristo — e desprezando a causa de [pope.GetTitledFirstName], seu amado Bispo de Roma — uma facção de Cruzados latinos agora desafia nosso Império!\n\nEles #EMP não#! sabem há quanto tempo nossas tropas imperiais servem como o baluarte da cristandade? Que a força de [Glossary( 'Herakleios', 'HERAKLEIOS_GLOSS')] nos proteja agora; que as cabeças decapitadas de [byz_claimant_champion.GetTitledFirstName], [financier.GetTitledFirstName], e o pretendente [byz_claimant.GetName] logo descansem junto ao [Glossary( 'Trono de Salomão', 'THRONE_OF_SOLOMON_GLOSS')]!\n\n[ROOT.Char.GetFaith.WarGodName], proteja-nos bem contra essa ganância latina... essa loucura que ameaça nossa própria existência."
 ep3_frankokratia_events.0031.desc_catholic:0 "#EMP A Cruzada Católica é traída!#!\n\nPeregrinos infiéis e mal orientados se uniram atrás do pretendente [byz_claimant.GetName] e, tragédia das tragédias — planejam atacar [byz_emperor.GetPrimaryTitle.GetNameNoTier], um reino de cristãos! Eles se recusam a fazer a jornada para [target_kingdom.GetNameNoTier]!\n\nApologistas do orgulhoso [byz_claimant_champion.GetTitledFirstName], do ganancioso [financier.GetTitledFirstName], e de todos os outros afirmam que reunirão a igreja, emprestando força grega à causa...\n\nMas apenas Deus sabe o que virá disso."
 ep3_frankokratia_events.0031.desc_target:0 "Sem a luz de [ROOT.Char.GetFaith.HighGodName] para guiá-los, os [pope.GetFaith.GetAdherentNamePlural] se debatem na escuridão!\n\nUm grande contingente de nossos fanáticos inimigos, em vez de marchar contra [defender.GetName], jurou reivindicar [byz_emperor.GetPrimaryTitle.GetName]! Sua discórdia é um alívio desconcertante para aqueles que defendem [target_kingdom.GetNameNoTier].\n\nSuas pequenas mentes diabólicas parecem acreditar que seremos batizados pela espada assim que [byz_claimant.GetName] ocupar o trono imperial... mas as forças de [pope.GetTitledFirstName] certamente, até lá, serão repelidas."
 ep3_frankokratia_events.0031.t:0 "A Cruzada Fragmentada"
 ep3_frankokratia_events.0041.a.flavor:0 "O saque de tal cidade imperial... será incomparável."
 ep3_frankokratia_events.0041.a:0 "Então devemos #EMP tomar#! o que nos é devido."
 ep3_frankokratia_events.0041.b.flavor:0 "...mas, dada a #EMP motivação#! certa, posso tentar enviar os outros embora sem derramamento de sangue."
 ep3_frankokratia_events.0041.b:0 "Dissolver nossos cavaleiros, sem pagamento, não será fácil..."
 ep3_frankokratia_events.0041.b_failure:0 "Os Cruzados saqueiam [claimant.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]"
 ep3_frankokratia_events.0041.b_success:0 "Você convence os latinos a partir"
 ep3_frankokratia_events.0041.c.flavor:0 "A cristandade ainda foi fortalecida por esta empreitada. Um pouco."
 ep3_frankokratia_events.0041.c:0 "Esperávamos mais. Mas podemos aceitar isso."
 ep3_frankokratia_events.0041.desc:0 "e forçado a sofrer intermináveis cerimônias, um sentimento bem diferente vem sobre mim...\n\n\"Meu predecessor,\" explica [claimant.GetTitledFirstNameNoTooltip], \"levou grande parte do tesouro quando [defender.GetSheHe] fugiu."
 ep3_frankokratia_events.0041.intro_constantinople:0 "Para a jubilation estrondosa, nosso responsável [claimant.GetFirstName] entra pelas poderosas portas de [claimant.GetCapitalLocation.GetTitle.GetNameNoTier]. Sob as grandes cúpulas e os celestiais [Glossary( 'serafim', 'SERAPHIM_GLOSS')] da Hagia Sophia, [claimant.GetSheHe] é finalmente investido como [claimant.GetTitleAsNameNoTooltip]. Quão brilhante é nossa alegria, quão absoluta é nossa admiração!\n\nEnquanto sou friamente conduzido ao [Glossary( 'Palácio de Blachernae', 'BLACHERNAE_PALACE_GLOSS')]"
 ep3_frankokratia_events.0041.intro_generic:0 "Para a jubilation estrondosa, nosso responsável [claimant.GetFirstName] entra pelas poderosas portas de [claimant.GetCapitalLocation.GetTitle.GetNameNoTier]. Sob as grandes cúpulas e os celestiais [Glossary( 'serafim', 'SERAPHIM_GLOSS')] da igreja imperial, [claimant.GetSheHe] é finalmente investido como [claimant.GetTitleAsNameNoTooltip]. Quão brilhante é nossa alegria, quão absoluta é nossa admiração!\n\nEnquanto sou friamente conduzido a um palácio imperial"
 ep3_frankokratia_events.0041.not_trying_to_pay:0 "Vocês, Cruzados, não podem ser pagos pelo que foi prometido, mas, em vez disso... podemos pagar #EMP vocês#! muito, #EMP muito#! menos."
 ep3_frankokratia_events.0041.t:0 "Todas as Riquezas do Império"
 ep3_frankokratia_events.0041.trying_to_pay:0 "Esforçando-nos ao máximo, o Império pode oferecer a vocês, Cruzados, apenas #EMP parcial#! recompensa."
 ep3_frankokratia_events.0042.a:0 "Eu governarei latinos e gregos igualmente!"
 ep3_frankokratia_events.0042.b:0 "[player_1.GetTitledFirstNameNoTooltip] é respeitado entre os Cruzados."
 ep3_frankokratia_events.0042.c:0 "Que [player_2.GetTitledFirstNameNoTooltip] reivindique esta honra."
 ep3_frankokratia_events.0042.constantinople:0 "Os devotos clamam por moderação, mas ainda assim a Hagia Sophia e os antigos santuários sagrados são vandalizados e saqueados."
 ep3_frankokratia_events.0042.d:0 "Tanto se deve a [financier.GetTitledFirstNameNoTooltip]."
 ep3_frankokratia_events.0042.desc:0 "Atacamos [claimant.GetCapitalLocation.GetTitle.GetNameNoTier]! Os fuzileiros [financier.GetPrimaryTitle.GetAdjective] são os primeiros a erguer sua bandeira santa nos muros, enquanto nossos $knight_culture_player_plural_no_tooltip_lowercase$ uivam pelas portas da cidade e massacram cada defensor. Os gregos incendeiam suas próprias casas — mas mesmo esta grande parede de fogo não pode impedir a ira de Deus!\n\nPor três dias, a cidade é saqueada e seus cidadãos postos à espada."
 ep3_frankokratia_events.0042.desc_outro:0 "\n\nNossos líderes agora não confiarão em nenhum grego para governar justo este lugar e apoiar a causa de Cristo: devemos nomear nosso próprio Imperador. Meu voto, minha escolha, transformará a cristandade."
 ep3_frankokratia_events.0042.e:0 "[Select_CString( emp_beneficiary_3.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary_3'))] [emp_beneficiary_3.GetNameNoTooltip] tem graça imperial!"
 ep3_frankokratia_events.0042.f:0 "[emp_beneficiary_2.GetNameNoTooltip]. Reine sabiamente, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary_2'))]."
 ep3_frankokratia_events.0042.g:0 "[Select_CString( emp_beneficiary.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('emp_beneficiary'))] [emp_beneficiary.GetNameNoTooltip] merece o trono."
 ep3_frankokratia_events.0042.t:0 "Batizado pelo Fogo"
 ep3_frankokratia_events.0044.a:0 "Eu ficarei aqui e saborearei os confortos gregos!"
 ep3_frankokratia_events.0044.b:0 "[beneficiary_3.GetFirstNameNoTooltip], [Select_CString( beneficiary_3.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary_3'))]: proteja este reino."
 ep3_frankokratia_events.0044.c:0 "[Select_CString( beneficiary_2.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary_2'))] [beneficiary_2.GetFirstNameNoTooltip] está encantado com estas terras."
 ep3_frankokratia_events.0044.d:0 "[beneficiary.GetFirstNameNoTooltip]. Governe bem estes estrangeiros, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('beneficiary'))]."
 ep3_frankokratia_events.0044.desc:0 "Depois de nossas guerras em nome [claimant.GetHerHim], [claimant.GetName] agora se recusa ao que nos é devido, #EMP e ao Senhor!#! Nós, Cruzados, não podemos tolerar isso!\n\nEm justa fúria, invadimos [latin_byz_capital_barony.GetNameNoTier]. Afogamos suas ruas em sangue grego, enquanto igrejas e palácios são pilhados. Que recurso temos senão esta ruína?\n\nOs duplicitosos gregos não reinarão mais aqui, talvez nunca mais."
 ep3_frankokratia_events.0044.desc_past_tense:0 "Depois de nossas guerras em nome [claimant.GetHerHim], quão furiosos estávamos nós, Cruzados, quando [claimant.GetName] se recusou ao que nos é devido, #EMP e ao Senhor!#!\n\n[latin_byz_capital_barony.GetNameNoTier] precisava ser invadida. Sangue grego precisava afogar suas ruas; suas igrejas e palácios mereciam pilhagem. Que recurso tínhamos senão esta ruína?\n\nOs duplicitosos gregos não reinam mais aqui, talvez nunca mais."
 ep3_frankokratia_events.0044.outro_emperor:0 "Um latino usará a coroa sagrada, e a honra de nomear este imperador será minha."
 ep3_frankokratia_events.0044.outro_lord:0 "[latin_emperor.GetName] foi coroado mestre dos latinos e gregos, e nós, outros peregrinos, devemos dividir as terras [latin_emperor.GetHerHim] entre nós."
 ep3_frankokratia_events.0044.t:0 "Nosso é o Púrpura"
 ep3_frankokratia_events.0045.a:0 "Ainda não é tarde para ajudar a causa dos Cruzados!"
 ep3_frankokratia_events.0045.b:0 "Lugares familiares chamam."
 ep3_frankokratia_events.0045.desc:0 "\n\nTalvez, os romanos de outrora poderiam ter nos presenteado ricamente. Com certeza, eles conheciam a força para smite os pagãos. Estes gregos são menos impressionantes. [claimant.GetName] envia seus libertadores embora"
 ep3_frankokratia_events.0045.intro:0 "Com a vitória alcançada e os termos de separação negociados, nós, Cruzados, olhamos silenciosamente para [claimant.GetCapitalLocation.GetTitle.GetNameNoTier],"
 ep3_frankokratia_events.0045.intro_constantinople:0 "a joia do Bósforo. Sob monumentos de eras passadas, entre relíquias sagradas, encontram-se ruas sujas e fóruns que cheiram a gado."
 ep3_frankokratia_events.0045.intro_generic:0 "um substituto patético para a rainha das cidades. Uma sombra da antiga capital, [GetTitleByKey('b_constantinople').GetNameNoTier], com suas catedrais veneradas e palácios luxuosos."
 ep3_frankokratia_events.0045.paid_off:0 "meia-paga, levando pequenas companhias arrastadas para longe dos muros [claimant.GetHerHim].\n\nAssim, nossa estranha peregrinação nos viu fiéis um pouco recompensados. Mais do que os gregos angustiados e desordenados..."
 ep3_frankokratia_events.0045.t:0 "Glórias Não Vistas"
 ep3_frankokratia_events.0045.unpaid:0 "de mãos vazias e sem ajuda.\n\nEmbora resmungemos, embora nossos olhos cobicem tesouros e trinkets, nossa estranha peregrinação chegou ao fim."
 ep3_frankokratia_events.0060.a:0 "Uma verdadeira reunião de cristãos orientais e ocidentais."
 ep3_frankokratia_events.0060.desc_latin_empire:0 "[GetTitleByKey('e_byzantium').GetName|U] não existe mais. Seu soberano todo-poderoso, que um dia reivindicou o legado de Roma, foi deposto. Palácios e catedrais magníficas ardem. Corpos apodrecem em grandes pilhas. O caos desce sobre um reino quebrado.\n\nEm meio a essas cinzas, o [latin_emperor.GetPrimaryTitle.GetNameNoTier] é proclamado — em nome de Cristo e [pope.GetTitledFirstName].\n\nUma era perigosa e fraturada começa nas terras dos gregos."
 ep3_frankokratia_events.0060.desc_leave_unpaid:0 "Um novo soberano se senta em meio às inimitáveis luxúrias de [claimant.GetCapitalLocation.GetTitle.GetNameNoTier], colocado no poder pelas armas latinas e obedecido com ressentimento — por enquanto — por seus súditos: [claimant.GetName].\n\nCom uma convicção digna de seus antecessores, este novo [claimant.GetTitleAsNameNoTooltip] #EMP recusou#! as exigências dos Cruzados. Os cães que lutaram e rosnaram por [claimant.GetSheHe] foram mandados embora famintos.\n\nUm novo monarca reina, sim... mas deve-se ainda questionar por que os Cruzados errantes escolheram tal caminho, buscando salvação...?"
 ep3_frankokratia_events.0060.desc_loss:0 "#EMP \"Louvor a [defender.GetTitledFirstName], o portador da vitória! [defender.GetTitleAsNameNoTooltip]! [defender.GetTitleAsNameNoTooltip]!\"#!\n\nEste refrão ecoa por [defender.GetPrimaryTitle.GetNameNoTier] — seu soberano forçou os Cruzados latinos de volta ao mar. Para a reivindicação de [claimant.GetName] sobre a poderosa Bizâncio, parece que o favor de Deus se provou bastante limitado.\n\nUm grave constrangimento para os aventureiros que ousaram presumir a vontade do Todo-Poderoso..."
 ep3_frankokratia_events.0060.desc_paid:0 "Um novo soberano se senta em meio às inimitáveis luxúrias de [claimant.GetCapitalLocation.GetTitle.GetNameNoTier], colocado no poder pelas armas latinas e obedecido com ressentimento — por enquanto — por seus súditos: [claimant.GetName].\n\nInchado com toda a riqueza que este novo [claimant.GetTitleAsNameNoTooltip] pôde reunir, liderando tropas [claimant.GetPrimaryTitle.GetAdjective], os Cruzados finalmente voltam seus olhares para outros lugares."
 ep3_frankokratia_events.0060.t:0 "A Águia Ainda Voa"
 ep3_frankokratia_events.0060.t_latin_empire:0 "Frankokratia"
 ep3_frankokratia_events.0070.a.flavor:0 "A espada sobre os pescoços gregos ainda é minha, mesmo que o [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] dinheiro seja o que governa seus mercados."
 ep3_frankokratia_events.0070.a:0 "Somente juntos podemos controlar esses malditos gregos."
 ep3_frankokratia_events.0070.b.flavor:0 "O [financier.GetTitleAsNameNoTooltip] pode ser negado, mas o desejo de seus lucros do meu novo reino dificilmente diminuirá..."
 ep3_frankokratia_events.0070.b:0 "#EMP Cur avarento!#! Os gregos estavam certos em te detestar!"
 ep3_frankokratia_events.0070.desc:0 "Mas... #EMP manter#! ela — pode a força de um braço de espada ser suficiente? Não deveríamos nós, latinos, atados por nosso fervor, aliar estes novos reinos gregos nossos...?\n\n\"Eu pediria apenas que... meus [financier.GetPrimaryTitle.GetAdjectiveNoTooltip] comerciantes, com seus muitos, #EMP profundos#! interesses locais, tivessem direitos especiais garantidos...\""
 ep3_frankokratia_events.0070.intro:0 "[financier.GetName] permaneceu em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], cuidando dos novos negócios dos muitos [financier.GetPrimaryTitle.GetAdjective] comerciantes locais. Agora, seu navio insignia carregado de saques, [financier.GetSheHe] se despede.\n\n"
 ep3_frankokratia_events.0070.leader_emp:0 "\"Mobilizamos tantos sob a cruz,\" [financier.GetFirstNameNoTooltip] exulta. \"E veja o que isso lhe deu! Um grande império!\""
 ep3_frankokratia_events.0070.rando_emp:0 "\"Que aventura!\" [financier.GetFirstNameNoTooltip] exulta. \"Quem poderia reclamar coragem para igualar a nós que tomamos este grande império?\""
 ep3_frankokratia_events.0070.t:0 "A Espada Sheathed em Ouro"
 ep3_frankokratia_events.0080.a:0 "Que todo [kingdom_1.GetNameNoTierNoTooltip] conheça meu direito!"
 ep3_frankokratia_events.0080.b:0 "Que [kingdom_2.GetNameNoTierNoTooltip] se curve!"
 ep3_frankokratia_events.0080.c:0 "Que [kingdom_3.GetNameNoTierNoTooltip] seja para sempre o [ROOT.Char.GetTitleAsNameNoTooltip]!"
 ep3_frankokratia_events.0080.d:0 "Que o povo de [kingdom_4.GetNameNoTierNoTooltip] se curve."
 ep3_frankokratia_events.0080.desc:0 "\n\nA soberania dos romanos é a mais alta entre as honras terrenas. Com ela, é comandado o respeito de multidões. Clamar por isso estava além dos sonhos de nossos Cruzados latinos — um truque da fortuna, realizado em horrenda sangue — mas agora, meu império é muito real. A imagem gloriosa de [ROOT.Char.GetTitleAsNameNoTooltip] é quase imaculada.\n\nUma vez, éramos invasores. Os locais choravam, fugiam diante de nós. Agora, em [kingdom_1.GetNameNoTier], eles aplaudem nas ruas."
 ep3_frankokratia_events.0080.e:0 "Que [kingdom_5.GetNameNoTierNoTooltip] seja nosso."
 ep3_frankokratia_events.0080.t:0 "Um Reino para os Latinos"
 ep3_frankokratia_events.0080_greek:0 "As terras dos gregos, uma vez totalmente subjugadas sob [GetTitleByKey('e_byzantium').GetName], permanecem em fluxo. Quem, entre todos os governantes sob [ROOT.Char.GetFaith.PositiveAfterLife], tem direito a elas?"
 ep3_frankokratia_events.0080_non_greek:0 "César, Constantino, uma sucessão de gregos com nomes vagos e trabalhosos... e agora [ROOT.Char.GetFirstName]."
 ep3_frankokratia_events.0090.a:0 "Em [kingdom_1.GetNameNoTierNoTooltip], que tempos sombrios sejam esquecidos!"
 ep3_frankokratia_events.0090.b:0 "Olhem para o #EMP Autocrator#!, [kingdom_2.GetNameNoTierNoTooltip]!"
 ep3_frankokratia_events.0090.c:0 "[kingdom_3.GetNameNoTierNoTooltip] conhece o púrpura!"
 ep3_frankokratia_events.0090.d:0 "Ao redil imperial: retornem, [kingdom_4.GetNameNoTierNoTooltip]."
 ep3_frankokratia_events.0090.desc:0 "Províncias como [kingdom_1.GetNameNoTier] suportaram uma era duvidosa — e foram privadas do reinado gentil de um soberano [GetTitleByKey('e_byzantium').GetAdjective] — por tempo demais.\n\nMas agora — o povo [kingdom_1.GetAdjectiveNoTooltip] pode se regozijar! Eles não se curvam a brutamontes francos! Os campos [kingdom_1.GetAdjectiveNoTooltip], há muito cultivados, não murcharão sob os cascos dos cavalos de guerra."
 ep3_frankokratia_events.0090.e:0 "[GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] [kingdom_5.GetNameNoTierNoTooltip], mais uma vez!"
 ep3_frankokratia_events.0090.t:0 "Lembre-se, Você É [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]!"
 ep3_frankokratia_events.0090_emp:0 "Venham, [Glossary('hoi polloi', 'HOI_POLLOI_GLOSS' )]: elevem seus ícones com orgulho e regozijem-se no retorno da ordem divina de [ROOT.Char.GetFaith.HighGodName]!\n\nEsses povos estão reunidos sob seu [ROOT.Char.GetTitleAsName]; à medida que a riqueza de suas terras flui para o palácio, serão oferecidos todas as honras e esplendores outrora conhecidos por seus antepassados."
 ep3_frankokratia_events.0090_non_emp:0 "E os simples, como os do [kingdom_1.GetTierAsNameNoTooltip], podem sonhar livremente... com o retorno de seu verdadeiro senhor feudal.\n\nÉ hora de que o domínio latino chegue ao fim."
 ep3_frankokratia_events.0100.a_catholic:0 "Vanamente, sonhamos em dar glória a [ROOT.Char.GetFaith.HighGodName] na Terra..."
 ep3_frankokratia_events.0100.a_non_catholic:0 "Veio de [ROOT.Char.GetFaith.NegativeAfterLife]. Para [ROOT.Char.GetFaith.NegativeAfterLife] retorna."
 ep3_frankokratia_events.0100.byz_no_emp:0 "Com sua destruição — como pode qualquer grande [Glossary( 'Romaios', 'ROMAIOS_GLOSS' )] ficar inativo? Um poderoso Basileus, #EMP nosso#! Basileus, deve em breve passar pelo [Glossary( 'Portão Dourado', 'GOLDEN_GATE_GLOSS' )] em triunfo.\n\nPois o reino [GetTitleByKey('e_latin_empire').GetAdjective] não existe mais!"
 ep3_frankokratia_events.0100.cath:0 "Nossos Cruzados foram enganados por uma traiçoeira arrogância? A luz da majestade grega #EMP nos deixou cegos?#! Até o Papa exaltou nosso estado latino entre os gregos..."
 ep3_frankokratia_events.0100.desc:0 "Pelo filho de São Pedro, por São Marcos, pelo florim e pelo ducado — [GetTitleByKey('e_byzantium').GetName] foi devastado.\n\nDesde então, repetidamente, os senhores [GetTitleByKey('e_latin_empire').GetAdjective] saíram com seus cavaleiros. No início, todos vestidos de ouro e ardendo de propósito, mas ultimamente... as esperanças de seu soberano [latin_emp.GetTitledFirstNameRegnal] eram finas, magras. A causa [latin_emp.GetHerHim|U] conheceu apenas uma resignação sombria.\n\n[GetTitleByKey('e_latin_empire').GetName], uma abominação nascida na cristandade, nunca deveria existir."
 ep3_frankokratia_events.0100.emp:0 "O verdadeiro herdeiro de Constantino, na verdade, é [byz_emp.GetTitledFirstNameRegnal]... [byz_emp.GetSheHe] que pode reparar esta era de danos graves e mais uma vez levantar o poderoso baluarte do Bósforo."
 ep3_frankokratia_events.0100.t:0 "Latinocracia, Quebrada"
 ep3_frankokratia_events.0110.a:0 "Vou proteger nossos modos imperiais, aconteça o que acontecer."
 ep3_frankokratia_events.0110.b:0 "Devo buscar a proteção de [daddy.GetTitledFirstNameNoTooltip]."
 ep3_frankokratia_events.0110.c:0 "[daddy_2.GetTitledFirstNameNoTooltip] tem força para enfrentar isso..."
 ep3_frankokratia_events.0110.d:0 "Em breve, talvez... eu possa ficar sozinho, sem amarras."
 ep3_frankokratia_events.0110.desc:0 "A guerra contra os francos está perdida.\n\nDo capital, brota a palavra de paz negociada; fala-se do recém-instalado [emperor.GetTitledFirstNameRegnal] — uma loucura na Sagrada Púrpura — que é exibido por gangues de latinos malcheirosos, vestidos de cota de malha. Ouço também sobre o [financier.GetTitleAsName] de [financier.GetPrimaryTitle.GetNameNoTier]: um [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')] de cobras, sibilando insultos a nossos ministros imperiais, ditando mais tributos.\n\nO exército cruzado ainda está fora das muralhas da capital. Será que algo fará com que eles se vão? Algo que não seja nossa destruição total...?"
 ep3_frankokratia_events.0110.t:0 "[GetTitleByKey('e_byzantium').GetNameNoTooltip] — Tomado!"
 ep3_frankokratia_events.0120.a.flavor:0 "#EMP ...suas punições horrendas!#! Seu medo do poder imperial! Que os adornos dos gregos preencham meus cofres!"
 ep3_frankokratia_events.0120.a:0 "Há #EMP um#! ou #EMP dois#! hábitos gregos que admiro..."
 ep3_frankokratia_events.0120.b.flavor:0 "Que isso me cubra com glórias antigas!"
 ep3_frankokratia_events.0120.b:0 "Eu me dignarei a confiar nos gregos e seus modos..."
 ep3_frankokratia_events.0120.c.flavor:0 "Nós governaremos, adoraremos e despojaremos como nos agradar!"
 ep3_frankokratia_events.0120.c:0 "Nós latinos viemos. Tudo que está aqui — é nosso!"
 ep3_frankokratia_events.0120.desc:0 "Enquanto olho para fora, sou esclarecido por uma criatura da burocracia grega. Mas [eunuch.GetTitledFirstName], este sábio eunuco, se torna ousado.\n\n\"Durante séculos, nossos gloriosos Basileus exerceram tal poder! Você poderia imaginar, [ROOT.Char.GetLadyLord], ter todo o reino aguardando seus editos? Mesmo sem direito de sangue ou os despojos da guerra para oferecer a eles?\"\n\nTal poder, de fato! Meus vassalos latinos, meus cães soltos, suportariam parar de saquear os escritórios gregos? Eles usariam colares gregos apertados...?"
 ep3_frankokratia_events.0120.estate:0 "Eu sou o mestre de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], e tenho a escolha de seus palácios. Antecâmaras de mármore, mosaicos dourados, paredes guardadas pela providência divina..."
 ep3_frankokratia_events.0120.hippodrome:0 "Eu sou o mestre de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier], bela e desolada. O [Glossary( 'Palácio de Blachernae', 'BLACHERNAE_PALACE_GLOSS')], a Hagia Sophia, o antigo Hipódromo..."
 ep3_frankokratia_events.0120.t:0 "O Caminho dos Imperadores"
 ep3_frankokratia_events.0121.a.flavor:0 "Meus [ROOT.Char.GetLiege.Custom('KnightCulturePluralNoTooltip')|l] cairão sobre todos [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 ep3_frankokratia_events.0121.a:0 "Vim em busca de recompensa! Não serei facilmente movido!"
 ep3_frankokratia_events.0121.desc:0 "Mas aqui — tais riquezas vastas a serem apreendidas! Não temperes seu coração ardente: faça tudo o que precisar para prosperar nesta terra. Que nem o burocrata grego choramingador, nem o sodomita abastado, fique em seu caminho!"
 ep3_frankokratia_events.0121.desc_torture:0 "Mas esses gregos traiçoeiros têm coragem para igualar a nossa? Eles têm a determinação suficiente para nos impedir de reivindicar todo nosso [latin_emp.GetPrimaryTitle.GetTierAsName]?\n\nDevemos quebrá-los. Devemos ser tão cruéis quanto eles."
 ep3_frankokratia_events.0121.intro:0 "Nós que fomos uma vez peregrinos sob armas nos encontramos, em nossos novos feudos, grandemente superados.\n\n"
 ep3_frankokratia_events.0121.opening:0 "[ROOT.Char.GetTitledFirstNameRegnal], meu novo vassalo,"
 ep3_frankokratia_events.0130.a:0 "Uma despedida à #EMP Latinocracia#!"
 ep3_frankokratia_events.0130.desc:0 "Um reino de longa data! Uma estrela polar guiando todas as almas cristãs! Um monte dourado erguendo-se altaneiro na própria crux do mundo. Às vezes um, outras vezes outro, e muitas vezes um ninho de víboras perniciosas: seja o que for, e agora mais uma vez é — [GetTitleByKey('e_byzantium').GetName] retornou.\n\nEsta tem sido uma era escura e humilhante para a população [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] devastada. No entanto, enquanto as cinzas da conquista latina jazem frias, agora a luz e a esperança surgem. Em breve, talvez, todos se reunirão sob o governo de [byz_emperor.GetTitledFirstNameRegnal]!\n\n"
 ep3_frankokratia_events.0130.latin_emp:0 "E ainda assim... um pretendente, o [latin_emperor.GetTitleAsName] [latin_emperor.GetPrimaryTitle.GetAdjective], persiste em oposição. De [latin_emperor.GetCapitalLocation.GetName], sua corte lança maldições sobre esta histórica coroação..."
 ep3_frankokratia_events.0130.t:0 "A [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip] Restauração"
 ep3_frankokratia_events.0130.unopposed:0 "Rivais latinos e suas aspirações foram lançados na lixeira da história. Assim começa uma nova era [GetTitleByKey('e_byzantium').GetAdjectiveNoTooltip]."
 ep3_frankokratia_reward_army_name:0 "Tropas Bizantinas Emprestadas"
 ep3_harassed_at_sea_modifier:0 "Afligido no Mar"
 ep3_harassed_at_sea_modifier_desc:0 "Marinheiros habilidosos de reinos hostis negam seus serviços às tropas deste personagem; além disso, eles iniciam brigas entre os marinheiros e danificam navios no porto."
 ep3_latin_emp_army_name:0 "Buscadores de Glória Latinos"
 every_ally_will_gain_modifier_tooltip:0 "Você e outros Atacantes da [war|E] ganharão [GetModifier( 'grand_crusader_fleet_modifier' ).GetNameWithTooltip|L]"
 every_crusader_gets_paid:0 "Paga a cada Cruzado envolvido @gold_icon!#P [payoff_per_crusader|P0]#!"
 every_crusader_gets_paid_sacking:0 "Cada Cruzado envolvido recebe @gold_icon!#P [ep3_sacking_byz_capital_payoff_value|P0]#!"
 expunge_latins_decision_warning_tt:0 "#weak Pode ser usado para reivindicar [kingdoms|E] [de_jure|E] [GetTitleByKey('e_latin_empire').GetAdjective]#!"
 fewer_crusaders_will_join_tooltip:0 "@warning_icon! #X Menos Atacantes [great_holy_war|E] se juntarão à sua [war|E] em vez#!"
 financier_gains_counties_tooltip:0 "[financier.GetShortUIName|U] ganhou algunss antigos [counties|E] [GetTitleByKey('e_byzantium').GetAdjective]"
 financier_gains_duchy_tooltip:0 "[financier.GetShortUIName|U] ganhou [financier_latin_emp_duchy.GetName]"
 financier_will_join_claim_war_tooltip:0 "[financier.GetShortUIName] se juntará ao seu #high $CRUSADING_CLAIM_CB_NAME$#! contra [byz_emperor.GetShortUIName]"
 franko_county_control_past_tooltip:0 "O nível de [control|E] mudou em #N -100#!"
 franko_crusaders_depart_unpaid:0 "Os Cruzados participantes partiram de Bizâncio, não pagos"
 franko_crusaders_gained_gold_special_troops:0 "Os Cruzados participantes ganharam @gold_icon![gold|E], @piety_icon![piety|E] e [special_troops|E]"
 franko_development_past_tooltip:0 "O nível de [development|E] mudou em #N -5#!"
 franko_emp_crusade_tooltip:0 "@warning_icon! #X [byz_claimant_champion.GetShortUIName] liderará uma #high $CRUSADING_CLAIM_CB_NAME$#! contra [byz_emperor.GetShortUIName], em nome de [byz_claimant.GetShortUIName]#!"
 frankokratia_byz_slaughter.t:0 "Massacre em [latin_capital_barony.GetNameNoTierNoTooltip]"
 frankokratia_byz_slaughter_child_tooltip:0 "Em meio ao carnificina provocada pelos latinos enfurecidos, #N [slaughtered_byzantines]#! nobres foram massacrados.\n\nCrianças como [child_victim.GetShortUIName] foram espancadas até a morte."
