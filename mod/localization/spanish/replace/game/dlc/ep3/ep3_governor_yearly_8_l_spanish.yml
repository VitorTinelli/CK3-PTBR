l_spanish:
 cultural_acceptance_ep3_governor_yearly_8150_crackdown:0 "Um [governor|E] reprimiu rebeldes locais"
 cultural_acceptance_promoted_bureaucrats:0 "Um [governor|E] promoveu burocratas estrangeiros"
 ep3_governor_yearly.8010.a:0 "Favores por favores."
 ep3_governor_yearly.8010.b.failure:0 "[governor.GetSheHe|U] não está interessado"
 ep3_governor_yearly.8010.b.success:0 "[governor.GetSheHe|U] aceita sua proposta"
 ep3_governor_yearly.8010.b:0 "Uma ótima oferta, se revertida."
 ep3_governor_yearly.8010.c:0 "Não preciso disso."
 ep3_governor_yearly.8010.candidacy:0 "apoiar minha nomeação sobre [their_title.GetNameNoTier],"
 ep3_governor_yearly.8010.candidacy_heir:0 "apoiar [Select_CString( their_title_receiver.IsFemale, 'minha', 'meu' )] [governor.Custom2('RelationToMeShort', SCOPE.sC('their_title_receiver'))], [their_title_receiver.GetFirstName], nomeação sobre [their_title.GetNameNoTier],"
 ep3_governor_yearly.8010.desc:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] maior [ROOT.Char.Custom('ComplimentAdjective')], [ROOT.Char.GetTitledFirstNameNoTooltip], vejo uma oportunidade de promover ainda mais os interesses de [ROOT.Char.GetHouse.GetBaseName], assim como os da minha Casa [governor.GetHouse.GetBaseName].\n\nEm troca de"
 ep3_governor_yearly.8010.end:0 "estaria disposto a fazer meu próprio sacrifício."
 ep3_governor_yearly.8010.gold:0 "um token material de boa vontade"
 ep3_governor_yearly.8010.hook:0 "uma promessa que poderei invocar no futuro,"
 ep3_governor_yearly.8010.influence:0 "sua boa palavra na corte imperial"
 ep3_governor_yearly.8010.opening:0 "[governor.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_governor_yearly.8020.a:0 "Manter as estradas seguras é #EMP tão#! caro hoje em dia."
 ep3_governor_yearly.8020.b:0 "Os grandes esforços que faço devem ser recompensados."
 ep3_governor_yearly.8020.c:0 "Minha graça neste assunto poderia ser mais divulgada."
 ep3_governor_yearly.8020.d:0 "Não poderia danificar uma propriedade tão bonita."
 ep3_governor_yearly.8020.desc:0 "Entre os muitos pequenos terrenos, vilarejos e cidades de meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], a propriedade da família [estate_owner.GetHouse.GetBaseName] se destaca como algo fora do comum.\n\nA propriedade nominalmente privada [Select_CString( estate_owner.IsFemale, 'da', 'do' )] [estate_owner.GetTitledFirstName] goza da minha proteção como [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier], e a sua indiferença intitulada à minha generosidade pode rapidamente se transformar em gratidão se a perspectiva de sua retirada for habilidosamente apresentada..."
 ep3_governor_yearly.8020.failure:0 "[estate_owner.GetSheHe|U] recusa sua demanda"
 ep3_governor_yearly.8020.reason:0 "Aceitação parcialmente baseada na personalidade de [estate_owner.GetFirstName]"
 ep3_governor_yearly.8020.success:0 "[estate_owner.GetSheHe|U] entende a sua intenção"
 ep3_governor_yearly.8020.t:0 "Influência Provincial"
 ep3_governor_yearly.8030.a:0 "Parece que #EMP lucro#! a ser coletado."
 ep3_governor_yearly.8030.agriculture:0 "A melhoria agrícola da minha terra inspirou os pequenos proprietários, cujos esforços têm sido uma grande benção para a localidade em geral."
 ep3_governor_yearly.8030.b:0 "O desenvolvimento local deve ser incentivado."
 ep3_governor_yearly.8030.c:0 "Uma feliz casualidade, pela primeira vez."
 ep3_governor_yearly.8030.commerce:0 "As oportunidades comerciais trouxeram muitos mercadores, cuja presença tem sido uma grande benção para a localidade em geral."
 ep3_governor_yearly.8030.desc:0 "Minha família e eu temos discutido, de forma um tanto espúria, com quaisquer locais e oficiais reclamando, que o desenvolvimento da propriedade [ROOT.Char.GetHouse.GetBaseName] em [estate.GetLocation.GetBaronyNameExplicitlyNoTooltip] é para o benefício de todos [estate.GetLocation.GetTitle.GetDeJureLiege.GetNameNoTier], se não de todo o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]!\n\nPor qual estranha sorte não posso dizer — é realmente verdade!"
 ep3_governor_yearly.8030.fallback:0 "A expansão da propriedade atraiu todo tipo de artesãos, cuja presença tem sido uma grande benção para a localidade em geral."
 ep3_governor_yearly.8030.martial:0 "A presença dos meus guardas afastou a bandidagem usual, cuja ausência tem sido uma grande benção para a localidade em geral."
 ep3_governor_yearly.8030.t:0 "Graça Não Intencionada"
 ep3_governor_yearly.8040.a:0 "Suponho que meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] possa precisar de mais atenção."
 ep3_governor_yearly.8040.b:0 "Oh, por favor, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] praticamente se administra sozinho!"
 ep3_governor_yearly.8040.c:0 "Talvez #EMP você#! deva assumir as responsabilidades, [complainant.GetTitleAsNameNoTooltip]."
 ep3_governor_yearly.8040.d.failure:0 "Você é incompetente demais para administrar os dois"
 ep3_governor_yearly.8040.d.success:0 "Você consegue acompanhar tudo"
 ep3_governor_yearly.8040.d:0 "Você está #EMP sugerindo#! que sou incompetente demais para administrar os dois?"
 ep3_governor_yearly.8040.desc:0 "[Select_CString( complainant.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', complainant)], [complainant.GetFirstName], [complainant.GetTitleAsNameNoTooltip|l] do [complainant.GetPrimaryTitle.GetTierAsNameNoTooltip|l] de [complainant.GetPrimaryTitle.GetNameNoTier], chegou em [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] com um assunto 'urgente'.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [complainant.Custom2('RelationToMeShort', ROOT.Char)], sei que você deve se preocupar com seus próprios assuntos, assim como com os de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], mas temo que a propriedade [ROOT.Char.GetHouse.GetBaseNameNoTooltip] esteja desviando muita da sua atenção — e fundos — do [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]...\"\n\n\"Há o suficiente a fazer, gerenciando os assuntos de sua província, sem a distração adicional de sua propriedade.\""
 ep3_governor_yearly.8040.t:0 "Distrações Dinásticas"
 ep3_governor_yearly.8050.a:0 "Os exércitos do império precisam de todos os homens que pudermos reunir!"
 ep3_governor_yearly.8050.b:0 "A defesa de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] está deficiente..."
 ep3_governor_yearly.8050.c:0 "...e está #EMP condenada#! sem mais recursos."
 ep3_governor_yearly.8050.d:0 "Está tudo sob controle."
 ep3_governor_yearly.8050.desc:0 "Do mais humilde funcionário ao [war_liege.GetTopLiege.GetTitleAsNameNoTooltip] [war_liege.GetHerselfHimself], todo o [war_liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] se une para defender [target_title.GetBaseNameNoTier] de [war_attacker.GetPrimaryTitle.GetDefinitiveName]. Como [ROOT.Char.GetTitleAsNameNoTooltip] do [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], a ameaça é muito real —"
 ep3_governor_yearly.8050.end:0 "\n\nEu faço minha parte, mantendo guarnições, reparando fortificações, recrutando soldados, mas ainda mais pode ser feito. Qualquer ajuda seria muito apreciada em [war_liege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]..."
 ep3_governor_yearly.8050.kingdom:0 "uma grande parte da defesa da região recai sobre mim."
 ep3_governor_yearly.8050.neighbour:0 "se não contido, os invasores podem avançar para [ROOT.Char.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetDeJureLiege.GetNameNoTier] a seguir."
 ep3_governor_yearly.8050.t:0 "Inimigo à Porta"
 ep3_governor_yearly.8060.a.failure:0 "Alguém sente falta da moeda"
 ep3_governor_yearly.8060.a.failure_tt:0 "@warning_icon! #N O paradeiro do [gold|E] será contestado#!"
 ep3_governor_yearly.8060.a.success:0 "A desaparecimento passa despercebido"
 ep3_governor_yearly.8060.a:0 "Ninguém notará algumas requisições extras."
 ep3_governor_yearly.8060.b:0 "Números ruins, erros de arredondamento, essas coisas acontecem..."
 ep3_governor_yearly.8060.c:0 "E assim as necessidades de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] são #EMP minhas#! para compartilhar."
 ep3_governor_yearly.8060.d:0 "Os burocratas sabem o que estão fazendo."
 ep3_governor_yearly.8060.desc:0 "Como [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], o aparato burocrático do [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] está à minha disposição — até mesmo o discreto tesouro no coração de [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip].\n\nFuncionários menores frequentam o local a todo momento, trocando ouro imperial por recibos e levando-o para pagar guarnições, reparar edifícios, alimentar os pobres... [ROOT.Char.GetFaith.HighGodName] sabe o que.\n\nComo #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!, #EMP minhas#! necessidades e as de [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] são realmente uma e a mesma... não são?"
 ep3_governor_yearly.8060.efficiency_tt:0 "Por 10 anos: Eficiência de [governor|E]: #N -5%#!"
 ep3_governor_yearly.8060.embezzle_tt:0 "Tesouraria Invadida"
 ep3_governor_yearly.8060.t:0 "Cofres Tentadores"
 ep3_governor_yearly.8062.a.failure:0 "[complainant.GetSheHe|U] revela sua corrupção"
 ep3_governor_yearly.8062.a.success:0 "[complainant.GetSheHe|U] aceita a desculpa"
 ep3_governor_yearly.8062.a:0 "Isso pode ser explicado."
 ep3_governor_yearly.8062.b.failure:0 "$ep3_governor_yearly.8062.a.failure$"
 ep3_governor_yearly.8062.b.success:0 "[complainant.GetSheHe|U] pega a dica"
 ep3_governor_yearly.8062.b:0 "Não há necessidade de mencionar isso."
 ep3_governor_yearly.8062.c.failure:0 "$ep3_governor_yearly.8062.a.failure$"
 ep3_governor_yearly.8062.c.success:0 "[complainant.GetSheHe|U] aceita o suborno"
 ep3_governor_yearly.8062.c:0 "Veja, leve sua parte e fique em silêncio."
 ep3_governor_yearly.8062.d:0 "Um simples engano, o ouro será devolvido..."
 ep3_governor_yearly.8062.desc:0 "No primeiro pedido [complainant.GetHerHim] para me encontrar e discutir #EMP as contas#! eu sabia que estava encrencado. Tentei despistar [complainant.GetSheHe], mas por fim concordei em me encontrar com [Select_CString( complainant.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', complainant)], [complainant.GetFirstName].\n\n[complainant.GetSheHe|U] me orienta sobre tudo, o ouro desaparecido, as entradas incorretas, recibos perdidos... Por fim, [complainant.GetSheHe] conclui: \"Eu simplesmente não entendo, a única explicação é um burocrata ladrão!\"\n\n[complainant.GetSheHe|U] pensa por um momento olhando ao redor dos meus salões, então me lança um olhar estranho, e escondendo seu choque, diz com os lábios: \"A menos que...\""
 ep3_governor_yearly.8070.a:0 "Posso limpar tudo isso, só preciso me concentrar."
 ep3_governor_yearly.8070.b:0 "Alguma ajuda contratada aliviaria o fardo."
 ep3_governor_yearly.8070.c:0 "Este é um trabalho para burocratas, não para o #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#!!"
 ep3_governor_yearly.8070.desc:0 "Honras, prestígio, poder. Ser um [ROOT.Char.GetTitleAsNameNoTooltip] pode conceder essas coisas, mas há #EMP custos#!...\n\nMontanhas de [ROOT.Char.Custom('GetWritingMaterial')] aguardam meu selo ou atenção, enquanto infinitos burocratas disputam um turno para encher meus ouvidos com detalhes entorpecedores.\n\nNinguém me disse que haveria tanto #EMP trabalho#! — e trabalho que, no fim, parece se resolver sozinho, aliás."
 ep3_governor_yearly.8070.t:0 "O Trabalho de um Governador"
 ep3_governor_yearly.8080.a:0 "Você deve devolver esses subornos e ser destituído do seu cargo."
 ep3_governor_yearly.8080.b:0 "Bestas como você precisam de um #EMP verdadeiro#! deterrente."
 ep3_governor_yearly.8080.c:0 "Pode ser ignorado se os pagamentos forem... redistribuídos."
 ep3_governor_yearly.8080.d:0 "Você pagará sua dívida em meu serviço... #EMP [magistrate.GetFirstNameNoTooltip]#!"
 ep3_governor_yearly.8080.desc:0 "Alegações de corrupção aumentaram recentemente em [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly], onde muitos se apresentaram com queixas específicas contra um dos principais magistrados — um[Select_CString( magistrate.IsFemale, 'a', '' )] [magistrate.GetWomanMan] chamad[Select_CString( magistrate.IsFemale, 'a', 'o' )] [magistrate.GetFirstName].\n\n[magistrate.GetSheHe|U] foi trazido até mim para responder a essas acusações, que incluem exigir subornos exorbitantes em troca das funções mais fundamentais.\n\n\"De fato, meu [ROOT.Char.GetTitleAsNameNoTooltip]...\" [magistrate.GetSheHe] diz, \"Isso tudo é apenas um mal-entendido!\""
 ep3_governor_yearly.8080.t:0 "Magistrado Malévolo"
 ep3_governor_yearly.8090.a.failure:0 "Suas mentiras são descartadas"
 ep3_governor_yearly.8090.a.success:0 "A Casa [old_holder.GetHouse.GetBaseNameNoTooltip] perde prestígio"
 ep3_governor_yearly.8090.a:0 "Fabricar problemas deixados pela Casa [old_holder.GetHouse.GetBaseNameNoTooltip]."
 ep3_governor_yearly.8090.b:0 "Talvez [old_holder.GetSheHe] possa ser convencido."
 ep3_governor_yearly.8090.c:0 "Alguma compensação pode silenciar [old_holder.GetSheHe]."
 ep3_governor_yearly.8090.d:0 "Bah, deixe [Select_CString( old_holder.IsFemale, 'a', 'o' )] [old_holder.GetWomanMan] fazer o seu pior!"
 ep3_governor_yearly.8090.desc:0 "O moinho sempre girando das nomeações e substituições imperiais pode ter me colocado no comando do [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] por enquanto, mas não é segredo que [Select_CString( old_holder.IsFemale, 'a', 'o' )] [old_holder.GetTitledFirstName] anseia por seu retorno às mãos da Casa [old_holder.GetHouse.GetBaseName].\n\nOs governadores, é claro, não têm direito a suas nomeações anteriores — pelo menos em lei — mas a trama de [old_holder.GetFirstNameNoTooltip] em [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] ainda apresenta uma dor de cabeça..."
 ep3_governor_yearly.8090.t:0 "Política Maliciosa"
 ep3_governor_yearly.8100.a:0 "#EMP Oh!#! Dois podem jogar esse jogo!"
 ep3_governor_yearly.8100.b:0 "Essa conspiração ousada deve ser denunciada."
 ep3_governor_yearly.8100.c:0 "Hah? Aquele tolo não conseguiria governar um mosteiro."
 ep3_governor_yearly.8100.d:0 "Essas esquemas mesquinhos estão abaixo da dignidade de [Select_CString( governor.IsFemale, 'uma', 'um' )] [governor.GetTitleAsNameNoTooltip]."
 ep3_governor_yearly.8100.desc:0 "Entre as mensagens de hoje de [ROOT.Char.GetTopLiege.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip], fiquei indignado ao saber que [governor.GetFirstName], [governor.GetTitleAsNameNoTooltip] do vizinho [governor.GetPrimaryTitle.GetAdjective] [governor.GetPrimaryTitle.GetTierAsNameNoTooltip], está afirmando abertamente a adequação de [Select_CString( neighboring_promoted_char.IsFemale, 'sua', 'seu' )] [governor.Custom2('RelationToMePossessive',SCOPE.sC('neighboring_promoted_char'))] ao meu #EMP cargo#!\n\nParece que [Select_CString( governor.IsFemale, 'a', 'o' )] [governor.Custom('InsultNoun')] cobiça minha província e passa seus dias em [governor.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] tramando como me expulsar do meu [ROOT.Char.Custom('FortifiedBuilding')]..."
 ep3_governor_yearly.8100.t:0 "O [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] do Seu Vizinho"
 ep3_governor_yearly.8110.a.failure:0 "Suas mentiras são rastreadas"
 ep3_governor_yearly.8110.a.failure_tt:0 "[governor_1.GetFirstName] e [governor_2.GetFirstName] perdem #N 25#! [opinion|E] sobre você"
 ep3_governor_yearly.8110.a.success:0 "Os rumores se espalham"
 ep3_governor_yearly.8110.a:0 "Alguns rumores falsos podem facilmente escalar isso."
 ep3_governor_yearly.8110.b:0 "[governor_1.GetFirstNameNoTooltip] está claramente certo."
 ep3_governor_yearly.8110.c:0 "Recuso-me a acreditar em uma palavra contra [governor_2.GetFirstNameNoTooltip]."
 ep3_governor_yearly.8110.d.tt:0 "[governor_1.GetFirstName] e [governor_2.GetFirstName] perdem #N 15#! [opinion|E] sobre você"
 ep3_governor_yearly.8110.d:0 "Um chamado à unidade destacará sua tolice."
 ep3_governor_yearly.8110.desc:0 "Ultimamente, há muitos rumores de crescente descontentamento entre meus governadores vizinhos, [governor_1.GetTitledFirstName] e [governor_2.GetTitledFirstName], cada um criticando abertamente as habilidades e conduta do outro.\n\nEsta pode ser uma oportunidade para pressionar meus próprios interesses, enquanto as Casas [governor_1.GetHouse.GetBaseName] e [governor_2.GetHouse.GetBaseName] estão distraídas..."
 ep3_governor_yearly.8110.t:0 "Colegas Pugilistas"
 ep3_governor_yearly.8120.a.failure:0 "Os esforços são um desastre"
 ep3_governor_yearly.8120.a.success:0 "Seus esforços valem a pena"
 ep3_governor_yearly.8120.a:0 "Eu pessoalmente supervisionarei a ajuda para o povo."
 ep3_governor_yearly.8120.b:0 "As vítimas serão apoiadas."
 ep3_governor_yearly.8120.c:0 "Doloroso que seja, devemos aceitar a vontade de [ROOT.Char.GetFaith.HighGodName]."
 ep3_governor_yearly.8120.desc:0 "Hoje recebi notícias sombrias de uma terrível calamidade em meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]:"
 ep3_governor_yearly.8120.earthquake:0 "um pequeno, mas poderoso terremoto devastou uma série de [disaster_county.GetNameNoTier] aldeias periféricas,"
 ep3_governor_yearly.8120.ending:0 "destruindo lares, edifícios públicos e vidas...\n\nSou rapidamente lembrado de que, como o [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], sou, em última instância, responsável por essas pessoas e lugares."
 ep3_governor_yearly.8120.storm:0 "uma feroz tempestade devastou uma série de [disaster_county.GetNameNoTier] aldeias periféricas,"
 ep3_governor_yearly.8120.t:0 "Um Ato de [ROOT.Char.GetFaith.HighGodName]"
 ep3_governor_yearly.8130.a:0 "Infelizmente, #EMP algumas#! contribuições extras #EMP são#! justificadas..."
 ep3_governor_yearly.8130.b:0 "Uma pequena coleta é tudo o que é necessário."
 ep3_governor_yearly.8130.c:0 "Necessitados de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] poderiam usar alguma ajuda."
 ep3_governor_yearly.8130.d:0 "O [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] não é meu bolso particular!"
 ep3_governor_yearly.8130.desc:0 "Como o [ROOT.Char.GetTitleAsNameNoTooltip] nomeado de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], sou um instrumento do [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], com plena autoridade sobre minha burocracia de [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], súditos e, naturalmente, #EMP impostos#!.\n\nRefletindo sobre as finanças provinciais, ocorre-me que estaria bem dentro das minhas atribuições instituir uma nova taxa menor sobre o povo — apenas para o bem do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], é claro..."
 ep3_governor_yearly.8130.t:0 "Avareza e Oportunidade"
 ep3_governor_yearly.8140.a:0 "Ultrajante, isso será corrigido!"
 ep3_governor_yearly.8140.b:0 "Eu vou mediar um acordo para ambas as partes."
 ep3_governor_yearly.8140.c:0 "[estate_owner.GetTitledFirstNameNoTooltip] pode fazer o que [estate_owner.GetSheHe] quiser, camponês."
 ep3_governor_yearly.8140.d:0 "Uma pena, mas não há nada que eu possa fazer."
 ep3_governor_yearly.8140.desc:0 "Um camponês de [estate_county.GetNameNoTier] foi trazido até mim, representando a lista de queixas de sua comunidade contra a propriedade da Casa [estate_owner.GetHouse.GetBaseName] nas proximidades em [estate.GetLocation.GetBaronyNameExplicitly].\n\n\"Bênçãos de [peasant.GetFaith.HighGodName] sobre você, [ROOT.Char.GetTitleAsNameNoTooltip]. Os nobres da propriedade local têm confiscado nossas terras, negando acesso aos bens comuns e exigindo impostos — tudo sob ameaça de violência!\""
 ep3_governor_yearly.8140.t:0 "Verificando a Casa [estate_owner.GetHouse.GetBaseNameNoTooltip]"
 ep3_governor_yearly.8150.a.failure:0 "Seus subornos apenas os irritam"
 ep3_governor_yearly.8150.a.success:0 "Eles rapidamente se acalmam"
 ep3_governor_yearly.8150.a:0 "Apenas a cabeça de uma cobra precisa ser neutralizada, [marshal.GetFirstNameNoTooltip]."
 ep3_governor_yearly.8150.b:0 "Uma concessão ou duas, e eles irão para casa."
 ep3_governor_yearly.8150.c:0 "Sim, um exemplo deve ser feito."
 ep3_governor_yearly.8150.county_tt:0 "Cada [faction|E] [targeting_faction.GetName] no [county|E], e [counties|E] capazes de se juntar ([SCOPE.ScriptValue('ep3_governor_yearly_8150_total_count_value')|V0])"
 ep3_governor_yearly.8150.culture:0 "[targeting_faction.MakeScope.Var('faction_culture').Culture.GetName] desordeiros!\""
 ep3_governor_yearly.8150.d.tt:0 "Receberá #V 2#! [regiments|E] de [skirmishers|E] ao declarar [war|E]"
 ep3_governor_yearly.8150.d:0 "Esses encrenqueiros vão ficar entediados logo."
 ep3_governor_yearly.8150.desc:0 "O descontentamento toma conta de [rebel_county.GetNameNoTier], e o povo se torna cada vez mais inquieto. Eu perderia muito prestígio se meu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] fosse ameaçado por uma insurreição...\n\n[Select_CString( marshal.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marshal'))], [marshal.GetFirstName], lê cansadamente em voz alta relatórios de armas roubadas de arsenais municipais, impostos retidos e ataques a patrulhas desavisadas.\n\n\"Algo #EMP deve#! ser feito sobre esses"
 ep3_governor_yearly.8150.faith:0 "[targeting_faction.MakeScope.Var('faction_faith').Faith.GetName] zelotes!\""
 ep3_governor_yearly.8150.peasant:0 "malditos camponeses, [ROOT.Char.GetTitleAsNameNoTooltip]!"
 ep3_governor_yearly.8150.t:0 "Borbulhando"
 ep3_governor_yearly.8160.a:0 "Uma rede maior pega mais peixes."
 ep3_governor_yearly.8160.b:0 "Você está certo, eles devem conhecer seu lugar."
 ep3_governor_yearly.8160.courtier_tt:0 "Você recrutará um administrador [minority_county.GetCountyData.GetFaith.GetAdjective] [minority_county.GetCountyData.GetCulture.GetName]"
 ep3_governor_yearly.8160.culture:0 "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip],"
 ep3_governor_yearly.8160.culture_councillor:0 "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip] — e os [councillor.GetCulture.GetCollectiveNounNoTooltip] naturalmente —"
 ep3_governor_yearly.8160.culture_county_tt:0 "Cada [county|E] [minority_county.GetCountyData.GetCulture.GetName]"
 ep3_governor_yearly.8160.culture_end:0 "e qualquer chamado por maior participação dos [minority_county.GetCountyData.GetCulture.GetCollectiveNounNoTooltip] deve ser extinto!\""
 ep3_governor_yearly.8160.culture_self:0 "[ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip] — oh e os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] é claro —"
 ep3_governor_yearly.8160.d:0 "Não vejo necessidade de mudar nada."
 ep3_governor_yearly.8160.desc:0 "[ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveNameNoTooltip|U] é uma terra de muitos povos e muitas confissões. Como [ROOT.Char.GetTitleAsNameNoTooltip] do [ROOT.Char.GetPrimaryTitle.GetAdjective] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip], sou responsável por estrangeiros e hereges, assim como pelos [ROOT.Char.GetTopLiege.GetCulture.GetCollectiveNounNoTooltip].\n\n[Select_CString( councillor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))], [councillor.GetFirstName], não tem receio de opinar que: \"a burocracia é o domínio de"
 ep3_governor_yearly.8160.faith:0 "bons [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip],"
 ep3_governor_yearly.8160.faith_county_tt:0 "Cada [county|E] [minority_county.GetCountyData.GetFaith.GetAdjective]"
 ep3_governor_yearly.8160.faith_end:0 "e qualquer chamado por maior participação dos [minority_county.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] [councillor.Custom2('GetUnbelieverTerm', administrator)] deve ser extinto!\""
 ep3_governor_yearly.8160.t:0 "Acesso Equitativo"
 ep3_governor_yearly.8170.a:0 "Implemente esse 'sistema de alerta' imediatamente!"
 ep3_governor_yearly.8170.b.failure:0 "Você entende fundamentalmente mal"
 ep3_governor_yearly.8170.b.success:0 "Suas ideias são super eficazes"
 ep3_governor_yearly.8170.b:0 "Tenho uma ideia melhor."
 ep3_governor_yearly.8170.c.failure:0 "Sua mensagem é ignorada"
 ep3_governor_yearly.8170.c.success:0 "[raider.GetTitledFirstNameNoTooltip] está encantado"
 ep3_governor_yearly.8170.c:0 "Talvez esse bandido possa ser convencido."
 ep3_governor_yearly.8170.d:0 "Os ataques são simplesmente parte da vida na fronteira."
 ep3_governor_yearly.8170.desc:0 "Defendendo contra ataques de"
 ep3_governor_yearly.8170.ending:0 "é vital para a segurança mais ampla do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\n[marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] recentemente inspecionou nossas medidas defensivas e passou a tarde toda propondo melhorias a partir de uma lista vertiginosa. A principal delas é um sistema de alerta, para dar tempo às aldeias de evacuarem."
 ep3_governor_yearly.8170.land:0 "além das fronteiras — particularmente dos vizinhos [raider.GetPrimaryTitle.GetAdjective] [raider.GetPrimaryTitle.GetTierAsNameNoTooltip] —"
 ep3_governor_yearly.8170.modifier_tt:0 "Cada [county|E] ameaçado [Select_CString( raider.IsFemale, 'pela', 'pelo' )] [raider.GetTitledFirstName] ([THIS.Char.MakeScope.Var('threatened_counties_count').GetValue|V0])"
 ep3_governor_yearly.8170.opinion_tt:0 "Cada [vassal|E] ameaçado [Select_CString( raider.IsFemale, 'pela', 'pelo' )] [raider.GetTitledFirstName] ([THIS.Char.MakeScope.Var('threatened_counties_count').GetValue|V0])"
 ep3_governor_yearly.8170.sea:0 "através do mar — particularmente dos temidos [raider.GetPrimaryTitle.GetAdjective] invasores —"
 ep3_governor_yearly.8170.t.land:0 "[raider.GetPrimaryTitle.GetAdjectiveNoTooltip] Incursões"
 ep3_governor_yearly.8170.t.sea:0 "[raider.GetPrimaryTitle.GetAdjectiveNoTooltip] Razzias"
 ep3_governor_yearly_8020_failure_tt:0 "Se eles recusarem:"
 ep3_governor_yearly_8150.end:0 "[marshal.GetSheHe] rosna."
 ep3_governor_yearly_8150_troop_name:0 "Revolta dos Camponeses"
 ep3_governor_yearly_8170_truce:0 "[raider.GetUINameNotMe|U] concordou em não saquear as terras de [governor.GetUIName|U]"
 ep3_otherwise_tt:0 "Caso contrário:"
