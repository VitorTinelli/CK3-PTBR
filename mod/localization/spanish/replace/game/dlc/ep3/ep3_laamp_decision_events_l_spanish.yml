 ep3_laamp_decision_event.1030.c.tt:0 "Ir até a [laamp_spouse_material.Custom('RaunchyComplimentNoun')] perto do balcão"
 ep3_laamp_decision_event.1030.c.tt_second:0 "Retomar a conversa com [laamp_spouse_material.GetShortUIName]"
 ep3_laamp_decision_event.1030.c:0 "Oh meu. Quem é #EMP isso#!?"
 ep3_laamp_decision_event.1030.c_second:0 "Para [laamp_spouse_material.GetFirstNameNoTooltip]. #EMP Agora#!."
 ep3_laamp_decision_event.1030.d.tt:0 "Aproximar-se da figura encapuzada."
 ep3_laamp_decision_event.1030.d.tt_second:0 "Voltar para [laamp_hooded_figure.GetShortUIName]."
 ep3_laamp_decision_event.1030.d:0 "Que figura encapuzada intrigante..."
 ep3_laamp_decision_event.1030.d_second:0 "Outra conversa com [laamp_hooded_figure.GetFirstNameNoTooltip] não faria mal."
 ep3_laamp_decision_event.1030.d_third:0 "Eu deveria voltar para [laamp_hooded_figure.GetFirstNameNoTooltip]."
 ep3_laamp_decision_event.1030.desc:0 "A taverna, reunindo viajantes e os [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] locais, está repleta de atividade."
 ep3_laamp_decision_event.1030.desc_mid:0 "\n\nUm contador de histórias está sentado perto do fogo um pouco mais adentro e na frente um grupo de amigos maltrapilhos está incomodando o garçom pedindo mais [visiting_location.GetCounty.GetTitle.GetHolder.Custom('RegionalDrink')]."
 ep3_laamp_decision_event.1030.desc_mid_return_reused_spouse:0 "\n\nPerto do balcão, [laamp_spouse_material.GetFirstName] ainda está sentada, traçando o topo da sua taça com um dedo esguio."
 ep3_laamp_decision_event.1030.desc_mid_return_spouse:0 "\n\nPerto do balcão, a [laamp_spouse_material.Custom('RandomPositiveShallowAdjective')] [laamp_spouse_material.Custom('RaunchyComplimentNoun')] de antes ainda está parada, cuidando de sua taça."
 ep3_laamp_decision_event.1030.desc_mid_reused_spouse:0 "$ep3_laamp_decision_event.1030.desc_mid_storyteller_intro$ Avisto a [laamp_spouse_material.Custom('RandomPositiveShallowAdjective')] [laamp_spouse_material.GetFirstName] sentada, claramente entediada."
 ep3_laamp_decision_event.1030.desc_mid_spouse:0 "$ep3_laamp_decision_event.1030.desc_mid_storyteller_intro$ [laamp_spouse_material.Custom('RandomPositiveShallowAdjectiveWithArticle')] [laamp_spouse_material.Custom('RaunchyComplimentNoun')] está sentada, aparentemente entediada."
 ep3_laamp_decision_event.1030.desc_mid_storyteller_intro:0 "\n\nUm contador de histórias está sentado perto do fogo um pouco mais adentro. Na frente, um grupo de amigos maltrapilhos incomoda o garçom pedindo mais [visiting_location.GetCounty.GetTitle.GetHolder.Custom('RegionalDrink')], e em um canto do balcão"
 ep3_laamp_decision_event.1030.desc_nomad:0 "Sou convidado a entrar em uma das tendas. Uma quantidade surpreendente de pessoas cabe dentro — viajantes e os [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip], todos se misturando em um #EMP zumbido#! humano contínuo."
 ep3_laamp_decision_event.1030.desc_nomad_mid:0 "\n\nDo lado de fora, um contador de histórias se senta perto da fogueira. Na frente, uma coleção de tribos barulhentas [visiting_location.GetCounty.GetTitle.GetHolder.GetWomenMen] reconta sua última excursão."
 ep3_laamp_decision_event.1030.desc_nomad_mid_spouse:0 "$ep3_laamp_decision_event.1030.desc_nomad_mid_storyteller_intro$ [laamp_spouse_material.Custom('RandomPositiveShallowAdjectiveWithArticle')] [laamp_spouse_material.Custom('RaunchyComplimentNoun')] está sentada, aparentemente entediada."
 ep3_laamp_decision_event.1030.desc_nomad_mid_storyteller_intro:0 "\n\nDo lado de fora, um contador de histórias se senta perto da fogueira. Na frente, uma coleção de tribos barulhentas [visiting_location.GetCounty.GetTitle.GetHolder.GetWomenMen] recontam sua última excursão, e em um canto do balcão"
 ep3_laamp_decision_event.1030.desc_nomad_returned_01:0 "Reentro na moradia, mais uma vez impressionado pela hospitalidade e atmosfera amigável enquanto deixo escapar um suspiro relaxado."
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_hood:0 "Navego de volta da outra tenda enquanto meus olhos se ajustam à escuridão da moradia."
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_recruit:0 "Voltando dos recrutas, quase tropeço em uma dupla de festeiros, atualmente ocupados provocando um terceiro, mais introvertido, homem por sua semelhança com um [ROOT.Char.Custom('RegionalMythicalCreatureLower')]."
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_story:0 "Os detalhes da história d[Select_CString( laamp_storyteller.IsFemale, 'a', 'o' )] [laamp_storyteller.GetFirstName] ainda ecoando em minha mente, volto para dentro da moradia."
 ep3_laamp_decision_event.1030.desc_nomad_returned_from_unwinding_spouse:0 "Deixo a agradável tenda d[Select_CString( laamp_spouse_material.IsFemale, 'a', 'o' )] [laamp_spouse_material.GetFirstName], rearranjo meu traje e volto sorrateiramente para dentro da moradia com um novo ânimo."
 ep3_laamp_decision_event.1030.desc_outro:0 "\n\nDou alguns passos para dentro do [ROOT.Char.Custom('GetRoomTent')] brilhante e quente, ponderando o que fazer primeiro."
 ep3_laamp_decision_event.1030.desc_outro_hooded:0 "\n\nPerto da entrada, avisto uma figura encapuzada discreta. Claramente alguém que valoriza sua privacidade."
 ep3_laamp_decision_event.1030.desc_outro_hooded_noble_return:0 "$ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro$ tomando mais um copo."
 ep3_laamp_decision_event.1030.desc_outro_hooded_return:0 "$ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro$ mexendo com uma pequena adaga."
 ep3_laamp_decision_event.1030.desc_outro_hooded_return_intro:0 "\n\nAo lado da entrada, a figura encapuzada discreta ainda está sentada,"
 ep3_laamp_decision_event.1030.desc_outro_partner:0 "\n\n[visiting_partner.GetFirstName] olha em volta para a confusão de indivíduos com um brilho intrigado no seu olho."
 ep3_laamp_decision_event.1030.desc_outro_return_01:0 "\n\nO clima está animado e alguns frequentadores do [ROOT.Char.Custom('GetTavernDwelling')] começaram a cantar uma melodia [visiting_location.GetCounty.GetCulture.GetNameNoTooltip]. No meio do barulho, eu considero meu próximo movimento."
 ep3_laamp_decision_event.1030.desc_outro_return_02:0 "\n\nNa parte de trás do [ROOT.Char.Custom('GetRoomTent')], um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] nobre está ocupado conversando com um camponês [ROOT.Char.Custom('GetRandomWomanMan')]. Meus olhos demoram-se no brasão d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] nobre [ROOT.Char.Custom('WomanManPossessive')] enquanto pondero o que fazer a seguir."
 ep3_laamp_decision_event.1030.desc_outro_return_03:0 "\n\nEm uma mesa perto da entrada, alguns locais estão jogando um jogo de tabuleiro exótico usando peças ásperas de pedra preta e branca. Observando suas jogadas, eu cuidadosamente pondero minhas opções."
 ep3_laamp_decision_event.1030.desc_outro_return_finished:0 "\n\nOlhando ao redor do [ROOT.Char.Custom('GetRoomTent')], parece muito mais vazio agora, ao perceber que não tenho mais nada a fazer."
 ep3_laamp_decision_event.1030.desc_outro_return_partner_01:0 "\n\nEm um canto do [ROOT.Char.Custom('GetTavernDwelling')], [visiting_partner.GetFirstName] observa um grupo de locais jogando objetos cortantes em um barril quebrado com uma fascinação mórbida.\n\nEu olho para o jogo enquanto considero o que fazer a seguir."
 ep3_laamp_decision_event.1030.desc_outro_return_partner_02:0 "\n\nÀ minha direita, [visiting_partner.GetFirstName] sorri apreciativamente enquanto um camponês termina uma piada grosseira envolvendo vários fluidos corporais. Eu dou a [visiting_partner.GetSheHe] um olhar surpreso, enquanto pondero o que fazer a seguir."
 ep3_laamp_decision_event.1030.desc_outro_return_partner_03:0 "\n\nMais à frente, [visiting_partner.GetFirstName] entra em uma pequena dança enquanto o trovador do [ROOT.Char.Custom('GetTavernDwelling')] encerra uma canção folclórica local. Eu observo a dança relaxadamente enquanto pondero o que fazer em seguida."
 ep3_laamp_decision_event.1030.desc_outro_return_partner_finished:0 "\n\n[visiting_partner.GetFirstName], que já está começando a parecer um pouco cansado, lança um olhar para uma mesa próxima: \"Se formos ficar muito mais tempo, poderíamos pelo menos comer algo, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?\""
 ep3_laamp_decision_event.1030.desc_returned_01:0 "Reentro na taverna percebendo que não muito mudou, entre os viajantes e os andarilhos relaxando enquanto suas necessidades são atendidas."
 ep3_laamp_decision_event.1030.desc_returned_02:0 "De volta ao [ROOT.Char.Custom('GetTavernDwelling')], alguns seguranças [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] acabaram de encerrar uma discussão que virou briga."
 ep3_laamp_decision_event.1030.desc_returned_from_hood:0 "Navego de volta do porão enquanto meus olhos se ajustam à luz aumentada do salão comum."
 ep3_laamp_decision_event.1030.desc_returned_from_hood_noble:0 "A tensão ainda está alta quando deixo [laamp_hooded_figure.GetFirstName] em seu dilema e sigo de volta ao centro do [ROOT.Char.Custom('GetRoomTent')]."
 ep3_laamp_decision_event.1030.desc_returned_from_hood_noble_fail:0 "Ao falhar em resolver a situação, os seguranças locais jogam [laamp_hooded_figure.GetFirstName] e sua briga para fora do [ROOT.Char.Custom('GetTavernDwelling')]. Caminho cautelosamente de volta ao centro do [ROOT.Char.Custom('GetRoomTent')]."
 ep3_laamp_decision_event.1030.desc_returned_from_recruit:0 "Enquanto volto dos recrutas, sinto um aroma tentador vindo da [visiting_location.GetCounty.GetTitle.GetHolder.Custom('GetLocalStreetFoodPlural')] sendo preparado na cozinha."
 ep3_laamp_decision_event.1030.desc_returned_from_spouse:0 "Quando deixo a companhia [laamp_spouse_material.GetHerHim], [laamp_spouse_material.GetFirstName] retoma a conversa com alguns [ROOT.Char.Custom('GetTaverngoersTribespeople')] amigáveis enquanto marcho de volta ao centro do [ROOT.Char.Custom('GetRoomTent')]."
 ep3_laamp_decision_event.1030.desc_returned_from_story:0 "Os detalhes da história d[Select_CString( laamp_storyteller.IsFemale, 'a', 'o' )] [laamp_storyteller.GetFirstName] ainda ecoando em minha mente, volto para o salão comum decididamente mais barulhento."
 ep3_laamp_decision_event.1030.desc_returned_from_unwinding_spouse:0 "Deixo a agradável companhia d[Select_CString( laamp_spouse_material.IsFemale, 'a', 'o' )] [laamp_spouse_material.GetFirstName], rearranjo meu traje e retorno de um dos fundos com um novo ânimo."
 ep3_laamp_decision_event.1030.e:0 "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1030.e_second:0 "Estamos terminados aqui."
 ep3_laamp_decision_event.1030.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: a [ROOT.Char.Custom('GetTavernDwelling')|U]"
 ep3_laamp_decision_event.1031.a.cooldown.tt:0 "Você refletiu sobre uma história recentemente — retorne em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_storied_recently') )]"
 ep3_laamp_decision_event.1031.a:0 "Essa história teve alguns bons pontos."
 ep3_laamp_decision_event.1031.a_eccentric:0 "Veja, agora isso faz todo sentido!"
 ep3_laamp_decision_event.1031.a_failure.desc:0 "Pelo menos foi uma história emocionante."
 ep3_laamp_decision_event.1031.a_failure.t:0 "Boa História"
 ep3_laamp_decision_event.1031.a_semi_success.desc:0 "Partes da história são aplicáveis à sua situação."
 ep3_laamp_decision_event.1031.a_semi_success.t:0 "Oportunidade de Crescimento"
 ep3_laamp_decision_event.1031.a_success.desc:0 "Você aprende algo com a moral da história."
 ep3_laamp_decision_event.1031.a_success.t:0 "Habilidades Através de Morais"
 ep3_laamp_decision_event.1031.a_zealous:0 "...acho que teve um ou dois pontos relevantes."
 ep3_laamp_decision_event.1031.b.cooldown.tt:0 "Você se divertiu com uma história recentemente — retorne em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_reveled_recently') )]"
 ep3_laamp_decision_event.1031.b:0 "\"[laamp_storyteller.GetFirstNameNoTooltip], como você conta histórias tão bem?\""
 ep3_laamp_decision_event.1031.b_reveler:0 "Eu conheço essa!"
 ep3_laamp_decision_event.1031.c.cooldown.tt:0 "Você desfrutou de uma história recentemente — retorne em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1031_has_relaxed_recently') )]"
 ep3_laamp_decision_event.1031.c:0 "\"Essa foi uma ótima história, amigo!\""
 ep3_laamp_decision_event.1031.c_zealous:0 "Bah. Que absurdo blasfêmico."
 ep3_laamp_decision_event.1031.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1031.desc_01:0 "#EMP \"...e ansiando para se livrar da incessante martelada, a cabeça de Zeus foi dividida em duas e de lá surgiu Atena, a mais sábia das divindades.\"#!"
 ep3_laamp_decision_event.1031.desc_02:0 "#EMP \"...e então Hórus e Set se tornaram inimigos mortais, lutando pelo trono vazio.\"#!"
 ep3_laamp_decision_event.1031.desc_03:0 "#EMP \"...e desde aquele dia, Ruha foi banida do Mundo da Luz e exilada para o Mundo das Trevas.\"#!"
 ep3_laamp_decision_event.1031.desc_04:0 "#EMP \"...e então o grande Leviatã destruiu o mundo pela quinta vez, morrendo no processo. Mas de seu corpo surgiram novas terras, plantas e animais.\"#!"
 ep3_laamp_decision_event.1031.desc_05:0 "#EMP \"...e então ele se tornou o atua das florestas, Tangaroa herdou os mares, Rūaumoko a terra tremulante e Tāwhirimatea o vento caprichoso.\"#!"
 ep3_laamp_decision_event.1031.desc_06:0 "#EMP \"...e então o ovo caiu; suas partes formando o universo — a gema do ovo se tornou o sol quente e a clara se tornou a bela lua.\"#!"
 ep3_laamp_decision_event.1031.desc_07:0 "#EMP \"...e então Kuutar fiou o fio dourado em uma magnífica túnica; larga como o céu noturno e longa como a eternidade.\"#!"
 ep3_laamp_decision_event.1031.desc_08:0 "#EMP \"...e então, quando ela percebeu que era seu próprio irmão, Kullervo, quem a seduzira, ela caiu do penhasco e na vida além.\"#!"
 ep3_laamp_decision_event.1031.desc_09:0 "#EMP \"...e então Finn, em sua raiva, virou pedra. Seus sonhos de destruição nunca foram realizados e, assim, a catedral ainda permanece, até hoje.\"#!"
 ep3_laamp_decision_event.1031.desc_10:0 "#EMP \"...e apesar do aviso de Kaangs, os humanos acenderam um fogo na crescente escuridão, e os animais fugiram para as colinas.\"#!"
 ep3_laamp_decision_event.1031.desc_11:0 "#EMP \"...e então o barro amassado foi coberto com pele, preenchido com sangue e Tore o nomeou Baatsi.\"#!"
 ep3_laamp_decision_event.1031.desc_12:0 "#EMP \"...e então o acampamento cheio de mulheres emergiu vitorioso sobre o acampamento cheio de homens, permitindo que eles mais uma vez #EMP interagissem#! uns com os outros.\"#!"
 ep3_laamp_decision_event.1031.desc_13:0 "#EMP \"...e eles a chamaram de Teryel, a primeira leoa.\"#!"
 ep3_laamp_decision_event.1031.desc_14:0 "#EMP \"...e o Soma foi dado aos deuses, mas quatro gotas foram derramadas sobre a própria terra, e dessas gotas surgiram cidades sagradas.\"#!"
 ep3_laamp_decision_event.1031.desc_15:0 "#EMP \"...e com um grande gole, o Culebre devorou sua vaca, patas e tudo.\"#!"
 ep3_laamp_decision_event.1031.desc_16:0 "#EMP \"...e então Toranos recebeu o sacrifício; o sangue escorrendo por seu torso, reanimando-o, criando assim uma nova primavera.\"#!"
 ep3_laamp_decision_event.1031.desc_17:0 "#EMP \"...e então Tjelvar veio à ilha, trazendo fogo, que fez a ilha parar de afundar nas ondas a cada noite.\"#!"
 ep3_laamp_decision_event.1031.desc_18:0 "#EMP \"...e então vieram as chuvas na África, com muito canto, dança e alegria.\"#!"
 ep3_laamp_decision_event.1031.desc_19:0 "#EMP \"...e quando ele retornou à praia pela manhã, o rei percebeu que as pedras preciosas haviam cercado o tesouro-mãe por conta própria.\"#!"
 ep3_laamp_decision_event.1031.desc_outro:0 "\n\n\"Mas essa história é para outra hora.\" O contador de histórias me dá um sorriso misterioso, recosta-se em sua poltrona junto à lareira e dá outro gole em [laamp_storyteller.Custom('RegionalDrink')]."
 ep3_laamp_decision_event.1031.return.tt:0 "Você retorna à entrada do [THIS.Char.Custom('GetTavernDwelling')]"
 ep3_laamp_decision_event.1031.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Contador de Histórias"
 ep3_laamp_decision_event.1033.a:0 "\"Que tal você trabalhar para mim, [laamp_first_recruit.GetFirstNameNoTooltip]?\""
 ep3_laamp_decision_event.1033.b:0 "[laamp_second_recruit.GetFirstNameNoTooltip] parece um bom espécime."
 ep3_laamp_decision_event.1033.c:0 "Eu só vejo potencial em [laamp_third_recruit.GetFirstNameNoTooltip]."
 ep3_laamp_decision_event.1033.d.cooldown.tt:0 "Você recrutou um [follower|E] livre recentemente - retorne em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1033_generic_jane_cooldown') )]"
 ep3_laamp_decision_event.1033.d:0 "\"...[laamp_generic_jane.GetFirstNameNoTooltip], não era? Junte-se a mim.\""
 ep3_laamp_decision_event.1033.desc:0 "Aproximando-me do grupo de [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] desempregados, levanto minha voz e os endereço diretamente: \"Estou procurando algumas pessoas habilidosas e confiáveis para se juntar ao meu acampamento! Quem entre vocês está disposto para essa tarefa?\""
 ep3_laamp_decision_event.1033.desc_jane_outro:0 "\n\nAo terminar as apresentações, um brusco [laamp_generic_jane.GetWomanMan] se aproxima de mim imediatamente: \"Meu nome é [laamp_generic_jane.GetFirstName]. Por razões que são minhas, eu gostaria de me juntar ao seu acampamento.\""
 ep3_laamp_decision_event.1033.desc_mid_three:0 "\n\nAs partes interessadas se apresentam como [laamp_first_recruit.GetFirstName] o [laamp_first_recruit.Custom('PersonalityGetNegativeTraitDesc')|U], [laamp_second_recruit.GetFirstName] o [laamp_second_recruit.Custom('PersonalityGetNegativeTraitDesc')|U] e [laamp_third_recruit.GetFirstName] o [laamp_third_recruit.Custom('PersonalityGetNegativeTraitDesc')|U]."
 ep3_laamp_decision_event.1033.desc_mid_two:0 "\n\nAs partes interessadas se apresentam como [laamp_first_recruit.GetFirstName] o [laamp_first_recruit.Custom('PersonalityGetNegativeTraitDesc')] e [laamp_second_recruit.GetFirstName] o [laamp_second_recruit.Custom('PersonalityGetNegativeTraitDesc')]."
 ep3_laamp_decision_event.1033.desc_outro:0 "\n\nEu olho os candidatos de cima a baixo, tentando decidir qual recrutar."
 ep3_laamp_decision_event.1033.desc_partner_outro:0 "\n\n[visiting_partner.GetFirstName] faz um som e observa os prospects enquanto eu considero qual candidato recrutar."
 ep3_laamp_decision_event.1033.desc_returned_01:0 "Ao retornar aos potenciais recrutas, [laamp_first_recruit.GetFirstName], [laamp_second_recruit.GetFirstName] e [laamp_third_recruit.GetFirstName] se observam desconfiados.$ep3_laamp_decision_event.1033.desc_returned_outro_01$"
 ep3_laamp_decision_event.1033.desc_returned_02:0 "De volta aos recrutas, o trio composto por [laamp_first_recruit.GetFirstName], [laamp_second_recruit.GetFirstName] e [laamp_third_recruit.GetFirstName] aparentemente acabou de resolver uma disputa.$ep3_laamp_decision_event.1033.desc_returned_outro_02$"
 ep3_laamp_decision_event.1033.desc_returned_jane_01:0 "Ao retornar aos potenciais recrutas, [laamp_first_recruit.GetFirstName] e [laamp_second_recruit.GetFirstName] engajam-se em uma conversa tranquila."
 ep3_laamp_decision_event.1033.desc_returned_jane_02:0 "De volta aos recrutas, o duo de [laamp_first_recruit.GetFirstName] e [laamp_second_recruit.GetFirstName] acaba de terminar um jogo de dados com resultados contestados."
 ep3_laamp_decision_event.1033.desc_returned_jane_outro:0 "\n\n[laamp_generic_jane.GetFirstNameNoTooltip] ainda está em um canto, devolvendo meu olhar enquanto eu avalio os candidatos."
 ep3_laamp_decision_event.1033.desc_returned_outro_01:0 "\n\nQuando me notam, eles se animam coletivamente e me encaram expectantes."
 ep3_laamp_decision_event.1033.desc_returned_outro_02:0 "\n\nA tensão no ar muda ligeiramente à medida que me aproximo, transformando-se em uma expectativa cautelosa."
 ep3_laamp_decision_event.1033.e:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1033.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: os Recrutas"
 ep3_laamp_decision_event.1035.a:0 "\"Que tal eu te comprar mais uma caneca de [laamp_spouse_material.Custom('RegionalDrink')]?\""
 ep3_laamp_decision_event.1035.b.cooldown.tt:0 "Você recentemente tentou atrair um potencial [spouse|E] — tente novamente em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_spouse_duelled_recently') )]"
 ep3_laamp_decision_event.1035.b.failure.tt:0 "[laamp_spouse_material.GetShortUIName] começa a ignorá-lo."
 ep3_laamp_decision_event.1035.b.failure:0 "Você não consegue atrair a atenção de [laamp_spouse_material.GetShortUIName]."
 ep3_laamp_decision_event.1035.b.success:0 "[laamp_spouse_material.GetShortUIName] está encantado com suas investidas."
 ep3_laamp_decision_event.1035.b_fallback:0 "\"O que um[Select_CString( laamp_spouse_material.IsFemale, 'a', '' )] [laamp_spouse_material.Custom('GirlBoy')] como você está fazendo em um lugar como este?\""
 ep3_laamp_decision_event.1035.b_fifth:0 "\"Se você me deixar pegar um beijo emprestado, eu #EMP prometo#! devolvê-lo na hora.\""
 ep3_laamp_decision_event.1035.b_first:0 "\"Além de #EMP roubar corações#!, o que mais você faz?\""
 ep3_laamp_decision_event.1035.b_fourth:0 "\"Você pesca? Porque você me #EMP fisgou#!.\""
 ep3_laamp_decision_event.1035.b_second:0 "\"Você tem um nome? Ou posso te chamar de #EMP meu#!?\""
 ep3_laamp_decision_event.1035.b_third:0 "\"Você tem um mapa? Eu acabei de #EMP me perder#! nos seus olhos.\""
 ep3_laamp_decision_event.1035.c.cooldown.tt:0 "Você se relaxou em um [ROOT.Char.Custom('GetTavernDwelling')] recentemente — retorne novamente em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1035_spouse_unwinded_recently') )]"
 ep3_laamp_decision_event.1035.c:0 "\"...por que não levamos isso para um lugar #EMP mais confortável#!...\""
 ep3_laamp_decision_event.1035.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1035.desc:0 "Estou observando atentamente o [laamp_spouse_material.Custom('RaunchyComplimentNoun')] sentado [laamp_spouse_material.GetHerselfHimself] em uma mesa próxima. o proprietário do [ROOT.Char.Custom('GetTavernDwelling')] chamou [laamp_spouse_material.GetHerHim] de [laamp_spouse_material.GetFirstName], não chamou? \n\n[laamp_spouse_material.GetSheHe|U] parece confuso enquanto me aproximo [laamp_spouse_material.GetHerHim], possivelmente porque minha turbulência interna está clara como água em meu rosto. Por que isso me incomodaria? #EMP Eu sou [ROOT.Char.GetNameNoTooltip], droga!#! \n\nContinuo me lembrando das minhas conquistas recentes para me manter calmo. Estou falhando na maioria das vezes."
 ep3_laamp_decision_event.1035.desc_returned_01:0 "Eu volto para a mesa de [laamp_spouse_material.GetFirstName] e o sangue imediatamente começa a pulsar nos meus ouvidos.\n\nFique. Calmo. #EMP Faça uma conversa.#!\n\n[laamp_spouse_material.GetFirstNameNoTooltip] está ocupado conversando com um [laamp_spouse_material.Custom('WomanManOpposite')] próximo enquanto me aproximo [laamp_spouse_material.GetHerHim], e os olhos [laamp_spouse_material.GetHerHim] se estreitam em antecipação:"
 ep3_laamp_decision_event.1035.desc_returned_02:0 "Quando volto para a mesa [laamp_spouse_material.GetHerHim], [laamp_spouse_material.GetFirstName] acaba de receber um prato quente de comida, cujo aroma faz meu estômago roncar.\n\n[laamp_spouse_material.GetSheHe|U] mantém seus olhos fixados no [visiting_location.GetCounty.GetTitle.GetHolder.Custom('GetLocalStreetFood')] à frente [laamp_spouse_material.GetHerHim] enquanto [laamp_spouse_material.GetSheHe] comenta secamente: \"Você realmente #EMP queria#! algo desta vez?\"\n\nEu hesito na saudação sarcástica e considero minha resposta cuidadosamente:"
 ep3_laamp_decision_event.1035.desc_reused_spouse:0 "Eu me aproximo de [laamp_spouse_material.GetFirstName], que, radiante como sempre, olha para cima quando me aproximo.\n\n[laamp_spouse_material.GetSheHe|U] parece lutar momentaneamente para me reconhecer — então, os olhos [laamp_spouse_material.GetHerHim] se estreitam em reconhecimento.\n\n#EMP Nada pessoal#!, eu digo a mim mesmo, e sorrio fracamente enquanto ignoro a sensação de desconforto em meu peito:"
 ep3_laamp_decision_event.1035.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Potencial Par"
 ep3_laamp_decision_event.1037.a.flavor:0 "Tenho certeza de que isso será útil."
 ep3_laamp_decision_event.1037.a:0 "\"Vou quitar a conta [laamp_hooded_figure.GetHerHim].\""
 ep3_laamp_decision_event.1037.b.failure.t:0 "Não Convincente"
 ep3_laamp_decision_event.1037.b.failure:0 "Você não consegue convencer o patife"
 ep3_laamp_decision_event.1037.b.flavor:0 "Qual é o pior que poderia acontecer?"
 ep3_laamp_decision_event.1037.b.success.t:0 "[laamp_hooded_figure.GetWomanMan|U] Nobre Salv[Select_CString( laamp_hooded_figure.IsFemale, 'a', 'o' )]"
 ep3_laamp_decision_event.1037.b.success:0 "Você convence com sucesso o patife a deixar [laamp_hooded_figure.GetShortUIName] em paz"
 ep3_laamp_decision_event.1037.b_diplomacy:0 "\"Certamente você ganharia mais ouro com um cliente #EMP que retorna#!\""
 ep3_laamp_decision_event.1037.b_intrigue:0 "\"Os guarda-costas [laamp_hooded_figure.GetHerHim|U] estão #EMP logo#! do lado de fora, sabe...\""
 ep3_laamp_decision_event.1037.b_learning:0 "\"Nós somos melhores do que isso, com certeza?\""
 ep3_laamp_decision_event.1037.b_martial:0 "\"Quer resolver isso com #EMP eu#! em vez?\""
 ep3_laamp_decision_event.1037.b_stewardship:0 "\"Isso não é o imposto sobre a #EMP acomodação#! atual, lamento.\""
 ep3_laamp_decision_event.1037.c.flavor:0 "Já vi coisas piores."
 ep3_laamp_decision_event.1037.c:0 "\"Este #EMP [laamp_hooded_figure.GetTitleAsNameNoTooltip]#! já está comprometido, [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('InsultNoun', ROOT.Char)]!\""
 ep3_laamp_decision_event.1037.d:0 "\"Eu poderia usar um [laamp_hooded_figure.GetWomanMan] da sua habilidade, [laamp_hooded_figure.GetFirstNameNoTooltip].\""
 ep3_laamp_decision_event.1037.d_thief_position:0 "\"Você sabe, tenho uma posição vaga de $master_thief_camp_officer$ só para você.\""
 ep3_laamp_decision_event.1037.desc:0 "$ep3_laamp_decision_event.1037.desc_intro$$ep3_laamp_decision_event.1037.desc_outro$"
 ep3_laamp_decision_event.1037.desc_intro:0 "A figura encapuzada desliza sutilmente pelo tavern e desce uma escada para a adega. Eu olho ao redor cautelosamente enquanto sigo [laamp_hooded_figure.GetSheHe] escada abaixo.\n\nNo fundo, [laamp_hooded_figure.GetSheHe] se senta em uma cadeira em frente a uma mesa e deixa o capuz cair."
 ep3_laamp_decision_event.1037.desc_noble:0 "...e então há o imposto sobre a #EMP acomodação#!,\" o patife [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] comenta com um sorriso sarcástico, enquanto [ROOT.Char.GetSheHe] gesticula em direção à cadeira da figura encapuzada. \"Isso é um pouco mais de ouro, com certeza.\"\n\nA [laamp_hooded_figure.GetWomanMan] encapuzada imediatamente se levanta, e quando o capuz cai, eu reconheço [laamp_hooded_figure.GetSheHe] como ninguém menos que [laamp_hooded_figure.GetName]: \"Isto é um escândalo!\" o [laamp_hooded_figure.GetTitleAsNameNoTooltip] exclama, claramente abalado.\n\n\"Não me faça perguntar aos meus #EMP parceiros de negócios#!\" o patife ameaça, e a situação se torna cada vez mais tensa."
 ep3_laamp_decision_event.1037.desc_noble_returned_01:0 "Volto para [laamp_hooded_figure.GetFirstName], que ainda está em um conflito fervoroso com o rufião local.\n\nSeus olhares entrelaçados, o impasse está completo e apenas manchado pelo rufião [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] que ocasionalmente lança um olhar para a porta, como se estivesse esperando por algo. Ou #EMP alguém#!.\n\nSinto uma gota de suor escorrendo pelas minhas costas."
 ep3_laamp_decision_event.1037.desc_noble_returned_02:0 "De volta à mesa de [laamp_hooded_figure.GetFirstName], a tensão permanece inalterada e o rufião [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] ainda aguarda seu pagamento.\n\no [laamp_hooded_figure.GetTitleAsNameNoTooltip] #EMP se recusa#! a ceder, e o ocasional transeunte diminui a velocidade ao passar, apenas para acelerar ao perceber o que está prestes a acontecer.\n\nMeu olhar oscila inquieto de um para o outro."
 ep3_laamp_decision_event.1037.desc_nomad:0 "$ep3_laamp_decision_event.1037.desc_nomad_intro$$ep3_laamp_decision_event.1037.desc_outro$"
 ep3_laamp_decision_event.1037.desc_nomad_intro:0 "A figura encapuzada desliza sutilmente pela moradia e sai pela outra extremidade. Eu olho ao redor cautelosamente enquanto sigo [laamp_hooded_figure.GetSheHe] para fora e em uma tenda adjacente.\n\nDentro, [laamp_hooded_figure.GetSheHe] se senta em uma cadeira em frente a uma mesa e deixa o capuz cair."
 ep3_laamp_decision_event.1037.desc_nomad_returned_01:0 "$ep3_laamp_decision_event.1037.desc_nomad_returned_01_intro$ $ep3_laamp_decision_event.1037.desc_returned_01_outro$"
 ep3_laamp_decision_event.1037.desc_nomad_returned_01_intro:0 "Na outra tenda, [laamp_hooded_figure.GetFirstName] está ocupado observando um mapa. Eu acidentalmente esbarro em um [laamp_hooded_figure.Custom('GetSmallHidingObject')]"
 ep3_laamp_decision_event.1037.desc_nomad_returned_02:0 "Eu levanto a aba da tenda e olho para dentro antes de entrar: $ep3_laamp_decision_event.1037.desc_returned_02_outro$"
 ep3_laamp_decision_event.1037.desc_nomad_returned_03:0 "Parado do lado de fora da tenda do patife [laamp_hooded_figure.GetFirstName], eu ouço algo que soa como um movimento vindo de dentro. Então, de repente, para.\n\nEu espreito cautelosamente a cabeça dentro da tenda e avisto [laamp_hooded_figure.GetSheHe] na escuridão, limpando uma faca de uma substância escura. Sangue... ?\n\n[laamp_hooded_figure.GetSheHe|U] se vira indiferenemente em minha direção: \"Só um #EMP rato#!. Mas você, por outro lado, é um persistente, não?\""
 ep3_laamp_decision_event.1037.desc_nomad_reused_thief:0 "$ep3_laamp_decision_event.1037.desc_nomad_intro$.$ep3_laamp_decision_event.1037.desc_reused_thief_outro$"
 ep3_laamp_decision_event.1037.desc_outro:0 ": \"Suponho que você me reconheça pela minha reputação? '#EMP o [laamp_hooded_figure.Custom2('CriminalAdjective', ROOT.Char)] e [laamp_hooded_figure.Custom2('CriminalCrierInsult', ROOT.Char)] criminoso [laamp_hooded_figure.GetFirstNameNoTooltip]!'#!\"\n\n\"...Eu já #EMP amacenei#! pessoas por ofensas menores. Agora, o que você quer?\" O olhar de [laamp_hooded_figure.GetFirstName] se fixa em mim, enquanto [laamp_hooded_figure.GetSheHe] levanta uma sobrancelha inquisitiva."
 ep3_laamp_decision_event.1037.desc_returned_01:0 "$ep3_laamp_decision_event.1037.desc_returned_01_intro$ $ep3_laamp_decision_event.1037.desc_returned_01_outro$"
 ep3_laamp_decision_event.1037.desc_returned_01_intro:0 "De volta ao porão, [laamp_hooded_figure.GetFirstName] está ocupado observando um mapa. Uma tábua do chão range."
 ep3_laamp_decision_event.1037.desc_returned_01_outro:0 "e [laamp_hooded_figure.GetSheHe] se vira para me olhar.\n\n\"Você voltou,\" [laamp_hooded_figure.GetSheHe] comenta, enquanto [laamp_hooded_figure.GetSheHe] fecha cuidadosamente o mapa que mostra a propriedade próxima de [1037_neighboring_holding.GetBaronyNameExplicitly]: \"Você queria algo?\"\n\n[laamp_hooded_figure.GetSheHe|U] se levanta, cruzando seus braços e descansando sutilmente sobre uma perna."
 ep3_laamp_decision_event.1037.desc_returned_02:0 "Eu olho para baixo na adega antes de descer as escadas mais uma vez. $ep3_laamp_decision_event.1037.desc_returned_02_outro$"
 ep3_laamp_decision_event.1037.desc_returned_02_outro:0 "Eu olho para baixo na adega antes de descer as escadas mais uma vez. [laamp_hooded_figure.GetFirstName], o patife, está recostado em sua cadeira com seu olhar fixo no [ROOT.Char.Custom('GetCeilingCanopy')].\n\n[laamp_hooded_figure.GetSheHe|U] joga tranquilamente uma moeda [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] para o ar, a vira e, então, a pega com uma mão firme.\n\nEu limpo a garganta e [laamp_hooded_figure.GetFirstNameNoTooltip] fecha seus olhos enquanto [laamp_hooded_figure.GetSheHe] guarda a moeda, colocando suas mãos atrás da cabeça e [laamp_hooded_figure.GetSheHe] grunhe: \"Sim?\""
 ep3_laamp_decision_event.1037.desc_returned_03:0 "Ao retornar para a adega, a porta agora está fechada. Eu a abro cuidadosamente e desço as escadas.\n\nUm pouco mais adiante, [laamp_hooded_figure.GetFirstName] está limpando o chão de algo que parece... #EMP sangue#!? Com certeza é sangue de #EMP animal#!...\n\n[laamp_hooded_figure.GetSheHe|U] estala seu nós enquanto [laamp_hooded_figure.GetSheHe] guarda o balde e volta sua atenção para mim: \"Persistente, não?\""
 ep3_laamp_decision_event.1037.desc_reused_thief:0 "$ep3_laamp_decision_event.1037.desc_intro$.$ep3_laamp_decision_event.1037.desc_reused_thief_outro$"
 ep3_laamp_decision_event.1037.desc_reused_thief_outro:0 "\n\nEu reconheço [laamp_hooded_figure.GetFirstName] enquanto [laamp_hooded_figure.GetSheHe] bate empolgado seu punho na mesa: \"Bem, que diabos! Não esperava ver #EMP você#! de novo — não nesta vida, de qualquer forma. O que posso fazer por você?\""
 ep3_laamp_decision_event.1037.e.failure.tt:0 "[laamp_hooded_figure.GetShortUIName] começa a te ignorar"
 ep3_laamp_decision_event.1037.e.failure:0 "Você não consegue atrair [laamp_hooded_figure.GetShortUIName]"
 ep3_laamp_decision_event.1037.e.success:0 "[laamp_hooded_figure.GetShortUIName] está intrigado com essa ideia"
 ep3_laamp_decision_event.1037.e:0 "\"Um profissional da sua estirpe #EMP prosperaria#! em meu acampamento.\""
 ep3_laamp_decision_event.1037.f:0 "\"Você poderia me ensinar a... arte?\""
 ep3_laamp_decision_event.1037.g:0 "\"Nós dois juntos #EMP dominaríamos#! este reino, [laamp_hooded_figure.GetFirstNameNoTooltip].\""
 ep3_laamp_decision_event.1037.h:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1037.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Procurado [laamp_hooded_figure.GetWomanMan|U]"
 ep3_laamp_decision_event.1037.t_noble:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: [laamp_hooded_figure.GetFirstNameNoTooltip] está em apuros!"
 ep3_laamp_decision_event.1040.a.cooldown.tt:0 "O curandeiro está fora a negócios pelo resto desta visita"
 ep3_laamp_decision_event.1040.a.tt:0 "Ir para a cabana do curandeiro"
 ep3_laamp_decision_event.1040.a:0 "Os curandeiros certamente me fariam bem."
 ep3_laamp_decision_event.1040.a_second:0 "Devo voltar ao curandeiro."
 ep3_laamp_decision_event.1040.a_second_sickly_minor:0 "[1040_sickly_minor.GetFirstNameNoTooltip] ainda está esperando na cabana do curandeiro."
 ep3_laamp_decision_event.1040.a_sickly_minor:0 "Devemos ir à cabana do curandeiro!"
 ep3_laamp_decision_event.1040.b.cooldown.tt:0 "A [visiting_location.GetCounty.GetFaith.HouseOfWorship] está ocupada com uma cerimônia pelo resto desta visita"
 ep3_laamp_decision_event.1040.b.tt:0 "Entrar na [visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1040.b:0 "A [visiting_location.GetCounty.GetFaith.HouseOfWorship] parece intrigante."
 ep3_laamp_decision_event.1040.b_second:0 "Vamos voltar para a [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.c.cooldown.tt:0 "O jardim está cheio de pessoas pelo resto desta visita"
 ep3_laamp_decision_event.1040.c.tt:0 "Visitar o jardim anexo"
 ep3_laamp_decision_event.1040.c:0 "Um passeio pelo jardim não faria mal."
 ep3_laamp_decision_event.1040.c_second:0 "Preciso revisitar o jardim."
 ep3_laamp_decision_event.1040.d.tt:0 "Falar com o médico [laamp_physician_recruit.GetShortUIName]"
 ep3_laamp_decision_event.1040.d:0 "Talvez o pregador tenha um ponto?"
 ep3_laamp_decision_event.1040.d_second:0 "Outra conversa com [laamp_physician_recruit.GetFirstNameNoTooltip] não faria mal."
 ep3_laamp_decision_event.1040.desc:0 "Há uma certa paz na praça da [visiting_location.GetCounty.GetFaith.HouseOfWorship], apesar de haver muito comércio, [visiting_location.GetCounty.GetFaith.PriestNeuterPlural] e ajudantes por perto.\n\nUma magnífica [visiting_location.GetCounty.GetFaith.HouseOfWorship] se ergue no meio, e ao lado, avisto placas com ousadas promessas de cura, bem como um jardim anexo para a contemplação silenciosa de [visiting_location.GetCounty.GetFaith.HighGodName]."
 ep3_laamp_decision_event.1040.desc_outro:0 "\n\nEu me encontro em um estado de contentamento, olhando para a praça, e respiro fundo algumas vezes enquanto reflito sobre meu próximo destino."
 ep3_laamp_decision_event.1040.desc_outro_partner:0 "\n\n[visiting_partner.GetFirstName] acena agradecido e olha em volta da movimentada praça, já observando barracas curiosas e pontos de interesse."
 ep3_laamp_decision_event.1040.desc_outro_physician:0 "\n\nNa borda da praça, um devoto está pregando como uma melhor saúde corporal aumentará nossa saúde espiritual. [laamp_physician_recruit.GetSheHe|U] permanece firme, apesar das eventuais provocações da multidão de camponeses."
 ep3_laamp_decision_event.1040.desc_outro_physician_return:0 "\n\nO pregador devoto continua pregando sobre os ensinamentos relacionados à saúde [laamp_physician_recruit.GetHerHim], mas parece estar se aproximando do fim da palestra."
 ep3_laamp_decision_event.1040.desc_outro_physician_sickly_minor:0 "\n\nNa borda da praça, um devoto está pregando sobre melhor saúde corporal; e conforme acordado anteriormente, [Select_CString( 1040_sickly_minor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] doente [1040_sickly_minor.GetFirstName] foi escoltado e está esperando por mim na cabana do curandeiro."
 ep3_laamp_decision_event.1040.desc_outro_return_01:0 "\n\nEm um canto sombreado da praça, um vendedor está tentando convencer um nobre [ROOT.Char.GetWomanMan] das propriedades curativas da areia vermelha.\n\nEu observo casualmente a discussão deles enquanto pondero qual será meu próximo movimento."
 ep3_laamp_decision_event.1040.desc_outro_return_02:0 "\n\nEm uma barraca próxima que carrega espelhos de obsidiana, um [visiting_location.GetCounty.GetFaith.PriestNeuter] está tentando disfarçar sua empolgação enquanto finalmente tem a oportunidade de inspecionar [ROOT.Char.GetHerselfHimself].\n\nLevemente divertido, eu tento decidir para onde ir a seguir."
 ep3_laamp_decision_event.1040.desc_outro_return_03:0 "\n\nPerto da pequena rotunda, um vendedor carregando cópias de [ROOT.Char.Custom('RandomReligiousTextName')] está lendo em voz alta para um humilde público.\n\nEu ouço distraidamente enquanto observo a praça, ponderando o que fazer a seguir."
 ep3_laamp_decision_event.1040.desc_outro_return_finished:0 "\n\nApós passar um tempo considerável aqui na praça da [visiting_location.GetCounty.GetFaith.HouseOfWorship], estou satisfeito com os negócios deste dia e olho ao redor em busca do caminho mais rápido de volta à praça principal."
 ep3_laamp_decision_event.1040.desc_outro_return_partner_01:0 "\n\nÀ minha esquerda, [visiting_partner.GetFirstName] inspeciona curiosamente uma barraca coberta de frascos minúsculos — alegadamente preenchidos com gotas de veneno de um [ROOT.Char.Custom('VenomousCreature')].\n\nSó de pensar nisso, minha pele se arrepia, enquanto tento decidir para onde ir a seguir."
 ep3_laamp_decision_event.1040.desc_outro_return_partner_02:0 "\n\n[visiting_partner.GetFirstName] me cutuca no ombro, apontando para os guardas escoltando um [ROOT.Char.GetWomanMan] esfarrapado para fora das instalações, gritando sobre o fim do mundo.\n\nEu instintivamente levanto as sobrancelhas e observo a confusão enquanto considero o que fazer a seguir."
 ep3_laamp_decision_event.1040.desc_outro_return_partner_03:0 "\n\n[visiting_partner.GetFirstName] me oferece um pedaço enquanto caminhamos pela praça.\n\nEu mastigo pensativamente as rações secas enquanto pondero qual será meu próximo movimento."
 ep3_laamp_decision_event.1040.desc_outro_return_partner_finished:0 "\n\n[visiting_partner.GetFirstName], que está começando a parecer um pouco cansado, diz: \"Não sou de reclamar, mas... com certeza já terminamos aqui, [visiting_partner.Custom2('RelationToMe', ROOT.Char)]?\""
 ep3_laamp_decision_event.1040.desc_outro_sickly_minor:0 "\n\nComo combinado com um dos atendentes do acampamento, [Select_CString( 1040_sickly_minor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] doente [1040_sickly_minor.GetFirstName] foi escoltado e está me esperando na cabana do curandeiro."
 ep3_laamp_decision_event.1040.desc_outro_sickly_minor_return:0 "\n\nPor algum motivo, parece haver uma abundância de crianças na praça. Estavam elas aqui o tempo todo? Elas brincam e se empurram, constantemente encontrando novas maneiras de fazer coisas antigas; não raramente para a surpresa e desgosto de seus cuidadores.\n\nMinha mente continua refletindo sobre o estado de saúde de [1040_sickly_minor.GetFirstName] enquanto olho ao redor da praça em busca do meu próximo destino."
 ep3_laamp_decision_event.1040.desc_returned_01:0 "De volta aos terrenos da [visiting_location.GetCounty.GetFaith.HouseOfWorship], tudo está igual. À medida que o sol se move lentamente pelo céu, os edifícios adjacentes da praça se revezam em proporcionar sombra para a praça aberta"
 ep3_laamp_decision_event.1040.desc_returned_02:0 "Um intenso aroma de incenso penetra implacavelmente minhas narinas enquanto caminho pelo sol suave de volta aos terrenos da [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.desc_returned_from_church:0 "Ao voltar pelos portões da [visiting_location.GetCounty.GetFaith.HouseOfWorship], uma tranquilidade arcádica me acompanha enquanto me encontro de volta na praça da [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.desc_returned_from_garden:0 "Eu volto do jardim sereno me sentindo mais leve, enquanto olho para a movimentada praça da [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.desc_returned_from_healer:0 "Eu squinto enquanto subo da escuridão da cabana do curandeiro, encontrando meu caminho de volta à praça da [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.desc_returned_from_physician:0 "Eu sigo pelos becos estreitos de volta do estudo de [laamp_physician_recruit.GetFirstNameNoTooltip] e me encontro de volta aos terrenos da [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1040.e:0 "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1040.e_second:0 "Terminamos aqui."
 ep3_laamp_decision_event.1040.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: os terrenos da [visiting_location.GetCounty.GetFaith.HouseOfWorship|U]"
 ep3_laamp_decision_event.1041.a:0 "Talvez um equilíbrio de humores me faria bem."
 ep3_laamp_decision_event.1041.a_ill:0 "\"Eu... poderia usar um tratamento, sim.\""
 ep3_laamp_decision_event.1041.b:0 "\"Estou interessado naquele [1041_health_artifact.GetNameNoTooltip].\""
 ep3_laamp_decision_event.1041.c.flavor:0 "Qual é a pior coisa que poderia acontecer!"
 ep3_laamp_decision_event.1041.c:0 "\"Você #EMP realizaria#! o procedimento, [visiting_partner.GetFirstNameNoTooltip]?\""
 ep3_laamp_decision_event.1041.d.partner:0 "\"[visiting_partner.GetFirstNameNoTooltip], [Select_CString( visiting_partner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('visiting_partner'))], precisa de tratamento!\""
 ep3_laamp_decision_event.1041.d:0 "\"[1040_sickly_minor.GetFirstNameNoTooltip], [Select_CString( 1040_sickly_minor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('1040_sickly_minor'))], precisa de tratamento!\""
 ep3_laamp_decision_event.1041.desc:0 "$ep3_laamp_decision_event.1041_intro$ [laamp_healer_character.GetSheHe|U] olha para cima enquanto me aproximo: \"Saudações. Como estão seus humores? Precisa de um pouco de limpeza?\""
 ep3_laamp_decision_event.1041.desc_outro_artifact:0 "\n\nUm pouco mais adentro da sala, em uma prateleira cheia de trinkets medicinais, avisto um curioso [1041_health_artifact.GetName], clamando por meu interesse."
 ep3_laamp_decision_event.1041.desc_outro_horn:0 "\n\nPelo canto do olho, avisto alguns trinkets medicinais, dos quais um magnífico chifre chama minha atenção."
 ep3_laamp_decision_event.1041.desc_outro_return_artifact:0 "\n\nUm pouco mais adentro da sala, o [1041_health_artifact.GetName] ainda clama por meu interesse."
 ep3_laamp_decision_event.1041.desc_outro_return_horn:0 "\n\nUm pouco mais adentro da sala, o magnífico [1041_health_artifact.GetName] ainda repousa junto com outros trinkets medicinais."
 ep3_laamp_decision_event.1041.desc_physician_partner:0 "Ao entrarmos na cabana do curandeiro, [laamp_healer_character.GetFirstName] está no meio de um procedimento de limpeza em um idoso [ROOT.Char.GetWomanMan]. [visiting_partner.GetFirstName] observa [laamp_healer_character.GetFirstNameNoTooltip] ansiosamente, um brilho de empolgação nos olhos [visiting_partner.GetHerHim]: \"Eu não me importaria de tentar minha sorte em #EMP isso#!...\"\n\n[laamp_healer_character.GetFirstNameNoTooltip] olha para cima quando [laamp_healer_character.GetSheHe] ouve nossas vozes: \"Eu não vi vocês lá! Algo está te incomodando?\""
 ep3_laamp_decision_event.1041.desc_returned_01:0 "[laamp_healer_character.GetFirstName] está atendendo a outro paciente quando desço as escadas e entro na cabana do curandeiro. [laamp_healer_character.GetSheHe|U] me lança um olhar e então sinaliza para seu paciente se acomodar em algumas camas mais ao fundo da sala.\n\n[laamp_healer_character.GetSheHe|U] procede para fechar uma cortina improvisada feita de um lençol desgastado, garantindo privacidade tanto ao paciente quanto a nós.\n\n\"Vejo que você voltou,\" [laamp_healer_character.GetSheHe] nota, diligentemente: \"Você precisa da minha ajuda com algo?\""
 ep3_laamp_decision_event.1041.desc_returned_02:0 "Descendo novamente para a cabana do curandeiro, [laamp_healer_character.GetFirstName] está sentado um pouco mais adentro, folheando as páginas de um diário desgastado de algum tipo. Difícil de distinguir à distância, parece conter representações do corpo humano.\n\n[laamp_healer_character.GetSheHe|U] cuidadosamente fecha o diário, guarda-o, então olha para mim e comenta em um tom calmo: \"Ah, então você voltou. Encontrou algo que te aflige, afinal?\""
 ep3_laamp_decision_event.1041.desc_returned_physician_partner:0 "Ao entrarmos na cabana do curandeiro, [laamp_healer_character.GetFirstName] está pensando em algumas ervas, mas [laamp_healer_character.GetSheHe] olha para nós enquanto descemos a escada: \"Ah, mudou de ideia, então?\"\n\nÀ minha esquerda, [visiting_partner.GetFirstNameNoTooltip] está mudando seu peso de um pé para o outro, ainda desejando tentar sua mão no procedimento que vimos [laamp_healer_character.GetFirstNameNoTooltip] realizar mais cedo."
 ep3_laamp_decision_event.1041.desc_returned_sickly_minor:0 "[1040_sickly_minor.GetFirstName] está descansando em uma cama macia perto do fogão na cabana do curandeiro, aguardando meu retorno. Instintivamente, inclino-me para verificar a respiração [1040_sickly_minor.GetHerHim] e acaricio o cabelo [1040_sickly_minor.GetHerHim].\n\n[laamp_healer_character.GetFirstName] coloca seu [ROOT.Char.Custom('WritingInstrument')] e me lança um olhar sério: \"O que decidimos?\""
 ep3_laamp_decision_event.1041.desc_reused_healer:0 "$ep3_laamp_decision_event.1041_intro$ [laamp_healer_character.GetSheHe|U] olha para cima, levantando levemente as sobrancelhas: \"Vejo que você voltou inteiro! Como posso te ajudar desta vez?\""
 ep3_laamp_decision_event.1041.desc_sickly_minor:0 "[Select_CString( 1040_sickly_minor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('1040_sickly_minor'))] [1040_sickly_minor.GetFirstName], que está doente, se junta a mim na cabana do curandeiro. [1040_sickly_minor.GetSheHe|U] tosse fracamente enquanto o/levo escada abaixo.\n\nO curandeiro, [laamp_healer_character.GetFirstName], levanta-se de seu banco de madeira e me lança um olhar sombrio: \"Você precisará dos meus serviços?\""
 ep3_laamp_decision_event.1041.e:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1041.return.tt:0 "Você retorna aos terrenos da [visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1041.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Curandeiro"
 ep3_laamp_decision_event.1041.treatment_failure.desc:0 "O tratamento não teve sucesso"
 ep3_laamp_decision_event.1041.treatment_failure.t:0 "Sem sucesso"
 ep3_laamp_decision_event.1041.treatment_success.t:0 "Sucesso"
 ep3_laamp_decision_event.1041_intro:0 "A luz está mais fraca e há um distinto #EMP cheiro#! na cabana do curandeiro. Não #EMP desagradável#!, mas ameaçador.\n\n[laamp_healer_character.GetFirstName] está em pé à frente de uma mesa alta, ocupado preparando uma mistura."
 ep3_laamp_decision_event.1043.a.flavor_unzealous:0 "Eu #EMP suponho#!..."
 ep3_laamp_decision_event.1043.a:0 "\"Tenho uma doação a fazer!\""
 ep3_laamp_decision_event.1043.b:0 "\"Talvez [visiting_location.GetCounty.GetFaith.HighGodName] possa abençoar nossa causa?\""
 ep3_laamp_decision_event.1043.c.flavor:0 "Faça uma distração, roube algumas moedas. Fácil."
 ep3_laamp_decision_event.1043.c.flavor_guarded:0 "Hmm. Os guardas com certeza circulam com muito mais frequência por aqui, por alguma razão..."
 ep3_laamp_decision_event.1043.c.thievery_critical_failure.desc:0 "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1043.c.thievery_critical_failure.t:0 "Guardas Chamados"
 ep3_laamp_decision_event.1043.c.thievery_failure.desc:0 "Você é banido do [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1043.c.thievery_failure.t:0 "Banido!"
 ep3_laamp_decision_event.1043.c.thievery_success.desc:0 "Você rouba com sucesso as doações."
 ep3_laamp_decision_event.1043.c.thievery_success.t:0 "Furtos Bem-Sucedidos"
 ep3_laamp_decision_event.1043.c:0 "Claramente #EMP eu#! estou precisando dessas doações."
 ep3_laamp_decision_event.1043.c_guarded:0 "Mais uma doação, para #EMP meu#! bolso."
 ep3_laamp_decision_event.1043.c_master_thief:0 "\"Psst, [visiting_partner.GetFirstNameNoTooltip], fique de olho!\""
 ep3_laamp_decision_event.1043.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1043.desc:0 "Ao passar pelos portões do [visiting_location.GetCounty.GetFaith.HouseOfWorship], fico impressionado com o trabalho que deve ter sido feito nas estruturas requintadas e na decoração sagrada.\n\nUm doss [GetTrait('devoted').GetNameNoTooltip( laamp_clergy_character )|l] que cuida deste lugar nota minha presença e se aproxima de forma serena: \"Saudações, [Select_CString( ROOT.Char.IsFemale, 'minha filha', 'meu filho' )]. Eu sou [laamp_clergy_character.Custom('SisterBrother')] [laamp_clergy_character.GetFirstName]. Como posso te ajudar?\""
 ep3_laamp_decision_event.1043.desc_outro:0 "\n\nMeus olhos casualmente passam pela cesta de doações em moeda um pouco mais adiante no corredor."
 ep3_laamp_decision_event.1043.desc_outro_thief:0 "\n\nAtrás de mim, [visiting_partner.GetFirstName] está lançando olhares suspeitos para uma cesta cheia de doações em moeda um pouco mais adiante no corredor."
 ep3_laamp_decision_event.1043.desc_return_outro:0 "\n\nA cesta de doações em moeda cresceu cada vez mais."
 ep3_laamp_decision_event.1043.desc_return_outro_thief:0 "\n\n[visiting_partner.GetFirstName] ainda observa com saudade a cesta de doações em moeda."
 ep3_laamp_decision_event.1043.desc_returned_01:0 "Um sermão acabou de ser concluído quando retornamos ao [visiting_location.GetCounty.GetFaith.HouseOfWorship]. [laamp_clergy_character.Custom('SisterBrother')|U] [laamp_clergy_character.GetFirstName] está passando a vassoura, gentilmente arrumando e tornando o solo sagrado limpo para qualquer visitante que venha aqui para oração e reflexão.\n\n[laamp_clergy_character.GetSheHe|U] olha para cima ao me ver aproximar, um sorriso suave se formando nos lábios [laamp_clergy_character.GetHerHim]: \"Bem-vindo de volta ao seu caloroso abraço. Por que você não fica um tempo e aprecia a paisagem?\""
 ep3_laamp_decision_event.1043.desc_returned_02:0 "[laamp_clergy_character.Custom('SisterBrother')|U] [laamp_clergy_character.GetFirstName] está sentado em um dos bancos de frente para o púlpito, aparentemente imerso em contemplação, quando eu reentrei no [visiting_location.GetCounty.GetFaith.HouseOfWorship].\n\n[laamp_clergy_character.GetSheHe|U] vira sua cabeça na minha direção, olhando por cima do ombro [laamp_clergy_character.GetHerHim] enquanto me aproximo: \"Tão ocupado. Deixe esses pés cansados descansarem por um momento, [Select_CString( ROOT.Char.IsFemale, 'minha filha', 'meu filho' )]. Como posso ser útil?\""
 ep3_laamp_decision_event.1043.desc_reused_clergy:0 "Ao entrar nos notáveis portões do [visiting_location.GetCounty.GetFaith.HouseOfWorship], oss [GetTrait('devoted').GetNameNoTooltip( laamp_clergy_character )|l] que cuidam deste lugar acabaram de dispersar suas tarefas por hoje.\n\nEu olho para baixo pelo corredor principal e, inesperadamente, reconheço [Select_CString( laamp_clergy_character.IsFemale, 'a', 'o' )] [laamp_clergy_character.Custom('SisterBrother')] [laamp_clergy_character.GetFirstName], que por sua vez me lança um olhar enigmático e se aproxima: \"Meu filho desviado. [visiting_location.GetCounty.GetFaith.HighGodName] te trouxe de volta em segurança à nossa porta!\""
 ep3_laamp_decision_event.1043.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o [visiting_location.GetCounty.GetFaith.HouseOfWorship|U]"
 ep3_laamp_decision_event.1044.a:0 "\"Talvez [visiting_location.GetCounty.GetFaith.HighGodName] possa abençoar nossa jornada?\""
 ep3_laamp_decision_event.1044.a_epiphany:0 "\"Estou interessado apenas na graça de [visiting_location.GetCounty.GetFaith.HighGodName].\""
 ep3_laamp_decision_event.1044.b:0 "\"Nós #EMP poderíamos#! usar outro corpo apto.\""
 ep3_laamp_decision_event.1044.c:0 "\"Não me importo com nada, a não ser com meu próximo.\""
 ep3_laamp_decision_event.1044.c_epiphany:0 "...não estamos contratando no momento."
 ep3_laamp_decision_event.1044.desc:0 "[laamp_clergy_character.GetFirstName] sorri ainda mais enquanto [laamp_clergy_character.GetSheHe] se inclina, colocando uma mão em meu ombro: \"Muito gracioso de sua parte, [Select_CString( ROOT.Char.IsFemale, 'minha filha', 'meu filho' )]. Eu entendo que dinheiro nem sempre é fácil de conseguir para um aventureiro como você.\"\n\n[laamp_clergy_character.GetSheHe|U] acena com a cabeça de forma sentenciosa, com a mão caindo de volta ao lado [laamp_clergy_character.GetHerHim] enquanto [laamp_clergy_character.GetSheHe] fixa o olhar em mim."
 ep3_laamp_decision_event.1044.desc_epiphany:0 "Enquanto entrego a doação, os olhos de [laamp_clergy_character.GetFirstName] se alargam em choque: \"Você... você se parece exatamente com [visiting_location.GetCounty.GetFaith.HighGodSheHe|U]... [visiting_location.GetCounty.GetFaith.HighGodSheHe|U]... eu juro...\" [laamp_clergy_character.GetSheHe] me observa por um momento, movendo os lábios, como um peixe fora d'água.\n\nEntão, percebendo o que [laamp_clergy_character.GetSheHe] está fazendo, [laamp_clergy_character.GetFirstNameNoTooltip] se recompõe e limpa a garganta: \"Eu ficaria honrado em doar #EMP minha#! vida à sua causa.\""
 ep3_laamp_decision_event.1045.a.cooldown.tt:0 "Você contemplou este jardim recentemente — retorne em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_contemplated_garden_recently') )]"
 ep3_laamp_decision_event.1045.a:0 "Sinto-me em paz."
 ep3_laamp_decision_event.1045.a_convert:0 "Talvez o [visiting_location.GetCounty.GetFaith.GetNameNoTooltip] não seja tão ruim, afinal."
 ep3_laamp_decision_event.1045.b.cooldown.tt:0 "Você colheu neste jardim recentemente — retorne em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_has_harvested_recently') )]"
 ep3_laamp_decision_event.1045.b:0 "Seria uma pena desperdiçar essas iguarias."
 ep3_laamp_decision_event.1045.b_flavor:0 "Hora de colher!"
 ep3_laamp_decision_event.1045.b_partner:0 "\"[visiting_partner.GetFirstNameNoTooltip], que tal fazermos uma coleta?\""
 ep3_laamp_decision_event.1045.c.cooldown.tt:0 "Você relaxou neste jardim recentemente — retorne em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1045_garden_unwinded_recently') )]"
 ep3_laamp_decision_event.1045.c.flavor:0 "Verdadeiramente divino."
 ep3_laamp_decision_event.1045.c:0 "\"...tantos cantos e recantos escondidos, #EMP [visiting_partner.GetFirstNameNoTooltip]#!...\""
 ep3_laamp_decision_event.1045.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1045.desc:0 "O jardim é contornado por sebes, e as árvores estão espalhadas pelos suaves montes onde o pássaro e o esquilo ocasional podem ser observados através da folhagem.\n\nSinto uma presença bastante forte aqui, imersa em toda essa beleza. E se, através de todas as minhas provações e tribulações, [visiting_location.GetCounty.GetFaith.HighGodName] esteve comigo o tempo todo...?"
 ep3_laamp_decision_event.1045.desc_outro_gardener:0 "\n\nPelo canto do olho, noto frutas e ervas silvestres de aparência deliciosa, contribuindo para a exuberância do jardim."
 ep3_laamp_decision_event.1045.desc_outro_partner:0 "\n\nPor trás de mim, consigo ouvir [visiting_partner.GetFirstName] murmurando toda vez que encontramos mais uma planta comestível obscura durante nosso passeio."
 ep3_laamp_decision_event.1045.desc_outro_return_gardener:0 "\n\nE mais adiante na estrada, avisto ainda mais iguarias selvagens, se estendendo sob o sol da tarde."
 ep3_laamp_decision_event.1045.desc_outro_return_partner:0 "\n\nUm pouco mais adiante na estrada, [visiting_partner.GetFirstName] está dando mais uma olhada nas plantas comestíveis da área."
 ep3_laamp_decision_event.1045.desc_returned_01:0 "O jardim ainda está tranquilo, e alguns visitantes estão conversando em voz baixa nas áreas de assento, enquanto outros estão imersos em contemplação silenciosa, observando a natureza passar.\n\nEu escuto o murmúrio e a brisa; o vento nas árvores, sentindo-me de repente mais à vontade."
 ep3_laamp_decision_event.1045.desc_returned_02:0 "Desta vez, avisto um pequeno pássaro em uma das árvores [visiting_location.Custom('GetRandomRegionalWood')], na borda de tentar suas asas pela primeira vez.\n\nEle desliza suavemente pela beira do ninho, mas suas asas ficam de alguma forma emaranhadas e, por alguns momentos, o pássaro cai livre pelo ar até... o vento gentilmente agarra o pássaro, carregando-o para a segurança. Uma sensação de alívio se espalha pelo meu peito."
 ep3_laamp_decision_event.1045.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Jardim"
 ep3_laamp_decision_event.1047.a:0 "\"Quer vir trabalhar para mim?\""
 ep3_laamp_decision_event.1047.b:0 "\"Ajude-me a fortalecer o espírito dos meus seguidores!\""
 ep3_laamp_decision_event.1047.c.failure.tt:0 "[laamp_physician_recruit.GetShortUIName] começa a te ignorar"
 ep3_laamp_decision_event.1047.c.failure:0 "Você não consegue atrair [laamp_physician_recruit.GetShortUIName]"
 ep3_laamp_decision_event.1047.c.success:0 "[laamp_physician_recruit.GetShortUIName] concorda com sua avaliação"
 ep3_laamp_decision_event.1047.c:0 "\"Você precisa #EMP usar#! suas habilidades para se manter afiado. Junte-se ao meu acampamento.\""
 ep3_laamp_decision_event.1047.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1047.desc:0 "$ep3_laamp_decision_event.1047_desc_intro$\"Oh. Você. Queria algo?\"\n\n\"Vi sua palestra para aqueles em situação difícil,\" eu respondo, hesitando antes de continuar:\""
 ep3_laamp_decision_event.1047.desc_returned_01:0 "A porta do escritório de [laamp_physician_recruit.GetFirstName] está entreaberta, e através da fresta observo [laamp_physician_recruit.GetFirstNameNoTooltip] cortando o cabelo de um cliente, que está sentado muito quieto, usando umas tesouras assustadoramente afiadas e finas.\n\nEu dou uma batida na porta e entro, atraindo a atenção do médico: \"Muito sorrateiro. O que você queria?\""
 ep3_laamp_decision_event.1047.desc_returned_02:0 "[laamp_physician_recruit.GetFirstName] está em pé do lado de fora da porta [laamp_physician_recruit.GetHerHim], inspecionando o ombro de um [ROOT.Char.GetWomanMan], aparentemente com dor.\n\n[laamp_physician_recruit.GetSheHe|U] finaliza a visita, fornecendo instruções sobre como curar melhor a articulação, e então se volta para mim: \"Você voltou. Queria algo desta vez?\""
 ep3_laamp_decision_event.1047.desc_returned_03:0 "Enquanto subo cuidadosamente as escadas para o escritório de [laamp_physician_recruit.GetFirstName], olho pela porta aberta.\n\n[laamp_physician_recruit.GetSheHe|U] parece estar envolvido em algum tipo de exercício físico, suando bastante, fazendo agachamentos repetidos, levantando-se e então recomeçando.\n\nApós um certo número de repetições, [laamp_physician_recruit.GetSheHe] para, enxugando a testa e dando um gole de uma garrafa próxima. [laamp_physician_recruit.GetSheHe|U], agora com o olhar afiado, se concentra em mim: \"Bastante insistente, não?\""
 ep3_laamp_decision_event.1047.desc_reused_physician:0 "$ep3_laamp_decision_event.1047_desc_intro$\"Oh. Não te vi em algum lugar antes? O que você quer?\"\n\nEu pondero cuidadosamente minhas palavras, antes de responder:\""
 ep3_laamp_decision_event.1047.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Médico"
 ep3_laamp_decision_event.1047_desc_intro:0 "Eu sigo [laamp_physician_recruit.GetFirstName] por um beco estreito, subo algumas escadas e entro no escritório [laamp_physician_recruit.GetHerHim]. O cômodo está abarrotado, do chão ao teto, com estantes repletas de escrituras e impressões relacionadas a humores, saúde e espiritualidade.\n\n[laamp_physician_recruit.GetSheHe|U] senta-se na única cadeira, atrás da mesa, acariciando distraidamente um pequeno talismã e, então, finalmente nota minha presença: "
 ep3_laamp_decision_event.1050.a.cooldown.tt:0 "Os terrenos de treinamento estão ocupados atendendo a um treino agendado"
 ep3_laamp_decision_event.1050.a.tt:0 "Ir para os terrenos de treinamento"
 ep3_laamp_decision_event.1050.a:0 "Vamos visitar os terrenos de treinamento locais."
 ep3_laamp_decision_event.1050.a_second:0 "Seria bom fazer outra visita aos terrenos de treinamento."
 ep3_laamp_decision_event.1050.b.cooldown.tt:0 "Devido a intrusos, as portas da guarnição estão fechadas pelo resto desta visita"
 ep3_laamp_decision_event.1050.b.tt:0 "Ir para a guarnição dos guardas"
 ep3_laamp_decision_event.1050.b:0 "Devemos procurar por pessoas capazes na guarnição."
 ep3_laamp_decision_event.1050.b_second:0 "A guarnição ainda é interessante."
 ep3_laamp_decision_event.1050.c.cooldown.tt:0 "Seus novos [soldiers|E] de [men_at_arms|E] estão ocupados se mudando para o seu acampamento"
 ep3_laamp_decision_event.1050.c.cooldown_province.tt:0 "Você reforçou os [men_at_arms|E] em [visiting_location.GetBaronyNameExplicitly] nos últimos 90 dias"
 ep3_laamp_decision_event.1050.c.tt:0 "Ir para os soldados desmoralizados"
 ep3_laamp_decision_event.1050.c:0 "Talvez aqueles soldados [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] desleixados possam ser úteis?"
 ep3_laamp_decision_event.1050.c_second:0 "Os [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] desmoralizados ainda podem ser úteis."
 ep3_laamp_decision_event.1050.d.tt:0 "Aproximar-se dos [laamp_bodyguard_recruit.GetWomenMen] que estão discutindo"
 ep3_laamp_decision_event.1050.d.tt_second:0 "Falar com [laamp_bodyguard_recruit.GetShortUIName]"
 ep3_laamp_decision_event.1050.d:0 "Eu me pergunto sobre o que eles estão discutindo?"
 ep3_laamp_decision_event.1050.d_second:0 "Vamos ter outra conversa com o guarda-costas aposentado."
 ep3_laamp_decision_event.1050.desc:0 "Os terrenos do [visiting_location.GetBaronyNameExplicitlyNoTooltip] [visiting_location.GetHolding.GetType.GetName|l] estão, como esperado, equipados para propósitos marciais: com barris de flechas, armas de haste perdidas, um belo estábulo, e assim por diante."
 ep3_laamp_decision_event.1050.desc_outro:0 "\n\nEu prendo os lábios e olho ao redor ruminativamente para o caos organizado que consiste em [visiting_location.GetTitle.GetHolder.Custom('KnightCulturePluralNoTooltipLowercase')], guardas, homens de armas e soldados."
 ep3_laamp_decision_event.1050.desc_outro_bodyguard:0 "\n\nDo outro lado do pátio, um [laamp_bodyguard_recruit.GetWomanMan] está gritando com outros [laamp_bodyguard_recruit.GetWomenMen]: \"...e NÃO FOI MINHA CULPA!\" A discussão está ficando mais acalorada e eu mantenho um olhar atento sobre a situação."
 ep3_laamp_decision_event.1050.desc_outro_bodyguard_return:0 "\n\nOs [laamp_bodyguard_recruit.GetWomenMen] irritados ainda estão no auge da discussão na borda do pátio, a situação agora é cuidadosamente monitorada por um grupo de guardas próximos para evitar uma escalada sangrenta."
 ep3_laamp_decision_event.1050.desc_outro_partner:0 "\n\n[visiting_partner.GetFirstName] olha ao redor contemplativamente e então pondera sobre a robusta bandeira que retrata o brasão da casa [visiting_location.GetTitle.GetHolder.GetHouse.GetName], balançando suavemente ao vento."
 ep3_laamp_decision_event.1050.desc_outro_return_01:0 "\n\nEm um canto da praça, um grupo de crianças carregando espadas de madeira está imitando o que parece ser um treinamento de [visiting_location.GetTitle.GetHolder.Custom('KnightCulturePluralNoTooltipLowercase')], com uma precisão assustadora.\n\nEu as observo cuidadosamente enquanto considero meu próximo destino."
 ep3_laamp_decision_event.1050.desc_outro_return_02:0 "\n\nUma procissão carregada por um cavalo está saindo pelos portões, pelo que parece pertencente a uma nobre local [ROOT.Char.GetWomanMan], e eu considero o espetáculo enquanto reflito sobre onde ir a seguir."
 ep3_laamp_decision_event.1050.desc_outro_return_03:0 "\n\nNos acessos do pátio e [visiting_location.GetHolding.GetType.GetName|l], os guardas estão aparecendo, substituindo os antigos a tempo para a troca de turno. Eu observo casualmente a troca enquanto pondero o que fazer a seguir."
 ep3_laamp_decision_event.1050.desc_outro_return_finished:0 "\n\nApós examinar minuciosamente os altos e baixos do [visiting_location.GetBaronyNameExplicitlyNoTooltip] [visiting_location.GetHolding.GetType.GetName|l], cumpri minhas tarefas aqui e estou pronto para ir embora.\n\nOlho ao redor em busca do caminho mais rápido de volta à praça principal de [visiting_location.GetTitle.GetNameNoTierNoTooltip]."
 ep3_laamp_decision_event.1050.desc_outro_return_partner_01:0 "\n\nSinto um leve empurrão quando [visiting_partner.GetFirstName] me cutuca, sussurrando sobre as infelizes características de [visiting_partner.Custom('GetGenderAlliteratingAnimal')] de um dos guardas na borda da praça.\n\nEu fruncio a testa desaprovadoramente para [visiting_partner.GetFirstNameNoTooltip] enquanto considero meu próximo destino."
 ep3_laamp_decision_event.1050.desc_outro_return_partner_02:0 "\n\n[visiting_partner.GetFirstName] observa curiosamente um vendedor ambulante que está balançando delicadamente uma lâmina curva no ar para demonstrar a superioridade da curva.\n\nMeu olhar divaga enquanto olho para baixo na praça, refletindo sobre onde ir a seguir."
 ep3_laamp_decision_event.1050.desc_outro_return_partner_03:0 "\n\nOlho para a minha esquerda enquanto [visiting_partner.GetFirstName] prende um bocejo. Levanto uma sobrancelha enquanto [visiting_partner.GetSheHe] faz uma expressão de desculpas, e meu olhar retorna ao pátio, ponderando o que fazer a seguir."
 ep3_laamp_decision_event.1050.desc_outro_return_partner_finished:0 "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
 ep3_laamp_decision_event.1050.desc_returned_01:0 "Reentro os portões do [visiting_location.GetHolding.GetType.GetName|l], estudando o padrão e a cor da bandeira que retrata o brasão da casa [visiting_location.GetTitle.GetHolder.GetHouse.GetName], enquanto faço isso."
 ep3_laamp_decision_event.1050.desc_returned_02:0 "Ao voltarmos da praça principal de [visiting_location.GetTitle.GetNameNoTierNoTooltip], uma brisa faz a vívida bandeira da casa [visiting_location.GetTitle.GetHolder.GetHouse.GetNameNoTooltip] balançar suavemente no parapeito."
 ep3_laamp_decision_event.1050.desc_returned_from_bodyguard:0 "Deixo [laamp_bodyguard_recruit.GetFirstName] continuar descarregando suas frustrações nos cadáveres dos animais, enquanto navego com sucesso pelas ruas estreitas de volta aos terrenos do [visiting_location.GetHolding.GetType.GetName|l]."
 ep3_laamp_decision_event.1050.desc_returned_from_garrison:0 "Saindo das acomodações dos guardas, squinto diante da súbita inundação de luz e inalo profundamente o ar fresco."
 ep3_laamp_decision_event.1050.desc_returned_from_reinforcers:0 "Ainda ponderando sobre os soldados desmoralizados, passeio tranquilamente de volta ao pátio do [visiting_location.GetHolding.GetType.GetName|l], onde não muito mudou."
 ep3_laamp_decision_event.1050.desc_returned_from_training:0 "Caminhando de volta pelos portões do [visiting_location.GetHolding.GetType.GetName|l] vindos do campo de treinamento, os guardas em seus postos mal me dão uma segunda olhada desta vez."
 ep3_laamp_decision_event.1050.e:0 "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1050.e_second:0 "$ep3_laamp_decision_event.1040.e_second$"
 ep3_laamp_decision_event.1050.mid_maa:0 "\n\nO campo de treinamento fica logo do lado de fora dos portões, a guarnição tem alguns guardas vagando por ali, e mais adiante na rua avisto um grupo de combatentes [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] desleixados e desmoralizados."
 ep3_laamp_decision_event.1050.mid_no_maa:0 "\n\nO campo de treinamento fica logo do lado de fora dos portões e um punhado de guardas da guarnição está vagando pela entrada, ou meio adormecidos ou polindo suas armas."
 ep3_laamp_decision_event.1050.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Castelo"
 ep3_laamp_decision_event.1051.a.desc:0 "Você faz um pouco de treino"
 ep3_laamp_decision_event.1051.a:0 "Vamos ter uma sessão de treinamento!"
 ep3_laamp_decision_event.1051.a_athletic.desc:0 "Seu treino de luta é muito eficiente"
 ep3_laamp_decision_event.1051.b:0 "\"Você deveria vir se juntar ao nosso acampamento. Muita liberdade.\""
 ep3_laamp_decision_event.1051.c:0 "\"Tenha paciência, [visiting_partner.GetFirstNameNoTooltip]!\""
 ep3_laamp_decision_event.1051.c_joshing.desc:0 "O treino foi ineficiente"
 ep3_laamp_decision_event.1051.c_joshing.t:0 "Brincando"
 ep3_laamp_decision_event.1051.c_wounded.desc:0 "$martial_authority.8000_injury$"
 ep3_laamp_decision_event.1051.c_wounded.t:0 "$playdate_training_injury_log_title$"
 ep3_laamp_decision_event.1051.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1051.desc:0 "\"...e eu te digo, as coisas têm ido ladeira abaixo por aqui há #EMP muito tempo#!,\" o mestre de armas local, [laamp_disgruntled_moa.GetFirstName], resmunga, então continua: \"Esse olhar incessante por cima do meu ombro, questionando meu...\" [laamp_disgruntled_moa.GetSheHe] fica em silêncio enquanto me aproximo da área de treinamento.\n\nInstintivamente, olho para a variedade de equipamentos e obstáculos de treinamento, fazendo o meu melhor para ignorar o olhar desafiador de [laamp_disgruntled_moa.GetFirstNameNoTooltip]."
 ep3_laamp_decision_event.1051.desc_outro_martial_partner:0 "\n\nÀ minha direita, [visiting_partner.GetFirstName] pega uma das espadas de treinamento e começa a agitá-la com uma mão experiente, olhando para mim expectante."
 ep3_laamp_decision_event.1051.desc_outro_return_martial_partner:0 "\n\nE perto de uma prateleira de espadas cegas, [visiting_partner.GetFirstName] está de braços cruzados. [visiting_partner.GetSheHe|U] olha para as armas, depois para mim, e sorri de forma travessa."
 ep3_laamp_decision_event.1051.desc_returned_01:0 "De volta aos terrenos de treinamento, o mestre de armas, [laamp_disgruntled_moa.GetFirstName], está ocupado, empilhando equipamentos e murmurando para [laamp_disgruntled_moa.GetHerselfHimself] sobre a situação das coisas.\n\nTomando cuidado para não parecer #EMP muito#! insatisfeito, [laamp_disgruntled_moa.GetSheHe] me lança um olhar carrancudo enquanto me aproximo [laamp_disgruntled_moa.GetHerHim] mais uma vez."
 ep3_laamp_decision_event.1051.desc_returned_02:0 "Nos terrenos de treinamento, o mestre de armas, [laamp_disgruntled_moa.GetFirstName], está em posição de sentido enquanto o equipamento de treinamento é inspecionado por um oficial superior.\n\nUma vez que o superior se afastou para o [visiting_location.GetHolding.GetType.GetName|l], [laamp_disgruntled_moa.GetFirstNameNoTooltip], agora fora de posição, parece encolher vários centímetros à medida que a postura relaxa. [laamp_disgruntled_moa.GetSheHe|U] me lança um olhar fulminante."
 ep3_laamp_decision_event.1051.return.tt:0 "Você retorna aos terrenos do [visiting_location.GetHolding.GetType.GetName|l]"
 ep3_laamp_decision_event.1051.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: os Terrenos de Treinamento"
 ep3_laamp_decision_event.1053.a:0 "\"[laamp_plain_guard.GetFirstNameNoTooltip], quer vir trabalhar para mim?\""
 ep3_laamp_decision_event.1053.b:0 "\"Teríamos uso para alguém com suas habilidades, [laamp_talented_guard.GetFirstNameNoTooltip].\""
 ep3_laamp_decision_event.1053.c.plain_wins:0 "[laamp_plain_guard.GetShortUIName] vence a rodada"
 ep3_laamp_decision_event.1053.c.talented_wins:0 "[laamp_talented_guard.GetShortUIName] vence a rodada"
 ep3_laamp_decision_event.1053.c.you_win:0 "Você vence a rodada"
 ep3_laamp_decision_event.1053.c:0 "\"Alguém afim de uma rodada de dados?\""
 ep3_laamp_decision_event.1053.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1053.desc:0 "Dentro da guarnição abafada, os guardas montaram um ringue de combate para aprimorar suas habilidades. Dois deles estão atualmente usando-o, se golpeando enquanto são aplaudidos por um punhado de espectadores.\n\nEu observo o treino por um tempo e fica claro que [laamp_talented_guard.GetFirstName], o primeiro guarda, é significativamente mais experiente do que [laamp_plain_guard.GetFirstName], o segundo guarda.\n\nQuando eles terminam, eu me aproximo cautelosamente do ringue, e eles desviam seu foco para mim:"
 ep3_laamp_decision_event.1053.desc_returned_01:0 "Ao retornar à guarnição, [laamp_plain_guard.GetFirstName] está cuidando de seu lábio inchado com carinho.\n\nPerto de uma mesa improvisada feita de um barril, um jogo de cartas está quase encerrado e [laamp_talented_guard.GetFirstName] grunhe em reconhecimento de seus ganhos.\n\nA dupla me avalia enquanto me aproximo do grupo de guardas."
 ep3_laamp_decision_event.1053.desc_returned_02:0 "De volta à guarnição sombreada, [laamp_plain_guard.GetFirstName] está tirando uma breve soneca enquanto [laamp_talented_guard.GetFirstName] conta suas moedas. Quando o guarda mais experiente me nota, [laamp_talented_guard.GetSheHe] cutuca [laamp_plain_guard.GetFirstNameNoTooltip].\n\nO guarda menos experiente acorda de repente e se senta, tentando esfregar os restos do sono dos olhos [laamp_plain_guard.GetHerHim].\n\nAmbos me olham, curiosos."
 ep3_laamp_decision_event.1053.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: a Guarnição"
 ep3_laamp_decision_event.1055.a.cooldown.tt:0 "Você tem aproveitado seu [prestige_level|E] recentemente — mais tropas gananciosas por glória se reuniram em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1055_reinforced_with_prestige_recently') )]"
 ep3_laamp_decision_event.1055.a.flavor:0 "Prestigioso? Eu só faço o que precisa ser feito."
 ep3_laamp_decision_event.1055.a:0 "\"Cavalgue comigo — [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] proeminente [ROOT.Char.GetTitledFirstNameNoTooltip]!\""
 ep3_laamp_decision_event.1055.alert_partial.tt:0 "#alert_trial \n$BULLET_WITH_TAB$Os regimentos serão parcialmente reforçados!"
 ep3_laamp_decision_event.1055.all_regiments:0 "\n$BULLET_WITH_TAB$Todos os seus [regiments|E] de [men_at_arms|E] (#V [num_damaged_maa_regiments]#!):"
 ep3_laamp_decision_event.1055.b.cooldown.tt:0 "Você tem aproveitado seu [piety_level|E] recentemente — mais tropas zelosas se reuniram em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1055_reinforced_with_piety_recently') )]"
 ep3_laamp_decision_event.1055.b.flavor:0 "Apenas [ROOT.Char.GetFaith.HighGodName] julgará minha piedade."
 ep3_laamp_decision_event.1055.b:0 "\"Junte-se a mim, no serviço do [ROOT.Char.GetFaith.GetNameNoTooltip]!\""
 ep3_laamp_decision_event.1055.c.tt:0 "Um [regiment|E] de [men_at_arms|E] aleatório: \n#P #EMP $BULLET_WITH_TAB$Fica totalmente reforçado!#!#!"
 ep3_laamp_decision_event.1055.c:0 "\"Talvez pudéssemos fazer alguma troca?\""
 ep3_laamp_decision_event.1055.d.flavor:0 "Juntos, por um mundo melhor."
 ep3_laamp_decision_event.1055.d.tt:0 "Por causa do seu [GetTrait('knight_errant').GetName( GetNullCharacter )] [trait_level_track_xp|E]:$refill_maa_regiments_fully_reinforced_tt$"
 ep3_laamp_decision_event.1055.d:0 "\"Esta é sua chance de lutar pela #EMP retidão!#!\""
 ep3_laamp_decision_event.1055.desc:0 "O acampamento de tendas à beira de [visiting_location.GetBaronyNameExplicitlyNoTooltip] está cheio até a borda com soldados e combatentes, grandes e pequenos, de várias culturas diferentes, mas principalmente os [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip].\n\nEles estão agrupados, a maioria deles com expressões de descontentamento e olhando ao redor, como se procurassem uma maneira de sair de sua miséria.\n\nContinuo até encontrar um [laamp_maa_reinforcer.GetWomanMan] imponente que acaba de terminar de gritar com alguns combatentes marcados, e [laamp_maa_reinforcer.GetSheHe] me observa com desconfiança."
 ep3_laamp_decision_event.1055.desc_maxed_out:0 "Caminho até o acampamento de tendas, logo à beira de [visiting_location.GetBaronyNameExplicitlyNoTooltip], e sinto os olhos deles em mim.\n\nOs soldados abatidos e desanimados sussurram às minhas costas enquanto me dirijo a uma das figuras do rabble.\n\nOs olhos [laamp_maa_reinforcer.GetHerHim|U] se abrem ligeiramente, enquanto [laamp_maa_reinforcer.GetSheHe] espera que eu fale."
 ep3_laamp_decision_event.1055.desc_maxed_out_returned:0 "Ao retornar ao acampamento de tendas, os grupos de soldados continuam me encarando enquanto se afastam, permitindo-me passar.\n\nEles murmuram sobre como eu fiz parte da derrubada de uma [ROOT.Char.Custom('RegionalMythicalCreatureLower')] mítica, entre outras histórias mais fantásticas.\n\nMeus lábios se contraem em um sorriso fino enquanto me encontro de volta à figura de destaque, sua cabeça levemente inclinada e evitando ativamente meu olhar enquanto [laamp_maa_reinforcer.GetSheHe] espera que eu fale."
 ep3_laamp_decision_event.1055.desc_returned_01:0 "Retornando ao acampamento de tendas, avisto um punhado de soldados dando água aos seus cavalos. Seus capuzes mostram sinais de pertencimento a uma das brigadas de cavalaria mais elusivas.\n\nEu sigo pelo caminho sinuoso entre as tendas de volta ao imponente [laamp_maa_reinforcer.GetWomanMan] de antes, que não tenta nem um pouco esconder seu descontentamento.\n\n[laamp_maa_reinforcer.GetSheHe|U] me olha com olhos cansados e espera que eu fale."
 ep3_laamp_decision_event.1055.desc_returned_02:0 "De volta ao acampamento de tendas, os soldados mal prestam atenção em mim enquanto passo e vou mais fundo no acampamento.\n\nEventualmente, encontro o [laamp_maa_reinforcer.GetWomanMan] de antes, e um leve tremor na sobrancelha [laamp_maa_reinforcer.GetHerHim] é tudo que revela qualquer surpresa que [laamp_maa_reinforcer.GetSheHe] poderia ter ao me ver novamente tão cedo.\n\nOs olhos [laamp_maa_reinforcer.GetHerHim|U] vagam para a distância, enquanto [laamp_maa_reinforcer.GetSheHe] espera que eu fale."
 ep3_laamp_decision_event.1055.e:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1055.full.tt:0 "$ep3_laamp_decision_event.1055.all_regiments$$refill_maa_regiments_fully_reinforced_tt$"
 ep3_laamp_decision_event.1055.piety_full.tt:0 "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.full.tt$"
 ep3_laamp_decision_event.1055.piety_level:0 "Por causa do seu [piety_level|E]:"
 ep3_laamp_decision_event.1055.piety_partial_20.tt:0 "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 20#!%)#!"
 ep3_laamp_decision_event.1055.piety_partial_40.tt:0 "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 40#!%)#!"
 ep3_laamp_decision_event.1055.piety_partial_60.tt:0 "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 60#!%)#!"
 ep3_laamp_decision_event.1055.piety_partial_80.tt:0 "$ep3_laamp_decision_event.1055.piety_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 80#!%)#!"
 ep3_laamp_decision_event.1055.positive_partial.tt:0 "#P #EMP \n$BULLET_WITH_TAB$Os regimentos serão parcialmente reforçados!"
 ep3_laamp_decision_event.1055.prestige_full.tt:0 "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.full.tt$"
 ep3_laamp_decision_event.1055.prestige_level:0 "Por causa do seu [prestige_level|E]:"
 ep3_laamp_decision_event.1055.prestige_partial_20.tt:0 "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 20#!%)#!"
 ep3_laamp_decision_event.1055.prestige_partial_40.tt:0 "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.alert_partial.tt$ (#V 40#!%)#!"
 ep3_laamp_decision_event.1055.prestige_partial_60.tt:0 "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 60#!%)#!"
 ep3_laamp_decision_event.1055.prestige_partial_80.tt:0 "$ep3_laamp_decision_event.1055.prestige_level$$ep3_laamp_decision_event.1055.all_regiments$$ep3_laamp_decision_event.1055.positive_partial.tt$ (#V 80#!%)#!"
 ep3_laamp_decision_event.1055.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: os Reforços"
 ep3_laamp_decision_event.1057.a:0 "$ep3_laamp_decision_event.1047.a$"
 ep3_laamp_decision_event.1057.b:0 "\"Veja esses músculos? #EMP Eu#! estaria basicamente protegendo #EMP você#!.\""
 ep3_laamp_decision_event.1057.c.failure.tt:0 "[laamp_bodyguard_recruit.GetShortUIName] começa a ignorá-lo"
 ep3_laamp_decision_event.1057.c.failure:0 "Você não consegue atrair [laamp_bodyguard_recruit.GetShortUIName]"
 ep3_laamp_decision_event.1057.c.success:0 "[laamp_bodyguard_recruit.GetShortUIName] está convencido"
 ep3_laamp_decision_event.1057.c:0 "\"Junte-se a mim, e vamos restaurar sua reputação!\""
 ep3_laamp_decision_event.1057.d:0 "\"Esta é sua chance de #EMP redenção.#!\""
 ep3_laamp_decision_event.1057.desc:0 "Do grito, eu pego o nome [laamp_bodyguard_recruit.GetFirstName], e enquanto os acusadores [laamp_bodyguard_recruit.GetWomenMen] se afastam, sigo [laamp_bodyguard_recruit.GetFirstNameNoTooltip] por um beco.$ep3_laamp_decision_event.1057.desc_mid$\n\nO guarda-costas desonrado me lança um olhar desgastado ao me aproximar: \"O que você quer? Eu não consegui nem manter uma #EMP planta#! viva...\""
 ep3_laamp_decision_event.1057.desc_mid:0 "\n\n[laamp_bodyguard_recruit.GetSheHe|U] imediatamente começa a descarregar carcaças de animais de uma carroça surrada, murmurando para [laamp_bodyguard_recruit.GetHerselfHimself]: \"...#EMP um#! nobre perde sua vida sob sua vigilância, e... como eu deveria saber que o [laamp_bodyguard_recruit.Custom('RegionalDrink')] era...\" [laamp_bodyguard_recruit.GetSheHe|U] soca a carroça, frustrado."
 ep3_laamp_decision_event.1057.desc_returned_01:0 "Quando retorno ao beco onde deixei o ex-guarda-costas, [laamp_bodyguard_recruit.GetFirstName], [laamp_bodyguard_recruit.GetSheHe] está casualmente conversando com seu empregador, o açougueiro local.\n\nAproximando-me, eles encerram a conversa amigável e o açougueiro dá um tapa amigável em [laamp_bodyguard_recruit.GetFirstName] enquanto [laamp_bodyguard_recruit.GetSheHe] volta para dentro.\n\n[laamp_bodyguard_recruit.GetFirstNameNoTooltip], agora com uma leve faísca de amizade nos olhos, se vira para mim: \"Oh. Você voltou. Queria algo?\""
 ep3_laamp_decision_event.1057.desc_returned_02:0 "O ex-guarda-costas [laamp_bodyguard_recruit.GetFirstName] olha para cima quando retorno ao beco onde [laamp_bodyguard_recruit.GetSheHe] exerce sua nova profissão.\n\nA faca dança pelo ar enquanto [laamp_bodyguard_recruit.GetSheHe] corta mais um cadáver animal em filés bem cortados, e involuntariamente dou um passo para trás diante da pura intensidade.\n\n[laamp_bodyguard_recruit.GetSheHe|U] me dá um olhar vazio e com uma voz sem sentimento me aborda: \"...sim?\""
 ep3_laamp_decision_event.1057.desc_returned_03:0 "De volta ao beco, [laamp_bodyguard_recruit.GetFirstName] está sentado na carroça vazia, cuidando de um ferimento na junta de seu dedo, presumivelmente de uma briga com outras pessoas incomodadas com a reputação [laamp_bodyguard_recruit.GetHerHim].\n\nFazendo uma careta, [laamp_bodyguard_recruit.GetSheHe] reconhece minha presença e diz: \"Ah, só me vendo nos meus melhores momentos, né?\" [laamp_bodyguard_recruit.GetSheHe|U] se inclina para trás e suspira. \"Esqueceu algo?\""
 ep3_laamp_decision_event.1057.desc_reused_bodyguard:0 "Reconheço vagamente o grito de [laamp_bodyguard_recruit.GetWomanMan], e enquanto os acusadores [laamp_bodyguard_recruit.GetWomenMen] se afastam, sigo [laamp_bodyguard_recruit.GetFirstName] por um beco.$ep3_laamp_decision_event.1057.desc_mid$\n\nO guarda-costas desonrado squints ao me ver se aproximar: \"Espera, não te vi em algum lugar antes...?\" [laamp_bodyguard_recruit.GetSheHe|U] faz uma careta. \"Esqueça. O que você quer?\""
 ep3_laamp_decision_event.1057.e:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1057.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Guarda-costas"
 ep3_laamp_decision_event.1060.a.cooldown.tt:0 "Você já comprou uma arma [artifact|E] nesta visita"
 ep3_laamp_decision_event.1060.a.tt:0 "Ir para a barraca do ferreiro"
 ep3_laamp_decision_event.1060.a:0 "Armas são mais úteis agora."
 ep3_laamp_decision_event.1060.a_second:0 "As armas parecem intrigantes."
 ep3_laamp_decision_event.1060.b.cooldown.tt:0 "Você já comprou uma armadura [artifact|E] nesta visita"
 ep3_laamp_decision_event.1060.b.tt:0 "Vá até a ferraria do armeiro"
 ep3_laamp_decision_event.1060.b:0 "Minha armadura precisa de uma atualização."
 ep3_laamp_decision_event.1060.b_second:0 "O armorer tinha algumas peças relevantes."
 ep3_laamp_decision_event.1060.c.cooldown.tt:0 "Você já comprou uma joia [artifact|E] nesta visita"
 ep3_laamp_decision_event.1060.c.tt:0 "Ir para a morada do ourives"
 ep3_laamp_decision_event.1060.c:0 "Estou procurando acessórios."
 ep3_laamp_decision_event.1060.c_second:0 "Preciso dar uma segunda olhada no ourives."
 ep3_laamp_decision_event.1060.d.tt:0 "Abordar [laamp_quartermaster_recruit.GetShortUIName]"
 ep3_laamp_decision_event.1060.d:0 "Vamos ter uma conversa com #EMP senhor#! [laamp_quartermaster_recruit.GetFirstNameNoTooltip]."
 ep3_laamp_decision_event.1060.d_second:0 "Devemos revisitar o quartel-mestre [laamp_quartermaster_recruit.GetFirstNameNoTooltip]."
 ep3_laamp_decision_event.1060.desc:0 "No distrito dos artesãos de [visiting_location.GetBaronyNameExplicitly], todas as profissões relevantes estão representadas — o ferreiro [laamp_weaponsmith_craftsman.GetFirstName] perto do campo de treinamento, o armorer [laamp_armorer_craftsman.GetFirstName] em sua forja e [laamp_jeweler_craftsman.GetFirstName], o ourives, mais à frente."
 ep3_laamp_decision_event.1060.desc_outro:0 "\n\nEu paro por um momento, observando as crianças brincando entre os materiais brutos. Seus pais gentilmente as afastam enquanto decido onde ir a seguir."
 ep3_laamp_decision_event.1060.desc_outro_partner:0 "\n\n[visiting_partner.GetFirstName] segue meu exemplo, vagando tranquilamente pela rua e comentando sobre as mercadorias em exibição. [visiting_partner.GetSheHe|U] me olha enquanto eu pauso, tentando determinar para onde ir a seguir."
 ep3_laamp_decision_event.1060.desc_outro_quartermaster:0 "\n\nHá também um [laamp_quartermaster_recruit.GetWomanMan] desgastado e resignado perambulando. [laamp_quartermaster_recruit.GetSheHe|U] me olha e rosna indignado: \"Eu costumava ser #EMP alguém!#! Eu sou [laamp_quartermaster_recruit.GetFirstName], #EMP o quartel-mestre do [visiting_location.GetTitle.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip|l]!#!\" antes de se acalmar, aparentemente perdido em pensamentos."
 ep3_laamp_decision_event.1060.desc_outro_quartermaster_return:0 "\n\nEnquanto pondero meu próximo destino, olho para o ex-quartel-mestre [laamp_quartermaster_recruit.GetFirstName], que ainda perambula sem rumo pela praça."
 ep3_laamp_decision_event.1060.desc_outro_return_01:0 "\n\nEu olho distraidamente para cima e para baixo da praça, exibindo um olhar vazio enquanto pondero onde ir a seguir."
 ep3_laamp_decision_event.1060.desc_outro_return_02:0 "\n\nAlgumas crianças estão brincando com um grande [ROOT.Char.Custom('get_region_dog_type')], alimentando-o com restos enquanto se revezam montando em suas costas musculosas.\n\nEu observo casualmente o jogo deles enquanto considero meu próximo movimento."
 ep3_laamp_decision_event.1060.desc_outro_return_03:0 "\n\nUm grupo de crianças encontrou um grande pedaço de minério e está chutando-o para cima e para baixo pela rua, seguindo algumas regras obscuras que criaram.\n\nEu olho para eles com fascínio enquanto cuidadosamente considero meu próximo passo."
 ep3_laamp_decision_event.1060.desc_outro_return_finished:0 "\n\nMeus pés doem e meu estômago ronca, foi um dia produtivo no distrito dos artesãos. Eu me vejo olhando ao redor em busca do caminho mais rápido de volta à praça principal."
 ep3_laamp_decision_event.1060.desc_outro_return_partner_01:0 "\n\n[visiting_partner.GetFirstName] fareja o ar, movendo-se rapidamente pela praça enquanto desvia de transeuntes na tentativa de manter um ritmo constante comigo.\n\n[visiting_partner.GetSheHe|U] alcança-me enquanto eu pauso por um breve segundo, considerando o que fazer a seguir."
 ep3_laamp_decision_event.1060.desc_outro_return_partner_02:0 "\n\nÀ minha esquerda, [visiting_partner.GetFirstName] examina curiosamente uma banca de mercado coberta com peles de [ROOT.Char.Custom('RegionalFerociousAnimal')] de todos os tamanhos, formas e cores.\n\nA cabeça montada de uma dessas bestas me sorri enquanto olho para baixo na rua, tentando decidir para onde ir a seguir."
 ep3_laamp_decision_event.1060.desc_outro_return_partner_03:0 "\n\n[visiting_partner.GetFirstName] se move casualmente de um lado para o outro pela praça, examinando as barracas. Observando [visiting_partner.GetHerHim] distraidamente, pondero o que fazer a seguir."
 ep3_laamp_decision_event.1060.desc_outro_return_partner_finished:0 "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
 ep3_laamp_decision_event.1060.desc_returned_01:0 "O sol está alto sobre o distrito dos artesãos enquanto retorno a uma profusão de sons, vistas e cheiros."
 ep3_laamp_decision_event.1060.desc_returned_02:0 "Uma nuvem suaviza a luz sobre o distrito dos artesãos, e retorno a um cheiro agressivo, ao perceber que me aproximei demais da oficina do curtidor a caminho de volta."
 ep3_laamp_decision_event.1060.desc_returned_from_armorer:0 "O suor da forja está lentamente escorrendo pelas minhas costas e sou agraciado com uma brisa fresca ao retornar ao distrito dos artesãos."
 ep3_laamp_decision_event.1060.desc_returned_from_jeweler:0 "Eu estreito os olhos diante do brilho ofuscante da praça ao sair da morada do ourives e entrar na praça do distrito dos artesãos."
 ep3_laamp_decision_event.1060.desc_returned_from_quartermaster:0 "O ar está significativamente menos abafado no distrito dos artesãos, enquanto saio da taverna turva onde [laamp_quartermaster_recruit.GetFirstName] está afogando suas mágoas."
 ep3_laamp_decision_event.1060.desc_returned_from_weaponsmith:0 "Voltando do ferreiro, os diversos artesãos e seus ajudantes ainda estão a todo vapor carregando mercadorias de um lado para o outro."
 ep3_laamp_decision_event.1060.e:0 "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1060.e_second:0 "$ep3_laamp_decision_event.1040.e_second$"
 ep3_laamp_decision_event.1060.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Distrito dos Artesãos"
 ep3_laamp_decision_event.1061.a:0 "\"Eu diria que [1061_first_weapon.GetNameNoTooltip] parece uma ótima escolha.\""
 ep3_laamp_decision_event.1061.b:0 "\"Eu não me importaria com o [1061_second_weapon.GetNameNoTooltip].\""
 ep3_laamp_decision_event.1061.c:0 "\"[1061_third_weapon.GetNameNoTooltip] é do jeito que #EMP eu#! gosto.\""
 ep3_laamp_decision_event.1061.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1061.desc:0 "$ep3_laamp_decision_event.1061.desc_intro$\n\n[laamp_weaponsmith_craftsman.GetSheHe|U] me lança um olhar, encerra prontamente sua conversa e, em seguida, se volta para me abordar enquanto [laamp_weaponsmith_craftsman.GetSheHe] aponta para as armas em exibição: \"Estas são as peças que tenho à venda.\"\n\n\"Temperadas nas chamas mais quentes,\" [laamp_weaponsmith_craftsman.GetSheHe] acrescenta, com um tom de orgulho na voz."
 ep3_laamp_decision_event.1061.desc_intro:0 "O ferreiro [laamp_weaponsmith_craftsman.GetFirstName], conversando casualmente com alguns servos próximos, está parado ao lado de uma barraca improvisada perto do campo de treinamento."
 ep3_laamp_decision_event.1061.desc_returned_01:0 "De volta ao campo de treinamento, o ferreiro [laamp_weaponsmith_craftsman.GetFirstName] ainda está em sua barraca, agora polindo suavemente uma das armas com um pedaço de pano macio.\n\n[laamp_weaponsmith_craftsman.GetSheHe|U] canta para [laamp_weaponsmith_craftsman.GetHerselfHimself] enquanto faz isso, mas para abruptamente ao me ver. \"Encontrou algo para espetar, afinal?\" [laamp_weaponsmith_craftsman.GetSheHe] diz, sem um traço de camaradagem."
 ep3_laamp_decision_event.1061.desc_returned_02:0 "Ao retornar ao ferreiro, [laamp_weaponsmith_craftsman.GetFirstName] tirou um petisco de uma bolsa no cinto e está apreciativamente comendo em pequenos pedaços.\n\nNotando minha presença, [laamp_weaponsmith_craftsman.GetSheHe] cuidadosamente escova as migalhas de sua capa, levanta-se e me lança um olhar enigmático: \"Mudou de ideia?\""
 ep3_laamp_decision_event.1061.desc_reused_weaponsmith:0 "$ep3_laamp_decision_event.1061.desc_intro$\n\n[laamp_weaponsmith_craftsman.GetSheHe|U] me lança um olhar reconhecedor, levanta uma sobrancelha e dá alguns passos em direção a mim: \"Bem então, não é todo dia que se vê um cliente retornando!\"\n\n\"Por favor, dê uma olhada nas minhas ofertas,\" [laamp_weaponsmith_craftsman.GetSheHe] diz, tentando sorrir."
 ep3_laamp_decision_event.1061.return.tt:0 "Você retorna ao distrito dos artesãos"
 ep3_laamp_decision_event.1061.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Ferreiro"
 ep3_laamp_decision_event.1063.a:0 "[1063_first_armor.GetNameNoTooltip] tem um bonito brilho."
 ep3_laamp_decision_event.1063.b:0 "A obra-prima de [1063_second_armor.GetNameNoTooltip] é requintada."
 ep3_laamp_decision_event.1063.c:0 "Faz todo sentido pegar [1063_third_armor.GetNameNoTooltip]."
 ep3_laamp_decision_event.1063.d:0 "\"Que talento! Você deveria se juntar a nós.\""
 ep3_laamp_decision_event.1063.desc:0 "A fornalha está quente na forja de [laamp_armorer_craftsman.GetFirstName], e o ar está denso para respirar.\n\n[laamp_armorer_craftsman.GetSheHe|U] me lança um olhar breve, dá um golpe final com o martelo em um capacete avental impecavelmente liso, então se aproxima e limpa suas mãos.\n\n\"Você pode ver o que tenho à venda naquela prateleira,\" [laamp_armorer_craftsman.GetFirstNameNoTooltip] diz, gesticulando para uma robusta bancada de trabalho no fundo da sala."
 ep3_laamp_decision_event.1063.desc_returned_01:0 "[laamp_armorer_craftsman.GetFirstName] está fazendo uma pausa na martelada monótona. [laamp_armorer_craftsman.GetSheHe|U] anda pela oficina, aparentemente procurando algo: \"Alicate,\" [laamp_armorer_craftsman.GetSheHe] resmunga, \"nunca está onde você o deixou.\"\n\nEntão [laamp_armorer_craftsman.GetFirstNameNoTooltip] volta sua atenção para mim e acena em direção às peças de armadura em exibição: \"Bem, então?\""
 ep3_laamp_decision_event.1063.desc_returned_02:0 "A fornalha está ligeiramente mais fria desta vez, enquanto [laamp_armorer_craftsman.GetFirstName] está consertando uma peça diferente de metal, amassando suavemente o aço até que se curve.\n\nCuidando para não perturbar seu processo, eu me aproximo para continuar examinando as peças de armadura apresentadas na bancada de trabalho.\n\n\"Precisa de proteção, afinal, presumo?\" [laamp_armorer_craftsman.GetFirstNameNoTooltip] comenta, com um tom divertido."
 ep3_laamp_decision_event.1063.desc_reused_armorer:0 "A forja de [laamp_armorer_craftsman.GetFirstName] é exatamente como eu me lembro. Meu olhar imediatamente se fixa na bancada de trabalho no fundo da sala, onde [laamp_armorer_craftsman.GetSheHe] mantém as peças de armadura à venda.\n\nOs olhos de [laamp_armorer_craftsman.GetFirstNameNoTooltip] se iluminam enquanto [laamp_armorer_craftsman.GetSheHe] olha para cima do arnês em que está trabalhando e me reconhece: \"Um cliente retornando! Encontrou algo que goste?\""
 ep3_laamp_decision_event.1063.e:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1063.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Armorer"
 ep3_laamp_decision_event.1065.a:0 "\"Eu não me importaria com aquele [1065_first_accessory.GetNameNoTooltip].\""
 ep3_laamp_decision_event.1065.b:0 "\"[1065_second_accessory.GetNameNoTooltip] — agora #EMP isso#! é algo para mim.\""
 ep3_laamp_decision_event.1065.c:0 "\"Eu gostaria de comprar o [1065_third_accessory.GetNameNoTooltip].\""
 ep3_laamp_decision_event.1065.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1065.desc:0 "Na luz fraca da casa do joalheiro, [laamp_jeweler_craftsman.GetFirstName] está em pé sobre um alto balcão, enquanto coloca delicadamente o menor enfeite em [1065_first_accessory.GetName].\n\nHipnotizado, observo seu trabalho delicado por um momento, antes de limpar a garganta.\n\n[laamp_jeweler_craftsman.GetSheHe|U] reconhece minha presença, se endireita e diz contemplativamente: \"Procurando um broche? Um anel? Um colar, talvez?\" enquanto [laamp_jeweler_craftsman.GetSheHe] segura um dos pequenos artefatos."
 ep3_laamp_decision_event.1065.desc_returned_01:0 "Na casa do joalheiro, [laamp_jeweler_craftsman.GetFirstName] está inclinado sobre um broche cravejado de joias com a forma de uma [visiting_location.Custom('get_region_flower_type')] magnífica. Quando escuto com atenção, consigo ouvir os sussurros apaixonados [laamp_jeweler_craftsman.GetHerHim]: \"Minha preciosa flor, de fato...\"\n\nApressadamente dou um passo à frente, fazendo um dos assoalhos range, e [laamp_jeweler_craftsman.GetSheHe] se dá conta da minha presença.\n\nSobressaltado, [laamp_jeweler_craftsman.GetFirstNameNoTooltip] rapidamente se recompõe e proclama: \"Você de novo! Meu Deus — mudou de ideia?\""
 ep3_laamp_decision_event.1065.desc_returned_02:0 "Ao retornar, [laamp_jeweler_craftsman.GetFirstName], segurando um [ROOT.Char.Custom('WritingInstrument')], está atualmente investigando as prateleiras de joias enquanto rapidamente faz um inventário em um diário rasgado.\n\nMe lançando um olhar breve, [laamp_jeweler_craftsman.GetSheHe] diz \"De volta, então? Qual você queria?\" e se move para inspecionar o resto das prateleiras."
 ep3_laamp_decision_event.1065.desc_reused_jeweler:0 "O joalheiro [laamp_jeweler_craftsman.GetFirstName] está no meio de fixar o ornamento de [visiting_location.Custom('GetRandomRegionalWood')] de uma pequena estatueta, quando entro na casa escura.\n\n[laamp_jeweler_craftsman.GetSheHe|U] olha para cima, me analisa, então faz um som de apreciação: \"Um cliente retornando. Que #EMP precioso#!\"\n\nAinda segurando a pequena estatueta, [laamp_jeweler_craftsman.GetFirstNameNoTooltip] aponta para os objetos em exibição: \"O que você poderia estar interessado desta vez?\""
 ep3_laamp_decision_event.1065.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Joalheiro"
 ep3_laamp_decision_event.1067.a:0 "$ep3_laamp_decision_event.1047.a$"
 ep3_laamp_decision_event.1067.b:0 "\"Eu tenho um bom número de seguidores para você organizar!\""
 ep3_laamp_decision_event.1067.c.failure.tt:0 "[laamp_quartermaster_recruit.GetShortUIName] começa a ignorá-lo"
 ep3_laamp_decision_event.1067.c.failure:0 "Você não consegue convencer [laamp_quartermaster_recruit.GetShortUIName]"
 ep3_laamp_decision_event.1067.c.success:0 "[laamp_quartermaster_recruit.GetShortUIName] aceita seu desafio"
 ep3_laamp_decision_event.1067.c:0 "\"Aposto que você não aguentaria um #EMP dia#! no meu acampamento.\""
 ep3_laamp_decision_event.1067.d:0 "$ep3_laamp_decision_event.1021.d$"
 ep3_laamp_decision_event.1067.desc:0 "Eu sigo [laamp_quartermaster_recruit.GetFirstName] para uma taverna próxima. A luz fica fraca e um odor de líquidos azedos sobrecarrega meus sentidos.\n\n[laamp_quartermaster_recruit.GetFirstNameNoTooltip] se senta no balcão e sinaliza para uma bebida. \"Eu costumava ser alguém...,\" [laamp_quartermaster_recruit.GetSheHe] repete para [laamp_quartermaster_recruit.GetHerselfHimself], como um mantra, enquanto lasca a xícara com uma unha desgastada.\n\nEu me aproximo do desonrado quartermaster e respiro fundo antes de me envolver:"
 ep3_laamp_decision_event.1067.desc_returned_01:0 "[laamp_quartermaster_recruit.GetFirstName] ainda está sentado em um canto escuro da taverna, segurando seu copo de [laamp_quartermaster_recruit.Custom('RegionalDrink')] como se fosse o bilhete para a salvação.\n\n[laamp_quartermaster_recruit.GetSheHe|U] mal levanta a cabeça, enquanto eu navego cuidadosamente pela penumbra para me aproximar [laamp_quartermaster_recruit.GetHerHim]. \"Você de novo?\" [laamp_quartermaster_recruit.GetSheHe] murmura, e então se vira."
 ep3_laamp_decision_event.1067.desc_returned_02:0 "[laamp_quartermaster_recruit.GetFirstName] está no meio de uma discussão ruidosa com outro cliente da taverna — um [ROOT.Char.GetWomanMan] alto e escuro que aparentemente queria que [laamp_quartermaster_recruit.GetFirstNameNoTooltip] #EMP \"simplesmente parasse de reclamar!\"#!\n\nAntes que as coisas esquentem, [laamp_quartermaster_recruit.GetFirstNameNoTooltip] me nota e se desvincula da situação com um bufar.\n\n\"Você voltou,\" [laamp_quartermaster_recruit.GetSheHe] declara, com um olhar surpreendentemente sóbrio. \"O que você queria mesmo?\""
 ep3_laamp_decision_event.1067.desc_returned_03:0 "[laamp_quartermaster_recruit.GetFirstName] me olha sem expressão enquanto eu retorno à taverna. Leva um momento, então [laamp_quartermaster_recruit.GetSheHe] pisca e lentamente balança sua cabeça.\n\nUm garçom da taverna coloca outra xícara de [laamp_quartermaster_recruit.Custom('RegionalDrink')] na frente de [laamp_quartermaster_recruit.GetFirstNameNoTooltip], e [laamp_quartermaster_recruit.GetSheHe] se recosta com um pesado suspiro, cobrindo seus olhos com a palma da mão.\n\nEu me aproximo cuidadosamente do ex-quartermaster, limpando a garganta enquanto faço isso:"
 ep3_laamp_decision_event.1067.desc_reused_quartermaster:0 "Enquanto tento pensar em onde já vi [laamp_quartermaster_recruit.GetFirstName] antes, não tenho dificuldade em seguir [laamp_quartermaster_recruit.GetSheHe] para uma das tabernas escuras nas proximidades.\n\nDentro, [laamp_quartermaster_recruit.GetSheHe] vai até o balcão para pegar uma bebida, então se vira e me dá um olhar surpreendentemente afiado: \"Não finja que não nos encontramos antes.\"\n\nEm um movimento rápido, [laamp_quartermaster_recruit.GetSheHe] esvazia a xícara de [laamp_quartermaster_recruit.Custom('RegionalDrink')] e levanta uma sobrancelha suada: \"Você queria algo?\""
 ep3_laamp_decision_event.1067.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: o Quartermaster"
 ep3_laamp_decision_event.return.tt:0 "Você retorna para a [THIS.Char.Custom('GetMainsquareCommons')]"
 full_on_supplies.tt:0 "Você já tem a quantidade #V máxima#! de [provisions|E]"
 gallowsbait_thief_blocked_from_contract.tt:0 "Você está muito envolvido no [trait|E] [GetTrait('gallowsbait').GetName( GetNullCharacter )] [GetTrait( 'gallowsbait' ).GetTraitTrackByKey( 'thief' ).GetName] para ser confiável com este [vassal_contract|E]"
