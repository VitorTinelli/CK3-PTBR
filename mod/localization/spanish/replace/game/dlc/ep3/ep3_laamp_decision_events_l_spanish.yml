 ep3_laamp_decision_event.1025.d_nothing:0 "Hã. Isso é tudo, eu acho."
 ep3_laamp_decision_event.1025.desc:0 "O arauto se anima ao me ver chegar, tagarelando incessantemente sobre os contratos próximos postados por nobres locais.\n\n[laamp_town_crier.GetSheHe|U] é acompanhado por um gato velho, amistoso e de pelagem branca e marrom que me olha com os olhos azuis mais claros enquanto ouço atentamente as listas narradas:"
 ep3_laamp_decision_event.1025.desc_a:0 "[ROOT.Char.Custom('TownCrierDescOptionA')]"
 ep3_laamp_decision_event.1025.desc_b:0 "[ROOT.Char.Custom('TownCrierDescOptionB')]"
 ep3_laamp_decision_event.1025.desc_c:0 "[ROOT.Char.Custom('TownCrierDescOptionC')]"
 ep3_laamp_decision_event.1025.desc_concatenated_A:0 "\n\n\"[ROOT.Char.Custom('TownCrierDescOptionA')]\""
 ep3_laamp_decision_event.1025.desc_concatenated_AB:0 "\n\n\"[ROOT.Char.Custom('TownCrierDescOptionA')] [ROOT.Char.Custom('TownCrierDescOptionB')]\""
 ep3_laamp_decision_event.1025.desc_concatenated_ABC:0 "\n\n\"[ROOT.Char.Custom('TownCrierDescOptionA')] [ROOT.Char.Custom('TownCrierDescOptionB')] [ROOT.Char.Custom('TownCrierDescOptionC')]\""
 ep3_laamp_decision_event.1025.desc_concatenated_AC:0 "\n\n\"[ROOT.Char.Custom('TownCrierDescOptionA')] [ROOT.Char.Custom('TownCrierDescOptionC')]\""
 ep3_laamp_decision_event.1025.desc_concatenated_B:0 "\n\n\"[ROOT.Char.Custom('TownCrierDescOptionB')]\""
 ep3_laamp_decision_event.1025.desc_concatenated_BC:0 "\n\n\"[ROOT.Char.Custom('TownCrierDescOptionB')] [ROOT.Char.Custom('TownCrierDescOptionC')]\""
 ep3_laamp_decision_event.1025.desc_concatenated_C:0 "\n\n\"[ROOT.Char.Custom('TownCrierDescOptionC')]\""
 ep3_laamp_decision_event.1025.desc_criminal_contracts:0 "#EMP Especialistas discretos necessários para oportunidades lucrativas!#!"
 ep3_laamp_decision_event.1025.desc_diplomacy_contracts:0 "#EMP Negociadores eloquentes necessários para tratados diplomáticos!#!"
 ep3_laamp_decision_event.1025.desc_hireling_contracts:0 "#EMP Corpos capazes necessários para funções marciais!#!"
 ep3_laamp_decision_event.1025.desc_hunting_contracts:0 "#EMP Caçadores experientes necessários para tarefas de caça!#!"
 ep3_laamp_decision_event.1025.desc_intrigue_contracts:0 "#EMP Colaboradores habilidosos procurados para lidar com assuntos delicados!#!"
 ep3_laamp_decision_event.1025.desc_justicar_contracts:0 "#EMP Heraldos justos necessários para ajudar a manter a ordem!#!"
 ep3_laamp_decision_event.1025.desc_learning_contracts:0 "#EMP Custódios eruditos necessários para trabalhos acadêmicos!#!"
 ep3_laamp_decision_event.1025.desc_legendary:0 "O arauto, [laamp_town_crier.GetFirstName], está $ep3_laamp_decision_event.1025.desc_legendary_body$"
 ep3_laamp_decision_event.1025.desc_legendary_body:0 "tagarelando com outro [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] enquanto me aproximo de seu posto — eles sussurram sobre como algum nobre distante tem um problema particular e está oferecendo #EMP recompensas magníficas#!\n\nEu pondero sobre isso enquanto [laamp_town_crier.GetSheHe] de repente se lembra de seus deveres e se anima, prontamente informando seus arredores imediatos sobre os contratos atualmente disponíveis:"
 ep3_laamp_decision_event.1025.desc_legendary_returned_01:0 "De volta ao arauto, [laamp_town_crier.GetSheHe] reuniu uma pequena multidão, que appropriate mente faz \"oo\" e \"aa\" enquanto [laamp_town_crier.GetSheHe] relata as circunstâncias horríveis sob as quais o nobre distante busca ajuda em seu problema.\n\nEu levanto uma sobrancelha enquanto lembro dos contratos regulares que foram mencionados anteriormente:"
 ep3_laamp_decision_event.1025.desc_legendary_returned_02:0 "Ao retornar ao arauto, [laamp_town_crier.GetSheHe] está saturando outro grupo de transeuntes, soltando detalhes cada vez mais exagerados sobre o nobre distante.\n\nEu murmuro silenciosamente enquanto pondero sobre os contratos mencionados anteriormente:"
 ep3_laamp_decision_event.1025.desc_legendary_reused_crier:0 "Eu reconheço o arauto, [laamp_town_crier.GetFirstName], que está $ep3_laamp_decision_event.1025.desc_legendary_body$"
 ep3_laamp_decision_event.1025.desc_nothing:0 "O [ROOT.Char.Custom('GetTowncrierElder')] está sentado, encostado em sua cadeira, meio adormecido. Aparentemente, não há contratos disponíveis na área no momento."
 ep3_laamp_decision_event.1025.desc_returned_01:0 "Assim que retornamos ao arauto, o gato, agora encolhido, está dormindo em uma mesa próxima, sem prestar atenção às divagações do arauto. \n\n Eu noto que seus bigodes às vezes se movem enquanto ele sonha, e me aproximo para considerar os anúncios orados:"
 ep3_laamp_decision_event.1025.desc_returned_02:0 "Ao retornar ao arauto, o gato está esticado sob uma mesa, me observando com um olho azul meio fechado.\n\nEu me concentro em seu ronronar suave e então imediatamente me desconecto das listas anunciadas pelo arauto:"
 ep3_laamp_decision_event.1025.desc_reused_crier:0 "O arauto me dá um olhar reconhecedor e se anima ao me ver chegar, tagarelando incessantemente sobre os contratos próximos postados por nobres locais.\n\n[laamp_town_crier.GetSheHe|U] ainda está acompanhado pelo amigo gato velho de pelagem branca e marrom que me olha através de olhos azuis meio fechados enquanto eu escuto atentamente as listas narradas:"
 ep3_laamp_decision_event.1025.desc_stewardship_contracts:0 "#EMP Administradores reconhecidos necessários para tarefas organizacionais!#!"
 ep3_laamp_decision_event.1025.desc_transport_contracts:0 "#EMP Viajantes profissionais necessários para empreendimentos de escolta!#!"
 ep3_laamp_decision_event.1025.desc_treasure_map:0 "#EMP Aventureiros necessários para uma caça ao tesouro!#!"
 ep3_laamp_decision_event.1025.desc_tribal:0 "[Select_CString( laamp_town_crier.IsFemale, 'A anciã', 'O ancião' )], [laamp_town_crier.GetFirstName], me olha com um olhar amistoso ao me aproximar.\n\nCuidando prudentemente de uma carroça de bois, [laamp_town_crier.GetSheHe] me informa sobre os problemas locais e as tarefas que precisam de atenção nas proximidades:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary:0 "Um dos anciãos da aldeia, [laamp_town_crier.GetFirstName], está ocupado discutindo um assunto com outr[Select_CString( laamp_town_crier.IsFemale, 'a', 'o' )] [laamp_town_crier.GetWomanMan] da tribo enquanto me aproximo. $ep3_laamp_decision_event.1025.desc_tribal_legendary_body$"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_body:0 "\n\n[Select_CString( laamp_town_crier.IsFemale, 'A outra', 'O outro' )] [laamp_town_crier.GetWomanMan] começa a gesticular e eu ouço algo sobre um #EMP nobre distante que urgentemente precisa de assistência em um assunto importante#!, prometendo fama e riquezas em troca.\n\nEles terminam a conversa e eu me viro para [laamp_town_crier.GetFirstNameNoTooltip], que me informa sobre as tarefas locais que precisam ser atendidas:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_returned_01:0 "De volta [Select_CString( laamp_town_crier.IsFemale, 'a anciã', 'ao ancião' )], [Select_CString( laamp_town_crier.IsFemale, 'a', 'o' )] [laamp_town_crier.GetWomanMan] da tribo de antes estava tagarelando alto com outros membros da tribo, incluindo todos os detalhes desfavoráveis sobre o nobre distante e seu problema.\n\n[Select_CString( laamp_town_crier.IsFemale, 'A anciã', 'O ancião' )], [laamp_town_crier.GetFirstName], lança um olhar desaprovador a [laamp_town_crier.GetSheHe] à distância, enquanto me aproximo para perguntar [Select_CString( laamp_town_crier.IsFemale, 'a anciã', 'ao ancião' )] sobre quais tarefas locais precisam de atenção:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_returned_02:0 "Ao retornar ao ancião, [laamp_town_crier.GetSheHe] aparentemente repreendeu [Select_CString( laamp_town_crier.IsFemale, 'a outra', 'o outro' )] [laamp_town_crier.GetWomanMan] da tribo, que agora, cabisbaixos, estão sentados em uma carroça próxima.\n\n[Select_CString( laamp_town_crier.IsFemale, 'A', 'O' )] [laamp_town_crier.GetWomanMan] se animam quando [laamp_town_crier.GetSheHe] inicia uma conversa com outr[Select_CString( laamp_town_crier.IsFemale, 'a', 'o' )] [laamp_town_crier.GetWomanMan], enquanto me aproximo d[Select_CString( laamp_town_crier.IsFemale, 'a anciã', 'o ancião' )] [laamp_town_crier.GetFirstName], que é gentil o suficiente para refrescar minha memória sobre as tarefas disponíveis atualmente:"
 ep3_laamp_decision_event.1025.desc_tribal_legendary_reused_crier:0 "Ao me aproximar, o ancião, [laamp_town_crier.GetFirstName], que está atualmente em discussão com outr[Select_CString( laamp_town_crier.IsFemale, 'a', 'o' )] [laamp_town_crier.GetWomanMan] da tribo, me lança um olhar reconhecedor. $ep3_laamp_decision_event.1025.desc_tribal_legendary_body$"
 ep3_laamp_decision_event.1025.desc_tribal_returned_01:0 "Assim que retornamos ao ancião, o boi, uma magnífica besta, está lambendo suavemente a mão de [laamp_town_crier.GetFirstName] enquanto [laamp_town_crier.GetSheHe] continua alimentando-o com petiscos.\n\nCom um sorriso satisfeito, [laamp_town_crier.GetSheHe] reitera voluntariamente as tarefas disponíveis que ajudariam a população local:"
 ep3_laamp_decision_event.1025.desc_tribal_returned_02:0 "Ao retornar ao ancião, um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] importante com cartas está prestes a sair do local.\n\nEu dou um olhar intrigado na direção deles e então me volto para [Select_CString( laamp_town_crier.IsFemale, 'a anciã', 'o ancião' )] [laamp_town_crier.GetFirstName] para me lembrar das tarefas disponíveis atualmente:"
 ep3_laamp_decision_event.1025.desc_tribal_reused_crier:0 "[Select_CString( laamp_town_crier.IsFemale, 'A anciã', 'O ancião' )], que reconheço como [laamp_town_crier.GetFirstName], me dá um sorriso apreciativo ao retornar à postagem [laamp_town_crier.GetHerHim].\n\nApós uma conversa amigável, [laamp_town_crier.GetSheHe] me informa sobre os acontecimentos atuais e as tarefas que precisam ser atendidas:"
