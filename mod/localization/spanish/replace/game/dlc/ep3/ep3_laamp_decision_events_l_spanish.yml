 ep3_laamp_decision_event.1025.option.criminal_contracts:0 "\"...#EMP Eu#! estou disposto a oportunidades lucrativas.\""
 ep3_laamp_decision_event.1025.option.diplomacy_contracts:0 "\"Posso tentar alguns negócios diplomáticos.\""
 ep3_laamp_decision_event.1025.option.hireling_contracts:0 "\"Deveres marciais? Conte comigo.\""
 ep3_laamp_decision_event.1025.option.intrigue_contracts:0 "\"Colaborador? Como é #EMP intrigante#!.\""
 ep3_laamp_decision_event.1025.option.justicar_contracts:0 "\"Esta manhã está cheia de retidão!\""
 ep3_laamp_decision_event.1025.option.learning_contracts:0 "\"Trabalho acadêmico seria uma boa mudança de ritmo.\""
 ep3_laamp_decision_event.1025.option.legendary:0 "\"Vamos investigar aquele nobre distante!\""
 ep3_laamp_decision_event.1025.option.stewardship_contracts:0 "\"Organização é a minha especialidade.\""
