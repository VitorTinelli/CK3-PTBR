 ep3_laamp_decision_event.1000.a.tt:0 "Ir para a taverna"
 ep3_laamp_decision_event.1000.a:0 "Devemos nos misturar com os locais"
 ep3_laamp_decision_event.1000.a_nomads.tt:0 "Ir ao ponto de encontro local"
 ep3_laamp_decision_event.1000.a_nomads:0 "$ep3_laamp_decision_event.1000.a$."
 ep3_laamp_decision_event.1000.a_second:0 "Devemos retornar ao [ROOT.Char.Custom('GetTavernDwelling')]."
 ep3_laamp_decision_event.1000.a_tavern:0 "$ep3_laamp_decision_event.1000.a$ na taverna."
 ep3_laamp_decision_event.1000.b.tt:0 "Ir aos terrenos do [visiting_location.GetCounty.GetFaith.HouseOfWorship]"
 ep3_laamp_decision_event.1000.b:0 "Os terrenos do [visiting_location.GetCounty.GetFaith.HouseOfWorship] parecem interessantes."
 ep3_laamp_decision_event.1000.b_second:0 "Havia alguns negócios inacabados no [visiting_location.GetCounty.GetFaith.HouseOfWorship]."
 ep3_laamp_decision_event.1000.c.tt:0 "Ir aos terrenos do [visiting_location.GetHolding.GetType.GetName|l]"
 ep3_laamp_decision_event.1000.c:0 "Vamos dar uma olhada no [visiting_location.GetHolding.GetType.GetName|l] de [visiting_location.GetBaronyNameExplicitlyNoTooltip]."
 ep3_laamp_decision_event.1000.c_second:0 "Havia alguns negócios inacabados no [visiting_location.GetHolding.GetType.GetName|l]."
 ep3_laamp_decision_event.1000.d.tt:0 "Ir para o bairro dos artesãos locais"
 ep3_laamp_decision_event.1000.d:0 "Eu deveria visitar os bons artesãos."
 ep3_laamp_decision_event.1000.d_second:0 "Havia alguns negócios inacabados no distrito dos artesãos."
 ep3_laamp_decision_event.1000.desc_intro_castle_holding:0 "Poucos lugares são tão majestosos quanto um [visiting_location.GetHolding.GetType.GetName|l], e [visiting_location.GetTitle.GetNameNoTier] não é exceção. Tropas e bandeiras [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] são visíveis por toda a cidade.\n\nAo passarmos pelos portões principais, avisto um punhado de guardas espreitando pelas seteiras acima."
 ep3_laamp_decision_event.1000.desc_intro_church_holding:0 "Uma cidade magnífica, os vários cantos e hinos cobrem o [visiting_location.GetTitle.GetNameNoTier] [ROOT.Char.Custom('LocalHoldingType')|l] como um manto reconfortante, e não há dúvida sobre suas associações religiosas.\n\nAo passar pelos portões principais, vejo muitos ornamentos [visiting_location.GetCounty.GetFaith.GetAdjectiveNoTooltip], incrustados nas paredes, assim como em pilastras e andaimes."
 ep3_laamp_decision_event.1000.desc_intro_city_holding:0 "Um importante entroncamento comercial para os [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip], a riqueza gerada nos mercados de [visiting_location.GetTitle.GetNameNoTier] se infiltra em todos os cantos da cidade.\n\nAo entrarmos pelos portões da cidade, os gritos e imagens que anunciam comerciantes locais estão por toda parte."
 ep3_laamp_decision_event.1000.desc_intro_constantinople:0 "À medida que passamos por arcos e colunatas, entramos na grande cidade de [visiting_location.GetBaronyNameExplicitlyNoTooltip]. Não é à toa que esta é a joia da coroa [Select_CString( visiting_location.IsFemale, 'da', 'do' )] [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitledFirstName], e eu olho ao longe, em direção ao coração da cidade."
 ep3_laamp_decision_event.1000.desc_intro_returned_constantinople_01:0 "No ponto de observação, olho para [visiting_location.GetTitle.GetNameNoTierNoTooltip] tentando compreender esta joia de [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nCulturas de todo o mundo estão representadas aqui, entre os [visiting_location.GetCulture.GetNameNoTooltip], realmente um caldeirão de tradições e costumes.\n\nPerto do Hipódromo, parece que uma competição começou, a julgar pelos gritos de alegria e excitação."
 ep3_laamp_decision_event.1000.desc_intro_returned_from_castle:0 "Voltando dos portões do castelo, noto uma patrulha de soldados [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] de aparência desleixada patrulhando o perímetro, mantendo um olhar atento em quem parece sombrio ou diferente."
 ep3_laamp_decision_event.1000.desc_intro_returned_from_church:0 "No caminho de volta dos terrenos da [visiting_location.GetCounty.GetFaith.HouseOfWorship], um grupo de [visiting_location.GetCounty.GetFaith.AltPriestTermPlural] se move em lenta procissão pela praça, cantando serenamente enquanto passam."
 ep3_laamp_decision_event.1000.desc_intro_returned_from_craftsmen:0 "Após minha visita aos artesãos, um pequeno grupo de malabaristas faz uma pequena apresentação na praça principal, atraindo uma quantidade moderada de espectadores."
 ep3_laamp_decision_event.1000.desc_intro_returned_from_second:0 "Rapidamente faço o caminho de volta do outro extremo da [ROOT.Char.Custom('GetMainsquareCommons')], passando por um vendedor ambulante com dezenas de pequenos frascos de vidro contendo líquidos de diferentes cores."
 ep3_laamp_decision_event.1000.desc_intro_returned_from_tavern:0 "Saio da [ROOT.Char.Custom('GetTavernDwelling')] e aperto os olhos na luz, respirando o ar fresco do lado de fora. O cheiro de um [visiting_location.GetCounty.GetCulture.GetNameNoTooltip] próximo vendendo [visiting_location.GetTitle.GetHolder.Custom('GetLocalStreetFoodPlural')] faz minha boca salivar."
 ep3_laamp_decision_event.1000.desc_intro_returned_generic_01:0 "Passando pela [ROOT.Char.Custom('GetMainsquareCommons')] de [visiting_location.GetTitle.GetNameNoTierNoTooltip] está uma procissão de comerciantes estrangeiros curiosos, a caminho de [neighboring_county.GetTitle.GetNameNoTierNoTooltip]."
 ep3_laamp_decision_event.1000.desc_intro_returned_generic_02:0 "De volta à [ROOT.Char.Custom('GetMainsquareCommons')], um [ROOT.Char.Custom('RegionalFerociousAnimal')] domesticado cambaleia para cumprimentar entusiasticamente um transeunte inocente, causando bastante comoção."
 ep3_laamp_decision_event.1000.desc_intro_returned_generic_03:0 "Voltando à [ROOT.Char.Custom('GetMainsquareCommons')], somos recebidos pelo açougueiro local esvaziando os resíduos atrás, para alimentar seus cães de guarda."
 ep3_laamp_decision_event.1000.desc_intro_returned_generic_04:0 "No caminho de volta para a [ROOT.Char.Custom('GetMainsquareCommons')], paro para admirar o trabalho de um tecelão local, criando uma peça de arte encomendada [Select_CString( visiting_location.IsFemale, 'pela', 'pelo' )] [visiting_location.GetCounty.GetTitle.GetHolder.GetTitledFirstNameNoTooltip]."
 ep3_laamp_decision_event.1000.desc_intro_returned_home:0 "À medida que a noite se aproxima, os habitantes de [visiting_location.GetBaronyNameExplicitlyNoTooltip] se recolhem em suas casas.\n\nOs lojistas fecharam suas barracas e os pontos de interesse fecharam seus portões."
 ep3_laamp_decision_event.1000.desc_intro_tribal_holding_01:0 "O povo local [visiting_location.GetCounty.GetCulture.GetNameNoTooltip|U] se reúne regularmente no [ROOT.Char.Custom('LocalHoldingType')|l] de [visiting_location.GetBaronyNameExplicitlyNoTooltip] para trocar mercadorias, fofocar e compartilhar histórias.\n\nQuando entro no agrupamento de [ROOT.Char.Custom('GetBuildingDwelling')]s, um [ROOT.Char.Custom('RegionalFarmAnimal')] perdido move-se lentamente pelo caminho no centro da [ROOT.Char.Custom('SettlementCity')|l], e um pequeno [ROOT.Char.Custom('SmallAnimal')] sonolento atravessa a vegetação alguns passos à minha direita."
 ep3_laamp_decision_event.1000.desc_intro_tribal_holding_02:0 "Passamos por várias camadas de tribos com características mais militantes a caminho do coração de [visiting_location.GetTitle.GetNameNoTier].\n\nLanças, adagas e arcos; mas também [ROOT.Char.Custom('GetTribalTradegoods')], crenças indígenas — tudo faz parte de um [visiting_location.GetHolding.GetType.GetName|l]. Sou recebido principalmente com acenos amigáveis; mas também com alguns olhares desconfiados."
 ep3_laamp_decision_event.1000.desc_outro_constantinople:0 "\n\nCom a Hagia Sophia e o Hipódromo à vista no horizonte, começo a me sentir bastante pequeno, impressionado com esses monumentos."
 ep3_laamp_decision_event.1000.desc_outro_home:0 "\n\nUm longo dia de afazeres finalmente está me alcançando, e me vejo ansiando por minha cama."
 ep3_laamp_decision_event.1000.desc_outro_new:0 "\n\nAo absorver as vistas e cheiros deste lugar, rapidamente me localizo neste novo ambiente."
 ep3_laamp_decision_event.1000.desc_outro_partner_01:0 "\n\n[Select_CString( visiting_partner.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_partner'))], [visiting_partner.GetFirstName], olha ao redor com uma expressão de contentamento, aparentemente apreciando a mudança de cenário."
 ep3_laamp_decision_event.1000.desc_outro_partner_home:0 "\n\n[visiting_partner.GetFirstName] alonga seus membros e solta um suspiro de contentamento: \"Eu não me importaria com uma refeição quente de volta ao acampamento agora\", diz [visiting_partner.GetSheHe], com saudade."
 ep3_laamp_decision_event.1000.desc_outro_regional_britannia_returned_01:0 "\n\nLá em cima, as nuvens se abrem por um momento, permitindo que raios de sol dancem pelos telhados e habitantes do [ROOT.Char.Custom('GetSquareCommons')]."
 ep3_laamp_decision_event.1000.desc_outro_regional_britannia_returned_02:0 "\n\nRecusando-se a parar, a chuva melancólica continua caindo, lentamente formando poças no chão irregular. Um [ROOT.Char.Custom('RegionalFarmAnimal')] imóvel lamenta miseravelmente ter sido deixado na garoa."
 ep3_laamp_decision_event.1000.desc_outro_regional_britannia_returned_03:0 "\n\nUma névoa úmida envolve o [ROOT.Char.Custom('GetSquareCommons')] com um aperto de ferro, e qualquer pessoa que se aventure fora de casa tem suas roupas imediatamente umedecidas pela chuva sempre presente."
 ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_01:0 "Um pequeno lagarto desliza pelos blocos de coral de uma das casas estreitas e encontra seu caminho até o telhado plano, onde se aquece ao sol."
 ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_02:0 "O tijolo cozido de uma parede de meia altura aquece-se ao calor do sol, irradiando calor para qualquer coisa — ou pessoa — que se atreva a subir nela."
 ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_03:0 "Avisto uma pequena concha presa para sempre em uma das paredes de calcário de uma moradia próxima."
 ep3_laamp_decision_event.1000.desc_outro_regional_east_africa_returned_04:0 "À minha esquerda, um dos comerciantes ajusta o dossel de folhas de sua barraca de mercado para fornecer sombra às suas nozes de cola."
 ep3_laamp_decision_event.1000.desc_outro_regional_europe_returned_01:0 "\n\nUma leve garoa começou, realçando o verde da paisagem e trazendo um suave aroma de terra; dando a sensação de calma antes da tempestade."
 ep3_laamp_decision_event.1000.desc_outro_regional_europe_returned_02:0 "\n\nUm vento frio sopra de um lago próximo, fazendo com que o gado solte um balido surpreso e os comerciantes apertem suas capas mais firmemente ao redor dos ombros."
 ep3_laamp_decision_event.1000.desc_outro_regional_europe_returned_03:0 "\n\nÀ minha esquerda, camponeses locais estão retornando do serviço em uma igreja de pedra próxima. O ministro parado na entrada me lança um sorriso enigmático enquanto passo."
 ep3_laamp_decision_event.1000.desc_outro_regional_iberia_returned_01:0 "\n\nAo longe, a luz de uma fonte decorativa projeta reflexos celestiais em um arco de ferradura próximo."
 ep3_laamp_decision_event.1000.desc_outro_regional_iberia_returned_02:0 "\n\nÀ minha esquerda, um[Select_CString( dummy_gender.IsFemale, 'a', '' )] [dummy_gender.GetWomanMan] idos[Select_CString( dummy_gender.IsFemale, 'a', 'o' )] restaura gentilmente um mosaico local com um punhado de peças — em sua maioria — novas, obtendo um resultado superior."
 ep3_laamp_decision_event.1000.desc_outro_regional_iberia_returned_03:0 "\n\nLá em cima, um ícone religioso observa a agitação da rua movimentada com um olhar contemplativo."
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_01:0 "\n\nLá em cima, um grupo de macacos macacos está causando alvoroço nas árvores, aparentemente irritado com alguma coisa."
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_02:0 "\n\nPara o divertimento do público, um bando barulhento e incessante de periquitos coloridos ocupou o telhado de um prédio próximo, nos lembrando o quão perto estamos da natureza."
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_03:0 "Ao longe, uma profusão de tecidos coloridos, pendurados para secar, fornece um cenário encantador para a [ROOT.Char.Custom('LocalHoldingType')|l]."
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_04:0 "Na rua, crianças estão brincando nas poças deixadas pela forte chuva desta manhã."
 ep3_laamp_decision_event.1000.desc_outro_regional_india_returned_05:0 "À minha esquerda, um tratador de elefantes treinando um novo elefante atrai uma pequena multidão de curiosos, observando o espetáculo."
 ep3_laamp_decision_event.1000.desc_outro_regional_middle_east_returned_01:0 "\n\nAinda faz calor lá fora, e as pessoas mudaram ligeiramente de posição, movendo-se para qualquer sombra disponível. Um abutre ameaçador circula à beira da [ROOT.Char.Custom('SettlementCity')|l]."
 ep3_laamp_decision_event.1000.desc_outro_regional_middle_east_returned_02:0 "\n\nEnquanto um escorpião passa rapidamente, as correntes de ar criam redemoinhos de areia que brilham de forma quase etérea ao sol do deserto."
 ep3_laamp_decision_event.1000.desc_outro_regional_middle_east_returned_03:0 "\n\nÀ minha direita estão as ruínas de uma antiga mesquita, cujos materiais estão sendo reutilizados pelos [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] locais."
 ep3_laamp_decision_event.1000.desc_outro_regional_north_africa_returned_01:0 "Uma brisa brincalhona percorre rapidamente as casas circulares de pisé, proporcionando um alívio do calor abrasador."
 ep3_laamp_decision_event.1000.desc_outro_regional_north_africa_returned_02:0 "[Select_CString( dummy_gender.IsFemale, 'Algumas', 'Alguns' )] [dummy_gender.GetWomenMen] saem refrescados de um dos hammams e eu olho com saudade para a entrada, de repente desejando um banho relaxante."
 ep3_laamp_decision_event.1000.desc_outro_regional_north_africa_returned_03:0 "Um burro solta um gemido infeliz, aparentemente preso em uma das ruas estreitas e cobertas de pedrinhas que separam as casas."
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_summer_returned_01:0 "\n\nO sol, praticamente nunca se pondo nesta época do ano, ainda está no céu, e a única coisa que compete com seu brilho é a palidez das pessoas na [ROOT.Char.Custom('SettlementCity')|l]."
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_summer_returned_02:0 "\n\nUma chuva temperada e inesperada chegou à [ROOT.Char.Custom('SettlementCity')|l] [ROOT.Char.Custom('GetSquareCommons')] e está caindo suavemente sobre as pessoas e o gado."
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_winter_returned_01:0 "\n\nA neve, refletindo a luz do sol, repousa pesada nos telhados e nas [ROOT.Char.Custom('GetTreesScaffolding')|l]; seu brilho ofuscante compete apenas com a palidez dos habitantes de [visiting_location.GetTitle.GetNameNoTierNoTooltip], de bochechas rosadas."
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_winter_returned_02:0 "\n\nApesar das temperaturas congelantes, não há vento. A [ROOT.Char.Custom('SettlementCity')|l] tem uma nitidez inquietante, enquanto todos os seres vivos no [ROOT.Char.Custom('GetSquareCommons')] exalam plumas brancas de calor."
 ep3_laamp_decision_event.1000.desc_outro_regional_scandinavia_winter_returned_03:0 "\n\nLogo escurecerá novamente, e os [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] correm de um lado para o outro na fraca luz do dia, tentando realizar todas as tarefas que se tornam impossíveis após o pôr do sol."
 ep3_laamp_decision_event.1000.desc_outro_regional_steppe_returned_01:0 "Lá ao longe, um rebanho pacífico de bois e cavalos perambula pelos campos, satisfazendo sua fome imediata."
 ep3_laamp_decision_event.1000.desc_outro_regional_steppe_returned_02:0 "Mais à frente, um potro está sendo guiado perto de uma égua parada, enquanto o homem da tribo prepara o procedimento de ordenha."
 ep3_laamp_decision_event.1000.desc_outro_regional_steppe_returned_03:0 "À minha esquerda, um punhado de membros da tribo estão restaurando uma yurt danificada, cobrindo cuidadosamente a nova lona com giz."
 ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_01:0 "Um punhado de comerciantes vagueia pela seção leste do [ROOT.Char.Custom('GetSquareCommons')], sendo que um deles se destaca como o mais rico, ostentando cowries."
 ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_02:0 "Meus olhos captam as cores vibrantes das colheitas locais apresentadas em tapetes grossos — melão, abóboras, pepinos, laranjas. É uma visão alegre de se ver."
 ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_03:0 "O sol reflete em um peso de bronze ornamentado que está sendo guardado por um comprador satisfeito, pagando o devido com pó de ouro."
 ep3_laamp_decision_event.1000.desc_outro_regional_west_africa_returned_04:0 "Um punhado de construtores está erguendo um segundo andar em cima de uma das casas elaboradas, ajustando o ritmo devido ao calor."
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_01:0 "O barulho e a negociação intensa nas barracas de suprimentos próximas ecoam até aqui, dando ao [ROOT.Char.Custom('GetMainsquareCommons')] uma sensação de agitação."
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_02:0 "\n\nUm traficante ameaçador está realizando seu comércio questionável um pouco mais adiante no [ROOT.Char.Custom('GetSquareCommons')], para o desgosto de alguns transeuntes."
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_03:0 "\n\nEstá quente, embora não seja o calor intenso típico desta região. Os trabalhadores e nobres seguem com suas vidas diárias, aproveitando a temperatura agradável."
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_04:0 "\n\nUm rebanho d[ROOT.Char.Custom('RegionalFarmAnimalPlural')] bloqueia efetivamente o caminho de um comerciante itinerante, causando muita angústia e gritos."
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_05:0 "\n\nÀ minha esquerda, um [ROOT.Char.Custom('SoundingRegionalFarmAnimal')] reclama da minuciosa inspeção de um possível comprador. [Select_CString( dummy_gender.IsFemale, 'A', 'O' )] [dummy_gender.GetWomanMan] vendedor[Select_CString( dummy_gender.IsFemale, 'a', '' )] acaricia suavemente sua cabeça, de forma reconfortante."
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_06:0 "\n\nÀ minha direita, um pequeno canteiro de flores vibrantes de [ROOT.Char.Custom('get_region_flower_type_plural')] floresce, fornecendo uma encantadora mistura de cores ao [ROOT.Char.Custom('GetSquareCommons')]."
 ep3_laamp_decision_event.1000.desc_outro_returned_generic_07:0 "\n\nUm [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] repousa no topo de uma árvore [ROOT.Char.GetCurrentLocation.Custom('GetRandomAppropriateTree')], observando os apressados [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip] com olhos inteligentes."
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_01:0 "\n\n[visiting_partner.GetFirstName] me cutuca gentilmente e aponta para uma [visiting_location.Custom('GetRandomRegionalWood')] próxima — no galho mais alto, um resistente [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] está empoleirado, aproveitando o sol da tarde."
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_02:0 "\n\n[visiting_partner.GetFirstName] faz um som de admiração e aponta para um [ROOT.Char.Custom('get_region_dog_type')] sem coleira, brincando de buscar com seu dono."
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_03:0 "\n\n[visiting_partner.GetFirstName] se contorce travessamente enquanto [visiting_partner.GetSheHe] joga uma minhoca desenterrada em mim. Surpreso com a minhoca, dou um passo para trás e lanço a [visiting_partner.GetSheHe] um olhar brincalhão, mas sério."
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_04:0 "\n\n[visiting_partner.GetFirstName] faz um som de apreciação enquanto [visiting_partner.GetSheHe] inspeciona meticulosamente uma barraca cheia de entalhes religiosos em [visiting_location.Custom('GetRandomRegionalWood')]."
 ep3_laamp_decision_event.1000.desc_outro_returned_partner_generic_05:0 "\n\n[visiting_partner.GetFirstName] desaparece de vista, mas logo retorna, oferecendo-me uma prova de seu recém-adquirido [ROOT.Char.Custom('GetLocalStreetFood')]."
 ep3_laamp_decision_event.1000.desc_outro_revisit:0 "\n\nAprecio o pequeno alívio de que não mudou muito desde a última vez que visitei este lugar."
 ep3_laamp_decision_event.1000.desc_outro_revisit_constantinople:0 "\n\nTendo estado aqui antes, ainda me sinto bastante pequeno ao observar a Hagia Sophia e o Hipódromo no horizonte."
 ep3_laamp_decision_event.1000.h.tt:0 "Considerar outros pontos de interesse"
 ep3_laamp_decision_event.1000.h:0 "Eu estava pensando em outra coisa..."
 ep3_laamp_decision_event.1000.i.tt:0 "Sair de [visiting_location.GetBaronyNameExplicitlyNoTooltip]"
 ep3_laamp_decision_event.1000.i:0 "Terminei aqui. De volta ao acampamento."
 ep3_laamp_decision_event.1000.i_home:0 "Hora de voltar para casa."
 ep3_laamp_decision_event.1000.i_home_partner:0 "Vamos para casa, [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_partner'))]."
 ep3_laamp_decision_event.1000.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: a [ROOT.Char.Custom('GetMainsquareCommonsCapitalized')|U]"
 ep3_laamp_decision_event.1001.a.tt:0 "Ir para as barracas de suprimentos"
 ep3_laamp_decision_event.1001.a:0 "Os suprimentos estão por aqui."
 ep3_laamp_decision_event.1001.a_second:0 "Vamos dar mais uma olhada nesses suprimentos..."
 ep3_laamp_decision_event.1001.b.tt:0 "Ir para as barracas de artefatos"
 ep3_laamp_decision_event.1001.b:0 "Talvez eu possa vender alguns artefatos."
 ep3_laamp_decision_event.1001.b_second:0 "Na verdade, deveríamos voltar para os vendedores de artefatos."
 ep3_laamp_decision_event.1001.c.tt:0 "Procurar um contrato"
 ep3_laamp_decision_event.1001.c:0 "O [ROOT.Char.Custom('GetTowncrierElder')] pode ter algo para nós."
 ep3_laamp_decision_event.1001.c_second:0 "Eu deveria revisitar o [ROOT.Char.Custom('GetTowncrierElder')]."
 ep3_laamp_decision_event.1001.d:0 "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1001.desc:0 "Afastando-me da entrada do [ROOT.Char.Custom('SettlementCity')|l], caminho por uma trilha estreita que passa por algumas [ROOT.Char.Custom('GetCrookedhousesDelapidatedtents')] até um espaço aberto adjacente.\n\nÀ minha frente, está o caminho para os comerciantes de suprimentos e os vendedores de artefatos, e mais adiante também vejo o que parece ser um"
 ep3_laamp_decision_event.1001.desc_intro:0 "$ep3_laamp_decision_event.1001.desc$ arauto ao longe."
 ep3_laamp_decision_event.1001.desc_intro_nomads:0 "$ep3_laamp_decision_event.1001.desc$ ancião da tribo, vagando ao longe."
 ep3_laamp_decision_event.1001.desc_intro_return_finished:0 "Esta parte do [ROOT.Char.Custom('GetMainsquareCommons')] de alguma forma ficou mais fria agora, e as pessoas já voltaram para suas casas ou se mudaram para outros lugares do [ROOT.Char.Custom('SettlementCity')|l]."
 ep3_laamp_decision_event.1001.desc_intro_returned_from_artifacts:0 "Ao retornarmos dos vendedores de artefatos, outras pessoas também parecem voltar de várias partes do [ROOT.Char.Custom('SettlementCity')|l], e o fluxo de visitantes no [ROOT.Char.Custom('GetMainsquareCommons')] aumenta."
 ep3_laamp_decision_event.1001.desc_intro_returned_from_assaulting_supplies:0 "Os guardas me tratam com certa brutalidade, felizmente sem quebrar nada, quando me largam de volta no [ROOT.Char.Custom('GetMainsquareCommons')]."
 ep3_laamp_decision_event.1001.desc_intro_returned_from_contract:0 "Caminhando de volta do [ROOT.Char.Custom('GetTowncrierElder')], observo o céu por um momento antes de me encontrar novamente no [ROOT.Char.Custom('GetMainsquareCommons')]."
 ep3_laamp_decision_event.1001.desc_intro_returned_from_supplies:0 "Ao retornarmos do comerciante de suprimentos, uma brisa da tarde acompanha [ROOT.Char.GetTitle.GetNameNoTierNoTooltip] [ROOT.Char.Custom('GetMainsquareCommons')]."
 ep3_laamp_decision_event.1001.desc_intro_returned_generic_01:0 "De volta a esta parte do [ROOT.Char.Custom('GetMainsquareCommons')], há decididamente menos pessoas ao redor. Um punhado de crianças acaricia um burro, que pastava pacificamente a meio caminho do cartaz do [ROOT.Char.Custom('GetTowncrierElder')]."
 ep3_laamp_decision_event.1001.desc_intro_returned_generic_02:0 "Retornando à outra metade do [ROOT.Char.Custom('GetMainsquareCommons')], alguns cães vira-latas estão correndo, brigando por um osso de animal — de tamanho considerável."
 ep3_laamp_decision_event.1001.desc_outro_partner:0 "\n\n[visiting_partner.GetFirstName] fica para trás, mas logo alcança meu passo enquanto considero meu próximo destino."
 ep3_laamp_decision_event.1001.desc_outro_return_finished:0 "\n\nEu olho ao redor e percebo que não tenho mais negócios a cuidar neste lugar específico."
 ep3_laamp_decision_event.1001.desc_outro_return_partner_finished:0 "$ep3_laamp_decision_event.1040.desc_outro_return_partner_finished$"
 ep3_laamp_decision_event.1010.a.cooldown.tt:0 "Você tentou conseguir [provisions|E] de graça recentemente — tente novamente em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1010_has_convinced_recently') )]"
 ep3_laamp_decision_event.1010.a.failure.tt:0 "O custo das [provisions|E] aumentou em #N#! por #V [EmptyScope.ScriptValue('visit_settlement_minimum_cooldown_months')|0] meses#!"
 ep3_laamp_decision_event.1010.a_diplomacy.critical_failure:0 "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a_diplomacy.failure:0 "[laamp_supply_merchant.GetShortUIName] percebe seu desespero"
 ep3_laamp_decision_event.1010.a_diplomacy.success:0 "Você encantou com sucesso [laamp_supply_merchant.GetShortUIName]"
 ep3_laamp_decision_event.1010.a_diplomacy:0 "\"Você não teria alguns suprimentos para compartilhar, amigo...?\""
 ep3_laamp_decision_event.1010.a_intrigue.critical_failure:0 "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a_intrigue.failure:0 "Você gagueja e levanta as suspeitas de [laamp_supply_merchant.GetShortUIName]"
 ep3_laamp_decision_event.1010.a_intrigue.success:0 "Você consegue roubar um monte de suprimentos"
 ep3_laamp_decision_event.1010.a_intrigue:0 "\"Não é aquele [visiting_location.GetCounty.GetTitle.GetHolder.GetTopLiege.GetTitleAsNameNoTooltip] ali?!\""
 ep3_laamp_decision_event.1010.a_learning.critical_failure:0 "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a_learning.failure:0 "$ep3_laamp_decision_event.1010.a_stewardship.failure$"
 ep3_laamp_decision_event.1010.a_learning.success:0 "[laamp_supply_merchant.GetShortUIName] concorda em se desfazer dos suprimentos vencidos"
 ep3_laamp_decision_event.1010.a_learning:0 "\"Acho que aqueles alimentos estão começando a estragar...\""
 ep3_laamp_decision_event.1010.a_martial.critical_failure:0 "Os guardas são chamados"
 ep3_laamp_decision_event.1010.a_martial.failure:0 "[laamp_supply_merchant.GetShortUIName] vê através de suas ameaças vazias"
 ep3_laamp_decision_event.1010.a_martial.success:0 "Você intimida com sucesso [laamp_supply_merchant.GetShortUIName]"
 ep3_laamp_decision_event.1010.a_martial:0 "\"Eu posso levar os suprimentos. Ou toda a barraca. Sua escolha.\""
 ep3_laamp_decision_event.1010.a_prowess.critical_failure:0 "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a_prowess.failure:0 "$ep3_laamp_decision_event.1010.a_martial.failure$"
 ep3_laamp_decision_event.1010.a_prowess.success:0 "$ep3_laamp_decision_event.1010.a_martial.success$"
 ep3_laamp_decision_event.1010.a_stewardship.critical_failure:0 "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.a_stewardship.failure:0 "[laamp_supply_merchant.GetShortUIName] não é enganado pela sua lógica"
 ep3_laamp_decision_event.1010.a_stewardship.success:0 "Você convenceu com sucesso [laamp_supply_merchant.GetShortUIName]"
 ep3_laamp_decision_event.1010.a_stewardship:0 "\"Posso me encarregar disso para você, por uma pequena comissão.\""
 ep3_laamp_decision_event.1010.b:0 "\"Vou comprar alguns desses e alguns daqueles.\""
 ep3_laamp_decision_event.1010.c.flavor:0 "Por favor, me perdoe..."
 ep3_laamp_decision_event.1010.c.flavor_callous:0 "Pelo menos uma boca a menos para alimentar."
 ep3_laamp_decision_event.1010.c:0 "\"...talvez eu possa trocar um jovem aprendiz?\""
 ep3_laamp_decision_event.1010.c_callous:0 "\"Posso te trocar este jovem aprendiz em troca de suprimentos.\""
 ep3_laamp_decision_event.1010.d.cooldown.tt:0 "Você tentou roubar [provisions|E] recentemente — tente novamente em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1010_has_stolen_recently') )]"
 ep3_laamp_decision_event.1010.d.failure:0 "$ep3_laamp_decision_event.1010.a_martial.critical_failure$"
 ep3_laamp_decision_event.1010.d.flavor:0 "[visiting_partner.GetFirstNameNoTooltip], #EMP vai!#!"
 ep3_laamp_decision_event.1010.d.success:0 "[visiting_partner.GetShortUIName] rouba com sucesso um monte de suprimentos"
 ep3_laamp_decision_event.1010.d:0 "\"O-ho! Desculpe, sou desastrado!\""
 ep3_laamp_decision_event.1010.desc:0 "De [ROOT.Char.Custom('RegionalRootVegetablePlural')] a tecidos; lenha a linha de costura — [Select_CString( laamp_supply_merchant.IsFemale, 'a', 'o' )] comerciante de suprimentos [laamp_supply_merchant.GetFirstName] tem de tudo. A barraca está cheia até a borda com o que alguém possa precisar para uma noite na natureza.\n\nEu me aproximo um pouco mais para chamar a atenção [laamp_supply_merchant.GetHerHim], e"
 ep3_laamp_decision_event.1010.desc_generic_new_01:0 "[laamp_supply_merchant.GetSheHe] acena na minha direção: "
 ep3_laamp_decision_event.1010.desc_generic_new_02:0 "[laamp_supply_merchant.GetSheHe] me dá um olhar cúmplice: "
 ep3_laamp_decision_event.1010.desc_generic_returned_01:0 "[laamp_supply_merchant.GetSheHe] levanta uma sobrancelha divertida: "
 ep3_laamp_decision_event.1010.desc_generic_returned_02:0 "[laamp_supply_merchant.GetSheHe] olha para cima e me aborda: "
 ep3_laamp_decision_event.1010.desc_outro_new_01:0 "\"Algo chamou sua atenção?\""
 ep3_laamp_decision_event.1010.desc_outro_new_02:0 "\"Viu algo que você gostaria?\""
 ep3_laamp_decision_event.1010.desc_outro_new_03:0 "\"O que você precisa?\""
 ep3_laamp_decision_event.1010.desc_outro_returned_01:0 "\"Os suprimentos parecem bons, afinal?\""
 ep3_laamp_decision_event.1010.desc_outro_returned_02:0 "\"Eu tinha a sensação de que você voltaria.\""
 ep3_laamp_decision_event.1010.desc_outro_returned_03:0 "\"Os melhores de todos o [visiting_location.GetTitle.GetHolder.GetLiege.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
 ep3_laamp_decision_event.1010.desc_outro_sneaky_partner:0 "\n\n[visiting_partner.GetFirstName] estala seu nós e me olha, acenando discretamente na direção dos suprimentos, murmurando: \"Quer fazer uma distração...?\""
 ep3_laamp_decision_event.1010.desc_outro_sneaky_partner_returned:0 "\n\n[visiting_partner.GetFirstName] continua de olho nas mercadorias em exibição, olhando para mim em busca de qualquer sinal potencial para adquirir suprimentos para '#EMP free#!'."
 ep3_laamp_decision_event.1010.desc_outro_special_new_04:0 "\"Mundo difícil lá fora, não é? O que posso te trazer?\""
 ep3_laamp_decision_event.1010.desc_posh_stalls:0 "As barracas no distrito de alimentos de [visiting_location.GetBaronyNameExplicitly] estão transbordando de mercadorias, reduzindo os preços. Localizo a barraca do comerciante de suprimentos d[Select_CString( laamp_supply_merchant.IsFemale, 'a', 'o' )] [laamp_supply_merchant.GetFirstName]; um excelente equilíbrio entre boa qualidade e preços acessíveis.\n\nNotando meu interesse,"
 ep3_laamp_decision_event.1010.desc_returned:0 "Com a barraca ainda transbordando de itens, [Select_CString( laamp_supply_merchant.IsFemale, 'a', 'o' )] comerciante de suprimentos [laamp_supply_merchant.GetFirstName] pega um [ROOT.Char.Custom('RegionalRootVegetable')] que caiu da borda do balcão.\n\nEu levanto sutilmente as sobrancelhas para [laamp_supply_merchant.GetSheHe] para marcar meu retorno, e"
 ep3_laamp_decision_event.1010.desc_reused_merchant_01:0 "Uma visão para olhos cansados!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_02:0 "Não conseguiu se satisfazer, conseguiu!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_03:0 "Não posso acreditar!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_intro:0 "\"Um cliente retornando!"
 ep3_laamp_decision_event.1010.desc_reused_merchant_outro_01:0 "O que você está tendo?"
 ep3_laamp_decision_event.1010.desc_reused_merchant_outro_02:0 "O que você vai querer?"
 ep3_laamp_decision_event.1010.desc_reused_merchant_reaction_01:0 "[laamp_supply_merchant.GetSheHe] me examina de cima a baixo, agradavelmente surpreso:"
 ep3_laamp_decision_event.1010.desc_reused_merchant_reaction_02:0 "[laamp_supply_merchant.GetSheHe] parece genuinamente surpreso ao me ver:"
 ep3_laamp_decision_event.1010.desc_trait_callous_new:0 "[laamp_supply_merchant.GetSheHe] mal olha na minha direção enquanto me aborda: "
 ep3_laamp_decision_event.1010.desc_trait_callous_return:0 "[laamp_supply_merchant.GetSheHe] ainda mal reconhece minha presença: "
 ep3_laamp_decision_event.1010.desc_trait_eccentric_new:0 "[laamp_supply_merchant.GetSheHe] me dá um olhar vago, claramente preocupado: "
 ep3_laamp_decision_event.1010.desc_trait_eccentric_return:0 "[laamp_supply_merchant.GetSheHe] me olha, aparentemente sem perceber que já nos encontramos há poucos momentos: "
 ep3_laamp_decision_event.1010.desc_trait_greedy_new:0 "Seu rosto se ilumina com um sorriso satisfeito ao me ver: "
 ep3_laamp_decision_event.1010.desc_trait_greedy_return:0 "há um brilho nos olhos [laamp_supply_merchant.GetHerHim] enquanto [laamp_supply_merchant.GetSheHe] me examina de cima a baixo: "
 ep3_laamp_decision_event.1010.desc_trait_gregarious_new:0 "[laamp_supply_merchant.GetSheHe] brilha ao me olhar com um sorriso amigável: "
 ep3_laamp_decision_event.1010.desc_trait_gregarious_return:0 "[laamp_supply_merchant.GetSheHe] me manda outro sorriso amigável: "
 ep3_laamp_decision_event.1010.desc_trait_shy_new:0 "[laamp_supply_merchant.GetSheHe] começa a me olhar com uma intensidade que não combina com a suavidade da voz [laamp_supply_merchant.GetHerHim]: "
 ep3_laamp_decision_event.1010.desc_trait_shy_return:0 "[laamp_supply_merchant.GetSheHe] considera meu retorno com cuidado antes de dizer suavemente: "
 ep3_laamp_decision_event.1010.e:0 "Vamos voltar."
 ep3_laamp_decision_event.1010.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Suprimentos!"
 ep3_laamp_decision_event.1020.a.first_artifact.tt:0 "A #V oferta atual#! de [1020_first_artifact_to_sell.GetName]: [gold_i] [1020_first_artifact_to_sell.MakeScope.Var('1020_artifact_sell_value').GetValue|0]"
 ep3_laamp_decision_event.1020.a.second_artifact.tt:0 "A #V oferta atual#! de [1020_second_artifact_to_sell.GetName]: [gold_i] [1020_second_artifact_to_sell.MakeScope.Var('1020_artifact_sell_value').GetValue|0]"
 ep3_laamp_decision_event.1020.a.third_artifact.tt:0 "A #V oferta atual#! de [1020_third_artifact_to_sell.GetName]: [gold_i] [1020_third_artifact_to_sell.MakeScope.Var('1020_artifact_sell_value').GetValue|0]"
 ep3_laamp_decision_event.1020.a.tt:0 "Você pode escolher qual artefato vender"
 ep3_laamp_decision_event.1020.a:0 "Eu estaria disposto a me desfazer de..."
 ep3_laamp_decision_event.1020.b.cooldown.tt:0 "Você tentou negociar recentemente — tente novamente em [GetCurrentDateWithDiff( GetVarTimeRemaining( THIS.Char.MakeScope, '1020_has_haggled_recently') )]"
 ep3_laamp_decision_event.1020.b.failure.first_artifact.tt:0 "A #N oferta diminuída#! de [1020_first_artifact_to_sell.GetName]: [gold_i] [1020_first_artifact_to_sell.MakeScope.Var('1020_artifact_sell_low_value').GetValue|0]"
 ep3_laamp_decision_event.1020.b.failure.second_artifact.tt:0 "A #N oferta diminuída#! de [1020_second_artifact_to_sell.GetName]: [gold_i] [1020_second_artifact_to_sell.MakeScope.Var('1020_artifact_sell_low_value').GetValue|0]"
 ep3_laamp_decision_event.1020.b.failure.third_artifact.tt:0 "A #N oferta diminuída#! de [1020_third_artifact_to_sell.GetName]: [gold_i] [1020_third_artifact_to_sell.MakeScope.Var('1020_artifact_sell_low_value').GetValue|0]"
 ep3_laamp_decision_event.1020.b.failure:0 "[laamp_artifact_peddler.GetShortUIName] vê sua jogada"
 ep3_laamp_decision_event.1020.b.success.first_artifact.tt:0 "A #P oferta aumentada#! de [1020_first_artifact_to_sell.GetName]: [gold_i] [1020_first_artifact_to_sell.MakeScope.Var('1020_artifact_sell_high_value').GetValue|0]"
 ep3_laamp_decision_event.1020.b.success.second_artifact.tt:0 "A #P oferta aumentada#! de [1020_second_artifact_to_sell.GetName]: [gold_i] [1020_second_artifact_to_sell.MakeScope.Var('1020_artifact_sell_high_value').GetValue|0]"
 ep3_laamp_decision_event.1020.b.success.third_artifact.tt:0 "A #P oferta aumentada#! de [1020_third_artifact_to_sell.GetName]: [gold_i] [1020_third_artifact_to_sell.MakeScope.Var('1020_artifact_sell_high_value').GetValue|0]"
 ep3_laamp_decision_event.1020.b.success:0 "Você consegue convencer [laamp_artifact_peddler.GetShortUIName]"
 ep3_laamp_decision_event.1020.b:0 "\"[laamp_artifact_peddler.GetFirstNameNoTooltip], aquele comerciante ali realmente me fez uma oferta maior.\""
 ep3_laamp_decision_event.1020.c.first_artifact:0 "[visiting_partner.GetFirstName] vende o [1020_first_artifact_to_sell.GetName]"
 ep3_laamp_decision_event.1020.c.second_artifact:0 "[visiting_partner.GetFirstName] vende o [1020_second_artifact_to_sell.GetName]"
 ep3_laamp_decision_event.1020.c.third_artifact:0 "[visiting_partner.GetFirstName] vende o [1020_third_artifact_to_sell.GetName]"
 ep3_laamp_decision_event.1020.c:0 "\"[visiting_partner.GetFirstNameNoTooltip], você pode cuidar disso.\""
 ep3_laamp_decision_event.1020.d:0 "$ep3_laamp_decision_event.1010.e$"
 ep3_laamp_decision_event.1020.desc_intro_intermediate_returned_01:0 "Ainda ponderando minhas opções, [laamp_artifact_peddler.GetFirstName] me lança um olhar indiferente e solta um: \"Minha oferta ainda está de pé,\" com uma voz monótona.\n\nEntão [laamp_artifact_peddler.GetSheHe] se vira despreocupadamente para sua barraca e começa a rearranjar as mercadorias."
 ep3_laamp_decision_event.1020.desc_intro_intermediate_returned_02:0 "Enquanto hesito um pouco, [laamp_artifact_peddler.GetFirstName] parece um pouco irritado com minha indecisão.\n\n[laamp_artifact_peddler.GetSheHe|U] dá de ombros com um \"Leve todo o tempo que precisar, eu acho,\" e vai ajudar outro cliente."
 ep3_laamp_decision_event.1020.desc_intro_new_01:0 "Olhando ao redor em busca de alguém para pegar alguns itens das minhas mãos; o vendedor de artefatos [laamp_artifact_peddler.GetFirstName] aparece para olhar meu inventário."
 ep3_laamp_decision_event.1020.desc_intro_new_02:0 "O beco repleto de barracas, meu ombro esbarra acidentalmente em alguém por trás. Quando o vendedor de artefatos [laamp_artifact_peddler.GetFirstName] se vira para me confrontar, [laamp_artifact_peddler.GetSheHe] nota meu inventário e se inclina para uma inspeção mais de perto."
 ep3_laamp_decision_event.1020.desc_intro_posh_stalls:0 "O distrito comercial de [visiting_location.GetBaronyNameExplicitly] transborda com vendedores e compradores de artefatos raros e exóticos, e não tenho dificuldade em localizar o renomado vendedor de artefatos [laamp_artifact_peddler.GetFirstName]."
 ep3_laamp_decision_event.1020.desc_intro_returned_01:0 "Voltando para os vendedores de artefatos, [laamp_artifact_peddler.GetFirstName] me observa curiosamente ao meu retorno às barracas de artefatos: \"Minha oferta ainda está de pé.\"\n\nEntão [laamp_artifact_peddler.GetSheHe] se vira para sua barraca e começa a rearranjar as mercadorias."
 ep3_laamp_decision_event.1020.desc_intro_returned_02:0 "Retornando aos vendedores de artefatos, a barraca de [laamp_artifact_peddler.GetFirstName] ainda se destaca na multidão pela sua abundância e variedade de alta qualidade.\n\n[laamp_artifact_peddler.GetSheHe|U] me nota e pausa por um momento, então diz: \"Temos um acordo, então?\""
 ep3_laamp_decision_event.1020.desc_intro_reused_peddler:0 "Uma voz se destaca no burburinho das barracas de artefatos: \"Sempre aprecio um cliente que volta!\" [laamp_artifact_peddler.GetFirstName] exclama, enquanto [laamp_artifact_peddler.GetSheHe] se aproxima para olhar meu inventário."
 ep3_laamp_decision_event.1020.desc_one_artifact_new_01:0 "\n\nCom um toque experiente, [laamp_artifact_peddler.GetSheHe] examina a superfície do meu [1020_first_artifact_to_sell.GetName], então acena com a cabeça e murmura algo para [laamp_artifact_peddler.GetHerselfHimself]."
 ep3_laamp_decision_event.1020.desc_one_artifact_new_02:0 "\n\n[laamp_artifact_peddler.GetSheHe|U] gentilmente toca a superfície de [1020_first_artifact_to_sell.GetName], depois inclina a cabeça, como se estivesse ouvindo algo. Então [laamp_artifact_peddler.GetSheHe] acena com a cabeça."
 ep3_laamp_decision_event.1020.desc_outraged_partner_new:0 "\n\nDe repente, posso ouvir a voz indignada de [Select_CString( visiting_partner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('visiting_partner'))], [visiting_partner.GetFirstName], em meu ouvido: \"Você está sendo enganado! #EMP Eu#! posso conseguir uma oferta melhor!\""
 ep3_laamp_decision_event.1020.desc_outraged_partner_returned:0 "\n\nPelo canto do olho, noto [visiting_partner.GetFirstName], ainda furioso com as ofertas baratas de [laamp_artifact_peddler.GetFirstNameNoTooltip]."
 ep3_laamp_decision_event.1020.desc_three_artifacts_new_01:0 "\n\nExaminando, torcendo e virando; [laamp_artifact_peddler.GetSheHe] analisa cada detalhe — seja o acabamento de [1020_first_artifact_to_sell.GetName], os materiais de [1020_second_artifact_to_sell.GetName] ou a decoração de [1020_third_artifact_to_sell.GetName]."
 ep3_laamp_decision_event.1020.desc_three_artifacts_new_02:0 "\n\n[laamp_artifact_peddler.GetSheHe|U] já inspecionou completamente [1020_first_artifact_to_sell.GetName] e [1020_second_artifact_to_sell.GetName], antes que eu percebesse. As mãos [laamp_artifact_peddler.GetHerHim|U] se movem rapidamente pela superfície de [1020_third_artifact_to_sell.GetName], procurando por falhas."
 ep3_laamp_decision_event.1020.desc_two_artifacts_new_01:0 "\n\n[laamp_artifact_peddler.GetSheHe|U] passa os dedos sobre [1020_first_artifact_to_sell.GetName] e seus olhos ganham uma expressão intrigada ao notar o [1020_second_artifact_to_sell.GetName]."
 ep3_laamp_decision_event.1020.desc_two_artifacts_new_02:0 "\n\n[laamp_artifact_peddler.GetSheHe|U] começa a fazer movimentos de pinça em [1020_first_artifact_to_sell.GetName], considerando cuidadosamente o [1020_first_artifact_to_sell.Custom('ArtifactType')], então [laamp_artifact_peddler.GetSheHe] inspeciona gentilmente o [1020_second_artifact_to_sell.GetName], parecendo satisfeito com algo."
 ep3_laamp_decision_event.1020.eagle.price_tt:0 "A #V oferta atual#! pela águia: [gold_i] [GetPlayer.MakeScope.ScriptValue('hunting_eagle_sell_value')|0]"
 ep3_laamp_decision_event.1020.eagle.tt:0 "Você vende sua águia de caça, no lugar de um artefato"
 ep3_laamp_decision_event.1020.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Sem Perguntas"
 ep3_laamp_decision_event.1021.a:0 "\"[1020_first_artifact_to_sell.GetNameNoTooltip] nunca me fez bem.\""
 ep3_laamp_decision_event.1021.b:0 "\"Eu tenho um uso melhor para ouro. Leve [1020_second_artifact_to_sell.GetNameNoTooltip].\""
 ep3_laamp_decision_event.1021.c:0 "\"Você pode ficar com meu [1020_third_artifact_to_sell.GetNameNoTooltip].\""
 ep3_laamp_decision_event.1021.d:0 "Pensando melhor..."
 ep3_laamp_decision_event.1021.desc_failure:0 "[laamp_artifact_peddler.GetFirstName] dá uma risada e sua boca se transforma em um sorriso desdenhoso: \"Não seja ridículo. Minha oferta continua a mesma.\""
 ep3_laamp_decision_event.1021.desc_moment_of_purchase_01:0 "[laamp_artifact_peddler.GetFirstName] olha para mim com expectativa, aparentemente satisfeito com minha decisão: \"Qual item você gostaria de se desfazer?\""
 ep3_laamp_decision_event.1021.desc_moment_of_purchase_02:0 "[laamp_artifact_peddler.GetFirstName] me dá um aceno encorajador: \"Eu tenho a moeda. Quais mercadorias você estaria vendendo?\""
 ep3_laamp_decision_event.1021.desc_success:0 "[laamp_artifact_peddler.GetFirstName] me olha com um olhar contemplativo: \"...é mesmo? Bem, então. Para mercadorias tão valiosas, talvez eu possa liberar mais uma moeda ou duas.\""
 ep3_laamp_decision_event.1021.eagle:0 "Talvez você se interesse por [ROOT.Char.Custom('EagleStoryName')]?"
 ep3_laamp_decision_event.1021.t:0 "[visiting_location.GetBaronyNameExplicitlyNoTooltip]: Hora de Despedida"
