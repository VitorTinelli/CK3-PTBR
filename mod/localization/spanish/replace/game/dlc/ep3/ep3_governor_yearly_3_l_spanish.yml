l_spanish:
 AUGOUSTOS_GLOSS:0 "Um honorífico que significa 'venerável' ou 'majestoso', concedido aos sucessores do primeiro imperador de Roma. No século 7, o título grego Basileus o substituiu em importância imperial."
 AUTOKRATOR_GLOSS:0 "Um título grego clássico que se refere a alguém que comanda sem superiores, revivido no período bizantino médio para uso por imperadores seniores."
 CHORITAI_GLOSS:0 "#bold Choritai#! é o termo em Grego Antigo para aqueles que pertencem a uma comunidade de vilarejo, um #EMP chorion#!."
 ESHI_DZAG_GLOSS:0 "#bold Eshi dzag#! é um insulto armênio que significa 'filho de um burro.'"
 METROKOITES_GLOSS:0 "#bold Metrokoites#! é um insulto grego que descreve 'aquele que dorme com a própria mãe.'"
 MODIFIER_DEFINITION_VALUE_BASED_ON_ADMIN_RAID_COUNT:0 " \t#weak Aumento por Incursão de Pilhagem#!"
 access_to_admin_raid_tooltip:0 "Desbloqueia o [casus_belli|E] #high $ep3_pillaging_foray$#!, usado para hostilizar [realms|E] vizinhos"
 admin_coronation_still_req_tt:0 "[emperor.GetShortUIName] conquistou [emperor.GetPrimaryTitle.GetName], mas mantém a [law_i][law|E] [GetLaw('uncrowned').GetName] até que [emperor.GetSheHe] realize uma [coronation|E]"
 admin_raid_gives_modifier_tooltip:0 "#weak Esta [war|E] dá e melhora o [modifier|E] [GetModifier( 'ep3_loyal_troops_raid_modifier' ).GetNameWithTooltip]#!"
 boosted_by_sycophant_score_desc:0 "Apoiado pelos Admiradores da [house|E]"
 can_construct_solar_tooltip:0 "Desbloqueia a Construção de [estate|E] #high [GetDomicileBuilding('grand_solar_01').GetName]#!"
 contented_distant_governor:0 "Contente com a obscuridade"
 contented_governing_countrymen_modifier:0 "Compatriotas Governando Contentes"
 contented_governing_countrymen_modifier_desc:0 "Representar oficialmente o seu povo é um dever que este personagem aprecia."
 contented_governing_countrymen_modifier_tooltip:0 "#weak [governor_efficiency|E] ao governar [provinces|E] da mesma [culture|E]: @governor_efficiency!#P +10%#!#!"
 cultural_acceptance_gain_content_governor:0 "[governadores|E] administrando contentes"
 custom.every_house_member:0 "Cada membro da [house|E]"
 custom.every_house_member_emperor:0 "Cada membro da [house|E] [emperor.GetHouse.GetName]"
 custom.every_realm_vassal_local_estate:0 "Cada [vassal|E] colega cuja [domicile|E] está em seu [domain|E]"
 custom.every_sub_realm_county:0 "Cada [county|E] em seu [realm|E]"
 custom.every_vassal_same_domicile_location:0 "Cada [vassal|E] colega compartilhando sua localização [domicile|E]"
 decried_weakness_score_desc:0 "Fraqueza Imperial Deplorada"
 diverging_culture_discount_tooltip:0 "Custo de [diverge|E] da [culture|E]: #P -33%#!"
 domicile_move_to_province.tt:0 "Você move seu [domicile|E] para [liege.GetCapitalLocation.GetTitle.GetNameNoTier]"
 emperor_repented_for_flaws_modifier:0 "Arrependido pelas Falhas Imperiais"
 emperor_repented_for_flaws_modifier_desc:0 "Embora este personagem não seja totalmente digno de um alto cargo, ele se esforçou publicamente para se absolver disso."
 ep3_anxious_for_new_assignment_desc:0 "#weak [governor_efficiency|E]: #N -5%#!#!"
 ep3_anxious_for_new_assignment_modifier:0 "Ansioso por Nova Designação"
 ep3_anxious_for_new_assignment_modifier_desc:0 "Um poderoso desejo de fama, influência — qualquer coisa menos a imundície da governança — define este oficial.\n[governor_efficiency|E]: @governor_efficiency!#N -5%#!"
 ep3_anxious_for_new_assignment_tooltip:0 "Você perde #N -5%#! [governor_efficiency|E] por #high 5 anos#!"
 ep3_cosmopolitan_domicile_modifier:0 "Propriedade Cosmopolita"
 ep3_cosmopolitan_domicile_modifier_desc:0 "A propriedade desta família é um centro de influência política e fiscal."
 ep3_emperor_yearly.3011.a_no_war:0 "Eu desejava #EMP apenas#! servir ao nosso [emperor.GetTitleAsNameNoTooltip]..."
 ep3_emperor_yearly.3011.a_to_war:0 "Um oficial [emperor.GetPrimaryTitle.GetAdjectiveNoTooltip] entra na luta!"
 ep3_exploited_weak_master_modifier:0 "Soberano Enfraquecido Explorado"
 ep3_exploited_weak_master_modifier_desc:0 "Enquanto seu senhor feudal estava envolvido na guerra, este governador desviou fundos e reorganizou o governo local para fins egoístas."
 ep3_face_of_empire_modifier:0 "Braço da Administração"
 ep3_face_of_empire_modifier_desc:0 "Usando a força da devoção deste personagem, o reino se estende além de seu núcleo obediente."
 ep3_following_governorship_example_tooltip:0 "Cada [vassal|E] de [liege.GetShortUIName] ganha #high 10#! [trait_level_track_xp|E] no [trait|E] [GetTrait('governor').GetName( root_scope )]"
 ep3_governor_ignored_isolation_removal_tooltip:0 "Sua [governor_efficiency|E] foi #P restaurada#!"
 ep3_governor_ignored_isolation_tooltip:0 "Você perdeu #N -5%#! [governor_efficiency|E] por #high 5 anos#!"
 ep3_governor_yearly.3000_governance_loss:0 "Sua [governor_efficiency|E] diminui em #N 10#! por #alta 10 anos#!"
 ep3_governor_yearly.3000_major_governance_loss:0 "Sua [governor_efficiency|E] diminui em #N 15#! por #alta 10 anos#!"
 ep3_governor_yearly.3000_miniscule_governance_loss:0 "Sua [governor_efficiency|E] diminui em #N 5#! por #alta 10 anos#!"
 ep3_governor_yearly.3001.a.flavor:0 "Esta administração inútil não vai notar minhas novas propriedades até a época de impostos!"
 ep3_governor_yearly.3001.a:0 "Eu conseguiria comprar metade do [target_theme.GetTierAsNameNoTooltip]!"
 ep3_governor_yearly.3001.a_failure:0 "Você logo se vê envolvido em escândalo"
 ep3_governor_yearly.3001.a_govs_low:0 "Esta opção está disponível devido à [governor_efficiency|E] muito baixa de [governor.GetShortUIName]"
 ep3_governor_yearly.3001.a_success:0 "\"Eu? O maior senhor de terras ao redor?\""
 ep3_governor_yearly.3001.b.flavor:0 "Tenho dinheiro para gastar — por que não adquirir mais terras lucrativas?"
 ep3_governor_yearly.3001.b:0 "Melhor eu prosperar um pouco do que algum tolo [governor.GetTitleAsNameNoTooltip]."
 ep3_governor_yearly.3001.b_gov_response:0 "@warning_icon! #X [governor.GetShortUIName] pode puni-lo!#!"
 ep3_governor_yearly.3001.b_miniscule_influence_loss:0 "Você gasta #N 35#! #high Influence#!"
 ep3_governor_yearly.3001.c.flavor:0 "Meus avisos poderiam ajudar a impedir outros proprietários de terras... e provar meu valor."
 ep3_governor_yearly.3001.c:0 "Em vez disso... eu poderia oferecer minha ajuda ao [governor.GetTitleAsNameNoTooltip]."
 ep3_governor_yearly.3001.c_gain_influence:0 "Você ganha #P 75#! #high Influence#!"
 ep3_governor_yearly.3001.c_gov_gain:0 "[governor_efficiency|E] de [governor.GetShortUIName] aumenta em #P 5#!"
 ep3_governor_yearly.3001.desc:0 "mal sabem se as leis [governor.GetHerHim] os protegem de serem comprados! Os contribuintes [Select_CString( governor.IsFemale, 'da', 'do' )] [governor.GetTitledFirstNameNoTooltip] poderiam #EMP tão#! facilmente se tornarem meus locatários...\n\n"
 ep3_governor_yearly.3001.desc_camel_pasture:0 "Meus barulhentos, fedorentos, #EMP lucrativos#! rebanhos de camelos corpulentos — são apenas um começo?"
 ep3_governor_yearly.3001.desc_christian:0 "Àqueles que ganham a recompensa, Deus concede prosperidade. A terra de um preguiçoso está coberta de mato, mas minha propriedade em [root_domicile_province.GetTitle.GetNameNoTier] — a terra de comida trazida à minha despensa, de aluguéis pagos ao meu nome — agora se estende até o horizonte."
 ep3_governor_yearly.3001.desc_garden:0 "Meus jardins recém-fechados — são apenas um começo?"
 ep3_governor_yearly.3001.desc_garden_fruit:0 "Meus jardins recentemente ampliados, perfumados por frutas amadurecendo — são apenas um começo?"
 ep3_governor_yearly.3001.desc_garden_leisure:0 "Meus jardins recentemente ampliados, ricos com belas [root_domicile_province.Custom('get_region_flower_type_plural')] — são apenas um começo?"
 ep3_governor_yearly.3001.desc_grain_field:0 "Meus campos de grãos recentemente arados — são apenas um começo?"
 ep3_governor_yearly.3001.desc_grazing_land:0 "Meus direitos habilmente negociados para novas terras de pastagem — são apenas um começo?"
 ep3_governor_yearly.3001.desc_greek:0 "[Glossary( 'choritai', 'CHORITAI_GLOSS' )]"
 ep3_governor_yearly.3001.desc_horse_pasture:0 "Meus recém-assinados direitos sobre ricas pastagens de cavalos — são apenas um começo?"
 ep3_governor_yearly.3001.desc_mid:0 "\n\nEnquanto isso, o [governor.GetTitleAsName] local governa sobre mato e confusão. [target_theme.GetNameNoTier]"
 ep3_governor_yearly.3001.desc_non_greek:0 "pequenos proprietários"
 ep3_governor_yearly.3001.desc_olive:0 "Meus olivais recém-comprados, com suas preciosas e enrugadas árvores — são apenas um começo?"
 ep3_governor_yearly.3001.desc_other:0 "Como a terra floresce! Como as despensas estão cheias! Ao redor da minha propriedade em [root_domicile_province.GetTitle.GetNameNoTier], investi caro na produção local e agora, abençoado, muitas famílias trabalhadoras pagam aluguel para mim."
 ep3_governor_yearly.3001.desc_silk:0 "Meus novos bosques de amoreiras produtoras de seda — são apenas um começo?"
 ep3_governor_yearly.3001.desc_tea:0 "Minhas fileiras crescentes de arbustos verdejantes de chá — seriam apenas o começo?"
 ep3_governor_yearly.3001.desc_vineyard:0 "As intermináveis fileiras dos treliças frondosas das minhas novas vinhas — são apenas um começo?"
 ep3_governor_yearly.3001.minor_influence_loss:0 "Você gasta #N 75#! #high Influence#!"
 ep3_governor_yearly.3001.t:0 "Construtor, Comprador, Proprietário de Terras"
 ep3_governor_yearly.3002.a.flavor:0 "\"Terras #EMP roubadas#! de pobres #EMP inocentes#!? Brutalidade, intimidação?\" Sim, acho que é isso que ouço as testemunhas dizendo..."
 ep3_governor_yearly.3002.a:0 "O pequeno proprietário quer brincar com #EMPigo#!...?"
 ep3_governor_yearly.3002.a_medium_influence_loss:0 "Você gasta #N 150#! #alta Influência#!"
 ep3_governor_yearly.3002.b.flavor:0 "Os tolos comuns servirão à ponta da espada! Agora eles pagam o dobro de senhores."
 ep3_governor_yearly.3002.b:0 "\"Force-os a se apresentar! Force-os a pagar!\""
 ep3_governor_yearly.3002.b_miniscule_influence_gain:0 "Você ganha #P 35#! #alta Influência#!"
 ep3_governor_yearly.3002.b_minor_influence_loss_landlord:0 "[landlord.GetShortUIName] gasta #N 75#! #alta Influência#!"
 ep3_governor_yearly.3002.c.flavor:0 "Fazer um escândalo dessa avareza prova que sou um governador ativo e competente de [target_theme.GetNameNoTierNoTooltip]! De certo modo..."
 ep3_governor_yearly.3002.c:0 "É meu dever denunciar isso!"
 ep3_governor_yearly.3002.d.flavor:0 "Pelo menos alguém nesta [target_theme.GetTierAsNameNoTooltip] ficará feliz..."
 ep3_governor_yearly.3002.d:0 "\"Envie os meus parabéns aos [landlord.GetDynastyHouseNameNoTooltip]...\""
 ep3_governor_yearly.3002.desc:0 "\"Olhe — olhe, lá nos registros!\" exclama [tax_farmer.GetName].\n\n\"Mais uma vila cujos impostos eu coletei, em seu nome, desde que comprei meu contrato! E agora — eles referem os agricultores fiscais a [landlord.GetName], seu novo senhorio! E [landlord.GetSheHe] paga uma ninharia.\"\n\n\"Isso"
 ep3_governor_yearly.3002.desc_mid:0 "mentiu para esses rústicos sobre suas proteções: [landlord.GetSheHe] está comprando"
 ep3_governor_yearly.3002.desc_outro:0 "das pastagens locais. Pense, ó [ROOT.Char.GetTitleAsNameNoTooltip]... nos impostos perdidos, nas milícias perdidas..."
 ep3_governor_yearly.3002.t:0 "Contribuintes para Inquilinos"
 ep3_governor_yearly.3002_half_duchy:0 "tantas, #EMP tantas#!"
 ep3_governor_yearly.3002_insult_armenian:0 "[Glossary( 'eshi dzag', 'ESHI_DZAG_GLOSS' )]"
 ep3_governor_yearly.3002_insult_generic:0 "[landlord.Custom2('InsultNoun', SCOPE.sC('tax_farmer'))]"
 ep3_governor_yearly.3002_insult_greek:0 "[Glossary( 'metrokoites', 'METROKOITES_GLOSS' )]"
 ep3_governor_yearly.3002_some_of_duchy:0 "muitas"
 ep3_governor_yearly.3003.a_accused_of_crime:0 "Acusações falsas! E ainda assim — #EMP eles vieram pelas minhas terras?!?#!"
 ep3_governor_yearly.3003.a_backs_down:0 "O [governor.GetTitleAsNameNoTooltip] recua! Tudo está seguramente sob meu controle."
 ep3_governor_yearly.3003.a_force_used:0 "Isso vai enfurecer meus inquilinos! Isso os empobrecerá!"
 ep3_governor_yearly.3003.a_scandal:0 "[governor.GetSheHe|U] pode prejudicar minha reputação... mas não minhas propriedades!"
 ep3_governor_yearly.3003.desc_accused_of_crime:0 "Estou horrorizado ao saber que você está aterrorizando pequenos proprietários inocentes! Minhas #EMP muitas#! testemunhas dizem que você — entre outros erros — mandou crianças cuspirem em viúvas? Roubou cães? Derramou água pelas chaminés? E tudo isso só para comprar algumas pastagens ressecadas!\n\nSua violação da lei foi, infelizmente, notada e tornada pública... Temo que você possa ouvir mais sobre isso."
 ep3_governor_yearly.3003.desc_backs_down:0 "Parabenizo você por suas novas aquisições! Belas vilas com gente sensata — é um bom país que você possui!\n\nSim, alguns podem reclamar sobre antigas leis feitas para limitá-lo: eles torcem as mãos sobre o futuro de [root_domicile_province.GetTitle.GetNameNoTier]... mas a sua, uma mão sábia e firme, é a melhor para brandir o cetro!"
 ep3_governor_yearly.3003.desc_force_used:0 "Fale com seus novos inquilinos. Diga a eles que seus impostos sobre a terra ainda são devidos, seu serviço em guerra ainda é obrigatório. Quando meus soldados chegarem, não os impeça.\n\nA lei diz que agora você é proprietário das terras. As pessoas, no entanto, são #EMP minhas#!."
 ep3_governor_yearly.3003.desc_scandal:0 "Você pode pensar que sou um incompetente, que não tenho quase nenhuma preocupação com o bem-estar de [target_theme.GetNameNoTier], mas é #EMP você#! quem desafia a tradição para chamar tanto disso de seu — que vergonha!\n\nVocê verá que sua avareza se tornou um assunto favorito de conversa em [governor.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]. Infelizmente, isso é bem merecido."
 ep3_governor_yearly.3003.t:0 "[landlord.GetNameNoTooltip],"
 ep3_governor_yearly.3010.a.fail:0 "O [emperor.GetTitleAsNameNoTooltip] não está interessado"
 ep3_governor_yearly.3010.a.flavor:0 "E um soldado leal e generoso não deve esperar sentir o calor da estima de seu comandante...?"
 ep3_governor_yearly.3010.a.success:0 "O [emperor.GetTitleAsNameNoTooltip] aceita sua ajuda"
 ep3_governor_yearly.3010.a:0 "Marcharei para a frente, soldado leal que sou!"
 ep3_governor_yearly.3010.b.flavor:0 "O reino não deveria buscar um mestre que não vacila e fracassa?"
 ep3_governor_yearly.3010.b:0 "Um #EMP governante forte#! poderia ter acabado com isso."
 ep3_governor_yearly.3010.c.flavor:0 "...e tão suscetíveis às minhas maquinações."
 ep3_governor_yearly.3010.c:0 "As províncias estão tão distantes dos pensamentos do [emperor.GetTitleAsNameNoTooltip]..."
 ep3_governor_yearly.3010.d:0 "Uma doação piedosa, uma oração em nome [emperor.GetHerHim]."
 ep3_governor_yearly.3010.desc:0 "Há anos, as forças [Select_CString( emperor.IsFemale, 'da', 'do' )] [emperor.GetTitledFirstName] têm"
 ep3_governor_yearly.3010.desc_attacker:0 "travado uma [war.Custom('WarCasusBelliShort')] contra [foe.GetName].\n\nNas províncias, ouvimos contos de cercos tensos, de batalhas incertas lutadas até finais confusos e sangrentos... debatemos sonhos de conquistas estrangeiras, os sonhos que nosso [emperor.GetTitleAsNameNoTooltip] persegue."
 ep3_governor_yearly.3010.desc_defender:0 "defendido contra a [war.Custom('WarCasusBelliShort')] de [foe.GetName].\n\nNas províncias, ouvimos contos de cercos tensos, de batalhas incertas lutadas até finais confusos e sangrentos... sussurramos sobre o ataque do inimigo e nos preocupamos com os subjugados e os mortos."
 ep3_governor_yearly.3010.desc_losing:0 "\n\n[ROOT.Char.GetFaith.HighGodName] não favoreceu o [emperor.GetTitleAsNameNoTooltip]. Por todos os relatos, os exércitos [emperor.GetHerHim] flertam com a derrota."
 ep3_governor_yearly.3010.desc_mid:0 "A fé do povo vacila."
 ep3_governor_yearly.3010.desc_middling:0 "\n\nO favor de [ROOT.Char.GetFaith.HighGodName] continua elusivo: não há fim à vista para a luta."
 ep3_governor_yearly.3010.desc_winning:0 "\n\nSim, por todos os relatos, a luta vai bem... mas por [ROOT.Char.GetFaith.HighGodName] é o progresso lento de [emperor.GetTitleAsNameNoTooltip]!"
 ep3_governor_yearly.3010.t:0 "Ainda assim, o [emperor.GetTitleAsNameNoTooltip] Luta"
 ep3_governor_yearly.3011.a:0 "Qualquer coisa para ver meus inimigos derrotados de uma vez por todas!"
 ep3_governor_yearly.3011.b:0 "[governor.GetTitledFirstNameNoTooltip] dificilmente é um aliado que vale a pena ter..."
 ep3_governor_yearly.3011.desc:0 "Nossos exércitos lutam há muito contra [foe.GetName], e ainda não temos nenhum triunfo para proclamar.\n\nSe eu emprestar minhas tropas domésticas, meus fundos pessoais, à sua causa - tal serviço leal seria devidamente apreciado?"
 ep3_governor_yearly.3011.opening:0 "Meu suserano, eminentíssimo [emperor.GetTitleAsName],"
 ep3_governor_yearly.3012.desc_fail:0 "Deixando de lado os termos absurdos de sua oferta - sua força armada não é tão urgentemente necessária.\n\nVocê ainda pode sonhar em se juntar ao seu [emperor.GetTitleAsName] no tumulto da guerra, mas se a ambição é seu único guia, é melhor saborear a doce música de seu idílio pacífico."
 ep3_governor_yearly.3012.desc_success:0 "Aceito sua oferta. Aguardamos o novo vigor de seus soldados na cansada linha de batalha.\n\nPor sua coragem, sua generosidade de espírito, sua constância, poucas recompensas terrenas são iguais."
 ep3_governor_yearly.3012.kyrie_eleison:0 "[Glossary( 'Kýrie, eléison!', 'KYRIE_ELEISON_GLOSS' )]"
 ep3_governor_yearly.3012.opening:0 "Ó valoroso ministro de [ROOT.Char.GetPrimaryTitle.GetNameNoTier],"
 ep3_governor_yearly.3020.a.fail:0 "Suas farpas não intrigam ninguém"
 ep3_governor_yearly.3020.a.flavor:0 "E todos os sussurros de indignidade imperial devem voltar para mim."
 ep3_governor_yearly.3020.a.success:0 "Os fofoqueiros prestam atenção ao seu discurso virulento"
 ep3_governor_yearly.3020.a:0 "A desobediência cresce melhor no escuro..."
 ep3_governor_yearly.3020.b:0 "Devo escrever uma carta de condenação!"
 ep3_governor_yearly.3020.c:0 "Trabalhos diligentes me impedirão de pensar nisso."
 ep3_governor_yearly.3020.desc:0 "O [target_trait.GetNameNoTooltip( GetNullCharacter )|l] [emperor.GetTitleAsName] que nos governa é frequentemente objeto de conversas sussurradas."
 ep3_governor_yearly.3020.desc_crime:0 "\n\nSomos realmente o reino mais abençoado, governados por um criminoso vil - um pecador que desafia os preceitos de [ROOT.Char.GetFaith.HighGodNameAlternate]? Quantas mais de nossas leis serão escritas por mãos manchadas?\n\nNosso mestre [target_trait.GetNameNoTooltip( GetNullCharacter )|l], sentado no trono elevado — #EMP uma completa indignidade#! Um[Select_CString( emperor.IsFemale, 'a', '' )] [emperor.GetWomanMan] mais humilde há muito teria sido executado..."
 ep3_governor_yearly.3020.desc_physical:0 "\n\nNosso reino pode permanecer inteiro enquanto sua manifestação na carne é [emperor.GetHerselfHimself] malformada? Será que a imagem arruinada [Select_CString( emperor.IsFemale, 'da', 'do' )] [emperor.GetTitledFirstNameNoTooltip] será cunhada em novas moedas? E — teme-se pensar nisso — os suseranos escolhidos por [ROOT.Char.GetFaith.HighGodNameAlternate] serão, daqui em diante, miseráveis aleijados?\n\nNão, este [target_trait.GetNameNoTooltip( GetNullCharacter )|l] [emperor.GetTitleAsName] dificilmente é digno da púrpura..."
 ep3_governor_yearly.3020.flavor:0 "Pois esta marca do desagrado de [ROOT.Char.GetFaith.HighGodNameAlternate] é uma mancha não só sobre o [emperor.GetTitleAsNameNoTooltip], mas sobre todo o reino!"
 ep3_governor_yearly.3020.t:0 "[ROOT.Char.GetFaith.HighGodName] Nomeou... [emperor.GetSheHe|U]?"
 ep3_governor_yearly.3021.a.flavor:0 "Por um tempo, pelo menos, os piedosos podem me perdoar e deixar isso escapar de suas mentes..."
 ep3_governor_yearly.3021.a:0 "Imperfeito como sou, juro lutar pelo meu povo."
 ep3_governor_yearly.3021.b:0 "Impertinência!"
 ep3_governor_yearly.3021.bad_trait:0 "@warning_icon! #X Isso aconteceu por causa do seu [trait|E] [target_trait.GetName( GetNullCharacter )]#!"
 ep3_governor_yearly.3021.blocker:0 "Você não receberá este evento por pelo menos #high 10 anos#!"
 ep3_governor_yearly.3021.desc_crime:0 "Por sua natureza pecaminosa, temo que seu domínio esteja em perigo. [target_trait.GetNameNoTooltip( GetNullCharacter )] [emperor.GetTitleAsNameNoTooltip] — insto você, perante todo o reino, a buscar a absolvição de [minister.GetFaith.HighGodNameAlternate].\n\nQuanto tempo uma alma pode suportar a podridão do pecado? E quanto tempo nós, potentados, podemos suportar a mancha de seus atos?"
 ep3_governor_yearly.3021.desc_physical:0 "Você sabe bem que nós [minister.GetCulture.GetCollectiveNoun] ficamos aterrorizados quando um corpo marcado ocupa o trono do suserano perfeito de [minister.GetFaith.HighGodName].\n\nDevo instar você, nosso [target_trait.GetNameNoTooltip( GetNullCharacter )|l] [emperor.GetTitleAsNameNoTooltip], a implorar pela proteção de [minister.GetFaith.HighGodNameAlternate]! Somente pela misericórdia divina podemos sobreviver a esses tempos antinaturais."
 ep3_governor_yearly.3021.opening:0 "Meu [emperor.GetTitleAsNameNoTooltip],"
 ep3_governor_yearly.3030.a.flavor:0 "Aventurar-se além da fronteira, com aço na mão — isso despertará minhas tropas!"
 ep3_governor_yearly.3030.a:0 "O idílio pacífico nos tornou #EMP fracos!#!"
 ep3_governor_yearly.3030.b:0 "Não planejo para a guerra, mas para a prosperidade."
 ep3_governor_yearly.3030.c:0 "Esta vida confortável é melhor saboreada com a família."
 ep3_governor_yearly.3030.desc:0 "O gado engorda nos campos. Os jovens, despreocupados com deveres marciais, se bronzeiam na grama. Em nossas cidades felizes, os comerciantes operam livremente e os ministros cuidam dos assuntos de melhoria pública.\n\nSerá que meu governo e o [Select_CString( emperor.IsFemale, 'da', 'do' )] [emperor.GetTitledFirstName] não conhecerão grandes e gloriosos feitos? Apenas este... contentamento?"
 ep3_governor_yearly.3030.desc_christian:0 "\"Bem-aventurados os pacificadores!\" escreveu São Mateus, e nisso certamente passou a verdade do Senhor.\n\nHá anos, [emperor.GetPrimaryTitle.GetDefinitiveName] e meu [ROOT.Char.GetPrimaryTitle.GetNameNoTier] conhecem a paz de Cristo."
 ep3_governor_yearly.3030.desc_generic:0 "Há anos, [emperor.GetPrimaryTitle.GetDefinitiveName] e meu [ROOT.Char.GetPrimaryTitle.GetNameNoTier] conhecem a paz.\n\n"
 ep3_governor_yearly.3030.t:0 "Tempos Tranquilos"
 ep3_governor_yearly.3040.a.flavor:0 "Tal piedade filial só poderia nos fortalecer ambos."
 ep3_governor_yearly.3040.a:0 "Devo entrelaçar minha família com os augustos parentes [emperor.GetHerHim]!"
 ep3_governor_yearly.3040.b.flavor:0 "...mas os aspirantes da Casa [emperor.GetHouse.GetNameNoTooltip] são bastante mais precários."
 ep3_governor_yearly.3040.b:0 "O poderoso [emperor.GetTitleAsNameNoTooltip] pode não precisar da minha ajuda..."
 ep3_governor_yearly.3040.c.flavor:0 "Não dependa da força de meu senhor feudal, mas de tropas robustas e vigor local!"
 ep3_governor_yearly.3040.c:0 "#EMP Eu#! devo ser tão imutável."
 ep3_governor_yearly.3040.d.flavor:0 "E eu os alistarei com prazer."
 ep3_governor_yearly.3040.d:0 "Os recrutas clamam para lutar em nome [emperor.GetHerHim]!"
 ep3_governor_yearly.3040.desc:0 "Comecei a lutar para lembrar — era [emperor.GetPrimaryTitle.GetName] realmente apenas escuridão e desordem antes que [Select_CString( emperor.IsFemale, 'a', 'o' )] nobre [emperor.GetTitledFirstName] pegasse o seu cetro?\n\nOs socialites sonhavam com algo além de compartilhar a companhia da [emperor.GetHouse.GetName]? Nossos soldados gritavam o nome de algum estranho feio e confuso? Nossos magnatas — se dignavam a beijar pés que não fossem feitos da carne perfeita de [emperor.GetTitleAsNameNoTooltip] de [ROOT.Char.GetFaith.HighGodName]?\n\nNão preciso me lembrar, realmente. Questionar a legitimidade infalível de meu soberano seria inútil."
 ep3_governor_yearly.3040.t:0 "O Mais Perfeito [emperor.GetTitleAsNameNoTooltip]"
 ep3_governor_yearly.3040.t_greek:0 "[emperor.GetTitleAsNameNoTooltip] Autokrator!"
 ep3_governor_yearly.3050.a:0 "#EMP DEMÔNIO!#!"
 ep3_governor_yearly.3050.b:0 "Por que responder a este desgraçado... e não a mim?"
 ep3_governor_yearly.3050.c.flavor:0 "Deixe claro: considero aqueles que espalham essas mentiras absurdas completamente desprezíveis!"
 ep3_governor_yearly.3050.c:0 "#EMP Silêncio!#! Ninguém pode caluniar meu [emperor.GetTitleAsNameNoTooltip]!"
 ep3_governor_yearly.3050.coward:0 "\n\nOs próprios parentes [emperor.GetHerHim|U] sussurram esta história de família. Em sua terra natal, uma mulher santa foi violada e, quando sua maturidade chegou, o que saiu não foi uma criança, mas... #EMP uma massa de vermes.#! Um desses vermes fétidos foi comido por um rato, o rato por uma gaivota, e a gaivota por [emperor.GetFirstNameNoTooltip] ele próprio. Agora, o [emperor.GetTitleAsNameNoTooltip] treme e chora — até mesmo ao som de um rato dorminhoco!"
 ep3_governor_yearly.3050.cruel:0 "\n\nUma dama da casa [emperor.GetHerHim] jura que viu [emperor.GetSheHe] nos jardins à noite... #EMP bebendo o sangue de um gato de rua!#! Sob o pelo rasgado que adornava a coroa, o cruel semblante de [emperor.GetFirstNameNoTooltip] rosnou e cuspiu sangue. [emperor.GetSheHe|U] então fez sua fuga — carregado por dois espectros com asas de morcego sobre o muro do jardim!"
 ep3_governor_yearly.3050.d:0 "O infortúnio do dever é o ganho do político."
 ep3_governor_yearly.3050.desc:0 "Estranhas notícias circulam sobre [emperor.FullNameNoTooltip] [emperor.GetHouse.GetName], nosso [emperor.GetTitleAsNameNoTooltip] que vacila à beira de seu trono."
 ep3_governor_yearly.3050.desc_strange_intro:0 "Correm boatos estranhos sobre [emperor.FullNameNoTooltip], nosso [emperor.GetTitleAsNameNoTooltip] de mente antinatural e feitos incomuns."
 ep3_governor_yearly.3050.generic_bad:0 "\n\nCocheiros e criadas sussurram que [emperor.GetFirstNameNoTooltip] foi, na verdade, #EMP gerado pelo ânus de [ROOT.Char.GetFaith.DevilName]#!. O [emperor.GetTitleAsNameNoTooltip], um nativo de [ROOT.Char.GetFaith.NegativeAfterLife]! Subiu, o fedido enganador, das fossas amaldiçoadas para os aposentos do palácio, e ali se esgueirou na pele do nosso legítimo [emperor.GetTitleAsNameNoTooltip]!"
 ep3_governor_yearly.3050.mess:0 "\n\nUm vendedor de curas veio falando de... oferendas ímpias feitas a ele pelo palácio. Olhos de lagosta, unhas de crianças, poções de mandrágora e piche — tudo para o [emperor.GetTitleAsNameNoTooltip] forçar em sua boca balbuciante! A besta cambaleia pelo palácio, nua, pintada com as estranhas medicinas [emperor.GetHerHim] e amaldiçoando o nome de [emperor.GetFaith.HighGodName]!"
 ep3_governor_yearly.3050.outro:0 "\n\nTais notícias imundas sempre escorrem da corte de [emperor.GetFirstNameNoTooltip]."
 ep3_governor_yearly.3050.shiftless:0 "\n\nAqueles servos que fugiram do serviço [emperor.GetHerHim] descrevem uma extensão Tartária, pungente com perfume velho... o [emperor.GetTitleAsNameNoTooltip] jaz por longas horas no escuro, suplicando sob uma criatura #EMP esguia e murmurante#!. Quando os ministros [emperor.GetHerHim] chamam, [emperor.GetFirstNameNoTooltip] mal se mexe... mas quando o demônio move seus lábios pesados, o [emperor.GetTitleAsNameNoTooltip] grita por clemência, por vinho e bolos."
 ep3_governor_yearly.3050.t:0 "Um dos Demônios Menores de [ROOT.Char.GetFaith.NegativeAfterLife|U]"
 ep3_governor_yearly.3060.a:0 "Agora, [Select_CString( root_scope.IsFemale, 'a', 'o' )] [emperor.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] de [emperor.GetTitleAsNameNoTooltip] será recompensad[Select_CString( root_scope.IsFemale, 'a', 'o' )]!"
 ep3_governor_yearly.3060.b.flavor:0 "E me preparar, nas sombras, para fazer mais do que simplesmente denunciar..."
 ep3_governor_yearly.3060.b:0 "Eu devo denunciar este regime!"
 ep3_governor_yearly.3060.c.flavor_high_legit:0 "Quem poderia fazer algo diferente?"
 ep3_governor_yearly.3060.c.flavor_low_legit:0 "Embora isso só me traga ridículo."
 ep3_governor_yearly.3060.c.flavor_med_legit:0 "Tal lealdade é esperada."
 ep3_governor_yearly.3060.c.flavor_regent:0 "Quem sou eu para questionar a vontade de [ceremonial_liege.GetTitleAsNamePossessiveNoTooltip]?"
 ep3_governor_yearly.3060.c:0 "Publicamente, eu apoio o novo [emperor.GetTitleAsNameNoTooltip]."
 ep3_governor_yearly.3060.d.regent:0 "Tenho poucas opiniões sobre o novo regente."
 ep3_governor_yearly.3060.d:0 "Tenho poucas opiniões sobre meu novo senhor feudal."
 ep3_governor_yearly.3060.desc_afield:0 "\n\nAcampado em [emp_location.GetName], entre estandartes brilhantes, um novo [emperor.GetTitleAsNameNoTooltip] é erguido sobre um grande escudo polido."
 ep3_governor_yearly.3060.desc_byzantine:0 "\n\n#EMP \"Salve [emperor.GetFirstNameRegnal]!\"#! clamam os presentes. #EMP \"Pela graça de Cristo, fiel [emperor.GetTitleAsNameNoTooltip] e #EMP [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')]#! dos Romanos; o [emperor.GetHouse.GetName], para sempre [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')]!\"#!"
 ep3_governor_yearly.3060.desc_byzantine_femme:0 "\n\n#EMP \"Salve [emperor.GetFirstNameRegnal]!\"#! clamam os presentes. #EMP \"Pela graça de Cristo, fiel [emperor.GetTitleAsNameNoTooltip] e #EMP [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')]#! dos Romanos; o [emperor.GetHouse.GetName], para sempre [Glossary( 'Augousta', 'AUGOUSTUS_GLOSS')]!\"#!"
 ep3_governor_yearly.3060.desc_generic:0 "\n\n#EMP \"Salve [emperor.GetFirstName]!\"#! clamam os presentes. #EMP \"Pela vontade de [emperor.GetFaith.HighGodName], poderos[Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetTitleAsNameNoTooltip] e [emperor.GetMotherFather] de [emperor.GetPrimaryTitle.GetNameNoTierNoTooltip]; [Select_CString( emperor.IsFemale, 'a', 'o' )] [emperor.GetHouse.GetName], [Select_CString( emperor.IsFemale, 'a', 'o' )] mais [emperor.Custom('FormalComplimentAdjective')]!#!"
 ep3_governor_yearly.3060.desc_high_legit:0 "\n\nOs súditos [emperor.GetHerHim|U] rezam: #EMP \"[ROOT.Char.GetFaith.random_GoodGodNames], preserve o reinado de Vossa Majestade para sempre, agora e para sempre! Pelos séculos dos séculos!\"#!"
 ep3_governor_yearly.3060.desc_low_legit:0 "\n\nEnquanto os rituais bajuladores são realizados, sussurros percorrem o reino... por que direito est[Select_CString( emperor.IsFemale, 'a', 'e' )] [emperor.GetTitleAsNameNoTooltip] [emperor.Custom2('InsultAdjective', ROOT.Char)] governa?"
 ep3_governor_yearly.3060.desc_medium_legit:0 "\n\nMoedas reluzentes voam sobre uma gloriosa procissão! Magistrados se curvam diante [Select_CString( emperor.IsFemale, 'da', 'do' )] [emperor.GetTitledFirstNameNoTooltip]... subjugados, se ainda não leais."
 ep3_governor_yearly.3060.desc_regent:0 "\n\nNas profundezas dos salões do palácio imperial de [emperor.GetCapitalLocation.GetTitle.GetNameNoTier], os novos poderes de [emperor.GetTitleAsNamePossessiveNoTooltip] são afirmados diante dos oficiais reunidos."
 ep3_governor_yearly.3060.desc_regent_acclaim:0 "\n\nSelos coloridos e assinaturas meticulosas rapidamente cobrem os documentos formais. #EMP \"Pelos desígnios de [emperor.GetFaith.HighGodName], de [ceremonial_liege.GetTitledFirstName], [emperor.GetMotherFather] de [emperor.GetPrimaryTitle.GetNameNoTierNoTooltip]; a [ceremonial_liege.GetHouse.GetName], mais-[ceremonial_liege.Custom('FormalComplimentAdjective')]!#!\""
 ep3_governor_yearly.3060.desc_regent_legit:0 "\n\nOs súditos [ceremonial_liege.GetHerHim] rezam: #EMP \"Que [emperor.GetTitledFirstName] proteja seu governo, preservando sempre o reinado de Vossa Majestade, e a paz e a ordem do [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!\"#!"
 ep3_governor_yearly.3060.desc_temple:0 "\n\nNo supremo [emperor.GetFaith.HouseOfWorship] de [emperor.GetCapitalLocation.GetTitle.GetNameNoTierPossessive], em meio a dignitários e prelados, [Select_CString( emperor.IsFemale, 'uma nova', 'um novo' )] [emperor.GetTitleAsNameNoTooltip] é aclamad[Select_CString( emperor.IsFemale, 'a', 'o' )] pela primeira vez."
 ep3_governor_yearly.3060.intro_deceased:0 "O guardião de [emperor.GetPrimaryTitle.GetTierAsName], nosso pastor e soberano, deixou este mundo mortal. [previous_holder.GetTitledFirstNameRegnal] está mort[Select_CString( previous_holder.IsFemale, 'a', 'o' )]."
 ep3_governor_yearly.3060.intro_regent:0 "A política do palácio se move lentamente — na maior parte do tempo. [previous_holder.GetTitledFirstNameRegnal] não é mais o administrador do [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 ep3_governor_yearly.3060.intro_usurper:0 "A coroa foi arrancada da testa de [Select_CString( previous_holder.IsFemale, 'nossa soberana', 'nosso soberano' )] — [previous_holder.GetTitledFirstNameRegnal] não governa mais [emperor.GetPrimaryTitle.GetTierAsName]."
 ep3_governor_yearly.3060.t:0 "Uma Aclamação Resplandecente"
 ep3_governor_yearly.3060.t_regent:0 "Uma Confirmação Resplandecente"
 ep3_governor_yearly.3070.a:0 "As perspectivas abundam aqui! Não vamos a lugar nenhum."
 ep3_governor_yearly.3070.b:0 "Arrumem as malas, família: estamos nos mudando para a capital."
 ep3_governor_yearly.3070.c.flavor:0 "Esta criatura do palácio deve ter laços influentes — laços que poderiam me ligar a uma posição melhor."
 ep3_governor_yearly.3070.c:0 "\"Você vê o meu problema... agora me ajude.\""
 ep3_governor_yearly.3070.chariot:0 "corre com seu distinto carro por [root_capital.GetName]."
 ep3_governor_yearly.3070.d.fail:0 "Os construtores de estradas enfrentam mil dilemas"
 ep3_governor_yearly.3070.d.success:0 "A construção de estradas fomenta a conexão com a capital"
 ep3_governor_yearly.3070.d:0 "A jornada é dura? Eu cuidarei das estradas."
 ep3_governor_yearly.3070.desc:0 "\n\n\"Você mora tão longe #EMP assim?!?#!\" [racer.GetSheHe] debocha. \"Não é de se admirar que o [liege.GetTitleAsNameNoTooltip] não se lembre do seu nome... na verdade, é um milagre que qualquer palavra, qualquer viajante, de [liege.GetCapitalLocation.GetTitle.GetNameNoTier] sobreviva à jornada!\""
 ep3_governor_yearly.3070.e:0 "Adoro estas terras pitorescas."
 ep3_governor_yearly.3070.horse:0 "galopa impetuosamente por [root_capital.GetName]."
 ep3_governor_yearly.3070.intro:0 "Um cortesão [Select_CString( liege.IsFemale, 'da', 'do' )] [liege.GetTitledFirstName], meu senhor, é conhecido por testar as estradas do [liege.GetPrimaryTitle.GetTierAsName]. O [root_capital.GetTerrain.GetNameNoTooltip|l] ao redor da minha"
 ep3_governor_yearly.3070.landed:0 "capital é bastante remoto... mas, mesmo assim, o imprudente [racer.GetName] agora"
 ep3_governor_yearly.3070.t:0 "Uma Língua Bem Viajada"
 ep3_governor_yearly.3070.unlanded:0 "propriedade familiar é bastante remota... mas, mesmo assim, o imprudente [racer.GetName] agora"
 ep3_governor_yearly.3080.a:0 "Devemos, lentamente, construir a autossuficiência."
 ep3_governor_yearly.3080.b:0 "[ROOT.Char.GetFaith.HighGodName], me tire deste #EMP amaldiçoado#! compromisso!"
 ep3_governor_yearly.3080.c.crit_fail:0 "Sua força é emboscada e dizimada"
 ep3_governor_yearly.3080.c.fail:0 "As relações permanecem... tensas"
 ep3_governor_yearly.3080.c.success:0 "Os rebeldes foram dominados"
 ep3_governor_yearly.3080.c:0 "Venha, [captain.GetFirstNameNoTooltip]: nós lidaremos com eles ourselves."
 ep3_governor_yearly.3080.d.crit_fail:0 "Perseguições, debacles... e ainda nada"
 ep3_governor_yearly.3080.d.fail:0 "Nada é encontrado"
 ep3_governor_yearly.3080.d.success:0 "Os suprimentos são rapidamente garantidos"
 ep3_governor_yearly.3080.d:0 "Venha, [captain.GetFirstNameNoTooltip]: vamos recuperar o que foi perdido."
 ep3_governor_yearly.3080.desc:0 "Há muito aguardo a chegada de bens de luxo, de salários, necessários para manter a lealdade de [ROOT.Char.GetPrimaryTitle.GetAdjective]. Mas nada vem [Select_CString( liege.IsFemale, 'da', 'do' )] [liege.GetTitledFirstName].\n\n\"Perdido em algum lugar,\" supõe meu oficial, [captain.GetName], \"capturado por foras da lei? Preso em algum lugar acidentado? Talvez, os bens tenham sido vendidos a locais?\"\n\nQualquer que seja o caso... mal poderei comandar a grandeza [liege.GetPrimaryTitle.GetAdjective] como um pária empobrecido em uma terra distante."
 ep3_governor_yearly.3080.desc_faction:0 "Independentemente, meu relatório sobre o acúmulo de [rebel_faction.GetName] já deveria ter chegado [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstName] há muito tempo!\n\n\"Todos os exércitos da capital e nenhum soldado sobressalente...\" preocupa [captain.GetName], meu oficial. \"Nenhum soldado escapa dos rebeldes vivo...\"\n\nEm meu posto distante ardem as chamas da agitação. E, sem tropas frescas, elas só podem queimar ainda mais intensamente."
 ep3_governor_yearly.3080.e:0 "Tenho certeza de que tudo ficará #EMP bem.#!"
 ep3_governor_yearly.3080.intro:0 "Muitos dias de viagem separam [root_capital.GetName], meu quartel-general, de [liege.GetCapitalLocation.GetTitle.GetNameNoTier]."
 ep3_governor_yearly.3080.t:0 "Tomado por [root_capital.GetTerrain.GetNameNoTooltip]"
 ep3_governor_yearly.3080.t_sea:0 "Tomado pelo Mar"
 ep3_governor_yearly.3090.a.flavor:0 "...mas aqueles menos conectados devem me pagar um preço alto."
 ep3_governor_yearly.3090.a:0 "Eu poderia intermediar o acesso aos salões do poder..."
 ep3_governor_yearly.3090.b:0 "Seria sábio expandir nossos investimentos locais."
 ep3_governor_yearly.3090.c.flavor:0 "Com convidados locais de importância política, claro!"
 ep3_governor_yearly.3090.c:0 "Estou a fim de uma festa de jantar!"
 ep3_governor_yearly.3090.desc:0 "Vi soldados marcharem melancolicamente em direção à fronteira. Ouvi oficiais, temerosos de seus postos distantes, lamentarem-se de canções estrangeiras rudes e jantares insípidos e grosseiros...\n\nEm [root_capital.GetName], nada disso me preocupa. Os assuntos do próprio [liege.GetPrimaryTitle.GetTierAsName] passam pelas minhas mãos"
 ep3_governor_yearly.3090.landed:0 "[ROOT.Char.GetPrimaryTitle.GetTierAsName] — negociamos bens reais, mantemos contatos no palácio de [liege.GetTitleAsName], e temos grande influência na política do reino.\n\nQuão bom é servir no coração dessa grande e próspera entidade."
 ep3_governor_yearly.3090.t:0 "O Coração de [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 ep3_governor_yearly.3090.unlanded:0 "portas da propriedade — entrando, claro, apenas com cortesia refinada. Assim, meus parentes nunca estão longe dos negócios do reino.\n\nQuão bom é viver no coração dessa grande e próspera entidade."
 ep3_governor_yearly.3100.a:0 "Parece que devo ensinar governança."
 ep3_governor_yearly.3100.b.fail:0 "O [liege.GetTitleAsNameNoTooltip] está ofendido"
 ep3_governor_yearly.3100.b.success:0 "Sua carta tem uma convicção impressionante"
 ep3_governor_yearly.3100.b:0 "Meu senhor feudal deve corrigir essa má gestão!"
 ep3_governor_yearly.3100.c.flavor:0 "Nestes tempos corruptos, quem notará um pouco mais de corrupção?"
 ep3_governor_yearly.3100.c:0 "Do desordem vem o lucro."
 ep3_governor_yearly.3100.d.flavor:0 "Mal consigo suportar pensar nisso..."
 ep3_governor_yearly.3100.d:0 "Não posso consertar este estado miserável das coisas..."
 ep3_governor_yearly.3100.desc:0 "\n\n[messenger.GetFirstName], um enviado, gagueja: \"[Select_CString( liege.IsFemale, 'A', 'O' )] [liege.Custom('FormalComplimentAdjective')] e duradour[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstNameRegnal], com a mente na saúde de [Select_CString( liege.IsFemale, 'sua', 'seu' )] [liege.GetPrimaryTitle.GetTierAsName], manda todos os trabalhadores, todos os servos a serem taxados-\"\n\nEu não posso ouvir mais."
 ep3_governor_yearly.3100.desc_governors:0 "Um legado tão básico, #EMP básico#! É preciso que o [liege.GetTitleAsNameNoTooltip] implore a seus oficiais para fazer #EMP qualquer coisa?#! Qualquer coisa, exceto pisotear os frutos do reino?\n\n[liege.GetPrimaryTitle.GetNameNoTier] está infestado de idiotas..."
 ep3_governor_yearly.3100.desc_liege_debt:0 "[Select_CString( liege.IsFemale, 'A', 'O' )] [liege.Custom2('InsultNoun', ROOT.Char)] e os capangas enfeitados e vestidos de cashmere [liege.GetHerHim] já drenaram [liege.GetPrimaryTitle.GetNameNoTierNoTooltip] de toda a riqueza! Com seus novos esquemas, eles só vão famintos e arruinados..."
 ep3_governor_yearly.3100.desc_liege_skill:0 "[liege.Custom('quirk_neg_adverb')|U], [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.Custom2('InsultNoun', ROOT.Char)] se volta para nós, ministros, buscando o que [liege.GetSheHe] [liege.GetHerselfHimself] não pode garantir — os lucros de uma regra sensata!\n\n[liege.GetPrimaryTitle.GetNameNoTierNoTooltip] está sem esperança..."
 ep3_governor_yearly.3100.intro_governors:0 "\"Esses ministros inúteis se recusam a #EMP o quê?#!\" Eu gaguejo. #EMP \"O que eles não farão por nosso senhor feudal?!?\"#!"
 ep3_governor_yearly.3100.intro_liege:0 "\"[liege.GetSheHe|U] decreta #EMP o quê#! agora?\" Eu gaguejo. #EMP \"O que nosso senhor feudal ordena de mim?!?\"#!"
 ep3_governor_yearly.3100.t:0 "Nosso [liege.GetPrimaryTitle.GetTierAsNameNoTooltip], Pandemonium"
