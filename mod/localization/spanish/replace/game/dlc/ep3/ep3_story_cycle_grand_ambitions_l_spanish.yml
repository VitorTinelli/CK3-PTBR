l_spanish:
 co_emperor_accepts:0 "#HIGH [secret_owner.GetSheHe|U] aceita#!"
 co_emperor_rejects:0 "#HIGH [secret_owner.GetSheHe|U] recusa#!"
 ep3_grand_ambitions_cheaper_maa_modifier:0 "Recrutando Soldados Desiludidos"
 ep3_grand_ambitions_hushed_rumors:0 "Rumores Silenciados"
 ep3_grand_ambitions_local_labor_modifier:0 "Mão de Obra Local"
 ep3_grand_ambitions_rioting_county_modifier:0 "Rumores Imperiais"
 every_family_member_of_secret_owner:0 "Todo membro da família [Select_CString( secret_owner.IsFemale, 'da', 'do' )] [secret_owner.GetTitledFirstName]"
 ga_0151_b_eunuch_aptitude:0 "A [aptitude|E] de [eunuch.GetShortUIName] como [GetCourtPositionType('chief_eunuch_court_position').GetName] é [eunuch.GetCourtPositionAptitude(GetCourtPositionType('chief_eunuch_court_position'))]"
 grand_ambitions.0001.a.flavor:0 "Vou reunir todo o império à minha causa, pois [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] exige um governante de virtude e força!"
 grand_ambitions.0001.a:0 "Que o destino de [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] seja refeito em aço!"
 grand_ambitions.0001.b.flavor:0 "O [target_char.GetTitleAsNameNoTooltip] cairá não pela espada, mas por mil sussurros de traição."
 grand_ambitions.0001.b.toast:0 "Esquema de Deposição Iniciado"
 grand_ambitions.0001.b:0 "A subterfúgio silencioso destituirá o [target_char.GetTitleAsNameNoTooltip], não a guerra."
 grand_ambitions.0001.c:0 "O momento não é adequado..."
 grand_ambitions.0001.desc:0 "Como chefe de uma das famílias mais poderosas no [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier|l], minha influência se estende amplamente, meus cofres são profundos, e minha ambição — ilimitada.\n\n[target_char.GetTitledFirstName] é indigno do trono, um mero fio na grande tapeçaria do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Apoiado pela eminência da Casa [ROOT.Char.GetHouse.GetName], estou bem equipado para restaurar a glória ao nosso grande império.\n\nMinhas ações não apenas moldarão o futuro da minha casa, mas ecoarão pelos anais da história."
 grand_ambitions.0001.t:0 "$grand_ambitions_header$"
 grand_ambitions.0100.a.claim:0 "Você concorda em conceder [Select_CString( foreign_ruler.IsFemale, 'a', 'o' )] [foreign_ruler.GetTitledFirstName] o [foreign_claim.GetName] após sua ascensão ao trono"
 grand_ambitions.0100.a.faction_tooltip:0 "Você poderá chamar [Select_CString( foreign_ruler.IsFemale, 'a', 'o' )] [foreign_ruler.GetTitledFirstName] como um aliado em uma futura [civil_war|E] contra [THIS.Char.GetTopLiege.GetTitledFirstName]"
 grand_ambitions.0100.a:0 "Um [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip|l] deve fazer sacrifícios."
 grand_ambitions.0100.b.failure:0 "[foreign_ruler.GetTitledFirstName] rejeita sua contraproposta"
 grand_ambitions.0100.b.success.tt:0 "Você promete conceder o [compromise_county.GetName] para [foreign_ruler.GetName] após sua ascensão ao trono"
 grand_ambitions.0100.b.success:0 "[foreign_ruler.GetTitledFirstName] concorda com sua contraproposta"
 grand_ambitions.0100.b:0 "Um compromisso, talvez o [compromise_county.GetNameNoTooltip] seja de interesse?"
 grand_ambitions.0100.c:0 "Não venderei os próprios ossos do meu [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!"
 grand_ambitions.0100.claim:0 "O selo da carta traz a marca da Casa [foreign_ruler.GetDynastyHouseName]. As palavras dentro apresentam uma oferta ousada: uma aliança contra o [target_char.GetTitleAsName], condicionada à cessão do [foreign_claim.GetName]. A audácia do pedido é igualada apenas pelo potencial que ele guarda.\n\n"
 grand_ambitions.0100.conclusion:0 "Esta oferta é uma lâmina de dois gumes: uma para cortar meu caminho para a vitória, a outra para ferir o [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] tão profundamente quanto."
 grand_ambitions.0100.intro:0 "O silêncio do meu escritório é interrompido enquanto [Select_CString( interlocutor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] me apresenta uma recente missiva. \"Uma proposta de além das fronteiras do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l],\" [interlocutor.GetSheHe] anuncia.\n\n"
 grand_ambitions.0100.powerful_family_joins_faction:0 "[powerful_family_head.GetTitledFirstName] jura um juramento de se juntar à sua [claimant_faction|E]"
 grand_ambitions.0100.t:0 "$grand_ambitions_header$: Uma Proposta Ousada"
 grand_ambitions.0110.a:0 "Vamos colocar esses soldados para trabalhar."
 grand_ambitions.0110.b:0 "Com esse influxo de ouro, podemos subsidiar os custos de recrutamento."
 grand_ambitions.0110.c:0 "Não permitirei que qualquer um se junte à minha causa!"
 grand_ambitions.0110.desc:0 "[Select_CString( interlocutor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] relata: \"Patronos ricos estão se reunindo à nossa causa, e soldados, cansados do reinado de [target_char.GetTitleAsNameNoTooltip], estão prontos para se juntar a nós.\"\n\nEste crescimento de apoio, desde os cofres dos aliados até os corações dos mais bravos [ROOT.Char.Custom('GetMartialMenWomen')] de [target_char.GetTitleAsNameNoTooltip], marca um ponto de virada. Nossas fileiras estão prestes a crescer e nossos recursos a se expandir. Este momento não é apenas um testemunho da justiça da minha causa, mas uma indicação clara: o tempo para a guerra se aproxima cada vez mais."
 grand_ambitions.0110.t:0 "$grand_ambitions_header$: Chamado às Armas"
 grand_ambitions.0120.a:0 "Meus [maa_flavor.GetNameNoTooltip|l] precisam de um lugar adequado para se reunir."
 grand_ambitions.0120.b:0 "Pastagens fornecem cavalos bem alimentados para os [maa_flavor.GetNameNoTooltip|l]."
 grand_ambitions.0120.c:0 "Uma torre de vigia certamente melhorará meus [maa_flavor.GetNameNoTooltip|l]."
 grand_ambitions.0120.d:0 "Contrate todos os trabalhadores que puder encontrar — há muito a ser feito!"
 grand_ambitions.0120.desc:0 "Enquanto os sussurros de rebelião ecoam pelos terrenos da minha propriedade, a realidade dura do meu confronto iminente com o imperador lança uma sombra sobre nossos preparativos. A força tangível das defesas e recursos do [estate.GetName] é fundamental.\n\n[Select_CString( interlocutor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] me apresenta planos para maneiras importantes de reforçar a base do meu poder. \"Agora é a hora de fortificar a propriedade,\" [interlocutor.GetSheHe] insiste, apontando os locais propostos para construção."
 grand_ambitions.0120.t:0 "$grand_ambitions_header$: Fundamentos Fortificados"
 grand_ambitions.0130.a:0 "Vamos chamar alguns favores."
 grand_ambitions.0130.b.crit_failure:0 "Seus sussurros traem sua intenção ao [target_char.GetTitleAsName]"
 grand_ambitions.0130.b.failure:0 "Seus sussurros falham em manchar a reputação de [target_char.GetTitleAsName]"
 grand_ambitions.0130.b.success:0 "Seus sussurros têm asas"
 grand_ambitions.0130.b:0 "Que nossos sussurros tenham asas!"
 grand_ambitions.0130.c:0 "O ouro costuma soltar as línguas dos plebeus..."
 grand_ambitions.0130.d:0 "Não recorrerei a #EMP boatos#!. Não somos crianças."
 grand_ambitions.0130.desc.intro:0 "[Select_CString( interlocutor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] se aproxima com uma proposta para avançar meu plano contra [Select_CString( target_char.IsFemale, 'a', 'o' )] [target_char.GetTitledFirstName].\n\n"
 grand_ambitions.0130.desc.legitimacy.1:0 "\"O povo não tem um pingo de fé no falso [target_char.GetTitleAsNameNoTooltip],\" [interlocutor.GetSheHe] começa. \"Sua raiva é potente, mas sem foco — precisamos apenas dar-lhes o menor indício de direção.\""
 grand_ambitions.0130.desc.legitimacy.2:0 "\"A fé do povo no [target_char.GetTitleAsNameNoTooltip] enfraquece,\" [interlocutor.GetSheHe] começa. \"Com apenas um sopro, poderíamos transformar as fagulhas de seu descontentamento em um incêndio ardente.\""
 grand_ambitions.0130.desc.legitimacy.3:0 "\"A fé do povo no [target_char.GetTitleAsNameNoTooltip] não é inabalável,\" [interlocutor.GetSheHe] começa. \"Não seria necessário #EMP muito#! para minar [target_char.GetSheHe], para que a turba derrube [Select_CString( target_char.IsFemale, 'a', 'o' )] [target_char.GetWomanMan] em um mar de ódio.\""
 grand_ambitions.0130.desc.legitimacy.4:0 "\"A fé do povo no [target_char.GetTitleAsNameNoTooltip] é resoluta,\" [interlocutor.GetSheHe] começa, \"ou assim eles pensam — a turba é coisa volúvel. Com esforço suficiente, sua lealdade pode ser comprada, mesmo que apenas por uma noite.\""
 grand_ambitions.0130.desc.legitimacy.5:0 "\"O povo aclama seu [target_char.GetTitleAsNameNoTooltip],\" [interlocutor.GetSheHe] começa, \"mas quantos deles levariam uma facada por [target_char.GetSheHe]? As palavras certas nos ouvidos certos e alguns centavos a mais no preço do pão sempre levam a turba à loucura.\""
 grand_ambitions.0130.desc.legitimacy.6:0 "\"O povo ama seu [target_char.GetTitleAsNameNoTooltip],\" [interlocutor.GetSheHe] começa, \"mas o amor é uma coisa frágil e paranoica. Com trabalho suficiente, ele pode ser transmutado em um medo de traição, e a partir daí, em ódio.\""
 grand_ambitions.0130.desc.outro:0 "\n\n\"A opinião de [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] pode desfazer um [target_char.GetTitleAsNameNoTooltip] tão facilmente quanto cria um. E já foi influenciada antes...\""
 grand_ambitions.0130.t:0 "$grand_ambitions_header$: Sussurros no Vento"
 grand_ambitions.0131.a:0 "Não estou sem meus próprios intrigas."
 grand_ambitions.0131.b:0 "Os criadores de rumores não estão além do meu alcance."
 grand_ambitions.0131.c:0 "Não me preocuparei com algo tão mesquinho."
 grand_ambitions.0131.conclusion:0 "\n\nSe não for contido, isso pode significar desastre..."
 grand_ambitions.0131.d:0 "Maldit[Select_CString( schemer.IsFemale, 'a', 'o' )] [schemer.Custom2('InsultNoun', ROOT.Char)] [schemer.Custom2('InsultAdjective', ROOT.Char)]..."
 grand_ambitions.0131.desc:0 "Parece que rumores escandalosos sobre você têm se espalhado em [target_char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 grand_ambitions.0131.desc_secret:0 "\n\nDescobrimos que esses rumores são perpetuados [Select_CString( schemer.IsFemale, 'pela', 'pelo' )] [schemer.GetTitledFirstName], que busca seu trono para [schemer.GetHerselfHimself]."
 grand_ambitions.0131.opening:0 "[interlocutor.Custom2('AppropriateGreeting', ROOT.Char)]"
 grand_ambitions.0140.a:0 "Quanto mais, melhor."
 grand_ambitions.0140.b:0 "Não preciso de sua ajuda."
 grand_ambitions.0140.desc:0 "\"Eu disse para não me incomodar!\" grito ao ouvir a porta do meu escritório se abrir. No entanto, à soleira está um convidado inesperado: [target_gov.GetFirstName], o [target_gov.GetTitleAsNameNoTooltip] do [target_gov.GetPrimaryTitle.GetNameNoTier].\n\n\"Peço desculpas pela interrupção, [ROOT.Char.GetFirstNameNoTooltip], mas vim oferecer-lhe meu apoio."
 grand_ambitions.0140.faction:0 "Desejo juntar-me aos seus esforços para depor o [target_char.GetTitleAsName].\""
 grand_ambitions.0140.no_faction:0 "Sei que você acumula poder aqui no [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], preparando-se para depor o [target_char.GetTitleAsName].\""
 grand_ambitions.0140.t:0 "$grand_ambitions_header$: Um Companheiro [target_gov.GetTitleAsNameNoTooltip]"
 grand_ambitions.0150.a:0 "Um infiltrador habilidoso certamente acelerará nosso plano."
 grand_ambitions.0150.b:0 "Vamos empregar um engodo para garantir nossa discrição."
 grand_ambitions.0150.c:0 "Alguém para exaltar minhas virtudes na corte seria prudente."
 grand_ambitions.0150.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] dá um passo à frente, a gravidade de nosso empreendimento sombreando os traços [interlocutor.GetHerHim]. \"Nossos planos para depor [Select_CString( target_char.IsFemale, 'a', 'o' )] [target_char.GetTitledFirstName] continuam avançando,\" [interlocutor.GetSheHe] entoa solenemente. Cada uma de suas palavras é ponderada com o peso de nossa conspiração.\n\n\"No entanto, nossos planos podem fracassar sem aliados suficientes nas posições corretas. Um agente adicional ajudaria a garantir nosso sucesso."
 grand_ambitions.0150.t:0 "$grand_ambitions_header$: Um Agente Adicional"
 grand_ambitions.0151.a:0 "Que os sussurros [eunuch.GetHerHim] guiem nossa causa."
 grand_ambitions.0151.b:0 "Os talentos [eunuch.GetHerHim|U] são valiosos demais para serem apenas emprestados."
 grand_ambitions.0151.c:0 "Há outras maneiras de tecer nosso plano."
 grand_ambitions.0151.desc:0 "À luz fraca do início da noite, [Select_CString( interlocutor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] se aproxima com um brilho astuto nos olhos [interlocutor.GetHerHim].\n\n\"Uma oportunidade única se apresenta,\" [interlocutor.GetSheHe] murmura, garantindo que até as paredes não possam ouvir. \"O [GetCourtPositionType('chief_eunuch_court_position').GetNameNoTooltip] da corte de [target.GetTitleAsNameNoTooltip], uma sombra que se move silenciosamente pelos corredores do poder, pode ser convencido a se juntar à nossa causa. A influência [eunuch.GetHerHim|U] é incomparável, seus segredos são vastos.\"\n\n\"[eunuch.GetSheHe|U] pode ser o pilar central em nosso grande plano para reformar o [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\""
 grand_ambitions.0151.t:0 "$grand_ambitions_header$: Um Mestre dos Sussurros"
 grand_ambitions.0155.a:0 "[agent_choice_1.GetFirstNameNoTooltip] certamente ajudaria nossos esforços."
 grand_ambitions.0155.b:0 "Talvez [agent_choice_2.GetFirstNameNoTooltip] seja o melhor."
 grand_ambitions.0155.c:0 "[agent_choice_3.GetFirstNameNoTooltip], por outro lado..."
 grand_ambitions.0155.d:0 "Nenhum destes é adequado."
 grand_ambitions.0155.desc:0 "[Select_CString( interlocutor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] se aproxima, seu rosto sombreado pela contemplação.\n\n\"Nossa trama para destronar o [target_char.GetTitleAsNameNoTooltip] requer um novo informante; alguém para preencher a função de [agent_slot.GetName]. Identifiquei três potenciais aliados que poderiam desequilibrar a balança a nosso favor,\" ele diz.\n\nEle recua para as sombras do corredor, deixando os nomes diante de você, cada um uma promessa silenciosa de poder ou perigo."
 grand_ambitions.0155.t:0 "$grand_ambitions_header$: Chamando Favores"
 grand_ambitions.0160.a:0 "Os funcionários do palácio serão aliados fundamentais."
 grand_ambitions.0160.b:0 "Os mercadores levarão nossas palavras, rápidas e seguras."
 grand_ambitions.0160.c:0 "Os escribas imperiais garantirão que não sejamos expostos."
 grand_ambitions.0160.desc:0 "[Select_CString( interlocutor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] se aproxima de mim com notícias de nosso plano para depor [Select_CString( target_char.IsFemale, 'a', 'o' )] [target_char.GetTitledFirstName]. \"As bases para nossa grande ambição estão lançadas,\" ele começa, sua voz firme e segura.\n\n\"Temos aliados em lugares altos e baixos, cada um pronto para desempenhar seu papel em nosso grande plano. Em quem depositaremos nossa confiança?"
 grand_ambitions.0160.t:0 "$grand_ambitions_header$: Fios de Subterfúgio"
 grand_ambitions.0170.a:0 "Pagaremos o preço deles — o que for preciso."
 grand_ambitions.0170.b:0 "Eles serão vinculados a nós com a promessa de uma futura recompensa."
 grand_ambitions.0170.c:0 "Unamos nossas casas em uma união sagrada."
 grand_ambitions.0170.d:0 "Minha ambição não será acorrentada por dívidas."
 grand_ambitions.0170.desc:0 "[Select_CString( interlocutor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] se aproxima de mim com urgência silenciosa.\n\n\"Uma proposta,\" [interlocutor.GetSheHe] começa, \"do chefe de uma das mais ilustres famílias [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Eles tomaram conhecimento de nossas aspirações e veem uma oportunidade de ganho mútuo.\" Ele desenrola um pergaminho, o selo da Casa [powerful_house.GetName] brilhando de forma ameaçadora na luz tênue.\n\n\"O apoio deles poderia desequilibrar a balança a nosso favor. No entanto, tal aliança vem com um preço — uma compensação que eles acreditam ser equivalente ao risco.\""
 grand_ambitions.0170.t:0 "$grand_ambitions_header$: Uma Aliança Poderosa"
 grand_ambitions.0180.a.flavor:0 "[ROOT.Char.GetFaith.HighGodName] deseja isso, e assim será."
 grand_ambitions.0180.a:0 "\"Foi divinamente ordenado.\""
 grand_ambitions.0180.b.failure:0 "[hof.GetTitledFirstNameNoTooltip] se recusa a coroá-lo"
 grand_ambitions.0180.b.success.tt:0 "Se bem-sucedido em sua tentativa de depor [Select_CString( target_char.IsFemale, 'a', 'o' )] [target_char.GetTitledFirstName], você ganhará #P [EmptyScope.ScriptValue('major_legitimacy_gain')]#! [legitimacy|E]"
 grand_ambitions.0180.b.success:0 "[hof.GetTitledFirstNameNoTooltip] concorda em coroá-lo"
 grand_ambitions.0180.b:0 "\"Sua Santidade, permita-me ser um servo de [ROOT.Char.GetFaith.HighGodName].\""
 grand_ambitions.0180.c:0 "Mesmo o [hof.GetTitleAsNameNoTooltip] pode ser persuadido por meios materiais..."
 grand_ambitions.0180.d.flavor:0 "#EMP Curve-se à minha vontade, [hof.GetFirstName]!#!"
 grand_ambitions.0180.d:0 "Mesmo o [hof.GetPrimaryTitle.GetNameNoTierNoTooltip|l] não é imune à minha influência."
 grand_ambitions.0180.desc:0 "Estou diante do [hof.GetTitleAsName], o líder espiritual do meu povo. O ar é pesado com incenso e o peso de séculos.\n\nConquistar o favor [hof.GetHerHim] não apenas daria legitimidade à minha reivindicação sobre [target_title.GetName], mas também poderia conquistar os corações dos fiéis em todo o império. [hof.GetSheHe|U] deve me coroar.\n\nO [hof.GetTitleAsNameNoTooltip] não é uma mera figura espiritual; [hof.GetSheHe] está profundamente ciente das maquinações temporais do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]."
 grand_ambitions.0180.e:0 "\"Você #EMP irá#! me coroar como [target.GetTitleAsNameNoTooltip], [hof.GetFirstNameNoTooltip]!\""
 grand_ambitions.0180.f:0 "Talvez eu volte mais tarde."
 grand_ambitions.0180.intro_hagia_sofia:0 "Aqui, sob a vasta e intimidante cúpula dourada da Hagia Sophia,"
 grand_ambitions.0180.t:0 "$grand_ambitions_header$: Uma Coroação Adequada"
 grand_ambitions.0190.a.tt.1:0 "[emperor.GetShortUIName|U] entra em um [duumvirate|E] com [secret_owner.GetShortUIName] como seu [co_emperor|E]"
 grand_ambitions.0190.a.tt.2:0 "Cessa as tramas [secret_owner.GetHerHim]"
 grand_ambitions.0190.a.tt:0 "Você oferece a posição de [co_emperor|E] para [secret_owner.GetShortUIName]"
 grand_ambitions.0190.a:0 "Talvez [secret_owner.GetSheHe] se contente com um lugar à mesa..."
 grand_ambitions.0190.b:0 "Deixe [secret_owner.GetSheHe] apodrecer nas masmorras!"
 grand_ambitions.0190.c:0 "Todas as coisas seguem seu curso com o tempo."
 grand_ambitions.0190.desc:0 "\"... mas seus inimigos mais perto ainda,\" [Select_CString( interlocutor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', interlocutor)] termina, descrevendo as tramas recentemente descobertas [Select_CString( secret_owner.IsFemale, 'da', 'do' )] [secret_owner.GetTitledFirstName] para reivindicar o [ROOT.Char.GetPrimaryTitle.GetName|l] para [secret_owner.GetHerselfHimself].\n\nA #EMP audácia#! dess[Select_CString( secret_owner.IsFemale, 'a', 'e' )] [secret_owner.GetWomanMan]! Não posso permitir que isso fique sem resposta!"
 grand_ambitions.0190.t:0 "Mantenha seus amigos por perto..."
 grand_ambitions.0191.a.tt.1:0 "Você se torna o [co_emperor|E] de [emperor.GetShortUIName]"
 grand_ambitions.0191.a.tt.2:0 "Você cessa suas tramas"
 grand_ambitions.0191.a:0 "#EMP Tentador...#!"
 grand_ambitions.0191.b:0 "Nunca compartilharei poder com ess[Select_CString( emperor.IsFemale, 'a', 'e' )] [emperor.Custom('InsultNoun')]!"
 grand_ambitions.0191.desc:0 "\"#EMP [ROOT.Char.GetTitleAsNameNoTooltip]!#!\"\n\n[interlocutor.GetTitledFirstName], [Select_CString( interlocutor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', interlocutor)], irrompe no meu estúdio, ofegante. \"Uma chance decisiva se apresentou!\" [interlocutor.GetSheHe] ofega. \"[emperor.GetTitledFirstNameRegnal] soube dos seus planos de tomar o trono para si!\"\n\n\"Mas [emperor.GetSheHe] enviou uma oferta: #EMP Co-Imperador.#! [emperor.GetSheHe|U] deseja que você abandone suas tramas e, em vez disso, ocupe um lugar ao seu lado, governando nosso grande [emperor.GetPrimaryTitle.GetTierAsNameNoTooltip|l] a partir da gloriosa [emperor.GetCapitalLocation.GetBaronyNameExplicitly].\""
 grand_ambitions.0191.t:0 "$grand_ambitions_header$: Uma Oferta Decisiva"
 grand_ambitions.0200.a:0 "[target.GetPrimaryTitle.GetNameNoTooltip] voará nas asas da Casa [ROOT.Char.GetHouse.GetNameNoTooltip]!"
 grand_ambitions.0200.conclusion:0 "\n\nEstamos à beira de uma nova era. Amanhã, o império desperta não para um legado cansado, mas para a promessa do meu reinado.\n\n\"Você, [target.GetFirstName], não passa de um eco distante de #EMP meu#! império!\""
 grand_ambitions.0200.desc:0 "Pequenos atos de rebelião — cada porta deixada entreaberta, cada mensagem desviada — teceram o tecido de nossa vitória, provando que a força de um império pode ser influenciada pelas mãos mais humildes."
 grand_ambitions.0200.eunuch:0 "O [GetAgentSlotType('agent_eunuch').GetName], mestre dos segredos do palácio, desempenhou seu papel com perfeição. Seus sussurros semearam a discórdia, seus acenos silenciosos em corredores escuros preparando o cenário para nossa vitória.\n\n"
 grand_ambitions.0200.opening:0 "Hoje, os próprios alicerces de [target.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] tremem sob o peso da Casa [ROOT.Char.GetHouse.GetName]. Uma revolução silenciosa destituiu um [target.GetTitleAsNameNoTooltip], marcando o início de uma nova era.\n\n"
 grand_ambitions.0200.powerful_family.currency:0 "claramente valendo seu peso em ouro."
 grand_ambitions.0200.powerful_family.fallback:0 "embora eu relute em admitir."
 grand_ambitions.0200.powerful_family.hook:0 "embora eu relute em lembrar do favor que lhes devo."
 grand_ambitions.0200.powerful_family.marriage:0 "à qual agora estou unido em matrimônio."
 grand_ambitions.0200.powerful_family:0 "Claro, minha ascensão seria impossível sem o apoio da família [story.MakeScope.Var('powerful_family').House.GetName], "
 grand_ambitions.0200.t:0 "$grand_ambitions_header$: A Noite Decisiva"
 grand_ambitions.0201.a:0 "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] aguarda."
 grand_ambitions.0201.conc_greek:0 "\"[Glossary('Kýrie, eléison', 'KYRIE_ELEISON_GLOSS')]\", eu grito confiante."
 grand_ambitions.0201.desc:0 "\"A providência divina que guia o destino dos impérios escolheu um novo soberano,\" a voz [Select_CString( ROOT.Char.GetFaith.GetReligiousHead.IsFemale, 'da', 'do' )] [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] ressoa pelo salão do trono, impregnada de uma gravidade que condiz com a ocasião.\n\nOs olhos [ROOT.Char.GetFaith.GetReligiousHead.GetHerHim|U] encontram os meus, um reconhecimento silencioso do pacto que nos trouxe a este momento. \"Pela graça de [ROOT.Char.GetFaith.HighGodName], eu te coroo [ROOT.Char.GetName].\"\n\nÀ medida que o peso da coroa se acomoda sobre minha testa, sinto o manto de séculos repousar sobre meus ombros. Meu caminho para o poder pode ter sido incomum, mas me trouxe até aqui, a este momento glorioso.\n\n"
 grand_ambitions.0201.t:0 "$grand_ambitions_header$: O Caminho para o Poder"
 grand_ambitions.0202.a.flavor:0 "Que [old_emp.GetSheHe] desapareça na noite, longe das cinzas do reinado [old_emp.GetHerHim]."
 grand_ambitions.0202.a:0 "Vá em paz, [old_emp.GetFirstNameNoTooltip]."
 grand_ambitions.0202.b.flavor:0 "No entanto, [old_emp.GetSheHe] viverá. Nisso, encontramos um equilíbrio entre justiça e misericórdia, um sinal para todos do alto custo da arrogância."
 grand_ambitions.0202.b:0 "Que [old_emp.GetSheHe] carregue as cicatrizes de sua queda."
 grand_ambitions.0202.c.flavor:0 "À medida que sua vaga pela terra, assim também [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly] vagará de seu passado, buscando um novo caminho a seguir."
 grand_ambitions.0202.c:0 "Marquem [old_emp.GetSheHe] e o expulsem além das muralhas!"
 grand_ambitions.0202.d.tt:0 "[old_emp.GetFirstName] permanece [imprisoned|E] em suas masmorras."
 grand_ambitions.0202.d:0 "Ainda não terminei com você."
 grand_ambitions.0202.desc:0 "Diante de mim, o deposto [ROOT.Char.GetTitleAsNameNoTooltip] aguarda seu destino sob a sombra do coração fumegante do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l].\n\nComo escolho lidar com o homem diante de mim não é apenas uma questão de retribuição pessoal ou magnanimidade; é a primeira pedra lançada na fundação do meu legado.\n\nSerá uma de vingança e conflitos recorrentes, ou de misericórdia e esperança? Os olhos da corte, do povo e da própria história estão sobre mim."
 grand_ambitions.0202.t:0 "$grand_ambitions_header$: O Destino dos Caídos"
 grand_ambitions.0250.a:0 "A estrada para o poder se escurece..."
 grand_ambitions.0250.desc:0 "Longe da recepção que esperávamos, [Select_CString( interlocutor.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', interlocutor)] [interlocutor.GetFirstName] se aproxima de mim do lado de fora dos portões da cidade.\n\n\"Trilhamos a borda de uma faca e parece que caímos do lado errado,\" [interlocutor.GetSheHe] diz solemnemente.\n\nA capital, com seus edifícios imponentes e profundas sombras, parece inalterada por nossos esforços. O [target.GetTitleAsNameNoTooltip] permanece em seu trono, talvez inconsciente de quão perto os ventos da mudança estavam de varrer [target.GetCapitalLocation.GetBaronyNameExplicitly]."
 grand_ambitions.0250.t:0 "$grand_ambitions_header$: Fim da Estrada"
 grand_ambitions.0300.a:0 "Sou um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] da minha palavra. [demand.GetNameNoTierNoTooltip] é seu."
 grand_ambitions.0300.b.failure:0 "[foreign_ruler.GetTitledFirstName|U] não é convencid[Select_CString( foreign_ruler.IsFemale, 'a', 'o' )]"
 grand_ambitions.0300.b.success:0 "[foreign_ruler.GetTitledFirstName|U] é convencid[Select_CString( foreign_ruler.IsFemale, 'a', 'o' )]"
 grand_ambitions.0300.b:0 "Tenho algo muito mais grandioso para oferecer..."
 grand_ambitions.0300.c:0 "Sua ingenuidade é encantadora."
 grand_ambitions.0300.desc:0 "[foreign_ruler.GetTitledFirstName|U] está diante de mim, o recém-criado [ROOT.Char.GetTitleAsNameNoTooltip] do [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. E é, em parte, graças ao apoio [foreign_ruler.GetHerHim]...\n\nConsequentemente, [foreign_ruler.GetSheHe] veio exigir o que foi prometido: o [demand.GetName]."
 grand_ambitions.0300.t:0 "$grand_ambitions_header$: Colha o que Você Semear"
 grand_ambitions.0500.a:0 "Não descansarei até #EMP eu ser o [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]!#!"
 grand_ambitions.0500.b.tt:0 "Você interrompe seus esforços para [depose|E] [Select_CString( THIS.Char.GetTopLiege.IsFemale, 'a', 'o' )] [THIS.Char.GetTopLiege.GetTitleAsName]."
 grand_ambitions.0500.b:0 "Cesse suas preparações. Vamos nos alegrar!"
 grand_ambitions.0500.dead:0 "É um prazer informar que [Select_CString( story.MakeScope.Var('target_char').Char.IsFemale, 'a', 'o' )] [story.MakeScope.Var('target_char').Char.GetTitledFirstName] está morto. Nossos planos devem continuar para depor [ROOT.Char.GetTopLiege.GetTitledFirstName]?"
 grand_ambitions.0500.opening:0 "[interlocutor.Custom2('AppropriateGreeting', ROOT.Char)]"
 grand_ambitions.0500.wrong_title:0 "É um prazer informar que [Select_CString( previous_story_target.IsFemale, 'a', 'o' )] [previous_story_target.GetTitledFirstName] não detém mais [story.Var('target_title').GetName]. Nossos planos devem continuar para depor [Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetTopLiege.GetTitledFirstName]?"
 grand_ambitions_ally_joins_war:0 "Aliado se Junta à Guerra: [joiner.GetTitledFirstName]"
 grand_ambitions_header:0 "Grandes Ambições"
 grand_ambitions_start_depose_scheme_tt:0 "Inicia um [scheme|E] de [GetScheme('depose').GetTypeName] contra [THIS.Char.GetTopLiege.GetShortUIName] com [GetModifier('scheme_grand_ambitions_modifier').GetNameWithTooltip]"
 scheme_grand_ambitions_bribed_functionaries_modifier:0 "Funcionários Corrompidos"
 scheme_grand_ambitions_bribed_functionaries_modifier_desc:0 "Funcionários dentro do palácio imperial, desiludidos com o reinado atual, forjam discretamente alianças, preparando o terreno para uma transição de poder suave."
 scheme_grand_ambitions_bribed_merchants_modifier:0 "Mercadores Corrompidos"
 scheme_grand_ambitions_bribed_merchants_modifier_desc:0 "Mercadores e marinheiros, leais à causa, levam a palavra por todo o império, garantindo uma comunicação rápida e segura."
 scheme_grand_ambitions_bribed_scribes_modifier:0 "Escribas Corrompidos"
 scheme_grand_ambitions_bribed_scribes_modifier_desc:0 "Escribas imperiais, encarregados dos segredos do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip|l], alteram sutilmente as comunicações, encobrindo o progresso do esquema de olhos vigilantes."
 scheme_grand_ambitions_embezzling_modifier:0 "Desvio de Fundos"
 scheme_grand_ambitions_modifier:0 "Ambições Formidáveis"
 scheme_grand_ambitions_modifier_desc:0 "Este personagem tem seus olhos voltados para um prêmio muito grande."
 scheme_grand_ambitions_powerful_family_modifier:0 "Aliança de Famílias Poderosas"
 scheme_grand_ambitions_powerful_family_modifier_desc:0 "Uma aliança com outra casa poderosa do reino impulsionou este esquema na rota rápida para o sucesso."
