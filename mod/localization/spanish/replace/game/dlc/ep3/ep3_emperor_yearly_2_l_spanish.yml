l_spanish:
 2410_noble_family_tt:0 "Nova Família Nobre"
 2410_noble_family_tt_desc:0 "[new_title.GetHolder.GetShortUIName|U] estabeleceu a [noble_family|E] [new_title.GetHolder.GetTopLiege.GetPrimaryTitle.GetAdjective] de [new_title.GetHolder.GetHouse.GetBaseName|V]."
 2420_noble_family_tt:0 "Nova Família Dominante"
 2420_noble_family_tt_desc:0 "A família [noble_family_head.GetHouse.GetBaseName] agora é considerada a [dominant_family|E] em [noble_family_head.GetTopLiege.GetPrimaryTitle.GetName|l]."
 8020_powerful_family_desc:0 "[house|E] [new_family.GetHouse.GetBaseName|V] agora é considerada uma [powerful_family|E] [new_family.GetTopLiege.GetPrimaryTitle.GetAdjective]"
 8020_powerful_family_tt:0 "Nova Família Poderosa"
 AMOR_GLOSS:0 "\"O amor conquista tudo\" é uma famosa e frequentemente mal citada linha de Virgílio."
 ARS_LONGA_GLOSS:0 "\"A vida é curta, a arte é longa para se aprender\" é um aforismo atribuído a Hipócrates."
 DYNATOI_GLOSS:0 "Os Poderosos, em particular a nobreza provincial que monopoliza a terra e os cargos públicos."
 GRAMMATIKOS_GLOSS:0 "O sistema educacional bizantino foi em grande parte herdado da Roma clássica e era dividido em 3 níveis: os #EMP grammatistes#! ensinavam as crianças pequenas o básico da leitura, escrita e contagem; os #EMP grammatikos#! ensinavam crianças mais velhas a literatura e a língua grega clássica; finalmente, os #EMP rhetor#! ensinavam adolescentes retórica — a arte de falar claramente e com persuasão."
 MARSHAL_INCREASE_CONTROL_MIME_MODIFIER:0 "Apoiado por um Mímico Popular"
 MIMOS_GLOSS:0 "A exata natureza de um mimos bizantino, geralmente traduzida como #EMP mímico#! por simplicidade, é difícil de definir. O nome abrange uma ampla gama de entretenedores cômicos: atores de pantomimas mitológicas, malabaristas, acrobatas, dançarinos, bufões e até mesmo praticantes de uma forma primitiva de burlesco."
 PANTA_RHEI_GLOSS:0 "\"Tudo flui\" é uma famosa síntese da filosofia de Heráclito sobre o universo."
 SCHEME_OWE_FREEDOM:0 "Devo a você minha liberdade: $VALUE|+0=$"
 SOPHON_GLOSS:0 "\"A sabedoria reside na clareza,\" de Eurípides."
 TRUCE_COLLABORATION:0 "Acordos de Paz"
 constantinople_birthday_flag_desc:0 "Celebração do Aniversário da Fundação de Constantinopla"
 constantinople_birthday_flag_tt:0 "Organizar uma Atividade [GetActivityType('activity_chariot_race').GetName] nos próximos 5 anos é 50% mais barato"
 court_position_famous_mime:0 "Mímico Popular"
 ep3_emperor_yearly.2000.a:0 "Um dia glorioso para todos os romanos!"
 ep3_emperor_yearly.2000.desc_alexandria:0 "\n\n[county.GetNameNoTier], a joia do Egito, está de volta às mãos romanas! Sede do Pentárquio, capital milenar da cultura, uma vez entre os centros mais ativos de debate filosófico e teológico cristão, arruinada e abandonada pelas garras gananciosas dos infiéis.\n\nMais uma vez a cidade de Alexandre se levantará junto com o verdadeiro Império!"
 ep3_emperor_yearly.2000.desc_alexandria_not_christ:0 "\n\n[county.GetNameNoTier], a joia do Egito, está de volta às mãos romanas!\n\nUma vez a sede de todo o conhecimento e sabedoria do mundo, foi duramente atingida por perseguições cristãs, a ponto de pouco restar de sua antiga glória. Pouco, mas não nada, e com essa compreensão, reconstruiremos uma cidade digna de seu passado!"
 ep3_emperor_yearly.2000.desc_antioch:0 "\n\n[county.GetNameNoTier]: sede do Pentárquio, evangelizada pelo próprio São Pedro, onde o cristianismo deu seus primeiros passos oficiais. Uma vez uma cidade próspera de fé e comércio, foi duramente atingida por séculos de atrito nas fronteiras, de modo que agora é apenas uma sombra de sua antiga glória.\n\nNo entanto, uma sombra gloriosa pode ser trazida de volta à grandeza por uma mão orientadora forte, como a minha!"
 ep3_emperor_yearly.2000.desc_antioch_not_christ:0 "\n\n[county.GetNameNoTier]: uma vez uma cidade próspera de fé e comércio e uma orgulhosa capital do cristianismo, perdida e recuperada pelos fiéis muitas vezes, foi duramente atingida por séculos de atrito nas fronteiras, de modo que agora é apenas uma sombra de sua antiga glória.\n\nNo entanto, uma sombra gloriosa pode ser trazida de volta à grandeza por uma mão orientadora forte, como a minha!"
 ep3_emperor_yearly.2000.desc_bari:0 "\n\n[county.GetNameNoTier] sempre foi um importante porto no Mediterrâneo, mas dificilmente uma fortaleza estratégica — até a chegada dos árabes.\n\nSua invasão deixou claro que, para garantir a segurança tanto do Sul da Itália quanto dos Bálcãs contra a conquista, precisamos de um ponto de apoio forte e defensável na Itália. Agora que [county.GetNameNoTierNoTooltip] está novamente em nossas mãos, nos esforçaremos para usá-lo como o ponto central de nossa defesa ocidental."
 ep3_emperor_yearly.2000.desc_carthago:0 "\n\nHoje em dia, o principal assentamento da área é [county.GetNameNoTier], mas não esquecemos o tempo em que os romanos controlavam estas costas a partir de Cartago — uma vez um inimigo mortal, mais tarde uma próspera cidade de fé e cultura, agora uma casca vazia de sua grandeza anterior.\n\nEmbora possa ser tarde demais para restaurar a cidade à sua antiga glória, a posição conveniente desta área certamente se mostrará vital para a restauração da presença romana na África."
 ep3_emperor_yearly.2000.desc_carthago_spartaria:0 "\n\nHoje em dia, os locais chamam esta área de [county.GetNameNoTier]. No entanto, Justiniano I a nomeou Carthago Spartaria e a fez um dos principais centros da presença romana reestabelecida no Ocidente.\n\nSéculos se passaram desde que a cidade caiu nas mãos bárbaras pela última vez; no entanto, à medida que nosso controle é reinstaurado na Ibéria, a glória de Justiniano parece mais uma vez ao nosso alcance."
 ep3_emperor_yearly.2000.desc_chandax:0 "\n\nOs árabes que conquistaram Creta pela primeira vez mudaram sua capital para a antiga Heraklion e a chamaram de [county.GetNameNoTier], enquanto a capital original, Gortyna, declinou.\n\nRecuperar o controle do novo coração da ilha é um passo fundamental para garantir segurança no Mediterrâneo e prosperidade para todo o Império, pois comerciantes e piratas agora podem ser detidos e reorientados, e frotas invasoras podem ser interceptadas."
 ep3_emperor_yearly.2000.desc_edessa:0 "\n\nA famosa cidade de [county.GetNameNoTier] — entre os primeiros centros de evangelização cristã, sede de um Concílio Ecumênico, palco do martírio de muitos gloriosos Santos — tem sido contestada entre o Império e seus vizinhos invasores por muitos séculos.\n\nMais uma vez, agora está retornando aos cuidados do legítimo Imperador, e desta vez será para valer, que [ROOT.Char.GetFaith.HighGodName] assim o queira."
 ep3_emperor_yearly.2000.desc_edessa_not_christ:0 "\n\n[county.GetNameNoTier]: uma vez a capital da Província de Osroene, esta cidade se destacou orgulhosamente como a barreira que separava romanos e sassânidas por 400 anos antes de cair diante do avanço do Islã.\n\nSéculos se passaram desde essa época, e [county.GetNameNoTierNoTooltip] tem sido contestada entre o Império e nossos vizinhos durante todo esse tempo. Que este glorioso dia de conquista seja o último que a cidade verá!"
 ep3_emperor_yearly.2000.desc_frontier:0 "\n\nHoje em dia, os locais chamam esta área de [county.GetNameNoTier]. Embora por pouco tempo, os romanos caminharam estas costas quando o Imperador [GetScriptedCharacterByHistoryID( '145279' ).GetFirstName] liderou suas valentes legiões para dentro da Mesopotâmia.\n\nEsta foi uma vez a última fronteira do nosso Império para o Leste, e assim é novamente hoje."
 ep3_emperor_yearly.2000.desc_hadrians_wall:0 "\n\nOs bárbaros que ocuparam esta área após a partida da última Águia Romana a chamaram de [county.GetNameNoTier]. Uma vez, a poderosa Muralha do Imperador Adriano foi suficiente para manter os bárbaros fora do Império, e essas terras foram a última fronteira da civilização ao norte.\n\nAgora, a Muralha está em ruínas, e os bárbaros se espalharam por toda a terra por séculos. Mas não mais. Hoje, a fronteira de Adriano se ergue novamente!"
 ep3_emperor_yearly.2000.desc_intro:0 "Os exércitos brilhantes dos romanos marcham novamente para as terras que nossos ancestrais um dia ocuparam, e a glória por fazer isso acontecer pertence exclusivamente a mim."
 ep3_emperor_yearly.2000.desc_jerusalem:0 "\n\n[county.GetNameNoTier], a Cidade Santa, finalmente retornou às mãos cuidadosas do Verdadeiro Imperador, representante legítimo de nosso Senhor na Terra.\n\nA Sede do Pentárquio será em breve restaurada, e multidões de peregrinos poderão visitar o berço do cristianismo com segurança novamente, sob a proteção das armas romanas."
 ep3_emperor_yearly.2000.desc_jerusalem_not_christ:0 "\n\n[county.GetNameNoTier], a Cidade Santa de três religiões. Muitos a cobiçaram, mas, desde os primeiros dias do Império, só teve um governante legítimo: o Imperador.\n\nEnquanto garantimos sua segurança e paz novamente, podemos esperar receber multidões de peregrinos de todos os cantos do Império e além!"
 ep3_emperor_yearly.2000.desc_milan:0 "\n\nNossos ancestrais nomearam esta área [county.GetNameNoTier] a partir dos bárbaros que a subtraíram do Império, os Longobardos. Um de seus principais centros, Mediolanum, foi a capital da Parte Ocidental do Império sob os Tetrarcas, e Constantino, o Grande, emitiu o Édito concedendo liberdade religiosa a todo o Império a partir desta mesma cidade.\n\nEmbora os Longobardos tenham mudado sua capital, a área ainda é próspera e servirá como uma excelente fortaleza no Norte da Itália."
 ep3_emperor_yearly.2000.desc_ravenna:0 "\n\n[county.GetNameNoTier] foi a sede dos últimos Imperadores quando um Imperador legítimo ainda ocupava o trono no caótico Ocidente devastado por bárbaros. Portanto, era natural que o Imperador Justiniano I colocasse o centro da administração romana reestabelecida lá.\n\nSéculos se passaram desde que os Longobardos empurraram os últimos romanos para fora do Norte da Itália; no entanto, uma nova era de paz, prosperidade e unidade acaba de começar."
 ep3_emperor_yearly.2000.desc_rome:0 "\n\n[county.GetNameNoTier]. A Cidade Imortal. Primeira capital e berço do nosso Império.\n\nEmbora a autoridade imperial tenha abandonado há muito esta terra em favor de Constantinopla — a Nova Roma, e o pentárquio local tenha preenchido ilegalmente o vazio de poder subsequente, a entrega da Cidade ao único e legítimo Imperador é motivo de alegria. Nova grandeza aguarda o Império agora que tomamos tal passo monumental em direção ao Ocidente."
 ep3_emperor_yearly.2000.desc_syracuse:0 "\n\n[county.GetNameNoTier]: porto comercial, centro de evangelização cristã no Ocidente e capital ocidental do Imperador Constans II.\n\nO que antes era a última fortaleza romana contra a conquista muçulmana da Sicília também caiu, mas agora foi restaurado! Glória e riquezas aguardam o conquistador, e um novo passo foi dado em direção à restauração do legítimo Império."
 ep3_emperor_yearly.2000.desc_tingis:0 "\n\nHoje em dia, os locais chamam esta cidade de [county.GetNameNoTier], mas nós a conhecíamos como Tingis, capital da província de Mauritania Tingitânia.\n\nUma vez um próspero centro de poder romano, a cidade foi perdida para nós e para a Luz da Verdadeira Fé por séculos, após as hordas dos vândalos que vieram punir nossa corrupção invadirem primeiro, seguidos pelo Califado Muçulmano. Felizmente para eles, a longa era de dominação bárbara acabou, e a Paz Imperial foi restabelecida."
 ep3_emperor_yearly.2000.desc_tours:0 "\n\nHoje em dia, os locais chamam esta área de [county.GetNameNoTier], a partir do agora esquecido nome latino de seu assentamento principal, Civitas Turonum. Nos últimos dias da Parte Ocidental do Império, a cidade era uma verdadeira metrópole, dominando toda a Província de Lugdunum.\n\nDesde então, sua importância só diminuiu parcialmente, já que peregrinos cristãos ainda a visitam em seu caminho para Santiago, e ela atuou como um baluarte contra duas invasões: a dos árabes e a dos vikings. O verdadeiro espírito romano ainda persiste nessas terras, e eles o redescobrirão, gostem ou não!"
 ep3_emperor_yearly.2000.desc_trier:0 "\n\nHoje em dia, os locais chamam esta cidade de [county.GetNameNoTier], mas ainda nos lembramos de como nosso povo costumava chamá-la: Augusta Treverorum, sede do tetrarca Constâncio Cloro, pai do fundador de nossa Nova Roma, Constantino, o Grande.\n\nInvasores germânicos há muito a tomaram, mais recentemente até se autodenominando \"Imperadores\", abusando de um título que não pertence a bárbaros. Não importa mais. À medida que minhas leais tropas reconquistam o que uma vez foi nosso por direito, todos os pretendentes serão aniquilados, e apenas um Império legítimo permanecerá."
 ep3_emperor_yearly.2000.t:0 "[county.GetNameNoTierNoTooltip] Reconquistado"
 ep3_emperor_yearly.2010.a:0 "As necessidades políticas do Império superam o indivíduo."
 ep3_emperor_yearly.2010.b2:0 "Um exemplo brilhante de devoção ao bem do povo."
 ep3_emperor_yearly.2010.b:0 "Seu exemplo brilhante de sacrifício cristão está sempre em minhas orações."
 ep3_emperor_yearly.2010.c:0 "Não cabe a você julgar um Imperador."
 ep3_emperor_yearly.2010.desc:0 "Há um burburinho distinto na corte hoje. #EMP Vergonhoso#!. Fofocas não combinam com este salão majestoso.\n\n\"Pobre [sent_off.GetFirstName]...\"\n\"... Sozinha entre aqueles [spouse.GetCulture.GetNameNoTooltip] #EMP bárbaros#!...\"\n\"... Destino pior que a morte...\"\n\"... Ouvi dizer que eles nem usam #EMP garfos#!!!\"\n\nNo entanto, reconheço claramente [gossip_1.Custom2('MyCharacterIntroduction', ROOT.Char)] e [gossip_2.Custom2('MyCharacterIntroduction', ROOT.Char)] fofocando em um canto. Ao fixar meu olhar severo sobre eles, eles imediatamente se calam, mas ouvi o suficiente para saber o exato tópico de sua conversa."
 ep3_emperor_yearly.2010.t:0 "O Destino de uma [sent_off.Custom('GetPrincessPrince')]"
 ep3_emperor_yearly.2020.a.tt2:0 "No final do período de arrependimento, você perderá [target_criminal_trait.GetName(GetPlayer)]"
 ep3_emperor_yearly.2020.a.tt:0 "Você começa publicamente e oficialmente um caminho de arrependimento para ter seus pecados perdoados!"
 ep3_emperor_yearly.2020.a:0 "Eu me arrependo e renuncio aos meus pecados!"
 ep3_emperor_yearly.2020.b:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitleAsNameNoTooltip] escolhe [Select_CString( patriarch.IsFemale, 'a', 'o' )] [patriarch.GetTitleAsNameNoTooltip], não o contrário."
 ep3_emperor_yearly.2020.desc:0 "Os primeiros dias do meu reinado como [ROOT.Char.GetTitleAsNameNoTooltip] foram frenéticos, mas finalmente é hora de eu receber formalmente a coroa e a bênção de [patriarch.GetTitleAsNameNoTooltip] nos salões santificados de [ROOT.Char.Custom('TriumphReligiousLocation')].\n\n[patriarch.GetTitledFirstName|U] me aguarda na entrada — uma expressão severa no rosto [patriarch.GetHerHim] — as portas resolutamente fechadas atrás [patriarch.GetHerHim].\n\n\"Por que você veio, [ROOT.Char.GetFirstNameNoTooltip]? Você é indigno! Não há lugar aqui para pessoas como você!\""
 ep3_emperor_yearly.2020.t:0 "Uma Cabeça Indigna da Coroa"
 ep3_emperor_yearly.2021.a:0 "Sou [ROOT.Char.GetTitleAsNameNoTooltip] por direito humano e divino."
 ep3_emperor_yearly.2021.desc:0 "Um ano inteiro se passou desde que [patriarch.GetTitledFirstName] me repreendeu severamente por meus pecados, e eu humildemente comecei a expiar para ser digno da coroa que carrego pela glória de [ROOT.Char.GetFaith.HighGodName]."
 ep3_emperor_yearly.2021.desc_end:0 "\n\n\"A paz esteja com você, [ROOT.Char.GetTitledFirstNameNoTooltip]! Seu crescimento espiritual foi grande, seu arrependimento genuíno, e seus pecados, portanto, estão perdoados. Seu reinado é abençoado por [ROOT.Char.GetFaith.HighGodNameAlternate]!\""
 ep3_emperor_yearly.2021.desc_patriarch:0 "\n\nHoje nos encontramos novamente, mas um sorriso benevolente ilumina o rosto [patriarch.GetHerHim]."
 ep3_emperor_yearly.2021.desc_patriarch_new:0 "\n\n[patriarch.GetTitledFirstNameNoTooltip|U] faleceu desde então, mas seu sucessor, [patriarch_portrait.GetFirstName], está agora na minha frente para me conceder sua bênção."
 ep3_emperor_yearly.2021.t:0 "Arrependimento"
 ep3_emperor_yearly.2030.a.tt:0 "Substitua o atual [patriarch.GetTitleAsNameNoTooltip] por um que o apoie"
 ep3_emperor_yearly.2030.a:0 "Então é hora de uma mudança!"
 ep3_emperor_yearly.2030.b:0 "Vou provar meu valor."
 ep3_emperor_yearly.2030.desc:0 "O poder pertence a quem é ousado o suficiente para agarrá-lo, e [ROOT.Char.GetFaith.HighGodName] favorece os audazes. [ROOT.Char.GetFaith.HighGodNameSheHe|U] claramente favoreceu #EMP eu#!, pois finalmente posso me chamar de [ROOT.Char.GetTitleAsNameNoTooltip]. [patriarch.GetTitledFirstName|U], no entanto, parece discordar dos meus meios.\n\n\"Você percorreu um caminho de sangue para subir ao topo, [ROOT.Char.GetFirstNameNoTooltip], e se rebelou contra seu governante legítimo, [ROOT.Char.GetTitleAsNameNoTooltip] [predecessor.GetFirstName]! Você realmente achou que [ROOT.Char.GetFaith.HighGodNameAlternate] abençoaria um #EMP usurpador#!?\"\n\nNão preciso que o [patriarch.GetTitleAsNameNoTooltip] goste de mim, mas não posso negar que isso tornará as coisas mais difíceis..."
 ep3_emperor_yearly.2030.t:0 "Usurpador"
 ep3_emperor_yearly.2040.a:0 "Então outra pessoa irá."
 ep3_emperor_yearly.2040.b:0 "Uma doação generosa poderia ajudar?"
 ep3_emperor_yearly.2040.c.failure.tt:0 "[patriarch.GetTitledFirstNameNoTooltip|U] não abençoou seu casamento"
 ep3_emperor_yearly.2040.c.failure:0 "[patriarch.GetTitledFirstNameNoTooltip|U] não está convencido"
 ep3_emperor_yearly.2040.c.success.tt:0 "[patriarch.GetTitledFirstNameNoTooltip|U] abençoou seu casamento"
 ep3_emperor_yearly.2040.c.success:0 "[patriarch.GetTitledFirstNameNoTooltip|U] fica impressionado com seu conhecimento da lei religiosa"
 ep3_emperor_yearly.2040.c:0 "Tenho certeza de que é um mal-entendido."
 ep3_emperor_yearly.2040.desc:0 "É de conhecimento público que [new_wife.GetTitledFirstName] não é [Select_CString( new_wife.IsFemale, 'minha primeira', 'meu primeiro' )] [new_wife.GetWifeHusband]. Nem minha segunda. Meu mais novo casamento, após a partida infeliz dos meus cônjuges anteriores, causou grande escândalo nos círculos religiosos liderados por [patriarch.GetTitledFirstName].\n\n\"CIDADANIA! Castidade e fidelidade à memória do cônjuge com o qual [ROOT.Char.GetFaith.HighGodName] uniu vocês! Esta é a lei que [ROOT.Char.GetFaith.HighGodNameAlternate] deu à humanidade! Como eu poderia aprovar tal abominação aos olhos de [ROOT.Char.GetFaith.HighGodName]?!\""
 ep3_emperor_yearly.2040.t:0 "Casado Novamente"
 ep3_emperor_yearly.2050.a:0 "Avante, para a glória eterna!"
 ep3_emperor_yearly.2050.desc:0 "Este dia será lembrado como um grande dia para a Casa [ROOT.Char.GetHouse.GetBaseName]. Desde os dias de [ROOT.Char.GetTitleAsNameNoTooltip] [last_emperor.GetFirstName] não havia uma [ROOT.Char.GetHouse.GetBaseNameNoTooltip] sentada no trono de [title.GetName]!"
 ep3_emperor_yearly.2050.desc_body:0 "[last_emperor.GetFirstNameNoTooltip] deixou uma marca na história. Agora, dou meus primeiros passos para deixar a minha!"
 ep3_emperor_yearly.2050.desc_diplo:0 "\n\nRenomado em todo o mundo como um diplomata,"
 ep3_emperor_yearly.2050.desc_fallback:0 "\n\nEmbora não seja a marca mais impressionante,"
 ep3_emperor_yearly.2050.desc_first:0 "Hoje marca um marco histórico para a Casa [ROOT.Char.GetHouse.GetBaseName]. Nunca antes um membro orgulhoso de nossa família se sentou no trono de [title.GetName]! Nunca isso aconteceu — e raramente sonhamos com isso — antes de #EMP eu#!."
 ep3_emperor_yearly.2050.desc_first_accomplish:0 "\n\nMeus parentes me exortam a estabelecer um legado para as gerações. Em séculos, o mundo pode ainda rever todos os nomes da Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip], e mais do que tudo — o grande [ROOT.Char.GetTitledFirstNameNoTooltipRegnal] que os levou à glória!"
 ep3_emperor_yearly.2050.desc_intrigue:0 "\n\nTemido por sua astúcia e táticas traiçoeiras,"
 ep3_emperor_yearly.2050.desc_learning:0 "\n\nAmplamente admirado por seu conhecimento e sabedoria,"
 ep3_emperor_yearly.2050.desc_martial:0 "\n\nRespeitado como um general astuto,"
 ep3_emperor_yearly.2050.desc_prowess:0 "\n\nPrincipalmente lembrado por sua força sobre-humana e feitos no campo de batalha,"
 ep3_emperor_yearly.2050.desc_stewardship:0 "\n\nUniversamente reconhecido como um administrador competente das terras [last_emperor.GetHerHim],"
 ep3_emperor_yearly.2050.t2:0 "Uma [ROOT.Char.GetHouse.GetBaseNameNoTooltip] de Volta ao Trono"
 ep3_emperor_yearly.2050.t:0 "[ROOT.Char.GetHouse.GetBaseNameNoTooltip] Toma o Trono"
 ep3_emperor_yearly.2060.a:0 "Somente as maiores celebrações serão suficientes!"
 ep3_emperor_yearly.2060.b:0 "Então, uma grande celebração está em ordem!"
 ep3_emperor_yearly.2060.c:0 "Qualquer celebração terá que esperar."
 ep3_emperor_yearly.2060.desc:0 "Aqui vem [2060_councillor.Custom2('MyCharacterIntroduction', ROOT.Char)] com uma expressão esperançosa no rosto [2060_councillor.GetHerHim].\n\n\"Meu [ROOT.Char.GetTitleAsNameNoTooltip], como você certamente sabe, o aniversário da fundação de nossa gloriosa Rainha das Cidades, [queen_city.GetNameNoTier], cai no dia 11 de maio, que é muito mais cedo do que se poderia pensar! O povo tem falado e reclamado desde que nenhuma celebração foi realizada por anos.\n\n\"Devemos organizar festividades dignas da grande cidade de Constantino?\""
 ep3_emperor_yearly.2060.desc_century:0 "Aqui vem [2060_councillor.Custom2('MyCharacterIntroduction', ROOT.Char)], com um salto animado em seu passo.\n\n\"Meu [ROOT.Char.GetTitleAsNameNoTooltip], como você certamente sabe, o próximo aniversário da fundação de nossa gloriosa Rainha das Cidades, [queen_city.GetNameNoTier], marcará #EMP um centenário#! desde o remoto 324, quando Constantino, o Grande, a escolheu como sua Nova Roma.\n\n\"É a ocasião perfeita para uma grande celebração como nenhuma outra! O povo irá amá-lo, e a história lembrará sua contribuição.\""
 ep3_emperor_yearly.2060.t:0 "A Rainha das Cidades"
 ep3_emperor_yearly.2070.a:0 "Todos os presentes são bem-vindos."
 ep3_emperor_yearly.2070.b.failure.tt:0 "$ep3_emperor_yearly.2070.b.success.tt$"
 ep3_emperor_yearly.2070.b.failure:0 "[ambassador.GetFirstNameNoTooltip|U] precisa de algum #EMP convencimento do tipo dourado#! para ficar"
 ep3_emperor_yearly.2070.b.success.tt:0 "[ambassador.GetFirstNameNoTooltip|U] Recrutado"
 ep3_emperor_yearly.2070.b.success:0 "[ambassador.GetFirstNameNoTooltip|U] fica impressionado com seu reino e aceita sua oferta para ficar"
 ep3_emperor_yearly.2070.b.tt:0 "[ambassador.GetFirstNameNoTooltip|U] é um excelente diplomata que poderia me servir bem!"
 ep3_emperor_yearly.2070.b:0 "Por que #EMP você#! não fica em vez disso?"
 ep3_emperor_yearly.2070.c.tt:0 "Jogue os presentes sobre a pilha com todos os outros e mande as bestas para a cozinha, ou algo assim."
 ep3_emperor_yearly.2070.c:0 "Certo, legal... Dispensa-se."
 ep3_emperor_yearly.2070.desc:0 "[Select_CString( ambassador.IsFemale, 'A', 'O' )] [ambassador.GetWomanMan] à minha frente parece vir de muito longe, julgando pela vestimenta exótica e pela natureza dos presentes que [ambassador.GetSheHe] traz: ouro, marfim, sal...\n\nQuando a última oferta atravessa a porta, no entanto, todos os meus pensamentos racionais param — #EMP o que, em nome de [ROOT.Char.GetFaith.HealthGodName], é aquele animal?!#! Eu só consigo descrevê-lo como um gigantesco #EMP cavalo#! com manchas e um longo pescoço...\n\n\"Grande [ROOT.Char.GetTitleAsNameNoTooltip], trago presentes da terra de [ambassador_liege.GetPrimaryTitle.GetBaseNameNoTier], incluindo este majestoso animal que chamamos de #EMP girafa#!. Por favor, aceite as humildes homenagens [Select_CString( ambassador_liege.IsFemale, 'da minha', 'do meu' )] [ambassador_liege.GetLadyLord].\""
 ep3_emperor_yearly.2070.t:0 "Presentes Exóticos"
 ep3_emperor_yearly.2080.a.tt:0 "Você colherá os benefícios quando a construção da escola estiver concluída, em 5 anos."
 ep3_emperor_yearly.2080.a:0 "Uma burocracia bem afinada sempre precisa de novos funcionários."
 ep3_emperor_yearly.2080.b:0 "Temos outras prioridades agora."
 ep3_emperor_yearly.2080.desc:0 "[school_proposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se pronuncia, escolhendo suas palavras com graça medida,\n\n\"O povo de [school_county.GetNameNoTier] notou os investimentos feitos em seu recente programa de construções. Embora todos estejam obviamente orgulhosos do crescimento de nossa amada cidade, algumas melhorias certamente ressoarão mais com seus súditos, tanto os grandes quanto os humildes.\""
 ep3_emperor_yearly.2080.desc_byz:0 "\n\nRecomendaria que você construísse uma escola financiada pelo império com alguns [Glossary( 'grammatikoi', 'GRAMMATIKOS_GLOSS' )] altamente respeitados; quanto mais plebeus puderem buscar uma boa educação, mais se juntarão às fileiras da administração imperial — uma bênção para nós e uma melhoria nas condições sociais para eles!"
 ep3_emperor_yearly.2080.desc_gen:0 "\n\nPor exemplo, financiar uma escola onde pessoas de todas as origens sociais possam estudar para entrar na administração imperial!"
 ep3_emperor_yearly.2080.t:0 "Uma Escola para o Povo"
 ep3_emperor_yearly.2090.a.tt:0 "A ajuda de [mime.GetFirstNameNoTooltip] aumenta a eficácia da tarefa de conselho $councillor_marshal$ de $task_increase_control$."
 ep3_emperor_yearly.2090.a:0 "Você pode ajudar a conquistar [control_target.GetNameNoTooltip]."
 ep3_emperor_yearly.2090.b.tt:0 "O talento e a reputação de [mime.GetFirstNameNoTooltip] aumentam sua aptidão como $court_jester_court_position$."
 ep3_emperor_yearly.2090.b:0 "Somente minha corte é digna desse nível de entretenimento."
 ep3_emperor_yearly.2090.c:0 "Não tenho tempo para #EMP mímicos#!."
 ep3_emperor_yearly.2090.desc:0 "À minha frente está um rosto de alguma forma familiar; é [mime.GetFirstName], o [Glossary( 'mimos', 'MIMOS_GLOSS' )] mais popular entre o povo.\n\n\"Grande [ROOT.Char.GetTitleAsNameNoTooltip], não preciso de apresentações — meu nome é conhecido e amado por todos. O Hipódromo fica em silêncio quando eu me apresento e aplaude quando eu digo para aplaudirem. Você conhece meu domínio sobre as multidões; ambos temos algo a ganhar com uma colaboração mais estreita.\""
 ep3_emperor_yearly.2090.t:0 "Um Mímico Popular"
 ep3_emperor_yearly.2100.a.crit_fail.tt:0 "Versão Hostil Encontrada"
 ep3_emperor_yearly.2100.a.crit_fail:0 "Eles usam uma versão ainda mais antiga contra nós"
 ep3_emperor_yearly.2100.a.failure.tt:0 "Versão Rejeitada"
 ep3_emperor_yearly.2100.a.failure:0 "Nossa versão do tratado é rejeitada"
 ep3_emperor_yearly.2100.a.success.tt:0 "Versão Aceita"
 ep3_emperor_yearly.2100.a.success:0 "Nossa versão do tratado é aceita"
 ep3_emperor_yearly.2100.a:0 "Faça isso."
 ep3_emperor_yearly.2100.angry_error_log:0 ""
 ep3_emperor_yearly.2100.b:0 "Informe [neighbor.GetFirstNameNoTooltip]: vamos encontrar um acordo."
 ep3_emperor_yearly.2100.c:0 "Enterre todas as evidências."
 ep3_emperor_yearly.2100.desc:0 "[chancellor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima do trono com uma pilha de documentos nos braços [chancellor.GetHerHim].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')], estive analisando alguns tratados com nosso vizinho [neighbor.GetTitledFirstName]. Como parece, o tratado de fronteira referente a [contested_county.GetName] existe em várias cópias não coincidentes, algumas das quais são muito mais favoráveis a nós do que a que estamos atualmente deferindo!\n\n\"Com sua permissão, gostaria de tentar fazer valer a versão mais favorável como o tratado oficial adotado por todas as partes envolvidas!\""
 ep3_emperor_yearly.2100.t:0 "Um Tratado de Fronteira"
 ep3_emperor_yearly.2110.a:0 "Seus serviços são muito necessários na administração local."
 ep3_emperor_yearly.2110.b:0 "Precisamos de você aqui na capital."
 ep3_emperor_yearly.2110.c:0 "São os [merchant.GetCulture.GetCollectiveNounNoTooltip] que deveriam aprender os costumes da Capital."
 ep3_emperor_yearly.2110.desc:0 "\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip|U], eu represento um grupo de mercadores de [provincial_county.GetNameNoTier]. Tendo vivido longamente nesta terra, comerciando com os locais e com funcionários da Capital, estamos bem cientes das dificuldades em lidar com populações não integradas, e equipados de forma única para ajudar.\n\nPortanto, gostaríamos de oferecer nossos serviços como tradutores e intérpretes oficiais.\""
 ep3_emperor_yearly.2110.desc_other:0 "O peticionário agora à minha frente não parece ser [ROOT.Char.GetCulture.GetNameNoTooltip]. Algum #EMP provincial#!, eu acho. No momento em que [merchant.GetSheHe] começa a falar, sou atingido por um sotaque bárbaro, mas vagamente familiar."
 ep3_emperor_yearly.2110.desc_same:0 "Reconheço imediatamente a origem do peticionário à minha frente: [merchant.GetSheHe] é [merchant.GetCulture.GetNameNoTooltip], assim como eu. No momento em que [merchant.GetSheHe] começa a falar, sou atingido por um sotaque familiar."
 ep3_emperor_yearly.2110.t:0 "Mediadores de [provincial_county.GetNameNoTierNoTooltip]"
 ep3_emperor_yearly.2120.a:0 "Todos devemos aprender com [the_byz.GetFirstNameNoTooltip]!"
 ep3_emperor_yearly.2120.b:0 "Não toleraremos essa bobagem estrangeira."
 ep3_emperor_yearly.2120.c:0 "Honestamente? Ninguém se importa."
 ep3_emperor_yearly.2120.desc:0 "[complainer.GetTitledFirstName] parece bastante irritado com algo.\n\n\"Meu [ROOT.Char.GetTitleAsNameNoTooltip|U], a corte está agitada com a indignação em relação a [the_byz.Custom2('YourCharacterIntroduction', ROOT.Char)]! O comportamento arrogante e pretensioso [the_byz.GetHerHim|U] é evidente, e desde a chegada de [the_byz.GetSheHe], [the_byz.GetSheHe] tem introduzido costumes #EMP luxuosos#! na corte: [the_byz.GetSheHe] janta com garfos de ouro, recusa-se a se lavar coletivamente como nós, perfuma o quarto com ervas suspeitas e usa roupas de seda pecaminosamente macias!\n\n\"Você deve pôr fim a essa loucura, antes que a corrupção moral [the_byz.GetHerHim] se espalhe!\""
 ep3_emperor_yearly.2120.t:0 "Pretensão Estrangeira"
 ep3_emperor_yearly.2130.a:0 "Você está aqui totalmente perdoado."
 ep3_emperor_yearly.2130.b:0 "Você me apoiará."
 ep3_emperor_yearly.2130.c.tt:0 "[prisoner.GetFirstNameNoTooltip] será forçado a aceitar ser um agente em todos os seus esquemas."
 ep3_emperor_yearly.2130.c:0 "Sua vida pertence a mim agora."
 ep3_emperor_yearly.2130.d:0 "Você me enviará tropas."
 ep3_emperor_yearly.2130.desc:0 "\"Generoso, nobre [ROOT.Char.GetTitleAsNameNoTooltip|U], ouça meu apelo.\" Este peticionário está flanqueado por dois guardas, e as mãos [prisoner.GetHerHim] estão amarradas com segurança. Reconheço meu prisioneiro, [prisoner.GetTitledFirstName].\n\n\"Há muito tempo languidezco em cativeiro. Por favor, mostre-me misericórdia e liberte-me! Nada é mais caro ao meu coração do que minha liberdade, então nenhum preço será alto demais por ela. Exija o que quiser de mim, e eu obedecerei!\""
 ep3_emperor_yearly.2130.e:0 "Negado. Fora da minha vista agora."
 ep3_emperor_yearly.2130.t:0 "Um Apelo pela Liberdade"
 ep3_emperor_yearly.2140.a:0 "Tenho certeza de que os mortos não se importarão."
 ep3_emperor_yearly.2140.b:0 "Não me rebaixarei tanto!"
 ep3_emperor_yearly.2140.desc:0 "Gerir [ROOT.Char.GetPrimaryTitle.GetDefinitiveName|l] é um negócio caro, e talvez eu tenha sido um pouco descuidado com nossas finanças. Dívidas têm se acumulado sobre dívidas, e os cofres estão vazios.\n\nOnde posso conseguir ouro #EMP agora mesmo#!?\n\nUma ideia vergonhosa, blasfema e #EMP brilhante#! de repente me atinge: os grandes imperadores de tempos passados sempre foram enterrados com bens funerários luxuosos! Eu só precisaria reapropriar alguns desses bens para pagar nossas dívidas. Todas essas riquezas pertencem ao Império de qualquer maneira, não pertencem?"
 ep3_emperor_yearly.2140.t:0 "Cofres Vazios, Mausoléus Vazios"
 ep3_emperor_yearly.2150.a.tt:0 "Eu apoiarei seu santo chamado!"
 ep3_emperor_yearly.2150.a:0 "Est[Select_CString( saint.IsFemale, 'a', 'e' )] [saint.GetWomanMan] foi abençoado por [ROOT.Char.GetFaith.HighGodName]!"
 ep3_emperor_yearly.2150.b.tt.continue:0 "Você deve deixar [saint.GetFirstNameNoTooltip] continuar sua busca santa"
 ep3_emperor_yearly.2150.b.tt.crook:0 "[saint.GetFirstNameNoTooltip] é um golpista comum"
 ep3_emperor_yearly.2150.b.tt.failure:0 "Você não fica mais sábio"
 ep3_emperor_yearly.2150.b.tt.holy:0 "[saint.GetFirstNameNoTooltip] é verdadeiramente um[Select_CString( saint.IsFemale, 'a', '' )] [saint.GetWomanMan] sant[Select_CString( saint.IsFemale, 'a', 'o' )]"
 ep3_emperor_yearly.2150.b.tt.success:0 "Você descobre a verdade"
 ep3_emperor_yearly.2150.b.tt:0 "Seu [governor_efficiency|E] aumenta em #P 10%#!"
 ep3_emperor_yearly.2150.b:0 "Vou testar [saint.GetSheHe] eu mesmo!"
 ep3_emperor_yearly.2150.c.tt:0 "Seu [governor_efficiency|E] aumenta em #P 3%#!"
 ep3_emperor_yearly.2150.c:0 "Santos [saint.GetWomenMen] há muito deixaram de andar entre nós."
 ep3_emperor_yearly.2150.desc.end:0 "\n\nNão é incomum que golpistas ganhem a vida da caridade mal orientada de nossos cidadãos, fingindo ferimentos e exibindo um ar de santidade bem praticado, mas e se [saint.GetFirstNameNoTooltip] for um santo genuíno?"
 ep3_emperor_yearly.2150.desc.grazer:0 "\n\nComo aqueles que costumamos chamar de \"Grazers\", [saint.GetSheHe] vive na selva, uma besta entre bestas; nu, sozinho, [saint.GetSheHe] sobrevive do que a terra fornece livremente e das doações de ocasional passante."
 ep3_emperor_yearly.2150.desc.iron:0 "\n\nComo aqueles que costumamos chamar de \"Portadores de Ferro\", [saint.GetSheHe] passa sua vida em imobilidade, coberto por pesadas correntes para mortificar a carne; o ferro penetra nos pulsos machucados [saint.GetHerHim], mas nenhum suspiro escapa dos lábios [saint.GetHerHim]. Somente a misericórdia do passante alimenta e cobre o corpo ensanguentado [saint.GetHerHim]."
 ep3_emperor_yearly.2150.desc.stylite:0 "\n\nComo aqueles que costumamos chamar de \"Estilitas\", [saint.GetSheHe] elegeu uma antiga coluna na cidade como seu lar; [saint.GetSheHe] passa sua vida inteira em cima dela, amarrado firmemente para não cair, coberto de trapos, comendo apenas a comida que discípulos bem-intencionados içam para [saint.GetSheHe] com uma corda e polia."
 ep3_emperor_yearly.2150.desc:0 "O povo de [capital.GetName] está agitado com a conversa sobre um[Select_CString( saint.IsFemale, 'a', '' )] [saint.GetWomanMan] sant[Select_CString( saint.IsFemale, 'a', 'o' )], algum [saint.GetFirstName], que tem vivido a vida dos antigos Santos."
 ep3_emperor_yearly.2150.t:0 "O Santo de [capital.GetNameNoTooltip]"
 ep3_emperor_yearly.2151.a:0 "Quem poderia ter previsto isso!"
 ep3_emperor_yearly.2151.desc:0 "Faz anos desde a última vez que ouvi falar de [saint.GetFirstNameNicknamed], o santo do povo de [capital.GetName]. Eu me pergunto por que isso veio à minha mente agora, em todos os momentos...\n\n\"[chaplain.GetTitledFirstName|U], você se lembra daquele estranho eremita, [saint.GetFirstNameNoTooltip]? O que aconteceu com [saint.GetSheHe]?\""
 ep3_emperor_yearly.2151.desc_crook:0 "\n\n\"Apenas um golpista comum, meu [ROOT.Char.GetTitleAsNameNoTooltip|U]. Apenas alguns meses depois que o assunto foi submetido a você, foi descoberto que [saint.GetSheHe] fingiu seus ferimentos com sangue de cordeiro e comeu à vontade em uma taverna próxima!\""
 ep3_emperor_yearly.2151.desc_saint:0 "\n\n\"Um verdadeiro santo, grande [ROOT.Char.GetTitleAsNameNoTooltip|U]! Os efeitos das obras divinas [saint.GetHerHim] ainda são sentidos em toda a terra!\""
 ep3_emperor_yearly.2160.a.tt:0 "O Império tem uma antiga tradição de aceitar e integrar todos os bárbaros que desejam se estabelecer em nossas terras."
 ep3_emperor_yearly.2160.a:0 "Eles são bem-vindos para se estabelecer aqui."
 ep3_emperor_yearly.2160.b.failure:0 "Intercâmbio diplomático negativo"
 ep3_emperor_yearly.2160.b.flavor:0 "Você levanta a questão com o líder deles, [nomad_neighbor.GetTitledFirstNameNoTooltip]."
 ep3_emperor_yearly.2160.b.success:0 "Intercâmbio diplomático positivo"
 ep3_emperor_yearly.2160.b.tt.failure:0 "As marés da diplomacia se voltam contra você"
 ep3_emperor_yearly.2160.b.tt.success:0 "Você emerge vitorioso da escalada diplomática"
 ep3_emperor_yearly.2160.b.tt2:0 "Seu [governor_efficiency|E] diminui em #N 5%#!"
 ep3_emperor_yearly.2160.b.tt:0 "Seu [governor_efficiency|E] aumenta em #P 5%#!"
 ep3_emperor_yearly.2160.b:0 "Isto é inaceitável!"
 ep3_emperor_yearly.2160.desc:0 "Nossos vizinhos [nomad_neighbor.GetCulture.GetNameNoTooltip] se tornaram um verdadeiro incômodo ultimamente. Seus modos nômades e #EMP desorganizados#! tornam as fronteiras um conceito muito relativo e permeável, de modo que cada vez mais deles começaram a se mover de [nomad_county.GetNameNoTier] para [our_county.GetNameNoTier] com uma frequência cada vez maior.\n\nA princípio, eram os ocasionalmente cavalos errantes pastando em nossas terras, depois vieram rebanhos inteiros, e agora vilas completas com famílias inteiras e todos os seus bens encontraram seu caminho em [our_county.GetNameNoTooltip].\n\nA pressão da população bárbara nas fronteiras do Império não é um problema novo, mas os tempos mudaram."
 ep3_emperor_yearly.2160.t:0 "Pessoas da Fronteira"
 ep3_emperor_yearly.2170.a:0 "Isso pode ser útil..."
 ep3_emperor_yearly.2170.b:0 "Essa prática ilegal deve chegar ao fim."
 ep3_emperor_yearly.2170.desc:0 "[our_county.GetNameNoTier] é uma área difícil, e nosso controle sobre ela é frequentemente tenuoso na melhor das hipóteses. Seu povo é formado por sobreviventes endurecidos, cujo conhecimento e domínio do relevo de sua terra dura e selvagem é incomparável.\n\nNisso, eles são ajudados por sua própria criação: uma extensa rede de túneis, abrigos secretos e assentamentos subterrâneos onde podem facilmente desaparecer sempre que o tempo fica hostil, um inimigo ataca ou nossos coletores de impostos se aproximam, exigindo o que é devido [Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]."
 ep3_emperor_yearly.2170.t:0 "Túneis Secretos"
 ep3_emperor_yearly.2180.a.tt:0 "Veremos que tipo de reação receberemos."
 ep3_emperor_yearly.2180.a:0 "Devemos pedir hospitalidade."
 ep3_emperor_yearly.2180.b:0 "Sem tempo a perder aqui."
 ep3_emperor_yearly.2180.desc:0 "A noite nos surpreende enquanto fazemos nosso caminho através dos [location.Custom('GetTerrainTypePlural')] ao redor de [location.GetName], ainda a uma boa distância do assentamento mais próximo.\n\nO único sinal de presença humana que vemos por milhas é a intimidante parede externa do que parece ser algum tipo de propriedade privada."
 ep3_emperor_yearly.2180.desc_capital:0 "A noite nos surpreende ainda a uma boa distância das seguras paredes de [location.GetName].\n\nOs anexos de uma luxuosa propriedade aparecem à vista. Que relaxante seria passar a noite aqui, longe da estrada empoeirada e antes de mergulharmos no alvoroço de uma grande capital!"
 ep3_emperor_yearly.2180.desc_fellow:0 "\n\nSe minha memória não me trair, essas terras deveriam pertencer a [event_host.GetTitledFirstName]. [event_host.GetSheHe|U] está destinado a nos mostrar alguma bondade!"
 ep3_emperor_yearly.2180.desc_foreigner:0 "\n\nInfelizmente, não estou familiarizado com o senhor ou senhora desta terra. Espero que eles não neguem a alguns pobres peregrinos uma refeição quente e uma humilde cama!"
 ep3_emperor_yearly.2180.t:0 "Uma Refeição Quente?"
 ep3_emperor_yearly.2181.a.tt:0 "Hospitalidade Amigável"
 ep3_emperor_yearly.2181.a:0 "Claro, [ROOT.Char.GetFaith.HighGodName] o abençoe!"
 ep3_emperor_yearly.2181.a_flavor:0 "Sente-se à minha mesa! E após o jantar, eu também lhe mostrarei um atalho, para que você possa contar a todos ao longo do caminho como sou gentil!"
 ep3_emperor_yearly.2181.b.tt:0 "Hospitalidade Excelente"
 ep3_emperor_yearly.2181.b:0 "Você é bem-vindo em minha casa, e deixe-me ajudá-lo também."
 ep3_emperor_yearly.2181.b_flavor:0 "Meus servos o guiarão, e meus guardas o acompanharão a partir de amanhã."
 ep3_emperor_yearly.2181.c.tt:0 "Hospitalidade Negada"
 ep3_emperor_yearly.2181.c:0 "Hospitalidade não vem de graça."
 ep3_emperor_yearly.2181.desc:0 "O sol acaba de se pôr sobre minhas possessões em [location.GetName], quando um grupo descuidado de viajantes aparece à minha porta."
 ep3_emperor_yearly.2181.desc_fellow:0 "\n\n\"[ROOT.Char.GetFirstNameNoTooltip], meu amigo, em nome de nosso amado [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip|U], a quem servimos fielmente, abra suas portas para alguns humildes peregrinos que cruzam suas terras!\""
 ep3_emperor_yearly.2181.desc_foreigner:0 "\n\n\"Senhor ou Senhora desta magnífica casa, meu nome é [pilgrim.GetTitledFirstNameNoTooltip], mas hoje sou apenas um humilde peregrino cruzando sua terra! Você teria a bondade de nos oferecer uma refeição quente e uma cama para a noite?\""
 ep3_emperor_yearly.2190.a:0 "Você receberá uma punição exemplar!"
 ep3_emperor_yearly.2190.b:0 "Eu #EMP poderia#! ignorar isso..."
 ep3_emperor_yearly.2190.c:0 "Você realmente não deveria fazer isso."
 ep3_emperor_yearly.2190.desc:0 "Os armazéns dos [Glossary( 'dynatoi', 'DYNATOI_GLOSS')] estão sempre cheios, diz o agricultor melancólico.\n\nEm alguns casos, isso é mais verdadeiro do que nunca; neste dia, eu oficialmente convoquei [landowner.GetTitledFirstName], proprietário de terras em [capital.GetName], sobre a administração de sua propriedade. De acordo com minhas fontes, [landowner.GetFirstNameNoTooltip] tem comprado enormes quantidades de grãos a preços baixos e estocando-os em seus armazéns, para revendê-los a um preço mais alto em tempos de escassez.\n\nEssa prática é proibida pelo Império, pois prejudica a renda dos pequenos proprietários."
 ep3_emperor_yearly.2190.t:0 "Os Armazéns dos Poderosos"
 ep3_emperor_yearly.2200.a.tt:0 "Lealdade Indigna"
 ep3_emperor_yearly.2200.a:0 "[liege.GetSheHe|U] não merece nosso ouro."
 ep3_emperor_yearly.2200.b.tt:0 "Leal ao Império"
 ep3_emperor_yearly.2200.b:0 "Minha lealdade é ao [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip], não [Select_CString( ROOT.Char.GetTopLiege.IsFemale, 'a', 'ao' )] [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip]."
 ep3_emperor_yearly.2200.desc.c_monarch:0 "[liege.GetTitledFirstName] é completamente indigno de guiar [Select_CString( ceremonial_monarch.IsFemale, 'a', 'o' )] [ceremonial_monarch.GetTitleAsName]!\n\nO [governorship.GetName] labuta e sofre, e todos os nossos impostos vão para o preguiçoso em [capital.GetNameNoTier]. A menos que...\n\nNossos impostos não #EMP têm#! que ir para lá; eu poderia fazer muito melhor uso deles..."
 ep3_emperor_yearly.2200.desc:0 "Se houve alguém totalmente indigno de sentar-se no trono Imperial, deve ser [liege.GetFirstName].\n\nO [governorship.GetName] labuta e sofre, e todos os nossos impostos vão para o vagabundo em [capital.GetNameNoTier]. A menos que...\n\nNossos impostos não #EMP precisam#! ir para lá; eu poderia fazer uso muito melhor deles..."
 ep3_emperor_yearly.2200.t:0 "O Ouro do Imperador"
 ep3_emperor_yearly.2210.a.failure.tt:0 "Profecia Não Acreditada"
 ep3_emperor_yearly.2210.a.failure:0 "Sua 'profecia' não é acreditada"
 ep3_emperor_yearly.2210.a.success.tt:0 "Profecia Acreditada"
 ep3_emperor_yearly.2210.a.success:0 "Você convence seu Senhor Feudal"
 ep3_emperor_yearly.2210.a.tt:0 "Cabe ao seu Senhor Feudal decidir."
 ep3_emperor_yearly.2210.a:0 "Vale a pena tentar!"
 ep3_emperor_yearly.2210.b:0 "Eu não preciso dessa tolice."
 ep3_emperor_yearly.2210.desc:0 "Na noite passada, tive um sonho: uma mão etérea desceu do Céu e colocou uma coroa em minha cabeça, enquanto uma voz imperiosa me disse: \"Vá! Eu lhe concedo o [potential_title.GetName]!\"\n\nProvavelmente é apenas um produto de minhas ambições... E ainda assim, e se eu pudesse convencer [liege.GetTitledFirstName] de que era um verdadeiro sinal do Alto, uma profecia de algum tipo?"
 ep3_emperor_yearly.2210.desc_believe:0 "Aquele tolo acreditaria #EMP em qualquer coisa#!, não acreditaria [liege.GetSheHe]?"
 ep3_emperor_yearly.2210.desc_jacob:0 "\n\nAfinal, Deus não apareceu a Jacó em um sonho para conceder-lhe a Terra Prometida?"
 ep3_emperor_yearly.2210.t:0 "Uma Profecia de Poder"
 ep3_emperor_yearly.2211.a:0 "#EMP Um verdadeiro sinal de cima!#!"
 ep3_emperor_yearly.2211.b:0 "Acho que não posso desconsiderar esse sinal."
 ep3_emperor_yearly.2211.c:0 "Seu valor deve ser provado com atos, não com sonhos!"
 ep3_emperor_yearly.2211.d:0 "[vassal.GetFirstNameNoTooltip] quer nos entreter com alguma bobagem!"
 ep3_emperor_yearly.2211.desc:0 "Fico bastante surpreso quando [vassal.GetTitledFirstName] aparece na minha frente, forçando uma audiência privada.\n\n\"Grande [ROOT.Char.GetTitleAsNameNoTooltip|U], um sonho de [vassal.GetFaith.HighGodName] ocorreu comigo — não é #EMP apenas#! um sonho — mas uma verdadeira #EMP profecia#!!\"\n\n\"Fui escolhido para ser o próximo [potential_title.GetHolder.GetTitleAsNameNoTooltip] do [potential_title.GetName]! Os mais sábios dos [vassal.GetFaith.PriestNeuterPlural] confirmaram isso.\""
 ep3_emperor_yearly.2220.a:0 "Os pastores têm o direito de vagar."
 ep3_emperor_yearly.2220.b:0 "Os monges precisam de seu isolamento!"
 ep3_emperor_yearly.2220.c:0 "É problema deles."
 ep3_emperor_yearly.2220.desc:0 "\"Meu [ROOT.Char.GetTitleAsNameNoTooltip|U], uma carta de reclamação acaba de chegar da comunidade monástica em [monastery.GetName].\" [chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim.\n\n\"Aparentemente, pastores da vizinha [shepherd_province.GetName] têm invadido as terras do monastério, trazendo não apenas seus rebanhos, mas suas famílias também!\"\n\n\"Os monges estão horrorizados com a sujeira, o barulho e a #EMP imoralidade#! de seus novos vizinhos, e pedem sua intervenção.\""
 ep3_emperor_yearly.2220.t:0 "Terras Atingidas"
 ep3_emperor_yearly.2230.a:0 "Vou enviar as tropas."
 ep3_emperor_yearly.2230.b:0 "O caos só gera oportunidades!"
 ep3_emperor_yearly.2230.c:0 "Os cidadãos vão me ouvir."
 ep3_emperor_yearly.2230.c_failure.tt:0 "Distúrbios Contínuos"
 ep3_emperor_yearly.2230.c_failure:0 "As pessoas não o ouvem"
 ep3_emperor_yearly.2230.c_success.tt:0 "Cidade Pacificada"
 ep3_emperor_yearly.2230.c_success:0 "Você acalma a multidão"
 ep3_emperor_yearly.2230.desc:0 "Como em toda cidade de relevância, [city.GetNameNoTier] atrai uma multidão colorida de mercadores de toda a [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip] e além de suas fronteiras.\n\nOnde quer que haja uma oportunidade de ganho, os mercadores vêm, trazendo suas mercadorias e moedas estrangeiras, mas também seus costumes, crenças e idiomas estranhos. Por outro lado, as multidões locais são volúveis; amam aqueles que trazem [ROOT.Char.Custom('GetExpensiveDessert')] exóticos, mas ainda os desprezam no fundo.\n\nNão está claro qual foi o evento desencadeador hoje — provavelmente um pequeno mal-entendido — mas os cidadãos pegaram armas improvisadas e estão se revoltando nos bairros dos mercadores."
 ep3_emperor_yearly.2230.t:0 "O Valor da Moeda"
 ep3_emperor_yearly.2240.a.flavor:0 "Você tenta colocar [the_scholar.GetFirstNameNoTooltip] de volta em seu lugar, mostrando como [the_scholar.GetSheHe] está errado."
 ep3_emperor_yearly.2240.a:0 "#EMP Na verdade#!, a citação vai..."
 ep3_emperor_yearly.2240.a_failure.tt:0 "Humilhação Pública"
 ep3_emperor_yearly.2240.a_failure:0 "Você parece mais tolo do que [the_scholar.GetSheHe]"
 ep3_emperor_yearly.2240.a_success.tt:0 "[the_scholar.GetFirstNameNoTooltip] Humilhado!"
 ep3_emperor_yearly.2240.a_success:0 "Seu conhecimento ofusca [the_scholar.GetSheHe]"
 ep3_emperor_yearly.2240.b:0 "#EMP CALA A BOCA!#!"
 ep3_emperor_yearly.2240.c:0 "Eu não tenho tempo para isso."
 ep3_emperor_yearly.2240.desc_outro:0 "\n\n[the_scholar.GetSheHe|U] está #EMP sempre#! fazendo isso, e eu odeio! Sempre citando os Antigos e jogando isso na cara dos outros sem motivo — e muitas vezes fora de contexto ou com as palavras erradas também...\n\nMuitos ao nosso redor gemem e reviram os olhos. Uma sólida educação clássica é imprescindível para uma figura pública, mas é desperdiçada sem a sabedoria de usá-la corretamente."
 ep3_emperor_yearly.2240.desc_quote_a:0 "\"[Glossary( 'Panta rhei', 'PANTA_RHEI_GLOSS')]\" exclama [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] tristemente enquanto um servo tropeça e o jarro de água em suas mãos derrama seu conteúdo no chão. Isso é #EMP não#! o que a frase significa!"
 ep3_emperor_yearly.2240.desc_quote_b:0 "\"[Glossary( 'Ho bíos brakhús, he dè tékhne makré', 'ARS_LONGA_GLOSS')]\" suspira [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] enquanto [the_scholar.GetSheHe] risca uma linha de algumas anotações desorganizadas. Quando [the_scholar.GetSheHe] até se juntou a mim?!"
 ep3_emperor_yearly.2240.desc_quote_c:0 "\"[Glossary( 'Sophòn to saphés', 'SOPHON_GLOSS')]\" resmunga [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] enquanto [the_scholar.GetSheHe] falha — novamente — em seguir algumas instruções básicas."
 ep3_emperor_yearly.2240.desc_quote_confucius:0 "\"[Glossary( 'O homem superior é modesto em suas palavras, mas se destaca em suas ações.', 'CONFUCIUS_GLOSS' )]\" pontifica [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char )] com uma expressão solene. O que isso tem a ver com o que estávamos falando?!"
 ep3_emperor_yearly.2240.desc_quote_latin:0 "\"[Glossary( 'Omnia vincit amor', 'AMOR_GLOSS')]\" pontifica [the_scholar.Custom2('MyCharacterIntroduction', ROOT.Char)] com uma expressão solene. O que isso tem a ver com o que estávamos falando?!"
 ep3_emperor_yearly.2240.t:0 "Como Disse o Filósofo..."
 ep3_emperor_yearly.2300.a:0 "Ultrajante! Blasfêmia!"
 ep3_emperor_yearly.2300.b:0 "O [liege_loc.GetTitleAsNameNoTooltip] deve estar certo."
 ep3_emperor_yearly.2300.c:0 "Finalmente!"
 ep3_emperor_yearly.2300.desc:0 "Com uma cerimônia solene em [capital.GetBaronyNameExplicitly], [liege_loc.GetTitledFirstName] declarou oficialmente o [liege_loc.GetFaith.GetName] a fé oficial do [liege_loc.GetPrimaryTitle.GetName].\n\nImediatamente, os mensageiros mais rápidos viajaram para todos os cantos do Império, espalhando a notícia e exigindo a conversão de todos os súditos."
 ep3_emperor_yearly.2300.t:0 "Os Tempos Estão Mudando"
 ep3_emperor_yearly.2310.a:0 "Eles abraçarão a fé certa em breve."
 ep3_emperor_yearly.2310.b:0 "Não, obrigado."
 ep3_emperor_yearly.2310.c:0 "Começarei comigo mesmo."
 ep3_emperor_yearly.2310.d:0 "Vou pensar sobre isso."
 ep3_emperor_yearly.2310.desc:0 "Chegou ao meu conhecimento que muitos cidadãos em sua governança designada ainda não seguem a verdadeira fé, [liege_loc.GetFaith.GetName]. É seu dever retificar a situação."
 ep3_emperor_yearly.2310.desc_you_too:0 "E corrigir suas próprias crenças também!"
 ep3_emperor_yearly.2310.t:0 "[liege_loc.Custom2('AppropriateGreeting', ROOT.Char)]"
 ep3_emperor_yearly.2320.a.tt:0 "Obtenha um desconto de #P 30%#! na decisão de mudar a fé do estado por 10 anos"
 ep3_emperor_yearly.2320.a:0 "Obrigado, Sua Santidade."
 ep3_emperor_yearly.2320.b:0 "Mas e se a fé oficial estiver certa?"
 ep3_emperor_yearly.2320.desc:0 "\"Estou honrado com sua visita,\" começo rigidamente ao receber [hof.GetTitledFirstName]. \"Mas a que devo essa honra?\"\n\n\"Chegou ao meu conhecimento que, apesar de sua liderança, [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] ainda está tateando no escuro, seguindo a fé oficial errada.\" O [hof.GetTitleAsNameNoTooltip] pausa de forma significativa.\n\n\"Portanto, decidi me juntar a você neste esforço e oferecer toda a minha ajuda para guiar o navio do estado na direção certa.\""
 ep3_emperor_yearly.2320.t:0 "Uma Questão de Fé"
 ep3_emperor_yearly.2330.a.tt:0 "Vou investir em promover a verdadeira fé entre o povo!"
 ep3_emperor_yearly.2330.a:0 "Precisamos fazer algo!"
 ep3_emperor_yearly.2330.b:0 "Provavelmente está tudo bem..."
 ep3_emperor_yearly.2330.desc:0 "É inegável. A fé oficial de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] está enfrentando uma crise.\n\n"
 ep3_emperor_yearly.2330.desc_end:0 "Os sinais estão por toda parte: pessoas vivendo em pecado, o [ROOT.Char.GetFaith.ReligiousText] esquecido e desconsiderado, e heresias brotando em cada canto escuro!"
 ep3_emperor_yearly.2330.desc_end_hof:0 "Os poderes leigos e religiosos devem se unir para salvar o bom povo de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 ep3_emperor_yearly.2330.desc_hof:0 "[hof.GetTitledFirstName|U] se juntou a mim hoje para discutir uma questão muito séria: a crise da fé oficial do [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip].\n\n\"Você não pode negar, [ROOT.Char.GetFirstNameNoTooltip]! Você deve ver isso também!\""
 ep3_emperor_yearly.2330.t:0 "Heresia à Vista"
 ep3_emperor_yearly.2340.a:0 "Talvez eu devesse me alinhar..."
 ep3_emperor_yearly.2340.b:0 "Seu blá-blá-blá herético não vai me convencer."
 ep3_emperor_yearly.2340.desc:0 "\"É um fato bem conhecido que você não segue a fé prescrita a nós pelo Império e pelos Antecessores que o tornaram grande,\" [complainer.GetTitledFirstName] me repreende com desdém.\n\n\"Muitos se perguntam se você é digno do título que carrega. Afinal, como você poderia guiar nossos cidadãos para a luz se você mesmo anda nas trevas?\"\n\n\"Peço que você abrace a verdadeira fé, o [complainer.GetFaith.GetName]!\""
 ep3_emperor_yearly.2340.t:0 "Heresia Entre Nós?"
 ep3_emperor_yearly.2400.a:0 "Nosso dia vai chegar."
 ep3_emperor_yearly.2400.desc:0 "Em todo o reino, o poder de uma nova família parece estar tomando raiz. Como uma erva daninha, eles espalharam sua influência por todos os cantos da nossa sociedade, e raramente passa um dia sem ouvir o nome \"[new_family.GetHouse.GetBaseName]\".\n\nFamílias poderosas sobem e descem o tempo todo em grandes impérios; não há necessidade de nos preocuparmos ou tomarmos qualquer iniciativa. E ainda assim, uma voz incômoda na minha cabeça sussurra: \"E se fôssemos nós?\""
 ep3_emperor_yearly.2400.t:0 "$ep3_powerful_families.8020.t$"
 ep3_emperor_yearly.2401.a:0 "A hora da [ROOT.Char.GetHouse.GetBaseNameNoTooltip] chegou!"
 ep3_emperor_yearly.2401.desc:0 "Muitas são as famílias de raízes nobres e dignidade entre os cidadãos de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveName|l]. Muito poucas, no entanto, sentam-se à mesa do [ROOT.Char.GetTopLiege.GetTitleAsNameNoTooltip], compartilhando as responsabilidades e honras de conduzir o navio do estado.\n\nPoucos têm verdadeiro #EMP poder#!, mas hoje, a Casa [ROOT.Char.GetHouse.GetBaseName] está entre eles!"
 ep3_emperor_yearly.2401.t:0 "$ep3_powerful_families.8020.t$"
 ep3_emperor_yearly.2410.a:0 "Tsk. #EMP Provincianos.#!"
 ep3_emperor_yearly.2410.desc:0 "Há um novo nome entre os magnatas de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetDefinitiveName|l]: a família [new_title.GetHolder.GetHouse.GetBaseName] ganhou o direito de ser considerada parte da nobreza — seja por corrupção, intriga ou real valor, isso eu não posso dizer.\n\nNão importa. Tenho certeza de que não chegarão a ser mais do que um grão de areia, prontos para serem varridos pelos ventos turbulentos da história — e pelo inexorável avanço da Casa [ROOT.Char.GetHouse.GetBaseName]!"
 ep3_emperor_yearly.2410.t:0 "Nova Nobreza"
 ep3_emperor_yearly.2420.a:0 "Notícias preocupantes."
 ep3_emperor_yearly.2420.desc:0 "Gulosos e poderosos, os tentáculos da Casa [noble_family_head.GetHouse.GetBaseName] se estendem sobre cada canto de [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetName].\n\nAgora está claro que nem mesmo aquele que se senta no trono imperial é mais alto do que eles; são os verdadeiros mestres de nossa terra, que dominam a vida política e econômica do [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 ep3_emperor_yearly.2420.t:0 "A Sombra Atrás do Trono"
 every_fellow_vassal_state_faith:0 "Todo vassalo que segue a fé do estado"
 every_vassal_state_faith:0 "Todo vassalo que segue a fé do estado"
 hof_state_faith_discount:0 "Apoio do Chefe da Fé"
 patriarch_support_2030_desc:0 "Apoio do Chefe da Fé"
 patriarch_support_2030_desc_tt:0 "O [patriarch.GetTitleAsNameNoTooltip] apoiará seu predecessor até que você prove seu valor"
 state_faith_fervor_campaign:0 "Apoio à Fé do Estado"
