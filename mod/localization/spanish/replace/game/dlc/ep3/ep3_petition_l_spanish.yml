 petition_liege.0101.desc.admin_request_council:0 "$petition_liege.0101.desc.court_position$"
 petition_liege.0101.desc.council_seat_family:0 "por favor, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], deixe [Select_CString( petition_char.IsFemale, 'minha', 'meu' )] [petition_char.Custom2('RelationToMeShort', petition_char)] sentar-se em seu conselho.\n\nOs talentos [petition_char.GetHerHim|U] são ignorados enquanto [petition_char.GetWomenMen] inferiores são ouvidos nos níveis mais altos; [petition_char.GetSheHe] compartilharia os fardos do reino como seu [petition_char.Custom('GetCouncilPositionRequest')]."
 petition_liege.0101.desc.court_position:0 "por favor, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], aceite meus serviços em sua corte.\n\nMeus talentos estão sendo desperdiçados, em vez de servir aos seus interesses."
 petition_liege.0101.desc.court_position_family:0 "por favor, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], aceite [petition_char.GetName] em sua corte.\n\n[petition_char.GetSheHe|U] é um grande talento, mas [petition_char.GetSheHe] se sairia melhor a seu serviço do que ao meu."
 petition_liege.0101.desc.governorship:0 "por favor, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], você me concederia uma governadoria?\n\nEstou ansioso para servir ao reino, e, francamente, meus talentos estão sendo desperdiçados. Com uma província própria, poderia servir aos seus interesses."
 petition_liege.0101.desc.governorship_family:0 "por favor, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], você concederia uma governadoria a [petition_char.GetName]?\n\n[petition_char.GetSheHe|U] está ansioso para servir ao reino, e, francamente, é um desperdício tê-lo esperando por mim. [petition_char.GetSheHe|U] deveria ter uma província própria para servir aos seus interesses."
 petition_liege.0101.desc.house_governorship_rights:0 "por favor, [Select_CString( petition_liege.IsFemale, 'minha', 'meu' )] [petition_liege.GetLadyLord], você concederia à Casa [petition_vassal.GetHouse.GetBaseName] o direito de continuar a governar a [petition_vassal.GetPrimaryTitle.GetAdjective] [petition_vassal.GetPrimaryTitle.GetTierAsNameNoTooltip]?\n\nMinha família gerenciou bem a área como seus leais súditos e deseja apenas continuar."
