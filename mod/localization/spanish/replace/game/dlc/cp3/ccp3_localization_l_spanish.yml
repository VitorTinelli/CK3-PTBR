l_spanish:
 building_al_qarawiyyin_university_01:0 "Universidade de al-Qarawiyyin"
 building_al_qarawiyyin_university_01_desc:0 "Fundado por mercadores e migrantes de Kairouan, este vasto complexo tornou-se um dos mais prestigiados centros de ensino superior do mundo islâmico ocidental. Atrai estudiosos de regiões distantes e educa as elites locais nas disciplinas mais refinadas.\nA #italic madrasa#! é composta por vários salões e aposentos - oferecendo cama e descanso a estudantes estrangeiros, com o #italic Sahn#! servindo como pátio central para debates públicos."
 building_beta_giyorgis_01:0 "São Jorge de Lalibela"
 building_beta_giyorgis_01_desc:0 "O #italic Beta Giyorgis#! foi esculpido inteiramente em uma rocha vulcânica avermelhada. Ao seu redor, há uma dúzia de outros templos e edifícios irmãos, projetados para representar tanto a Jerusalém Terrena quanto a Celestial. Esta é a prova viva do vínculo entre o reino sagrado e esta terra.\nEscavado profundamente na rocha, o salão principal da igreja é ricamente pintado com belos afrescos, enquanto ícones sagrados adornam suas paredes."
 building_cluny_abbey_01:0 "Abadia de Cluny"
 building_cluny_abbey_01_desc:0 "Um presente de terras e direitos, em troca da salvação eterna. Esse é o pacto firmado entre a comunidade monástica de Cluny e o senhor local.\nCom o tempo, cresceu e se tornou uma comunidade vibrante e influente, livre de interferência secular, impondo a disciplina beneditina por toda parte.\n\nSob seus muitos telhados vermelhos, monges rezam, trabalham e iluminam manuscritos – um modelo a ser seguido em todo o continente."
 building_cluny_abbey_02:0 "Maior Ecclesia"
 building_cluny_abbey_02_desc:0 "O que antes eram apenas algumas moradias monacais foi substituído por um vasto complexo religioso.\nPara consolidar esse legado, seus abades embarcaram em um colossal projeto de construção, a #italic Maior Ecclesia#!. Destinada a ser a maior igreja da cristandade, suas cinco naves são mais longas que as do Vaticano, e suas imensas abóbadas de pedra são uma realização arquitetônica repleta de torres e telhados."
 building_damascus_mosque_01:0 "Grande Mesquita de Damasco"
 building_damascus_mosque_01_desc:0 "Esta mesquita tem uma história venerável para contar. Aqui, séculos de espiritualidade e engenhosidade maravilhosa se sobrepõem, pois foi construída sobre um templo romano e uma antiga basílica cristã.\nO edifício é renomado por seus mármores opulentos e coloridos, bem como por seus mosaicos dourados montados por artistas vindos de tão longe quanto Constantinopla."
 building_drassanes_01:0 "Drassanes"
 building_drassanes_01_desc:0 "Fora das muralhas da cidade de Barcelona, aos pés da colina #italic Montjuich#!, este grande arsenal de doca seca arma e protege uma frota de galés de guerra.\nSob abóbadas pontiagudas de pedra, trabalhadores labutam incansavelmente. Torres altas e longos muros guardam os segredos de seu trabalho contra forasteiros."
 building_duomo_florence_01:0 "Santa Reparata"
 building_duomo_florence_01_desc:0 "Seguindo as antigas muralhas romanas perto de seu portão norte, esta basílica cristã primitiva tem sido o lar dos cristãos de Florença desde antes da época de Constantino. Sofreu incêndios criminosos e saques, reconstruções e bênçãos, mas manteve suas três naves originais e seus elegantes arcos arredondados.\nAinda assim, à medida que a cidade cresce, a velha basílica pode precisar crescer junto com ela."
 building_duomo_florence_02:0 "Batistério de São João"
 building_duomo_florence_02_desc:0 "Este é um colossal batistério octogonal no centro da cidade, dedicado a seu padroeiro, São João.\nO edifício é coberto por mármores luxuosos e decorado com esculturas primorosas e mosaicos dourados, um verdadeiro testemunho da riqueza da cidade. A lenda diz que já foi um templo dedicado a Marte, e sua aparência lembra notavelmente o Panteão de Roma."
 building_duomo_florence_03:0 "Santa Maria del Fiore"
 building_duomo_florence_03_desc:0 "Uma grande catedral - um #italic Duomo#! - digna da rica Florença agora se ergue sobre a cidade.\nAs longas naves e o enorme átrio octogonal são revestidos por mármores de cores vibrantes, criando um jogo óptico de profundidade. A fachada é decorada com estátuas de profetas, deuses e patronos. Sua alta torre sineira marca as horas de trabalho e oração para os cidadãos."
 building_duomo_florence_04:0 "A Cúpula"
 building_duomo_florence_04_desc:0 "A #italic Cúpula#! se ergue imensa sobre o complexo. Esbelta e etérea contra o céu azul, é a maior realização dos construtores florentinos.\nA torre é mais alta e larga do que qualquer outra já concebida, sem contrafortes ou sistemas de suporte externos para evitar seu colapso, graças ao uso engenhoso de uma dupla camada de tijolos e alvenaria."
 building_ghana_palace_01:0 "Palácio de Gana"
 building_ghana_palace_01_desc:0 "Cercado por um bosque sagrado, encontra-se o palácio dos #italic Ghanas#! - chefes reais da cidade.\nO complexo é composto por edifícios de arenito e tijolos de barro, protegidos por um recinto murado. Suas paredes são adornadas com relevos e entalhes magnificamente coloridos. Uma estrutura imponente, este palácio domina a cidade ao seu redor."
 building_holy_wisdom_01:0 "Santa Sabedoria de Deus"
 building_holy_wisdom_01_desc:0 "Esta magnífica igreja foi modelada com base na Hagia Sophia, para representar a mesma luz, riqueza e poder em uma terra gélida do norte. O austero calcário branco contrasta com as cores vibrantes dos afrescos em seu interior. Iluminada pelo brilho quente das velas, sombras dançam pelos mosaicos dourados das muitas cúpulas da catedral."
 building_jaisalmer_fort_01:0 "Forte Dourado"
 building_jaisalmer_fort_01_desc:0 "As muralhas douradas de Jaisalmer abrigam não apenas uma fortaleza defensiva, mas toda uma cidade, situada no meio do deserto de Thar.\nDiz-se que, ao pôr do sol, suas paredes adquirem uma tonalidade quente de mel dourado, enquanto, durante o dia, podem fazer a cidade se camuflar com a paisagem ao redor."
 building_jokhang_01:0 "Templo de Jokhang"
 building_jokhang_01_desc:0 "Lendas dizem que o Jokhang foi construído sobre um antigo lago sagrado, o coração de uma demônia na forma do Tibete. Três vezes foi erguido, e três vezes foi engolido pela fúria do lago, até que orações e oferendas sacrificiais feitas pela esposa do primeiro imperador finalmente o pacificaram.\nO templo é o mais sagrado da região, um complexo labiríntico de pátios e residências monásticas atravessado por corredores cavernosos e salões cobertos de manteiga de iaque."
 building_kairouan_basins_01:0 "Reservatórios de Kairouan"
 building_kairouan_basins_01_desc:0 "Construídos para fornecer água potável à cidade em tempos de necessidade, esses enormes reservatórios purificam a água da chuva atuando como tanques de decantação e filtrando os sedimentos.\nO sistema é composto por várias seções interligadas, desde um reservatório menor até um maior, culminando em um tanque de água decorado em alvenaria."
 building_kano_walls_01:0 "Obras de Terra de Kano"
 building_kano_walls_01_desc:0 "Massivas muralhas de terra e barro, com vários metros de altura, cercam a antiga cidade de Kano.\nEssas fortificações abrangem uma área muito maior do que a habitada pelos moradores, incluindo campos de trigo para sustentar a população durante longos cercos."
 building_konark_temple_01:0 "Templo do Sol de Konarak"
 building_konark_temple_01_desc:0 "Trabalhado por milhares de artesãos, o Templo do Sol de Konarak é um imenso templo dedicado ao deus do sol, Surya. Todo o complexo foi construído para se assemelhar ao poderoso carro do deus, carregando a luz do mar em direção ao leste.\nUm magnífico exemplo da arquitetura Kalinga, o templo é coberto de relevos e esculturas representando deuses, soldados, músicos e criaturas lendárias, narrando as escrituras hindus."
 building_kyz_kala_01:0 "Grande Kyz Kala"
 building_kyz_kala_01_desc:0 "Este imenso palácio se ergue sobre o exuberante oásis de Merv. Paredes estriadas envolvem oficinas, arsenais e salões cavernosos onde emissários e burocratas cumprem seus deveres.\nMeio residência, meio fortaleza, este grande edifício é tão capaz de sediar os mais magníficos banquetes quanto de repelir os mais bárbaros ataques."
 building_somapura_university_01:0 "Universidade de Somapura"
 building_somapura_university_01_desc:0 "Por séculos, Somapura tem sido um dos mais importantes centros de aprendizado da Índia, atraindo estudiosos de regiões distantes graças às suas múltiplas conexões com mosteiros budistas, jainistas e hindus.\nSeu plano quadrangular representa a verdadeira harmonia e pureza do universo, um local perfeito para o florescimento da mente."
