 building_vatapi_caves_01:0 "Cavernas de Vatapi"
 building_vatapi_caves_01_desc:0 "Construídas pela antiga dinastia Chalukya, essas cavernas sagradas foram escavadas profundamente em uma imponente formação de arenito. Em seu interior, encontra-se um mundo silencioso e sagrado.\nUm portal triunfal conduz os peregrinos à face monolítica da montanha. As cavernas são decoradas com ídolos de todas as principais religiões da Índia."
 building_visegrad_castle_01:0 "Cidadela de Visegrád"
 building_visegrad_castle_01_desc:0 "Esta cidadela é um grandioso e impenetrável sistema de muros e torres. Protege a curva do Danúbio e controla seu rico comércio.\nA cidadela de Visegrád é composta por uma parte inferior com uma poderosa torre hexagonal voltada para o rio e uma acrópole superior no topo da colina. A imensa fortificação triangular serve tanto como residência quanto como um opulento alojamento de caça."
 building_wartburg_01:0 "Wartburgo"
 building_wartburg_01_desc:0 "Na floresta da Turíngia, situada no topo de um grande precipício rochoso, esta fortaleza controla todo o movimento de mercadorias e pessoas na região.\nUma pesada barbacã protege o único acesso ao castelo, e altas muralhas brancas serpenteiam pelas fendas da montanha. O #italic Palas#! é o edifício mais importante do complexo, um imenso salão de pedra fria aquecido pelas muitas lareiras em seu interior."
 building_wawel_cathedral_01:0 "Igreja Colegial de Santa Maria e São Alexius"
 building_wawel_cathedral_01_desc:0 "Construída com gnaisse e calcário com a ajuda de artesãos da Alemanha, esta grande igreja de pedra é uma das primeiras do seu tipo nas terras polonesas e um testemunho do poder da Igreja.\nAs massivas paredes oferecem aos fiéis a promessa de salvação e proteção crucial contra os mortais. Diz-se que a torre ocidental carrega as marcas das garras do Diabo, um testemunho de seu potencial defensivo."
 building_wawel_cathedral_02:0 "Igreja Arquecollegial de Santa Maria e São Alexius"
 building_wawel_cathedral_02_desc:0 "$building_wawel_cathedral_01_desc$\nApós ser elevada ao posto de Igreja Arquecollegial, agora é mantida por um colégio de cânones, um corpo organizado composto unicamente por clérigos. Seu tamanho e esplendor são magníficos, mas como não é a sede de um bispo, não tem o título de catedral."
 building_wawel_cathedral_03:0 "Catedral de Santa Maria e São Alexius"
 building_wawel_cathedral_03_desc:0 "$building_wawel_cathedral_01_desc$\nApós investir recursos substanciais, o Papa finalmente criou uma nova diocese aqui, juntamente com a sede de um bispo. Finalmente, este orgulhoso edifício pode ser chamado de catedral."
 building_york_walls_01:0 "Muralhas de York"
 building_york_walls_01_desc:0 "Estendendo-se por vários quilômetros, essas vastas muralhas protegem a cidade desde os tempos dos Césares. Elas utilizam de forma inteligente os dois rios que serpenteiam pelos campos, protegendo-a de inimigos a leste e a oeste. Todo o tráfego é canalizado por pontos estratégicos, os #italic Bars#!, onde pedágios podem ser cobrados ou flechas e fogo podem ser lançados."
