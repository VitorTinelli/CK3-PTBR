 building_type_duomo_florence_01:0 "Duomo de Florença"
 building_type_duomo_florence_01_desc:0 "Sede do arcebispo local e grande motivo de orgulho cívico para todos os cidadãos de Florença, o Duomo é uma das maiores façanhas arquitetônicas já concebidas."
