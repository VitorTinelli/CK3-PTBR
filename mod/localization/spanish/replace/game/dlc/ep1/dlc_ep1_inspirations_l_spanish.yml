 TT_INSPIRATION_WIDGET:0 "#T Projeto de Inspiração#!\n[Character.GetUIName] possui a [Character.GetCurrentInspiration.GetName] - [Character.Custom('InspirationTypeDescriptionFuturePresent')].\n\n#I Clique para Ver#!"
 adventure_inspiration:0 "Inspiração de Aventura"
 adventure_inspiration_cost_tt:0 "As Inspirações de Aventura são baseadas em [prowess|E], [diplomacy|E] e [learning|E]"
 adventure_inspiration_desc:0 "Um personagem que tem uma Inspiração de Aventura é [inspired|E] a embarcar em uma grande aventura e trazer de volta um [artifact|E]. Os artefatos adquiridos desta Inspiração podem variar muito e podem ser desde o crânio de uma besta poderosa até uma relíquia roubada."
 alchemy_inspiration:0 "Inspiração de Alquimia"
 alchemy_inspiration_cost_tt:0 "As Inspirações de Alquimia são baseadas em [learning|E]"
 alchemy_inspiration_desc:0 "Um personagem que tem uma Inspiração de Alquimia é [inspired|E] a explorar, purificar e criar substâncias e metais, criar elixires e, em última análise, aperfeiçoar o corpo e a alma humana."
 armor_inspiration:0 "Inspiração de Armadura"
 armor_inspiration_cost_tt:0 "As Inspirações de Armaduras são baseadas em [martial|E] e [prowess|E]"
 armor_inspiration_desc:0 "Um personagem que tem uma Inspiração de Armadura é [inspired|E] a forjar um [artifact|E] de armadura ou escudo. Isso pode incluir qualquer coisa, desde cota de malha até lâminas."
 artisan_inspiration:0 "Inspiração de Artesão"
 artisan_inspiration_cost_tt:0 "As Inspirações de Artesão são baseadas em [stewardship|E]"
 artisan_inspiration_desc:0 "Um personagem que tem uma Inspiração de Artesão é [inspired|E] a aplicar seu conhecimento especializado em uma habilidade específica para produzir um [artifact|E] de grande habilidade. Marceneiros e alfaiates são exemplos de especializações de artesãos."
 book_inspiration:0 "Inspiração de Livro"
 book_inspiration_cost_tt:0 "As Inspirações de Livros são baseadas em [learning|E]"
 book_inspiration_desc:0 "Um personagem que tem uma Inspiração de Livro é [inspired|E] a escrever e produzir um [artifact|E] de livro. Os tópicos abordados podem variar muito - assim como a qualidade - mas resultará em um tomo digno de realeza."
 bow_inspiration:0 "Inspiração com Arco"
 bow_inspiration_cost_tt:0 "Inspirações com Arco são baseadas em [martial|E] e [prowess|E]"
 bow_inspiration_desc:0 "Um personagem com Inspiração com Arco está [inspired|E] a encordoar um [artifact|E] de arco. Isso pode incluir desde arcos compostos até bestas, e ele será carregado na mão."
 competent_inspiration_skill:0 "[ROOT.Char.GetSheHe|U] é muito competente em seu ofício."
 complete_inspiration_debug:0 "Completar Inspiração"
 decent_inspiration_skill:0 "A habilidade [ROOT.Char.GetHerHim|U] é apenas razoável."
 inspiration_type_desc_future:0 "[ROOT.Char.GetSheHe] quer [ROOT.Char.Custom('InspirationTypeDescription')]"
 inspiration_type_desc_present:0 "[ROOT.Char.GetSheHe] está [ROOT.Char.Custom('InspirationTypeDescription')]"
 legendary_inspiration_skill:0 "A habilidade [ROOT.Char.GetHerHim|U] é lendária e renomada em todo o mundo."
 masterful_inspiration_skill:0 "[ROOT.Char.GetSheHe|U] é [Select_CString( ROOT.Char.IsFemale, 'considerada uma', 'considerado um' )] mestre por seus pares."
 religious_artifact_inspiration:0 "Inspiração de Artefato Religioso"
 religious_artifact_inspiration_cost_tt:0 "Inspirações de Artefatos Religiosos são baseadas em [learning|E]"
 religious_artifact_inspiration_desc:0 "Um personagem que possui uma Inspiração de Artefato Religioso é [inspired|E] a criar um [artifact|E] devocional para a glória de sua [faith|E]. Isso pode incluir desde cruzes e báculos até livros iluminados e incensários."
 research_inspiration:0 "Inspiração de Pesquisa"
 research_inspiration_desc:0 "Um personagem que possui uma Inspiração de Pesquisa está [inspired|E] a descobrir novos conhecimentos em benefício de seu [sponsor|E]. Se bem-sucedido, melhorará a aprendizagem dentro da [dynasty|E] do seu patrocinador ou até mesmo descobrirá uma nova [innovation|E] para sua cultura."
 smith_inspiration:0 "Inspiração de Ferraria"
 smith_inspiration_cost_tt:0 "As Inspirações de Ferreiro são baseadas em [stewardship|E], [prowess|E] e [diplomacy|E]"
 smith_inspiration_desc:0 "Um personagem que tem uma Inspiração de Ferraria é [inspired|E] a forjar algo mais extravagante e menor do que uma espada ou uma armadura. Estes são os artistas que fazem coroas e taças, brilhantes e adornados."
 sponsor_inspiration_debug:0 "Patrocinar Inspiração"
 target_has_sponsored_inspiration:0 "O alvo possui uma [inspiration|E] Patrocinada: $VALUE|=+0$"
 ttc_inspired_guest_arrival_desc:0 "[ttc_inspired_character.GetTitledFirstName] chegou em busca de financiamento para sua [ttc_inspiration.GetName]"
 ttc_inspired_guest_arrival_title:0 "Convidado Inspirado Chegou"
 weapon_inspiration:0 "Inspiração de Arma"
 weapon_inspiration_cost_tt:0 "As Inspirações de Armas são baseadas em [martial|E] e [prowess|E]"
 weapon_inspiration_desc:0 "Um personagem que tem uma Inspiração de Arma é [inspired|E] a forjar um [artifact|E] de arma. Isso pode incluir desde espadas até lanças e será carregado na mão."
 weaver_inspiration:0 "Inspiração de Tapeçaria"
 weaver_inspiration_cost_tt:0 "As Inspirações de Tecelão são baseadas em [diplomacy|E]"
 weaver_inspiration_desc:0 "Um personagem que tem uma Inspiração de Tapeçaria é [inspired|E] a tecer um [artifact|E] de tapeçaria. As imagens e cenas retratadas podem variar muito - assim como a qualidade - mas resultará em uma tapeçaria adequada para decorar as paredes em sua [royal_court|E]."
