 ep1_2010_failure_modifier:0 "Teia de Mentiras"
 ep1_2010_failure_modifier_desc:0 "A corte deste personagem é um emaranhado de interesses conspiratórios."
 ep1_flavor.0001.a.tt.failure:0 "[scion_parent.GetFirstNameNoTooltip] escapa com seu/sua [scion_actual.Custom('GetDaughterSon')]"
 ep1_flavor.0001.a.tt.success:0 "Você negocia forçadamente uma [alliance|E] por [marriage|E]"
 ep1_flavor.0001.a:0 "[scion_parent.GetFirstNameNoTooltip]! Você trouxe um(a) [scion_actual.Custom('GetBrideGroom')] para mim?"
 ep1_flavor.0001.b:0 "[scion_parent.GetFirstNameNoTooltip]! Você trouxe um [scion_actual.Custom('GetBrideGroom')] para [Select_CString( prospective_spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('prospective_spouse'))]?"
 ep1_flavor.0001.c.tt.failure:0 "[scion_parent.GetFirstNameNoTooltip] cobre seus rastros muito bem"
 ep1_flavor.0001.c.tt.success:0 "Você encontra provas suficientes para provar a existência do bastardo"
 ep1_flavor.0001.c:0 "Tragam o pregoeiro da cidade, #EMP imediatamente#!"
 ep1_flavor.0001.d:0 "Não se preocupe, meu [scion_parent.GetTitleAsNameNoTooltip], você pode confiar em mim para esquecer que vi você..."
 ep1_flavor.0001.desc:0 "Um assunto de negócios triviais na cidade leva minha comitiva e eu, sedentos e famintos, até a pequena taverna cheia de fumaça.\n\nDe todas as pessoas, eu menos esperava encontrar [scion_parent.GetTitledFirstName] sentado no fundo, mal disfarçado com capuz e manto. Ao lado [scion_parent.GetHerHim], senta-se um(a) jovem [scion_actual.GetWomanMan] que... não pode ser!\n\nPelo seu rosto, pela maneira como [scion_actual.GetSheHe] olha em volta da sala maravilhado(a) e pela imitação dos maneirismos distintos de [scion_parent.GetFirstNameNoTooltip], eu estou #EMP convencido(a)#! de que [scion_actual.GetSheHe] deve ser um(a) bastardo(a) secreto(a) do [scion_parent.GetTitleAsNameNoTooltip], talvez vendo o mundo do lado de fora pela primeira vez."
 ep1_flavor.0001.e.fallback:0 "Isso não é da nossa conta. Vamos comer em outro lugar."
 ep1_flavor.0001.e.no_bastards:0 "Uma criança #EMP secreta#!? Que estranho. Vamos comer em outro lugar."
 ep1_flavor.0001.t:0 "O Segredo da [scion_actual.Custom('GetDaughterSon')|U]"
 ep1_flavor.0001.tt.scion_escapes:0 "[scion_actual.GetFirstName] é levado(a) embora em segredo e nunca mais é ouvido(a) novamente"
 ep1_flavor.0011.a:0 "Vocês vão pagar por esses danos, seus malditos lambe-botas!"
 ep1_flavor.0011.b:0 "Tudo bem, vocês destruíram, vocês podem limpar. SERVOS! Uma vassoura!"
 ep1_flavor.0011.c:0 "Oh, não, essa festa ainda não acabou: alguém encha meu cálice!"
 ep1_flavor.0011.d:0 "Apenas uma noite? Patético! Abra caminho para a Festa [ROOT.Char.GetTitleAsNameNoTooltip]!"
 ep1_flavor.0011.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], não é o que parece!\" chora [diplomat_1.GetTitledFirstName] quando entro na minha sala de jantar favorita.\n\nO que parece é que [diplomat_1.GetSheHe] destruiu completamente o lugar. Comida cobre as paredes, as mesas estão quase quebradas, alguém empilhou todas as cadeiras em uma pirâmide e a forma comatosa de [diplomat_2.GetTitledFirstName] (totalmente nu) está deitada de costas e coberta de sopa em uma das #EMP minhas#! camas.\n\nOs dois diplomatas chegaram ontem. Eu dei permissão para uma boa refeição e um pouco de entretenimento leve, não uma festa capaz de elevar [ROOT.Char.GetFaith.NegativeAfterLife|U] em si mesma."
 ep1_flavor.0011.e.tt:0 "Você os deixa ambos a remoer em seu próprio medo."
 ep1_flavor.0011.e:0 "Sair da sala sem dizer nada."
 ep1_flavor.0011.t:0 "Uma Bagunça Total"
 ep1_flavor.0021.a.tt.failure:0 "As ortografias do [rival_monarch.GetPrimaryTitle.GetAdjectiveNoTooltip] são as melhores!"
 ep1_flavor.0021.a.tt.success:0 "A ortografia do [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] é a melhor!"
 ep1_flavor.0021.a.tt:0 "Ambos as [courts|E] perdem [SCOPE.ScriptValue('ep1_flavour_0021_courts_lose_opinion_value')|N0] [opinion|E] um do outro"
 ep1_flavor.0021.a:0 "Esta missiva está faltando metade das vogais! Nojento!"
 ep1_flavor.0021.b.tt:0 "Ambas as [courts|E] ganham [SCOPE.ScriptValue('ep1_flavour_0021_courts_gain_opinion_value')|P0] de [opinion|E] uma da outra"
 ep1_flavor.0021.b:0 "Eles não são nossos primos linguísticos?"
 ep1_flavor.0021.c.tt:0 "$ep1_flavor.0021.a.tt$"
 ep1_flavor.0021.c:0 "Duas cortes nobres e nem um cérebro inútil entre elas..."
 ep1_flavor.0021.desc:0 "Gargalhadas me recebem quando entro na câmara: um bando de cortesãos, liderados por [nitpicker.GetTitledFirstName], estão todos reunidos em torno de uma carta recente de [rival_monarch.GetTitledFirstName].\n\n[nitpicker.GetFirstNameNoTooltip] me chama com um grito de riso.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você simplesmente #EMP precisa#! ler isso! Tem o selo oficial de [rival_realm.GetNameNoTier], mas cada outra palavra está escrita como se fosse por um camponês iletrado. Esses preguiçosos desmiolados não conseguem nem usar as consoantes certas, muito menos falar bom [ROOT.Char.GetCourtLanguage.GetName], e é #EMP hilário#!.\""
 ep1_flavor.0021.t:0 "Dois Reinos Separados por uma Linguagem Cortesã"
 ep1_flavor.0031.a:0 "Bebe tudo, [scholar_1.GetFirstNameNoTooltip]!"
 ep1_flavor.0031.b:0 "Gostamos de beber com [scholar_2.GetFirstNameNoTooltip], porque [scholar_2.GetFirstNameNoTooltip] é nosso camarada!"
 ep1_flavor.0031.c.tt:0 "Você mostra aos novos estudiosos como é feito"
 ep1_flavor.0031.c:0 "Existem algumas técnicas que apenas a experiência pode ensinar..."
 ep1_flavor.0031.d:0 "Esses rituais são #EMP# inadequados para os estudiosos."
 ep1_flavor.0031.desc:0 "É bem dito que grandes mentes requerem grandes tradições e não há tradições de iniciação acadêmica maiores do que as de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]! \n\nEsta semana marca a indução de vários novos e talentosos estudiosos na corte, vindos de todo o reino, cada um dos quais está sendo submetido a vários testes acadêmicos #EMP# em uma estalagem local. \n\nMeu olhar cai sobre [scholar_1.GetFirstName], enquanto [scholar_1.GetSheHe] olha suspeitosamente para a misteriosa bebida borbulhante e efervescente diante [scholar_1.GetHerHim]. Atrás do estudioso cauteloso, [scholar_2.GetFirstName] está enchendo uma jarra #EMP# inteira com algo espesso e pegajoso, com muitas saudações e vaias dos seus colegas acadêmicos."
 ep1_flavor.0031.inspire.scholar_1.tt:0 "[scholar_1.GetFirstNameNoTooltip] fica [inspirado|E]"
 ep1_flavor.0031.inspire.scholar_2.tt:0 "[scholar_2.GetFirstNameNoTooltip] fica [inspirado|E]"
 ep1_flavor.0031.t:0 "Novidade na Corte"
 ep1_flavor.1000.a:0 "Uma oferta justa, eu aceito."
 ep1_flavor.1000.b:0 "[eunuch_target.GetFirstNameNoTooltip], m[Select_CString( eunuch_target.IsFemale, 'inha', 'eu' )] [eunuch_target.Custom('ComplimentAdjective')] amig[Select_CString( eunuch_target.IsFemale, 'a', 'o' )], fique um pouco mais?"
 ep1_flavor.1000.c.failure:0 "[eunuch_target.GetFirstNameNoTooltip] chama você de mesquinho e segue em frente"
 ep1_flavor.1000.c.success:0 "Você convence [eunuch_target.GetFirstNameNoTooltip] a ficar"
 ep1_flavor.1000.c:0 "Não preciso de seus serviços."
 ep1_flavor.1000.desc:0 "Um eunuco viajante está se apresentando na minha corte hoje.\n\n\"Saudações, oh mais [ROOT.Char.Custom('ComplimentAdjective')] [ROOT.Char.GetTitleTierName].\" [eunuch_target.GetSheHe] diz, respeitosamente.\n\n\"Meu nome é [eunuch_target.GetFirstName], um andarilho de reputação - emprestei meu conhecimento a nobres estudiosos-Reis e cuidei dos haréns de grandes sultões - agora estou aqui, oferecendo meus serviços a você. Por uma taxa modesta.\"\n\nUm personagem intrigante, talvez eu deva empregar [eunuch_target.GetSheHe]?"
 ep1_flavor.1000.t:0 "$tradition_header$ Um Eunuco Visitante"
 ep1_flavor.1200.a:0 "Ouvi dizer que você conhece o segredo da língua?"
 ep1_flavor.1200.b:0 "Tenho muitos inimigos. Como posso derrotá-los?"
 ep1_flavor.1200.c:0 "Meu reino deve prosperar, como posso garantir que isso aconteça?"
 ep1_flavor.1200.d:0 "Charlatão! Seus segredos não passam de mentiras."
 ep1_flavor.1200.desc:0 "O eunuco [eunuch_target.GetFirstName] aparece em minha vista, [eunuch_target.Custom('quirk_pos_pp')].\n\n\"Você sabe muitas coisas, grande [ROOT.Char.GetTitleTierName]. Mas há coisas que escapam até mesmo de sua mente ineffable - segredos e conhecimentos que estou mais do que disposto a compartilhar com você.\" [eunuch_target.GetSheHe] sussurra.\n\n\"Por um preço.\"\n\nÉ claro. Mas ainda assim, estou intrigado."
 ep1_flavor.1200.t:0 "$tradition_header$ Truques do Ofício"
 ep1_flavor.2000.archer_cavalry:0 "\"Os senhores dos cavalos treinarão com coelhos correndo.\""
 ep1_flavor.2000.archers:0 "\"Treine até que todos possam acertar o alvo.\""
 ep1_flavor.2000.archers_longbow:0 "\"Homem e menino treinarão arco longo nos alvos.\""
 ep1_flavor.2000.c:0 "\"O esporte é para a nobreza, e é chamado de caça.\""
 ep1_flavor.2000.camel_cavalry:0 "As corridas aprimorarão as habilidades do cavaleiro de camelo."
 ep1_flavor.2000.cavalry:0 "\"Peguem as estacas! Os [ROOT.Char.Custom('GetRegionalCavalryMAA')|l] vão cavalgar!"
 ep1_flavor.2000.cavalry_chovgan:0 "\"Deixem-nos jogar chovgan!\""
 ep1_flavor.2000.cavalry_joust:0 "\"Tilting requer boa técnica.\""
 ep1_flavor.2000.cavalry_tzykanion:0 "\"Os cavaleiros jogarão tyzkanion!\""
 ep1_flavor.2000.culture_tt:0 "Cada cortesão e vassalo [THIS.Char.GetCulture.GetName]"
 ep1_flavor.2000.d:0 "\"Eu já gasto o suficiente com os soldados como está.\""
 ep1_flavor.2000.desc_archer_cavalry:0 "\"Os arqueiros montados são nossa espinha dorsal; competições de tiro com arco a cavalo os manterão formidáveis.\""
 ep1_flavor.2000.desc_archers:0 "\"Os [ROOT.Char.Custom('GetRegionalArcherMAA')|l] são indispensáveis, devemos garantir que suas flechas sempre acertem o alvo.\""
 ep1_flavor.2000.desc_bridge:0 "\n\n\"Não, os esforços são necessários em outro lugar.\" Interrompe [knight_scope.GetFirstNameNoTooltip],"
 ep1_flavor.2000.desc_camel_cavalry:0 "\"Os vitalizantes cavaleiros de camelo são o núcleo de sua força, você deve se concentrar neles.\""
 ep1_flavor.2000.desc_cavalry:0 "\"Sua [ROOT.Char.Custom('GetRegionalCavalryMAA')|l] é seu ativo mais valioso, não os deixe se tornarem desleixados.\""
 ep1_flavor.2000.desc_elephant_cavalry:0 "\"Os temíveis elefantes nos garantem a vitória; eles devem estar prontos a todo momento.\""
 ep1_flavor.2000.desc_infantry:0 "\"Nossa [ROOT.Char.Custom('GetRegionalInfantryMAA')|l] é vital para a vitória, não podemos permitir que eles fiquem fracos.\""
 ep1_flavor.2000.desc_intro:0 "Enquanto inspeciono um acampamento local, fica claro que [marshal_scope.GetTitledFirstName] e [knight_scope.GetTitledFirstName] estão tentando me encurralar. \n\n\"Senhor, os homens estão ociosos quando a paz prevalece; algumas atividades os manteriam ativos...\", incita meu [marshal_scope.GetCouncilTitle]."
 ep1_flavor.2000.desc_levies:0 "\"As massas pobres precisam de atividade para que estejam em forma e úteis quando convocadas.\""
 ep1_flavor.2000.desc_outro:0 "\n\nEu suponho que a prática #EMP não faz a perfeição..."
 ep1_flavor.2000.desc_skirmishers:0 "\"Nossos talentosos [ROOT.Char.Custom('GetRegionalSkirmisherMAA')|l] devem competir, para que sempre acertem seu alvo.\""
 ep1_flavor.2000.elephant_cavalry:0 "\"Os mahoots competirão pela glória!\""
 ep1_flavor.2000.infantry:0 "\"A [ROOT.Char.Custom('GetRegionalInfantryMAA')|l] adora uma boa briga.\""
 ep1_flavor.2000.knight_tt:0 "Cada [THIS.Char.Custom('MountedWarriorTerm')|U]"
 ep1_flavor.2000.levies:0 "\"Encoraje os camponeses a permanecerem ágeis.\""
 ep1_flavor.2000.levies_caid:0 "\"Cada [ROOT.Char.GetWomanMan] chutará o caid!\""
 ep1_flavor.2000.skirmishers:0 "\"Meus [ROOT.Char.Custom('GetRegionalInfantryMAA')|l] nunca erram.\""
 ep1_flavor.2000.t:0 "Exercício Marcial"
 ep1_flavor.2000.tradition_tt:0 "Devido às [traditions|E] da sua [culture|E]"
 ep1_flavor.2010.a.fake_1:0 "Tenho certeza de que é [scapegoat_1.GetTitledFirstNameNoTooltip]!"
 ep1_flavor.2010.a.fake_2:0 "Tenho certeza de que é [scapegoat_2.GetTitledFirstNameNoTooltip]!"
 ep1_flavor.2010.a.real:0 "Tenho certeza de que é [real_plotter.GetTitledFirstNameNoTooltip]!"
 ep1_flavor.2010.b.fake_1:0 "Não... será que é [scapegoat_1.GetTitledFirstNameNoTooltip]?"
 ep1_flavor.2010.b.fake_2:0 "Não... será que é [scapegoat_2.GetTitledFirstNameNoTooltip]?"
 ep1_flavor.2010.b.real:0 "Não... será que é [real_plotter.GetTitledFirstNameNoTooltip]?"
 ep1_flavor.2010.c.fake_1:0 "[scapegoat_1.GetTitledFirstNameNoTooltip] deve estar por trás disso."
 ep1_flavor.2010.c.fake_2:0 "Deve ser obra de [scapegoat_2.GetTitledFirstNameNoTooltip]."
 ep1_flavor.2010.c.real:0 "[real_plotter.GetTitledFirstNameNoTooltip] deve estar por trás disso."
 ep1_flavor.2010.d.failure:0 "Você só encontra mais dúvida."
 ep1_flavor.2010.d.success:0 "Você descobre o verdadeiro culpado."
 ep1_flavor.2010.d.success_tt:0 "O verdadeiro conspirador será exposto e preso."
 ep1_flavor.2010.d:0 "Seguirei o fio da meada."
 ep1_flavor.2010.desc:0 "A cada noite, quando as velas se apagam e a [ROOT.Char.Custom('FortifiedBuilding')] fica silenciosa, sussurros de uma conspiração para me [real_plot.GetSchemeType.GetTypeNameNoTooltip|l] assombram os aposentos."
 ep1_flavor.2010.desc_1_1:0 "[councillor_1.GetCouncilTitleFirstName] discorda privadamente, argumentando que o odor fétido de [scapegoat_1.GetTitledFirstName], meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))], merece investigação, enquanto"
 ep1_flavor.2010.desc_1_2:0 "[councillor_1.GetCouncilTitleFirstName] discorda privadamente, argumentando que [scapegoat_2.GetTitledFirstName], meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))], tem uma aparência suspeita, enquanto"
 ep1_flavor.2010.desc_1_real:0 "[councillor_1.GetCouncilTitleFirstName] discorda privadamente, argumentando que [real_plotter.GetTitledFirstName], meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))], é o culpado, enquanto"
 ep1_flavor.2010.desc_2_1:0 "[councillor_2.GetCouncilTitleFirstName] me insta a prender meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))], [scapegoat_1.GetTitledFirstName], o \"fantasma de [scapegoat_1.GetCurrentLocation.GetNameNoTooltip]\", antes que seja tarde demais.\n\n"
 ep1_flavor.2010.desc_2_2:0 "[councillor_2.GetCouncilTitleFirstName] me insta a prender meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))], [scapegoat_2.GetTitledFirstName], o \"[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] diabo\", antes que seja tarde demais.\n\n"
 ep1_flavor.2010.desc_2_real:0 "[councillor_2.GetCouncilTitleFirstName] me insta a prender meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))], [real_plotter.GetTitledFirstName], o \"traidor óbvio\", antes que seja tarde demais.\n\n"
 ep1_flavor.2010.desc_consort:0 "Será que eu estou dividindo minha cama com alguém que quer me ver morto?"
 ep1_flavor.2010.desc_councillor:0 "Será que um dos meus conselheiros mais próximos realmente busca me prejudicar?"
 ep1_flavor.2010.desc_fallback:0 "Vejo traição em cada par de olhos; verifico as mãos dos cortesãos em busca de lâminas escondidas."
 ep1_flavor.2010.desc_family:0 "Será que minha própria carne e sangue está conspirando contra mim?"
 ep1_flavor.2010.desc_outro:0 "Por [ROOT.Char.GetFaith.HighGodName], estou no meu limite..."
 ep1_flavor.2010.desc_spy_1:0 "[spymaster.GetCouncilTitleFirstName] diz que meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_1'))], [scapegoat_1.GetTitledFirstName], provavelmente está, #EMP talvez#! por trás disso... \n\n"
 ep1_flavor.2010.desc_spy_2:0 "[spymaster.GetCouncilTitleFirstName] está quase meio certo de que meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('scapegoat_2'))], [scapegoat_2.GetTitledFirstName], está por trás disso... \n\n"
 ep1_flavor.2010.desc_spy_real:0 "[spymaster.GetCouncilTitleFirstName] parece certo de que meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('real_plotter'))], [real_plotter.GetTitledFirstName], está por trás disso... \n\n"
 ep1_flavor.2010.e.tt:0 "A trama contra você vai progredir."
 ep1_flavor.2010.e:0 "Nada além de rumores."
 ep1_flavor.2010.guilty:0 "A culpa é confirmada."
 ep1_flavor.2010.innocent:0 "A culpa está em dúvida."
 ep1_flavor.2010.t:0 "Corte das Víboras"
 ep1_flavor.2020.a:0 "\"Os [SCOPE.Custom('GetMAAType1')] são a nossa espinha dorsal!\""
 ep1_flavor.2020.b:0 "\"Não somos nada sem nossos [SCOPE.Custom('GetMAAType2')]!\""
 ep1_flavor.2020.c.failure:0 "Seu argumento não convence"
 ep1_flavor.2020.c.success:0 "Seu argumento é convincente"
 ep1_flavor.2020.c:0 "\"Qual é o uso de um sem o outro?\""
 ep1_flavor.2020.d:0 "\"Parem com isso, vocês dois.\""
 ep1_flavor.2020.desc:0 "Alguma competição saudável entre soldados é natural, mas a divisão entre minha [SCOPE.Custom('GetMAAType1')] e [SCOPE.Custom('GetMAAType2')] é marcante. \n\nSua evolução é refletida na crescente animosidade de seus oficiais, [ROOT.Char.Custom('MountedWarriorTermPlural')] [knight_1.GetTitledFirstName] e [knight_2.GetTitledFirstName], que mais uma vez discutem diante de mim. \n\n"
 ep1_flavor.2020.desc_bridge:0 "[knight_2.GetFirstNameNoTooltip] zomba, antes de [knight_1.GetFirstNameNoTooltip] retrucar com ferocidade:"
 ep1_flavor.2020.desc_knight_1_archer_cavalry:0 "\"...você já #EMP viu#! um inimigo, se movendo tão rápido e tão longe?\""
 ep1_flavor.2020.desc_knight_1_archers:0 "\"...espero que você não fique sem flechas; então você teria que #EMP realmente#! lutar!\""
 ep1_flavor.2020.desc_knight_1_camel_cavalry:0 "\"Cavalos do deserto? Mais parecem #EMP vacas#! se me perguntarem.\""
 ep1_flavor.2020.desc_knight_1_elephant_cavalry:0 "\"...o quê, só um elefante? Você não quer montar algo #EMP maior#!?\""
 ep1_flavor.2020.desc_knight_1_heavy_cavalry:0 "\"...eu entendo: Por que #EMP lutar#! contra o inimigo quando você pode simplesmente pisoteá-los?\""
 ep1_flavor.2020.desc_knight_1_heavy_infantry:0 "\"...que #EMP corajoso#! você é, vestido da cabeça aos pés de armadura!\""
 ep1_flavor.2020.desc_knight_1_light_cavalry:0 "\"...bater e correr, não é? Parece mais #EMP recuar e fugir#! para mim!\""
 ep1_flavor.2020.desc_knight_1_pikemen:0 "\"...o que há de errado, com medo do inimigo chegar muito #EMP perto#! de você?\""
 ep1_flavor.2020.desc_knight_1_skirmishers:0 "\"...praticando suavizar o terreno para os lutadores #EMP reais#! novamente?\""
 ep1_flavor.2020.desc_knight_2_archer_cavalry:0 "\"Eu não vou receber lições de um #EMP domador de cavalos#! iludido com um arco.\""
 ep1_flavor.2020.desc_knight_2_archers:0 "\"Ah, por favor, eu não aceito lições de combate de um caçador glorificado.\""
 ep1_flavor.2020.desc_knight_2_camel_cavalry:0 "\"Eita, afaste-se de mim, o cheiro de camelo é avassalador.\""
 ep1_flavor.2020.desc_knight_2_elephant_cavalry:0 "\"Diz o [knight_2.GetWomanMan] que cavalga um monstro gigante com presas.\""
 ep1_flavor.2020.desc_knight_2_heavy_cavalry:0 "\"Pah, você perdeu qualquer perspectiva significativa, lá em cima em um cavalo de guerra imenso.\""
 ep1_flavor.2020.desc_knight_2_heavy_infantry:0 "\"Fácil falar, enquanto se usa uma malha tão #EMP grossa#!."
 ep1_flavor.2020.desc_knight_2_light_cavalry:0 "\"Sim, isso realmente tem peso vindo de um #EMP batedor#! presunçoso.\""
 ep1_flavor.2020.desc_knight_2_pikemen:0 "\"Ah, vá se esconder atrás de sua parede de agulhas, tolo.\""
 ep1_flavor.2020.desc_knight_2_skirmishers:0 "\"Venha e fale comigo quando você realmente desembainhar uma espada, quanto mais usá-la.\""
 ep1_flavor.2020.t:0 "Rivalidade Inter-Serviços"
 ep1_flavor.2030.a:0 "\"Eu decido em favor de [local_dispute_1.GetTitledFirstNameNoTooltip].\""
 ep1_flavor.2030.b:0 "\"[local_dispute_2.GetTitledFirstNameNoTooltip] está certo.\""
 ep1_flavor.2030.c.tt:0 "[local_dispute_1.GetFirstNameNoTooltip] junta-se à sua corte"
 ep1_flavor.2030.c:0 "\"[local_dispute_1.Custom('GetLocalRole')|U], eu poderia usar um [local_dispute_1.GetWomanMan] como você.\""
 ep1_flavor.2030.d.tt:0 "[local_dispute_2.GetFirstNameNoTooltip] junta-se à sua corte"
 ep1_flavor.2030.d:0 "\"Venha trabalhar para mim, [local_dispute_2.Custom('GetLocalRole')|l].\""
 ep1_flavor.2030.desc_1_baron:0 "[local_dispute_1.GetFirstName], o [local_dispute_1.GetTitleAsNameNoTooltip] de [local_dispute_1.GetPrimaryTitle.GetNameNoTier],"
 ep1_flavor.2030.desc_1_bishop:0 "[local_dispute_1.GetFirstName], o [local_dispute_1.GetTitleAsNameNoTooltip] [local_dispute_1.GetFaith.GetAdjective] de [local_dispute_1.GetPrimaryTitle.GetNameNoTier],"
 ep1_flavor.2030.desc_1_captain:0 "[local_dispute_1.GetFirstName], um comandante da guarnição local de [local_county_1.GetNameNoTierPossessive],"
 ep1_flavor.2030.desc_1_culture:0 "[local_dispute_1.GetFirstName], um líder da minoria [local_dispute_1.GetCulture.GetName] de [local_county_1.GetNameNoTierPossessive],"
 ep1_flavor.2030.desc_1_faith:0 "[local_dispute_1.GetFirstName], uma figura representativa da população [local_dispute_1.GetFaith.GetAdjective] de [local_county_1.GetNameNoTierPossessive],"
 ep1_flavor.2030.desc_1_judge:0 "[local_dispute_1.GetFirstName], um árbitro local celebrado de [local_county_1.GetNameNoTier],"
 ep1_flavor.2030.desc_1_merchant:0 "[local_dispute_1.GetFirstName], um comerciante líder de [local_county_1.GetNameNoTier],"
 ep1_flavor.2030.desc_1_monk:0 "[local_dispute_1.GetFirstName], uma notável [local_dispute_1.Custom('NunMonk')] [local_dispute_1.GetFaith.GetAdjective] de [local_county_1.GetNameNoTier],"
 ep1_flavor.2030.desc_1_scholar:0 "[local_dispute_1.GetFirstName], um eminente estudioso [local_dispute_1.GetWomanMan] em [local_county_1.GetNameNoTier],"
 ep1_flavor.2030.desc_2_baron:0 "[local_dispute_2.GetFirstName], [local_dispute_2.GetTitleAsNameNoTooltip] de [local_dispute_2.GetPrimaryTitle.GetNameNoTier],"
 ep1_flavor.2030.desc_2_bishop:0 "[local_dispute_2.GetFirstName], o [local_dispute_2.GetTitleAsNameNoTooltip] [local_dispute_2.GetFaith.GetAdjective] de [local_dispute_2.GetPrimaryTitle.GetNameNoTier],"
 ep1_flavor.2030.desc_2_captain:0 "[local_dispute_2.GetFirstName], um conhecido oficial de justiça de [local_county_2.GetNameNoTier],"
 ep1_flavor.2030.desc_2_culture:0 "[local_dispute_2.GetFirstName], um porta-voz da minoria [local_dispute_1.GetCulture.GetName] de [local_county_1.GetNameNoTierPossessive],"
 ep1_flavor.2030.desc_2_faith:0 "[local_dispute_2.GetFirstName], um representante da minoria [local_dispute_2.GetFaith.GetAdjective] de [local_county_2.GetNameNoTierPossessive],"
 ep1_flavor.2030.desc_2_judge:0 "[local_dispute_2.GetFirstName], um eminente juiz [local_county_2.GetTierAsNameNoTooltip|l] de [local_county_2.GetNameNoTier],"
 ep1_flavor.2030.desc_2_merchant:0 "[local_dispute_2.GetFirstName], um comerciante proeminente sediado em [local_county_2.GetNameNoTier],"
 ep1_flavor.2030.desc_2_monk:0 "[local_dispute_2.GetFirstName], uma celebrada [local_dispute_2.Custom('NunMonk')] [local_dispute_2.GetFaith.GetAdjectiveNoTooltip] de [local_county_2.GetNameNoTier],"
 ep1_flavor.2030.desc_2_scholar:0 "[local_dispute_2.GetFirstName], um notável [local_dispute_2.GetWomanMan] de letras em [local_county_1.GetNameNoTier],"
 ep1_flavor.2030.desc_bridge:0 "e"
 ep1_flavor.2030.desc_intro:0 "A burocracia [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] geralmente avança sob seu próprio impulso, mas de vez em quando um problema sem solução clara surge. \n\nHoje, é"
 ep1_flavor.2030.desc_outro:0 "que têm se desentendido.\n\nMinha mente gira com detalhes mesquinhos, e logo fica claro que nenhuma das partes está certa, e somente uma sairá satisfeita daqui..."
 ep1_flavor.2030.t:0 "Tomando Partido"
 ep1_flavor.2040.a:0 "\"Suponho que possa me desfazer dele...\""
 ep1_flavor.2040.b:0 "\"Traga minha bolsa de moedas!\""
 ep1_flavor.2040.c:0 "\"Ha! '#EMP [exotic_blade_holder.GetCapitalLocation.GetTitle.GetDeJureLiege.GetDeJureLiege.GetNameNoTierNoTooltip]#!'... que absurdo! Fora com você!\""
 ep1_flavor.2040.desc.artifact:0 "\"Eu vi o sua [my_artifact.GetName], se separar dele e eu lhe darei esta [exotic_blade.Custom('ArtifactType')|l] única no mundo...\""
 ep1_flavor.2040.desc.gold:0 "\"Esta [exotic_blade.Custom('ArtifactType')|l] única pode ser sua—por um preço especial, é claro — grande [ROOT.Char.GetTitleAsNameNoTooltip]...\"\n\nUma história bastante provável, de fato!"
 ep1_flavor.2040.desc.outro:0 "Se ao menos eu tivesse algum meio para verificar a história do vendedor..."
 ep1_flavor.2040.desc.outro_antiquarian:0 "Eu procuro por [antiquarian.GetTitledFirstName] para orientação:"
 ep1_flavor.2040.desc.outro_bad_praise:0 "\"Que excelente obra de arte [exotic_blade_holder.GetPrimaryTitle.GetNameNoTierNoTooltip]! Veja só como é brilhante!\""
 ep1_flavor.2040.desc.outro_bad_unsure:0 "\"Eu hesito em dizer com certeza, mas não estou convencido de que este item é o que afirmam.\""
 ep1_flavor.2040.desc.outro_bad_warning:0 "\"[exotic_blade_holder.GetPrimaryTitle.GetNameNoTierNoTooltip] ou não, esta é uma peça ruim, meu senhor, eu duvido muito de sua suposta procedência.\""
 ep1_flavor.2040.desc.outro_good_praise:0 "\"Certamente não é falso, meu senhor, este trabalho é realmente [exotic_blade_holder.GetPrimaryTitle.GetAdjectiveNoTooltip], e de alta qualidade.\""
 ep1_flavor.2040.desc.outro_good_unsure:0 "\"Não estou familiarizado com o trabalho [exotic_blade_holder.GetPrimaryTitle.GetAdjectiveNoTooltip], mas parece bem feito.\""
 ep1_flavor.2040.desc.outro_good_warning:0 "\"Eu não posso recomendar este trabalho, meu senhor, os... amassados do martelo são... tristes.\" [exotic_blade_holder.GetSheHe|U] acena para mim estupidamente."
 ep1_flavor.2040.desc:0 "Junto com suas mercadorias estranhas, os comerciantes trazem histórias fabulosas de terras distantes; não verificáveis; cheias de maravilhas. \n\nUm grupo de vendedores [foreign_merchant.GetCulture.GetNameNoTooltip] afirma ter trazido objetos '#EMP [exotic_blade_holder.GetCulture.GetNameNoTooltip]#!', supostamente vindos do longínquo tribunal de um grande governante: '#EMP [exotic_blade_holder.GetFullNameNoTooltipRegnal]#!', nada menos. \n\n[foreign_merchant.GetTitledFirstName], o líder do comércio, sorri maliciosamente,"
 ep1_flavor.2040.t:0 "Armas Exóticas"
 ep1_flavor.2040.toast:0 "A [exotic_blade.Custom('ArtifactType')|l] é esplêndida"
 ep1_flavor.2040.toast_poor:0 "A [exotic_blade.Custom('ArtifactType')|l] é medíocre"
 ep1_flavor.2040.tt_exotic:0 "Você se tornará o proprietário de [exotic_blade.GetName]"
 ep1_flavor.2040.tt_my:0 "Você perderá seu [my_artifact.GetName]"
 ep1_flavor.2060.a.tt:0 "[detective_scope.GetFirstName] e [grocer_scope.GetFirstName] saem"
 ep1_flavor.2060.a:0 "\"Tenho certeza de que há uma explicação razoável.\""
 ep1_flavor.2060.b.title:0 "Um intrometido sanguinário"
 ep1_flavor.2060.b:0 "\"Prenda [grocer_scope.GetFirstNameNoTooltip], então venha trabalhar para mim!\""
 ep1_flavor.2060.c.title:0 "Não conseguiu pegar os assassinos"
 ep1_flavor.2060.c:0 "\"Uma pena você ter se envolvido, [detective_scope.GetFirstNameNoTooltip]...\""
 ep1_flavor.2060.death_tt:0 "[victim_scope.GetName] desapareceu misteriosamente"
 ep1_flavor.2060.desc:0 "[detective_scope.GetFirstName], um subordinado local do [sandford_scope.GetTitle.GetHolder.GetTitleAsNamePossessiveNoTooltip], solicita uma audiência privada, alegando saber quem está por trás dos recentes desaparecimentos de [victim_scope.GetTitledFirstName] e outros viajantes em minha corte. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Descobri uma cabala sombria liderada por [grocer_scope.GetTitledFirstName], um comerciante. Eles se denominam a Vigilância [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] e aqueles que eles consideram manchar a grandeza [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip] frequentemente desaparecem!\" \n\nQuando trago o comerciante, [grocer_scope.GetSheHe] nega tudo, afirmando que a [detective_scope.GetWomanMan] está delirando por passar muitos anos nas ruas perigosas de [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]..."
 ep1_flavor.2060.t:0 "O Bem Maior"
 ep1_flavor.2070.a:0 "\"Diga, você ficaria um pouco mais, [symposium_scholar.GetFirstNameNoTooltip]?\""
 ep1_flavor.2070.c.failure:0 "[symposium_scholar.GetFirstNameNoTooltip] te constrange"
 ep1_flavor.2070.c.lang:0 "\"Você acabou de dizer o que eu acho que disse?\""
 ep1_flavor.2070.c.success:0 "Você prova que [symposium_scholar.GetFirstNameNoTooltip] está errado"
 ep1_flavor.2070.c.tt:0 "[symposium_scholar.GetFirstNameNoTooltip] pode se juntar à sua corte"
 ep1_flavor.2070.c:0 "\"Você está errado: aqui está o porquê.\""
 ep1_flavor.2070.d:0 "\"Acho que é hora de você sair, [symposium_scholar.Custom('GetScholarType')|l].\""
 ep1_flavor.2070.desc.fall_alchemy:0 "\"Essa proporção nunca funcionaria,\" [symposium_courtier.GetFirstNameNoTooltip] balança a cabeça, examinando arranhões em um pedaço de casca. \"Isso já foi tentado antes.\" \n\nA [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] responde \"Todo mundo comete erros — até mesmo os alquimistas — eles podem ter perdido algo."
 ep1_flavor.2070.desc.fall_books:0 "\"Você claramente tem lido os livros errados\", [symposium_courtier.GetFirstNameNoTooltip] diz com desdém, \"vou lhe dar uma lista de recomendações [symposium_courtier.GetCulture.GetNameNoTooltip]...\" \n\n\"Está tudo bem\", responde o [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] com calma, \"claramente não há muito neles."
 ep1_flavor.2070.desc.fall_stars:0 "\"Não, não, não! Essas teorias foram desacreditadas há séculos\", [symposium_courtier.GetFirstNameNoTooltip] franze a testa em descrença genuína, \"você não leu os clássicos da astronomia?\" \n\n\"Você lê em vez de pensar\", retorque a [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan], \"ainda há muito que temos que aprender."
 ep1_flavor.2070.desc.intro:0 "Ao passar pela biblioteca, o burburinho do descontentamento de [symposium_courtier.GetTitledFirstNamePossessive] desperta meu interesse. [symposium_courtier.GetSheHe|U] está debatendo com [symposium_scholar.GetTitledFirstName], um visitante [symposium_scholar.GetCulture.GetNameNoTooltip] [symposium_scholar.Custom('GetScholarType')|l] de certa reputação. \n\n"
 ep1_flavor.2070.desc.ling_diff_cult:0 "\"Por [symposium_courtier.GetFaith.HighGodName], ouça a si mesmo!\", [symposium_courtier.GetFirstNameNoTooltip] se encolhe, \"Este dialeto [symposium_scholar.GetCulture.GetNameNoTooltip] massacra a bela língua de [symposium_courtier.GetCulture.GetLanguage.GetNameNoTooltip], é como se você estivesse falando [ling_cul_1_bonus.GetLanguage.GetNameNoTooltip]!\" \n\n[symposium_scholar.GetFirstNameNoTooltip] compõe-se, \"[symposium_ruler.GetTitledFirstNamePossessive] corte e língua são muito mais puros do que essa desculpa insignificante para um [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\""
 ep1_flavor.2070.desc.ling_diff_lang:0 "\"Sua língua estrangeira não tem nuances para discutir essas ideias\", [symposium_courtier.GetFirstNameNoTooltip] diz com desprezo, \"é claro que é por isso que você aprendeu #EMP [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]#!.\" \n\nA [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] revira os olhos e murmura alguns juramentos em [symposium_scholar.GetCulture.GetLanguage.GetNameNoTooltip] sob a respiração."
 ep1_flavor.2070.desc.ling_same_cult:0 "\"A escrita do [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] é muito mais desenvolvida do que qualquer coisa encontrada em [symposium_ruler.GetPrimaryTitle.GetNameNoTierNoTooltip],\" boceja [symposium_courtier.GetFirstNameNoTooltip], \"você deve levar alguns livros com você quando sair.\" \n\n\"É incrível o quão errado alguém pode estar\", resmunga a [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan], \"e enquanto entregue com tanta certeza..."
 ep1_flavor.2070.desc.medicine:0 "\"Um médico tem seus usos, mas é [symposium_courtier.GetFaith.HighGodName] quem tem a palavra final sobre vida e morte,\" lamenta [symposium_courtier.GetFirstNameNoTooltip], \"nenhuma pomada pode tratar a alma.\" \n\n\"Vejo que você não entende de medicina\", suspira a [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan], \"muitos poderiam ser salvos se não houvesse tanta ignorância.\""
 ep1_flavor.2070.desc.mystic:0 "\"Essas práticas esotéricas não têm lugar no reino de [symposium_courtier.GetFaith.HighGodName],\" repreende [symposium_courtier.GetFirstNameNoTooltip], \"são apenas ilusões, e se escondem atrás do mistério.\" \n\nA [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] sorri com desprezo: \"Você simplesmente teme o que não entende e não tem coragem ou inteligência para aprender.\""
 ep1_flavor.2070.desc.theo_diff_relig:0 "\"Nunca entendi os ensinamentos [symposium_scholar.GetFaith.GetReligion.GetAdjectiveNoTooltip],\" reflete [symposium_courtier.GetFirstNameNoTooltip], \"[symposium_scholar.GetFaith.HighGodName] parece uma figura pouco convincente em comparação com [symposium_courtier.GetFaith.HighGodName].\"\n\nA [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan] sorri sarcasticamente: \"Que profundo entendimento você tem! Se você fosse um [symposium_scholar.GetFaith.BishopNeuter], certamente alcançaria a [symposium_scholar.GetFaith.PositiveAfterLife]!\""
 ep1_flavor.2070.desc.theo_same_faith:0 "\"Você está cometendo os mesmos erros que os iniciados [symposium_courtier.GetFaith.GetAdjectiveNoTooltip], diz [symposium_courtier.GetFirstNameNoTooltip], torcendo o nariz, \"verdadeiramente, este é o caminho para a heresia.\" \n\n\"Venha agora\", suplica a [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan], \"certamente [symposium_scholar.GetFaith.HighGodName] não pretendia que seus ensinamentos fossem tão imutáveis, especialmente quando deixados apenas para nós interpretar.\""
 ep1_flavor.2070.desc.theo_same_faith_diff_cult:0 "\"Eu não tinha a menor ideia de quão distante [symposium_ruler.GetPrimaryTitle.GetAdjectiveNoTooltip] [symposium_courtier.GetFaith.GetNameNoTooltip] havia se afastado dos ensinamentos de [symposium_scholar.GetFaith.HighGodNamePossessive]!\" zomba [symposium_courtier.GetFirstNameNoTooltip].\n\n\"Bobagem,\" balança o dedo a [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan], \"são os [symposium_courtier.GetCulture.GetNameNoTooltip] [symposium_courtier.GetFaith.GetAdherentNamePluralNoTooltip] que se perderam, voltando para práticas pagãs.\""
 ep1_flavor.2070.desc.theo_same_relig:0 "\"As diferenças entre o [symposium_courtier.GetFaith.GetNameNoTooltip] e o [symposium_scholar.GetFaith.GetNameNoTooltip] são mais do que meramente técnicas,\" leciona [symposium_courtier.GetFirstNameNoTooltip], \"sua heresia se afastou de [symposium_courtier.GetFaith.HighGodName].\"\n\n\"A verdadeira natureza da [symposium_courtier.GetFaith.GetReligion.GetNameNoTooltip] é abrangida por ambas as fés,\" diz solenemente a [symposium_scholar.Custom('GetYoungMiddleAgedOld')] [symposium_scholar.GetWomanMan], \"são os ignorantes que fazem gargantas de riachos.\""
 ep1_flavor.2070.e:0 "Fora, blasfemo!"
 ep1_flavor.2070.t:0 "Quando Mentes Colidem"
