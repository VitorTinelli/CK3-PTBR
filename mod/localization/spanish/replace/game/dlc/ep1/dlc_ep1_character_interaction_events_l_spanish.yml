l_spanish:
 ep1_character_interaction.0001.a:0 "*Rindo maliciosamente* Oh sim, [actor_nemesis.GetFirstNameNoTooltip] nunca verá isso chegando!"
 ep1_character_interaction.0001.b:0 "Excelente! Agora, você irá se entregar à corte de [actor_rival.GetFirstNamePossessiveNoTooltip]..."
 ep1_character_interaction.0001.c:0 "Saia daqui até que eu precise de você!"
 ep1_character_interaction.0001.d:0 "Naturalmente, você ficará onde eu possa vigiá-lo."
 ep1_character_interaction.0001.desc.ambitious:0 "sempre os força a ficarem em multidões por horas e aplaudir em seu discursos,"
 ep1_character_interaction.0001.desc.arbitrary:0 "rotineiramente pede que eles cometam pequenos crimes em seu nome, resultando em multas"
 ep1_character_interaction.0001.desc.arrogant:0 "não permite que servos comuns realizem tarefas para [recipient.GetSheHe], insistindo em gastar o tempo da equipe líder e"
 ep1_character_interaction.0001.desc.brave:0 "nunca recusa a menor chance de uma luta, causando a maioria da limpeza por [recipient.GetHerselfHimself] e"
 ep1_character_interaction.0001.desc.callous:0 "abusou da equipe sem remorso, fazendo muitos saírem e"
 ep1_character_interaction.0001.desc.calm:0 "atrasou o jantar semana após semana com deliberações meditativas sobre qual prato [recipient.GetSheHe] prefere,"
 ep1_character_interaction.0001.desc.chaste:0 "continuamente move ou obscurece qualquer obra de arte que [recipient.GetSheHe] considera desagradável, obrigando-os a gastar horas por dia para arrumar as coisas e"
 ep1_character_interaction.0001.desc.compassionate:0 "doou quase todo o estoque de comida para mendigos sem-teto,"
 ep1_character_interaction.0001.desc.content:0 "sempre os encoraja a deixar trabalhos pela metade ou nem fazer, criando na verdade mais trabalho depois e"
 ep1_character_interaction.0001.desc.craven:0 "obriga-os a esfregar cada item de comida que [recipient.GetSheHe] come com sabão por medo de veneno,"
 ep1_character_interaction.0001.desc.cynical:0 "fez algo indizível na porta de um[actor.GetFaith.HouseOfWorship] particular do tribunal,"
 ep1_character_interaction.0001.desc.deceitful:0 "parece gostar de espalhar informações falsas sem motivo aparente, semeando o caos por toda a corte e"
 ep1_character_interaction.0001.desc.diligent:0 "os forçou a repetir o trabalho até a perfeição sem levar em consideração o volume de tarefas,"
 ep1_character_interaction.0001.desc.fallback_1:0 "tentou criar um bando de galinhas em sua câmara, causando danos"
 ep1_character_interaction.0001.desc.fallback_2:0 "aniquilou completamente meu banheiro pessoal, causando danos"
 ep1_character_interaction.0001.desc.fallback_3:0 "trocou um dos meus cavalos premiados por uma cabra \"mágica\""
 ep1_character_interaction.0001.desc.fallback_4:0 "foi o único responsável por um incêndio que queimou a ala oeste,"
 ep1_character_interaction.0001.desc.fallback_5:0 "desfigurou meu trono com graffiti retratando os seus ativos,"
 ep1_character_interaction.0001.desc.fickle:0 "ocupou hordas de seu número com pedidos em constante mudança,"
 ep1_character_interaction.0001.desc.forgiving:0 "apenas finge ser perdoador e, em vez disso, é $ep1_character_interaction.0001.desc.vengeful$"
 ep1_character_interaction.0001.desc.generous:0 "repetidamente deu a propriedade da corte como se fosse sua própria,"
 ep1_character_interaction.0001.desc.gluttonous:0 "come mais sozinho do que todo o resto da corte combinado,"
 ep1_character_interaction.0001.desc.greedy:0 "foi visto cortando pedaços de metais preciosos de nossos ornamentos mais caros,"
 ep1_character_interaction.0001.desc.gregarious:0 "faz constantemente festas pessoais extravagantes com os estoques do tribunal,"
 ep1_character_interaction.0001.desc.honest:0 "humilha-os diariamente com opiniões francas sobre sua aparência, atitudes e ética de trabalho. A equipe perdida sozinha é"
 ep1_character_interaction.0001.desc.humble:0 "finge ser humilde, mas na verdade passa o tempo desviando a equipe com arrogância. O caos é"
 ep1_character_interaction.0001.desc.impatient:0 "dá-lhes centenas de tarefas por dia, raramente esperando por uma para começar antes de adicionar a próxima e"
 ep1_character_interaction.0001.desc.intro:0 "[recipient.GetFirstName] parece #EMP aterrorizado# ao ser acusado por servo após servo, cada um afirmando que [recipient.GetSheHe]"
 ep1_character_interaction.0001.desc.just:0 "já relatou tantas pequenas indiscrições entre a equipe que eles gastam mais tempo discutindo sobre culpa percebida do que trabalhando,"
 ep1_character_interaction.0001.desc.lazy:0 "toma mais tempo com tarefas triviais do que o resto da corte com as tarefas vitais,"
 ep1_character_interaction.0001.desc.lustful:0 "irreparavelmente sujou a maioria da roupa de cama cara da corte,"
 ep1_character_interaction.0001.desc.outro:0 "(supostamente) me custando uma pequena fortuna pessoal.\n\nA [recipient.GetWomanMan] mal começou a gaguejar sobre a inocência dela e uma conspiração quando eu levanto a mão.\n\n\"Claramente você transgrediu, [recipient.GetFirstNameNoTooltip]. Eu poderia ignorar suas transgressões, se você estiver disposto a fazer uma pequena promessa para mim...\""
 ep1_character_interaction.0001.desc.paranoid:0 "insiste em supervisionar pessoalmente cada tarefa deles com medo de trapaça,"
 ep1_character_interaction.0001.desc.patient:0 "continuamente emite tarefas que levarão semanas ou meses para serem concluídas,"
 ep1_character_interaction.0001.desc.sadistic:0 "atacou uma cabra prêmio com um facão de carne,"
 ep1_character_interaction.0001.desc.shy:0 "entra em pânico constantemente quando os servos entram na sua presença sem avisar, causando atrasos onde quer que [recipient.GetSheHe] vá e"
 ep1_character_interaction.0001.desc.stubborn:0 "provocou uma discussão com o séquito de um nobre visitante, causando destruição"
 ep1_character_interaction.0001.desc.temperate:0 "expulsou três de nossos melhores cozinheiros ao torcer o nariz para o jantar atrás do jantar,"
 ep1_character_interaction.0001.desc.trusting:0 "continuamente traz charlatões e bandidos para os corredores para enganar e roubar,"
 ep1_character_interaction.0001.desc.vengeful:0 "consistentemente destrói utensílios de mesa caros por despeito mesquinho,"
 ep1_character_interaction.0001.desc.wrathful:0 "jogou a maioria dos assentos de uma pessoa da corte de sua varanda,"
 ep1_character_interaction.0001.desc.zealous:0 "passa horas de seu dia todos os dias com sua pregação e fanatismo,"
 ep1_character_interaction.0001.t:0 "Uma Recompensa Sensata"
