l_spanish:
 court_position.9001.desc:0 "Minha tentativa de assassinar [target.GetTitledFirstNamePossessive] foi frustrada!\n\nMeus agentes não contaram com o testador de comida de [target.GetTitledFirstName], e o veneno nem sequer chegou ao seu prato."
 court_position.9001.food_taster_dies:0 "\n\nPelo menos o testador de comida sucumbiu ao veneno. [food_taster.GetTitledFirstName] não vai mais ficar no meu caminho."
 court_position.9001.t:0 "$murder_save_header$ $food_taster_court_position$"
 court_position.9002.desc:0 "Um assassino tentou me matar! Felizmente meu testador de comida confiável, [food_taster.GetFirstName], estava fazendo o trabalho dele e o veneno nem chegou ao meu prato."
 court_position.9002.food_taster_dies:0 "Tragicamente, [food_taster.GetFirstNameNoTooltip] ingeriu muito veneno e não pôde ser salvo."
 court_position.9002.owner_discovered:0 "\n\nNão há dúvida de que isso foi tudo obra de [owner.Custom2('MyCharacterIntroductionNoComma', ROOT.Char)]!"
 court_position.9011.cupbearer_dies:0 "\n\nPelo menos o copeiro sucumbiu ao veneno. [cupbearer.GetSheHe|U] não vai mais ficar no meu caminho."
 court_position.9011.desc:0 "Minha tentativa de assassinar [target.GetTitledFirstNamePossessive] foi frustrada!\n\nMeus agentes não contaram com o seu copeiro, e embora o veneno tenha entrado na bebida de [target.GetTitledFirstNamePossessive], ele não passou dos lábios de [cupbearer.GetTitledFirstNamePossessive]."
 court_position.9011.t:0 "$murder_save_header$ $cupbearer_court_position$"
 court_position.9012.cupbearer_dies:0 "Tragicamente, [cupbearer.GetFirstNameNoTooltip] ingeriu muito veneno e não pôde ser salvo. Há uma lição aqui em algum lugar sobre tomar liberdades excessivas..."
 court_position.9012.desc:0 "Um assassino tentou me matar! Felizmente meu copeiro, [cupbearer.GetFirstName], havia tomado a liberdade de provar meu [ROOT.Char.Custom('RegionalDrink')] antes de me servir hoje."
 court_position.9021.bodyguard_dies:0 "\n\nPelo menos o guarda-costas morreu por causa de suas lesões e não vai mais ficar no meu caminho."
 court_position.9021.desc:0 "Minha tentativa de assassinar [target.GetTitledFirstNamePossessive] foi frustrada!\n\nO guarda-costas [bodyguard.Custom2('InsultAdjective', ROOT.Char)] [target.GetHerHim] venceu o assassino que enviei, e [target.GetFirstNameNoTooltip] nem sequer recebeu um arranhão!"
 court_position.9021.t:0 "$murder_save_header$ $bodyguard_court_position$"
 court_position.9022.bodyguard_dies:0 "\n\nInfelizmente, [bodyguard.GetSheHe] sofreu graves ferimentos durante a luta e não pôde ser salvo."
 court_position.9022.desc:0 "Um assassino tentou tirar minha vida!\n\nEnquanto eu caminhava pelos corredores vazios tarde da noite, um assassino de repente surgiu das sombras, e eu nem quero imaginar o que teria acontecido se meu confiável guarda-costas [bodyguard.GetTitledFirstName] não estivesse me acompanhando."
