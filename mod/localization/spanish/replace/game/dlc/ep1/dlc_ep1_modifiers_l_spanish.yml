l_spanish:
 above_petty_differences_modifier:0 "Acima das Diferenças Pequenas"
 above_petty_differences_modifier_desc:0 "Este personagem não se importa com as pequenas coisas, focando nas coisas em comum entre as pessoas em vez de pequenas disputas."
 humbling_hall_modifier:0 "Sala Humilhante"
 humbling_hall_modifier_desc:0 "Uma sala nesta corte é famosa por um incidente que humilhou dois nobres diplomatas, uma história de justiça agradável usada pelo povo como uma fábula tutelar."
 inscrutable_host_modifier:0 "Anfitrião Inescrutável"
 inscrutable_host_modifier_desc:0 "Este personagem é amplamente considerado como alguém que pensa que a vingança é um prato que se come frio. Provavelmente."
 inspiration_alchemy_condoned_by_church_modifier:0 "A Igreja aprova a Alquimia"
 inspiration_alchemy_condoned_by_church_modifier_desc:0 "A igreja local decidiu aprovar a fascinação deste personagem por experimentos alquímicos."
 inspiration_invested_in_new_forge_modifier:0 "Nova Forja"
 inspiration_invested_in_new_forge_modifier_desc:0 "Este personagem possui uma nova e altamente eficiente forja."
 known_killjoy_modifier:0 "Matador de Alegria Conhecido"
 known_killjoy_modifier_desc:0 "Nenhuma diversão permitida, por decreto nobre."
 lacking_diplomatic_munity_modifier:0 "Falta de Imunidade Diplomática"
 lacking_diplomatic_munity_modifier_desc:0 "Todos sabem que um diplomata visitando esta corte está um pouco menos seguro do que a tradição dita."
 legendary_party_aftermath_modifier:0 "Consequências de Festa Lendária"
 legendary_party_aftermath_modifier_desc:0 "A corte deste personagem ainda carrega as cicatrizes devastadoras de uma festa vergonhosamente excelente, porém destrutiva."
 mythic_party_aftermath_modifier:0 "Consequências de Festa Mítica"
 mythic_party_aftermath_modifier_desc:0 "A corte deste personagem ainda carrega as cicatrizes devastadoras de uma festa tão gloriosamente devastadora que vive na memória local."
 raised_in_secrecy_modifier:0 "Criado em Segredo"
 raised_in_secrecy_modifier_desc:0 "Este personagem foi criado em completo segredo e quase total isolamento desde o nascimento."
 what_did_i_just_drink_modifier:0 "O Que eu Acabei de Beber?"
 what_did_i_just_drink_modifier_desc:0 "Aquilo foi... eu... minha cabeça... Ai."
 world_shattering_party_aftermath_modifier:0 "Consequências de Festa de Impacto Mundial"
 world_shattering_party_aftermath_modifier_desc:0 "A corte deste personagem ainda carrega as cicatrizes devastadoras de uma festa tão caótica que causou mais danos do que a maioria das pequenas cercas."
