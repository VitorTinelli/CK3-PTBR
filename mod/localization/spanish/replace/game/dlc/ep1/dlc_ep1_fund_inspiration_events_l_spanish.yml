 fund_inspiration.0061.desc:0 "\"Obrigado por financiar este empreendimento meu, [ROOT.Char.Custom('FormOfAddressForLiege')].\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tenta manter a compostura, mas posso ver a excitação em seus olhos.\n\n\"Caixas, esculturas, #EMP tronos#!... Há tanto que posso criar! Talvez você tenha algum desejo?\""
