 fund_inspiration.0061.scientific_apparatus:0 "Talvez um instrumento de aprendizado e conhecimento?"
 fund_inspiration.0061.sculpture:0 "Eu quero uma estátua esplêndida!"
 fund_inspiration.0061.table:0 "Eu gostaria de uma mesa elegante, mas também resistente!"
 fund_inspiration.0061.throne:0 "Crie um grande trono digno dos meus salões!"
 fund_inspiration.0061.urn:0 "Uma urna decorativa completaria meus salões."
 fund_inspiration.0062.t:0 "Fundado o Fundo de Inspiração do Artista"
 fund_inspiration.0071.aquamanile:0 "Um aquamanil ornamental, para purificação ritual."
 fund_inspiration.0071.brooch:0 "Eu quero um broche bonito!"
 fund_inspiration.0071.crown:0 "Uma coroa régia, digna de repousar sobre minha cabeça!"
 fund_inspiration.0071.desc:0 "\"Obrigado por financiar este empreendimento meu, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tenta manter a compostura, mas eu posso ver a excitação em seus olhos enquanto [inspiration_owner.GetSheHe] continua. \"Eu posso trabalhar o metal em #EMP maravilhas#! Talvez você tenha algum desejo?\""
 fund_inspiration.0071.goblet:0 "Um cálice requintado."
 fund_inspiration.0071.incense_burner_sculpture:0 "Um queimador de incenso intricado."
 fund_inspiration.0071.regalia:0 "Faça uma insígnia adequada à minha posição."
 fund_inspiration.0072.t:0 "Fundo para Inspiração de Ferreiro de Metais"
 fund_inspiration.0081.desc:0 "\"Você não vai se arrepender de me apoiar, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se curva diante de mim antes de [inspiration_owner.Custom('quirk_pos_pp')].\n\n\"Agora, eu poderia ter alguns béqueres e enxofre? Eu tenho muito a estudar. Há alguma área específica que você gostaria que eu começasse a investigar?\""
 fund_inspiration.0081.elixirs:0 "Eu ouvi rumores sobre as maravilhas dos elixires!"
 fund_inspiration.0081.immortality:0 "Eu quero viver para sempre."
 fund_inspiration.0081.metals:0 "Metais sempre me fascinaram."
 fund_inspiration.0081.panacea:0 "Um remédio para todas as doenças, uma panaceia!"
 fund_inspiration.0081.they_decide_option_tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] estudará e produzirá um [artifact|E], a seu critério."
 fund_inspiration.0081.you_decide_option_tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] estudará e produzirá um [artifact|E], com base em suas instruções."
 fund_inspiration.0082.t:0 "Fundado o Fundo de Inspiração da Alquimia"
 fund_inspiration.0091.a:0 "Um arco tradicional e simples, nada mais."
 fund_inspiration.0091.b:0 "Esculpa para mim um poderoso arco longo."
 fund_inspiration.0091.c:0 "Cola e tendões dão o maior impacto."
 fund_inspiration.0091.d:0 "Você deve me entregar uma engenhoca refinada."
 fund_inspiration.0091.desc:0 "[inspiration_owner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))] antes de se curvar profundamente. \"Claro que posso encordoar um arco para você, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord],\" o entusiasmo [inspiration_owner.GetHerHim] transparece em seus esforços ansiosos para manter a formalidade.\n\n\"Mas qual é seu estilo preferido de tiro? Desejo esculpir algo que lhe sirva da melhor forma.\""
 fund_inspiration.0091.tooltip_bow.tt:0 "Você recebe um arco ao final da [inspiration|E]"
 fund_inspiration.0091.tooltip_bow:0 "$fund_inspiration.0011.tooltip_action$ um arco"
 fund_inspiration.0091.tooltip_composite.tt:0 "Você recebe um arco composto ao final da [inspiration|E]"
 fund_inspiration.0091.tooltip_composite:0 "$fund_inspiration.0011.tooltip_action$ um arco composto"
 fund_inspiration.0091.tooltip_crossbow.tt:0 "Você recebe uma besta ao final da [inspiration|E]"
 fund_inspiration.0091.tooltip_crossbow:0 "$fund_inspiration.0011.tooltip_action$ uma besta"
 fund_inspiration.0091.tooltip_longbow.tt:0 "Você recebe um arco longo ao final da [inspiration|E]"
 fund_inspiration.0091.tooltip_longbow:0 "$fund_inspiration.0011.tooltip_action$ um arco longo"
 fund_inspiration.1001.a:0 "Isso é adorável!"
 fund_inspiration.1001.b.coronation_ready:0 "Você agora pode sediar uma [coronation|E]"
 fund_inspiration.1001.b:0 "Que os preparativos comecem."
 fund_inspiration.1001.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com um sorriso largo. \"Eu tenho trabalhado muitos dias e noites, e finalmente meu trabalho está concluído!\"\n\n[inspiration_owner.GetSheHe|U] me apresenta um objeto envolto em pano, e quando eu revelo o que está escondido dentro, meus olhos se abrem.\n\n"
 fund_inspiration.1001.t:0 "Inspiração Realizada"
 fund_inspiration.1011.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com um sorriso largo, suor escorrendo pela testa, e fuligem espalhada pelo rosto. \"Eu tenho trabalhado muitos dias e noites na forja, mas finalmente meu trabalho está concluído!\"\n\n[inspiration_owner.GetSheHe|U] me apresenta um objeto envolto em pano, e quando eu revelo o que está escondido dentro, meus olhos se abrem.\n\n"
 fund_inspiration.1021.a:0 "Magnífico!"
 fund_inspiration.1021.desc:0 "\n\nCom um floreio [inspiration_owner.GetSheHe] rasga o pano que cobre e meus olhos se abrem.\n\n"
 fund_inspiration.1021.desc_opening_1:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me acena com um sorriso largo, fazendo um gesto em direção a um suporte de armadura coberto. \"Eu tenho trabalhado muitos dias e noites na forja, mas finalmente meu trabalho está concluído!\""
 fund_inspiration.1021.desc_opening_2:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me acena em direção a um suporte de armadura coberto. [inspiration_owner.GetSheHe|U] está tentando manter uma postura profissional, mas eu posso ver o fogo em seus olhos enquanto [inspiration_owner.GetSheHe] me diz que seu trabalho está concluído."
 fund_inspiration.1031.a:0 "Estou impressionado!"
 fund_inspiration.1031.desc:0 "\"Meu livro - minha #EMP obra-prima#! está finalizada! Veja.\"\n\n"
 fund_inspiration.1031.desc_cat_died:0 "\"Seu gato amado pode ter falecido, mas este livro garantirá que ninguém jamais esqueça o felino chamado [inspiration_owner.Custom('CatStoryName')]!\"\n\n"
 fund_inspiration.1031.desc_crime:0 "\"O assunto do livro é um pouco controverso, mas é uma obra-prima. Olha só!\"\n\n"
 fund_inspiration.1031.desc_dog_died:0 "\"Seu cão amado pode ter falecido, mas este livro garantirá que ninguém jamais esqueça o canino chamado [inspiration_owner.Custom('DogStoryName')]!\"\n\n"
 fund_inspiration.1031.desc_low_content_quality:0 "\"O livro está pronto. Espero que o trabalho concluído supere minha falta de conhecimento sobre o assunto. Por favor, dê uma olhada!\"\n\n"
 fund_inspiration.1031.desc_nemesis_died:0 "\"[nemesis.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)|U] pode ter falecido, mas este livro é um testemunho do ódio que você sentiu por [nemesis.GetSheHe].\"\n\n"
 fund_inspiration.1031.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sorri e me chama com as mãos manchadas de tinta."
 fund_inspiration.1031.desc_soulmate_died:0 "\"Seu amado(a) [soulmate.GetTitledFirstName] pode ter falecido, mas este livro é um testemunho do amor que vocês compartilharam.\"\n\n"
 fund_inspiration.1032.a:0 "Oh, meu [inspiration_sponsor.Custom('LoverPetName')]!"
 fund_inspiration.1032.desc:0 "\"Meu [ROOT.Char.Custom('LoverPetName')], tenho uma surpresa para você!\"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me presenteia com um belo livro, e ao folheá-lo mal posso acreditar em meus olhos. [inspiration_sponsor.GetSheHe|U] encomendou um livro sobre #EMP nós#!!\n\n\"As capas empalidecem diante de sua beleza, e o conteúdo não se compara à sua companhia, mas estas páginas guardam a essência do meu amor por você.\""
 fund_inspiration.1032.t:0 "Sentimentos Escritos"
 fund_inspiration.1033.a:0 "Que [inspiration_sponsor.Custom2('InsultNoun', ROOT.Char)]!"
 fund_inspiration.1033.a_proud:0 "Mas eles #EMP saberão#! de mim!"
 fund_inspiration.1033.desc:0 "\"Tenho uma surpresa para você!\"\n\n[inspiration_sponsor.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me presenteia com um belo livro, mas ao folheá-lo mal posso acreditar em meus olhos. [inspiration_sponsor.GetSheHe|U] encomendou um livro com o único propósito de difamar #EMP mim#!!\n\n\"Embora nenhuma palavra neste mundo possa transmitir o desprezo que sinto por você, e nenhuma ilustração possa retratar com precisão a desgraça que é seu rosto, eu tentei. O mundo inteiro lerá isso e saberá o quão vil você é.\""
 fund_inspiration.1041.desc:0 "\"Aqui dentro, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] aponta para a porta da sua tecelagem, onde [inspiration_owner.GetSheHe] tem trabalhado por meses em minha encomenda. Ao entrar pela porta, eu respiro fundo enquanto contemplo o trabalho pendurado diante de mim.\n\n"
 fund_inspiration.1042.desc:0 "\"Aqui estou, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sinaliza para dois servos que saíram da sua tecelagem segurando um rolo de tecido. \n\n[inspiration_owner.GetSheHe|U] acena com a cabeça. A bandeira se desenrola, suspensa em seu suporte de madeira. Eu não posso deixar de admirar os finos detalhes e linhas impecáveis.\n\n"
 fund_inspiration.1051.a:0 "Isso é magnífico!"
 fund_inspiration.1051.b:0 "Precisa ser cuidado por 'homens de topo'"
 fund_inspiration.1051.desc.armor:0 "há um conjunto de armaduras.\n\n[inspiration_owner.GetFirstNameNoTooltip] conta à corte como [inspiration_owner.GetSheHe] conseguiu possuir este conjunto incomum, que [inspiration_owner.GetSheHe] está agora oferecendo a você."
 fund_inspiration.1051.desc.box:0 "é uma caixa. Um artesão local deu isso a [inspiration_owner.GetFirstNameNoTooltip] depois que [inspiration_owner.GetSheHe] salvou [dummy_gender.GetSheHe] de uma matilha de animais selvagens. [inspiration_owner.GetSheHe|U] me conta como [inspiration_owner.GetSheHe] atraiu e enganou os animais ferozes para que caíssem em suas mortes."
 fund_inspiration.1051.desc.epic.ark:0 "é um grande baú de pedra, dentro há uma série de tábuas de pedra\n\n[inspiration_owner.GetFirstNameNoTooltip] se gaba orgulhosamente: \"Este é a Arca da Aliança! Contendo as tábuas de pedra dadas aos israelitas por Moisés.\"\n\n[inspiration_owner.GetFirstNameNoTooltip] então prossegue para a corte com um conto de suas aventuras em [inspiration_owner.Custom('InspirationAdventureDestination')]. Uma história que envolve adversários impulsionados por ideologias sombrias e visitas a muitos locais pitorescos."
 fund_inspiration.1051.desc.epic.cupboard:0 "\n\nCom um grande sorriso, [inspiration_owner.GetFirstNameNoTooltip] proclama: \"[epic.GetDesc]\""
 fund_inspiration.1051.desc.epic.throne:0 "\n\n[inspiration_owner.GetFirstNameNoTooltip] anuncia com orgulho: \"[epic.GetDesc]\""
 fund_inspiration.1051.desc.epic:0 "é um artefato como nenhum outro que já vi antes.\n\n[inspiration_owner.GetFirstNameNoTooltip] sorri orgulhosamente: \"[epic.GetDesc]\""
 fund_inspiration.1051.desc.goblet:0 "é um cálice. Pergunto a [inspiration_owner.GetFirstNameNoTooltip] onde [inspiration_owner.GetSheHe] conseguiu isso, e [inspiration_owner.GetSheHe] me conta sobre um desafio arrepiante que [inspiration_owner.GetSheHe] teve com um estranho que acabou perdendo depois de beber veneno."
 fund_inspiration.1051.desc.hide:0 "é o couro de [newly_created_artifact.GetFeatureText( 'animal_hide_type' )]. [inspiration_owner.GetFirstNameNoTooltip] me conta como [inspiration_owner.GetSheHe] abateu o animal feroz enquanto eu continuo admirando o couro do que deve ter sido um animal majestoso."
 fund_inspiration.1051.desc.necklace:0 "há um colar.\n\n[inspiration_owner.GetFirstNameNoTooltip] parece bastante feliz em poder apresentá-lo com este prêmio, mas parece relutante em expandir sobre como foi adquirido."
 fund_inspiration.1051.desc.regalia:0 "há ornamentos dignos de uma corte real.\n\n[inspiration_owner.GetFirstNameNoTooltip] sorri orgulhosamente e explica como [inspiration_owner.GetSheHe] ganhou a gratidão de um governante local em [location.GetNameNoTier], um longo conto que culmina com esse governante oferecendo o [newly_created_artifact.GetName] ao mestre de [inspiration_owner.GetFirstNamePossessiveNoTooltip]."
 fund_inspiration.1051.desc.regalia_2:0 "há ornamentos dignos de uma corte real.\n\n[inspiration_owner.GetFirstNameNoTooltip] sorri orgulhosamente e explica que este é um presente de um governante distante que ouviu falar da grandiosidade de sua corte e deseja impressioná-lo."
 fund_inspiration.1051.desc.skull:0 "é o crânio de [newly_created_artifact.GetFeatureText( 'animal_skull_type' )]. Pergunto a [inspiration_owner.GetFirstNameNoTooltip] pelos detalhes, e [inspiration_owner.GetSheHe] me conta a história de como [inspiration_owner.GetSheHe] abateu a fera gigante."
 fund_inspiration.1051.desc.tapestry:0 "é um tapeçaria. [inspiration_owner.GetFirstNameNoTooltip] se enche de orgulho enquanto [inspiration_owner.GetSheHe] me conta sobre seu companheiro de viagem que era um mestre alfaiate. Sua aventura compartilhada inspirou os motivos escolhidos nesta tapeçaria."
 fund_inspiration.1051.desc.weapon:0 "há uma [newly_created_artifact.GetName].\n\n[inspiration_owner.GetFirstNameNoTooltip] prossegue para contar a história de como esta arma veio a estar em sua posse. Uma história com muitas reviravoltas, algumas menos prováveis do que outras."
 fund_inspiration.1051.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] anuncia sua chegada em uma voz surpreendentemente alta. [inspiration_owner.GetSheHe|U] orgulhosamente segura um pacote envolto em tecido.\n\n\"Eu retorno da [inspiration_owner.Custom('InspirationAdventureDestination')] com um artefato da minha jornada!\"\n\nEu pego o pacote volumoso em minhas mãos e solto as cordas antes de descascar camada após camada de tecido. Dentro,"
 fund_inspiration.1051_ark_covenant.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] anuncia sua chegada em uma voz surpreendentemente alta. [inspiration_owner.GetSheHe|U] orgulhosamente lidera uma grande procissão até seu trono. Atrás [inspiration_owner.GetHerHim], vários ajudantes estão carregando o que parece ser uma caixa enorme.\n\n\"Eu retorno da [inspiration_owner.Custom('InspirationAdventureDestination')] com um prêmio da minha jornada!\"\n\nEu me aproximo da caixa gigante, enquanto um dos ajudantes remove as tábuas que escondem o tesouro. Dentro"
 fund_inspiration.1051_cupboard.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] anuncia sua chegada em uma voz surpreendentemente alta. [inspiration_owner.GetSheHe|U] orgulhosamente aponta para um móvel sendo carregado por dois ajudantes.\n\n\"Eu retorno com um artefato da minha jornada!\"\n\nEu me aproximo do artefato, inspecionando o que minha [inspiration_owner.GetWomanMan] trouxe para mim da [inspiration_owner.Custom('InspirationAdventureDestination')]."
 fund_inspiration.1051_throne.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] anuncia sua chegada em uma voz surpreendentemente alta. [inspiration_owner.GetSheHe|U] orgulhosamente lidera uma grande procissão até seu trono. Atrás [inspiration_owner.GetHerHim], um carrinho está sendo rolado para dentro da sala de audiência.\n\n\"Eu retorno da [inspiration_owner.Custom('InspirationAdventureDestination')] com um grande símbolo de virtude real!\"\n\nÀ medida que o carrinho se aproxima, percebo que ele carrega um trono."
 fund_inspiration.1061.desc:0 "\"Por aqui, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me chama com um largo sorriso. \"Eu trabalhei muitos dias e noites, e finalmente meu trabalho está pronto!\"\n\n[inspiration_owner.GetSheHe|U] me apresenta um objeto envolto em tecido, e conforme levanto o tecido meus olhos se arregalam.\n\n"
 fund_inspiration.1061.desc_floor_bound_artifact:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me chama com um gesto para um objeto coberto por um tecido com um largo sorriso no rosto. \"Eu trabalhei muitos dias e noites, e finalmente meu trabalho está pronto!\"\n\n[inspiration_owner.GetSheHe|U] puxa o tecido e meus olhos se arregalam quando vejo o que está escondido debaixo.\n\n"
 fund_inspiration.1071.coronation:0 "\n\nMinha coroa completa, posso agora sediar minha coroação e consolidar minha autoridade como soberano."
 fund_inspiration.1081.a:0 "Fascinante!"
 fund_inspiration.1081.a_elixirs:0 "Vou experimentar um gole imediatamente!"
 fund_inspiration.1081.desc_opening:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me chama com um gesto para sua mesa bagunçada com um largo sorriso no rosto."
 fund_inspiration.1081.elixir_desc_desc_old:0 "\"Meus experimentos deram frutos. Veja só, um elixir que irá recuperar um pouco de sua vitalidade perdida! Por favor, dê uma olhada, e talvez até experimente.\"\n\n"
 fund_inspiration.1081.elixir_desc_desc_young:0 "\"Meus experimentos deram frutos. Veja só, um elixir que irá impedir o envelhecimento! Até certo ponto. Por favor, dê uma olhada, e talvez até experimente.\"\n\n"
 fund_inspiration.1081.immortality_fail_desc_old:0 "No entanto, eu consegui produzir um elixir que irá recuperar um pouco de sua vitalidade perdida! Por favor, experimente, ou pelo menos examine o fruto do meu trabalho.\"\n\n"
 fund_inspiration.1081.immortality_fail_desc_opening:0 "\"Eu sei que disse que poderia descobrir um jeito de prolongar a vida indefinidamente, mas infelizmente isso não foi possível."
 fund_inspiration.1081.immortality_fail_desc_young:0 "No entanto, eu consegui produzir um elixir que irá impedir o envelhecimento! Até certo ponto. Por favor, experimente, ou pelo menos examine o fruto do meu trabalho.\"\n\n"
 fund_inspiration.1081.metals_arsenic_desc:0 "Eu aqueci um minério de arsênico, que produziu um pó branco que é solúvel em água. Tenho certeza de que é fatal quando ingerido, mas não deixará nenhum vestígio de sabor ou cheiro! Aqui, eu registrei minhas descobertas."
 fund_inspiration.1081.metals_fallback_desc:0 "Eu reuni todos os meus insights sobre metais básicos e conhecimentos sobre transmutações neste livro. Aqui, dê uma olhada.\"\n\n"
 fund_inspiration.1081.metals_gold_desc:0 "Eu criei ouro! Como grandes mentes antes de mim haviam teorizado, a falta de umidade e calor era a falha do chumbo.\"\n\nQuando eu peço para observar o processo, [inspiration_owner.GetSheHe] insiste que o pequeno pedaço de ouro na mesa fala por si. \"Mas é claro que eu registrei minhas descobertas, dê uma olhada.\"\n\n"
 fund_inspiration.1081.metals_mercury_desc:0 "Eu aqueci uma mistura de mercúrio com enxofre em um frasco, o que fez com que ela se vaporizasse e se condensasse no topo do frasco. Quando eu então quebrei o frasco e moí o composto resultante, eu criei o vermelhão, vermelho brilhante e vibrante! Aqui, eu registrei minhas descobertas."
 fund_inspiration.1081.metals_philosophers_stone_desc:0 "\"Eu consegui! Eu criei a pedra filosofal! Este é meu Magnum Opus, minha legado dourado. Por favor, veja!\"\n\n"
 fund_inspiration.1081.metals_silver_desc:0 "Eu criei prata! Como grandes mentes antes de mim haviam teorizado, a prata nasce do aquecimento de cobre e outros metais básicos até ficarem brancos.\"\n\nQuando eu peço para observar o processo, [inspiration_owner.GetSheHe] insiste que o pequeno pedaço de prata na mesa fala por si. \"Mas é claro que eu registrei minhas descobertas, dê uma olhada.\"\n\n"
 fund_inspiration.1081.panacea_desc:0 "\"É uma panaceia baseada na tradicional teriaca, contendo mirra, açafrão, ópio, carne de víbora e outros ingredientes. Ela tem se mostrado extremamente eficiente por séculos, e eu aperfeiçoei ainda mais! Dê uma olhada.\"\n\n"
 fund_inspiration.1091.a:0 "Trabalho excelente! Muito bom!"
 fund_inspiration.1091.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] aproxima-se de mim com um sorriso satisfeito estampado em seu rosto. \"Trabalhei arduamente na bancada por muitos dias e noites, mas finalmente meu trabalho está concluído!\"\n\n[inspiration_owner.GetSheHe|U] me apresenta um objeto embrulhado em pano, e ao revelar o que está escondido, meus olhos se arregalam.\n\n"
 fund_inspiration.2001.a:0 "O que você precisar!"
 fund_inspiration.2001.b:0 "Se vira com o que tem."
 fund_inspiration.2001.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] insiste que os fundos que forneci a [inspiration_owner.GetSheHe] não são suficientes para criar uma obra de arte digna da minha estatura.\n\n\"Com apenas um pouco mais de ouro, eu poderia criar algo #EMP verdadeiramente#! magnífico!\""
 fund_inspiration.2001.t:0 "$fund_inspiration.title$ Pedido de Fundos"
 fund_inspiration.2002.a:0 "\"Use as pessoas em meus calabouços como desejar.\""
 fund_inspiration.2002.b:0 "\"Aqui, algum dinheiro para sequestrar alguns camponeses.\""
 fund_inspiration.2002.c:0 "\"A fronteira não está longe. Vá sequestrar alguns camponeses estrangeiros.\""
 fund_inspiration.2002.d:0 "Negue o pedido de [inspiration_owner.GetTitledFirstNamePossessiveNoTooltip]."
 fund_inspiration.2002.desc.blind:0 "Eu ouço gemidos e soluços fracos de outra pessoa na sala. Depois de uma série de soluços, um som doloroso de vômito segue-se junto com o forte cheiro ácido do mesmo."
 fund_inspiration.2002.desc.fingernails:0 "meu olhar pousa nas ferramentas manchadas de vermelho e nas unhas arrancadas espalhadas pela mesa."
 fund_inspiration.2002.desc.potions:0 "meu olhar distraído vagueia pela mesa e pelas prateleiras cheias de partes de animais misteriosos, líquidos coloridos e plantas de aparência perigosa."
 fund_inspiration.2002.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem a audácia de me convocar para seu quarto fétido e malcheiroso.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], o progresso está em andamento, mas se eu tivesse algumas partes... alguns materiais #EMP humanos#!, eu poderia criar algo #EMP verdadeiramente surpreendente#!. Eu preciso que a pessoa esteja viva, pelo menos no começo.\"\n\nConforme [inspiration_owner.GetFirstName] termina seu pedido, "
 fund_inspiration.2002.t:0 "$fund_inspiration.title$ Pedido de... Materiais"
 fund_inspiration.2002.toast_outcome.negative:0 "As evidências apontam para você como a causa dos camponeses desaparecidos."
 fund_inspiration.2002.toast_outcome.positive:0 "Você se safou do sequestro de camponeses."
 fund_inspiration.2003.a:0 "Convencer [inspiration_owner.GetFirstNameNoTooltip] a ouvir [previous_inspired.GetFirstNameNoTooltip]."
 fund_inspiration.2003.b:0 "\"Venha, pelo menos ouça [previous_inspired.GetSheHe]\""
 fund_inspiration.2003.c:0 "Ordenar que [previous_inspired.GetFirstNameNoTooltip] deixe [inspiration_owner.GetFirstNameNoTooltip] em paz."
 fund_inspiration.2003.desc:0 "\"Por #EMP [inspiration_owner.GetFaith.HighGodName]#!, [previous_inspired.GetWomanMan]! Deixe-me em paz!\"\n\nA atmosfera pacífica é interrompida por [inspiration_owner.GetFirstName] gritando enquanto [inspiration_owner.GetSheHe] entra na área do pátio. [previous_inspired.GetFirstName] rapidamente segue, mas para quando [previous_inspired.GetSheHe] me vê.\n\n\"[ROOT.Char.Custom2('RelationToMeAddress', previous_inspired)|U], por favor, fale com [inspiration_owner.GetFirstNameNoTooltip] com algum senso! Estou tentando ajudar [inspiration_owner.GetSheHe] já que tenho alguma experiência que pode melhorar o trabalho dela dele!\""
 fund_inspiration.2003.t:0 "$fund_inspiration.title$ Disrupções"
 fund_inspiration.2003.toast_outcome.negative:0 "[previous_inspired.GetFirstNameNoTooltip] dá um feedback ruim"
 fund_inspiration.2003.toast_outcome.positive:0 "[inspiration_owner.GetFirstNameNoTooltip] ouve [previous_inspired.GetFirstNameNoTooltip]"
 fund_inspiration.2003.toast_outcome.refusal:0 "[inspiration_owner.GetFirstNameNoTooltip] se recusa a ouvir"
 fund_inspiration.2004.a:0 "Seu projeto vale a pena investir!"
 fund_inspiration.2004.b.failure:0 "O comerciante não é convencido."
 fund_inspiration.2004.b.success:0 "O comerciante é convencido a baixar os preços."
 fund_inspiration.2004.b:0 "Claro, mas certamente podemos conseguir um preço justo?"
 fund_inspiration.2004.c:0 "Absolutamente. Guardas, apreendam o que [inspiration_owner.GetFirstNameNoTooltip] precisa."
 fund_inspiration.2004.d:0 "Você acha que sou feito de dinheiro?"
 fund_inspiration.2004.desc:0 "\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se afasta de nossa procissão no mercado para abordar o comerciante vendendo o item cobiçado; extasiada(o) com a sua descoberta.\n\n\"Com isso, meu projeto alcançaria novos patamares. Eu poderia criar algo verdadeiramente #EMP maravilhoso#!! Por favor, minha [ROOT.Char.GetTitleAsNameNoTooltip], conceda-me este presente.\""
 fund_inspiration.2004.desc_alchemy_metal:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], olhe isso! Eu nunca vi um minério tão puro antes.\""
 fund_inspiration.2004.desc_elixirs:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], olhe aqueles béqueres! Eu nunca vi um vidro tão transparente antes.\""
 fund_inspiration.2004.desc_fabric:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], olhe para esse tecido! As fibras, a profundidade da cor... Eu nunca vi uma qualidade tão fina antes.\""
 fund_inspiration.2004.desc_fallback:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], olhe isso! Eu nunca vi materiais tão bons antes.\""
 fund_inspiration.2004.desc_ink:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], olhe para essa tinta! As cores, a saturação... Eu nunca vi uma qualidade tão fina antes!\""
 fund_inspiration.2004.desc_metal:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], olhe para esse metal! Eu nunca vi uma qualidade tão fina antes.\""
 fund_inspiration.2004.desc_paper:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], olhe para esse papel! Eu nunca vi uma qualidade tão fina antes.\""
 fund_inspiration.2004.desc_thread:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], olhe para esse fio! Eu nunca vi uma qualidade tão fina antes.\""
 fund_inspiration.2004.desc_wood:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], olhe para essa madeira! O grão, a densidade... Eu nunca vi uma qualidade tão fina antes!\""
 fund_inspiration.2004.t:0 "$fund_inspiration.title$ Maior Qualidade"
 fund_inspiration.2005.a:0 "Claro, o que você precisar."
 fund_inspiration.2005.b:0 "É uma forja perfeitamente boa!"
 fund_inspiration.2005.desc_armor:0 "Digamos apenas que, se você quiser que a [inspiration_owner.Custom('ArtifactArmorTypeLowercase')] seja minimamente utilizável"
 fund_inspiration.2005.desc_ending:0 "você terá que investir em uma nova.\""
 fund_inspiration.2005.desc_opening:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com uma expressão de desaprovação, sobrancelhas queimadas e um pouco de metal amassado.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu não quero desrespeitá-la, mas essa sua forja..."
 fund_inspiration.2005.desc_smith:0 "Digamos apenas que, se você quiser que a [inspiration_owner.Custom('InspirationSmithType')] seja minimamente elegante"
 fund_inspiration.2005.desc_weapon:0 "Digamos apenas que, se você quiser que a [inspiration_owner.Custom('ArtifactWeaponType')] seja minimamente utilizável"
 fund_inspiration.2005.t:0 "$fund_inspiration.title$ Nova Forja"
 fund_inspiration.2006.a:0 "Sim. Por favor, ajude [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2006.b:0 "Certamente. Você será meu instrutor pessoal."
 fund_inspiration.2006.c:0 "Você não encontrará um lar aqui."
 fund_inspiration.2006.desc:0 "[Select_CString( inspiration_owner.IsFemale, 'Minha', 'Meu' )] [inspiration_owner.Custom('GetInspirationOwnerType')] [inspiration_owner.GetTitledFirstName] traz um[Select_CString( scholar_character.IsFemale, 'a', '' )] [scholar_character.GetWomanMan] à minha presença, com um grande sorriso e elogios.\n\n“Est[Select_CString( scholar_character.IsFemale, 'a', 'e' )] é [scholar_character.GetTitledFirstName], [Select_CString( scholar_character.IsFemale, 'uma estudiosa respeitada', 'um estudioso respeitado' )] em meus círculos.”\n\n[Select_CString( scholar_character.IsFemale, 'A', 'O' )] [scholar_character.GetWomanMan] se curva, aparentando ao mesmo tempo estar satisfeit[Select_CString( scholar_character.IsFemale, 'a', 'o' )] e envergonhad[Select_CString( scholar_character.IsFemale, 'a', 'o' )]. “Por favor, não há necessidade disso. Estou aqui para oferecer meus serviços, [ROOT.Char.Custom('FormOfAddressForLiege')], se isso for do seu agrado.”"
 fund_inspiration.2006.t:0 "$fund_inspiration.title$ Erudito Vagante"
 fund_inspiration.2021.a:0 "Você terá o dinheiro."
 fund_inspiration.2021.b:0 "Não lhe darei mais ouro."
 fund_inspiration.2021.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] insiste que para criar uma armadura adequada para um [ROOT.Char.GetTitleAsNameNoTooltip] da minha glória, [inspiration_owner.GetSheHe] precisará de mais fundos.\n\n\"[inspiration_owner.Custom('ArtifactArmorTypeLowercase')|U] não é barato para ser feito, apenas o material... Este não é o momento para ser econômico, [ROOT.Char.Custom('FormOfAddressForLiege')]!\""
 fund_inspiration.2030.a:0 "\"Oh! Obrigado [friend.GetFirstNameNoTooltip]!\""
 fund_inspiration.2030.desc:0 "Meu amigo, [friend.GetTitledFirstName], me para nos corredores com um sorriso radiante. \n\n\"Ah, #EMP lá#! Você é [ROOT.Char.GetFirstNameNoTooltip]! Eu acabei de falar com [inspiration_owner.GetTitledFirstName]! Eu ouvi [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')] para você - não pude resistir a uma visita à seu/sua [inspiration_owner.Custom('GetInspirationTypeRoom')]!\" \n\n\"Eu conversei com [inspiration_owner.GetSheHe] sobre como atender às suas expectativas; eu acho que você vai gostar dos resultados!\""
 fund_inspiration.2030.t:0 "$fund_inspiration.title$ Uma Palavra Amigável"
 fund_inspiration.2040.a:0 "Que amador."
 fund_inspiration.2040.b:0 "Estou pagando por qualidade, não por drama!"
 fund_inspiration.2040.c.failure:0 "O sabotador escapa"
 fund_inspiration.2040.c.flavor:0 "Hora de armar uma armadilha!"
 fund_inspiration.2040.c.success:0 "Você pega o sabotador"
 fund_inspiration.2040.c.tt:0 "O sabotador é preso"
 fund_inspiration.2040.c:0 "Poderia ser... não... #EMP [rival.GetFirstNameNoTooltip]?#!"
 fund_inspiration.2040.desc:0 "[inspiration_owner.GetTitledFirstNamePossessive] gritos exasperados estragam um momento de tranquilidade: \"Como vou continuar com [inspiration_owner.Custom('InspirationTypeDescription')] quando minha [inspiration_owner.Custom('GetInspirationTypeTool')] continua sumindo?!\"\n\n[inspiration_owner.GetSheHe|U] corre até mim. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U], toda vez que faço algum progresso parece que algo dá errado! Tenho certeza de que alguém na corte está interferindo no meu trabalho!\"\n\nO [inspiration_owner.Custom('GetInspirationOwnerType')] suspira em frustração e sai furioso, voltando para a(o) seu/sua [inspiration_owner.Custom('GetInspirationTypeRoom')]."
 fund_inspiration.2040.t:0 "$fund_inspiration.title$ Sabotagem"
 fund_inspiration.2041.a:0 "\"A-ha! Para as masmorras!\""
 fund_inspiration.2041.b:0 "\"Expulsem [rival.GetSheHe] do [ROOT.Char.Custom('FortifiedBuilding')]!\""
 fund_inspiration.2041.c:0 "Eu vou lidar com isso do meu jeito..."
 fund_inspiration.2041.desc:0 "Depois do jantar, espero perto dos quartos de [inspiration_owner.GetTitledFirstNamePossessive] com um punhado de guardas, observando o corredor enquanto o [ROOT.Char.Custom('FortifiedBuilding')] fica mais escuro.\n\nAssim que começo a pensar em desistir, uma luz trêmula dança pelo corredor, seguida por uma silhueta encapuzada.\n\nA figura escura empurra a porta da [inspiration_owner.Custom('GetInspirationTypeRoom')] e verifica furtivamente o corredor mais uma vez, seu rosto iluminado pela lamparina tremeluzente: [rival.GetTitledFirstName]!"
 fund_inspiration.2050.a:0 "Eu tenho algumas sugestões..."
 fund_inspiration.2050.b:0 "Minha formação me dá algumas perspectivas únicas."
 fund_inspiration.2050.c:0 "Você já considerou #EMP este#! ângulo?"
 fund_inspiration.2050.d:0 "Deixe-me dar uma olhada em seus esboços..."
 fund_inspiration.2050.desc:0 "Meu [inspiration_owner.Custom('GetInspirationOwnerType')], [inspiration_owner.GetTitledFirstName], me atualiza sobre seu progresso, falando sobre os limites da [inspiration_owner.Custom('GetInspirationTypeTool')] e da [inspiration_owner.Custom('GetInspirationTypeStation')] enquanto minha mente gira com ideias audaciosas para meu [inspiration_owner.Custom('GetInspirationTypeObject')]... \n\n[inspiration_owner.Custom('GetInspirationTypeVerb')|U] pode não ser #EMP meu#! ponto forte pessoal, mas isso não significa que eu não possa opinar sobre como meu dinheiro é gasto!"
 fund_inspiration.2050.e:0 "Não, [inspiration_owner.GetFirstNameNoTooltip] sabe o que [inspiration_owner.GetSheHe] está fazendo."
 fund_inspiration.2050.failure:0 "Suas ideias são ruins"
 fund_inspiration.2050.nothing:0 "Você é ignorado"
 fund_inspiration.2050.success:0 "Suas ideias funcionam bem"
 fund_inspiration.2050.t:0 "$fund_inspiration.title$ Opinião Considerada"
 fund_inspiration.2060.a:0 "\"Sou #EMP eu#! quem está honrado.\""
 fund_inspiration.2060.b.prestige:0 "\"Não, eu recuso! Mantenha isso, amigo!\""
 fund_inspiration.2060.b.religious:0 "\"Não, por favor, gentil [donator.Custom('NunMonk')], fique com isso.\""
 fund_inspiration.2060.c:0 "\"É só isso?\""
 fund_inspiration.2060.desc.abbey:0 "um[donator.GetFaith.HouseOfWorship] pequeno [donator.GetFaith.GetAdjectiveNoTooltip] [barony_scope.GetAdjectiveNoTooltip] em [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
 fund_inspiration.2060.desc.brotherhood:0 "uma pequena irmandade [donator.GetFaith.GetAdjectiveNoTooltip] de irmãos de [barony_scope.GetNameNoTierNoTooltip], em [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
 fund_inspiration.2060.desc.court:0 "Minha corte opulenta é ressentida e celebrada em todo o mundo, todos desejam igualar e desfrutar de seu esplendor, e, com isso, vêm os admiradores."
 fund_inspiration.2060.desc.fame:0 "Minhas realizações são mencionadas com reverência e inveja em todo o mundo, desde cortes estrangeiras até tavernas de vilarejos, e, com isso, vêm os apoiadores."
 fund_inspiration.2060.desc.guild:0 "uma pequena guilda de [donator.Custom('dummy_peasant_profession')] de [barony_scope.GetNameNoTierNoTooltip], em [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
 fund_inspiration.2060.desc.mercenary:0 "um pequeno bando mercenário [donator.GetCulture.GetNameNoTooltip] de [barony_scope.GetNameNoTierNoTooltip], em [barony_scope.GetDeJureLiege.GetNameNoTier].\n\n"
 fund_inspiration.2060.desc.religious:0 "Minha devoção é usada como exemplo por todos, desde poderosos reis até mendigos humildes, e, com isso, vêm os discípulos."
 fund_inspiration.2060.desc:0 "\n\nHoje [donator.GetTitledFirstName] é conduzido e apresentado como representante "
 fund_inspiration.2060.desc_outro:0 "Meus amigos e eu ouvimos falar de maravilhosas [inspiration_owner.Custom('GetInspirationTypeObject')] sendo feitas para você e gostaríamos de doar para sua [inspiration_owner.Custom('GetInspirationOwnerType')]! Isso seria uma honra profunda para nós, Vossa Majestade - nós economizamos por meses!"
 fund_inspiration.2060.grandeur:0 "\"Oh, sem igual [ROOT.Char.GetTitleAsNameNoTooltip]!"
 fund_inspiration.2060.piety:0 "\"Santíssimo [ROOT.Char.GetTitleAsNameNoTooltip]!"
 fund_inspiration.2060.prestige:0 "\"Oh, soberbo [ROOT.Char.GetTitleAsNameNoTooltip]!"
 fund_inspiration.2060.saint:0 "\"Reverenciado Santo!"
 fund_inspiration.2060.saoshyant:0 "\"Celestial Saoshyant!"
 fund_inspiration.2060.savior:0 "\"Santo Salvador!"
 fund_inspiration.2060.t:0 "$fund_inspiration.title$ O Tesouro do [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]"
 fund_inspiration.2070.a:0 "\"Certifique-se de que as coisas voltem aos trilhos.\""
 fund_inspiration.2070.b:0 "\"Eu sei que você está fazendo o seu melhor, [inspiration_owner.GetFirstNameNoTooltip].\""
 fund_inspiration.2070.c:0 "\"Tem que ser uma obra-prima, e logo!\""
 fund_inspiration.2070.d:0 "\"Deixe imediatamente este [ROOT.Char.Custom('FortifiedBuilding')], vagabundo.\""
 fund_inspiration.2070.desc.comfort_eater:0 "Dizem-me do apetite insaciável de [inspiration_owner.GetFirstNamePossessiveNoTooltip] e dos meus fundos gastos em bolos e doces nos mercados."
 fund_inspiration.2070.desc.depressed:0 "Fui informado que [inspiration_owner.GetFirstNameNoTooltip] passa seus dias na cama, consumido por uma melancolia pervasiva, incapaz de enfrentar o dia."
 fund_inspiration.2070.desc.drunkard:0 "Fui informado que [inspiration_owner.GetFirstNamePossessiveNoTooltip] gasta seu financiamento bebendo [ROOT.Char.Custom('RegionalAlcoholicDrink')] e brincando nas tavernas de [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
 fund_inspiration.2070.desc.hashishiyah:0 "Fui informado das grandes quantidades de haxixe que [inspiration_owner.GetFirstNameNoTooltip] gasta seu financiamento, antes de se trancar no escuro."
 fund_inspiration.2070.desc.improvident:0 "Dizem-me das doações compulsivas de [inspiration_owner.GetFirstNamePossessiveNoTooltip] e das várias causas em que [inspiration_owner.GetSheHe] gastou minha contribuição em vez de trabalhar em seu projeto."
 fund_inspiration.2070.desc.irritable:0 "Dizem-me do mau humor de [inspiration_owner.GetFirstNamePossessiveNoTooltip] que, sem mim para sobrepor, afastou todos que poderiam corrigir seus erros e mal-entendidos."
 fund_inspiration.2070.desc.lunatic:0 "Fui informado das delírios e comportamento errático de [inspiration_owner.GetFirstNamePossessiveNoTooltip], mudando constantemente de ideia e recomeçando do zero, e sua estranha técnica de [inspiration_owner.Custom('GetInspirationTypeTool')]."
 fund_inspiration.2070.desc.possessed:0 "Fui informado das constantes mudanças de humor de [inspiration_owner.GetFirstNamePossessiveNoTooltip], as piores das quais desfazem todo o seu trabalho árduo em um frenesi de autodúvida e raiva."
 fund_inspiration.2070.desc.pregnant:0 "Dizem-me da gravidez de [inspiration_owner.GetFirstNamePossessiveNoTooltip], das dores e da imobilidade que a deixaram incapaz de trabalhar..."
 fund_inspiration.2070.desc.profligate:0 "Dizem-me do gasto compulsivo de [inspiration_owner.GetFirstNamePossessiveNoTooltip] no mercado, onde [inspiration_owner.GetSheHe] desperdiçou minha contribuição em ideias frívolas que não foram a lugar algum."
 fund_inspiration.2070.desc.rakish:0 "Dizem-me da constante ausência de [inspiration_owner.GetFirstNamePossessiveNoTooltip] do seu [inspiration_owner.Custom('GetInspirationTypeRoom')], gastando todo o seu tempo e os meus fundos nos bordéis de [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]."
 fund_inspiration.2070.desc.reclusive:0 "Dizem-me que [inspiration_owner.GetFirstNameNoTooltip] tem sido visto muito pouco desde a nossa última reunião, confinado no seu [inspiration_owner.Custom('GetInspirationTypeRoom')], onde, sem orientação, [inspiration_owner.GetSheHe] se afastou completamente do plano acordado."
 fund_inspiration.2070.desc.sick:0 "Dizem-me da doença debilitante de [inspiration_owner.GetFirstNamePossessiveNoTooltip], que o deixa frequentemente acamado e sem disposição para trabalhar."
 fund_inspiration.2070.desc.stalled:0 "Agora o trabalho em meu [inspiration_owner.Custom('GetInspirationTypeObject')] parou completamente e parece que eu não fui inteiramente culpado...\n\n"
 fund_inspiration.2070.desc.wasted:0 "Agora semanas de trabalho em meu [inspiration_owner.Custom('GetInspirationTypeObject')] foram desperdiçadas e parece que eu não fui inteiramente culpado...\n\n"
 fund_inspiration.2070.desc.wounded:0 "Dizem-me das feridas abertas de [inspiration_owner.GetFirstNamePossessiveNoTooltip], que o deixam confinado à cama, contorcendo-se de dor, e me fazem esperar que [ROOT.Char.GetFaith.DeathDeityName] tenha paciência com [inspiration_owner.GetSheHe]..."
 fund_inspiration.2070.desc:0 "Distraído pelos assuntos da corte, deixei que as notícias de meu [inspiration_owner.Custom('GetInspirationOwnerType')], [inspiration_owner.GetTitledFirstName], fossem adiadas cada vez mais."
 fund_inspiration.2070.desc_outro:0 "\n\nPor fim, exijo que [inspiration_owner.GetSheHe] seja trazido diante de mim."
 fund_inspiration.2070.t:0 "$fund_inspiration.title$ Joia Imperfeita"
 fund_inspiration.2080.a:0 "[rival.GetFirstNameNoTooltip] #EMP garantirá#! sua qualidade, [inspiration_owner.GetFirstNameNoTooltip]."
 fund_inspiration.2080.antiquarian:0 "Isso é ridículo!\" protesta [rival.GetTitledFirstName], \"Como guardião da coleção pessoal de [ROOT.Char.GetTitleAsNamePossessiveNoTooltip], tenho a responsabilidade de garantir a qualidade do seu trabalho!\""
 fund_inspiration.2080.artificer:0 "Isso é ridículo!\" protesta [rival.GetTitledFirstName], \"Sou um artesão confiável do [ROOT.Char.GetTitleAsNameNoTooltip]! Talvez possa ajudar se me deixar ver o seu trabalho!\""
 fund_inspiration.2080.b:0 "Concentre-se em suas próprias tarefas, [rival.GetFirstNameNoTooltip]."
 fund_inspiration.2080.c:0 "É hora de respirar novos ares."
 fund_inspiration.2080.desc:0 "\n\n\"Você o verá quando estiver pronto!\", retruca [inspiration_owner.GetTitledFirstName]. \"Você deveria deixar um [inspiration_owner.GetWomanMan] trabalhar quando [inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')] apto para a realeza!\""
 fund_inspiration.2080.failure:0 "[rival.GetFirstNameNoTooltip] sufoca [inspiration_owner.GetFirstNameNoTooltip]"
 fund_inspiration.2080.success:0 "[rival.GetFirstNameNoTooltip] melhora o trabalho de [inspiration_owner.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.2080.t:0 "$fund_inspiration.title$ Liberdade Criativa"
 fund_inspiration.2090.a:0 "\"Ouça bem, [inspiration_owner.GetFirstNameNoTooltip] - [Select_CString( event_spouse.IsFemale, 'minha', 'meu' )] [event_spouse.GetWifeHusband] precisa ser ouvido!\""
 fund_inspiration.2090.b:0 "\"Venha querid[Select_CString( event_spouse.IsFemale, 'a', 'o' )], vamos deixar isso para o especialista.\""
 fund_inspiration.2090.desc:0 "Vejo [Select_CString( event_spouse.IsFemale, 'minha', 'meu' )] [event_spouse.GetWifeHusband], [event_spouse.GetFirstName], falando animadamente com [inspiration_owner.GetTitledFirstName], listando ideias e sugestões para seu(a) [inspiration_owner.Custom('GetInspirationTypeObject')]. Meu [inspiration_owner.Custom('GetInspirationOwnerType')] mal consegue esconder seu desprezo, claramente irritado com a interferência do meu cônjuge. \n\n\"...e como você é [inspiration_owner.Custom('InspirationTypeDescription')],\" continua [event_spouse.GetSheHe], \"pode muito bem combinar com o velho [inspiration_owner.Custom('GetInspirationTypeObject')] da minha avó paterna!\" \n\nParte da alma de [inspiration_owner.GetFirstNamePossessiveNoTooltip] parece estar morrendo."
 fund_inspiration.2090.failure:0 "[event_spouse.GetFirstNameNoTooltip] sufoca [inspiration_owner.GetFirstNameNoTooltip]"
 fund_inspiration.2090.success:0 "[event_spouse.GetFirstNameNoTooltip] melhora o trabalho de [inspiration_owner.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.2090.t:0 "$fund_inspiration.title$ Toque do [event_spouse.GetWifeHusband|U]"
 fund_inspiration.2100.a:0 "\"Seu trabalho é valioso para mim, [inspiration_owner.GetFirstNameNoTooltip].\""
 fund_inspiration.2100.b:0 "\"Eu vou igualar o seu financiamento, feliz?\""
 fund_inspiration.2100.c.leave:0 "[inspiration_owner.GetFirstNameNoTooltip] abandona seu trabalho"
 fund_inspiration.2100.c.worse:0 "[inspiration_owner.GetFirstNameNoTooltip] perde a motivação"
 fund_inspiration.2100.c:0 "\"Venha, qual é o problema?\""
 fund_inspiration.2100.d:0 "\"Pare com essa tolice.\""
 fund_inspiration.2100.desc.fallback:0 "\"Você deveria se livrar desse peso morto, meu senhor feudal; [other_inspiration_owner.GetFirstNameNoTooltip] não sabe a extremidade correta de uma [other_inspiration_owner.Custom('GetInspirationTypeTool')], muito menos seu caminho ao redor de um [other_inspiration_owner.Custom('GetInspirationTypeRoom')].\""
 fund_inspiration.2100.desc.funds:0 "\"Por que [other_inspiration_owner.GetFirstNameNoTooltip] recebe mais fundos do que eu? '[other_inspiration_owner.Custom('InspirationTypeDescriptionFuturePresent')|U]'! E daí?\""
 fund_inspiration.2100.desc.rival:0 "\"Não posso acreditar que você esgota seus cofres por ess[Select_CString( other_inspiration_owner.IsFemale, 'a', 'e' )] [other_inspiration_owner.Custom2('InsultNoun', SCOPE.sC('inspiration_owner'))], [other_inspiration_owner.GetFirstNameNoTooltip], você teria melhores resultados com os limpadores de fossa!\""
 fund_inspiration.2100.desc:0 "[inspiration_owner.GetTitledFirstName], meu [inspiration_owner.Custom('GetInspirationOwnerType')], senta-se encarando sua refeição em [other_inspiration_owner.GetTitledFirstName], um co-concorrente pela minha patronagem. \n\nEmbora geralmente segura em seu refúgio, ponderando sobre seu/sua [inspiration_owner.Custom('GetInspirationTypeStation')], [inspiration_owner.GetFirstNameNoTooltip] rapidamente estraga o clima quando chega a hora de jantar. \n\nHoje à noite, [inspiration_owner.GetSheHe] finalmente explode:"
 fund_inspiration.2100.failure:0 "Você piora a disputa"
 fund_inspiration.2100.success:0 "Você suaviza as coisas"
 fund_inspiration.2100.t:0 "$fund_inspiration.title$ Artesão invejoso"
 fund_inspiration.2110.a:0 "\"Que generoso!\""
 fund_inspiration.2110.b.flavor:0 "Isso deve ser útil..."
 fund_inspiration.2110.b:0 "\"Oh, eu vou ter #EMP certeza#! que [inspiration_owner.GetSheHe] recebe isso!\""
 fund_inspiration.2110.c:0 "\"Não, por favor, fique com isso!\""
 fund_inspiration.2110.desc.dweeb.research:0 "[generous_vassal.GetFirstNameNoTooltip] tem interesses em muitas coisas, entre elas tecnologia e as mentes que a concebem..."
 fund_inspiration.2110.desc.dweeb:0 "[generous_vassal.GetFirstNameNoTooltip] tem interesses em muitas coisas, entre elas artefatos preciosos e as mentes que os produzem..."
 fund_inspiration.2110.desc.friend:0 "[generous_vassal.GetFirstNameNoTooltip] sorri calorosamente, uma bolsa de moedas balançando em sua mão."
 fund_inspiration.2110.desc.generous:0 "[generous_vassal.GetFirstNameNoTooltip] tem uma reputação de generosidade, e parece que [generous_vassal.GetSheHe] encontrou uma nova maneira de gastar..."
 fund_inspiration.2110.desc.part.2.research:0 "Não gostaria de perder a oportunidade de participar de uma nova descoberta científica!\n\n"
 fund_inspiration.2110.desc.part.2:0 "Não gostaria de perder a oportunidade de ajudar na criação de uma obra-prima!\" \n\n"
 fund_inspiration.2110.desc.rich:0 "Pobre [generous_vassal.GetFirstNameNoTooltip], deve ter mais dinheiro do que [generous_vassal.GetSheHe] sabe o que fazer com ele..."
 fund_inspiration.2110.desc:0 "[Select_CString( generous_vassal.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('generous_vassal'))], [generous_vassal.GetTitledFirstName], se aproxima de mim: \"Bem encontrado, [generous_vassal.Custom2('RelationToMeShort', ROOT.Char)]! Ouvi falar do seu patrocínio a [inspiration_owner.GetFirstName], o [inspiration_owner.Custom('GetInspirationOwnerType')]. Dizem que [inspiration_owner.GetSheHe] é [inspiration_owner.Custom('InspirationTypeDescription')] digno de um [ROOT.Char.GetTitleAsNameNoTooltip].\" \n\nPor favor, pegue isso e entregue a [inspiration_owner.GetSheHe]. "
 fund_inspiration.2110.t:0 "$fund_inspiration.title$ Companheiro Conhecedor"
 fund_inspiration.2120.a:0 "\"Venha aqui, coisa doce.\""
 fund_inspiration.2120.desc.me:0 "Minha mente divaga, absorvendo os sutis caprichos do corpo [inspiration_owner.GetHerHimNoTooltip], seus lábios risonhos... Coloco minha mão sobre a dela. A [inspiration_owner.Custom('GetInspirationTypeTool')] escapa dos dedos trêmulos dela enquanto olho com saudade nesses belos olhos.\n\n"
 fund_inspiration.2120.desc.me_chaste:0 "[inspiration_owner.GetSheHe|U] se aproxima, me atraindo para seu abraço quente. Meu corpo diz sim, mas meu coração grita não..."
 fund_inspiration.2120.desc.me_into:0 "Não posso negar que algo se agita em mim, meu coração acelera e me vejo segurando [inspiration_owner.GetSheHe] em meus braços enquanto [inspiration_owner.GetSheHe] me abraça em retorno... o que está acontecendo?!"
 fund_inspiration.2120.desc.me_into_alot:0 "Não há dúvida das suas intenções! Mal consigo me conter enquanto varro seu/sua [inspiration_owner.Custom('GetInspirationTypeStation')] de lado."
 fund_inspiration.2120.desc.me_unattracted:0 "De repente, [inspiration_owner.GetFirstNameNoTooltip] se aproxima, me abraçando! Meus braços param rapidamente [inspiration_owner.GetSheHe], talvez com muita força... O seu calor instantaneamente esfria, endurecendo para confusão e medo."
 fund_inspiration.2120.desc.me_zealous_adultery:0 "Não, as [ROOT.Char.GetFaith.ReligiousText] são claras! Adulterar é um pecado! Isso é a tentação do [ROOT.Char.GetFaith.DevilName]!"
 fund_inspiration.2120.desc.me_zealous_homosexuality:0 "Isso é errado, pelo [ROOT.Char.GetFaith.HighGodName], não posso ceder a essas tentações pecaminosas..."
 fund_inspiration.2120.desc.them:0 "A hora está avançada quando [inspiration_owner.Custom('GetInspirationOwnerType')] pousa o(a) [inspiration_owner.Custom('GetInspirationTypeTool')] e dá um gole profundo em seu cálice, sorrindo para mim com conhecimento de causa. Será que... [inspiration_owner.GetSheHe]...? \n\n"
 fund_inspiration.2120.desc.them_into:0 "Nele, encontro a mesma paixão desesperada: [inspiration_owner.GetSheHe] cai em meus braços quentes..."
 fund_inspiration.2120.desc.them_into_alot:0 "[inspiration_owner.GetSheHe|U] salta em meus braços como um animal, lançando o(a) [inspiration_owner.Custom('GetInspirationTypeStation')] pela sala."
 fund_inspiration.2120.desc:0 "O tempo desaparece no(a) [inspiration_owner.Custom('GetInspirationTypeRoom')] de [inspiration_owner.GetFirstNamePossessiveNoTooltip], bebendo [ROOT.Char.Custom('RegionalAlcoholicDrink')] enquanto discutimos animadamente o(a) [inspiration_owner.Custom('GetInspirationTypeObject')] que [inspiration_owner.GetSheHe] está [inspiration_owner.Custom('GetInspirationTypeVerb')] para mim. Será que estou imaginando coisas ou há uma tensão indescritível?\n\n"
 fund_inspiration.2120.e:0 "\"Oh... [inspiration_owner.GetFirstNameNoTooltip]...\""
 fund_inspiration.2120.f.chaste:0 "\"Isso não é para mim...\""
 fund_inspiration.2120.f:0 "\"Eu... preciso ir!\""
 fund_inspiration.2120.h:0 "\"Rápido, a porta!\""
 fund_inspiration.2120.i:0 "\"Oh! Eu não sou...\""
 fund_inspiration.2120.j:0 "\"Não! A [ROOT.Char.GetFaith.ReligiousText] proíbe esta união...\""
 fund_inspiration.2120.k.me:0 "\"Não! Eu não posso... o adultério é um pecado!\""
 fund_inspiration.2120.k.them:0 "\"Não, eu não posso tentar [inspiration_owner.GetSheHe] ao adultério..."
 fund_inspiration.2120.l:0 "\"Espere... como você #EMP ousa#!?!\""
 fund_inspiration.2120.leave_flavor:0 "Você sai apressadamente."
 fund_inspiration.2120.m:0 "\"Solte-me, pecador depravado!\""
 fund_inspiration.2120.t:0 "$fund_inspiration.title$ Até Tarde"
 fund_inspiration.2130.a.armory:0 "\"Para a armaria!\""
 fund_inspiration.2130.a.flavor:0 "Certamente encontraremos algo que ajudará!"
 fund_inspiration.2130.a.hall:0 "\"Para o grande salão!\""
 fund_inspiration.2130.a.library:0 "\"Para a biblioteca!\""
 fund_inspiration.2130.a.tt:0 "A qualidade ou o progresso da [inspiration|E] de [inspiration_owner.GetFirstNamePossessiveNoTooltip] pode ser melhorada"
 fund_inspiration.2130.b.bad:0 "A musa de [inspiration_owner.GetFirstNamePossessiveNoTooltip] foge"
 fund_inspiration.2130.b.flavor:0 "Que divertido será!"
 fund_inspiration.2130.b.good:0 "A musa de [inspiration_owner.GetFirstNamePossessiveNoTooltip] retorna"
 fund_inspiration.2130.b.great:0 "A musa de [inspiration_owner.GetFirstNamePossessiveNoTooltip] cresce"
 fund_inspiration.2130.b.nothing:0 "A musa de [inspiration_owner.GetFirstNamePossessiveNoTooltip] dorme"
 fund_inspiration.2130.b.terrible:0 "A musa de [inspiration_owner.GetFirstNamePossessiveNoTooltip] morre"
 fund_inspiration.2130.b:0 "\"Eu sei o que você precisa!\""
 fund_inspiration.2130.c.dead:0 "[inspiration_owner.GetFirstNamePossessiveNoTooltip] cai morto"
 fund_inspiration.2130.c.flavor:0 "Onde está aquela garrafa vermelha..."
 fund_inspiration.2130.c:0 "\"Ah, eu tenho o tônico perfeito.\""
 fund_inspiration.2130.d:0 "\"A verdadeira inspiração vem de dentro.\""
 fund_inspiration.2130.desc:0 "Eu esbarro em [inspiration_owner.GetTitledFirstName], minha [inspiration_owner.Custom('GetInspirationOwnerType')], que está com um ar muito sério. Espero que [inspiration_owner.GetSheHe] não traga más notícias sobre o magnífico [inspiration_owner.Custom('GetInspirationTypeObject')] que [inspiration_owner.GetSheHe] deveria ter pronto para mim em breve. \n\n\"Ah, aqui está meu senhor... Eu bati em uma parede em meu trabalho - nada importante! Minhas ideias desapareceram conforme a pressão aumentou!\" [inspiration_owner.GetSheHe|U] ri nervosamente. \n\n\"Eu só preciso de um pouco de... inspiração! Poderoso [ROOT.Char.GetTitleAsNameNoTooltip], teria alguns... exemplos anteriores que eu poderia examinar?\""
 fund_inspiration.2130.t:0 "$fund_inspiration.title$ Capricho Volúvel"
 fund_inspiration.2131.a:0 "'O [artifact_1.GetNameNoTooltip]? Muito bem...'"
 fund_inspiration.2131.artificer:0 "[second.GetTitledFirstName] acompanha alegremente, sempre interessado nos processos criativos de seus colegas.\n\n"
 fund_inspiration.2131.b:0 "'E quanto ao meu [artifact_2.GetNameNoTooltip]?'"
 fund_inspiration.2131.c.bad:0 "Você encontra [inspiration_owner.Custom('GetInspirationMaterialType')] ruim"
 fund_inspiration.2131.c.good:0 "Você encontra [inspiration_owner.Custom('GetInspirationMaterialType')] de qualidade"
 fund_inspiration.2131.c.nothing:0 "Você não encontra nada"
 fund_inspiration.2131.c:0 "'Deve haver alguma tranqueira por aí...'"
 fund_inspiration.2131.d.bad:0 "[inspiration_owner.GetNameNoTooltip] encontra [inspiration_owner.Custom('GetInspirationMaterialType')] de baixa qualidade"
 fund_inspiration.2131.d.good:0 "[inspiration_owner.GetNameNoTooltip] encontra [inspiration_owner.Custom('GetInspirationMaterialType')]"
 fund_inspiration.2131.d.great:0 "[inspiration_owner.GetNameNoTooltip] encontra um verdadeiro tesouro"
 fund_inspiration.2131.d.nothing:0 "[inspiration_owner.GetNameNoTooltip] não encontra nada"
 fund_inspiration.2131.d.terrible:0 "[inspiration_owner.GetNameNoTooltip] encontra [inspiration_owner.Custom('GetInspirationMaterialType')] ruim"
 fund_inspiration.2131.d:0 "\"Você está apenas dando uma olhada.\""
 fund_inspiration.2131.desc_antiquarian:0 "[second.GetTitledFirstName] insiste em vir e observa de longe, fazendo caretas cada vez que um objeto é manuseado incorretamente ou identificado erroneamente.\n\n"
 fund_inspiration.2131.desc_armory:0 "[inspiration_owner.GetTitledFirstName] e eu somos levados à minha extensa armaria, onde aponto alguns dos meus itens favoritos, dando dicas de suas histórias.\n\n"
 fund_inspiration.2131.desc_armory_unused:0 "Um soldado assustado nos mostra a mim e a [inspiration_owner.GetTitledFirstName] a desordem de minha armaria - eu nunca venho aqui!\n\n"
 fund_inspiration.2131.desc_equipped:0 "O [inspiration_owner.Custom('GetInspirationOwnerType')] pausa, como se em êxtase, examinando meu [artifact_1.GetName]. 'Ah, muito bom meu senhor... Poderia... Poderia eu usar sua [inspiration_owner.Custom('GetInspirationMaterialType')]?'"
 fund_inspiration.2131.desc_fallback:0 "[inspiration_owner.GetSheHe|U] faz algumas voltas pela sala antes de retornar a mim, desanimada. 'Meu senhor, não há nada aqui que me chame a atenção... há algo mais?'"
 fund_inspiration.2131.desc_great_hall:0 "Eu mostro a [inspiration_owner.GetTitledFirstName] meu grande salão, tendo muito orgulho de sua luxuosidade e das várias riquezas em exposição."
 fund_inspiration.2131.desc_great_hall_low:0 "Enquanto mostro rapidamente a [inspiration_owner.GetTitledFirstName] seus curiosos, percebo que meu grande salão não é tão grandioso como poderia ser.\n\n"
 fund_inspiration.2131.desc_library:0 "Eu mostro a [inspiration_owner.GetTitledFirstName] minha biblioteca bem cuidada, apontando alguns dos volumes notáveis e poções em exposição.\n\n"
 fund_inspiration.2131.desc_library_unused:0 "Com um último esforço, [inspiration_owner.GetTitledFirstName] e eu entramos em minha biblioteca empoeirada - uma sala na qual eu raramente tenho motivo para entrar.\n\n"
 fund_inspiration.2131.desc_unequipped:0 "É na loja que o [inspiration_owner.Custom('GetInspirationOwnerType')] repentinamente para, examinando cuidadosamente meu [artifact_1.GetName]. 'Sim... [inspiration_owner.Custom('GetInspirationMaterialType')] deve funcionar... Você... ainda quer isso? Meu senhor?'"
 fund_inspiration.2131.e:0 "\"[second.GetFirstNameNoTooltip]! Alguma sugestão?\""
 fund_inspiration.2131.f:0 "\"Que desperdício de tempo!\""
 fund_inspiration.2131.t:0 "$fund_inspiration.title$ Fora com o Velho"
 fund_inspiration.3001.a:0 "Com certeza; eu não tinha ideia de que [inspiration_owner.GetSheHe] estava escrevendo sobre coisas assim."
 fund_inspiration.3001.a_tt:0 "[inspiration_owner.GetShortUIName] vai escrever sobre fé em vez de [inspiration_owner.Custom('ArtifactBookSubject')]"
 fund_inspiration.3001.b:0 "Sabe o que seria apropriado? Você deixar [inspiration_owner.GetSheHe] em paz!"
 fund_inspiration.3001.c:0 "Essas ilustrações parecem sem graça... Pegue este ouro para comprar nova tinta."
 fund_inspiration.3001.desc_cannibal:0 "\"Esta [inspiration_owner.GetWomanMan] está escrevendo sobre #EMP consumir carne humana#!!"
 fund_inspiration.3001.desc_ending:0 "Com ilustrações! Só posso presumir que você não sabia disso, [ROOT.Char.Custom('FormOfAddressForLiege')].\"\n\n[inspiration_owner.GetTitledFirstNameNoTooltip] zomba e tenta novamente pegar os papéis, mas meu [court_chaplain.Custom('CouncilPosition')] desvia.\n\n\"Mas agora que este escritor vil foi exposto, você certamente dedicará o livro a [ROOT.Char.GetFaith.HighGodName], como é apenas correto.\""
 fund_inspiration.3001.desc_lustful:0 "\"Esta [inspiration_owner.GetWomanMan] está escrevendo sobre atividades pervertidas e indizíveis!"
 fund_inspiration.3001.desc_opening:0 "[court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)|U] irrompe na sala segurando uma pilha de papéis, seguido por um [inspiration_owner.GetTitledFirstName] aflito tentando arrancar a escrita de suas mãos.\n\n"
 fund_inspiration.3001.desc_other:0 "\"Esta [inspiration_owner.GetWomanMan] está escrevendo sobre coisas impías!"
 fund_inspiration.3001.desc_torturer:0 "\"Esta [inspiration_owner.GetWomanMan] está escrevendo sobre atividades indizíveis e sádicas!"
 fund_inspiration.3001.desc_witch:0 "\"Esta [inspiration_owner.GetWomanMan] está escrevendo sobre [ROOT.Char.GetFaith.WitchGodName]. #EMP [ROOT.Char.GetFaith.WitchGodName]#!!"
 fund_inspiration.3001.t:0 "$fund_inspiration.title$ Escrita Impia"
 fund_inspiration.3011.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como estratégia e composições de tropas."
 fund_inspiration.3011.a:0 "Quero que o livro seja educativo ou útil para o exército."
 fund_inspiration.3011.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como cavalaria e habilidade."
 fund_inspiration.3011.b:0 "Talvez algo aludindo às áreas mais nobres do assunto."
 fund_inspiration.3011.d.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] decidirá livremente o tópico do livro."
 fund_inspiration.3011.d:0 "Qual é o tópico que sua musa anseia?"
 fund_inspiration.3011.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Existem tantas áreas de guerra que merecem atenção. Estratégia, composições de tropas, batalha em si... Eu nem sei por onde começar!\""
 fund_inspiration.3011.desc_opening_1:0 "Eu encontro [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] cercado de pergaminhos e manuscritos, folheando freneticamente as páginas.\n\n"
 fund_inspiration.3011.desc_opening_2:0 "Eu encontro [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] cercado de pergaminhos e manuscritos, com a cabeça nas mãos.\n\n"
 fund_inspiration.3011.desc_opening_3:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com os braços cheios de pergaminhos e manuscritos.\n\n"
 fund_inspiration.3011.t:0 "$fund_inspiration.title$ Tópicos Marciais"
 fund_inspiration.3012.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como alianças e eloquência."
 fund_inspiration.3012.a:0 "Talvez algo relacionado à vida na corte."
 fund_inspiration.3012.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como aventura e entretenimento."
 fund_inspiration.3012.b:0 "Quero que o livro seja divertido!"
 fund_inspiration.3012.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Existem tantas áreas de diplomacia que merecem atenção. Conduta na corte, relacionamentos, #EMP poesia#!... Eu nem sei por onde começar!\""
 fund_inspiration.3012.t:0 "$fund_inspiration.title$ Tópicos Diplomáticos"
 fund_inspiration.3013.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como teologia e orações."
 fund_inspiration.3013.a:0 "Este empreendimento deve servir [ROOT.Char.GetFaith.HighGodName]!"
 fund_inspiration.3013.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como história e poesia."
 fund_inspiration.3013.b:0 "Quero que o livro seja educativo, ou pelo menos divertido!"
 fund_inspiration.3013.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Há tantas áreas que merecem atenção. Religião, educação... Sem mencionar a arte da escrita em si!\""
 fund_inspiration.3013.t:0 "$fund_inspiration.title$ Tópicos Acadêmicos"
 fund_inspiration.3014.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como lei e administração."
 fund_inspiration.3014.a:0 "Foque em assuntos relacionados ao governo do reino."
 fund_inspiration.3014.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como construções e tributação."
 fund_inspiration.3014.b:0 "Estou interessado em desenvolvimento!"
 fund_inspiration.3014.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Há tantas áreas de governança que merecem atenção. Leis, comércio, #EMP dinheiro#!... Eu nem sei por onde começar!\""
 fund_inspiration.3014.t:0 "$fund_inspiration.title$ Tópicos de Governança"
 fund_inspiration.3015.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como conspiração e manipulação."
 fund_inspiration.3015.a:0 "Quero estar um passo à frente de #EMP todos#!!"
 fund_inspiration.3015.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar sua escrita em tópicos como luxúria e a arte da sedução."
 fund_inspiration.3015.b_both:0 "Quero que todos me desejem!"
 fund_inspiration.3015.b_men:0 "Quero homens aos meus pés!"
 fund_inspiration.3015.b_none:0 "Quero dominar a sedução."
 fund_inspiration.3015.b_women:0 "Quero mulheres aos meus pés!"
 fund_inspiration.3015.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Há tantas áreas de intriga que merecem atenção. Conspiração, sedução, manipulação... Eu nem sei por onde começar!\""
 fund_inspiration.3015.t:0 "$fund_inspiration.title$ Tópicos de Intriga"
 fund_inspiration.3030.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] continua a escrever sobre o seu ódio por [prev_nemesis.GetTitledFirstName]"
 fund_inspiration.3030.a:0 "O ódio que sinto não esfriou tanto."
 fund_inspiration.3030.b:0 "[prev_nemesis.GetSheHe|U] não vale o esforço."
 fund_inspiration.3030.desc:0 "\"Não posso deixar de notar a animosidade entre você e [prev_nemesis.Custom2('SuaIntroduçãoDePersonagem', ROOT.Char)]. Ainda deseja dedicar este livro ao ódio que sente por [prev_nemesis.GetSheHe]?\""
 fund_inspiration.3030.desc_dead:0 "\"Agora que [prev_nemesis.Custom2('SuaIntroduçãoDePersonagem', ROOT.Char)] se foi, ainda deseja dedicar este livro ao ódio que sentia por [prev_nemesis.GetSheHe]?\""
 fund_inspiration.3030.desc_opening:0 "[inspiration_owner.Custom2('MinhaIntroduçãoDePersonagem', ROOT.Char)|U] me convidou para discutir o tópico do livro que [inspiration_owner.GetSheHe] está escrevendo para mim.\n\n"
 fund_inspiration.3030.t:0 "$fund_inspiration.title$ Ódio Refrescante"
 fund_inspiration.3031.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] continua a escrever sobre o amor que você compartilhava com [prev_soulmate.GetTitledFirstName]"
 fund_inspiration.3031.a:0 "O que é o amor sem desejo e perda?"
 fund_inspiration.3031.b:0 "[prev_soulmate.GetSheHe|U] não vale o esforço."
 fund_inspiration.3031.desc:0 "\"Não posso deixar de notar que [prev_soulmate.Custom2('SuaIntroduçãoDePersonagem', ROOT.Char)] não está mais no topo da sua lista de preferências, [ROOT.Char.Custom('FormOfAddressForLiege')]. Ainda deseja dedicar este livro ao amor que sente por [prev_soulmate.GetSheHe]?\""
 fund_inspiration.3031.desc_dead:0 "\"A dor de perder [prev_soulmate.Custom2('SuaIntroduçãoDePersonagem', ROOT.Char)] deve ser tão recente... Ainda deseja dedicar este livro ao amor que sentia por [prev_soulmate.GetSheHe]?\""
 fund_inspiration.3031.t:0 "$fund_inspiration.title$ Amor Murchando"
 fund_inspiration.4001.a:0 "Você está levando isso longe demais, estude suas próprias roupas se precisar!"
 fund_inspiration.4001.b:0 "Se [inspiration_owner.GetSheHe] diz que é necessário, então é necessário."
 fund_inspiration.4001.desc:0 "\"[inspiration_owner.Custom2('YourCharacterIntroduction', ROOT.Char)|U] #EMP estragou#! minha nova roupa!\"\n\n[courtier.Custom2('MyCharacterIntroduction', ROOT.Char)|U] entra na sala furiosa, seguida pelo tecelão. O pedaço de roupa que [courtier.GetSheHe] segura em suas mãos é tão mal cortado que eu não consigo dizer o que era antes.\n\n\"Você está exagerando! Eu estava apenas estudando o tecido, é importante para o meu projeto.\""
 fund_inspiration.4001.t:0 "$fund_inspiration.title$ Tecido e Preenchimento"
 fund_inspiration.4010.a:0 "Concorde com compreensão e elogie o artista."
 fund_inspiration.4010.b.tt:0 "Seu investimento é devolvido e o trabalho é cancelado."
 fund_inspiration.4010.b:0 "\"Repugnante! Eu preciso ir ver alguma arte tradicional agora.\""
 fund_inspiration.4010.c:0 "\"[child.GetTitledFirstNameNoTooltip] poderia ter feito isso!\""
 fund_inspiration.4010.desc:0 "Eu passo pela oficina do meu tecelão para ver como minha tapeçaria está progredindo. Dentro estão alguns cortesãos. Todos estão examinando as paredes, com as mãos atrás das costas. As tapeçarias apresentadas são estranhas misturas de cores. Uma tem manchas desajeitadas aqui e ali. Uma é branca com alguns quadrados. Uma tem linhas emaranhadas girando. Que tipo de arte é essa?\n\n[artistic_courtier_1.GetTitledFirstNameNoTooltip] aponta para uma seção que parece uma mancha. \"Não é esse marrom sujo contra o branco que realmente sugere a violência inerente ao homem?\"\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] concorda. \"Eu acho que mostra [inspiration_owner.GetTitledFirstNameNoTooltip] lutando contra a sua infância - parece estar na forma da mãe dele(a)."
 fund_inspiration.4010.t:0 "$fund_inspiration.title$ Composição em Vermelho, Azul e [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.5011.a:0 "Traga-me algo de um animal exótico, um crânio ou uma pele."
 fund_inspiration.5011.b:0 "Quero uma bugiganga feita de um material que você não pode encontrar aqui."
 fund_inspiration.5011.c:0 "Uma tapeçaria ou obra de arte que me faz desejar estar lá."
 fund_inspiration.5011.d:0 "Eu confio nos seus instintos para me trazer algo ótimo."
 fund_inspiration.5011.desc:0 "\"Chegou a hora de eu partir em minha aventura, meu [ROOT.Char.GetTitleTierName].\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] faz uma reverência o melhor que pode enquanto carrega sacolas pesadas.\n\n\"Antes de eu partir, por favor, me diga se há algo específico que você quer que eu preste atenção durante minha jornada?\""
 fund_inspiration.5011.e:0 "Eu quero possuir algo verdadeiramente único!"
 fund_inspiration.5021.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] retorna ao que [inspiration_owner.GetSheHe] pretendia fazer."
 fund_inspiration.5021.a:0 "Isso é absurdo! Eu não vou financiar a saída autoindulgente deles!!"
 fund_inspiration.5021.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] explora [adventuring_location.GetNameNoTierNoTooltip]."
 fund_inspiration.5021.b:0 "A vida é uma aventura, explore essa área em busca de artefatos!"
 fund_inspiration.5021.desc:0 "Um viajante que alega estar empregado sob [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] é trazido diante de mim, carregando uma mensagem do aventureiro.\n\n\"Não tema, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] grande [ROOT.Char.GetLadyLord], pois [inspiration_owner.GetTitledFirstNameNoTooltip] está com boa saúde. Eu trago notícias da possibilidade de financiar uma aventura ainda maior! Você vê, [inspiration_owner.GetTitledFirstNameNoTooltip] pegou um caminho errado em algum lugar e agora está perto de [adventuring_location.GetNameNoTier].\"\n\nO companheiro de viagem de [inspiration_owner.GetFirstNameNoTooltip] desenrola um mapa sujo para me mostrar onde eles acabaram. \"[inspiration_owner.GetSheHe|U] tem fundos suficientes para chegar a [inspiration_owner.Custom('InspirationAdventureDestination')], como planejado, mas sugere que com algum financiamento adicional [inspiration_owner.GetSheHe] pode perseguir um rumor local e trazer para casa um grande artefato!\""
 fund_inspiration.5021.t:0 "$fund_inspiration.title$ Uma mudança de direção"
 fund_inspiration.6001.a:0 "Vou guardar isso!"
 fund_inspiration.6001.b:0 "Envie para o Músico da Corte."
 fund_inspiration.6001.desc:0 "Tenho cavalgado por meses sem fim. Minha retaguarda nunca irá se recuperar! Adquiri um gosto pela bebida de leite fermentado de égua e noites sob o céu aberto.\n\nCom este mensageiro, envio uma ponta esculpida de um Morin Khuur - a cabeça decorativa de cavalo colocada em instrumentos musicais. Talvez você tenha algum uso para isso."
 fund_inspiration.6001.t:0 "A estepe e o galope da sela atravessam meu coração,"
 fund_inspiration.6002.a:0 "Até que gosto dele, é uma perda dele."
 fund_inspiration.6002.b:0 "Horrível! Desmonte e venda as gemas."
 fund_inspiration.6002.desc:0 "Estou quase cego com todas as jóias que as cortes que visito têm para me mostrar. Me encontro ansiando pela sujeira da estrada aberta.\n\nEnviei um mensageiro com um presente particularmente sem gosto que me foi dado - um ornamento de cabeça de tigre em um anel, com pedras preciosas para os olhos. Já viu algo tão brega?"
 fund_inspiration.6002.t:0 "Minha viagem pela Índia continua!"
 fund_inspiration.6003.a:0 "Uma boa descoberta! Vou usá-lo."
 fund_inspiration.6003.b:0 "Vou dar para [event_spouse.GetTitledFirstNameNoTooltip]."
 fund_inspiration.6003.desc:0 "Meu senhor, minha jornada pela África está em andamento, e me juntei a uma caravana de camelos atravessando a extensão da terra.\n\nEnvio para você uma joia que um dos meus companheiros de viagem me concedeu - um colar delicado coberto com contas de casca de avestruz. Suponho que você nunca tenha visto um avestruz."
 fund_inspiration.6003.t:0 "Sonho com o deserto,"
 fund_inspiration.6004.a:0 "Qual é a utilidade de um aventureiro que segue o caminho comum?"
 fund_inspiration.6004.b:0 "Essas são algumas bijuterias bonitas..."
 fund_inspiration.6004.desc:0 "Minha jornada pelo Oriente Médio envolve principalmente lutar contra hordas de vendedores ambulantes nos caminhos dos peregrinos.\n\nOft, para não atrasar minha busca por muito tempo, cedo e compro uma de suas pequenas bugigangas. Enviei um mensageiro com essa tralha para você. Talvez proporcione algum divertimento."
 fund_inspiration.6004.t:0 "Ah, ser um peregrino,"
 fund_inspiration.6005.a:0 "Isso não é um feriado! Continue a busca!"
 fund_inspiration.6005.b.tt:0 "Você permite que [inspiration_owner.GetTitledFirstName] volte para casa"
 fund_inspiration.6005.b:0 "Pobre alma, suponho que essas recompensas sejam suficientes."
 fund_inspiration.6005.desc:0 "[ROOT.Char.Custom('FormOfAddressForLiege')], até agora em minhas aventuras, encontrei algumas relíquias tristes, que enviei com este correio, mas não tenho certeza do que posso descobrir em seguida.\n\nOs europeus são as criaturas mais fedorentas que encontrei. Quando criança, sonhava com prados verdes e agradáveis, mas estou convencido de que metade deste mundo é feita de lama. Se você é um senhor gracioso, por favor envie uma mensagem para me chamar de volta."
 fund_inspiration.6005.t:0 "Minhas aventuras estão encharcadas,"
 fund_inspiration.6006.a:0 "Ordene que nossos chefs preparem esses pratos imediatamente!"
 fund_inspiration.6006.b:0 "[inspiration_owner.GetSheHe|U] parece estar se divertindo demais nesta busca..."
 fund_inspiration.6006.desc:0 "Minhas viagens pela Ásia Menor me deixaram com um grande gosto por cordeiro, iogurte e berinjelas, e enviei algumas receitas junto com este correio.\n\nRecebi um broche dourado adornado com um cavalo-marinho por um dos meus anfitriões, que também envio para você. Estou certo de que minhas viagens trarão mais maravilhas em breve."
 fund_inspiration.6006.t:0 "Saudações da Anatólia,"
 fund_inspiration.6100.a:0 "Acabe com essa farsa, quebre o baú e devolva minha pedra!"
 fund_inspiration.6100.b:0 "Ainda é charmoso, acho que vou ficar com ele."
 fund_inspiration.6100.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] chama minha atenção animadamente. '[ROOT.Char.Custom('FormOfAddressForLiege')], eu terminei um protótipo em miniatura do baú que você encomendou, completo com uma trava funcional.'\n\n[inspiration_owner.GetSheHe|U] estende a palma da mão, e sobre ela há um baú pequeno, completo com folha de ouro e uma chave tão pequena quanto um grão.\n\n'Há uma pedra preciosa dentro, experimente você mesmo.' Ao entregar, a chave escapa entre os seus dedos e voa para longe. Embora [inspiration_owner.GetSheHe] tente buscá-la, não há sinal dela."
 fund_inspiration.6100.t:0 "$fund_inspiration.title$ Um Modelo Régua"
 fund_inspiration.6101.a:0 "Eu guardarei um retrato em miniatura de mim mesmo dentro dela."
 fund_inspiration.6101.b:0 "Eu escreverei um poema pequeno e o selarei dentro."
 fund_inspiration.6101.c:0 "Eu prefiro ficar com ela."
 fund_inspiration.6101.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] segura uma pequena caixa com as gravuras mais finas e delicadas que se pode imaginar. \"O protótipo para a sua última encomenda. Não quero que seja desperdiçado. Poderíamos encontrar uma utilidade para essa querida coisa.\"\n\n[antiquarian.Custom2('MyCharacterIntroduction', ROOT.Char)|U] fica animado. \"Poderíamos colocar uma relíquia do nosso tempo dentro dela e enterrá-la em algum lugar, criando um objeto para que as crianças do futuro desvendem!\""
 fund_inspiration.6102.a:0 "\"Retire isso e tire-o da minha vista!\""
 fund_inspiration.6102.b:0 "\"Um médico deve ver isso.\""
 fund_inspiration.6102.c:0 "Retire você mesmo e coloque-o no seu bolso."
 fund_inspiration.6102.cure_toast:0 "Miniatura retirada com segurança."
 fund_inspiration.6102.desc:0 "Estou me preparando para ir dormir quando uma dor aguda atravessa meu pé.\n\nAo examiná-lo, descubro que uma pequena escultura está embutida na carne da sola do meu pé, com os próprios pés da escultura para fora.\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] olha timidamente para mim da porta mais próxima. \"Peço desculpas, esse é o protótipo para sua última encomenda. Devo tê-lo deixado cair.\""
 fund_inspiration.6102.failure_toast:0 "Miniatura teimosa."
 fund_inspiration.6102.failure_toast_desc:0 "Um pedaço da escultura foi deixado dentro do seu pé."
 fund_inspiration.6103.a:0 "Por sua causa, isso deve ser apenas um protótipo."
 fund_inspiration.6103.b:0 "Oh, é perfeito! Eu adoro!"
 fund_inspiration.6103.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] faz uma reverência. \"Adoraria uma crítica sobre o armário que estou criando para você, [ROOT.Char.Custom('FormOfAddressForLiege')].\"\n\n[inspiration_owner.GetSheHe|U] me leva até o seu local de trabalho, onde há apenas um armário empoeirado e surrado.\n\n\"Oh, isso não é a peça.\" [inspiration_owner.GetSheHe|U] abre o armário esfarrapado e lá dentro há apenas um modelo em miniatura de um armário - ornamental, com pedras preciosas e dourado, mas com cerca da altura do meu dedo. \"O que você acha?\""
 fund_inspiration.6104.a:0 "Que encantador! Vou guardar isso!"
 fund_inspiration.6104.b:0 "Tudo bem, mas continue com o projeto."
 fund_inspiration.6104.c:0 "Eu sou #EMP muito#! crescido para brincar com brinquedos."
 fund_inspiration.6104.desc:0 "[inspiration_owner.Custom2('ApresentaçãoDoMeuPersonagem', ROOT.Char)|U] me traz uma caixa pequena e me apresenta com um sorriso.\n\nAo abrir o presente, espero uma jóia, um anel ou uma escultura, mas para minha surpresa, dentro há um trono em miniatura, tão pequeno que apenas um rato poderia se sentar nele.\n\n\"O protótipo para o seu novo assento, [ROOT.Char.Custom('FormOfAddressForLiege')]. Eu pensei que isso iria divertir você.\""
 fund_inspiration.6105.a:0 "Eu pensei que você nunca perguntaria!"
 fund_inspiration.6105.b:0 "Hmm, talvez outra hora."
 fund_inspiration.6105.desc:0 "Com orgulho, carrego minha caixa de móveis em miniatura através do [ROOT.Char.Custom('FortifiedBuilding')], pensando onde posso exibi-los melhor, quando esbarro em [inspiration_owner.Custom2('ApresentaçãoDoMeuPersonagem', ROOT.Char)].\n\nQuando [inspiration_owner.GetSheHe] vê dentro da caixa, [inspiration_owner.GetSheHe] limpa uma lágrima de seus olhos. \"Um [ROOT.Char.GetWomanMan] de bom gosto, venha comigo.\"\n\n[inspiration_owner.GetSheHe|U] me leva para sua oficina e tira uma caixa secreta. Dentro há dezenas de peças de cenário, figuras e terreno em miniatura. \"Eu inventei um jogo - uma batalha imaginária de cerco. Você se juntaria a mim?\""
 fund_inspiration.6200.a:0 "Assentir com a cabeça em compreensão e elogiar o artista"
 fund_inspiration.6200.b.tt:0 "Seu investimento é devolvido e o trabalho é cancelado"
 fund_inspiration.6200.b:0 "\"Nojento! Devo ir procurar alguma arte tradicional agora.\""
 fund_inspiration.6200.c:0 "\"[child.GetTitledFirstNameNoTooltip] poderia ter feito isso!\""
 fund_inspiration.6200.desc:0 "Eu verifico a oficina do meu tecelão para ver como minha tapeçaria está progredindo. Lá dentro estão alguns cortesãos. Todos eles estão examinando as paredes, com as mãos cruzadas nas costas. As tapeçarias apresentadas são lavagens peculiares de cor. Uma tem manchas desajeitadas aqui e ali. Outra é branca com alguns quadrados. Outra tem linhas emaranhadas giratórias. Que tipo de arte é essa?\n\n[artistic_courtier_1.GetTitledFirstName] aponta para uma seção que parece uma mancha. \"Não sugere esse marrom sujo contra o branco a violência inata no homem?\"\n\n[artistic_courtier_2.GetTitledFirstNameNoTooltip] concorda. \"Eu acho que mostra [ROOT.Char.GetTitledFirstNameNoTooltip] lutando contra sua infância - parece estar em forma de sua mãe.\""
 fund_inspiration.6200.t:0 "$fund_inspiration.title$ Composição em Vermelho, Azul e [ROOT.Char.GetTitleAsNameNoTooltip|U]"
 fund_inspiration.6300.a.failure:0 "Você faz [inspiration_owner.GetShortUIName] desprezar o amor."
 fund_inspiration.6300.a.success:0 "Você persuade [inspiration_owner.GetShortUIName] a escrever sobre amor."
 fund_inspiration.6300.a:0 "Ótimo! Canalize essa raiva agridoce!"
 fund_inspiration.6300.b:0 "Bom, eu tenho meia hora de sobra."
 fund_inspiration.6300.c:0 "Impossível! Como o mundo não vê o encanto de sua eloquência?"
 fund_inspiration.6300.d:0 "Mas é um amor para ser vivido."
 fund_inspiration.6300.e:0 "Escreva sua verdade, abençoo todas as musas."
 fund_inspiration.6300.f:0 "Invente algo! Todos que escrevem sobre amor são fraudes."
 fund_inspiration.6300.homosexual_desc:0 "\"Ah, [ROOT.Char.Custom('FormOfAddressForLiege')]. Embora eu tenha passado muitas horas tentando compor uma obra romântica digna de sua patronagem, encontro-me apenas chorando sobre meu pergaminho.\"\n\n\"Você me pede o impossível. Meu amor é do tipo que deve permanecer não escrito.\""
 fund_inspiration.6300.intro:0 "Eu me deparo com [inspiration_owner.GetTitledFirstName] em sua mesa, olhando pela janela com muitos rascunhos rasurados antes [inspiration_owner.GetHerHim].\n\n"
 fund_inspiration.6300.no_love_desc:0 "\"Apesar do fato de que geralmente nada me emociona mais do que a palavra escrita, surpreendentemente, não sou tocado por nenhum sentimento de luxúria no momento.\"\n\n\"Minhas desculpas, [ROOT.Char.Custom('FormOfAddressForLiege')], não posso escrever sobre amor, a musa me abandonou.\""
 fund_inspiration.6300.no_relationship_desc:0 "\"A ideia de alguém me amar é impossível. Eu nunca sussurrei palavras de sentimento para alguém que as devolvesse.\"\n\n\"Assim, eu não tenho escrito para você - apenas conto as noites desde que deitei com alguém e desespero.\""
 fund_inspiration.6300.t:0 "$fund_inspiration.title$ Estrofe infeliz"
 fund_inspiration.6301.a:0 "Vou guardá-lo com carinho, mas mantê-lo em segredo."
 fund_inspiration.6301.b:0 "Maldito mundo, vou organizar uma leitura!"
 fund_inspiration.6301.crime_desc:0 "Que crime bonito."
 fund_inspiration.6301.female_desc:0 "\n\nAqui está um poema sobre uma bruxa que se apaixona por uma rainha que se perde na floresta perto de sua casa."
 fund_inspiration.6301.friend_desc:0 "Nunca senti minhas palavras fluírem como depois que me pediste para escrever um conto de amor como eu o experimento."
 fund_inspiration.6301.lover_desc:0 "Na noite em que me pediste para escrever com o coração, descobri que só conseguia escrever sobre ti. Deixa-me ser o vilão, se a fé chama de malvado o nosso tipo de amor."
 fund_inspiration.6301.male_desc:0 "\n\nAqui está uma balada sobre um príncipe que observa as estrelas com sua amada arquivista todas as noites no topo da torre da biblioteca, sonhando em se amar nos céus."
 fund_inspiration.6301.t:0 "$fund_inspiration.title$ Meu caro companheiro,"
 fund_inspiration.6400.a.failure:0 "O aventureiro foge com o ouro!"
 fund_inspiration.6400.a.success:0 "Você convence o aventureiro a se recompor"
 fund_inspiration.6400.a.success_continue:0 "A aventura continua!"
 fund_inspiration.6400.a:0 "Saia daqui e siga em frente!"
 fund_inspiration.6400.b:0 "Charlatão! Não vou pagar mais bebida para você!"
 fund_inspiration.6400.desc:0 "Em uma visita à taverna em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], avisto um dos clientes no centro de toda a atenção.\n\n[inspiration_owner.GetSheHe|U] é mais endurecido do que o restante dos clientes e cheira como se [inspiration_owner.GetSheHe] estivesse lá por uma era. Para meu horror, reconheço meu aventureiro, [inspiration_owner.GetTitledFirstName], que parece não ter saído da terra natal depois de meses de financiamento!\n\n\"E para minha próxima jornada, vou atravessar o Mar Vermelho em um só gole!\" [inspiration_owner.GetSheHe] prontamente engole um copo inteiro de vinho tinto, enquanto a torcida ecoa pelo salão."
 fund_inspiration.6400.t:0 "$fund_inspiration.title$ Noitada na Taverna"
 fund_inspiration.6500.a.failure:0 "Aventureiro irrita habitantes da selva"
 fund_inspiration.6500.a.success:0 "Aventureiro encanta habitantes da selva"
 fund_inspiration.6500.a:0 "Você começou a cantar e conquistou a simpatia deles!"
 fund_inspiration.6500.action:0 "\n\n'Você pode imaginar o que fiz em seguida...'"
 fund_inspiration.6500.b.failure:0 "O aventureiro não consegue fugir rápido o suficiente"
 fund_inspiration.6500.b.success:0 "O aventureiro escapa"
 fund_inspiration.6500.b:0 "Você fugiu para terras mais civilizadas."
 fund_inspiration.6500.c.tt:0 "O aventureiro ajuda a lutar contra o leopardo"
 fund_inspiration.6500.c.tt_failure:0 "O aventureiro fica ferido ao tentar fugir"
 fund_inspiration.6500.c:0 "Um grande felino se interpôs entre você e seus agressores!"
 fund_inspiration.6500.desc:0 "\n\n'Andei pela selva. O canto dos pássaros martelava minha cabeça e achei aquilo um lamento insuportável. Os poucos habitantes por aqui me disseram que achavam aquilo a música mais bela que já ouviram. Eles claramente nunca ouviram as obras de [court_musician.GetTitledFirstNameNoTooltip].\n\n'Tentei tocar uma de suas melodias em uma das flautas deles, e os moradores me expulsaram de sua cidade e me feriram com uma lâmina envenenada. Embora eu tenha sobrevivido, pensei \"se eu morrer trazendo música de câmara para a selva, assim seja!\""
 fund_inspiration.6500.introduction:0 "Recebi uma mensagem do meu aventureiro, com palavras tão elaboradas que consigo ver [inspiration_owner.GetSheHe] no teatro da minha mente."
 fund_inspiration.6500.t:0 "$fund_inspiration.title$ Trazendo Música para a Selva"
 fund_inspiration.6501.a:0 "Espero que tenham voltado e cortado as perdas."
 fund_inspiration.6501.b.failure:0 "Aventureiro encalhado consertando barco quebrado"
 fund_inspiration.6501.b.success:0 "Aventureiro arrasta barco por um penhasco"
 fund_inspiration.6501.b:0 "O barco quase não sobreviveu à jornada."
 fund_inspiration.6501.c:0 "Os habitantes locais tiveram pena e deram a você um novo barco com desconto."
 fund_inspiration.6501.desc:0 "\n\n'Estamos navegando por rios ao redor das colinas sinuosas. Depois de uma seca, os locais nos disseram que o rio por onde estávamos navegando havia secado à frente do nosso barco.\n\n'Em vez de desistir ou voltar atrás, tentamos o impossível. Ordenei à minha tripulação que começasse a construir um sistema de trilhos e polias, e começamos a arrastar nosso barco pela terra em direção ao próximo rio. Ele navegou em um mar de grama e margaridas."
 fund_inspiration.6501.t:0 "$fund_inspiration.title$ Viagem por Terra"
 fund_inspiration.6502.a:0 "Ah, eu também sinto sede, e não estou no deserto."
 fund_inspiration.6502.b:0 "Eu poderia considerar sua atenção se você trouxesse um grande prêmio."
 fund_inspiration.6502.c:0 "Eu culpo o calor e queimo essas palavras."
 fund_inspiration.6502.desc:0 "\n\n'Eu não estou no deserto, eu estou em uma terra de sonhos. A diferença entre o despertar e o sono desapareceu. Meu guia me diz que eu alucino o que mais desejo. Um paraíso, uma piscina de água brilhando como diamantes, enfeitada com tesouros em suas margens.\n\n'Em vez disso, [ROOT.Char.Custom('FormOfAddressForLiege')], tudo o que vejo é você aqui comigo. Para sempre uma ilha de areia adiante. Me chamando para continuar. E isso me destrói saber que cada passo que dou em direção a esse miragem, eu me afasto ainda mais do verdadeiro você.'"
 fund_inspiration.6502.t:0 "$fund_inspiration.title$ Sede Ardente"
 fund_inspiration.6503.a:0 "Você colocou um dos ornamentos no bolso."
 fund_inspiration.6503.b:0 "Você trouxe a sela de um dos cavalos para o nosso estudo."
 fund_inspiration.6503.c:0 "Você não ousou perturbar os mortos."
 fund_inspiration.6503.desc:0 "\n\n'Eu mergulhei em um Kurgan, um antigo túmulo da era dos citas. Centenas de cavalos há muito mortos, empalhados, preservados e empalados nas paredes para ficar em pé, cada um com sua própria sala. Era um estábulo para os amaldiçoados, perdido no tempo.\n\n'Sabendo do meu dever de buscar conhecimento para o nosso reino, eu considerei roubar uma relíquia do túmulo quando meu guia não estava olhando para trazer para você."
 fund_inspiration.6503.t:0 "$fund_inspiration.title$ Sussurros Pontianos"
 fund_inspiration.6504.a.tt:0 "[inspiration_owner.GetTitledFirstName] ficará na fazenda."
 fund_inspiration.6504.a:0 "Saia daqui, se você desrespeitar meu patrocínio."
 fund_inspiration.6504.b:0 "Permitirei, mas não me culpe pelo escândalo."
 fund_inspiration.6504.c:0 "A criança não merece viver na pobreza."
 fund_inspiration.6504.d:0 "CAMPEONES? Na MINHA corte? NEM PENSAR."
 fund_inspiration.6504.desc:0 "\n\n'Er, [ROOT.Char.Custom('FormOfAddressForLiege')], em minhas viagens, fiquei em uma fazenda atendida por [adventurer_lover.GetTitledFirstName]."
 fund_inspiration.6504.female_lover:0 "\n\n'Depois de tantas luas sozinho na estrada, [adventurer_lover.GetSheHe] mexe com meu coração como uma criatura fantástica. Não posso deixar de pensar que é aqui que minha busca deveria me levar.'"
 fund_inspiration.6504.lover_ultimatum:0 "Não posso partir desta fazenda, sabendo que posso nunca mais beijar [adventurer_lover.GetSheHe]. Ou [adventurer_lover.GetSheHe] viaja para se juntar à nossa corte, ou minha jornada termina aqui.'"
 fund_inspiration.6504.male_lover:0 "\n\n'Estou apaixonado, e preferiria passar uma semana assistindo [adventurer_lover.GetSheHe] limpar esterco de cavalo do que qualquer banquete na corte.'"
 fund_inspiration.6504.male_lover_homosexual:0 "\n\n'Livre dos olhos da corte, pude deitar nos braços de um homem por noites a fio.'"
 fund_inspiration.6504.pregnant:0 "\n\n'Eu criei uma obra-prima enquanto estava na fazenda! Nomeadamente, uma criança! Embora possa ser uma imposição, não posso levar [adventurer_lover.GetTitledFirstName] em minhas viagens em seu estado atual. [adventurer_lover.GetSheHe|U] tem pouca riqueza, e minha esperança é de que possamos cuidar [adventurer_lover.GetHerHim] na corte.'"
 fund_inspiration.6504.t:0 "$fund_inspiration.title$ Amante de [inspiration_owner.GetLadyLord|U] [inspiration_owner.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.6505.a:0 "Meus olhos! Meus olhos!"
 fund_inspiration.6505.a_blind:0 "Eu arrancaria meus olhos se já não fosse cego."
 fund_inspiration.6505.a_one_eyed:0 "Meu olho! Meu olho!"
 fund_inspiration.6505.b:0 "Vou pendurá-lo no meu quarto!"
 fund_inspiration.6505.c:0 "Toda a corte deve saber deste passatempo exótico!"
 fund_inspiration.6505.d:0 "Ah, uma imagem sagrada para o nosso povo!"
 fund_inspiration.6505.desc:0 "\n\n'No meio do meu ofegar no calor do deserto, descobri algumas águas cristalinas, cuja visão me obrigou a tirar todas as minhas roupas. Em vez de levar isso como uma ofensa, meu guia riu com compreensão e começou a desenhar minha forma em uma página. Nossos companheiros de viagem acenaram com folhas de palmeira para me refrescar, num ato de servidão.\n\n'Passamos muitas horas felizes mergulhando. Na próxima aldeia, contratei um tecelão para capturar o momento de paraíso e envio-lhe uma memória com este correio.'"
 fund_inspiration.6505.t:0 "$fund_inspiration.title$ Capítulo da Praia"
 fund_inspiration.6506.a:0 "Isso fortalece o caráter!"
 fund_inspiration.6506.b:0 "Se você deseja ir para terras mais amenas, pode ir."
 fund_inspiration.6506.desc:0 "'[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord], estou em um pântano úmido, e todos os meus anos de tutela não me prepararam para isso. Estou caminhando através de lodos escorregadios noite e dia. Na noite passada, sonhei com um abraço amoroso e acordei para encontrar um tritão na minha boca ao invés de uma língua.\n\n'Eu estava me perguntando se haveria uma leve chance de eu ir para um local mais #EMP civilizado#! Como indicação de quão obsceno este lugar é, enviei para você uma rã que colocou seus ovos em minhas botas encharcadas em um frasco junto com minha mensagem.'"
 fund_inspiration.6506.introduction:0 "Chega uma mensagem do meu aventureiro. Está tão enlameada que tenho que cortá-la com uma faca.\n\n"
 fund_inspiration.6506.t:0 "$fund_inspiration.title$ Não é um squalor irrazoável"
 fund_inspiration.6507.a:0 "Enviarei algumas denúncias para [grumpy_liege.GetSheHe]!"
 fund_inspiration.6507.b:0 "Terei a cabeça [grumpy_liege.GetHerHim] por isso!"
 fund_inspiration.6507.c:0 "As cicatrizes parecerão bastante atraentes!"
 fund_inspiration.6507.desc:0 "\n\n\"As planícies e prados por onde ando foram maravilhosamente adornados com a vida selvagem. Enquanto eu estava fora do meu cavalo, me inclinando para cheirar uma flor, uma sombra foi projetada sobre mim por [grumpy_liege.GetTitledFirstName], o senhor dessas terras, e uma [grumpy_liege.GetWomanMan] que não pensa muito bem de você.\n\n\"\"Os filhotes de [ROOT.Char.GetTitledFirstNameNoTooltip] não devem se alimentar em meus prados.\" [grumpy_liege.GetSheHe|U] desmontou e ordenou aos guardas que me capturassem. Eles trouxeram uma caixa contendo uma colmeia, que eles forçaram em minha cabeça! Fui #EMP picado#!! Ainda há uma ferrão alojado no meu olho!'"
 fund_inspiration.6507.introduction:0 "Recebo uma mensagem do meu aventureiro - linhas escritas misturadas com um respingo de sangue."
 fund_inspiration.6507.t:0 "$fund_inspiration.title$ Não as abelhas!"
 fund_inspiration.6508.a:0 "Vou analisar isso minuciosamente."
 fund_inspiration.6508.architect_desc:0 "'Tenho certeza de que pelo menos [court_architect.GetTitledFirstName] poderia aprender uma coisa ou duas com um animal mais esperto do que [court_architect.GetSheHe].'"
 fund_inspiration.6508.b.tt:0 "A habilidade de [court_architect.GetTitledFirstNamePossessive] como arquiteto(a) aumenta ligeiramente."
 fund_inspiration.6508.b:0 "Realmente, [court_architect.GetTitledFirstNameNoTooltip] poderia aprender uma lição."
 fund_inspiration.6508.c:0 "Que animais #EMP adoráveis#! [child.GetFirstNameNoTooltip] deveria ter este livro!"
 fund_inspiration.6508.d:0 "Bom trabalho, enviarei fundos para estender suas viagens."
 fund_inspiration.6508.desc:0 "'Passei um tempo rodeado da melhor companhia que um(a) viajante [inspiration_owner.GetWomanMan] poderia pedir - uma colônia de castores! Com este correio, envio a você um livro de esboços das estruturas que eles usam para capturar peixes nas águas! Oh, ser um roedor semi-aquático! '\n\n"
 fund_inspiration.6508.introduction:0 "Recebo um missiva do meu aventureiro, que esteve nas terras frescas das florestas da Taiga. \n\n"
 fund_inspiration.6508.t:0 "$fund_inspiration.title$ Arquitetos da Natureza"
 fund_inspiration.6509.a:0 "Impressionaremos os visitantes com uma tapeçaria desta fera!"
 fund_inspiration.6509.b:0 "Oh, é horrível demais para ser verdade!"
 fund_inspiration.6509.c:0 "Eu sei o que é um crocodilo, imbecil!"
 fund_inspiration.6509.desc:0 "\n\n'M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord], fomos caçados em nossas viagens por uma criatura tão temível que eu quase reluto em escrever sobre ela.\n\n'O crocodilo pode chegar a cinquenta passos de comprimento e é um monstro que engoliu uma de nossas mulas inteira. É uma fera esguia, com o corpo em forma de flecha, tendo um bico na proa e uma cauda barulhenta na popa. Os espinhos e solavancos que a cobrem são venenosos ao toque.'"
 fund_inspiration.6509.intro_desc:0 "Recebo uma mensagem do meu aventureiro, que tem navegado em uma jangada pelas planícies inundáveis."
 fund_inspiration.6509.t:0 "$fund_inspiration.title$ Sussurros de uma Fera"
 fund_inspiration.6510.a:0 "Talvez você possa me ajudar a fazer mais pelos pobres?"
 fund_inspiration.6510.b.toast_outcome.positive.continue:0 "A aventura continua"
 fund_inspiration.6510.b.toast_outcome.positive.flee:0 "[inspiration_owner.GetSheHe|U] foge da sua corte."
 fund_inspiration.6510.b.toast_outcome.positive:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] está intimidado(a)"
 fund_inspiration.6510.b.toast_outcome.refusal:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] não está impressionado(a)"
 fund_inspiration.6510.b:0 "Se você não voltar, enviarei um assassino atrás de você!"
 fund_inspiration.6510.c:0 "Aproveite a sua vida de miséria!"
 fund_inspiration.6510.desc:0 "\n\n\"Desculpe-me, [ROOT.Char.Custom('FormOfAddressForLiege')], mas na floresta encontrei um grupo de vigilantes que roubam pessoas como você. Enfrentando o punho autoritário de [enemy_liege.GetTitledFirstName], que governa aqui, eles roubam o máximo que podem, atacando nobres pelo caminho. Meu coração se apaixonou por esse grupo desorganizado e acredito que não voltarei à corte.\n\n\"As meias-calças deles também são muito melhores do que a moda da sua corte e combinam bastante comigo.\""
 fund_inspiration.6510.intro_desc:0 "Recebo uma mensagem do meu aventureiro, que tem se esgueirado pela floresta."
 fund_inspiration.6510.t:0 "$fund_inspiration.title$ Homens em Meias-calças"
 fund_inspiration.6511.a:0 "Nunca houve um verdadeiro romântico do perigo como este!"
 fund_inspiration.6511.intro_desc:0 "Recebo uma mensagem do meu aventureiro e, depois das primeiras linhas, sei que será a última."
 fund_inspiration.6511.old_age:0 "\n\n\"Minha velhice me trouxe muitas maravilhas ao longo do tempo. Quando alcancei o cume nevado da montanha de onde agora escrevo estas palavras, sendo o único ser vivo acima de um mar de névoa, soube que nunca mais veria tamanha beleza pelo resto dos meus dias.\n\n\"Não era minha vontade retornar da montanha e agora você pode supor que estou um com o gelo. Não chore, pois eu não poderia ter feito diferente. Minha caminhada em direção a [inspiration_owner.GetFaith.PositiveAfterLife] é tão constante quanto um glaciar.\""
 fund_inspiration.6511.poor_health:0 "\n\n'Eu sou apenas uma coisa miserável e torcida agora, enquanto minha saúde e corpo me traem. Mas nesse estado, nunca pensei que seria capaz de testemunhar uma visão como um reino nevado de nuvens e neblina do topo de uma montanha. Uma flor murcha como eu não merece tamanha beleza.\n\n'Sabendo que meu tempo pode estar próximo a qualquer momento, decidi me deixar para o gelo. Talvez o frio me preserve com um pouco de mim mesmo intacto."
 fund_inspiration.6511.t:0 "$fund_inspiration.title$ Andarilho no Mar de Neve"
 fund_inspiration.6511.winter:0 "\n\n'Eu estava no topo de uma montanha na época mais cruel. Cada gota de neve na minha bochecha mordida era a risada do inverno, o vilão. Batalhas eu vi, mas nenhuma violência tão requintada como este duelo contra o sangue em meu próprio corpo. Minha mão dominante funciona bem o suficiente para escrever isso, mas minha outra não tanto.\n\n'Saiba que eu estava realmente feliz por ver o mundo como eu vi, e sinto que o resto dos vivos são mais pobres do que eu.' "
 fund_inspiration.6512.a:0 "Tenho certeza de que os locais já deram um nome para a montanha."
 fund_inspiration.6512.b:0 "'Rocky' - um nome bobo!"
 fund_inspiration.6512.c:0 "'Lâmina do Deus da Guerra [ROOT.Char.GetFaith.WarGodNamePossessive]'"
 fund_inspiration.6512.d:0 "'Manopla do Deus do Destino [ROOT.Char.GetFaith.FateGodNamePossessive]'"
 fund_inspiration.6512.desc:0 "\n\n'Eu escalado outra fera e no topo desses milhares de planaltos planos, não vi sinal de que outro [inspiration_owner.GetWomanMan] tenha pisado nesta rocha. Hoje, eu enfrentei o mais alto que já subi.\n\n'Eu acho que a rocha clama por um nome digno, para comemorar essa realização sendo supervisionada pelo melhor [ROOT.Char.GetTitleAsNameNoTooltip] do cosmos.' "
 fund_inspiration.6512.e:0 "Em homenagem à minha querida [lover.GetFirstNameNoTooltip]."
 fund_inspiration.6512.f:0 "Dente de [ROOT.Char.GetFirstNamePossessiveNoTooltip]!"
 fund_inspiration.6512.g:0 "Vara de [ROOT.Char.GetFirstNamePossessiveNoTooltip]!"
 fund_inspiration.6512.h:0 "Flagelo de [rival.GetFirstNamePossessiveNoTooltip]!"
 fund_inspiration.6512.i:0 "Esqueça isso - traga-me algumas pedras!"
 fund_inspiration.6512.intro_desc:0 "Recebo uma mensagem do meu aventureiro e ela está coberta de poeira avermelhada, de sua jornada pelas montanhas do deserto."
 fund_inspiration.6512.t:0 "$fund_inspiration.title$ [ROOT.Char.GetTitleAsNameNoTooltip|U] da Montanha"
 fund_inspiration.7001.a.same:0 "Para você, minha amada!"
 fund_inspiration.7001.a:0 "[Select_CString( dedication_a.IsFemale, 'A minha amada', 'Ao meu amado' )] [dedication_a.GetFirstNameNoTooltip]!"
 fund_inspiration.7001.b:0 "Em memória de [dedication_b.GetFirstNameNoTooltip]..."
 fund_inspiration.7001.c:0 "Somente [ROOT.Char.GetFaith.HighGodNameAlternate] me guia!"
 fund_inspiration.7001.d:0 "Não há necessidade de uma dedicação."
 fund_inspiration.7001.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] se aproxima de mim com uma expressão pensativa. 'Existe alguém especial para você, [ROOT.Char.Custom('FormOfAddressForLiege')]?' \n\n[inspiration_owner.GetSheHe|U] deve ter lido minha irritação com tal pergunta pessoal no meu rosto, porque [inspiration_owner.GetSheHe] continua: 'Quero dizer, existe alguém a quem você deseja dedicar sua obra de arte comissionada? Está ficando boa, mas uma inscrição significativa a tornaria ainda mais pessoal!'"
 fund_inspiration.7001.t:0 "$fund_inspiration.title$ Um nome para lembrar"
 fund_inspiration.7002.c:0 "[Select_CString( dedication_d.IsFemale, 'A minha amada', 'Ao meu amado' )] [dedication_d.GetFirstNameNoTooltip]!"
 fund_inspiration.7003.a:0 "Para [dedication_e.GetFirstNameNoTooltip]!"
 fund_inspiration.7003.b:0 "Para [dedication_f.GetFirstNameNoTooltip]!"
 fund_inspiration.7003.c:0 "Encontrarei outras maneiras de impressionar quem eu quiser."
 fund_inspiration.7003.desc:0 "Recentemente, meus esforços para impressionar fracassaram..."
 fund_inspiration.7003.desc_e:0 "Minha amizade com [dedication_e.GetTitledFirstName] ainda está em terreno instável."
 fund_inspiration.7003.desc_end:0 "É uma bagunça.\n\nNo entanto, tenho uma ideia brilhante. Farei com que [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] adicione uma dedicatória à obra-prima que [inspiration_owner.GetSheHe] está criando! O homenageado lisonjeado ficará profundamente tocado por minha generosidade e munificência, e não terá escolha a não ser gostar mais de mim!"
 fund_inspiration.7003.desc_f:0 "[dedication_f.GetTitledFirstName|U] ainda me rejeita."
 fund_inspiration.7003.t:0 "$fund_inspiration.title$ Alguém para Impressionar"
 fund_inspiration.7004.a:0 "Não! Para [dedication_g1.GetFirstNameNoTooltip] e [dedication_g2.GetFirstNameNoTooltip]!"
 fund_inspiration.7004.b:0 "Afinal, por que não? PARA MIM MESMO!"
 fund_inspiration.7004.c:0 "Dedicações são superestimadas de qualquer maneira."
 fund_inspiration.7004.desc:0 "[dedication_g1.GetTitledFirstName|U] e [dedication_g2.GetTitledFirstName] estão entre os vassalos mais poderosos do meu reino. Eu nunca sei como mantê-los felizes, para que eles não comecem a causar problemas. Talvez a bajulação seja o caminho a seguir?\n\nQualquer pessoa ficaria feliz em ter algo feito em seu nome, não é mesmo? E eu tenho exatamente a coisa certa sendo feita! Eu devo informar [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] que estou dedicando a sua obra-prima a meus vassalos e conselheiros #EMP confiáveis#!.\n\nPor outro lado, é #EMP meu#! artefato, então talvez eu devesse apenas...?"
 fund_inspiration.7004.t:0 "$fund_inspiration.title$ Um Vassalo para Lembrar?"
 fund_inspiration.7010.a:0 "Claro, isso parece adorável!"
 fund_inspiration.7010.b:0 "É tolo e desnecessário."
 fund_inspiration.7010.desc:0 "Eu posso ouvir [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] murmurando para [inspiration_owner.GetHerselfHimself] através do corredor. \"Eu preciso de algo grande, algo #EMP épico#! para fazer minha criação se destacar das massas sem inspiração, mas o quê, apenas O QUÊ?\"\n\nQuando os seus olhos animados encontram os meus, [inspiration_owner.GetSheHe] abre um enorme sorriso e acena para mim. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Que ideia incrível! Simplesmente #EMP perfeito#!! O que você acha de adicionar o lema de sua família à sua comissão?\""
 fund_inspiration.7010.t:0 "$fund_inspiration.title$ Um Lema para as Eras"
 fund_inspiration.7100.a.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] de [casualties|E]."
 fund_inspiration.7100.a:0 "Para causar mais baixas para #EMP eles#!, menos para #EMP nós#!."
 fund_inspiration.7100.b.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] de [raid|E]."
 fund_inspiration.7100.b:0 "Para instilar medo nas pessoas que eu ataco."
 fund_inspiration.7100.c.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] relacionado a [knight|E]."
 fund_inspiration.7100.c:0 "Para incentivar meus $knight_culture_player_plural_no_tooltip_lowercase$ à grandeza."
 fund_inspiration.7100.d.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] relacionado ao [terrain|E]."
 fund_inspiration.7100.d:0 "Para melhor aproveitar as vantagens do terreno."
 fund_inspiration.7100.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! O trabalho em seu precioso artefato está progredindo bem!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] parece de muito bom humor hoje.\n\n\"Eu não estou fazendo nenhuma promessa, mas... se eu conseguir produzir uma verdadeira obra-prima, que ideia você gostaria de guiar minha mão?\""
 fund_inspiration.7100.e.tt:0 "Os [modifiers|E] resultantes do [artifact|E] serão aleatórios."
 fund_inspiration.7100.e:0 "Qualquer coisa."
 fund_inspiration.7100.t:0 "$fund_inspiration.title$ Direção Criativa"
 fund_inspiration.7110.a.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] de [opinion_i][opinion|E] de [rulers|E]."
 fund_inspiration.7110.a:0 "Para fazer todos os governantes com inveja de mim!"
 fund_inspiration.7110.b.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] de [dynasty|E]."
 fund_inspiration.7110.b:0 "Para trazer glória à minha dinastia."
 fund_inspiration.7110.c.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] de medo ou [tyranny|E]."
 fund_inspiration.7110.c:0 "Para comandar respeito de meus subordinados."
 fund_inspiration.7110.d.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] de [attraction|E]."
 fund_inspiration.7110.d:0 "Para impressionar meus amantes!"
 fund_inspiration.7110.e.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] de [opinion_i][opinion|E] de [vassal|E]."
 fund_inspiration.7110.e:0 "Para impressionar meus vassalos!"
 fund_inspiration.7110.g.tt:0 "Seu [artifact|E] pode ganhar um [modifier|E] de [opinion_i][opinion|E] de [courtiers|E]."
 fund_inspiration.7110.g:0 "Para impressionar toda minha corte."
 fund_inspiration.7120.a.tt:0 "Seu artefato pode ganhar um modificador de curto reinado."
 fund_inspiration.7120.a:0 "Para legitimar meu reinado."
 fund_inspiration.8001.a.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar seus estudos na criação de ouro."
 fund_inspiration.8001.a:0 "O que foi que você disse sobre ouro?"
 fund_inspiration.8001.b.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar seus estudos na criação de prata."
 fund_inspiration.8001.b:0 "Você disse prata?"
 fund_inspiration.8001.c.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar seus estudos no mercúrio."
 fund_inspiration.8001.c:0 "Mercúrio é verdadeiramente fascinante."
 fund_inspiration.8001.d.tt:0 "[inspiration_owner.GetTitledFirstNameNoTooltip] irá focar seus estudos no arsênico."
 fund_inspiration.8001.d:0 "Você disse Arsenic?"
 fund_inspiration.8001.desc:0 "Eu encontro [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] curvado sobre um frasco contendo um pó amarelo curioso, rodeado por pergaminhos e amostras de algum tipo de minério.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Dê uma olhada, veja como este enxofre muda de cor? Isso é um sinal de transmutação. Pode criar prata, ou até mesmo ouro! Ou aqui, veja como interage com o mercúrio! Maravilhoso... E este minério, é de natureza arsenical, o que - ehum, peço desculpas, meu senhor feudal. Há muito para estudar! Talvez até demais.\""
 fund_inspiration.8001.t:0 "$fund_inspiration.title$ Fascinação Metálica"
 fund_inspiration.8011.a:0 "Esta farsa deve ter lhe ensinado algo útil."
 fund_inspiration.8011.b:0 "Jogue este charlatão nas masmorras!"
 fund_inspiration.8011.c:0 "Você ousa me envenenar?! Irá pendurar por isso!"
 fund_inspiration.8011.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me convocou para seu laboratório, delirando sobre uma descoberta em suas pesquisas.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], você está aqui! Excelente. Por favor, beba isto.\" [inspiration_owner.GetFirstNameNoTooltip] me leva para dentro da sala e em direção a uma mesa cheia de pergaminhos e frascos. É um desses frascos, contendo uma poção dourada, que [inspiration_owner.GetSheHe] me faz beber. \"Ainda é um trabalho em andamento, é claro, mas deve ter um efeito verdadeiramente notável!\"\n\nDepois de horas de espera, tudo o que sinto é uma dor de cabeça pulsante, náusea e tontura."
 fund_inspiration.8011.t:0 "$fund_inspiration.title$ Sonhos Dourados"
 fund_inspiration.8012.a:0 "Você é? Como você pôde?! Saia do meu reino."
 fund_inspiration.8012.b.failure:0 "[court_chaplain.GetFirstNameNoTooltip] não está convencido"
 fund_inspiration.8012.b.success:0 "Você consegue convencer [court_chaplain.GetFirstNameNoTooltip]"
 fund_inspiration.8012.b:0 "[inspiration_owner.GetSheHe|U] está me conduzindo à iluminação!"
 fund_inspiration.8012.c:0 "[inspiration_owner.GetSheHe|U] certamente não está."
 fund_inspiration.8012.desc:0 "Estou inclinado sobre uma mesa, ouvindo meu alquimista [inspiration_owner.GetTitledFirstName] explicar seu último experimento, quando [court_chaplain.Custom2('MyCharacterIntroduction', ROOT.Char)] irrompe na sala.\n\n\"Então é verdade, você #EMP passa#! seu tempo com esse... esse #EMP pagão#!!\" [court_chaplain.GetFirstNameNoTooltip] olha as tigelas e ilustrações espalhadas diante de nós e seus olhos se tornam ainda mais frios.\n\n\"Isto tem que parar, [ROOT.Char.Custom('FormOfAddressForLiege')]. Esse charlatão está te levando para o caminho errado!\""
 fund_inspiration.8012.t:0 "$fund_inspiration.title$ Igreja e Charlatães"
 fund_inspiration.8013.a:0 "Obrigado, estudarei isso."
 fund_inspiration.8013.a_tt:0 "Você mantém o livro"
 fund_inspiration.8013.b:0 "Confio que você fará bom uso do livro."
 fund_inspiration.8013.b_tt:0 "Você dá o livro para [inspiration_owner.GetShortUINameNoTooltip]"
 fund_inspiration.8013.c:0 "Que achado! Com certeza renderá um bom preço."
 fund_inspiration.8013.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" Meu alquimista [inspiration_owner.GetTitledFirstName] corre até mim, tão animado quanto uma criança.\n\n\"Eu encontrei este livro ao visitar o mercado em [barony_market.GetName]. É um livro atribuído ao lendário alquimista Jabir ibn Hayyan - o mestre em pessoa! Pelo menos segundo o comerciante... No entanto, imagine a riqueza de conhecimento contida nele!\""
 fund_inspiration.8013.t:0 "$fund_inspiration.title$ Um Tesouro Alquímico"
 fund_inspiration.8014.a:0 "Eu não pago para você apenas ficar sentado!"
 fund_inspiration.8014.b:0 "Leve o seu tempo."
 fund_inspiration.8014.c.tt:0 "Venda todo o equipamento alquímico que você comprou"
 fund_inspiration.8014.c:0 "Não vou desperdiçar meu ouro com essa bobagem!"
 fund_inspiration.8014.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] nunca parece conduzir nenhum experimento ou produzir nada de nota. [inspiration_owner.GetSheHe|U] apenas senta perto da janela, olhando, dia após dia.\n\nQuando exijo saber o que estou realmente patrocinando, [inspiration_owner.GetSheHe] simplesmente dá de ombros e aponta para a janela. \"Estou ponderando a natureza do mundo, [ROOT.Char.Custom('FormOfAddressForLiege')]. É um mundo grande, então há muito a considerar!\""
 fund_inspiration.8014.t:0 "$fund_inspiration.title$ O Pensamento [inspiration_owner.GetWomanMan|U]"
 fund_inspiration.8015.a:0 "Mas - eu - Você tem razão... Obrigado."
 fund_inspiration.8015.b.tt:0 "[inspiration_owner.GetShortUINameNoTooltip] tentará o impossível"
 fund_inspiration.8015.b:0 "Não. Você trará [loved_one.GetSheHe] de volta para mim!"
 fund_inspiration.8015.desc:0 "Os alquimistas têm poder sobre toda a matéria, podem criar maravilhas, então como a vida é diferente? Como [loved_one.GetFirstName] é diferente?!\"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] apenas balança a cabeça, ignorando minha tristeza. De que adianta a ciência se ela não pode me conceder esse único desejo?\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu não posso realizar esse tipo de milagre. No entanto, descobri que um ouvido atento pode ser sua própria forma de magia quando a tristeza paira. Por favor, sente-se.\""
 fund_inspiration.8015.t:0 "$fund_inspiration.title$ Em Luto"
 fund_inspiration.8016.a:0 "Eu... Eu acho que vou vomitar."
 fund_inspiration.8016.b:0 "Você ousa zombar da minha tristeza? Guardas! Prendam [inspiration_owner.GetSheHe]!"
 fund_inspiration.8016.desc:0 "Meus passos são leves enquanto eu faço meu caminho para o laboratório de meu alquimista [inspiration_owner.GetTitledFirstNamePossessive]. Oh [loved_one.GetFirstName], finalmente eu vou te ver novamente! No entanto, quando [inspiration_owner.GetTitledFirstNameNoTooltip] abre a porta, meu coração afunda com o olhar em seu rosto. E por que [inspiration_owner.GetSheHe] não me deixa ver dentro do quarto?\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu falhei com você. Por favor, não –\"\n\nEu passo por [inspiration_owner.GetSheHe], entro no laboratório e o que vejo... Eu não consigo compreender. Tendões, pilhas de carne, pós e ervas, tudo encharcado de sangue e espalhado em um círculo no chão. E em cima, uma única mecha de cabelo exatamente da mesma cor que adornava a cabeça de [loved_one.GetFirstNamePossessiveNoTooltip]."
 fund_inspiration.8017.a:0 "É bom que vocês estejam compartilhando conhecimento."
 fund_inspiration.8017.b:0 "Vergonha para vocês dois, voltem ao trabalho!"
 fund_inspiration.8017.desc:0 "Eu encontro [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] e [court_tutor.Custom2('MyCharacterIntroduction', ROOT.Char)] encolhidos sobre uma mesa, comparando o que parece ser pedras moídas.\n\n\"Você vê,\" [inspiration_owner.GetFirstNameNoTooltip] diz. \"Quando você aquece esse pó, ele primeiro fica preto, mas #EMP então#! - Oh, bom dia m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord].\"\n\n[court_tutor.GetFirstNameNoTooltip] olha para a admiração e tem a decência de parecer um pouco envergonhada; [court_tutor.GetSheHe] deveria estar preparando as palestras de amanhã."
 fund_inspiration.8017.t:0 "Grupo de Estudos $fund_inspiration.title$"
 fund_inspiration.9000.a.critical_success:0 "[adventurer.GetFirstNameNoTooltip] escapa durante a noite ... e rouba o ouro de [bandit.GetFirstNamePossessiveNoTooltip]"
 fund_inspiration.9000.a.failure:0 "[adventurer.GetFirstNameNoTooltip] é pego tentando se esgueirar pelo acampamento"
 fund_inspiration.9000.a.success:0 "[adventurer.GetFirstNameNoTooltip] escapa durante a noite"
 fund_inspiration.9000.a:0 "Mantenha-se discreto, eles eventualmente irão embora."
 fund_inspiration.9000.b.boil_skull:0 "[adventurer.GetFirstNameNoTooltip] ferve e limpa o crânio de [bandit.GetFirstNamePossessiveNoTooltip] e o envia para você como um [court_artifact|E]"
 fund_inspiration.9000.b.critical_failure:0 "[adventurer.GetFirstNameNoTooltip] é morto por [bandit.GetFirstNameNoTooltip]"
 fund_inspiration.9000.b.critical_success:0 "[adventurer.GetFirstNameNoTooltip] corajosamente mata [bandit.GetFirstNameNoTooltip]"
 fund_inspiration.9000.b.failure:0 "[adventurer.GetFirstNameNoTooltip] é ferido por [bandit.GetFirstNameNoTooltip]"
 fund_inspiration.9000.b.success:0 "[adventurer.GetFirstNameNoTooltip] consegue afugentar os bandidos com sucesso"
 fund_inspiration.9000.b:0 "Sem coragem, sem glória! Faça-os pagar por desperdiçar meu tempo."
 fund_inspiration.9000.c:0 "Este ouro deve ser suficiente como suborno para deixá-lo passar."
 fund_inspiration.9000.desc:0 "\"Meu senhor, o aventureiro [adventurer.GetFirstName] envia notícias!\" exclama o servo, entregando uma carta.\n\n\"Por dez dias e dez noites eu e meu grupo estivemos escondidos. [Select_CString( bandit.IsFemale, 'A', 'O' )] [bandit.GetLadyLord] [bandit.GetFirstName] estabeleceu um bloqueio na estrada que precisamos seguir - o que você aconselha? Cautela? Ou devemos lutar contra eles, confiando em [adventurer.GetFaith.HighGodName] para nos manter seguros? Assinado, [adventurer.GetFirstName].\" lê-se no pergaminho.\n\nParece que [adventurer.GetSheHe] está em um grande apuro."
 fund_inspiration.9000.t:0 "Bandidos na Estrada $fund_inspiration.title$"
 fund_inspiration.9001.a:0 "Que tragédia!"
 fund_inspiration.9001.a_tt:0 "Você interrompe o financiamento da inspiração de [inspiration_owner.GetTitledFirstNamePossessive]"
 fund_inspiration.9001.desc:0 "Desastre! [inspiration_owner.GetTitledFirstName], minha benfeitora, faleceu. [inspiration_owner.GetSheHe|U] [inspiration_owner.GetDeathReason] antes de [inspiration_owner.GetSheHe] poder realizar a sua – realizar #EMP meu#! sonho!\n\n"
 fund_inspiration.9001.desc_adventurer:0 "Agora nunca saberei o que as suas aventuras poderiam ter me proporcionado..."
 fund_inspiration.9001.desc_alchemy:0 "Agora nunca saberei que tipo de maravilha [inspiration_owner.GetSheHe] poderia ter criado ou descoberto..."
 fund_inspiration.9001.desc_armor:0 "Agora nunca saberei que tipo de obra-prima [inspiration_owner.GetSheHe] poderia ter criado..."
 fund_inspiration.9001.desc_artisan:0 "Agora nunca saberei que tipo de obra-prima [inspiration_owner.GetSheHe] poderia ter criado..."
 fund_inspiration.9001.desc_book:0 "Agora nunca saberei que tipo de obra-prima [inspiration_owner.GetSheHe] poderia ter escrito..."
 fund_inspiration.9001.desc_religious_artifact:0 "Agora nunca saberei que tipo de obra-prima [inspiration_owner.GetSheHe] foi inspirado a fazer..."
 fund_inspiration.9001.desc_research:0 "Agora nunca saberei quais descobertas [inspiration_owner.GetSheHe] poderia ter sido capaz de fazer..."
 fund_inspiration.9001.desc_smith:0 "Agora nunca saberei que tipo de obra-prima [inspiration_owner.GetSheHe] poderia ter forjado..."
 fund_inspiration.9001.desc_weapon:0 "Agora nunca saberei que tipo de obra-prima [inspiration_owner.GetSheHe] poderia ter forjado..."
 fund_inspiration.9001.desc_weaver:0 "Agora nunca saberei que tipo de obra-prima [inspiration_owner.GetSheHe] poderia ter tecido..."
 fund_inspiration.9001.t:0 "Inspiração Encerrada"
 fund_inspiration.9002.desc:0 "Desastre! [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] foi capturado e não pode mais trabalhar para realizar o seu sonho de"
 fund_inspiration.9002.desc_adventurer:0 "partir em uma aventura."
 fund_inspiration.9002.desc_alchemy:0 "descobrir os mistérios deste mundo."
 fund_inspiration.9002.desc_armor:0 "criar uma armadura."
 fund_inspiration.9002.desc_artisan:0 "criar algo magnífico."
 fund_inspiration.9002.desc_book:0 "escrever um livro."
 fund_inspiration.9002.desc_religious_artifact:0 "criar uma obra de arte piedosa."
 fund_inspiration.9002.desc_research:0 "inovação científica adicional."
 fund_inspiration.9002.desc_smith:0 "forjar uma obra-prima."
 fund_inspiration.9002.desc_weapon:0 "forjar uma arma."
 fund_inspiration.9002.desc_weaver:0 "tecer uma obra-prima."
 fund_inspiration.9003.desc:0 "[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] já não é meu cortesão, então não posso mais apoiar o seu sonho."
 fund_inspiration.9004.a:0 "Ponha-se de pé."
 fund_inspiration.9004.desc:0 "[inspiration_owner.GetTitledFirstName] retorna à minha corte, não faz muito tempo desde que [inspiration_owner.GetTitledFirstName|U] partiu."
 fund_inspiration.9004.desc_adventurer_stuck_in_swamp:0 "Uma pilha cambaleante de sujeira, folhas e lama chega à minha sala do trono. Sinto que meu tempo acabou. Talvez eu não tenha rezado o suficiente. Mas quando meus servos jogam um balde de água, a sujeira se lava para revelar [inspiration_owner.GetTitledFirstName], de volta do pântano. [inspiration_owner.GetSheHe|U] imediatamente corre para beijar meu pé. 'Não aguentava mais e estou muito feliz em estar de volta ao mundo civilizado.'\n\nAssim"
 fund_inspiration.9004.desc_adventurer_tired_of_europe:0 "\n\nAo reentrar em minha corte, [inspiration_owner.GetSheHe] se curva para beijar o chão e depois meu sapato. '[ROOT.Char.Custom('FormOfAddressForLiege')|U], ficarei eternamente em sua dívida por permitir-me retornar à civilização... longe daquele país sombrio e carnal chamado Europa.'"
 fund_inspiration.9005.a:0 "O trabalho continuará!"
 fund_inspiration.9005.b:0 "Essas distrações frívolas acabarão."
 fund_inspiration.9005.desc_intro:0 "[inherited_insp_owner.GetTitledFirstName], m[Select_CString( inherited_insp_owner.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('inherited_insp_owner'))], pede uma palavra em meio à turbulência da sucessão. \n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], antes da sua morte, [old_ruler.GetTitledFirstNameRegnal] encomendou meu trabalho; Eu estava no meio de [inherited_insp_owner.Custom('InspirationTypeDescription')] para [old_ruler.GetSheHe].\" \n\n"
 fund_inspiration.9005.desc_multiple:0 "\"Outros artistas também estavam trabalhando, e queremos saber se você patrocinará nossos esforços.\""
 fund_inspiration.9005.desc_single:0 "\"O trabalho já começou, seria uma pena não concluí-lo...\""
 fund_inspiration.9005.t:0 "Negócios Inacabados"
 fund_inspiration.9100.a.failure:0 "[adventurer.GetFirstNameNoTooltip] é atacado por um(a) [adventurer.Custom('GetAnimalType')]!"
 fund_inspiration.9100.a.success:0 "[adventurer.GetFirstNameNoTooltip] evita com sucesso qualquer [adventurer.Custom('GetAnimalPlural')]"
 fund_inspiration.9100.a:0 "O conhecimento de [adventurer.GetFirstNamePossessiveNoTooltip] deve ser suficiente para [Select_CString( adventurer.IsFemale, 'mantê-la segura', 'mantê-lo seguro' )]..."
 fund_inspiration.9100.b.failure:0 "[adventurer.GetFirstNameNoTooltip] é superado por um(a) [adventurer.Custom('GetAnimalType')] selvagem que avança"
 fund_inspiration.9100.b.maimed:0 "[adventurer.GetFirstName] é mutilado por [adventurer.Custom('GetAnimalType')]"
 fund_inspiration.9100.b.success:0 "[adventurer.GetFirstNameNoTooltip] mata um(a) [adventurer.Custom('GetAnimalType')] selvagem que avança"
 fund_inspiration.9100.b:0 "Por [ROOT.Char.GetFaith.HighGodName], espero que [adventurer.GetSheHe] não precise lutar contra um!"
 fund_inspiration.9100.c:0 "[adventurer.GetFirstNameNoTooltip] é cauteloso, eles vão pegar o caminho mais longo ao redor."
 fund_inspiration.9100.desc:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetLadyLord|U], uma mensagem [Select_CString( adventurer.IsFemale, 'da sua aventureira', 'do seu aventureiro' )], [adventurer.GetFirstName].\" diz [Select_CString( adventurer.IsFemale, 'a serva', 'o servo' )], entregando-me um pergaminho.\n\n\"Minha busca me levou ao [background_wilderness_scope.Custom('TerrainTypeProvince')] em [background_wilderness_scope.GetName]. Eles são notoriamente infestados por [adventurer.Custom('GetAnimalType')], mas tenho boas razões para acreditar que meu objetivo está próximo! Espero voltar em breve. Assinado, [adventurer.GetFirstNameNoTooltip]\" lê-se no pergaminho.\n\n[adventurer.GetSheHe|U] certamente é ambicios[Select_CString( adventurer.IsFemale, 'a', 'o' )] por escolher um caminho tão arriscado..."
 fund_inspiration.9100.t:0 "$fund_inspiration.title$ [adventurer.Custom('GetAnimalPlural')|U] [adventurer.Custom('GetAnimalAdjective')|U] em [background_wilderness_scope.Custom('TerrainTypeProvince')|U]"
