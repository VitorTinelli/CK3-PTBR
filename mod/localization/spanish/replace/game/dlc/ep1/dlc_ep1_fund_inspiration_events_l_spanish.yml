 fund_inspiration.0051.d:0 "O mundo é seu, meu amigo!"
 fund_inspiration.0051.desc:0 "Não se preocupe, minha grande [ROOT.Char.GetTitleTierName],\" [inspiration_owner.GetTitledFirstName] se curva com um toque dramático e [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))].\n\n\"Eu irei para fora e explorarei o mundo em seu lugar enquanto você continua governando seu reino. O que eu trouxer de volta será de tal calibre que você sentirá minha realização #EMP permear#! através do memento da minha aventura!\"\n\nHá uma pequena pausa antes de [inspiration_owner.GetSheHe] continuar. \"Nesse sentido, há alguma área do mundo que você tenha interesse, [ROOT.Char.Custom('FormOfAddressForLiege')]?\""
