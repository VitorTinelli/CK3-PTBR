 fund_inspiration.0011.d:0 "Esqueça a forja, eu quero atirar."
 fund_inspiration.0011.desc:0 "[inspiration_owner.GetTitledFirstName] [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))] antes de se curvar profundamente. 'É uma honra e um privilégio forjar uma arma para você', [inspiration_owner.GetSheHe] fala de maneira digna, mas há um brilho de excitação nos seus olhos que denuncia a sua seriedade.\n\n 'Diga-me, qual é a sua forma preferida de lutar com uma arma? Quero forjar algo que se adapte melhor a você.'"
