 fund_inspiration.0032.t:0 "Livro Inspiração Financiado"
 fund_inspiration.0041.desc:0 "\"Obrigado por depositar sua confiança em mim, [ROOT.Char.Custom('FormOfAddressForLiege')]! [inspiration_owner.GetTitledFirstName] sorri e continua: \"Sua confiança não é mal colocada, pois passei anos praticando minhas técnicas e tecendo alguns tapetes e cortinas realmente maravilhosos.\"\n\n\"Para você, porém, acho que um tapeçaria seria o melhor - uma bem tecida pode realmente chamar a atenção de uma sala e dizer algo sobre seu proprietário. A única questão é, o que a tapeçaria deve mostrar?\""
 fund_inspiration.0041.option_abstract:0 "Uma obra de beleza artística abstrata."
 fund_inspiration.0041.option_battle:0 "Um tributo à minha vitória na Batalha de [ROOT.Var('epic_battle_location').Province.GetNameNoTooltip]."
 fund_inspiration.0041.option_history:0 "Algo que ilustre a história de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
 fund_inspiration.0041.option_life:0 "Uma representação do que é a vida em meu reino."
 fund_inspiration.0041.option_nature:0 "Algo que mostre a beleza selvagem da natureza."
 fund_inspiration.0042.t:0 "Financiado Inspiração Tecelão"
 fund_inspiration.0043.desc:0 "\"Sim, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord], eu vou tecer uma bandeira poderosa para você!\" [inspiration_owner.GetTitledFirstName] está genuinamente animado por estar trabalhando para mim. \"Os nobres do [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] conhecem bem meu trabalho, mas esta é uma nova honra!\"\n\n\"Confie em mim, isto não será um simples estandarte de tecido, será a mais régia das cortinas! Eu só preciso saber, que brasão você deseja que eu costure?\""
 fund_inspiration.0043.option_dynasty:0 "O emblema da [ROOT.Char.GetDynasty.GetNameNoTooltip]."
 fund_inspiration.0043.option_dynasty_tt:0 "A qualidade da bandeira da dinastia está ligada ao [dynasty_prestige_level|E]"
 fund_inspiration.0043.option_house:0 "O símbolo da Casa [ROOT.Char.GetHouse.GetNameNoTooltip]."
 fund_inspiration.0043.option_title:0 "Os brasões de [ROOT.Char.GetPrimaryTitle.GetDefinitiveNamePossessiveNoTooltip|U]."
 fund_inspiration.0044.desc:0 "Meu antiquário, [antiquarian.GetTitledFirstName], chega pontualmente para coletar os fundos para minha encomenda. 'Já era hora de você conseguir algumas novas coberturas para suas paredes!', [antiquarian.GetSheHe|U] olha para mim timidamente. \n\n\"Ahem, vou encontrar um habilidoso tecelão, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord]... o que você quer que seja feito?\" [antiquarian.GetSheHe|U] rola a bolsa em suas mãos distraído, aguardando minha decisão."
 fund_inspiration.0044.option_banner:0 "Preciso de um novo estandarte."
 fund_inspiration.0044.option_tapestry:0 "Um belo tapeçaria para o meu salão."
 fund_inspiration.0044.t:0 "$commission_artifact_decision$: Tapeçaria"
