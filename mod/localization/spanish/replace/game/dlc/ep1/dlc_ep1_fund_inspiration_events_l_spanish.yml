 fund_inspiration.0021.brigandine.tt:0 "Uma armadura muito flexível e elegante"
 fund_inspiration.0021.brigandine:0 "Eu quero uma armadura segmentada."
 fund_inspiration.0021.desc:0 "\"Você não vai se arrepender de me apoiar, [ROOT.Char.Custom('FormOfAddressForLiege')]!\"\n\n[inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] me assegura que [inspiration_owner.GetSheHe] vai criar uma obra-prima, mas que minha contribuição é valorizada. \"Por favor, me diga, que tipo de armadura você deseja?\""
 fund_inspiration.0021.lamellar.tt:0 "Uma armadura flexível que oferece excelente proteção a um ótimo preço"
 fund_inspiration.0021.lamellar:0 "Você irá criar uma armadura lamelar resistente."
 fund_inspiration.0021.laminar.tt:0 "Uma armadura robusta e confiável"
 fund_inspiration.0021.laminar:0 "Faça uma armadura laminar."
 fund_inspiration.0021.mail.tt:0 "Não muito chamativa, mas confiável"
 fund_inspiration.0021.mail:0 "Eu quero uma cota de malha flexível."
 fund_inspiration.0021.plate.tt:0 "Ótima proteção e estilo, mas muito pesada e cara"
 fund_inspiration.0021.plate:0 "Uma armadura completa de placas irá me manter segur@!"
 fund_inspiration.0021.scale.tt:0 "Oferece boa proteção, mas é um pouco menos flexível que algumas alternativas"
 fund_inspiration.0021.scale:0 "Uma armadura de escamas confiável é o que eu preciso."
 fund_inspiration.0022.t:0 "Fundo de Inspiração para Armaduras"
 fund_inspiration.0031.c:0 "Detalhe meus esforços para unir [united_title.GetNameNoTierNoTooltip]!"
 fund_inspiration.0031.d:0 "Eu criei o [created_title.GetNameNoTierNoTooltip], isso é um assunto digno!"
 fund_inspiration.0031.desc:0 "\"Obrigad@ por acreditar em mim, [ROOT.Char.Custom('FormOfAddressForLiege')]!\" [inspiration_owner.Custom2('MyCharacterIntroduction', ROOT.Char)|U] sorri [ROOT.Char.Custom2('QuirkAdverbPosOrNeg', inspiration_owner)] antes de inclinar a cabeça.\n\n\"No entanto, não tenho certeza sobre o que escrever. Recentemente, tenho me interessado por temas relacionados a [SCOPE.Custom('ArtifactBookSubject')], você acha que seria um bom foco para o livro?\""
 fund_inspiration.0031.dynasty:0 "Você escreverá sobre a gloriosa dinastia [ROOT.Char.GetDynasty.GetName]."
 fund_inspiration.0031.e:0 "Meu sucesso em restaurar o [restored_title.GetNameNoTierNoTooltip] deve ser escrito!"
 fund_inspiration.0031.education:0 "O livro será sobre [ROOT.Char.Custom('education_focus')]."
 fund_inspiration.0031.f:0 "Confio no seu julgamento."
 fund_inspiration.0031.focus:0 "Ele refletirá meu foco na vida - escreva sobre [ROOT.Char.Custom('LifestyleFocus')]!"
 fund_inspiration.0031.lifestyle_blademaster:0 "Nenhum tema é tão afiado quanto aquele que envolve lâminas!"
 fund_inspiration.0031.lifestyle_cannibal:0 "Nada desperta minha #EMP fome#! de exploração como o corpo humano."
 fund_inspiration.0031.lifestyle_deviant:0 "O livro deve se aprofundar no #EMP prazer#!!"
 fund_inspiration.0031.lifestyle_herbalist:0 "O livro detalhará ervas e plantas!"
 fund_inspiration.0031.lifestyle_hunter:0 "Que seja sobre os detalhes da caça e do jogo!"
 fund_inspiration.0031.lifestyle_lunatic:0 "O livro explicará a realidade. Uma delas."
 fund_inspiration.0031.lifestyle_mystic:0 "Os livros explorarão minha abordagem não convencional da vida!"
 fund_inspiration.0031.lifestyle_physician:0 "O corpo humano é um assunto que vale a pena investigar!"
 fund_inspiration.0031.lifestyle_reveler:0 "Vamos escrever sobre alegria, sobre a #EMP vida#!, sobre banquetes!"
 fund_inspiration.0031.lifestyle_torturer:0 "Vamos documentar as muitas maneiras de quebrar a mente e o corpo de alguém."
 fund_inspiration.0031.lifestyle_witch:0 "Dedicarei o trabalho a [ROOT.Char.GetFaith.WitchGodName]."
 fund_inspiration.0031.mystical_animal:0 "Eu recontarei minha caçada ao [ROOT.Char.Custom('LocalAnimal')] branco."
 fund_inspiration.0031.pet_option_cat:0 "Por favor, escreva sobre meu amado gato, [ROOT.Char.Custom('CatStoryName')]!"
