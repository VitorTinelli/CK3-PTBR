l_spanish:
 game_concept_amenities:0 "Amenidades"
 game_concept_aptitude:0 "Aptidão"
 game_concept_aptitude_desc:0 "A $game_concept_aptitude$ de um [character|E] determina sua eficiência em várias funções na [court|E]. Essas funções incluem [court_positions|E], [diarchs|E], e [tax_collectors|E].\n\n$game_concept_aptitude$ é medido em 5 níveis, variando de Terrível a Excelente. O nível de $game_concept_aptitude$ de um personagem decide os bônus que o [liege|E] recebe ao empregá-lo em uma função na [court|E].\n\nPor exemplo, um personagem que possui a [GetTrait('lifestyle_physician').GetName( GetNullCharacter )] será naturalmente mais bem qualificado para servir como um $court_physician_court_position$."
 game_concept_aptitude_i:0 "#P @aptitude:5:inherit_color!#!"
 game_concept_artifact:0 "Artefato"
 game_concept_artifact_claim:0 "Reivindicação de Artefato"
 game_concept_artifact_claim_desc:0 "Uma $game_concept_artifact_claim$ representa os direitos legais de alguém sobre um [artifact|E].\n\nTer uma Reivindicação sobre um [artifact|E] significa que você pode tomar várias ações em relação a esse artefato e seu proprietário, se você não o possui atualmente (por exemplo, usando o [scheme|E] de [GetScheme('steal_back_artifact').GetTypeName]).\n\nExistem [personal_artifact_claims|E] para [character|E] e [house_artifact_claims|E] para [houses|E].\n\nAs reivindicações de artefato são mais simples do que as de [title_claims|E]; elas existem ou não. Elas também não são herdadas além da primeira geração."
 game_concept_artifact_claims:0 "Reivindicações de Artefato"
 game_concept_artifact_desc:0 "Um Artefato é um objeto notável que fornece bônus ao [character|E] que o usa.\n\n[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'game_concept_artifact_desc_DLC', 'game_concept_artifact_desc_NO_DLC' )]\n\nAlguns Artefatos são mais especiais do que outros e têm uma [rarity|E] mais alta.\n\nAssim como com [titles|E], os personagens podem obter [artifact_claims|E] em um Artefato e tentar tomá-lo para si.\n\nOs Artefatos também têm uma [durability|E]: quando ela chega a zero, o Artefato é destruído.\n\nOs Artefatos são sempre herdados pelo [player_heir|E] do proprietário. Se um Artefato for herdado por alguém que não é um [close_family_member|E], ele perderá [durability|E] ou até mesmo será destruído completamente."
 game_concept_artifact_desc_DLC:0 "Os Artefatos são divididos em duas categorias:\n$BULLET_WITH_TAB$[inventory_artifacts|E] são usados ou carregados por um personagem\n$BULLET_WITH_TAB$[court_artifacts|E] residem dentro da [royal_court|E] de um [ruler|E]"
 game_concept_artifact_desc_NO_DLC:0 "Como os Artefatos são usados ou carregados pelas pessoas, eles também são conhecidos como [inventory_artifacts|E]."
 game_concept_artifact_durability:0 "Durabilidade do Artefato"
 game_concept_artifact_durability_desc:0 "Cada [artifact|E] tem uma Durabilidade. Quando toda a Durabilidade é perdida, o Artefato é destruído.\n\nA Durabilidade decai ao longo do tempo, mas também pode ser perdida em certos eventos, como [sieges|E] e na [succession|E].\n\nA Durabilidade pode ser restaurada escolhendo-se [reforge|E] ou [repair|E] o Artefato."
 game_concept_artifact_i:0 "@artifact_icon!"
 game_concept_artifacts:0 "Artefatos"
 game_concept_court_amenities:0 "Comodidades da Corte"
 game_concept_court_amenities_desc:0 "$game_concept_court_amenities$ são os padrões de vida estabelecidos na [royal_court|E].\n\nEstes são definidos pelo [ruler|E] da [royal_court|E], sendo que cada categoria (moda, comida, hospedagem e serviçais) possui diversos níveis. Gastar mais em suas Amenidades normalmente resulta em mais [court_grandeur_value|E].\n\nOs governantes com o [GetGovernment('tribal_government').GetName] estão proibidos de escolherem Amenidades mais altas."
 game_concept_court_amenity:0 "Amenidade da Corte"
 game_concept_court_artifact:0 "Artefato da Corte"
 game_concept_court_artifact_desc:0 "Um Artefato da Corte é um [artifact|E] que é exibido na [royal_court|E] de um [ruler|E], como tapeçarias ou livros belamente ilustrados.\n\nOs Artefatos da Corte são um fator que determina a [court_grandeur|E] de uma Corte Real.\n\nNão há limite para quantos Artefatos um personagem pode ter, mas apenas aqueles exibidos em um espaço do seu tipo têm qualquer efeito.\n\nVocê pode criar novos Artefatos da Corte a partir de [characters|E] [inspired|E], da Decisão Comissão de Artefatos ou escolhendo [reforge|E] um [inventory_artifact|E]."
 game_concept_court_artifacts:0 "Artefatos da Corte"
 game_concept_court_event:0 "Evento na Corte"
 game_concept_court_event_desc:0 "Um $game_concept_court_event$ é um evento envolvendo os membros de sua [court|E], eles são visíveis na [royal_court|E]."
 game_concept_court_events:0 "Eventos na Corte"
 game_concept_court_grandeur:0 "Grandeza da Corte"
 game_concept_court_grandeur_desc:0 "O valor de $game_concept_court_grandeur_value$ de uma [royal_court|E] mostra o quão famosa é a Corte e desbloqueia novos [court_grandeur_levels|E] à medida que aumenta.\n\nO valor varia de 0 a 100 e, ao longo do tempo, se estabilizará em seu valor de Referência. O valor de Referência é afetado por coisas como [dynasty_perks|E], quanto você gasta em [court_amenities|E] e se possui alguma magnífica [court_artifacts|E].\n\nUma parte do Grandeur é perdida durante a [succession|E]."
 game_concept_court_grandeur_expectation:0 "Expectativa de Grandeza da Corte"
 game_concept_court_grandeur_expectations:0 "Expectativas de Grandeza da Corte"
 game_concept_court_grandeur_expectations_desc:0 "É esperado que você tenha um [court_grandeur_level|E] que seja alto o suficiente em comparação com o seu [realm_size|E].\n\nConforme o seu [realm|E] se torna maior, espera-se que seus súditos e o mundo em geral esperem que sua [royal_court|E] seja igualmente grandiosa.\n\nSe você não atender às expectativas, várias penalidades serão aplicadas. Por outro lado, se você exceder as expectativas, você ganhará vários bônus.\n\nAs expectativas dos governantes com [GetGovernment('tribal_government').GetName] são sempre as mesmas que sua Grandeza atual."
 game_concept_court_grandeur_level:0 "Nível de Grandeza da Corte"
 game_concept_court_grandeur_level_desc:0 "O Nível de Grandeza de uma [royal_court|E] oferece bônus ao seu dono e é desbloqueado à medida que o [court_grandeur_value|E] da Corte aumenta.\n\nAlém dos efeitos de cada nível, espera-se que os grandes [realms|E] tenham atingido níveis mais altos de Grandeza. Isso é conhecido como [court_grandeur_expectations|E]."
 game_concept_court_grandeur_levels:0 "Níveis de Grandeza da Corte"
 game_concept_court_grandeur_value:0 "Valor da Grandeza da Corte"
 game_concept_court_language:0 "Idioma da Corte"
 game_concept_court_language_desc:0 "Um idioma da corte é a [language|E] oficial de uma [royal_court|E], falado pela nobreza e usado pela burocracia.\n\nA Baseline do [court_grandeur|E] é aumentada para cada [county|E] do [realm|E] que compartilha o idioma, para cada Corte Real que fala o mesmo Idioma da Corte e se for o idioma nativo do [ruler|E]."
 game_concept_court_languages:0 "Idiomas da Corte"
 game_concept_court_position:0 "Posição na Corte"
 game_concept_court_position_desc:0 "$game_concept_court_positions$ são papéis especializados que [courtiers|E] e [vassals|E] podem receber para ajudar seu [liege|E].\n\nOs benefícios que você obtém de uma $game_concept_court_positions$ são ditados pela [aptitude|E] do ocupante para a posição.\n\nConceder $game_concept_court_positions$ é gratuito, mas você deve pagar um salário mensal em [gold|E], e revogá-los custa [prestige|E]."
 game_concept_court_position_i:0 "@court_position_icon!"
 game_concept_court_positions:0 "Posições na Corte"
 game_concept_court_type:0 "Tipo de Corte"
 game_concept_court_type_desc:0 "Como parte de sua [royal_court|E], [rulers|E] podem ter um $game_concept_court_type$ designado.\n\nCada $game_concept_court_type$ fornece ao Governante e à [court|E] seu próprio conjunto de bônus, dependendo do [court_grandeur_level|E].\n\nA [ethos|E] da [culture|E] de um Governante decide quais tipos de Corte eles podem ter.\n\nOs diferentes tipos de Corte são:\n$BULLET_WITH_TAB$[GetCourtType('court_diplomatic').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_warlike').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_administrative').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_intrigue').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_scholarly').GetName]\n$BULLET_WITH_TAB$[GetCourtType('court_tribal').GetName]"
 game_concept_court_type_trait:0 "Traço do Tipo de Corte"
 game_concept_court_type_trait_desc:0 "Depois de servir [EmptyScope.ScriptValue('years_to_gain_court_type_trait')|0] anos em uma [royal_court|E], um [courtier|E] recebe um [trait|E] que reflete o [court_type|E] da corte.\n\nA qualidade deste Traço é decidida pelo tempo que o [character|E] serviu como Courtier na Corte."
 game_concept_court_types:0 "Tipos de Corte"
 game_concept_durability:0 "Durabilidade"
 game_concept_grandeur:0 "Grandeza"
 game_concept_grandeur_expectations:0 "Expectativas de Grandeza"
 game_concept_grandeur_level:0 "Nível de Grandeza"
 game_concept_grandeur_levels:0 "Níveis de Grandeza"
 game_concept_hold_court:0 "Manter Audiência"
 game_concept_hold_court_desc:0 "Uma [activity|E] na qual [vassals|E] e [courtiers|E] de um [realm|E] se reúnem em uma [royal_court|E] para pedir ao seu [liege|E] e expressar suas queixas.\n\nAs situações em que o Senhor Feudal será chamado para passar julgamento podem variar de disputas insignificantes e mal-entendidos a catástrofes em todo o reino. A maioria dos problemas terá uma solução que é benéfica - se não para as partes envolvidas, pelo menos para o senhor feudal."
 game_concept_holding_court:0 "Mantendo Audiência"
 game_concept_house_artifact_claim:0 "Reivindicação de Artefato da Casa"
 game_concept_house_artifact_claim_desc:0 "Se você segurar um [artifact|E] por tempo suficiente, toda a sua [house|E] terá uma [artifact_claim|E] nela - uma $game_concept_house_artifact_claim$.\n\nVocê só pode agir em uma $game_concept_house_artifact_claim$ se o Artefato não estiver nas mãos de um membro de sua casa.\n\nQuando um [cadet_branch|E] é formado, todas as reivindicações de casa existentes em Artefatos mantidos pelos membros da nova casa são transferidas para a nova casa."
 game_concept_house_artifact_claims:0 "Reivindicações de Artefato da Casa"
 game_concept_inspiration:0 "Inspiração"
 game_concept_inspiration_desc:0 "Personagens inspirados são artesãos habilidosos com um [project|E] que pode se tornar realidade se você se tornar o seu [sponsor|E].\n\nVocê pode usar a decisão Comissionar Artefato para contratar tal personagem, a fim de criar um [artifact|E].[SelectLocalization( HasDlcFeature( 'royal_court' ), 'game_concept_inspiration_desc_DLC', '' )]\n\nQuando seu projeto estiver completo, o patrocinador fica com o resultado, normalmente um Artefato."
 game_concept_inspiration_desc_DLC:0 "\n\nAlém disso, Personagens Inspirados aparecem periodicamente em [royal_courts|E], especialmente aquelas com um alto [court_grandeur_level|E]."
 game_concept_inspirations:0 "Inspirações"
 game_concept_inspired:0 "Inspirado"
 game_concept_inventory_artifact:0 "Artefato do Inventário"
 game_concept_inventory_artifact_desc:0 "Os Artefatos do Inventário são [artifacts|E] que um [character|E] usa ou carrega consigo, como uma arma ou uma coroa.\n\nNão há limite para quantos Artefatos um Personagem pode ter, mas apenas aqueles equipados em um espaço do seu tipo têm algum efeito.\n\nVocê pode criar novos Artefatos de Inventário a partir de [characters|E] [inspired|E], ou a partir da Decisão de Comissionar um Artefato."
 game_concept_inventory_artifacts:0 "Artefatos do Inventário"
 game_concept_pay_homage:0 "Homenagem"
 game_concept_pay_homage_desc:0 "Uma [activity|E] em que os [vassals|E] podem formalmente exibir sua lealdade ao seu [liege|E].\n\nO homenagem pode ser feito de diversas formas e pode conceder [opinion|E], [prestige|E] e [dynasty_prestige|E] para ambas as partes."
 game_concept_personal_artifact_claim:0 "Reivindicação Pessoal de Artefato"
 game_concept_personal_artifact_claim_desc:0 "Um $game_concept_personal_artifact_claim$ é uma [artifact_claim|E] pessoal para você, em oposição a uma [house_artifact_claim|E].\n\nQuando você morre, seus filhos recebem reivindicações em todas as suas Artesfatos.\n\nVocê também obtém uma reivindicação em um Artefato se ele for roubado durante um [siege|E] ou [raid|E].\n\nAs reivindicações de Artefatos nunca são herdadas."
 game_concept_personal_artifact_claims:0 "Reivindicações Pessoais de Artefato"
 game_concept_petition_liege:0 "Petição"
 game_concept_petition_liege_desc:0 "Uma oportunidade para que os [vassals|E] solicitem ajuda ao seu [liege|E].\n\nDiversos problemas podem ser apresentados, e cabe ao [liege|E] decidir se aceita ou não."
 game_concept_project:0 "Projeto"
 game_concept_project_desc:0 "Um projeto é algo que um [character|E] [inspired|E] assume com a ajuda de um [sponsor|E] para realizar sua visão, normalmente na forma de criar um [artifact|E]."
 game_concept_reforge:0 "Reforjar"
 game_concept_reforge_artifact:0 "Reforjar Artefato"
 game_concept_reforge_artifact_desc:0 "Alguns [inventory_artifacts|E] podem ser Reforjados, tornando-se [court_artifacts|E].\n\nVocê precisa ter um [GetCourtPositionType('antiquarian_court_position').GetName()] e pagar [gold|E] para Reforjar um [artifact|E], embora Artefatos mais antigos sejam mais baratos para Reforjar.\n\nAssim como quando você [repair|E] um [artifact|E], sua [durability|E] é restaurada.\n\nApenas Armas, Armaduras, Coroas e Ornamentos podem ser Reforjados, e eles sempre se tornam Itens de Pedestal."
 game_concept_repair:0 "Reparar"
 game_concept_repair_artifact:0 "Reparar Artefato"
 game_concept_repair_artifact_desc:0 "Quando um [artifact|E] tem baixa [durability|E], você pode optar por Repará-lo.\n\nÉ necessário pagar [gold|E] para Reparar um Artefato.[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'game_concept_repair_artifact_desc_DLC', '' )]"
 game_concept_repair_artifact_desc_DLC:0 "\n\nAlternativamente, você pode escolher Reforjar o Artefato."
 game_concept_royal_court:0 "Corte Real"
 game_concept_royal_court_desc:0 "Os [rulers|E] distinguidos são famosos o suficiente para manter uma Corte Real, que oferece acesso a uma variedade de bônus e oportunidades.\n\nQuando um [ruler|E] do governo [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName] ou [GetGovernment( 'tribal_government' ).GetName] se torna [king|E] ou [emperor|E], eles ganham acesso à sua Corte Real.\n\nCada Corte Real tem um [court_grandeur_level|E], que oferece benefícios com base na fama da Corte Real e no [court_type|E] da Corte Real.\n\nPetitioners, [vassals|E] e [courtiers|E] podem aparecer na sua Corte Real, ou você pode [hold_court|E] para convidar qualquer pessoa no [realm|E] para expressar suas queixas.\n\nUma Corte Real também permite que o governante exiba [court_artifacts|E], e [guests|E] [inspired|E] podem aparecer na Corte Real, oferecendo criar novos [artifacts|E].\n\nQuando você morrer, seu [player_heir|E] herdará sua Corte Real."
 game_concept_royal_courts:0 "Cortes Reais"
 game_concept_sponsor:0 "Patrocinador"
 game_concept_sponsor_desc:0 "Um $game_concept_sponsor$ é [ruler|E] que financia o [project|E] de um [character|E] [inspired|E]."
 game_concept_sponsored:0 "Patrocinado"
 just_repair:0 "[repair|E]"
 repair_and_reforge:0 "[reforge|E] ou [repair|E]"
 repair_or_reforge_and_repair:0 "[SelectLocalization( HasDlcFeature( 'court_artifacts' ), 'repair_and_reforge', 'just_repair' )]"
