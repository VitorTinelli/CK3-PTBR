l_spanish:
 ep1_decision.0101.a:0 "[capital.GetNameNoTierNoTooltip] não é uma pousada. Sumam, sanguessugas!"
 ep1_decision.0101.b:0 "Todos aqueles que não têm um trabalho ou meu sangue, #EMP fora#!!"
 ep1_decision.0101.c:0 "Suponho que possamos colocar algumas camas nos estábulos..."
 ep1_decision.0101.desc:0 "Vadios! Preguiçosos! Inúteis!\n\nMinha corte está #EMP infestada#! de parasitas como pulgões em um jardim, alojados em cada canto disponível, roncando dia e noite e deixando seus penicos espalhados pelos corredores apertados.\n\nIsso não pode continuar. Simplesmente não temos #EMP espaço#! para todos esses estranhos vagando por aqui."
 ep1_decision.0101.t:0 "Fora com o Velho"
 ep1_decision.0111.a.greater_cgv:0 "A corte [option_1.GetPrimaryTitle.GetAdjectiveNoTooltip|U] é bastante, bastante grandiosa."
 ep1_decision.0111.a.lesser_cgv:0 "As pessoas de [option_1.GetPrimaryTitle.GetNamePossessiveNoTooltip|U] poderiam usar minha caridade."
 ep1_decision.0111.b.greater_cgv:0 "A arquitetura [option_2.GetPrimaryTitle.GetAdjectiveNoTooltip] me fascina!"
 ep1_decision.0111.b.lesser_cgv:0 "A arquitetura [option_2.GetPrimaryTitle.GetAdjectiveNoTooltip] é bruta, mas inspiradora!"
 ep1_decision.0111.c.greater_cgv:0 "Talvez uma sala de festas no estilo [option_3.GetPrimaryTitle.GetAdjectiveNoTooltip]?"
 ep1_decision.0111.c.lesser_cgv:0 "Talvez uma sala de festas [option_3.GetPrimaryTitle.GetAdjectiveNoTooltip] bruta seria uma novidade?"
 ep1_decision.0111.d.single:0 "Parece bastante #EMP alarmantemente#! estrangeiro..."
 ep1_decision.0111.d.tt:0 "Seu [gold|E] será reembolsado"
 ep1_decision.0111.d:0 "Tudo isso parece muito #EMP alarmantemente#! estrangeiro..."
 ep1_decision.0111.desc.1:0 "O único candidato provável a redecoração presente, o mais próximo e digno de nota para mim: o reino de [option_1.GetTitledFirstName]."
 ep1_decision.0111.desc.2:0 "Dois candidatos prováveis a redecoração se apresentam, aqueles mais próximos e dignos de nota para mim: os reinos de [option_1.GetTitledFirstName] e [option_2.GetTitledFirstName]."
 ep1_decision.0111.desc.3:0 "Vários candidatos prováveis a redecoração se apresentam, aqueles mais próximos e dignos de nota para mim: os reinos de [option_1.GetTitledFirstName], [option_2.GetTitledFirstName] e [option_3.GetTitledFirstName]."
 ep1_decision.0111.desc.outro:0 "\n\nSelecionar um estilo considerado mais renomado que a minha própria corte seria pessoalmente humilhante, mas me emprestaria um pouco do ar de grandeza do reino estrangeiro.\n\nPor outro lado, emular um reino menor mostraria magnanimidade e construiria minha lenda no exterior ao custo de alguma reputação em casa."
 ep1_decision.0111.desc:0 "Vários candidatos prováveis para redesenhar a decoração se apresentam, aqueles mais próximos e notáveis para mim: os reinos de [option_1.GetTitledFirstName], [option_2.GetTitledFirstName] e [option_3.GetTitledFirstName].\n\nSelecionar um estilo que é considerado mais renomado do que minha própria corte seria pessoalmente humilhante, mas me emprestaria um pouco da grandiosidade do reino estrangeiro.\n\nPor outro lado, imitar um reino menor mostraria magnanimidade e construiria minha lenda no exterior com o custo de alguma reputação em casa."
 ep1_decision.0111.t:0 "Decoração Grandiosa"
 ep1_decision.0111.toast.t:0 "[ROOT.Char.GetTitledFirstName] imitou uma das minhas salas"
 ep1_decision.0201.a:0 "[good_linguist.GetNameNoTooltip] é um renomado linguista [target_court_language.GetCourtLanguage.GetNameNoTooltip]."
 ep1_decision.0201.b:0 "[medium_linguist.GetNameNoTooltip] fará o trabalho."
 ep1_decision.0201.c:0 "[scholarly_linguist.GetNameNoTooltip] é um famoso especialista em [target_court_language.GetCourtLanguage.GetNameNoTooltip]!"
 ep1_decision.0201.d:0 "Eu sei que [cheap_linguist.GetNameNoTooltip] trabalhará praticamente de graça!"
 ep1_decision.0201.desc:0 "Finalmente, a busca por um linguista [target_court_language.GetCourtLanguage.GetName] chegou ao fim. Os candidatos foram apresentados diante de mim, cada um com sua própria expertise em línguas estrangeiras."
 ep1_decision.0201.e:0 "Pensando melhor..."
 ep1_decision.0201.t:0 "Linguistas na Corte"
 ep1_decision.0201.tt.aptitude:0 "[aptitude|E] d[Select_CString( selected_linguist.IsFemale, 'a', 'o' )] [selected_linguist.GetUINamePossessive] é [selected_linguist.GetCourtPositionAptitude( GetCourtPositionType( 'court_tutor_court_position' ) )]"
 learn_court_language_toast_title:0 "Professor de [target_court_language.GetCourtLanguage.GetName] Contratado"
