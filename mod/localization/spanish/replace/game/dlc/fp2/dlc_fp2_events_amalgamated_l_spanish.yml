 awesome_toledo_sword_desc:0 "Esta espada foi a maior obra do ferreiro [great_swordsmith.GetName] do condado de [toledo_county.GetNameNoTierNoTooltip], forjada usando técnicas secretas que [great_swordsmith.GetSheHe] levou para o túmulo. Um gênio brilhante, mas arrogante, é dito que [great_swordsmith.GetSheHe] colocou parte de sua alma na lâmina, e de fato, parece dar a seu portador uma vontade de ferro."
