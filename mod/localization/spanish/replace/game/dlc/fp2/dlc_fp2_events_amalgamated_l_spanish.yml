 fp2_cheese_artifact_desc:0 "Apesar dos rumores, este queijo não foi feito por vikings. No entanto, é extremamente bom."
 fp2_conversos_persecution_modifier:0 "Conversos Perseguidos"
 fp2_conversos_persecution_modifier_desc:0 "Apesar da conversão ao cristianismo, os judeus convertidos e seus descendentes continuam a ser perseguidos."
 fp2_correctly_facing_church:0 "Templo devidamente orientado"
 fp2_correctly_facing_church_desc:0 "O local de culto neste Condado foi girado tijolo por tijolo para garantir uma adoração adequada."
 fp2_epitaph_modifier:0 "Epitáfio Poliglota"
 fp2_every_major_different_faith_vassal_notifier:0 "Todo vassalo poderoso de uma fé não-[dyloc_powerful_vassal_faith.GetAdjective]"
 fp2_every_major_same_culture_vassal_notifier:0 "Todo vassalo poderoso da [dyloc_powerful_vassal_culture.GetNameNoTooltip] cultura"
 fp2_every_major_same_faith_vassal_notifier:0 "Todo vassalo poderoso da mesma fé [dyloc_powerful_vassal_faith.GetAdjective]"
 fp2_every_major_vassal_notifier:0 "Todo vassalo poderoso"
 fp2_flavor.0001.a:0 "O ouro soltará a língua de [rice_propagator.GetFirstNamePossessiveNoTooltip]."
 fp2_flavor.0001.b.failure:0 "[rice_propagator.GetFirstNameNoTooltip] está insultado."
 fp2_flavor.0001.b.success:0 "Você convence [rice_propagator.GetSheHe] com sucesso."
 fp2_flavor.0001.b:0 "Certamente [rice_propagator.GetSheHe] compartilharia com um amigo?"
 fp2_flavor.0001.c.failure:0 "[rice_propagator.GetFirstNameNoTooltip] está furioso."
 fp2_flavor.0001.c.success:0 "Seu agente rouba o segredo."
 fp2_flavor.0001.c:0 "O segredo será meu... enviar um agente."
 fp2_flavor.0001.d:0 "Esqueça, eu não lidarei com muçulmanos."
 fp2_flavor.0001.desc:0 "A capital de [rice_propagator.GetTitledFirstNamePossessive] é verdadeiramente próspera. Os camponeses de [rice_propagator_capital.GetNameNoTier] estão gordos e felizes – e produtivos!#!\n\nOs muçulmanos trouxeram uma nova safra para suas terras, o arroz. É fácil de cultivar e alimenta bem o povo. Será que isso faz parte do seu sucesso, eu me pergunto? Eu não me importaria de ter camponeses mais produtivos em minha própria terra...\n\nTalvez eu devesse estabelecer campos de arroz em minha própria capital? Mas como devo começar?"
 fp2_flavor.0001.t:0 "Uma safra de novas ideias"
 fp2_flavor.3001.a:0 "Usaremos a língua [SCOPE.Custom('IberiaSacredLanguage')]."
 fp2_flavor.3001.b:0 "Essa não é a língua que todos nós falamos. Vou usar [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]."
 fp2_flavor.3001.c:0 "Não farei distinções. É [SCOPE.Custom('IberiaSacredLanguage')] e [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]."
 fp2_flavor.3001.d:0 "Não somos os únicos que vivem aqui."
 fp2_flavor.3001.desc:0 "O vento parece mais frio e os dias mais escuros, mais curtos, mais silenciosos. O trono parece o mesmo do dia em que sentei nele pela primeira vez. O trono sempre parecerá o mesmo. Mas eu não.\n\nÉ hora de me preparar para o inevitável, e vou encomendar um epitáfio antes de partir, para que eu possa partir em paz."
 fp2_flavor.3001.t:0 "Enquanto Morro"
 fp2_flavor.3011.a:0 "E há apenas uma cama."
 fp2_flavor.3011.b:0 "Vou encontrar um alojamento digno de você!"
 fp2_flavor.3011.c:0 "Estou tão sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] quanto quero estar."
 fp2_flavor.3011.c_spouse:0 "Eu tenho um cônjuge!"
 fp2_flavor.3011.desc:0 "[Select_CString( fp2_flavor_3011_best_friend.IsFemale, 'Minha melhor amiga', 'Meu melhor amigo' )] [fp2_flavor_3011_best_friend.GetFirstName] não precisa anunciar [fp2_flavor_3011_best_friend.GetHerselfHimself] antes de entrar no meu [ROOT.Char.Custom('GetChamber')]. Ah, seu sorriso jubiloso nunca deixará de me alegrar. Mas... há algo diferente sobre [fp2_flavor_3011_best_friend.GetSheHe] hoje; [fp2_flavor_3011_best_friend.GetHerHis] cabelo está perfeitamente arrumado e suas roupas são tão opulentas quanto elegantes.\n\n\"[ROOT.Char.GetFirstNameNoTooltip], [Select_CString( ROOT.Char.IsFemale, 'minha querida amiga', 'meu querido amigo' )]! Um [ROOT.Char.Custom('ResidenceBuilding')] inteiro... e você está aqui sozinh[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]! Não há nada que eu aprecie mais do que sua preciosa companhia e se eu pudesse — oh, meu Deus, se eu pudesse! — eu passaria todos os meus dias e noites com você neste exato [ROOT.Char.Custom('GetRoom')].\""
 fp2_flavor.3011.t:0 "Uma Jogada Inesperada"
 fp2_flavor.3021.a:0 "Tão agradável quanto pode ser!"
 fp2_flavor.3021.b.fail:0 "Uma Conversa Constrangedora"
 fp2_flavor.3021.b.success:0 "Uma Conversa de Sucesso"
 fp2_flavor.3021.b.success_tt:0 "[fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] entenderá suas preocupações"
 fp2_flavor.3021.b:0 "S-sim, [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip]... E-eu, olha, esta noite é—"
 fp2_flavor.3021.c:0 "[fp2_flavor_3021_best_friend.GetSheHe|U] deve saber a verdade."
 fp2_flavor.3021.d:0 "Infelizmente, é hora de partir."
 fp2_flavor.3021.desc:0 "Quando meu querido amigo [fp2_flavor_3021_best_friend.GetFirstName] me convidou para esta noite, eu não esperava que preferiria comer couro molhado em uma caverna.\n\nEu viro a cabeça quando um dos convidados expõe suas feridas infectadas: \"Esta aqui eu ganhei enquanto estava no banheiro!\"\n\n\"Tão agradável esta noite, não é?,\" [fp2_flavor_3021_best_friend.GetFirstNameNoTooltip] se aproxima de mim, copo na mão, seu sorriso ruborizado não pode ser manchado nem pela atmosfera miserável, nem pela conversa miserável e nem pela comida miserável."
 fp2_flavor.3021.t:0 "Uma Noite Sem Graça"
 fp2_flavor.8001_vassal_opinion:0 "Vassalos que são protetores de seus privilégios não vão gostar disso"
 fp2_hawk_of_quraysh_diplomacy_modifier:0 "Inspiração Diplomática"
 fp2_hawk_of_quraysh_diplomacy_modifier_desc:0 "Este personagem ganhou inspiração diplomática do Falcão de Quraysh."
 fp2_hawk_of_quraysh_martial_modifier:0 "Inspiração Marcial"
 fp2_hawk_of_quraysh_martial_modifier_desc:0 "Este personagem ganhou inspiração marcial do Falcão de Quraysh."
 fp2_james.0001.a:0 "Se eles não são [ROOT.Char.GetFaith.GetReligion.GetAdjective], eles não são bem-vindos!"
 fp2_james.0001.b:0 "Talvez [fp2_james_0001_jewish_trader.GetSheHe] deva ser o senhor de [fp2_james_0001_thriving_community.GetNameNoTooltip]!"
 fp2_james.0001.c:0 "Que ótimo desenvolvimento!"
 fp2_james.0001.desc:0 "A expansão dos portos comerciais em [fp2_james_0001_thriving_community.GetNameNoTier] tornou-se um centro próspero para o povo judeu em toda a Ibéria!\n\nUm membro de uma importante família de comerciantes judeus de [fp2_james_0001_jewish_trader.GetCulture.GetName] tem trazido cada vez mais de seu povo.\n\nEm breve, será o coração da vasta rede de comércio judaico em toda a Ibéria."
 fp2_james.0001.t:0 "Comunidade [fp2_james_0001_jewish_trader.GetFaith.GetAdherentNameNoTooltip] em [fp2_james_0001_thriving_community.GetNameNoTierNoTooltip]"
 fp2_james.0002.a.jewish_communities_thrive:0 "Comunidades judaicas prosperam!"
 fp2_james.0002.a.nothing_happened_toast:0 "Os Conversos são verdadeiros cristãos"
 fp2_james.0002.a.offended_conversos:0 "Os Conversos estão ofendidos"
 fp2_james.0002.a.tt:0 "Permita que [fp2_james_0002_conversos_character.GetNameNoTooltip] faça o que [fp2_james_0002_conversos_character.GetSheHe] quiser"
 fp2_james.0002.a:0 "Não me importa de qualquer maneira."
 fp2_james.0002.b.failed_interrogation:0 "A interrogatório é um desastre"
 fp2_james.0002.b.succesful_interrogation:0 "A interrogatório é bem sucedido"
 fp2_james.0002.b:0 "Devo interrogar este herege."
 fp2_james.0002.c:0 "Verdadeiro ou não, [fp2_james_0002_conversos_character.GetSheHe] apodrecerá em minhas masmorras!"
 fp2_james.0002.desc:0 "Um número de assim chamados [fp2_james_0002_conversos_character.GetFaith.GetAdherentNamePlural] foram instruídos por seus antigos [fp2_james_0002_jewish_faith.PriestNeuterPlural] a professar a conversão à verdadeira fé. Mas, eles continuaram a praticar [fp2_james_0002_jewish_faith.GetName] em segredo!\n\nSe verdadeiro, isso minaria todos os esforços de conversão das comunidades judaicas na Ibéria para o cristianismo.\n\nUm de seus líderes, [fp2_james_0002_conversos_character.GetName], é suspeito de promover ensinamentos judaicos."
 fp2_james.0002.t:0 "Falsa Conversão"
 fp2_james.0003.a:0 "[fp2_james_0003_province_to_convert.GetNameNoTooltip] poderia se beneficiar com alguns colonos."
 fp2_james.0003.b:0 "[fp2_james_003_jewish_refugee_leader.GetSheHe|U] terá que procurar outro lugar."
 fp2_james.0003.desc:0 "[fp2_james_003_jewish_refugee_leader.GetName] fugiu de [fp2_james_003_intolerant_ruler.GetPrimaryTitle.GetNameNoTier] junto com uma grande quantidade de seus colegas [fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNamePluralNoTooltip].\n\n[fp2_james_003_jewish_refugee_leader.GetSheHe|U] vem me suplicar por um lar para seu povo e irá prontamente prestar juramento de fidelidade à coroa [fp2_james_003_jewish_refugee_leader.GetPrimaryTitle.GetAdjective] em troca de proteção contra a perseguição."
 fp2_james.0003.t:0 "[fp2_james_003_jewish_refugee_leader.GetFaith.GetAdherentNamePlural] Refugiados"
 fp2_james.0004.a:0 "Mal posso esperar para ouvir seus gritos."
 fp2_james.0004.b:0 "Eu não sou um monstro #EMP total#!."
 fp2_james.0004.desc:0 "[fp2_james_0004_place_of_murder.GetName] é um lugar indisciplinado de crenças e governanças diversas. Cada comunidade diferente tem seus líderes, resultando em uma teia complexa de hierarquia e liderança que simplesmente não pode continuar. Se todos orassem para [ROOT.Char.GetFaith.HighGodName] da maneira correta e respondessem ao mesmo líder, isso aumentaria minha influência.\n\n[fp2_james_0004_murder_baron.GetName] se apresentou, visando tornar-se o novo líder de [fp2_james_0004_place_of_murder.GetTierAsNamePossessiveNoTooltip|U], e irá sediar um banquete onde [fp2_james_0004_murder_baron.GetSheHe] terá todos os líderes religiosos locais abatidos como gado."
 fp2_james.0004.t:0 "[fp2_james_0004_place_of_murder.GetAdjectiveNoTooltip] Noites"
 fp2_james.0005.a:0 "Qualquer coisa pela fé!"
 fp2_james.0005.b:0 "Você está desperdiçando meu tempo."
 fp2_james.0005.desc.christian:0 "\n\nEm seu estado anterior como mesquita, apenas o Mihrab enfrentava a direção leste em direção a Meca, mas agora, como uma igreja adequada, espera-se que todo o edifício enfrente o leste."
 fp2_james.0005.desc.intro:0 "[fp2_james_angry_priest.GetName] se aproximou de mim hoje exigindo que a [ROOT.Char.GetFaith.HouseOfWorship] recentemente convertida enfrente a direção errada!"
 fp2_james.0005.desc.muslim:0 "\n\nComo uma antiga igreja, a mesquita enfrenta o leste, impedindo a construção de um Mihrab para guiar os seguidores a enfrentar a cidade sagrada!"
 fp2_james.0005.t:0 "Ponto de vista"
 fp2_james.005.desc.outro:0 "\n\n[fp2_james_angry_priest.GetNameNoTooltip] argumenta que é praticamente impossível administrar um serviço adequado nessas condições e pede que concedamos alguns fundos para ter todo o edifício girado na direção certa."
 fp2_james_0002.b.failed_interrogation.tt:0 "Todos os condados cristãos e judeus em seu reino"
 fp2_jewish_community_denied_modifier:0 "Locais Perseguidos"
 fp2_jewish_community_denied_modifier_desc:0 "O crescimento social e econômico desta área foi sabotado por leis que discriminam minorias religiosas."
 fp2_lightning_stones_modifier:0 "Pedras Trovoadas"
 fp2_lightning_stones_poison_modifier:0 "Veneno de Pó Preto"
 fp2_one_independent_ruler_of_each_culture_notifier:0 "Um governante independente de cada [culture|E] envolvido neste [struggle|E]"
 fp2_order_of_the_hachet_modifier:0 "Não em Perigo"
 fp2_order_of_the_hachet_modifier_desc:0 "Homens e mulheres do condado defenderão igualmente."
 fp2_punished_order_of_the_hachet_modifier:0 "Forçados à Aflição"
 fp2_punished_order_of_the_hachet_modifier_desc:0 "Nesses condados, aqueles que defendem suas terras sem a aprovação de seu senhor feudal são punidos mais severamente do que seus agressores."
 fp2_respected_clergy_chess:0 "Clero Respeitado no Xadrez"
 fp2_respected_clergy_chess_desc:0 "Mudou as regras do xadrez para respeitar o clero."
