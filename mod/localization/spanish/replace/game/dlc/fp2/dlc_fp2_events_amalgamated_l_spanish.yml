 fp2_struggle.0501.a:0 "Assuma o destino!"
 fp2_struggle.0501.desc.interloper:0 "Chegou a hora de eu assumir a situação e meu destino. Vejo todas as peças dispostas no tabuleiro. Conheço o caminho a seguir e não haverá impedimentos para a Casa [ROOT.Char.GetHouse.GetNameNoTooltip].\n\n"
 fp2_struggle.0501.desc.involved:0 "Não deixarei escapar minha visão para minha terra natal. Pela [ROOT.Char.GetFaith.HighGodName], a Casa [ROOT.Char.GetHouse.GetNameNoTooltip] resistirá à tempestade e verá minha vontade cumprida.\n\n"
 fp2_struggle.0501.desc.mottocall:0 "[ROOT.Char.GetHouse.GetMotto]!"
 fp2_struggle.0501.desc:0 "A península Ibérica está em turbulência, um conflito nascido de seu passado lendário. Estrangeiros cobiçam a terra e as grandes potências muçulmanas e cristãs buscam influenciar seu povo. Mas aqueles que vivem e morrem em seu solo determinarão seu destino.\n\n"
 fp2_struggle.0501.t:0 "A $iberian_struggle$"
 fp2_struggle.0900.a:0 "Esta será uma terra de [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 fp2_struggle.0900.b:0 "O povoamento desta península será o nosso foco."
 fp2_struggle.0900.c:0 "[ROOT.Char.GetFaith.HighGodName] entregou a Ibéria aos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
 fp2_struggle.0900.desc:0 "\n\nNão há agora nenhum outro reino que possa realmente contestar a dominância [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] na Ibéria ou os padres e colonizadores que levam a palavra de [ROOT.Char.GetFaith.HighGodName] e a civilização [ROOT.Char.GetCulture.GetName] a suas aldeias.\n\nTudo o que resta é declarar esta vitória, tendo decidido como proceder com nosso domínio."
 fp2_struggle.0900.opening.andalusian:0 "A história de nosso povo é tão complexa quanto somos diversos e tão conturbada quanto somos fortes. O futuro da Ibéria será novamente decidido pelos herdeiros dos Omíadas."
 fp2_struggle.0900.opening.basque:0 "Nós, [ROOT.Char.GetCulture.GetNameNoTooltip], suportamos séculos de invasões: visigodos, gauleses, mouros... mas, com o tempo, cada um deles perdeu sua força. Hoje, o destino da Ibéria está em nossas mãos mais uma vez."
 fp2_struggle.0900.opening.iberian:0 "Por tempo demais, os povos ibéricos sofreram nas mãos dos invasores mouros; hoje restauraremos a esperança que os herdeiros legítimos de Roma perderam há séculos."
 fp2_struggle.0900.opening:0 "O caos que a Ibéria sofreu nos séculos anteriores deixou uma marca nos corações de todos os seus habitantes. Hoje começa o próximo capítulo desta península..."
 fp2_struggle.0900.t:0 "$struggle_iberia_ending_hostility_decision$"
 fp2_struggle.0901.a:0 "Isso é para o melhor."
 fp2_struggle.0901.desc:0 "\n\nAgora está claro que não haverá fim para este ciclo de derramamento de sangue se as coisas continuarem assim; esta península não suportará a unificação.\n\nDevemos nos contentar com [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], e deixar os outros potentados da Ibéria em suas próprias mãos - por enquanto..."
 fp2_struggle.0901.t:0 "$struggle_iberia_ending_compromise_decision$"
 fp2_struggle.0901.tt:0 "[THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier] tornou-se um [empire|E] [de_jure|E]"
 fp2_struggle.0902.a:0 "Enviar os arautos."
 fp2_struggle.0902.desc:0 "\n\nUma garantia juramentada de proteção, que apenas eu estou em posição de impor, garantirá que os diversos povos da região possam viver e adorar livremente.\n\nCom a vontade de [ROOT.Char.GetFaith.HighGodName], as guerras do passado permanecerão lá e os outros príncipes ibéricos verão os benefícios da coexistência."
 fp2_struggle.0902.t:0 "$struggle_iberia_ending_conciliation_decision$"
 fp2_struggle.0910.a:0 "Isto ainda não acabou."
 fp2_struggle.0910.b:0 "Muito interessante."
 fp2_struggle.0910.closing.combined:0 "[struggle_ender.GetSheHe|U] proclamou que Ibéria e [struggle_ender.GetPrimaryTitle.GetNameNoTier] são a mesma coisa, agora entregues às mãos do [struggle_ender.GetFaith.GetAdjective] [struggle_ender.GetCulture.GetName] por [struggle_ender.GetFaith.HighGodName]..."
 fp2_struggle.0910.closing.culture:0 "[struggle_ender.GetSheHe|U] proclamou que Ibéria pertence ao [struggle_ender.GetCulture.GetName], e que todos os invasores estrangeiros e povos subjugados devem aceitar essa realidade."
 fp2_struggle.0910.closing.faith:0 "[struggle_ender.GetSheHe|U] proclamou que Ibéria é uma terra [struggle_ender.GetFaith.GetAdjective], e que, com a vontade de [struggle_ender.GetFaith.HighGodName], todos os hereges e infiéis serão expulsos de seu domínio."
 fp2_struggle.0910.desc:0 "\n\n[struggle_ender.GetName], que agora controla a maioria da península, proclamou [struggle_ender.GetHerselfHimself] a vencedora final das lutas iniciadas há muito tempo pela invasão moura.\n\n"
 fp2_struggle.0910.opening.involved:0 "Embora venha de outro reino, a libertação da incerteza que assolou a região por séculos pode estar próxima..."
 fp2_struggle.0910.opening:0 "A notícia dos recentes acontecimentos na península Ibérica chegou à nossa corte, prometendo o fim dos conflitos que assolaram a região."
 fp2_struggle.0911.a:0 "Não esqueceremos o sonho de Hispania..."
 fp2_struggle.0911.desc:0 "\n\n[struggle_ender.GetTitledFirstName] renunciou oficialmente qualquer intenção de unir a península sob uma coroa comum e declarou ilegítimo qualquer um que detenha esse título.\n\nOs reinos díspares moldados por séculos de invasão e reconquista agora estão muito arraigados para serem unidos."
 fp2_struggle.0912.a:0 "Uma surpresa, para ser sincero."
 fp2_struggle.0912.desc:0 "\n\nOs arautos de [struggle_ender.GetPrimaryTitle.GetAdjectiveNoTooltip] proclamaram garantias de livre passagem e adoração para todos, impostas por [struggle_ender.GetTitledFirstName], com ampla aclamação do povo comum.\n\nMuitos ansiavam pelo fim dos derramamentos de sangue na Ibéria; talvez essa paz seja duradoura."
 fp2_struggle.1000.a:0 "Vamos espalhar um pouco de ódio... discretamente."
 fp2_struggle.1000.b:0 "Confio em você para lidar com isso."
 fp2_struggle.1000.c:0 "Não, vou tentar aliviar a tensão."
 fp2_struggle.1000.d:0 "Se eu não puder parar essa loucura, talvez um governante [minority_courtier.GetFaith.GetAdherentNameNoTooltip] possa."
 fp2_struggle.1000.desc:0 "Houve conflitos entre a população [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] e [tension_county.GetCountyData.GetFaith.GetAdjectiveNoTooltip] no [tension_county.GetName]. \"Vamos aproveitar esta oportunidade\", sugere meu [tension_councillor.GetCouncilTitle] [tension_councillor.GetFirstName], \"para recrutar bandidos para contratar entre os manifestantes [ROOT.Char.GetFaith.GetAdherentNamePlural] e violentos. E se eles continuarem seu #italic treinamento#! em seu condado natal, isso não é tão ruim assim! Na verdade, podemos realmente #italic incentivar#! isso...\" \n\n Devo deixar [tension_county.GetNameNoTierNoTooltip] queimar para alistar esses fanáticos violentos?"
 fp2_struggle.1000.t:0 "Atiçando o Fogo"
 fp2_struggle.1001.a:0 "Uma boa ideia! Vou criar tal fundo."
 fp2_struggle.1001.b.tt:0 "Sua fé não aprova mulheres com filhos fora do casamento."
 fp2_struggle.1001.b:0 "Apenas as viúvas terão meu apoio."
 fp2_struggle.1001.c.tt:0 "Você convida todas as pobres mães solteiras do seu reino a ficarem em seu [ROOT.Char.Custom('GetCourt')]."
 fp2_struggle.1001.c:0 "Elas podem vir ficar no meu [ROOT.Char.Custom('GetCourt')]! Temos comida em abundância!"
 fp2_struggle.1001.d:0 "Certamente, meus vassalos benevolentes podem ajudar a financiar isso."
 fp2_struggle.1001.desc:0 "[expectant_courtier.GetTitledFirstName] está grávida e veio ponderar sobre a situação de outras mães em nossas [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'acampamento', 'terras')] - aquelas deixadas pela recente guerra e infortúnio para cuidar de seus filhos sozinhas. 'Podemos instituir um fundo especial, meu [ROOT.Char.Custom('FormOfAddressForLiege')], para pagar mães que amamentam e não têm outro meio de apoio. Afinal, criar filhos é um trabalho tão difícil e louvável quanto outros.'"
 fp2_struggle.1001.e:0 "Sou seu [ROOT.Char.GetTitleTierName], não uma ama-de-leite!"
 fp2_struggle.1001.physician_imprisoned:0 "[great_physician.GetFirstName] está preso por [neighboring_ruler.GetName], por certos motivos"
 fp2_struggle.1001.specialdescnegative:0 "Vassalos infelizes em pagar perdem #negative_value 10#! #color_light_blue Opinião#! de você"
 fp2_struggle.1001.specialdescpositive:0 "Vassalos felizes em pagar ganham #positive_value 10#! #color_light_blue Opinião#! de você"
 fp2_struggle.1001.t:0 "Viúvas de Guerra"
 fp2_struggle.1002.a:0 "Eu poderia usar um novo médico..."
 fp2_struggle.1002.b.tt:0 "Você tenta aprender a partir de grandes obras de medicina."
 fp2_struggle.1002.b:0 "Posso comprar livros e aprender medicina sozinho."
 fp2_struggle.1002.c.tt:0 "Você compra as obras de Galeno e tenta lê-las."
 fp2_struggle.1002.c:0 "Para que eu preciso de você? Eu posso ler grego sozinho."
 fp2_struggle.1002.d:0 "Vou enviá-lo de volta para [neighboring_ruler.GetTitledFirstNameNoTooltip]... acorrentado."
 fp2_struggle.1002.desc_albucasis:0 "\"Embora minhas habilidades sejam modestas\", ele diz, \"uma vez salvei a vida de uma escrava que cortou a própria garganta, e ela só ficou com uma leve rouquidão depois. E gostaria que você mudasse alguns hábitos de higiene...\" \n\n"
 fp2_struggle.1002.desc_avenzoar:0 "\"Pratiquei medicina toda a minha vida\", ele diz, \"e escrevi um livro sobre o regime para uma vida saudável. Mas sou um inimigo jurado da superstição e dos falsos remédios vendidos por bruxas e astrólogos, então gostaria que você proibisse tais coisas...\" \n\n"
 fp2_struggle.1002.desc_early_golden_age:0 "[xenophilic_culture.GetNameNoTooltip] estudiosos recentemente fizeram grandes avanços no conhecimento médico. Mas o polímata [great_physician.GetFirstName] foi exilado da corte de [neighboring_ruler.GetTitledFirstNamePossessive] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] por causa de um #poema em itálico e um erro#!, e agora busca novo emprego. \n\n"
 fp2_struggle.1002.desc_has_no_physician:0 "Devo oferecer um lugar na minha corte para esta [great_physician.GetWomanMan]?"
 fp2_struggle.1002.desc_has_no_physician_but_is_christian:0 "Alguns cortesãos me instam a não me associar com este herege."
 fp2_struggle.1002.desc_has_physician_and_is_christian:0 "Meu atual médico, [scoped_physician.GetTitledFirstName], me insta a não substituí-lo por este herege."
 fp2_struggle.1002.desc_has_physician_but_not_christian:0 "Meu atual médico, [scoped_physician.GetTitledFirstName], me insta a não substituí-lo por este excêntrico."
 fp2_struggle.1002.desc_late_golden_age:0 "Estudiosos de [xenophilic_culture.GetNameNoTooltip] há muito tempo se dedicam ao estudo da medicina. Agora, o polímata [great_physician.GetFirstName] busca se juntar à minha corte, mas [great_physician.GetSheHe] foi recentemente exilado da corte de [neighboring_ruler.GetTitledFirstNamePossessive] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] por uma transgressão não revelada. \n\n"
 fp2_struggle.1002.desc_no_historical_physician_early:0 "\"Aprendi muito\", diz [great_physician.GetSheHe], \"a partir das obras dos Antigos. No entanto, resgatei seu conhecimento do abismo da prolixidade e posso usá-lo para seu benefício.\" \n\n"
 fp2_struggle.1002.desc_no_historical_physician_late:0 "\"Aprendi muito\", diz [great_physician.GetSheHe], \"a partir das obras de Al-Zahrawi e Ibn Sina. No entanto, melhorei suas técnicas. Posso remover cataratas e furúnculos e tratar doenças anteriormente consideradas incuráveis.\" \n\n"
 fp2_struggle.1002.desc_post_golden_age_christian:0 "Embora figuras como Averroes e Albucasis já estejam mortas há muito tempo, os médicos de [xenophilic_culture.GetNameNoTooltip] continuam preeminentes em conhecimento. Agora, o polímata [great_physician.GetFirstName] está buscando novo emprego, tendo sido exilado da corte de [neighboring_ruler.GetTitledFirstNamePossessive] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] por uma transgressão não revelada. \n\n"
 fp2_struggle.1002.desc_post_golden_age_unchristian:0 "Embora figuras como Ibn Rushd e Al-Zahrawi já estejam mortas há muito tempo, os médicos de [xenophilic_culture.GetNameNoTooltip] continuam preeminentes em conhecimento. Agora, o polímata [great_physician.GetFirstName] está buscando novo emprego, tendo sido exilado da corte de [neighboring_ruler.GetTitledFirstNamePossessive] [ROOT.GetCharacter.Custom2('RelationToMeShort', SCOPE.sC('neighboring_ruler'))] por uma transgressão não revelada. \n\n"
 fp2_struggle.1002.desc_tufail:0 "\"Estudo tanto os céus, a mente quanto as aflições da carne\", diz [great_physician.GetSheHe]. \"Mas sou um defensor dos benefícios de estudar o corpo humano #italic post mortem#!... Você poderia me fornecer oportunidades para perseguir isso?\" \n\n"
 fp2_struggle.1002.e:0 "Minha saúde está bem como está, obrigado."
 fp2_struggle.1002.f:0 "Saia, a inovação só deve vir de Deus."
 fp2_struggle.1002.physicianleaves:0 "[great_physician.GetFirstName] procura emprego em outro lugar"
 fp2_struggle.1002.t:0 "Avanços da Cultura [xenophilic_culture.GetNameNoTooltip]"
 fp2_struggle.1010.a:0 "Não, você deve trabalhar com a guilda, para o benefício de todos nós."
 fp2_struggle.1010.b:0 "Qualquer conhecimento que você possua, eu o extrairei..."
 fp2_struggle.1010.c:0 "Você terá isso, se fizer espadas para meus exércitos."
 fp2_struggle.1010.compassionate_courtiers:0 "Nem todos os seus cortesãos podem aprovar isso."
 fp2_struggle.1010.d:0 "Faça para mim a melhor lâmina da Ibéria, e a guilda será sua."
 fp2_struggle.1010.desc:0 "Uma [great_swordsmith.GetWomanMan] chamada [great_swordsmith.GetName] chegou à minha corte, afirmando ser uma mestra ferreira que viajou por terras distantes.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [great_swordsmith.GetSheHe] diz, \"minha família tem sido fabricante de espadas em [toledo_holding.GetNameNoTierNoTooltip] desde tempos antigos e já fabricou #italic falcatas#! para os exércitos de Cartago. Nenhuma liga é tão forte quanto a feita na Ibéria, e eu posso aperfeiçoá-la. Posso fazer as melhores armas do mundo, mas em troca, você deve me dar o comando da guilda de ferreiros em [blacksmith_county.GetNameNoTierNoTooltip]. Então, eles verão que eu sempre fui melhor do que todos eles!\""
 fp2_struggle.1010.e:0 "Eu não irei irritar a guilda por sua vaidade."
 fp2_struggle.1010.paranoid_rivals:0 "Armar seus soldados pode preocupar alguns governantes vizinhos."
 fp2_struggle.1010.smithgoesaway:0 "[great_swordsmith.GetNameNoTooltip] vai assumir o comando da guilda de ferreiros."
 fp2_struggle.1010.smithmakesweapon:0 "[great_swordsmith.GetNameNoTooltip] permanece em sua corte enquanto forja a espada que você solicitou."
 fp2_struggle.1010.swordsmith_imprisoned:0 "Você aprisiona e tortura [great_swordsmith.GetNameNoTooltip] para aprender seus segredos."
 fp2_struggle.1010.swordsmith_leaves:0 "[great_swordsmith.GetNameNoTooltip] vai para outra corte."
 fp2_struggle.1010.t:0 "Alma de Ferro"
 fp2_struggle.1011.a:0 "#italic Martiello#!, o martelo."
 fp2_struggle.1011.b:0 "#italic Tiniebra#!, a escuridão."
 fp2_struggle.1011.c:0 "#italic Vermejo#!, o vermelho."
 fp2_struggle.1011.d:0 "#italic Jargonça#!, como a pedra preciosa azul."
 fp2_struggle.1011.desc:0 "\"Está pronto\", diz [great_swordsmith.GetName], mas parece estranhamente cansado.\n\n\"Podem ter sido os fantasmas dos meus antepassados que me guiaram na forja, pois é a melhor lâmina que já criei. Nunca mais farei outra igual, nem ninguém neste país, pois os segredos da sua confecção levarei para o túmulo. Agora parto para reivindicar a guilda que me prometeram, embora essa vitória agora pareça estranhamente vazia. Seja como for, tens de dar um nome à espada que forjei para ti.\""
 fp2_struggle.1011.e:0 "#italic Suhayl#!, o glorioso."
 fp2_struggle.1011.f:0 "#italic al-Battar#!, o cortador."
 fp2_struggle.1011.g:0 "#italic Qazeeb#!, de cabo forte."
 fp2_struggle.1011.h:0 "#italic Zumurrud#!, como o esmeralda ofuscante."
 fp2_struggle.1011.i:0 "#italic Ortzi#!, como o trovão."
 fp2_struggle.1011.j:0 "#italic Gaueko#!, o espírito da noite."
 fp2_struggle.1011.k:0 "#italic Gorri#!, o vermelho."
 fp2_struggle.1011.l:0 "#italic Aiztoto#!, a pequena faca."
 fp2_struggle.1011.m:0 "#italic Escremire#!, o esgrimista."
 fp2_struggle.1011.n:0 "#italic Folha#!, a folha."
 fp2_struggle.1011.o:0 "#italic Proeza#!, a valentia."
 fp2_struggle.1011.p:0 "#italic Trebalhar#!, o atormentador."
 fp2_struggle.1011.q:0 "#italic Sufax#!, como o grande herói dos tempos antigos."
 fp2_struggle.1011.r:0 "#italic Toumellalt#!, o branco."
 fp2_struggle.1011.s:0 "#italic Ayugu#!, o jugo."
 fp2_struggle.1011.swordsmith_leaves:0 "Com o seu trabalho concluído, [great_swordsmith.GetName] deixa a tua corte."
 fp2_struggle.1011.t:0 "\"A Lâmina de [blacksmith_county.GetNameNoTierNoTooltip]"
 fp2_struggle.1011.u:0 "Bem, #italic Ironsoul#!, é claro."
 fp2_struggle.1011.v:0 "Eu gosto bastante de #italic Mistletoe#!..."
 fp2_struggle.1011.w:0 "#italic Moor-cleaver#, o que mais?"
 fp2_struggle.1011.x:0 "#italic Usurper's blade#! parece apropriado, dado o que fizemos às guildas..."
 fp2_struggle.1012.a:0 "É...excepcional. Você pode ir em paz."
 fp2_struggle.1012.b:0 "Magnífico. Posso convencê-lo a ficar e me servir?"
 fp2_struggle.1012.desc:0 "\"\"Está terminado\", diz [great_swordsmith.GetName].\n\n\"Esta é a espada que eu prometi a você, uma das minhas melhores obras. Sua lâmina é da liga mais fina imaginável, como só poderia ser feita na Ibéria. Ela realmente tem, como dizem, #italic uma alma de ferro#!. Uma lâmina adequada para uma [Select_CString(ROOT.Char.IsFemale,'nobre dama','grande lorde')] como você.\""
 fp2_struggle.1012.swordsmith_leaves:0 "Tendo completado o seu trabalho, [great_swordsmith.GetName] parte para comandar a guilda de ferreiros, como você prometeu."
 fp2_struggle.1012.t:0 "A Obra-prima"
 fp2_struggle.1012_swordsmith_stays:0 "[great_swordsmith.GetName] permanece em sua corte"
 fp2_struggle.1020.a:0 "Pedir absolvição da dinastia [minority_councillor.GetDynastyNameNoTooltip]."
 fp2_struggle.1020.b:0 "Fazer as pazes com o povo de [minority_councillor.GetTitledFirstNamePossessiveNoTooltip]."
 fp2_struggle.1020.c:0 "Localizar os perpetradores."
 fp2_struggle.1020.d:0 "Enviar soldados para restaurar a ordem em [unrest_capital.GetNameNoTierNoTooltip]."
 fp2_struggle.1020.t:0 "Morte de uma [Select_CString(minority_councillor.IsFemale,'Conselheira','Conselheiro')]"
 fp2_struggle.1020_desc_beaten_by_mob:0 "Enquanto [minority_councillor.GetNameNoTooltip] estava a caminho da minha [ROOT.Char.Custom('ResidenceBuilding')], a multidão desceu sobre [minority_councillor.GetSheHe] e o espancou até a morte.\n\n"
 fp2_struggle.1020_desc_burned_by_mob:0 "Na escuridão da noite, eles entraram sorrateiramente na minha [ROOT.Char.Custom('ResidenceBuilding')], amarraram [minority_councillor.GetNameNoTooltip] a um tear e o incendiaram.\n\n"
 fp2_struggle.1020_desc_councillor_had_family:0 "[minority_councillor.GetTitledFirstNamePossessiveNoTooltip] família me culpa pelo que ocorreu. [councillor_executor.Custom2('HerHisCharacterIntroduction', minority_councillor)|U] agora está diante de mim, exigindo que eu peça desculpas por esse ato terrível contra a casa de [minority_councillor.GetDynastyName]."
 fp2_struggle.1020_desc_councillor_had_no_family_faith:0 "Os [minority_councillor.GetFaith.GetAdherentNamePlural] parecem culpar #italic me #! pelo que ocorreu, e [councillor_executor.GetTitledFirstName], um líder comunitário [minority_councillor.GetFaith.GetAdherentNameNoTooltip], veio até mim para pedir que eu compense os sofredores [minority_councillor.GetFaith.GetAdherentNamePluralNoTooltip] de [unrest_capital.GetNameNoTierNoTooltip] por esse ato malicioso."
 fp2_struggle.1020_desc_crucified_by_mob:0 "[minority_councillor.GetNameNoTooltip] estava visitando um conhecido aqui em [unrest_capital.GetNameNoTierNoTooltip] quando a multidão enfurecida agarrou [minority_councillor.GetSheHe] e o pregou em uma cruz de madeira, onde [minority_councillor.GetSheHe] logo pereceu.\n\n"
 fp2_struggle.1020_desc_defenestrated_by_mob:0 "Trabalhando-se em uma frenesi impiedosa, eles conseguiram invadir minha [ROOT.Char.Custom('ResidenceBuilding')], agarrar [minority_councillor.GetNameNoTooltip] e jogá-lo de uma janela, para sua morte.\n\n"
 fp2_struggle.1020_desc_hanged_and_disemboweled_by_mob:0 "Eles agarraram [minority_councillor.GetSheHe] a caminho de uma reunião do conselho, penduraram [minority_councillor.GetSheHe] no portão do [ROOT.Char.Custom('ResidenceBuilding')] e cortaram sua barriga, deixando as entranhas caírem livremente sobre o chão úmido abaixo.\n\n"
 fp2_struggle.1020_desc_molten_silver_by_mob:0 "Trabalhando-se em uma frenesi impiedosa, eles invadiram as câmaras de [minority_councillor.GetTitledFirstNamePossessiveNoTooltip] em minha [ROOT.Char.Custom('ResidenceBuilding')], onde derreteram suas joias finas e procederam a derramar o líquido em sua garganta.\n\n"
 fp2_struggle.1020_desc_opening:0 "Que desastre! Em meio às tensões que vêm fervilhando em [unrest_capital.GetNameNoTierNoTooltip], uma multidão de [unrest_capital.GetCountyData.GetFaith.GetAdherentNamePluralNoTooltip] enfurecidos nomeou meu conselheiro [minority_councillor.GetTitledFirstName] como a causa de seu descontentamento, devido à sua crença [minority_councillor.GetFaith.GetAdherentNameNoTooltip]."
 fp2_struggle.1020_desc_torn_to_pieces_by_mob:0 "[minority_councillor.GetNameNoTooltip] estava a caminho dos banhos para minha [ROOT.Char.Custom('ResidenceBuilding')] quando a multidão enfurecida desceu sobre [minority_councillor.GetSheHe]. Dada força furiosa pelo ódio, eles rasgaram [minority_councillor.GetSheHe] em pedaços com suas próprias mãos.\n\n"
 fp2_struggle.1050.a:0 "Você é uma bruxa?"
 fp2_struggle.1050.b:0 "Reúna-se, [ROOT.GetCharacter.GetFaith.HighGodName] está testando sua fé."
 fp2_struggle.1050.c:0 "Venha, me conte mais sobre suas visões."
 fp2_struggle.1050.condition_might_get_very_worse:0 "Condição de [visionary_spouse.GetTitledFirstNamePossessiveNoTooltip] pode piorar muito"
 fp2_struggle.1050.condition_might_get_worse:0 "Condição de [visionary_spouse.GetTitledFirstNamePossessiveNoTooltip] pode piorar"
 fp2_struggle.1050.condition_might_improve:0 "A condição de [visionary_spouse.GetTitledFirstNamePossessiveNoTooltip] pode melhorar"
 fp2_struggle.1050.d:0 "Deixe-me em paz, estou planejando minha próxima conquista."
 fp2_struggle.1050.desc_christian:0 "Nossas cidades foram arrasadas, nossas torres de igreja derrubadas, nosso povo pisoteado num lodaçal de seu próprio sangue."
 fp2_struggle.1050.desc_christian_bling_reference_drop:0 "As relíquias de nossos santos foram lançadas em um fogo ardente.\"\n\n"
 fp2_struggle.1050.desc_islamic:0 "Nossas bibliotecas foram queimadas, nossos minaretes caídos, nossos irmãos e irmãs pregados em cruzes, atacados por aves de rapina."
 fp2_struggle.1050.desc_islamic_heritage:0 "Eu vi a completa destruição de tudo o que construímos desde que nossos ancestrais chegaram a esta terra.\"\n\n"
 fp2_struggle.1050.desc_love_and_warmth_ending:0 "\"Por favor, meu amor, me ajude. Estou tão assustado que meus sonhos sejam verdadeiros, que essas coisas aconteçam. Me abrace, sinto tanto frio.\""
 fp2_struggle.1050.desc_middle_neutral_version:0 "Tudo o que construímos foi destruído, e a morte e a desesperança reinaram sobre a terra.\"\n\n"
 fp2_struggle.1050.desc_no_love_and_warmth_ending:0 "\"Querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetWifeHusband], por favor ouça. Não é uma doença comum que me aflige. Eu temo que meus sonhos sejam verdadeiros, que essas coisas possam acontecer. Por favor, não permita. Você deve salvar a Ibéria.\""
 fp2_struggle.1050.desc_non_barbarian_heathen:0 "Nossas cidades foram arrasadas, nossos templos queimados, nosso povo morto ou levado embora para um destino desconhecido."
 fp2_struggle.1050.desc_opening:0 "[visionary_spouse.GetTitledFirstName] vem até mim na escuridão da noite, febril e pálido. \"Eu tive sonhos\", diz [visionary_spouse.GetSheHe], \"onde me encontro em um campo de morte."
 fp2_struggle.1050.desc_rampaging_barbarian_heathen:0 "Nossas casas foram queimadas, nossas pedras rúnicas derrubadas, nossos guerreiros mortos sem honra ou glória."
 fp2_struggle.1050.spouse_imprisoned:0 "Você aprisiona [visionary_spouse.GetTitledFirstNameNoTooltip] por suspeita de bruxaria"
 fp2_struggle.1050.t:0 "Sonhos de Destruição"
 fp2_struggle.2000.a.a.notif:0 "Burocracia crescente"
 fp2_struggle.2000.a.a:0 "Os comerciantes obedecem suas palavras, mas permanecem convencidos"
 fp2_struggle.2000.a.b.notif:0 "Compromisso agradável"
 fp2_struggle.2000.a.b:0 "Você resolve a situação de maneira civil"
 fp2_struggle.2000.a.desc:0 "Muḥtasib corrige o caminho dos comerciantes desorientados,\nqāḍī os pune de acordo com seu julgamento"
 fp2_struggle.2000.a:0 "Intervir na questão e ameaçar chamar um qāḍī."
 fp2_struggle.2000.b.desc:0 "Eu tomo para mim a punição física do comerciante"
 fp2_struggle.2000.b.notif.desc:0 "Chocados ao ver um muḥtasib sendo repreendido, os comerciantes rapidamente desocuparam o mercado."
 fp2_struggle.2000.b.notif:0 "Demonstração de Diligência"
 fp2_struggle.2000.b:0 "Dê a todos uma repreensão severa!"
 fp2_struggle.2000.d.desc:0 "Permitir o comércio sem se preocupar com os costumes aumentará o comércio, mas gradualmente desestabilizará o mercado."
 fp2_struggle.2000.d:0 "Por que as regras deveriam atrapalhar os negócios?"
 fp2_struggle.2000.desc:0 "Enquanto eu percorria as ruas do mercado, encontro um muḥtasib aflito, [fp2_2000_market_inspector.GetFullName], tentando fazer valer as regulamentações do mercado entre os vendedores. “Disposições desordenadas, óleo ao lado das portas da mesquita, coelhos não descamados e queijo em tigelas! Por Allah, todos vocês devem me ouvir agora!\"\n\nEste muḥtasib #ênfase deve#! punir transgressões de mercado, com violência se necessário. No entanto, [fp2_2000_market_inspector.GetSheHe] está sendo ignorado pelos comerciantes cegos pela ganância.\n\nO que posso fazer para ajudar [fp2_2000_market_inspector.GetSheHe]?"
 fp2_struggle.2000.e:0 "Eu não vou tolerar essa desobediência! Guardas!"
 fp2_struggle.2000.f.desc:0 "Você encoraja os comerciantes a violar ainda mais a ḥisba, tentando aliviar as tensões"
 fp2_struggle.2000.f.notif.desc:0 "As violações de mercado aumentaram agora que o muḥtasib deixou de fazer cumprir as regulamentações."
 fp2_struggle.2000.f.notif:0 "Leniência com comerciantes estrangeiros"
 fp2_struggle.2000.f:0 "Já que estamos nisso, por que não construímos também um bordel?"
 fp2_struggle.2000.t:0 "Mercado Desorganizado"
 fp2_struggle.2001.a.a.desc:0 "[2001_scoped_chaplain.GetTitledFirstName] ficará muito desapontado se você falhar."
 fp2_struggle.2001.a.desc:0 "Você deve capturar [fp2_2001_desperate_county.GetNameNoTier] em #bold cinco anos#!"
 fp2_struggle.2001.a.notif:0 "Reivindicação justa concedida"
 fp2_struggle.2001.a:0 "Você tem minha palavra, [fp2_2001_desperate_county.GetNameNoTierNoTooltip] será libertada!"
 fp2_struggle.2001.b.desc:0 "Você deve capturar [fp2_2001_desperate_county.GetNameNoTier] em #bold dez anos#!"
 fp2_struggle.2001.b.notif.desc:0 "Seja por escolha ou por desespero, a vila de [fp2_2001_desperate_county.GetNameNoTier] adotou o [ROOT.Char.GetFaith.GetName]."
 fp2_struggle.2001.b.notif:0 "[fp2_2001_desperate_county.GetNameNoTierNoTooltip] se converte ao [ROOT.Char.GetFaith.GetNameNoTooltip]"
 fp2_struggle.2001.b:0 "Você está disposto a abandonar [fp2_2001_desperate_elder.GetFaith.HighGodName] por isso?"
 fp2_struggle.2001.c:0 "Prove sua resolução para mim; aponte suas lanças para [fp2_2001_desperate_county.GetHolder.GetFirstNameNoTooltip]!"
 fp2_struggle.2001.d.notif.desc:0 "Os camponeses do [fp2_2001_desperate_county.GetName] juntaram todos os bens valiosos que tinham para pagar a taxa de libertação."
 fp2_struggle.2001.d.notif:0 "Camponeses desesperados pagam taxa de libertação"
 fp2_struggle.2001.d:0 "Talvez você possa começar pagando tributo à [Select_CString( ROOT.Char.IsFemale, 'sua nova', 'seu novo' )] [ROOT.Char.GetLadyLord]..."
 fp2_struggle.2001.desc.extra.a:0 "O [fp2_2001_desperate_county.GetName] pertence ao seu aliado, [fp2_2001_desperate_county.GetHolder.GetName]. Fornecer apoio militar aos rebeldes seria um ato de agressão.\n\n"
 fp2_struggle.2001.desc.extra.b:0 "[fp2_2001_desperate_county.GetHolder.GetName], que é dono do [fp2_2001_desperate_county.GetName], possui um acordo de trégua com você. Ajudar os camponeses seria uma violação desse acordo."
 fp2_struggle.2001.desc:0 "Enquanto eu passeio pelos meus terrenos do [ROOT.GetCharacter.Custom('FortifiedBuilding')], um ancião camponês se aproxima de mim.\n\n\"Grande [ROOT.Char.GetLadyLord], por favor, tenha misericórdia de nós e salve nossa vila da tirania de [fp2_2001_desperate_county.GetHolder.GetName]\". [fp2_2001_desperate_county.GetHolder.GetSheHe|U] tem negligenciado nosso assentamento por tempo demais. As pessoas anseiam por um novo governante; elas anseiam por você, [ROOT.Char.GetLadyLord].\""
 fp2_struggle.2001.e.desc:0 "Você abandona os camponeses ao seu destino sob o domínio de [fp2_2001_desperate_county.GetHolder.GetName]."
 fp2_struggle.2001.e:0 "Desculpe-me, mas seu povo terá que se ajudar."
 fp2_struggle.2001.f:0 "Eu apoio o [fp2_2001_desperate_county.GetHolder.GetTitleAsNameNoTooltip] e informarei [fp2_2001_desperate_county.GetHolder.GetSheHe] sobre sua traição!"
 fp2_struggle.2001.t:0 "A Aldeia Abandonada"
 fp2_struggle.2002.t.a:0 "Vila Liberada"
 fp2_struggle.2002.t.b:0 "Obrigações não cumpridas"
 fp2_struggle.2003.a.a.notif:0 "Bandidos ignoram súplicas"
 fp2_struggle.2003.a.b.notif:0 "Resolução pacífica"
 fp2_struggle.2003.a:0 "Implorar para que partam."
 fp2_struggle.2003.b.desc:0 "A guarnição poderia usar tropas veteranas, e alimentar uma fera ferida é a maneira mais rápida de domesticá-la."
 fp2_struggle.2003.b:0 "Oferecer-lhes uma posição na guarnição da cidade."
 fp2_struggle.2003.c.a:0 "Os mercenários matam os soldados"
 fp2_struggle.2003.c.b.notif:0 "Ameaça dos mercenários contida"
 fp2_struggle.2003.c.b:0 "Os soldados subjuguam os mercenários"
 fp2_struggle.2003.c.desc:0 "Você organiza um ataque preventivo, usando a guarnição local em um ataque surpresa para expulsar os vândalos\n"
 fp2_struggle.2003.c:0 "Forçá-los a sair da cidade!"
 fp2_struggle.2003.d.desc:0 "Você oferece comprar terras e equipamentos dos locais e dar para os mercenários."
 fp2_struggle.2003.d:0 "\"Vocês todos parecem bons materiais de fazenda para mim!\""
 fp2_struggle.2003.desc:0 "Um grupo de mercenários feridos e desiludidos chegou à [fp2_2003_county_town.GetName]. Os moradores afirmam ter ouvido falar de 'se estabelecer após saquear um alvo fácil' e começaram a ficar ansiosos.\n\nAs tensões estão altas e conflitos provavelmente surgirão se eu não intervir no assunto."
 fp2_struggle.2003.e.desc:0 "As tensões já estão altas o suficiente, provocá-los só traria maiores riscos."
 fp2_struggle.2003.e.notif.a:0 "Mercenários saqueiam o campo."
 fp2_struggle.2003.e.notif.b.desc:0 "Os locais exigiram que os mercenários saíssem, mas isso foi suficiente para provocá-los a atacar."
 fp2_struggle.2003.e.notif.b:0 "Provocação de camponeses termina em tragédia."
 fp2_struggle.2003.e.notif.c.desc:0 "Os mercenários tomaram gosto pela [fp2_2003_county_town.GetName]."
 fp2_struggle.2003.e.notif.c:0 "Mercenários se estabelecem."
 fp2_struggle.2003.e:0 "Deixe os locais lidarem com isso."
 fp2_struggle.2003.t:0 "Bando dos Pássaros Perdidos"
 fp2_struggle.2004.a.a.desc:0 "Novos projetos de navios são criados"
 fp2_struggle.2004.a.b.desc:0 "Os construtores navais de [fp2_2004_dockyards.GetNameNoTierNoTooltip] tornam-se artesãos renomados"
 fp2_struggle.2004.a:0 "Considere patrocinar o empreendimento"
 fp2_struggle.2004.b.desc:0 "Você rejeita os esforços de [2004_scoped_steward.GetFirstNameNoTooltip] e mantém os fundos"
 fp2_struggle.2004.b:0 "Esses fundos podem ser utilizados de forma melhor em outro lugar"
 fp2_struggle.2004.c.desc:0 "Você aposta seus fundos em uma oportunidade de renome excepcional, reunindo os melhores artesãos para construir o impossível — um navio de prata pura."
 fp2_struggle.2004.c:0 "Eu não quero um novo projeto de navio, eu quero um navio de prata pura!"
 fp2_struggle.2004.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2004_scoped_steward'))], [2004_scoped_steward.GetFirstName], informa-me que os seus cronistas retornaram de navegar e estudar as tecnologias navais pelo mar. [2004_scoped_steward.GetSheHe|U] diz que, com financiamento, poderíamos ter um novo navio projetado que superaria nossos vizinhos e inauguraria uma era de supremacia marítima para [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\nPor outro lado, meu [2004_scoped_marshal.GetCouncilTitleFirstName] prefere gastar esse ouro em coisas diferentes de navios comerciais."
 fp2_struggle.2004.t:0 "Uma Grande Armada"
 fp2_struggle.2005.a.a:0 "Pena sobre os estaleiros, mas pelo menos temos os navios."
 fp2_struggle.2005.a:0 "Você fez bem."
 fp2_struggle.2005.desc.alt.a.desc:0 "Ciente de como estas notícias serão desanimadoras, meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2005_scoped_steward'))], [2005_scoped_steward.GetFirstName], aproxima-se cautelosamente para transmitir o resultado de nossa tentativa de fazer prata flutuar.\n\n\"Apesar de nossos melhores esforços, a ideia de construir um barco de metal é uma loucura. Após sua conclusão, o navio deixou o porto e afundou rapidamente no abismo do oceano. Uma parte significativa de nosso tesouro agora jaz inacessível sob as ondas cruéis. Sinto muito, meu senhor.\"\n\n"
 fp2_struggle.2005.desc.alt.a:0 "Prata afundada"
 fp2_struggle.2005.desc.alt.b.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('2005_scoped_steward'))], [2005_scoped_steward.GetFirstName], sabia que isso era apenas um truque para mostrar, algo para ganhar reputação. Barcos feitos de metal nunca vão flutuar, não importa o quanto a tecnologia avance.\n\nPortanto, em vez de levar a tarefa a sério e tentar o impossível, [2005_scoped_steward.GetSheHe] revestiu uma embarcação de madeira com uma fina camada de prata para enganar os espectadores. Eu e meu novo \"navio metálico\" somos o assunto da cidade e a inveja do mundo!\n\n"
 fp2_struggle.2005.desc.alt.b:0 "Embarcações de prata"
 fp2_struggle.2005.desc.bottom.a:0 "$fp2_struggle.2005.desc.bottom.generic$ uma quilha de fundo plano, que permite uma navegação estável em águas calmas. "
 fp2_struggle.2005.desc.bottom.b:0 "$fp2_struggle.2005.desc.bottom.generic$ uma antepara à prova d'água projetada para evitar o naufrágio em caso de danos. "
 fp2_struggle.2005.desc.bottom.c:0 "$fp2_struggle.2005.desc.bottom.generic$ uma quilha afiada e profunda, capaz de cortar ondas em alta velocidade! "
 fp2_struggle.2005.desc.bottom.d:0 "$fp2_struggle.2005.desc.bottom.generic$ costelas em sobreposição, tornando o casco simultaneamente mais resistente e mais leve. "
 fp2_struggle.2005.desc.bottom.generic:0 "O fundo do navio utiliza"
 fp2_struggle.2005.desc.cirt.a.notif:0 "Infelizmente, desde o início da construção, os [fp2_2004_dockyards.GetName] caíram nas mãos de [fp2_2004_dockyards.GetHolder.GetName]. Conseguimos manter os projetos dos navios, mas os estaleiros agora são deles.\n\n"
 fp2_struggle.2005.desc.cirt.notif:0 "Os novos designs são um sucesso excepcional! Na verdade, um novo estaleiro foi criado em [fp2_2004_dockyards.GetNameNoTier] apenas para produzir esses novos navios de última geração.\n\n"
 fp2_struggle.2005.desc.intro:0 "\"Meu senhor feudal, finalmente nossos navios estão prontos para navegar!\" diz [2005_scoped_steward.GetFirstName]. \"Acredito que você ficará muito satisfeito com o design.\"\n\n"
 fp2_struggle.2005.desc.newdesigner.notif:0 "O designer original, [2004_scoped_steward.GetFirstName], não está mais conosco, mas [2005_scoped_steward.GetFirstNameNicknamed] foi capaz de assumir as rédeas e concluir o projeto sem [2004_scoped_steward.GetSheHe].\n\n"
 fp2_struggle.2005.desc.outro.crit:0 "\n\n\"Isto certamente trará para nós uma era de supremacia naval!\" Proclama orgulhosamente [2005_scoped_steward.GetFirstNameNicknamed]."
 fp2_struggle.2005.desc.outro:0 "\n\n\"Mais impressionante, não acha?\" Diz [2005_scoped_steward.GetFirstNameNicknamed]."
 fp2_struggle.2005.desc.sails.a:0 "$fp2_struggle.2005.desc.sails.init$ grandes velas quadradas empilháveis aproveitando a brisa do mar."
 fp2_struggle.2005.desc.sails.b:0 "$fp2_struggle.2005.desc.sails.init$ velas enormes e sobrepostas dignas das embarcações mais poderosas."
 fp2_struggle.2005.desc.sails.c:0 "$fp2_struggle.2005.desc.sails.init$ velas complexas de proa e popa para a maior manobrabilidade."
 fp2_struggle.2005.desc.sails.d:0 "$fp2_struggle.2005.desc.sails.init$ muitas grandes fileiras de remos. Tornando a embarcação tão firme quanto a vontade dos que a tripulam."
 fp2_struggle.2005.desc.sails.init:0 "Finalmente, o navio usa"
 fp2_struggle.2005.desc.unique.a:0 "$fp2_struggle.2005.desc.unique.init$ grande duplo suporte externo, fornecendo uma estabilidade incomparável. "
 fp2_struggle.2005.desc.unique.b:0 "$fp2_struggle.2005.desc.unique.init$ conjunto de bastiões de madeira elevados em cada extremidade do casco, permitindo que os arqueiros chovam flechas sobre o inimigo. "
 fp2_struggle.2005.desc.unique.c:0 "$fp2_struggle.2005.desc.unique.init$ imponente edifício em forma de castelo no convés. "
 fp2_struggle.2005.desc.unique.d:0 "$fp2_struggle.2005.desc.unique.init$ telhado de madeira coberto de pontas para impedir o abordagem. "
 fp2_struggle.2005.desc.unique.e:0 "$fp2_struggle.2005.desc.unique.init$ ariete na frente, para perfurar os navios inimigos em um encontro direto. "
 fp2_struggle.2005.desc.unique.init:0 "Em seguida, acima dela encontra-se a peça mais única, sua"
 fp2_struggle.2005.desc:0 "Os novos navios apresentam o seguinte design:"
 fp2_struggle.2005.t.alt:0 "Mestres Artesãos de [fp2_2004_dockyards.GetNameNoTier]"
 fp2_struggle.2005.t:0 "Uma Armada à Frente do Tempo"
 fp2_struggle.2006.a.a:0 "[fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip] permanece em dúvida"
 fp2_struggle.2006.a.b:0 "[fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip] se sente ameaçado pela presença de [2006_scoped_chaplain.GetTitledFirstNameNoTooltip]"
 fp2_struggle.2006.a.c:0 "[2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip] tranquiliza a fé de [fp2_2006_vassal_in_crisis.GetTitledFirstNameNoTooltip]"
 fp2_struggle.2006.a.desc:0 "Você convoca [2006_scoped_chaplain.GetCouncilTitleFirstNameNoTooltip] para resolver a situação. [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] se sentirá traído porque você contou a outros sobre as dificuldades [fp2_2006_vassal_in_crisis.GetHerHim]."
 fp2_struggle.2006.a:0 "\"Alguém chame um padre!\""
 fp2_struggle.2006.b.a.desc:0 "[fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] resiste à tentativa"
 fp2_struggle.2006.b.b.desc:0 "Você tranquiliza a fidelidade de [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip]"
 fp2_struggle.2006.b:0 "Eu mesmo vou reacender o seu fervor."
 fp2_struggle.2006.c.desc:0 "Você permite que [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] escolha uma fé por conta própria."
 fp2_struggle.2006.c.notif.t:0 "Liberdade de Amizade"
 fp2_struggle.2006.c:0 "\"Escolha qualquer fé, desde que você #emphasis sirva#! #BER a mim#!.\""
 fp2_struggle.2006.d.notif.t:0 "Combatendo a Dúvida com Medo"
 fp2_struggle.2006.d:0 "Ameaçar denunciar [fp2_2006_vassal_in_crisis.GetSheHe] como herege."
 fp2_struggle.2006.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('fp2_2006_vassal_in_crisis'))] [fp2_2006_vassal_in_crisis.GetTitledFirstName] se aproxima de mim em particular, com clara dúvida em seus olhos.\n\n[fp2_2006_vassal_in_crisis.GetSheHe|U] me explica que sua fé está falhando devido ao tempo que passou guardando a fronteira contra [fp2_2006_foreign_faith.GetNameNoTooltip] e se relacionando com o inimigo. As palavras [fp2_2006_vassal_in_crisis.GetHerHim|U] não são uma piada. Parece que o menor erro poderia afastar [fp2_2006_vassal_in_crisis.GetSheHe] de [ROOT.Char.GetFaith.HighGodName].\n\nNo entanto, esta é uma oportunidade para fortalecer nosso fervor e também nosso relacionamento."
 fp2_struggle.2006.e.alreadywitch:0 "[fp2_2006_vassal_in_crisis.GetFirstName] já era uma bruxa! Não era uma crise de fé. [fp2_2006_vassal_in_crisis.GetFirstNameNoTooltip] apenas precisava de um amigo que pudesse entendê-la(o)."
 fp2_struggle.2006.e.notif.t:0 "Conjuradores Cordiais"
 fp2_struggle.2006.e.tacticalwitchfaithchange:0 "Converte-se para [fp2_2006_foreign_faith.GetName] para evitar perseguição"
 fp2_struggle.2006.e:0 "\"Esqueça questões de fé, #ênfase abrace a bruxaria!#!\""
 fp2_struggle.2006.generic.notif.a.t:0 "Vassalo Abraça [fp2_2006_foreign_faith.GetNameNoTooltip]"
 fp2_struggle.2006.generic.notif.b.t:0 "Vassalo Permanece Fiel"
 fp2_struggle.2006.t:0 "As Fronteiras da Fé"
 fp2_struggle.2007.a.castile.favor:0 "Ninguém se oporá a um [fp2_2007_allegedprotocastilean.GetNameNoTooltip] porque eles são conhecidos por serem arquitetos exemplares."
 fp2_struggle.2007.a.castile:0 "[ROOT.Char.GetFaith.GetAdjectiveNoTooltip]s? [fp2_2007_foreign_faith.GetAdjectiveNoTooltip]s? Eu quero um arquiteto [fp2_2007_allegedprotocastilean.GetNameNoTooltip]!"
 fp2_struggle.2007.a.major_vassal_flavor:0 "A opinião de vassalos poderosos do mesmo fé não será influenciada, pois esse é o resultado esperado."
 fp2_struggle.2007.a.notif:0 "A construção de um castelo começará em [fp2_2007_free_real_estate.GetName]."
 fp2_struggle.2007.a:0 "Quero contratar um arquiteto [fp2_2007_allegedprotocastilean.GetNameNoTooltip]."
 fp2_struggle.2007.b.flavor:0 "Essa ação será vista como uma declaração, independentemente da fé."
 fp2_struggle.2007.b:0 "Eu vou contratar o arquiteto [fp2_2007_foreign_faith.GetAdjectiveNoTooltip]."
 fp2_struggle.2007.c.flavor:0 "Projetar um castelo sem gastar uma fortuna é uma tarefa monumentalmente difícil."
 fp2_struggle.2007.c.notif.a.desc:0 "Seus planos para o castelo são assombrados pelo fracasso"
 fp2_struggle.2007.c.notif.a.t:0 "Fundação Podre, Estrutura Desmoronando"
 fp2_struggle.2007.c.notif.b.desc:0 "O projeto é bem-sucedido"
 fp2_struggle.2007.c.roco:0 "A $royal_architect_court_position$ lidará com essa tarefa."
 fp2_struggle.2007.c:0 "Eu vou projetar o castelo eu mesmo, como isso pode ser difícil?"
 fp2_struggle.2007.d.alt:0 "Essas terras não anseiam por um castelo, deixe-as em paz."
 fp2_struggle.2007.d:0 "Eu #EMP não#! financiarei nenhum castelo, especialmente se eles não serão meus!"
 fp2_struggle.2007.desc.a:0 "Contratarei o arquiteto [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 fp2_struggle.2007.desc.b:0 "As terras do [fp2_2007_castle_holder.GetTitledFirstName] $fp2_struggle.2007.desc.main$"
 fp2_struggle.2007.desc.main:0 "estão prontas para serem desenvolvidas\", afirma meu [fp2_2007_scoped_steward.GetCouncilTitleFirstName]. \"Com o seu financiamento, poderíamos proteger [fp2_2007_free_real_estate.GetCounty.GetTitle.GetNameNoTier] contra nossos inimigos em potencial a um custo #ênfase muito# reduzido. [2007_vassal_sponsor.GetTitledFirstName] pediu que fosse construído um [ROOT.Char.Custom('FortifiedBuilding')] em estilo [fp2_2007_foreign_faith.GetAdjective], oferecendo parte de seu próprio dinheiro numa tentativa de influenciar a sua opinião. No entanto, seus outros vassalos exigem que você contrate arquitetos [ROOT.Char.GetFaith.GetAdjective] locais. Independentemente de quem você escolher, esta será uma oportunidade de ouro para fortalecer o reino como um todo.\" O único problema é #EMP quem#! será escolhido para esta oportunidade de ouro..."
 fp2_struggle.2007.t:0 "Um Castelo Digno de Iberia."
 fp2_struggle.2008.a:0 "Eu vi o suficiente, para as masmorras com você!"
 fp2_struggle.2008.b.a:0 "Ensine-me a forjar documentos e eu lhe mostrarei misericórdia."
 fp2_struggle.2008.b.flavor:0 "Você ignora as evidências em troca do conhecimento sobre a arte do engano."
 fp2_struggle.2008.c.flavor:0 "Você oculta evidências de má conduta e participa do esquema de corrupção."
 fp2_struggle.2008.c:0 "Esses fundos são para mim... certo?"
 fp2_struggle.2008.d.flavor:0 "Você expõe as ações [fps_2008_misdeed_actor.GetHerHim] para as pessoas, para que possam julgá-las. Indo contra o desejo de discrepância de seus vassalos e conselheiros."
 fp2_struggle.2008.d:0 "Você será publicamente envergonhado na praça da cidade."
 fp2_struggle.2008.desc:0 "À noite, [fps_2008_misdeed_actor.GetCouncilTitleFirstName] está sentado em uma sala de conselho pouco iluminada. Seu olhar e pena estão focados em relatórios de despesas pouco suspeitos. No entanto, ao lado [fps_2008_misdeed_actor.GetSheHe] estão moldes de argila com o selo real, que só seriam necessários se [fps_2008_misdeed_actor.GetSheHe] tivesse a intenção de fraudar o reino. Pensar que uma [fps_2008_misdeed_actor.GetWomanMan] de sua posição ousaria agir tão vergonhosamente sob os olhos de [ROOT.Char.GetFaith.HighGodName]!\n\nVergonhosamente... mas habilidosamente. Se eu não tivesse flagrado [fps_2008_misdeed_actor.GetSheHe] no ato, ninguém teria descoberto o seu esquema."
 fp2_struggle.2008.t:0 "Más ações do [fps_2008_misdeed_actor.GetCouncilTitle]"
 fp2_struggle.2009.a.flavor:0 "Você deixa o ladrão ir em troca da localização do líder deles, e parte em uma jornada para derrotá-los e ganhar o título de \"O Assassino de Ladrões\"."
 fp2_struggle.2009.a:0 "Este reino não é grande o suficiente para #EMP duas#! [Select_CString(ROOT.Char.IsFemale,'rainhas','rei')]."
 fp2_struggle.2009.b.blues:0 "Ganha o [trait|E] #TUT_KW [GetTrait('depressed_1').GetName(GetNullCharacter)]#! após entregar os seus amigos"
 fp2_struggle.2009.b:0 "Diga-me onde seus cúmplices estão escondidos e talvez você ainda viva."
 fp2_struggle.2009.c:0 "Sua guilda de ladrões parece... #ênfase tributável.#!"
 fp2_struggle.2009.d.flavor.st:0 "Você paga à guilda dos ladrões para deixar suas terras em paz."
 fp2_struggle.2009.d:0 "Trabalhe para mim, perturbe o [fp2_2009_involved_ruler.GetPrimaryTitle.GetNameNoTooltip]."
 fp2_struggle.2009.desc:0 "\"Você escolheu o castelo errado, tolo!\" grita meu marechal enquanto [fp2_2009_marshal.GetSheHe] ameaça o intruso assustado com uma espada.\n\nSob maior pressão do meu marechal, a jovem [fp2_2009_garduna_young_thief.GetWomanMan] explica que [fp2_2009_garduna_young_thief.GetSheHe] faz parte de uma grande organização criminosa originária do [fp2_2009_involved_ruler.GetPrimaryTitle.GetName] e comandada pelo temido [fp2_2009_garduna_guild_master.GetFullNameNicknamed]. \"Então, você está tentando montar uma nova guilda de ladrões bem debaixo do meu nariz, hein?\" Pergunto, para o que o ladrão apenas acena. [fp2_2009_garduna_young_thief.GetSheHe|U] está disposto a trocar mais informações por sua vida."
 fp2_struggle.2009.e.a:0 "A guilda dos ladrões pode retaliar desestabilizando um condado aleatório."
 fp2_struggle.2009.e:0 "Eu presentearei sua cabeça decepada a [fp2_2009_involved_ruler.GetTitledFirstNameNoTooltip]."
 fp2_struggle.2009.t:0 "Capturando Ladrões Míticos"
 fp2_struggle.2010.b:0 "Prepare-se para ser decapitado, cobra!"
 fp2_struggle.2010.c:0 "Pagar pela proteção soa melhor do que uma briga..."
 fp2_struggle.2010.desc:0 "Depois de viajar para [fp2_2009_involved_capital_county.GetNameNoTierNoTooltip], entro em uma igreja abandonada. [fp2_2009_garduna_guild_master.GetNameNoTooltip] está esperando minha chegada.\n\n\"[ROOT.Char.GetFirstNameNoTooltip], presumo? Sua [ROOT.Char.Custom('signature_weapon')] me diz que você não está aqui para me fazer uma oferta. Mas ladrões estão mais próximos de comerciantes do que de soldados. Nós dois podemos sair satisfeitos se você me pagar. Então, eu não terei mais negócios com o seu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
 fp2_struggle.2010.t:0 "Caçando a Marta"
 fp2_struggle.2011.a:0 "É bom ser [Select_CString(ROOT.Char.IsFemale,'a Rainha','o Rei')] #DIE2 dos Ladrões#!"
 fp2_struggle.2011.desc:0 "Com [fp2_2009_garduna_guild_master.GetFirstName] derrotado, a guilda dos ladrões e suas operações foram enfraquecidas."
 fp2_struggle.2012.a.alt:0 "[fp2_2009_has_gifted_head.GetFirstNameNoTooltip] me trouxe um presente encantador!"
 fp2_struggle.2012.a:0 "Quem fez isso está jogando sujo!"
 fp2_struggle.2012.desc.alt:0 "Junto com esta carta, você encontrará a cabeça decepada de um dos ladrões que têm causado estragos em nossos reinos. Tomei a liberdade de executar [fp2_2009_garduna_young_thief.GetSheHe] e informar sua guarnição em [fp2_2009_involved_capital_county.GetNameNoTier] sobre a localização em que seus cúmplices estão."
 fp2_struggle.2012.desc:0 "Há uma gangue de ladrões impiedosos atacando [fp2_2009_involved_capital_county.GetNameNoTierNoTooltip]. Está claro que alguém deliberadamente financiou esses criminosos para agir contra nós. Por enquanto, seria sábio atribuir um marechal para proteger a região."
 fp2_struggle.2012.t.alt:0 "[fp2_2012_sender.Custom2('AppropriateGreetingPositive', ROOT.Char)]"
 fp2_struggle.2012.t:0 "Relatório de fontes locais:"
 fp2_struggle.2013.a.a:0 "Você irá aprender o segredo de [fp2_2013_secret_owner.GetFirstName] #TUT_KW#!"
 fp2_struggle.2013.a:0 "Me conte o segredo e você será livre, [fp2_2013_prisoner_with_a_secret.GetWomanMan]"
 fp2_struggle.2013.b.b:0 "[fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] resiste à tortura"
 fp2_struggle.2013.b:0 "Por que fazer um acordo quando posso simplesmente torturá-lo?"
 fp2_struggle.2013.c.a:0 "[fp2_2013_secret_owner.GetFirstName] decidirá o destino de [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip]"
 fp2_struggle.2013.c.desc:0 "Sem aprender o segredo, você decide levar [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] diante de [fp2_2013_secret_owner.GetFirstNameNoTooltip] para punir sua traição."
 fp2_struggle.2013.c:0 "Cobra traiçoeira! [fp2_2013_secret_owner.GetFirstNameNoTooltip] saberá disso!"
 fp2_struggle.2013.d:0 "Não faço promessas, me conte e talvez eu pense sobre isso mais tarde..."
 fp2_struggle.2013.desc:0 "[fp2_2013_prisoner_with_a_secret.GetFullNameRegnal] é um prisioneiro à minha mercê; Ciente disso, [fp2_2013_prisoner_with_a_secret.GetSheHe] faz um apelo desesperado... 'Eu vou te contar o segredo de [fp2_2013_secret_owner.GetFullNameRegnal] se você me libertar.'"
 fp2_struggle.2013.t:0 "O Segredo para a Liberdade"
 fp2_struggle.2014.b:0 "É uma pena que [fp2_2013_prisoner_with_a_secret.GetFirstNameNoTooltip] não tenha sido executado, mas pelo menos eu ganhei favores."
 fp2_struggle.2014.desc.end:0 "\n\nVocê me fez um grande favor, não esquecerei disso. Obrigado."
 fp2_struggle.2014.desc.heavy.outcome.death:0 "$fp2_struggle.2014.desc.heavy.start$ Em vez disso, eu ordenei que meu torturador retirasse tudo! $fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.heavy.outcome.prison:0 "$fp2_struggle.2014.desc.heavy.start$ Eu vou garantir que nem [fp2_2013_prisoner_with_a_secret.GetSheHe], nem os segredos jamais vejam a luz do dia. $fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.heavy.start:0 "Eu entendo que esse suíno tentou vender meus segredos para salvar a própria pele."
 fp2_struggle.2014.desc.light:0 "mas eu não acredito que [fp2_2013_prisoner_with_a_secret.GetSheHe] tenha feito algo que mereça punição. Eu a deixei incólume.$fp2_struggle.2014.desc.end$"
 fp2_struggle.2014.desc.start:0 "Obrigado por devolver [fp2_2013_prisoner_with_a_secret.GetNameNoTooltip] para mim, "
 fp2_struggle.2014.t:0 "Para [ROOT.Char.GetNameNoTooltip]:"
 fp2_struggle.2015.a.a:0 "Você falha na tentativa de envenenamento"
 fp2_struggle.2015.a.b:0 "Cortesão envenenado!"
 fp2_struggle.2015.a.murder_scheme:0 "[fp2_struggle_2015_murder_requester_vassal.GetTitledFirstName] continuará tentando assassinar [fp2_struggle_2015_peasant_to_murder.GetFirstName]"
 fp2_struggle.2015.a:0 "\"Bem-vindo! Venha, tome uma #DIE2 (bebida envenenada)! [ROOT.Char.Custom('GetExpensiveDrink_Singular')].\""
 fp2_struggle.2015.b:0 "Ignore a carta e aceite [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] em sua corte."
 fp2_struggle.2015.c.a:0 "[fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] \"misteriosamente falha\" em escapar"
 fp2_struggle.2015.c.b:0 "[fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip] é enganado(a) pensando que [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip] está morto(a)"
 fp2_struggle.2015.c:0 "\"Você foi marcado para morrer, fuja enquanto pode.\""
 fp2_struggle.2015.desc:0 "Passando por minha corte, eu noto um rosto desconhecido se aproximando de mim. '[Select_CString( ROOT.Char.IsFemale, 'Minha senhora', 'Meu senhor' )] mais [ROOT.Char.Custom('ComplimentAdjective')], eu sou [fp2_struggle_2015_peasant_to_murder.GetFirstName], antigo cortesão de [fp2_struggle_2015_murder_requester_vassal.Custom2('YourCharacterIntroductionNoComma', ROOT.Char)]. [fp2_struggle_2015_murder_requester_vassal.GetSheHe|U] me pediu para me apresentar a você e participar de sua corte. [fp2_struggle_2015_murder_requester_vassal.GetSheHe|U] também me deu uma carta de apresentação que somente você pode ler.' Então, [fp2_struggle_2015_peasant_to_murder.GetSheHe] me entrega uma carta lacrada.\n\nDepois de quebrar o lacre, a carta simplesmente diz: \"#EMP Caro(a) [ROOT.Char.GetFirstName], por favor assassine o portador desta carta#!. - [fp2_struggle_2015_murder_requester_vassal.GetFirstNameNoTooltip]\""
 fp2_struggle.2015.t:0 "Carta no Verso"
 fp2_struggle.2016.a:0 "Fui enganado! Ess[Select_CString( fp2_struggle_2015_murder_requester_vassal.IsFemale, 'a', 'e' )] [fp2_struggle_2015_murder_requester_vassal.Custom2('InsultNoun', ROOT.Char)]!"
 fp2_struggle.2016.desc:0 "Eu sei que você assassinou #DIE2 (a meu pedido)#! meu enviado mais amado [fp2_struggle_2015_peasant_to_murder.GetFirstNameNoTooltip]. Mas não se preocupe, como seu leal vassalo, manterei este segredo entre nós. Contanto que continuemos a nos ajudar, como bons amigos que somos."
 fp2_struggle.2016.t:0 "Para [Select_CString( ROOT.Char.IsFemale, 'a tola', 'o tolo' )] [ROOT.Char.GetFirstNameNoTooltip],"
 fp2_struggle.2018.a:0 "Sucesso! Consegui conquistar [fp2_2017_gamervassal.GetSheHe]!"
 fp2_struggle.2018.b:0 "Não nos tornamos exatamente amigos, mas nos divertimos!"
 fp2_struggle.2018.c:0 "Ah, isso não foi muito bem..."
 fp2_struggle.2018.desc.bad_intro_match:0 "\"Ugh, que partida... Você realmente deveria praticar com mais frequência, seus movimentos foram simples e previsíveis, não há prazer em jogar contra um oponente que não pode se defender. "
 fp2_struggle.2018.desc.desc_combat_clarification:0 "Em minha mente, nossas espadas se chocaram, uma batalha feroz de análise estratégica e determinação bruta.\n\nEstávamos apenas movendo peças em um tabuleiro, mas a intensa concentração fez a sala e o tabuleiro desaparecerem no éter, nos deixando em um campo de batalha de nossa própria imaginação; movimento a movimento avançando cada vez mais perto da vitória, lutando ferozmente por cada peão...\n\n"
 fp2_struggle.2018.desc.desc_intro:0 "À medida que os minutos se transformam em horas e o crepúsculo sinaliza o fim do nosso tempo juntos, [fp2_2017_gamervassal.GetFirstNameNoTooltip] comenta... "
 fp2_struggle.2018.desc.fought_hard:0 "$fp2_struggle.2018.desc.good_intro_match$ Você lutou bravamente, eu posso respeitar isso. "
 fp2_struggle.2018.desc.good_intro_match:0 "\"Ah, que partida encantadora!"
 fp2_struggle.2018.desc.match_end_loss:0 "Mas no final, eu ainda ganhei. "
 fp2_struggle.2018.desc.match_end_loss_noticed:0 "Eu ainda consegui vencer, embora sinta que esse era seu plano desde o início. "
 fp2_struggle.2018.desc.match_end_win:0 "E você também ganhou, muito bem merecido! "
 fp2_struggle.2018.desc.outcome_0:0 "Me diverti muito, deveria te visitar com mais frequência!"
 fp2_struggle.2018.desc.outcome_1:0 "Foi divertido, talvez eu volte algum dia."
 fp2_struggle.2018.desc.outcome_2:0 "Preciso ir, minha [SCOPE.sC('fp2_2017_gamervassal').Custom2('RelationToMe', SCOPE.sC('fp2_2017_questgiver'))] provavelmente está me esperando. Adeus, [ROOT.Char.GetFirstNameNoTooltip]."
 fp2_struggle.2018.desc.social_good:0 "O [ROOT.Char.Custom('GetExpensiveDrink_Singular')] estava ótimo, obrigado."
 fp2_struggle.2018.desc.social_intro:0 "\"Acho que já bebi o suficiente."
 fp2_struggle.2018.desc.social_pre_intro:0 "Passamos o tempo bebendo e conversando sobre uma variedade de tópicos, desde assuntos simples das aldeias próximas até os resultados de duelos entre [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]. "
 fp2_struggle.2018.desc.social_pre_intro_bad:0 "[fp2_2017_gamervassal.GetFirstName] estava entediado e distraído o tempo todo...\n\n"
 fp2_struggle.2018.desc.social_pre_intro_crit:0 "[fp2_2017_gamervassal.GetFirstName] ficou completamente cativado pela conversa e engajado em cada passo, discutindo os assuntos em questão com grande paixão."
 fp2_struggle.2018.desc.social_pre_intro_good:0 "[fp2_2017_gamervassal.GetFirstName] estava claramente gostando da conversa e da hospitalidade.\n\n"
 fp2_struggle.2018.desc.was_creative:0 "$fp2_struggle.2018.desc.good_intro_match$ Você me pegou de surpresa com aquela abertura hippopotamus no lado do rei, que movimento corajoso foi! "
 fp2_struggle.2018.t.outcome.a:0 "Forjando uma Amizade"
 fp2_struggle.2018.t.outcome.b:0 "Desfrutando da Companhia"
 fp2_struggle.2018.t.outcome.c:0 "Um Tempo Desagradável"
 fp2_struggle.2018.t:0 "Xadrez entre Amigos"
 fp2_struggle.2020.a.desc:0 "Você obriga os camponeses a cultivar exclusivamente amêndoas terrestres, criando produtos de luxo para a sua capital."
 fp2_struggle.2020.a:0 "'De agora em diante, [fp2_2020_valencia.GetNameNoTooltip] deve cultivar exclusivamente amêndoas terrestres!'"
 fp2_struggle.2020.b:0 "'Dê-me todos os seus barris, isso será o centro da minha próxima festa!'"
 fp2_struggle.2020.c.desc:0 "Com um coração pesado, você se livra do desejo por horchata. Ganhar notoriedade por resistir a grande tentação."
 fp2_struggle.2020.c:0 "'Não vou cair na tentação dessa bebida, vá embora!'"
 fp2_struggle.2020.d:0 "Financie o plantio de mais amêndoas em toda a plantação."
 fp2_struggle.2020.desc:0 "Passando por [fp2_2020_valencia.GetName], uma mulher camponesa me oferece uma caneca refrescante de leite com um sabor mais doce do que qualquer outro que eu já tenha provado. 'O que é essa bebida maravilhosa que você me ofereceu?' pergunto, e ela responde 'leite de amêndoa terrestre'.\n\nNão há pessoa que possa resistir ao apelo dessa mistura em um dia quente de verão, nenhuma criança que possa evitar sorrir ao ser oferecida uma caneca, e nenhum valenciano sem um dente doce para ela. #EMP Esta bebida não é leite, é ouro!#!"
 fp2_struggle.2020.t:0 "Açò és or, xata!"
 fp2_struggle.2021.a.a:0 "[fp2_2009_garduna_guild_master.GetFirstName] partirá para [fp2_2021_old_napoly.GetName] e desaparecerá"
 fp2_struggle.2021.a.alt:0 "\"Em vez disso, que tal se aposentar na Itália?\""
 fp2_struggle.2021.a:0 "\"Muito bem, eu vou ajudá-lo a sair para a Itália.\""
 fp2_struggle.2021.b:0 "\"Na verdade, que tal se juntar às minhas fileiras?\""
 fp2_struggle.2021.c.a:0 "A rede de espionagem buscará e informará até dois segredos de outros governantes envolvidos na luta."
 fp2_struggle.2021.c.flavor:0 "Você oferece dinheiro suficiente para [fp2_2009_garduna_guild_master.GetFirstNameNoTooltip] operar uma rede de espionagem para que eles possam procurar segredos em seu nome."
 fp2_struggle.2021.c.spynet.a:0 "Rede de Espionagem Encontrou Segredos:"
 fp2_struggle.2021.c.spynet.b.desc:0 "A rede de espionagem operada por [fp2_2009_garduna_guild_master.GetFirstName] falhou em encontrar segredos relevantes, mas seu mestre de espionagem aprendeu muito com a experiência..."
 fp2_struggle.2021.c.spynet.b:0 "A rede de espionagem falhou em encontrar segredos"
 fp2_struggle.2021.c:0 "\"Soa exaustivo, que tal se tornar um espião em vez de um criminoso?\""
 fp2_struggle.2021.d.a:0 "Matando Velhos Inimigos"
 fp2_struggle.2021.d.alt:0 "Você está certo, sua cabeça #EMP será#! a próxima! #BER Pereça!#!"
 fp2_struggle.2021.d.b:0 "@warning_icon! Você entrará em um duelo letal com [dueltarget.GetFirstName]"
 fp2_struggle.2021.d:0 "\"Não, você não vai escapar desta vez! Prepare-se!\""
 fp2_struggle.2021.desc.alt.behead:0 "Eu não estou aqui para vingar [fp2_2009_garduna_young_thief.GetFirstName], mas para me aposentar. Aquela foi uma cabeça a mais e eu sei muito bem que a minha poderia ser a próxima. Conceda-me passagem segura para sair para [fp2_2021_old_napoly.GetNameNoTier] e você nunca mais me verá. Não há necessidade de esta reunião terminar em derramamento de sangue.\""
 fp2_struggle.2021.desc.alt.cutout:0 "Especialmente depois que você destruiu minha organização anos atrás. Mas quebrar algo é tão fácil quanto reconstruí-lo e eu não quero mais brincar de gato e rato. Conceda-me passagem segura para [fp2_2021_old_napoly.GetNameNoTier] e você nunca mais terá que me ver, a guilda será reconstruída longe de você e de suas riquezas.\""
 fp2_struggle.2021.desc.alt.paidoff:0 "Especialmente quando fizemos um acordo para não incomodá-lo novamente. Mas minha bolsa está começando a ficar muito leve para meu conforto novamente. Este pode ser um solo fértil para o crime, mas não para organizá-lo. Desejo mover meus agentes e a mim para [fp2_2021_old_napoly.GetNameNoTier], conceda-nos passagem segura e você não precisará se preocupar conosco novamente.\""
 fp2_struggle.2021.desc.alt.work:0 "Mas eu gostei bastante de trabalhar com você da última vez e estou carente de [ROOT.Char.GetWomenMen] confiáveis. Desejo me aposentar agora que estou à frente do jogo, você pode garantir minha passagem segura para [fp2_2021_old_napoly.GetNameNoTier]?\""
 fp2_struggle.2021.desc.outro:0 "Diz [fp2_2009_garduna_guild_master.GetFullNameNicknamed], enquanto segura nervosamente uma bolsa de moedas em uma mão e uma arma escondida na outra."
 fp2_struggle.2021.desc:0 "\"Olá [ROOT.Char.GetFirstName], aposto que você não estava esperando me ver novamente."
 fp2_struggle.2021.t:0 "Retorno do Rei dos Ladrões"
 fp2_struggle.2023.a.a:0 "\"Seu tolo, eu sou [ROOT.GetCharacter.GetFullNameNoTooltip]!\""
 fp2_struggle.2023.a.desc:0 "Você diz aos soldados quem você é, acaba com a festa e exige que suas tropas façam agachamentos como punição por confraternizar com o inimigo enquanto estiveram de serviço."
 fp2_struggle.2023.b.a:0 "Você zomba de [fp2_2023_foreign_king.GetFirstNameRegnal]"
 fp2_struggle.2023.b.b:0 "Sua poesia é zombada"
 fp2_struggle.2023.b.desc:0 "Vocês escrevem poemas difamando o governante do outro lado e depois os leem para uma multidão animada."
 fp2_struggle.2023.b:0 "\"Apresentem seus piores poemas sobre os senhores feudais um do outro!\""
 fp2_struggle.2023.c.a:0 "Vencendo o Comandante Inimigo"
 fp2_struggle.2023.c.b:0 "Vencido por [fp2_2023_enemy_knight.GetNameNoTooltip]"
 fp2_struggle.2023.c.desc:0 "Você participa de uma partida não letal com o comandante inimigo para decidir quem paga as bebidas depois."
 fp2_struggle.2023.c.exptooltip:0 "Você pode ganhar Experiência adicional do [martial_lifestyle|E] da partida."
 fp2_struggle.2023.c:0 "\"Vamos resolver isso com uma partida amigável, em guarda!\""
 fp2_struggle.2023.d.a:0 "Você desmaia bêbado"
 fp2_struggle.2023.d.b:0 "Bebendo o equivalente a um barril"
 fp2_struggle.2023.d:0 "\"Por que esperar até a taverna? Vamos competir bebendo cerveja!\""
 fp2_struggle.2023.desc:0 "Estou em uma tenda em um acampamento na fronteira do [fp2_2023_foreign_king.GetPrimaryTitle.GetName], encarregado de avaliar as tensões entre nossos reinos. De repente, uma [fp2_2023_enemy_knight.GetWomanMan] entra na tenda, exigindo ver \"o novo comandante\". Instintivamente, eu avanço.\n\n\"Então, você é o novo comandante? Muito bem, escolha um desafio, o perdedor paga as bebidas do acampamento do outro lado hoje à noite!\" Diz [fp2_2023_enemy_knight.GetFirstName], comandante do acampamento estrangeiro, ignorando o fato de que eu sou [ROOT.Char.GetFirstNameRegnal] e não apenas um líder militar comum."
 fp2_struggle.2023.t:0 "Um Rei para um Bardo"
 fp2_struggle.2025.a:0 "Nossos novos súditos precisam de tempo para lamentar, não lutar..."
 fp2_struggle.2025.b:0 "Ideia brilhante! Aqui se erguerá o maior dos monumentos!"
 fp2_struggle.2025.c:0 "Vamos restaurar esta cidade de volta ao que era."
 fp2_struggle.2025.d:0 "Vou estabelecer postos avançados temporários aqui para proteger minhas novas terras."
 fp2_struggle.2025.desc:0 "Sob o calor do sol, há um pedaço de terra com campos maltratados e prédios em ruínas, o vento sussurrando lamentações de solidão através de suas pedras decrépitas. Este é um dos muitos vilarejos como este em [fp2_2025_razed_land.GetNameNoTier], os habitantes que partiram quando a guerra veio nunca voltaram quando ela acabou e a bandeira de [ROOT.Char.GetPrimaryTitle.GetName] voou sobre ela.\n\n\"Bonito, não é?\" Pergunta meu [ROOT.Char.Custom2('RelationToMe', fp2_2025_marshal)] [fp2_2025_marshal.GetFirstName], \"Esta é uma terra livre, pronta para a reconstrução. Poderíamos construir um monumento ao nosso sucesso bem aqui.\""
 fp2_struggle.2025.t:0 "Sofrendo Com o Sucesso"
 fp2_struggle.2050.a.notif.t:0 "[fp2_2050_el_cid.GetNicknameNoTooltip|U] fica"
 fp2_struggle.2050.a.serve_tooltip:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] continua a servi-lo."
 fp2_struggle.2050.a:0 "Confio em meu [ROOT.Char.Custom2('RelationToMe', fp2_2050_el_cid)] e ele ficará!"
 fp2_struggle.2050.b:0 "[fp2_2050_el_cid.GetFirstNameNoTooltip] continuará a me servir, não importa o quê!"
 fp2_struggle.2050.c.notif:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip] buscará emprego em outro lugar..."
 fp2_struggle.2050.c:0 "Talvez seja hora de deixá-lo ir..."
 fp2_struggle.2050.desc_court:0 "Sussurros estão se espalhando pela minha corte como brasas que acendem fogo. Parece que todos ao meu redor acreditam que [fp2_2050_el_cid.GetFullName] agiu pelas minhas costas.\n\nRumores de tributos roubados, guerras não autorizadas e outras ações que colocam em questão minha autoridade na corte. Não tenho dúvidas sobre a integridade de [fp2_2050_el_cid.GetFirstName], mas posso me dar ao luxo de manter um homem que atrai rumores tão malévolos para minha corte? Eles não podem ser interrompidos agora e, se eu não agir logo, serei visto como fraco."
 fp2_struggle.2050.desc_faith:0 "Em todos os lugares que vou, vejo uma falta de respeito refletida nos olhos dos meus [ROOT.Char.Custom('DefaultPriestTitlePlural')]. Rumores infundados de que minha sede por terras e ouro me desviou de [ROOT.GetCharacter.GetFaith.HighGodName] e me levou a ficar do lado de mercenários ímpios como [fp2_2050_el_cid.GetFirstNameNicknamed], que não se importam com quem lutam.\n\nSuas mentes tolas são obscurecidas por delírios romanticizados de guerra cavalheiresca, onde apenas os piedosos defendem sua fé, quando na verdade é por causa de pessoas como ele que nosso modo de vida está seguro. De qualquer forma, se eu quiser ficar nas boas graças do meu clero, talvez seja hora de considerar banir [fp2_2050_el_cid.GetFirstName]."
 fp2_struggle.2050.desc_knights:0 "Andando pelos corredores do [ROOT.GetCharacter.Custom('FortifiedBuilding')], percebo que todos os meus [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')] estão deprimidos. A presença de [fp2_2050_el_cid.GetFullNameNicknamed] inspira o soldado comum a realizar grandes feitos, mas faz o nobre [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] murchar em sua radiância.\n\nComo um comandante talentoso e um guerreiro digno de fábulas, não há dúvida sobre o valor que [fp2_2050_el_cid.GetFirstNameNicknamed] traz para minhas fileiras, mas se a força de um homem causa fraqueza em outros... Posso realmente me permitir manter tal influência entre meus [ROOT.GetCharacter.Custom('KnightCulturePluralNoTooltipLowercase')]?"
 fp2_struggle.2050.desc_nobles:0 "Nobres de todo o reino se aproximaram de mim ultimamente para compartilhar preocupações, fofocas e comentários abertamente hostis sobre meu [ROOT.Char.Custom2('RelationToMe', fp2_2050_el_cid)] [fp2_2050_el_cid.GetFirstNameNicknamed]. É claro que a nobreza não gosta do meu tratamento favorável a [fp2_2050_el_cid.GetFirstName] e deseja ver este recém-chegado [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] banido antes que qualquer plebeu tente seguir seus passos. [fp2_2050_el_cid.GetFirstName] pode ter sido um nobre, mas agora ele é um [ROOT.GetCharacter.Custom('KnightCultureNoTooltipLowercase')] auto-proclamado e uma ameaça percebida ao tecido social do reino.\n\nA decisão é minha, mas manter [fp2_2050_el_cid.GetFirstName] por perto coloca em perigo minha posição com a nobreza."
 fp2_struggle.2050.t_about_generic:0 "Sobre El Cid"
 fp2_struggle.2050.t_about_muslim:0 "Sobre El Sidi"
 fp2_struggle.2050.t_generic_four:0 "$fp2_struggle.2050.title_main_shi$ $fp2_struggle.2050.t_about_generic$"
 fp2_struggle.2050.t_generic_one:0 "$fp2_struggle.2050.title_main_ichi$ $fp2_struggle.2050.t_about_generic$"
 fp2_struggle.2050.t_generic_three:0 "$fp2_struggle.2050.title_main_san$ $fp2_struggle.2050.t_about_generic$"
 fp2_struggle.2050.t_generic_two:0 "$fp2_struggle.2050.title_main_ni$ $fp2_struggle.2050.t_about_generic$"
 fp2_struggle.2050.t_muslim_four:0 "$fp2_struggle.2050.title_main_shi$ $fp2_struggle.2050.t_about_muslim$"
 fp2_struggle.2050.t_muslim_one:0 "$fp2_struggle.2050.title_main_ichi$ $fp2_struggle.2050.t_about_muslim$"
 fp2_struggle.2050.t_muslim_three:0 "$fp2_struggle.2050.title_main_san$ $fp2_struggle.2050.t_about_muslim$"
 fp2_struggle.2050.t_muslim_two:0 "$fp2_struggle.2050.title_main_ni$ $fp2_struggle.2050.t_about_muslim$"
 fp2_struggle.2050.title_main_ichi:0 "Desconforto"
 fp2_struggle.2050.title_main_ni:0 "Rumores na Corte"
 fp2_struggle.2050.title_main_san:0 "Sussurros Hostis"
 fp2_struggle.2050.title_main_shi:0 "Preocupações"
 fp2_struggle.2051.a:0 "Ah, bem-vindo! Você terá uma posição elevada em minha corte."
 fp2_struggle.2051.b:0 "Um homem do seu talento é sempre bem-vindo em meu reino."
 fp2_struggle.2051.c:0 "Procure emprego em outro lugar, [fp2_2050_el_cid.GetFirstNameNoTooltip]."
 fp2_struggle.2051.desc:0 "Um cavaleiro renomado pelo nome de [fp2_2050_el_cid.GetFullName], também conhecido como \"[fp2_2050_el_cid.GetNicknameNoTooltip|U]\", chegou à minha corte procurando um senhor para servir. Ele é um comandante indubitavelmente talentoso e um guerreiro digno de lendas.\n\n[fp2_2050_el_cid.GetFirstNameNoTooltip] não se importa em trabalhar com qualquer um disposto a recebê-lo de braços abertos. Esta é uma oportunidade para recrutar um cavaleiro capaz de virar o jogo da batalha sozinho."
 fp2_struggle.2051.t:0 "[fp2_2050_el_cid.GetFirstNameNicknamedNoTooltip]"
 fp2_struggle.3001.a:0 "Eu farei o que for preciso."
 fp2_struggle.3001.a_flavour:0 "Você perderá sua coroa."
 fp2_struggle.3001.b:0 "Mas aquela outra coroa..."
 fp2_struggle.3001.c:0 "Espere! Não sou o único com uma coroa nesta casa."
 fp2_struggle.3001.c_flavour:0 "Seu cônjuge perderá sua coroa."
 fp2_struggle.3001.d:0 "Esta coroa só sairá da minha cabeça quando eu estiver morto!"
 fp2_struggle.3001.desc:0 "[struggle_3001_steward.Custom2('MyCharacterIntroduction', ROOT.Char)|U] entra na sala com uma expressão grave. '[ROOT.Char.Custom('FormOfAddressForLiege')],' [struggle_3001_steward.GetSheHe] diz, 'nossos cofres estão quase vazios. É perigoso nesses tempos.' [struggle_3001_steward.GetSheHe|U] não precisa dizer mais nada. Em silêncio, eu lhe dou um olhar carrancudo. '[Select_CString( ROOT.GetCharacter.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord|U]...,' [struggle_3001_steward.GetSheHe] repete enquanto eu saio."
 fp2_struggle.3001.desc_no_war_intro:0 "\n\nTudo o que tenho é esta coroa. Esta coroa e o dever de servir bem. Mas de que adianta uma coroa sem riqueza para mantê-la?"
 fp2_struggle.3001.desc_outro:0 "Eu estendo a mão e toco o material frio - ouro. \n\nEu conheço alguns comerciantes sem escrúpulos que ficariam interessados nisso..."
 fp2_struggle.3001.desc_war_intro:0 "\n\nTudo o que tenho é esta coroa. Esta coroa e o dever de servir bem. Mas de que adianta uma coroa que será tirada de mim após minha derrota?"
 fp2_struggle.3001.t:0 "O Preço da Guerra"
 fp2_struggle.3011.a:0 "Eu gostaria que todos os meus súditos estivessem prontos para defender nossas terras!"
 fp2_struggle.3011.b:0 "Mulheres devem segurar apenas uma coisa em seus braços - bebês."
 fp2_struggle.3011.b_men:0 "Homens devem segurar apenas uma coisa em seus braços - bebês."
 fp2_struggle.3011.c:0 "Bruxas! #EMP Bruxas!#!"
 fp2_struggle.3011.d:0 "Oh, essas pobres senhoras! Eu vou resgatá-las desse mal!"
 fp2_struggle.3011.desc:0 "'[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord]! O impensável aconteceu!' [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] leva um segundo para recuperar o fôlego, sua testa molhada de suor. 'As damas de [struggle_3011_county_town.GetNameNoTier] pegaram em armas para defender a cidade por conta própria.'"
 fp2_struggle.3011.desc_men:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.GetCharacter.GetLadyLord]! O impensável aconteceu!\" [struggle_3011_marshal.Custom2('MyCharacterIntroduction', ROOT.Char)|U] leva um segundo para recuperar o fôlego, a testa molhada de suor. \"Os rapazes de [struggle_3011_county_town.GetNameNoTierNoTooltip] pegaram em armas para defender a cidade eles mesmos.\""
 fp2_struggle.3011.desc_outro:0 "\n\n[bishop.GetTitledFirstName] irrompe na sala logo em seguida. \"Isso é antinatural, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.GetLadyLord]!\" [bishop.GetSheHe] exclama, \"Se permitirmos que eles lutem, logo também pedirão por terra, e quem cuidará das crianças então?\"\n\n\"Uma espada é uma espada,\" a resposta de [struggle_3011_marshal.GetFirstNameNoTooltip] é imediata. \"Certamente você concorda, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.GetLadyLord]?\""
 fp2_struggle.3011.t:0 "Donzelas em Perigo"
 fp2_struggle.3021.a:0 "Certamente vale a pena pesquisar isso."
 fp2_struggle.3021.b:0 "Quem sabe quais perigos isso poderia trazer."
 fp2_struggle.3021.c:0 "Pó preto, você diz... um novo e ardente tempero."
 fp2_struggle.3021.d:0 "Isto é punição divina!"
 fp2_struggle.3021.desc:0 "[struggle_3021_knight.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está com o rosto distorcido pelo medo quando visito os alojamentos. [struggle_3021_courtier.GetTitledFirstName] está tentando ajudar [struggle_3021_knight.GetSheHe] e ergue uma sobrancelha quando [struggle_3021_courtier.GetSheHe] me vê.\n\n\"Você vai pelo menos contar para [Select_CString( ROOT.GetCharacter.IsFemale, 'sua', 'seu' )] [ROOT.GetCharacter.GetLadyLord] o que aconteceu?\"\n\n[struggle_3021_knight.GetFirstNameNoTooltip] levanta sua cabeça imediatamente. \"[Select_CString( ROOT.GetCharacter.IsFemale, 'M-Minha', 'M-Meu' )] [ROOT.GetCharacter.GetLadyLord]... o que eu vi não era para ser visto. Figuras estavam jogando pedras feitas de pó preto das ameias. As pedras acendiam fogo e trovejavam quando atingiam seus inimigos. Elas cortaram um homem ao meio, [Select_CString( ROOT.GetCharacter.IsFemale, 'minha', 'meu' )] [ROOT.GetCharacter.GetLadyLord]!\"\n\n[struggle_3021_courtier.GetFirstNameNoTooltip] acena com interesse. \"Talvez... se nós também pudéssemos ter esse poder...\""
 fp2_struggle.3021.e:0 "Trovoada para o deus do trovão."
 fp2_struggle.3021.t:0 "A Ira do Céu"
 fp2_thriving_jewish_community_modifier:0 "Comunidade Judaica Próspera"
 fp2_thriving_jewish_community_modifier_desc:0 "Este condado está experimentando um boom econômico de famílias judaicas ricas estabelecendo redes de comércio na área."
 fp2_toledo_nights_fallout_modifier:0 "Liderança Religiosa Assassinada"
 fp2_toledo_nights_fallout_modifier_desc:0 "Líderes religiosos foram recentemente assassinados em uma cidade próxima, causando repercussões em todo este reino."
 fp2_toledo_nights_modifier:0 "Líderes Locais Sistematicamente Assassinados"
 fp2_toledo_nights_modifier_desc:0 "Os governantes religiosos locais deste Condado foram recentemente massacrados."
 fp2_yearly.1001.a:0 "O rei é claramente fraco."
 fp2_yearly.1001.b:0 "O bispo deveria ser mais forte."
 fp2_yearly.1001.c:0 "Por que não posso torturar os peões?"
 fp2_yearly.1001.desc:0 "Depois de vencer outra partida de xadrez contra mim mesmo, não posso deixar de pensar que talvez meu intelecto gigantesco possa melhorar um pouco este jogo. \n\nMas que mudança faria mais sentido?"
 fp2_yearly.1001.t:0 "Xadrez Dois"
 fp2_yearly.1002.a:0 "Vou simplesmente sair."
 fp2_yearly.1002.b:0 "Cheira a material de chantagem."
 fp2_yearly.1002.c:0 "Isso parece divertido!"
 fp2_yearly.1002.desc:0 "Tarde da noite, ouço sons estranhos vindo de um quarto ao fundo do corredor. Ao espiar pela porta, posso ver meu [ROOT.Char.Custom2('RelationToMeShort', deviant_courtier)] nu, amarrado e sendo espancado com uma vara de madeira por um servo, que parece estar vestido com algumas de minhas roupas antigas. Se isso não fosse estranho o suficiente, [deviant_courtier.GetSheHe] parece estar adorando isso. \n\nEntre as batidas, [deviant_courtier.GetSheHe] grita: \"Sim! Me puna, [ROOT.GetCharacter.GetNameNoTooltip], eu tenho sido um[Select_CString( deviant_courtier.IsFemale, 'a', '' )] [ROOT.Char.Custom2('RelationToMeShort', deviant_courtier)] muito malvad[Select_CString( deviant_courtier.IsFemale, 'a', 'o' )]!\""
 fp2_yearly.1002.t:0 "Uma Posição Comprometedora"
 fp2_yearly.1003.a:0 "Viva o bravo cavaleiro, vou comprar [injured_knight.GetSheHe] um novo corcel."
 fp2_yearly.1003.b:0 "Não aceitarei contos de fadas na minha corte."
 fp2_yearly.1003.desc:0 "Uma comoção em meu pátio chama minha atenção enquanto [injured_knight.Custom2('MyCharacterIntroduction', ROOT.Char)] é carregado por vários camponeses. [injured_knight.GetSheHe|U] está obviamente gravemente ferido.\n\nQuando exijo saber o que aconteceu, os camponeses me contam que encontraram [injured_knight.GetSheHe] em um campo onde [injured_knight.GetSheHe] afirmou ter acabado de lutar com um gigante.\n\nSeu escudeiro me puxa para o lado depois que a história acaba: \"A verdade é que [injured_knight.GetSheHe] tentou justar com um moinho de vento e perdeu, meu senhor, mas esses aldeões parecem bastante interessados na sua história\"."
 fp2_yearly.1003.t:0 "Lutando contra... Gigantes?"
 fp2_yearly.1004.a:0 "Eu também poderia inspirar meus homens como ele fez em Carmona."
 fp2_yearly.1004.b:0 "Seus acordos diplomáticos com os iemenitas são lendários."
 fp2_yearly.1004.c:0 "Somos parentes!"
 fp2_yearly.1004.desc:0 "Estou lendo uma história de [hawk_of_quraysh.GetName], também conhecido como 'O Falcão de Quraysh'. \n\nAprender sobre sua vida é incrivelmente inspirador, desde sua fuga da dinastia [abbasid_dynasty.GetName] até o estabelecimento da dinastia [hawk_dynasty.GetName] na Península Ibérica. Não posso deixar de pensar que devo levar algumas dessas coisas a sério."
 fp2_yearly.1004.t:0 "O Falcão de Quraysh"
 fp2_yearly.1005.a:0 "Você pode entreter meus cortesãos com sua história única."
 fp2_yearly.1005.b:0 "Um ato bom não equilibra o mal — você morre."
 fp2_yearly.1005.c:0 "Enquanto você serve a vila, pode viver por agora."
 fp2_yearly.1005.desc:0 "Lutando e gritando, um grande [hidden_viking.GetWomanMan] é arrastado diante de mim. [hidden_viking.GetSheHe|U] é claramente um saqueador viking, do tipo que tem semeado o caos em nosso reino por décadas.\n\n\"Por favor, tenha misericórdia. Meu nome é [hidden_viking.GetName] e tenho vivido em [viking_county.GetNameNoTooltip] por anos. Fui deixado para trás porque fiquei ferido. Os aldeões me salvaram; eles são minha família agora.\"\n\nO viking cai de joelhos, esperando que eu poupe a sua vida. Vários camponeses confirmam a sua história."
 fp2_yearly.1005.t:0 "Viking Perdido"
 fp2_yearly.1006.a:0 "Aceitarei seu queijo, mas não sua história ridícula."
 fp2_yearly.1006.b:0 "Devo encontrar esses 'Vikings do Queijo'..."
 fp2_yearly.1006.c:0 "Que bobagem."
 fp2_yearly.1006.desc:0 "Eu paro em uma barraca de beira de estrada que vende alguns alimentos simples. O comerciante, [cheese_trader.GetName], me oferece diferentes mercadorias antes de pegar uma caixa de madeira esculpida abaixo da bancada.\n\n\"Para você, meu senhor, este é o melhor queijo em todo o reino. [cheese_trader.GetSheHe|U] empurra o pequeno bloco em minha mão, se aproxima e sussurra conspiratoriamente: 'Foi feito por vikings fabricantes de queijo aqui na Ibéria.'\n\nApesar do comentário estranho, o queijo é incrivelmente bom."
 fp2_yearly.1006.t:0 "Queijo Viking?"
 fp2_yearly.1007.a:0 "Bem, pelo menos resolvi o mistério."
 fp2_yearly.1007.b:0 "Quero metade dos seus lucros e metade do seu queijo."
 fp2_yearly.1007.desc:0 "Um [fake_cheese_viking.GetWomanMan] magro é trazido diante de mim. No entanto, o [fake_cheese_viking.GetWomanMan] patético à minha frente mal parece um fabricante de queijo, muito menos um viking.\n\n\" Sinto muito, mas não sou realmente um viking. É apenas uma mentira para ajudar a vender o queijo,\" gagueja [fake_cheese_viking.GetSheHe]."
 fp2_yearly.1007.t:0 "$fp2_yearly.1006.t$"
 fp2_yearly.1008.a:0 "[ROOT.Char.GetFaith.HealthGodName|U] chorou. Esse é um bom queijo."
 fp2_yearly.1008.b:0 "Na verdade, deixe o queijo envelhecer mais."
 fp2_yearly.1008.desc:0 "É hora. Em meu armazenamento repousou um dos queijos mais incríveis do mundo conhecido, envelhecendo lentamente, aumentando em potência.\n\nE agora eu irei consumi-lo."
 fp2_yearly.1008.t:0 "Consumindo o Queijo"
 fp2_yearly.4001.a:0 "Não! Eu tenho trabalho a fazer!"
 fp2_yearly.4001.b:0 "Mm, #EMP adorável.#!"
 fp2_yearly.4001.desc:0 "Meu Deus! Ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] realmente exige muito de você. Tenho que trabalhar o dia todo e grande parte da noite também para me manter no controle das coisas. Os camponeses levam vidas abençoadas nesse aspecto; eles não têm essas pressões, que os sobrecarregam e causam tanta letargia!\n\nTalvez uma pequena soneca me faria bem? Posso dormir para recuperar das exaustões do almoço e estar pronto para enfrentar o resto do dia!"
 fp2_yearly.4001.t:0 "A sexta hora"
 fp2_yearly.4002.a:0 "Deixem-nos viver em paz, [realm_priest.GetFirstNameNoTooltip]."
 fp2_yearly.4002.b:0 "Você está certo. Isso não pode continuar."
 fp2_yearly.4002.desc:0 "A carranca desaprovadora no rosto do meu [realm_priest.GetCouncilTitle] [realm_priest.GetTitledFirstNamePossessive] me prepara antecipadamente para o que certamente será algum tipo de tolice que incomoda [ROOT.Char.GetFaith.HighGodName].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [realm_priest.GetSheHe] começa, \"há um assunto de grave importância acontecendo dentro do seu próprio reino. O condado de [interfaith_province.GetCounty.GetName] está cheio de pessoas que não seguem a verdadeira fé! Se isso não fosse ruim o suficiente, eles estão vivendo ao lado daqueles que seguem! E, e, e #EMP cometendo fornicacão#! um com o outro e-\"\n\nEu fecho os olhos enquanto o interminável zumbido continua. Eu temo em pensar como [realm_priest.GetSheHe] vai continuar se eu não fizer algo..."
 fp2_yearly.4002.t:0 "Vivendo em Harmonia"
 fp2_yearly.4003.a:0 "Eu vou entrar em contato com os guerreiros sagrados em [ho_province.GetProvince.GetCounty.GetNameNoTooltip]!"
 fp2_yearly.4003.b:0 "Pagar por guardas para patrulhar uma seção da estrada."
 fp2_yearly.4003.c:0 "[ROOT.Char.GetFaith.HighGodName] ajuda aqueles que se ajudam..."
 fp2_yearly.4003.desc:0 "A cidade sagrada de Santiago de Compostela é um ímã para os fiéis, atraindo peregrinos de terras locais e distantes. A rota até lá é bem percorrida, seguindo seu caminho até o local a partir das colinas dos Pirenéus. É claro que, onde existem pessoas ricas o suficiente para viajar até o local sagrado, também existem aqueles que procuram lucrar com sua confiança no todo-poderoso.\n\nÉ o quinto relatório de um roubo violento por bandidos em tantos dias nos trechos de terra que passam pelo meu território que finalmente leva meu [steward.GetCouncilTitle] [steward.GetFirstName] a consultar comigo sobre como lidar com esse problema."
 fp2_yearly.4003.t:0 "O Caminho de Santiago"
 fp2_yearly.4003.tt:0 "A [holy_order|E] local patrulhará a estrada em seu condado."
 fp2_yearly.4004.a:0 "Para uma [mozarab_wanderer.GetWomanMan] de seus talentos? Absolutamente!"
 fp2_yearly.4004.b.fail:0 "[mozarab_wanderer.GetName] recusa-se a converter e volta a vagar"
 fp2_yearly.4004.b.succ:0 "[mozarab_wanderer.GetName] se une à sua corte"
 fp2_yearly.4004.b:0 "Eu preferiria que meus $knight_culture_player_no_tooltip_lowercase$s fossem [ROOT.Char.GetFaith.GetAdherentNamePlural]."
 fp2_yearly.4004.c.tt:0 "[mozarab_wanderer.GetName] volta a vagar"
 fp2_yearly.4004.c:0 "Fora daqui, pagão!"
 fp2_yearly.4004.desc:0 "Estou atravessando meu tribunal quando uma confusão no seu extremo mais distante chama minha atenção. Uma [mozarab_wanderer.GetWomanMan] robusta está sendo avançada por meus guardas, apenas para que suas armas batam no chão num piscar de olhos. O estranho agita sua espada em saudação para mim.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [mozarab_wanderer.GetSheHe] começa enquanto eu afasto mais guardas, \"Eu me vejo sem um senhor para servir e, julgando pela sua proteção aqui, você poderia precisar da minha ajuda.\"\n\nDo crucifixo que [mozarab_wanderer.GetSheHe] usa em volta do pescoço, deduzo que [mozarab_wanderer.GetSheHe] é um [mozarab_wanderer.GetFaith.GetAdherentName]."
 fp2_yearly.4004.t:0 "O Mestre Errante"
 fp2_yearly.4004.tt:0 "[mozarab_wanderer.GetName] recusa-se a converter e volta a vagar"
 fp2_yearly.4005.a:0 "Vocês são bem-vindos em minhas cidades."
 fp2_yearly.4005.b:0 "Eu não vou permitir que você polua minhas cidades!"
 fp2_yearly.4005.desc.christian:0 "Os [mozarab_merchant.GetFaith.GetAdherentNamePlural] ocupam uma posição única na sociedade ibérica. "
 fp2_yearly.4005.desc.muslim:0 "Os súditos [mozarab_merchant.GetFaith.GetReligion.GetAdjectiveNoTooltip|U] ocupam uma posição única na sociedade ibérica. "
 fp2_yearly.4005.desc:0 "É incomum, então, ver um dos seus mercadores locais pedir uma audiência comigo.\n\n\"Nós [mozarab_merchant.GetFaith.GetAdherentNamePlural] tendemos a lidar com um certo grau de... dificuldade ao viver nossas vidas.\" [mozarab_merchant.GetSheHe|U] fala de maneira uniforme e sem rancor, mas claramente há um pouco de firmeza em suas palavras.\n\n\"Tudo o que queremos é que uma pequena seção das cidades do [mozarab_quarter.GetName] seja chamada de nossa e viva entre o nosso povo. Eu vim aqui para solicitar, [ROOT.Char.Custom('FormOfAddressForLiege')], se você magnanimamente pudesse nos conceder isso.\""
 fp2_yearly.4005.t:0 "Estabelecendo Enclaves"
 fp2_yearly.4006.a:0 "Você tem minha aprovação. Construa suas [mozarab_priest.GetFaith.HouseOfWorshipPlural]."
 fp2_yearly.4006.b:0 "Você nunca #EMP construirá essas cabanas pagãs em minhas terras!"
 fp2_yearly.4006.desc:0 "É uma pessoa corajosa que me aborda quando estou saindo da [ROOT.Char.GetFaith.HouseOfWorship] depois de minha adoração diária, mas um tal [mozarab_priest.GetWomanMan] tentou exatamente isso. Eu noto o crucifixo enrolado ao redor do seu pescoço com alguma suspeita quando [mozarab_priest.GetSheHe] começa a falar.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], eu só peço um minuto do seu tempo. Tudo o que eu quero é que meu rebanho possa adorar em uma [mozarab_priest.GetFaith.HouseOfWorship] como todos os bons seguidores de [mozarab_priest.GetFaith.HighGodName] deveriam!\" O sacerdote nervoso para, e me olha suplicante.\n\nPermitir que os [mozarab_priest.GetFaith.GetAdherentNamePlural] construam lugares de adoração tornaria a conversão deles mais difícil, mas talvez alguma flexibilidade possa ajudar a coesão de meu reino?"
 fp2_yearly.4006.t:0 "[ROOT.Char.GetFaith.HighGodNamePossessive] Arquiteto"
 fp2_yearly.4007.a:0 "Eu vou ficar com isso, e você vai ficar de boca fechada."
 fp2_yearly.4007.b:0 "Tudo bem. #EMP Tudo bem!#! Eu vou deixar a maldita concha."
 fp2_yearly.4007.c.tt.fail:0 "[realm_priest.GetFirstNameNoTooltip] rotula facilmente a concha como falsa"
 fp2_yearly.4007.c.tt.flavour:0 "Se eu ficar com essa concha, quem pode dizer que ela não é #EMP verdadeira?#!"
 fp2_yearly.4007.c.tt.success:0 "Você mantém a concha convincente."
 fp2_yearly.4007.c:0 "...quem você acha que eles vão acreditar, [realm_priest.GetFirstNameNoTooltip]?"
 fp2_yearly.4007.desc:0 "Estou voltando das orações, meu [realm_priest.GetCouncilTitle] [realm_priest.GetFirstName] ao meu lado, quando vejo um flash branco no chão. Curvando-me para pegá-lo, desenterro um objeto circular branco, duro: uma concha de vieira.\n\nTais conchas são uma marca dos peregrinos que viajam nesta estrada em direção a Santiago, e qualquer um que possua uma - especialmente uma com a marca de Santiago impressa - completou a árdua jornada.\n\nEu viro a concha em minha mão cobiçosamente, ciente do olhar desaprovador de [realm_priest.GetFirstNameNoTooltip] perfurando a parte de trás do meu crânio."
 fp2_yearly.4007.t:0 "Procure e Você Encontrará"
 fp2_yearly.4008.a:0 "Que história divertida e antiga!"
 fp2_yearly.4008.b:0 "Ah! Bobagens de histórias de fantasmas!"
 fp2_yearly.4008.c:0 "Você conta uma ótima história, senhora idosa!"
 fp2_yearly.4008.desc.aragonese.a:0 "\"...os Omes Hail são gigantes relacionados com as próprias montanhas. Se esses espíritos se tornam visíveis, eles se transformam nos poderosos maciços que nos protegem dos nossos inimigos. Enraivecidos pela sua situação, os espíritos gritam e enviam rochas rolando encosta abaixo e para as aldeias abaixo.\""
 fp2_yearly.4008.desc.aragonese.b:0 "\"...o pacífico e benevolente Basajaun é um homem enorme com barba que chega aos seus pés. Duas vezes maior do que uma pessoa normal, ele patrulha as florestas com um tronco de árvore como bengala, alertando os pastores sobre tempestades iminentes ou até mesmo matilhas de lobos com um assobio rouco."
 fp2_yearly.4008.desc.basque.a:0 "\"...o Aatxe é um espírito de caverna que é frequentemente visto na forma bestial de um touro vermelho, protegendo as pessoas de influências malignas e atacando ladrões.\""
 fp2_yearly.4008.desc.basque.b:0 "\"...o Gaueko é um espírito noturno. Ele se recusa a permitir que os humanos trabalhem fora após o anoitecer, e qualquer exibição de bravura noturna, como se gabar de não ter medo do escuro, atrairá sua ira.\""
 fp2_yearly.4008.desc.castilian.a:0 "\"...os Cavalos do Diabo aparecem quando as pessoas fazem fogueiras para purificar suas almas. Com crinas pretas como a noite, asas de libélula e bocas espumantes, eles aparecem das cinzas com uma explosão. Cada um é a alma de um pecador com sua própria história para contar.\""
 fp2_yearly.4008.desc.castilian.b:0 "\"...os Ventolines são espíritos do ar que ajudam os marinheiros. Angelicais em aparência, com olhos da cor de espuma do mar e asas que parecem ondas se quebrando, eles vivem nas nuvens carmesins do pôr do sol. Se um bom marinheiro se encontra becalmado, os Ventolines soprarão vento nas velas para levá-los de volta à costa.\""
 fp2_yearly.4008.desc.catalan.a:0 "\"...o Cocollona é um monstro de rio. Ela era originalmente uma freira sem fé que foi punida por seus pecados e presa. Seus carcereiros só a permitiam fora para visitar o rio Onyar. Eventualmente, ela brotou escamas, e agora ela percorre embaixo de pontes esperando por presas desavisadas.\""
 fp2_yearly.4008.desc.catalan.b:0 "\"...o famoso Dip é o cão do inferno e o diplomata do diabo. Um assassino que bebe sangue, a criatura parecida com um lobo percorre os campos à noite, matando vacas e humanos infelizes. Manco em uma perna, seus olhos vermelhos brilhantes são a última coisa que muitos bêbados cambaleantes veem a caminho de casa.\""
 fp2_yearly.4008.desc.ending:0 "\n\nO fogo crepita e desaparece enquanto a velha termina sua história e apressa as crianças para se prepararem para dormir."
 fp2_yearly.4008.desc.galician.a:0 "\"...o Ojáncanu são gigantes peludos e sedentos de sangue com o dobro dos dentes de uma [ROOT.Char.GetWomanMan]. Sua fraqueza crítica é um único cabelo branco que, se puxado, os mata instantaneamente.\""
 fp2_yearly.4008.desc.galician.b:0 "\"...os Estadea são os mortos errantes que assombram aldeias à meia-noite. Andando desajeitadamente, eles seguem uma alma viva em transe que é compelida a liderá-los até o amanhecer. Se essa pessoa não conseguir passar sua parada fantasmagórica para outro ser infeliz, eles murcham e morrem dentro de semanas.\""
 fp2_yearly.4008.desc.intro:0 "O fogo crepita, projetando longas sombras na parede dos alojamentos dos servos. Uma mulher idosa e sábia segura as crianças fascinadas com suas histórias. \n\n"
 fp2_yearly.4008.desc.spain.a:0 "\"...o Cuélebre é uma serpente incrivelmente enorme. Embora seja praticamente imortal, a serpente é preguiçosa e raramente sai de seu refúgio profundo em uma caverna. Seus tesouros são considerados quase inimagináveis, e sua saliva pode curar doenças.\""
 fp2_yearly.4008.desc.spain.b:0 "\"...os Mouros são seres antigos de grande poder que vivem aqui desde o começo do mundo. Grandes ferreiros, os Mouros raramente são vistos acima do solo. Suas donzelas são metamorfos encantados de grande beleza que guardam as passagens subterrâneas.\""
 fp2_yearly.4008.desc.spain.c:0 "\"...as Anjanas são fadas boas e gentis que cuidam das florestas. Com pupilas pretas e asas de gaze, elas ajudam animais feridos e pessoas perdidas. Elas pisam tão levemente que gravetos não quebram sob seu peso. Se você encontrar uma das suas pétalas de rosa coloridas, você pode ser feliz até a sua morte.\""
 fp2_yearly.4008.t:0 "Contos de Lareira"
 fp2_yearly.4009.a:0 "Eu também vencerei os inimigos de nosso povo!"
 fp2_yearly.4009.b:0 "Eu sou mais do que apenas [root_culture.GetNameNoTooltip]."
 fp2_yearly.4009.c:0 "Seria legal ter uma lembrança deste dia."
 fp2_yearly.4009.desc:0 "Hoje é um dia especial. Dobro a esquina e avisto minha pedreira, a Árvore Malato da lenda de Jaun Zuria. A história do jovem guerreiro que repeliu um exército está cravada na mente de cada criança [root_culture.GetName].\n\nPasso a mão pelo tronco nodoso e meus dedos param em uma fenda, tão larga quanto um dedo. Conforme reza a lenda, uma espada foi cravada aqui pelos seguidores do Lorde Branco para testemunhar sua determinação de segui-lo a qualquer lugar."
 fp2_yearly.4009.t:0 "O Senhor Branco"
 fp2_yearly.4010.a.fail:0 "As pessoas apontam que isso não tem base na realidade"
 fp2_yearly.4010.a.success:0 "As pessoas compram sua teoria"
 fp2_yearly.4010.a:0 "Talvez esses fossem túmulos... de santos?"
 fp2_yearly.4010.b:0 "Estes não servem para nada. Desmonte-os."
 fp2_yearly.4010.c:0 "Essas estátuas são blasfêmias! Derrube-as!"
 fp2_yearly.4010.d:0 "Toda essa conversa de porcos está me deixando entediado."
 fp2_yearly.4010.desc:0 "Era para ser uma simples viagem para visitar [verraco_county.GetName], mas eu encontrei algo raro e incomum.\n\nEnormes bestas de pedra em forma de javalis estão diante de mim na ampla paisagem. Pela erosão, eu suponho que são verdadeiramente antigas. Se realmente são tão antigas, então o que possivelmente levou essas pessoas a gastar o esforço para criar javalis monolíticos?"
 fp2_yearly.4010.t:0 "Porcos de Pedra"
 fp2_yearly.8000.a:0 "Destruir bom vinho? O [vinoclast_caliph.GetTitleTierName] ficou louco?"
 fp2_yearly.8000.b:0 "Eu os queimarei até virarem cinzas!"
 fp2_yearly.8000.c:0 "Não, eu devo proteger os viticultores."
 fp2_yearly.8000.desc_jerez:0 "Mas, uma vez que a cidade de [jerez_vineyards.GetNameNoTier] tem os maiores vinhedos de toda a Ibéria, entendemos a gravidade de seu sacrifício, e o [vinoclast_caliph.GetTitleTierName] não esquecerá disso. Ainda assim, os vinhedos devem ser queimados!"
 fp2_yearly.8000.desc_jewish_opening:0 "O bom vinho feito na Ibéria tem sido apreciado por nossos antepassados que aqui se estabeleceram há muito tempo. No entanto, o [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName] decidiu que isso deve acabar.\n\n\"O vinho\", declara o [hof_emissary.GetTitledFirstName] seu enviado, \"certamente não é kosher, e nem sua produção nem consumo podem mais ser tolerados. Você deve, portanto, colocar os vinhedos do [vineyard_county.GetName] em chamas."
 fp2_yearly.8000.desc_muslim_opening:0 "O bom vinho feito na Ibéria tem sido apreciado pelos fiéis que aqui se estabeleceram há muito tempo. No entanto, o [vinoclast_caliph.GetTitleTierName] [vinoclast_caliph.GetFirstName] decidiu que isso deve acabar.\n\n\"O vinho\", declara o [hof_emissary.GetTitledFirstName] seu enviado, \"é certamente #italic haram#!, e nem sua produção nem consumo podem mais ser tolerados. Você deve, portanto, colocar os vinhedos do [vineyard_county.GetName] em chamas."
 fp2_yearly.8000.desc_not_jerez:0 "O [vinoclast_caliph.GetTitleTierName] entende a angústia que isso pode causar aos seus viticultores, mas pense em toda a terra que você liberará para fins melhores e mais justos! Os vinhedos devem ser destruídos."
 fp2_yearly.8000.t:0 "Queimando os Vinhedos"
 fp2_yearly.8001.a:0 "Convide os representantes das cidades."
 fp2_yearly.8001.b:0 "Convide todo mundo! E eu quero dizer #italic todo mundo#!."
 fp2_yearly.8001.c:0 "Não, os nobres sabem o que é melhor, como sempre souberam."
 fp2_yearly.8001.desc:0 "Meu [commoner_enthusiast.GetCouncilTitle] [commoner_enthusiast.GetTitledFirstName] há muito tempo reflete sobre nossas finanças e agora sugere que é hora de montar as #italic cortes#!, uma nova forma de parlamento em que representantes eleitos das cidades livres participam das deliberações do conselho real. \n\n\"Em troca desse privilégio\", [commoner_enthusiast.GetSheHe] diz, \"poderíamos tributar ainda mais as cidades. Se realmente precisarmos de ouro, [ROOT.Char.Custom('FormOfAddressForLiege')], poderíamos até permitir que alguns camponeses menos miseráveis participem de nossas reuniões, embora eu aconselhe contra isso, pois certamente enfureceria os nobres.\""
 fp2_yearly.8001.t:0 "Montagem das Cortes"
 fp2_yearly.8002.a:0 "Não, #italic eu#! posso torná-lo permitido."
 fp2_yearly.8002.b:0 "Me dê um pouco dessa carne! Eu #italic preciso#! experimentar."
 fp2_yearly.8002.c:0 "Muito bem, vamos esperar por uma decisão."
 fp2_yearly.8002.d:0 "Isso #italic não#! deve ser comido. Eu irei lá pessoalmente e queimá-lo."
 fp2_yearly.8002.desc:0 "Duas crianças estavam coletando mariscos na praia em [beached_whale_province.GetName] quando encontraram um cadáver de tamanho colossal. Os moradores da praia afirmam que a carne deste animal marinho morto ainda não está corrompida e é #italic muito#! saborosa. Mas meu [preoccupied_ulama.GetCouncilTitle] [preoccupied_ulama.GetFirstName] me chama para um lado durante a reunião do conselho, aparentemente preocupado.\n\n\"O consumo de carne de baleia é realmente permitido para nós [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]?\", [preoccupied_ulama.GetSheHe] pondera. \"Não posso dar uma decisão neste assunto. Deveríamos esperar uma declaração de um estudioso muito respeitado. Mas você deveria proibir as pessoas de comer a carne deste animal - apenas no caso...\""
 fp2_yearly.8002.t:0 "Um dilema alimentar"
 fp2_yearly.8003.a:0 "Muito bem, vou permitir."
 fp2_yearly.8003.b:0 "Empreste-me essas asas - #italic Eu#! quero voar."
 fp2_yearly.8003.c:0 "Não, isso é loucura."
 fp2_yearly.8003.desc:0 "O renomado inventor [flying_polymath.GetFirstName] me procurou com um pedido muito estranho, carregando um par de asas feitas de madeira e seda. \n\n\"Por muito tempo, os humanos anseiam voar pelos céus\", [flying_polymath.GetSheHe] diz, \"e eu fiz alguns cálculos. Eu vou provar que podemos! Permita-me saltar da torre mais alta do seu [ROOT.Char.Custom('ResidenceBuilding')], [ROOT.Char.Custom('FormOfAddressForLiege')], e eu vou servi-lo fielmente depois.\" \n\nInfelizmente, meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('enthusiastic_child'))] [enthusiastic_child.GetTitledFirstName] ficou sabendo disso e está me pedindo para deixá-la ver o erudito voar. "
 fp2_yearly.8003.t:0 "Voo Fantástico"
 fp2_yearly.8003_child_reaction:0 "Não há como saber como [enthusiastic_child.GetFirstNameNoTooltip] vai reagir ao ver isso."
 fp2_yearly.8004.a:0 "Não vou poupar #italic esforços#! para encontrar as melhores pessoas."
 fp2_yearly.8004.b:0 "Já que você é tão capaz, #italic você#! pode fazer todas as traduções."
 fp2_yearly.8004.c:0 "Bibliotecas dão muito trabalho..."
 fp2_yearly.8004.desc_chaplain:0 "Meu [translation_enthusiast.GetCouncilTitle] [translation_enthusiast.GetTitledFirstName] tem uma ideia. \"Devemos organizar uma equipe de tradução\", [translation_enthusiast.GetSheHe] diz, \"e eu poderia liderá-la. Vamos procurar por tradutores habilidosos, mesmo pagãos, e colocá-los para trabalhar sob seus auspícios. [translation_capital.GetNameNoTierNoTooltip] tem o potencial de ser um farol de iluminação, se você financiar isso!\""
 fp2_yearly.8004.desc_opening:0 "Com o espírito de conciliação reinando na Ibéria, estudiosos de toda a região têm sido vistos nas bibliotecas de meu domínio. Talvez eu possa direcionar sua energia para algo proveitoso...\n\n"
 fp2_yearly.8004.desc_wanderer:0 "O sábio viajante [translation_enthusiast.GetTitledFirstName] apresenta uma oportunidade. \"[ROOT.Char.Custom('FormOfAddressForLiege')|U]\", [translation_enthusiast.GetSheHe] diz, \"Eu dominei uma dúzia de línguas e poderia ajudá-lo a organizar uma equipe de tradução. Vamos procurar por tradutores habilidosos e colocá-los para trabalhar sob seus auspícios. [translation_capital.GetNameNoTierNoTooltip] poderia se tornar um grande farol de iluminação.\""
 fp2_yearly.8004.t:0 "Escola de Tradutores de [translation_capital.GetNameNoTierNoTooltip]"
 fp2_yearly.8005.a:0 "Meu amor por [courtly_lover.GetFirstNameNoTooltip] enche meu coração de canções."
 fp2_yearly.8005.b:0 "Tão bonito..."
 fp2_yearly.8005.c:0 "Eu deveria patrocinar mais músicos!"
 fp2_yearly.8005.d:0 "Chega! Eu mandarei cortar essa maldita árvore."
 fp2_yearly.8005.desc_arabic:0 "Eles cantam em árabe sobre beleza, glória, amor perdido e encontrado novamente."
 fp2_yearly.8005.desc_iberian:0 "Eles cantam em galaico-português, em catalão, sobre a vida, perda, amor agridoce."
 fp2_yearly.8005.desc_language_neutral:0 "Eles cantam em muitas línguas, mas meu coração pode entender cada palavra."
 fp2_yearly.8005.desc_middle_part:0 "Eu posso ouvi-los da minha varanda e eles mexem com minha alma.\n\nNo entanto, eu não sei a identidade desses músicos e quando eu deixo minhas salas nobres e me aproximo da árvore, eles se foram."
 fp2_yearly.8005.desc_opening:0 "No calor escaldante do meio-dia, eles se sentam sob a sombra de um grande pinheiro-do-paraná, tocando alaúdes e flautas."
 fp2_yearly.8005.desc_post_troubadours:0 "Eu pensei que apenas os trovadores de Occitania possuíam tal talento e inteligência, mas talvez eu tenha me enganado...\n\nO que eu devo fazer com esses malditos #italic sentimentos#!?"
 fp2_yearly.8005.desc_pre_troubadours:0 "\n\nEles são enviados do [ROOT.Char.GetFaith.PositiveAfterLife|U]? São fantasmas criados pelo [ROOT.Char.GetFaith.DevilName] para me enredar? Talvez não... mas o que eu devo fazer com esses malditos #italic sentimentos#!?"
 fp2_yearly.8005.t:0 "Sob o Pinheiro Manso"
 fp2_yearly.8006.a:0 "Eu poderia até mesmo fazer de você um prefeito..."
 fp2_yearly.8006.b:0 "Vocês podem ficar, mas seus amigos devem ir para outro lugar."
 fp2_yearly.8006.c:0 "Eu vou te mandar de volta para o seu mestre."
 fp2_yearly.8006.desc:0 "Um grupo de várias centenas de Saqaliba pálidos #italic, homens e mulheres escravizados das regiões orientais da Europa, escapou do reino do meu [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('former_master'))] [former_master.GetTitledFirstName]. Embora [former_master.GetSheHe] fale sobre como eram valorizados em seus exércitos e harém, eles enfrentaram muitos perigos para buscar liberdade em minhas terras.\n\n\"Todos nós temos cicatrizes\", diz-me [saqaliba_leader.GetFirstName], o líder deles. \"Em nossos corpos ou em nossa alma. Mas somos fortes e determinados. Ansiávamos por uma terra própria, onde pudéssemos falar nossa língua ancestral. Se você nos permitir se estabelecer no [saqaliba_barony.GetName], trabalharíamos arduamente para fazê-lo prosperar.\""
 fp2_yearly.8006.flavor.b.tt:0 "Relutantemente, [saqaliba_leader.GetFirstNameNoTooltip] fica em sua corte, deixando seus seguidores saqaliba encontrarem seu próprio caminho."
