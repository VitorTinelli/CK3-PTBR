l_spanish:
 fp2_2p_chess_board:0 "Tabuleiro de Xadrez da Sorte"
 fp2_2p_chess_board_desc:0 "Instrumental em um jogo resoundingly bem-sucedido contra [bg_loser.GetTitledFirstName], essa ferramenta de lazer primeiro trouxe sua sorte patenteada para [bg_victor.GetTitledFirstName]."
 fp2_4p_chess_board:0 "Tabuleiro de xadrez para quatro jogadores"
 fp2_4p_chess_board_desc:0 "Quando [bg_victor.GetTitledFirstName] venceu [bg_loser.GetTitledFirstName] no jogo de xadrez, seu primeiro pensamento foi comemorar a habilidade em jogos criando uma variante melhorada tão específica que [bg_victor.GetSheHe] nunca conseguiria convencer ninguém a jogá-la."
 fp2_andalusian_aquamanile:0 "Aquamanil Ritual"
 fp2_andalusian_aquamanile_desc:0 "Um belo jarro [newly_created_artifact.GetFeatureText('goblet_material')] com decorações de [newly_created_artifact.GetFeatureText('decoration_material_inlay')] douradas, destinado a conter água com a qual se lavar ritualmente as mãos."
 fp2_armillary_sphere:0 "Esfera Armilar"
 fp2_armillary_sphere_desc:0 "Um intricado dispositivo astrológico de qualidade [SCOPE.Custom('ArtifactQuality')]. Os anéis são esculpidos em [newly_created_artifact.GetFeatureText('generic_material_wood')] com incrustações de [newly_created_artifact.GetFeatureText('decoration_material_inlay')], e modelam os caminhos meandrosos do éter em detalhes maravilhosos."
 fp2_chalice_dona_urraca:0 "Cálice de Dona Urraca"
 fp2_chalice_dona_urraca_desc:0 "Um cálice ritual esculpido em ônix profundo e adornado com jóias e treliças de ouro. Encomendado por [owner.GetTitledFirstName] para honrar a Igreja."
 fp2_santiago_aquamanile:0 "(Antigos) $fp2_santiago_bells$"
 fp2_santiago_aquamanile_desc:0 "[reforger.GetTitledFirstName|U] forjou essas jarras a partir da escória derretida dos $fp2_santiago_bells$. Embora agora usadas para purificar ritualmente as mãos do dono, sua mera existência confirma a primazia do Islã sobre o Cristianismo."
 fp2_santiago_aquamanile_melted_desc:0 "Fundidos #EMP novamente#!, mais recentemente por [reforger.GetTitledFirstName], os antigos $fp2_santiago_bells$ são algumas das jarras de água mais disputadas em existência. Sua forma atual anuncia a primazia do Islã na Ibéria."
 fp2_santiago_aquamanile_melted_tally_desc:0 "$fp2_santiago_aquamanile_melted_desc$\n\nO metal frequentemente forjado mudou de mãos [ROOT.Var('artefact_santiago_bells').GetValue] vezes."
 fp2_santiago_bells:0 "Sinos de Santiago"
 fp2_santiago_bells_desc:0 "Os ilustres Sinos de Santiago de Compostela são um lembrete forte, simples e acima de tudo #EMP alto#! da autoridade espiritual imutável de São Tiago."
 fp2_santiago_bells_melted_desc:0 "Recuperados das mãos do infiel, derretidos e retornados a algo parecido com sua forma original por [reforger.GetTitledFirstName], os ilustres Sinos de Santiago de Compostela ecoam para confortar toda a Cristandade."
 fp2_santiago_bells_melted_tally_desc:0 "$fp2_santiago_bells_melted_desc$\n\nO metal frequentemente forjado mudou de mãos [ROOT.Var('artefact_santiago_bells').GetValue] vezes."
 fp2_votive_crowns:0 "Coroa Votiva Visigótica"
 fp2_votive_crowns_desc:0 "Projetada para ser pendurada sobre ou ao redor dos altares da igreja, e ocasionalmente em estátuas, oferecer uma coroa votiva a Deus é expressar submissão diante de uma autoridade superior a qualquer rei."
