l_spanish:
 fp2_lyonese_monk.0000.t.council:0 "Concílio:"
 fp2_lyonese_monk.0000.t.revealed:0 "Ensinos Estranhos:"
 fp2_lyonese_monk.0000.tt.continues_to_teach:0 "[acolyte.GetFirstName] continua a ensinar."
 fp2_lyonese_monk.0000.tt.favour_elipandics:0 "A [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] vence o debate."
 fp2_lyonese_monk.0000.tt.favour_felicians:0 "A [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] vence o debate."
 fp2_lyonese_monk.0000.tt.favour_radicals:0 "O [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] vence o debate"
 fp2_lyonese_monk.0000.tt.is_emboldened:0 "#EMP [acolyte.GetFirstName] é encorajado(a)!#"
 fp2_lyonese_monk.0000.tt.is_humbled:0 "#EMP [acolyte.GetFirstName] é humilhado(a)!#"
 fp2_lyonese_monk.0000.tt.is_paused:0 "#EMP [acolyte.GetFirstName] é dado(a) a uma pausa para reflexão!#"
 fp2_lyonese_monk.0000.tt.teachings_fade:0 "Os ensinamentos de [acolyte.GetFirstNamePossessive] vão se apagar."
 fp2_lyonese_monk.0001.a:0 "Claro, fique o tempo que quiser!"
 fp2_lyonese_monk.0001.b:0 "Você pode ficar por #EMP a#! noite."
 fp2_lyonese_monk.0001.c:0 "Não há mendigos em [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. #EMP Fora#!."
 fp2_lyonese_monk.0001.desc:0 "Ventos batem e uivam nas pedras de [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTier], uivando pela noite como os cães de [acolyte_host.GetFaith.NegativeAfterLife], tentando furiosamente me arrancar de minha fortaleza.\n\nO chamado do meu quarto quente aguarda, longe desses corredores úmidos, mas... é a porta do corredor? Giro, puxando o ruído inesperado, e me deparo com um sagrado [acolyte.GetWomanMan] ensopado, desgrenhado, cambaleando para dentro do seco.\n\n\"Meu-\", [acolyte.GetSheHe] tosse, cuspindo um bolo de catarro molhado, \"[Select_CString( acolyte_host.IsFemale, 'minha', 'meu' )] [acolyte_host.GetLadyLord], por favor! A tempestade é feroz e eu estive na estrada por muitos meses. Imploro-lhe, permita-me uma cama até o amanhecer e o fim da tempestade?\"."
 fp2_lyonese_monk.0001.t:0 "Uma Noite Açoitada pela Tempestade"
 fp2_lyonese_monk.0011.a:0 "Bem, eu suponho..."
 fp2_lyonese_monk.0011.b:0 "Empacote suas coisas, vagabundo."
 fp2_lyonese_monk.0011.desc:0 "\"[Select_CString( acolyte_host.IsFemale, 'Minha', 'Meu' )] [acolyte_host.GetLadyLord], uma palavra do seu tempo?\" pergunta o clérigo diante de mim. \"Meu nome é [acolyte.GetFullNameNoTooltip], e eu era um humilde servo do seu [acolyte_host.Custom2('RelationToMeShort', dead_owner)].\"\n\n\"Eu sei que você ainda deve estar de luto, mas seu antecessor e eu tínhamos um acordo, e devo perguntar - você me permitiria ficar na sua corte e continuar ensinando seus cortesãos sobre os caminhos de [acolyte.GetFaith.HighGodName]?\"."
 fp2_lyonese_monk.0011.t:0 "Um Amigo do seu [acolyte_host.Custom2('RelationToMeShort', dead_owner)|U]"
 fp2_lyonese_monk.0021.a:0 "[acolyte.GetSheHe|U] não pode ter sido tão importante assim..."
 fp2_lyonese_monk.0021.b:0 "[acolyte.GetSheHe|U] claramente foi mais problema do que valeu a pena..."
 fp2_lyonese_monk.0021.c:0 "Tudo isso por nada?"
 fp2_lyonese_monk.0021.desc.dead:0 "As consequências de sua morte são um assunto tranquilo, que duvido que muitos se lembrem daqui a uma década ou um século."
 fp2_lyonese_monk.0021.desc.gone:0 "Para onde exatamente [acolyte.GetSheHe] #EMP foi#! é uma pergunta sem resposta, mas duvido que a maioria das pessoas tenha muito interesse nisso."
 fp2_lyonese_monk.0021.desc.imprisoned:0 "Embora [acolyte.GetSheHe] apenas definhe na prisão, as memórias da maioria são curtas e há uma sensação de finalidade esmagadora em sua sentença."
 fp2_lyonese_monk.0021.desc.intro:0 "Sem [acolyte.GetFullNameNoTooltip] vagando pelo meu reino, a popularidade de seus ensinamentos começa a cair. Sem pregador, não há pregação.\n\n"
 fp2_lyonese_monk.0021.t:0 "Feito e Acabado"
 fp2_lyonese_monk.0031.a:0 "Não preciso de [acolyte.GetFirstNameNoTooltip] quando tenho [acolyte_host.GetFaith.HighGodName]!"
 fp2_lyonese_monk.0031.b:0 "[acolyte.GetSheHe|U] claramente não estava tão comprometido."
 fp2_lyonese_monk.0031.desc.acolyte:0 "De todas as pessoas para converter, eu nunca teria esperado que um fanático como #EMP [acolyte.GetFirstName]#! abandonasse [acolyte_host.GetFaith.HighGodName]. Ainda assim, vivemos em tempos estranhos, e [acolyte.GetSheHe] tem.\n\nSua pregação regular foi abandonada, substituída por um tipo de zelo totalmente mais pedestre."
 fp2_lyonese_monk.0031.desc.acolyte_host:0 "Abraçar a luz do [acolyte_host.GetFaith.GetName] não foi algo que fiz levianamente, e muitos se ofenderam comigo por meu ato de piedade.\n\n[acolyte.GetFirstName] era alguém que eu esperava mais críticas, mas em vez disso, [acolyte.GetSheHe] simplesmente... desapareceu. Um dia aqui, no outro desaparecido.\n\nNão me lembro de palavras finais, mas lembro de uma triste careta."
 fp2_lyonese_monk.0031.t:0 "Fé Despedaçada"
 fp2_lyonese_monk.0041.a.backup:0 "Teremos controvérsias completamente novas agora!"
 fp2_lyonese_monk.0041.a.pope_hope_is_nope:0 "Quem nos guiará sem o Vigário de Cristo?"
 fp2_lyonese_monk.0041.desc.pope_hope_is_nope:0 "O impensável aconteceu — a completa destruição da Sé de Roma. A rocha literal e metafórica da nossa Igreja foi rasgada e ninguém tem tempo para questões mesquinhas de especificidades dogmáticas.\n\nAs almas de todos os fiéis de Cristo estão para sempre em risco sem uma liderança espiritual firme. O que mais importa diante disso?"
 fp2_lyonese_monk.0041.desc.schism:0 "Recentes turbulências criaram um abismo entre nós e a Papalidade — à luz disso, não temos tempo para discutir as mesquinhas especificidades do dogma. O que nos importa com as interpretações deles, seus problemas, sua tagarelice desordenada quando não reconhecemos mais a autoridade espiritual deles?\n\nCom certeza, alguém que pense que isso é algo menos que uma bênção não é bem-vindo na comunidade dos fiéis."
 fp2_lyonese_monk.0041.t:0 "Problemas Maiores"
 fp2_lyonese_monk.0051.a:0 "O que poderia ter acontecido com [acolyte.GetSheHe]?"
 fp2_lyonese_monk.0051.desc:0 "Desde a minha prisão, o contato com o mundo exterior tem sido escasso. Mensagens sussurradas e o ocasional bilhete amassado são tudo o que chega até mim, e mesmo assim, raramente.\n\nO último desses pedaços de informação foi que [acolyte.GetFirstName] desapareceu, por assim dizer. Não está claro se [acolyte.GetSheHe] simplesmente partiu um dia ou se algo mais sinistro está em jogo, mas de qualquer maneira, a [acolyte.GetWomanMan] se foi."
 fp2_lyonese_monk.0051.t:0 "É um Mistério"
 fp2_lyonese_monk.0201.a.tt:0 "[acolyte.GetFirstNameNoTooltip] começará a realizar sessões de estudo aos domingos"
 fp2_lyonese_monk.0201.a:0 "Eu acho que não iria prejudicar..."
 fp2_lyonese_monk.0201.b:0 "Um grupo de conspiradores #EMP da EMP#!? Eu acho que não!"
 fp2_lyonese_monk.0201.c:0 "Acho que você prolongou demais a sua estadia, [acolyte.GetFirstNameNoTooltip]."
 fp2_lyonese_monk.0201.desc:0 "[acolyte.GetFirstName] tornou-se uma espécie de presença constante na corte desde a sua chegada. Estranhamente carismático, pelo menos em questões teológicas, [acolyte.GetSheHe] sempre tem pequenas conversas nas alcovas do castelo com este cortesão ou aquele $knight_culture_player_no_tooltip$.\n\nPor isso, estou um pouco esperando quando [acolyte.GetSheHe] se aproxima de mim com um pedido para reservar uma sala para realizar um grupo de estudo semanal sobre [acolyte.GetFaith.random_ReligiousText].\n\n\"Por favor, meu [acolyte_host.GetTitleAsNameNoTooltip]? Significaria o mundo para mim, e há tanto que eu poderia compartilhar com seus súditos sobre as formas e a vontade de [acolyte.GetFaith.HighGodName]. Só precisaria da sua permissão e de um pequeno espaço para congregarmos\"."
 fp2_lyonese_monk.0201.t:0 "Apenas alguns amigos"
 fp2_lyonese_monk.0211.a:0 "Será que [baron.GetSheHe] pode fazer isso?"
 fp2_lyonese_monk.0211.desc:0 "Devo informá-lo com alegria que estou renunciando imediatamente ao meu posto governando [baron_holding.GetNameNoTier].\n\nMinha fé me chama ao serviço de [acolyte.GetFaith.HighGodName], e pretendo dedicar o restante dos meus dias absolutamente ao seu serviço."
 fp2_lyonese_monk.0211.t:0 "[baron.Custom2('SaudaçãoApropriadaPositiva', acolyte_host)]"
 fp2_lyonese_monk.0221.a:0 "Que bom que você está indo bem, [courtier.GetFirstNameNoTooltip]!"
 fp2_lyonese_monk.0221.b:0 "Tenho um mau pressentimento sobre isso..."
 fp2_lyonese_monk.0221.desc:0 "Que assobio tão irritantemente alegre ecoando em minha direção, logo após uma longa reunião do conselho. Não tenho nem um segundo para processar mais do que isso antes que [courtier.Custom2('ApresentaçãoDoMeuPersonagem' , acolyte_host)] apareça ao virar da esquina e bata em mim, quase me derrubando no chão.\n\n\"Oh, desculpe-me, [acolyte_host.GetFirstName]!\" [courtier.GetSheHe] ri. \"É só que... é um dia tão lindo, não é? Você pode realmente respirar a criação de [courtier.GetFaith.HighGodName]!\".\n\nA [courtier.GetWomanMan] me oferece a mão, sorrindo de orelha a orelha enquanto faz isso."
 fp2_lyonese_monk.0221.t:0 "Um sorriso sardônico"
 fp2_lyonese_monk.0231.a:0 "As pessoas precisam mostrar mais #EMP respeito#! à Igreja."
 fp2_lyonese_monk.0231.b:0 "Claramente [irate_theocrat.GetSheHe] precisa trabalhar em seus sermões."
 fp2_lyonese_monk.0231.desc:0 "Os boatos na corte são de que a última pregação de [irate_theocrat.Custom2('MyCharacterIntroduction', acolyte_host)] para os locais de [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTier] foi #EMP terrível#!.\n\nAparentemente, os paroquianos começaram a atirar cebolas meros minutos depois, escalando para nabos logo em seguida, antes de culminar em um repolho grande o suficiente que, quando acertou o rosto de [irate_theocrat.GetSheHe], a [irate_theocrat.GetWomanMan] foi derrubada.\n\n[irate_theocrat.GetFirstNameNoTooltip] tem estado inconsolável desde então e incapaz de dar uma boa explicação do porquê de [irate_theocrat.GetSheHe] ter repentinamente levantado tanta ira."
 fp2_lyonese_monk.0231.t:0 "Vaias ao Bispo"
 fp2_lyonese_monk.0241.a:0 "Muito bem - empacote suas coisas, [acolyte.GetFirstNameNoTooltip]."
 fp2_lyonese_monk.0241.b:0 "GUARDAS! Prendam o bastardo heterodoxo!"
 fp2_lyonese_monk.0241.c.tt:0 "[acolyte.GetFirstNameNoTooltip] continuará a ensinar seus cortesãos."
 fp2_lyonese_monk.0241.c:0 "Eu acho que #EMP você é#! o problema aqui, [irate_theocrat.GetFirstNameNoTooltip]."
 fp2_lyonese_monk.0241.desc:0 "Com um rugido poderoso, [irate_theocrat.Custom2('MyCharacterIntroduction', acolyte_host)] invade meus aposentos, arrastando [acolyte.GetFirstName] pela manga de sua roupa.\n\n\"Minha [acolyte_host.GetTitleAsNameNoTooltip]! É tudo culpa deste vira-lata! Os camponeses desrespeitosos, os cortesãos #EMP felizes#!, o estranho influxo de monges e freiras! Este [acolyte.GetWomanMan] está enchendo suas cabeças com mentiras e heresias todas as semanas, e fazendo isso com o #EMP seu selo#!!\"\n\n\"Nobre [acolyte_host.GetLadyLord|U]\", interrompe [acolyte.GetFirstNameNoTooltip], \"Eu sou um servo fiel de Cristo e de [acolyte_host.GetFaith.GetReligiousHead.GetTitledFirstName]. #EMP Por favor#!, não se deixe levar pelas inseguranças chorosas deste #EMP lunático alucinado#!, que está apenas chateado porque os padrões locais para clérigos aumentaram recentemente\"."
 fp2_lyonese_monk.0241.t:0 "Culpa [acolyte.GetHerHim|U]"
 fp2_lyonese_monk.0401.a:0 "A Santa Sé me obriga."
 fp2_lyonese_monk.0401.b:0 "Não me lembro de ter pedido a opinião de [papal_capital.GetNameNoTierPossessiveNoTooltip]."
 fp2_lyonese_monk.0401.desc:0 "Recentemente recebi correspondência perturbadora sobre ensinamentos errantes em sua corte.\n\nComo sei que você é um bom [pope.GetFaith.GetAdherentName], confio que esta epístola será suficiente para que você faça a coisa certa e banir este #EMP [acolyte.GetFirstName]#!, pela saúde espiritual de todos nós."
 fp2_lyonese_monk.0401.t:0 "[pope.Custom2('AppropriateGreetingPositive', acolyte_host)]"
 fp2_lyonese_monk.0411.a:0 "Eu suponho... Eu suponho que eu poderia permitir isso..."
 fp2_lyonese_monk.0411.b.tt:0 "Os sonhos de [acolyte.GetFirstNamePossessiveNoTooltip] são completamente arruinados."
 fp2_lyonese_monk.0411.b:0 "Não seja ridículo!"
 fp2_lyonese_monk.0411.desc:0 "[Select_CString( acolyte_host.IsFemale, 'Minha', 'Meu' )] [acolyte_host.GetLadyLord|U], um breve momento do seu tempo?\" implora [acolyte.GetFirstName], saindo das sombras de uma alcova quando saio da capela do meu castelo. Eu considero por um segundo e depois aceno com a minha concordância.\n\n\"Sou verdadeiramente, abjeta e grato por seu apoio e patrocínio em minha missão de ensinar seus súditos sobre a Palavra de [acolyte.GetFaith.HighGodName], mas me vejo empurrando os limites do que posso fazer com uma pequena sala e algumas horas todas as semanas\".\n\n\"Você, em sua imensa sabedoria e generosidade, estaria disposta a me emprestar o domínio de [acolyte_fief.GetNameNoTier]? Com as rendas do feudo, eu poderia passar de salvar dezenas de almas para salvar milhares!\"."
 fp2_lyonese_monk.0411.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Espaço para ensinar"
 fp2_lyonese_monk.0421.a:0 "[irate_theocrat.GetFirstNameNoTooltip], mostre um pouco de decoro!"
 fp2_lyonese_monk.0421.b:0 "[acolyte.GetFirstNameNoTooltip], você #EMP irá#! respeitar a sua autoridade!"
 fp2_lyonese_monk.0421.c:0 "Vocês dois não têm mais em comum do que não têm?"
 fp2_lyonese_monk.0421.desc:0 "Apenas um jantar tranquilo. Apenas. Um. Jantar. Tranquilo. Qual idiota na equipe de serviço colocou [irate_theocrat.Custom2('MyCharacterIntroduction', acolyte_host)] ao lado de [acolyte.GetFirstName]?\n\n\"#EMP O que você acabou de dizer?\" grita [irate_theocrat.GetFirstNameNoTooltip], levantando-se e espalhando frutas e pães pelo chão. \"Isso é calúnia contra o Filho eterno e consubstancial de [irate_theocrat.GetFaith.HighGodName], [acolyte.GetWomanMan]!\" A sala fica mortalmente silenciosa, todos os olhares fixos nos clérigos discutindo.\n\n\"Eu não caluniei ninguém. Você simplesmente não aprecia as nuances da minha Cristologia, e não posso culpá-lo. Pelo menos, não considerando suas...\" [acolyte.GetFirstNameNoTooltip] pausa por um momento, \"... deficiências\"."
 fp2_lyonese_monk.0421.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Altas Tensões"
 fp2_lyonese_monk.0431.a:0 "Não é sábio irritar o trono de São Pedro..."
 fp2_lyonese_monk.0431.b.tt.failure:0 "Seus argumentos desajeitados enfurecem o Papa"
 fp2_lyonese_monk.0431.b.tt.success:0 "[pope.GetTitledFirstNameNoTooltip] fica um pouco mais calmo"
 fp2_lyonese_monk.0431.b:0 "Talvez haja um meio termo aqui."
 fp2_lyonese_monk.0431.c:0 "Maldição, eu sou o [acolyte_host.GetTitleAsNameNoTooltip]!"
 fp2_lyonese_monk.0431.desc.outro:0 "não tenha sido claro na primeira epístola enviada. [acolyte.GetFullNameNoTooltip] está sendo acusado de resgatar doutrinas #EMP cismáticas#! que devem ser queimadas juntamente com seus odiosos defensores em [pope.GetFaith.NegativeAfterLife2]. Entregue [acolyte.GetSheHe] a mim para julgamento, #EMP imediatamente#!, ou arrisque censura."
 fp2_lyonese_monk.0431.desc.pope.different:0 "Talvez meu antecessor"
 fp2_lyonese_monk.0431.desc.pope.same:0 "Talvez eu"
 fp2_lyonese_monk.0431.t:0 "[pope.Custom2('AppropriateGreetingPositive', acolyte_host)]"
 fp2_lyonese_monk.0441.a:0 "Bem, se eles me pediram..."
 fp2_lyonese_monk.0441.b:0 "Assuntos de teologia não são da minha preocupação."
 fp2_lyonese_monk.0441.c:0 "Eu deixei isso ir longe demais!"
 fp2_lyonese_monk.0441.desc:0 "[council_1_venue.GetNameNoTier] está positivamente #EMP agitado#! com clérigos e estudiosos, todos presentes para testemunhar um debate público entre [acolyte.GetFullNameNoTooltip] e [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)], ambos empenhados em mostrar os erros que consideram evidentes nos ensinamentos do outro.\n\nOs primeiros dias não foram bons para [irate_theocrat.GetFirstNameNoTooltip]. Apesar de todos os seus esforços para mostrar que a teologia de [acolyte.GetFirstNamePossessiveNoTooltip] é falha, enfatizando demais o componente humano da personagem de Jesus, a reunião regional de [acolyte.GetFaith.PriestNeuterPlural] parece desinteressada nos seus argumentos.\n\n[acolyte.GetFirstNameNoTooltip], por outro lado, está tão confiante em sua causa que me convidou para supervisionar as considerações finais, dando validade temporal a um evento que é, em essência, espiritual."
 fp2_lyonese_monk.0441.t:0 "$fp2_lyonese_monk.0000.t.revealed$: O Conselho de [council_1_venue.GetNameNoTierNoTooltip]"
 fp2_lyonese_monk.0601.a:0 "Só posso implorar pelo perdão de [acolyte_host.GetFaith.HighGodNamePossessive]."
 fp2_lyonese_monk.0601.b:0 "Eu sou #EMP nomeado#! por [acolyte_host.GetFaith.HighGodName]!"
 fp2_lyonese_monk.0601.desc:0 "Como um cachorro que retorna ao próprio vômito, os tolos sempre voltam à heresia de [GetFaithByKey('adoptionist').GetName]. Pela graça de Jesus e São Pedro, eu #EMP comando#! que você entregue o herege [acolyte.GetFullNameNoTooltip] para excomunhão - arrependa-se agora e o amor infinito da Igreja o perdoará, mas persista com esta heterodoxia e você será #EMP punido#! junto com [acolyte.GetSheHe]."
 fp2_lyonese_monk.0601.t:0 "[pope.Custom2('AppropriateGreetingNegative', acolyte_host)]"
 fp2_lyonese_monk.0611.a:0 "Eu posso desarmar essa situação."
 fp2_lyonese_monk.0611.b.tt.failure:0 "A violência irrompe de qualquer maneira."
 fp2_lyonese_monk.0611.b.tt.success:0 "Você desarmou a situação."
 fp2_lyonese_monk.0611.b:0 "Por favor, meus súditos, acalmem-se!"
 fp2_lyonese_monk.0611.c.tt:0 "Você toma partido dos zelotas heterodoxos."
 fp2_lyonese_monk.0611.c:0 "Tragam minha espada, vamos dispersar esses #EMP rebeldes#!."
 fp2_lyonese_monk.0611.d.tt:0 "Você toma partido dos zelotas ortodoxos."
 fp2_lyonese_monk.0611.d:0 "Hereges? Em #EMP minhas#! terras?"
 fp2_lyonese_monk.0611.desc:0 "\"Hereges! Mentirosos! Profanadores!\"\n\n\"Pagãos! Tolos! Idolatradores!\"\n\nDo alto das muralhas do castelo em [rioting_county.GetNameNoTier], observo as duas multidões rivais de burgueses e camponeses, cada uma cuspindo veneno na outra, os estudantes e acólitos de [acolyte.GetFirstName] enfrentando uma multidão de detratores.\n\nEntre os dois grupos fica um fino fio da minha comitiva, mantendo-os afastados por enquanto, mas a tensão está quase a ponto de explodir."
 fp2_lyonese_monk.0611.e:0 "Tranquem os portões."
 fp2_lyonese_monk.0611.t:0 "$fp2_lyonese_monk.0000.t.revealed$: Tensões Altas"
 fp2_lyonese_monk.0621.a.tt.failure:0 "[zealous_vassal.GetFirstNameNoTooltip] está apenas enfurecido."
 fp2_lyonese_monk.0621.a.tt.success:0 "Você lança dúvida sobre os seus argumentos."
 fp2_lyonese_monk.0621.a:0 "[pope.GetTitledFirstNameNoTooltip] não pôde me persuadir; como você espera persuadir?"
 fp2_lyonese_monk.0621.b:0 "Vassalo? Você não é nada além de um descontente!"
 fp2_lyonese_monk.0621.c:0 "[zealous_vassal.GetTitledFirstNameNoTooltip] está certo, isso foi longe demais."
 fp2_lyonese_monk.0621.desc:0 "\"Meu lorde\", implora [zealous_vassal.GetTitledFirstName], \"não sou seu vassalo jurado? Não fui sempre um bom e leal apoiador de seu governo? Eu imploro, por favor, não siga este... este #EMP herege#! por um caminho que não posso seguir!\".\n\n\"Não ouça esta [zealous_vassal.GetWomanMan], meu [acolyte_host.GetTitleAsNameNoTooltip]\", sussurra [acolyte.GetFirstName] atrás de mim. \"É bem sabido que [zealous_vassal.GetSheHe] é apenas mais um peão para [papal_capital.GetNameNoTier], tentando envenenar secretamente sua mente\".\n\n\"Cale sua língua ou eu a cortarei fora, cobra!\" Rosna [zealous_vassal.GetFirstNameNoTooltip]."
 fp2_lyonese_monk.0621.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Uma Queixa Formal"
 fp2_lyonese_monk.0631.a:0 "Um absurdo!"
 fp2_lyonese_monk.0631.desc:0 "Escrevo para informá-lo, do fundo do meu coração, que [pope.GetTitledFirstName] me presenteou recentemente com um mandado completo e #EMP legal#! de propriedade de [acolyte_host.GetPrimaryTitle.GetNameNoTier].\n\nQuando vier inspecionar minha nova propriedade, confio que você a entregará sem problemas."
 fp2_lyonese_monk.0631.t:0 "[neighbouring_ruler.Custom2('SaudacaoApropriadaNegativa', acolyte_host)]"
 fp2_lyonese_monk.0641.a.tt.hidden_convert.character:0 "[acolyte.GetFirstNamePossessiveNoTooltip] rede de crentes ocultos"
 fp2_lyonese_monk.0641.a.tt:0 "Será convocado um conclave eclesiástico"
 fp2_lyonese_monk.0641.a:0 "Sim... #EMP sim#!, por que não? Se eles estão tão #EMP determinados#! em nos acusar."
 fp2_lyonese_monk.0641.b:0 "Cobra! Você planejou tudo isso desde o início!"
 fp2_lyonese_monk.0641.desc:0 "Tenho inimigos por todos os lados. Vassalos desleais, um Papa indignado, camponeses lutando entre si... Parece que [acolyte_host.GetPrimaryTitle.GetNameNoTier] está começando a se dissolver ao meu redor, dilacerado por minúcias teológicas e lutas de poder mesquinhas. Desanimado, me inclino sobre minha mesa.\n\n\"Meu [acolyte_host.GetTitleAsNameNoTooltip]\", murmura [acolyte.GetFullNameNoTooltip], parado atrás da minha cadeira. Eu nem mesmo ouvi [acolyte.GetSheHe] entrar. \"Parece que, apesar de nossas melhores tentativas, [pope.GetTitledFirstName] e seus capangas se recusam a fazer qualquer compromisso em relação a seu dogma falho\".\n\n\"Eu me pergunto, porém... eles parecem #EMP temer#! as verdades potenciais que descobrimos ao questionar sua interpretação do cânone. Se tais tolos e idólatras como esses insistem em nos condenar como [GetFaithByKey('adoptionist').GetAdherentNamePlural], então isso realmente pode ser uma condenação? Talvez [acolyte.GetFaith.HighGodName] esteja #EMP se revelando#! através de seus gritos?\"."
 fp2_lyonese_monk.0641.t:0 "$fp2_lyonese_monk.0000.t.revealed$ Nada mais do que um homem"
 fp2_lyonese_monk.0801.a.tt:0 "Você se envolve em duelos de [learning|E] para defender seus pontos de vista."
 fp2_lyonese_monk.0801.a:0 "Naturalmente, assumirei um papel de liderança nas discussões."
 fp2_lyonese_monk.0801.b.tt:0 "Você gasta [piety_i]#N [EmptyScope.ScriptValue('fp2_lyonese_monk_conclave_cost_value')|0]#! [piety|E] por escolha firme #WEAK, mas não pode gastar $game_concept_piety$ que não possui#!"
 fp2_lyonese_monk.0801.b:0 "Minha influência será mais sentida do que vista..."
 fp2_lyonese_monk.0801.c.tt:0 "O conclave será decidido sem sua contribuição"
 fp2_lyonese_monk.0801.c:0 "Este é um assunto exclusivo do clero."
 fp2_lyonese_monk.0801.desc.elipandic:0 "debate e firmeza, [acolyte.GetFirstNameNoTooltip] está apoiando o [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName]."
 fp2_lyonese_monk.0801.desc.felicitous:0 "humildade e praticidade, [acolyte.GetFirstNameNoTooltip] está apoiando o [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName]."
 fp2_lyonese_monk.0801.desc.intro:0 "Uma fé nascente clama por debate, e assim [acolyte.GetFirstName] reuniu um conclave de clérigos influentes simpáticos à nossa causa. Três grupos dominam, disputando poder em meus salões enquanto nos preparamos para discutir a doutrina de nosso movimento.\n\nO [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] defende uma interpretação sutil, porém implacável, conciliando muitos pontos trinitários tradicionais. O [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] é mais rígido, mas se concentra na praticidade da crença em um mundo hostil. A minoria [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] está repleta de raiva mal disfarçada, vendo a ortodoxia tradicional como pouco mais do que paganismo disfarçado.\n\nAfirmando que o seu tempo em minha corte ensinou [acolyte.GetSheHe] o valor de"
 fp2_lyonese_monk.0801.desc.radical:0 "fogo e ferocidade, [acolyte.GetFirstNameNoTooltip] está apoiando o [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName]."
 fp2_lyonese_monk.0801.t.first:0 "O Conselho de [council_2_venue.GetNameNoTierNoTooltip]"
 fp2_lyonese_monk.0801.t.second:0 "O Segundo Concílio de [council_2_venue.GetNameNoTierNoTooltip]"
 fp2_lyonese_monk.0801.tt.invalidation_warning:0 "#WEAK Se eu for [imprisoned|E] e incapaz de concluir o conclave, as visões de [acolyte.GetFirstNamePossessiveNoTooltip] irão dominar#!"
 fp2_lyonese_monk.0811.a.tt.failure:0 "O clero zomba de você"
 fp2_lyonese_monk.0811.a.tt.success:0 "Você convence os [acolyte_host.GetFaith.PriestNeuterPlural]"
 fp2_lyonese_monk.0811.a:0 "A situação é complexa..."
 fp2_lyonese_monk.0811.b.tt.failure:0 "O clero zomba de você"
 fp2_lyonese_monk.0811.b.tt.success:0 "Você convence os [acolyte_host.GetFaith.PriestNeuterPlural]"
 fp2_lyonese_monk.0811.b:0 "Não é uma marca de vergonha ser escolhido por [acolyte.GetFaith.HighGodName]."
 fp2_lyonese_monk.0811.c.tt.failure:0 "O clero zomba de você"
 fp2_lyonese_monk.0811.c.tt.success:0 "Você convence os [acolyte_host.GetFaith.PriestNeuterPlural]"
 fp2_lyonese_monk.0811.c:0 "Ser #EMP uma vez#! um homem exclui ser #EMP eternamente#! Deus!"
 fp2_lyonese_monk.0811.d:0 "Não tenho opinião sobre este assunto."
 fp2_lyonese_monk.0811.desc:0 "A questão mais óbvia em pauta é a questão da consubstanciação, ou como Jesus pode ter vivido uma vida significativa como um humano que sofreu e existiu como a eterna personagem divina.\n\nA [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] argumenta que os dois não são mutuamente exclusivos, enquanto a [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] pede uma distinção firme que não invalide a divindade do Filho de Deus, apenas a subordine mais ao Pai.\n\nMembros da [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] atiram frutas e gritam que o ponto é apenas uma encenação sem sentido."
 fp2_lyonese_monk.0811.t:0 "$fp2_lyonese_monk.0000.t.council$ Pai e Filho"
 fp2_lyonese_monk.0821.a.tt.failure:0 "O clero zomba de você"
 fp2_lyonese_monk.0821.a.tt.success:0 "Você convence os [acolyte_host.GetFaith.PriestNeuterPlural]"
 fp2_lyonese_monk.0821.a:0 "Acomodação com o restante do cristianismo é vital."
 fp2_lyonese_monk.0821.b.tt.failure:0 "O clero zomba de você"
 fp2_lyonese_monk.0821.b.tt.success:0 "Você convence os [acolyte_host.GetFaith.PriestNeuterPlural]"
 fp2_lyonese_monk.0821.b:0 "A praticidade é inerentemente principiada."
 fp2_lyonese_monk.0821.c.tt.failure:0 "O clero zomba de você"
 fp2_lyonese_monk.0821.c.tt.success:0 "Você convence os [acolyte_host.GetFaith.PriestNeuterPlural]"
 fp2_lyonese_monk.0821.c:0 "A fé oculta é a fé sem fogo!"
 fp2_lyonese_monk.0821.d:0 "Isso parece circunstancial..."
 fp2_lyonese_monk.0821.desc:0 "As discussões do conclave se voltaram para o problema de como viver e adorar em um mundo que considera ao [acolyte_host.GetFaith.GetName] como reducionista a ponto de heresia suprema. \n\nEm primeiro lugar, os [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] insistem que a verdade interior triunfa sobre a mentira exterior, citando as muitas e #EMP muitas#! falsas retratações de seu homônimo Félix de Urgell e a longa vida que lhe foi dada. \n\nSeus colegas nos [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] consideram isso como covardia blasfema, propondo em vez disso que a discussão e o debate são as únicas formas de conquistar respeito. Os [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] se vangloriam de que #EMP somente#! o poder temporal pode proteger os fiéis."
 fp2_lyonese_monk.0821.t:0 "$fp2_lyonese_monk.0000.t.council$ Praticidade vs. Princípio"
 fp2_lyonese_monk.0831.a.tt.failure:0 "O clero zomba de você."
 fp2_lyonese_monk.0831.a.tt.success:0 "Você influencia os [acolyte_host.GetFaith.PriestNeuterPlural]."
 fp2_lyonese_monk.0831.a:0 "O Pai, o Filho e o Espírito Santo ainda são um único ser."
 fp2_lyonese_monk.0831.b.tt.failure:0 "O clero zomba de você."
 fp2_lyonese_monk.0831.b.tt.success:0 "Você influencia os [acolyte_host.GetFaith.PriestNeuterPlural]."
 fp2_lyonese_monk.0831.b:0 "Uma separação entre o Pai e o Filho não diminui nenhum deles."
 fp2_lyonese_monk.0831.c.tt.failure:0 "O clero zomba de você."
 fp2_lyonese_monk.0831.c.tt.success:0 "Você influencia os [acolyte_host.GetFaith.PriestNeuterPlural]."
 fp2_lyonese_monk.0831.c:0 "A primazia do Pai é imutável."
 fp2_lyonese_monk.0831.d:0 "Nós nos dividimos tão rapidamente em linhas dogmáticas?"
 fp2_lyonese_monk.0831.desc:0 "O conclave chega a uma conclusão ardente, com pequenas brigas e argumentos apaixonados se espalhando por toda [council_2_venue.GetNameNoTier], enquanto os três grupos eclesiásticos lutam tanto literalmente quanto metaforicamente por suas crenças.\n\nO coração deste debate animado é sobre fundamentos simples.\n\nA [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] insiste no que eles veem como monoteísmo puro, os [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] colocam grande ênfase em Deus Pai, mas não são tão criticos quanto os radicais exigem, e a [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] retém muitos exemplos de pensamento claramente trinitário que os outros acham objetáveis."
 fp2_lyonese_monk.0831.t:0 "$fp2_lyonese_monk.0000.t.council$ Um Deus"
 fp2_lyonese_monk.0841.a:0 "Deixem que nos chamem de hereges. Nós simplesmente temos nuances que eles não têm."
 fp2_lyonese_monk.0841.b:0 "Nossas palavras são sensatas, nossas ações também."
 fp2_lyonese_monk.0841.c:0 "Veja esses falsos cristãos e seu politeísmo expostos!"
 fp2_lyonese_monk.0841.d:0 "Só espero que tenhamos feito a escolha certa."
 fp2_lyonese_monk.0841.desc.elipandic:0 "\n\nAtravés de debates estoicos, as cabeças frias da [GetFaithDoctrine('special_doctrine_adoptionist_school_elipandic_doctrine').GetBaseName] emergiram triunfantes."
 fp2_lyonese_monk.0841.desc.felicitous:0 "\n\nApós acalorados debates, as línguas de prata da [GetFaithDoctrine('special_doctrine_adoptionist_school_felicitous_doctrine').GetBaseName] triunfaram finalmente."
 fp2_lyonese_monk.0841.desc.fundamentalist:0 "Tendo tomado uma decisão de converter os não salvos em nossas terras,"
 fp2_lyonese_monk.0841.desc.intro:0 "Neste dia, a #EMP nova#! crença [acolyte_host.GetFaith.GetAdjective] nasce!"
 fp2_lyonese_monk.0841.desc.outro:0 "\n\nNão somos mais o mero sonho de um clérigo solitário e errante. Agora somos uma comunidade viva e vibrante, e uma que certamente toda a cristandade em breve abraçará."
 fp2_lyonese_monk.0841.desc.pluralist:0 "Tendo chegado a um acordo com a necessidade de acomodar os outros em nossas terras,"
 fp2_lyonese_monk.0841.desc.pursuit_of_power:0 "não vemos motivos para não fazer o nosso melhor para #EMP estender#! essas terras a qualquer custo."
 fp2_lyonese_monk.0841.desc.radical:0 "\n\nAtravés de toda esta discussão sem sentido, somente os agitadores da [GetFaithDoctrine('special_doctrine_adoptionist_school_radical_doctrine').GetBaseName] conseguiram reter algo como clareza de visão, e agora esperamos que eles nos liderem."
 fp2_lyonese_monk.0841.desc.religious_law:0 "no entanto, permanecemos comprometidos em resolver nossas disputas teológicas de maneira aberta."
 fp2_lyonese_monk.0841.desc.righteous:0 "Tendo permanecido resolutos em lidar com os outros em nossas terras,"
 fp2_lyonese_monk.0841.desc.sanctioned_false_conversions:0 "não vemos problema em sermos práticos quando a situação é invertida."
 fp2_lyonese_monk.0841.t:0 "$fp2_lyonese_monk.0000.t.council$ Do Limiar"
 fp2_lyonese_monk_cancel_chain_effect.tt:0 "Durante a tentativa de prisão, [acolyte.GetFirstName] é morto(a)."
