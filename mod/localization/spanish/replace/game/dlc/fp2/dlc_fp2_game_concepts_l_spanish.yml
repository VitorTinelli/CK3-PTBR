l_spanish:
 game_concept_bargain_fealty:0 "Negociação de Vassalagem"
 game_concept_bargain_fealty_desc:0 "Esta [interaction|E] especial está disponível para [rulers|E] [Concept('struggle_involved', 'Envolvidos')|E] que estejam em uma [war|E] defensiva.\n\nO [war_leader|E] pede a um [ruler|E] vizinho de [rank|E] mais alta para se juntar à sua guerra em troca de se tornar seu [vassal|E]."
 game_concept_bargained_fealty:0 "Vassalagem Negociada"
 game_concept_border_raid:0 "Incursão Fronteiriça"
 game_concept_border_raid_desc:0 "Este é um tipo especial de [war|E] disponível entre [rulers|E] [Concept('struggle_involved', 'Envolvidos')|E] no [struggle|E] Ibérico, onde o atacante tem como objetivo um [siege|E] no [county|E] inimigo que faz fronteira com o seu [realm|E].\n\nO [war_leader|E] ganha [gold|E] pela captura do [war_target|E], que perderá [development|E] e [control|E]. [buildings|E] também podem ser destruídas, fornecendo mais [gold|E], com a chance aumentando conforme o [development|E] e o tamanho do [army|E] do [siege|E].\n\n[war_score|E] serão obtidas rapidamente pelo atacante [occupying|E] o [war_target|E]."
 game_concept_border_raiding:0 "Incursionando Fronteiras"
 game_concept_border_raids:0 "Incursões Fronteiriças"
 game_concept_build_holy_pilgrim_roads_decision:0 "$build_holy_pilgrim_roads_decision$"
 game_concept_build_holy_pilgrim_roads_decision_desc:0 "Uma [decision|E] onde você constrói estradas para facilitar a vida dos peregrinos."
 game_concept_contract_assistance:0 "Assistência Militar"
 game_concept_contract_assistance_desc:0 "Este é um tipo especial de [interaction|E] disponível para [rulers|E] [Concept('struggle_involved', 'Envolvidos')|E] no [struggle|E] Ibérico, permitindo-lhes juntar-se a outras [wars|E] do [ruler|E] [struggle_involved|E] em troca de [gold|E].\n\nO pagamento é feito na conclusão da [war|E], independentemente do resultado, desde que o contratante tenha feito uma [war_contribution|E] de pelo menos 100."
 game_concept_contract_assisting:0 "Prestando Assistência Militar"
 game_concept_dissolution_faction:0 "Facção da Dissolução"
 game_concept_dissolution_faction_desc:0 "A [dissolution_faction|E] busca destruir o [realm|E] do seu [liege|E]. Se bem-sucedida, todos os vassalos do reino tornam-se [Concept('independent', 'Independentes')|E] e o seu senhor feudal perde o seu [primary_title|E]."
 game_concept_dissolution_faction_dissolved:0 "Dissolvida"
 game_concept_dissolution_factions:0 "Facções da Dissolução"
 game_concept_enforce_truce:0 "Forçar Trégua"
 game_concept_enforce_truce_desc:0 "Este é um tipo especial de [interaction|E] disponível para [rulers|E] [Concept('struggle_involved', 'Envolvidos')|E], que encerra uma [war|E] em [white_peace|E] e estabelece [truces|E].\n\nSó pode ser usado para acabar com guerras entre outros [rulers|E] [Concept('struggle_involved', 'Envolvidos')|E] de uma menor [rank|E], em que pelo menos um dos lados é [independent|E] ou faz parte do mesmo [realm|E]."
 game_concept_enforced_truce:0 "Trégua Forçada"
 game_concept_faction_dissolution:0 "Dissolução"
 game_concept_golden_age_jewish_science_in_iberia_decision:0 "$golden_age_jewish_science_in_iberia_decision$"
 game_concept_golden_age_jewish_science_in_iberia_decision_desc:0 "Uma [decision|E] onde você patrocina estudiosos judeus locais e colhe os benefícios."
 game_concept_iberian_reclaiming:0 "Reconquistando a Ibéria"
 game_concept_iberian_reclamation:0 "Reconquista Ibérica"
 game_concept_iberian_reclamation_desc:0 "Este é um tipo especial de [war|E] disponível para [rulers|E] [Concept('struggle_involved', 'Envolvidos')|E] do [iberian_struggle|E].\n\nO atacante tem como objetivo conquistar um [duchy|E] que contenha quaisquer [counties|E] [Concept('struggle_involved', 'Envolvidos')|E] detidos por um [ruler|E] [struggle_interloper|E] ou [struggle_uninvolved|E], ou [vassalize|E] os mesmos, caso não possuam terras fora desse Ducado."
 game_concept_iberian_reclamations:0 "Reconquistas Ibéricas"
 game_concept_iberian_struggle:0 "Conflito Ibérico"
 game_concept_iberian_struggle_desc:0 "O $game_concept_iberian_struggle$ retrata os séculos de relacionamentos conturbados na Península Ibérica. Embora nascido da Conquista Omíada da Península Ibérica no século VIII, o [struggle|E] muda entre [struggle_phase_phases|E] de violência movida a ódio, tréguas cautelosas e cooperação pragmática. Há poucos aliados permanentes em tal situação, e os [rulers|E] devem ter cuidado ao confiar puramente em uma [faith|E] ou [culture|E] compartilhada."
 game_concept_improve_city_province_decision:0 "Decisão de $improve_city_province_decision_name$"
 game_concept_improve_city_province_decision_desc:0 "Uma [decision|E] que permite aumentar o número de [buildings|E] disponíveis em uma [city_holding|E]."
 game_concept_incite_revolts_interaction:0 "Instigar Revolta"
 game_concept_incite_revolts_interaction_desc:0 "Permite investir [gold_i][gold|E] para motivar a [peasant_faction|E] em outro [realm|E], se eles tiverem [counties|E] com [county_opinion|E] negativa."
 game_concept_purchase_truce_interaction:0 "$purchase_truce_interaction$"
 game_concept_purchase_truce_interaction_desc:0 "Uma [interaction|E] que permite comprar [truces|E] preventivamente em troca de [gold_i][gold|E]."
 game_concept_secure_iberian_foothold_decision:0 "$secure_iberian_foothold_decision_title$"
 game_concept_secure_iberian_foothold_decision_desc:0 "Uma [decision|E] que permite a um [ruler|E] não [struggle_involved|E] terminar o [iberian_struggle|E]."
 game_concept_struggle:0 "Conflito"
 game_concept_struggle_catalyst:0 "Catalisador do Conflito"
 game_concept_struggle_catalyst_catalyst:0 "Catalisador"
 game_concept_struggle_catalyst_catalysts:0 "Catalisadores"
 game_concept_struggle_catalyst_desc:0 "[struggle_struggles|E] transicionam entre [struggle_phase_phases|E] quando certas ações notáveis são tomadas, construindo o consenso da sua [struggle_region|E] em direção a um humor particular. Uma lista de quais ações são importantes em qual $game_concept_struggle_phase_phase$ pode ser encontrada na janela do $game_concept_struggle$.\n\n#weak Exemplo: a [struggle_phase_iberia_opportunity|E] do [iberian_struggle|E] pode transicionar para [struggle_phase_iberia_hostility|E] ou [struggle_phase_iberia_conciliation|E]. Assassinar um [character|E] importante pode funcionar para o primeiro, enquanto formar uma [alliance|E] por [marriage|E] com alguém de outra [faith|E] pode construir em direção ao último."
 game_concept_struggle_conquest:0 "Conflito Armado"
 game_concept_struggle_conquest_conquest:0 "Conflito"
 game_concept_struggle_conquest_conquests:0 "Conflitos"
 game_concept_struggle_conquest_desc:0 "Não é incomum que [rulers|E] envolvidos em um [struggle|E] se envolvam em disputas de fronteira e brigas mesquinhas, mudando com a natureza da atual [struggle_phase|E]. A disponibilidade pronta de disputas locais permite que $game_concept_rulers$ realizem apreensões de terra em pequena escala, conquistando ou vassalizando seus alvos.\n\nJá que os $game_concept_struggle_conquest_conquests$ dependem do ambiente do $game_concept_struggle$, seu custo de [prestige|E] varia de acordo com a atual $game_concept_struggle_phase$."
 game_concept_struggle_desc:0 "$game_concept_struggle_struggles$ são conflitos de longo prazo envolvendo grandes [struggle_region_regions|E] com muitas [faiths|E] e [cultures|E]. Dentro das fronteiras de um $game_concept_struggle$, regras especiais e [modifiers|E] peculiares podem entrar em vigor, mudando ao longo do tempo. Como eles duram décadas a séculos, nem todos os [characters|E] em um $game_concept_struggle$ estão em [war|E] um com o outro o tempo todo.\n\nCada $game_concept_struggle$ consiste em múltiplas [struggle_phase_phases|E]. À medida que os $game_concept_characters$ dentro da [struggle_region|E] agem (por exemplo, declarando $game_concept_war$, ou [marrying|E]), eles podem ativar [struggle_catalyst_catalysts|E] que os fazem progredir entre as diferentes $game_concept_struggle_phase_phases$.\n\nDependendo do grau em que são vistos como parte do $game_concept_struggle$ por outros participantes, os $game_concept_characters$ com [land|E] na área podem ser vistos como [Concept('struggle_involved', 'Envolvidos')|E], [struggle_interloper_interlopers|E] ou [Concept('struggle_uninvolved', 'Não Envolvidos')|E]."
 game_concept_struggle_interloper:0 "Intruso"
 game_concept_struggle_interloper_desc:0 "Quando um [character|E] está envolvido em um [struggle|E] específico, mas ainda não é considerado completamente [Concept('struggle_involved', 'Envolvidos')|E], ele é um $game_concept_struggle_interloper$.\n\nOs $game_concept_struggle_interloper_interlopers$ têm suas [capitals|E] dentro da [struggle_region|E], mas não possuem tanto uma [faith|E] [Concept('struggle_involved', 'Envolvida')|E] quanto uma [culture|E] [Concept('struggle_involved', 'Envolvida')|E].\n\nOs $game_concept_characters$ completamente [Concept('struggle_involved', 'Envolvidos')|E] os consideram como estrangeiros intrometidos e problemáticos que não entendem que não são bem-vindos. Portanto, os [rulers|E] $game_concept_struggle_interloper_interlopers$ geralmente recebem penalidades em [counties|E] que possuem dentro de uma $game_concept_struggle_region$."
 game_concept_struggle_interloper_interlopers:0 "Intrusos"
 game_concept_struggle_involved:0 "Envolvido"
 game_concept_struggle_involved_culture:0 "Cultura Envolvida"
 game_concept_struggle_involved_culture_desc:0 "Algumas [cultures|E] já estão [Concept('struggle_involved', 'Envolvidos')|E] no [struggle|E]. Outras podem se envolver devido a circunstâncias em mudança."
 game_concept_struggle_involved_cultures:0 "Culturas Envolvidas"
 game_concept_struggle_involved_desc:0 "Quando um [character|E] ou um [county|E] é considerado $game_concept_struggle_involved$, isso significa que eles são uma parte natural e integral de um [struggle|E] pelas pessoas de uma determinada [struggle_region|E]. Eles se beneficiam completamente das vantagens fluidas das [struggle_phase_phases|E] e são os principais ativadores dos [struggle_catalyst_catalysts|E].\n\nA [culture|E] e [faith|E] que é considerado [Concept('struggle_involved', 'Envolvida')|E] são aquelas que têm ou tiveram uma presença significativa na $game_concept_struggle_region$.\n\n#weak Para ser considerado $game_concept_struggle_involved$, um $game_concept_character$ deve ter tanto sua $game_concept_culture$ quanto sua $game_concept_faith$ [Concept('struggle_involved', 'Envolvida')|E] #EMP e#! ter sua [capital|E] dentro da $game_concept_struggle_region$.#!"
 game_concept_struggle_involved_faith:0 "Fé Envolvida"
 game_concept_struggle_involved_faith_desc:0 "Algumas [faiths|E] já estão [Concept('struggle_involved', 'Envolvidos')|E] no [struggle|E]. Outras podem se envolver devido a circunstâncias em mudança."
 game_concept_struggle_involved_faiths:0 "Fés Envolvidas"
 game_concept_struggle_large_conquest:0 "Luta de Conquista Grande"
 game_concept_struggle_large_conquest_desc:0 "Alguns $game_concept_struggle_catalyst_catalysts$ envolvem a conclusão bem-sucedida de uma grande [war|E] pelo atacante.\n\nOs seguintes [casus_bellis|E] são contabilizados para isso:\n$EFFECT_LIST_BULLET$ $duchy_conquest_cb$ \n$EFFECT_LIST_BULLET$ $individual_duchy_de_jure_cb$ \n$EFFECT_LIST_BULLET$ $imperial_reconquest_cb$ \n$EFFECT_LIST_BULLET$ $invasion_war$ \n$EFFECT_LIST_BULLET$ $clan_invasion_war$ \n$EFFECT_LIST_BULLET$ $mongol_invasion_war$ \n$EFFECT_LIST_BULLET$ $game_concept_war$ $major_religious_war$ \n$EFFECT_LIST_BULLET$ Ambas as $game_concept_great_holy_wars$ [great_holy_war_directed|E] & [great_holy_war_undirected|E] \n$EFFECT_LIST_BULLET$ $tribal_subjugation_cb$"
 game_concept_struggle_phase:0 "Fase do Conflito"
 game_concept_struggle_phase_desc:0 "Uma $game_concept_struggle_phase_phase$ é um estado de espírito geral comum a [characters|E] e [counties|E] [Concept('struggle_involved', 'Envolvidos')|E] dentro de uma [struggle_region|E]. Ele representa tendências e costumes sociais de curto prazo temporariamente dominando o diálogo do [struggle|E].\n\n#weak Exemplo: em uma $game_concept_struggle_phase_phase$, as pessoas de uma $game_concept_struggle_region_region$ podem pensar que a tolerância religiosa é fundamental, mesmo que o restante de sua fé discorde.#!"
 game_concept_struggle_phase_iberia_compromise:0 "Fase de Compromisso"
 game_concept_struggle_phase_iberia_compromise_desc:0 "Seja por meio do cansaço com a luta da [struggle_phase_iberia_hostility|E] ou da escalada habilidosa durante a [struggle_phase_iberia_conciliation|E], a $game_concept_struggle_phase_iberia_compromise$ representa uma crescente acomodação entre os povos da Península Ibérica. Diferenças são deixadas de lado e a história e o patrimônio compartilhados unem antigos inimigos.\n\nA península está em uma encruzilhada: se os conflitos reaparecerem, então a [struggle_phase_iberia_opportunity|E] aguarda."
 game_concept_struggle_phase_iberia_conciliation:0 "Fase de Conciliação"
 game_concept_struggle_phase_iberia_conciliation_desc:0 "Produto de uma notável [struggle_phase_iberia_compromise|E], durante esta $game_concept_struggle_phase_phase$, as relações entre os povos da Península Ibérica se tornam tão cordiais que os estrangeiros acham difícil entender sua permissividade. [marriages|E] inter-[faith|E] são particularmente comuns.\n\nNo entanto, isso não pode durar para sempre, e abusos de confiança eventualmente trarão de volta o [iberian_struggle|E] para a [struggle_phase_iberia_compromise|E]."
 game_concept_struggle_phase_iberia_hostility:0 "Fase de Hostilidade"
 game_concept_struggle_phase_iberia_hostility_desc:0 "As tensões aumentam e os ânimos se exaltam nesta $game_concept_struggle_phase_phase$. Atos repetidos de malícia e mal-entendidos crescentes durante a [struggle_phase_iberia_opportunity|E] levaram ao aumento do ódio por [characters|E] com diferentes [cultures|E], [faiths|E] ou, pior ainda: ambos.\n\nNo entanto, tal derramamento de sangue não pode persistir para sempre. Eventualmente, cabeças mais frias ou simples exaustão trarão a península para a [struggle_phase_iberia_compromise|E]."
 game_concept_struggle_phase_iberia_opportunity:0 "Fase de Oportunidade"
 game_concept_struggle_phase_iberia_opportunity_desc:0 "Depois de um longo período de coexistência relativamente pacífica durante a [struggle_phase_iberia_conciliation|E], a complacência começa a se instalar. Tanto a nobreza quanto a população estão confortáveis de que as coisas simplesmente #EMP funcionam#!, permitindo que personagens mais astutos aproveitem sua ingenuidade.\n\nEventualmente, novos abusos irão causar uma escalada para a [struggle_phase_iberia_hostility|E], ou então a política sagaz alcança um equilíbrio instável através da [struggle_phase_iberia_conciliation|E]."
 game_concept_struggle_phase_phase:0 "Fase"
 game_concept_struggle_phase_phases:0 "Fases"
 game_concept_struggle_region:0 "Região de Conflito"
 game_concept_struggle_region_desc:0 "Cada [struggle|E] está ligado a uma [region|E] no mapa. A localização do [character_possessive|E] dentro desta $game_concept_region$ (bem como sua [culture|E] e [faith|E]) determina se ele é classificado como [struggle_involved|E], um [struggle_interloper|E] ou [struggle_uninvolved|E].\n\nOs [counties|E] dentro de uma $game_concept_struggle_region$ geralmente estão sujeitos a diferentes [county_modifiers|E] dependendo da atual [struggle_phase_phase|E]."
 game_concept_struggle_region_region:0 "Região"
 game_concept_struggle_region_regions:0 "Regiões"
 game_concept_struggle_struggles:0 "Conflitos"
 game_concept_struggle_struggles_possessive:0 "do Conflito"
 game_concept_struggle_uninvolved:0 "Não Envolvido"
 game_concept_struggle_uninvolved_desc:0 "Para que um [character|E] seja considerado $game_concept_struggle_uninvolved$ em um [struggle|E] específico, ele precisa apenas ter sua [capital|E] fora da [struggle_region|E].\n\nIsso significa que ele é considerado um estrangeiro, alguém que não tem um grande interesse nas [struggle_phase_phases|E] em andamento e que #EMP não#! deveria, porque claramente não entenderia as nuances locais.\n\nComo uma das únicas coisas em que as pessoas dentro de um $game_concept_struggle$ concordam é que $game_concept_characters$ [Concept('struggle_uninvolved', 'Não Envolvidos')|E] não têm negócios em suas terras, os [rulers|E] [Concept('struggle_uninvolved', 'Não Envolvidos')|E] geralmente recebem penalidades rigorosas em quaisquer [counties|E] que possuam dentro de uma $game_concept_struggle_region$."
