l_spanish:
 council_of_toledo_decision_catalyst_tt:0 "Um [struggle_catalyst|E] pode ocorrer"
 council_of_toledo_decision_confirm:0 "Chegou a hora."
 council_of_toledo_decision_desc:0 "Por séculos, conselhos religiosos foram realizados em [GetTitleByKey('c_toledo').GetNameNoTier], onde o clero de toda a cristandade resolveu as disputas do dia. Ao realizar um 19º conselho, essa tradição visigótica pode ser restaurada."
 council_of_toledo_decision_desc_count:0 "Chegou a hora de convocar o [SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')] Conselho de [GetTitleByKey('c_toledo').GetNameNoTier], e resolver as questões religiosas dos [ROOT.Char.GetFaith.GetAdherentNamePlural] mais uma vez."
 council_of_toledo_decision_title:0 "Convocar o Conselho de Toledo"
 council_of_toledo_decision_toledo_faith_trigger:0 "A [faith|E] é o [THIS.Char.GetLiege.GetFaith.GetName]"
 council_of_toledo_decision_toledo_holder_trigger:0 "Você [Concept('hold', 'Possui')|E] ou governa [GetTitleByKey('c_toledo').GetName], e seu [ruler|E] segue a fé do [THIS.Char.GetFaith.GetName]"
 council_of_toledo_decision_tooltip:0 "Realizar uma reunião de clérigos [ROOT.Char.GetFaith.GetReligion.GetAdjective] em Toledo"
 council_of_toledo_decision_tt:0 "As recompensas dependem do resultado do Conselho"
 council_of_toledo_ruler_effect_tt:0 "Todo [ruler|E] [council_toledo_faith.GetAdjective]"
 council_toledo_conversion_task_desc:0 "$fp2_council_conversion_modifier$"
 council_toledo_heresies_task_desc:0 "$fp2_council_heresy_modifier$"
 council_toledo_landed_desc:0 "[ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 council_toledo_unlanded_desc:0 "Arcebispo de [ROOT.Char.GetLiege.GetPrimaryTitle.GetNameNoTier]"
 excluded_from_council_toledo_tt:0 "Todos os outros [heads_of_faith|E] [THIS.Char.GetFaith.GetReligion.GetAdjective] em [diplomatic_range|E]"
 fervor_gain_council_toledo:0 "$fp2_small_council_modifier$"
 found_kingdom_toledo_capital_tt:0 "[GetTitleByKey('c_toledo').GetNameNoTier] é sua [realm_capital|E]"
 found_kingdom_toledo_culture_tt:0 "Sua [culture|E] tem a [heritage|E] ibérica"
 found_kingdom_toledo_decision_confirm:0 "Toledo é o coração da Ibéria!"
 found_kingdom_toledo_decision_desc:0 "Desde a queda do reino visigodo para os mouros, [GetTitleByKey('c_toledo').GetNameNoTier] tem sido relegada. Como a capital de um novo reino [ROOT.Char.GetFaith.GetAdjective], ela será mais uma vez um assento de reis."
 found_kingdom_toledo_decision_title:0 "Estabelecer Reino de Toledo"
 found_kingdom_toledo_decision_tooltip:0 "Estabelecer um novo [kingdom|E] [GetFaithByKey('mozarabic_church').GetAdjective] baseado em [GetTitleByKey('k_toledo').GetNameNoTier]"
 found_kingdom_toledo_duchy_tt:0 "Você [Concept('hold', 'Possui')|E] e [completely_controls|E] qualquer [duchy|E] [de_jure|E] que faça fronteira com [GetTitleByKey('d_toledo').GetName], e que faz parte de um [kingdom|E] com mais de dois [duchies|E] [de_jure|E]"
 found_kingdom_toledo_faith_tt:0 "Sua [faith|E] é [GetFaithByKey('mozarabic_church').GetName], ou foi criada a partir dela"
 fp2_big_council_modifier:0 "$fp2_small_council_modifier$"
 fp2_big_council_modifier_desc:0 "Um grande conselho de prelados foi realizado em Toledo, trazendo grande prosperidade para a cidade."
 fp2_council_conversion_modifier:0 "Conselho de Conversão"
 fp2_council_conversion_modifier_desc:0 "O último Conselho de Toledo encorajou a conversão de infiéis em reinos moçárabes."
 fp2_council_conversion_modifier_tt:0 "A conversão da fé no condado progredirá mais rapidamente contra outras [religions|E] enquanto este modificador estiver presente"
 fp2_council_culture_tt:0 "As [cultures|E] ibéricas ganham #positive_value [SCOPE.ScriptValue('council_toledo_culture_acceptance_value')|0]#! [cultural_acceptance|E] da [THIS.Char.GetCulture.GetName]"
 fp2_council_end_tt:0 "O [SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] Conselho de Toledo termina"
 fp2_council_heresies_modifier_tt:0 "Converter a Fé no Condado avançará mais rápido contra [faiths|E] de mesma [religion|E] com um [head_of_faith|E] enquanto este modificador estiver presente"
 fp2_council_heresy_modifier:0 "Conselho da Inquisição"
 fp2_council_heresy_modifier_desc:0 "O último Conselho de Toledo encorajou a erradicação de heresias que surgiram na Ibéria."
 fp2_council_hof_modifier:0 "Conselho de Liderança"
 fp2_council_hof_modifier_desc:0 "O último Conselho de Toledo encorajou os moçárabes a nomearem seu próprio líder da fé."
 fp2_council_opinion_mozarabic_effect_tt:0 "Cada participante moçárabe"
 fp2_council_opinion_other_effect_tt:0 "Cada participante não moçárabe"
 fp2_council_pope_modifier:0 "Conselho de Cooperação"
 fp2_council_pope_modifier_desc:0 "O último Conselho de Toledo encorajou a cooperação entre moçárabes e o mundo cristão em geral."
 fp2_council_reform_modifier:0 "Conselho de Reforma"
 fp2_council_reform_modifier_desc:0 "O último Conselho de Toledo encorajou a reforma da igreja moçárabe diante de seu novo poder."
 fp2_council_rights_modifier:0 "Conselho dos Direitos"
 fp2_council_rights_modifier_desc:0 "O último Conselho de Toledo encorajou a proteção dos direitos clericais e a reparação das igrejas."
 fp2_council_toledo_culture_acceptance_desc:0 "$fp2_small_council_modifier$"
 fp2_council_toledo_new_hof_opinion:0 "$fp2_council_hof_modifier$"
 fp2_council_toledo_opinion:0 "$fp2_small_council_modifier$"
 fp2_council_toledo_pope_opinion:0 "$fp2_council_pope_modifier$"
 fp2_council_tolerance_modifier:0 "Conselho de Tolerância"
 fp2_council_tolerance_modifier_desc:0 "O último Conselho de Toledo encorajou a tolerância entre as religiões da Ibéria."
 fp2_disappointing_council_modifier:0 "$fp2_small_council_modifier$"
 fp2_disappointing_council_modifier_desc:0 "Um conselho de prelados com pouca participação foi realizado em Toledo, custando aos comerciantes da cidade."
 fp2_excluded_from_council_toledo_opinion:0 "Excluído de Toledo"
 fp2_form_kingdom_toledo_modifier:0 "$fp2_other_decisions.1100.t$"
 fp2_form_kingdom_toledo_modifier_desc:0 "Este personagem estabeleceu um novo reino centrado na antiga capital visigoda."
 fp2_other_decisions.0700.19:0 "[council_priest.GetTitledFirstName] iniciou os preparativos para um décimo nono conselho religioso em [GetTitleByKey('c_toledo').GetNameNoTier], para corresponder aos sínodos visigodos antigos.\n\nEmbora o alcance do [GetTitleByKey('k_papal_state').GetDefinitiveName] tenha crescido desde a invasão moura, nosso clero ainda mantém sua própria tradição e autonomia. É hora de reafirmar a importância da Península Ibérica como um local de diálogo religioso.\n\nAs reuniões anteriores incluíram [ROOT.Char.GetFaith.BishopNeuterPlural] de toda a cristandade, mas isso não precisa mais ser o caso..."
 fp2_other_decisions.0700.a:0 "Será um sínodo moçárabe."
 fp2_other_decisions.0700.b.failure:0 "O chamado para Toledo é ignorado"
 fp2_other_decisions.0700.b.success:0 "Bispos ecumênicos comparecem"
 fp2_other_decisions.0700.b:0 "Todos os ministros de [ROOT.Char.GetFaith.HighGodNamePossessive] são bem-vindos em Toledo."
 fp2_other_decisions.0700.council:0 "[SCOPE.ScriptValue('council_of_toledo_counter_value')][ROOT.Char.Custom('get_council_of_toledo_count_suffix')] Conselho de Toledo"
 fp2_other_decisions.0700.desc:0 "Os [ROOT.Char.GetFaith.BishopNeuterPlural] da Ibéria estão ansiosos para o próximo concílio desde que a tradição de Toledo foi revivida.\n\n[council_priest.GetCouncilTitleFirstName] começou os preparativos, embora ainda precise ser decidido se padres de outras tradições serão convidados a participar."
 fp2_other_decisions.0700.t:0 "$fp2_other_decisions.0700.council$: Organização"
 fp2_other_decisions.0700.tt:0 "O [SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] Concílio de Toledo começará em algumas semanas."
 fp2_other_decisions.0701.a:0 "Excelente."
 fp2_other_decisions.0701.b:0 "A arrogância vem antes da queda..."
 fp2_other_decisions.0701.bad_bishop:0 "\n\nUm dos mais conhecidos é [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], cuja impiedade é motivo de piada em toda a Cristandade."
 fp2_other_decisions.0701.c:0 "Bom."
 fp2_other_decisions.0701.desc:0 "\n\nA cidade fortificada já está colhendo os benefícios da visita dos clérigos, cujo comércio e hospitalidade são procurados pelos comerciantes."
 fp2_other_decisions.0701.failure:0 "\n\nOs comerciantes da cidade fortificada estão desapontados com a baixa participação, tendo se preparado para a visita de um grande número de clérigos. Uma pena."
 fp2_other_decisions.0701.opening.catastrophe:0 "Não vimos um único bispo, diácono ou abade de qualquer outra denominação [ROOT.Char.GetFaith.GetReligion.GetAdjective] em [GetTitleByKey('c_toledo').GetNameNoTier]; parece que nosso concílio é visto com desprezo ou raiva por nossa fraternidade ecumênica, e apenas prelados locais estão presentes."
 fp2_other_decisions.0701.opening.failure:0 "A resposta ao nosso convite para a comunidade ecumênica foi fria; inúmeros [ROOT.Char.GetFaith.BishopNeuterPlural] citaram más condições climáticas que os impediram de chegar a [GetTitleByKey('c_toledo').GetNameNoTier], deixando apenas prelados locais presentes."
 fp2_other_decisions.0701.opening.success:0 "Parece que o convite para a comunidade ecumênica mais ampla foi bem recebido; muitos estimados [ROOT.Char.GetFaith.BishopNeuterPlural] de terras estrangeiras se reuniram ansiosamente em [GetTitleByKey('c_toledo').GetNameNoTier]."
 fp2_other_decisions.0701.opening:0 "Os grandes e bons desceram sobre [GetTitleByKey('c_toledo').GetNameNoTier], representando todas as sés e abadias dos [ROOT.Char.GetFaith.GetAdherentNamePlural]."
 fp2_other_decisions.0701.powerful_bishop:0 "\n\nTalvez o mais notável entre eles seja [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], um prelado [portrait_bishop.GetFaith.GetAdjective] influente."
 fp2_other_decisions.0701.religious_head_bishop:0 "\n\nEntre os prelados humildes está [portrait_bishop.GetTitledFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], líder da igreja [portrait_bishop.GetFaith.GetAdjective]."
 fp2_other_decisions.0701.saint_bishop:0 "\n\nOs presentes são abençoados por ter entre eles [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], um santo [portrait_bishop.GetFaith.GetAdjective]!"
 fp2_other_decisions.0701.senior_bishop:0 "\n\nO mais antigo de todos os clérigos é [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], um venerável [portrait_bishop.GetWomanMan] da Igreja. "
 fp2_other_decisions.0701.t:0 "$fp2_other_decisions.0700.council$: Participantes"
 fp2_other_decisions.0701.theologian_bishop:0 "\n\nDestaque entre eles é [portrait_bishop.GetFirstName], [portrait_bishop.Custom('get_council_of_toledo_attendee_description')], um teólogo [portrait_bishop.GetFaith.GetAdjective] amplamente respeitado."
 fp2_other_decisions.0701.tt:0 "O [SCOPE.ScriptValue('council_of_toledo_counter_value')][THIS.Char.Custom('get_council_of_toledo_count_suffix')] Concílio de Toledo começa"
 fp2_other_decisions.0702.19:0 "Séculos após o último concílio do Arcebispo Gunderic sob o Rei Wittiza, [council_priest.GetCouncilTitleFirstName] restaurou nossa tradição ao abrir o décimo nono encontro na lendária [GetTitleByKey('c_toledo').GetNameNoTier].\n\n"
 fp2_other_decisions.0702.a:0 "Eu não poderia concordar mais."
 fp2_other_decisions.0702.b.hof:0 "Não é a vontade de [ROOT.Char.GetFaith.HighGodNamePossessive]."
 fp2_other_decisions.0702.b:0 "[debate_bishop.GetSheHe|U] será silenciado."
 fp2_other_decisions.0702.closing:0 "enquanto [counter_bishop.GetTitledFirstName|U] de [counter_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] contestava vigorosamente os seus argumentos."
 fp2_other_decisions.0702.conversion:0 "Um tema dominante que surgiu foi que a conversão de hereges e infiéis é a única maneira de garantir a paz e proteger os [ROOT.Char.GetFaith.GetAdherentNamePlural] rapidamente."
 fp2_other_decisions.0702.heresy:0 "Uma energia urgente tomou conta das discussões, à medida que a ameaça representada pelos [heretic_faith.GetAdherentNamePlural], hereges como os Priscilianos e Arianos do passado, foi abordada."
 fp2_other_decisions.0702.hof:0 "Surpreendentemente, a sensação de que os [ROOT.Char.GetFaith.GetAdherentNamePlural] precisavam de seu próprio líder espiritual foi a maior preocupação de muitos de nossos bispos."
 fp2_other_decisions.0702.opening:0 "Outro concílio começou em [GetTitleByKey('c_toledo').GetNameNoTier], desta vez aberto por [council_priest.GetCouncilTitleFirstName].\n\n"
 fp2_other_decisions.0702.pope:0 "Um clima de colaboração surgiu, com muitos bispos argumentando por mais cooperação entre os [ROOT.Char.GetFaith.GetAdherentNamePlural] e seus irmãos ecumênicos."
 fp2_other_decisions.0702.present:0 "\n\nAo fim da semana, ficou rapidamente claro que [debate_bishop.GetTitledFirstName] de [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] tinha a atenção do grupo sobre o assunto, $fp2_other_decisions.0702.closing$"
 fp2_other_decisions.0702.reform:0 "O tema principal foi que os [ROOT.Char.GetFaith.GetAdherentNamePlural] não devem ter medo de grandes reformas, agora que a posição da igreja ibérica está segura."
 fp2_other_decisions.0702.rights:0 "O tema principal foi a preocupação em proteger os antigos direitos do clero [ROOT.Char.GetFaith.GetAdjective] e restaurar igrejas."
 fp2_other_decisions.0702.second_hand:0 "\n\nAo final das discussões, ficou claro que [debate_bishop.GetTitledFirstName] de [debate_bishop.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip] é visto como o líder dessa visão, $fp2_other_decisions.0702.closing$"
 fp2_other_decisions.0702.t:0 "$fp2_other_decisions.0700.council$: Debate"
 fp2_other_decisions.0702.tolerance:0 "O tema dominante foi que os [ROOT.Char.GetFaith.GetAdherentNamePlural] devem ser mais tolerantes com infiéis pacíficos, uma ideia que rapidamente se tornou o foco das discussões."
 fp2_other_decisions.0703.a:0 "Decepcionante."
 fp2_other_decisions.0703.control:0 "Com a perda de [GetTitleByKey('c_toledo').GetNameNoTier], não será mais possível sediar o próximo Conselho de Toledo..."
 fp2_other_decisions.0703.desc:0 "\n\nOs [ROOT.Char.GetFaith.GetAdherentNamePlural] sem dúvida logo se recuperarão deste contratempo..."
 fp2_other_decisions.0703.t:0 "$fp2_other_decisions.0700.council$: Adiado"
 fp2_other_decisions.0703.war:0 "Com o início da guerra, [council_priest.GetCouncilTitleFirstName] adiou o próximo Conselho de Toledo por enquanto."
 fp2_other_decisions.0704.a:0 "Interessante."
 fp2_other_decisions.0704.failure:0 "No entanto, parece que [council_toledo_host.GetTitledFirstName] tinha outras ideias e lutou vigorosamente contra essas aberturas."
 fp2_other_decisions.0704.success:0 "\n\nCom o apoio de [council_toledo_host.GetTitledFirstNamePossessive], o clero [ROOT.Char.GetFaith.GetAdherentName] fez-se ouvir."
 fp2_other_decisions.0704.t:0 "$fp2_other_decisions.0700.council$"
 fp2_other_decisions.1000.a:0 "Era necessário sangue novo na Península Ibérica."
 fp2_other_decisions.1000.closing:0 "\n\nCom o tempo, eles verão que o tempo de seus deuses falsos acabou e se alegrarão que [ROOT.Char.GetFaith.HighGodName] liderou [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] para a salvação da região."
 fp2_other_decisions.1000.desc:0 "As fé e os povos divididos da Península Ibérica nos deram uma grande oportunidade, ocupados demais lutando uns contra os outros para se opor à invasão [ROOT.Char.GetFaith.GetReligion.GetAdjective] na península."
 fp2_other_decisions.1000.involved_faith:0 "Somos os defensores legítimos dos [ROOT.Char.GetFaith.GetAdherentNamePlural] do oeste, agora seguros sob a proteção de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]."
 fp2_other_decisions.1000.involved_religion:0 "As guerras dos principados fracturados de Iberia quase trouxeram os reinos [ROOT.Char.GetFaith.GetReligion.GetAdjective] da região para os seus joelhos.\n\nSem a nossa intervenção, os fiéis [ROOT.Char.GetFaith.HighGodNamePossessive] teriam sido eventualmente expulsos da península pelos infiéis imperiosos.\n\n"
 fp2_other_decisions.1000.t:0 "$secure_iberian_foothold_decision_title$: Consolidação [iberian_footholder.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 fp2_other_decisions.1000.uninvolved_faith:0 "Cabe a nós trazer a luz do [ROOT.Char.GetFaith.GetName]; como parte de [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], essas terras serão prósperas e pacíficas mais uma vez."
 fp2_other_decisions.1001.a:0 "Malditos intrometidos."
 fp2_other_decisions.1001.closing:0 "\n\nEnquanto [iberian_footholder.GetTitledFirstName] consolida suas propriedades, as diferenças passadas entre muçulmanos e cristãos parecem pálidas em comparação com essa ocupação [iberian_footholder.GetFaith.GetAdjective]..."
 fp2_other_decisions.1001.desc:0 "Através da distração, inveja e negligência, permitimos que os intrometidos imperiosos [iberian_footholder.GetPrimaryTitle.GetAdjective] explorassem a divisão de nossa terra natal e invadissem os reinos históricos da península."
 fp2_other_decisions.1001.involved_faith:0 "[iberian_footholder.GetTitledFirstName] declarou-se o líder legítimo [iberian_footholder.GetFaith.GetAdjectiveNoTooltip] da península, usando suas vitórias como prova de sua legitimidade sobre os reinos doentes [iberian_footholder.GetFaith.GetReligion.GetAdjective] da Península Ibérica."
 fp2_other_decisions.1001.involved_religion:0 "Depois de séculos de guerra entre cristãos e mouros ibéricos, nossa luta agora foi explorada pelos intrometidos imperiosos [iberian_footholder.GetPrimaryTitle.GetAdjective].\n\n"
 fp2_other_decisions.1001.same_uninvolved_faith:0 "Eles afirmam que nossas falhas foram punição de [ROOT.Char.GetFaith.HighGodName] por nos afastarmos do caminho correto do [iberian_footholder.GetFaith.GetName], e que [iberian_footholder.GetTitledFirstName] é o líder legítimo da Iberia [ROOT.Char.GetFaith.GetReligion.GetAdjective]..."
 fp2_other_decisions.1001.uninvolved_faith:0 "Com suas vitórias como evidência, [iberian_footholder.GetTitledFirstName] declarou que sua fé [iberian_footholder.GetFaith.GetAdjective] é o verdadeiro caminho [iberian_footholder.GetFaith.GetReligion.GetAdjective]; um que unirá toda a península sob o [iberian_footholder.GetFaith.HighGodName]. "
 fp2_other_decisions.1100.a:0 "Que nosso reino prospere por muito tempo."
 fp2_other_decisions.1100.desc:0 "Com a força da minha posição agora além de qualquer dúvida, a coroação em [GetTitleByKey('c_toledo').GetNameNoTier] finalmente aconteceu conforme planejado.\n\n É hora de nós, [ROOT.Char.GetFaith.GetAdherentNamePlural], criarmos nosso próprio domínio, distinto das pequenas taifas e dos domínios do norte; um reino para rivalizar com o antigo reino visigodo!"
 fp2_other_decisions.1100.t:0 "O Reino de Toledo"
 fp2_other_decisions.1101.a:0 "Eles não durarão muito!"
 fp2_other_decisions.1101.b:0 "Algo para ficar de olho."
 fp2_other_decisions.1101.c:0 "Interessante."
 fp2_other_decisions.1101.desc:0 "Crescendo em força, [toledo_former.GetTitledFirstName] foi formalmente coroado em [GetTitleByKey('c_toledo').GetNameNoTier].\n\nA força deste novo reino [toledo_former.GetFaith.GetAdjective], incorporando as terras dos antigos domínios da Ibéria, agora está além de qualquer dúvida.\n\n"
 fp2_other_decisions.1101.mozarab:0 "Embora isso seja promissor para nossa fé, pode ser uma espada de dois gumes..."
 fp2_other_decisions.1101.stolen:0 "Esses intrusos vexatórios terão que ser lidados mais cedo ou mais tarde!"
 fp2_secure_mediterranean.desc:0 "Com ilhas-chave em todo o Mediterrâneo seguras e atuando como torres de vigia do mar, é hora de reivindicar a propriedade das ondas."
 fp2_secure_mediterranean.t:0 "Segurar o Mediterrâneo"
 fp2_secure_mediterranean.tip:0 "Reivindique a propriedade do Mediterrâneo"
 fp2_small_council_modifier:0 "Conselho de Toledo"
 fp2_small_council_modifier_desc:0 "Um conselho local de prelados foi realizado em Toledo, trazendo prosperidade para a cidade."
 fp2_stifled_council_modifier:0 "Conselho Abafado"
 fp2_stifled_council_modifier_desc:0 "Contradizer um conselho religioso tornou esse personagem impopular entre o clero."
 fp2_struggle_phase_hostility_or_opportunity_tt:0 "A [struggle_phase|E] Ibérico é [struggle_phase_iberia_hostility|E] ou [struggle_phase_iberia_opportunity|E] (Atual: [GetStruggle('iberian_struggle').GetCurrentPhase.GetName])"
 fp2_struggle_secure_iberian_foothold_empire_dejure_effect_tt:0 "Cada [kingdom|E] [de_jure|E] de [GetTitleByKey('e_spain').GetNameNoTier] que atenda às condições abaixo se tornará uma parte [de_jure|E] do [empire|E] de [THIS.Char.GetPrimaryTitle.GetDeJureLiege.GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_empire_held_effect_tt:0 "Cada [kingdom|E] [de_jure|E] de [GetTitleByKey('e_spain').GetNameNoTier] que satisfaça as condições abaixo se tornará parte [de_jure|E] de [THIS.Char.GetPrimaryTitle.GetNameNoTier]"
 fp2_struggle_secure_iberian_foothold_empire_tt:0 "Você [Concept('hold', 'Possui')|E] um [title|E] de [empire|E] que não é [GetTitleByKey('e_spain').GetNameNoTier]"
