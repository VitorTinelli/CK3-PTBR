l_spanish:
 artifact_poetry_description:0 "Uma obra de poesia dedicada à vitória de [ROOT.Char.GetTitledFirstNamePossessive] sobre o [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] [war_memory_participant.GetTitledFirstName], escrita pelo bom amigo de [ROOT.Char.GetFirstNamePossessiveNoTooltip], [poetry_friend.GetTitledFirstName].\n\n$bp1_yearly.4020.poetry$"
 artifact_poetry_name:0 "$bp1_yearly.4020.poetry_title$"
 bp1_yearly.4000.a:0 "Se ao menos você estivesse aqui para dizer isso comigo..."
 bp1_yearly.4000.b:0 "Vou guardar esse pensamento com carinho!"
 bp1_yearly.4000.c.failure:0 "Você fica triste e desmorona em lágrimas."
 bp1_yearly.4000.c.success:0 "Sua família aprecia o gesto."
 bp1_yearly.4000.c:0 "Vou honrar sua memória com um poema!"
 bp1_yearly.4000.d:0 "[family_memory_participant.GetFirstNameNoTooltip] merece um presente por sua lealdade!"
 bp1_yearly.4000.desc.alive:0 "Memórias como essa me trazem conforto. Não importa o que aconteça, eu sei que minha família está lá por mim, e que a Casa [ROOT.Char.GetHouse.GetName] permanece forte."
 bp1_yearly.4000.desc.dead:0 "Como eu queria que você ainda estivesse aqui. Havia tantos risos para serem compartilhados, tantas diferenças para serem resolvidas, tantas memórias para serem criadas... A Casa [ROOT.Char.GetHouse.GetName] é menos por não tê-lo nela."
 bp1_yearly.4000.desc:0 "Lembro do dia em que [family_memory.GetDescription], m[Select_CString( family_memory_participant.IsFemale, 'inha', 'eu' )] [family_memory_participant.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('family_memory_participant'))]!\n\n"
 bp1_yearly.4000.desc_end:0 "\n\n#EMP \"[ROOT.Char.GetHouse.GetMotto].\"#! Sussurro baixinho."
 bp1_yearly.4000.family_first:0 "Que a Casa [ROOT.Char.GetHouse.GetNameNoTooltip] dure para sempre!"
 bp1_yearly.4000.t:0 "Um Reflexo Familiar"
 bp1_yearly.4001.a:0 "Que você descanse em paz."
 bp1_yearly.4001.b:0 "Envergonhei a sua memória!"
 bp1_yearly.4001.desc.fail_poem:0 "...não ficou muito bom, não é?"
 bp1_yearly.4001.desc.success_poem:0 "Lágrimas correm pelas bochechas dos presentes. Acho que servi bem à sua memória, [family_memory_participant.GetFirstNameNoTooltip]."
 bp1_yearly.4001.desc:0 "Com aqueles mais próximos de mim reunidos, começo a recitar:\n\n#POE [ROOT.Char.Custom('GeneratePoem_Title')]#!\n[ROOT.Char.Custom('GeneratePoem_Intro_Rhyming')]\n[ROOT.Char.Custom('GeneratePoem_Outro_Rhyming')]\n\n"
 bp1_yearly.4010.a:0 "Claro, querido(a). [proposed_guardian.GetFirstNameNoTooltip] é a melhor escolha."
 bp1_yearly.4010.a_effect:0 "[education|E] d[Select_CString( child_to_change_guardian.IsFemale, 'a', 'o' )] [child_to_change_guardian.GetFirstName] progride"
 bp1_yearly.4010.b:0 "Eu escolhi [current_guardian.GetFirstNameNoTooltip] por uma razão, [parent_that_want_guardian_change.GetWomanMan]!"
 bp1_yearly.4010.b_alt:0 "Bah! Eu tenho tempo suficiente para criar [child_to_change_guardian.GetSheHe]!"
 bp1_yearly.4010.c:0 "Minha escolha é melhor, confie em mim!"
 bp1_yearly.4010.c_effect:0 "[education|E] d[Select_CString( child_to_change_guardian.IsFemale, 'a', 'o' )] [child_to_change_guardian.GetFirstName] progride significativamente"
 bp1_yearly.4010.desc.other:0 "Aquel[Select_CString( current_guardian.IsFemale, 'a', 'e' )] [current_guardian.Custom2('InsultNoun', SCOPE.sC('parent_that_want_guardian_change'))] [current_guardian.GetFirstName] não é [Select_CString( current_guardian.IsFemale, 'uma boa guardiã', 'um bom guardião' )]. [current_guardian.GetSheHe|U] é simplesmente... #EMP [current_guardian.Custom2('InsultAdjective', SCOPE.sC('parent_that_want_guardian_change'))]!#! "
 bp1_yearly.4010.desc.root:0 "A verdade é... você está simplesmente ocupado demais para criar [child_to_change_guardian.GetSheHe]."
 bp1_yearly.4010.desc:0 "[Select_CString( ROOT.Char.IsFemale, 'Minha querida', 'Meu querido' )] [ROOT.Char.GetWifeHusband], estou preocupado com a educação de nossa [child_to_change_guardian.Custom('GetDaughterSon')] [child_to_change_guardian.GetFirstNamePossessive].\" [Select_CString( parent_that_want_guardian_change.IsFemale, 'Minha', 'Meu' )] [parent_that_want_guardian_change.GetWifeHusband] [parent_that_want_guardian_change.GetFirstName] diz, com preocupação em sua voz.\n\n"
 bp1_yearly.4010.desc_end:0 "Nosso [child_to_change_guardian.Custom('GetDaughterSon')] precisa de um guardião bom e dedicado, alguém como m[Select_CString( proposed_guardian.IsFemale, 'inha', 'eu' )] [proposed_guardian.Custom('ComplimentAdjective')] [child_to_change_guardian.Custom2('RelationToMeShort', SCOPE.sC('proposed_guardian'))] [proposed_guardian.GetFirstName]!\" continua [parent_that_want_guardian_change.GetSheHe|U].\n\n\"Devo providenciar as coisas?\" pergunta [parent_that_want_guardian_change.GetSheHe|U] olhando para mim esperançoso."
 bp1_yearly.4010.t:0 "Um Melhor Guardião"
 bp1_yearly.4020.a:0 "Eu farei com que seja recitado para a [ROOT.Char.Custom('GetCourt')]!"
 bp1_yearly.4020.a_effect:0 "[newly_created_artifact.GetName] é transformado em um [court_artifact|E] e ganhará um modificador [grandeur|E]"
 bp1_yearly.4020.b:0 "Obrigado, meu amigo. Vou guardar este poema com carinho."
 bp1_yearly.4020.b_effect:0 "Você ganha o [artifact|E] [newly_created_artifact.GetName]"
 bp1_yearly.4020.c:0 "Hah! Vou enviar uma cópia para todos que [war_memory_participant.GetFirstNameNoTooltip] conhece!"
 bp1_yearly.4020.d:0 "Isso é demais, somente [ROOT.Char.GetFaith.HighGodName] merece tal louvor."
 bp1_yearly.4020.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip], meu querido amigo, eu mais uma vez lembrei da sua vitória contra [war_memory_participant.GetTitledFirstName] — então decidi escrever um poema sobre o seu triunfo!\" diz [poetry_friend.GetFirstName], limpando a garganta:\n\n[poetry_artifact.GetName]\n[poetry_artifact.GetDesc]"
 bp1_yearly.4020.poetry:0 "[poetry_friend.Custom('GeneratePoem_Intro_Rhyming')]\n[poetry_friend.Custom('GeneratePoem_Outro_Rhyming')]"
 bp1_yearly.4020.poetry_title:0 "[poetry_friend.Custom('GeneratePoem_Title')]"
 bp1_yearly.4020.t:0 "Uma Amizade Poética"
 bp1_yearly.4030.a.failure:0 "[marriage_vassal.GetTitledFirstName] acha que você está contando mais mentiras"
 bp1_yearly.4030.a.success:0 "[marriage_vassal.GetTitledFirstName] está convencido e arrependido"
 bp1_yearly.4030.a:0 "Eu devo convencer [marriage_vassal.GetFirstNameNoTooltip] de como [marriage_rival.GetFirstNameNoTooltip] é traiçoeiro!"
 bp1_yearly.4030.b.failure:0 "[marriage_vassal.GetTitledFirstName] desvia dos argumentos dos [ROOT.Char.GetFaith.PriestNeuterPlural]"
 bp1_yearly.4030.b.success:0 "[marriage_vassal.GetTitledFirstName] reconhece o erro de seus caminhos"
 bp1_yearly.4030.b:0 "[marriage_vassal.GetSheHe|U] quebrou seu vínculo? Os [ROOT.Char.GetFaith.PriestNeuterPlural] choverão fogo sobre [marriage_vassal.GetSheHe] por isso!"
 bp1_yearly.4030.c:0 "Talvez [spurned_partner.GetFirstNameNoTooltip] possa ser útil..."
 bp1_yearly.4030.d:0 "Bah! Aquel[Select_CString( marriage_rival.IsFemale, 'a', 'e' )] [marriage_rival.Custom2('InsultNoun', ROOT.Char)] não conseguiu nada!"
 bp1_yearly.4030.desc:0 "\"[ROOT.Char.Custom('CulturalCurse')|U]!\" Grito ao ler a carta.\n\nEssa [marriage_rival.Custom2('InsultAdjective', ROOT.Char)] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('marriage_rival'))] minha, [marriage_rival.GetFirstName] — Eu cuspo em seu nome!"
 bp1_yearly.4030.desc_bond_broken:0 "\n\nNão só você usou truques e encantos para convencer meu vassalo [marriage_vassal.GetTitledFirstName] a se casar com você e quebrar o vínculo com [spurned_partner.GetFirstName] — não — você também virou [marriage_vassal.GetTitledFirstNameNoTooltip] contra mim!"
 bp1_yearly.4030.desc_end:0 "\n\nSua língua venenosa está espalhando mentira após mentira sobre mim... Você não ama [marriage_vassal.GetFirstNameNoTooltip], você só quer que eu sofra!#!"
 bp1_yearly.4030.desc_no_broken_bonds:0 "\n\nNão só você usou truques e encantos para convencer meu vassalo [marriage_vassal.GetTitledFirstName] a se casar com você — não — você também virou [marriage_vassal.GetTitledFirstNameNoTooltip] contra mim!"
 bp1_yearly.4030.t:0 "A Rival Sedutora"
 bp1_yearly.4040.a:0 "Eu adoraria comer seu [ROOT.Char.Custom('FavoriteTreatDemand')]!"
 bp1_yearly.4040.b:0 "Não, obrigado(a), estou bem."
 bp1_yearly.4040.c:0 "Outra mordida não faria mal..."
 bp1_yearly.4040.d:0 "Já comi o suficiente."
 bp1_yearly.4040.dead:0 "Talvez eu coma um pouco de [ROOT.Char.Custom('FavoriteTreatDemand')] em sua homenagem."
 bp1_yearly.4040.desc.dead:0 "Oh, minha querida [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))], com você indo embora os intermináveis pratos de [ROOT.Char.Custom('FavoriteTreatDemand')] vão parar, mas o alívio é um sentimento agridoce — eu preferiria tê-la ao meu lado do que ter você ido para sempre.\n\nAdeus, [kindly_grandmother.GetFirstName], que você descanse em paz."
 bp1_yearly.4040.desc.feeding.1:0 "\"[ROOT.Char.GetFirstNameNoTooltip], ver você desfrutando de minha [ROOT.Char.Custom('FavoriteTreatDemand')] me faz a pessoa mais feliz do mundo!\" [kindly_grandmother.GetFirstName] grita feliz da cozinha. \"Eu fiz uma grande quantidade extra hoje! Coma tudo agora!\"\n\n#flatulence Uurp..!#! Oh, isso nunca para... Mas não posso dizer não e magoar minha querida [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))], posso?"
 bp1_yearly.4040.desc.feeding.2:0 "\"Eu moldei este como [ROOT.Char.Custom('GetLivestockFowlIndef')]!\" Minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] [kindly_grandmother.GetFirstName] canta, trazendo mais um prato de [ROOT.Char.Custom('FavoriteTreatDemand')]. \"Olhe, está voando direto para a sua boca!\"\n\nOh, querido [ROOT.Char.GetFaith.HighGodName], isso é demais! Mas... os seus sentimentos, eu devo pensar neles..."
 bp1_yearly.4040.desc.feeding.3:0 "\"[ROOT.Char.GetFirstNameNoTooltip], onde você está? Eu cozinhei este lote de [ROOT.Char.Custom('FavoriteTreatDemand')] na manteiga!\" [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U] [kindly_grandmother.GetFirstName] sussurra, com o olhar buscando a cozinha atrás de mim.\n\nIsso está saindo do controle... #EMP O que devo fazer!?#!"
 bp1_yearly.4040.desc.feeding.4:0 "\"Quem diria que [ROOT.Char.Custom('FavoriteTreatDemand')] combina tão bem com [ROOT.Char.Custom('GetExpensiveMeal')] — seu prato favorito #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))]#! sabia, é claro!\" [kindly_grandmother.GetFirstName] grita, trazendo um prato com o prato mais horrível que já vi na minha vida. \"A janta está pronta, [ROOT.Char.GetFirstNameNoTooltip]!\"\n\nNão importa o quanto eu me esconda, [kindly_grandmother.GetSheHe] sempre me encontra! Oh, meu pobre e inchado corpo!"
 bp1_yearly.4040.desc.intro.1:0 "\"Oh, meu querido [ROOT.Char.GetFirstNameNoTooltip] — eu te amo tanto!\" Minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] [kindly_grandmother.GetFirstName] diz para mim, carregando um prato de deliciosas guloseimas. \"Eu fiz [ROOT.Char.Custom('FavoriteTreatDemand')], eu sei que é o seu favorito!\"\n\nOh, [kindly_grandmother.GetSheHe] me conhece tão bem! Claro, é abaixo da sua posição fazer essas coisas à mão, mas... quem sou eu para dizer não?"
 bp1_yearly.4040.desc.intro.2:0 "\"Mais [ROOT.Char.Custom('FavoriteTreatDemand')] para [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] grande [ROOT.Char.Custom('GirlBoy')]!\" Minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))] [kindly_grandmother.GetFirstName] berra da cozinha. \"Venha agora, coma!\"\n\nMmm, cheira maravilhosamente... apenas mais uma mordida não faria mal, certo?"
 bp1_yearly.4040.e:0 "Eu não posso magoar minha #EMP [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U]...#!"
 bp1_yearly.4040.f:0 "Eu fisicamente #EMP não posso#! comer mais uma mordida!"
 bp1_yearly.4040.family_first:0 "Oh [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))], eu prefiro apenas conversar um pouco!"
 bp1_yearly.4040.t:0 "Minha querida [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))|U]"
 distrustful:0 "Desconfiado"
 poetry_artifact_appended_desc:0 "Uma obra de poesia dedicada à vitória de [ROOT.Char.GetTitledFirstNamePossessive] sobre o [war_memory_participant.Custom2('InsultAdjective', ROOT.Char)] [war_memory_participant.GetTitledFirstName], escrita pelo bom amigo de [ROOT.Char.GetFirstNamePossessiveNoTooltip], [poetry_friend.GetTitledFirstName].\n\nEla diz:\n$artifact_poetry_description$"
