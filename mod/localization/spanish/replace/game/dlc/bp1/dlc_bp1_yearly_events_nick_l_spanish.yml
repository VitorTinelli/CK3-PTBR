l_spanish:
 bp1_yearly.5001.a:0 "Vou #bold matar #!você por essa traição!"
 bp1_yearly.5001.b:0 "Não! Eu não vou deixar!"
 bp1_yearly.5001.c:0 "AJUDA!"
 bp1_yearly.5001.desc:0 "Por que acordei? Confusamente, meu cérebro sonolento passa por uma lista mental. A noite está fria, mas não congelante, minha cama é quente e confortável e - \n\nHá uma silhueta ao pé da minha cama. Conforme se aproxima, se transforma na forma do meu [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] [sibling_murderer.GetFirstName]. Abro minha boca para apontar que o seu quarto é, na verdade, o próximo ao meu, quando noto o travesseiro em suas mãos. \n\nÉ somente graças ao brilho pálido da luz da lua que consigo ver o olhar selvagem, enlouquecido e assassino em seus olhos."
 bp1_yearly.5001.die.tt:0 "Você perde a luta"
 bp1_yearly.5001.kill.tt:0 "Você tem [sibling_murderer.GetSheHe] à sua mercê"
 bp1_yearly.5001.lose.tt:0 "Seu confronto não vai bem"
 bp1_yearly.5001.shout.tt:0 "Você grita por ajuda, esperando que alguém ouça você"
 bp1_yearly.5001.t:0 "Terrores Noturnos"
 bp1_yearly.5001.win.tt:0 "Seu confronto tem um resultado positivo"
 bp1_yearly.5002.a:0 "My own [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)]. Como você #EMP pode #!?"
 bp1_yearly.5002.desc:0 "[sibling_murderer.GetFirstName] mergulha em mim assim que [sibling_murderer.GetSheHe] me vê se mover, mas o súbito fluxo de adrenalina me dá força. [sibling_murderer.GetFirstNameNoTooltip] é interceptado na metade da cama, meu punho acertando [sibling_murderer.GetSheHe] direto na mandíbula. \n\n[sibling_murderer.GetSheHe|U] cambaleia para trás, e os golpes desorientados subsequentes que caem não conseguem me impedir de derrubá-los no chão. Sentado firmemente em cima de seu peito, um golpe brutal quebra o nariz [sibling_murderer.GetHerHim] e bate sua cabeça na pedra do chão, reduzindo a sua resistência feroz a um gemido patético. \n\nÉ nessa posição que [guard.GetFirstName] - felizmente rápido no uptake - me encontra. [sibling_murderer.GetFirstNameNoTooltip] olha para o chão de forma sombria enquanto eu explico o que aconteceu."
 bp1_yearly.5002.t:0 "$bp1_yearly.5001.t$: Ambições Negadas"
 bp1_yearly.5003.a:0 "[sibling_murderer.GetFirstNameNoTooltip]! #DIE1 N-não...#! #DIE2 [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)]...#!"
 bp1_yearly.5003.desc:0 "Estou deitado de costas, meio nu, sozinho e desarmado. [sibling_murderer.GetFirstNameNoTooltip] está em cima de mim antes mesmo de eu conseguir processar completamente o choque e a traição. Prendendo um dos meus braços debaixo de sua perna, [sibling_murderer.GetSheHe] pressiona o travesseiro no meu rosto com a mão livre, enquanto a outra agarra meu pulso se debatendo e o prende no poste da cama.\n\nO atraso entre a torção repugnante que [sibling_murderer.GetSheHe] faz para quebrar meu braço e a dor brilhante e intensa que se espalha pelo meu ombro parece durar horas. Com o meu pulso inútil e o membro fraturado se agitando desesperadamente para cima, [sibling_murderer.GetSheHe] move sua própria mão para o meu pescoço.\n\n“A coroa é #EMP minha!#!” [sibling_murderer.GetSheHe] sibila, desaparecendo da vista."
 bp1_yearly.5003.t:0 "$bp1_yearly.5001.t$: Remus"
 bp1_yearly.5004.desc:0 "[sibling_murderer.GetFirstName] avança, cobrindo a distância entre [sibling_murderer.GetSheHe] e a cabeceira da minha cama num piscar de olhos, mas é tarde demais. Meu grito de socorro já estava saindo da minha garganta quando [sibling_murderer.GetSheHe] se moveu, e mesmo com o travesseiro abafando-o, já é possível ouvir o estrondo de um par de pés se aproximando rapidamente."
 bp1_yearly.5004.guard.death:0 "\n\nA porta se escancara e, abençoadamente, está [guard.GetFirstName] lá parada. [guard.GetSheHe|U] geme e vira para gritar, mas é silenciada quando meu [sibling_murderer.Custom2('RelationToMeShort', ROOT.Char)] sibila seu nome. Só posso ouvir em horror crescente quando [sibling_murderer.GetFirstNameNoTooltip] rapidamente barganha pelo silêncio e lealdade de [guard.GetFirstNamePossessiveNoTooltip].\n\nOndas esmagadoras de pânico se levantam no meu peito quando os passos se arrastam mais uma vez, pontuados pelo clique final e terrível da fechadura da porta.#!"
 bp1_yearly.5004.guard.save:0 "\n\nA porta se abre com estrondo e lá está, abençoadamente, [guard.GetFirstName]. [guard.GetSheHe|U] geme e grita por ajuda, através da porta aberta. Momentos depois, dois guardas invadem o quarto, levantando meu assassino em potencial do chão e me afastando dele.\n\nQuanto a [sibling_murderer.GetFirstNameNoTooltip], [sibling_murderer.GetSheHe] olha sombriamente para o chão, incapaz ou não disposto a negar suas ações."
 bp1_yearly.5004.parent.death:0 "\n\nA porta se abre com estrondo e, enquadrada na entrada, está meu [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)] [sibling_parent.GetFirstName]. Meu alívio inicial lentamente se transforma em um terror frio e sombrio ao ver o sorriso retorcido em seus lábios e os olhos estreitos e malévolos, a mistura revirando meu estômago.\n\n[sibling_parent.GetSheHe|U] vira as costas e desaparece pelo corredor, como se [sibling_parent.GetSheHe] não tivesse uma preocupação no mundo, puxando a maçaneta atrás [sibling_parent.GetHerHim].\n\n#EMP “Clique.”#!"
 bp1_yearly.5004.parent.save:0 "\n\nA porta se abre com estrondo e, enquadrada na entrada, está meu [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)] [sibling_parent.GetFirstName]. Leva apenas um segundo para [sibling_parent.GetSheHe] perceber o que está acontecendo, e [sibling_parent.GetSheHe] grita por ajuda enquanto [sibling_parent.GetSheHe] joga [sibling_murderer.GetFirstNameNoTooltip] para longe de mim.\n\nEnquanto [sibling_parent.GetSheHe] segura minha cabeça em seus braços, a tentativa de fuga do meu [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] em direção à porta é impedida pela chegada de [guard.GetFirstName], que pega [sibling_murderer.GetSheHe] e o joga de volta para o quarto."
 bp1_yearly.5004.t:0 "$bp1_yearly.5001.t$: Mão Direita [guard.GetWomanMan|U]"
 bp1_yearly.5005.t:0 "Pesadelos: Luxúria pelo Poder"
 bp1_yearly.5006.a:0 "[ROOT.Char.Custom2('RelationToMeShort', sibling_parent)|U]! Você me salvou!"
 bp1_yearly.5006.t:0 "$bp1_yearly.5001.t$: Um Amor de [ROOT.Char.Custom2('RelationToMePossessive', sibling_parent)|U]"
 bp1_yearly.5007.a:0 "#DIE1 [ROOT.Char.Custom2('RelationToMeShort', sibling_parent)|U]!#! #DIE2 ...por favor!#!"
 bp1_yearly.5007.t:0 "$bp1_yearly.5001.t$: Tendências Filicidas"
 bp1_yearly.5008.a:0 "Eles nunca encontrarão o seu corpo, [sibling_murderer.GetFirstNameNoTooltip]."
 bp1_yearly.5008.b:0 "Não me desafie novamente. Entendeu?"
 bp1_yearly.5008.desc:0 "[sibling_murderer.GetFirstName] é rápido, mas fica claro instantaneamente que [sibling_murderer.GetSheHe] me subestimou fatalmente. [sibling_murderer.GetSheHe|U] salta pela sala, mas eu já estou fora da cama e me movendo, e o ímpeto de [sibling_murderer.GetFirstNamePossessiveNoTooltip] o trai quando [sibling_murderer.GetSheHe] tropeça em uma laje irregular e cai.\n\nUm passo à frente e meu pé pega [sibling_murderer.GetSheHe] se esforçando para ficar de joelhos, batendo sua cabeça contra a parede com um estalo doentio. O subsequente golpe cego do meu [ROOT.Char.Custom2('RelationToMeShort', sibling_murderer)] é descontrolado e impreciso, e eu aproveito a oportunidade para pegar minha mesa lateral.\n\n[sibling_murderer.GetFirstNameNoTooltip] se vira para encontrar uma faca pequena, mas terrivelmente afiada, em sua garganta. Pela primeira vez, posso ver verdadeiro medo nos seus olhos."
 bp1_yearly.5008.t:0 "$bp1_yearly.5001.t$: Romulus"
 bp1_yearly.5601.a.tt:0 "Espere até a noite, então parta com uma pá..."
 bp1_yearly.5601.a:0 "Eu vou mostrá-los!"
 bp1_yearly.5601.b:0 "Este é o melhor dia da minha vida!"
 bp1_yearly.5601.bodysnatcher:0 "Embora [bp1_yearly_5601_dead_nemesis.GetSheHe] agora não possa dizer uma palavra para impedi-los, eu me sinto um pouco incomodado com a ideia de que a família de [bp1_yearly_5601_dead_nemesis.GetFirstNamePossessiveNoTooltip] defenda tacitamente a sua honra.\n\nA procissão passa por mim, a caminho de enterrar o corpo."
 bp1_yearly.5601.c:0 "É hora de seguir em frente."
 bp1_yearly.5601.notinsane:0 "As carrancas que recebo dos enlutados apenas fazem meu sorriso ficar ainda mais largo. Eu me viro para partir, e os olhos de um jovem mendigo se arregalam tanto quanto meu sorriso quando eu alegremente lhe jogo uma moeda de tal valor que toda a sua família comerá bem por semanas."
 bp1_yearly.5601.start:0 "Que dia delicioso! O vento é refrescante, o sol está quente, os insetos cantam alegremente na vegetação rasteira. Tudo parece brilhante e vívido, e tudo isso porque aquele [bp1_yearly_5601_dead_nemesis.Custom2('InsultAdjective', ROOT.Char)] [bp1_yearly_5601_dead_nemesis.Custom2('InsultNoun', ROOT.Char)] [bp1_yearly_5601_dead_nemesis.GetFirstName] está finalmente, abençoadamente morto!\n\nNão consigo conter meu sorriso enquanto uma fila de amigos e familiares [bp1_yearly_5601_dead_nemesis.GetHerHim] passa por mim, a caminho de se despedir pela última vez."
 bp1_yearly.5601.t:0 "Vida em Cores"
 bp1_yearly.5602.a:0 "Vou fazer você útil, por uma vez."
 bp1_yearly.5602.b:0 "[ROOT.Char.GetFaith.HighGodName] tem a sua alma. Porcos terão a sua cabeça!"
 bp1_yearly.5602.desc:0 "O ar da noite paira quieto e silencioso. O único barulho que pode ser ouvido é o som do meu enxadão, desalojando a terra recém-cavada com facilidade. Lentamente, o monte ao lado da cova cresce e o corpo de [bp1_yearly_5601_dead_nemesis.GetFirstName] é exposto mais uma vez ao ar fresco do qual havia sido separado há pouco tempo.\n\nEu arranco o pano que cobre o seu rosto. Seus lábios estão abertos, em um sorriso distorcido, e a sujeira ainda gruda úmida em seu pescoço enquanto eu a observo de forma impassível.\n\nAgarrando novamente o enxadão, eu o alinho com aquele mesmo pescoço. O metal, afiado por minha própria mão mais cedo, está afiado em uma borda malvada. Uma pancada, duas pancadas, três..."
 bp1_yearly.5602.t:0 "Avançando na Vida"
 bp1_yearly.5701.a:0 "[friend_spouse.GetSheHe|U] não nos manterá afastados por mais tempo!"
 bp1_yearly.5701.b:0 "Talvez eu possa fazê-los ver o erro de seus caminhos..."
 bp1_yearly.5701.c:0 "Eu suponho que ambos seguimos em frente?"
 bp1_yearly.5701.desc.ending:0 "\n\nQue tempos tivemos! Se ao menos aquel[Select_CString( friend_spouse.IsFemale, 'a', 'e' )] miserável, [friend_spouse.Custom2('InsultAdjective', ROOT.Char)] [friend_spouse.GetFirstNameNoTooltip] não nos impedisse de vivenciar isso novamente..."
 bp1_yearly.5701.desc.ladsladslads:0 "saíamos por aí, bebendo a melhor [ROOT.Char.Custom('RegionalDrink')] até vomitarmos, e depois fazíamos tudo de novo na noite seguinte!"
 bp1_yearly.5701.desc.nodrinky:0 "tínhamos uma ótima noite assistindo os bêbados locais caindo e se envergonhando!"
 bp1_yearly.5701.desc:0 "Tenho certeza de que o relacionamento de [married_friend.GetFirstNamePossessive] com seu cônjuge [friend_spouse.GetFirstName] é muito feliz e produtivo, mas ultimamente [married_friend.GetSheHe] tem cada vez menos tempo para passar comigo, um amigo querido, à medida que o relacionamento deles se aprofunda. Toda vez que tento tirar [married_friend.GetSheHe] para pelo menos uma caminhada, [married_friend.GetSheHe] aparentemente está preso a deveres conjugais.\n\nSinto falta dos velhos tempos em que nós"
 bp1_yearly.5701.t:0 "Saindo para se divertir?"
 bp1_yearly.5701.tt.critical_failure:0 "Você foi longe demais"
 bp1_yearly.5701.tt.critical_success:0 "O relacionamento está irreparavelmente quebrado"
 bp1_yearly.5701.tt.failure:0 "Nenhum deles está feliz com você"
 bp1_yearly.5701.tt.success:0 "Uma cunha é colocada entre eles"
 bp1_yearly.5702.a.tt.failure:0 "Você é tão inepto que [skilful_friend.GetFirstNameNoTooltip] desiste de frustração"
 bp1_yearly.5702.a.tt.neutral:0 "Você não aprende nada útil, mas agradece a [skilful_friend.GetFirstNameNoTooltip] pelo esforço"
 bp1_yearly.5702.a.tt.success:0 "[skilful_friend.GetFirstNameNoTooltip] ensina a você os caminhos dele(a)"
 bp1_yearly.5702.a:0 "Me ensine, [skilful_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.5702.b.tt.failure:0 "Você perde o concurso"
 bp1_yearly.5702.b.tt.success:0 "Você ganha o concurso"
 bp1_yearly.5702.b:0 "Eu acho que sou tão bom quanto eles!"
 bp1_yearly.5702.c:0 "Eu nunca estarei no nível [skilful_friend.GetSheHe]!"
 bp1_yearly.5702.desc:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('skilful_friend'))] [skilful_friend.GetFirstName] é tão talentoso!\n\n"
 bp1_yearly.5702.diplomacy:0 "Quando [skilful_friend.GetSheHe] fala, as pessoas penduram em cada palavra dita. Sua língua rápida e habilidosa adoça palavras de modo que até mesmo os mais cínicos e irritados não podem deixar de ser encantados por elas. Estou verdadeiramente convencido de que [skilful_friend.GetSheHe] poderia vender madeira para uma floresta!"
 bp1_yearly.5702.ending:0 "\n\nTalvez eu pudesse pedir a [skilful_friend.GetSheHe] algumas dicas e truques nessa área de especialização?"
 bp1_yearly.5702.fallback:0 "FALLBACK"
 bp1_yearly.5702.intrigue:0 "De todas as pessoas que eu odiaria ter como inimigo, [skilful_friend.GetFirstNamePossessiveNoTooltip] está certamente em algum lugar próximo ao topo da lista. Um mestre manipulador e brilhante conspirador, as suas habilidades são tão habilidosas em roubar um doce de uma empregada doméstica quanto em lançar as bases para a queda de dinastias."
 bp1_yearly.5702.learning:0 "Sua mente como erudito é verdadeiramente imensa, e raramente rivalizada por qualquer outro em meu [ROOT.Char.Custom('GetCourt')]. Sua compreensão das questões filosóficas e teológicas permite que [skilful_friend.GetSheHe] debata em pé de igualdade com os líderes religiosos mais santos e sábios, e eu ainda não vi [skilful_friend.GetSheHe] vacilar quando confrontado com uma questão da mente. Mesmo agora, posso ouvir [skilful_friend.GetSheHe] em outro [ROOT.Char.Custom('GetRoom')], discorrendo sobre um assunto obscuro com toda a habilidade e facilidade de um mestre artesão com décadas de experiência."
 bp1_yearly.5702.martial:0 "A imensa acuidade tática contida na mente [skilful_friend.GetHerHim] colocaria os melhores comandantes do mundo em vergonha. Com uma habilidade aparentemente inata de identificar e explorar fraquezas no campo de batalha, [skilful_friend.GetFirstNameNoTooltip] é um grande ativo para qualquer [ROOT.Char.GetLadyLord] que saiba da importância da guerra."
 bp1_yearly.5702.prowess:0 "Reconhecido em todo o país como um lutador verdadeiramente brilhante, sua habilidade com a espada não é questionada por ninguém. Observar a maneira como [skilful_friend.GetSheHe] ataca um boneco de treinamento no pátio com toda a vigor e graça de um verdadeiro mestre seria suficiente para intimidar até mesmo o mais astuto dos duelistas."
 bp1_yearly.5702.stewardship:0 "Dizer que [skilful_friend.GetSheHe] tem talento para lidar com dinheiro seria um eufemismo. Quando [skilful_friend.GetSheHe] está encarregad[Select_CString( skilful_friend.IsFemale, 'a', 'o' )] das finanças, nem uma única moeda escapa à atenção [skilful_friend.GetHerHim], realizando verdadeiros milagres ao equilibrar os números."
 bp1_yearly.5702.t:0 "Performance Virtuosa"
 bp1_yearly.5703.a.tt.criticalfailure:0 "[rival_lover.GetSheHe|U] não mostra misericórdia"
 bp1_yearly.5703.a.tt.failure:0 "[rival_lover.GetFirstNameNoTooltip] te fere"
 bp1_yearly.5703.a.tt.success:0 "Você convence [rival_lover.GetSheHe] a deixá-lo falar"
 bp1_yearly.5703.a:0 "NÃO! Por favor, deixe-me falar!"
 bp1_yearly.5703.b.tt.failure:0 "Você não é tão bom na cama"
 bp1_yearly.5703.b.tt.success:0 "Seus poderes de sedução salvam você"
 bp1_yearly.5703.b:0 "Espere! Você não quer mais disso?"
 bp1_yearly.5703.c:0 "Deixe-me mostrar por que isso é uma má ideia ..."
 bp1_yearly.5703.desc:0 "Eu estou deitado(a) de costas, ofegante e suado(a). [rival_lover.GetFirstName], minha conquista sexual da noite, está estirada languidamente ao meu lado. Quem diria que rivais tão amargos poderiam ser amantes tão... #compatíveis_emocionalmente#!?\n\n\"Feche seus olhos\", [rival_lover.GetFirstNameNoTooltip] diz maliciosamente, com um sorriso brincalhão nos cantos da boca. Eu cedo, minhas mãos dobradas acima da cabeça enquanto eu me banho no brilho pós-coito. De repente, sinto o frio do aço das algemas em meus pulsos, fazendo meus olhos se abrirem rapidamente para ver meu amante escalando a mesa de cabeceira.\n\n\"Esperei por isso por muito, muito tempo\", [rival_lover.GetSheHe] sibila. A luz da lua brilha na lâmina da faca."
 bp1_yearly.5703.t:0 "Estranhos Companheiros de Cama"
 bp1_yearly.5704.a:0 "Espero ver #EMP muito #!mais de você, [seduced_rival.GetFirstNameNoTooltip]."
 bp1_yearly.5704.b:0 "Isso é ridículo!"
 bp1_yearly.5704.desc:0 "[seduced_rival.GetFirstName] está em minha [ROOT.Char.GetChamber] mais uma vez, tagarelando sobre alguma bobagem a respeito de como eu prejudiquei [seduced_rival.GetSheHe]. Os olhos [seduced_rival.GetHerHim|U] estão em chamas enquanto [seduced_rival.GetSheHe] amaldiçoa meu nome mais uma vez, e a cólera [seduced_rival.GetHerHim] só aumenta enquanto eu desvio sua raiva com uma escandalosa sacudida de cabeça.\n\nEnquanto [seduced_rival.GetSheHe] continua a me censurar, mesmo enquanto eu respondo com provocações em retorno, pego-me considerando novamente os olhos [seduced_rival.GetHerHim]. Não muito tempo depois de sair daquela pequena reverie, percebo que meu olhar se desvia para a curva da mandíbula [seduced_rival.GetHerHim], tão notavelmente distendida pela raiva. Inconscientemente hipnotizado, percebo como o peito [seduced_rival.GetHerHim] se ergue de forma convidativa enquanto [seduced_rival.GetSheHe] continua sua tirada, e-\n\nO que #EMP eu me meti?#!"
 bp1_yearly.5704.t:0 "Justo quando [seduced_rival.GetSheHe|U] está com raiva"
 bp1_yearly.5705.a.tt:0 "Essa opção está disponível devido à notável atratividade de [lover_rival.GetFirstNamePossessiveNoTooltip]."
 bp1_yearly.5705.a:0 "Mas... você já #EMP viu #![lover_rival.GetSheHe]?! "
 bp1_yearly.5705.b:0 "Você simplesmente não entende nosso relacionamento!"
 bp1_yearly.5705.c:0 "Eu sei, eu sei. Você está certo."
 bp1_yearly.5705.desc:0 "Talvez eu tenha ficado um pouco satisfeito comigo mesmo ultimamente? Certamente, parece ser o que levou [concerned_friend.GetFirstName] a agir exasperado. Meu amigo me encurralou e confrontou sobre meu relacionamento complexo com [lover_rival.GetFirstName].\n\n\"Você está sendo absolutamente ridículo!\" [concerned_friend.GetSheHe] afirma de forma plana. Claramente irritado com minha postura sonhadora pós-coito, [concerned_friend.GetSheHe] estende um dedo e me cutuca no peito. \"Você #EMP sabe #!que nada de bom vai sair disso! Você está se preparando para uma queda, e você sabe disso!\""
 bp1_yearly.5705.t:0 "[lover_rival.GetSheHe|U] não vale a pena!"
 bp1_yearly.5706.a.tt:0 "O esquema de sedução terá uma chance aumentada de sucesso"
 bp1_yearly.5706.a:0 "Seria rude não responder à altura..."
 bp1_yearly.5706.b:0 "Eu não toco no sangue daquela imundície!"
 bp1_yearly.5706.desc:0 "Enquanto caminho por [meeting_county.GetProvince.GetCounty.GetName], encontro [rival_parent.Custom2('MyCharacterIntroduction', ROOT.Char)] apressando-se em minha direção. Ultimamente, temos trocado insultos ferozes sempre que possível. Assim, espero que [rival_parent.GetSheHe] dispare alguma asneira pútrida, mas [rival_parent.GetFirstNameNoTooltip] simplesmente passa por mim em silêncio.\n\nSó então percebo alguém seguindo [rival_parent.GetFirstNamePossessiveNoTooltip]: S[Select_CString( rival_child.IsFemale, 'ua', 'eu' )] [rival_child.Custom('GetDaughterSon')], [rival_child.GetFirstName]. [rival_child.GetSheHe|U] me lança um sorriso com uma sutil arqueada de sobrancelha, antes de apressar-se para acompanhar s[Select_CString( rival_child.IsFemale, 'ua', 'eu' )] [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))].\n\nObservo a dupla desaparecer. O que foi isso...?"
 bp1_yearly.5706.t:0 "Pecados d[Select_CString( rival_parent.IsFemale, 'a', 'o' )] [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]"
 bp1_yearly.5707.a.deviant:0 "O que diabos está acontecendo aqui em nome de [ROOT.Char.GetFaith.HighGodNamePossessive]?!"
 bp1_yearly.5707.a.doubledeviant:0 "...bem, o que me diz, [rival_parent.GetFirstNameNoTooltip]?"
 bp1_yearly.5707.a:0 "Hah! Hah! Te peguei, seu patife!"
 bp1_yearly.5707.b:0 "Por favor, [rival_child.GetFirstNameNoTooltip] e eu estamos apaixonados!"
 bp1_yearly.5707.c:0 "Você criou bem sua prole, [rival_parent.GetFirstNameNoTooltip]!"
 bp1_yearly.5707.child_deviant:0 "para minha surpresa, sorri tão amplamente quanto eu ao ver s[Select_CString( rival_parent.IsFemale, 'ua', 'eu' )] [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]. [rival_child.GetSheHe|U] me surpreende ainda mais quando, com um gesto dramático, [rival_child.GetSheHe] joga o cobertor para trás e nos expõe!\n\n\"Posso tentar te #EMP convencer a se juntar a nós,#! [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]?\""
 bp1_yearly.5707.child_dislike:0 "para minha surpresa, sorri tão amplamente quanto eu ao ver s[Select_CString( rival_parent.IsFemale, 'ua', 'eu' )] [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]. [rival_child.GetSheHe|U] ainda me abraça com força para me puxar mais para perto.\n\n\"Talvez agora você me leve a sério, #EMP [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]#!!\""
 bp1_yearly.5707.child_like:0 "soltando um grito, se apressa em cobrir seu pudor com um cobertor.\n\nExplicações são exigidas, acusações são lançadas, enquanto pai e filho berram sobre meu corpo exausto e satisfeito."
 bp1_yearly.5707.start:0 "Consigo ouvir claramente os passos trovejantes mesmo no meio da paixão, e meu rosto se contorce em um sorriso presunçoso.\n\n[rival_parent.GetFirstName|U] irrompe no [ROOT.Char.Custom('GetRoom')], e a expressão horrorizada em seu rosto é absolutamente deliciosa. [rival_child.GetFirstName],"
 bp1_yearly.5707.t:0 "Pecados d[Select_CString( rival_parent.IsFemale, 'a', 'o' )] [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))]: Em Flagrante"
 bp1_yearly.5740.a.tt:0 "Eu preciso encontrar o culpado!"
 bp1_yearly.5740.a:0 "O que... qual é o #EMP significado#! disso?"
 bp1_yearly.5740.b:0 "Que estranho. Ah, bem."
 bp1_yearly.5740.c:0 "Quem fez isso? Onde eles estão?! #EMP GUARDAS!#!"
 bp1_yearly.5740.desc:0 "Acordo sonolento com os sons dos pássaros cantando, a luz do sol da manhã entrando em meu [ROOT.Char.Custom('GetChamber')]. Bocejo, estico-me e me deito novamente, aproveitando o calor. É só depois de alguns momentos que percebo algo.\n\nDeitado ao meu lado, tão perfeitamente acomodado no travesseiro quanto eu estou em minhas cobertas, há um objeto verdadeiramente misterioso.\n\nUm ovo de tamanho médio, de cor off-white, perfeitamente nondescript…\n\nOvo."
 bp1_yearly.5740.t:0 "Procurando por respostas"
 bp1_yearly.5741.a.tt:0 "Não deixarei pedra sobre pedra!"
 bp1_yearly.5741.a:0 "Outro?! Vou mandar flensar o culpado! #EMP Imediatamente!#!"
 bp1_yearly.5741.b:0 "Quem quer que tenha sido teve acesso à cozinha! Mistério resolvido!"
 bp1_yearly.5741.desc:0 "Meu primeiro destino é a cozinha, onde os servos se apressam ao redor das mesas enquanto preparam a comida. Até eu mesma sou afastada de várias pilhas de comida, já que meu status como [ROOT.Char.GetLadyLord] é completamente desinteressante para os cozinheiros ocupados.\n\nFinalmente, eu encontro o que procurava: uma pilha quase arrumada de ovos! Cada um é acomodado confortavelmente em uma pequena divisão de feno dentro de uma grande caixa de madeira aberta no topo, organizados em fileiras de dez. Dez, por dez, por dez, por... oito.\n\n#EMP Dois#! ovos estão faltando!"
 bp1_yearly.5741.t:0 "$bp1_yearly.5740.t$: Cozido"
 bp1_yearly.5742.a:0 "Como? COMO?!"
 bp1_yearly.5742.b:0 "Que sorte! #EMP Dois#! ovos grátis!"
 bp1_yearly.5742.desc:0 "Descendo correndo as escadas para a adega, permito-me uma respiração do ar úmido e fresco. Prateleiras após prateleiras de comida e bebida são armazenadas aqui embaixo, e em contraste gritante com o burburinho da cozinha acima, o nível inferior está completamente vazio. Apoiando-me em uma prateleira baixa, reúno meus pensamentos. Quem plantou o ovo ali deve ter acesso aos meus aposentos e à cozinha, e...\n\nMeus pensamentos se perdem. Minha mão, que havia deslizado para o meu bolso despretensiosamente, congelou. Meus dedos, atrapalhados, incrédulos, retiram o objeto que encontraram de dentro das minhas roupas.\n\nO objeto é duro. Morno. #EMP Oval.#!"
 bp1_yearly.5742.t:0 "$bp1_yearly.5740.t$: Atormentado!"
 bp1_yearly.5743.a.tt.failure:0 "Seu palpite está incorreto"
 bp1_yearly.5743.a.tt.outcome:0 "Chance de"
 bp1_yearly.5743.a.tt.success:0 "Você identificou corretamente o suspeito"
 bp1_yearly.5743.a:0 "[egg_spouse.GetFirstNameNoTooltip]! Confesse imediatamente!"
 bp1_yearly.5743.b:0 "[egg_friend.GetFirstNameNoTooltip]! S[Select_CString( egg_friend.IsFemale, 'ua', 'eu' )] [egg_friend.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.5743.c.tt.success:0 "Você identificou corretamente... todos"
 bp1_yearly.5743.c.tt:0 "Todos os cortesãos"
 bp1_yearly.5743.c:0 "Nenhum de vocês está livre de suspeita! #EMP Nenhum!#!"
 bp1_yearly.5743.desc:0 "Como se em um torpor, eu irrompo pelas portas do meu tribunal, com os olhos arregalados. Meus vassalos e minha família estão diante de mim, [egg_spouse.Custom2('MyCharacterIntroduction', ROOT.Char)] e [egg_friend.Custom2('MyCharacterIntroduction', ROOT.Char)] particularmente visíveis em seu horror.\n\n\"Ovo! DOIS ovos!\" Eu proclamo, brandindo o humilde objeto diante deles. \"Quem foi?! Quem fez isso? Eu farei com que você seja jogado ao mar!\"\n\nAlgumas risadas nervosas e confusas seguem. Eu levanto meu braço bem alto e, com um brado incoerente e estrondoso, lanço o objeto ofensivo diretamente no chão. As risadas morrem e o silêncio reina."
 bp1_yearly.5743.t:0 "$bp1_yearly.5740.t$: Criando um Plano"
 bp1_yearly.5744.a:0 "…minha cabeça dói."
 bp1_yearly.5744.b:0 "Vou encontrar o culpado! Só... não agora."
 bp1_yearly.5744.crowd:0 "rosto de cada pessoa na multidão"
 bp1_yearly.5744.end:0 "nunca vacila. Eu tento dar outro passo à frente, mas meu corpo inteiro cede e começa a tombar.\n\nNo instante seguinte, estou deitado de costas, um círculo de rostos preocupados haloando minha visão, um pano molhado sendo pressionado contra minha têmpora.\n\n\"Não, não, [ROOT.Char.Custom('FormOfAddressForLiege')]! Você precisa descansar. Nós vamos arrumar um servo para ajudar a limpá-lo também.\" As palavras desconexas registram ao mesmo tempo em que minha mão toca meu rosto, espalhando levemente a gema do ovo esmagado em que caí diretamente."
 bp1_yearly.5744.friend:0 "rosto de [egg_friend.GetFirstNamePossessive]"
 bp1_yearly.5744.spouse:0 "rosto de [egg_spouse.GetFirstNamePossessive]"
 bp1_yearly.5744.start:0 "A fúria da minha acusação dá peso à minha alegação, mas à medida que os momentos passam, o espanto no "
 bp1_yearly.5744.t:0 "$bp1_yearly.5740.t$: Derrotado"
 bp1_yearly.5745.a:0 "#DIE2 ...não. ...não, #! #DIE1 não, não, não, #! #EMP nooooo! #!"
 bp1_yearly.5745.b:0 "É coisa da [egg_spouse.GetFirstNamePossessiveNoTooltip], eu simplesmente sei disso."
 bp1_yearly.5745.c:0 "É coisa da [egg_friend.GetFirstNamePossessiveNoTooltip], deve ser!"
 bp1_yearly.5745.d:0 "Eu me recuso a lidar com essas palhaçadas ridículas por mais tempo!"
 bp1_yearly.5745.desc:0 "Um dia de trabalho árduo é devidamente recompensado com um bom descanso! Minha cama, grande e confortável, é iluminada pela luz cintilante do fogo, as chamas crepitantes enviam sombras dançando pela parede. Agradecido, deslizo em seu abraço quente, puxando cobertores sobre meu corpo cansado e deitando minha cabeça em um travesseiro. \n\nSó então que eu a vejo. Menos de um braço de distância de mim, deitada impecável em um travesseiro próprio, iluminada pelas chamas cintilantes na lareira. \n\nUm ovo."
 bp1_yearly.5745.t:0 "$bp1_yearly.5740.t$: Jogo de Galinhas"
