 game_concept_house_feud:0 "Rixa"
 game_concept_house_feud_desc:0 "Às vezes, uma rivalidade pode se transformar em uma vingança contra uma [house|E] específica.\n\n#help Matar, [Concept('torturing', 'Torturar')|E], trair, roubar e vencer [wars|E] contra membros da [house|E] alvo aumentará a pontuação de sua Casa, enquanto ser vítima dessas ações a reduzirá.\n\nEnquanto uma Rixa estiver em curso, todos os membros da [house|E] receberão um bônus para [hostile_schemes|E] contra membros da [house|E] alvo e terão mais chances de mirar em seus membros.\n\nQuando a Rixa termina, sua [house|E] será recompensada com base no dano relativo infligido aos seus inimigos, variando de [GetModifier('house_feud_terrible_modifier').GetNameWithTooltip] a [GetModifier('house_feud_excellent_modifier').GetNameWithTooltip]."
