l_spanish:
 HOSTILE_FAMILY_FEUD_SCHEMER_BONUS:0 "[house|E] do manipulador está em conflito com a casa alvo: $VALUE|=+0$"
 INTERACTION_FAMILY_FEUD_REASON:0 "[house|E] de [actor.GetShortUIName] está em conflito com [recipient.GetShortUIName]: $VALUE|=+0$"
 INTERACTION_FAMILY_FEUD_REVERSE_REASON:0 "[house|E] de [recipient.GetShortUIName] está em conflito com [actor.GetShortUIName]: $VALUE|=+0$"
 MARRY_FAMILY_FEUD_REASON:0 "[house|E] [recipient.GetHouse.GetBaseName] em conflito com a Casa [actor.GetHouse.GetBaseName]: $VALUE|=+0$"
 MURDER_FAMILY_FEUD_AGENT_BONUS:0 "[house|E] do agente está em conflito com a casa alvo: $VALUE|=+0$"
 SEDUCE_FAMILY_FEUD_SCHEMER_BONUS:0 "[house|E] do manipulador está em conflito com o cônjuge da casa alvo: $VALUE|=+0$"
 SWAY_FAMILY_FEUD_SCHEMER_MALUS:0 "[house|E] da casa alvo está em conflito com o manipulador: $VALUE|=+0$"
 action_ongoing_house_feud:0 "Rixa Familiar em Andamento"
 action_ongoing_house_feud_click:0 "#I Clique para ver o líder da [house_feud|E]#!"
 action_ongoing_house_feud_desc:0 "Sua família considera a Casa [recipient.GetHouse.GetBaseName] como inimigos e receberá recompensas por superá-los.\n\n#help Matar, [Concept('torturing', 'Torturar')|E], trair, roubar e vencer [wars|E] contra seus membros aumentará a pontuação da sua Casa, enquanto se tornar vítima dessas ações irá reduzi-la.#!\n"
 action_ongoing_house_feud_label:0 "@dynasty_icon! Sua Casa está em Rixa com [recipient.GetHouse.GetBaseNameNoTooltip]"
 action_ongoing_house_feud_unimportant:0 "@warning_icon! #N Sua House está perdendo a [house_feud|E]!#"
 bp1_house_feud.0001.a:0 "Isso será minha missão de vida."
 bp1_house_feud.0001.b:0 "Deve haver algum uso melhor para minha energia..."
 bp1_house_feud.0001.desc:0 "Eu tenho suportado [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstName] e a vilania [house_feud_rival.GetHerHim] por tempo demais.\n\nÀs vezes, eu sonho em derrotar a Casa [house_feud_rival.GetHouse.GetBaseName], apagando essa família [house_feud_rival.Custom2('InsultAdjective', ROOT.Char)] dos anais da história, juntamente com toda a miséria que eles me causaram.\n\nEu acordo, angustiado com meu próprio ódio, mas quem poderia ser um alvo mais merecedor dele do que [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetFirstNameNoTooltip]?"
 bp1_house_feud.0001.t:0 "Uma Casa Maldita"
 bp1_house_feud.0001.target:0 "\n\nSerá que os rumores são verdadeiros? Isso foi provocado por uma [relation.Custom('GetFamilyFeudShort')] há muito tempo?"
 bp1_house_feud.0002.a:0 "Isso parece ser um assunto de família."
 bp1_house_feud.0002.b:0 "Como [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetFirstNameNoTooltip] ousa desafiar m[Select_CString( house_feud_victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))]?"
 bp1_house_feud.0002.c:0 "[house_feud_victim.GetSheHe|U] deve resolver seus próprios problemas."
 bp1_house_feud.0002.desc:0 "[Select_CString( house_feud_victim.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetTitledFirstName], constantemente lamenta a vilania do rival [house_feud_victim.GetHerHim], [house_feud_attacker.GetTitledFirstName].\n\nCada vez que vejo [house_feud_victim.GetSheHe], [house_feud_victim.GetSheHe] menciona [SCOPE.Custom('VenomousCreature')|U] da Casa [house_feud_attacker.GetHouse.GetBaseName]', e me instiga a oferecer conselhos ou ajuda para derrubar [house_feud_attacker.GetSheHe]."
 bp1_house_feud.0002.t:0 "Solidariedade Dinástica"
 bp1_house_feud.0003.a:0 "Uma maldição sobre a Casa [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]!"
 bp1_house_feud.0003.b:0 "Eu mesmo enviarei [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetFirstNameNoTooltip] para [ROOT.Char.GetFaith.NegativeAfterLife]!"
 bp1_house_feud.0003.c:0 "A vingança não trará [house_feud_victim.GetSheHe] de volta."
 bp1_house_feud.0003.desc:0 "Eu caminho do lado de fora da minha [ROOT.Char.Custom('ResidenceBuilding')], incapaz de afastar as memórias de [Select_CString( house_feud_victim.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetTitledFirstName], tirado de nós antes do tempo [house_feud_victim.GetHerHim] [Select_CString( house_feud_attacker.IsFemale, 'pela', 'pelo' )] [house_feud_attacker.GetTitledFirstName]... aquela vil criatura da casa [house_feud_attacker.GetHouse.GetBaseName]!\n\nSó há uma maneira de minha honra ser restaurada, e [Select_CString( house_feud_victim.IsFemale, 'a', 'o' )] [house_feud_victim.GetFirstNameNoTooltip] vingada..."
 bp1_house_feud.0003.t:0 "Olho por Olho"
 bp1_house_feud.0004.a:0 "A Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] não esquece seus inimigos."
 bp1_house_feud.0004.b:0 "O ódio d[Select_CString( old_house_head.IsFemale, 'a', 'o' )] [old_house_head.GetFirstNamePossessiveNoTooltip] morreu com [old_house_head.GetSheHe]."
 bp1_house_feud.0004.desc:0 "Com o falecimento d[Select_CString( old_house_head.IsFemale, 'a', 'o' )] [old_house_head.GetTitledFirstNamePossessiveRegnal], o manto da Casa [ROOT.Char.GetHouse.GetName] cai sobre mim, junto com a responsabilidade de proteger a família.\n\nA inimizade entre [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstName] e [Select_CString( old_house_head.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))] não era segredo; o ódio d[Select_CString( old_house_head.IsFemale, 'a', 'o' )] [old_house_head.GetFirstNamePossessiveNoTooltip] pela ninhada da casa [house_feud_rival.GetHouse.GetBaseName] transbordava na vida cotidiana do [old_house_head.GetPrimaryTitle.GetAdjectiveNoTooltip] [old_house_head.Custom('GetCourt')].\n\nEstou dividido entre esquecer essas antigas disputas e respeitar o que seriam os desejos de [Select_CString( old_house_head.IsFemale, 'minha falecida', 'meu falecido' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))]..."
 bp1_house_feud.0004.t:0 "Um[Select_CString( old_house_head.IsFemale, 'a', '' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('old_house_head'))|U] Inimig[Select_CString( old_house_head.IsFemale, 'a', 'o' )]"
 bp1_house_feud.0005.a:0 "'[ROOT.Char.GetHouse.GetMotto]!'"
 bp1_house_feud.0005.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] não sairá impune."
 bp1_house_feud.0005.c.rival:0 "[ROOT.Char.GetFaith.HighGodName] vai punir o mal."
 bp1_house_feud.0005.c:0 "Nada pode trazer [Select_CString( house_feud_victim.IsFemale, 'a', 'o' )] [house_feud_victim.GetFirstNameNoTooltip] de volta..."
 bp1_house_feud.0005.desc:0 "O buraco deixado no meu coração pela morte d[Select_CString( house_feud_victim.IsFemale, 'a', 'o' )] m[Select_CString( house_feud_victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] [house_feud_victim.GetFirstNamePossessive], permanece aberto, rasgado a cada vez que penso no assassino perverso [house_feud_victim.GetHerHim] e na justiça que ainda precisa ser feita.\n\nDia após dia, a lógica cruel da vingança domina meu pensamento, alimentada a cada noite em sonhos inquietos, onde vejo [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetFirstName] e toda a Casa [house_feud_attacker.GetHouse.GetBaseName] atormentados pela mesma dor que minha família suporta..."
 bp1_house_feud.0005.t:0 "Atração pela Vingança"
 bp1_house_feud.0006.a:0 "A Casa dos [house_feud_rival.GetHouse.GetBaseNameNoTooltip] deve acabar."
 bp1_house_feud.0006.b:0 "[house_feud_rival.GetFirstNameNoTooltip] é o problema."
 bp1_house_feud.0006.c:0 "Tome um pouco de [ROOT.Char.Custom('RegionalAlcoholicDrink')], pense em outras coisas..."
 bp1_house_feud.0006.desc:0 "O rosto zombeteiro d[Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstNamePossessive] invade minha mente mais uma vez. Levanto-me com desculpas pobres e saio da fogueira, caminhando no escuro.\n\nNão consigo tirar ess[Select_CString( house_feud_rival.IsFemale, 'a', 'e' )] [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] da minha cabeça; o pensamento d[house_feud_rival.GetSheHe] e sua família não desafiados, se vangloriando em [house_feud_rival.GetCapitalLocation.GetName]...\n\n"
 bp1_house_feud.0006.higher:0 "Por [ROOT.Char.GetFaith.HighGodName], #EMP eu#! sou o legítimo governante de [house_feud_claim.GetBaseNameNoTier]."
 bp1_house_feud.0006.multi:0 "[house_feud_claim.GetBaseNameNoTier], e as outras terras em que [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstName] se abriga, devem ser minhas."
 bp1_house_feud.0006.previous:0 "As terras d[Select_CString( house_feud_previous.IsFemale, 'a', 'o' )] [house_feud_previous.GetTitledFirstNamePossessive] voltarão para nós."
 bp1_house_feud.0006.same:0 "Eu não terei descanso até que [house_feud_claim.GetBaseNameNoTier] seja meu?"
 bp1_house_feud.0006.t:0 "[house_feud_rival.GetTitleAsNameNoTooltip] [Select_CString( house_feud_rival.IsFemale, 'A', 'O' )] Verdadeir[Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_claim.GetBaseNameNoTierPossessiveNoTooltip]"
 bp1_house_feud.0007.a:0 "Eu destruirei essa casa miserável."
 bp1_house_feud.0007.b:0 "Um dia, eu vou manter [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetFirstNameNoTooltip] acorrentado como estes aqui."
 bp1_house_feud.0007.c:0 "Talvez [house_feud_attacker.GetSheHe] tenha uma boa razão..."
 bp1_house_feud.0007.camp:0 "Afundado na [house_feud_attacker.Custom('GetCourt')] d[Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstNamePossessive], à mercê dos elementos e dos guardas zombeteiros, tenho muito tempo para cultivar um ressentimento por meu captor."
 bp1_house_feud.0007.desc:0 "\n\n[house_feud_attacker.GetSheHe|U] me manteve por muito mais tempo do que é razoável, e só consigo deduzir um motivo mesquinho ou caprichoso em sua demora. Estou no meu limite..."
 bp1_house_feud.0007.dungeon:0 "Preso na masmorra d[Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstNamePossessive], com apenas o distante burburinho de [house_feud_attacker.GetCapitalLocation.GetNameNoTooltip], e o raro grunhido de um guarda [house_feud_attacker.GetCulture.GetNameNoTooltip] para estimulação, eu tenho muito tempo para cultivar um ressentimento pelo meu captor."
 bp1_house_feud.0007.house_arrest:0 "Preso nos aposentos d[Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstNamePossessive], embora seja preferível a uma masmorra, não é uma maneira de viver.\n\nA comida é ruim - o entretenimento é pior - mas eu tenho muito tempo para cultivar um ressentimento pelo meu captor."
 bp1_house_feud.0007.t:0 "Ardendo em Cativeiro"
 bp1_house_feud.0008.a:0 "Este maltrato de [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] não será esquecido."
 bp1_house_feud.0008.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] pagará por isso."
 bp1_house_feud.0008.c:0 "Só posso rezar pela libertação [house_feud_victim.GetHerHim]."
 bp1_house_feud.0008.camp:0 "\n\nO pensamento [house_feud_victim.GetHerHim] acorrentado como um animal na [ROOT.Char.Custom('GetCourt')] d[Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstNamePossessive]... uma [ROOT.Char.GetHouse.GetBaseName]!"
 bp1_house_feud.0008.closing:0 "\n\nFico com raiva, pensando nos muitos meses em que m[Select_CString( house_feud_victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] suportou a captura; [house_feud_attacker.GetFirstNameNoTooltip] vai longe demais tratando [house_feud_victim.GetSheHe] assim, [house_feud_attacker.GetTitleAsNameNoTooltip] ou não!"
 bp1_house_feud.0008.desc:0 "O aroma de ervas e ensopado rico flutua da cozinha da [ROOT.Char.Custom('ResidenceBuilding')], e não consigo afastar o sofrimento [Select_CString( house_feud_victim.IsFemale, 'da querida', 'do querido' )] [house_feud_victim.GetFirstName] de minha mente."
 bp1_house_feud.0008.dungeon:0 "\n\nO pensamento da situação [house_feud_victim.GetHerHim], trancafiado em uma prisão [house_feud_attacker.GetPrimaryTitle.GetAdjectiveNoTooltip] como uma criatura inferior... uma [ROOT.Char.GetHouse.GetBaseName]!"
 bp1_house_feud.0008.house_arrest:0 "\n\nEspero que o capturador [house_feud_victim.GetHerHim], [house_feud_attacker.GetTitledFirstName], alimente [house_feud_victim.GetSheHe] bem durante a prisão - mas nenhum [ROOT.Char.GetHouse.GetBaseName] deveria viver sob guarda!"
 bp1_house_feud.0008.t:0 "Prisão injusta"
 bp1_house_feud.0009.a:0 "'[house_feud_rival.GetHouse.GetBaseNameNoTooltip]' será uma maldição a partir de hoje."
 bp1_house_feud.0009.adult:0 "[ROOT.Char.GetCapitalLocation.GetName] continua a lamentar por [Select_CString( old_house_head.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))]. Do lado de fora da [ROOT.Char.Custom('ResidenceBuilding')], posso escapar dos que choram, seu constante lamento de '[old_house_head.GetTitledFirstName]', e ficar sozinho com meus pensamentos.\n\nPensar que [old_house_head.GetSheHe] [old_house_head.GetDeathReasonHideKiller] [Select_CString( house_feud_rival.IsFemale, 'pela', 'pelo' )] [house_feud_rival.GetTitledFirstName], aquel[Select_CString( house_feud_rival.IsFemale, 'a', 'e' )] [house_feud_rival.Custom2('InsultNoun', ROOT.Char)] da casa [house_feud_rival.GetHouse.GetBaseName]..."
 bp1_house_feud.0009.b:0 "Um dia, eu acabarei com [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetFirstNameNoTooltip]."
 bp1_house_feud.0009.c:0 "Sangue suficiente de [ROOT.Char.GetHouse.GetBaseNameNoTooltip] foi derramado..."
 bp1_house_feud.0009.child:0 "Com o tempo, me contam cada vez mais sobre [Select_CString( old_house_head.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))], incluindo como [old_house_head.GetSheHe] [old_house_head.GetDeathReasonHideKiller] [Select_CString( house_feud_rival.IsFemale, 'pela', 'pelo' )] [house_feud_rival.GetTitledFirstName]..."
 bp1_house_feud.0009.closing:0 "\n\nSe houver justiça neste mundo, e a honra de [ROOT.Char.GetHouse.GetBaseName] for restaurada, talvez eu tenha que entregá-la eu mesmo."
 bp1_house_feud.0009.new:0 "O destino é uma amante cruel!"
 bp1_house_feud.0009.reciprocate:0 "Eu ensinarei a [house_feud_rival.GetSheHe] o preço de sua 'vendetta'!"
 bp1_house_feud.0009.t:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [old_house_head.Custom2('RelationToMeShort', ROOT.Char)|U] vingativ[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 bp1_house_feud.0010.a:0 "Todos eles vão desejar nunca ter nascido."
 bp1_house_feud.0010.b:0 "[house_feud_existing.GetHouse.GetBaseNameNoTooltip] encontraram seu adversário."
 bp1_house_feud.0010.blinding:0 "Ainda não aceitei completamente a perda da minha visão... Talvez tenha subestimado [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstName]... Choraria ao pensar em quão completamente indefeso eu sou agora, se a dor permitisse.\n\n"
 bp1_house_feud.0010.c:0 "[house_feud_attacker.GetFirstNameNoTooltip] pagará por isso, de alguma forma."
 bp1_house_feud.0010.castration:0 "A dor do meu... maltrato... persiste, cada movimento me lembrando do que perdi. Planejar vingança contra [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstName] é a única coisa que me distrai.\n"
 bp1_house_feud.0010.d:0 "Acho que estou farto de violência..."
 bp1_house_feud.0010.dungeon:0 "Aqui embaixo, neste buraco úmido, tão longe eu caí, nas mãos deste miserável de [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0010.free:0 "Estou livre novamente, mas nunca mais serei inteiro. Só [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetFirstNameNoTooltip] sabe o quanto [house_feud_attacker.GetSheHe] me custou."
 bp1_house_feud.0010.house_arrest:0 "Embora eu possa ficar feliz por não estar na masmorra de [house_feud_attacker.GetHouse.GetBaseNameNoTooltip], é um pequeno consolo nas circunstâncias."
 bp1_house_feud.0010.t:0 "Tratamento imperdoável"
 bp1_house_feud.0010.torture:0 "A dor era insuportável, interminável... Eu não achava que [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstName] fosse capaz de tamanha barbaridade, sem mencionar tratar um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip], um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] nobre, dessa maneira!\n\n"
 bp1_house_feud.0011.a:0 "Todos os [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] pagarão por isso."
 bp1_house_feud.0011.b:0 "Eu farei [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetFirstNameNoTooltip] sofrer."
 bp1_house_feud.0011.blinding:0 "A notícia sobre [Select_CString( house_feud_victim.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetTitledFirstNamePossessive], #EMP ofuscante#! [Select_CString( house_feud_attacker.IsFemale, 'pela', 'pelo' )] [house_feud_attacker.GetTitledFirstName] ainda não se instalou completamente.\n\n"
 bp1_house_feud.0011.c:0 "Não há nada a ser feito..."
 bp1_house_feud.0011.camp:0 "Para piorar as coisas, [house_feud_victim.GetSheHe] também deve se afundar em um fétido [house_feud_attacker.Custom('GetDungeon')]..."
 bp1_house_feud.0011.castration:0 "A notícia da... #EMP castração#! [Select_CString( house_feud_victim.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetFirstName], paira sobre a [ROOT.Char.Custom('GetCourt')].\n\n"
 bp1_house_feud.0011.closing:0 "\n\nSerá que posso deixar essa indignação de [house_feud_attacker.GetHouse.GetBaseName] impune?"
 bp1_house_feud.0011.dungeon:0 "Para piorar as coisas, [house_feud_victim.GetSheHe] também deve sofrer o [house_feud_attacker.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] [house_feud_attacker.Custom('GetDungeon')]..."
 bp1_house_feud.0011.free:0 "Embora [house_feud_victim.GetSheHe] esteja livre agora, este maltrato certamente ficará com [house_feud_victim.GetSheHe] pelo resto de seus dias."
 bp1_house_feud.0011.house_arrest:0 "A única consolação é que [house_feud_victim.GetSheHe] está sendo poupado do [house_feud_attacker.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] [house_feud_attacker.Custom('GetDungeon')]..."
 bp1_house_feud.0011.t:0 "Um[Select_CString( house_feud_victim.IsFemale, 'a', '' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))|U] Maltratad[Select_CString( house_feud_victim.IsFemale, 'a', 'o' )]"
 bp1_house_feud.0011.torture:0 "Mal pude suportar ouvir sobre o tormento d[Select_CString( house_feud_victim.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetFirstNamePossessive], pelas mãos d[Select_CString( house_feud_victim.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstName].\n\n"
 bp1_house_feud.0012.a:0 "[house_feud_attacker.GetHouse.GetBaseNameNoTooltip] deve ser lidado."
 bp1_house_feud.0012.b:0 "Esqueça [house_feud_existing.GetHouse.GetBaseNameNoTooltip], isso é um escândalo!"
 bp1_house_feud.0012.bad:0 "\n\nEu gostaria de nunca ter me casado com est[Select_CString( house_feud_spouse.IsFemale, 'a', 'e' )] [house_feud_spouse.Custom2('InsultNoun', ROOT.Char)]..."
 bp1_house_feud.0012.c:0 "Eu vou matar [house_feud_attacker.GetSheHe]."
 bp1_house_feud.0012.d:0 "Isso não ajuda em nada..."
 bp1_house_feud.0012.desc:0 "O conhecimento das relações carnais de [Select_CString( house_feud_spouse.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('house_feud_spouse'))] com [Select_CString( house_feud_attacker.IsFemale, 'aquela', 'aquele' )] [house_feud_attacker.Custom2('InsultNoun', ROOT.Char)], [house_feud_attacker.GetTitledFirstName], me consome.\n\nSer ridicularizado pelas costas, enquanto [Select_CString( house_feud_spouse.IsFemale, 'a', 'o' )] [house_feud_spouse.GetFirstName] desfruta do conforto da minha [ROOT.Char.Custom('ResidenceBuilding')]..."
 bp1_house_feud.0012.good:0 "\n\nComo [house_feud_spouse.GetSheHe] pôde fazer isso comigo?"
 bp1_house_feud.0012.t.female:0 "Coroada Cuckquean"
 bp1_house_feud.0012.t:0 "Usando Chifres de Corno"
 bp1_house_feud.0013.a:0 "Todos os [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] pagarão por isso."
 bp1_house_feud.0013.b:0 "[house_feud_attacker.GetSheHe|U] faz [house_feud_existing.GetHouse.GetBaseNameNoTooltip] parecer virtuoso!"
 bp1_house_feud.0013.c:0 "Eu farei [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetFirstNameNoTooltip] sofrer."
 bp1_house_feud.0013.d:0 "Tudo isso está no passado..."
 bp1_house_feud.0013.desc:0 "A notícia sobre a adultério d[Select_CString( house_feud_spouse.IsFemale, 'a', 'o' )] [house_feud_spouse.GetTitledFirstNamePossessive] se espalha, e não posso deixar de ver um desprezo velado por trás do sorriso de cada servo e [ROOT.Char.Custom('GetCourtier')].\n\n[house_feud_attacker.GetTitledFirstName] fez uma zombaria de mim e da minha família..."
 bp1_house_feud.0013.t:0 "Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [house_feud_spouse.Custom2('RelationToMePossessive', ROOT.Char)|U] de Honra"
 bp1_house_feud.0014.a:0 "A Casa [house_feud_attacker.GetHouse.GetBaseNameNoTooltip] ultrapassou os limites."
 bp1_house_feud.0014.b:0 "[house_feud_attacker.GetFirstNameNoTooltip] não pode sair impune."
 bp1_house_feud.0014.c:0 "É melhor perdoar e esquecer..."
 bp1_house_feud.0014.desc:0 "[house_feud_victim.GetTitledFirstName] falhou em manter sua casa em ordem; os casos amorosos [Select_CString( house_feud_spouse.IsFemale, 'da sua', 'do seu' )] [house_feud_victim.Custom2('RelationToMeShort', SCOPE.sC('house_feud_spouse'))], [house_feud_spouse.GetTitledFirstNamePossessive], com [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.Custom2('InsultAdjective', ROOT.Char)] d[Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstName] trazem vergonha e zombaria para nossa família...\n\nEm tom baixo, m[Select_CString( house_feud_victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] me explica tudo entre os vasos empoeirados de [ROOT.Char.Custom('RegionalAlcoholicDrink')]. \"Nós precisamos fazer algo sobre aquel[Select_CString( house_feud_attacker.IsFemale, 'a', 'e' )] [house_feud_attacker.Custom2('InsultNoun', SCOPE.sC('house_feud_victim'))], [house_feud_victim.Custom2('RelationToMeShort', ROOT.Char)], isso não pode ficar sem resposta!\""
 bp1_house_feud.0014.t:0 "O Orgulho de um[Select_CString( house_feud_victim.IsFemale, 'a', '' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('house_feud_victim'))|U]"
 bp1_house_feud.0100.a:0 "Até mesmo um[Select_CString( house_feud_rival.IsFemale, 'a', '' )] [house_feud_rival.GetTitleAsNameNoTooltip] deve enfrentar a justiça."
 bp1_house_feud.0100.b:0 "Isso já durou o suficiente..."
 bp1_house_feud.0100.desc:0 "Não é bom presságio que [Select_CString( house_feud_rival.IsFemale, 'a vilã', 'o vilão' )] [house_feud_rival.GetFirstName] permaneça como [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitleAsNameNoTooltip], enquanto eu sou apenas um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] humilde [ROOT.Char.GetTitleAsNameNoTooltip]... Defender minha família de inimigos tão poderosos requer muita atenção.\n\n[relation.Custom('GetFamilyFeudShortFlavor')|U] foi injusto, talvez essa disputa não valha a pena..."
 bp1_house_feud.0100.t:0 "$story_cycle_house_feud_title$: Um Ressentimento Desproporcional"
 bp1_house_feud.0110.a:0 "[house_feud_rival.GetTitleAsNameNoTooltip] ou [ROOT.Char.GetTitleAsNameNoTooltip], a justiça deve ser servida."
 bp1_house_feud.0110.b:0 "Sim, [house_feud_rival.GetSheHe] está abaixo do meu nível..."
 bp1_house_feud.0110.desc:0 "A vilania d[Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstName] e de toda a Casa [house_feud_rival.GetHouse.GetBaseName] é inegável, mas é apropriado que a família de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] brigue com a de um[Select_CString( house_feud_rival.IsFemale, 'a', '' )] [house_feud_rival.GetTitleAsNameNoTooltip]?\n\n[relation.Custom('GetFamilyFeudShortFlavor')] é imperdoável, mas devemos nos desonrar, desperdiçando tempo com essas #EMP pessoas pequenas#!"
 bp1_house_feud.0110.t:0 "$story_cycle_house_feud_title$: Adversários Inferiores"
 bp1_house_feud.0200.a:0 "É a hora d[Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstNamePossessiveNoTooltip]."
 bp1_house_feud.0200.b:0 "Os dias d[Select_CString( house_feud_target.IsFemale, 'a', 'o' )] [house_feud_target.GetTitledFirstNamePossessiveNoTooltip] estão contados."
 bp1_house_feud.0200.c:0 "Eu tenho outros planos para eles."
 bp1_house_feud.0200.d:0 "Não, isso foi um erro..."
 bp1_house_feud.0200.desc:0 "Nossa disputa com a Casa [house_feud_rival.GetHouse.GetBaseName] tem sido um desastre; não estamos mais perto da vingança e as atrocidades deles continuam.\n\nSe quisermos acabar com essa vingança adequadamente, talvez seja hora de aplicar o golpe de misericórdia..."
 bp1_house_feud.0200.t:0 "$story_cycle_house_feud_title$: Medidas Desesperadas"
 bp1_house_feud.0210.a:0 "Não, vamos mostrá-los!"
 bp1_house_feud.0210.b:0 "Chega... já chega!"
 bp1_house_feud.0210.desc:0 "A vingança ainda está longe de ser servida à Casa [house_feud_rival.GetHouse.GetBaseName]; desde que nossa disputa começou, só houve mais ultrajes [Select_CString( house_feud_rival.IsFemale, 'pela', 'pelo' )] [house_feud_rival.GetTitledFirstName] e seu bando de víboras.\n\nÀs vezes eu me pergunto se subestimamos nossos inimigos, e se não seria melhor cortar nossas perdas antes que seja tarde demais."
 bp1_house_feud.0210.recent:0 "[house_feud_recent_death.GetTitledFirstName] talvez tenha pensado assim..."
 bp1_house_feud.0210.t:0 "$story_cycle_house_feud_title$: Um Preço Alto"
 bp1_house_feud.0220.a:0 "Não, estamos apenas começando."
 bp1_house_feud.0220.b:0 "Acabou."
 bp1_house_feud.0220.desc:0 "Nossos movimentos legítimos contra a Casa [house_feud_rival.GetHouse.GetBaseName] não passaram despercebidos; é praticamente certo que agora eles se arrependem da [relation.Custom('GetFamilyFeudShort')].\n\nEmbora essas criaturas não mereçam piedade ou misericórdia, o dano original já foi pago; estender esse conflito indefinidamente pode não estar em nosso melhor interesse."
 bp1_house_feud.0220.recent:0 "Talvez o sangue d[Select_CString( house_feud_recent_kill.IsFemale, 'a', 'o' )] [house_feud_recent_kill.GetTitledFirstName] seja suficiente..."
 bp1_house_feud.0220.t:0 "$story_cycle_house_feud_title$: Os Limites do Rancor"
 bp1_house_feud.0300.a:0 "A Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip] não esquece seus inimigos."
 bp1_house_feud.0300.b:0 "Isso já durou demais."
 bp1_house_feud.0300.desc:0 "Toda a [ROOT.Char.GetHouse.GetBaseNameNoTooltip] já ouviu a história das origens de nossa disputa com a Casa [house_feud_rival.GetHouse.GetBaseNameNoTooltip]; como [relation.Custom('GetFamilyFeudLongFlavor')].\n\nEssa história já está batida. Será que realmente vamos continuar essa vingança para sempre, por causa de algum [relation.Custom('GetFamilyFeudShort')] que aconteceu anos atrás?"
 bp1_house_feud.0300.t:0 "$story_cycle_house_feud_title$: Uma Brigalhada Cansativa"
 bp1_house_feud.0410.a:0 "Você está certo... está na hora de acabar com isso."
 bp1_house_feud.0410.b:0 "Não, precisamos terminar o que começamos."
 bp1_house_feud.0410.desc:0 "\"Por favor!\" [house_feud_victim.GetTitledFirstName] geme, \"Essa rixa insana precisa parar! Estou com medo de ir a qualquer lugar, e pulo com a menor menção de um [house_feud_rival.GetHouse.GetBaseName]!\"\n\nM[Select_CString( house_feud_victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))] está claramente abalad[Select_CString( house_feud_victim.IsFemale, 'a', 'o' )]... Estou dividido entre os riscos para minha família e a necessidade de ensinar uma lição para [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstName]."
 bp1_house_feud.0410.t:0 "$story_cycle_house_feud_title$: Ameaçados de Todos os Lados"
 bp1_house_feud.0420.a:0 "Nunca perdoarei [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstNameNoTooltip]."
 bp1_house_feud.0420.b:0 "Muito bem..."
 bp1_house_feud.0420.desc:0 "Ficou claro para mim que [Select_CString( house_feud_liege.IsFemale, 'minha senhora feudal', 'meu senhor feudal' )], [house_feud_liege.GetTitledFirstName], desaprova a disputa de minha família com [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstName] e a Casa [house_feud_rival.GetHouse.GetBaseName], e deseja que essas divisões [house_feud_liege.GetPrimaryTitle.GetAdjectiveNoTooltip] sejam consertadas.\n\nQuem é [house_feud_liege.GetSheHe] para exigir que a justiça não seja feita? Por outro lado, talvez seja imprudente provocar mais tensões, especialmente com [Select_CString( house_feud_liege.IsFemale, 'a', 'o' )] [house_feud_liege.GetTitleAsNameNoTooltip]..."
 bp1_house_feud.0420.t:0 "$story_cycle_house_feud_title$: Apelo d[Select_CString( house_feud_liege.IsFemale, 'a', 'o' )] [house_feud_liege.GetTitleAsNamePossessiveNoTooltip]"
 bp1_house_feud.0500.a:0 "A Casa d[Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetFirstNameNoTooltip] irá se arrepender disso."
 bp1_house_feud.0500.b:0 "Tenho preocupações maiores."
 bp1_house_feud.0500.desc:0 "Embora eu duvidasse disso no início, estou me convencendo, ouvindo os rumores do [ROOT.Char.Custom('GetCourt')], que [Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetTitledFirstName] quer minha cabeça, tudo por causa de um [relation.Custom('GetFamilyFeudShort')].\n\nToda a [ROOT.Char.GetHouse.GetName] está em jogo para [house_feud_rival.GetSheHe], devido à sua associação comigo, e esse ódio se infiltrou da cabeça, por toda a sua família [house_feud_rival.Custom2('InsultAdjective', ROOT.Char)]."
 bp1_house_feud.0500.t:0 "$story_cycle_house_feud_title$: Alvos da Ira"
 bp1_house_feud.0501.a:0 "Oh, o sentimento é #EMP mútuo#!"
 bp1_house_feud.0501.b:0 "Parece que temos um novo inimigo."
 bp1_house_feud.0501.c.busy:0 "Nossa atenção deve permanecer na Casa [house_feud_existing.GetBaseNameNoTooltip]."
 bp1_house_feud.0501.c.existing:0 "Tolo. Muito tolo."
 bp1_house_feud.0501.c:0 "Que infantil."
 bp1_house_feud.0501.desc:0 "\n\nAh, pensar que [relation.Custom('GetFamilyFeudShortFlavor')] realmente levantou algumas penas dos [house_feud_attacker.GetDynastyHouseName]!"
 bp1_house_feud.0501.new:0 "Fui informado de que [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstName], [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.Custom2('InsultNoun', ROOT.Char)] desprezível, jurou que a Casa [ROOT.Char.GetHouse.GetBaseName] será eternamente inimiga de sua família."
 bp1_house_feud.0501.reciprocating:0 "[Select_CString( house_feud_attacker.IsFemale, 'A', 'O' )] [house_feud_attacker.Custom2('InsultAdjective', ROOT.Char)] [house_feud_attacker.GetFirstName] retornou a inimizade pública de nossa família por sua própria conta, uma resposta patética e caluniosa às nossas justas queixas."
 bp1_house_feud.0501.t:0 "$story_cycle_house_feud_title$: Rivalidade de [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]"
 bp1_house_feud.0502.a:0 "Muito pouco, muito tarde."
 bp1_house_feud.0502.another:0 "\n\nFui informado de que [house_feud_attacker.GetSheHe] agora está consumido pelo ódio de [house_feud_new.GetHeadOfHouse.GetTitledFirstName] e da Casa [house_feud_new.GetBaseName]."
 bp1_house_feud.0502.b:0 "Talvez #EMP seja# hora de resolver isso."
 bp1_house_feud.0502.c:0 "Então a guarda deles está baixa!"
 bp1_house_feud.0502.d:0 "Por que eu perco meu tempo com essa bobagem?"
 bp1_house_feud.0502.desc:0 "O alívio das tensões, se isso é possível, entre mim e [Select_CString( house_feud_attacker.IsFemale, 'a', 'o' )] [house_feud_attacker.GetTitledFirstName] parece confirmar que [house_feud_attacker.GetSheHe] abandonou sua vingança contra a Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0502.peace:0 "\n\nÉ difícil acreditar, mas eu ficaria feliz em ficar livre das preocupações com uma ameaça da Casa [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0502.t:0 "$story_cycle_house_feud_title$: Tensões Aliviam"
 bp1_house_feud.0600.a:0 "Não posso recusar [ROOT.Char.GetHouse.GetHeadOfHouse.GetFirstNameNoTooltip]."
 bp1_house_feud.0600.b:0 "Já era hora!"
 bp1_house_feud.0600.c:0 "Isso não nos levará a lugar algum..."
 bp1_house_feud.0600.desc:0 "Tenho ponderado sobre uma carta enfática que recebi esta manhã d[Select_CString( house_head_scope.IsFemale, 'a', 'o' )] [ROOT.Char.Custom2('RelationToMeShort', house_head_scope)], [house_head_scope.GetTitledFirstName].\n\n[ROOT.Char.GetHouse.GetHeadOfHouse.GetSheHe|U] deixou claro o seu desejo de que toda a nossa Casa faça inimigos declarados dos 'cães da [house_feud_rival.GetHouse.GetBaseName]'.\n\nNão posso defender [relation.Custom('GetFamilyFeudShortFlavor')] - mas e os riscos para a nossa família?"
 bp1_house_feud.0600.t:0 "$story_cycle_house_feud_title$: Inimigos Compartilhados"
 bp1_house_feud.0700.a:0 "Fora, [house_feud_rival.GetHouse.GetBaseNameNoTooltip] [house_feud_rival.Custom2('InsultNoun', ROOT.Char)]"
 bp1_house_feud.0700.b:0 "Uma rosa com qualquer outro nome ainda cheiraria doce."
 bp1_house_feud.0700.desc:0 "Minhas suspeitas foram confirmadas; [owner.GetTitledFirstName], [Select_CString( house_head_scope.IsFemale, 'uma odiada', 'um odiado' )] dos [owner.GetHouse.GetBaseName], procura as minhas afeições...\n\n"
 bp1_house_feud.0700.desc_negative:0 "Que [owner.GetWomanMan] ridícul[Select_CString( owner.IsFemale, 'a', 'o' )] - [owner.GetSheHe] acha que eu, que nós, somos idiotas?"
 bp1_house_feud.0700.desc_neutral:0 "Talvez, se não fossem as disputas entre nossas famílias, eu teria considerado as investidas d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetTitledFirstNamePossessive]."
 bp1_house_feud.0700.desc_positive:0 "Sempre me disseram para ter cuidado com os inimigos da nossa família, mas não posso negar que há um certo... #EMP frisson#!."
 bp1_house_feud.0700.t:0 "$story_cycle_house_feud_title$: Fruto Proibido"
 bp1_house_feud.0701.a:0 "Eu pensei que você... esqueça..."
 bp1_house_feud.0701.desc:0 "\"O que dizem sobre a sanidade dos [owner.GetHouse.GetBaseName] deve ser verdade, se acha que eu algum dia sonharia em cortejá-l[Select_CString( owner.IsFemale, 'a', 'o' )]. Tente sua ridícula tentativa de trapaça com outra pessoa.\"\n\n[target.GetFirstName] [target.Custom('quirk_neg_present')] enquanto [target.GetSheHe] derrama feroz escárnio sobre mim."
 bp1_house_feud.0701.t:0 "Presa Cautelosa"
 bp1_house_feud.0810.a:0 "Não, é o que os [house_feud_rival.GetHouse.GetBaseNameNoTooltip] querem!"
 bp1_house_feud.0810.adult:0 "Com a morte [Select_CString( old_house_head.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))], [old_house_head.GetTitledFirstName], agora me encontro questionando a disputa de nossa família com a Casa [house_feud_rival.GetHouse.GetBaseName]."
 bp1_house_feud.0810.b.rival:0 "[house_feud_rival.GetFirstNameNoTooltip] é um cão, mas essa loucura deve acabar."
 bp1_house_feud.0810.b:0 "Sim, tenho coisas mais importantes com que me preocupar."
 bp1_house_feud.0810.child:0 "Eu já ouvi muitas histórias [Select_CString( old_house_head.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('old_house_head'))], [old_house_head.GetTitledFirstName], e as disputas [old_house_head.GetHerHim] com a Casa [house_feud_rival.GetHouse.GetBaseName]."
 bp1_house_feud.0810.desc:0 "\n\n[relation.Custom('GetFamilyFeudShortFlavor')] pode ter exigido uma resposta, mas será que é do nosso interesse continuar com isso?\n\nA Casa [ROOT.Char.GetHouse.GetBaseName] olha para mim em busca de liderança, para garantir sua sobrevivência e respeito, mas talvez sangue suficiente tenha sido derramado em busca dessa vingança..."
 bp1_house_feud.0810.t:0 "$story_cycle_house_feud_title$: Carregando a Tocha"
 bp1_house_feud.0830.a:0 "Nunca atravesse a Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0830.desc:0 "seguro sabendo que a amaldiçoada Casa [first_rival.GetHouse.GetBaseName] foi eliminada do mundo, pondo fim de uma vez por todas à vingança que eles tolos provocaram com [relation.Custom('GetFamilyFeudShortFlavor')]."
 bp1_house_feud.0830.even:0 "\n\nCada vez que infligíamos uma perda, havia retaliação, mas agora fechamos a última página da história da Casa [first_rival.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.0830.fallback:0 "\n\nEmbora [Select_CString( first_owner.IsFemale, 'a', 'o' )] [first_owner.GetTitledFirstName] não tenha vivido para ver este dia, espero que [first_owner.GetSheHe] possa agora estar satisfeito em [ROOT.Char.GetFaith.PositiveAfterLife]."
 bp1_house_feud.0830.first_owner:0 "\n\nEu triunfei, e [Select_CString( first_rival.IsFemale, 'aquela tola', 'aquele tolo' )], [first_rival.GetTitledFirstName] está finalmente em [ROOT.Char.GetFaith.NegativeAfterLife]!"
 bp1_house_feud.0830.losing:0 "\n\nEmbora eles tenham infligido um grande custo à nossa família nos anos seguintes, não há maior satisfação ou alívio do que saber que sua bandeira nunca voará novamente."
 bp1_house_feud.0830.opening:0 "Finalmente posso descansar tranquilo,"
 bp1_house_feud.0830.opening_drink:0 "Finalmente posso desfrutar de uma xícara de [ROOT.Char.Custom('RegionalAlcoholicDrink')],"
 bp1_house_feud.0830.t:0 "$story_cycle_house_feud_title$: O Sentimento Mais Doce"
 bp1_house_feud.0830.winning:0 "\n\nNós dizimamos completamente o número deles, garantindo que ninguém cruze nossa família sem estar preparado para pagar um preço alto."
 bp1_house_feud.0840.a:0 "#EMP Nada#! muda! Os cães da [house_feud_rival.GetHouse.GetBaseNameNoTooltip] são todos iguais!"
 bp1_house_feud.0840.b.rival:0 "Maldit[Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] d[Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetFirstNameNoTooltip], mas já chega."
 bp1_house_feud.0840.b:0 "Isso já foi longe demais."
 bp1_house_feud.0840.child:0 "No entanto, [house_feud_rival.GetSheHe] é apenas [Select_CString( house_feud_rival.IsFemale, 'uma', 'um' )] [house_feud_rival.Custom('GirlBoy')]..."
 bp1_house_feud.0840.closing:0 "\n\nTodos sabem de '[relation.Custom('GetFamilyFeudShortFlavor')]', mas e o futuro?"
 bp1_house_feud.0840.desc:0 "A odiada Casa [house_feud_rival.GetHouse.GetName] agora está nas mãos d[Select_CString( house_feud_rival.IsFemale, 'a', 'o' )] [house_feud_rival.GetFirstName], um[Select_CString( house_feud_rival.IsFemale, 'a', '' )] [house_feud_rival.GetTitleAsNameNoTooltip] certamente tão perverso quanto seus predecessores."
 bp1_house_feud.0840.t:0 "$story_cycle_house_feud_title$: O Próximo Inimigo"
 bp1_house_feud.7000.a:0 "A Casa [house_feud_rival.GetHouse.GetBaseNameNoTooltip] ainda tem muito a pagar."
 bp1_house_feud.7000.b:0 "Acabou, nós vencemos."
 bp1_house_feud.7000.desc:0 "Depois de muitos problemas, finalmente retiramos [house_feud_title.GetNameNoTier] das mãos d[Select_CString( previous_holder.IsFemale, 'a', 'o' )] [previous_holder.GetTitledFirstName] e da Casa [house_feud_rival.GetHouse.GetBaseName]!\n\nCom essa injustiça reparada, pode ser sábio acabar com essa antiga disputa, para que a razão pela qual ela começou não se perca no derramamento de sangue."
 bp1_house_feud.7000.t:0 "$story_cycle_house_feud_title$: [Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitleAsNameNoTooltip] Legítim[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )]"
 bp1_house_feud.7001.a:0 "Eu ainda não terminei com [house_feud_attacker.GetHouse.GetBaseNameNoTooltip]."
 bp1_house_feud.7001.b:0 "Não vamos deixar o mundo todo cego."
 bp1_house_feud.7001.desc:0 "[house_feud_attacker.GetTitledFirstName], o vil assassino de [Select_CString( house_feud_victim.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetTitledFirstName], foi finalmente eliminado por nossa mão, e a honra de nossa família, assim, restaurada.\n\nCom o objetivo da vendetta da [ROOT.Char.GetHouse.GetBaseName] alcançado, pode ser melhor deixar este... #EMP fracas#! para trás."
 bp1_house_feud.7001.t:0 "$story_cycle_house_feud_title$: Sangue por Sangue"
 bp1_house_feud.7002.a:0 "Ainda há muito a fazer."
 bp1_house_feud.7002.b:0 "Nós vencemos."
 bp1_house_feud.7002.desc:0 "\n\nAgora que a ofensa original contra [ROOT.Char.GetHouse.GetBaseName] foi vingada, a questão de quanto tempo continuaremos a guerra contra a família [house_feud_attacker.GetHouse.GetBaseName] surge..."
 bp1_house_feud.7002.opening:0 "[house_feud_attacker.GetTitledFirstName], o torturador insensível [Select_CString( house_feud_victim.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('house_feud_victim'))], [house_feud_victim.GetTitledFirstName], sofreu o mesmo destino em nossas mãos!"
 bp1_house_feud.7002.opening_self:0 "[house_feud_attacker.GetTitledFirstName], meu torturador insensível, sofreu o mesmo destino em minhas mãos!"
 bp1_house_feud.7002.t:0 "$story_cycle_house_feud_title$: Um Encontro de Destinos"
 bp1_house_feud.7003.a:0 "Este é apenas o começo!"
 bp1_house_feud.7003.b:0 "Uma conclusão satisfatória..."
 bp1_house_feud.7003.desc:0 "finalmente foi visitado com o mesmo destino, e em nossas mãos!\n\nCom este ferimento agora tratado, a luta contra a [house_feud_rival.GetHouse.GetBaseNameNoTooltip] parece estar chegando ao seu fim natural."
