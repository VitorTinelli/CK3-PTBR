l_spanish:
 bp1_yearly.2020.a:0 "Traga-me a cabeça d[Select_CString( bp1_yearly_2020_target.IsFemale, 'a', 'o' )] [bp1_yearly_2020_target.Custom('InsultAdjectiveGeneric')] d[Select_CString( bp1_yearly_2020_target.IsFemale, 'a', 'o' )] [bp1_yearly_2020_target.GetFirstNamePossessiveNoTooltip] em um prato."
 bp1_yearly.2020.b:0 "Estou #EMP interessado#! em mais cortesãos #EMP úteis#!."
 bp1_yearly.2020.b_tt:0 "[bp1_yearly_2020_influencing_partner.GetFirstNameNoTooltip] oferecerá uma seleção de cortesãos habilidosos."
 bp1_yearly.2020.c:0 "Meus cofres #EMP estão#! bastante vazios."
 bp1_yearly.2020.c_tt_halfsies:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] é financiad[Select_CString( bp1_yearly_2020_influencing_partner.IsFemale, 'a', 'o' )] pela metade e oferecerá um favor sobre s[Select_CString( bp1_yearly_2020_influencing_partners_parent_halfsies.IsFemale, 'ua', 'eu' )] [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_halfsies') )] [bp1_yearly_2020_influencing_partners_parent_halfsies.GetTitledFirstName]."
 bp1_yearly.2020.c_tt_only_hook:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] oferece um favor sobre s[Select_CString( bp1_yearly_2020_influencing_partners_parent_only_hook.IsFemale, 'ua', 'eu' )] [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_only_hook') )] [bp1_yearly_2020_influencing_partners_parent_only_hook.GetTitledFirstName]."
 bp1_yearly.2020.c_tt_pay_and_hook:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] é patrocinad[Select_CString( bp1_yearly_2020_influencing_partner.IsFemale, 'a', 'o' )] por e oferecerá um gancho em s[Select_CString( bp1_yearly_2020_influencing_partners_parent_pays.IsFemale, 'ua', 'eu' )] [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2020_influencing_partners_parent_pays') )] [bp1_yearly_2020_influencing_partners_parent_pays.GetTitledFirstName]."
 bp1_yearly.2020.d:0 "Isso parece muito #EMP suspeito#! Guardas!"
 bp1_yearly.2020.d_tt:0 "Quem sabe o que mais [bp1_yearly_2020_influencing_partner.GetSheHe] pode estar planejando!"
 bp1_yearly.2020.desc:0 "[bp1_yearly_2020_influencing_partner.GetTitledFirstName] se aproxima de mim com um sorriso amigável. 'Meu amor! Você viu [Select_CString( bp1_yearly_2020_child_to_become_heir.IsFemale, 'como nossa', 'como nosso' )] [bp1_yearly_2020_child_to_become_heir.GetFirstName] está se tornando majestos[Select_CString( bp1_yearly_2020_child_to_become_heir.IsFemale, 'a', 'o' )]? [bp1_yearly_2020_child_to_become_heir.GetSheHe|U] poderia praticamente governar esta nação com uma mão atada às costas; e eu juro pelo [bp1_yearly_2020_influencing_partner.GetFaith.HighGodNameAlternate] que [bp1_yearly_2020_child_to_become_heir.GetSheHe] te deixaria muito orgulhoso.'\n\n[bp1_yearly_2020_influencing_partner.GetSheHe|U] me dá um olhar de canto de olho. 'Claro, se houver #EMP qualquer coisa#! que eu possa fazer para tornar a ideia mais atraente... Tenho certeza de que você me deixaria saber e poderíamos chegar a algum tipo de acordo, [Select_CString( ROOT.Char.IsFemale, 'minha justa', 'meu justo' )] [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)].' Um sorriso irônico paira em seus lábios.\n\n#EMP Qualquer coisa#!, ela diz?"
 bp1_yearly.2020.e:0 "Eu não preciso de nada de você, [bp1_yearly_2020_influencing_partner.GetFirstNameNoTooltip]."
 bp1_yearly.2020.t:0 "Grandes Expectativas"
 bp1_yearly.2021.a:0 "[Select_CString( bp1_yearly_2021_martial_person.IsFemale, 'Esta guerreira treinada', 'Este guerreiro treinado' )] tem certa #EMP autoridade#!"
 bp1_yearly.2021.a_tt:0 "[bp1_yearly_2021_martial_person.GetShortUIName|U] se junta à sua corte"
 bp1_yearly.2021.b:0 "Uma pessoa instruída certamente beneficiaria minha corte."
 bp1_yearly.2021.b_tt:0 "[bp1_yearly_2021_learning_person.GetShortUIName|U] se junta à sua corte"
 bp1_yearly.2021.c:0 "As habilidades financeiras dest[Select_CString( bp1_yearly_2021_stewardship_person.IsFemale, 'a', 'e' )] são incríveis!"
 bp1_yearly.2021.c_tt:0 "[bp1_yearly_2021_stewardship_person.GetShortUIName|U] se junta à sua corte"
 bp1_yearly.2021.d:0 "A diplomacia parece a opção tática."
 bp1_yearly.2021.d_tt:0 "[bp1_yearly_2021_diplomacy_person.GetShortUIName|U] se junta à sua corte"
 bp1_yearly.2021.desc:0 "[bp1_yearly_2020_influencing_partner.GetFirstName] me alcança mais uma vez. \"[bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)|U]! Eu trago notícias!\" [bp1_yearly_2020_influencing_partner.GetSheHe|U] se apressa ao meu lado, revelando uma folha macia com uma coleção de rabiscos enquanto o faz. \"Essas pessoas maravilhosas ficariam muito felizes em vir trabalhar para você, aqui em nossa corte!\"\n\nEu olho para a folha. Essas são habilidades impressionantes, eu devo admitir!"
 bp1_yearly.2021.e:0 "[Select_CString( bp1_yearly_2021_intrigue_person.IsFemale, 'Uma candidata', 'Um candidato' )] muito #EMP intrigante#!"
 bp1_yearly.2021.e_tt:0 "[bp1_yearly_2021_intrigue_person.GetShortUIName|U] se junta à sua corte"
 bp1_yearly.2021.f:0 "Eu mudei de ideia."
 bp1_yearly.2021.t:0 "Persona Grata"
 bp1_yearly.2022.a_imprisoned:0 "Isso é um[Select_CString( bp1_yearly_2020_target.IsFemale, 'a', '' )] #EMP [bp1_yearly_2020_target.Custom2('InsultNoun', ROOT.Char)]#!!"
 bp1_yearly.2022.b_dead:0 "O quê? Não! Isso não pode ser! [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip]..."
 bp1_yearly.2022.desc_dead:0 "Você não vai acreditar no que aconteceu comigo outro dia. Um[Select_CString( bp1_yearly_2020_influencing_partner.IsFemale, 'a', '' )] [bp1_yearly_2020_influencing_partner.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2020_target'))] malicioso tentou me matar, mas [bp1_yearly_2020_influencing_partner.GetFaith.HighGodName] estava comigo e me manteve a salvo. Em troca, mantenho a sua cabeça como decoração em meu estudo pessoal.\nConsidere-se avisado."
 bp1_yearly.2022.desc_imprisoned:0 "\n\nEu tenho em minha posse um indivíduo que jura que você não teve participação na sua #EMP tentativa de me assassinar#! . Eu não acredito ness[Select_CString( bp1_yearly_2020_influencing_partner.IsFemale, 'a', 'e' )] [bp1_yearly_2020_influencing_partner.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2020_target'))] traiçoeiro.\n\nConsidere-se avisado."
 bp1_yearly.2022.desc_intro:0 "[bp1_yearly_2020_target.Custom2('NegativeSupplimentaryGreeting', ROOT.Char )]"
 bp1_yearly.2022.t:0 "[bp1_yearly_2020_target.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
 bp1_yearly.2023.a:0 "Você mereceu isso, [bp1_yearly_2020_influencing_partner.GetTitledFirstNameNoTooltip]."
 bp1_yearly.2023.a_imprisoned_dead:0 "É a coisa honrada a se fazer."
 bp1_yearly.2023.b:0 "Sua capacidade de conspirar me preocupa, minha querida."
 bp1_yearly.2023.b_killer:0 "Não posso permitir que você fique livre depois disso."
 bp1_yearly.2023.c:0 "Olha, ambos sabemos que isso não está certo..."
 bp1_yearly.2023.c_imprisoned_dead:0 "#EMP Tecnicamente#!, [bp1_yearly_2020_influencing_partner.GetSheHe] não concluiu o trabalho..."
 bp1_yearly.2023.desc_died:0 "Com a morte d[bp1_yearly_2020_influencing_partner.GetSheHe] pelas mãos d[Select_CString( bp1_yearly_2020_target.IsFemale, 'a', 'o' )] [bp1_yearly_2020_target.GetTitledFirstName] eu... Eu... #EMP respiro#!.\nEu respiro por alguns momentos em minha solidão.\n\nEu #EMP vou#! vingar [bp1_yearly_2020_influencing_partner.GetSheHe]. Eu juro pelo [ROOT.Char.GetFaith.HighGodName], [bp1_yearly_2020_target.GetFirstName] será detid[Select_CString( bp1_yearly_2020_target.IsFemale, 'a', 'o' )].\n\nEm "
 bp1_yearly.2023.desc_hesitant:0 "[bp1_yearly_2020_influencing_partner.GetFirstName] olha para cima quando entro na cozinha e inclina levemente a cabeça."
 bp1_yearly.2023.desc_imprisoned:0 "Com o seu aprisionamento pelas mãos daquel[Select_CString( bp1_yearly_2020_target.IsFemale, 'a', 'e' )] [bp1_yearly_2020_target.Custom('InsultAdjectiveGeneric')] d[Select_CString( bp1_yearly_2020_target.IsFemale, 'a', 'o' )] [bp1_yearly_2020_target.GetFirstName]...\n\nEu fecho meus olhos na tentativa de não pensar nos horrores que [bp1_yearly_2020_influencing_partner.GetSheHe] pode estar sujeita(o) enquanto estiver em cativeiro.\n\nEm "
 bp1_yearly.2023.desc_killed_target:0 "[bp1_yearly_2020_influencing_partner.GetSheHe|U] se inclina atrás do balcão apenas para revelar o que parece ser um saco de estopa pesadamente manchado. Em um movimento rápido, o conteúdo é esvaziado na superfície plana.\n\nO olhar inerte da cabeça d[Select_CString( bp1_yearly_2020_target.IsFemale, 'a', 'o' )] [bp1_yearly_2020_target.GetTitledFirstNamePossessive] me cumprimenta, e sinto um tremor no meu abdômen.\nQue dia #EMP maravilhoso#! este se tornou!"
 bp1_yearly.2023.desc_outro:0 "\n\n[bp1_yearly_2020_influencing_partner.GetSheHe|U] pisca. \"Agora é a sua vez, m[Select_CString( ROOT.Char.GetLiege.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]!\""
 bp1_yearly.2023.desc_outro_sad:0 "para recompensar a sua coragem, o certo a fazer seria honrar o seu pedido."
 bp1_yearly.2023.desc_picked_diplomacy:0 "\"Sem dúvida, [bp1_yearly_2021_new_courtier.GetTitledFirstName] é capaz o suficiente para falar por [bp1_yearly_2021_new_courtier.GetHerselfHimself] — pelo menos eu sempre tenho que pensar duas vezes sobre o que estou concordando para que as coisas nem #EMP sempre#! acabam do seu jeito!"
 bp1_yearly.2023.desc_picked_intrigue:0 "\"[bp1_yearly_2021_new_courtier.GetTitledFirstName] certamente tece uma teia intricada, não é [bp1_yearly_2021_new_courtier.GetSheHe]? Eu sempre tento ficar do seu lado bom.\""
 bp1_yearly.2023.desc_picked_learning:0 "\"[bp1_yearly_2021_new_courtier.GetTitledFirstName] é uma maravilha de conhecimento, não é [bp1_yearly_2021_new_courtier.GetSheHe]! Eu sempre invejei a sua inteligência.\""
 bp1_yearly.2023.desc_picked_martial:0 "\"Eu confio que m[Select_CString( bp1_yearly_2021_new_courtier.IsFemale, 'inha', 'eu' )] [bp1_yearly_2021_new_courtier.GetWomanMan] [bp1_yearly_2021_new_courtier.GetTitledFirstName] seja do seu agrado? Músculos de aço, eu te digo.\""
 bp1_yearly.2023.desc_picked_none:0 "\n\n\"Lamento que nenhum dos candidatos tenha sido do seu agrado, [bp1_yearly_2020_influencing_partner.Custom2('RelationToMeShort', ROOT.Char)]. Espero que você ainda possa apreciar o trabalho que fiz em reunir as melhores pessoas que [ROOT.Char.GetCapitalLocation.GetName] e arredores têm a oferecer.\"\n\n[bp1_yearly_2020_influencing_partner.GetSheHe|U] olha para mim com expectativa."
 bp1_yearly.2023.desc_picked_stewardship:0 "\"Eu confio que [Select_CString( bp1_yearly_2021_new_courtier.IsFemale, 'a', 'o' )] [bp1_yearly_2021_new_courtier.GetTitledFirstName] esteja enchendo seus cofres! [bp1_yearly_2021_new_courtier.GetSheHe|U] sempre foi uma verdadeira joia.\""
 bp1_yearly.2023.desc_sad:0 "Olho ao redor da cozinha vazia. Ecoa oco, pois [Select_CString( bp1_yearly_2020_influencing_partner.IsFemale, 'a', 'o' )] [bp1_yearly_2020_influencing_partner.GetFirstName] está ausente ao meu lado."
 bp1_yearly.2023.desc_triumphant:0 "[bp1_yearly_2020_influencing_partner.GetFirstName] sorri triunfantemente na minha direção enquanto eu me aproximo d[bp1_yearly_2020_influencing_partner.GetSheHe]."
 bp1_yearly.2023.t:0 "Todos saúdem [Select_CString( ROOT.Char.GetLiege.IsFemale, 'a', 'o' )] [ROOT.Char.GetLiege.GetTitleAsNameNoTooltip]"
 bp1_yearly.2030.a:0 "Talvez você pudesse socializar um pouco?"
 bp1_yearly.2030.a_tt_gregarious:0 "Tenho certeza de que isso vai funcionar bem."
 bp1_yearly.2030.a_tt_paranoia:0 "Mas e se acabarem discutindo #EMP sobre mim...#!"
 bp1_yearly.2030.b:0 "Aposto que [Select_CString( bp1_yearly_2030_target_consort.IsFemale, 'a', 'o' )] [bp1_yearly_2030_target_consort.GetTitledFirstNameNoTooltip] pode ser #EMP estimulante#!..."
 bp1_yearly.2030.b_tt:0 "Tudo o que você precisa é amor?"
 bp1_yearly.2030.c:0 "Uma nova habilidade sempre refresca #EMP meu#! humor!"
 bp1_yearly.2030.d:0 "Francamente, tenho assuntos mais importantes para cuidar."
 bp1_yearly.2030.desc:0 "Ao entrar na [ROOT.Char.Custom('GetRoom')], percebo [Select_CString( bp1_yearly_2030_mopey_consort.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', bp1_yearly_2030_mopey_consort )] [bp1_yearly_2030_mopey_consort.GetTitledFirstName] agindo de forma distante e indiferente. Vou até [bp1_yearly_2030_mopey_consort.GetSheHe] e coloco uma mão em seu ombro. \"O que está acontecendo?\", pergunto.\n\n[bp1_yearly_2030_mopey_consort.GetSheHe|U] me olha por um momento e suspira pesadamente. \"É esse lugar, é tão... pouco estimulante.\"\n\nOs ombros [bp1_yearly_2030_mopey_consort.GetHerHim|U] se movem em um encolher de ombros. \"Eu simplesmente não sei o que fazer comigo mesmo.\""
 bp1_yearly.2030.t:0 "O Que [Select_CString( bp1_yearly_2030_mopey_consort.IsFemale, 'Uma', 'Um' )] [bp1_yearly_2030_mopey_consort.Custom('GirlBoy')|U] Pode Fazer"
 bp1_yearly.2030.tt_best_friend:0 "O relacionamento floresce"
 bp1_yearly.2030.tt_failure:0 "Relacionamento degradado"
 bp1_yearly.2030.tt_friend:0 "Eles se dão muito bem"
 bp1_yearly.2030.tt_lover:0 "Eles se dão muito bem #EMP realmente#!"
 bp1_yearly.2030.tt_nemesis:0 "Eles se tornam inimigos mortais"
 bp1_yearly.2030.tt_nothing:0 "O relacionamento ainda está um pouco estagnado"
 bp1_yearly.2030.tt_potential_friend:0 "Eles aumentam ligeiramente sua afinidade um pelo outro"
 bp1_yearly.2030.tt_potential_rival:0 "Eles têm um obstáculo"
 bp1_yearly.2030.tt_rival:0 "Eles acabam com uma forte antipatia um pelo outro"
 bp1_yearly.2030.tt_success:0 "Relacionamento melhorado"
 bp1_yearly.2040.a:0 "#EMP Eu só#! ouvi [bp1_yearly_2040_target_consort.GetSheHe] dizer coisas boas sobre você."
 bp1_yearly.2040.a_tt:0 "Acalme a situação."
 bp1_yearly.2040.b:0 "Você sabe, [bp1_yearly_2040_target_consort.GetSheHe] #EMP disse#! algo sobre sua [bp1_yearly_2040_target_consort.Custom('RandomBodyFeatureNoun')]..."
 bp1_yearly.2040.b_tt:0 "Provocar [bp1_yearly_2040_upset_consort.GetSheHe]."
 bp1_yearly.2040.c:0 "[bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip], #EMP acalme-se#!. Vá conversar com [bp1_yearly_2040_target_consort.GetSheHe]."
 bp1_yearly.2040.c_tt:0 "Tudo pode ser resolvido através da comunicação."
 bp1_yearly.2040.d:0 "Eu #EMP realmente#! não me importo. Resolva isso."
 bp1_yearly.2040.d_tt:0 "Isso é ridículo!"
 bp1_yearly.2040.desc:0 "[bp1_yearly_2040_upset_consort.GetTitledFirstName] entra no meu [ROOT.Char.Custom('GetRoom')], furios[Select_CString( bp1_yearly_2040_upset_consort.IsFemale, 'a', 'o' )] como uma panela fervente. O calor que vem del[Select_CString( bp1_yearly_2040_upset_consort.IsFemale, 'a', 'e' )] é um pouco intimidador.\n\n\"Isto é #EMP INACEITÁVEL#!, a forma como [bp1_yearly_2040_target_consort.GetSheHe], [bp1_yearly_2040_target_consort.GetSheHe]... argh! [bp1_yearly_2040_target_consort.GetFirstName] é um[Select_CString( bp1_yearly_2040_target_consort.IsFemale, 'a', '' )] #EMP [bp1_yearly_2040_target_consort.Custom2('InsultNoun', SCOPE.sC('bp1_yearly_2040_upset_consort'))]#!!\" [bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip] gesticula furiosamente com seus braços. \"Você não pode fazer #EMP algo#!?!\""
 bp1_yearly.2040.desc_default:0 "\n\nEstá claro que algo aconteceu."
 bp1_yearly.2040.desc_outro:0 "Preciso pisar com cuidado."
 bp1_yearly.2040.desc_paranoia:0 "\n\nDada a condição d[Select_CString( bp1_yearly_2040_upset_consort.IsFemale, 'a', 'o' )] [bp1_yearly_2040_upset_consort.GetFirstNameNoTooltip], não posso ter certeza de que algo #EMP aconteceu#!."
 bp1_yearly.2040.t:0 "Disputas Domésticas"
 bp1_yearly.2040.tt_critical_failure:0 "A situação piorou."
 bp1_yearly.2040.tt_critical_success:0 "Eles riem do mal-entendido."
 bp1_yearly.2040.tt_failure:0 "A situação #EMP não#! foi resolvida."
 bp1_yearly.2040.tt_severe_failure:0 "As coisas tomam um rumo para pior."
 bp1_yearly.2040.tt_severe_success:0 "[bp1_yearly_2040_upset_consort.GetFirstName] talvez tenha sido um pouco literal demais."
 bp1_yearly.2040.tt_success:0 "A situação foi resolvida."
 bp1_yearly.2050.a:0 "Muito obrigado, isso será uma boa adição!"
 bp1_yearly.2050.a_tt:0 "Qualquer coisa para melhorar o reino!"
 bp1_yearly.2050.b:0 "Hmm, talvez possamos chegar a um #EMP compromisso.#!"
 bp1_yearly.2050.b_tt_greedy:0 "Eles pediram muito ouro."
 bp1_yearly.2050.c:0 "Eu não gosto nada dessa ideia. #EMP Guardas!#!"
 bp1_yearly.2050.c_tt_irritable:0 "A audácia dess[Select_CString( bp1_yearly_2050_first_consort.IsFemale, 'as', 'es' )] [bp1_yearly_2050_first_consort.GetWomenMen]!"
 bp1_yearly.2050.c_tt_paranoid:0 "Quem sabe o que mais eles podem concordar..."
 bp1_yearly.2050.d:0 "Eu não estou #EMP convencido#! de que isso seja uma ideia produtiva."
 bp1_yearly.2050.d_tt:0 "É melhor não encorajar isso."
 bp1_yearly.2050.desc:0 "\n\n\"Estamos discutindo entre nós há um tempo, [ROOT.Char.GetTitledFirstName].\nGostaríamos de retribuir à comunidade e, sob a orientação d[Select_CString( highest_consort_skill_person.IsFemale, 'a', 'o' )] [highest_consort_skill_person.GetFirstName], gostaríamos de nos matricular em "
 bp1_yearly.2050.desc_diplomacy:0 "estudos relacionados à diplomacia e à arte da espada envainada.\""
 bp1_yearly.2050.desc_duo:0 "\n\nA dupla se olha e acena em uníssono."
 bp1_yearly.2050.desc_intrigue:0 "estudos relacionados à intriga e à arte da sutileza e do subterfúgio.\""
 bp1_yearly.2050.desc_intro:0 "Meus consortes se aproximam enquanto estou passeando à tarde."
 bp1_yearly.2050.desc_intro_paranoid:0 "Meus consortes me emboscam enquanto estou passeando à tarde."
 bp1_yearly.2050.desc_learning:0 "estudos relacionados ao aprendizado e à arte da palavra escrita.\""
 bp1_yearly.2050.desc_martial:0 "estudos relacionados à guerra e à arte do combate corporal.\""
 bp1_yearly.2050.desc_paranoid:0 "Eu os observo cuidadosamente. Os pelos da minha nuca se arrepiam toda vez que [bp1_yearly_2050_first_consort.GetSheHe] menciona a palavra #EMP nós#!."
 bp1_yearly.2050.desc_quartet:0 "\n\nO quarteto se olha e acena em uníssono."
 bp1_yearly.2050.desc_stewardship:0 "estudos relacionados ao governo e à arte de gerenciar um domínio.\""
 bp1_yearly.2050.desc_trio:0 "\n\nO trio se olha e acena em uníssono."
 bp1_yearly.2050.t:0 "Um Estudo em [bp1_yearly_2050_first_consort.Custom('IrmadadeFraternidade')|U]"
 bp1_yearly.2060.a:0 "Isso parece uma ótima ideia!"
 bp1_yearly.2060.a_paranoid:0 "Se você insiste."
 bp1_yearly.2060.a_tt_paranoid:0 "Quem sabe com que mais eles estão doutrinando [bp1_yearly_2060_target_child.GetSheHe]..."
 bp1_yearly.2060.b:0 "[bp1_yearly_2060_target_child.GetSheHe|U] seria melhor servid[Select_CString( bp1_yearly_2060_target_child.IsFemale, 'a', 'o' )] melhorando seu [bp1_yearly_2060_target_child.Custom('LowestSkillFlag')]."
 bp1_yearly.2060.c:0 "Não, eu não acho que isso seja uma boa ideia."
 bp1_yearly.2060.desc_diplomacy:0 "diplomacia e garantir que todos se deem bem,\""
 bp1_yearly.2060.desc_intrigue:0 "intriga e o subterfúgio da corte,\""
 bp1_yearly.2060.desc_intro:0 "Tenho notado que [Select_CString( bp1_yearly_2060_first_consort.IsFemale, 'a', 'o' )] [bp1_yearly_2060_first_consort.GetTitledFirstName] e [Select_CString( bp1_yearly_2060_second_consort.IsFemale, 'a', 'o' )] [bp1_yearly_2060_second_consort.GetTitledFirstName] têm passado muito tempo juntos recentemente. Esta manhã, a dupla se aproxima de mim, visivelmente animada com algo.\n\n\"[ROOT.Char.GetTitledFirstName]! [bp1_yearly_2060_second_consort.GetFirstNameNoTooltip] e eu temos nos aproximado por causa de nosso interesse compartilhado em "
 bp1_yearly.2060.desc_learning:0 "aprender e compartilhar nosso amor pelo conhecimento,\""
 bp1_yearly.2060.desc_martial:0 "artes marciais e conhecimento de combate,\""
 bp1_yearly.2060.desc_outro:0 " [bp1_yearly_2060_first_consort.GetFirstNameNoTooltip] piou.\n\n[bp1_yearly_2060_second_consort.GetFirstNameNoTooltip] interrompe: \"M[Select_CString( bp1_yearly_2060_target_child.IsFemale, 'inha', 'eu' )] [bp1_yearly_2060_second_consort.Custom2('RelationToMeShort', bp1_yearly_2060_target_child)] [bp1_yearly_2060_target_child.GetFirstNameNoTooltip] tem mostrado grande promessa nesta área, e gostaríamos de tutorar [bp1_yearly_2060_target_child.GetSheHe]!\""
 bp1_yearly.2060.desc_stewardship:0 "economia e habilidades de administração,\""
 bp1_yearly.2060.t:0 "Leva uma Aldeia"
 bp1_yearly.2060.tt_critical_success:0 "[bp1_yearly_2060_target_child.GetFirstNameNoTooltip] absorve muito bem o conhecimento"
 bp1_yearly.2060.tt_failure:0 "O tutoramento não é bem-sucedido"
 bp1_yearly.2060.tt_success:0 "O tutoramento é bem-sucedido"
 bp1_yearly.2070.a:0 "M[Select_CString( bp1_yearly_2070_soulmate.IsFemale, 'inha', 'eu' )] doce [bp1_yearly_2070_soulmate.GetFirstNameNoTooltip] - pude passar todo esse tempo com você!"
 bp1_yearly.2070.a_tt:0 "Você abraça [Select_CString( bp1_yearly_2070_soulmate.IsFemale, 'a', 'o' )] [bp1_yearly_2070_soulmate.GetFirstNameNoTooltip]."
 bp1_yearly.2070.b:0 "Isso simplesmente não era a vontade de [ROOT.Char.GetFaith.HighGodNamePossessive]."
 bp1_yearly.2070.b_tt:0 "[bp1_yearly_2070_soulmate.GetFirstNameNoTooltip] encontra algum consolo nisso."
 bp1_yearly.2070.c:0 "Você e eu sabemos que é para o melhor."
 bp1_yearly.2070.c_tt:0 "Este mundo é um lugar terrível."
 bp1_yearly.2070.desc:0 "Percebi que [Select_CString( bp1_yearly_2070_soulmate.IsFemale, 'a', 'o' )] [bp1_yearly_2070_soulmate.GetFirstName] estava abatido e distante ultimamente. Durante nossa caminhada tradicional pelos arredores de nossa casa, ganhei coragem para confrontá-l[Select_CString( bp1_yearly_2070_soulmate.IsFemale, 'a', 'o' )].\n\n\"Então você percebeu, né.\" [bp1_yearly_2070_soulmate.GetSheHe|U] caminha mais devagar, eventualmente parando para contemplar a vista. A luz do sol reflete em sua pele.\n\n\"Eu te amo. E eu amo a nossa vida juntos.\" Os seus olhos ficam marejados. \"Meu único arrependimento é nunca ter conseguido dar a você, ou a nós, um filho para deixar neste mundo.\"\n\nSuas palavras ressoam em meus ouvidos. Levar essa carga sozinho, m[Select_CString( bp1_yearly_2070_soulmate.IsFemale, 'inha', 'eu' )] doce e forte [bp1_yearly_2070_soulmate.GetFirstName]!"
