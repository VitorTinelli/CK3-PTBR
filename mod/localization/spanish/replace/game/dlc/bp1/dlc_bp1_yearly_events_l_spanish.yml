l_spanish:
 bp1_yearly.2000.a_duo:0 "Uma [ROOT.Char.Custom('RandomJewelry')], adequada para m[Select_CString( bp1_yearly_2000_partner_a.IsFemale, 'inha', 'eu' )] [bp1_yearly_2000_partner_a.Custom('ComplimentAdjective')] [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip]."
 bp1_yearly.2000.a_single:0 "Uma [ROOT.Char.Custom('RandomJewelry')], adequada para [bp1_yearly_2000_partner_a.GetFirstNameNoTooltip]!"
 bp1_yearly.2000.b:0 "Esta [ROOT.Char.Custom('RandomJewelry')] ficaria [ROOT.Char.Custom('RandomPositiveLookAdjective')] no corpo [bp1_yearly_2000_partner_b.Custom('ComplimentAdjective')] de [bp1_yearly_2000_partner_b.GetFirstNamePossessiveNoTooltip]."
 bp1_yearly.2000.c:0 "Por que se contentar com um?"
 bp1_yearly.2000.c_flavor:0 "Vamos mimá-los!"
 bp1_yearly.2000.d:0 "O presente da minha companhia é brilhante o suficiente."
 bp1_yearly.2000.desc.duo:0 "\n\nEnquanto eu caminho por um dos mercadores vendendo joias, hesito e me inclino para um olhar mais próximo.\n\nTalvez uma dessas pudesse alegrar o dia do meu querido [bp1_yearly_2000_partner_a.GetTitledFirstName] ou [bp1_yearly_2000_partner_b.GetTitledFirstName]?"
 bp1_yearly.2000.desc.greed_flavor:0 "Essas peças parecem caras... mas talvez valham a pena."
 bp1_yearly.2000.desc.intro:0 "O burburinho é palpável entre as barracas de comércio ambulante. As cabanas temporárias estão lotadas até o teto e contêm todo tipo de bugigangas."
 bp1_yearly.2000.desc.not_greed_flavor:0 "Essas peças são radiantes e fariam um lindo presente."
 bp1_yearly.2000.desc.single:0 "\n\nEnquanto [bp1_yearly_2000_partner_a.GetTitledFirstName] e eu passamos por um dos mercadores vendendo joias, [bp1_yearly_2000_partner_a.GetSheHe] hesita levemente ao se inclinar para um olhar mais próximo.\n\nTalvez uma dessas pudesse alegrar o dia do meu [ROOT.Char.Custom2('PartnerOpinionDescription', SCOPE.sC('bp1_yearly_2000_partner_a') )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_yearly_2000_partner_a'))]?"
 bp1_yearly.2000.t:0 "Um Presente Adequado Para..."
 bp1_yearly.2001.a.tt_secret:0 "Segredo de [bp1_yearly_2001_secret_owner.GetTitledFirstNamePossessive]"
 bp1_yearly.2001.a:0 "Oh, por favor, conte-me o que descobriu, minha [ROOT.Char.Custom('PartnerOpinionHighDescription')]!"
 bp1_yearly.2001.a_tt:0 "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] irá compartilhar um segredo com você."
 bp1_yearly.2001.b:0 "Estou mais interessado em você, [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom('LoverPetName')] e não em #EMP você#!"
 bp1_yearly.2001.c:0 "Como você... não importa. Por favor, ilumine-me!"
 bp1_yearly.2001.c_tt:0 "[bp1_yearly_2001_partner.GetShortUINameNoTooltip] fornece uma pista sobre um assunto."
 bp1_yearly.2001.d:0 "Eu confio em você, meu [ROOT.Char.Custom('PartnerOpinionHighDescription')]."
 bp1_yearly.2001.desc.close_finance_modifier:0 "\n\nOu na verdade, eu estava enganado(a). Peço desculpas por ter desperdiçado seu tempo!"
 bp1_yearly.2001.desc.close_modifier:0 "ficar de olhos abertos para qualquer comportamento... indelicado... que venha em nossa direção."
 bp1_yearly.2001.desc.fallback:0 "\n\n\"...ou na verdade, eu estava enganado. Minhas desculpas por perder seu tempo!\""
 bp1_yearly.2001.desc.finance_modifier:0 "procurar fornecer a você os melhores conselhos financeiros com base em minhas fontes."
 bp1_yearly.2001.desc.hook:0 "Eu posso ter... bem, não vamos falar sobre o que eu fiz na questão, mas o que eu vou dizer é que um conhecido mútuo me deve um favor."
 bp1_yearly.2001.desc.intro:0 "\"[bp1_yearly_2001_partner.Custom2('RelationToMeShort', ROOT.Char)|U], parece que nos vemos cada vez menos!\n\nEu posso ter descoberto algumas informações úteis para o nosso governo.\""
 bp1_yearly.2001.desc.intro_high_opinion:0 "\"[Select_CString( ROOT.Char.IsFemale, 'Minha querida', 'Meu querido' )] [ROOT.Char.GetFirstNameNoTooltip], é tão bom ver você!\n\nEu o observo enquanto governa nosso [ROOT.Char.Custom('GetRealmOrDomicile')] e gostaria de ajudar de qualquer maneira que eu puder.\""
 bp1_yearly.2001.desc.lover:0 "e eu não consigo evitar de admirar os traços de seu/sua [ROOT.Char.Custom('RandomPositiveLookAdjective')], tentando gravá-los em minha mente."
 bp1_yearly.2001.desc.outro:0 "\n\n[bp1_yearly_2001_partner.GetSheHe|U] inclina a cabeça e me olha expectante."
 bp1_yearly.2001.desc.secret:0 "Eu ouvi algo que você não vai acreditar, escutando os serviçais outro dia."
 bp1_yearly.2001.desc.segway_lover:0 "\n\nUma brisa silenciosa move os seus cabelos"
 bp1_yearly.2001.desc.segway_modifier:0 "\n\nEntão [bp1_yearly_2001_partner.GetSheHe] faz uma careta, como se lembrasse de algo importante. \"Eu poderia"
 bp1_yearly.2001.desc.segway_secret_hook:0 "\n\n[bp1_yearly_2001_partner.GetSheHe|U] olha por cima do seu ombro"
 bp1_yearly.2001.e:0 "Eu #EMP apreciaria#! uma melhoria nas finanças."
 bp1_yearly.2001.t.first_title_duo:0 "... Um Governante..."
 bp1_yearly.2001.t.second_title_duo:0 "... E Uma Boa [ROOT.Char.GetWomanMan|U]"
 bp1_yearly.2001.t:0 "... Um Governante"
 bp1_yearly.2010.a:0 "Isso é doce. E possivelmente útil."
 bp1_yearly.2010.a_lustful:0 "Devo começar a fazer anotações!"
 bp1_yearly.2010.a_tt:0 "O que #EMP mais#! pode estar acontecendo debaixo do meu telhado..."
 bp1_yearly.2010.a_tt_lustful:0 "Estou #EMP adorando#! isso!"
 bp1_yearly.2010.b:0 "Talvez eles precisem de uma #EMP terceira#! pessoa para ajudar..."
 bp1_yearly.2010.c:0 "Isso é uma tragédia!"
 bp1_yearly.2010.c_tt:0 "Meu coração está partido."
 bp1_yearly.2010.desc.default:0 "envoltos em um abraço terno na luz da manhã.\n\n\"[bp1_yearly_2010_second_partner.GetFirstNameNoTooltip], não brinque comigo, meu [ROOT.Char.Custom('LoverPetName')]...\" [bp1_yearly_2010_first_partner.GetSheHe|U] enterra [bp1_yearly_2010_first_partner.GetHerHis] rosto no pescoço de [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip].\n\n\"Podemos passar a noite de amanhã juntos, meu [ROOT.Char.Custom('LoverPetName')],\" [bp1_yearly_2010_second_partner.GetFirstNameNoTooltip] retorquiu. \"Enquanto eu puder passar meus dias com você, nada mais importa.\""
 bp1_yearly.2010.desc.intro:0 "À primeira vista, o corredor parece deserto. Com um passo firme, eu me dirijo para a primeira tarefa do dia.\n\nDe repente, eu ouço um riso abafado e paro imediatamente. Eu me inclino para a frente para pegar um vislumbre de [bp1_yearly_2010_first_partner.GetShortUIName] e [bp1_yearly_2010_second_partner.GetShortUIName],"
 bp1_yearly.2010.desc.lustful:0 "quente e pesado, engajados em... oh #EMP meu#!.\n\nÀ luz do dia? E o que eles estão fazendo com aquela #EMP [ROOT.Char.Custom('DeviantObjectNoun')]#!?"
 bp1_yearly.2010.t:0 "Dois navios na noite"
 bp1_yearly.2010.tt:0 "Circunstâncias tão curiosas!"
 bp1_yearly.5100.a:0 "Apenas seja você mesmo, [unloved_courtier.GetNameNoTooltip]!"
 bp1_yearly.5100.b:0 "Você está certo, nunca foi um problema para mim!"
 bp1_yearly.5100.c:0 "Eu vou te ajudar!"
 bp1_yearly.5100.d:0 "Não perca a esperança, [unloved_courtier.GetNameNoTooltip]."
 bp1_yearly.5100.desc.end:0 "Isso nunca foi um problema para você, não é mesmo?\""
 bp1_yearly.5100.desc.fallback:0 "perfeitamente formado!"
 bp1_yearly.5100.desc.female:0 "naturalmente bonita!"
 bp1_yearly.5100.desc.male:0 "ruggedly handsome!"
 bp1_yearly.5100.desc.scarred:0 "nobre, com essas cicatrizes!"
 bp1_yearly.5100.desc.swole:0 "atraente, e construído como uma estátua!"
 bp1_yearly.5100.desc:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))] [unloved_courtier.GetName] parece desanimado há mais de uma semana e é o quinto suspiro pesado e desanimado do dia que finalmente me faz perguntar gentilmente qual é o problema. \n\n\"Estou tão solitário. Tudo o que eu quero é alguém especial! Alguém para ficar ao meu lado durante o dia e dividir minha cama à noite!\" [unloved_courtier.GetSheHe|U] pausa, então balança a cabeça tristemente. \n\n\"O que estou dizendo? Você não entende minha luta, não é, [ROOT.Char.Custom('FormOfAddressForLiege')]? Olhe para você! Você é tão"
 bp1_yearly.5100.t:0 "Flecha de Cupido"
 bp1_yearly.5100.toast:0 "Não funcionou."
 bp1_yearly.5101.a:0 "...cuidadoso e sensível."
 bp1_yearly.5101.b:0 "...justo e imparcial."
 bp1_yearly.5101.c:0 "...devoto e fervoroso."
 bp1_yearly.5101.d:0 "... na verdade, vamos escolher apenas a mais marcante."
 bp1_yearly.5101.desc:0 "\"Você fará isso, [ROOT.Char.Custom('FormOfAddressForLiege')]? Você realmente vai me ajudar?\"\n\nLembro-me do rosto de [unloved_courtier.GetNamePossessive] se iluminando quando concordei, um tanto cautelosamente, em ajudá-lo a encontrar o amor. Eu não sou exatamente especialista em arranjar encontros, então é mais com esperança do que certeza que eu entro na multidão em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] em busca de um potencial amor. \n\nEu examino a praça do mercado, observando vários candidatos em potencial, mas em prol de [unloved_courtier.GetNamePossessiveNoTooltip] eu realmente deveria procurar alguém que combina com [unloved_courtier.GetSheHe]. Alguém..."
 bp1_yearly.5101.t:0 "Flecha de Cupido: Um Alvo"
 bp1_yearly.5102.a.failure:0 "Não há química"
 bp1_yearly.5102.a.success:0 "Eles se dão bem"
 bp1_yearly.5102.a:0 "[unloved_courtier.GetNameNoTooltip]! Venha aqui!"
 bp1_yearly.5102.b:0 "Na verdade, talvez você prefira dispensar o encontro?"
 bp1_yearly.5102.c:0 "\"Você estaria desperdiçado em [Select_CString( unloved_courtier.IsFemale, 'uma', 'um' )] [unloved_courtier.GetWomanMan] da minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('unloved_courtier'))] calibre.\""
 bp1_yearly.5102.desc.compassionate:0 "está isolado em um canto da praça, aparentemente ajudando um gato de rua que parece estar em desesperada necessidade de água. Enquanto [Select_CString( potential_lover.IsFemale, 'a', 'o' )] [potential_lover.GetWomanMan] conforta o pobre animal, começo a imaginar um certo [ROOT.Char.Custom('GetCourtierPlural')] miserável recebendo o mesmo altruísmo..."
 bp1_yearly.5102.desc.end:0 "\n\nBasta um convite para o meu [ROOT.Char.Custom('GetCourt')] e a promessa de um pretendente para levar [Select_CString( potential_lover.IsFemale, 'a', 'o' )] [potential_lover.GetWomanMan] — [potential_lover.GetName], como seu nome foi revelado — a me acompanhar. Entrando triunfantemente pelas portas, avisto [unloved_courtier.GetName] envolvido em seu habitual e desinteressado desânimo do outro lado do tribunal.\n\n[unloved_courtier.GetNameNoTooltip] se vira para mim, expectante, com os olhos brilhando de esperança."
 bp1_yearly.5102.desc.just:0 "parece estar resolvendo uma disputa entre dois fazendeiros. [potential_lover.GetSheHe|U] escuta atentamente o lado da história de cada fazendeiro e emite um julgamento equitativo com o qual ambos parecem concordar."
 bp1_yearly.5102.desc.peng:0 "seria difícil de perder: cercado por um grupo de admiradores, suas roupas um pouco desgastadas não escondem sua aparência marcante."
 bp1_yearly.5102.desc.zealous:0 "está ouvindo atentamente um pregador que está discursando para a multidão. Para mim, parece um delírio de um louco, mas os olhos do ouvinte brilham com fervor e [potential_lover.GetSheHe] acena entusiasticamente junto com o discurso religioso."
 bp1_yearly.5102.desc:0 "Enquanto continuo minha busca, uma figura chama minha atenção. [potential_lover.GetSheHe|U]"
 bp1_yearly.5102.t:0 "Flecha de Cupido: Atingindo em Cheio"
 bp1_yearly.5301.a.tt:0 "Os dois investigam maneiras de ficar em forma"
 bp1_yearly.5301.a:0 "Sabe de uma coisa, [concerned_friend.GetFirstNameNoTooltip]? Você tem razão."
 bp1_yearly.5301.b.tt:0 "Você procura uma maneira de provar o seu ponto de vista"
 bp1_yearly.5301.b:0 "Não estou tão gordo assim!"
 bp1_yearly.5301.c:0 "Não estou tão magro!"
 bp1_yearly.5301.d.tt.lose:0 "Você perde a briga"
 bp1_yearly.5301.d.tt.win:0 "Você ganha a briga"
 bp1_yearly.5301.d.tt:0 "Os dois se engajam em uma briga de punhos um tanto patética"
 bp1_yearly.5301.d:0 "Você é um a falar de aparência!"
 bp1_yearly.5301.start:0 "Tenho percebido os olhares preocupados de [concerned_friend.GetFirstNamePossessive] em mim durante toda a noite enquanto comemos, "
 bp1_yearly.5301.t:0 "Um Problema de Peso"
 bp1_yearly.5301.thicc:0 "mas é quando alegremente aceito uma terceira porção de [ROOT.Char.Custom('GetExpensiveDessert')] que seu punho bate na mesa de repente.\n\n\"Não posso mais deixar isso acontecer!\" [concerned_friend.GetSheHe] grita para mim. \"Não posso ficar aqui e assistir você comer até a morte, [ROOT.Char.GetFirstName]!\"\n\nEu fico um pouco ofendido, mas é difícil parecer indignado com a boca cheia. Talvez eu goste de um lanche ocasional, mas é um negócio estressante administrar um [ROOT.Char.GetPrimaryTitle.GetTierAsName]!"
 bp1_yearly.5301.thinn:0 "mas é quando continuo a comer meu primeiro prato enquanto os próximos se acumulam que o seu punho bate na mesa de repente.\n\n\"Não posso mais deixar isso acontecer!\" [concerned_friend.GetSheHe] grita para mim. \"Não posso ficar aqui e assistir você desperdiçar, [ROOT.Char.GetFirstName]!\"\n\nEu fico um pouco ofendido, mas é difícil parecer indignado por trás da montanha crescente de pratos. Talvez eu #EMP não#! encontre muito tempo para comer, mas é um negócio que consome tempo administrar um [ROOT.Char.GetPrimaryTitle.GetTierAsName]!"
 bp1_yearly.5302.a.tt:0 "Você segue em direção ao bosque de árvores"
 bp1_yearly.5302.a:0 "Traga-me um machado!"
 bp1_yearly.5302.b.tt:0 "Você parte para o campo próximo"
 bp1_yearly.5302.b:0 "Melhor ficar apenas com a drenagem."
 bp1_yearly.5302.desc:0 "É um dia ensolarado e fresco, e eu posso ver o suor pingando do queixo de [concerned_friend.GetFirstNamePossessive] enquanto [concerned_friend.GetSheHe] continua a me encorajar a seguir em frente. O saco de pedras nas minhas costas geme com o peso, e eu também, quando o jogo no chão sobre a linha de sujeira que [concerned_friend.GetFirstNameNoTooltip] desenhou com um galho. [concerned_friend.GetSheHe|U] bate palmas animadamente.\n\n\"Você já está parecendo mais forte! Acho que é hora de passarmos para algo um pouco maior.\"\n\n\"Eu sei que estão realizando trabalhos de drenagem no campo ao lado e poderiam usar alguma ajuda. Caso contrário, se você estiver se sentindo corajoso, há um bosque de árvores logo depois da crista que estão derrubando. O que você acha?\""
 bp1_yearly.5302.t:0 "$bp1_yearly.5301.t$: Estrada Rochosa"
 bp1_yearly.5303.a.criticalfailure:0 "A árvore cai diretamente em cima de você!"
 bp1_yearly.5303.a.criticalsuccess:0 "Você derruba a árvore com sucesso!"
 bp1_yearly.5303.a.failure:0 "Você não consegue derrubar a árvore sem ajuda"
 bp1_yearly.5303.a.wounded:0 "A árvore te acerta no caminho para baixo"
 bp1_yearly.5303.a:0 "Bem, não pode ser tão difícil, não é?"
 bp1_yearly.5303.b:0 "Você poderia me dar uma mão, [concerned_friend.GetFirstNameNoTooltip]?"
 bp1_yearly.5303.desc:0 "Derrubar árvores é um negócio perigoso para alguém tão inexperiente quanto eu. Mesmo sob os olhos vigilantes de [concerned_friend.GetFirstNamePossessive], a combinação de minha falta de consciência e esforço já resultou em alguns sustos. Enfiando meu machado na madeira de um tronco próximo, eu pauso para beber do meu cantil. [concerned_friend.GetFirstNameNoTooltip] se aproxima de mim, com seu próprio machado pendurado no ombro.\n\n\"Acho que você está pronto para lidar com algo um pouco maior!\" [concerned_friend.GetSheHe] diz, alegremente, e indica com seu machado. A árvore que está sendo apontada é enorme, uma imponente árvore de madeira dura, e eu a olho com cautela enquanto meus músculos doloridos se preparam para o que vem pela frente."
 bp1_yearly.5303.t:0 "$bp1_yearly.5301.t$: Derrubando Árvores"
 bp1_yearly.5304.a:0 "Segure firme, criança! Eu te seguro!"
 bp1_yearly.5304.b:0 "...será que alguém além de nós notaria se [waterboy.GetSheHe] se afogasse?"
 bp1_yearly.5304.desc:0 "A terra encharcada e pantanosa na qual me voluntariei para ajudar torna o trabalho suado. Eu trabalho duro ao lado dos camponeses desprevenidos com uma picareta, cavando valas e depositando sacos de lama molhada longe da área.\n\n[concerned_friend.GetFirstName] e eu estamos fazendo uma pausa, descansando na faixa estreita entre dois trechos de pântano, quando [waterboy.GetFirstName], uma das crianças encarregadas de manter os trabalhadores hidratados, se aproxima de mim oferecendo uma garrafa. Mal eu dou um gole, [waterboy.GetFirstNameNoTooltip], tentando pegar a garrafa, perde o equilíbrio e cai diretamente no pântano!"
 bp1_yearly.5304.t:0 "$bp1_yearly.5301.t$: Padrão Bog"
 bp1_yearly.5305.a:0 "Eu estou ótimo!"
 bp1_yearly.5305.b:0 "Eu devo tudo a você, [concerned_friend.GetFirstNameNoTooltip]."
 bp1_yearly.5305.desc:0 "Com minhas tarefas concluídas, me despeço dos camponeses com quem trabalhei ao lado de [concerned_friend.GetFirstName] - eles me acenam alegremente, completamente alheios às minhas origens nobres - e volto para meu alojamento habitual. Embora meus músculos estejam doloridos, sinto-me cheio de força e vitalidade.\n\nVendo uma grande bacia de água do outro lado da sala, eu me levanto e me aproximo. Tirando minha camisa, sob a luz das velas, observo meu reflexo na água."
 bp1_yearly.5305.t:0 "$bp1_yearly.5301.t$: Em Boa Forma"
 bp1_yearly.5306.a.criticalfailure:0 "Você deixa cair em cima de si mesmo!"
 bp1_yearly.5306.a.criticalsuccess:0 "Você a levanta no ar."
 bp1_yearly.5306.a.failure:0 "Você estica as costas"
 bp1_yearly.5306.a.success:0 "Você joga o trono para o ar!"
 bp1_yearly.5306.a:0 "Testemunhe-me, [concerned_friend.GetFirstNameNoTooltip]!"
 bp1_yearly.5306.artifact:0 "Meu olhar se fixa no [bulky_artifact.GetName]."
 bp1_yearly.5306.b:0 "...pensando melhor, talvez você esteja certo."
 bp1_yearly.5306.ending:0 "Para horror de [concerned_friend.GetFirstNameNoTooltip], eu tiro minha camisa e imediatamente me posiciono para levantar seu imenso peso."
 bp1_yearly.5306.start:0 "Furiosamente, eu ando de um lado para o outro pelo [ROOT.Char.Custom('GetCourt')], [concerned_friend.GetFirstName] ao meu lado.\n\n\"[ROOT.Char.GetFirstName]! Por favor, você não precisa provar nada para mim! Podemos simplesmente esquecer que eu disse algo!\" [concerned_friend.GetSheHe] é interrompido por um gesto desdenhoso da minha mão enquanto eu vasculho a sala em busca de algo adequadamente volumoso. Como [concerned_friend.GetSheHe] ousa impugnar minha honra assim!\n\n"
 bp1_yearly.5306.t:0 "$bp1_yearly.5301.t$: Teste de Força"
 bp1_yearly.5306.table:0 "Meu olhar se fixa em uma mesa pesada."
 bp1_yearly.5306.throne:0 "Meu olhar se fixa em meu trono."
 bp1_yearly.5708.a:0 "Isso é uma bobagem pagã!"
 bp1_yearly.5708.aniconist:0 "\"É um pequeno bastão de incenso, minha [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)]. Eu acho que ajuda a focar minha mente enquanto pratico minha fé.\" [heathen_friend.GetSheHe] explica. Um sorriso cruza o seu rosto quando [heathen_friend.GetSheHe] me observa."
 bp1_yearly.5708.b.tt:0 "Todos os vassalos #negative_value 10#! [opinion|E] que têm fé diferente ficam descontentes com você."
 bp1_yearly.5708.b:0 "Bem, se [heathen_friend.GetFirstNameNoTooltip] não é tão ruim assim, então..."
 bp1_yearly.5708.c.tt.failure:0 "Você não consegue entender os costumes de [heathen_friend.GetFirstNamePossessiveNoTooltip]."
 bp1_yearly.5708.c.tt.success:0 "Você aprende mais sobre os costumes de [heathen_friend.GetFirstNamePossessiveNoTooltip]."
 bp1_yearly.5708.c:0 "Talvez eu possa aprender algo com [heathen_friend.GetFirstNameNoTooltip]?"
 bp1_yearly.5708.end:0 "\"Sempre apreciei como você me trata tão bem apesar das nossas diferenças teológicas.\""
 bp1_yearly.5708.normal:0 "\"É um ícone religioso. Não da sua fé [ROOT.Char.GetFaith.GetAdjective], minha [heathen_friend.Custom2('RelationToMeShort', ROOT.Char)], mas da minha.\" [heathen_friend.GetSheHe] explica. Um sorriso cruza o seu rosto quando [heathen_friend.GetSheHe] avista meu próprio símbolo, suspenso de uma corrente ao redor do meu pescoço."
 bp1_yearly.5708.start:0 "Estou caminhando por uma rua movimentada com meu amigo [heathen_friend.GetFirstName] quando [heathen_friend.GetSheHe] de repente desaparece. Eu me viro para vê-la(o) em uma discussão profunda com um comerciante cujos bens parecem consistir principalmente em pequenos objetos curiosos. [heathen_friend.GetFirstNameNoTooltip|U], sua transação concluída, volta para mim com o novo objeto distraído.\n\n"
 bp1_yearly.5708.t:0 "Um Amigo Fiel"
 bp1_yearly.5709.a.tt.failure:0 "Você perde a briga"
 bp1_yearly.5709.a.tt.success:0 "Você ganha a briga"
 bp1_yearly.5709.a:0 "Vamos resolver isso na porrada!"
 bp1_yearly.5709.b.tt:0 "Inicie um $game_concept_single_combat_duel$ com [rival_on_sight.GetFirstNameNoTooltip]"
 bp1_yearly.5709.b:0 "[rival_on_sight.GetFirstNameNoTooltip], s[Select_CString( rival_on_sight.IsFemale, 'ua', 'eu' )] [rival_on_sight.Custom2('InsultNoun', ROOT.Char)]! Duvida de mim!"
 bp1_yearly.5709.c.tt:0 "Deixe-os com seu comportamento infantil."
 bp1_yearly.5709.c:0 "Não vou me envolver em uma briga infantil."
 bp1_yearly.5709.desc:0 "Que dia maravilhoso para ir pescar! Eu me sentiria como se nada pudesse tirar o sorriso do meu rosto, se não fosse por uma voz atrás de mim e meu parceiro de pesca [friend_backup.GetFirstName].\n\n\"Olha só quem está aqui!\" [rival_on_sight.GetFirstName], claramente acabado de voltar de sua própria viagem de pesca, está acompanhado pela figura de [rival_friend.GetFirstName]. O primeiro abaixa e pega uma de suas capturas que se contorcem. \"A semelhança é #EMP impressionante#!!\"\n\nEu me viro com um dramático revirar de olhos, mas um #EMP baque#! e uma umidade escorrendo pela parte de trás do meu pescoço me fazem parar abruptamente. Os olhos de [friend_backup.GetFirstName] se estreitam enquanto [friend_backup.GetSheHe] observa o peixe que foi jogado em nossa direção."
 bp1_yearly.5709.t:0 "Isca, Linha..."
 bp1_yearly.5711.a:0 "Você também pode ir!"
 bp1_yearly.5711.b:0 "Hah, hah! Bem feito!"
 bp1_yearly.5711.desc:0 "[rival_on_sight.GetFirstName] se levanta cambaleante depois do nosso duelo, ainda tola e desafiadora. [rival_on_sight.GetSheHe|U] abre a boca para reclamar, mas mal consegue pronunciar uma palavra antes que eu encha essa mesma boca com o peixe que foi usado como projétil. Cambaleando, [rival_on_sight.GetFirstNameNoTooltip] tropeça perigosamente em direção à beira do cais.\n\nDou um passo rápido à frente e planto um pé firmemente no estômago de [rival_on_sight.GetHerHis]. Por um momento que parece uma eternidade, [rival_on_sight.GetSheHe] fica suspensa no ar: braços girando, olhos arregalados, o peixe firmemente plantado no rosto, antes de cair repentinamente direto para baixo.\n\nO estrondoso mergulho produz um grande jato de água, e uma horrorizada [rival_friend.GetFirstName] corre até a beira do píer para estender uma mão para seu amigo, que está a esbravejar na água."
 bp1_yearly.5711.t:0 "...E Anzol"
 bp1_yearly.5712.a:0 "Eu não vou esquecer disso, [rival_on_sight.GetFirstNameNoTooltip]!"
 bp1_yearly.5712.b:0 "Talvez eu devesse apenas ficar longe do seu caminho..."
 bp1_yearly.5712.desc:0 "Furiosamente, eu me levanto para encarar as zombarias de [rival_on_sight.GetFirstName] e o comparsa de [rival_friend.GetFirstName]. Instável como estou em pé, no entanto, minha tentativa de apontar o dedo para o peito de [rival_on_sight.GetFirstNamePossessiveNoTooltip] me levou para além de [rival_on_sight.GetHerHim] completamente. Tudo o que foi preciso foi uma varrida no meu tornozelo e de repente minha visão é novamente obscurecida pela sujeira.\n\n[rival_on_sight.GetFirstNameNoTooltip], sorrindo com deleite, aplaude sarcasticamente enquanto eu rolo de volta para ficar de costas. Minha raiva sobe mais uma vez, mas não demora muito para eu me sentar quando o peixe maldito acerta meu rosto novamente com um sonoro #EMP tapa#!! [rival_on_sight.GetFirstNameNoTooltip] e [rival_friend.GetFirstNameNoTooltip] explodem em risadas enquanto se afastam, deixando [friend_backup.GetFirstName] preocupado finalmente me ajudar a ficar em pé."
 bp1_yearly.5712.t:0 "Alguma coisa errada?"
 bp1_yearly.5713.a:0 "Eu vou lidar com isso. Agora, deixe-me cuidar de você com um #EMP tapa#!"
 bp1_yearly.5713.b:0 "Eles podem ter tudo o que precisam, e mais."
 bp1_yearly.5713.c:0 "Deixe comigo."
 bp1_yearly.5713.d:0 "Como você se atreve a me extorquir?!"
 bp1_yearly.5713.desc:0 "Eu posso perceber que algo está errado com o meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('destitute_spouse'))] [destitute_spouse.GetFirstName] assim que estamos na cama juntos. [destitute_spouse.GetSheHe|U] está claramente distraído, e eu seguro a sua mão gentilmente enquanto pergunto o que está acontecendo.\n\n\"É... uma questão de dinheiro.\" [destitute_spouse.GetSheHe] suspira, passando a mão livre sobre a cabeça. \"Eu tenho alguns familiares com azar, e eles estão prestes a perder a casa deles. Eu costumava passar tempo lá quando era criança...\"\n\n[destitute_spouse.GetSheHe|U] olha para mim suplicante. \"Tem... tem alguma coisa que possamos fazer? Tenho certeza de que eles podem nos pagar de volta, eles só precisam se reerguer. Eles vão ficar bem, eu juro!\""
 bp1_yearly.5713.t:0 "Relações Recheadas"
 bp1_yearly.5714.a.catharsis:0 "#weak Você experimenta algum nível de catarse#!"
 bp1_yearly.5714.a.depressed:0 "#weak Você cai em depressão#!"
 bp1_yearly.5714.a.reallysad:0 "#weak Sua tristeza o sobrecarrega#!"
 bp1_yearly.5714.a.sad:0 "#weak Sua tristeza flui livremente#!"
 bp1_yearly.5714.a:0 "Nunca esquecerei este dia."
 bp1_yearly.5714.b:0 "Preciso ser forte e seguir em frente."
 bp1_yearly.5714.desc:0 "Há um buraco profundo e interminável em meu coração.\n\n[deceased_pal.GetFirstName] foi uma companheira e confidente constante, e tê-la arrancada da minha vida parece uma ferida mortal da qual nunca me recuperarei. Minha mão segura uma nota que [deceased_pal.GetSheHe] me deu - a última nota que [deceased_pal.GetSheHe] jamais me dará, percebo amargamente. Tento lê-la, mas tudo o que consigo fazer é afastá-la do meu rosto, para que as preciosas palavras contidas dentro dela não sejam lavadas por minhas lágrimas.\n\nEmbora haja uma multidão de muitos enlutados ao meu redor, nunca me senti tão sozinho."
 bp1_yearly.5714.t:0 "Dizendo Adeus"
 bp1_yearly.5715.a:0 "Concordaremos em discordar."
 bp1_yearly.5715.b:0 "É como eu digo. Isso é o fim!"
 bp1_yearly.5715.c.tt.failure:0 "Você perde o debate"
 bp1_yearly.5715.c.tt.success:0 "Você vence o debate"
 bp1_yearly.5715.c:0 "É 'gibbet', e vou provar!"
 bp1_yearly.5715.desc:0 "\"Não! Simplesmente não é assim que se diz! O venerável estudioso que #EMP inventou#! a palavra disse que era pronunciada do jeito que eu estou dizendo - \"\n\nEu e minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('gibbet_friend'))] [gibbet_friend.GetFirstName] estamos tendo um debate acalorado que não mostra sinais de diminuir. Depois de passarmos por um gibbet próximo, [gibbet_friend.GetSheHe] havia comentado sobre isso. Sendo fluente na língua [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip], gentilmente corrigi a pronúncia d[gibbet_friend.GetSheHe] - começa com um som duro, não um som suave, #EMP obviamente#! - e [gibbet_friend.GetSheHe] teve a audácia de discordar, e discordar veementemente!\n\n\"Não consigo acreditar que ainda está defendendo essa posição linguística [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('gibbet_friend'))]!\" [gibbet_friend.GetSheHe] explode, frustrada com minha insistência."
 bp1_yearly.5715.t:0 "Louco Falador"
 bp1_yearly.5716.a:0 "Este pecado não será tolerado!"
 bp1_yearly.5716.b:0 "Bom, qualquer coisa para manter a paz..."
 bp1_yearly.5716.c:0 "Pare imediatamente com isso! A criança precisa aprender!"
 bp1_yearly.5716.desc:0 "Caminhando pelo meu [ROOT.Char.Custom('GetCourt')], ouço uma voz exaltada, quase raivosa. Dou meia-volta e me deparo com uma cena incomum. [book_burner.GetFirstName] está de pé, imponente sobre meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_child'))] [book_child.GetFirstName], repreendendo [book_child.GetSheHe] enquanto [Select_CString( book_burner.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('book_burner'))] lança outro livro nas mandíbulas de um fogo crepitante.\n\n\"Você não vai ler mais essa #EMP imundície impura#!!\" [book_burner.GetSheHe] grita, condenando outro livro às chamas. \"Nenhuma criança nesta casa sofrerá a influência de [ROOT.Char.GetFaith.DevilNamePossessive]!\""
 bp1_yearly.5716.nobook:0 "\n\nPego um livro da pilha que [book_burner.GetFirstNameNoTooltip] marcou para destruição, encontrando apenas conteúdo inócuo sobre... construir pequenos castelos de terra?"
 bp1_yearly.5716.t:0 "Fora, [ROOT.Char.GetFaith.random_EvilGodNames]!"
 bp1_yearly.5716.yesbook:0 "\n\nPego [burned_book.GetName] da pilha que [book_burner.GetFirstNameNoTooltip] marcou para destruição exatamente no mesmo momento em que [book_burner.GetSheHe] também o pega."
 bp1_yearly.5717.a.tt.lose:0 "O [bff_defender.GetNameNoTooltip] perde a luta"
 bp1_yearly.5717.a.tt.win:0 "[bff_defender.GetNameNoTooltip] vence a luta"
 bp1_yearly.5717.a:0 "Acerte [5717_nemesis.GetSheHe] no rosto, [bff_defender.GetFirstNameNoTooltip]!"
 bp1_yearly.5717.b:0 "[5717_nemesis.GetSheHe|U] não vale a pena, companheiro!"
 bp1_yearly.5717.c.tt.duel:0 "Começa um [single_combat_duel|E] entre você e [5717_nemesis.GetFirstNameNoTooltip]"
 bp1_yearly.5717.c.tt:0 "#weak Vocês dois resolvem sua disputa lá fora...#!"
 bp1_yearly.5717.c:0 "Dê lugar; [5717_nemesis.GetFirstNameNoTooltip] é meu."
 bp1_yearly.5717.desc:0 "O taverna em [tavern_county.GetNameNoTier] geralmente é o lugar perfeito para esquecer os problemas do mundo, mas hoje é uma exceção.\n\nPor azar, sentada em uma mesa ao lado de [bff_defender.GetFirstName] e eu está minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('5717_nemesis'))], [5717_nemesis.GetFirstName], e [5717_nemesis.GetSheHe] tem sido uma chateação desde que chegamos. Tudo o que precisou foi mais um derramamento 'acidental' de sua/seu [5717_nemesis.Custom('RegionalDrink')] sobre meu braço e, de repente, [bff_defender.GetFirstNameNoTooltip] estava de pé.\n\n[5717_nemesis.GetFirstNameNoTooltip] se levanta também, e os dois estão no processo de se enfrentar bastante bêbados quando eu finalmente consigo me levantar também."
 bp1_yearly.5717.t:0 "Briga de bêbados"
 bp1_yearly.5718.t.lose:0 "Você perdeu a luta"
 bp1_yearly.5718.t.win:0 "Você venceu a luta"
 bp1_yearly.5719.a.tt.dread:0 "#medium Esta opção está disponível para você devido ao seu alto nível de [dread|E] #!"
 bp1_yearly.5719.a:0 "Você vai devolver esse dinheiro e se lembrar deste dia!"
 bp1_yearly.5719.b.tt.lose:0 "[disloyal_vassal.GetFirstNameNoTooltip] despreza abertamente sua exigência"
 bp1_yearly.5719.b.tt.win:0 "[disloyal_vassal.GetFirstNameNoTooltip] devolve o dinheiro de forma mal-humorada"
 bp1_yearly.5719.b:0 "Pague o dinheiro de volta. Agora."
 bp1_yearly.5719.c:0 "Talvez possamos chegar a um acordo?"
 bp1_yearly.5719.d:0 "Apenas... apenas não faça isso de novo!"
 bp1_yearly.5719.normal:0 "O corrupto [disloyal_vassal.GetTitleAsNameNoTooltip|l] não tenta se defender, sorrindo com arrogância.\n\n\"É tudo verdade, [ROOT.Char.Custom('FormOfAddressForLiege')]. Eu quis aumentar meus cofres.\"\n\nÉ um desafio aberto à minha autoridade."
 bp1_yearly.5719.start:0 "Por muitos dias, meu chanceler [chancellor.GetFirstName] notou uma pequena quantia de renda que não estava sendo contabilizada. Agora, tendo visto a prova, chamo meu vassalo [disloyal_vassal.GetFirstName] para contar a verdade.\n\nA evidência de [chancellor.GetFirstNameNoTooltip] era conclusiva e irrefutável; [disloyal_vassal.GetFirstNameNoTooltip] estava desviando impostos destinados a mim!"
 bp1_yearly.5719.t:0 "Situações de impostos"
 bp1_yearly.5719.terrified:0 "O corrupto [disloyal_vassal.GetTitleAsNameNoTooltip|l] tenta se defender, mas luta para encontrar as palavras, tremendo diante da minha ira.\n\nVejo o medo nos seus olhos enquanto ando de um lado para o outro, fazendo um show performático de ponderar minha decisão."
 bp1_yearly.5720.a.tt:0 "Isso pode não me tornar popular em [THIS.Char.Custom('GetCourt')], mas vai ser #EMP incrível#!..."
 bp1_yearly.5720.a:0 "Claro, com nossos braços #EMP esquerdos#!, sim?"
 bp1_yearly.5720.b.tt.bigwin:0 "Você quebra o braço de [rival_challenger.GetNamePossessiveNoTooltip]"
 bp1_yearly.5720.b.tt.win:0 "Você vence [rival_challenger.GetNameNoTooltip] com facilidade desdenhosa"
 bp1_yearly.5720.b:0 "Hah! Hah! Vamos lá, então!"
 bp1_yearly.5720.c.tt.lose:0 "[rival_challenger.GetFirstNameNoTooltip] prende seu braço na mesa"
 bp1_yearly.5720.c.tt.win:0 "Você vence [rival_challenger.GetFirstNameNoTooltip]"
 bp1_yearly.5720.c:0 "Prove isso, seu [rival_challenger.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.5720.d:0 "Eu não vou me envolver nesses joguinhos mesquinhos."
 bp1_yearly.5720.desc:0 "Estou várias taças de [ROOT.Char.Custom('RegionalDrink')] no jantar, mas a maldita presença d[Select_CString( rival_challenger.IsFemale, 'a', 'o' )] [rival_challenger.GetFirstName] arruína a minha noite.\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_challenger'))]! [Select_CString( ROOT.Char.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_challenger'))]!\" [rival_challenger.GetSheHe] berra. \"Você não venceria nem uma criança em uma prova de força! Eu poderia prender seu braço à mesa agora mesmo sem nenhum esforço!"
 bp1_yearly.5720.t:0 "Teste de Força"
 bp1_yearly.5721.a.tt.no:0 "[marshmallow_friend.GetFirstNameNoTooltip] não está interessado"
 bp1_yearly.5721.a.tt.yes:0 "Você faz amizade"
 bp1_yearly.5721.a:0 "Você... você quer ser meu amigo, [marshmallow_friend.GetFirstNameNoTooltip]?"
 bp1_yearly.5721.b:0 "Isso foi divertido!"
 bp1_yearly.5721.c.tt:0 "Com uma pequena distração, você provavelmente poderia pegar o doce que [marshmallow_friend.GetSheHe] está assando..."
 bp1_yearly.5721.c:0 "Eu poderia comer mais um doce..."
 bp1_yearly.5721.desc:0 "Que noite linda! A fogueira estala e crepita, cuspindo fumaça para o céu noturno. O doce melado espetado na ponta do meu palito carameliza lentamente, e eu observo sua cor em lento movimento com interesse.\n\nAo meu lado, [marshmallow_friend.GetFirstName] está fazendo o mesmo enquanto os adultos bebem [ROOT.Char.Custom('BebidaRegional')] e contam histórias de eventos muito antes de nós termos nascido.\n\n[marshmallow_friend.GetSheHe|U] e eu não conversamos muito antes, mas seria bom poder conversar com alguém da minha idade por uma vez..."
 bp1_yearly.5721.t:0 "Ao Redor do Fogo"
 bp1_yearly.5722.a.tt:0 "Você luta com [rival_catapulter.GetFirstNameNoTooltip] no chão antes que [rival_catapulter.GetSheHe] possa escapar."
 bp1_yearly.5722.a:0 "Você não vai!"
 bp1_yearly.5722.b:0 "[ROOT.Char.Custom('CatStoryName')]! #EMP Nãooooo!#!"
 bp1_yearly.5722.c:0 "Eu vou pegar você, [rival_catapulter.GetFirstNameNoTooltip]! Eu juro!"
 bp1_yearly.5722.desc:0 "\"Nos encontramos novamente, [ROOT.Char.GetFirstName], s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('rival_catapulter'))]!\" m[Select_CString( rival_catapulter.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_catapulter'))], [rival_catapulter.GetFirstName], zomba enquanto [rival_catapulter.GetSheHe] me aborda enquanto inspeciono algum novo equipamento militar. \"Finalmente, nós dois, pessoas de honra, nos encontramos em igualdade de condições - hah! Peguei você!\"\n\nLevo um momento para processar que [rival_catapulter.GetFirstNameNoTooltip] acabara de pegar meu gato, [ROOT.Char.Custom('CatStoryName')], e outro para perceber que [rival_catapulter.GetSheHe] está fugindo. Depois de superar meu choque, corro atrás d[rival_catapulter.GetSheHe] apenas para descobrir que [rival_catapulter.GetSheHe] está carregando meu amado felino em uma catapulta próxima!\n\nDou um passo em direção a ela, minha mão estendida, mas é tarde demais.\n\n\"Mraaaao#DIE1 ooooo#!#DIE2 oooowwww—#!\""
 bp1_yearly.5722.t:0 "O Catapulta"
 bp1_yearly.5723.a:0 "#EMP Bwoing!#!"
 bp1_yearly.5723.b:0 "Eu vou te poupar. Por [ROOT.Char.Custom('CatStoryName')]."
 bp1_yearly.5723.desc:0 "[rival_catapulter.GetFirstNamePossessive] olhos se arregalam de surpresa e medo enquanto eu luto com [rival_catapulter.GetSheHe] no chão. \n\n\"Você poderia ter me machucado\". Eu entono, levantando-me novamente e pedindo uma corda aos guardas reunidos. \n\n\"Você poderia até ter machucado minha família\". Eu continuo, amarrando as mãos e os pés do meu captor infortúnio. \n\n\"Mas você cometeu o erro fatal de machucar #EMP [ROOT.Char.Custom('CatStoryName')]#!.\" [rival_catapulter.GetFirstNameNoTooltip], membros amarrados tremendo, abre a boca para implorar. \n\nEu alcanço a alavanca."
 bp1_yearly.5723.t:0 "Uma Jogada Longa"
 bp1_yearly.5724.a:0 "[ROOT.Char.Custom('CatStoryName')]! Você está #EMP vivo#!"
 bp1_yearly.5724.b:0 "Eu nunca mais vou te soltar!"
 bp1_yearly.5724.desc:0 "Meus últimos três dias foram passados sob uma nuvem escura. Meu precioso, inocente [ROOT.Char.Custom('CatStoryName')]... é como se eu ainda pudesse ouvir o miado às vezes. \n\nNão, espere... Eu #EMP posso#! ouvir o miado. Já juntando um pouco de excitação, eu tropeço em uma pequena mesa até a altura da canela. Xingando, eu me levanto. Outro miado, mais alto desta vez e plangente. Eu finalmente chego à porta e a abro para encontrar [ROOT.Char.Custom('CatStoryName')] sentado ali: seguro, são e muito irritado! \n\nImediatamente, eu varro meu amado gato em meus braços, enterrando meu rosto na sujeira e na pelagem coberta de gravetos. \n\n[ROOT.Char.Custom('CatStoryName')] se debate furiosamente em meu abraço."
 bp1_yearly.5724.t:0 "[ROOT.Char.Custom('CatStoryName')]: Felino Bem"
 bp1_yearly.5725.a:0 "Tudo bem, [matchmaker_courtier.GetFirstNameNoTooltip], iremos investigar."
 bp1_yearly.5725.b:0 "Chega de suas histórias absurdas!"
 bp1_yearly.5725.desc:0 "\"#EMP Como#! você nunca ouviu falar d[khutulun.GetSheHe], [ROOT.Char.Custom('FormOfAddressForLiege')]?\"\"\n\nEu reviro os olhos e grunho displicentemente. Dizer que os devaneios de [matchmaker_courtier.GetFirstName] estavam abaixo de mim agora seria um eufemismo.\n\n\"Dizem que [khutulun.GetSheHe] tem um desafio aberto para qualquer um [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord]!\" [matchmaker_courtier.GetFirstNameNoTooltip] tenta novamente, de forma insistente desta vez. Baixando sua voz conspiradoramente, [matchmaker_courtier.GetSheHe] continua. \"Escute, eu sei que você se cansou de todas as perguntas matrimoniais. Essa [khutulun.GetWomanMan] oferece sua mão em casamento para quem conseguir vencê-lo(a) em habilidade física.\"\n\nEu me recosto e considero a história. Uma [khutulun.GetWomanMan] de mente marcial? Certamente eu posso sair vitorioso e com [Select_CString( khutulun.IsFemale, 'uma nova', 'um novo' )] [khutulun.GetWifeHusband] em reboque, não importando suas habilidades."
 bp1_yearly.5725.t:0 "O [khutulun.GetWomanMan|U] Selvagem"
 bp1_yearly.5726.a.tt.lose:0 "[khutulun.GetSheHe|U] te derrota"
 bp1_yearly.5726.a.tt.win:0 "Você derrota [khutulun.GetFirstNameNoTooltip]"
 bp1_yearly.5726.a:0 "Diga olá [Select_CString( ROOT.Char.IsFemale, 'a sua nova', 'ao seu novo' )] [ROOT.Char.GetWifeHusband], [matchmaker_courtier.GetFirstNameNoTooltip]!"
 bp1_yearly.5726.b:0 "A discrição pode ser a melhor parte da coragem aqui..."
 bp1_yearly.5726.desc:0 "Após uma longa viagem, chegamos ao local que [matchmaker_courtier.GetFirstName] ouviu dizer que nosso alvo frequentava, para encontrar uma cena surpreendente. Uma [khutulun.GetWomanMan] ágil está atualmente lutando com um [dummy_gender.GetWomanMan] muito maior.\n\nNormalmente, isso mal pareceria uma luta justa, mas um instante depois e o combate termina surpreendentemente; a primeira figura, amplamente sorridente, ajuda seu oponente magnanimamente antes de virar seus olhos para me examinar.\n\n\"Eu nunca te vi por estas partes antes!\" [khutulun.GetSheHe] sorri enquanto [khutulun.GetSheHe] me aborda, fazendo uma reverência sardônica e elaborada. \"Meu nome é [khutulun.GetFirstName]. Eu sei por que você está aqui, mas deixe-me avisar: qualquer um que desperdiçar meu tempo tem que me pagar uma soma pelos meus problemas.\""
 bp1_yearly.5726.t:0 "Um [khutulun.Custom('GetBrideGroom')|U] Combativo"
 bp1_yearly.5727.a:0 "Um acordo é um acordo, então."
 bp1_yearly.5727.b:0 "Bem, eu consegui tudo o que precisava aqui."
 bp1_yearly.5727.c:0 "Apenas o melhor para [khutulun.GetFirstNameNoTooltip]!"
 bp1_yearly.5727.desc:0 "[khutulun.GetFirstName] resmunga cansada(o) enquanto quebramos nosso abraço novamente. Eu não estou lidando muito melhor; é claro como [khutulun.GetSheHe] permaneceu solteira. [khutulun.GetSheHe|U] sorri, satisfeito(a) com o desafio.\n\n\"Você seria uma boa [ROOT.Char.GetWomanMan] para mim!\" [khutulun.GetSheHe] comenta, não tirando os olhos dos meus movimentos. \"É uma pena que eu tenha que te decepcionar!\"\n\n[khutulun.GetFirstNameNoTooltip] avança novamente, mas desta vez eu estou pronta(o). Um hábil passo lateral deixa [khutulun.GetSheHe] desequilibrado(a), e um pé encurvado ao seu redor faz [khutulun.GetSheHe] tombar.\n\nseu rosto é uma mistura de choque, espanto e excitação enquanto eu ofereço minha mão."
 bp1_yearly.5727.t:0 "Sinos de casamento?"
 bp1_yearly.5728.a:0 "Queime, então, s[Select_CString( rival_burner.IsFemale, 'ua', 'eu' )] [rival_burner.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.5728.b.tt.duel:0 "Começa um [single_combat_duel|E] entre você e [rival_burner.GetFirstNameNoTooltip]"
 bp1_yearly.5728.b:0 "Roubo? Está com medo de enfrentar-me?"
 bp1_yearly.5728.desc:0 "As faíscas da fogueira flutuam preguiçosamente para o céu noturno com a fumaça, mas eu não consigo apreciar a cena como normalmente faria.\n\nMinha(o) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rival_burner'))] [rival_burner.GetFirstName] fica triunfante na frente do fogo, desafiando-me a me aproximar. Em sua mão, meu próprio artefato: [burned_artifact.GetName], roubado de mim por aquela cobra.\n\n\"Nem um passo mais perto, [ROOT.Char.GetFirstName]!\" [rival_burner.GetSheHe] chama. \"Seu precioso bibelô queima se você se mexer!\"\n\n\"[rival_burner.GetFirstNameNoTooltip]!\" Eu grito. \"Devolve-me o que é meu e não teremos mais desavenças!\" [rival_burner.GetFirstNameNoTooltip] simplesmente sorri em resposta e move minha posse sobre o fogo."
 bp1_yearly.5728.t:0 "Rivalidade ardente"
 bp1_yearly.5729.tt.lose:0 "[rival_burner.GetFirstNameNoTooltip] queima a posse"
 bp1_yearly.5730.a:0 "Que isso lhe sirva de lição."
 bp1_yearly.5730.b.tt:0 "[burned_artifact.GetName] recebe #N negative#! modificadores"
 bp1_yearly.5730.b:0 "Pegue-o. Que sempre lhe lembre desta noite."
 bp1_yearly.5730.desc:0 "[rival_burner.GetFirstName] luta para se levantar, machucado e contundido após o nosso duelo. [rival_burner.GetSheHe|U] olhos queimam tão intensamente quanto a fogueira ao lado de onde [rival_burner.GetSheHe] está quando [rival_burner.GetSheHe] me vê colocar meu [burned_artifact.GetName] debaixo do braço.\n\nÀ medida que nossos companheiros retornam de sua última parada um pouco mais longe, sua conversa gradualmente diminui quando encontram a dupla de nós encarando um ao outro, um vitorioso e outro derrotado.\n\nEu olho para o meu [burned_artifact.GetNameNoTooltip] e, em seguida, para a [rival_burner.GetWomanMan] que arriscou vida e membros para queimá-lo."
 bp1_yearly.5730.t:0 "Onde há fumaça..."
 bp1_yearly.5800.a.tt:0 "Você procura uma solução para o problema"
 bp1_yearly.5800.a:0 "Precisamos encontrar uma maneira de consertar isso!"
 bp1_yearly.5800.b:0 "Não é #EMP tão#! ruim assim!"
 bp1_yearly.5800.desc:0 "Ao acordar de manhã ao lado de meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('surprised_sniffer'))] [surprised_sniffer.GetFirstName], eu suspiro e me estico preguiçosamente só para pegar um vislumbre de minha amada enrugando o nariz. Abro minha boca para perguntar mais, só para ver [surprised_sniffer.GetFirstNameNoTooltip] recuar ainda mais.\n\n\"Escute, [ROOT.Char.GetFirstName], meu amor...\" [surprised_sniffer.GetSheHe] começa rapidamente, como se as palavras estivessem saindo de sua boca por acidente. \"Isso é difícil de falar, mas... você não tem cheirado particularmente fresco ultimamente.\"\n\nAtônito, dou uma cheirada inquisitiva em minha axila.\n\nBem, talvez [surprised_sniffer.GetSheHe] tenha um ponto."
 bp1_yearly.5800.t:0 "Um cheiro estranho"
 bp1_yearly.5801.a:0 "Isso é uma figueira?"
 bp1_yearly.5801.b:0 "Talvez um pouco de hortelã?"
 bp1_yearly.5801.c:0 "Eu gosto do cheiro de limão!"
 bp1_yearly.5801.d:0 "Romã seria caro..."
 bp1_yearly.5801.desc:0 "Eu bocejo cansado enquanto [surprised_sniffer.GetFirstName] me leva animadamente para uma cidade próxima. [surprised_sniffer.GetSheHe|U] havia insistido em sair assim que possível - o que, em retrospecto, é um tanto insultuoso - e fizemos nosso caminho através das pequenas multidões até onde um vendedor de frutas e ervas estava vendendo seus produtos.\n\n\"Certo!\" [surprised_sniffer.GetFirstNameNoTooltip] disse esperançoso. \"Escolha uma dessas. Elas farão com que o cheiro inicial saia fresco e frutado!\" [surprised_sniffer.GetSheHe|U] revira os olhos com minha expressão indiferente.\n\n\"Estamos fazendo um #EMP perfume#!, é claro!\""
 bp1_yearly.5801.fig:0 "[perfume_bottle.GetDesc] Tem notas de figo"
 bp1_yearly.5801.lemon:0 "[perfume_bottle.GetDesc] Tem notas de limão"
 bp1_yearly.5801.mint:0 "[perfume_bottle.GetDesc] Tem notas de menta"
 bp1_yearly.5801.pomegranate:0 "[perfume_bottle.GetDesc] Tem notas de romã"
 bp1_yearly.5801.t:0 "$bp1_yearly.5800.t$: Qualidade Superior"
 bp1_yearly.5802.a:0 "O que é isso... cardamomo?"
 bp1_yearly.5802.b:0 "Você disse que isso se chama noz-moscada?"
 bp1_yearly.5802.c:0 "Este cheiro de canela é maravilhoso!"
 bp1_yearly.5802.cardamom:0 "[perfume_bottle.GetDesc], cardamomo aromático"
 bp1_yearly.5802.cinnamon:0 "[perfume_bottle.GetDesc], canela acolhedora"
 bp1_yearly.5802.d:0 "O incenso seria um perfume divino!"
 bp1_yearly.5802.desc:0 "Depois da minha escolha da semana passada, eu quase tinha esquecido da missão de [surprised_sniffer.GetFirstNamePossessive] de fabricar um perfume para mim. Só me lembrei quando [surprised_sniffer.GetSheHe] parou abruptamente na rua e me puxou para um vendedor de especiarias ao lado da estrada.\n\n\"Estes seriam perfeitos!\" [surprised_sniffer.GetSheHe] disse. \"Qualquer um destes seria perfeito para o coração do perfume!\"\n\nEu olhei para as especiarias e incensos reunidos, muitos deles estrangeiros e exóticos aos meus olhos."
 bp1_yearly.5802.frankincense:0 "[perfume_bottle.GetDesc], incenso picante"
 bp1_yearly.5802.nutmeg:0 "[perfume_bottle.GetDesc], noz-moscada picante"
 bp1_yearly.5802.t:0 "$bp1_yearly.5800.t$: Do Coração"
 bp1_yearly.5803.a:0 "O carvalho é uma madeira fina!"
 bp1_yearly.5803.b:0 "Eu gosto de como essas resinas parecem."
 bp1_yearly.5803.c:0 "Sândalo? Que madeira incomum."
 bp1_yearly.5803.d:0 "Você chama isso de raspas de 'oud'? Elas cheiram doce!"
 bp1_yearly.5803.desc:0 "Ao passar por um vendedor na borda de uma floresta vendendo o que parecem ser tipos de madeira e seus produtos relacionados, eu só consegui sentir uma sensação de crescente ansiedade por um segundo antes dos olhos de [surprised_sniffer.GetFirstNamePossessive] se iluminarem e [surprised_sniffer.GetSheHe] me puxar em direção a eles.\n\n\"Agora #EMP essas#! seriam perfeitas para o nosso propósito!\" [surprised_sniffer.GetSheHe|U] indicou algumas das madeiras raras e suas resinas empilhadas à esquerda do vendedor. \"Elas dariam ao cheiro uma base tão poderosa, e fariam ele durar o dia todo!"
 bp1_yearly.5803.oak:0 "[perfume_bottle.GetDesc], carvalho forte"
 bp1_yearly.5803.oud:0 "[perfume_bottle.GetDesc], oud pegajoso"
 bp1_yearly.5803.resin:0 "[perfume_bottle.GetDesc], resina ambarina"
 bp1_yearly.5803.sandalwood:0 "[perfume_bottle.GetDesc], sândalo suave"
 bp1_yearly.5803.t:0 "$bp1_yearly.5800.t$: Uma Base Forte"
 bp1_yearly.5804.a.tt:0 "Você compra o vetiver."
 bp1_yearly.5804.a:0 "Bem, pelo menos esse capim seco cheira bem."
 bp1_yearly.5804.b.tt:0 "Você compra o cânfora."
 bp1_yearly.5804.b:0 "Eu suponho que esse pó branco reduziria bem."
 bp1_yearly.5804.c.tt:0 "Você compra o âmbar cinzento."
 bp1_yearly.5804.c:0 "Você disse que isso é #EMP vômito de baleia#!?!"
 bp1_yearly.5804.d:0 "Nenhum desses parece ser útil!"
 bp1_yearly.5804.desc:0 "Apesar de mim mesmo, acabei gostando bastante da minha busca por ingredientes de perfumaria. Com uma certa expectativa, então, ouço falar de um vendedor em uma cidade local que possui vários itens raros e cobiçados que podem me interessar.\n\nEu examino as mercadorias. Alguns juncos de grama seca, um pó branco e... o que parece ser algumas pedras cinzas opacas e esfareladas?\n\nO mercador me olha com expectativa enquanto [surprised_sniffer.GetFirstName] observa as mercadorias."
 bp1_yearly.5804.t:0 "$bp1_yearly.5800.t$: Uma Última Gota"
 bp1_yearly.5805.a:0 "Eu me sinto como a [ROOT.Char.GetWomanMan] mais rica do mundo!"
 bp1_yearly.5805.ambergris:0 "[perfume_bottle.GetDesc] e âmbar-do-mar doce e terroso."
 bp1_yearly.5805.b:0 "Eu vou pegar um decant; meu amor pode ter a garrafa."
 bp1_yearly.5805.blended:0 "[perfume_bottle.GetDesc] e exala um aroma doce."
 bp1_yearly.5805.camphor:0 "[perfume_bottle.GetDesc] e cânfora herbal e picante."
 bp1_yearly.5805.desc:0 "Tendo fornecido a um artesão local todos os meus ingredientes coletados há alguns dias, é com prazer e apreensão que desfaço o laço de couro do perfume resultante.\n\nDentro há uma pequena e simples garrafa contendo uma mistura de cores; a princípio [ROOT.Char.Custom('GetSimpleColor')], mas quando a coloco contra a luz, ela se transforma em um [ROOT.Char.Custom('GetComplexColor')].\n\nEu abro o rústico tampão e meus sentidos olfativos são acariciados pelo aroma. Chamo [surprised_sniffer.GetFirstName] animadamente, e nós dois nos maravilhamos com a fragrância que se espalha pela [ROOT.Char.Custom('GetRoom')]."
 bp1_yearly.5805.t:0 "$bp1_yearly.5800.t$: Aroma Sedutor"
 bp1_yearly.5805.vetiver:0 "[perfume_bottle.GetDesc] e vetiver amadeirado e levemente couroso."
 bp1_yearly.8000.a:0 "Ha! Que venenoso ess[Select_CString( bp1_8000_new_rival.IsFemale, 'a', 'e' )] [bp1_8000_new_rival.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.8000.b.failure:0 "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] ignora sua carta"
 bp1_yearly.8000.b.success:0 "Sua carta amolece [bp1_8000_new_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8000.b:0 "Escreverei a [bp1_8000_new_rival.GetFirstNameNoTooltip] imediatamente."
 bp1_yearly.8000.c.failure:0 "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] escapa"
 bp1_yearly.8000.c.success:0 "Seus homens prendem [bp1_8000_new_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8000.c:0 "É traição, então."
 bp1_yearly.8000.d.bluff:0 "[bp1_8000_new_rival.GetTitledFirstNameNoTooltip] estava blefando"
 bp1_yearly.8000.d.rival:0 "Os rumores eram verdadeiros"
 bp1_yearly.8000.d:0 "Conversa fiada insignificante, tenho certeza."
 bp1_yearly.8000.desc:0 "[bp1_8000_informer.GetTitledFirstName], m[Select_CString( bp1_8000_informer.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_informer'))], preocupa-se durante todo o dia, claramente tentando encontrar as palavras certas. \n\nFinalmente, enquanto nos encaminhamos para jantar, [bp1_8000_informer.GetSheHe] começa timidamente, \"M[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [bp1_8000_informer.Custom2('RelationToMeShort', ROOT.Char)]..."
 bp1_yearly.8000.desc_foreign:0 "Ouço rumores de que [bp1_8000_new_rival.GetFirstName], o [bp1_8000_new_rival.GetTitleAsNameNoTooltip] de [bp1_8000_new_rival.GetPrimaryTitle.GetBaseNameNoTier], veio a ver você como o foco de sua inimizade..."
 bp1_yearly.8000.desc_multi:0 "\n\n\"[bp1_8000_new_rival.GetSheHe|U] afirma que [bp1_8000_new_rival.GetSheHe] é pessoalmente prejudicado pela sua contínua governança de seu domínio legítimo, [bp1_8000_claimed_title.GetNameNoTier], em particular.\""
 bp1_yearly.8000.desc_single:0 "\n\n\"[bp1_8000_new_rival.GetSheHe|U] fala abertamente do 'ilegítimo [ROOT.Char.GetTitleAsNameNoTooltip] de [bp1_8000_claimed_title.GetNameNoTier]', que usurpa diariamente as suas terras e receitas legítimas.\""
 bp1_yearly.8000.desc_vassal:0 "dizem que [bp1_8000_new_rival.GetTitledFirstName], seu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('bp1_8000_new_rival'))], leva cada vez mais a sério as suas supostas reivindicações sobre suas terras...\""
 bp1_yearly.8000.t:0 "Reivindicação Cobiçada"
 bp1_yearly.8010.a:0 "Sim! Você terá minha [bp1_8010_best_friend.Custom('SignatureWeaponNameOrType')]!"
 bp1_yearly.8010.b:0 "Não tenho certeza, [bp1_8010_best_friend.GetFirstNameNoTooltip]..."
 bp1_yearly.8010.desc:0 "Eu agradeço diariamente a [bp1_8010_best_friend.GetFaith.HighGodName] por ter um(a) excelente [ROOT.Char.Custom('GetFriendNoun')] como você - há poucos outros em quem posso confiar com segurança. \n\nDevemos alinhar mais nossos interesses e lutar lado a lado. Venha, [ROOT.Char.GetFirstNameNoTooltip], nossos inimigos verão que não devem subestimar-nos!"
 bp1_yearly.8010.opening:0 "[bp1_8010_best_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.8020.a:0 "Eu aguardo ansiosamente a oportunidade de discutir isso mais a fundo."
 bp1_yearly.8020.b.flavor:0 "Encaminhe a carta para [bp1_8020_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8020.b.insult:0 "A mensagem enfurece [bp1_8020_rival.GetTitledFirstNameNoTooltip]"
 bp1_yearly.8020.b.joke:0 "[bp1_8020_rival.GetTitledFirstNameNoTooltip] aprecia sua abertura"
 bp1_yearly.8020.b:0 "Mensageiros são tão pouco confiáveis nos dias de hoje..."
 bp1_yearly.8020.c:0 "Isso é um jogo baixo, por um jogador baixo."
 bp1_yearly.8020.d:0 "Você não é meu amigo, [bp1_8020_friend.GetFirstNameNoTooltip]."
 bp1_yearly.8020.desc:0 "Ouvi falar de suas disputas com [Select_CString( bp1_8020_rival.IsFemale, 'aquela', 'aquele' )] [bp1_8020_rival.Custom2('InsultNoun', SCOPE.sC('bp1_8020_friend'))] [bp1_8020_rival.Custom2('InsultAdjective', SCOPE.sC('bp1_8020_friend'))], [bp1_8020_rival.GetFirstName], uma desculpa mais que desprezível para [Select_CString( bp1_8020_rival.IsFemale, 'uma', 'um' )] [bp1_8020_rival.GetWomanMan].\n\nDadas nossas interesses mútuos, tenho certeza de que nos daremos bem, [Select_CString( ROOT.Char.IsFemale, 'amiga', 'amigo' )]."
 bp1_yearly.8020.opening:0 "[bp1_8020_friend.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp1_yearly.8040.a.ambitious:0 "Não vou ficar para trás."
 bp1_yearly.8040.a.arbitrary:0 "Eu posso agir como quiser."
 bp1_yearly.8040.a.arrogant:0 "Eu sou o [ROOT.Char.GetTitleAsNameNoTooltip]!"
 bp1_yearly.8040.a.brave:0 "Parece covardia para mim."
 bp1_yearly.8040.a.callous:0 "Oh, cale a boca."
 bp1_yearly.8040.a.calm:0 "Respire, não há necessidade de ficar chateado."
 bp1_yearly.8040.a.chaste:0 "Não serei tão facilmente tentado."
 bp1_yearly.8040.a.compassionate:0 "Eu não vou endurecer meu coração."
 bp1_yearly.8040.a.content:0 "E quando será o suficiente?"
 bp1_yearly.8040.a.craven:0 "Assumir riscos é para tolos."
 bp1_yearly.8040.a.cynical:0 "#EMP Certamente#! isso é para [ROOT.Char.GetFaith.HighGodName] decidir, não é?"
 bp1_yearly.8040.a.deceitful:0 "A verdade não te libertará."
 bp1_yearly.8040.a.diligent:0 "Eu só preciso terminar isso e depois conversamos."
 bp1_yearly.8040.a.fickle:0 "Sim, como você quiser!"
 bp1_yearly.8040.a.forgiving:0 "Não se preocupe, eu já tinha esquecido sua grosseria."
 bp1_yearly.8040.a.generous:0 "Há o suficiente para todos."
 bp1_yearly.8040.a.gluttonous:0 "Vamos conversar sobre isso depois do jantar."
 bp1_yearly.8040.a.greedy:0 "O que, e deixar que outros peguem #EMP meu#! dinheiro?"
 bp1_yearly.8040.a.gregarious:0 "Saia do caminho, as pessoas estão esperando por mim."
 bp1_yearly.8040.a.honest:0 "A verdade é que você é um mentiroso."
 bp1_yearly.8040.a.humble:0 "Eu sou apenas [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetWomanMan], como incontáveis outros."
 bp1_yearly.8040.a.impatient:0 "Não tenho tempo para isso."
 bp1_yearly.8040.a.just:0 "Não seria correto agir de outra forma."
 bp1_yearly.8040.a.lazy:0 "Podemos conversar sobre isso depois?"
 bp1_yearly.8040.a.lustful:0 "Eu acho que você tem ficado sozinho por muito tempo."
 bp1_yearly.8040.a.paranoid:0 "Não... não #EMP você#! também!"
 bp1_yearly.8040.a.patient:0 "A pressa é a mãe do fracasso."
 bp1_yearly.8040.a.shy:0 "Você pode me deixar sozinho?"
 bp1_yearly.8040.a.stubborn:0 "Você não vai mudar minha opinião."
 bp1_yearly.8040.a.temperate:0 "Tudo com moderação."
 bp1_yearly.8040.a.trusting:0 "Obrigado, você sempre está do meu lado."
 bp1_yearly.8040.a.vengeful:0 "Vou me lembrar disso quando #EMP você#! pedir pela #EMP minha#! companhia."
 bp1_yearly.8040.a.wrathful:0 "Como #EMP você#! se atreve a falar comigo dessa forma?!"
 bp1_yearly.8040.a.zealous:0 "Isso cabe a [ROOT.Char.GetFaith.HighGodName] decidir!"
 bp1_yearly.8040.a:0 "Como #EMP você#! se atreve a falar comigo dessa forma? Saia daqui!"
 bp1_yearly.8040.b.failure:0 "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] continua impassível"
 bp1_yearly.8040.b.success:0 "[bp1_yearly_8040_friend.GetTitledFirstNameNoTooltip] muda de ideia"
 bp1_yearly.8040.b:0 "Vamos concordar em discordar! Relaxe."
 bp1_yearly.8040.c:0 "Você está certo, [bp1_yearly_8040_friend.GetFirstNameNoTooltip]."
 bp1_yearly.8040.desc.ambitious:0 "necessidade incessante de avançar, sem fim à vista"
 bp1_yearly.8040.desc.brave:0 "Tomadas de riscos desnecessários e audácia"
 bp1_yearly.8040.desc.calm:0 "Serenidade diante de indignações legítimas"
 bp1_yearly.8040.desc.chaste:0 "Aversão aos prazeres da carne"
 bp1_yearly.8040.desc.closing:0 "- isso coloca você em má situação. Certamente você deve ver que isso não faz nenhum bem a [ROOT.Char.GetTitleAsNameNoTooltip] agir dessa forma?"
 bp1_yearly.8040.desc.compassionate:0 "Vulnerabilidade ao sofrimento e cuidado com os outros"
 bp1_yearly.8040.desc.content:0 "falta de impulso para ter sucesso e superar seus colegas"
 bp1_yearly.8040.desc.cynical:0 "Ceticismo em relação ao plano divino de [ROOT.Char.GetFaith.HighGodNamePossessive]"
 bp1_yearly.8040.desc.diligent:0 "Negócios constantes e demandas por resultados"
 bp1_yearly.8040.desc.fickle:0 "Mudanças constantes de opinião e facilidade em ser convencido"
 bp1_yearly.8040.desc.forgiving:0 "Ignorar insultos e tolerar deslealdade"
 bp1_yearly.8040.desc.generous:0 "Bolsos soltos para quem pede ajuda"
 bp1_yearly.8040.desc.gregarious:0 "Distrações com conversas ociosas e festas"
 bp1_yearly.8040.desc.honest:0 "Recusa em enganar os outros, mesmo quando necessário"
 bp1_yearly.8040.desc.humble:0 "Desconsideração da própria importância"
 bp1_yearly.8040.desc.impatient:0 "Hábito imprudente de se precipitar nas coisas"
 bp1_yearly.8040.desc.just:0 "Julgamentos meticulosos e análise minuciosa de evidências"
 bp1_yearly.8040.desc.lustful:0 "Escravidão aos seus desejos e tentações"
 bp1_yearly.8040.desc.opening:0 "[Select_CString( bp1_yearly_8040_friend.IsFemale, 'Minha boa companheira', 'Meu bom companheiro' )], [bp1_yearly_8040_friend.GetTitledFirstName], tem estado distante de mim nos últimos dias, cada noite evitando meu convite para jantar.\n\nHoje, [bp1_yearly_8040_friend.GetSheHe] me pega sozinho em meu [ROOT.Char.Custom('GetChamber')]. \"[ROOT.Char.GetFirstNameNoTooltip], desculpe, mas preciso lhe dizer isso, como seu amigo.\"\n\n\"Seu\""
 bp1_yearly.8040.desc.paranoid:0 "Dúvida interminável em relação às motivações dos outros"
 bp1_yearly.8040.desc.patient:0 "Excessiva cautela e reação com tranquilidade aos eventos"
 bp1_yearly.8040.desc.shy:0 "Aversão a conversar com os outros"
 bp1_yearly.8040.desc.temperate:0 "Distanciamento da mesa de banquetes"
 bp1_yearly.8040.desc.trusting:0 "Fé implícita nas motivações de todos os outros"
 bp1_yearly.8040.desc.wrathful:0 "Mau humor e explosões constantes"
 bp1_yearly.8040.desc.zealous:0 "Vontade de seguir os [ROOT.Char.GetFaith.AltPriestTermPlural]"
 bp1_yearly.8040.t:0 "Completamente opostos"
 bp1_yearly.8050.a:0 "Um dia, eu vingarei você, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))]..."
 bp1_yearly.8050.b:0 "O rastro de sangue termina aqui."
 bp1_yearly.8050.desc.free:0 "Meus punhos se fecham e o sangue lateja em meus ouvidos quando penso naquele monstro andando livre... uma afronta à justiça e a [ROOT.Char.GetFaith.HighGodName]."
 bp1_yearly.8050.desc.prisoner:0 "Embora [murderer_scope.GetSheHe] apodreça nas masmorras de [murderer_scope.GetImprisonedBy.GetTitledFirstNameNoTooltip], esse conhecimento não acalma a fúria em meu coração."
 bp1_yearly.8050.desc:0 "A perda de minha querida [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))], [victim_scope.GetFirstName], pesa muito; a lenta corrente de súditos em luto e suas condolências não se comparam ao buraco em meu coração. \n\nAinda não consigo acreditar que [victim_scope.GetSheHe] foi [victim_scope.GetDeathReasonHideKiller] e que [murderer_scope.GetTitledFirstName], seu assassino, continua impune. \n\n"
 bp1_yearly.8050.t:0 "Um assassinato: [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('victim_scope'))|U]"
 bp1_yearly.8060.a.ransom:0 "Cães não têm o direito de resgate."
 bp1_yearly.8060.a.war_leader:0 "Essa guerra acabou, mas só para você."
 bp1_yearly.8060.a:0 "Seus dias acabaram, escória."
 bp1_yearly.8060.b:0 "Mate [captured_rival.GetSheHe]. Mate todos eles."
 bp1_yearly.8060.c:0 "Eu vou me certificar de que você nunca esqueça este dia, [captured_rival.GetFirstNameNoTooltip]."
 bp1_yearly.8060.closing.multi:0 "\n\nAtrás d[captured_rival.GetSheHe], o vilão [captured_rival_2.GetTitledFirstName] se ajoelha impaciente."
 bp1_yearly.8060.closing.ransom:0 "\n\n[captured_rival.GetSheHe|U] balbucia, um pouco desesperado, \"Eu tenho o direito de ser resgatado!\""
 bp1_yearly.8060.d.multi:0 "Não se esqueça da minha misericórdia, miseráveis."
 bp1_yearly.8060.d:0 "Lembre-se da minha misericórdia, verme."
 bp1_yearly.8060.desc.nemesis:0 "[captured_rival.GetTitledFirstName], aquel[Select_CString( captured_rival.IsFemale, 'a', 'e' )] [captured_rival.Custom2('InsultNoun', ROOT.Char)] maldit[Select_CString( captured_rival.IsFemale, 'a', 'o' )] de [ROOT.Char.GetFaith.NegativeAfterLife], finalmente está em minhas mãos! Há muito tempo sonho em derrubar meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))]..."
 bp1_yearly.8060.desc.war_leader:0 "Finalmente, tenho minha [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))], [captured_rival.GetTitledFirstName], em minhas mãos, e a vitória em nossa guerra é agora quase certa...\n\n\"Eu me rendo\", [captured_rival.GetSheHe|U] rosna, \"Liberte-me e você terá o que quer.\""
 bp1_yearly.8060.desc:0 "Meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('captured_rival'))], [captured_rival.GetTitledFirstName], olha para mim carrancudo, aquecendo o meu coração."
 bp1_yearly.8060.opening:0 "Eu levo um momento para observar o campo de batalha cheio de [primary_combat_winner.GetPrimaryTitle.GetAdjectiveNoTooltip] e [primary_combat_loser.GetPrimaryTitle.GetAdjectiveNoTooltip] mortos de [combat_location.GetTerrain.GetNameNoTooltip|l] em [combat_location.GetNameNoTooltip], antes de me voltar para os prisioneiros de guerra acorrentados.\n\n"
 bp1_yearly.8060.t:0 "À minha misericórdia"
 bp1_yearly.8061.a:0 "\"[battle_rival_winner.Custom2('InsultAdjective', ROOT.Char)] fa-\""
 bp1_yearly.8061.b:0 "\"Não assim!\""
 bp1_yearly.8061.c:0 "[ROOT.Char.GetFaith.HighGodName] me proteja."
 bp1_yearly.8061.desc:0 "Fico em pé, marcado pelos guardas inimigos, no caótico [combat_location.GetTerrain.GetNameNoTooltip|l] de [combat_location.GetNameNoTooltip], enquanto aquele verme, [battle_rival_winner.GetTitledFirstName], observa sua vitória.\n\n[battle_rival_winner.GetSheHe|U] se aproxima finalmente, sacando com prazer sua [battle_rival_winner.Custom('SignatureWeaponNameOrType')] com um brilho aterrorizante em seus olhos.\n\n"
 bp1_yearly.8061.killed:0 "Vejo que chegou ao fim..."
 bp1_yearly.8061.t:0 "À Mercê de [combat_winner.GetTitledFirstNamePossessiveNoTooltip]"
 bp1_yearly.8062.a:0 "\"[battle_rival_winner.Custom2('InsultNoun', ROOT.Char)]!"
 bp1_yearly.8062.wounded:0 "\"Isso vai doer.\" [battle_rival_winner.GetSheHe] sorri."
 bp1_yearly.8070.a:0 "[favorite_vassal.GetFirstNameNoTooltip] possui qualidades que você não tem."
 bp1_yearly.8070.b:0 "Perdoe-me, [claim_vassal.GetFirstNameNoTooltip], [claim_title.GetNameNoTierNoTooltip] é seu."
 bp1_yearly.8070.c:0 "Vou conceder a você algum outro título."
 bp1_yearly.8070.claim:0 "\"Por que você favoreceria [favorite_vassal.GetSheHe] com essas terras em vez de mim? Não tenho sido um vassalo fiel?\""
 bp1_yearly.8070.culture:0 "\n\n\"Quero dizer...\" m[Select_CString( claim_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', claim_vassal)] engasga, \"[favorite_vassal.GetSheHe|U] nem é [claim_vassal.GetCulture.GetName]!\""
 bp1_yearly.8070.d.failure:0 "[claim_vassal.GetTitledFirstNameNoTooltip] está insultado"
 bp1_yearly.8070.d.success:0 "[claim_vassal.GetTitledFirstNameNoTooltip] está satisfeito"
 bp1_yearly.8070.d:0 "Não questione minhas decisões novamente."
 bp1_yearly.8070.faith:0 "\n\n\"Quero dizer...\" m[Select_CString( claim_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', claim_vassal)] engasga, \"[favorite_vassal.GetSheHe|U] nem é um [ROOT.Char.GetFaith.GetAdherentName]!\""
 bp1_yearly.8070.hostile:0 "\n\n\"Conceder terras a um maldito [favorite_vassal.GetFaith.GetAdherentName] em vez de mim!\" meu [ROOT.Char.Custom2('RelationToMe', claim_vassal)] engasga, \"É uma afronta à consciência!\""
 bp1_yearly.8070.lowborn:0 "\"A elevação desse insolente plebeu no meu lugar é um insulto!\""
 bp1_yearly.8070.opening:0 "[claim_vassal.GetTitledFirstName] estava silenciosamente furioso durante toda a noite, mas finalmente explode quando eu alcanço a [ROOT.Char.Custom('GetExpensiveMealAlt')].\n\n\"Eu simplesmente não consigo entender por que você concedeu o [claim_title.GetName] para [favorite_vassal.GetTitledFirstName]."
 bp1_yearly.8070.other:0 "\"Que grave ofensa eu causei, para que você me trate de forma tão ignóbil?\""
 bp1_yearly.8070.strength_strong:0 "Meu direito legítimo a essas terras é reconhecido por todos!\"\n\n"
 bp1_yearly.8070.strength_weak:0 "Essas terras por direito me pertencem!\"\n\n"
 bp1_yearly.8070.t:0 "Favoritismo do [ROOT.Char.GetGovernment.GetNameNoTooltip]"
 bp1_yearly.8100.a.flavor:0 "[jealous_scope.GetFirstNameNoTooltip] pode guardar rancor"
 bp1_yearly.8100.a.hostile:0 "Como você se atreve a falar mal de [sycophant_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8100.a:0 "Um [ROOT.Char.GetTitleAsNameNoTooltip|l] pode escolher seu próprio conselho."
 bp1_yearly.8100.b.flavor:0 "Espero que [sycophant_scope.GetFirstNameNoTooltip] entenda"
 bp1_yearly.8100.b:0 "Me parece que você quer o trabalho [sycophant_scope.GetHerHim], [jealous_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8100.c.flavor:0 "Embora isso me doa..."
 bp1_yearly.8100.c:0 "Muito bem, eu vou demitir [sycophant_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8100.culture:0 "\"Certamente outra voz de [jealous_scope.GetCulture.GetName] serviria melhor do que esse forasteiro [sycophant_scope.GetCulture.GetName]?\""
 bp1_yearly.8100.d.failure:0 "[jealous_vassal.GetTitledFirstNameNoTooltip] não suporta [sycophant_scope.GetWomanMan]"
 bp1_yearly.8100.d.flavor:0 "[sycophant_scope.GetSheHe|U] é uma graça, realmente!"
 bp1_yearly.8100.d.success:0 "[sycophant_scope.GetTitledFirstNameNoTooltip] causa uma boa impressão"
 bp1_yearly.8100.d.tt:0 "Essa opção não está disponível porque [jealous_scope.GetFirstNameNoTooltip] é [sycophant_scope.GetFirstNamePossessiveNoTooltip] [jealous_scope.Custom2('RelationToMe', sycophant_scope)|U]"
 bp1_yearly.8100.desc:0 "\n\n[jealous_scope.Custom2('RelationToMe', ROOT.Char)|U], eu tenho estado querendo falar com você."
 bp1_yearly.8100.faction:0 "\"Francamente, se essas ofensas não forem corrigidas, apenas [jealous_scope.GetFaith.HighGodName] sabe o que acontecerá com [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]...\""
 bp1_yearly.8100.faith:0 "\"Será realmente sábio dar ouvidos a um [jealous_scope.Custom2('GetUnbelieverTerm', sycophant_scope)] [sycophant_scope.GetFaith.GetAdjective]?\""
 bp1_yearly.8100.fallback:0 ""
 bp1_yearly.8100.fired_tt:0 "[sycophant_scope.GetShortUIName|U] foi demitido do seu [conselho|E] por 5 anos"
 bp1_yearly.8100.friend:0 "Eu entendo que vocês são amigos próximos, mas há aqueles que pensam que você coloca [sycophant_scope.GetSheHe] antes de conselheiros mais merecedores.\"\n\n"
 bp1_yearly.8100.hostile:0 "\"Quer dizer, você não sabe o quão [sycophant_scope.Custom2('InsultAdjective', SCOPE.sC('jealous_scope'))] ess[Select_CString( sycophant_scope.IsFemale, 'a', 'e' )] [sycophant_scope.GetWomanMan] [sycophant_scope.Custom2('InsultNoun', SCOPE.sC('jealous_scope'))] é?\""
 bp1_yearly.8100.jealous:0 "\"Eu, por exemplo, sou um [jealous_scope.GetTitleAsNameNoTooltip] leal a [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].\""
 bp1_yearly.8100.joke:0 "Ainda estou sorrindo com a piada que meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] [sycophant_scope.GetFirstName] fez na sessão do conselho desta manhã, quando [jealous_scope.GetTitledFirstName] segura meu braço."
 bp1_yearly.8100.knowledgeable:0 "Eu me pego concordando, admirando [ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], [sycophant_scope.GetTitledFirstName], é tão experiente, estou feliz por ter um conselheiro tão confiável e capaz. [jealous_scope.GetTitledFirstName] claramente sente o contrário."
 bp1_yearly.8100.lover:0 "Eu sei que você sente... muito afeto por [sycophant_scope.GetSheHe], mas realmente, um lugar no conselho?\"\n\n"
 bp1_yearly.8100.lover_known:0 "Sua... afeição por [sycophant_scope.GetFirstNameNoTooltip] não passa despercebida, e levanta... questões sobre suas razões.\"\n\n"
 bp1_yearly.8100.lover_secret:0 "Eu, e outros na corte, não podemos entender as honras e responsabilidades que você confere a [sycophant_scope.GetSheHe]. Um nobre respeitado do reino certamente seria mais útil para você.\"\n\n"
 bp1_yearly.8100.lowborn:0 "\"Não é adequado colocar a opinião de um plebeu acima, ou mesmo ao lado, da mais alta nobreza de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip].\""
 bp1_yearly.8100.rank:0 "\"Certamente a opinião de um [jealous_scope.GetTitleAsNameNoTooltip] deve ser valorizada acima da de um mero [sycophant_scope.GetTitleAsNameNoTooltip]!\""
 bp1_yearly.8100.reveal_tt:0 "[jealous_scope.GetTitledFirstName] pode revelar seu segredo com [sycophant_scope.GetFirstNamePossessive] [sycophant_secret.GetName]"
 bp1_yearly.8100.skilled:0 "\"Não importa o quão bom seja [sycophant_scope.GetSheHe] como [sycophant_scope.GetCouncilTitle], esse insulto é claro como o dia.\""
 bp1_yearly.8100.support:0 "[ROOT.Char.Custom2('RelationToMe', sycophant_scope)|U], [sycophant_scope.GetTitledFirstName], é uma presença reconfortante em meu conselho, sempre pronto para me apoiar, embora [jealous_scope.GetTitledFirstName] claramente pense diferente."
 bp1_yearly.8100.t:0 "Favorito Impopular"
 bp1_yearly.8100.thighs:0 "Estou perdido em pensamentos, ponderando as coxas elegantes de meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] [sycophant_scope.GetTitledFirstNamePossessive], quando ouço [jealous_scope.GetTitledFirstName] tossir atrás de mim."
 bp1_yearly.8100.unskilled:0 "\"Além do insulto, [sycophant_scope.GetWomanMan] está claramente inadequado para o cargo de [sycophant_scope.GetCouncilTitle].\""
 bp1_yearly.8110.c.flavor:0 "...faça do seu jeito!"
 bp1_yearly.8110.c:0 "Muito bem..."
 bp1_yearly.8110.d:0 "Não tenho vergonha de nada."
 bp1_yearly.8110.desc:0 "Enquanto caminho silenciosamente antes de dormir, distraído pelos pensamentos do meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], os encantadores olhos de [sycophant_scope.GetTitledFirstNamePossessive], eu vejo a forma familiar de [revealer_scope.GetTitledFirstNamePossessive] se aproximando de mim.\n\n\"Ah, [ROOT.Char.Custom('FormOfAddressForLiege')]... Eu não poderia explicar o grande apreço que você tem demonstrado por [sycophant_scope.GetFirstNameNoTooltip] - #EMP até agora#!.\"\n\n"
 bp1_yearly.8110.e:0 "Você tem certeza de que [secondary_scope.GetFirstNameNoTooltip] gostaria disso?"
 bp1_yearly.8110.known_secret_adulterer:0 "\"Remova [sycophant_scope.GetSheHe] do seu conselho, ou seu adultério impiedoso será conhecido por todos.\""
 bp1_yearly.8110.known_secret_homosexual:0 "\"Dê lugar para um vassalo mais merecedor em seu círculo íntimo, ou serei forçado a revelar seu relacionamento não natural.\""
 bp1_yearly.8110.known_secret_other:0 "\"Remova o [sycophant_scope.Custom2('InsultAdjective', SCOPE.sC('revealer_scope'))] encrenqueiro do seu conselho, ou serei forçado a revelar seu relacionamento.\""
 bp1_yearly.8110.t:0 "Segredo de [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8120.a.flavor:0 "Deveria ter você açoitado!"
 bp1_yearly.8120.a:0 "Saia."
 bp1_yearly.8120.b.flavor:0 "Que noção ridícula!"
 bp1_yearly.8120.b:0 "[sycophant_scope.GetFirstNameNoTooltip]? Hah, de jeito nenhum!"
 bp1_yearly.8120.c.flavor:0 "Você acha que [sycophant_scope.GetSheHe] também gosta de mim?"
 bp1_yearly.8120.c:0 "O quê? #EMP Oh...#! Você pode estar certo..."
 bp1_yearly.8120.d.flavor:0 "O que deu a entender?"
 bp1_yearly.8120.d:0 "Você #EMP é#! perspicaz, mas não vou ceder."
 bp1_yearly.8120.desc:0 "Caramba, [sycophant_scope.GetTitledFirstNamePossessive] é ótimo... Eu afasto minha reverie quando [matchmaker_scope.GetTitledFirstName] aparece, fechando a porta atrás [matchmaker_scope.GetHerHim].\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], venho a você em confiança com um assunto delicado...\" [matchmaker_scope.GetSheHe|U] hesita. \"Você acha que... talvez esteja dando responsabilidades e honras a [sycophant_scope.GetFirstNameNoTooltip] porque você... #EMP gosta#! [sycophant_scope.GetHerHim]?\"\n\n[matchmaker_scope.GetFirstNameNoTooltip] puxa nervosamente sua gola.\n\n\"Talvez todos ficassem melhor se #EMP você#! cuidasse disso#, e deixasse os cargos para seus nobres?\""
 bp1_yearly.8120.seduce:0 "[scheme|E] terá chance extra de [success_chance|E]"
 bp1_yearly.8120.t:0 "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Allure"
 bp1_yearly.8121.a.flavor:0 "Essa oportunidade não pode ser desperdiçada"
 bp1_yearly.8121.a:0 "Devo seguir meu coração."
 bp1_yearly.8121.adultery:0 "Não seria certo trair [ROOT.Char.GetConsort.GetTitledFirstName], mas [ROOT.Char.GetFaith.HighGodNameAlternate] certamente tem uma razão para me fazer sentir assim!"
 bp1_yearly.8121.b.flavor:0 "De volta aos negócios..."
 bp1_yearly.8121.b.friend:0 "[sycophant_scope.GetSheHe|U] é apenas um amigo! Um #EMP amigo#!!"
 bp1_yearly.8121.b:0 "Isso só acabaria mal..."
 bp1_yearly.8121.desc:0 "\n\nO que devo fazer..."
 bp1_yearly.8121.homosexual:0 "Eu sei que não é o que [ROOT.Char.GetFaith.HighGodName] pretendia entre [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetWomanMan] e outro... oh [ROOT.Char.GetFaith.PositiveAfterLife]!"
 bp1_yearly.8121.opening:0 "Pensamentos eróticos têm me atormentado desde minha conversa com [matchmaker_scope.GetTitledFirstName], sonhos de [sycophant_scope.GetTitledFirstName] e eu...\n\n"
 bp1_yearly.8121.other:0 "E se [sycophant_scope.GetSheHe] sentir o mesmo? Estou me torturando à toa? [ROOT.Char.GetFaith.FertilityGodName] me ajude..."
 bp1_yearly.8121.t:0 "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Fragrância"
 bp1_yearly.8130.a.flavor:0 "Não há nada com que se preocupar."
 bp1_yearly.8130.a.paranoid:0 "\"Vamos lá, provavelmente foi um servo."
 bp1_yearly.8130.a:0 "Vamos lá, isso não é como você."
 bp1_yearly.8130.b:0 "Eu farei com que você seja guardado, dia e noite."
 bp1_yearly.8130.c.failure:0 "Nenhuma evidência é encontrada."
 bp1_yearly.8130.c.flavor:0 "A verdade não pode escapar [spymaster_scope.GetHerHim]."
 bp1_yearly.8130.c.success:0 "[spymaster_scope.GetCouncilTitleFirstNameNoTooltip] encontra evidências."
 bp1_yearly.8130.c:0 "[spymaster_scope.GetFirstNameNoTooltip] chegará ao fundo disso."
 bp1_yearly.8130.d.failure:0 "[spymaster_scope.GetFirstNameNoTooltip] desaparece."
 bp1_yearly.8130.d.flavor:0 "De todas as pessoas para se preocupar..."
 bp1_yearly.8130.d.success:0 "[spymaster_scope.GetFirstNameNoTooltip] encontra evidências."
 bp1_yearly.8130.d:0 "Você deveria investigar isso, Spymaster."
 bp1_yearly.8130.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstName], irrompe em meus aposentos, derrubando uma lâmpada e quase incendiando uma almofada.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! Tenho certeza de que estou sendo seguida!\", [sycophant_scope.GetSheHe] grita, apontando para [sycophant_scope.GetSheHe].\n\n\"Havia homens espreitando do lado de fora dos meus aposentos; minhas coisas foram mexidas!\""
 bp1_yearly.8130.e.failure:0 "Nada é encontrado"
 bp1_yearly.8130.e.flavor:0 ""
 bp1_yearly.8130.e.success:0 "Você descobre uma conspiração"
 bp1_yearly.8130.e:0 "Ninguém ameaça #EMP meu#! [ROOT.Char.Custom2('RelationToMe', sycophant_scope)]!"
 bp1_yearly.8130.exposed:0 "[scheme|E] contra [sycophant_scope.GetShortUIName] será exposto."
 bp1_yearly.8130.progress:0 "[scheme|E] contra [sycophant_scope.GetShortUIName] irá progredir."
 bp1_yearly.8130.t:0 "Inimigos de [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8131.a.flavor:0 "Através das #EMP barras#!!"
 bp1_yearly.8131.a:0 "Parece que você tem algumas explicações a dar, [murderous_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8131.agent:0 "Outro [agent|E] envolvido no [scheme|E] pode ser descoberto."
 bp1_yearly.8131.attempted:0 "[agent_scope.GetTitledFirstNameNoTooltip] estava envolvido no complô!"
 bp1_yearly.8131.b.flavor:0 "Não é #EMP traição#, afinal de contas."
 bp1_yearly.8131.b:0 "[murderous_scope.GetSheHe|U] aprendeu sua lição."
 bp1_yearly.8131.c.flavor:0 "Passe-me o martelo!"
 bp1_yearly.8131.c:0 "Quem mais está envolvido?"
 bp1_yearly.8131.desc.spymaster:0 "Enquanto reclino com meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstName], recebemos uma mensagem do meu Mestre dos Espiões, [spymaster_scope.GetTitledFirstName], instruindo-nos a ir até minha masmorra.\n\nLá, nas profundezas úmidas do meu [ROOT.GetCharacter.Custom('FortifiedBuilding')], encontramos [spymaster_scope.GetHerHim], com um miserável [murderous_scope.GetTitledFirstName] acorrentado ao lado [spymaster_scope.GetHerHim].\n\n\"Este é o culpado, [ROOT.Char.Custom('FormOfAddressForLiege')],\" canta [spymaster_scope.GetSheHe], \"Não há dúvidas.\""
 bp1_yearly.8131.desc.sycophant:0 "Fico surpreso ao ser chamado para as masmorras nas profundezas do meu castelo, e por ninguém menos que [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstName].\n\nLá, em uma cela, encontro [sycophant_scope.GetHerHim], aliviado, ao lado de um [murderous_scope.GetTitledFirstName] visivelmente menos feliz, acorrentado.\n\nEu ofego, \"[sycophant_scope.GetFirstNameNoTooltip]! O que você te-\" antes que [sycophant_scope.GetSheHe] interrompa: \"Este [murderous_scope.Custom2('InsultNoun', SCOPE.sC('sycophant_scope'))] tentou me matar - eu tenho as confissões do seu capanga para provar!\""
 bp1_yearly.8131.desc:0 "Estou tenso de antecipação enquanto meus guardas levam o agente capturado para minha masmorra, amarrado, com capuz e gemendo.\n\n\"Venha, [sycophant_scope.GetFirstName], vamos ver quem tentou contratar seu assassino!\"\n\nCom um gesto dramático e um suspiro, meu carcereiro revela ninguém menos que [murderous_scope.GetTitledFirstName]!\n\n[sycophant_scope.GetFirstNameNoTooltip] e eu rosnavamos em uníssono: \"#EMPY Você!#!\""
 bp1_yearly.8131.t.sycophant:0 "Astúcia de [spymaster_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8131.t:0 "Vindicação de [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8131.torture:0 "Você irá [torture|E] [murderous_scope.GetShortUIName]."
 bp1_yearly.8131.tt:0 "O envolvimento de [murderous_scope.GetTitledFirstName] em um [scheme|E] para [sycophant_scheme.GetSchemeType.GetTypeNameNoTooltip] [sycophant_scope.GetFirstName] é descoberto"
 bp1_yearly.8132.a.flavor:0 "Melhor prevenir do que remediar."
 bp1_yearly.8132.a:0 "Eu vou te guardar, apenas por precaução."
 bp1_yearly.8132.b.flavor:0 "Isso é uma perda de tempo"
 bp1_yearly.8132.b:0 "Ou apenas uma brincadeira inofensiva?"
 bp1_yearly.8132.desc.spymaster:0 "Meu Mestre-Espião, [spymaster_scope.GetTitledFirstNamePossessive], finalmente admitiu que [spymaster_scope.GetSheHe] não pode encontrar nenhuma evidência de um complô contra meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] [sycophant_scope.GetFirstName].\n\n[spymaster_scope.GetSheHe|U] chegou ao ponto de sugerir que todo o episódio é uma criação da imaginação de [sycophant_scope.GetFirstNamePossessiveNoTooltip]..."
 bp1_yearly.8132.desc.sycophant:0 "[Select_CString( sycophant_scope.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], retorna para mim ainda mais exasperado.\n\nParece que [sycophant_scope.GetSheHe] esgotou todas as opções disponíveis para [sycophant_scope.GetHerHim] sem chegar mais perto de revelar evidências de uma conspiração.\n\n\"O que eu devo fazer, [ROOT.Char.GetFirstNameNoTooltip],\" [sycophant_scope.GetSheHe] suspira, \"Estou à mercê dos meus inimigos!\""
 bp1_yearly.8132.desc:0 "Eu investiguei as preocupações do meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], colocando vigias em suas câmaras e interrogando os criados em todo o [ROOT.GetCharacter.Custom('FortifiedBuilding')], mas sem sucesso.\n\n\"Talvez tenha sido apenas um criado arrumando?\" Eu ofereço fracamente.\n\n[sycophant_scope.GetSheHe|U] anda de um lado para o outro em meu quarto, claramente não convencido."
 bp1_yearly.8132.t:0 "O medo de [sycophant_scope.GetFirstNamePossessiveNoTooltip]."
 bp1_yearly.8134.a.flavor:0 "O que eu fiz..."
 bp1_yearly.8134.a:0 "Onde você está, [sycophant_scope.GetFirstNameNoTooltip]?"
 bp1_yearly.8134.desc:0 "Já faz muito tempo desde que eu tive notícias do meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetTitledFirstNamePossessive], e estou começando a temer o pior.\n\nSe houver realmente uma ameaça contra sua vida... oh [ROOT.Char.GetFaith.HighGodName]..."
 bp1_yearly.8134.t:0 "Ausência de [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8140.a.flavor:0 "Vergonha em você!"
 bp1_yearly.8140.a:0 "[sycophant_scope.GetFirstNameNoTooltip]! Eu ouvi tudo!"
 bp1_yearly.8140.b.flavor:0 "Finalmente algo divertido!"
 bp1_yearly.8140.b:0 "Sim! [jealous_scope.GetFirstNameNoTooltip] irá #EMP morrer#!!"
 bp1_yearly.8140.c.flavor:0 "Eu não ouvi #EMP nada#!"
 bp1_yearly.8140.c:0 "#EMP Eu saio de fininho#!"
 bp1_yearly.8140.desc:0 "Olhando minha coleção de excelentes [ROOT.Char.Custom('RegionalAlcoholicDrink')|U], ouço a voz familiar do meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName].\n\nEscondido entre os barris, [sycophant_scope.GetSheHe] está xingando e proferindo palavrões contra [jealous_scope.GetTitledFirstName] para algum servo ou outro.\n\nJusto quando estou prestes a perder o interesse, ouço algo que arrepia meu sangue: 'mate [jealous_scope.GetTitledFirstName]!'"
 bp1_yearly.8140.t:0 "Vingança de [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8160.a.flavor:0 "Isso precisa ser bom!"
 bp1_yearly.8160.a:0 "Muito bem, o que é?"
 bp1_yearly.8160.b.failure:0 "Essa é a gota d'água para [jealous_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8160.b.flavor:0 "O que poderia #EMP dar errado#!?"
 bp1_yearly.8160.b.success:0 "[sycophant_scope.GetFirstNameNoTooltip] ganha a simpatia [jealous_scope.GetHerHim]"
 bp1_yearly.8160.b:0 "Junte-se a nós, você precisa ouvir essa!"
 bp1_yearly.8160.d.flavor:0 "Você não vê que estou #EMP ocupado#!?"
 bp1_yearly.8160.d:0 "Não agora, [jealous_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8160.desc:0 "Eu, [sycophant_scope.GetFirstName], e [ROOT.Char.Custom2('RelationToMe', sycophant_scope)] estamos passeando pelos meus jardins, rindo alto de uma rima que [sycophant_scope.GetSheHe] ouviu de um servo, quando [jealous_scope.GetTitledFirstName] cruza nosso caminho.\n\n[jealous_scope.GetSheHe|U] olha para nós com seriedade e diz: '[ROOT.Char.Custom('FormOfAddressForLiege')|U], há algo que eu gostaria de discutir, se você tiver um momento?'"
 bp1_yearly.8160.t:0 "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Charm"
 bp1_yearly.8161.a.flavor:0 "Você quase me enganou!"
 bp1_yearly.8161.a:0 "#EMP cutuca as costelas#! [ROOT.Char.Custom('GetLaughType')]"
 bp1_yearly.8161.desc:0 "Devagar, um sorriso aparece nos cantos de sua boca, se espalhando para um largo sorriso e finalmente soltando uma gargalhada estrondosa!\n\n'Tha- #EMP suspiro#! Essa é a mais engraçada - #EMP suspiro#! Oh! Eu te julguei mal, [sycophant_scope.GetFirstNameNoTooltip]! Vamos comer!'"
 bp1_yearly.8161.opening:0 "À medida que os ecos dos últimos efeitos sonoros de [sycophant_scope.GetTitledFirstNamePossessive] se dissipam no canto dos pássaros, [jealous_scope.GetTitledFirstNamePossessive] permanece sério como sempre.\n\n"
 bp1_yearly.8161.t:0 "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Magia"
 bp1_yearly.8162.a.flavor:0 "Fique com o material dos criados, hein?"
 bp1_yearly.8162.a:0 "Por que não aquela, [sycophant_scope.GetFirstNameNoTooltip]..."
 bp1_yearly.8162.desc:0 "Eu tenho um sentimento horrível de que a piada não funcionou.\n\nMeus medos são confirmados quando, momentos depois, [jealous_scope.GetFirstNameNoTooltip] solta um suspiro esmagador de alma, revira os olhos e sai.\n\n[sycophant_scope.GetFirstName] dá de ombros: \"Vamos lá, que puritano...\""
 bp1_yearly.8162.t:0 "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Clanger"
 bp1_yearly.8170.a.flavor:0 "Não vou mais perder tempo com [sycophant_scope.GetSheHe]"
 bp1_yearly.8170.a:0 "Estou acima disso."
 bp1_yearly.8170.b.failure:0 "[sycophant_scope.GetFirstNameNoTooltip] fica com [friendly_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8170.b.flavor:0 "Eu sei do que [sycophant_scope.GetSheHe] gosta"
 bp1_yearly.8170.b.success:0 "[sycophant_scope.GetFirstNameNoTooltip] segue"
 bp1_yearly.8170.b:0 "Ah, [sycophant_scope.GetFirstNameNoTooltip], uma palavra?"
 bp1_yearly.8170.c.flavor:0 "Tenha uma boa risada com #EMP isso#!!"
 bp1_yearly.8170.c:0 "Eu não preciso mais de você, [sycophant_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8170.desc:0 "Eu vejo cada vez menos o meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName]. Parece que [sycophant_scope.GetSheHe] tem passado muito tempo com o meu [ROOT.Char.Custom2('RelationToMe', friendly_scope)], [friendly_scope.GetTitledFirstName]...\n\nEu encontro o par deles; batendo nas coxas com alguma piada; rindo quando eles olham para mim.\n\nO que eu devo fazer com isso..."
 bp1_yearly.8170.t:0 "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Amigo"
 bp1_yearly.8180.a.flavor:0 "Você sabe disso muito bem..."
 bp1_yearly.8180.a:0 "Você sabe que não posso perder você, [sycophant_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8180.b.failure:0 "[sycophant_scope.GetFirstNameNoTooltip] sai"
 bp1_yearly.8180.b.flavor:0 "Há muitos fatores em jogo..."
 bp1_yearly.8180.b.success:0 "[sycophant_scope.GetFirstNameNoTooltip] fica"
 bp1_yearly.8180.b:0 "Venha, você sabe que é mais complexo que isso!"
 bp1_yearly.8180.c.flavor:0 "Fora!"
 bp1_yearly.8180.c:0 "Vá então, se é isso que você pensa!"
 bp1_yearly.8180.d.flavor:0 "Se eu não posso tê-lo..."
 bp1_yearly.8180.d:0 "Você está ameaçando traição!"
 bp1_yearly.8180.desc:0 "Meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName], solicitou uma audiência privada, uma formalidade incomum que só pode significar más notícias.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetTitleAsNameNoTooltip]... Eu não aguento mais! Você me exclui, cede ao seu 'dever', quando você sabe que eu fui um conselheiro perfeitamente bom!\"\n\n\"Se é assim que serei tratado, terei que procurar novas perspectivas. Ouvi dizer que [new_realm.GetHolder.GetName] sabe recompensar súditos leais...\""
 bp1_yearly.8180.t:0 "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Ultimato"
 bp1_yearly.8190.a.flavor:0 "A Sociedade de Apreciação de [sycophant_scope.GetFirstNameNoTooltip] cresce"
 bp1_yearly.8190.a:0 "Finalmente, um colega apreciador de caráter!"
 bp1_yearly.8190.b.flavor:0 "Mantenha seus amigos por perto"
 bp1_yearly.8190.b:0 "Que tal sairmos juntos à noite, só nós três?"
 bp1_yearly.8190.desc:0 "Eu sabia que via algo de verdadeiro nele(a)!"
 bp1_yearly.8190.opening:0 "Cruzando o pátio, fico satisfeito em finalmente ouvir alguém apreciando meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstName].\n\n\"Oh não ligue para aqueles azedos,\" [friendly_scope.GetTitledFirstName] canta, \"você é o melhor [sycophant_scope.GetCouncilTitle] [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] teve em anos - pelo menos que eu saiba!\"\n\n"
 bp1_yearly.8190.t:0 "[sycophant_scope.GetFirstNamePossessiveNoTooltip] Talentos"
 bp1_yearly.8190.twitch:0 "Por um momento, tenho certeza de que avistei [jealous_scope.GetTitledFirstName] nas estábulos sombreados do quadrilátero, com um tique nervoso no olho, antes de [jealous_scope.GetSheHe] se dissolver na escuridão."
 bp1_yearly.8191.a.flavor:0 "Graças a [sycophant_scope.GetFirstNameNoTooltip]"
 bp1_yearly.8191.a:0 "Uma excelente ideia, [sycophant_scope.GetFirstNameNoTooltip]!"
 bp1_yearly.8191.arrogant:0 "\n\n[sycophant_scope.GetSheHe|U] gesticula grandiosamente para [sycophant_scope.GetHerselfHimself], \"Deixe-me resolver isso para você, meu senhor, esse tipo de trabalho requer uma certa habilidade.\""
 bp1_yearly.8191.b.flavor:0 "[sycophant_scope.GetFirstNameNoTooltip] vai mostrar a [old_holder.GetSheHe] como se faz!"
 bp1_yearly.8191.b:0 "Sim, é hora de [old_holder.GetFirstNameNoTooltip] se retirar!"
 bp1_yearly.8191.c.flavor:0 "Os talentos de [sycophant_scope.GetFirstNameNoTooltip] são infinitos"
 bp1_yearly.8191.c:0 "Que tal você assumir uma posição aberta?"
 bp1_yearly.8191.d.flavor:0 "[sycophant_scope.GetFirstNameNoTooltip] não consegue conseguir #EMP tudo#!"
 bp1_yearly.8191.d:0 "Eu acho que esse é um trabalho para [annoyed_scope.GetFirstNameNoTooltip]."
 bp1_yearly.8191.desc:0 "\n\n[annoyed_scope.GetTitledFirstName] está claramente furioso."
 bp1_yearly.8191.e.flavor:0 "[sycophant_scope.GetFirstNameNoTooltip] vai superar isso"
 bp1_yearly.8191.e:0 "Deve haver negócios mais urgentes?"
 bp1_yearly.8191.open:0 "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] precisa desesperadamente de um [sycophant_scope.Custom('GetTargetCourtPosition')]; alguém para cuidar de [sycophant_scope.Custom('GetTargetCourtPositionDesc')]..."
 bp1_yearly.8191.opening:0 "Outra reunião interminável do conselho continua, até que meus ouvidos são subitamente aguçados pelas palavras sedutoras de [sycophant_scope.GetFirstNamePossessive], [ROOT.Char.Custom2('RelationToMe', sycophant_scope)].\n\n\"Negócios urgentes, [ROOT.Char.Custom('FormOfAddressForLiege')],"
 bp1_yearly.8191.other:0 "\n\n[sycophant_scope.GetSheHe|U] coloca sua mão no coração, \"Claro, #EMP eu#! ficaria feliz em assumir esse importante encargo, meu senhor.\""
 bp1_yearly.8191.t:0 "Recompensas de [sycophant_scope.GetFirstNamePossessiveNoTooltip]"
 bp1_yearly.8191.taken:0 "[ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] precisa desesperadamente de um [sycophant_scope.Custom('GetTargetCourtPosition')] capaz; alguém para cuidar adequadamente de [sycophant_scope.Custom('GetTargetCourtPositionDesc')]... algo que [old_holder.GetTitledFirstName] falhou miseravelmente."
 bp1_yearly.8192.a.flavor:0 "É hora de [sycophant_scope.GetFirstNameNoTooltip] sair"
 bp1_yearly.8192.a:0 "Eu não tinha ideia de que as coisas estavam tão ruins..."
 bp1_yearly.8192.b.flavor:0 "Odiadores sempre odiarão"
 bp1_yearly.8192.b:0 "Não há lugar para ciúmes mesquinhos no meu conselho."
 bp1_yearly.8192.c.flavor:0 "Os talentos de [sycophant_scope.GetFirstNameNoTooltip] são infinitos"
 bp1_yearly.8192.c:0 "#EMP suspiro#! Você não vê que estou #EMP ocupado#!, [insulting_scope.GetFirstNameNoTooltip]?"
 bp1_yearly.8192.desc:0 "Enquanto eu tiro um tempo no sofá para pensar em como recompensar meu [ROOT.Char.Custom2('RelationToMe', sycophant_scope)], [sycophant_scope.GetFirstNamePossessive], ótimo trabalho recente, o trinco da porta repentinamente estala para revelar [insulting_scope.GetTitledFirstName].\n\n\"Perdoe-me por falar tão francamente [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.GetLadyLord], mas esse assunto com [sycophant_scope.GetFirstNameNoTooltip] está ficando fora de controle!\"\n\n\"O tolo não é bom em ser um [sycophant_scope.GetCouncilTitle]; cada dia que [sycophant_scope.GetSheHe] está no comando, as coisas vão piorar ainda mais, levando à ruína de todos os [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]!\""
 bp1_yearly.8192.fired_tt:0 "[insulting_scope.GetShortUIName|U] é demitido do seu [conselho|E] por 5 anos"
