l_spanish:
 game_concept_anointment:0 "$game_concept_coronation_anointment$"
 game_concept_anointment_request:0 "Solicitar Unção"
 game_concept_anointment_request_desc:0 "A [character_interaction|E] Solicitar Unção é uma interação especial que pode ser usada por um [ruler|E] em seu [head_of_faith|E] para garantir apoio em uma [anointment|E]."
 game_concept_anointments:0 "Unções"
 game_concept_coronation:0 "Coroação"
 game_concept_coronation_anointment:0 "Unção"
 game_concept_coronation_anointment_desc:0 "A Unção é um tipo de [coronation|E], em que o [ruler|E] buscará o [head_of_faith|E] para abençoar sua ascensão ao trono. Em certas fés, isso é necessário para que seja verdadeiramente considerado um [legitimate|E] governante de suas terras.\n\nPara garantir o apoio de seu Chefe da Fé, o [host|E] pode usar a [interaction|E] de [anointment_request|E]."
 game_concept_coronation_desc:0 "A Coroação é uma [activity|E] na qual um [ruler|E] convida [vassals|E], pares e [guests|E] de todas as partes para testemunharem sua ascensão ao trono.\n\nA Coroação vem em duas formas: uma Coroação regular e uma [anointment|E], sendo a última capaz de fornecer melhores recompensas, mas a custos maiores.\n\nRecompensas esperadas:\n$activity_coronation_host_desc$"
 game_concept_coronation_detractor:0 "Opositor"
 game_concept_coronation_detractor_desc:0 "Opositores são [activity_guests_short|E] na [activity|E] de [coronation|E] que se opõem ao [host|E] em sua ascensão ao trono. Eles tentarão atrapalhar o [ruler|E] e arruinar sua [legitimacy|E].\n\nEles se opõem diretamente aos [coronation_supporters|E], convidados que tentam ajudar o anfitrião."
 game_concept_coronation_detractors:0 "Opositores"
 game_concept_coronation_i:0 "@activity_coronation!"
 game_concept_coronation_magnificence:0 "Magnificência"
 game_concept_coronation_magnificence_desc:0 "A Magnificência de uma [coronation|E] determina o resultado da [activity|E]; uma pontuação mais alta de Magnificência leva a um resultado melhor para o [host|E].\n\nA Magnificência pode ser obtida através de [intents|E], [activity_options|E] e eventos na atividade. [coronation_supporters|E] e [coronation_detractors|E] também podem influenciar o valor."
 game_concept_coronation_supporter:0 "Apoiador"
 game_concept_coronation_supporter_desc:0 "Apoiadores são [activity_guests_short|E] na [activity|E] de [coronation|E] que apoiam o [host|E] em sua ascensão ao trono. Eles terão oportunidades especiais para ajudar o [ruler|E] a assegurar sua [legitimacy|E].\n\nEles se opõem diretamente aos [coronation_detractors|E], convidados que tentam atrapalhar o anfitrião."
 game_concept_coronation_supporters:0 "Apoiadores"
 game_concept_coronations:0 "Coroações"
 game_concept_oath:0 "Juramento"
 game_concept_oath_desc:0 "Juramentos são feitos durante a [activity|E] de [coronation|E] pelo [host|E] e desempenham um papel importante em assegurar a [legitimacy|E] de um novo [ruler|E] ao assumir o trono.\n\nJuramentos desbloquearão [decisions|E] especiais e limitadas por tempo, que o governante terá que completar para provar que é digno de seu [title|E]. As recompensas obtidas serão afetadas pela [coronation_magnificence|E] da coroação."
 game_concept_oaths:0 "Juramentos"
 game_concept_request_anointment:0 "$game_concept_anointment_request$"
