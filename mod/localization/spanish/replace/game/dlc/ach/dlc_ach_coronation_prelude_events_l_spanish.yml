 bp4_advocate_domain_construction_county_modifier:0 "Construtores Reais"
 bp4_advocate_domain_construction_county_modifier_desc:0 "O dono deste condado sacrificou um pouco de honra em troca da ajuda de construção de um monarca recém-ungido."
 bp4_lazy_realm_focus_modifier:0 "Confortavelmente em Casa"
 bp4_lazy_realm_focus_modifier_desc:0 "Este personagem recusou uma oferta para se tornar conselheiro(a) a fim de se concentrar em seu próprio domínio... ou pelo menos foi o que disse."
 bp4_paranoid_measures_modifier:0 "Medidas Paranoicas"
 bp4_paranoid_measures_modifier_desc:0 "Este personagem aumentou sua vigilância depois de lhe oferecerem um(a) cortesão(ã) suspeito(a)."
 cheaper_to_convert_to_guest_faith_tt:0 "Você ganha um desconto de #P 50%#! para converter-se à fé [guest.GetFaith.GetName]"
 coronation_blessed_artifact_desc:0 "[my_artifact.GetDesc]\n\nParece emitir uma luz trêmula. Um lembrete da bênção concedida durante a coroação d[Select_CString( artifact_owner.IsFemale, 'a', 'o' )] [artifact_owner.GetTitledFirstNamePossessive]."
 coronation_events.3001.a:0 "Obrigado pelo lembrete."
 coronation_events.3001.b:0 "Não houve engano algum."
 coronation_events.3001.desc:0 "Vários de seus fiéis vassalos notaram que os mensageiros enviando os convites para sua coroação se perderam a caminho de nossas cortes.\n\nNão gostaríamos de perder a ocasião."
 coronation_events.3001.opening:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'Ao' )] esquecid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 coronation_famed_dynasty_modifier:0 "Dinastia Famosa"
 coronation_famed_dynasty_modifier_desc:0 "O alto nível de fama de um dos membros desta dinastia foi reconhecido por todos os convidados de uma coroação."
 coronation_gift_artifact_desc:0 "[guest_artifact.GetDesc]\n\nUm presente atencioso de [guest.GetShortUINamePossessive] para a coroação."
 coronation_gift_artifact_host_desc:0 "[my_artifact.GetDesc]\n\nDado como parte de uma troca de presentes durante a coroação."
 coronation_good_health_modifier:0 "Uma Oração pela Boa Saúde"
 coronation_good_health_modifier_desc:0 "Este personagem reservou um momento em uma coroação para rezar por boa saúde."
 coronation_vassal_building_modifier:0 "Promessa de Construção"
 coronation_vassal_building_modifier_desc:0 "Este personagem ganhará [prestige_i][prestige|E] sempre que construir edifícios nos domínios de seus vassalos."
 coronation_vassal_building_tt:0 "Por causa da Sua [GetModifier('coronation_vassal_building_modifier').GetName]"
 coronation_wealth_modifier:0 "Uma Oração pela Riqueza"
 coronation_wealth_modifier_desc:0 "Este personagem reservou um momento em uma coroação para rezar por riqueza."
