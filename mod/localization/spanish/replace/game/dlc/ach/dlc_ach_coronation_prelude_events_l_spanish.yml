 not_invited_coronation_opinion:0 "Não Convidado para a Coroação"
 prelude_events.0001.a:0 "\"Isso é fantástico! [regent.GetSheHe|U] está fazendo todo o trabalho por mim!\""
 prelude_events.0001.b.tt.supporter:0 "[guest.GetShortUIName] se torna seu #high Apoiador#!"
 prelude_events.0001.b:0 "\"Aceito felizmente seu presente.\""
 prelude_events.0001.c.opinion:0 "$every_detractor$ ganha #P 10#! de [opinion|E] sobre você #weak (-1.20/ano) (Respeito)#!"
 prelude_events.0001.c.tt.every_supporter:0 "Você ganha [prestige_i]#P 20#! por $every_supporter$"
 prelude_events.0001.c:0 "\"Espalhe a palavra!\""
 prelude_events.0001.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U] [ROOT.Char.GetTitledFirstName], ouvi da boca d[Select_CString( regent.IsFemale, 'a', 'o' )] respeitável [regent.GetTitledFirstName], seu bom regente, que você é cheio de promessas.\" [guest.GetShortUIName] diz, [guest.Custom('quirk_pos_pp')]. \"[guest.Custom2('DescriptorPositive', ROOT.Char)|U] e [guest.Custom2('DescriptorPositive', ROOT.Char)], [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] melhor [ROOT.Char.GetTitleAsNameNoTooltip] que poderíamos esperar ter!\""
 prelude_events.0001.t:0 "Uma Mão Amiga"
 prelude_events.0010.a:0 "Eu #EMP sabia#! que [Select_CString( regent.IsFemale, 'a', 'o' )] [regent.GetTitledFirstNameNoTooltip] estava conspirando contra mim!"
 prelude_events.0010.b:0 "Mandarei meus agentes infiltrarem a corte d[Select_CString( guest.IsFemale, 'a', 'o' )] [guest.GetFirstNamePossessiveNoTooltip]."
 prelude_events.0010.c.tt.failure:0 "Seus agentes falham em entrar"
 prelude_events.0010.c.tt.success:0 "Seus agentes se infiltram na corte"
 prelude_events.0010.c:0 "Devemos derrotar [guest.GetHerHim] por dentro."
 prelude_events.0010.d.supporter.tt:0 "[guest.GetShortUIName] deixa de ser seu #high Opositor#! e se torna um #high Apoiador#!"
 prelude_events.0010.d:0 "\"Podemos concordar que você não ouviu nada...\""
 prelude_events.0010.desc:0 "\"Você ouviu as notícias sobre noss[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitledFirstName]?\" [guest.GetTitledFirstName] mal consegue conter a alegria [guest.GetHerHim] ao falar com [Select_CString( guest_2.IsFemale, 'a', 'o' )] [guest_2.GetTitledFirstName].\n\n\"Dizem que até seu próprio regente, [regent.GetTitledFirstName], afirmou que [ROOT.Char.GetSheHe] mal consegue ficar acordado durante as reuniões do conselho. Como se espera que [ROOT.Char.GetSheHe] governe este reino se não consegue nem governar [ROOT.Char.GetHerselfHimself]?\""
 prelude_events.0010.e:0 "[regent.GetFirstNameNoTooltip] pode dizer o que [regent.GetSheHe] quiser."
 prelude_events.0010.t:0 "Notícias de Casa"
 prelude_events.0020.a:0 "\"Você por acaso fala de traição?\""
 prelude_events.0020.b.tt.failure:0 "[faction_member.GetShortUIName] permanece indiferente"
 prelude_events.0020.b.tt.success:0 "[faction_member.GetShortUIName] fica intimidado"
 prelude_events.0020.b:0 "\"Tenho ouvidos em todos os cantos, [faction_member.GetTitledFirstNameNoTooltip].\""
 prelude_events.0020.c:0 "\"Sua lealdade é #EMP inestimável#! para mim.\""
 prelude_events.0020.d:0 "Deixe que falem."
 prelude_events.0020.desc.faction_member:0 "[faction.GetName], liderada [Select_CString( faction_member.IsFemale, 'pela própria', 'pelo próprio' )] [faction_member.GetTitledFirstNameNoTooltip]."
 prelude_events.0020.desc.faction_member_2:0 "[faction.GetName], liderada [Select_CString( faction_member_2.IsFemale, 'pela própria', 'pelo próprio' )] [faction_member_2.GetTitledFirstNameNoTooltip]."
 prelude_events.0020.desc.intro:0 "\"...enquanto o governo [ROOT.Char.GetHerHim] enfraquece, sua cabeça não coroada permanecerá assim.\" [faction_member.GetTitledFirstName] se inclina mais perto d[Select_CString( faction_member_2.IsFemale, 'a', 'o' )] [faction_member_2.GetTitledFirstName]. \"Esta coroação é o lugar perfeito para encontrar nobres dignos que pensem como nós.\"\n\nÉ claro que estou bem ciente das intenções da"
 prelude_events.0020.desc.no_leader:0 "[faction.GetName]."
 prelude_events.0020.desc.outro:0 "Se quiserem me ver sem coroa terão que #EMP cortar minha cabeça#!."
 prelude_events.0020.t:0 "Conspiradores na Corte"
 prelude_events.0030.a:0 "\"Ouvi dizer que os estábulos são excepcionalmente românticos.\""
 prelude_events.0030.b:0 "\"[guest.GetFirstNameNoTooltip], se me permite pedir um favor...\""
 prelude_events.0030.c:0 "$prelude_events.0030.b$"
 prelude_events.0030.d:0 "\"Vejo que eles têm algumas boas [ROOT.Char.Custom('GetExpensiveDrink_Singular')] aqui.\""
 prelude_events.0030.desc.friend:0 "Com um largo sorriso, [guest.GetSheHe] praticamente trota em minha direção. \"Amigo(a)!\" [guest.GetSheHe|U] grita, \"Que bom te ver!\""
 prelude_events.0030.desc.intro:0 "O pátio de [activity.GetCurrentPhase.GetLocation.GetName] brilha com um brilho dourado. Uma brisa balança as folhas enquanto os convidados passeiam sob elas.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]!\" Viro-me para encontrar m[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.GetFirstName] chamando meu nome."
 prelude_events.0030.desc.lover:0 "Belo(a) como sempre, [guest.GetSheHe] vem em minha direção. \"Eu esperava que você estivesse aqui,\" [guest.GetSheHe] sorri de forma convidativa."
 prelude_events.0030.e:0 "Sempre bom ver um rosto familiar."
 prelude_events.0030.t:0 "Bom te Ver"
 prelude_events.0040.a:0 "[guest.GetSheHe|U] não vai falar tanto quando eu terminar."
 prelude_events.0040.b:0 "\"Me inspirei em sua mãe.\""
 prelude_events.0040.c.tt:0 "O [scheme|E] terá uma [success_chance|E] #P aumentada#!"
 prelude_events.0040.c:0 "Vou ouvir tudo que [guest.GetFirstNameNoTooltip] disser aos amigos [guest.GetHerHim] esta noite."
 prelude_events.0040.d:0 "\"Não é o lugar para discutir.\""
 prelude_events.0040.desc:0 "O dia estava bom demais, claro que tinha que ser estragado pela visão d[Select_CString( guest.IsFemale, 'a', 'o' )] [guest.Custom2('InsultAdjective', ROOT.Char)] [guest.GetTitledFirstName], meu rival tão odiado.\n\n\"Oh, [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip],\" [guest.GetSheHe] fingiu não me ver até eu chegar perto demais de [guest.GetHerHim]. \"Vai nos entreter durante o jantar? Ou essas são as roupas que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip] traz para uma coroação?\""
 prelude_events.0040.t:0 "Não Você"
 prelude_events.0050.a:0 "\"Não posso dizer o mesmo.\""
 prelude_events.0050.b:0 "\"Que nós, [ROOT.Char.GetHouse.GetNameNoTooltip], fiquemos juntos.\""
 prelude_events.0050.c:0 "\"E o que acha do noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetLadyLord] anfitri[Select_CString( host.IsFemale, 'ã', 'ão' )] [host.GetFirstNameNoTooltip]?\""
 prelude_events.0050.d:0 "\"Mas olhe só para você! Casad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com [Select_CString( host.IsFemale, 'a própria coroada', 'o próprio coroado' )]!\""
 prelude_events.0050.desc.callous:0 "irritante"
 prelude_events.0050.desc.intro:0 "O pátio está repleto de flores, convidados rindo impacientemente, [ROOT.Char.Custom('GetIncidentalDetail')].\n\n\"[guest.Custom2('RelationToMe', SCOPE.sC('root_scope'))|U]!\" Meu"
 prelude_events.0050.desc.normal:0 "querido(a)"
 prelude_events.0050.desc.outro:0 "[ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.GetFirstName] me chama. \"Todos aqui estão ou conspirando ou bêbados,\" [guest.GetSheHe] sussurra, \"Senti sua falta.\""
 prelude_events.0050.t:0 "Um Rosto Familiar"
 prelude_events.0060.a:0 "\"É alegria! É tudo graças à sua graciosa ajuda.\""
 prelude_events.0060.b:0 "\"Se pudesse poupar alguns artesãos de sua capital...\""
 prelude_events.0060.c.tt.failure:0 "[host.GetShortUIName] acha as exigências absurdas"
 prelude_events.0060.c.tt.success:0 "[host.GetShortUIName] concorda com as exigências"
 prelude_events.0060.c:0 "\"É o ouro que impede nosso crescimento.\""
 prelude_events.0060.d:0 "\"Hoje não é meu dia, [host.GetTitleAsNameNoTooltip].\""
 prelude_events.0060.desc:0 "\"Devo dizer que é impressionante o que você conseguiu realizar apenas com algumas [ROOT.Char.GetCapitalLocation.Custom('TerrainTypeProvince')], [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip].\" [host.GetTitledFirstName] [host.Custom('quirk_pos_present')].\n\n\"Ouvi dizer que [ROOT.Char.GetCapitalLocation.GetNameNoTooltip] floresce sob sua mão orientadora, seu [ROOT.Char.GetCapitalLocation.GetHolding.GetType.GetName|l] bem cuidado e organizado. Mas vejo uma sombra em seu rosto, [ROOT.Char.GetTitleAsNameNoTooltip|l], o que o(a) preocupa?\""
 prelude_events.0060.t:0 "A Bela [province.GetNameNoTooltip]"
 prelude_events.0070.a.flavor:0 "Ou em mim mesmo(a), na verdade."
 prelude_events.0070.a:0 "\"Preciso me concentrar em... meu domínio.\""
 prelude_events.0070.b:0 "\"Será um prazer me juntar a você.\""
 prelude_events.0070.c:0 "\"Não tenho tempo para isso.\""
 prelude_events.0070.desc.diplomacy:0 "\"Ouvi dizer que suas habilidades na arte da diplomacia não têm igual."
 prelude_events.0070.desc.friend:0 "\"Você sabe que nossa amizade é preciosa para mim, e que não desejo nada mais do que ouvir seus conselhos. Peço a você, sente-se ao meu lado."
 prelude_events.0070.desc.intrigue:0 "\"Dizem que nenhum amante está seguro, nenhum pecador livre, nenhum segredo verdadeiramente velado, enquanto você estiver por perto."
 prelude_events.0070.desc.intro:0 "Um pequeno [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] se esconde entre os pés dos convidados e faz alguns deles rirem, incluindo meu suserano e razão de estarmos reunidos aqui, [host.GetTitledFirstName].\n\n\"[ROOT.Char.GetLadyLord|U] [ROOT.Char.GetFirstNameNoTooltip],\" [host.GetSheHe] chama meu nome, ainda sorrindo."
 prelude_events.0070.desc.learning:0 "\"Meus cortesãos dizem que não há texto antigo que você não possa ler, nem autor famoso que não consiga decifrar."
 prelude_events.0070.desc.martial:0 "\"Fui informado de que seus brilhantes estratagemas vencem o dia mesmo nas situações mais difíceis."
 prelude_events.0070.desc.outro:0 "Não preciso de nada mais do que um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetWomanMan] capaz em meu conselho.\""
 prelude_events.0070.desc.stewardship:0 "\"Notei que você governa seu domínio com grande eficiência, a inconfundível mão de um administrador."
 prelude_events.0070.t:0 "Uma Oferta na Corte"
 prelude_events.0080.a:0 "\"Eu sei exatamente o que [courtier.GetSheHe] deve fazer.\""
 prelude_events.0080.aa:0 "\"Você acha que não reconheço um espião?\""
 prelude_events.0080.b:0 "\"[courtier.GetFirstNameNoTooltip] é bem-vind[Select_CString( courtier.IsFemale, 'a', 'o' )] na minha corte.\""
 prelude_events.0080.c:0 "\"Poucos são tão generosos quanto você, [guest.GetTitleAsNameNoTooltip].\""
 prelude_events.0080.desc.fallback:0 "o início de uma amizade entre nossas casas.\""
 prelude_events.0080.desc.friend:0 "um sinal de nossa amizade.\""
 prelude_events.0080.desc.intro:0 "\"Bo[Select_CString( ROOT.Char.IsFemale, 'a', 'm' )] [ROOT.Char.GetTitleAsNameNoTooltip],\" viro-me para encontrar [guest.GetTitledFirstName], ao lado de um[Select_CString( courtier.IsFemale, 'a', '' )] nervos[Select_CString( courtier.IsFemale, 'a', 'o' )] [courtier.GetWomanMan]. \"Você sabe que o estimo muito e que me traria grande alegria ajudá-lo.\"\n\n\"Aqui lhe ofereço [Select_CString( courtier.IsFemale, 'a primeira e melhor de minhas', 'o primeiro e melhor de meus' )] [courtier.GetWomenMen], [courtier.GetFirstName], m[Select_CString( courtier.IsFemale, 'inha', 'eu' )] bem realizad[Select_CString( courtier.IsFemale, 'a', 'o' )] [guest.Custom2('RelationToMe', SCOPE.sC('courtier'))]. Que isto sirva como"
 prelude_events.0080.desc.same_house:0 "um sinal de amizade em nossa casa.\""
 prelude_events.0080.t:0 "Receba o Meu Melhor"
 prelude_events.0090.a:0 "\"Você pode levá-los de volta para [guest.GetCapitalLocation.GetNameNoTooltip].\""
 prelude_events.0090.aa:0 "\"M[Select_CString( guest.IsFemale, 'inha', 'eu' )] [guest.Custom('SisterBrother')]! Vamos celebrar juntos!\""
 prelude_events.0090.b:0 "\"Um presente #EMP magnífico#!.\""
 prelude_events.0090.c:0 "\"Por favor, fique com eles! Sua presença já é presente suficiente.\""
 prelude_events.0090.desc.bad_opinion:0 "Est[Select_CString( guest.IsFemale, 'a', 'e' )] [guest.Custom('InsultAdjective')] [guest.Custom('InsultNoun')] de alguma forma conseguiu chegar à minha coroação. Mal consigo conter uma careta quando [guest.GetSheHe] se aproxima de mim."
 prelude_events.0090.desc.blood_brother:0 "Um[Select_CString( guest.IsFemale, 'a', '' )] amig[Select_CString( guest.IsFemale, 'a', 'o' )] como nunca tive, mal consigo conter um sorriso quando [guest.GetSheHe] abre os braços."
 prelude_events.0090.desc.fallback:0 "M[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.GetTitledFirstName] se aproxima de mim com um largo sorriso."
 prelude_events.0090.desc.intro:0 "\"Calma aí!\" Ouço a voz de um[Select_CString( guest.IsFemale, 'a', '' )] [guest.GetWomanMan] e me viro para encontrar [guest.GetTitledFirstName] batendo de leve no lado de seu cavalo.\n\n"
 prelude_events.0090.desc.outro:0 "\n\n\"O que me diz?\" [guest.GetSheHe] aponta para um rebanho logo atrás de [guest.GetHerHim]. \"Um presente adequado, não acha?\""
 prelude_events.0090.t:0 "Digno de um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 prelude_events.0100.a:0 "\"Prometo que não esquecerei disso.\""
 prelude_events.0100.b:0 "\"Faça seu domínio prosperar, [vassal.GetTitledFirstNameNoTooltip].\""
 prelude_events.0100.c:0 "\"Talvez eu devesse focar em estudar as técnicas...\""
 prelude_events.0100.desc:0 "\"Que tipo de [ROOT.Char.GetTitleAsNameNoTooltip] deixaria os domínios de seus vassalos definhar e apodrecer? As pessoas comentam, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord],\" m[Select_CString( vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('vassal'))] [vassal.GetTitledFirstName] me adverte seriamente, [vassal.Custom('quirk_pos_pp')].\n\n\"Peço que olhe para dentro e lembre-se de que o prestígio de um reino é o prestígio de seus domínios.\""
 prelude_events.0100.t:0 "Construções Promissoras"
 prelude_events.0110.a:0 "\"Falarei a língua de seu coração.\""
 prelude_events.0110.b:0 "Todos devem conhecer meu amor pelos(as) [guest_culture.GetCollectiveNounNoTooltip]."
 prelude_events.0110.c:0 "A coroação exige um foco diferente."
 prelude_events.0110.desc:0 "Percebo [guest.GetTitledFirstName] lançando olhares furtivos em minha direção. [guest.GetSheHe|U] [guest.Custom('quirk_pos_present')] e finalmente se aproxima de mim. Com uma reverência respeitosa, [guest.GetSheHe] começa:\n\n\"Querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip], nós [guest_culture.GetCollectiveNounNoTooltip] desejamos apoiá-lo agora e nos dias que virão. A coroa em breve repousará sobre sua cabeça, mas nossos costumes repousarão em seu coração?\""
 prelude_events.0110.t:0 "Inaudito"
 prelude_events.0120.a:0 "\"Meu amor vale apenas isso?\""
 prelude_events.0120.aa:0 "\"Devo retribuir o gesto.\""
 prelude_events.0120.b:0 "\"Obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] por sua generosidade, [guest.GetTitleAsNameNoTooltip].\""
 prelude_events.0120.c:0 "Que todos vejam seu brilho!"
 prelude_events.0120.desc:0 "\"Deve não ser fácil,\" diz [guest.GetTitledFirstName], [guest.Custom('quirk_pos_pp')]. \"Só posso imaginar o peso que a coroa em breve terá sobre sua cabeça.\"\n\n\"Mas não tema. Seus leais vassalos estarão ao seu lado, agora e sempre. Aqui, aceite isto.\" [guest.GetSheHe|U] faz um gesto a um(a) de seus(suas) servos(as), que então se curva para apresentar um presente bem embrulhado. \"[guest_artifact.GetName],\" explica [guest.GetFirstNameNoTooltip]. \"Serviu-me bem.\""
 prelude_events.0120.t:0 "Lembre-se de Seus Amigos"
 prelude_events.0130.a.tt:0 "[my_artifact.GetName]:\n$BULLET_WITH_TAB$Recebe [piety|E]#positive_value +10%#! [piety|E] mensal\n$BULLET_WITH_TAB$Recebe #positive_value +10#! de [opinion|E] do [clergy|E]"
 prelude_events.0130.a:0 "Que [coronator.GetFaith.HighGodName] o(a) proteja."
 prelude_events.0130.b.tt:0 "[my_artifact.GetName]:\n$BULLET_WITH_TAB$Recebe [prestige|E]#positive_value +8%#! [prestige|E] mensal"
 prelude_events.0130.b:0 "Que sirva como lembrança da coroação."
 prelude_events.0130.c:0 "\"Meus convidados adorariam vê-lo(a).\""
 prelude_events.0130.desc:0 "\"Que [coronator.GetFaith.HighGodName] derrame bênçãos sobre você neste dia afortunado, [ROOT.Char.GetTitledFirstNameNoTooltip].\" [coronator.GetTitledFirstName] inclina sua cabeça, [coronator.Custom('quirk_pos_pp')].\n\n\"Gostaria de comemorar a ocasião com uma bênção sobre seu(sua) mais querido(a) [my_artifact.GetName].\""
 prelude_events.0130.t:0 "Graça Sobre Seus Pertences"
 prelude_events.0140.a:0 "#EMP Não diga nada.#!"
 prelude_events.0140.b.offer_support_tt:0 "Devido a sua [intent|E] #high $coronation_offer_support$#!, a [coronation_magnificence|E] da [GetActivityType('activity_coronation').GetName] #P aumenta notavelmente#!"
 prelude_events.0140.b:0 "\"Seremos chamados de afortunados por termos estado aqui!\""
 prelude_events.0140.c:0 "\"Que [host.GetSheHe] reine por muito tempo!\""
 prelude_events.0140.desc:0 "[host.GetTitledFirstName] tira um momento para observar a multidão, [host.Custom('quirk_pos_pp')]. As vozes dos cortesãos se tornaram tão constantes quanto o canto dos pássaros, e não tenho dúvida de que [guest.GetTitledFirstName] pretende se juntar a eles.\n\n\"B[Select_CString( ROOT.Char.IsFemale, 'oa', 'om' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\" diz [guest.GetSheHe|U], aproximando-se de mim. \"Posso ser tão ousado(a) a ponto de perguntar quais são seus pensamentos sobre a celebração? Não tenho dúvida de que o reinado d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessiveNoTooltip] será de amor e justiça.\""
 prelude_events.0140.t:0 "Em Sua Gloriosa Luz"
 prelude_events.0150.a:0 "[guest.GetSheHe|U] parece muito educad[Select_CString( guest.IsFemale, 'a', 'o' )]."
 prelude_events.0150.aa:0 "\"Será um prazer acompanhar [guest.GetHerHim] pelos arredores.\""
 prelude_events.0150.b:0 "Eu estaria mais interessad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em conversar com [host.GetTitledFirstNameNoTooltip]."
 prelude_events.0150.c:0 "\"Sou amig[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de #EMP todos#!, [host.GetTitledFirstNameNoTooltip].\""
 prelude_events.0150.desc:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip],\" [host.GetTitledFirstName] me chama com um grande sorriso. Ao lado [host.GetHerHim] está outro convidado, um[Select_CString( guest.IsFemale, 'a', '' )] [guest.GetTitleAsNameNoTooltip|l] que não conheço.\n\n\"Est[Select_CString( guest.IsFemale, 'a', 'e' )] é [guest.GetTitledFirstName],\" [host.GetTitledFirstNameNoTooltip] apresenta [guest.GetHerHim]. \"Acredito que vocês dois encontrariam muito em comum. [guest.Custom('MatchingConversationSubject_alone')|U], talvez.\""
 prelude_events.0150.t:0 "Você Conhece [guest.GetHerHim|U]?"
 prelude_events.0160.a:0 "\"O prazer não pode ser correspondido.\""
 prelude_events.0160.aa:0 "\"[ROOT.Char.GetDynasty.GetNameNoTooltip] prevalecerá!\""
 prelude_events.0160.b:0 "\"Que o mundo saiba que estamos aqui!\""
 prelude_events.0160.c:0 "Devemos permanecer humildes."
 prelude_events.0160.desc:0 "\"[guest.GetHouse.GetMotto],\" diz uma voz familiar. Eu me viro e encontro m[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('guest'))] [guest.GetTitledFirstName] chamando minha atenção.\n\n\"[ROOT.Char.GetFirstNameNoTooltip],\" [guest.GetSheHe] me cumprimenta, [guest.Custom('quirk_pos_pp')]. \"É um prazer distinto encontrar outro(a) [ROOT.Char.GetDynasty.GetName] em tais ocasiões. Parece que se passou uma vida desde nosso último encontro.\""
 prelude_events.0160.t:0 "[ROOT.Char.GetDynasty.GetNameNoTooltip] na Multidão"
 prelude_events.0170.a.crit_success:0 "[host.GetShortUIName] fica impressionado"
 prelude_events.0170.a.failure:0 "Você se envergonha"
 prelude_events.0170.a.success:0 "O público fica impressionado"
 prelude_events.0170.a:0 "Um debate teológico não faria mal algum."
 prelude_events.0170.aa.failure:0 "[guest.GetShortUIName] se sente insultado"
 prelude_events.0170.aa.success:0 "[guest.GetShortUIName] compreende a glória de [ROOT.Char.GetFaith.HighGodName]"
 prelude_events.0170.aa:0 "\"Divagações! Ouçam agora sobre [ROOT.Char.GetFaith.HighGodName].\""
 prelude_events.0170.b:0 "\"Fale mais.\""
 prelude_events.0170.c.bad:0 "Mande o tagarela entediar um apoiador ignorante."
 prelude_events.0170.c.bad_flavor:0 "Os discursos de [guest.GetFirstNamePossessiveNoTooltip] irão enfurecer aquele tolo sem instrução [supporter.GetName]!"
 prelude_events.0170.c.disrupt_loyalists_tt:0 "Devido a sua [intent|E] #high $coronation_disrupt_loyalists$#!, a [coronation_magnificence|E] da [GetActivityType('activity_coronation').GetName] é #N reduzida#!"
 prelude_events.0170.c:0 "Uma coroação não é lugar para discutir esses assuntos."
 prelude_events.0170.desc:0 "Enquanto a luz do dia se apaga, vejo [Select_CString( guest.IsFemale, 'a', 'o' )] [guest.GetTitledFirstName] olhando em minha direção. Com um aceno de reconhecimento, [guest.GetSheHe] sorri e se aproxima.\n\n\"Um belo dia foi este, não diria, [ROOT.Char.GetFirstNameNoTooltip]? Devemos certamente agradecer a [guest.GetFaith.HighGodName] por estas bênçãos. Nós, [guest.GetFaith.GetAdherentNamePluralNoTooltip], reverenciamos os ensinamentos [guest.GetFaith.HighGodHerHim].\" [guest.GetSheHe|U] declara com orgulho, respirando fundo antes de continuar sua dissertação teológica."
 prelude_events.0170.t:0 "A Voz de [guest.GetFaith.GetNameNoTooltip]"
 prelude_events.0180.a.impress_attendees_tt:0 "Devido a sua [intent|E] #high $coronation_impress_attendees$#!, a [coronation_magnificence|E] da [GetActivityType('activity_coronation').GetName] #P aumenta muito#!"
 prelude_events.0180.a:0 "[ROOT.Char.GetFaith.HighGodName], não abandone o [host.GetPrimaryTitle.GetNameNoTierNoTooltip]."
 prelude_events.0180.b:0 "[ROOT.Char.GetFaith.WarGodName], derrube o [host.GetTitledFirstNameNoTooltip]!"
 prelude_events.0180.c:0 "Confio-me a [ROOT.Char.GetFaith.HealthGodName]."
 prelude_events.0180.d:0 "[ROOT.Char.GetFaith.WealthGodName] irá me guiar."
 prelude_events.0180.desc.guest:0 "Finalmente consigo deixar os outros convidados para trás e entro no [ROOT.Province.GetCounty.GetFaith.HouseOfWorship], em busca de um momento de silêncio.\n\n"
 prelude_events.0180.desc.host:0 "Deixo meus convidados para trás e entro no [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.HouseOfWorship], em busca de um momento de silêncio antes que o peso da coroa recaia sobre mim.\n\n"
 prelude_events.0180.desc.outro:0 "O altar de [ROOT.Char.GetFaith.HighGodName] brilha suavemente, iluminado por uma dúzia de velas. Um silêncio perfumado preenche as frias paredes. À minha direita, um mural de [ROOT.Char.GetFaith.WealthGodName] me lança um olhar severo. À esquerda, a tintura que outrora foi [ROOT.Char.GetFaith.HealthGodName] desbota lentamente, o sorriso [ROOT.Char.GetFaith.HealthGodHerHim] quase imperceptível."
 prelude_events.0180.t:0 "Um Momento de Silêncio"
 prelude_events.0190.a:0 "\"Isto é mais do que eu poderia pedir.\""
 prelude_events.0190.b:0 "\"[councillor.GetFirstNameNoTooltip]... obrigad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\""
 prelude_events.0190.c:0 "Sinto-me mais calm[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] agora."
 prelude_events.0190.desc.intro:0 "As chamas da lareira dançam em algo que se assemelha a uma [ROOT.Char.Custom('GetMedievalDance')]. A porta dos meus aposentos se abre abruptamente e ouço uma voz familiar chamando meu nome.\n\n"
 prelude_events.0190.desc.other:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip],\" m[Select_CString( councillor.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('councillor'))] [councillor.GetFirstName] começa."
 prelude_events.0190.desc.outro:0 "\"Eu sei que o dia está próximo em que você olhará para seu reflexo no frio metal e se perguntará se está fazendo a coisa certa. Que fique registrado, que seja gritado de cada canto desta fortaleza, eu estarei ao seu lado.\"\n\n[councillor.GetSheHe|U] retira um pequeno presente de sua bolsa. \"Mandei fazer isto para você.\""
 prelude_events.0190.desc.spouse:0 "\"Querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('WifeHusband')],\" a voz de [councillor.GetFirstNamePossessive] é suave e calma."
 prelude_events.0190.t:0 "Palavras de Incentivo"
 prelude_events_0130_cynical_tt:0 "Devido ao seu [trait|E] #high [GetTrait('cynical').GetName( GetNullCharacter )]#! a [coronation_magnificence|E] da [GetActivityType('activity_coronation').GetName] #P aumenta muito#!"
 rival_coronation_dynasty_insult:0 "[CHARACTER.GetShortUIName|U] insultou [TARGET_CHARACTER.GetShortUIName] em uma coroação chamando [TARGET_CHARACTER.GetHerHim] de desonra para sua dinastia."
 rival_coronation_dynasty_insult_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] insultou [CHARACTER.GetShortUIName] em uma coroação chamando [CHARACTER.GetHerHim] de desonra para sua dinastia."
 rival_rejected_courtier_paranoid:0 "[CHARACTER.GetShortUIName|U] rejeitou o cortesão de [TARGET_CHARACTER.GetShortUINamePossessive] e o acusou de ser um espião."
 rival_rejected_courtier_paranoid_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] rejeitou o cortesão de [CHARACTER.GetShortUINamePossessive] e o acusou de ser um espião."
 silent_coronation_modifier:0 "Coroação Silenciosa"
 silent_coronation_modifier_desc:0 "Este personagem deixa que seus atos falem por si mesmos."
 supporter_hook:0 "Apoiador"
