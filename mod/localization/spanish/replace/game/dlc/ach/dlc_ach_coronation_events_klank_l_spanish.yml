l_spanish:
 ach_enlightened_centrist:0 "Sempre um Caminho Intermediário"
 ach_enlightened_centrist_desc:0 "Este personagem tenta encontrar um meio-termo, mesmo que desagrade as pessoas ao redor."
 ach_no_reforms_modifier:0 "Um Grande Reino"
 ach_no_reforms_modifier_desc:0 "O vasto reino deste personagem é considerado perfeito como está, sem necessidade de reformas. O governante pode simplesmente relaxar e desfrutar de sua magnificência."
 ach_realm_autonomy_county_lvl_1:0 "Reforma de Descentralização: Alvo"
 ach_realm_autonomy_county_lvl_1_desc:0 "Este condado é alvo da reforma de descentralização de seu soberano. Recursos que normalmente fluiriam para a capital agora são compartilhados com seus vassalos."
 ach_realm_autonomy_county_lvl_2:0 "$ach_realm_autonomy_county_lvl_1$"
 ach_realm_autonomy_county_lvl_2_desc:0 "$ach_realm_autonomy_county_lvl_1_desc$"
 ach_realm_autonomy_liege_lvl_1:0 "Reforma de Descentralização: Grande Arquiteto"
 ach_realm_autonomy_liege_lvl_1_desc:0 "Este personagem tem uma grande visão para o futuro do reino, onde cada canto é tão esplêndido quanto a capital. Suas habilidades em Administração e Diplomacia decidirão o resultado da reforma."
 ach_realm_autonomy_liege_lvl_2:0 "$ach_realm_autonomy_liege_lvl_1$"
 ach_realm_autonomy_liege_lvl_2_desc:0 "$ach_realm_autonomy_liege_lvl_1_desc$"
 ach_realm_autonomy_vassal_lvl_1:0 "Reforma de Descentralização: Beneficiário"
 ach_realm_autonomy_vassal_lvl_1_desc:0 "Este vassalo é um sujeito na reforma de descentralização de seu soberano."
 ach_realm_autonomy_vassal_lvl_2:0 "$ach_realm_autonomy_vassal_lvl_1$"
 ach_realm_autonomy_vassal_lvl_2_desc:0 "$ach_realm_autonomy_vassal_lvl_1_desc$"
 ach_realm_centralization_county_lvl_1:0 "Reforma de Centralização: Fonte de Recursos"
 ach_realm_centralization_county_lvl_1_desc:0 "Este condado está suportando o fardo da reforma de centralização de seu soberano. Recursos normalmente usados para o desenvolvimento local agora fluem para a capital."
 ach_realm_centralization_county_lvl_2:0 "$ach_realm_autonomy_county_lvl_1$"
 ach_realm_centralization_county_lvl_2_desc:0 "$ach_realm_autonomy_county_lvl_1_desc$"
 ach_realm_centralization_liege_lvl_1:0 "Reforma de Centralização: Grande Arquiteto"
 ach_realm_centralization_liege_lvl_1_desc:0 "Este personagem tem uma grande visão para o futuro do reino, não importando o custo ou a opinião dos vassalos que suportam o fardo. Suas habilidades em Administração e Aprendizado decidirão o resultado da reforma."
 ach_realm_centralization_liege_lvl_2:0 "$ach_realm_autonomy_liege_lvl_1$"
 ach_realm_centralization_liege_lvl_2_desc:0 "$ach_realm_autonomy_liege_lvl_1_desc$"
 ach_realm_centralization_vassal_lvl_1:0 "Reforma de Centralização: Suportando o Fardo"
 ach_realm_centralization_vassal_lvl_1_desc:0 "Este vassalo é um sujeito na reforma de centralização de seu soberano."
 ach_realm_centralization_vassal_lvl_2:0 "$ach_realm_autonomy_vassal_lvl_1$"
 ach_realm_centralization_vassal_lvl_2_desc:0 "$ach_realm_autonomy_vassal_lvl_1_desc$"
 coronation_events_klank.1001.a:0 "Vocês dois! Ajoelhem-se diante [Select_CString( ROOT.Char.IsFemale, 'da sua', 'do seu' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 coronation_events_klank.1001.b:0 "Esses estrangeiros não merecem minha atenção."
 coronation_events_klank.1001.desc:0 "Canalhas, vagabundos, demônios, todos eles... circulando como abutres, esperando o momento de arrancar sua libra de carne. Mas não escapam do meu olhar atento.\n\nLá estão eles. [Select_CString( first_culture_char.IsFemale, 'minha enganosa', 'Meu enganoso' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_culture_char'))] [first_culture_char.GetFullName], vestido com as mais finas roupas [first_culture_char.GetCulture.GetName], e [Select_CString( second_culture_char.IsFemale, 'minha ardilosa', 'meu ardiloso' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_culture_char'))] [second_culture_char.GetFullName], em trajes igualmente impressionantes [second_culture_char.GetCulture.GetName]. Uma conversão ociosa ou um complô em andamento?\n\nAo menos sua aparência colorida enriquece o dia, como um bando de pássaros travessos."
 coronation_events_klank.1001.t:0 "Uma Multidão Suspeitosamente Cultivada"
 coronation_events_klank.1002.a:0 "Acene para eles em sinal de reconhecimento."
 coronation_events_klank.1002.b:0 "Cumprimente cordialmente os dignitários."
 coronation_events_klank.1002.desc:0 "[ROOT.Char.GetPrimaryTitle.GetName] é vasto e transborda com súditos leais de todos os tipos. Nem todos são tão leais, é claro, mas o suficiente para garantir estabilidade por anos.\n\nLá estão eles, em profunda conversa: certamente falando da benevolência do meu governo, da prosperidade do meu reino. M[Select_CString( first_culture_char.IsFemale, 'inha', 'eu' )] leal [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('first_culture_char'))] [first_culture_char.GetFullName], vestido com as melhores roupas [first_culture_char.GetCulture.GetName], e m[Select_CString( second_culture_char.IsFemale, 'inha', 'eu' )] confiável [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('second_culture_char'))] [second_culture_char.GetFullName], em trajes igualmente impressionantes [second_culture_char.GetCulture.GetName].\n\nSua aparência colorida enriquece o dia, como um bando de belos pássaros."
 coronation_events_klank.1002.t:0 "Uma Multidão Maravilhosamente Cultivada"
 coronation_events_klank.1003.a:0 "Como um bom [ROOT.Char.GetFaith.GetAdherentNameNoTooltip], eu te perdoo."
 coronation_events_klank.1003.b:0 "O medo corre profundo em nosso sangue."
 coronation_events_klank.1003.c:0 "Este é o início de uma tradição maravilhosa. Guardas!"
 coronation_events_klank.1003.desc:0 "Ah, m[Select_CString( child_of_executee.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child_of_executee'))], [child_of_executee.GetName]... não é a primeira vez que um [child_of_executee.GetHouse.GetName] se encontra diante de um [ROOT.Char.GetHouse.GetName], incerto sobre seu destino.\n\n[Select_CString( executed_previous_holder.IsFemale, 'A', 'O' )] [executed_previous_holder.GetTitleAsNameNoTooltip] anterior do [child_of_executee.GetPrimaryTitle.GetNameNoTier], [executed_previous_holder.GetFirstName], [executed_previous_holder.GetDeathReason]. A razão exata da execução foi selada na sepultura [executed_previous_holder.GetHerHim] desde a morte [Select_CString( executor_ancestor.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('executor_ancestor'))]. Por anos, em vez do lema #weak [child_of_executee.GetHouse.GetMotto]#!, a Casa [child_of_executee.GetHouse.GetNameNoTooltip] tinha vergonha e raiva escritas em sangue em seus estandartes.\n\nA presença d[Select_CString( child_of_executee.IsFemale, 'a', 'o' )] [child_of_executee.GetFirstNamePossessiveNoTooltip] aqui hoje pode ser vista como um ato humilde de submissão, ou um gesto de desafio."
 coronation_events_klank.1003.t:0 "Novos Amanheceres, Velhas Masmorras"
 coronation_events_klank.1004.a:0 "Todos estarão abaixo de mim."
 coronation_events_klank.1004.a_tt:0 "#weak Ganhos de [prestige|E] e [legitimacy|E] aumentam com o número de [kings|E] e [emperors|E] [Concept('independent', 'Independentes')|E] presentes na sua [coronation|E]#!"
 coronation_events_klank.1004.b:0 "Fico feliz por todos estarem aqui."
 coronation_events_klank.1004.c:0 "Serei melhor do que eles."
 coronation_events_klank.1004.d:0 "Sejam bem-vindos, meus colegas!"
 coronation_events_klank.1004.desc.empower_loyalists_intent:0 "\n\nDe fato, não poderia ter desejado melhores testemunhas para minha coroação. Preciso simplesmente falar com aqueles cujos corações estão quentes pelo meu, e estabelecer relações duradouras entre nossas cortes."
 coronation_events_klank.1004.desc.extoll_reign_intent:0 "\n\nEles ficarão maravilhosos durante minha coroação, posicionados atrás, testemunhas da #EMP minha#! ascensão. Pois há muitas coroas adornadas na boa Terra de [ROOT.Char.GetFaith.HighGodNamePossessive], mas haverá apenas um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] verdadeir[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]."
 coronation_events_klank.1004.desc.fifth_king:0 "[first_king.GetTitledFirstNameRegnal], [second_king.GetTitledFirstNameRegnal], [third_king.GetTitledFirstNameRegnal], [fourth_king.GetTitledFirstNameRegnal], e [fifth_king.GetTitledFirstNameRegnal]."
 coronation_events_klank.1004.desc.fourth_king:0 "[first_king.GetName], [second_king.GetName], [third_king.GetName], e [fourth_king.GetName]."
 coronation_events_klank.1004.desc.intro:0 "É um prazer extraordinário ver meus colegas governantes:"
 coronation_events_klank.1004.desc.intro_many_kings:0 "Minha coroação é realmente o evento do ano, da década! É um prazer extraordinário ver meus muitos colegas governantes, entre eles:"
 coronation_events_klank.1004.desc.other_intent:0 "\n\nDe fato, não poderia ter desejado melhores testemunhas para minha coroação. A soma compartilhada de nossa riqueza, poder e esplendor é incomparável."
 coronation_events_klank.1004.desc.outro:0 "\n\nA presença desses soberanos é tanto uma bênção quanto uma oportunidade. Minha dignidade régia será demonstrada desde o primeiro dia do meu governo até o último."
 coronation_events_klank.1004.desc.second_king:0 "[first_king.GetName] e [second_king.GetName]."
 coronation_events_klank.1004.desc.third_king:0 "[first_king.GetName], [second_king.GetName], e [third_king.GetName]."
 coronation_events_klank.1004.t:0 "Uma Multidão Coroada"
 coronation_events_klank.1005.a:0 "Ouça os contos de desgraça [friendly_king.GetHerHim]."
 coronation_events_klank.1005.b:0 "A justiça não é sua para reivindicar."
 coronation_events_klank.1005.c.tooltip:0 "#high Você#! e [friendly_king.GetShortUIName] podem chamar um ao outro para qualquer [war|E] contra [unfriendly_king.GetShortUIName] por #high 6 anos#!"
 coronation_events_klank.1005.c.vengeful:0 "Ninguém poderia entendê-lo melhor. A vingança será nossa!"
 coronation_events_klank.1005.c:0 "Juntos ensinaremos a [unfriendly_king.GetSheHe] uma lição inesquecível."
 coronation_events_klank.1005.d:0 "Fico feliz que você tenha ouvido d[Select_CString( npc_guest.IsFemale, 'a', 'o' )] [npc_guest.GetFirstNamePossessiveNoTooltip]. #EMP A. Semana. Inteira.#!"
 coronation_events_klank.1005.desc:0 "[friendly_king.GetName] vem gritando no ouvido de [npc_guest.GetNamePossessive] há algum tempo.\n\n“E eu vos digo, não há ninguém mais vil do que [unfriendly_king.GetName]! [war_memory.GetDescription], apenas porque [unfriendly_king.GetSheHe] vendeu os filhos [unfriendly_king.GetHerHim] e o futuro d[Select_CString( unfriendly_king.IsFemale, 'a', 'o' )] [unfriendly_king.GetPrimaryTitle.GetName] para o [friendly_king.GetFaith.DevilName]! Mas eu tenho um plano! Só preciso de uma espada adequada, e de um aliado, ou dois, ou três, e trarei vingança contra [unfriendly_king.GetSheHe]!”\n\nCertamente não é a primeira vez que [friendly_king.GetFirstNamePossessiveNoTooltip] fala sobre as injustiças contra [friendly_king.GetSheHe]. Mas hoje... pode ser a última."
 coronation_events_klank.1005.flavor:0 "Embainhe sua espada, [friendly_king.GetTitledFirstNameNoTooltip], não lhe servirá de nada. Pois seu coração está pesado, e sua mente, turva."
 coronation_events_klank.1005.other_player_informed_tt:0 "[unfriendly_king.GetTitledFirstName] será informado sobre este desfecho"
 coronation_events_klank.1005.t:0 "Histórias de Guerras Perdidas"
 coronation_events_klank.1006.a:0 "Interessante."
 coronation_events_klank.1006.desc:0 "É um prazer informar que durante a coroação [coronation_host.GetHerHim], o ilustre [coronation_host.GetName] persuadiu [friendly_king.GetName] a abandonar sua malfadada busca por vingança, após sua justa vitória em [war_memory.GetName]."
 coronation_events_klank.1006.t:0 "[npc_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
 coronation_events_klank.1007.a:0 "Preocupante."
 coronation_events_klank.1007.desc:0 "Lamento informar que durante a [coronation_activity.GetName] de [coronation_host.GetName], [coronation_host.GetSheHe] e [friendly_king.GetName] fizeram um pacto para unir suas forças contra você, servindo à malfadada busca por vingança d[Select_CString( friendly_king.IsFemale, 'a', 'o' )] [friendly_king.GetTitledFirstNamePossessiveNoTooltip] após sua justa vitória em [war_memory.GetName]."
 coronation_events_klank.1007.t:0 "[npc_guest.Custom2('AppropriateGreeting', ROOT.Char)]"
 coronation_events_klank.1008.a:0 "Fico muito satisfeito em vê-lo aqui."
 coronation_events_klank.1008.b:0 "$coronation_events_klank.1008.a$"
 coronation_events_klank.1008.c:0 "Bem-vindo, m[Select_CString( dynasty_king.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))]."
 coronation_events_klank.1008.d:0 "$coronation_events_klank.1008.c$"
 coronation_events_klank.1008.desc.friendly:0 "M[Select_CString( dynasty_king.IsFemale, 'inha', 'eu' )] grande [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] [dynasty_king.GetTitledFirstName] deixou seu agradável assento em [dynasty_king.GetPrimaryTitle.GetName] para celebrar minha coroação. Sua presença aqui é sinal de apoio, confiança e de um vínculo compartilhado pelo sangue."
 coronation_events_klank.1008.desc.hostile:0 "M[Select_CString( dynasty_king.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('InsultAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] [dynasty_king.GetTitledFirstName] deslizou de seu abominável covil em [dynasty_king.GetPrimaryTitle.GetName], seguramente para arruinar minha coroação. Sua presença aqui é uma visão deplorável. Pois não há ser humano mais distante de minha majestade. Além do sangue, nada nos une."
 coronation_events_klank.1008.desc.neutral:0 "M[Select_CString( dynasty_king.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('dynasty_king'))] [dynasty_king.GetTitledFirstName] viajou do [dynasty_king.GetPrimaryTitle.GetName] para testemunhar minha coroação."
 coronation_events_klank.1008.desc.outro:0 "\n\n#EMP \"[ROOT.Char.GetHouse.GetMotto]\"#!, essas palavras guiaram [ROOT.Char.GetDynasty.GetName] através das gerações. Nossos ancestrais as carregaram através do bom e do ruim. Juntos ou sozinhos, cabe a mim e [Select_CString( dynasty_king.IsFemale, 'a', 'o' )] [dynasty_king.GetTitledFirstName] levá-las adiante."
 coronation_events_klank.1008.e:0 "Você testemunhará a ascensão de um verdadeiro [ROOT.Char.GetDynasty.GetNameNoTooltip]."
 coronation_events_klank.1008.f:0 "Ajoelhe-se! Ou haverá um[Select_CString( dynasty_king.IsFemale, 'a', '' )] [dynasty_king.GetTitleAsNameNoTooltip] [ROOT.Char.GetDynasty.GetNameNoTooltip] a menos."
 coronation_events_klank.1008.g:0 "Eu sou o verdadeiro [ROOT.Char.GetDynasty.GetNameNoTooltip]."
 coronation_events_klank.1008.t:0 "Um[Select_CString( dynasty_king.IsFemale, 'a', '' )] [dynasty_king.GetTitleAsNameNoTooltip] dos [ROOT.Char.GetDynasty.GetNameNoTooltip]"
 coronation_events_klank.1009.a:0 "[char_struggle.GetNameNoTooltip] pode esperar. Esta noite, aproveite minha coroação."
 coronation_events_klank.1009.b:0 "Silêncio, detrator."
 coronation_events_klank.1009.c:0 "Em tempos de [char_struggle.GetCurrentPhase.GetNameNoTooltip], apoiamos [host.GetTitledFirstNameNoTooltip]."
 coronation_events_klank.1009.d:0 "[host.GetTitledFirstNameNoTooltip] é frac[Select_CString( host.IsFemale, 'a', 'o' )] demais para tempos de [char_struggle.GetCurrentPhase.GetNameNoTooltip]."
 coronation_events_klank.1009.desc:0 "[left_struggle.GetName] e [right_struggle.GetName] estão envolvidos em um acalorado debate há dias. Os tempos são difíceis: todo o reino, toda a região envolta em décadas de conflito.\n\n\"[first_struggle_faith.GetAdherentNamePlural] aguardam apenas uma oportunidade para atacar [right_struggle.GetFaith.GetAdherentNamePlural], enquanto os [first_struggle_culture.GetCollectiveNoun] permanecem inertes! [host.GetTitledFirstName] não pode, de maneira alguma, navegar por este labirinto!\"\n\n[right_struggle.GetTitledFirstName] pausa para respirar enquanto [left_struggle.GetTitledFirstName] reúne pensamentos para uma réplica. É o momento perfeito para eu intervir."
 coronation_events_klank.1009.e:0 "Vocês estão ambos errados."
 coronation_events_klank.1009.t:0 "Em Tempos de Conflito"
 coronation_events_klank.1010.a:0 "\"Abandone suas falsas convicções.\""
 coronation_events_klank.1010.b.catalyst_concession:0 "Você ativará um [struggle_catalyst|E] em direção a [struggle_persia_phase_concession|E]"
 coronation_events_klank.1010.b.catalyst_stabilization:0 "Você ativará um [struggle_catalyst|E] em direção a [struggle_persia_phase_stabilisation|E]"
 coronation_events_klank.1010.b.catalyst_unrest:0 "Você ativará um [struggle_catalyst|E] em direção a [struggle_persia_phase_unrest|E]"
 coronation_events_klank.1010.b:0 "\"Saiba que [persian_struggle.GetCurrentPhase.GetName] é antitético à [ROOT.Char.GetHouse.GetName].\""
 coronation_events_klank.1010.c:0 "\"Reconheça a Concessão como o único caminho viável.\""
 coronation_events_klank.1010.d:0 "\"Ajoelhe-se perante o verdadeiro Califa!\""
 coronation_events_klank.1010.desc.intro_caliph:0 "Que dia maravilhoso na gloriosa [location.GetName], com a coroação d[Select_CString( caliph.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('ComplimentAdjective')] [caliph.GetNamePossessive] tão próxima. [ROOT.Char.GetPrimaryTitle.GetName|U] poderia realmente florescer se cada [ROOT.Char.GetFaith.GetAdherentName] reconhecesse a sabedoria e a piedade d[Select_CString( caliph.IsFemale, 'a', 'o' )] [caliph.GetTitleAsNameNoTooltip], assim como eu.\n\n"
 coronation_events_klank.1010.desc.intro_detractor:0 "Que dia maravilhoso na gloriosa [location.GetName], longe [Select_CString( caliph.IsFemale, 'da', 'do' )] [caliph.Custom('InsultAdjective')] [caliph.GetName]. [ROOT.Char.GetPrimaryTitle.GetNameNoTier|U] poderia realmente florescer se não fosse por aquel[Select_CString( caliph.IsFemale, 'a', 'e' )] [caliph.Custom('InsultAdjective')] [caliph.Custom('InsultNoun'].\n\n"
 coronation_events_klank.1010.desc.intro_supporter:0 "Que dia maravilhoso na gloriosa [location.GetName], abençoado por [ROOT.Char.GetFaith.HighGodName], abençoado pelo [ROOT.Char.Custom('ComplimentAdjective')] [caliph.GetName]. [ROOT.Char.GetPrimaryTitle.GetNameNoTier] poderia realmente florescer se cada [ROOT.Char.GetFaith.GetAdherentName] reconhecesse a sabedoria e a piedade d[Select_CString( caliph.IsFemale, 'a', 'o' )] [caliph.GetTitleAsNameNoTooltip], assim como eu.\n\n"
 coronation_events_klank.1010.desc.mid_detractor:0 "Um dos apoiadores [caliph.GetHerHim] infiltrou-se nesta coroação e divaga incoerentemente sobre a traição de [struggle_participant.GetFaith.DevilName], o futuro da Pérsia, a sabedoria de [struggle_participant.GetFaith.HighGodName] e o cheiro dos pés d[Select_CString( caliph.IsFemale, 'a', 'o' )] [caliph.GetTitleAsNamePossessiveNoTooltip]."
 coronation_events_klank.1010.desc.mid_supporter:0 "Um dos detratores [caliph.GetHerHim] infiltrou-se nesta coroação e divaga incoerentemente sobre a traição de [struggle_participant.GetFaith.DevilName], o futuro da Pérsia, a sabedoria de [struggle_participant.GetFaith.HighGodName] e o aroma encantador dos pés d[Select_CString( caliph.IsFemale, 'a', 'o' )] [caliph.GetTitleAsNamePossessiveNoTooltip]."
 coronation_events_klank.1010.e:0 "\"Vá embora e reclame lá fora!\""
 coronation_events_klank.1010.outro:0 "Bem, é hora de colocar [struggle_participant.GetSheHe] no lugar.\n\n\"\"Paz esteja contigo, [struggle_participant.GetTitledFirstNameNoTooltip], [ROOT.Char.Custom2('NegativeSupplimentaryGreeting', struggle_participant)|l]. A visão do seu rosto me causa dor, [ROOT.Char.Custom2('NegativeSupplimentaryGreeting', struggle_participant)|l]. Você deve...\"\""
 coronation_events_klank.1010.t:0 "O Destino da Pérsia"
 coronation_events_klank.1011.a.county_modifier:0 "Cada [county|E] em seu [domain|E] recebe um [modifier|E] [GetModifier('ach_realm_centralization_county_lvl_1').GetNameWithTooltip] por 10 anos."
 coronation_events_klank.1011.a.custom_tooltip:0 "@alert_icon! Você iniciará um processo de centralização. Após #V 10#! anos, você colherá os benefícios:\n$EFFECT_LIST_BULLET$Aumento de [development_i][development|E] em seu [domain|E]\n$EFFECT_LIST_BULLET$Diminuição de [development_i][development|E] no [domain|E] do [vassal|E].\n$EFFECT_LIST_BULLET$A mudança depende de suas [skills|E] em [stewardship_i][stewardship|E] e [learning_i][learning|E]."
 coronation_events_klank.1011.a:0 "Eu sou o [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip]."
 coronation_events_klank.1011.b.county_modifier:0 "Cada [county|E] em seu [domain|E] recebe um [modifier|E] [GetModifier('ach_realm_autonomy_county_lvl_1').GetNameWithTooltip] por 10 anos."
 coronation_events_klank.1011.b.custom_tooltip:0 "@alert_icon! Você iniciará um processo de descentralização e aumento de autonomia. Após #V 10#! anos, você poderá colher os benefícios:\n$EFFECT_LIST_BULLET$Aumento de [development_i][development|E] nos [domains|E] de vassalos.\n$EFFECT_LIST_BULLET$A mudança depende de suas habilidades em [stewardship_i][stewardship|E] e [diplomacy_i][diplomacy|E]."
 coronation_events_klank.1011.b:0 "Sem vassalos fortes, eu não sou nada."
 coronation_events_klank.1011.c:0 "Meu reino está bem como está."
 coronation_events_klank.1011.desc:0 "As terras sob meu governo são quase infinitas, e assim também são minhas ambições. Meus vassalos mais poderosos estão aqui: [first_char.GetTitledFirstName], [second_char.GetTitledFirstName] e [third_char.GetTitledFirstName], todos prontos para se ajoelhar diante de mim, todos aguardando minha visão para nosso futuro. Meu reinado moldará todo o [ROOT.Char.GetPrimaryTitle.GetNameNoTier] por décadas, por gerações. O momento perfeito para anunciar uma grande ambição soberana é agora.\n\nEmbora impopular, centralizar o reino poderia colocar uma espada poderosa em minha mão, e ouro em meu bolso. Mas meus vassalos, dados autonomia e recursos, poderiam ser um escudo robusto e me proteger de ameaças..."
 coronation_events_klank.1011.t:0 "A Vastidão do [ROOT.Char.GetPrimaryTitle.GetName]"
 coronation_events_klank.1012.a:0 "Sou o servo mais humilde d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive]."
 coronation_events_klank.1012.b.desc:0 "Seu [domain|E] não terá seu [development|E] reduzido em 10 anos."
 coronation_events_klank.1012.b:0 "[ROOT.Char.GetPrimaryTitle.GetNameNoTooltip] pode sobreviver sem as ideias d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessiveNoTooltip]."
 coronation_events_klank.1012.desc:0 "Durante a coroação [host.GetHerHim], [host.GetName] anunciou um plano grandioso e ambicioso para fortalecer o reino ao focar no núcleo de [host.GetPrimaryTitle.GetName], que por acaso é o domínio pessoal [Select_CString( host.IsFemale, 'da', 'do' )] [host.GetTitledFirstName]. Os recursos necessários devem vir de algum lugar, já que nada é realmente abundante neste mundo além da graça de [ROOT.Char.GetFaith.HighGodName]. Assim, isso vem às custas da periferia, como o meu próprio domínio!\n\nViver em um grande reino, sob um poderoso [host.GetTitleAsNameNoTooltip], tem suas vantagens — mas e se esse poder fosse mal utilizado no futuro, usado contra mim? Um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetPrimaryTitle.GetNameNoTier] forte é motivo de orgulho... e, talvez, de preocupação."
 coronation_events_klank.1012.t:0 "Grande Plano de Centralização d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive]"
 coronation_events_klank.1012.ten_year_plan:0 "Após 10 anos, o [development|E] de seus e dos [domains|E] de seus [vassals|E] será reduzido, enquanto seu [liege|E] se beneficiará. A mudança real depende das habilidades em [stewardship|E] e [learning|E] do seu [liege|E]."
 coronation_events_klank.1013.a:0 "$coronation_events_klank.1012.a$"
 coronation_events_klank.1013.b.desc:0 "Seu [domain|E] não terá seu [development|E] aumentado em 10 anos."
 coronation_events_klank.1013.b:0 "$coronation_events_klank.1012.b$"
 coronation_events_klank.1013.desc:0 "Durante a coroação [host.GetHerHim], [host.GetName] anunciou um plano grandioso e ambicioso para fortalecer o reino ao focar na periferia de [host.GetPrimaryTitle.GetName], que inclui o meu próprio domínio. Os recursos necessários devem vir de algum lugar, já que nada é realmente abundante neste mundo além da graça de [ROOT.Char.GetFaith.HighGodName]. O [host.GetTitleAsNameNoTooltip] ofereceu generosamente compartilhar a riqueza de seu domínio com todo o reino."
 coronation_events_klank.1013.t:0 "Grande Plano de Descentralização d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive]"
 coronation_events_klank.1013.ten_year_plan:0 "Após 10 anos, o [development|E] de seus e dos [domains|E] de seus [vassals|E] será aumentado. A mudança real depende das habilidades em [stewardship|E] e [diplomacy|E] do seu [liege|E]."
 coronation_events_klank.1014.a:0 "Maravilhoso!"
 coronation_events_klank.1014.b.county_effect:0 "Cada [county|E] em seu [domain|E] recebe um [modifier|E] [GetModifier('ach_realm_centralization_county_lvl_2').GetNameWithTooltip] por 10 anos."
 coronation_events_klank.1014.b:0 "Isto não é o fim."
 coronation_events_klank.1014.county_effect:0 "Cada [county|E] em seu [domain|E] terá seu [development|E] reduzido em 20%"
 coronation_events_klank.1014.desc:0 "Há dez anos, na minha coroação, tracei um curso para o [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Através de dor e dificuldades, a riqueza fluiu diretamente para meu domínio, enquanto meus vassalos sofreram. Mas valeu a pena.\n\nAgora chegou a hora de colher os frutos da minha administração e da perspicácia com que realizei minha grande visão."
 coronation_events_klank.1014.development_gain:0 "Sua reforma retirou, ao todo, #P [ROOT.Char.MakeScope.Var('development_lost').GetValue]#! de [development|E] dos [domains|E] de seu [vassal|E]. Suas [skills|E] de [stewardship|E] e [learning|E] permitem que você distribua #P [ROOT.Char.MakeScope.Var('development_gain_percent').GetValue]%#! disso em seu [domain|E]."
 coronation_events_klank.1014.t:0 "Centralização do [ROOT.Char.GetPrimaryTitle.GetName]: Conclusão"
 coronation_events_klank.1015.a:0 "$coronation_events_klank.1014.a$"
 coronation_events_klank.1015.b.county_effect:0 "Cada [county|E] em seu [domain|E] recebe um [modifier|E] [GetModifier('ach_realm_autonomy_county_lvl_2').GetNameWithTooltip] por 10 anos."
 coronation_events_klank.1015.b:0 "$coronation_events_klank.1014.b$"
 coronation_events_klank.1015.county_effect:0 "Cada [county|E] em seu [domain|E] terá seu [development|E] aumentado em #P [ROOT.Char.MakeScope.Var('development_gain_percent').GetValue]%#!, devido às suas [skills|E] de [stewardship|E] e [diplomacy|E]."
 coronation_events_klank.1015.desc:0 "Há dez anos, na minha coroação, tracei um curso para o [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. Meus vassalos prosperaram graças às minhas sábias políticas, enquanto meu próprio domínio ficou subdesenvolvido. Mas valeu a pena.\n\nAgora chegou a hora de colher os frutos da minha administração, da minha perspicácia e da diplomacia hábil que realizou minha grande visão."
 coronation_events_klank.1015.t:0 "Descentralização do [ROOT.Char.GetPrimaryTitle.GetName]: Conclusão"
 coronation_events_klank.1016.a:0 "\"Desde a mais tenra idade, um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip] indigno.\""
 coronation_events_klank.1016.b:0 "\"Desde a mais tenra idade, um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip] digno.\""
 coronation_events_klank.1016.c:0 "Na verdade, falarei apenas sobre mim."
 coronation_events_klank.1016.d:0 "Contarei exatamente como aconteceu."
 coronation_events_klank.1016.desc.detractor:0 "Pois é claro que [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName] estava destinado a tudo, menos a um trono. Ai de todos os futuros súditos [host.GetHerHim]."
 coronation_events_klank.1016.desc.supporter:0 "Pois é claro que [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstName] sempre esteve destinado à grandeza, e que um dia testemunharíamos a ascensão [host.GetHerHim] ao trono."
 coronation_events_klank.1016.desc:0 "[teller.GetName] termina a peculiar história [teller.GetHerHim] sobre um [supporter.Custom('GetRandomRegionalBird')] brincando com um [supporter.Custom('RandomWeirdObject')] sobre um [supporter.Custom('RegionalFarmAnimal')] morto. [listener.GetName] parece apenas levemente entretido.\n\nÉ a minha vez de contar uma história. E tenho algo perfeito. Contarei quando [memory.GetDescription], quando nosso gracioso anfitrião ainda era apenas uma criança."
 coronation_events_klank.1016.t:0 "[Select_CString( host.IsFemale, 'A', 'O' )] [host.Custom('GirlBoy')|U] Que Se Tornou [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip]"
