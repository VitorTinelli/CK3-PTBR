 coronation_events.6150.desc:0 "\"Ó [ROOT.Char.Custom('FormalComplimentAdjective')] [ROOT.Char.GetTitleAsName], teu é o rosto a ser contemplado, tua é a voz destes rituais sagrados!\" elogia [Select_CString( advisor.IsFemale, 'a', 'o' )] [advisor.GetTitledFirstName], meu [advisor.GetCouncilTitle]. \"Grandes soberanos e muitos [ROOT.Char.Custom('GetLowOfficialPlural')] vieram considerar teu reinado... e onde se colocarão diante [Select_CString( ROOT.Char.IsFemale, 'da nova', 'do novo' )] [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive].\"\n\n\"Enquanto te ocupas com palavras formais e assuntos oficiais... #EMP eu#! estou livre para atuar em cantos discretos e impressionar tua vontade sobre aqueles como... [neighbor.GetName], talvez?\""
