l_spanish:
 ABHISHEKA_GLOSS:0 "Uma antiga cerimônia dhármica na qual reis ou anciãos são aspergidos com águas coletadas dos rios sagrados e dos quatro cantos das costas da Índia. O ritual está associado à ascensão real."
 ARMILLS_GLOSS:0 "Um par de braceletes cerimoniais finamente trabalhados, a serem usados nos braços de um prelado ou monarca. #G Armills#! seriam decorados com cenas como a Ressurreição e a Crucificação de Cristo."
 CHLAMYS_GLOSS:0 "Uma túnica volumosa de seda usada por oficiais bizantinos, símbolo de poder secular sobre o estado imperial. Presa por um broche fibula, a #G chlamys#! possuía painéis grandes cravejados de gemas chamados #EMP tablia#!, reservados aos imperadores quando feitos em ouro."
 CORONATION_ANOINTMENT_GUEST_AUTHORITY_DOESNT_EXIST:0 "Você não tem [head_of_faith|E] ou clérigo [head_of_rite|E] para convidar"
 CORONATION_CROWN_GLOSS:0 "As coroas usadas na cerimônia de coroação eram, em alguns casos, de uso cotidiano. #G Coroa de Coroação#! também poderiam ser relíquias empoeiradas, apresentadas apenas para esta ocasião singular."
 CORONATION_RELIGIOUS_AUTHORITY_DOESNT_EXIST:0 "Sua [rite|E] não tem nem [head_of_faith|E] nem clérigo [head_of_rite|E]"
 GLOBUS_CRUCIGER_GLOSS:0 "Uma 'orb com cruz', tipicamente de metal precioso. É segurada na mão como parte da regália real, e simboliza o domínio do Salvador sobre todo o mundo."
 HOF_DOESNT_EXIST:0 "Sua [faith|E] não possui [head_of_faith|E]"
 KURULTAI_GLOSS:0 "Um conselho de senhores dos cavalos, reunidos para eleger seu novo governante em meio a banquetes, competições de luta e arco e flecha. Frequentemente, grandes campanhas militares eram planejadas nessas ocasiões."
 PALLIUM_GLOSS:0 "O imponente manto de um monarca, uma vestimenta semelhante ao #G loros#! imperial grego e aos #G pallia#! usados por oficiais da igreja."
 RAJASUYA_GLOSS:0 "Uma série de rituais comumente praticados para inaugurar monarcas de fé Dhármica. O #G Rajasuya#! inclui elementos como aspersão com águas sagradas, receber uma reverência com três flechas, pisar sobre pele de tigre e um jogo de dados."
 THREE_SACRED_TREASURES_GLOSS:0 "A regalia imperial do Japão, dita ter sido trazida à Terra pelo mítico conquistador do Japão, o ancestral divino de seus imperadores. Esses tesouros representam as três virtudes principais: #EMP Ame-no-Murakumo-no-Tsurugi#! — a 'Espada Celestial das Nuvens Aglomeradas' — simboliza a coragem; o espelho de bronze #EMP Yata no Kagami#! reflete a sabedoria; e a jóia em forma de lágrima #EMP Yasakani no Magatama#! idealiza a benevolência."
 ach_yearly_crown_desc:0 "Apressadamente encomendada por [owner.GetName] para uso na [owner.Custom('GetTitleTierAdjective')] coroação [owner.GetHerHim], esta coroa cerimonial possui simbologia distintiva [owner.GetCulture.GetName] — típica dos artesãos de [owner.GetCapitalLocation.GetName] — em meio a suas joias modestas."
 ach_yearly_crown_name:0 "Coroa Regnal d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetFirstNamePossessiveNoTooltipRegnal]"
 ach_yearly_regalia_desc:0 "Adquirida pelo [owner.Custom('GetTitleTierAdjective')] lar pouco antes da coroação de [owner.GetNamePossessive], esta regália invoca fidelidade [owner.GetFaith.GetAdjective] a [owner.GetFaith.random_GoodGodNames] e comando régio sobre o povo [owner.GetCulture.GetName] em igual medida."
 ach_yearly_regalia_name:0 "Regália de Coroação d[Select_CString( owner.IsFemale, 'a', 'o' )] [owner.GetFirstNamePossessiveNoTooltipRegnal]"
 admires_regal_kingdoms:0 "Admira Reinos Régios"
 admires_regal_kingdoms_desc:0 "Este governante revira os olhos diante dos ideais da Confederação. Mas esses mesmos olhos se perdem em devaneios ao ouvir falar de pompa e circunstância."
 adventurer_name_free_warriors:0 "Guerreiros Livres de [host.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 adventurer_name_youths:0 "Jovens de [host.GetHouse.GetNameNoTooltip]"
 anointment_available_because_magnificence_tt:0 "#EMP #low Esta opção está disponível por causa da [coronation_magnificence|E] da [anointment|E]"
 best_commander_gains_defender_tt:0 "Seu [commander|E] mais habilidoso ganha #P 3#! [martial_i][martial|E] e [GetTrait('unyielding_defender').GetName( GetNullCharacter )]"
 confederate_king_youth_warrior_tt:0 "[host.GetShortUIName|U] e [warrior_youth.GetShortUIName] tornam-se [allies|E]"
 confederation_alliance:0 "[loyal_vassal.GetShortUIName|U] e [host.GetShortUIName] se tornam [allies|E]"
 confederation_camraderie:0 "Camaradagem entre [confederates|E] companheiros"
 confederation_claim_throne:0 "Você desbloqueia o [scheme|E] [GetScheme('claim_throne').GetTypeName]"
 confederation_elective_claim_throne:0 "[succession|E] para [GetLaw('confederation_elective_succession_law').GetName]: $VALUE|+=0$"
 confederation_elective_extra_vote:0 "Você ganha #P 1#! de [vote_strength|E] para [GetLaw('confederation_elective_succession_law').GetName] por #high 10 anos#!"
 confederation_elective_extra_vote_2:0 "Você ganha #P 2#! de [vote_strength|E] para [GetLaw('confederation_elective_succession_law').GetName] por #high 10 anos#!"
 confederation_harm_candidacy_tt:0 "Difamado durante a [coronation|E]: $VALUE|=+0$"
 confederation_house_promoted_tt:0 "Politicagem da [house|E] durante a [coronation|E]: $VALUE|=+0$"
 confederation_join_war_offer_tt:0 "[loyal_vassal.GetShortUIName|U] se juntará automaticamente às [wars|E] defensivas de [host.GetShortUINamePossessive], enquanto o [host.GetPrimaryTitle.GetNameNoTier] permanecer como [primary_title|E] de [host.GetShortUINamePossessive]"
 confederation_king_accepts_promise_tt:0 "[host.GetTitledFirstName] aceita seu juramento"
 confederation_king_rejects_promise_tt:0 "[host.GetTitledFirstName] rejeita seu juramento"
 confederation_remove_destroy_chance_tt:0 "@alert_icon! #alert_trial [host.GetPrimaryTitle.GetName] não será mais destruído quando seu [holder|E] conquistar outro [kingdom|E]#!"
 confederation_warrior_modifier:0 "Guerreiros da Confederação"
 confederation_warrior_modifier_desc:0 "A hoste deste personagem transborda de defensores exaltados do reino."
 confederation_warrior_modifier_stacking_tt:0 "Este [modifier|E] acumula se for concedido por outros [vassals|E] companheiros durante a [coronation|E]"
 conversion_acceptance_bonus_low_tt:0 "Ganha #P +10#! Aceitação de todas as [interactions|E] para #high $demand_conversion_interaction$#!"
 conversion_acceptance_bonus_tt:0 "Os recipientes ganham #P +25#! Aceitação de [interactions|E] para #high $demand_conversion_interaction$#!"
 coronation_anointed_imperial_modifier:0 "Suprema Unção"
 coronation_anointed_imperial_modifier_desc:0 "Este governante ungido fará questão de que ninguém esqueça que seu reinado foi abençoado e endossado pelo mais alto prelado da fé."
 coronation_anointed_modifier:0 "Alta Unção"
 coronation_anointed_modifier_desc:0 "Este governante ungido valoriza muito seu encargo de liderar os fiéis."
 coronation_artifact_improved:0 "[artifact_target.GetName] será abençoado com um novo [modifier|E]"
 coronation_artifact_unaltered_succession_tt:0 "[crowning_artifact.GetName] não terá sua herança alterada."
 coronation_ceremony_opinion_effect_tt:0 "#weak Mudança de [opinion|E] causada pela [coronation_magnificence|E] da [coronation|E]#!"
 coronation_confederation_de_jure_log:0 "[host.GetShortUIName] e [loyal_vassal.GetShortUIName] fomentaram o reconhecimento [de_jure|E] do [host.GetPrimaryTitle.GetDefinitiveName] em suas terras."
 coronation_confederation_de_jure_log_title:0 "De Jure para a Confederação"
 coronation_confederation_defender_log:0 "[loyal_vassal.GetShortUIName] prometeu a [host.GetShortUIName] ajudar a defender o [host.GetPrimaryTitle.GetDefinitiveName]."
 coronation_confederation_defender_log_title:0 "Defensor Jurado à Confederação"
 coronation_councillor_unity_tooltip:0 "Ganha um [modifier|E] aumentando ligeiramente sua [skill|E] pertinente e [opinion|E] sobre #high você#! por #high 5 anos#!"
 coronation_councillor_unity_tooltip_nomadic:0 "Ganha um [modifier|E] aumentando ligeiramente sua maior [skill|E] e [opinion|E] sobre #high você#! por #high 5 anos#!"
 coronation_crowds_beaten_modifier:0 "Multidões da Coroação Espancadas"
 coronation_crowds_beaten_modifier_desc:0 "Oponentes em massa de um novo senhor foram brutalmente reprimidos."
 coronation_denying_clergy_modifier:0 "Explorando o Clero"
 coronation_denying_clergy_modifier_desc:0 "Em vez de agir como servo da fé, este governante exerce domínio sobre a classe sacerdotal e suas rendas."
 coronation_detractor_pledge_insult_log_title:0 "Oponente Desdenha Juramento ao Novo Suserano"
 coronation_events.6000.a.flavor:0 "Que estes não sejam os anos finais do [host.GetPrimaryTitle.GetNameNoTooltip]! Mas sim seu verdadeiro renascimento!"
 coronation_events.6000.a:0 "\"Eu juro agora — #EMP a Confederação, para sempre!#!\""
 coronation_events.6000.b.flavor:0 "Com as risadas dos guerreiros e os sorrisos das mulheres, minha família iluminará este banquete de Coroação."
 coronation_events.6000.b:0 "\"Venham, família: sejam conhecidos por seus parentes juramentados!\""
 coronation_events.6000.c:0 "Os tempos podem ser estranhos, mas ainda somos um só."
 coronation_events.6000.desc:0 "Lágrimas brilham nos olhos dos meus companheiros chefes tribais — lágrimas de alegria e riso!\n\nEntre nós, está m[Select_CString( host.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('host'))] [host.GetFirstName]: humilde, não erguido acima dos demais como algum imperador frio e estrangeiro. Noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName] brinca com o cavalo d[Select_CString( other_vassal.IsFemale, 'a', 'o' )] [other_vassal.GetFirstNamePossessiveNoTooltip] até que o animal morda [host.GetSheHe] nos dedos, e nós, nobres, caímos livremente em piadas!\n\nPodemos já não nos alinhar como uma verdadeira linha de batalha de iguais, mas... ainda somos o [host.GetPrimaryTitle.GetDefinitiveName], e este dia é nosso."
 coronation_events.6000.t:0 "A Confederação se Reúne"
 coronation_events.6001.a:0 "\"Ouçam bem. Eu construirei nosso futuro.\""
 coronation_events.6001.b:0 "\"Essa irmandade deve viver e viver!\""
 coronation_events.6001.c.flavor:0 "Não quando eu poderia ser [Select_CString( ROOT.Char.IsFemale, 'uma verdadeira', 'um verdadeiro' )] [ROOT.Char.GetTitleAsNameNoTooltip], como os de antigamente..."
 coronation_events.6001.c:0 "E ajudar nossa absurda 'Confederação' a sobreviver...? Não."
 coronation_events.6001.desc:0 "#EMP \"Primeiro entre os chefes tribais! [ROOT.Char.GetTitleAsName] por juramento sagrado e pelo aclamo das tribos!\"#!\n\n[loyal_vassal.GetTitledFirstName] ergue a espada [loyal_vassal.GetHerHim] em minha direção, mão sobre o coração. [loyal_vassal.GetSheHe|U] cessa os gritos e faz uma promessa solene.\n\n\"Não reconhecemos o [old_de_jure.GetBaseName] em [loyal_vassal.GetPrimaryTitle.GetBaseNameNoTier]: nós amamos o [ROOT.Char.GetPrimaryTitle.GetDefinitiveName], e meu povo jura honrá-lo para sempre! #EMP Para sempre!#!\""
 coronation_events.6001.t:0 "Nossas Vozes e as Eras"
 coronation_events.6010.a:0 "#EMP \"Meus guerreiros ainda lutam por todos nós!\"#!"
 coronation_events.6010.b.flavor:0 "...e reivindicá-lo não é grande injustiça."
 coronation_events.6010.b:0 "\"Nosso trono não é coisa sagrada...\""
 coronation_events.6010.c:0 "\"Se #EMP EU#! fosse ouvido, essas humilhações acabariam!\""
 coronation_events.6010.d:0 "Todos deveríamos jurar a vigília dos tempos antigos."
 coronation_events.6010.desc:0 "Um assentamento nos arredores de [location.GetTitle.GetBaseNameNoTier] queima.\n\n\"Saqueadores\", explica um [host.Custom('KnightCultureNoTooltipLowercase')] [host.GetPrimaryTitle.GetAdjective]. \"Proscritos das tribos. [Select_CString( assailer.IsFemale, 'A', 'O' )] [assailer.GetTitleAsName] do [assailer.GetPrimaryTitle.GetNameNoTier] os envia para cá. Paga essa escória para insultar [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName] da nossa Confederação.\"\n\n\"[host.GetTitledFirstNameNoTooltip] toma o trono #EMP sozinho#!\", murmura um chefe tribal. \"Temo que ainda ansiemos pelos tempos em que nossos povos enfrentavam os males juntos...\""
 coronation_events.6010.t:0 "[host.GetSheHe|U] Que Defende"
 coronation_events.6011.a.flavor:0 "Nossa Confederação se abasteceu bem para a guerra... em vez disso, poderíamos abastecer [ROOT.Char.GetFaith.HouseOfWorshipPlural] com oferendas."
 coronation_events.6011.a:0 "\"Deposite suas armas. Tenha fé na paz de [ROOT.Char.GetFaith.HighGodNamePossessive].\""
 coronation_events.6011.b.flavor:0 "Em nossos lares, os jovens inquietos não sonham com guerra e aventura? Vamos uni-los, para que um dia possamos chamá-los à batalha!"
 coronation_events.6011.b:0 "\"Jovens e velhos: que nenhum guerreiro fique ocioso.\""
 coronation_events.6011.c:0 "\"Lute comigo, o mais valente dos [loyal_vassal.GetCulture.GetCollectiveNounNoTooltip]!\""
 coronation_events.6011.d:0 "\"Descanse. Vigiar é o dever [Select_CString( ROOT.Char.IsFemale, 'da sua', 'do seu' )] [ROOT.Char.GetTitleAsNamePossessiveNoTooltip].\""
 coronation_events.6011.d_house:0 "\"[ROOT.Char.GetHouse.GetName|U] defende este reino.\""
 coronation_events.6011.desc:0 "\"[assailer.GetName] traz fogo! Para desprezar sua coroação, nosso vizinho vis fez saqueadores viajarem de longe!\" grita m[Select_CString( loyal_vassal.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('loyal_vassal'))], [loyal_vassal.GetName], que me trouxe a este lugar o insulto d[Select_CString( assailer.IsFemale, 'a', 'o' )] [assailer.GetTitledFirstNamePossessiveNoTooltip].\n\nUm punhado miserável de cabanas fora de [location.GetName] é tudo o que arde, mas ainda assim [loyal_vassal.GetTitledFirstNameNoTooltip] treme de fúria.\n\n\"[ROOT.Char.GetPrimaryTitle.GetDefinitiveName] ainda #EMP significa algo,#!\" jura [loyal_vassal.GetSheHe], \"e ainda estou pronto para defendê-lo! Aceite o juramento do meu guerreiro! A escória [assailer.GetPrimaryTitle.GetAdjective] — e todos os outros — enfrentarão minhas hostes quando escurecerem nossas terras!\""
 coronation_events.6011.t:0 "Uma Causa Comum"
 coronation_events.6020.a:0 "\"Esvazie suas terras em seus exércitos, e ataque!\""
 coronation_events.6020.b:0 "\"Dobre todo o [supporter.GetPrimaryTitle.GetNameNoTierNoTooltip] à derrota de [foe_2.GetTitledFirstNamePossessiveNoTooltip]!\""
 coronation_events.6020.c:0 "\"Destrua [foe.GetTitledFirstNameNoTooltip], com minha permissão.\""
 coronation_events.6020.d:0 "\"[foe_2.GetTitledFirstNameNoTooltip] é [Select_CString( foe_2.IsFemale, 'a sua inimiga', 'o seu inimigo' )]!\""
 coronation_events.6020.desc:0 "\"Como podemos ser esperados a sorrir?\" rosna m[Select_CString( supporter.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('supporter'))], [supporter.GetName]. \"Balançar [ROOT.Char.Custom('RegionalDrink')], louvar a paz, esperar pelo futuro do reino...\"\n\n[supporter.GetSheHe|U] encara um ninho duvidoso de nobres [foe.GetPrimaryTitle.GetAdjective].\n\n\"...enquanto #EMP vermes#! nos olham com malícia e tramam sua queda, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetTitleAsName]!\" [supporter.GetSheHe] cospe. \"Dê-me permissão para soar meu corno de guerra! Eu acabarei com [foe.GetName], não tenha dúvida!\""
 coronation_events.6020.e:0 "\"Ora, ora. Tal paixão pertence à minha mesa de banquete.\""
 coronation_events.6020.t:0 "Um Cão de Guerra para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 coronation_events.6030.a:0 "Aquel[Select_CString( fearsome_courtesan.IsFemale, 'a', 'e' )] temível [fearsome_courtesan.GetWomanMan]: [fearsome_courtesan.GetSheHe] poderia #EMP me esmagar!#!"
 coronation_events.6030.a_flavor:0 "Ah, morrer sufocad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] nas mãos [fearsome_courtesan.GetHerHim]!"
 coronation_events.6030.a_thighs:0 "Ah, morrer sufocad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] entre as coxas [fearsome_courtesan.GetHerHim]!"
 coronation_events.6030.b:0 "Este aqui é um #EMP garoto safado#!..."
 coronation_events.6030.b_flavor:0 "A boca sorridente [cunning_courtesan.GetHerHim] deve embalar mentiras deliciosas..."
 coronation_events.6030.b_minx:0 "Ora, esta é uma #EMP raposa esperta#!..."
 coronation_events.6030.c:0 "Um homem mais velho e inteligente, com mãos como couro..."
 coronation_events.6030.c_dame:0 "Uma velha dama sábia, astuta e severa..."
 coronation_events.6030.c_flavor:0 "Alguém para dizer #EMP a mim#! o que fazer, por uma vez... um[Select_CString( experienced_courtesan.IsFemale, 'a', '' )] [experienced_courtesan.GetWomanMan] do mundo, para me guiar com um toque experiente."
 coronation_events.6030.d:0 "Dois irmãos encantadores? Ficarei com ambos!"
 coronation_events.6030.d_flavor:0 "Pois... não é [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] generos[Select_CString( host.IsFemale, 'a', 'o' )]?"
 coronation_events.6030.d_sisters:0 "Duas irmãs encantadoras? Ficarei com ambas!"
 coronation_events.6030.desc:0 "\"Ah sim, [ROOT.Char.GetFirstName],\" murmura [host.GetTitledFirstName], astutamente, \"é #EMP bom#! ser [host.GetTitleAsNameNoTooltip]...\"\n\nÀ nossa frente, uma câmara repleta de carne nua. Cortesãs coram de forma convidativa, enquanto [host.GetFirstNameNoTooltip] se volta para mim com um sorriso lascivo. \"Um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip] deve ser generoso. Qualquer um destes [fearsome_courtesan.GetWomenMen], estes celebrantes... pode ser seu. Seu por uma noite, por muitas noites... est[Select_CString( fearsome_courtesan.IsFemale, 'as', 'es' )] [fearsome_courtesan.Custom('GirlBoyPlural')] estão ansiosos para compartilhar seus #EMP talentos#! com você.\""
 coronation_events.6030.e:0 "Talvez, possamos apenas discutir poesia..."
 coronation_events.6030.e_expose:0 "Vileza lasciva! Todos saberão disto!"
 coronation_events.6030.t:0 "Amigos [Select_CString( host.IsFemale, 'da Nova', 'do Novo' )] [host.GetTitleAsNameNoTooltip]"
 coronation_events.6030.t_feast:0 "Amigos d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip]"
 coronation_events.6100.a:0 "A coroa é colocada sobre minha testa."
 coronation_events.6100.a_flavor_adolescent:0 "Eis minha [Glossary( 'coroa de coroação', 'CORONATION_CROWN_GLOSS')]! E — #EMP oh#! — está quase caindo sobre meus olhos..."
 coronation_events.6100.a_flavor_decent:0 "E assim, a [Glossary( 'coroa de coroação', 'CORONATION_CROWN_GLOSS')] [host.GetPrimaryTitle.GetAdjectiveNoTooltip] é posta para repousar."
 coronation_events.6100.a_flavor_giant:0 "Por [host.GetFaith.HighGodName] — [crowner.GetTitledFirstNameNoTooltip] mal consegue encaixar a pequena [Glossary( 'coroa de coroação', 'CORONATION_CROWN_GLOSS')]!"
 coronation_events.6100.a_flavor_low:0 "No meio desta cerimônia miserável, mal consigo apreciar o toque da [Glossary( 'coroa de coroação', 'CORONATION_CROWN_GLOSS')] [host.GetPrimaryTitle.GetAdjectiveNoTooltip]..."
 coronation_events.6100.a_flavor_low_guest:0 "Sobre [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNameNoTooltipRegnal], a [Glossary( 'coroa de coroação', 'CORONATION_CROWN_GLOSS')] [host.GetPrimaryTitle.GetAdjectiveNoTooltip] parece bastante estranha..."
 coronation_events.6100.a_guest:0 "A coroa é colocada sobre a testa [host.GetHerHim]."
 coronation_events.6100.a_guest_low:0 "A coroa é colocada... mas por quanto tempo?"
 coronation_events.6100.desc_byzantine:0 "A púrpura [Glossary( 'chlamys', 'CHLAMYS_GLOSS' )] — à luz de mil velas, resplandecente — é enrolada sobre meus ombros. #EMP \"Glória a Deus nas alturas!\"#! clamam os presentes. #EMP \"E na terra, paz!#!\" O prelado entoa: \"Em nome do Pai, do Cristo [Glossary( 'Pantokrator', 'PANTOKRATOR_GLOSS')], e do Espírito Santo, eu te ordeno, [host.GetFirstNameRegnal], a governar como [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')] dos [Glossary( 'Romaioi', 'ROMAIOS_GLOSS')], e pastor dos fiéis de Deus.\""
 coronation_events.6100.desc_byzantine_femme:0 "A púrpura [Glossary( 'chlamys', 'CHLAMYS_GLOSS' )] — à luz de mil velas, resplandecente — é enrolada sobre meus ombros. #EMP \"Glória a Deus nas alturas!\"#! clamam os presentes. #EMP \"E na terra, paz!#!\" O prelado entoa: \"Em nome do Pai, do Cristo [Glossary( 'Pantokrator', 'PANTOKRATOR_GLOSS')], e do Espírito Santo, eu te ordeno, [host.GetFirstNameRegnal], a governar como [Glossary( 'Augousta', 'AUGOUSTOS_GLOSS')] dos [Glossary( 'Romaioi', 'ROMAIOS_GLOSS')], e pastora dos fiéis de Deus.\""
 coronation_events.6100.desc_byzantine_femme_guest:0 "A púrpura [Glossary( 'chlamys', 'CHLAMYS_GLOSS' )] — à luz de mil velas, resplandecente — é enrolada sobre os ombros d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveRegnal]. #EMP \"Glória a Deus nas alturas!\"#! clamam os presentes. #EMP \"E na terra, paz!#!\" E o prelado entoa: \"Em nome do Pai, do Cristo [Glossary( 'Pantokrator', 'PANTOKRATOR_GLOSS')], e do Espírito Santo, eu te ordeno, [host.GetFirstNameRegnal], a governar como [Glossary( 'Augousta', 'AUGOUSTOS_GLOSS')] dos [Glossary( 'Romaioi', 'ROMAIOS_GLOSS')], e pastor dos fiéis de Deus.\""
 coronation_events.6100.desc_byzantine_guest:0 "A púrpura [Glossary( 'chlamys', 'CHLAMYS_GLOSS' )] — à luz de mil velas, resplandecente — é enrolada sobre os ombros d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveRegnal]. #EMP \"Glória a Deus nas alturas!\"#! clamam os presentes. #EMP \"E na terra, paz!#!\" O prelado entoa: \"Em nome do Pai, do Cristo [Glossary( 'Pantokrator', 'PANTOKRATOR_GLOSS')], e do Espírito Santo, eu te ordeno, [host.GetFirstNameRegnal], a governar como [Glossary( 'Augoustos', 'AUGOUSTOS_GLOSS')] dos [Glossary( 'Romaioi', 'ROMAIOS_GLOSS')], e pastor dos fiéis de Deus.\""
 coronation_events.6100.desc_christian:0 "A cintilante [host.Custom('GetRegionalSword')] é presa ao meu quadril. O cetro da autoridade soberana — erguido em minha mão. Meus dedos envolvem o [Glossary( 'globus cruciger', 'GLOBUS_CRUCIGER_GLOSS')]; sobre meu corpo vêm os [Glossary( 'armills', 'ARMILLS_GLOSS')] e o [Glossary( 'pallium', 'PALLIUM_GLOSS')]. As orações ecoam em rumble."
 coronation_events.6100.desc_christian_guest:0 "A cintilante [host.Custom('GetRegionalSword')] é presa ao quadril d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessive]. O cetro da autoridade soberana — erguido em sua mão. Os dedos [host.GetHerHim] envolvem o [Glossary( 'globus cruciger', 'GLOBUS_CRUCIGER_GLOSS')]; ao corpo [host.GetHerHim] chegam os [Glossary( 'armills', 'ARMILLS_GLOSS')] e o [Glossary( 'pallium', 'PALLIUM_GLOSS')]. As preces continuam a ressoar."
 coronation_events.6100.desc_ending:0 "\n\nAbençoado pelos tesouros [host.Custom('GetTitleTierAdjective')], ajoelho-me... apenas esta última vez. Pois [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName] do [host.GetPrimaryTitle.GetNameNoTier], [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] que estou prestes a realmente me tornar: [host.GetSheHe] se curva somente a [host.GetFaith.HighGodName]."
 coronation_events.6100.desc_ending_byzantine:0 "\n\nAbençoado pelos antigos tesouros [host.Custom('GetTitleTierAdjective')], ajoelho-me diante d[Select_CString( crowner.IsFemale, 'a', 'o' )] [crowner.GetTitledFirstNameRegnal], e diante de Cristo — pois é pela graça sagrada que eu governo, e pela Sua misericórdia que os [ROOT.Char.GetPrimaryTitle.GetTierAsName] ainda permanecem. E, finalmente..."
 coronation_events.6100.desc_ending_byzantine_cynical:0 "\n\nAbençoado pelos tesouros [host.Custom('GetTitleTierAdjective')], ajoelho-me diante d[Select_CString( crowner.IsFemale, 'a', 'o' )] [crowner.GetTitledFirstNameRegnal]. [crowner.GetSheHe|U] afirma que é pela graça de Cristo que eu governo, que somente a misericórdia de Deus protege os [ROOT.Char.GetPrimaryTitle.GetTierAsName]... mas eu sou o pastor do seu povo. Eu sou [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]. O destino dos [Glossary( 'Romaioi', 'ROMAIOS_GLOSS' )] pertence a mim, somente a mim..."
 coronation_events.6100.desc_ending_byzantine_guest:0 "\n\nAbençoado pelos antigos tesouros [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] ajoelha-se diante d[Select_CString( crowner.IsFemale, 'a', 'o' )] [crowner.GetTitledFirstNameRegnal], e diante de Cristo — pois é pela graça sagrada que [host.GetSheHe] governa, e pela misericórdia divina que os [ROOT.Char.GetPrimaryTitle.GetTierAsName] ainda permanecem. E, finalmente..."
 coronation_events.6100.desc_ending_guest:0 "\n\nAbençoado pelos tesouros [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] ajoelha-se... apenas esta última vez. Pois [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName] do [host.GetPrimaryTitle.GetNameNoTier], [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] que [host.GetSheHe] está prestes a realmente se tornar: [host.GetSheHe] se curva somente a [host.GetFaith.HighGodName]."
 coronation_events.6100.desc_ending_non_abrahamic:0 "\n\nAbençoado pelos tesouros [host.Custom('GetTitleTierAdjective')], ajoelho-me... apenas esta última vez. Pois [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName] do [host.GetPrimaryTitle.GetNameNoTier], [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] que estou prestes a realmente me tornar: [host.GetSheHe] não se curva a ninguém."
 coronation_events.6100.desc_ending_non_abrahamic_guest:0 "\n\nAbençoado pelos tesouros [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] ajoelha-se... apenas esta última vez. Pois [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName] do [host.GetPrimaryTitle.GetNameNoTier], [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] que [host.GetSheHe] está prestes a realmente se tornar: [host.GetSheHe] não se curva a ninguém."
 coronation_events.6100.desc_ending_non_abrahamic_vassal:0 "\n\nAbençoado pelos tesouros [host.Custom('GetTitleTierAdjective')], ajoelho-me. Pois a diadema do meu [host.GetPrimaryTitle.GetTierAsName], símbolo do [host.GetPrimaryTitle.GetNameNoTierNoTooltip], será a partir deste momento sempre... logo acima de mim."
 coronation_events.6100.desc_ending_non_abrahamic_vassal_guest:0 "\n\nAbençoado pelos tesouros [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] ajoelha-se. Pois a diadema de [host.GetPrimaryTitle.GetTierAsName] [host.GetHerHim], símbolo do [host.GetPrimaryTitle.GetNameNoTierNoTooltip], será a partir deste momento sempre... logo acima [host.GetHerHim]."
 coronation_events.6100.desc_ending_vassal:0 "\n\nAbençoado pelos tesouros [host.Custom('GetTitleTierAdjective')], ajoelho-me. Pois [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName] do [host.GetPrimaryTitle.GetNameNoTier], [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] que estou prestes a realmente me tornar: [host.GetSheHe] se curva ao [host.GetLiege.GetPrimaryTitle.GetAdjective] [host.GetLiege.GetTitleAsName], e a [host.GetFaith.HighGodName]."
 coronation_events.6100.desc_ending_vassal_guest:0 "\n\nAbençoado pelos tesouros [host.Custom('GetTitleTierAdjective')], [host.GetFirstNameNoTooltipRegnal] ajoelha-se. Pois [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName] do [host.GetPrimaryTitle.GetNameNoTier], [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] que [host.GetSheHe] está prestes a realmente se tornar: [host.GetSheHe] se curva [Select_CString( host.GetLiege.IsFemale, 'a', 'ao' )] [host.GetLiege.GetPrimaryTitle.GetAdjective] [host.GetLiege.GetTitleAsName], e a [host.GetFaith.HighGodName]."
 coronation_events.6100.desc_generic:0 "A reluzente [host.Custom('GetRegionalSword')] é presa ao meu quadril. As joias rendadas, os mantos pesados são colocados sobre meu corpo. Como um só, a nobreza da [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — os [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] e [host.Custom('KnightCulturePluralNoTooltipLowercase')] da terra — recita as orações finais, e o último: \"#EMP [host.GetFaith.HighGodName], contemplai noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l]!#!"
 coronation_events.6100.desc_generic_guest:0 "A cintilante [host.Custom('GetRegionalSword')] é presa ao quadril d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessive]. As joias rendadas, os pesados mantos são colocados sobre o corpo [host.GetHerHim]. Em uníssono, a nobreza [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [host.GetHerHim] — os [host.Custom('LowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] e [host.Custom('KnightCulturePluralNoTooltipLowercase')] daquela terra — recita as últimas preces, e a última: \"#EMP [host.GetFaith.HighGodName], contempla noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l]!#!\""
 coronation_events.6100.desc_high:0 "A reluzente [host.Custom('GetRegionalSword')] é presa ao meu quadril. As joias esplêndidas, os mantos gloriosos são colocados sobre mim. Como um só, os melhores da [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — os [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] e [host.Custom('KnightCulturePluralNoTooltipLowercase')] da terra — entoam as orações finais, e o último: \"#EMP [host.GetFaith.HighGodName], contemplai [Select_CString( host.IsFemale, 'nossa amada', 'nosso amado' )] [host.GetTitleAsNameNoTooltip|l]!#!"
 coronation_events.6100.desc_high_guest:0 "A cintilante [host.Custom('GetRegionalSword')] é presa ao quadril de [host.GetFirstName]. As belas joias, os mantos gloriosos são colocados sobre [host.GetSheHe]. Em uníssono, o melhor [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [host.GetHerHim] — os [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] e [host.Custom('KnightCulturePluralNoTooltipLowercase')] daquela terra — clamam as últimas preces, e a última: \"#EMP [host.GetFaith.HighGodName], contempla noss[Select_CString( host.IsFemale, 'a', 'o' )] amad[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l]!#!\""
 coronation_events.6100.desc_intro:0 "Avançam os símbolos [host.Custom('GetTitleTierAdjective')]."
 coronation_events.6100.desc_low:0 "A velha [host.Custom('GetRegionalSword')] é presa ao meu quadril. As joias chamativas, os mantos gastos são colocados sobre mim. Até mesmo o host mal-humorado da [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — os [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] e [host.Custom('KnightCulturePluralNoTooltipLowercase')] desta terra miserável, mesmo eles — são movidos a murmurar as orações finais e a dizer o último: \"#EMP [host.GetFaith.HighGodName], contemplai noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l]!#!"
 coronation_events.6100.desc_low_guest:0 "A velha [host.Custom('GetRegionalSword')] é presa ao quadril d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessive]. As joias chamativas, os mantos gastos são colocados sobre [host.GetHerHim]. Mesmo a hostilidade do grupo [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] [host.GetHerHim] — os [host.Custom('LowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] e [host.Custom('KnightCulturePluralNoTooltipLowercase')] daquela terra miserável, até eles — são movidos a murmurar as últimas preces, e a dar a última: \"#EMP [host.GetFaith.HighGodName], contempla noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l]!#!\""
 coronation_events.6100.t:0 "A Coroação d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNameNoTooltipRegnal]"
 coronation_events.6101.a:0 "Que eu possa sentar-me aqui por muitos anos vindouros."
 coronation_events.6101.a_guest:0 "[host.GetSheHe|U] colocou-a. E [host.GetSheHe] a usará."
 coronation_events.6101.a_guest_neg:0 "E assim, vimos um[Select_CString( host.IsFemale, 'a', '' )] [host.GetWomanMan] pervers[Select_CString( host.IsFemale, 'a', 'o' )] amar a sí próprio."
 coronation_events.6101.a_guest_pos:0 "Um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip] legítim[Select_CString( host.IsFemale, 'a', 'o' )]. Viva!"
 coronation_events.6101.a_oh_noes:0 "Creio que já é tarde para voltar atrás..."
 coronation_events.6101.desc_crowning_intro:0 "Alguns chamariam de orgulho sem vergonha para um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsName] levantar uma coroa e colocá-la sobre a própria testa e, ao fazê-lo, proclamar #EMP [host.GetHerselfHimself]#! entre os monarcas escolhidos por [host.GetFaith.HighGodNamePossessive] na terra.\n\n"
 coronation_events.6101.desc_crowning_priests_high:0 "Ainda assim, aqueles poucos [host.GetFaith.PriestNeuterPlural] duvidosos cantam com vigor e olham com admiração enquanto eu começo o rito."
 coronation_events.6101.desc_crowning_priests_high_guest:0 "Ainda assim, aqueles poucos [host.GetFaith.PriestNeuterPlural] duvidosos cantam com vigor, e olham com admiração enquanto [host.Custom('FormalComplimentAdjective')] [host.GetFirstName] começa o rito."
 coronation_events.6101.desc_crowning_priests_iberian:0 "#EMP Hah!#! Nós #EMP Íberos#! não concordamos. Damos nossas humildes palavras a Deus e à #EMP Santíssima Virgen María#!, e então fazemos como queremos!"
 coronation_events.6101.desc_crowning_priests_low:0 "De fato, sob a cobertura da multidão sussurrante, os [host.GetFaith.PriestNeuterPlural] murmuram condenações sombrias."
 coronation_events.6101.desc_crowning_priests_low_guest:0 "De fato, sob a cobertura da multidão sussurrante, ouço os [host.GetFaith.PriestNeuterPlural] murmurarem condenações sombrias."
 coronation_events.6101.desc_crowning_priests_mid:0 "Para [host.GetFaith.NegativeAfterLife] com meus detratores! Não preciso de [host.GetFaith.PriestNeuter]."
 coronation_events.6101.desc_crowning_priests_mid_guest:0 "Ainda assim, os [host.GetFaith.PriestNeuterPlural] parecem dispostos a aceitar este rito. Talvez algum governante nos [host.GetFaith.ReligiousText] tenha feito o mesmo."
 coronation_events.6101.desc_ending:0 "Finalmente, aproximo-me do trono soberano como [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] que sempre fui destinad[Select_CString( host.IsFemale, 'a', 'o' )] a ser."
 coronation_events.6101.desc_ending_guest:0 "[Select_CString( host.IsFemale, 'A', 'O' )] [host.GetTitleAsNameNoTooltip] aproxima-se orgulhosamente de seu trono soberano."
 coronation_events.6101.desc_ending_humble:0 "Com passos lentos e austeros, aproximo-me do trono que me espera. Não é pouca coisa tornar-se um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip|l]."
 coronation_events.6101.desc_ending_humble_guest:0 "Com passos lentos e austeros, [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip] aproxima-se do trono que o espera. A enormidade do que [host.GetSheHe] fez, do que [host.GetSheHe] se tornou, pesa sobre seu rosto."
 coronation_events.6101.desc_no_being_crowned_intro:0 "Um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsName|l], quando [host.GetSheHe] está vestido para a cerimônia e armado com o consentimento do povo [host.GetHerHim]... pode coroar [host.GetHerselfHimself]. Esse é o nosso modo, embora alguns [host.GetFaith.BishopNeuterPlural] invejem este direito [host.Custom('GetTitleTierAdjective')].\n\n"
 coronation_events.6101.desc_words_christian:0 "Segurando o diadema portador da cruz em meus dedos — recitando \"#EMP Senhor Deus, Tu estás acima de todos os reis; a Ti pertence todo reino do céu e da terra#!\" e assim por diante — coroou-me mestre do [host.GetPrimaryTitle.GetNameNoTier].\n\n"
 coronation_events.6101.desc_words_christian_guest:0 "Segurando o diadema portador da cruz nos dedos [host.GetHerHim] — recitando \"#EMP Senhor Deus, Tu estás acima de todos os reis; a Ti pertence todo reino do céu e da terra#!\" e assim por diante — [host.GetFirstNameRegnal] coroa [host.GetHerselfHimself] mestre do [host.GetPrimaryTitle.GetNameNoTier].\n\n"
 coronation_events.6101.desc_words_generic:0 "Segurando a faixa de metal cravejada em meus dedos, dirijo-me a todos os [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Prometo minha vigília, minha justiça, minha força — e coro-me mestre do [host.GetPrimaryTitle.GetNameNoTier]!\n\n"
 coronation_events.6101.desc_words_generic_guest:0 "Segurando a faixa de metal cravejada nos dedos [host.GetHerHim], [host.GetFirstNameRegnal] dirige-se a todos os [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. [host.GetSheHe|U] promete sua vigília, sua justiça, sua força — e se coroa mestre do [host.GetPrimaryTitle.GetNameNoTier]!\n\n"
 coronation_events.6102.a_guest:0 "O rito está concluído. Um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip] foi feit[Select_CString( host.IsFemale, 'a', 'o' )]."
 coronation_events.6102.a_guest_neg:0 "[host.GetSheHe|U] é uma mancha no alto assento [host.GetHerHim]."
 coronation_events.6102.a_guest_pos:0 "Glória ao trono [host.GetPrimaryTitle.GetAdjectiveNoTooltip]!"
 coronation_events.6102.a_host_neg:0 "#EMP Isto#! é como meu reinado começa...?"
 coronation_events.6102.desc_high:0 "Mas... não estou sozinho. Do mais baixo esgoto à torre mais alta, aclamações trovejantes inflamam o ar vazio — como se os gritos de milhares dilacerassem este grande [host.Custom('ResidenceBuilding')], #EMP sacudindo-o até o chão!#!\n\nOcupo o trono não como um[Select_CString( host.IsFemale, 'a', '' )] [host.GetWomanMan], mas como um [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Não como mortal, mas — como meus súditos cantam e entoam — um presente de [host.GetFaith.HighGodName] para o povo [host.GetPrimaryTitle.GetAdjective], um apelo a [host.GetFaith.PositiveAfterLife]!"
 coronation_events.6102.desc_high_east_asian:0 "Sinosas campanas marcam minha histórica passagem. Meus ministros reverentes, dignitários estrangeiros — os poucos agraciados com este momento — prostram-se profundamente. O grande [host.GetTitleAsName] toma o assento de seu governo.\n\n"
 coronation_events.6102.desc_high_east_asian_ending:0 "Em tríades harmoniosas, poderosos éditos ecoam, submissões fervorosas são realizadas, e antigos tesouros sagrados são apresentados diante de mim. O Selo [host.Custom('GetTitleTierAdjective')|U] é meu, e tudo está em ordem em [host.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.6102.desc_high_east_asian_ending_guest:0 "Em tríades harmoniosas, poderosos éditos ecoam, submissões fervorosas são realizadas, e antigos tesouros sagrados são apresentados. O Selo [host.Custom('GetTitleTierAdjective')|U] é recebido, e tudo está em ordem em [host.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.6102.desc_high_east_asian_ending_japan:0 "Em tríades harmoniosas, poderosos éditos ecoam, submissões fervorosas são realizadas, e os [Glossary( 'Três Tesouros Sagrados', 'THREE_SACRED_TREASURES_GLOSS' )] são apresentados diante de mim. O Selo [host.Custom('GetTitleTierAdjective')|U] é meu, e tudo está em ordem em [host.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.6102.desc_high_east_asian_ending_japan_guest:0 "Em tríades harmoniosas, poderosos éditos ecoam, submissões fervorosas são realizadas, e os [Glossary( 'Três Tesouros Sagrados', 'THREE_SACRED_TREASURES_GLOSS' )] são apresentados. O Selo [host.Custom('GetTitleTierAdjective')|U] é recebido, e tudo está em ordem em [host.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.6102.desc_high_east_asian_guest:0 "Sinosas campanas marcam a passagem histórica do [host.GetTitleAsNamePossessiveNoTooltip]. Seus ministros reverentes, dignitários estrangeiros — nós, poucos agraciados com este momento — estamos prostrados profundamente. O grande [host.GetTitleAsNameNoTooltip] toma o assento de seu governo.\n\n"
 coronation_events.6102.desc_high_guest:0 "Mas... [host.GetSheHe] dificilmente realiza o rito sozinho! Do mais baixo esgoto à torre mais alta, aclamações trovejantes inflamam o ar vazio — como se os gritos de milhares pudessem sacudir este [host.Custom('ResidenceBuilding')] até o chão!\n\n[host.GetFirstNameNoTooltipRegnal] ocupa o trono não como um[Select_CString( host.IsFemale, 'a', '' )] [host.GetWomanMan], mas como um [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l]. Não como mortal, mas — enquanto os súditos [host.GetHerHim] cantam e entoam — um presente de [host.GetFaith.HighGodName] para o povo [host.GetPrimaryTitle.GetAdjective]."
 coronation_events.6102.desc_low:0 "A caminhada é longa... e silenciosa. Cada passo ressoa como uma gota em águas infinitamente profundas. [anointer.GetName], com lágrimas nos olhos sacerdotais, inicia uma antiga elegia:\n\n\"#EMP [host.GetFaith.random_GoodGodNames], livrai-nos! Do abismo, do desespero: livrai os filhos do [host.GetPrimaryTitle.GetNameNoTier]! Poupa-nos, ó [host.GetFaith.HighGodName], da desolação de [host.GetFaith.NegativeAfterLife]! Que noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] desafie os males do homem!#!\"\n\nDiante desta assembleia perturbada, tomo meu trono."
 coronation_events.6102.desc_low_east_asian:0 "As luzes se apagam com a minha passagem? O grande salão do trono tornou-se escuro, quase negro. Apenas os rostos abaixados por onde passo brilham, quase branco-ossos, pressionados contra o chão, como se o povo de [host.GetPrimaryTitle.GetNameNoTier] já estivesse morto.\n\n"
 coronation_events.6102.desc_low_east_asian_ending:0 "Éditos ecoam monotonamente, relíquias empoeiradas são apresentadas, mas ao sentar-me no trono [host.Custom('GetTitleTierAdjective')]... meus pensamentos estão distantes e sombrios..."
 coronation_events.6102.desc_low_east_asian_ending_guest:0 "Éditos ecoam monotonamente, relíquias empoeiradas são apresentadas, mas enquanto o [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('host'))] [host.GetTitleAsNameNoTooltip] esparrama-se no trono [host.Custom('GetTitleTierAdjective')]... meus pensamentos estão distantes e sombrios..."
 coronation_events.6102.desc_low_east_asian_ending_japan:0 "Éditos ecoam monotonamente, os [Glossary( 'Três Tesouros Sagrados', 'THREE_SACRED_TREASURES_GLOSS' )] são apresentados, mas ao sentar-me no trono [host.Custom('GetTitleTierAdjective')]... meus pensamentos estão distantes e sombrios..."
 coronation_events.6102.desc_low_east_asian_ending_japan_guest:0 "Éditos ecoam monotonamente, os [Glossary( 'Três Tesouros Sagrados', 'THREE_SACRED_TREASURES_GLOSS' )] são apresentados, mas enquanto o [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('host'))] [host.GetTitleAsNameNoTooltip] esparrama-se no trono [host.Custom('GetTitleTierAdjective')]... meus pensamentos estão distantes e sombrios..."
 coronation_events.6102.desc_low_east_asian_guest:0 "As luzes se apagam com a passagem do [host.GetTitleAsNamePossessiveNoTooltip]? O grande salão do trono tornou-se escuro, quase negro. Apenas os rostos abaixados por onde passa a suja túnica [host.GetHerHim] brilham, quase branco-ossos, pressionados contra o chão como se o povo de [host.GetPrimaryTitle.GetNameNoTier] já estivesse morto.\n\n"
 coronation_events.6102.desc_low_guest:0 "A caminhada é longa... e silenciosa. Cada passo ressoa como uma gota em águas infinitamente profundas. [anointer.GetName], com lágrimas nos olhos sacerdotais, inicia uma elegia:\n\n\"#EMP [host.GetFaith.random_GoodGodNames], livrai-nos! Do abismo, do desespero: livrai os filhos do [host.GetPrimaryTitle.GetNameNoTier]! Poupa-nos, ó [host.GetFaith.HighGodName], da desolação de [host.GetFaith.NegativeAfterLife]! Que noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] desafie os males do homem!#!\"\n\nEnquanto o povo [host.GetPrimaryTitle.GetAdjectiveNoTooltip] teme e lamenta, [host.GetTitledFirstNameNoTooltipRegnal] ocupa o trono."
 coronation_events.6102.desc_mid:0 "As preces de meus lábios se misturam com os cânticos crescentes. Juntos, meus súditos e eu rezamos: \"#EMP [host.GetFaith.random_GoodGodNames], preserve este [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] sob [host.GetFaith.PositiveAfterLife] para sempre, agora e para todo o sempre! Aos séculos dos séculos! Abençoa, ó [host.GetFaith.random_GoodGodNames], a força d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip]!#!\"\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')], [host.Custom('GetLocalCommonerTermPlural')] inclinam-se profundamente. Ocupo meu assento sagrado, o lugar de meu poder. #EMP \"Salve, [host.GetFirstNameNoTooltipRegnal]!\"#! todos exclamam. \"#EMP Pela vontade de [host.GetFaith.HighGodName], noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l]!#!\""
 coronation_events.6102.desc_mid_east_asian:0 "Tudo procede de acordo com as harmoniosas normas da antiga cerimônia; todos os dignitários e ministros jazem prostrados diante de mim; eu tomo o assento do meu governo.\n\n"
 coronation_events.6102.desc_mid_east_asian_ending:0 "Éditos são proclamados, ministros juram seus cargos, e antigos tesouros são revelados, como sempre deve ser. E, enfim, o grande Selo [host.Custom('GetTitleTierAdjective')|U] é meu."
 coronation_events.6102.desc_mid_east_asian_ending_guest:0 "Éditos são proclamados, ministros juram seus cargos, e antigos tesouros são revelados, como sempre deve ser. E, enfim, o grande Selo [host.Custom('GetTitleTierAdjective')|U] é recebido."
 coronation_events.6102.desc_mid_east_asian_ending_japan:0 "Éditos são proclamados, ministros juram seus cargos, e os [Glossary( 'Três Tesouros Sagrados', 'THREE_SACRED_TREASURES_GLOSS' )] são revelados, como sempre deve ser. E, enfim, o grande Selo [host.Custom('GetTitleTierAdjective')|U] é meu."
 coronation_events.6102.desc_mid_east_asian_ending_japan_guest:0 "Éditos são proclamados, ministros juram seus cargos, e os [Glossary( 'Três Tesouros Sagrados', 'THREE_SACRED_TREASURES_GLOSS' )] são revelados, como sempre deve ser. E, enfim, o grande Selo [host.Custom('GetTitleTierAdjective')|U] é recebido."
 coronation_events.6102.desc_mid_east_asian_guest:0 "Tudo procede de acordo com as harmoniosas normas da antiga cerimônia; todos estão prostrados diante do [host.GetTitleAsNameNoTooltip], e [host.GetSheHe] toma o assento de seu governo.\n\n"
 coronation_events.6102.desc_mid_guest:0 "As preces nos lábios [host.GetHerHim] se misturam com os cânticos crescentes. Juntos, [host.GetSheHe] e os súditos [host.GetHerHim] rezam: \"#EMP [host.GetFaith.random_GoodGodNames], preserve este [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] sob [host.GetFaith.PositiveAfterLife] sempre, agora e para todo o sempre! Aos séculos dos séculos! Abençoa, ó [host.GetFaith.random_GoodGodNames], a força d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsName]!#!\"\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')], [host.Custom('GetLocalCommonerTermPlural')] inclinam-se profundamente. [host.GetNameNoTooltipRegnal] ocupa seu assento sagrado, o lugar de seu poder. #EMP \"Salve, [host.GetFirstNameNoTooltipRegnal]!\"#! todos exclamam. \"#EMP Pela vontade de [host.GetFaith.HighGodName], noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l]!#!\""
 coronation_events.6102.t:0 "A Entrogação d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNameNoTooltipRegnal]"
 coronation_events.6102_middle:0 "\n\nAvanço sozinho para este supremo rito, adornado com meus trajes inaugurais."
 coronation_events.6102_middle_guest:0 "\n\nAvança [host.GetFirstName], adornado com os trajes inaugurais [host.GetHerHim]."
 coronation_events.6110.a:0 "#EMP Ó, [crowning_artifact.GetNameNoTooltip] — Ó, glória das glórias!#!"
 coronation_events.6110.b:0 "Dedique o verdadeiramente [ROOT.Char.Custom('GetTitleTierAdjective')] [crowning_artifact_2.GetNameNoTooltip]."
 coronation_events.6110.c:0 "Consagre o nobre [crowning_artifact_3.GetNameNoTooltip]."
 coronation_events.6110.d:0 "[crowning_artifact_4.GetNameNoTooltip] d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]."
 coronation_events.6110.desc:0 "Carregadas com solenidade, as ícones do governo [ROOT.Char.GetPrimaryTitle.GetAdjective] — e"
 coronation_events.6110.desc_2:0 "Que devo portar — estão imersas em bênçãos de oração. Os [ROOT.Char.GetFaith.PriestNeuterPlural] preparam meu traje com gestos rituais e invocações a"
 coronation_events.6110.desc_crown:0 "coroa"
 coronation_events.6110.desc_crowns:0 "coroas"
 coronation_events.6110.desc_generic:0 "[ROOT.Char.GetFaith.KnowledgeGodName]."
 coronation_events.6110.desc_no_old_artifact:0 "\n\nCom esta cerimônia, será que minha amada [crowning_artifact.GetName] será concedida para sempre ao [ROOT.Char.GetPrimaryTitle.GetNameNoTier]?"
 coronation_events.6110.desc_no_old_artifact_plural:0 "\n\nSerá que minha amada [crowning_artifact.GetName] será concedida para sempre ao [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Ou, talvez, [crowning_artifact_2.GetName]...?"
 coronation_events.6110.desc_old_artifact:0 "\n\nSerá que a fina e belíssima [crowning_artifact.GetName] será concedida para sempre ao [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Quando já possuímos um vestuário soberano: [old_title_artifact.GetName]?"
 coronation_events.6110.desc_regalia:0 "regália"
 coronation_events.6110.desc_samuel:0 "o Profeta Samuel."
 coronation_events.6110.desc_st_peter:0 "São Pedro, portador das chaves do reino celestial."
 coronation_events.6110.e:0 "Ao reino: [crowning_artifact_5.GetNameNoTooltip]."
 coronation_events.6110.f:0 "[crowning_artifact.GetNameNoTooltip] pertence à minha Casa."
 coronation_events.6110.f_plural:0 "Estas joias pertencem à minha casa."
 coronation_events.6110.f_replacing:0 "[old_title_artifact.GetNameNoTooltip] ainda serve."
 coronation_events.6110.t:0 "Joias do [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 coronation_events.6110.t_nomad:0 "Joias d[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 coronation_events.6120.a.flavor:0 "Jurando, com ódio absoluto, obliterar hereges e descrentes, agradarei os [host.GetFaith.AltPriestTermPlural]... e iniciarei meu reinado no caminho da justiça!"
 coronation_events.6120.a:0 "#EMP “Serei um martelo contra os infiéis!”#!"
 coronation_events.6120.b.flavor:0 "Tão tênue é a linha entre prometer fidelidade a esses [ROOT.Char.GetFaith.PriestNeuterPlural]... e colocar meu mandato de [ROOT.Char.GetFaith.HighGodName] acima do deles..."
 coronation_events.6120.b:0 "Distorcer a resposta costumeira a meu favor."
 coronation_events.6120.c:0 "“Defenderei os fiéis de [ROOT.Char.GetFaith.HighGodNamePossessive].”"
 coronation_events.6120.c_begrudging:0 "Direi as palavras. Como devo."
 coronation_events.6120.c_christian:0 "“Defenderei a santa igreja de Cristo.”"
 coronation_events.6120.desc:0 "\n\nAgora, o rito da petição dos [host.GetFaith.BishopNeuterPlural]."
 coronation_events.6120.desc_anointment:0 "\n\nAgora, o rito da petição dos [host.GetFaith.BishopNeuterPlural], enquanto [hof.GetTitledFirstNameRegnal] observa atentamente."
 coronation_events.6120.desc_cathedral:0 "O incenso paira no ar, enquanto minha procissão [ROOT.Char.Custom('GetTitleTierAdjective')] avança pela catedral."
 coronation_events.6120.desc_generic_intro:0 "Além dos portões do [host.Custom('ResidenceBuilding')], minha procissão [ROOT.Char.Custom('GetTitleTierAdjective')] segue em direção a um altar sagrado, onde os oficiante aguardam."
 coronation_events.6120.desc_generic_mid:0 "A nobreza se afasta para a entrada dos [host.GetFaith.AltPriestTermPlural], cujas vozes se unem em prece sagrada."
 coronation_events.6120.desc_high_clergy:0 "Sou reverenciado por esses intercessores divinos, e é com deferência devota que eles suplicam:\n\n“Grande [host.GetTitleAsName], você protegerá os fiéis e preservará os direitos dos [host.GetFaith.AltPriestTermPlural] de [ROOT.Char.GetFaith.HighGodNamePossessive]?”"
 coronation_events.6120.desc_high_magnificence:0 "A nobreza, os [host.GetFaith.AltPriestTermPlural], e eu tomamos nossos lugares solenemente, ao som vibrante das preces sagradas que sobem e descem como ondas."
 coronation_events.6120.desc_holy_site:0 "Fragrâncias sagradas flutuam no ar, enquanto minha procissão [ROOT.Char.Custom('GetTitleTierAdjective')] avança para o [ROOT.Char.GetFaith.HouseOfWorship]."
 coronation_events.6120.desc_low_clergy:0 "Sou desprezado por esses pequenos déspotas, que apresentam seu pedido sagrado como um insulto.\n\n“Servo de [ROOT.Char.GetFaith.HighGodName], você se arrepende de seus múltiplos pecados? Promete suas vontades mortais para preservar os amados [host.GetFaith.AltPriestTermPlural] de [ROOT.Char.GetFaith.HighGodNamePossessive]?”"
 coronation_events.6120.desc_low_magnificence:0 "A nobreza e os [host.GetFaith.AltPriestTermPlural] se apertam e disputam lugar. Algumas vozes fracas se esforçam para entoar preces sagradas."
 coronation_events.6120.desc_mid_clergy:0 "Sou uma figura incerta para esses clérigos, que apresentam seu pedido habitual com verdadeiro interesse.\n\n“Você protegerá os fiéis como s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.GetTitleAsName]? Preservará os direitos e privilégios dos [host.GetFaith.AltPriestTermPlural] de [ROOT.Char.GetFaith.HighGodNamePossessive]?”"
 coronation_events.6120.t:0 "O Juramento aos [host.GetFaith.BishopNeuterPlural|U]"
 coronation_events.6121.a.flavor:0 "Sua diatribe alarmista deixará seus opositores sem escolha senão renunciar aos aliados estrangeiros."
 coronation_events.6121.a:0 "“Esses dissidentes são marionetes de potências estrangeiras!”"
 coronation_events.6121.b:0 "Devo elogiar aqueles que são novos a estes costumes."
 coronation_events.6121.b_flavor:0 "Levanto-me e presto homenagem aos senhores minoritários do reino!"
 coronation_events.6121.c:0 "Meus apoiadores estão comigo!"
 coronation_events.6121.d:0 "“Eis, traidores! #EMP Seu poder de [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]!#!”"
 coronation_events.6121.d_flavor:0 "[vassal_2.GetTitledFirstNameNoTooltip] empunha a lâmina [vassal_2.GetHerHim] diante de mim — #EMP Farei com que [vassal_2.GetSheHe] a use!#!"
 coronation_events.6121.desc_byzantine:0 "A nobreza avança para prestar obediência ao seu [Glossary( 'Autokrator', 'AUTOKRATOR_GLOSS')]. Se estivéssemos no campo de batalha, e eles soldados, eu seria levantado sobre um grande escudo polido. Aqui, eles avançam rastejando para beijar meus joelhos."
 coronation_events.6121.desc_generic_intro:0 "Os vassalos do [ROOT.Char.GetPrimaryTitle.GetNameNoTier] vêm prestar sua lealdade. Um a um erguendo mãos abertas, um a um se inclinando para beijar em sinal de fidelidade."
 coronation_events.6121.desc_high_approval:0 "\n\nAinda nem me tornei plenamente [ROOT.Char.GetTitleAsNameNoTooltip], mas há devoção nessas súplicas que comove qualquer coração. As grandes vozes do reino tremem de emoção, e seus rostos brilham com esperança!"
 coronation_events.6121.desc_kurultai:0 "Nenhuma voz solitária proclama primeiro um título de [ROOT.Char.GetTitleAsNamePossessive] ao Céu Azul Eterno! Nenhuma #EMP única#! mão ergue o estandarte de rabo de cavalo! Todos os mestres das tribos, reunidos neste [Glossary( 'curiltai', 'KURULTAI_GLOSS' )], devem assentar para [ROOT.Char.GetSheHe] que conduzirá seus cavalos à guerra."
 coronation_events.6121.desc_low_approval:0 "\n\nMas... meus vassalos negligenciam os gestos de respeito. Alguém sussurra \"#EMP [ROOT.Char.GetFirstNameNicknamed]? [vassal_2.Custom('CulturalCurse')|U]!\"#! e interrompe as palavras corretas. [vassal_1.GetTitledFirstNameNicknamed] lança um olhar venenoso em meus olhos durante seu juramento. [vassal_2.GetTitledFirstNameNicknamed] ousa portar uma arma na minha presença, e mal sussurra."
 coronation_events.6121.desc_mid_approval:0 "\n\nEnquanto se aproximam, reflito... nas respirações que carregam a palavra “[ROOT.Char.GetTitleAsName]” não sinto nem o peso do amor, nem o traço de lealdade..."
 coronation_events.6121.e_high:0 "Submissão total. Uma visão magnífica."
 coronation_events.6121.e_low:0 "Eles me odeiam. Mas não podem me deter."
 coronation_events.6121.e_mid:0 "Estes são meus vassalos, os pilares do meu governo."
 coronation_events.6121.t:0 "Súplica da Nobreza"
 coronation_events.6121.t_kurultai:0 "O Curiltai"
 coronation_events.6121_duel_tt:0 "#V Duelo#! [vassal_2.GetShortUIName]\n@death_icon! #X Este duelo é até a morte!#!\nSua [prowess|E]: [prowess_i]#V [host.GetProwess]#!\n[prowess|E] de [vassal_2.GetFirstName]: [prowess_i]#V [vassal_2.GetProwess]#!"
 coronation_events.6122.a.flavor:0 "Todo esse povo leal merece uma aparição pessoal! E pão [Select_CString( ROOT.Char.IsFemale, 'da sua', 'do seu' )] [ROOT.Char.GetTitleAsNameNoTooltip]!"
 coronation_events.6122.a:0 "Que todos aqui nunca se esqueçam deste dia!"
 coronation_events.6122.b.flavor:0 "Que esta multidão barulhenta, e todos no reino, sejam recebidos com uma bota [host.Custom('GetFighterTermPossessive')]!"
 coronation_events.6122.b:0 "Chega de dissidência. Todos os que se manifestarem devem ser castigados."
 coronation_events.6122.c_high:0 "Como eles #EMP imploram#! pelo meu governo!"
 coronation_events.6122.c_low:0 "Mas eu reino acima de todos eles."
 coronation_events.6122.c_mid:0 "Sinto-me honrado."
 coronation_events.6122.c_v_low:0 "Escória plebeia imunda."
 coronation_events.6122.c_v_low_humble:0 "A situação do povo simples me comove."
 coronation_events.6122.desc_high_approval:0 "Enquanto pronunciam as palavras, outro som chega aos meus ouvidos. Além do [ROOT.Char.GetFaith.HouseOfWorship], as multidões gritam em alegre expectativa. Centenas de pessoas chamam meu nome repetidamente:\n\n\"#EMP [ROOT.Char.GetFirstName]! [ROOT.Char.GetFirstNameNoTooltip]! [ROOT.Char.GetFirstNameNoTooltip] do [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!#!\""
 coronation_events.6122.desc_high_approval_christian:0 "Enquanto pronunciam as palavras costumeiras, outro som chega aos meus ouvidos. Além do [ROOT.Char.GetFaith.HouseOfWorship], as multidões aguardando cantam [Glossary( 'Kýrie, eléison', 'KYRIE_ELEISON_GLOSS' )] em meu favor. Em uma grande e fervente voz, centenas de almas oferecem orações por mim!"
 coronation_events.6122.desc_intro:0 "As figuras mais velhas entre os [location.GetTitle.GetNameNoTierPossessive] [host.Custom('GetLocalCommonerTermPlural')] são os próximos a avançar, dando o assentimento dos comuns. Do meu grande poder e autoridade, o [host.GetFaith.BishopNeuter] adverte esses anciãos curvados e pergunta se me aceitarão como [ROOT.Char.GetTitleAsName] legítim[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\n"
 coronation_events.6122.desc_intro_foreign:0 "As figuras mais velhas entre os [location.GetTitle.GetNameNoTierPossessive] [host.Custom('GetLocalCommonerTermPlural')] são os próximos a avançar, representando meus comuns súditos [host.GetPrimaryTitle.GetAdjective] ausentes. Do meu grande poder e autoridade, o [host.GetFaith.BishopNeuter] adverte esses anciãos curvados e pede seu assentimento simbólico para que eu me torne um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.GetTitleAsName] legítim[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\n"
 coronation_events.6122.desc_low_approval:0 "Eles pronunciam as palavras, trêmulos, sob um rugido crescente. Além do [ROOT.Char.GetFaith.HouseOfWorship], todos os pobres imundos de [location.GetTitle.GetNameNoTier] uivam: um barulho terrível! Algo os perturbou. Uma briga sem sentido, uma rixa local... ou, talvez, [Select_CString( ROOT.Char.IsFemale, 'uma nova', 'um novo' )] [ROOT.Char.GetTitleAsNameNoTooltip] que todos detestam."
 coronation_events.6122.desc_mid_approval:0 "Pronunciam as palavras costumeiras suficientemente bem, e eu prometo minha proteção em troca — pois meu mandato se estende além dos [ROOT.Char.GetFaith.PriestNeuterPlural] e nobres de alta linhagem. E minha casa, em meio a [capital_p.GetTitle.GetNameNoTierPossessive] [capital_p.Custom('TerrainTypeProvince')], é compartilhada com muitos [capital_p.GetCulture.GetName] de baixa linhagem."
 coronation_events.6122.t:0 "Apelo às Massas"
 coronation_events.6123.a:0 "Clamo meu juramento, #EMP em total devoção!#!"
 coronation_events.6123.a_flavor:0 "Levantem suas vozes, meus companheiros! Cantem o nome d[Select_CString( host.IsFemale, 'a', 'o' )] noss[Select_CString( host.IsFemale, 'a', 'o' )] nov[Select_CString( host.IsFemale, 'a', 'o' )] e glorios[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessiveNoTooltip|l]!"
 coronation_events.6123.b:0 "Faço um escândalo do meu desprezo."
 coronation_events.6123.b_flavor:0 "A pequena cerimônia d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveNoTooltip] exige minha submissão? Prefiro chocar seus miseráveis apoiadores e cuspir na face [host.GetHerHim]!"
 coronation_events.6123.c:0 "[host.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] se apresenta [Select_CString( host.IsFemale, 'a', 'ao' )] [host.GetFirstNameNoTooltipRegnal]."
 coronation_events.6123.c_dislikes_disrespect:0 "S[Select_CString( host.IsFemale, 'ua', 'eu' )] [host.GetTitleAsNameNoTooltip] merece melhor!"
 coronation_events.6123.c_dislikes_host:0 "Imagine estar prometido àquel[Select_CString( host.IsFemale, 'a', 'e' )] [host.Custom('InsultNoun')] repugnante..."
 coronation_events.6123.c_dislikes_loyalty:0 "Esses vermes [host.GetPrimaryTitle.GetAdjectiveNoTooltip] pertencem ao chão..."
 coronation_events.6123.c_likes_disrespect:0 "Os vassalos d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveNoTooltip] veem através desta farsa..."
 coronation_events.6123.c_likes_loyalty:0 "Prova de sua honra e da virtude d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveNoTooltip]."
 coronation_events.6123.c_vassal_neutral:0 "Ajoelho-me diante [Select_CString( host.IsFemale, 'da minha', 'do meu' )] [host.GetTitleAsNameNoTooltip]."
 coronation_events.6123.c_vassal_pleased:0 "Ajoelho-me diante d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNameNoTooltipRegnal], [Select_CString( host.IsFemale, 'a', 'o' )] verdadeir[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip]."
 coronation_events.6123.c_vassal_resents:0 "Murmuro o que é costumeiro."
 coronation_events.6123.desc_end_spectator:0 "A cerimônia continua, sem fim."
 coronation_events.6123.desc_end_vassal:0 "Finalmente, chega... minha vez."
 coronation_events.6123.desc_high_clergy:0 "Adorando, eles louvam o grande amor d[Select_CString( host.IsFemale, 'a', 'o' )] piedos[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessiveNoTooltip|l] pela proteção dos [host.GetFaith.GetAdherentNamePlural], e pedem que [host.GetSheHe] se torne seu grande campeão."
 coronation_events.6123.desc_high_populace:0 "os anciãos de [location.GetTitle.GetBaseNameNoTier] olham para [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] com reverência, enquanto as massas do lado de fora exaltam o nome [host.Custom('GetTitleTierAdjective')] e glorioso [host.GetHerHim].\n\n"
 coronation_events.6123.desc_high_vassals:0 "Os vassalos d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveNoTooltip] avançam para se submeter: a maioria brilha de esperança e juram verdadeiramente lealdade e amor."
 coronation_events.6123.desc_intro:0 "Até que os [host.GetFaith.BishopNeuterPlural], a nobreza [host.GetPrimaryTitle.GetAdjective] e o povo comum tenham todos cumprido seu papel costumeiro, [host.GetFirstName] não é um[Select_CString( host.IsFemale, 'a', '' )] verdadeir[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l]. O governo [host.GetHerHim] não pode ser justo sem a aceitação deles.\n\nPrimeiro, os [ROOT.Char.GetFaith.PriestNeuterPlural]."
 coronation_events.6123.desc_low_clergy:0 "Queixos sanctimoniosos erguem-se, forçando [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] não apenas a jurar a proteção [host.GetHerHim] aos fiéis [host.GetFaith.GetAdherentName], mas também o arrependimento dos pecados [host.GetHerHim]."
 coronation_events.6123.desc_low_populace:0 "os anciãos de [location.GetTitle.GetBaseNameNoTier] avançam, tremendo de medo, enquanto um motim irrompe além do [ROOT.Char.GetFaith.HouseOfWorship]. A plebe aqui não tem amor pel[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l].\n\n"
 coronation_events.6123.desc_low_vassals:0 "Os vassalos d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveNoTooltip] avançam sombriamente. A maioria mal se importa com as palavras de lealdade em meio aos gestos de ódio."
 coronation_events.6123.desc_mid_clergy:0 "É um chamado para que [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] honre seus direitos sagrados e defenda os fiéis. [host.GetFirstNameNoTooltip] assente."
 coronation_events.6123.desc_mid_populace:0 "os anciãos de [location.GetTitle.GetBaseNameNoTier] emitem seu reconhecimento simbólico, e [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip|l] promete [host.Custom('GetMaternalPaternal')] amor ao povo humilde.\n\n"
 coronation_events.6123.desc_mid_vassals:0 "Os vassalos d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveNoTooltip] avançam para beijar e jurar fidelidade. Alguns honram este ato; outros murmuram tristemente e não levantam os olhos do pó."
 coronation_events.6123.desc_pop_foreign:0 "os [host.Custom('GetLocalCommonerTermPlural')] locais representam os comuns [host.GetPrimaryTitle.GetAdjective]. E"
 coronation_events.6123.desc_then:0 "Então"
 coronation_events.6123.t:0 "Os Três Assentimentos"
 coronation_events.6123_vassal_feted_you:0 "Vassalo Jurou Devoção Eterna"
 coronation_events.6123_vassal_scorned_you:0 "Vassalo Rejeita Sua Soberania"
 coronation_events.6130.a.flavor:0 "Com [host.GetFaith.GetNameNoTooltip] ameaçada, preciso de alguma bênção adicional para me tornar um verdadeiro campeão da fé? Não!"
 coronation_events.6130.a:0 "Do óleo sagrado — #EMP fogo santo!#!"
 coronation_events.6130.a_dharmic:0 "E estas águas devem ser defendidas!"
 coronation_events.6130.abrahamic_intro_guest:0 "Primeiro, [host.GetTitledFirstNameRegnal] deve ser ordenado com óleo sagrado, recebendo prerrogativa acima do restante dos fiéis de [host.GetFaith.HighGodNamePossessive], e o ministério das almas do reino [host.GetHerHim]."
 coronation_events.6130.abrahamic_intro_host:0 "Primeiro, devo ser ordenado com óleo sagrado, incumbido como líder dos fiéis de [host.GetFaith.HighGodNamePossessive], acima do rebanho comum."
 coronation_events.6130.anointer_fallback:0 "\n\n[anointer.GetTitledFirstName], solene e sábio,"
 coronation_events.6130.anointing_abrahamic_guest:0 "marca [host.GetFirstNameNoTooltip] com o óleo dourado sagrado. Em suas mãos, sua cabeça, seu peito, seus ombros e as dobras de seus braços... uma bênção para profetas, [host.GetFaith.PriestNeuterPlural] e monarcas.\n\n"
 coronation_events.6130.anointing_abrahamic_host:0 "marca-me com o óleo dourado sagrado e aromático. Em minhas mãos trêmulas, minha cabeça, meu peito, meus ombros e as dobras dos meus braços... esta unção compartilhada por profetas, [host.GetFaith.PriestNeuterPlural] e monarcas.\n\n"
 coronation_events.6130.anointing_abrahamic_host_disrespectful:0 "marca-me com o óleo dourado pungente. Em minhas mãos estendidas, minha cabeça, meu peito, meus ombros e as dobras dos meus braços... esta unção concedida a profetas, [host.GetFaith.PriestNeuterPlural] e monarcas.\n\n"
 coronation_events.6130.anointing_dharmic_guest:0 "conduz os consagradores. De vasos dourados vêm as águas vivificantes. Em chuvas radiantes, elas são espalhadas sobre [host.GetFirstNameNoTooltip].\n\n"
 coronation_events.6130.anointing_dharmic_host:0 "conduz meus consagradores. De vasos dourados vêm as águas vivificantes. Em chuvas radiantes, elas são espalhadas sobre meu corpo, trazendo doces memórias de Saraswati, do Ganges e dos mares.\n\n"
 coronation_events.6130.b:0 "A palavra abençoada é minha para espalhar."
 coronation_events.6130.c.flavor:0 "Devo expressar minha gratidão ao prelado."
 coronation_events.6130.c:0 "Pela mão d[Select_CString( anointer.IsFemale, 'a', 'o' )] [anointer.GetTitledFirstNamePossessiveNoTooltip], sinto o favor de [host.GetFaith.HighGodNamePossessive]."
 coronation_events.6130.c_dharmic:0 "A ajuda d[Select_CString( anointer.IsFemale, 'a', 'o' )] [anointer.GetTitledFirstNamePossessiveNoTooltip], também, é uma grande honra."
 coronation_events.6130.christian_non_hof:0 "\n\n[anointer.GetTitledFirstName], [Select_CString( anointer.IsFemale, 'a', 'o' )] pastor[Select_CString( anointer.IsFemale, 'a', '' )] do [host.GetPrimaryTitle.GetNameNoTier],"
 coronation_events.6130.christian_non_hof_non_cc:0 "\n\n[anointer.GetTitledFirstName], [Select_CString( anointer.IsFemale, 'a', 'o' )] pastor[Select_CString( anointer.IsFemale, 'a', '' )] do [anointer.GetPrimaryTitle.GetNameNoTier],"
 coronation_events.6130.d.cynical_guest:0 "E assim, o clero aceita um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip]."
 coronation_events.6130.d.cynical_host:0 "Que [host.GetFaith.GetAdherentNameNoTooltip] poderia agora negar-me?"
 coronation_events.6130.d.faithful_guest:0 "E assim, [host.GetFaith.HighGodName] escolhe [host.GetTitledFirstNameNoTooltip]."
 coronation_events.6130.d.faithful_guest_dharmic:0 "Que as águas, puras e inquietas, tragam sabedoria."
 coronation_events.6130.d.faithful_host:0 "Eu brilho com o toque próprio de [host.GetFaith.HighGodNamePossessive]!"
 coronation_events.6130.d.faithful_host_dharmic:0 "Que minha mente sempre descanse aos pés de lótus deles."
 coronation_events.6130.desc.intro:0 "O momento sagrado final se aproxima."
 coronation_events.6130.dharmic_intro_guest:0 "As oferendas foram feitas, o [Glossary( 'Rajasuya', 'RAJASUYA_GLOSS' )] começou: agora, o sagrado [Glossary( 'Abhisheka', 'ABHISHEKA_GLOSS' )]. [host.GetTitledFirstNameRegnal] recita os mantras védicos, e os portadores das dezessete águas sagradas se reúnem ao redor [host.GetHerHim]."
 coronation_events.6130.dharmic_intro_host:0 "As oferendas foram feitas, o [Glossary( 'Rajasuya', 'RAJASUYA_GLOSS' )] começou: agora, o sagrado [Glossary( 'Abhisheka', 'ABHISHEKA_GLOSS' )]. Recito os mantras védicos, e os portadores das dezessete águas sagradas se reúnem."
 coronation_events.6130.ending_abrahamic_guest_cynical:0 "A pele oleosa d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessiveNoTooltip] é uma boa validação dos fiéis."
 coronation_events.6130.ending_abrahamic_guest_zealous:0 "A pele d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessiveNoTooltip] brilha com a aprovação do próprio [host.GetFaith.HighGodName]."
 coronation_events.6130.ending_abrahamic_host_cynical:0 "Tenho a aprovação de [host.GetFaith.HighGodNamePossessive]. E sinto-me muito oleoso."
 coronation_events.6130.ending_abrahamic_host_zealous:0 "Minha pele brilha com a aprovação do próprio [host.GetFaith.HighGodName]."
 coronation_events.6130.ending_dharmic_guest:0 "Pelas deusas-rio e deuses-mar, por [host.GetFaith.WaterGodName], por [host.GetFaith.FertilityGodName], [host.GetFirstNameNoTooltip] é honrad[Select_CString( host.IsFemale, 'a', 'o' )] como [host.GetTitleAsName]."
 coronation_events.6130.ending_dharmic_host:0 "Pelas deusas-rio e deuses-mar, por [ROOT.Char.GetFaith.WaterGodName], por [host.GetFaith.FertilityGodName], sou honrad[Select_CString( host.IsFemale, 'a', 'o' )] como [host.GetTitleAsName]."
 coronation_events.6130.faith_head:0 "\n\n[anointer.GetTitledFirstName], intercessor dos [host.GetFaith.GetAdherentNamePlural],"
 coronation_events.6130.faith_head_disapproves:0 "\n\n[anointer.GetTitledFirstName], com sutil desdém,"
 coronation_events.6130.faith_head_likes:0 "\n\n[anointer.GetTitledFirstName], com orgulho [host.Custom('GetMotherlyFatherly')],"
 coronation_events.6130.generic_intro_guest:0 "Mas primeiro, a unção: a marca do mandato d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessiveRegnal] de [host.GetFaith.HighGodName]. [anointer.GetTitledFirstNameRegnal] [anointer.GetHerselfHimself] carrega o óleo sagrado."
 coronation_events.6130.generic_intro_host:0 "Mas primeiro, a ordenação com óleo sagrado, a marca da aceitação d[Select_CString( anointer.IsFemale, 'a', 'o' )] [anointer.GetTitledFirstNamePossessiveRegnal]: não apenas de mim como governante do [ROOT.Char.GetPrimaryTitle.GetNameNoTier], mas como pertencente aos favorecidos dos fiéis de [host.GetFaith.HighGodNamePossessive]."
 coronation_events.6130.papal_intro_guest:0 "Mas primeiro, a unção: a marca do mandato divino d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessiveRegnal]. [anointer.GetTitledFirstNameRegnal] [anointer.GetHerselfHimself] carrega o óleo sagrado e assume o papel do Profeta Samuel para este Rei David [host.GetPrimaryTitle.GetAdjective]."
 coronation_events.6130.papal_intro_host:0 "Mas primeiro, a ordenação com óleo sagrado, a marca da aceitação d[Select_CString( anointer.IsFemale, 'a', 'o' )] [anointer.GetTitledFirstNamePossessiveRegnal]: não apenas de mim como governante do [ROOT.Char.GetPrimaryTitle.GetNameNoTier], mas também como membro elevado do Eleito de Cristo."
 coronation_events.6130.t:0 "O Óleo Sagrado"
 coronation_events.6130.t_anointment:0 "A Unção"
 coronation_events.6130.t_dharmic:0 "As Águas Sagradas"
 coronation_events.6140.a:0 "Devo me livrar dest[Select_CString( spouse.IsFemale, 'a', 'e' )] [spouse.GetWomanMan]..."
 coronation_events.6140.a_dislike:0 "Eu #EMP devo#! me livrar dest[Select_CString( spouse.IsFemale, 'a', 'e' )] [spouse.GetWomanMan] [spouse.Custom('InsultAdjective')]..."
 coronation_events.6140.a_like:0 "Infelizmente, devo me livrar dest[Select_CString( spouse.IsFemale, 'a', 'e' )] [spouse.GetWomanMan] [spouse.Custom('ComplimentAdjective')]..."
 coronation_events.6140.aa.flavor:0 "[spouse.GetFirstNameNoTooltip] não consegue ver que, com a própria mão santa d[Select_CString( anointer.IsFemale, 'a', 'o' )] [anointer.GetTitledFirstNamePossessiveNoTooltipRegnal], esta cerimônia reconheceu, de certa forma, [spouse.GetSheHe] como um dos fiéis [host.GetFaith.GetAdjectiveNoTooltip]? M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [spouse.GetWifeHusband] deveria abraçar sua conversão!"
 coronation_events.6140.aa:0 "Então... [spouse.GetSheHe] agora é um [host.GetFaith.GetAdherentNameNoTooltip], sim?"
 coronation_events.6140.aa_fail:0 "[spouse.GetSheHe|U] sofreu ritos pagãos por sua causa"
 coronation_events.6140.aa_success:0 "[spouse.GetSheHe|U] foi conquistad[Select_CString( spouse.IsFemale, 'a', 'o' )] pela fé"
 coronation_events.6140.b:0 "M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [spouse.GetWifeHusband], m[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [spouse.GetTitleAsNameNoTooltip] — [spouse.GetFirstNameNoTooltip]."
 coronation_events.6140.b_dislike:0 "M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [spouse.GetTitleAsNameNoTooltip]... #EMP [spouse.GetSheHe]#!."
 coronation_events.6140.b_like:0 "M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [spouse.GetTitleAsNameNoTooltip], meu doce amor — [spouse.GetFirstNameNoTooltip]!"
 coronation_events.6140.c:0 "Minha parte na entronização [Select_CString( host.IsFemale, 'da minha', 'do meu' )] [host.Custom('WifeHusbandPossessive')] está concluída."
 coronation_events.6140.c_flavor:0 "Assuntos [ROOT.Char.GetPrimaryTitle.GetAdjective] certamente ocuparão muito do meu tempo. Mas ser o consorte [host.Custom('GetTitleTierAdjective')] do [host.GetPrimaryTitle.GetNameNoTier]... isso sim é algo."
 coronation_events.6140.d:0 "[Select_CString( host.IsFemale, 'A', 'O' )] [host.GetTitleAsNameNoTooltip] tem [Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetTitleAsNameNoTooltip] [host.GetHerHim]."
 coronation_events.6140.d_dislikes_host:0 "Que [ROOT.Char.GetFaith.HighGodName] te ajude, [spouse.GetFirstNameNoTooltip]..."
 coronation_events.6140.d_dislikes_spouse:0 "[spouse.GetShe|U] ainda é um[Select_CString( spouse.IsFemale, 'a', '' )] [spouse.GetWomanMan] miserável..."
 coronation_events.6140.d_likes_host:0 "Cuide bem [Select_CString( host.IsFemale, 'da sua', 'do seu' )] excelente [host.Custom('WifeHusband')], [spouse.GetFirstNameNoTooltip]."
 coronation_events.6140.d_likes_spouse:0 "Um dia glorioso para [spouse.GetFirstNameNoTooltip]!"
 coronation_events.6140.t:0 "O Consorte d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessiveNoTooltip]"
 coronation_events.6140_desc:0 "Com os ritos da entronização d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessive] completos, o consorte [host.Custom('GetTitleTierAdjective')] deve agora ser devidamente instalado como [spouse.GetTitleAsName].\n\n"
 coronation_events.6140_desc_crown:0 "\n\nEm breve — e com grande cerimônia — a coroa d[Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstNamePossessiveNoTooltip] é colocada em sua cabeça pela primeira vez. [host.GetPrimaryTitle.GetDefinitiveName|U] o aclama como [spouse.GetTitleAsNameNoTooltip]."
 coronation_events.6140_desc_crown_spouse:0 "\n\nEm breve — e com grande cerimônia — uma coroa digna de [host.Custom('GetTitleTierAdjective')] [spouse.Custom('WifeHusband')] d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveNoTooltip] é colocada em minha cabeça. [host.GetPrimaryTitle.GetName|U] nos aclama enquanto sentamos juntos em nossos tronos."
 coronation_events.6140_desc_foreign_wife:0 "A educação [spouse.GetCulture.GetName] [spouse.GetHerHim] criou pouco preparo para os ritos [host.GetCulture.GetName] em meio às orações [host.GetFaith.GetAdjective]: [spouse.GetSheHe] recita os juramentos em [host.GetCourtLanguage.GetName] apenas de memória dos sons."
 coronation_events.6140_desc_foreign_wife_no_court:0 "A educação [spouse.GetCulture.GetName] [spouse.GetHerHim] criou pouco preparo para os ritos [host.GetCulture.GetName] em meio às orações [host.GetFaith.GetAdjective]: [spouse.GetSheHe] recita os juramentos em [host.GetCulture.GetLanguage.GetName] apenas de memória dos sons."
 coronation_events.6140_desc_foreign_wife_no_court_spouse:0 "Minha educação [spouse.GetCulture.GetName] mal me preparou para estranhos ritos [host.GetCulture.GetName] em meio às orações [host.GetFaith.GetAdjective]... Não falo [host.GetCulture.GetLanguage.GetName], e devo recitar os juramentos de memória apenas pelos sons."
 coronation_events.6140_desc_foreign_wife_spouse:0 "Minha educação [spouse.GetCulture.GetName] mal me preparou para estranhos ritos [host.GetCulture.GetName] em meio às orações [host.GetFaith.GetAdjective]... Não falo [host.GetCourtLanguage.GetName], e devo recitar os juramentos de memória apenas pelos sons."
 coronation_events.6140_desc_guest:0 "[spouse.Custom('WifeHusband')|U] d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessiveRegnal]  conduz os rituais com distintivo [host.Custom2('QuirkNounPosOrNeg', spouse.MakeScope.Char)]."
 coronation_events.6140_desc_host:0 "M[Select_CString( spouse.IsFemale, 'inha', 'eu' )] [host.Custom2('RelationToMe', SCOPE.sC('spouse'))] conduz os rituais com o característico [host.Custom2('QuirkNounPosOrNeg', spouse.MakeScope.Char)] [spouse.GetHerHim]."
 coronation_events.6140_desc_intro_spouse:0 "Com os ritos da entronização d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessive] completos, o consorte [host.Custom('GetTitleTierAdjective')] deve agora ser devidamente instalado.\n\n"
 coronation_events.6140_desc_lowly_wife:0 "A baixa origem [spouse.GetHerHim] é parcialmente revelada quando [spouse.GetFirstName] se atrapalha com os votos mais obscuros de fidelidade a [host.GetFaith.random_GoodGodNames]..."
 coronation_events.6140_desc_lowly_wife_spouse:0 "Nós, humildes membros de [spouse.GetHouse.GetName], mal testemunhamos tais procedimentos reais. Os obscuros votos de fidelidade a [host.GetFaith.random_GoodGodNames] provam ser um verdadeiro desafio..."
 coronation_events.6140_desc_mid_wife:0 "Um[Select_CString( spouse.IsFemale, 'a', '' )] [spouse.Custom('DaughterSon')] da casa [spouse.GetHouse.GetName], as palavras d[Select_CString( spouse.IsFemale, 'a', 'o' )] [spouse.GetFirstNamePossessive] entregues de forma [host.Custom2('QuirkAdverbPosOrNeg', spouse.MakeScope.Char)] carregam as marcas da nobre origem [spouse.GetCulture.GetName] [spouse.GetHerHim]."
 coronation_events.6140_desc_mid_wife_spouse:0 "Recito as palavras costumeiras e falo em termos elogiosos d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNameNoTooltip], [host.GetFaith.HighGodName] e meu dever para com o reino d[Select_CString( host.IsFemale, 'a', 'o' )] [spouse.Custom2('RelationToMePossessive', SCOPE.sC('host'))]."
 coronation_events.6140_desc_neutral:0 "\n\nEm breve — e com grande cerimônia — [spouse.GetFirstNameNoTooltip] é conduzido ao seu lugar de honra ao meu lado, e [spouse.GetSheHe] toma o trono como [spouse.GetTitleAsNameNoTooltip] do [host.GetPrimaryTitle.GetNameNoTier]."
 coronation_events.6140_desc_neutral_spouse:0 "\n\nEm breve — e com grande cerimônia — sou conduzido a um lugar de honra ao lado d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetFirstNamePossessiveNoTooltip], e tomo meu trono como [host.Custom('GetTitleTierAdjective')] [spouse.Custom('WifeHusband')] [host.GetHerHim]."
 coronation_events.6140_desc_polygamous:0 "Com os ritos da entronização d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessive] completos, o consorte mais sênior dos [host.Custom('GetTitleTierAdjective')] deve agora ser devidamente instalado como [spouse.GetTitleAsName].\n\n"
 coronation_events.6140_desc_polygamous_spouse:0 "Com os ritos da entronização d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNamePossessive] completos, o mais sênior dos consortes [host.Custom('GetTitleTierAdjective')] deve agora ser devidamente instalado.\n\n"
 coronation_events.6140_desc_regal_wife:0 "Um testemunho da gloriosa linhagem [spouse.GetHerHim], [spouse.GetFirstName] se ergue para a recitação dos votos com gravidade e postura."
 coronation_events.6140_desc_regal_wife_spouse:0 "Sou de linhagem gloriosa: nós, [spouse.Custom('GetDaughterSon')]s dos [spouse.GetHouse.GetName], somos mestres do cerimonial, e conduzo-me com gravidade e postura."
 coronation_events.6140_desc_spouse:0 "Enquanto m[Select_CString( host.IsFemale, 'inha', 'eu' )] [spouse.Custom2('RelationToMe', SCOPE.sC('host'))] observa, sou conduzido pelos rituais [host.GetPrimaryTitle.GetAdjective]."
 coronation_events.6150.a.flavor:0 "A palavra se espalhará sobre minhas súplicas, sobre a ternura e gentileza prometidas pelo meu lar... mas, por [ROOT.Char.GetFaith.HighGodName], terei a obediência d[Select_CString( disobedient_vassal.IsFemale, 'a', 'o' )] [disobedient_vassal.GetFirstNamePossessiveNoTooltip]!"
