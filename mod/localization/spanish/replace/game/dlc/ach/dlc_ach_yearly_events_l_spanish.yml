l_spanish:
 ach_balanced_budget_modifier:0 "Orçamento Equilibrado"
 ach_balanced_budget_modifier_desc:0 "Este personagem se beneficia de finanças muito bem administradas."
 ach_budgeting_mentor_modifier:0 "Mentor de Orçamento"
 ach_budgeting_mentor_modifier_desc:0 "Este personagem é um conhecido especialista fiscal, capaz de ensinar outros a gastar seu ouro com sabedoria."
 ach_cautious_spender_modifier:0 "Gastador Cauteloso"
 ach_cautious_spender_modifier_desc:0 "Este personagem mantém mão firme sobre os cordões da bolsa."
 ach_chancellor_isolating_factions_modifier:0 "Chanceler Isolando Facções"
 ach_chancellor_isolating_factions_modifier_desc:0 "Um defensor deste governante transforma rebeldes e detratores em párias com habilidade.\n#weak [vassals|E] têm menos chance de se juntar a [factions|E]#!"
 ach_coronation_suggestion_tt:0 "Você deveria considerar realizar uma [coronation|E]"
 ach_extravagant_spender_modifier:0 "Gastador Extravagante"
 ach_extravagant_spender_modifier_desc:0 "Este personagem gasta de forma luxuosa, quando necessário."
 ach_fence_sitter_modifier:0 "Indeciso"
 ach_fence_sitter_modifier_desc:0 "A indecisão deste personagem é bem conhecida, e ele é infame por sua recusa em se comprometer."
 ach_marshal_reconstituting_army_modifier:0 "Marechal Reconstituindo o Exército"
 ach_marshal_reconstituting_army_modifier_desc:0 "Após uma derrota brutal, o Marechal deste personagem se esforça para restaurar o exército à forma de combate."
 ach_spending_advice_modifier:0 "Conselheiro de Gastos"
 ach_spending_advice_modifier_desc:0 "Este personagem é especialista em dar bons conselhos financeiros."
 ach_stewardship_bankruptcy_modifier:0 "Administração Voltada à Prosperidade"
 ach_stewardship_bankruptcy_modifier_desc:0 "Quando a falência ameaçava o reino, as leis locais foram reforçadas e as forças foram voltadas a deveres civis."
 ach_welcoming_lieges_creditors_modifier:0 "Acolhendo os Empobrecidos"
 ach_welcoming_lieges_creditors_modifier_desc:0 "A população local aumenta: a má gestão financeira em outros lugares leva famílias a se reassentarem aqui."
 ach_yearly_events.1001.a.failure:0 "[liege.GetFirstNameNoTooltip] desconfia do seu plano"
 ach_yearly_events.1001.a.success:0 "[liege.GetFirstNameNoTooltip] entrega alegremente as moedas"
 ach_yearly_events.1001.a:0 "\"Se estiver em dúvida, #EMP eu#! poderia gerenciá-lo por você...\""
 ach_yearly_events.1001.b:0 "Ser cauteloso é o caminho correto."
 ach_yearly_events.1001.c:0 "Um[Select_CString( liege.IsFemale, 'a', '' )] [liege.GetTitleAsNameNoTooltip] merece viver bem!"
 ach_yearly_events.1001.d.failure:0 "[liege.GetFirstNameNoTooltip] zomba de sua neutralidade"
 ach_yearly_events.1001.d.success:0 "[liege.GetFirstNameNoTooltip] aplaude seu bom senso"
 ach_yearly_events.1001.d:0 "Talvez uma abordagem equilibrada seja a melhor?"
 ach_yearly_events.1001.desc:0 "Como [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] [Select_CString( liege.IsFemale, 'da minha senhora', 'do meu senhor' )], [liege.GetTitledFirstName], cabe a mim aconselhar [liege.GetSheHe] sobre a administração do tesouro. Uma parte importante disso é explicar os benefícios e desvantagens de certos hábitos de gasto.\n\n\"Então me diga novamente,\" pergunta [liege.GetSheHe], \"quais são as verdadeiras #EMP desvantagens#! de economizar o dinheiro do reino? Certamente, é bom poupar para tempos de dificuldade?\"\n\nBem. [liege.GetSheHe|U] não está errado, mas é uma visão um tanto simplista..."
 ach_yearly_events.1001.t:0 "Questões Fiscais"
 ach_yearly_events.1002.a:0 "A causa pestilenta deve ser isolada."
 ach_yearly_events.1002.b.failure:0 "Seu desprezo zombeteiro falha"
 ach_yearly_events.1002.b.success:0 "Você envenena a ideia da rebelião"
 ach_yearly_events.1002.b:0 "$ach_yearly_events.1002.a$"
 ach_yearly_events.1002.c.flavor:0 "Sou a principal voz do reino. E a principal voz #EMP dissidente#!!"
 ach_yearly_events.1002.c:0 "Sou tão servil assim? Minha voz deve ser ouvida!"
 ach_yearly_events.1002.d.flavor:0 "Como [Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )], tenho a influência para garantir que est[Select_CString( faction_member.IsFemale, 'a', 'e' )] [faction_member.GetTitleAsNameNoTooltip] rebelde seja silenciad[Select_CString( faction_member.IsFemale, 'a', 'o' )]."
 ach_yearly_events.1002.d:0 "Ratos são tratados... um por um."
 ach_yearly_events.1002.desc:0 "Como [Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] de [liege.GetPrimaryTitle.GetNameNoTier], jurei puxar o rabo dos vassalos rebeldes, para evitar que os vermes infestando o [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l] se amontoem em um grande enxame...\n\nCom a [faction.GetName] reunindo forças, dissidentes como [faction_member.GetName] viajam por toda parte, murmurando em ouvidos delicados.\n\n\"[unjoined_vassal.GetPrimaryTitle.GetNameNoTier] é forte, é faminto,\" insiste o traidor a s[Select_CString( unjoined_vassal.IsFemale, 'ua', 'eu' )] [unjoined_vassal.GetTitleAsNameNoTooltip], [unjoined_vassal.GetFirstName], \"confie nessa força, nessa fome... e na nossa.\""
 ach_yearly_events.1002.t:0 "O Amontoado de Ratos"
 ach_yearly_events.1003.a:0 "Agora, é necessária a força de um [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )]!"
 ach_yearly_events.1003.b:0 "[ROOT.Char.Custom('KnightCulturePluralNoTooltip')]! #EMP Cavalgai para salvar [liege.GetPrimaryTitle.GetNameNoTierNoTooltip]!#!"
 ach_yearly_events.1003.c.failure:0 "Poucos atendem ao seu chamado"
 ach_yearly_events.1003.c.success:0 "Sobreviventes se reúnem sob o estandarte d[Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstNamePossessiveNoTooltip]"
 ach_yearly_events.1003.c:0 "Reunirei o exército derrotado."
 ach_yearly_events.1003.d.flavor:0 "...e aquel[Select_CString( liege.IsFemale, 'a', 'e' )] [liege.GetTitleAsNameNoTooltip] tol[Select_CString( liege.IsFemale, 'a', 'o' )] também, se [liege.GetSheHe] reclamar dizendo que isso é culpa #EMP minha#!!"
 ach_yearly_events.1003.d:0 "Ordene que os sobreviventes sejam chicoteados por sua falha."
 ach_yearly_events.1003.desc:0 "O conflito [Select_CString( liege.IsFemale, 'da minha senhora', 'do meu senhor' )] com o [foe.GetPrimaryTitle.GetNameNoTier] se arrasta. Como seu [Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )], planejo a logística, convoco [liege.Custom('GetLocalCommonerTermPlural')] para o serviço, acalmo os distúrbios locais... mas agora cavaleiros trazem notícias sombrias.\n\nEm [battle_province.GetName], os [liege.Custom('KnightCulturePluralNoTooltip')|l] de [liege.GetPrimaryTitle.GetNameNoTier] falharam. A linha de batalha de [commander.GetNamePossessive] foi rompida, e todo o nosso exército lançado em uma fuga desesperada. Agora, enquanto nossos [liege.Custom('GetFighterTermPlural')] recuam, o exército de [foe.GetNamePossessive] avança sobre o [liege.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!\n\nMeus conselheiros me instam a honrar meu cargo; a segurar as rédeas desse desastre com punho de ferro."
 ach_yearly_events.1003.t:0 "Mestre dos Derrotados"
 ach_yearly_events.1004.a.flavor:0 "Quando o tesouro é frágil, suponho que um [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] precisa ser forte... e odiado."
 ach_yearly_events.1004.a:0 "\"Posso tomar dos seus vassalos e assumir a culpa.\""
 ach_yearly_events.1004.b.failure:0 "Seus instintos se provam chocantemente inúteis"
 ach_yearly_events.1004.b.success:0 "Você reforma habilmente a administração local"
 ach_yearly_events.1004.b:0 "Da diligência e do tempo, a riqueza pode brotar."
 ach_yearly_events.1004.c:0 "Da diligência e do tempo, a riqueza brota."
 ach_yearly_events.1004.d.flavor:0 "Nenhum dever pode me compelir a consertar a bolsa destroçada deste devedor..."
 ach_yearly_events.1004.d:0 "\"Quando seu povo começar a passar fome, mande-os até mim.\""
 ach_yearly_events.1004.desc:0 "[Select_CString( liege.IsFemale, 'Minha empobrecida senhora', 'Meu empobrecido senhor' )], [liege.GetTitledFirstName], e eu, [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] [liege.GetHerHim], temos um momento para conversar. Embora... enquanto uma multidão se revolta pela ausência de recursos no tesouro [liege.Custom('GetTitleTierAdjective')].\n\n\"Como clamam, ansiando por novas glórias!\" interpreta [Select_CString( liege.IsFemale, 'a', 'o' )] [liege.GetTitledFirstNameNoTooltip], generosamente.\n\n\"Com o que conquistaremos glórias?\" pergunto. \"Lanças douradas? Flechas com pontas de pedras preciosas? A riqueza do reino se foi, mas por #EMP glórias#!...\"\n\n"
 ach_yearly_events.1004.desc_end:0 "\"Apenas desejo ilusório!\" [liege.GetSheHe] responde. \"Eu conheço bem o estado do tesouro...\""
 ach_yearly_events.1004.desc_harsh:0 "\"Você é meu [Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )],\" [liege.GetSheHe] responde. \"Encontre o ouro. Encontre as gemas.\""
 ach_yearly_events.1004.t:0 "A Grande, Murcha Bolsa"
 ach_yearly_events.1005.a:0 "Tragam os ferreiros."
 ach_yearly_events.1005.b:0 "Que os preparativos comecem."
 ach_yearly_events.1005.c:0 "Farei isso mais tarde."
 ach_yearly_events.1005.desc:0 "\"Anos se passaram desde sua ascensão ao trono do [ROOT.Char.GetPrimaryTitle.GetName]. Você é o verdadeiro soberano destas terras, o protetor do povo que habita em meu reino.\"\n\nAs palavras de [messenger.GetNamePossessive] estão cheias de convicção. A preocupação [messenger.GetHerHim] com meu reino é genuína.\n\n\"Ainda assim, sua fronte permanece nua, não agraciada por uma coroa ungida. Sua mão vazia, desprovida de regália abençoada. Embora ninguém ouse desafiar seu governo, você #EMP deve#! realizar uma coroação adequada. Caso contrário, temo pelo futuro de [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\""
 ach_yearly_events.1005.t:0 "[Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [ROOT.Char.GetTitleAsNameNoTooltip] de [ROOT.Char.GetPrimaryTitle.GetNameNoTier]"
 ach_yearly_events.1010.a:0 "Outra coroação, ainda maior, é necessária."
 ach_yearly_events.1010.desc:0 "Tornei-me [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName] de [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive]: uma figura grandiosa e temível entre as ordens da humanidade, minha vontade moldando os destinos de milhares a cada decisão.\n\nComo senhor de [title.GetNameNoTier], conquistei meu direito de governar."
 ach_yearly_events.1010.desc_no_vassals:0 "Mas agora, a nobreza [title.GetAdjectiveNoTooltip], e todos os povos súditos que pertencem ao poderoso estandarte de [ROOT.Char.GetPrimaryTitle.GetName]... esses súditos [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] devem reconhecer minha posição [ROOT.Char.Custom('GetTitleTierAdjective')]."
 ach_yearly_events.1010.desc_outro_crown:0 "\n\nDevo realizar novos e gloriosos ritos de inauguração, e justificar minha coroa exaltada."
 ach_yearly_events.1010.desc_outro_regalia:0 "\n\nDevo realizar novos e gloriosos ritos de inauguração, e justificar minha regália exaltada."
 ach_yearly_events.1010.desc_vassals:0 "Mas agora, o povo [title.GetAdjectiveNoTooltip], e todos aqueles que pertencem ao poderoso estandarte de [ROOT.Char.GetPrimaryTitle.GetName], os [ROOT.Char.Custom('GetLocalCommonerTermPlural')] [vassal_title_1.GetAdjective], os nobres [vassal_title_2.GetAdjective]... esses súditos [ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip] devem reconhecer minha posição [ROOT.Char.Custom('GetTitleTierAdjective')]."
 ach_yearly_events.1010.t:0 "Reconhecimento [ROOT.Char.Custom('GetTitleTierAdjective')|U]"
 chancellor_isolates_factions_desc:0 "[ROOT.Char.GetTitledFirstName] direciona o discurso entre seus vassalos a seu favor."
 chancellor_isolates_factions_title:0 "[Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] Enfraquece o Apoio às Facções"
 chancellor_removes_faction_member_desc:0 "[ROOT.Char.GetTitledFirstName] prova ser um oponente vigoroso contra seus vassalos dissidentes."
 chancellor_removes_faction_member_title:0 "[Concept( 'chancellor', GetPlayer.GetCouncillorPosition( 'councillor_chancellor' ).GetPositionName )] Aplaca Membro de Facção"
 custom.every_liege_domain_county:0 "[liege.GetShortUIName]:\n$EFFECT_LIST_BULLET$Cada [county|E] do [domain|E]"
 custom.every_liege_lending_vassal:0 "[liege.GetShortUIName]:\n$EFFECT_LIST_BULLET$Cada [powerful_vassal|E] com [gold|E] necessário"
 custom.every_scope_faction_member:0 "Todo membro da #high [faction.GetName]#!"
 marshal_aids_troop_recovery_desc:0 "[ROOT.Char.GetTitledFirstName] reage vigorosamente à derrota de seu exército."
 marshal_aids_troop_recovery_title:0 "[Concept( 'marshal', GetPlayer.GetCouncillorPosition( 'councillor_marshal' ).GetPositionName )] Reorganiza Tropas Derrotadas"
 marshal_joins_war_desc:0 "Sua derrota esmagadora incitou [marshal.GetTitledFirstName] à causa!"
 marshal_joins_war_desc_foe:0 "A derrota esmagadora de [liege.GetShortUINamePossessive] incitou [marshal.GetShortUIName], seu Marechal, a se juntar a [combat_war.GetName]."
 marshal_joins_war_title:0 "Marechal Convoca para a Guerra"
 marshal_joins_war_title_foe:0 "Marechal do Inimigo Convoca para a Guerra"
 steward_aids_financial_recovery_desc:0 "[ROOT.Char.GetTitledFirstName] reforma seu [domain|E], em resposta às suas dificuldades financeiras."
 steward_aids_financial_recovery_title:0 "[Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] Busca Solvência"
 steward_gathers_emergency_tithe_desc:0 "Para lidar com as dificuldades do tesouro, [ROOT.Char.GetTitledFirstName] reuniu essa cobrança incomum e assumiu toda a culpa."
 steward_gathers_emergency_tithe_title:0 "[Concept( 'steward', GetPlayer.GetCouncillorPosition( 'councillor_steward' ).GetPositionName )] Recolhe Tributo dos Vassalos"
