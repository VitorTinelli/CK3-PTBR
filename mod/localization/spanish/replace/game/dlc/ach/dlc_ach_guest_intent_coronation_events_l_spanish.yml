l_spanish:
 coronation_advocate_domain_county_opinion_modifier:0 "Domínio Defendido"
 coronation_advocate_domain_county_opinion_modifier_desc:0 "Este personagem defendeu seu domínio e o bem-estar de seu povo durante uma coroação."
 coronation_disrupt_loyalists_host_rivalry_tt:0 "Ou [host.GetShortUIName] se tornará seu [rival|E] ou você avançará rumo à [rivalry|E]"
 coronation_faction_bolstered_modifier:0 "Figura Rebelde"
 coronation_faction_bolstered_modifier_desc:0 "Após semear a discórdia na coroação de seu soberano, este personagem atrai guerreiros descontentes para sua bandeira."
 coronation_factions_modifier_tt:0 "Cada membro ganha [GetModifier('coronation_faction_bolstered_modifier').GetNameWithTooltip] por #high 5 anos#!"
 coronation_guest_intent_disrupt_happened_sender_tt:0 "#weak #EMP Isto ocorreu devido à influência potente d[Select_CString( petition_sender.IsFemale, 'a', 'o' )] [petition_sender.GetTitledFirstName]#!#!"
 coronation_guest_intent_disrupt_happened_tt:0 "#weak #EMP Isto ocorreu devido à forte presença de [coronation_detractors|E] em sua [coronation|E]#!#!"
 coronation_medium_magnificence_increase_tt:0 "Esta opção irá #EMP aumentar moderadamente#! #P sua [coronation_magnificence|E]"
 coronation_minor_magnificence_increase_tt:0 "Esta opção irá #EMP aumentar levemente#! #P sua [coronation_magnificence|E]"
 create_alliance_guest_tt:0 "Você e [host.GetShortUIName] formam uma [alliance|E]"
 create_alliance_host_tt:0 "Você e [petition_sender.GetShortUIName] formam uma [alliance|E]"
 cultural_acceptance_coronation_bear_witness:0 "Ao testemunhar a coroação e oferecer apoio, a aceitação cultural aumentou."
 every_offer_support_guest_opinion:0 "Cada convidado com a [intent|E] $coronation_offer_support$:\nGanhará #P 50#! [opinion|E] de [host.GetShortUIName]"
 every_seize_advantages_guest_prestige:0 "Cada convidado com a [intent|E] $coronation_seize_advantages$:\nGanhará [prestige_i]#P [EmptyScope.ScriptValue('medium_prestige_gain')|0]#! [prestige|E]"
 friend_coronation_offer_support:0 "[CHARACTER.GetShortUIName|U] apoiou [TARGET_CHARACTER.GetShortUIName] durante a coroação [TARGET_CHARACTER.GetHerHim]."
 friend_coronation_offer_support_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] apoiou [CHARACTER.GetShortUIName] durante a coroação."
 guest_intent_coronation_events.0001.a:0 "Sejamos um exemplo de paz para nosso povo."
 guest_intent_coronation_events.0001.b:0 "E fazemos isso na presença de [ROOT.Char.GetFaith.HighGodName]."
 guest_intent_coronation_events.0001.c:0 "Todos verão que estamos próximos d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip]."
 guest_intent_coronation_events.0001.desc.alone:0 "Encontro nosso anfitrião [host.GetTitledFirstName] sozinho no pátio. Finalmente, tenho a chance de mostrar minhas intenções.\n\nComo testemunha da coroação [host.GetHerHim], é justo que eu receba algo em troca."
 guest_intent_coronation_events.0001.desc.collective:0 "\"Lá está [host.GetSheHe].\" [guest.GetTitledFirstName] aponta para nosso anfitrião, [host.GetTitledFirstName], sozinho. Finalmente.\n\n\"Esta é nossa chance,\" insiste [guest.GetFirstNameNoTooltip]. \"Estamos aqui para testemunhar e apoiar a coroação [host.GetHerHim]. É justo que recebamos algo em troca.\""
 guest_intent_coronation_events.0001.t:0 "Como Sua Testemunha"
 guest_intent_coronation_events.0010.a:0 "[host.GetTitledFirstNameNoTooltip] não esquecerá seus apoiadores."
 guest_intent_coronation_events.0010.b:0 "Ou posso apenas fortalecer meu relacionamento com [Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitleAsNameNoTooltip]..."
 guest_intent_coronation_events.0010.c:0 "Uma aliança seria a jogada mais vantajosa."
 guest_intent_coronation_events.0010.desc.alone:0 "Finalmente, noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.Custom('ComplimentAdjective')] [host.GetTitledFirstName] ficou sozinh[Select_CString( host.IsFemale, 'a', 'o' )]. Começo a me aproximar lentamente [host.GetHerHim], com um sorriso no rosto.\n\nNão posso desperdiçar a chance de demonstrar minha fidelidade."
 guest_intent_coronation_events.0010.desc.collective:0 "\"Noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.Custom('ComplimentAdjective')] [host.GetTitledFirstName] finalmente ficou sozinh[Select_CString( host.IsFemale, 'a', 'o' )],\" observa m[Select_CString( guest.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort',SCOPE.sC('guest'))] [guest.GetTitledFirstName], [guest.Custom('quirk_pos_pp')]. \"Esta é a oportunidade para nós, apoiadores, mostrarmos nossa lealdade.\"\n\n\"Vá em frente, [ROOT.Char.GetFirstNameNoTooltip], não podemos desperdiçar esta chance.\""
 guest_intent_coronation_events.0010.t:0 "Oferecendo Apoio"
 guest_intent_coronation_events.0020.a:0 "Devemos concentrar nossos esforços no desenvolvimento de nossas cidades."
 guest_intent_coronation_events.0020.b:0 "Não há regra sem controle."
 guest_intent_coronation_events.0020.c:0 "A confiança do povo é o mais importante."
 guest_intent_coronation_events.0020.desc.alone:0 "Não consigo deixar de pensar sobre [ROOT.Char.Custom('MatchingConversationSubject_alone')] enquanto caminho de volta para meus aposentos. Mas logo percebo que não estou sozinho nesses corredores.\n\n[host.GetTitledFirstName] parece seguir na mesma direção. Esta pode ser minha chance de garantir que o [ROOT.Char.GetPrimaryTitle.GetNameNoTier] receba a ajuda que merece."
 guest_intent_coronation_events.0020.desc.collective:0 "Encontro-me imerso em uma conversa sobre [guest.Custom('MatchingConversationSubject_alone')] que [guest.GetTitledFirstName] não permite que termine.\n\n\"Mas espere!\" [guest.GetSheHe] interrompe abruptamente. \"Parece que noss[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetLadyLord] [host.GetTitleAsNameNoTooltip] também está indo para seus aposentos. Esta é nossa chance, [ROOT.Char.GetFirstName]. Vamos fazer com que [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] e [guest.GetPrimaryTitle.GetNameNoTier] prosperem.\""
 guest_intent_coronation_events.0020.t:0 "Defesa do Domínio"
 guest_intent_coronation_events.0030.a:0 "Oferecer um bom conselho pode nos conceder um favor."
 guest_intent_coronation_events.0030.b:0 "Devemos argumentar para reduzir nossos impostos."
 guest_intent_coronation_events.0030.c:0 "É necessário que [host.GetSheHe|U] saiba que os impostos que pagamos são extorsivos."
 guest_intent_coronation_events.0030.desc.alone:0 "Estou perdido(a) em pensamentos quando a porta se abre abruptamente.\n\nNo limiar, [host.GetTitledFirstName] parece tão surpres[Select_CString( host.IsFemale, 'a', 'o' )] quanto eu. Levanto-me imediatamente, mas [host.GetSheHe] sinaliza para que eu sente novamente. \"Desculpe,\" murmura [host.GetSheHe]. \"Há muito em que pensar.\"\n\nEsta pode ser minha única chance de falar livremente com meu/minha senhor(a)."
 guest_intent_coronation_events.0030.desc.collective:0 "\"...vamos ver se você consegue sair dessa.\" [guest.GetTitledFirstName] declara orgulhosamente, movendo uma de suas peças em direção à minha. Preparo minha resposta, mas a porta se abre abruptamente.\n\nNo limiar, [host.GetTitledFirstName] parece tão surpreso(a) quanto nós. Levantamo-nos imediatamente, mas [host.GetSheHe] sinaliza para que sentemos novamente. \"Desculpe,\" murmura [host.GetSheHe]. \"Há muito em que pensar.\"\n\n[guest.GetTitledFirstNameNoTooltip] arqueia uma sobrancelha. Esta pode ser nossa chance de falar com nosso(a) senhor(a)."
 guest_intent_coronation_events.0030.t:0 "É Meu Direito"
 guest_intent_coronation_events.0040.a:0 "O ouro é a única moeda valiosa."
 guest_intent_coronation_events.0040.b:0 "Prestígio sempre compensa."
 guest_intent_coronation_events.0040.c.flavor:0 "Ame a terra do vizinho, dizem..."
 guest_intent_coronation_events.0040.c:0 "Devemos convencer [host.GetSheHe] a afrouxar as fronteiras."
 guest_intent_coronation_events.0040.desc.alone:0 "Preciso falar com [host.GetSheHe] imediatamente. Afinal, estou aqui por [host.GetSheHe], é justo que eu obtenha algo em troca."
 guest_intent_coronation_events.0040.desc.collective:0 "\"Precisamos falar com [host.GetSheHe] agora,\" [guest.GetTitledFirstName] murmura atrás de sua taça. \"Estamos aqui por [host.GetSheHe]. É justo que tiremos algum proveito disso.\""
 guest_intent_coronation_events.0040.desc.intro:0 "Todos os convidados parecem distraídos com as apresentações dos malabaristas, a comida, a bebida e a presença de outros convidados. Finalmente, [host.GetTitledFirstName] parece conseguir desfrutar de um momento sozinho.\n\n"
 guest_intent_coronation_events.0040.t:0 "Aproveite o Momento"
 guest_intent_coronation_events.0050.a:0 "[host.GetSheHe|U] deve ver do que somos capazes."
 guest_intent_coronation_events.0050.aa:0 "Esta é agora a Coroação d[Select_CString( claimant_scope.IsFemale, 'a', 'o' )] [claimant_scope.GetTitledFirstNamePossessiveNoTooltip]."
 guest_intent_coronation_events.0050.b:0 "Devo focar em influenciar os outros convidados."
 guest_intent_coronation_events.0050.c:0 "É hora de humilhar nosso anfitrião."
 guest_intent_coronation_events.0050.d:0 "Não vou me opor [Select_CString( host.IsFemale, 'a', 'ao' )] [host.GetFirstNameNoTooltip] abertamente."
 guest_intent_coronation_events.0050.d_tt:0 "Outro [ruler|E] com a [intent|E] [THIS.Char.GetInvolvedActivityIntent.GetName] ameaçará [host.GetShortUIName] com [coronation_magnificence|E] #N reduzida#!"
 guest_intent_coronation_events.0050.d_tt_acceptance:0 "#alert_trial @alert_icon! [host.GetShortUIName] terá menos probabilidade de ceder#!"
 guest_intent_coronation_events.0050.desc.alone:0 "A escuridão desta noite reflete a escuridão do reinado d[Select_CString( host.IsFemale, 'a', 'o' )] [host.GetTitledFirstNamePossessive]. Vejo [host.GetSheHe] à distância, retornando para seus aposentos.\n\nEsta é minha chance. Posso finalmente lançar luz sobre este reino perverso."
 guest_intent_coronation_events.0050.desc.collective:0 "\"A escuridão desta noite reflete a escuridão do reinado [host.GetHerHim].\" [guest.GetTitledFirstName] murmura, enquanto [host.GetTitledFirstName] passa por nós.\n\n\"Agora, [ROOT.Char.GetFirstNameNoTooltip], é nosso momento de finalmente lançar alguma luz sobre este reino perverso.\""
 guest_intent_coronation_events.0050.e:0 "$guest_intent_coronation_events.0050.d$"
 guest_intent_coronation_events.0050.e_tt:0 "#alert_trial @alert_icon! Você não terá outra oportunidade de perturbar [host.GetShortUIName]#!"
 guest_intent_coronation_events.0050.t:0 "Perturbação"
 guest_intent_coronation_events.0100.a.bad:0 "Não dou resposta."
 guest_intent_coronation_events.0100.a.piety_tt:0 "Todos os outros convidados que apresentaram petições ganham [piety_i]#P [THIS.ScriptValue('major_piety_gain')]#!"
 guest_intent_coronation_events.0100.a.tt:0 "[host.GetShortUIName] aceita sua petição"
 guest_intent_coronation_events.0100.a:0 "\"É um prazer concordar.\""
 guest_intent_coronation_events.0100.aa:0 "#EMP Cuspa aos pés deles.#!"
 guest_intent_coronation_events.0100.b.bad:0 "\"Silêncio, seu insolente! #EMP Silêncio ou morte!#!\""
 guest_intent_coronation_events.0100.b.rejected_detractor_tt:0 "Todos os outros [coronation_detractors|E] envolvidos perdem #N 30#! [opinion|E] de [host.GetShortUIName] #weak (Ódio)#!"
 guest_intent_coronation_events.0100.b.rejected_tt:0 "Todos os outros convidados que apresentaram petições perdem #N 10#! [opinion|E] de [host.GetShortUIName] por #high 20 anos#! #weak (Rejeitado)#!"
 guest_intent_coronation_events.0100.b.tt:0 "[host.GetShortUIName] nega sua petição"
 guest_intent_coronation_events.0100.b:0 "\"Não ouvirei bajuladores.\""
 guest_intent_coronation_events.0100.critical_fail.tt:0 "@warning_icon! #X Isto encerrará a atividade#!"
 guest_intent_coronation_events.0100.desc.alliance:0 "\n\n\"Ofereço-lhe minha lealdade e apoio inabaláveis. Uma aliança entre nós seria a maior das honras.\""
 guest_intent_coronation_events.0100.desc.claim:0 "\n\n\"As fronteiras do reino são rígidas demais, até estáticas. Seria melhor para todos permitir que aqueles com a mão mais firme governem.\""
 guest_intent_coronation_events.0100.desc.control:0 "\n\n\"Gostaria de pedir sua ajuda para fazer cumprir a lei nas terras do [petition_sender.GetPrimaryTitle.GetNameNoTier].\""
 guest_intent_coronation_events.0100.desc.critical_fail:0 "\n\n\"Acabou, [host.GetTitledFirstNameNoTooltip]. Esta é agora a coroação d[Select_CString( claimant_scope.IsFemale, 'a', 'o' )] [claimant_scope.GetTitledFirstNamePossessive].\""
 guest_intent_coronation_events.0100.desc.cultural_acceptance:0 "\n\n\"Pedimos entendimento entre nossos povos. Que nosso apoio a você no início de seu reinado seja lembrado.\""
 guest_intent_coronation_events.0100.desc.development:0 "\n\n\"Peço a você, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord], que concentre sua atenção nas cidades do [petition_sender.GetPrimaryTitle.GetNameNoTier]. Como seu vassalo mais leal, meu coração dói ao ver essas terras abandonadas.\""
 guest_intent_coronation_events.0100.desc.disrupt_loyalists:0 "Um sutil sorriso no rosto [petition_sender.GetHerHim] me faz duvidar de suas intenções honestas."
 guest_intent_coronation_events.0100.desc.faction_discontent:0 "\n\n\"Você conhece a [petition_sender_faction.GetName], não? Nossa causa é justa! Estamos atuando neste lugar... sussurrando entre seus convidados, incitando seus inimigos! Que [ROOT.Char.GetTitleAsName|l] poderos[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], que bela coroação... você não tem nada a temer de nós, certamente...\""
 guest_intent_coronation_events.0100.desc.faction_members:0 "\n\n\"Seus convidados estão ansiosos para ouvir sobre a [petition_sender_faction.GetName]... mas temem sua retaliação. Permita-nos nossos direitos como vassalos — deixe-nos falar de nossas queixas livremente!\""
 guest_intent_coronation_events.0100.desc.friend:0 "\n\n\"Estou aqui para apoiá-lo, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] estimad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Permita-me estar ao seu lado, não importa o que aconteça.\""
 guest_intent_coronation_events.0100.desc.friendship:0 "\"Não é todo dia que se vê um querido amigo ser coroado.\""
 guest_intent_coronation_events.0100.desc.gold:0 "\n\n\"A coroa realmente demonstraria sua grande generosidade se fosse vista recompensando seus súditos pelo apoio.\""
 guest_intent_coronation_events.0100.desc.hook:0 "\n\n\"Eu o(a) apoiaria em seu reinado e espalharia a palavra sobre [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] bo[Select_CString( ROOT.Char.IsFemale, 'a', 'm' )] [ROOT.Char.GetTitleAsNameNoTooltip]. Em troca, só peço que se lembre deste favor.\""
 guest_intent_coronation_events.0100.desc.intro:0 "\"Um momento, por favor...\" [petition_sender.GetTitledFirstName] me cumprimenta, curvando-se obsequiosamente."
 guest_intent_coronation_events.0100.desc.intro_2:0 "\"[ROOT.Char.GetTitledFirstNameNoTooltip]!\" [petition_sender.GetTitledFirstName] se aproxima com os braços abertos."
 guest_intent_coronation_events.0100.desc.intro_3:0 "\"Finalmente, [ROOT.Char.GetTitledFirstName].\" [petition_sender.GetTitledFirstName] se curva em uma reverência exagerada."
 guest_intent_coronation_events.0100.desc.intro_4:0 "\"Querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip].\" [petition_sender.GetTitledFirstName] me cumprimenta com uma reverência obsequiosa e um sorriso intrigante."
 guest_intent_coronation_events.0100.desc.intro_5:0 "\"Lá está você, [ROOT.Char.GetTitledFirstNameNoTooltip]!\" [petition_sender.GetTitledFirstName] caminha até mim com o maior sorriso antes de fazer uma reverência mal ensaiada."
 guest_intent_coronation_events.0100.desc.intro_6:0 "\"Perdoe minha ousadia,\" [petition_sender.GetTitledFirstName] se curva tão baixo que parece que vai se partir ao meio."
 guest_intent_coronation_events.0100.desc.intro_7:0 "\"Ah, bo[Select_CString( ROOT.Char.IsFemale, 'a', 'm' )] [ROOT.Char.GetTitleAsNameNoTooltip],\" [petition_sender.GetTitledFirstName] se curva diante de mim, com suas roupas cuidadosamente arrumadas."
 guest_intent_coronation_events.0100.desc.intro_8:0 "\"Bo[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]!\" [petition_sender.GetTitledFirstName] praticamente grita meu título ao se curvar diante de mim."
 guest_intent_coronation_events.0100.desc.intro_9:0 "\"Finalmente, encontro um momento a sós com você, [ROOT.Char.GetTitledFirstNameNoTooltip],\" [petition_sender.GetTitledFirstName] me cumprimenta com uma reverência bem ensaiada."
 guest_intent_coronation_events.0100.desc.legitimacy:0 "\n\n\"Estamos aqui hoje como testemunhas de sua magnificência e seria uma grande honra se você pudesse dizer algumas palavras em nosso favor.\""
 guest_intent_coronation_events.0100.desc.magnificence_loss:0 "\n\n\"Que farsa!\" [petition_sender.GetSheHe|U] zomba de mim, confiante neste espaço isolado. \"Todos sabem! Um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip|l] cercado por inimigos? Um[Select_CString( host.IsFemale, 'a', '' )] [host.GetTitleAsNameNoTooltip|l] desprezado por seus convidados? Eu cuspo no seu governo, cuspo naqueles que se curvam — eu cuspo nesta coroação!\""
 guest_intent_coronation_events.0100.desc.magnificence_loss_subtle:0 "\n\n\"Sozinho, acima de todos os demais,\" [petition_sender.GetSheHe] diz, sombriamente, \"[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsName], em sua perfeita solidão, é poupado da linguagem vil da discórdia. Mas sinto que devo assegurar [Select_CString( ROOT.Char..IsFemale, 'a', 'ao' )] grande [ROOT.Char.GetTitleAsNameNoTooltip]...\"\n\n\"...que esta reunião está #EMP repleta#! de tais falas desleais.\""
 guest_intent_coronation_events.0100.desc.neutral_1:0 "[ROOT.Char.Custom('GetRandomExteriorDetail')]."
 guest_intent_coronation_events.0100.desc.neutral_2:0 "[petition_sender.Custom('quirk_pos_standalone')], e toma um gole de [ROOT.Char.Custom('RegionalDrink')] antes de continuar:"
 guest_intent_coronation_events.0100.desc.neutral_3:0 "[petition_sender.GetSheHe|U] [petition_sender.Custom('quirk_pos_present')] enquanto um [ROOT.Char.Custom('GetRandomRegionalWildDaytimeBird')] interrompe [petition_sender.GetSheHe] dançando entre seus pés."
 guest_intent_coronation_events.0100.desc.opinion:0 "\n\n\"Seus apoiadores mais leais e seus vassalos mais fiéis: estamos aqui em sua honra e para lhe oferecer nossa ajuda. O que quer que venha.\""
 guest_intent_coronation_events.0100.desc.piety:0 "\n\n\"Por favor, permita-nos orar para que [petition_sender.GetFaith.HighGodName] abençoe seu reinado e o torne longo e próspero.\""
 guest_intent_coronation_events.0100.desc.popular_opinion:0 "\n\n\"Peço que preste atenção ao povo do [petition_sender.GetPrimaryTitle.GetNameNoTier], pois o bem-estar deles é de extrema importância para mim.\""
 guest_intent_coronation_events.0100.desc.prestige:0 "\n\n\"Seria uma grande alegria receber um pouco do prestígio que vem por sermos seus vassalos.\""
 guest_intent_coronation_events.0100.desc.same_house:0 "\"Enche-me de alegria ver a grande honra que você traz à casa [ROOT.Char.GetHouse.GetName].\""
 guest_intent_coronation_events.0100.desc.summer:0 "O brilho do dia faz gotas de suor escorrerem pela testa [petition_sender.GetHerHim]."
 guest_intent_coronation_events.0100.desc.vassal_levies:0 "\n\n\"Meu povo continua morrendo. Os campos estão abandonados, as casas queimadas. Por favor, permita que reduzamos a quantidade de servos para o serviço militar.\""
 guest_intent_coronation_events.0100.desc.vassal_taxes:0 "\n\n\"Os impostos tornaram-se opressivos, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.GetLadyLord]. Nem mesmo os mercadores mais ricos podem mais alimentar seus filhos.\""
 guest_intent_coronation_events.0100.desc.winter:0 "O frio do dia faz o corpo [petition_sender.GetHerHim] tremer."
 guest_intent_coronation_events.0100.t:0 "Peticionários"
 guest_intent_coronation_events_advocate_domain_control_tt:0 "Cada outro [character|E] presente com a [intent|E] #high Defesa de Domínio#! aumenta o [control|E] em seus [counties|E] mantidos em #P +[EmptyScope.ScriptValue('major_county_control_gain')|0]#!"
 guest_intent_coronation_events_advocate_domain_county_opinion_tt:0 "Cada outro [character|E] presente com a [intent|E] #high Defesa de Domínio#! ganha [GetModifier('coronation_advocate_domain_county_opinion_modifier').GetNameWithTooltip] em seus [counties|E] mantidos por #V 10#! anos"
 guest_intent_coronation_events_advocate_domain_development_tt:0 "Cada outro [character|E] presente com a [intent|E] #high Defesa de Domínio#! aumenta o [development_growth|E] em seus [counties|E] mantidos em #P [EmptyScope.ScriptValue('major_development_progress_gain')|0]#!"
 guest_intent_coronation_events_petition_sender_disrupt_tt:0 "@alert_icon!#alert_trial [host.GetShortUIName] decidirá se aceitará ou não sua afronta#!\n$EFFECT_LIST_BULLET$#low #EMP Este é um resultado significativo da sua [intent|E] [THIS.Char.GetInvolvedActivityIntent.GetName]#!#!"
 guest_intent_coronation_events_petition_sender_tt:0 "@alert_icon!#alert_trial [host.GetShortUIName] decidirá se aceitará ou não sua petição#!\n$EFFECT_LIST_BULLET$#low #EMP Este é um resultado significativo da sua [intent|E] [THIS.Char.GetInvolvedActivityIntent.GetName]#!#!"
