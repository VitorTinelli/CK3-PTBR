l_spanish:
 building_buddha_kamakura_01:0 "Grande Buda de Kamakura"
 building_buddha_kamakura_01_desc:0 "O #italic Daibutsu#! de Kamakura é uma venerável estátua de bronze do Buda Amitābha, pesando várias toneladas e decorada com detalhes dourados. Está abrigada por um grande salão inspirado nos templos do sudoeste e cercada por trinta e duas pétalas de lótus."
 building_chocolate_hills_01:0 "Colinas Acobreadas"
 building_chocolate_hills_01_desc:0 "Esta formação geológica é caracterizada por um grande número de colinas arredondadas e cônicas que se estendem uniformemente pela paisagem. Elas são cobertas por uma camada de grama que — durante a estação seca — adquire um tom vívido de marrom e laranja, dando ao terreno uma incomum coloração outonal."
 building_citadel_linan_01:0 "Cidadela Imperial de Lin'an"
 building_citadel_linan_01_desc:0 "Construída ao longo das encostas setentrionais da Colina Fênix, a cidadela imperial serve como sede da corte e de sua administração, abrigando incontáveis estudiosos e oficiais em seus vastos salões e corredores. Embora não seja tão extensa quanto os palácios das capitais do norte, o refinamento e a elegância de seus jardins em terraços e pavilhões mais do que se igualam a eles."
 building_confucius_temple_01:0 "Templo de Confúcio"
 building_confucius_temple_01_desc:0 "O mais antigo e influente de todos os templos confucionistas, este vasto complexo de salões e pátios tem sido um modelo de referência e inspiração para construtores de templos em toda a China e além, com sua disposição geométrica harmoniosa e detalhes refinados. Nas proximidades encontra-se uma floresta silenciosa onde os túmulos de Confúcio e de seus descendentes foram colocados para descanso, formando um importante local de peregrinação para devotos."
 building_dengfeng_observatory_01:0 "Observatório de Gaocheng"
 building_dengfeng_observatory_01_desc:0 "Este local tem sido favorecido para observação astronômica há séculos, devido às suas qualidades geomânticas e à sua simbólica centralidade geográfica dentro da China. A estrutura atual, de forma trapezoidal complexa, funciona como um vasto relógio de sol, com a alta régua central projetando sua sombra na trincheira que divide a plataforma, marcando a passagem do sol."
 building_fanfang_guangzhou_01:0 "Fanfang de Guangzhou"
 building_fanfang_guangzhou_01_desc:0 "O #italic Fanfang#! é uma importante comunidade de mercadores estrangeiros — principalmente árabes e persas muçulmanos que chegaram pelas rotas comerciais marítimas — à qual foi concedido seu próprio distrito a oeste da cidade, com oficiais e costumes próprios. Em seu centro ergue-se uma mesquita de paredes vermelhas coroada por um alto minarete e farol, guiando navios e almas à segurança do porto."
 building_goguryeo_tomb_01:0 "Túmulo de um Rei de Goguryeo"
 building_goguryeo_tomb_01_desc:0 "Este grande túmulo retangular de pedra aparelhada é dito pertencer a um antigo rei de Goguryeo, embora a memória de seu nome tenha se perdido. Os corredores que conduzem ao túmulo são pintados com afrescos coloridos, e no topo da pirâmide ergue-se um pequeno pavilhão de madeira em honra ao sepultado."
 building_gunung_api_01:0 "Gunung Api"
 building_gunung_api_01_desc:0 "Esta montanha que se ergue da selva é sagrada para o povo local. Em meio à umidade e à névoa, suas encostas são cobertas por impressionantes pináculos de calcário e profundas cavernas esculpidas pela água ao longo de incontáveis eras."
 building_ha_long_bay_01:0 "Baía de Ha Long"
 building_ha_long_bay_01_desc:0 "Esta deslumbrante paisagem de ilhotas cársticas e calcárias ergue-se das calmas águas esmeralda do golfo, onde pescadores locais derivam em busca de peixes sob a sombra dos pilares."
 building_iron_lion_cangzhou_01:0 "Leão de Ferro de Cangzhou"
 building_iron_lion_cangzhou_01_desc:0 "O leão monumental é a maior escultura em ferro fundido de toda a China e, sobre suas fortes costas, sustenta um bodisatva suavemente sentado sobre um pedestal de lótus e ricamente decorado com detalhes dourados. Situado próximo a uma planície sujeita a inundações, tornou-se conhecido entre os habitantes locais como um guardião contra as marés crescentes."
 building_izumo_taisha_01:0 "Kizuki Taisha"
 building_izumo_taisha_01_desc:0 "Este grande santuário xintoísta — um #italic taisha#! — foi construído próximo à costa, voltado para o mar. Ele se ergue sobre uma série de enormes pilares e grossos troncos de madeira, elevando seus salões bem acima do solo onde caminham os mortais e em direção ao céu onde vivem os deuses e espíritos da terra."
 building_maijishan_grottoes_01:0 "Grutas de Maijishan"
 building_maijishan_grottoes_01_desc:0 "A montanha de Maijishan há muito é um local de veneração e, ao longo de suas falésias ao sul, consideradas geomanticamente auspiciosas, centenas de santuários foram esculpidos na rocha avermelhada, abrigando estátuas e afrescos coloridos de serenos Budas e bodisatvas. Muitos foram encomendados por famílias urbanas próximas, para as quais o local é um destino ocasional de peregrinação e contemplação meditativa."
 building_muara_takus_01:0 "Candi de Muara Takus"
 building_muara_takus_01_desc:0 "Muitas estruturas compõem o complexo do templo, todas construídas em tijolo e adornadas com detalhes em arenito. No centro erguem-se as grandes estupas de #italic Mahligai#! e #italic Tuo#!, a primeira alta e esguia, a segunda vasta como uma montanha, elevando-se acima dos santuários e terraços menores ao seu redor."
 building_my_son_sanctuary_01:0 "Santuário de My Son"
 building_my_son_sanctuary_01_desc:0 "O maior e mais refinado dos complexos templários cham, o santuário é composto por uma série de recintos espalhados próximos uns dos outros em terras florestadas, cada qual com seus próprios portões, santuários e estupas. As estruturas são todas construídas em tijolo vermelho, dispostas em padrões geométricos e decoradas com vergas de arenito."
 building_pyramid_lingapura_01:0 "Pirâmide de Lingapura"
 building_pyramid_lingapura_01_desc:0 "Esta grande pirâmide escalonada ergue-se da selva como uma montanha sagrada, cada uma de suas sete plataformas abrigando santuários e altares cada vez mais ornamentados. O santuário superior coroa a estrutura e protege em seu interior o sagrado #italic lingam#! de Shiva, o centro de um complexo plano axial de concepção religiosa."
 building_stone_pagoda_01:0 "Pagode de Pedra de Mireuksa"
 building_stone_pagoda_01_desc:0 "Um pagode de nove andares que se ergue sobre um amplo pedestal de pedra, sua alvenaria pálida brilhando sob o céu iluminado pelo sol. É o primeiro dos pagodes de pedra da Coreia, e sua forma e proporções equilibradas fizeram dele um modelo para construtores de templos em toda a península."
 building_suwalesi_megaliths_01:0 "Megalitos de Sulawesi"
 building_suwalesi_megaliths_01_desc:0 "Espalhadas pelos vales do Sulawesi Central encontram-se muitas figuras e ícones megalíticos erguidos pelo povo local para rituais e para honrar os espíritos. Essas efígies, conhecidas como #italic arcas#!, são esculpidas com precisão minimalista, suas formas delineadas por linhas sutis e elegantes."
 building_temples_angkor_01:0 "Templos de Angkor"
 building_temples_angkor_01_desc:0 "Na próspera cidade de Indra, os telhados dourados e os pináculos de seus templos são incontáveis, cada um mais ricamente decorado que o outro com relevos esculpidos e estátuas de divindades e devarajas."
 building_temples_angkor_02:0 "Angkor Wat"
 building_temples_angkor_02_desc:0 "Angkor Wat é um vasto complexo de templos dedicado à divindade Vishnu. Ele foi projetado para representar o Monte Meru, lar dos deuses na mitologia hindu. O complexo é cercado por um impressionante fosso e possui diversos templos com galerias, repletos de arte religiosa, esculturas e relevos."
 building_three_pagodas_dali_01:0 "Três Pagodes de Dali"
 building_three_pagodas_dali_01_desc:0 "Do amplo complexo de templos da família governante da cidade erguem-se três altos pagodes de paredes de tijolo e pedestais de pedra. Eles formam os vértices de um triângulo isósceles, marcando a geometria sagrada do local e emoldurando as montanhas e o lago ao redor."
 building_thuriang_kilns_01:0 "Fornos de Thuriang"
 building_thuriang_kilns_01_desc:0 "Mais de duzentos grandes fornos cobrem o local, o maior centro de produção de celadon da região. As cerâmicas aqui queimadas são conhecidas por sua textura grosseira e de alta queima, além de seu esmalte amarelo-esverdeado característico, sendo comercializadas por todos os mercados do Sudeste Asiático."
