 building_wilwatikta_palace_01:0 "Palácio Wilwatikta"
 building_wilwatikta_palace_01_desc:0 "Um vasto complexo palaciano de pavilhões, salões, templos e pátios, o Wilwatikta é grande o suficiente para assemelhar-se a uma cidade própria. Muros retangulares de tijolo cercam o recinto, e a entrada da avenida processional é marcada por uma série de imponentes portões #italic Paduraksa#!."
 building_yuelu_academy_01:0 "Academia Yuelu"
 building_yuelu_academy_01_desc:0 "Uma das academias de ensino mais prestigiosas da China, Yuelu há muito serve como centro de estudo e exames. Sua disposição é centrada em um pátio principal, do qual se estendem, em simetria equilibrada, salões e pavilhões onde gerações de estudiosos se prepararam para o serviço civil."
