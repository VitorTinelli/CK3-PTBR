 devoted_to_tradition_modifier:0 "Defensor da Tradição"
 devoted_to_tradition_modifier_desc:0 "Rejeitando a associação com estranhos, este personagem é um defensor renomado de seu povo."
 elite_foreign_guard_modifier:0 "Barracas da Guarda de Elite"
 elite_foreign_guard_modifier_desc:0 "Lutadores altamente disciplinados, a maioria de outras terras e povos, estão sediados aqui. Eles treinam habilidades de combate e aguardam o chamado de seu senhor feudal."
 enforcing_cultural_values_modifier:0 "Impondo Valores Culturais"
 enforcing_cultural_values_modifier_desc:0 "Este personagem exige incessantemente que as tradições de sua cultura sejam seguidas."
 eschews_flaunting_of_hostages_modifier:0 "Evita Exibir Reféns"
 eschews_flaunting_of_hostages_modifier_desc:0 "Reféns deste personagem são cuidados e cultivados, não exibidos."
 fervor_gain_reformer_champions_faith:0 "Um governante está revitalizando esta [faith|E]"
 fervor_gain_reformer_converts:0 "Um reformador famoso se converteu"
