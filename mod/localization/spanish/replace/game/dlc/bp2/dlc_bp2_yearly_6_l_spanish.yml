l_spanish:
 a_cultures_great_defender_modifier:0 "O Maior Defensor do Povo"
 a_cultures_great_defender_modifier_desc:0 "Superando uma praga de dúvidas, este personagem se tornou um herói famoso para seu povo e um devoto de sua terra natal."
 adapted_rituals_modifier:0 "Rituais Estrangeiros Adaptados"
 adapted_rituals_modifier_desc:0 "À medida que templos no estilo estrangeiro são construídos, rituais no estilo estrangeiro introduzidos, as pessoas dizem que nada é sagrado para esta pessoa... ou que tudo é?"
 artifact_admired_culture_crown:0 "A Coroa de [root_scope.GetFirstNameNoTooltip]"
 artifact_admired_culture_regalia:0 "Ornamento Opulenta de [advanced_court_owner.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 artifact_advanced_culture_treatise:0 "Um Tratado em [advanced_culture.GetLanguage.GetNameNoTooltip] de [root_scope.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 artifact_famed_culture_crown_desc:0 "Um majestoso acessório no estilo [advanced_culture.GetName], nunca antes visto nas terras [root_scope.GetCulture.GetName], esta coroa dourada de proveniência disputada viajou longe para repousar sobre a cabeça de um visionário [root_scope.GetTitleAsNameNoTooltip]."
 artifact_famed_culture_regalia_desc:0 "Um impressionante conjunto de fineries [advanced_culture.GetName] 'importadas', da qualidade que [advanced_court_owner.GetTitleAsNameNoTooltip] poderia encomendar de seus artesãos mais sofisticados."
 assault_on_tradition_modifier:0 "Ataque à Tradição"
 assault_on_tradition_modifier_desc:0 "Em uma vida, este personagem tornou sua cultura completamente irreconhecível."
 bereft_of_intellectuals_modifier:0 "Desprovido de Intelectuais"
 bereft_of_intellectuals_modifier_desc:0 "Fanáticos expulsaram quase todos os estudiosos estrangeiros, missionários e funcionários deste reino deste personagem."
 bp2_devoted_to_tradition_modifier_conversion_task_desc:0 "$devoted_to_tradition_modifier$"
 bp2_yearly.6000.a.response:0 "[childs_home_liege.GetShortUIName] pode perder [opinion|E] com os colegas [childs_home_liege.GetCulture.GetCollectiveNounNoTooltip]"
 bp2_yearly.6000.a.tt:0 "Defenda a causa do pobre jovem [hosted_child.GetFirstNameNoTooltip], vítima da apatia de(a) [hosted_child.Custom2('RelationToMeShort', SCOPE.sC('childs_home_liege'))] em relação às nossas tradições."
 bp2_yearly.6000.a:0 "Todos saberão do desprezo do [childs_home_liege.GetTitleAsNamePossessiveNoTooltip]!"
 bp2_yearly.6000.b.failure:0 "Alguns escrúpulos mal compreendidos são amargamente agarrados"
 bp2_yearly.6000.b.success:0 "Nossos valores estão profundamente enraizados"
 bp2_yearly.6000.b:0 "Corrigirei a criança eu mesmo."
 bp2_yearly.6000.c:0 "Não me incomode com nossos malditos costumes."
 bp2_yearly.6000.desc.fault.bellicose:0 "\n\n\"A criança nunca foi informada de que tudo o que [hosted_child.GetSheHe] quer deve ser #EMP conquistado#! [hosted_child.GetFirstNameNoTooltip] escolhe a paz com seus colegas em vez de provar [hosted_child.GetHerselfHimself]! Isso é tudo o que [Select_CString( hosted_child.IsFemale, 'a', 'o' )] [hosted_child.Custom('GirlBoy')] sabe!\""
 bp2_yearly.6000.desc.fault.bureaucratic:0 "\n\n\"A criança é uma catástrofe desordenada! [hosted_child.GetSheHe|U] sonha os dias inteiros. [hosted_child.GetSheHe|U] não sabe a diferença entre roupas limpas e sujas! O caos é tudo o que [Select_CString( hosted_child.IsFemale, 'a', 'o' )] [hosted_child.Custom('GirlBoy')] sabe!\""
 bp2_yearly.6000.desc.fault.communal:0 "\n\n\"A criança fala mal da própria mãe! Nunca [hosted_child.GetSheHe] foi alertada sobre isso. [hosted_child.Custom('GirlBoy')] foi deixada para agir sozinh[Select_CString( hosted_child.IsFemale, 'a', 'o' )], ficar sozinh[Select_CString( hosted_child.IsFemale, 'a', 'o' )] e não se importar com os parentes que aguardam [hosted_child.GetSheHe].\""
 bp2_yearly.6000.desc.fault.courtly:0 "\n\n\"A criança não aprendeu nada sobre coisas refinadas! Eu preciso bater na cabeça [hosted_child.GetHerHim] para [hosted_child.GetSheHe] se curvar diante de você, Ó [ROOT.Char.GetTitleAsNameNoTooltip]. [hosted_child.GetSheHe] pode recitar versos? Falar educadamente com o sexo oposto? Não!\""
 bp2_yearly.6000.desc.fault.egalitarian:0 "\n\n\"[hosted_child.GetSheHe|U] nunca foi ensinada a respeitar as pessoas que compartilham nossa terra. A criança imitou o sotaque de um dignitário [realm_minority.GetNameNoTooltip] bleatando como uma ovelha! Isso é educação para [hosted_child.GetSheHe]?\""
 bp2_yearly.6000.desc.fault.egalitarian_no_culture:0 "\n\n\"[hosted_child.GetSheHe|U] nunca foi ensinada a respeitar as pessoas que compartilham nossa terra. A criança imita suas línguas bleatando como uma ovelha! Isso é educação para [hosted_child.GetSheHe]?\""
 bp2_yearly.6000.desc.fault.spiritual:0 "\n\n\"A criança não para para agradecer pela providência de sua comida? [hosted_child.GetSheHe] invoca o divino por ajuda? Não! [hosted_child.GetSheHe|U] foi criada para uma vida sem respeito.\""
 bp2_yearly.6000.desc.fault.stoic:0 "\n\n\"A criança torce o nariz para a beleza de nossa terra natal. [hosted_child.GetSheHe|U] despreza a necessidade de ficar em pé, de lutar - de defender nosso povo! [hosted_child.GetSheHe|U] foi ensinada a interesse mesquinho.\""
 bp2_yearly.6000.desc.intro:0 "Enquanto meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hosted_child'))] [hosted_child.GetName] se apresenta [hosted_child.GetHerselfHimself], [tutor.GetName] relata uma semana de ensino fracassado e frustrações."
 bp2_yearly.6000.desc.mid:0 "\n\nA ira de [tutor.GetFirstNamePossessiveNoTooltip] é dirigida ao(a) [hosted_child.Custom2('RelationToMeShort', SCOPE.sC('childs_home_liege'))] da criança.\n\n\"Há alguma"
 bp2_yearly.6000.desc.outro:0 "em [childs_home_liege.GetTitledFirstName]? Como jovens adequados da [ROOT.Char.GetCulture.GetNameNoTooltip] podem surgir de uma corte onde nada lhes é ensinado sobre nossas tradições?"
 bp2_yearly.6000.desc.value.bellicose:0 "fogo e ardor"
 bp2_yearly.6000.desc.value.bureaucratic:0 "bom senso"
 bp2_yearly.6000.desc.value.communal:0 "amor pela parentela"
 bp2_yearly.6000.desc.value.courtly:0 "consideração por maneiras nobres"
 bp2_yearly.6000.desc.value.egalitarian:0 "graça social"
 bp2_yearly.6000.desc.value.spiritual:0 "respeito por nossos rituais sagrados"
 bp2_yearly.6000.desc.value.stoic:0 "senso de dever para com o povo [childs_home_liege.GetHerHim]"
 bp2_yearly.6000.t:0 "Não do Jeito [ROOT.Char.GetCulture.GetNameNoTooltip]"
 bp2_yearly.6001.a.tt:0 "Os educadores de minha corte precisam de uma conversa séria sobre valores."
 bp2_yearly.6001.a:0 "Eu devo abordar isso! Devemos provar que [childs_host.GetSheHe] está errado!"
 bp2_yearly.6001.b.tt:0 "Eu não sou o [ROOT.Char.GetCulture.GetNameNoTooltip] típico, mas posso ser um excepcional."
 bp2_yearly.6001.b:0 "Vou agir como eu quiser."
 bp2_yearly.6001.desc.insult.bellicose:0 "fracos"
 bp2_yearly.6001.desc.insult.communal:0 "vadios"
 bp2_yearly.6001.desc.insult.courtly:0 "brutos"
 bp2_yearly.6001.desc.insult.egalitarian:0 "desordeiros"
 bp2_yearly.6001.desc.insult.spiritual:0 "hereges"
 bp2_yearly.6001.desc.insult.stoic:0 "vilões"
 bp2_yearly.6001.desc.insult_bureaucratic:0 "vagabundos"
 bp2_yearly.6001.desc.outro:0 "em sua corte.\n\nTodos os líderes de nosso povo sabem disso. Eu me certifiquei disso."
 bp2_yearly.6001.desc:0 "Ter seu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hosted_child'))] [hosted_child.GetName] sob meus cuidados revelou uma verdade lamentável: você se importa pouco com as virtudes tradicionais da [ROOT.Char.GetCulture.GetNameNoTooltip]. Moleques, que não sabem nada sobre nossos modos, crescem como"
 bp2_yearly.6001.opening:0 "[childs_host.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_yearly.6010.a.tt:0 "...para a minha bolsa."
 bp2_yearly.6010.a:0 "Sim, vamos ver a 'caridade' que podem oferecer..."
 bp2_yearly.6010.adult:0 "Está desprovido de todos os confortos.\"\n\nLançando um olhar mordaz na minha direção, [sad_boi.GetSheHe] acrescenta: \"Essa música será meu apelo por ajuda através desta infeliz captura. Alguma quantia pequena... caso meu povo ainda se importe comigo...\""
 bp2_yearly.6010.b.tt:0 "Minha corte não pode ser cantada como um lugar de miséria!"
 bp2_yearly.6010.b:0 "Infeliz?! #EMP Posso ajudar?#!"
 bp2_yearly.6010.c.failure:0 "Negar a verdade das letras [sad_boi.GetHerHim] perturba [sad_boi.GetFirstNameNoTooltip]"
 bp2_yearly.6010.c.success:0 "[sad_boi.GetSheHe|U] dará a [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] outra chance"
 bp2_yearly.6010.c.tt:0 "Todos nós, nascidos aqui ou não, devemos suportar as dificuldades com dignidade."
 bp2_yearly.6010.c.tt_education:0 "O resultado da educação de [sad_boi.GetFirstNamePossessive] melhorará"
 bp2_yearly.6010.c:0 "Eu devo ensinar a [sad_boi.GetSheHe] que o seu lugar é aqui."
 bp2_yearly.6010.child:0 "Estou muito infeliz aqui.\"\n\nOlhando para mim com lágrimas nos olhos, [Select_CString( sad_boi.IsFemale, 'a', 'o' )] [sad_boi.Custom('GirlBoy')] acrescenta: \"Ouvir essa música vai influenciar minha família! Eles enviarão algo para tornar meu #EMP exílio#! suportável, se... ainda se importarem comigo...\""
 bp2_yearly.6010.d.tt:0 "Que esse lamento seja cantado longa e amplamente: sua beleza importa mais do que seu conteúdo."
 bp2_yearly.6010.d:0 "Uma bela composição, na verdade."
 bp2_yearly.6010.desc:0 "\"#EMP Eu tenho muitos amigos, mas seus presentes são poucos...#!\" canta [sad_boi.GetFirstName], com a voz trêmula de emoção.\n\n[Select_CString( sad_boi.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sad_boi'))] joga seu instrumento de lado, chorando: \"Chega de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier]!"
 bp2_yearly.6010.outro:0 "\n\n[sad_boi.GetSheHe|U] retoma a melodia triste mais uma vez, um lar distante nos olhos [sad_boi.GetHerHim]."
 bp2_yearly.6010.t:0 "Nenhum(a) [sad_boi.GetWomanMan|U] Aprisionado(a)"
 bp2_yearly.6020.a.failure:0 "Apenas imaturidade, eu suponho..."
 bp2_yearly.6020.a.no_secret:0 "Você não aprende nada de consequência"
 bp2_yearly.6020.a.non_family_secret:0 "Você descobre um [secret|e] do círculo interno da [court|E] de [no_no_doer.GetShortUINamePossessive]"
 bp2_yearly.6020.a.secret:0 "Você descobre um [secret|e] guardado pela família de [snitch.GetShortUINamePossessive]"
 bp2_yearly.6020.a.success:0 "Um conto deliciosamente sórdido"
 bp2_yearly.6020.a:0 "Continue..."
 bp2_yearly.6020.b.discretion:0 "[snitch.GetShortUIName] é muito menos propenso a revelar seus [secrets|E]"
 bp2_yearly.6020.b.tt:0 "[snitch.GetFirstNameNoTooltip] deveria favorecer a virtude da discrição em vez de fofocar."
 bp2_yearly.6020.b:0 "Uma língua solta leva à desonra."
 bp2_yearly.6020.child:0 "no seu rosto pequeno.\n\n\"Tenho uma história, [ROOT.Char.GetTitleAsNameNoTooltip]. Uma história que inventei das coisas que vi! Mas... não deveria dizer. Prometi que não diria.\"\n\n[snitch.GetSheHe|U] ri com deleite malicioso, se deleitando com um raro poder sobre os mais velhos.\n\n\"Levado!\" comemora [snitch.GetFirstNameNoTooltip]."
 bp2_yearly.6020.desc:0 "Enquanto compartilho as últimas notícias da corte de [snitch.GetHomeCourt.GetTitledFirstNamePossessive], meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))] [snitch.GetName] parece estranhamente divertido, com um sorriso distante"
 bp2_yearly.6020.family:0 "\"A família pode ser tão levada!\""
 bp2_yearly.6020.liege:0 "\"Tão sagrado, tão levado!\""
 bp2_yearly.6020.pay_vassals:0 "Você paga [gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]#! a todos os seus [powerful_vassals|E] #EMP e#! perde [gold_i|E]#N [root_scope.MakeScope.ScriptValue('minor_gold_value')]"
 bp2_yearly.6020.t:0 "Crianças Dizem Coisas Engraçadas"
 bp2_yearly.6020.youth:0 "no rosto adolescente e oleoso [snitch.GetHerHim].\n\n\"Tenho uma história, [ROOT.Char.GetTitleAsNameNoTooltip]: você acabou de me lembrar dela. Algo para nunca repetir! Mas... eu era tão pequeno. Parece que foi há tanto tempo agora.\"\n\n[snitch.GetSheHe|U] ri com deleite malicioso, se deleitando com esse raro poder sobre aqueles que criaram [snitch.GetSheHe].\n\n\"Levado!\" comemora [snitch.GetFirstNameNoTooltip]."
 bp2_yearly.6030.a.evade:0 "#high [snitch.GetFirstName]#! não compartilha nada útil"
 bp2_yearly.6030.a.failure:0 "[snitch.GetFirstNameNoTooltip] escapa das perguntas"
 bp2_yearly.6030.a.no_secret:0 "[snitch.GetFirstName] sabe... nada de consequência"
 bp2_yearly.6030.a.success:0 "Você aprende tudo o que [snitch.GetFirstNameNoTooltip] sabe"
 bp2_yearly.6030.a:0 "Posso arrancar os segredos de [warden.GetPrimaryTitle.GetNameNoTierNoTooltip]..."
 bp2_yearly.6030.b.failure:0 "[snitch.GetFirstNameNoTooltip] não revela [secrets|E]"
 bp2_yearly.6030.b.rewarded:0 "#high [snitch.GetFirstName]#! torna-se muito mais propenso a se juntar aos seus [schemes|E]"
 bp2_yearly.6030.b.tt:0 "Deixe [snitch.GetSheHe] saber o quanto eu recompenso agentes e informantes!"
 bp2_yearly.6030.b:0 "Pelo serviço à sua família - recompensa!"
 bp2_yearly.6030.c.honor:0 "[rulers|E] são mais propensos a oferecer e exigir [hostages|E] com você"
 bp2_yearly.6030.c.hostage_secrets:0 "@alert_icon! #alert_trial Você ganhará [tyranny|E] ao pressionar [secrets|E] de [hostages|E]#!"
 bp2_yearly.6030.c.tt:0 "As regras do acordo são rígidas e invioláveis."
 bp2_yearly.6030.c:0 "Sem honra, o período de reféns não vale nada."
 bp2_yearly.6030.desc:0 "[Select_CString( snitch.IsFemale, 'Minha', 'Meu' )] [snitch.Custom('ComplimentAdjective')] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('snitch'))] [snitch.GetFirstName] ilumina uma manhã nebulosa, contando-me sobre o período em que esteve refém sob os cuidados de [warden.GetNamePossessive].\n\n[snitch.GetSheHe|U] retornou muito mudado: mais sábio, mais observador. Um leal [snitch.GetDynastyHouseName], bem adaptado à vida em um lugar estrangeiro.\n\nUm leal [snitch.GetDynastyHouseNameNoTooltip]... talvez haja valor em tirar os olhos da nossa família da corte de [warden.GetTitledFirstNamePossessiveNoTooltip]...?"
 bp2_yearly.6030.hostage_normal:0 "\n\nO que, se é que algo, [snitch.GetFirstNameNoTooltip] sabe?"
 bp2_yearly.6030.hostage_reticent:0 "\n\n[snitch.GetFirstNameNoTooltip], no entanto, parece muito relutante em ser meu informante. Talvez ela até tenha sido advertida contra isso."
 bp2_yearly.6030.maybe_secret:0 "#high [snitch.GetFirstName]#! #EMP talvez#! compartilhe um [secret|E] do círculo interno de [warden.GetShortUINamePossessive]"
 bp2_yearly.6030.refuse_reward:0 "#high [snitch.GetFirstName]#! não está ajudando e não se importa"
 bp2_yearly.6030.t:0 "Olhos da Família"
 bp2_yearly.6040.a.reforms:0 "Você tenta reformar e avançar sua [culture|E], [court|E] e [realm|E], seguindo o modelo [advanced_culture.GetName]"
 bp2_yearly.6040.a.tt:0 "Introduza aprendizados estrangeiros para substituir os costumes do meu povo - ou leve-os a uma glória maior."
 bp2_yearly.6040.a.warning:0 "@alert_icon! #alert_trial Isso será desafiador e custoso. Certifique-se de estar preparado.#!"
 bp2_yearly.6040.a:0 "Meu reinado pode ser um renascimento."
 bp2_yearly.6040.b.no_reforms:0 "Você não considerará essas reformas novamente"
 bp2_yearly.6040.b.promote_culture:0 "A [councillor_task|E] de [promote_culture|E] será mais eficaz por #high 25 anos#!"
 bp2_yearly.6040.b.tt:0 "Abraçarei nossas exquisitas maneiras [ROOT.Char.GetCulture.GetNameNoTooltip] e virarei as costas para tudo o mais!"
 bp2_yearly.6040.b:0 "Por que sequer considerar desafiar nossas tradições?"
 bp2_yearly.6040.c.recurring:0 "Esse ímpeto de reforma provavelmente surgirá novamente"
 bp2_yearly.6040.c:0 "Agora não é o momento."
 bp2_yearly.6040.desc:0 "Observo os jovens [ROOT.Char.GetCulture.GetCollectiveNoun] mais novos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] em seus estudos. Lentos para aprender, indisciplinados, eles brigam como seus pais.\n\nNada parecido com os [ROOT.Char.GetCulture.GetCollectiveNoun] da maravilhosa [childhood_location.GetCounty.GetTitle.GetNameNoTier]. O reino deles é de ordem, de grandes obras e grandes ideias. Enquanto eu estava"
 bp2_yearly.6040.education:0 "educado"
 bp2_yearly.6040.hostage:0 "refém"
 bp2_yearly.6040.outro:0 "lá, fui iluminado.\n\nPassei a ver meu povo como os primitivos que são.\n\nEu poderia mudar isso. Armado com os conhecimentos de [advanced_culture.GetNameNoTooltip] da minha juventude... talvez eu devesse nos liderar pelo caminho incerto da reforma?"
 bp2_yearly.6040.t:0 "Tudo O Que Não Somos"
 bp2_yearly.6050.a.tt:0 "Uma nova jóia brilhará entre as cidades das terras civilizadas; seus habitantes prosperarão, assim como eu."
 bp2_yearly.6050.a:0 "Minha nova e grandiosa capital prosperará!"
 bp2_yearly.6050.b.tt:0 "Essas exações são costumeiras em terras estrangeiras - e assim o são aqui, agora!"
 bp2_yearly.6050.b:0 "Nós, povos civilizados, não #EMP damos#!. Nós tributamos e construímos."
 bp2_yearly.6050.c.tt:0 "Vou favorecer os magnatas de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] acima de tudo, sempre."
 bp2_yearly.6050.c:0 "Não posso me afastar dos meus nobres!"
 bp2_yearly.6050.county_control_loss:0 "O nível de [control|E] mudará por #negative_value -30#! em cada [county|E] do seu [domain|E]"
 bp2_yearly.6050.county_opinion_modifier:0 "Cada [county|E] não-[advanced_culture.GetName] em seu [domain|E] recebe [GetModifier('unprecedented_taxation_modifier').GetNameWithTooltip]"
 bp2_yearly.6050.desc:0 "Sob minhas ordens, as primeiras vias recém-abertas e modestos postos avançam a partir de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTier] - construídos no estilo das grandes estradas, fortalezas e repartições fiscais da [advanced_culture.GetName].\n\nAinda assim, minha capital não é uma [childhood_location.GetCounty.GetTitle.GetNameNoTier] brilhante, nem [ROOT.Char.GetPrimaryTitle.GetNameNoTier] é uma terra populosa rica em comércio e artesanato. #EMP Ainda não.#!\n\nA meu lado, [noble_representative.GetTitledFirstName] olham com desconfiança para as minhas novas construções, meus arquitetos estrangeiros.\n\n\"Você enriquece #EMP comerciantes#! e #EMP plebeus#!,\" zomba meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('noble_representative'))], \"quando sua nobreza fiel poderia estar erguendo novos salões com sua generosidade!\""
 bp2_yearly.6050.every_county_development:0 "O nível de [development|E] em cada [county|E] do seu [domain|E] mudará por #positive_value +1#!"
 bp2_yearly.6050.reaffirmation_path:0 "@alert_icon! #alert_trial Isso #EMP rapidamente#! contribui para reafirmar os costumes de sua [root_scope.GetCulture.GetNameNoTooltip]#!"
 bp2_yearly.6050.reform_path:0 "@alert_icon! #alert_trial Isso contribui para suas amplas reformas [advanced_culture.GetNameNoTooltip]#!"
 bp2_yearly.6050.t:0 "Pedra, Ferro, Argila e Taipa"
 bp2_yearly.6060.a.tt:0 "Quem mais poderia unir nossas fé? E que fé melhor para trazer ordem espiritual e iluminação para [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]?"
 bp2_yearly.6060.a:0 "Eu vivi apenas para isso. Eu sou um [advanced_culture_faith.GetAdherentNameNoTooltip]."
 bp2_yearly.6060.b.conversion_bonus:0 "[convert_county|E] Velocidade de Progresso: #P +[EmptyScope.ScriptValue('zealous_proselytizer_percentage')|0]%#!"
 bp2_yearly.6060.b.tt:0 "Vamos emular como as fé estrangeiras são organizadas, como elas alcançam os céus e todos os aspectos da vida diária."
 bp2_yearly.6060.b:0 "A fé deve ser construída, deve ser ordenada."
 bp2_yearly.6060.c.nerd:0 "Você diminui todas as habilidades, exceto [learning|E] por #negative_value 2#!"
 bp2_yearly.6060.c.tribal_warning:0 "@warning_icon! #X Você só poderá construir $building_type_generic_university$ quando não tiver mais um [tribal_government|E]#!"
 bp2_yearly.6060.c.tt:0 "E se eu for o mais instruído e sábio de todos, se eu for dedicado, meu reino certamente prosperará!"
 bp2_yearly.6060.c:0 "O aprendizado é a fonte de toda a força."
 bp2_yearly.6060.d.tt:0 "Não há nada ostensivo, nada complicado, sobre nossa verdade. Isso é correto."
 bp2_yearly.6060.d:0 "E ainda sinto... #EMP nós#! somos os verdadeiros crentes!"
 bp2_yearly.6060.desc:0 "Os ritos sordidos do [ROOT.Char.GetCulture.GetName], nosso caminho do [ROOT.Char.GetFaith.GetName]... somos apenas crianças chorando na escuridão?\n\nQuando [clergy_representative.GetFirstName] e nossos [clergy_representative.GetFaith.PriestNeuterPlural] pequenos de mente suplicam pelo favor de [ROOT.Char.GetFaith.HighGodName], minha mente é levada pelo movimento das vestes sagradas [advanced_culture.GetName], apoderada pela verdade de sua retórica. Anseio pelas salas de aprendizado de [childhood_location.GetCounty.GetTitle.GetNameNoTier], para vagar pelos mistérios ali revelados.\n\n"
 bp2_yearly.6060.different_faith:0 "Será que todas as almas de um reino, com poucos templos e menos cartas... dependem dos meus lábios para compartilhar a verdade de [advanced_culture_faith.GetName]?"
 bp2_yearly.6060.same_faith:0 "Para os [advanced_culture.GetCollectiveNounNoTooltip], a fé vive na grandiosidade, fortalecida pelo estudo. Ela é trazida dos mais altos aos mais baixos e, ao contrário de nossas superstições, ela permanece constante."
 bp2_yearly.6060.t:0 "Estudos na Eternidade"
 bp2_yearly.6070.a.tt:0 "Não estou interessado nos métodos da grandiosidade, mas nos métodos da civilização."
 bp2_yearly.6070.a:0 "Prefiro aprender como [advanced_court_owner.GetTitleAsNameNoTooltip] governa."
 bp2_yearly.6070.artifact_warning:0 "@warning_icon! #X [advanced_court_owner.GetTitledFirstName] pode querer que eles sejam devolvidos#!"
 bp2_yearly.6070.b.tt:0 "Pelos melhores trajes [advanced_culture.GetNameNoTooltip] — o preço mais elevado! Não importa a sua... procedência..."
 bp2_yearly.6070.b:0 "Traga-nos modos civilizados, vestimentas magníficas."
 bp2_yearly.6070.c.tt:0 "Se eu realmente dominar [advanced_culture.GetLanguage.GetNameNoTooltip], então serei igual, sem necessidade de adornos."
 bp2_yearly.6070.c:0 "A linguagem do poder é a principal entre os adereços."
 bp2_yearly.6070.change_clothes:0 "Alguns de seus súditos se vestirão como [advanced_culture.GetCollectiveNoun] enquanto você governar"
 bp2_yearly.6070.change_clothes_heir:0 "Alguns de seus súditos se vestirão como [advanced_culture.GetCollectiveNoun], enquanto você ou seu [primary_heir|E] atual governar"
 bp2_yearly.6070.court_language_discount:0 "Você paga muito menos [prestige|E] ao mudar a [court_language|E]"
 bp2_yearly.6070.d.tt:0 "Estou sendo visto como parente deste verme? Fazer um exemplo [foreign_official.GetHerHim] deve mudar isso!"
 bp2_yearly.6070.d:0 "Você, [advanced_culture.GetNameNoTooltip], é um inseto vil!"
 bp2_yearly.6070.desc:0 "\"Por muito tempo servi [advanced_court_owner.GetTitledFirstName], o maior [advanced_culture.GetName] que vive,\" afirma [foreign_official.GetName], um suposto oficial de [advanced_court_owner.GetPrimaryTitle.GetNameNoTier].\n\n\"A poesia de seu poder, as modas que deslumbram o mundo, as danças cortesãs, os símbolos e tudo mais — você deseja participar da cultura suprema, [ROOT.Char.GetTitleAsNameNoTooltip]? Posso ajudar você. Eu sei onde #EMP inimitáveis#! riquezas estão escondidas.\"\n\nMinhas ambições reformistas atraem essas criaturas amorais, igualmente ambiciosas: eles observam meu interesse pela mudança... com oportunismo ardente."
 bp2_yearly.6070.t:0 "Onde o Mundo Todo Contempla"
 bp2_yearly.6080.a.tt:0 "Meus nobres certamente podem ser convencidos a não se importar, desde que apenas o povo comum seja suplantado..."
 bp2_yearly.6080.a:0 "Eu poderia acomodá-los como migrantes pacíficos?"
 bp2_yearly.6080.add_both_courtiers:0 "[foreign_mercenary_1.GetName] e [foreign_mercenary_2.GetName] juntam-se à sua corte"
 bp2_yearly.6080.b.failure:0 "[angry_vassal.GetFirstNameNoTooltip] luta para sair"
 bp2_yearly.6080.b.success:0 "O dissidente é capturado"
 bp2_yearly.6080.b.tt:0 "Vamos ver os amantes da tradição tentarem se organizar na ausência dele!"
 bp2_yearly.6080.b:0 "Um líder rebelde! #EMP Pegue [angry_vassal.GetSheHe]!#"
 bp2_yearly.6080.c.tt:0 "Nosso povo está renascendo. Obrigações primitivas, dívidas antigas, não importam mais. Apenas completar minhas reformas importa."
 bp2_yearly.6080.c:0 "Todos os laços antigos são perdidos: não serei detido."
 bp2_yearly.6080.d.tt:0 "Nosso povo, nossa causa comum, deve nos impulsionar e nos unir: devemos nos comprometer uns com os outros."
 bp2_yearly.6080.d:0 "O sangue do meu povo não deve ser derramado."
 bp2_yearly.6080.desc:0 "Um grupo de mercenários [advanced_culture.GetName], liderado por dois líderes experientes, busca servir como guarda do palácio e treinar minhas forças. Eles aguardam do lado de fora dos meus portões. Dentro, meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('angry_vassal'))] [angry_vassal.GetTitledFirstName] uiva para mim.\n\n\"#EMP Traidor [ROOT.Char.GetTitleAsNameNoTier], cão do [advanced_culture.GetCollectiveNounNoTooltip]!#! Você deseja ser um tirano diferente de qualquer verdadeiro [ROOT.Char.GetCulture.GetName], empunhando leis estrangeiras e poder estrangeiro? Você considera nossos costumes perdidos?\"\n\n\"Então nossos juramentos de lealdade também devem ser descartados!\" diz [angry_vassal.GetSheHe], cercado por sua escolta armada. \"Nós vassalos concordamos: a menos que os [advanced_culture.GetCollectiveNounNoTooltip] partam, nossos laços com você não valem nada!\""
 bp2_yearly.6080.hook_removal:0 "@warning_icon! #X Você perde todos os [hooks|E] que tem em [vassals|E]#!"
 bp2_yearly.6080.hook_removal_vassals:0 "[vassals|E] perdem todos os [hooks|E] que têm em você"
 bp2_yearly.6080.pop_opinion_modifier:0 "Cada [county|E] não-[advanced_culture.GetName] no mesmo [duchy|E] ganha #N [GetModifier('forcible_resettlement_modifier').GetNameWithTooltip]#!"
 bp2_yearly.6080.t:0 "Sangue [ROOT.Char.GetCulture.GetNameNoTooltip]"
 bp2_yearly.6080.truce_removal:0 "@warning_icon! #X Todas as [truces|E] entre você e seus [vassals|E] foram cancelados#!"
 bp2_yearly.6090.a.bow:0 "Todo o mundo deveria se curvar diante de nós."
 bp2_yearly.6090.a.governed:0 "Todo o mundo deveria prestar atenção à nossa sabedoria."
 bp2_yearly.6090.a.kin:0 "Todo o mundo deveria responder ao nosso parentesco."
 bp2_yearly.6090.a.strength:0 "Todo o mundo deveria sentir nossa força."
 bp2_yearly.6090.a.tt:0 "Vamos reacender nossos antigos laços — em um fogo para consumir todos aqueles que duvidarem dos [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
 bp2_yearly.6090.a.virtue:0 "Todo o mundo deveria se maravilhar com nossa virtude."
 bp2_yearly.6090.a.zeal:0 "Todo o mundo deveria conhecer nosso zelo."
 bp2_yearly.6090.b.tt:0 "Meu coração se parte com a ideia de perder tudo o que temos. Vamos permanecer resolutos, permanecer devotos: isso nunca pode acontecer."
 bp2_yearly.6090.b:0 "Devemos defender nossa terra, nossas famílias, para sempre."
 bp2_yearly.6090.burn_else:0 "A maioria dos acessórios [advanced_culture.GetNameNoTooltip] queimam, enquanto meus nobres [ROOT.Char.GetCulture.GetName] reverenciam meu nome.\n\n"
 bp2_yearly.6090.burn_letters:0 "Os vários presentes enviados por [advanced_court_owner.GetTitledFirstName] queimam, enquanto meus nobres [ROOT.Char.GetCulture.GetName] reverenciam meu nome.\n\n"
 bp2_yearly.6090.desc:0 "Eu persegui a aprovação [advanced_culture.GetName], desejei as trajes estrangeiras, me fiz de tolo pelos meus sonhos. Não mais.\n\n"
 bp2_yearly.6090.no_invasion_req:0 "Seu [casus_belli|E] de Invasão não possui requisito de [prestige_level|E]"
 bp2_yearly.6090.non_tribal_invasion:0 "Você pode usar o [casus_belli|E] de Invasão uma vez"
 bp2_yearly.6090.outro:0 "\n\nMinha juventude em [childhood_location.GetCounty.GetTitle.GetNameNoTier] me levou ao erro. Os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] são meu povo. E eles não precisam de 'civilização.'"
 bp2_yearly.6090.reaffirm_maa:0 "Eles arriscavam sua honra, suas vidas, para impedir que eu entregasse [ROOT.Char.GetPrimaryTitle.GetNameNoTier] a estrangeiros."
 bp2_yearly.6090.reaffirm_realm:0 "Enquanto eu despedaçava nossas terras, eles construíam salões justos e armavam nobres cavaleiros $knight_culture_player_plural_no_tooltip_lowercase$."
 bp2_yearly.6090.reaffirm_ritual:0 "Mesmo quando eu desprezava suas antigas crenças, eu permanecia em suas orações."
 bp2_yearly.6090.reaffirm_social:0 "À medida que [advanced_culture.GetCollectiveNounNoTooltip] sedentos de poder exploravam minha cobiça, meus vassalos pediam cautela."
 bp2_yearly.6090.t:0 "Um Direito de Nascença, Renovado"
 bp2_yearly.6090.traditionalist_traditions:0 "Você receberá descontos em [traditions|E] relacionadas"
 bp2_yearly.6090.tribal_invasion:0 "Você pode usar o [casus_belli|E] de Invasão uma vez adicional"
 bp2_yearly.6091.a.tt:0 "...e nada mais."
 bp2_yearly.6091.a:0 "Vamos celebrar tudo o que somos."
 bp2_yearly.6091.aggressive:0 "Sua [culture|E] agora paga menos [prestige|E] por [GetCultureTradition('tradition_ruling_caste').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_zealous_people').GetName], [GetCultureTradition('tradition_faith_bound').GetName] e [GetCultureTradition('tradition_warrior_culture').GetName]"
 bp2_yearly.6091.defense:0 "e sua defesa nos próximos anos."
 bp2_yearly.6091.defensive:0 "Sua [culture|E] agora paga menos [prestige|E] por [GetCultureTradition('tradition_isolationist').GetName], [GetCultureTradition('tradition_hereditary_hierarchy').GetName], [GetCultureTradition('tradition_tribe_unity').GetName], [GetCultureTradition('tradition_staunch_traditionalists').GetName], [GetCultureTradition('tradition_stalwart_defenders').GetName], [GetCultureTradition('tradition_zealous_people').GetName] e [GetCultureTradition('tradition_faith_bound').GetName]"
 bp2_yearly.6091.dominance:0 "e seu destino nos próximos anos."
 bp2_yearly.6091.t:0 "Um Povo Imutável"
 bp2_yearly.6091:0 "Entre os cortesãos dos meus salões resplandecentes e a ralé da aldeia, minhas reformas abortivas tiveram um impacto distintivo.\n\nA agitação endureceu o coração de cada [ROOT.Char.GetCulture.GetName] contra estranhos. Suspeita e hostilidade reinam, mas também a prática amorosa de nossas antigas tradições, festivais alegres e um orgulhoso espírito marcial.\n\nMeus conselheiros me dizem as esperanças do povo: que líderes como eu olharão para a tradição, fé,"
 bp2_yearly.6100.1_more_innovation:0 "[culture|E] [root_scope.GetCulture.GetName] recebe #high 1#! [innovation|E] adicional da cultura [advanced_culture.GetName]"
 bp2_yearly.6100.2_more_innovations:0 "[culture|E] [root_scope.GetCulture.GetName] recebe #high 2#! [innovations|E] adicionais da cultura [advanced_culture.GetName]"
 bp2_yearly.6100.a.tt:0 "Mudanças maiores são custosas, todos os pequenos proprietários de terra não são facilmente persuadidos... mas nós poderíamos adaptar ainda mais dos [advanced_culture.GetCollectiveNounNoTooltip]!"
 bp2_yearly.6100.a:0 "Este é o meu legado - ele deve ser absoluto!"
 bp2_yearly.6100.b.tt:0 "Meu povo não precisa ser empurrado mais além. Eu já os conduzi ao início de uma nova era."
 bp2_yearly.6100.b:0 "Eu consegui!"
 bp2_yearly.6100.desc:0 "Os anos de zombaria e suspeita, sacrifício e agitação... foram para isso.\n\nEnquanto meu [ROOT.Char.GetCulture.GetCollectiveNoun] se curva diante de mim, as últimas palavras do meu maior édito de reforma são recitadas estrondosamente. Governaremos de uma maneira nova, inspirada por [advanced_culture.GetName]. Construiremos até rivalizarmos com as glórias de [childhood_location.GetCounty.GetTitle.GetNameNoTier]. E cada criança [ROOT.Char.GetCulture.GetNameNoTooltip] aprenderá as habilidades — conhecerá as maravilhas — que eu conheci na minha juventude.\n\nMuito foi alterado!"
 bp2_yearly.6100.gained_1_innovation:0 "[culture|E] [root_scope.GetCulture.GetName] recebeu #high 1#! [innovation|E] aleatória da cultura [advanced_culture.GetName]"
 bp2_yearly.6100.gained_2_innovations:0 "[culture|E] [root_scope.GetCulture.GetName] recebeu #high 2#! [innovations|E] aleatórias da cultura [advanced_culture.GetName]"
 bp2_yearly.6100.outro:0 "\n\nEu ainda sou [ROOT.Char.GetCulture.GetNameNoTooltip]. Mas eu sou o novo [ROOT.Char.GetCulture.GetNameNoTooltip]."
 bp2_yearly.6100.reform_court:0 "Uma nova elegância revitaliza minha corte."
 bp2_yearly.6100.reform_faith:0 "Minha fé está focada, refinada, sublime."
 bp2_yearly.6100.reform_maa:0 "Armas de ferro e palavras da lei defendem meu governo."
 bp2_yearly.6100.reform_realm:0 "O comércio prospera, os assentamentos crescem e mais pessoas migram para meu [ROOT.Char.GetPrimaryTitle.GetNameNoTier] renascido a cada dia."
 bp2_yearly.6100.t:0 "Meu [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip], Renascido!"
 bp2_yearly.61020.c.tt:0 "Posso ser mais charmoso do que esse chato e fazer com que os parentes [hostage_giver.GetHerHim] prefiram minha companhia à [hostage_giver.GetSheHe]!"
 bp2_yearly.6110.a:0 "[considered_tradition_1.GetNameNoTooltip]"
 bp2_yearly.6110.b:0 "[considered_tradition_2.GetNameNoTooltip]"
 bp2_yearly.6110.c:0 "[considered_tradition_3.GetNameNoTooltip]"
 bp2_yearly.6110.combat:0 "Observo meus $knight_culture_player_plural_no_tooltip_lowercase$ domésticos ociosos sob o sol da tarde, contando uns aos outros histórias de feitos realizados.\n\nEles tiveram suas vitórias e lutam bem no estilo tradicional [ROOT.Char.GetCulture.GetName]. No entanto... penso nas habilidades e táticas de um [advanced_culture.GetName] armado. Deveriam meus lutadores considerar adaptar suas formas de fazer guerra?\n\nOu talvez devêssemos abraçar alguma outra forma de influência [advanced_culture.GetNameNoTooltip]?"
 bp2_yearly.6110.d:0 "[considered_tradition_4.GetNameNoTooltip]"
 bp2_yearly.6110.e.tt:0 "Eu simplesmente não consigo ver os [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] se adaptando a essas práticas."
 bp2_yearly.6110.e:0 "Prefiro considerar outras mudanças..."
 bp2_yearly.6110.realm:0 "Observo um garoto de serviço acender o fogo. Sua luz mal dura, uma miséria comparada à escuridão desta noite.\n\nTalvez a maneira como vivemos, como [ROOT.Char.GetCulture.GetCollectiveNoun], seja a culpada. Um inimigo tão poderoso a enfrentar — e ainda há convicção em mim para igualar tudo [ROOT.Char.GetPrimaryTitle.GetNameNoTier]?\n\nPenso no modo de vida [advanced_culture.GetName], como eles vivem e governam. Talvez alguma parte disso valha a pena impor ao meu povo?"
 bp2_yearly.6110.regional:0 "Caminhando de um salão do trono quase vazio, luto com minhas memórias e meus sonhos.\n\nLanço as ruas de [childhood_location.GetCounty.GetTitle.GetNameNoTier] sobre um [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier]-que-ainda-virá, vejo um [advanced_culture.GetName] banqueteando-se em uma mesa [ROOT.Char.GetCulture.GetName], liderando grupos de guerra reorganizados para seu primeiro gosto da vitória.\n\nO que torna os [advanced_culture.GetCollectiveNounNoTooltip] tão distintos entre os povos? Tal costume pode ser adaptado, mas começa com minha corte, comigo."
 bp2_yearly.6110.ritual:0 "As regras dos deuses estrangeiros diferem, dizem-me, tanto quanto as regras dos homens. E em lugares diferentes, os homens desfrutam de coisas diferentes — enquanto seus deuses encorajam o que desejam, certo ou errado.\n\nUm[ROOT.Char.GetFaith.HouseOfWorship] está calmo, contemplativo.\n\nSeriam os antigos ancestrais [ROOT.Char.GetCulture.GetHeritage.GetName] de antigamente, seria [ROOT.Char.GetFaith.HighGodName], tão ofendidos... se as práticas do meu povo mudassem? Mas qual [advanced_culture.GetName] melhor serviu aqueles que me criaram?"
 bp2_yearly.6110.social:0 "O mercado. Nossa maneira particular de falar [ROOT.Char.GetCulture.GetLanguage.GetName] de [ROOT.Char.GetCapitalLocation.GetCounty.GetTitle.GetNameNoTier] enche meus ouvidos. [ROOT.Char.GetCulture.GetCollectiveNoun], embora em reverência a mim, continuam com seu trabalho diário.\n\nEu sei que sou como eles, mas #EMP diferente#!. São eles e os [advanced_culture.GetCollectiveNoun] que são distintos.\n\nIsso é algo para mudar rapidamente? Pois, embora eu não tenha crescido entre eles, meu capricho é o futuro de cada [ROOT.Char.GetCulture.GetNameNoTooltip]. Aspectos da cultura [advanced_culture.GetNameNoTooltip] são meus para introduzir."
 bp2_yearly.6110.t:0 "Reformas Estrangeiras"
 bp2_yearly.6120.a.tt:0 "[Select_CString( hostage.IsFemale, 'A', 'O' )] [hostage.Custom('GirlBoy')] ainda é um [hostage.GetDynastyHouseNameNoTooltip], afinal, e pertence às graças da família [hostage.GetHerHim]."
 bp2_yearly.6120.a:0 "Saboreie o reencontro. É precioso."
 bp2_yearly.6120.b.tt:0 "Por que manter um refém, senão para extrair coisas como essas?"
 bp2_yearly.6120.b:0 "Eu esperaria uma recompensa pelo favor generoso!"
 bp2_yearly.6120.c.failure:0 "Você parece ser um incômodo insuportável"
 bp2_yearly.6120.c.success:0 "Você domina a interação com [hostage_giver.GetFirstNameNoTooltip]"
 bp2_yearly.6120.c:0 "Venha, vamos falar com [hostage_giver.GetSheHe] #EMP juntos#!."
 bp2_yearly.6120.d.tt:0 "[hostage.GetFirstNameNoTooltip] pertence a mim, não à companhia da família [hostage.GetHerHim]. Uma surra ajudará [hostage.GetSheHe] a lembrar disso."
 bp2_yearly.6120.d:0 "#EMP Silêncio!#! Você mereceu um tapa, [hostage.Custom('GirlBoy')]!"
 bp2_yearly.6120.desc:0 "Meu refém [hostage.GetName] fica ansioso, esperançoso. Seu(a) [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))] [hostage_giver.GetTitledFirstName] está próximo, aqui em [ROOT.Char.GetCurrentLocation.GetName], e faz muito tempo desde que foi assim pela última vez.\n\n[Select_CString( hostage.IsFemale, 'A', 'O' )] [hostage.Custom('GirlBoy')] agora vive comigo. Seu(a) [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))] e eu temos um pacto. [hostage.GetFirstNameNoTooltip] está sob meu domínio, e [hostage.GetSheHe] deveria ser leal a #EMP mim#!. Há risco em permitir que [hostage.GetSheHe] reacenda seu amor pela família [hostage.GetHerHim]...\n\n\"Por favor,\" implora [hostage.GetSheHe]. \"Por favor, meu [ROOT.Char.GetTitleAsNameNoTooltip], sinto falta do(a) meu(a) [hostage.Custom2('RelationToMeShort', SCOPE.sC('hostage_giver'))] com todo o meu coração!\""
 bp2_yearly.6120.hook:0 "Se [hostage_giver.GetShortUIName] aceitar, você ganha um [weak_hook|E] n[hostage_giver.GetSheHe]"
 bp2_yearly.6120.hook_acceptance:0 "[personality|E] de [hostage_giver.GetShortUINamePossessive] determina se [hostage_giver.GetSheHe] aceitará"
 bp2_yearly.6120.t:0 "Onde os Laços São Testados"
 bp2_yearly.6121.a.tt:0 "Desonra seja amaldiçoada: [hostage.GetFirstNameNoTooltip] pertence a mim! Deixe [warden.GetTitledFirstNameNoTooltip] fazer o que quiser a respeito disso."
 bp2_yearly.6121.a:0 "[hostage.GetFirstNameNoTooltip]! Estou te levando para casa."
 bp2_yearly.6121.b.tt:0 "Coma! Coma! E ostente seu status como um [ROOT.Char.GetDynastyHouseNameNoTooltip]."
 bp2_yearly.6121.b:0 "Um presente poderoso, para que você não passe fome!"
 bp2_yearly.6121.c:0 "É bom te ver, [hostage.Custom('GetLassLad')]."
 bp2_yearly.6121.d.tt:0 "Nenhum parente meu será abandonado por seus próprios."
 bp2_yearly.6121.d:0 "Qualquer coisa por amor à Casa [ROOT.Char.GetDynastyHouseNameNoTooltip]."
 bp2_yearly.6121.e.failure:0 "Você é pego"
 bp2_yearly.6121.e.success:0 "Você se infiltra para dar um abraço"
 bp2_yearly.6121.e.tt:0 "[warden.GetTitledFirstNameNoTooltip] não pode me impedir de encontrar [hostage.GetFirstNameNoTooltip] e falar com [hostage.GetSheHe], mesmo que seja apenas por um momento."
 bp2_yearly.6121.e:0 "Para um abraço roubado, eu não preciso de permissão..."
 bp2_yearly.6121.f.tt:0 "Eu verei [hostage.GetSheHe] novamente um dia... e está tudo bem."
 bp2_yearly.6121.f:0 "Ah. Não sinto falta [hostage.GetHerHim]."
 bp2_yearly.6121.forbidden:0 "Você achou que, simplesmente porque você e seu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName] estão ambos em [ROOT.Char.GetCurrentLocation.GetName], você compartilharia a companhia?\n\n[warden.GetTitledFirstName] balança a cabeça.\n\n\"Meu refém está muito ocupado. Independentemente disso, pelo tempo de nosso acordo, [hostage.GetSheHe] pertence apenas a mim.\"\n\nDe fato, mal vi um traço [Select_CString( hostage.IsFemale, 'da', 'do' )] [hostage.Custom('GirlBoy')] que foi enviado embora..."
 bp2_yearly.6121.hook:0 "\"Achou que, simplesmente porque você e [Select_CString( hostage.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName] estão ambos em [ROOT.Char.GetCurrentLocation.GetName], você compartilharia a companhia?\"\n\n[warden.GetTitledFirstName] balança a cabeça.\n\n\"Meu refém está muito ocupado. Independentemente disso, pelo tempo de nosso acordo, [hostage.GetSheHe] pertence apenas a mim.\"\n\nDe fato, mal vi um traço [Select_CString( hostage.IsFemale, 'da', 'do' )] [hostage.Custom('GirlBoy')] que foi enviado embora..."
 bp2_yearly.6121.intrusion:0 "Com [warden.GetTitledFirstName] ao lado [hostage.GetHerHim], [hostage.GetFirstName] está diante de mim. [Select_CString( hostage.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] está muito mudado desde que eu o enviei como refém, mas eu reconheceria um [ROOT.Char.GetDynastyHouseName] em qualquer lugar!\n\nEu abraço [Select_CString( hostage.IsFemale, 'a', 'o' )] [hostage.Custom('GirlBoy')]. [hostage.GetSheHe|U] tenta permanecer composto, mas a firmeza do aperto [hostage.GetHerHim] trai o anseio por sua casa.\n\nEntão [warden.GetTitledFirstNameNoTooltip] intervém, desviando a atenção [Select_CString( hostage.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], falando sobre esta reunião... e as colheitas locais de [ROOT.Char.GetCurrentLocation.GetName]?\n\nIndependentemente disso, agradeço a [ROOT.Char.GetFaith.HouseholdGodName] em nome da minha família."
 bp2_yearly.6121.reunion:0 "Aguardei por este momento. [Select_CString( hostage.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName], um refém que salvaguarda minha paz, está diante de mim em [ROOT.Char.GetCurrentLocation.GetName].\n\n\"[hostage.Custom2('RelationToMeShort', ROOT.Char)|U]!\"\n\nEnquanto [hostage.GetSheHe] corre para o meu abraço, é como se [hostage.GetSheHe] nunca tivesse partido. No entanto, a firmeza do aperto [hostage.GetHerHim] trai o anseio [Select_CString( hostage.IsFemale, 'da', 'do' )] [hostage.Custom('GirlBoy')] por sua casa.\n\n[warden.GetTitledFirstName] foi gentil ao nos permitir essa companhia compartilhada, mas ainda não é o bastante."
 bp2_yearly.6121.t:0 "[Select_CString( hostage.IsFemale, 'A', 'O' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))|U] Esquecido"
 bp2_yearly.6122.c.tt:0 "Se isso se transformar em guerra, pelo menos [hostage.GetFirstNameNoTooltip] não será o primeiro entre os mortos..."
 bp2_yearly.6122.c:0 "Juntos, esperaremos o que pode acontecer."
 bp2_yearly.6122.rescue:0 "Como [warden.GetTitledFirstName] fervia quando eu o dispensei da minha presença, [warden.GetSheHe] uma vez refém de [hostage.GetFirstName] ao meu lado.\n\n\"[warden.GetSheHe] vai voltar, [hostage.Custom2('RelationToMeShort', ROOT.Char)]?\" pergunta [Select_CString( hostage.IsFemale, 'a', 'o' )] [hostage.Custom('GirlBoy')]. \"Eu queria voltar para casa, mas... eu não quero fazer você lutar com [warden.GetPrimaryTitle.GetNameNoTier].\"\n\nEu asseguro a [hostage.GetFirstNameNoTooltip] o contrário, mas a verdade permanece clara.\n\nEu quebrei um pacto. Para melhor ou para pior, pode ser que eu tenha sacrificado a paz."
 bp2_yearly.6122.sneaking:0 "Enquanto meus agentes tiravam [hostage.GetFirstName] dos guardas de [warden.GetTitledFirstNamePossessive], aproveitando o grande evento do jantar, eu também me esgueirei para este encontro familiar.\n\nAs circunstâncias ignóbeis mal estão em minha mente enquanto meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] me abraça, rindo das minhas rugas, cheio de excitação.\n\n[hostage.GetSheHe|U] estava ausente por muito tempo e logo deve retornar ao seu responsável. Este é o jeito das coisas, mas eu não invejo a [hostage.GetSheHe] o seu mestre exigente."
 bp2_yearly.6122.t:0 "Não Esquecido"
 bp2_yearly.6123.a:0 "Bastante a [hostage_giver.Custom('WomanManPerson_GenderPreference')], [hostage_giver.GetFirstNameNoTooltip]."
 bp2_yearly.6123.desc:0 "A reunião de parentes é um espetáculo emocionante, um que presido com prazer.\n\n [warden.GetTitledFirstName] compartilha algumas parábolas sábias com [hostage.GetFirstName] à medida que o dia avança, e enquanto aguardo o retorno do meu refém de bom humor.\n\n\"Cuide bem [hostage.GetHerHim]\", instiga [hostage_giver.GetTitleAsNameNoTooltip], quando levo s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] embora. \"Mantenha [hostage.GetSheHe] longe de estranhos como eu.\""
 bp2_yearly.6123.favor_accepted:0 "Eu julguei corretamente... [hostage_giver.GetTitledFirstName] é um [hostage_giver.Custom('WomanManPerson_GenderPreference')] disposto a ser persuadido.\n\nEnquanto [hostage_giver.GetSheHe] mantém [hostage.GetFirstName] perto, a ternura que [hostage_giver.GetSheHe] reserva para sua família está completamente visível.\n\nCom uma nova obrigação para manter sobre [hostage_giver.GetSheHe] e um refém tão querido sob minha responsabilidade, não vejo ameaça vindo do [hostage_giver.GetTitleAsNameNoTooltip] nos próximos dias."
 bp2_yearly.6123.forbidden_desc:0 "Embora eu suspeite que isso aborrece [hostage_giver.GetSheHe], [hostage_giver.GetTitledFirstName] respeitou minha decisão sobre se ele pode se encontrar com seu(a) [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))].\n\n\"Eu mal sinto falta do [hostage.Custom('GetLassLad')],\" afirma [hostage_giver.GetSheHe]. \"Estou quase feliz que você seja forçado a lidar com a tolice [hostage.GetHerHim] por mais um tempo.\"\n\nÉ assim que deve ser, além disso... é bom testar um(a) [hostage_giver.Custom('WomanManPerson_GenderPreference')], e saber onde [hostage_giver.GetSheHe] está."
 bp2_yearly.6123.return_hostage:0 "[hostage.GetShortUIName] não é mais seu [hostage|E]"
 bp2_yearly.6123.sneaker:0 "[hostage_giver.GetTitledFirstName], o rato desonrado, parece não respeitar minha autoridade sobre seu(a) [hostage_giver.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName].\n\n[hostage_giver.GetSheHe|U] nega ter enviado servos astutos para atrair [Select_CString( hostage.IsFemale, 'a', 'o' )] [hostage.Custom('GirlBoy')] para longe da minha mesa de jantar bem guardada. Mas eu sei que [hostage_giver.GetSheHe] olha apenas para violar os acordos entre nós.\n\n\"Mentiras!\" protesta [hostage_giver.GetSheHe].\n\nEnquanto [hostage.GetSheHe] viver na minha corte, [hostage.GetFirstNameNoTooltip] #EMP deve#! permanecer longe do [hostage_giver.GetTitleAsNameNoTooltip], sempre."
 bp2_yearly.6123.stolen_hostage:0 "[hostage_giver.GetTitledFirstName] fez o impensável! Minha retidão [hostage_giver.GetSheHe] se encontra com a traição.\n\nO desgraçado me afasta enquanto [Select_CString( hostage.IsFemale, 'a', 'o' )] [hostage.Custom('GirlBoy')] [hostage.GetFirstName], o símbolo de nossa paz, fica erroneamente ao lado [hostage_giver.GetHerHim]... e eu devo partir. Eu tenho pouca força aqui comigo. É um insulto! É ignóbil!\n\nAgora estou indo para casa, desconsiderado e desprezado, sem garantias de que o pior não está por vir.\n\n[hostage_giver.GetFirstNameNoTooltip] viverá para se arrepender dessa loucura, assim como eu me arrependo de trazer meu refém perto de uma serpente cobiçosa..."
 bp2_yearly.6123.t:0 "O Herdeiro da Paz"
 bp2_yearly.6130.a.tt:0 "Um vínculo entre nossas duas cortes... talvez seja algo para nutrir?"
 bp2_yearly.6130.a:0 "\"Jurem apoiar um ao outro, sempre.\""
 bp2_yearly.6130.alliance:0 "Se ambos se tornarem [rulers|E], [kin.GetShortUIName] e [hostage.GetShortUIName] podem negociar uma [alliance|E]"
 bp2_yearly.6130.b.tt:0 "Vá brincar com alguém que sempre estará lá por você, [kin.Custom('GirlBoy')]."
 bp2_yearly.6130.b:0 "\"O amor pela família deve estar acima de tudo!\""
 bp2_yearly.6130.desc.different_ages:0 "[Select_CString( kin.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName] e o refém [hostage.GetName], apesar de sua separação em anos, parecem estar se tornando cada vez mais inseparáveis.\n\nO mais velho dos dois protege o outro firmemente, dando bons conselhos sobre os caminhos do mundo, enquanto o mais jovem nunca deixa de arrancar um sorriso.\n\nAssistindo a esses companheiros improváveis, não consigo deixar de sentir pena da separação que virá. Um dia, o acordo de refém com o [hostage.GetFirstNamePossessiveNoTooltip] kin terminará..."
 bp2_yearly.6130.desc:0 "M[Select_CString( kin.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName] e o refém [hostage.GetName] parecem estar se tornando companheiros firmes, confidentes confiáveis.\n\n[hostage.GetFirstNameNoTooltip], quando anseia por casa, sempre é alegrado por [kin.GetFirstNameNoTooltip]. M[Select_CString( kin.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))], com sua posição às vezes pesando sobre [kin.GetSheHe], tem [hostage.GetFirstNameNoTooltip] para se juntar a [kin.GetSheHe] em seus deveres.\n\nAssistindo às duas crianças compartilhando alegrias, não consigo deixar de sentir pena da separação que virá. Um dia, o acordo de refém com os parentes de [hostage.GetFirstNamePossessiveNoTooltip] chegará ao fim..."
 bp2_yearly.6130.family_opinion:0 "[kin.GetShortUIName] ganha #P 30#! [opinion|E] de sua [close_family|E]"
 bp2_yearly.6130.t:0 "Cativo, Cautivado"
 bp2_yearly.6140.a.tt:0 "Humilhe [hostage.GetSheHe], [kin.Custom('GirlBoy')]! [hostage.GetFirstNameNoTooltip] é um[Select_CString( hostage.IsFemale, 'a', '' )] inimig[Select_CString( hostage.IsFemale, 'a', 'o' )] bem ao seu alcance."
 bp2_yearly.6140.a:0 "A competição aguça a inteligência do meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))]."
 bp2_yearly.6140.b.tt:0 "Melhor rezar #EMP contra#! o corte de cabeças, crianças."
 bp2_yearly.6140.b:0 "Reféns não são mantidos para conflitos, mas para a paz."
 bp2_yearly.6140.desc:0 "Enquanto ritos sagrados distraem todos os responsáveis, [Select_CString( kin.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName] e o refém [hostage.GetName] liberam seu crescente ódio.\n\n\"Meu(a) [kin.Custom2('RelationToMeShort', SCOPE.sC('root_scope'))] é o mais poderoso [ROOT.Char.GetTitleAsName] de toda a terra!\" sibila [kin.GetFirstNameNoTooltip]. \"Um dia, graças a ele, o fétido [home_court.GetPrimaryTitle.GetNameNoTier] estará em chamas, e sua cabeça pendurada na sela de um $knight_culture_player_no_tooltip_lowercase$!\"\n\n\"Eu gostaria que m[Select_CString( home_court.IsFemale, 'inha', 'eu' )] [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] me levasse para casa,\" responde [hostage.GetFirstNameNoTooltip], \"você teria muito medo de me insultar lá!\"\n\nQuando meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] começou a falar assim? E com um convidado honrado!"
 bp2_yearly.6140.t:0 "Pela Amizade, Muito Jovens"
 bp2_yearly.6150.a.tt:0 "Não há nada a temer! Você é praticamente um de nós."
 bp2_yearly.6150.a:0 "Você pertence à minha família. Fique com eles."
 bp2_yearly.6150.b.tt:0 "Eu posso me destacar por minha própria magnificência: meu primeiro dever para com esses reféns é cultivá-los."
 bp2_yearly.6150.b:0 "Vá estudar com os [ROOT.Char.GetFaith.PriestNeuterPlural], suponho..."
 bp2_yearly.6150.c.tt:0 "Eu não posso permitir que meu refém dite o que eu faço."
 bp2_yearly.6150.c:0 "Você é minha para tratar como eu quiser."
 bp2_yearly.6150.desc:0 "Reféns costumam estar presentes, posicionados ao lado de funcionários e familiares, quando [ROOT.Char.GetTitleAsName]s como eu recebem petições e realizam cerimônias.\n\nMeu refém [hostage.GetFirstName] não gosta disso.\n\n\"Por favor, ser olhado, ser um prêmio...\" protesta [hostage.GetSheHe], enquanto os últimos suplicantes saem.\n\n\"Parece que algum espírito me arrancou do [hostage.GetFaith.NegativeAfterLife]. Todo mundo fica me encarando... eles sabem que eu não pertenço aqui.\""
 bp2_yearly.6150.family_opinion_hostage:0 "[hostage.GetShortUIName] ganha #P 20#! [opinion|E] de sua [close_family|E]"
 bp2_yearly.6150.t:0 "A Garantia Fala"
 bp2_yearly.6160.a.tt:0 "Os pequenos desejam experimentar o mundo comum? Então deixe-os trabalhar para o dono do cavalo por um tempo."
 bp2_yearly.6160.a:0 "Experimentem o trabalho para pagar suas dívidas."
 bp2_yearly.6160.b.tt:0 "Nenhuma trégua vale a pena arriscar minha família com a presença de tais arruaceiros!"
 bp2_yearly.6160.b:0 "Você prejudica meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))], refém?! #EMP Vá embora!#!"
 bp2_yearly.6160.c:0 "#EMP Suspiro.#! Acho que vou pagar por isso..."
 bp2_yearly.6160.d:0 "Curar o cavalo? Muito fácil."
 bp2_yearly.6160.desc:0 "No meio de soluços e mentiras, eu descubro a verdade da noite passada.\n\n[Select_CString( kin.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName] e o refém [hostage.GetFirstName] saíram sorrateiramente sob a cobertura da escuridão. Curiosos sobre o mundo além da minha casa, eles se infiltraram em um assentamento.\n\nAdmirando os cavalos de uma família local, eles logo foram descobertos - e fugiram em cavalos roubados.\n\nAs crianças ineptas caíram em um buraco.\n\n\"[hostage.GetFirstNameNoTooltip] me encorajou a entrar!\" soluça [Select_CString( kin.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] ferido, como os aldeões lamentando seu cavalo agora manco."
 bp2_yearly.6160.e.tt:0 "Deixe esses encrenqueiros descansarem. Não há escândalo aqui."
 bp2_yearly.6160.e:0 "Eles são crianças! Isso acontece."
 bp2_yearly.6160.t:0 "Pior dos Meus Cavaleiros"
 bp2_yearly.6170.a.tt:0 "Meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] deve ter todos os confortos sofisticados de casa!"
 bp2_yearly.6170.a:0 "Sim, é um ultraje à dignidade [hostage.GetHerHim], e à minha."
 bp2_yearly.6170.b.tt:0 "O sacrifício de [hostage.GetFirstNamePossessiveNoTooltip] deve ser apenas um de muitos a serviço da Casa [ROOT.Char.GetDynastyHouseNameNoTooltip]."
 bp2_yearly.6170.b:0 "O dever com sua família os une a todos."
 bp2_yearly.6170.c.tt:0 "Viver como os não refinados ensinará meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] a abrir mão de luxos, a ser resistente e engenhoso..."
 bp2_yearly.6170.c:0 "[hostage.GetSheHe|U] deve conhecer como outros povos vivem."
 bp2_yearly.6170.desc:0 "\"Nenhum [ROOT.Char.GetDynastyHouseName] está satisfeito com o que você fez!\" resmunga [Select_CString( kin.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kin'))] [kin.GetFirstName].\n\n\"Como você pôde enviar [hostage.GetName], m[Select_CString( hostage.IsFemale, 'inha', 'eu' )] [hostage.Custom('ComplimentAdjective')] [kin.Custom2('RelationToMeShort', SCOPE.sC('hostage'))], para uma cabana fétida onde homens bárbaros proferem '[warden.Custom('CulturalCurse')|U]!' e nunca 'Louvem [ROOT.Char.GetFaith.HighGodName]'? Onde cães defecam livremente em selvagens e senhores locais de [warden.GetCulture.GetName] igualmente?\"\n\nDe fato, [warden.GetName] não é uma [ROOT.Char.GetCulture.GetName] culta, mas ainda assim um lugar bastante digno—\n\n\"[hostage.GetFirstNameNoTooltip] está mantido refém em uma cabana!\" grita [kin.GetFirstNameNoTooltip]. \"#EMP Cuide das necessidades [hostage.GetHerHim]!#! Seus direitos como [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]!\""
 bp2_yearly.6170.leave_court_bonus:0 "[courtiers|E] da [close_family|E] têm menos probabilidade de sair por #high 10 anos#!"
 bp2_yearly.6170.scheme_bonus:0 "[close_family|E] e [spouses|E] têm maior probabilidade de se juntar aos seus [hostile_schemes|E] por #high 10 anos#!"
 bp2_yearly.6170.t:0 "Um Pacto com os Incivilizados"
 bp2_yearly.6180.notification_high:0 "Reformas: [advanced_culture.GetNameNoTooltip] Governante Satisfeito"
 bp2_yearly.6180_notification_tooltip_high:0 "[pleased_ruler.GetTitledFirstName] elogia seu interesse em imitar os nobres [advanced_culture.GetCollectiveNoun]."
 bp2_yearly.6181.notification_high:0 "Reformas: Reino Desprezado Denunciado"
 bp2_yearly.6181_notification_tooltip_high:0 "[disappointed_ruler.GetTitledFirstName] está desapontado que suas reformas não proporcionarão muitas novas oportunidades para os comerciantes de [advanced_culture.GetName]."
 bp2_yearly.6182.notification_high:0 "Reformas: Senhor Estrangeiro Condena Ritos"
 bp2_yearly.6182_notification_tooltip_high:0 "[disappointed_ruler.GetTitledFirstName] insta você a abandonar as superstições da [ROOT.Char.GetCulture.GetName], se deseja libertar seu povo."
 bp2_yearly.6183.notification_high:0 "Reformas: [disappointed_ruler.GetWomanMan] Desaprova Vulgaridade"
 bp2_yearly.6183_notification_tooltip_high:0 "[disappointed_ruler.GetTitledFirstName] está desapontado com sua recepção 'selvagem' dos sofisticados cortesãos de [advanced_culture.GetName]."
 bp2_yearly.6184.notification_high:0 "Reformas: Senhor da Guerra Expressa Desprezo"
 bp2_yearly.6184_notification_tooltip_high:0 "[disappointed_ruler.GetTitledFirstName] denuncia sua rejeição das elites de [advanced_culture.GetName] e seu fraco controle sobre seus vassalos."
 bp2_yearly.6185.notification_high:0 "Reformas: Mercenários Assaltam [ROOT.Char.Custom('KnightCultureNoTooltip')]"
 bp2_yearly.6185_notification_tooltip_high:0 "[beaten_knight.GetTitledFirstName] foi gravemente espancado e humilhado por um bando errante de mercenários vingativos de [advanced_culture.GetName]."
 bp2_yearly.6186.notification_high:0 "Reformas: Rumores de Barbarismo"
 bp2_yearly.6186_notification_tooltip_high:0 "Sua corte é ridicularizada como um bastião de maneiras incultas, um lugar anátema para cortesãos de culturas refinadas."
 bp2_yearly.6187.notification_high:0 "Reformas: Estrangeiros Habilidosos Fugindo"
 bp2_yearly.6187_no_vassal_notification_tooltip_high:0 "Fanáticos recém-inflamados estão expulsando estudiosos, missionários e funcionários do reino."
 bp2_yearly.6187_notification_tooltip_high:0 "[zealot_vassal.GetTitledFirstName] lidera outros fanáticos na expulsão de estudiosos, missionários e funcionários do reino."
 bp2_yearly.6188.notification_high:0 "Reformas: Nobreza Local Dominante"
 bp2_yearly.6188_notification_tooltip_high:0 "Em [isolating_county.GetName], nobres menores empoderados suprimem assentamentos urbanos, sufocam o comércio e acumulam riqueza."
 bp2_yearly.6189.notification_high:0 "Reformas: Construindo Muito Rapidamente"
 bp2_yearly.6189_notification_tooltip_high:0 "As grandiosas construções no estilo de [advanced_culture.GetName] de [affected_province.GetName] foram planejadas incorretamente: guerreiros convocados trabalham para evitar um desastre."
 bp2_yearly.6190.notification_high:0 "Reformas: um[ROOT.Char.GetFaith.HouseOfWorship|U] Saqueada"
 bp2_yearly.6190_notification_tooltip_high:0 "Em [affected_county.GetName], fanáticos locais [ROOT.Char.GetFaith.AltPriestTermPlural] destruíram os preciosos ícones e suprimentos votivos de [advanced_culture.GetName]."
 bp2_yearly.6191.notification_high:0 "Reformas: Desviando dos Primos"
 bp2_yearly.6191_notification_tooltip_high:0 "Notáveis [annoyed_culture.GetName] sentem-se alienados pela cultura de sua corte, que fica cada vez mais distinta da deles."
 bp2_yearly.6192.notification_high:0 "Reformas: Vassalo Abandona Confiança"
 bp2_yearly.6192_notification_tooltip_high:0 "[vassal.GetTitledFirstName] sente-se perdido em seu reino em rápida mudança e não vê mais mérito em ser constante e fiel."
 bp2_yearly.6193.notification_high:0 "Reformas: Governança Empoderada"
 bp2_yearly.6193_notification_tooltip_high:0 "Nunca mais os magnatas esconderão sua riqueza! A infraestrutura no estilo de [advanced_culture.GetName] empodera sua autoridade."
 bp2_yearly.6194.notification_high:0 "Reformas: Gratidão do Vassalo"
 bp2_yearly.6194_notification_tooltip_high:0 "[vassal.GetTitledFirstName] exalta seu nome perante seus pares, grato por seus presentes e pela reafirmação de seus laços."
 bp2_yearly.6195.notification_high:0 "Reformas: Presságios Sagrados da Mudança"
 bp2_yearly.6195_notification_tooltip_high:0 "Muitos duvidaram de você, mas sinais de [ROOT.Char.GetFaith.KnowledgeGodName] sugerem a justiça de suas práticas espirituais de [advanced_culture.GetName]."
 bp2_yearly.6196.notification_high:0 "Reformas: Uma Descoberta Abençoada"
 bp2_yearly.6196_notification_tooltip_high:0 "[priest.GetTitledFirstName] oferece um tesouro de riquezas: seja a riqueza que [ROOT.Char.GetFaith.HouseOfWorshipPlural] mantiveram escondida de você... ou uma bênção miraculosa de [ROOT.Char.GetFaith.HighGodName]."
 bp2_yearly.6197.notification_high:0 "Reformas: Esplendor em Ação"
 bp2_yearly.6197_notification_tooltip_high:0 "Chega a mim a notícia de que [vassal.GetTitledFirstName] está imitando os elementos [advanced_culture.GetName] de minha corte — uma reação de espanto entre muitas."
 bp2_yearly.6198.notification_high:0 "Reformas: Defensor da Corte"
 bp2_yearly.6198_notification_tooltip_high:0 "[courtier.GetTitledFirstName], em nome de seus cortesãos, promete devoção eterna à sua Casa: você provou que manterá os usurpadores de poder à distância."
 bp2_yearly.6199.notification_high:0 "Reformas: [ROOT.Char.Custom('KnightCultureNoTooltip')] Adaptável"
 bp2_yearly.6199_notification_tooltip_high:0 "[knight.GetTitledFirstName] dominou as técnicas marciais [advanced_culture.GetName] e as emprega de maneira vistosa."
 bp2_yearly.6200.a.tt:0 "Por favor, seja fiel! Por favor, me entregue nesta hora de necessidade!"
 bp2_yearly.6200.a:0 "Vá e retorne com ajuda."
 bp2_yearly.6200.b.tt:0 "A generosidade estimulará o apetite dos [home_court.GetTitleAsNameNoTooltip] pela guerra."
 bp2_yearly.6200.b:0 "Leve um presente valioso com você."
 bp2_yearly.6200.c.tt:0 "Um acompanhante robusto... e alguém para garantir que [hostage.GetFirstNameNoTooltip] não esqueça dos meus interesses."
 bp2_yearly.6200.c:0 "Leve [target_knight.GetFirstNameNoTooltip] leais e tenha pressa!"
 bp2_yearly.6200.d.tt:0 "Não há garantia de seu retorno! Não há garantia de que [home_court.GetTitledFirstNameNoTooltip] não preferiria confortar meus inimigos."
 bp2_yearly.6200.d:0 "Não, não posso permitir que um refém saia."
 bp2_yearly.6200.desc:0 "Enquanto meu conselho planeja nossa defesa de [ROOT.Char.GetPrimaryTitle.GetNameNoTier], meu refém [hostage.GetName] é conduzido até aqui.\n\n\"Nobre [ROOT.Char.GetTitleAsName], você me tratou bem e justamente. Com a ruína ameaçando, é certo que em [home_court.GetPrimaryTitle.GetNameNoTier], minha terra natal, os [home_court.Custom('KnightCulturePluralNoTooltipLowercase')] estão ociosos, suas bandeiras recolhidas?\"\n\n[hostage.GetSheHe|U] se ajoelha.\n\n\"Permita-me viajar - levarei nosso pedido de ajuda para [home_court.GetTitledFirstName]! Sou seu sangue. [home_court.GetSheHe|U] irá apoiá-lo, por minha causa!\""
 bp2_yearly.6200.hostage_positive:0 "#P [hostage.GetShortUIName] é mais provável que retorne à sua [court|E]#!"
 bp2_yearly.6200.hostage_travel:0 "[hostage.GetShortUIName] viajará para [home_court.GetCapitalLocation.GetTitle.GetName]"
 bp2_yearly.6200.hostage_travel_knight:0 "[hostage.GetShortUIName] e [target_knight.GetShortUIName] viajarão para [home_court.GetCapitalLocation.GetTitle.GetName]"
 bp2_yearly.6200.hostage_warning:0 "@alert_icon! #alert_trial [hostage.GetShortUIName] pode deixar de ser seu [hostage|E]#!"
 bp2_yearly.6200.imprison_warning:0 "@alert_icon! #alert_trial [target_knight.GetShortUIName] pode ser aprisionado por [home_court.GetShortUIName]#!"
 bp2_yearly.6200.t:0 "Onde os [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] Conhecem a Paz"
 bp2_yearly.6200.war_positive:0 "[home_court.GetShortUIName] pode ajudar em sua [war|E]"
 bp2_yearly.6200.war_very_positive:0 "#P [home_court.GetShortUIName] é mais provável que ajude em sua [war|E]#!"
 bp2_yearly.6202.a:0 "Pelo menos [hostage.GetFirstNameNoTooltip] ainda está vivo."
 bp2_yearly.6202.assembled_nobles:0 "Nobres de distinção alinharam-se na corte do [home_court.GetTitleAsNamePossessive] enquanto eu recitava seu apelo.\n\n"
 bp2_yearly.6202.awaiting:0 "— mas ainda aguardamos o julgamento [home_court.GetHerHim]."
 bp2_yearly.6202.fears_returning:0 "— e [home_court.GetSheHe] teme meu retorno à sua terra atribulada."
 bp2_yearly.6202.impatient:0 "Nobres insignificantes, que só me conheciam quando era bebê, cochicharam quando comecei seu apelo e depois ficaram em silêncio.\n\n"
 bp2_yearly.6202.nostalgia:0 "A brisa passa por árvores familiares. Eu fiz seu sofrimento conhecido aqui.\n\n"
 bp2_yearly.6202.opening:0 "Estou em [home_court.GetCapitalLocation.GetTitle.GetNameNoTier] mais uma vez."
 bp2_yearly.6202.received_apathy:0 "Alguns não se importam em nada, enquanto alguns [home_court.Custom('KnightCulturePluralNoTooltipLowercase')] se reúnem para aguardar a palavra [Select_CString( home_court.IsFemale, 'da', 'do' )] [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))]. [home_court.GetSheHe|U] pergunta quando espero partir."
 bp2_yearly.6202.received_debate:0 "Um debate começou a surgir. [Select_CString( home_court.IsFemale, 'Minha', 'Meu' )] [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))], embora não seja aliado seu, quer ser um defensor da família [home_court.GetHerHim]"
 bp2_yearly.6202.received_empathy:0 "Os presentes choraram pela desgraça de [ROOT.Char.GetPrimaryTitle.GetNameNoTierPossessive]. M[Select_CString( home_court.IsFemale, 'inha', 'eu' )] [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] pareceu profundamente comovido"
 bp2_yearly.6202.received_scorn:0 "\"Com que direito [ROOT.Char.GetSheHe] pede nossa ajuda?\" Me perguntaram, e tive pouca resposta. M[Select_CString( home_court.IsFemale, 'inha', 'eu' )] [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] pareceu descontente"
 bp2_yearly.6202.t:0 "[hostage.Custom2('AppropriateGreeting', ROOT.Char )]"
 bp2_yearly.6202.want_to_return:0 "— mas [home_court.GetSheHe] me faz esperar aqui, enquanto a guerra continua!"
 bp2_yearly.6202.want_to_stay:0 "— mas [home_court.GetSheHe] é muito sábio para julgamentos rápidos."
 bp2_yearly.6203.a.tt:0 "E [home_court.GetFirstNameNoTooltip] pega em armas para defender parentes, atende aos apelos daqueles em necessidade - [home_court.GetSheHe] parece um bom amigo para se ter."
 bp2_yearly.6203.a:0 "Abençoados sejam eles! Nosso vínculo vai além do reféns."
 bp2_yearly.6203.assist:0 "Entristece [home_court.GetName] que [home_court.GetSheHe] não possa vir em seu auxílio. No entanto, com a promessa de guerra e suas glórias, reunimos uma força de errantes mendigos e aventureiros [home_court.GetPrimaryTitle.GetAdjectiveNoTooltip]! Que eles lutem bem por [ROOT.Char.GetPrimaryTitle.GetNameNoTier].\n\n"
 bp2_yearly.6203.b.tt:0 "Eu vencerei todos os inimigos e obterei minha vingança!"
 bp2_yearly.6203.b:0 "#EMP Traição!#! Vou encharcar a terra de sangue!"
 bp2_yearly.6203.betray:0 "Não podemos ignorar a fraqueza revelada em seus apelos. [home_court.GetTitledFirstName] confiará na força de seu inimigo. Prepare-se para a chegada [home_court.GetHerHim].\n\nApós m[Select_CString( home_court.IsFemale, 'inha', 'eu' )] [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] saquear sua capital, talvez você me veja em sua corte novamente."
 bp2_yearly.6203.c.negative:0 "Fui um tolo por enviar [hostage.GetSheHe] para longe de minha vista..."
 bp2_yearly.6203.c.positive:0 "Para a guerra, [hostage.GetFirstNameNoTooltip]! #EMP Para a guerra!#!"
 bp2_yearly.6203.c.tt:0 "Eu te protejo, mas você protege todo o reino!"
 bp2_yearly.6203.decline:0 "Fiz o que pude, mas [home_court.GetTitledFirstName] vê pouco em seus argumentos. Sem aliança, [home_court.GetPrimaryTitle.GetNameNoTier] não marcha quando [ROOT.Char.GetPrimaryTitle.GetNameNoTier] convoca. M[Select_CString( home_court.IsFemale, 'inha', 'eu' )] [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))] agradece por me enviar para [home_court.GetSheHe], e envia suas saudações.\n\n"
 bp2_yearly.6203.dont_keep:0 "Meu lugar é na sua corte, então em breve eu retornarei."
 bp2_yearly.6203.dont_keep_knight:0 "Meu lugar é na sua corte, então [target_knight.GetFirstName] e eu em breve retornaremos."
 bp2_yearly.6203.join_war:0 "[home_court.GetPrimaryTitle.GetNameNoTier] está com você! [Select_CString( home_court.IsFemale, 'Minha', 'Meu' )] [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))], [Select_CString( home_court.IsFemale, 'a destemida', 'o destemido' )] [home_court.GetTitledFirstName], honrará os laços entre você e [home_court.GetSheHe] com força armada.\n\nQue ninguém ameace um salão que abriga um [hostage.GetDynastyHouseName]!\n\n"
 bp2_yearly.6203.keep:0 "Mas eu não sou mais seu refém."
 bp2_yearly.6203.t:0 "[ROOT.Char.GetNameNoTooltip],"
 bp2_yearly.6204.a.tt:0 "Que ninguém ameace um salão que abriga meu parente!"
 bp2_yearly.6204.a:0 "Tragam minha [ROOT.Char.Custom('signature_weapon')]! #EMP Nós [ROOT.Char.GetDynastyHouseNameNoTooltip] lutaremos!#!"
 bp2_yearly.6204.b.tt:0 "Reúna jovens armados e errantes mendicantes para enviar com [hostage.GetFirstNameNoTooltip]! Eles podem lutar sem meu envolvimento formal."
 bp2_yearly.6204.b:0 "Ajudarei a pagar e armar uma força."
 bp2_yearly.6204.c.tt:0 "Nós apenas compartilhamos uma trégua. Não somos aliados!"
 bp2_yearly.6204.c:0 "A defesa de [warden.GetPrimaryTitle.GetNameNoTierNoTooltip] não é meu dever."
 bp2_yearly.6204.desc:0 "Coberto pela poeira da estrada e com o fedor de suor de cavalo, [Select_CString( hostage.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName] retornou inesperadamente!\n\n\"Eu não estou colocando sua trégua em risco, [hostage.Custom2('RelationToMeShort', SCOPE.sC('home_court'))],\" [hostage.GetSheHe] ofega. \"A guerra não vem aqui! Não, a guerra terrível vai para [warden.GetPrimaryTitle.GetNameNoTier] — o salão onde estou mantido como refém!\"\n\n"
 bp2_yearly.6204.desc_chaperone:0 "[hostage.GetHerHis|U] cauteloso companheiro [target_knight.GetName] apresenta uma missiva de [warden.GetTitledFirstName]."
 bp2_yearly.6204.desc_gift:0 "[hostage.GetSheHe|U] apresenta tanto uma missiva quanto uma bolsa de ouro de [warden.GetTitledFirstName]."
 bp2_yearly.6204.desc_none:0 "[hostage.GetSheHe|U] apresenta uma missiva de [warden.GetTitledFirstName]."
 bp2_yearly.6204.desc_outro:0 "\n\n\"Você não tem obrigação de ajudar,\" diz [hostage.GetFirstNameNoTooltip], \"mas meu captor tem sido bom comigo! [warden.GetSheHe|U] não merece ser arruinado por [attacker.GetName]!\"\""
 bp2_yearly.6204.t:0 "Um Apelo de Meu Próprio Sangue"
 bp2_yearly.6205.a:0 "[Select_CString( hostage.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] permanecerá aqui."
 bp2_yearly.6205.b:0 "Farei [warden.GetFirstNameNoTooltip] sofrer por essa afronta!"
 bp2_yearly.6205.c:0 "Bem... boa sorte, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))]."
 bp2_yearly.6205.desc:0 "[Select_CString( hostage.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName] sobe em seu cavalo, mortalmente quieto. À frente, o [warden.GetCapitalLocation.Custom('TerrainTypeProvince')] de [warden.GetCapitalLocation.GetTitle.GetNameNoTier] — onde os temíveis [attacker.GetPrimaryTitle.GetAdjective] [attacker.Custom('KnightCulturePluralNoTooltip')|l] podem estar à espera.\n\n"
 bp2_yearly.6205.desc_chaperone:0 "[target_knight.GetFirstName], [warden.GetTitledFirstNamePossessive] [warden.Custom2('RelationToMeShort', SCOPE.sC('target_knight'))], será o único escolta de [Select_CString( hostage.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))]. Apertando as rédeas junto ao coração, [target_knight.GetSheHe] jura morrer por minha família, se chegar a isso.\n\n"
 bp2_yearly.6205.desc_gift:0 "Minhas arcas estão abarrotadas com os presentes de [warden.GetTitledFirstName], mas meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] cavalga para a guerra praticamente sozinho.\n\n"
 bp2_yearly.6205.desc_none:0 "Alguns jovens esfarrapados se reuniram para servir à causa de [Select_CString( hostage.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMePossessive', SCOPE.sC('hostage'))], mas todos os meus reféns permanecerão aqui... enquanto [hostage.GetFirstNameNoTooltip] cavalga para a guerra de [warden.GetTitledFirstNamePossessive].\n\n"
 bp2_yearly.6205.desc_outro:0 "Ainda assim — foi [warden.GetFirstNameNoTooltip] quem colocou tal visão horrível diante de mim! [Select_CString( warden.IsFemale, 'Uma fraca', 'Um fraco' )] [warden.GetWomanMan], [warden.GetSheHe] envia convidados honrados como [Select_CString( hostage.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] para se prostrarem ao menor sinal de uma espada!\n\nE devo confiar neste #EMP verme#! e sua laia para proteger minha família?"
 bp2_yearly.6205.t:0 "Para Terras de Conflito"
 bp2_yearly.6210.notification_high:0 "Reformas: Inspirado pelo Compromisso"
 bp2_yearly.6210_notification_tooltip_high:0 "[ruler.GetTitledFirstName] deseja igualar seu compromisso de não derramar sangue [ruler.GetCulture.GetName] com uma proclamação de fraternidade."
 bp2_yearly.6211.notification_high:0 "Reformas: Primos Satisfeitos"
 bp2_yearly.6211_notification_tooltip_high:0 "Senhores e plebeus [pleased_culture.GetName] são inspirados pelo novo fervor entre seus primos [ROOT.Char.GetCulture.GetName] e migram para suas terras em maior número."
 bp2_yearly.6212.notification_high:0 "Reformas: Influência de [advanced_culture.GetName]"
 bp2_yearly.6212_2_notification_tooltip_high:0 "A administração diária de [ROOT.Char.GetPrimaryTitle.GetNameNoTier] assumiu um caráter decididamente [advanced_culture.GetName], algo sobre o qual os viajantes costumam comentar."
 bp2_yearly.6212_notification_tooltip_high:0 "Famílias urbanas [advanced_culture.GetName] estabeleceram uma nova comunidade em sua capital, enquanto migrantes rústicos se estabelecem no campo."
 bp2_yearly.6213.notification_high:0 "Reformas: Progresso Brutal"
 bp2_yearly.6213_notification_2_tooltip_high:0 "Ritos tradicionais [ROOT.Char.GetCulture.GetName] foram ignorados, direitos tradicionais abusados, pelos funcionários [advanced_culture.GetName] que executam sua vontade."
 bp2_yearly.6213_notification_tooltip_high:0 "Seus executores tomaram para si a tarefa de reprimir histórias sobre sua doutrinação [advanced_culture.GetName] e a crueldade de seus métodos [advanced_culture.GetName]."
 bp2_yearly.6214.notification_high:0 "Reformas: Transição das Comunidades"
 bp2_yearly.6214_notification_1_tooltip_high:0 "Comerciantes e artesãos de [affected_county.GetName] operam sob novos acordos e leis, competindo pelas moedas no estilo de [advanced_culture.GetName] agora em circulação."
 bp2_yearly.6214_notification_2_tooltip_high:0 "Pequenos [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] e proprietários de terras livres truculentos de [affected_county.GetName] concordaram com os termos de serviço e fidelidade no estilo de [advanced_culture.GetName], reduzindo a violência e a discórdia local."
 bp2_yearly.6214_notification_3_tooltip_high:0 "[ROOT.Char.GetFaith.HouseOfWorshipPlural] de [affected_county.GetName] e paróquias de aldeias agora são administrados por homens refinados e instruídos, promovendo a educação e a governança no estilo de [advanced_culture.GetName]."
 bp2_yearly.6215.notification_high:0 "Reformas: Um [ROOT.Char.GetTitleAsNameNoTooltip] de Intenção"
 bp2_yearly.6215_notification_1_tooltip_high:0 "Magnatas voltados para a riqueza instam seus mestres a imitar seu famoso interesse em emendar a sociedade e o comércio [ROOT.Char.GetCulture.GetName]."
 bp2_yearly.6215_notification_2_tooltip_high:0 "O vigor guerreiro de sua comitiva, um exército combativo temperado por seu desejo de renascer [ROOT.Char.GetPrimaryTitle.GetNameNoTier], é amplamente respeitado."
 bp2_yearly.6215_notification_3_tooltip_high:0 "As cerimônias de seus salões sagrados são rumores por toda parte, enquanto as pessoas especulam avidamente sobre a natureza dividida de sua alma [ROOT.Char.GetCulture.GetName]."
 bp2_yearly.6216.notification_high:0 "\"Reformas: [ROOT.Char.GetSheHe|U] é #EMP Nosso#! [ROOT.Char.GetTitleAsNameNoTooltip]?\""
 bp2_yearly.6216_notification_2_tooltip_high:0 "Um rumor se espalha sobre um complô estrangeiro... um fantoche corrompido pelos [advanced_culture.GetCollectiveNoun] e plantado no trono [ROOT.Char.GetPrimaryTitle.GetAdjective]..."
 bp2_yearly.6216_notification_tooltip_high:0 "Seus agentes relatam murmúrios e cochichos entre a nobreza... será que algum tipo de adulador meio-[advanced_culture.GetName] merece sua reverência?"
 bp2_yearly_6203_army_name:0 "[ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.GetFirstNamePossessiveNoTooltip] [ROOT.Var( 'bp2_yearly_6203_army_name_origin' ).Char.GetHomeCourt.GetPrimaryTitle.GetAdjectiveNoTooltip] Refém"
 common_noble_cause_modifier:0 "Causa Nobre Comum"
