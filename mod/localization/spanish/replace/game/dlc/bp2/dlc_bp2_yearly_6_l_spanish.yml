 flourishing_settlements_modifier:0 "Assentamentos Prosperando"
 flourishing_settlements_modifier_desc:0 "Com a introdução de novas práticas e tecnologias, os locais aqui estão agradecidos e prosperando."
 forcible_resettlement_modifier:0 "Reassentamentos Forçados"
