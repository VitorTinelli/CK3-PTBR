l_spanish:
 bp2_yearly.2000.a.negative:0 "A Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip|U] não se tornou grande sem riscos..."
 bp2_yearly.2000.a:0 "Seria sábio eu simular [root_house_founder.GetSheHe]..."
 bp2_yearly.2000.b:0 "Preciso me diferenciar dos meus antepassados."
 bp2_yearly.2000.c.tt:0 "Você encomenda ao seu [GetCourtPositionType('court_artificer_court_position').GetNameNoTooltip], [artificer.GetName], para forjar uma joia com o brasão da Casa [GetPlayer.GetHouse.GetBaseNameNoTooltip]"
 bp2_yearly.2000.c:0 "Vou usar com orgulho a insígnia da Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip]!"
 bp2_yearly.2000.d:0 "Só quero sair e brincar!"
 bp2_yearly.2000.desc:0 "...e assim, querid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('GirlBoy')], é como a Casa [ROOT.Char.GetHouse.GetBaseName|U] veio a existir. [root_house_founder.GetTitledFirstName] era renomado por ser [target_trait.GetName( ROOT.Char )|l].\n\n[Select_CString( story_teller.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2( 'RelationToMeShort', story_teller )], [story_teller.GetTitledFirstName], termina de contar as origens ancestrais da minha casa. [story_teller.GetSheHe|U] frequentemente me instrui na história de [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], mas hoje está repleta de contos inspiradores sobre [Select_CString( root_house_founder.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2( 'RelationToMeShort', root_house_founder )], [root_house_founder.GetFirstNameNoTooltip], o fundador da Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip|U]."
 bp2_yearly.2000.desc_dynasty:0 "\"... e assim, [Select_CString( ROOT.Char.IsFemale, 'cara', 'caro' )] [story_teller.Custom2('RelationToMeShort', ROOT.Char)], nasceu a grande Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip|U]! [Select_CString( root_house_founder.IsFemale, 'Sua', 'Seu' )] [ROOT.Char.Custom2('RelationToMeShort', root_house_founder)], [root_house_founder.GetTitledFirstName], era renomado por ser [target_trait.GetName( GetPlayer )|l].\"\n\n[Select_CString( story_teller.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', story_teller)], [story_teller.GetTitledFirstName], termina de relatar as origens ancestrais de nossa casa. [story_teller.GetSheHe|U] gosta de me ensinar a história do [ROOT.Char.GetPrimaryTitle.GetNameNoTooltip], mas hoje, nossa conversa foi preenchida com histórias inspiradoras sobre [Select_CString( root_house_founder.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', root_house_founder)], [Select_CString( root_house_founder.IsFemale, 'a fundadora', 'o fundador' )] [ROOT.Char.Custom2('RelationToMeShort', root_house_founder)] de nossa Casa."
 bp2_yearly.2000.t:0 "Nos Passos Deles"
 bp2_yearly.2001.a:0 "Seria sábio eu simular [ancestor.GetSheHe]..."
 bp2_yearly.2001.desc:0 "\"... e assim, [Select_CString( ROOT.Char.IsFemale, 'querida', 'querido' )] [ROOT.Char.Custom('GirlBoy')], é a história de seu(a) [ROOT.Char.Custom2('RelationToMe', ancestor)], [ancestor.GetTitledFirstName]; [ancestor.GetSheHe] era renomado por ser [target_trait.GetName( GetPlayer )|l].\"\n\nMeu(a) [ROOT.Char.Custom2('RelationToMe', story_teller)], [story_teller.GetTitledFirstName], termina de relatar as lendas de meu antepassado. [story_teller.GetSheHe|U] gosta de me ensinar a história de minha casa, mas a conversa de hoje foi preenchida com histórias fantásticas e inspiradoras sobre os triunfos de minha família."
 bp2_yearly.2002.a:0 "Trabalho brilhante, [artificer.GetFirstNameNoTooltip]!"
 bp2_yearly.2002.desc:0 "[Select_CString( artificer.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', artificer)], [artificer.GetFirstName], terminou o [newly_created_artifact.GetNameNoTooltip] que eu pedi! [artificer.GetSheHe|U] me apresenta:\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Minha senhora', 'Meu senhor' )], aqui temos [newly_created_artifact.GetDesc|l]\""
 bp2_yearly.2010.a:0 "[name_option_1.GetFirstNameNoTooltip]"
 bp2_yearly.2010.b:0 "[name_option_2.GetFirstNameNoTooltip]"
 bp2_yearly.2010.c:0 "[name_option_3.GetFirstNameNoTooltip]"
 bp2_yearly.2010.desc.landed:0 "Especialmente já que meu [ROOT.Char.Custom2( 'RelationToMeShort', ruler_parent )] governa [ruler_parent.GetPrimaryTitle.GetNameNoTier] enquanto eu tenho todas as minhas responsabilidades como [ROOT.Char.GetPrimaryTitle.GetNameNoTier]."
 bp2_yearly.2010.desc.parents_dead:0 "Especialmente porque meus dois pais faleceram."
 bp2_yearly.2010.desc:0 "Estou sentado sozinho, brincando com [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom( 'child_favorite_toy' )]... novamente.\n\nA vida de um [ROOT.Char.GetTitleAsNameNoTooltip] tem muitas abundâncias. Mas mais abundante do que qualquer outra coisa é a solidão."
 bp2_yearly.2010.outro:0 "\n\nO som dos passos leves chama minha atenção. Olhando para cima, vejo uma criança desconhecida da minha idade. [ROOT.Char.Custom('GetSheHeOpposite')|U] olha curiosamente meu brinquedo.\n\n\"Não consigo me lembrar do meu nome...\" [ROOT.Char.Custom('GetSheHeOpposite')] murmura, lágrimas começando a surgir em seus olhos.\n\n\"Está tudo bem! Eu vou te chamar de...\""
 bp2_yearly.2010.t:0 "Um Novo Amigo Misterioso"
 bp2_yearly.2011.a:0 "Não fale de [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] como se [ROOT.Char.Custom('GetSheHeOpposite')] não estivesse aqui!"
 bp2_yearly.2011.b:0 "Você não tem algo melhor para fazer?"
 bp2_yearly.2011.bully.toast:0 "$relation_bully$ Ganho"
 bp2_yearly.2011.c:0 "Estou apenas praticando..."
 bp2_yearly.2011.desc:0 "Meu amigo [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] e eu estamos envolvidos em um emocionante jogo de [ROOT.Char.Custom('BG_GameType_Generic')] quando [participant.GetFirstName], meu(a) [ROOT.Char.Custom2( 'RelationToMe', participant )|l], chega com um sorriso convencido no rosto.\n\n\"Praticar [ROOT.Char.Custom('BG_GameType_Generic')] sozinho - #EMP que triste!#! Acho que quando você não tem amigos, é a única coisa a fazer...\"\n\n[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] olha desanimado em silenciosa confusão..."
 bp2_yearly.2011.t:0 "Um Jogo de Imaginação"
 bp2_yearly.2012.a.failure:0 "[regent_scope.GetFirstNameNoTooltip] zomba de você"
 bp2_yearly.2012.a.success:0 "Você lembra a corte da sua autoridade"
 bp2_yearly.2012.a:0 "É hora de me dirigir à corte e afirmar minha competência."
 bp2_yearly.2012.b.failure:0 "[regent_scope.GetFirstNameNoTooltip] descobre a sabotagem"
 bp2_yearly.2012.b.success:0 "Você faz [regent_scope.GetFirstNameNoTooltip] de bobo"
 bp2_yearly.2012.b:0 "Vou sabotar a sela [regent_scope.GetHerHim]."
 bp2_yearly.2012.c:0 "Desestabilizar o equilíbrio de poder é muito arriscado."
 bp2_yearly.2012.desc:0 "Meu(a) [ROOT.Char.Custom2('RelationToMe', regent_scope)], [regent_scope.GetFirstName], tem me atrapalhado em todos os momentos. Estou começando a me cansar dos planos [regent_scope.GetHerHim] para tomar o poder que é legitimamente meu. Infelizmente, muitos dos meus conselheiros estão sob a influência [regent_scope.GetHerHim].\n\n\"Você deveria enfrentar [regent_scope.GetSheHe],\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] diz, subitamente ao meu lado. \"Ou pelo menos arranjar uma situação embaraçosa para [regent_scope.GetSheHe].\""
 bp2_yearly.2012.t:0 "Reafirmando Minha Autoridade"
 bp2_yearly.2013.a:0 "Estou perfeitamente feliz sendo [target_trait.GetNameNoTooltip( ROOT.Char )|l]."
 bp2_yearly.2013.b:0 "Acredito que você está parcialmente correto..."
 bp2_yearly.2013.c:0 "Você está certo - serei mais eficaz se for [opposite_trait.GetNameNoTooltip( ROOT.Char )|l]."
 bp2_yearly.2013.desc:0 "Meu amigo, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], tem me incomodado o dia todo sobre meu comportamento. Parece que nossa discussão finalmente chegou ao clímax, no entanto.\n\n\"Tenho percebido que você está agindo cada vez mais [target_trait.GetNameNoTooltip( ROOT.Char )|l] ultimamente... Você não acha que será um [ROOT.Char.GetTitleAsNameNoTooltip|l] melhor se você fosse [opposite_trait.GetNameNoTooltip( ROOT.Char )|l] em vez disso?\""
 bp2_yearly.2013.t:0 "Você Está Certo?"
 bp2_yearly.2014.a.success:0 "[crush.GetFirstNameNoTooltip] desenvolve uma paixão por você"
 bp2_yearly.2014.a:0 "Este [crush.Custom('RomanticComplimentAdjective')] conhecerá os conteúdos do meu coração!"
 bp2_yearly.2014.b:0 "Melhor não assustar [crush.GetSheHe]."
 bp2_yearly.2014.c:0 "Na verdade, estou mais interessado em #EMP você#!..."
 bp2_yearly.2014.d:0 "Eu nunca poderia!"
 bp2_yearly.2014.desc:0 "[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] e eu estamos dando um passeio nos jardins quando [ROOT.Char.Custom('GetSheHeOpposite')] muda nossa conversa para o tema do amor e do desejo.\n\n\"Eu sei em seu coração: você secretamente gosta de [crush.GetFirstName]. Você deveria enviar uma carta para [crush.GetSheHe] elogiando [crush.GetSheHe] e exaltando suas qualidades [crush.Custom('RomanticComplimentAdjective')].\"\n\n\"Se você estiver se sentindo especialmente atrevido, pode até revelar que reconhece [crush.GetSheHe] pelo [crush.Custom('RomanticComplimentAdjective')] que [crush.GetSheHe] realmente é...\""
 bp2_yearly.2014.t:0 "Um Possível Crush"
 bp2_yearly.2015.a.failure:0 "[bully.GetFirstNameNoTooltip] dá uma surra em você"
 bp2_yearly.2015.a.success:0 "Você dá uma surra em [bully.GetFirstNameNoTooltip]"
 bp2_yearly.2015.a:0 "Vou tomar uma posição e defender minha honra."
 bp2_yearly.2015.b.failure:0 "Seu boato não pega"
 bp2_yearly.2015.b.success:0 "Você espalha com sucesso um boato sensacionalista"
 bp2_yearly.2015.b:0 "Esse boato se espalhará como fogo!"
 bp2_yearly.2015.c:0 "As consequências seriam muito graves..."
 bp2_yearly.2015.desc:0 "\"Será que nunca vou me livrar dess[Select_CString( bully.IsFemale, 'a', 'e' )] [bully.Custom2('InsultNoun', ROOT.Char)]?!\" Lamento, com a cabeça baixa em derrota após sofrer mais ridículo público do meu valentão, [bully.GetFirstName].\n\nEnquanto lágrimas quentes escorrem pelo meu rosto, sou surpreendido por um toque suave no meu ombro. É meu amigo, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. [ROOT.Char.Custom('GetSheHeOpposite')|U] está sempre presente quando preciso [ROOT.Char.Custom('GetHerHim')].\n\n\"Já passou da hora de você enfrentar esse detestável [bully.GetFirstNameNoTooltip]. Sugiro começar um boato sobre o que [bully.GetSheHe] gosta de fazer com o seu [bully.Custom('child_favorite_toy')] enquanto está sozinho em suas câmaras...\""
 bp2_yearly.2015.t:0 "Um Amigo Encorajador"
 bp2_yearly.2016.a:0 "Não gostaria de nada mais!"
 bp2_yearly.2016.b:0 "Não estou com humor para tamanha frivolidade."
 bp2_yearly.2016.desc:0 "Que variedade luxuosa de aromas agradáveis.\n\nGosto de dar um passeio tranquilo pelos jardins. Só gostaria que alguém estivesse aqui para compartilhar essas delícias sensoriais. A vida de um [ROOT.Char.GetTitleAsNameNoTooltip|l] pode ser solitária.\n\nNão demora muito e eu termino meu pensamento, meu amigo [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] aparece de trás de um canteiro de flores: \"Vamos colher [ROOT.Char.GetCurrentLocation.Custom('get_region_flower_type_plural')] e fazer coroas de flores!\""
 bp2_yearly.2016.t:0 "Uma Amizade Florescente"
 bp2_yearly.2017.a.tt:0 "Isso irá melhorar muito o seu [education_focus|E] de [learning|E]"
 bp2_yearly.2017.a:0 "Suponho que um pouco mais de indulgência não faria mal..."
 bp2_yearly.2017.b.tt:0 "Isso irá melhorar muito o seu [education_focus|E] [martial|E]"
 bp2_yearly.2017.b:0 "Não, o corpo precisa de exercício tanto quanto a mente."
 bp2_yearly.2017.desc:0 "[ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] e eu passamos a maior parte do dia cercados por livros. Mas a hora está ficando tarde. Eu gastei tempo demais me entregando às palavras escritas e comecei a negligenciar minhas outras obrigações.\n\nFechar meu livro provoca um olhar afiado do meu companheiro.\n\n\"Venha, [ROOT.Char.GetFirstNameNoTooltip],\" diz [ROOT.Char.Custom('GetSheHeOpposite')]. \"Por favor, fique e leia comigo. Você tem uma mente tão curiosa - eu odiaria vê-la desperdiçada com qualquer coisa além do conhecimento.\""
 bp2_yearly.2017.t:0 "Queimando a Meia-Noite"
 bp2_yearly.2018.a:0 "Um confidente de confiança é exatamente o que eu preciso."
 bp2_yearly.2018.b:0 "Vou tentar organizar meus pensamentos em alguma composição..."
 bp2_yearly.2018.c:0 "O que eu realmente preciso é de uma boa rotina de treinamento!"
 bp2_yearly.2018.desc:0 "Estou sentado sozinho, massageando minhas têmporas cansadas de um longo dia de tarefas e deveres.\n\n\"Você tem estado tão ocupado recentemente, [ROOT.Char.GetFirstNameNoTooltip].\" Meu amigo, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], aparece ao meu lado e fala gentilmente.\n\n\"É importante que você tire um tempo para si mesmo ou encontre alguém em quem confiar quando os fardos do seu [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] se tornarem muito grandes para suportar.\"\n\n\"Estou sempre aqui para ouvir quando você precisar, meu amigo. Mas sei que às vezes é difícil falar em voz alta sobre o que nos aflige. Talvez a poesia seja uma maneira adequada para você aliviar seus fardos?\""
 bp2_yearly.2018.t:0 "Um Amigo Confidente"
 bp2_yearly.2019.a.tt:0 "Você abraça seu relacionamento com [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]"
 bp2_yearly.2019.a:0 "Por que, é claro que há! [ROOT.Char.Custom('GetSheHeOpposite')|U] é meu conselheiro mais confiável!"
 bp2_yearly.2019.b.tt:0 "Você rejeita seu relacionamento com [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]"
 bp2_yearly.2019.b:0 "#EMP Err...#! Me equivoquei. Vamos considerar isso em particular."
 bp2_yearly.2019.desc.chancellor:0 "nossas relações com reinos vizinhos.\""
 bp2_yearly.2019.desc.chancellor_unlanded:0 "nossas relações com casas vizinhas."
 bp2_yearly.2019.desc.chaplain:0 "o estado das propriedades do [ROOT.Char.Custom('GetFaithTemple')] do reino.\""
 bp2_yearly.2019.desc.chaplain_unlanded:0 "o estado do santuário da família [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bp2_yearly.2019.desc.intro:0 "\"[Select_CString( target_councilor.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2( 'RelationToMe', target_councilor )], [target_councilor.GetTitledFirstName], se aproxima de meu amigo, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], e eu em meio a uma conversa.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U],\" [target_councilor.GetFirstNameNoTooltip] questiona, com a sobrancelha franzida em contemplação. 'Se eu pudesse ter apenas um momento do seu tempo, gostaria de discutir"
 bp2_yearly.2019.desc.kurultai:0 "o bem-estar do nosso rebanho."
 bp2_yearly.2019.desc.marshal:0 "os programas de treinamento para novos recrutas.\""
 bp2_yearly.2019.desc.marshal_unlanded:0 "os regimes de treinamento para novos recrutas."
 bp2_yearly.2019.desc.outro:0 "\n\n'Claro!' eu respondo. 'Venha, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. Eu gostaria de ouvir seus pensamentos sobre esses assuntos.'\n\n'Mas, [ROOT.Char.Custom('FormOfAddressForLiege')],\" [target_councilor.GetFirstNameNoTooltip] franze a testa, 'Não há uma alma aqui além de nós dois...'"
 bp2_yearly.2019.desc.spymaster:0 "a colocação de alguns agentes-chave em cortes estrangeiras.\""
 bp2_yearly.2019.desc.spymaster_unlanded:0 "a colocação de alguns agentes chave pelo reino."
 bp2_yearly.2019.desc.steward:0 "nossas estratégias para a coleta de impostos."
 bp2_yearly.2019.desc.steward_unlanded:0 "nossas estratégias para as finanças dos [ROOT.Char.GetHouse.GetBaseNameNoTooltip]."
 bp2_yearly.2019.t:0 "Excentricidades"
 bp2_yearly.2020.a:0 "Se você insiste..."
 bp2_yearly.2020.b:0 "Não! Eu não vou fazer isso!"
 bp2_yearly.2020.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip]... É um prazer vê-lo novamente... Passou algum tempo desde que conversamos pela última vez.\" Uma voz familiar ecoa pelo corredor escuro.\n\nCom um sobressalto, finalmente percebo a quem pertence essa voz... mas não... não pode ser! #EMP [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]?!#! Meu amigo imaginário da infância?\n\n\"Sou eu, [ROOT.Char.GetFirstNameNoTooltip]. Precisávamos um do outro todos aqueles anos atrás e agora precisamos um do outro novamente.\"\n\n\"Preciso que você faça algo por mim — #EMP por nós#!. Você deve matar seu [ROOT.Char.Custom2( 'RelationToMeShort', murder_target )], [murder_target.GetFirstName]. Só coisas boas virão disso... você verá.\""
 bp2_yearly.2020.t:0 "O Retorno de um Amigo Misterioso"
 bp2_yearly.2021.a:0 "Começarei imediatamente."
 bp2_yearly.2021.b:0 "Só preciso de um pouco mais de tempo para me preparar..."
 bp2_yearly.2021.c:0 "Estamos #EMP feitos#!, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]!"
 bp2_yearly.2021.desc:0 "\"Tsk, tsk, #EMP tsk!#!\"\n\n\"Tínhamos um acordo, [ROOT.Char.GetFirstNameNoTooltip]. Você concordou em matar [new_murder_target.GetTitledFirstName] e não fez nenhum esforço para alcançar esse objetivo,\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] me repreende pela falta de ação.\n\n\"Estou desapontado...\""
 bp2_yearly.2021.t:0 "Um Assassinato Adiado"
 bp2_yearly.2022.a:0 "Isso foi... #EMP bom#!."
 bp2_yearly.2022.b:0 "Não! Por favor, apenas vá embora..."
 bp2_yearly.2022.desc.next_target:0 "\"Mas não vamos perder tempo, querido amigo. [new_murder_target.GetFirstName] está #EMP pronto para ser abatido...#!\""
 bp2_yearly.2022.desc:0 "\"#EMP Bom [ROOT.Char.GetFirstNameNoTooltip], muito bom!#!...\"\n\n\"Você fez bem, meu amigo.\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] me parabeniza por ter assassinado com sucesso meu falecido [ROOT.Char.Custom2( 'RelationToMeShort', target )], [target.GetFirstName].\n\n\"Aquel[Select_CString( target.IsFemale, 'a', 'e' )] [target.Custom2('InsultNoun', ROOT.Char)] [target.Custom2('InsultAdjective', ROOT.Char)] mereceu tudo o que [target.GetSheHe] conseguiu. Nós fazemos uma #EMP excelente#! equipe,\" [ROOT.Char.Custom('GetSheHeOpposite')] continua. \"Você se sente melhor, não é? Assim como eu prometi...\"\n\n"
 bp2_yearly.2022.t:0 "$bp2_yearly.2020.t$"
 bp2_yearly.2023.a:0 "$bp2_yearly.2020.a$"
 bp2_yearly.2023.b:0 "Já tive o suficiente..."
 bp2_yearly.2023.desc:0 "\"Parece que houve... #EMP circunstâncias imprevistas#!... em torno do seu plano de matar [target.GetTitledFirstName]. Não importa. Logo corrigiremos esse erro.\"\n\n"
 bp2_yearly.2023.t:0 "Um Assassinato Frustrado"
 bp2_yearly.2024.a:0 "$bp2_yearly.2020.a$"
 bp2_yearly.2024.b:0 "$bp2_yearly.2023.b$"
 bp2_yearly.2024.desc:0 "$bp2_yearly.2023.desc$"
 bp2_yearly.2024.t:0 "$bp2_yearly.2023.t$"
 bp2_yearly.2025.a:0 "Eu anseio por #EMP sangue!#!"
 bp2_yearly.2025.desc:0 "\"Isso é espírito, [ROOT.Char.GetFirstNameNoTooltip]! Estou tão orgulhoso de você.\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] aparece diante de mim.\n\nSó posso imaginar e #EMP saborear#! o som estridente dos gritos do [Select_CString( target.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2( 'RelationToMePossessive', target )] enquanto [target.GetSheHe] inalava seu último e patético suspiro!\n\n\"Acredito que meu trabalho aqui está feito,\" [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip] diz.\n\n...mas mal consigo ouvir [ROOT.Var('imaginary_friend_name').Char.GetHerHis] sobre minha gargalhada histérica."
 bp2_yearly.2025.t:0 "O [ROOT.Char.GetTitleAsNameNoTooltip] Louco"
 bp2_yearly.2030.a.tt:0 "Sua próxima [GetActivityType('activity_pilgrimage').GetNameNoTooltip] para [target_holy_site.GetNameNoTier] terá 50% de desconto"
 bp2_yearly.2030.a:0 "Eu entendo o que devo fazer."
 bp2_yearly.2030.b:0 "Mesmo? Talvez eu deva repensar minha posição sobre tais coisas..."
 bp2_yearly.2030.c:0 "Tenho certeza de que [ROOT.Char.GetFaith.HighGodName] ouvirá minhas preces daqui."
 bp2_yearly.2030.desc:0 "\"#EMP [ROOT.Char.GetFirstNameNoTooltip]...#!\"\n\nVirando, vejo meu amigo, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], de pé atrás de mim — uma clara serenidade visível em seu semblante.\n\n\"Tenho algo que preciso lhe contar. Eu o guiei silenciosamente todos esses anos como seu amigo. No entanto, não sou apenas um amigo, mas um mensageiro de [ROOT.Char.GetFaith.HighGodName].\"\n\n\"Tenho um último pedido a fazer. Você deve acender uma vela em minha honra em [target_holy_site.GetNameNoTier]. Somente assim poderei partir para [ROOT.Char.GetFaith.PositiveAfterLife].\""
 bp2_yearly.2030.t:0 "Um Mensageiro"
 bp2_yearly.2031.a:0 "Esteja em paz agora, querido [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]."
 bp2_yearly.2031.desc:0 "Agora que finalmente cheguei a [ROOT.Char.GetCurrentLocation.GetName], é hora de homenagear meu amigo, [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]. [ROOT.Char.Custom('GetSheHeOpposite')|U] me ajudou em muitos momentos difíceis — uma verdadeira bênção em minha vida. Duvido que eu seria a [ROOT.Char.GetWomanMan] que sou hoje sem [ROOT.Char.Custom('GetSheHeOpposite')].\n\nEmbora [ROOT.Char.Custom('GetSheHeOpposite')] possa não permanecer comigo, sua memória viverá em mim. Enquanto acendo uma vela em homenagem a [ROOT.Char.Custom('GetSheHeOpposite')], sinto um leve toque no meu ombro. A chama da vela vacila. Há um sussurro fraco: \"#EMP Adeus [ROOT.Char.GetFirstNameNoTooltip]...#!\"\n\nObrigado, meu amigo."
 bp2_yearly.2031.t:0 "Homenageando [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip]"
 bp2_yearly.2040.a:0 "[lover.GetFirstNameNoTooltip] me aquecerá em sua ausência."
 bp2_yearly.2040.b:0 "Eu não sabia da devoção de [friend.GetFirstNamePossessiveNoTooltip] por mim!"
 bp2_yearly.2040.desc.friend:0 "\"[friend.GetFirstNameNoTooltip] se tornou seu amigo [ROOT.Char.Custom( 'GetPeriodOfTimeWord' )] atrás. [friend.GetSheHe|U] pode não ter percebido na época, mas sua dedicação a você não tem limites. Seu apoio a você é inabalável.\""
 bp2_yearly.2040.desc.lover:0 "\"Seu(a) [ROOT.Char.Custom2( 'RelationToMeShort', SCOPE.sC('lover') )], [lover.GetFirstNameNoTooltip], olha você de forma provocante. Talvez você nunca tenha notado, mas é verdade. [lover.GetSheHe|U] anseia pelo seu toque.\"\n\n"
 bp2_yearly.2040.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip], você se tornou um [ROOT.Char.GetTitleAsNameNoTooltip] tão notável,\" diz [ROOT.Var('imaginary_friend_name').Char.GetFirstNameNoTooltip], uma neblina crescendo em seus olhos.\n\n\"Você não precisa mais de mim. É hora de eu partir e deixá-lo viver sua vida plena e gloriosa. Há tantas pessoas ao seu redor para buscar apoio.\"\n\n"
 bp2_yearly.2040.t:0 "Um Amigo Parte"
 bp2_yearly.2100.a.tt:0 "Isso aprimorará seu [education_focus|E] [Concept('diplomacy', 'Diplomático')|E]"
 bp2_yearly.2100.a:0 "Talvez um [ROOT.Char.Custom('GetDiplomacyBuilding')]?"
 bp2_yearly.2100.b.tt:0 "Isso aprimorará seu [education_focus|E] [martial|E]"
 bp2_yearly.2100.b:0 "[ROOT.Char.Custom('GetMartialBuilding')], para afiar nossas espadas!"
 bp2_yearly.2100.c.tt:0 "Isso aprimorará seu [education_focus|E] [Concept('stewardship', 'Administrativo')|E]"
 bp2_yearly.2100.c:0 "Talvez um [ROOT.Char.Custom('GetStewardshipBuilding')] nos ensine o valor do dinheiro?"
 bp2_yearly.2100.d.tt:0 "Isso aprimorará seu [education_focus|E] de [intrigue|E]"
 bp2_yearly.2100.d:0 "Algo grande, como um [ROOT.Char.Custom('GetIntrigueBuilding')]!"
 bp2_yearly.2100.desc:0 "O cascalho solto sob meus pés estala enquanto [interlocutor.GetFirstName] e eu caminhamos por ele. Isso me faz lembrar as superfícies irregulares dos edifícios pelo país.\n\n\"Quero construir algo.\" [interlocutor.GetFirstNameNoTooltip] solta, claramente compartilhando meus pensamentos. \"Devemos construir algo, aqui, neste lugar! Um modelo de algum tipo!\" [interlocutor.GetSheHe|U] imediatamente começa a vasculhar nossos arredores, procurando materiais.\n\nEnquanto [interlocutor.GetFirstNameNoTooltip] corre em direção a uma pilha de madeira próxima, pondero mais sobre a natureza de nossa atividade. Construir #EMP o quê#!, precisamente?"
 bp2_yearly.2100.e.tt:0 "Isso aprimorará seu [education_focus|E] de [learning|E]"
 bp2_yearly.2100.e:0 "Nosso próprio centro de aprendizado, como [ROOT.Char.Custom('GetLearningBuilding')]!"
 bp2_yearly.2100.t:0 "Estabelecendo Fundações"
 bp2_yearly.2110.a:0 "\"Você vai chegar lá, [interlocutor.GetFirstNameNoTooltip]. Vamos, vamos tentar de novo!\""
 bp2_yearly.2110.b:0 "\"Estou destinado a ser o melhor guerreiro da Casa [ROOT.Char.GetHouse.GetBaseNameNoTooltip].\""
 bp2_yearly.2110.c:0 "Permaneça em silêncio."
 bp2_yearly.2110.desc:0 "Meu [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )], [interlocutor.GetFirstName], e eu estamos praticando nossa habilidade marcial no pátio.\n\n\"#EMP Ugh!#!\" [interlocutor.GetSheHe] grunhe enquanto eu a jogo no chão. [interlocutor.GetSheHe|U] me olha com admiração. \"Você é habilidoso com uma arma, [ROOT.Char.GetFirstNameNoTooltip]. Eu gostaria de ter metade da sua habilidade.\""
 bp2_yearly.2110.t:0 "[GetTrait('humble').GetNameNoTooltip( ROOT.Char )] ou [GetTrait('arrogant').GetNameNoTooltip( ROOT.Char )]?"
 bp2_yearly.2120.a:0 "\"Você está certo. Minha glutonaria precisa ser controlada.\""
 bp2_yearly.2120.b:0 "\"Banquete #EMP faz#! um [ROOT.Char.GetTitleAsNameNoTooltip]!"
 bp2_yearly.2120.desc:0 "#EMP Clink, clink!#!\n\nMinha colher raspa o fundo da tigela enquanto devoro mais uma porção de ensopado. Mato minha sede com goles generosos do meu copo que em breve precisará ser reabastecido. Eu simplesmente não consigo o suficiente.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! O que você está fazendo? Você não acha que tem... bem, #EMP consumido#! um pouco demais recentemente?\""
 bp2_yearly.2120.t:0 "[GetTrait('temperate').GetNameNoTooltip( ROOT.Char )] ou [GetTrait('gluttonous').GetNameNoTooltip( ROOT.Char )]?"
 bp2_yearly.2130.a.flavor:0 "Você dá o seu brinquedo para a criança"
 bp2_yearly.2130.a:0 "\"Aqui, que você aprecie este [ROOT.Char.Custom( 'child_favorite_toy' )] assim como eu."
 bp2_yearly.2130.b:0 "\"Aqueles menos afortunados não merecem minha generosidade.\""
 bp2_yearly.2130.desc:0 "É uma ocasião rara que consigo passar por todos os meus atendentes sem ser notado e garantir alguns momentos preciosos para mim — uma chance de finalmente me sentir como as outras crianças devem.\n\nApertando meu [ROOT.Char.Custom( 'child_favorite_toy' )], ando pelas ruas de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], absorvendo todos os vislumbres e cheiros. As pessoas estão se apressando; mercadores vendendo suas mercadorias.\n\nChego a uma criança camponesa doente encurralada no canto de um beco."
 bp2_yearly.2130.t:0 "[GetTrait('generous').GetNameNoTooltip( ROOT.Char )] ou [GetTrait('greedy').GetNameNoTooltip( ROOT.Char )]?"
 bp2_yearly.2140.a:0 "\"Sim, [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )]. Não pude resistir.\""
 bp2_yearly.2140.b:0 "\"Claro que não! Eu simplesmente não conseguia dormir.\""
 bp2_yearly.2140.desc:0 "Silenciosamente, eu ando pelo corredor com meu petisco noturno em mãos. As cozinhas sempre têm eles prontos nas primeiras horas da manhã. Não há nada como saborear um [ROOT.Char.Custom( 'FavoriteTreat' )] recém-feito.\n\nAo virar uma esquina, me deparo com a visão do meu(a) [ROOT.Char.Custom2( 'RelationToMeShort', interlocutor )], [interlocutor.GetFirstName], esfregando o sono dos olhos. \"[ROOT.Char.GetFirstNameNoTooltip]! Você saqueou as cozinhas #EMP de novo#!?\"\n\nEu escondo o [ROOT.Char.Custom( 'FavoriteTreat' )] culpado."
 bp2_yearly.2140.t:0 "[GetTrait('honest').GetNameNoTooltip( ROOT.Char )] ou [GetTrait('deceitful').GetNameNoTooltip( ROOT.Char )]?"
 bp2_yearly.2150.a:0 "As ervas são inúteis sem o conhecimento adequado de seus usos."
 bp2_yearly.2150.b:0 "Estimular o crescimento de novas vidas é incomparável."
 bp2_yearly.2150.c:0 "Não vou continuar desperdiçando meu tempo com plantas."
 bp2_yearly.2150.desc:0 "Nos últimos quatorze dias, [Select_CString( interlocutor.IsFemale, 'minha', 'meu' )] [GetCourtPositionType('court_physician_court_position').GetNameNoTooltip()], [interlocutor.GetFirstName], tem me ensinado tudo sobre o crescimento e cultivo de plantas, assim como seus respectivos usos na medicina.\n\nHoje, [interlocutor.GetSheHe] trouxe-me para olhar seus livros. \"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [interlocutor.Custom2( 'RelationToMeShort', ROOT.Char )], você fez um progresso incrível. No entanto, é hora de escolher um foco para seus estudos.\"\n\n\"Você prefere se concentrar em horticultura ou está mais atraído pelos impactos práticos de tais plantas?"
 bp2_yearly.2150.t:0 "[GetTrait('lifestyle_herbalist').GetNameNoTooltip( ROOT.Char )] ou [GetTrait('lifestyle_gardener').GetNameNoTooltip( ROOT.Char )]?"
 bp2_yearly.2160.a:0 "\"Não se preocupe, [interlocutor.GetFirstNameNoTooltip]. Você vai melhorar com a prática.\""
 bp2_yearly.2160.b.flavor:0 "Você esfrega terra do chão do [ROOT.Char.Custom('GetCourtyard')] em sua ferida"
 bp2_yearly.2160.b:0 "\"Mais dor garantirá que você não esqueça esse erro!\""
 bp2_yearly.2160.desc:0 "Passeando pelo [ROOT.Char.Custom('GetCourtyard')], vejo [interlocutor.GetFirstNameNoTooltip] se sparrando com outras crianças sob a orientação de [marshal.GetTitledFirstName]. [interlocutor.GetSheHe|U] não está indo muito bem, infelizmente, e [interlocutor.GetSheHe] é de repente derrubado, quase me fazendo cair.\n\n\"Desculpe, [Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [interlocutor.Custom2( 'RelationToMeShort', ROOT.Char )],\" [interlocutor.GetSheHe] diz enquanto [interlocutor.GetSheHe] se levanta, limpando [interlocutor.GetHerselfHimself].\n\nSua ferida é recente."
