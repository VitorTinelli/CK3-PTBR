l_spanish:
 bp2_yearly.0601.a:0 "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.b:0 "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.c:0 "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.d:0 "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.desc.child_reaction.admiration:0 "\n\nHá algo fundamentalmente certo nisso para mim. [regent.GetFirstNameNoTooltip] compreende a verdadeira ordem das coisas, que é assim que a nobreza #EMP deveria#! se comportar."
 bp2_yearly.0601.desc.child_reaction.boredom:0 "\n\nAcho as opiniões de [regent.GetFirstNamePossessiveNoTooltip] sobre isso #EMP completamente#! desinteressantes, mas estou preso nessa palestra. Com certeza, terei tempo de sobra para aprender tudo isso quando for [ROOT.Char.GetTitleAsNameNoTooltip] sozinho?"
 bp2_yearly.0601.desc.child_reaction.disgust:0 "\n\nIsso me parece errado. Há algo horrível em imaginar [regent.GetFirstNameNoTooltip] tratando seus inferiores assim e imaginando que isso é algo #EMP bom#!."
 bp2_yearly.0601.desc.diplomacy.arrogant:0 "política. Para [regent.GetSheHe], tudo se resume a colocar os outros em seu lugar, transmitir poder e aumentar sua majestade. As palavras são o meio pelo qual [regent.GetSheHe] estabelece verdadeira dominância."
 bp2_yearly.0601.desc.diplomacy.fallback:0 "política. Boa postura, fala eloquente, retórica, as complexidades da negociação - toda a fanfarronice usual com a qual a política adulta parece tão obcecada."
 bp2_yearly.0601.desc.diplomacy.humble:0 "política. Para [regent.GetSheHe], a chave parece ser a empatia - a pessoa com quem você está falando pode estar abaixo de você, mas a modéstia na diplomacia se torna magnanimidade, e magnanimidade implicitamente vem de uma posição de força."
 bp2_yearly.0601.desc.intrigue.callous:0 "manobras políticas. [regent.GetSheHe|U] fala em frases curtas e absolutas e dá julgamentos rápidos, sempre. Rivalidades devem ser resolvidas prontamente, por força ou charme, nem sempre com punições desnecessárias nem tola misericórdia."
 bp2_yearly.0601.desc.intrigue.compassionate:0 "manobras políticas. Para [regent.GetSheHe], a questão é como melhor atravessar o ninho de vespas sem sujar as mãos, a menos que seja absolutamente necessário."
 bp2_yearly.0601.desc.intrigue.fallback:0 "manobras políticas. Guardando-se contra conspirações, exercendo poder por meio de insinuações, quais cargos detêm influência secreta, e assim por diante. Pior, grande parte da própria lição é composta de duplos sentidos e inferências."
 bp2_yearly.0601.desc.intrigue.sadistic:0 "manobras políticas. [regent.GetSheHe|U] passa a maior parte do tempo saboreando descrições inventivas de punições para rivais, discutindo os pontos mais finos de cultivar uma reputação e reiterando que é mais fácil ser temido do que amado."
 bp2_yearly.0601.desc.intro:0 "Como meu [ROOT.Char.GetDiarchTitle], [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] parece determinado a me ensinar seus métodos preferidos de governar."
 bp2_yearly.0601.desc.learning.fallback:0 "escolástica e teologia. É um discurso monótono sobre história, filosofia, acadêmicos de cheiro estranho de terras distantes, todas as trivialidades habituais, mas o ponto central [regent.GetHerHim] parece ser que um governante educado torna o povo feliz."
 bp2_yearly.0601.desc.learning.gregarious:0 "escolástica e teologia. Estrondoso e sincero, [regent.GetSheHe] lista seus historiadores e filósofos favoritos, estrelas acadêmicas em ascensão e teorias fortemente debatidas, e como o aprendizado beneficia tanto governantes quanto governados."
 bp2_yearly.0601.desc.learning.shy:0 "escolástica e teologia. Tão manso como [regent.GetSheHe] é, mal consigo ouvir [regent.GetSheHe], mas [regent.GetSheHe] murmura por um longo tempo, falando das muitas lições de governo a serem encontradas nas obras de luminárias passadas."
 bp2_yearly.0601.desc.martial.calm:0 "teoria militar. [regent.GetSheHe|U] foca nos benefícios da restrição no planejamento, de ter um exército enxuto, de usar estratégia para minimizar quantas vidas são sacrificadas na luta. Para [regent.GetSheHe], cuidado e calma trazem a vitória."
 bp2_yearly.0601.desc.martial.fallback:0 "teoria militar. Onde montar um acampamento, como cuidar de um grande número de cavalos em campanha, quais formações funcionam melhor contra nossos inimigos tradicionais, e por aí vai..."
 bp2_yearly.0601.desc.martial.wrathful:0 "teoria militar. [regent.GetSheHe|U] está praticamente espumando durante toda a aula, enfatizando que, uma vez que a batalha começa, a violência deve ser aplicada rapidamente e generosamente para garantir a vitória. Dar quartel convida à derrota."
 bp2_yearly.0601.desc.rationale.disloyal.likes_you:0 "[regent.GetSheHe|U] é um tanto desonesto como [ROOT.Char.GetDiarchTitle], mas, mesmo assim, [regent.GetSheHe] parece ter gostado de me ensinar.\n\n"
 bp2_yearly.0601.desc.rationale.fallback:0 "Por que [regent.GetSheHe] faz isso, eu nunca consegui entender, mas às vezes [regent.GetSheHe] insiste.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.fallback:0 "As lições são longas, mas parecem vir da bondade do coração [regent.GetHerHim], ou pelo menos o afeto [regent.GetHerHim] por mim.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.honourable:0 "Métodos que sempre parecem de alguma forma retornar à honra, às regras rígidas pelas quais ela é aplicada e como ela pode ser obtida.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.loyalty_hook:0 "Invariavelmente, as lições começam com [regent.GetSheHe] reiterando que [regent.GetSheHe] jurou ser fiel a mim em todas as coisas, incluindo aprendizado.\n\n"
 bp2_yearly.0601.desc.rationale.loyal.predecessor_hook:0 "É raro que essas lições passem sem que [regent.GetSheHe] me lembre do juramento que [regent.GetSheHe] fez ao meu antecessor.\n\n"
 bp2_yearly.0601.desc.rationale.neutral.likes_you:0 "[regent.GetSheHe|U] não está muito envolvido como [ROOT.Char.GetDiarchTitle], mas, mesmo assim, [regent.GetSheHe] tira um tempo para me ensinar quando pode.\n\n"
 bp2_yearly.0601.desc.skill.boilerplate:0 "A aula de hoje aborda #EMP ainda mais#!"
 bp2_yearly.0601.desc.stewardship.fallback:0 "comércio e impostos. Impostos e comércio. Um discurso interminável e mutável sobre os detalhes finos da cunhagem, os melhores métodos para extrair riqueza e as inúmeras maneiras pelas quais tanto plebeus quanto nobres podem tentar esconder o que me é devido."
 bp2_yearly.0601.desc.stewardship.generous:0 "comércio e impostos. Para [regent.GetSheHe], a prata é um meio para um fim, e esse fim é mais importante do que possuir riquezas por si só. A moeda deve ser retirada por um governante, sim, mas apenas quando necessário e sempre devolvida livremente."
 bp2_yearly.0601.desc.stewardship.greedy:0 "comércio e impostos. Nada deixa [regent.GetSheHe] mais animado do que comércio e impostos. A expressão de avareza alegre escrita [regent.Custom('MaskFace_BehindAcross')] seu(a) [regent.Custom('MaskFace')] parece quase extática, encantada com as muitas maneiras de obter prata, enumerando-as cuidadosamente uma por uma por horas a fio."
 bp2_yearly.0601.e:0 "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.f:0 "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.g:0 "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.h:0 "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.i:0 "$bp2_yearly.0601.option.skill$"
 bp2_yearly.0601.j:0 "$bp2_yearly.0601.option.perk$"
 bp2_yearly.0601.k:0 "Passar a tarde sonhando acordado com a lição."
 bp2_yearly.0601.option.perk:0 "Focar no espírito do conselho."
 bp2_yearly.0601.option.skill:0 "Prestar atenção nos detalhes técnicos."
 bp2_yearly.0601.t:0 "Governando Corretamente"
 bp2_yearly.0611.a:0 "Talvez uma carta sincera possa persuadir [regent.GetSheHe]..."
 bp2_yearly.0611.b.tt:0 "Você faz birra até que [regent.GetFirstNameNoTooltip] te leve às reuniões importantes"
 bp2_yearly.0611.b:0 "#BER Eu sou o [ROOT.Char.GetTitleAsNameNoTooltip] e exijo ser ouvido!"
 bp2_yearly.0611.c:0 "Quem se importa? Mais tempo para brincar lá fora!"
 bp2_yearly.0611.d.tt.failure.deceitful:0 "Devido à [personality|E] [regent.GetHerHim], [regent.GetFirstNameNoTooltip] respeita a tentativa"
 bp2_yearly.0611.d.tt.failure:0 "[regent.GetSheHe|U] está irritado com sua choraminga"
 bp2_yearly.0611.d.tt.success:0 "Você obtém a recompensa prometida de [regent.GetFirstName]"
 bp2_yearly.0611.d:0 "Cheiro uma oportunidade."
 bp2_yearly.0611.desc.government.fallback:0 "para alguns documentos importantes, ou o uso dos selos da casa, ou para falar com algum oficial, ou... ou..."
 bp2_yearly.0611.desc.government.tribal:0 "para falar com algum ancião influente, ou consultar o conselho, ou emprestar mensageiros oficiais, ou... ou..."
 bp2_yearly.0611.desc.intro.bad_history:0 "Apesar de algumas coisas que [regent.GetSheHe] fez a mim e aos meus no passado, [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] ainda é meu [ROOT.Char.GetDiarchTitle]. Mesmo assim, [regent.GetSheHe] mal sai de [regent_capital.GetBaseNameNoTier].\n\n"
 bp2_yearly.0611.desc.intro.fallback:0 "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] trabalha tão duro como meu [ROOT.Char.GetDiarchTitle], bem escondido em seu escritório em [regent_capital.GetBaseNameNoTier].\n\n"
 bp2_yearly.0611.desc.outro:0 "\n\nEu só queria que [regent.GetSheHe] pensasse um pouco em #EMP mim#! às vezes, e não apenas em [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]."
 bp2_yearly.0611.desc.regent_opinion.fallback:0 "Eu sei que [regent.GetSheHe] acha que sou apenas uma criança, mas certamente ainda devo valer um pouco de tempo? Em vez disso, as visitas são sempre completamente"
 bp2_yearly.0611.desc.regent_opinion.negative:0 "Eu sei que [regent.GetSheHe] não gosta muito de mim, mas sou tão miserável que cada visita deve ser sempre"
 bp2_yearly.0611.desc.regent_opinion.positive:0 "Eu sei que [regent.GetSheHe] deve me proteger até que eu seja [Select_CString( ROOT.Char.IsFemale, 'uma mulher adulta', 'um homem adulto' )], mas mesmo quando [regent.GetSheHe] visita, parece que é sempre"
 bp2_yearly.0611.e:0 "Pergunto-me o que há nos aposentos privados [regent.GetHerHim] quando [regent.GetSheHe] está ausente?"
 bp2_yearly.0611.f.fallback:0 "Bah, posso ler história sem [regent.GetSheHe]."
 bp2_yearly.0611.f.young:0 "Vou encontrar outra pessoa para ler para mim!"
 bp2_yearly.0611.g.tt:0 "Sua próxima [activity|E] de [GetActivityType('activity_playdate').GetName] é gratuita, e [characters|E] são mais propensos a comparecer"
 bp2_yearly.0611.g:0 "Harrumph, posso organizar minha própria diversão."
 bp2_yearly.0611.t:0 "Segunda Capital de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierPossessiveNoTooltip]"
 bp2_yearly.0621.a:0 "Que bela surpresa!"
 bp2_yearly.0621.b:0 "Hmmm... arm wrestling para dobrar?"
 bp2_yearly.0621.c:0 "Você não acha que está esquecendo de algo?"
 bp2_yearly.0621.d:0 "Você escondeu mais em algum lugar, eu sei..."
 bp2_yearly.0621.desc.gift.cat:0 "um gato elegante, uma pata levantada, parecendo chocado ao me ver tanto quanto eu ao vê-lo."
 bp2_yearly.0621.desc.gift.dog:0 "um elegante cão de caça, sua cauda abanando furiosamente."
 bp2_yearly.0621.desc.gift.eagle:0 "um filhote de águia astuto, com as asas abertas, empoleirado em um pedestal."
 bp2_yearly.0621.desc.gift.event_troops:0 "um servo armado, ajoelhado e oferecendo-me sua mão em fidelidade."
 bp2_yearly.0621.desc.gift.gold:0 "altas pilhas de moedas de prata e ouro moldadas na forma de uma coroa."
 bp2_yearly.0621.desc.gift.piety:0 "um modelo elaborado de um[ROOT.Char.GetFaith.HouseOfWorship], bem como uma placa explicando a nova ala a ser construída com minha doação."
 bp2_yearly.0621.desc.gift.prestige:0 "um grupo de cantores e dançarinos, que avançam girando e trinando uma música composta sobre mim."
 bp2_yearly.0621.desc.intro.bad_history:0 "Apesar de todas as coisas que [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] me fez no passado, [regent.GetSheHe] parece determinado a compensar com presentes elaborados.\n\n"
 bp2_yearly.0621.desc.intro.fallback:0 "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem sido especialmente atencioso ultimamente. [regent.GetSheHe|U] sempre parece me trazer os melhores presentes, fazendo [regent.GetHerHim] o melhor [ROOT.Char.GetDiarchTitle].\n\n"
 bp2_yearly.0621.desc.midtro:0 "\"Ah, aí está você, jovem [ROOT.Char.Custom('MistressMaster')],\" [regent.GetSheHe] ri enquanto eu entro no pátio, onde [Select_CString( regent.IsFemale, 'a', 'o' )] [regent.GetWomanMan] aguarda com algo coberto por um pano. \"Hoje, tenho algo muito especial para você\", [regent.GetSheHe] sussurra, conspiratoriamente.\n\nCom isso, o pano cai, revelando"
 bp2_yearly.0621.e:0 "Li que é boa sorte dar presentes grandes..."
 bp2_yearly.0621.extra_stuff.failure:0 "Você recebe o que recebe e ficará feliz com isso"
 bp2_yearly.0621.extra_stuff.success:0 "[regent.GetFirstName] encontra mais para presentear de última hora"
 bp2_yearly.0621.f:0 "Isso não pode ser a única coisa?"
 bp2_yearly.0621.g.bad_blood:0 "Você não pode comprar o meu amor, #EMP [regent.GetFirstNameNoTooltip]#!."
 bp2_yearly.0621.g.good_terms:0 "Obrigado, mas já tenho um. Provavelmente."
 bp2_yearly.0621.t.close_family:0 "Presentes para [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip]"
 bp2_yearly.0621.t.fallback:0 "Presentes [Select_CString( regent.IsFemale, 'da', 'do' )] [regent.Custom('GetAuntUncle')|U] [regent.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.0631.a:0 "Se... é isso que você acha que é melhor..."
 bp2_yearly.0631.b.tt:0 "Você se recusa a negar [rival_successor.GetFirstNameNoTooltip]"
 bp2_yearly.0631.b:0 "Nunca! Isso são nada além de mentiras distorcidas que você conta!"
 bp2_yearly.0631.c.bossy:0 "Não venha trazer seus problemas pessoais para #EMP mim#!."
 bp2_yearly.0631.c.charming:0 "Tenho certeza de que posso convencer [rival_successor.GetSheHe] se for necessário."
 bp2_yearly.0631.c.curious:0 "Difícil acreditar somente nas palavras de um de vocês, [regent.GetFirstNameNoTooltip]."
 bp2_yearly.0631.c.pensive:0 "Eu... vou ter que pensar sobre isso..."
 bp2_yearly.0631.c.rowdy:0 "Já tenho idade suficiente para reconhecer uma briga pessoal."
 bp2_yearly.0631.desc.intro.negative:0 "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem um... histórico misto como meu [ROOT.Char.GetDiarchTitle]. [regent.GetSheHe|U] deveria ser meu escudo e protetor, mas [regent.GetSheHe] parece mais interessado em enriquecer a [regent.GetHerselfHimself].\n\nPortanto, não me surpreendo quando [regent.GetSheHe] me conta de todos os terríveis pecados pelos quais [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] é acusado.\n\n"
 bp2_yearly.0631.desc.intro.positive:0 "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] provou-se geralmente um [ROOT.Char.GetDiarchTitle] leal, com seu conselho sempre tentando manter os meus melhores interesses em mente.\n\nPortanto, é algo sério e muito preocupante quando [regent.GetSheHe] me conta de todos os terríveis pecados pelos quais [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] é acusado.\n\n"
 bp2_yearly.0631.desc.intro.vague:0 "O serviço de [regent.Custom2('MyCharacterIntroductionPossessive', ROOT.Char)|U] como meu [ROOT.Char.GetDiarchTitle] não tem sido tudo o que [regent.GetSheHe] prometeu que seria; às vezes [regent.GetSheHe] me ajuda, mas tão frequentemente [regent.GetSheHe] parece olhar apenas para si mesma.\n\nPortanto, estou muito incerto quando [regent.GetSheHe] me conta de todos os terríveis pecados pelos quais [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] é acusado.\n\n"
 bp2_yearly.0631.desc.outro:0 "\n\n\"Se você não falar contra [rival_successor.GetSheHe] agora, [rival_successor.GetSheHe] ainda pode encontrar uma maneira de tomar minha posição e causar a você um dano #EMP permanente#!."
 bp2_yearly.0631.desc.rationale.criminality:0 "\"... [rival_successor.GetSheHe] é um criminoso conhecido, [ROOT.Char.GetFirstNameNoTooltip], um criminoso que certamente procura mais oportunidades para o pecado e o vício. O poder conferido a [rival_successor.GetSheHe] faz [rival_successor.GetSheHe] se tornar [ROOT.Char.GetDiarchTitle]...\""
 bp2_yearly.0631.desc.rationale.generic:0 "\"... onde quer que [rival_successor.GetSheHe] vá, [rival_successor.GetSheHe] faz inimigos, [ROOT.Char.GetFirstNameNoTooltip], eu incluso. Trate o [rival_successor.GetWomanMan] muito gentilmente e [rival_successor.GetSheHe] certamente aproveitará sua generosidade e o trairá em pouco tempo\"."
 bp2_yearly.0631.desc.rationale.hideousness:0 "\"... quero dizer, #EMP olhe#! para o [rival_successor.GetWomanMan]! Se '[rival_successor.GetWomanMan]' [rival_successor.GetSheHe] pode ser chamado disso — vi sapos de aparência melhor meio esmagados pelas rodas de carrinhos. Tamanha feiura, sem dúvida, indica todos os tipos de impulsos pecaminosos, borbulhando através da pele miserável [rival_successor.GetHerHim]."
 bp2_yearly.0631.desc.rationale.nemesis:0 "\"...aquele odioso vermizinho certamente está tramando sua queda, [ROOT.Char.GetFirstNameNoTooltip], assim como [rival_successor.GetSheHe] está tramando a minha, e a ruína de toda [ROOT.Char.GetPrimaryTitle.GetDefinitiveName]!\""
 bp2_yearly.0631.desc.rationale.opposing_traits:0 "\"... mesmo falando com [rival_successor.GetSheHe] por mais de um momento pode levar um(a) [regent.GetWomanMan] à loucura, [ROOT.Char.GetFirstNameNoTooltip] — é surpreendente como um [rival_successor.GetWomanMan] pode estar tão completamente errado sobre #EMP tudo#!\"."
 bp2_yearly.0631.desc.rationale.petty_opinions:0 "\"... nem é nenhum incidente específico, [ROOT.Char.GetFirstNameNoTooltip], é simplesmente tudo sobre a maneira como o [rival_successor.GetWomanMan] se comporta — com o tempo, [rival_successor.GetSheHe] certamente vai virar todos [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] contra você de pura irritação.\""
 bp2_yearly.0631.desc.rationale.revenge:0 "\"... aquele agente estridente do [regent.GetFaith.DevilName] cometeu crimes indizíveis contra mim e os meus, [ROOT.Char.GetFirstNameNoTooltip], e certamente voltará seu espírito vingativo contra todos [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] se tiver a chance\"."
 bp2_yearly.0631.desc.rationale.rival:0 "\"... [rival_successor.GetWomanMan] é um cafajeste do mais alto nível, [ROOT.Char.GetFirstNameNoTooltip] — um mentiroso, um ladrão e um patife com a intenção de semear conflitos e discórdias em seu reino\"."
 bp2_yearly.0631.desc.rationale.sins:0 "\"... eu não posso concordar em compartilhar uma mesa com [rival_successor.GetWomanMan], nenhum bom [regent.GetFaith.GetAdherentName] poderia — e você também não deveria, [ROOT.Char.GetFirstNameNoTooltip], a menos que queira que os pecados [rival_successor.GetHerHim] deixem uma marca em seu frágil coração jovem\"."
 bp2_yearly.0631.desc.rationale.warmonger:0 "\"... [rival_successor.GetSheHe] é um demônio e um belicista, [ROOT.Char.GetFirstNameNoTooltip], alguém cujo apetite por destruição injusta não conhece limites. [rival_successor.GetSheHe|U] mergulhará todo [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] na guerra civil se lhe derem a menor chance!\""
 bp2_yearly.0631.t:0 "Palavras Sussurradas"
 bp2_yearly.0641.a:0 "Se você diz..."
 bp2_yearly.0641.b:0 "Você está indo longe demais, [regent.GetFirstNameNoTooltip]."
 bp2_yearly.0641.c.bossy:0 "Isso está abaixo de mim — faça como quiser."
 bp2_yearly.0641.c.charming:0 "Você sabe melhor — não pode #EMP você#! cuidar disso!?"
 bp2_yearly.0641.c.curious:0 "Que cansativo — não podemos falar sobre algo diferente?"
 bp2_yearly.0641.c.pensive:0 "Tenho estudos para cuidar, temo."
 bp2_yearly.0641.c.rowdy:0 "Você é o [ROOT.Char.GetDiarchTitle] — resolva isso você mesmo!"
 bp2_yearly.0641.c.tt:0 "Você dá a [regent.GetFirstNameNoTooltip] carta branca, mas não endossa"
 bp2_yearly.0641.desc.cowed_vassal:0 "organizar mais #EMP contribuições#! de seus vassalos mais temerosos\"."
 bp2_yearly.0641.desc.dynasty:0 "ter cartas lisonjeiras escritas em seu nome até para sua família mais distante\"."
 bp2_yearly.0641.desc.fellow_vassals:0 "ter cartas de amizade escritas para os vassalos de [ROOT.Char.GetLiege.GetTitledFirstName], fazendo amigos em [ROOT.Char.GetLiege.GetPrimaryTitle.GetDefinitiveName]\"."
 bp2_yearly.0641.desc.free_ho_hire:0 "arranjar os serviços de alguns dos guerreiros mais ferozes de nossa fé, para serem usados durante a sua maioridade\"."
 bp2_yearly.0641.desc.hof:0 "enviar uma carta efusiva para [ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName], aumentando sua posição com o representante escolhido de [ROOT.Char.GetFaith.HighGodName]\"."
 bp2_yearly.0641.desc.intro.fallback:0 "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] entra confiante no pequeno estudo, segurando um monte de pergaminhos.\n\n$bp2_yearly.0641.desc.intro.request_boilerplate$ Se você puder, assine e selle esses documentos\".\n\n"
 bp2_yearly.0641.desc.intro.request_boilerplate:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U] e [ROOT.Char.GetTitleAsNameNoTooltip], como seu [ROOT.Char.GetDiarchTitle], preciso de um pouco mais de autoridade para cuidar de um assunto de alguma importância."
 bp2_yearly.0641.desc.intro.tribal:0 "Um leigo idoso segue [regent.Custom2('MyCharacterIntroduction', ROOT.Char)] ao entrar no pequeno estudo.\n\n$bp2_yearly.0641.desc.intro.request_boilerplate$ Essa testemunha vai verificar seu juramento\".\n\n"
 bp2_yearly.0641.desc.maa_maintenance:0 "ver se não conseguimos encontrar algum extra para suas tropas domésticas\"."
 bp2_yearly.0641.desc.mercenary_cost_reduction:0 "arranjar um desconto com alguns dos mercenários que inundam suas terras. A ser usado após a sua maioridade, é claro\"."
 bp2_yearly.0641.desc.midtro:0 "\"Claro, eu nunca me aproximaria de você de mãos vazias! Por esse pequeno favor, eu vou"
 bp2_yearly.0641.desc.outro.fallback:0 "\n\nTudo o que tenho que fazer é rabiscar as letras."
 bp2_yearly.0641.desc.outro.tribal:0 "\n\nTudo o que tenho que fazer é dizer as palavras."
 bp2_yearly.0641.desc.powerful_vassal:0 "falar com os magnatas mais poderosos em suas terras, assegurando-lhes que suas vozes são ouvidas\"."
 bp2_yearly.0641.desc.raid_speed:0 "arranjar saqueadores veteranos para se juntar às suas bandas de guerra, para trazer-lhe rico saque estrangeiro\"."
 bp2_yearly.0641.desc.realm_priest:0 "falar com o [ROOT.Char.GetCouncillorPosition('councillor_court_chaplain').GetPositionName] e garantir que você permaneça em boa posição com o clero\"."
 bp2_yearly.0641.desc.vs_baron:0 "falar com seus vassalos menores, mantendo os menos nobres entre os nobres na linha\"."
 bp2_yearly.0641.desc.vs_courtly:0 "falar com seus vassalos mais sofisticados, garantindo que você permaneça em suas boas graças\"."
 bp2_yearly.0641.desc.vs_glory_hound:0 "falar com seus vassalos mais sedentos de sangue, mantendo-os certos de seu destino glorioso\"."
 bp2_yearly.0641.desc.vs_minority:0 "falar com seus vassalos mais ecléticos, mantendo a diversidade de seu reino estável\"."
 bp2_yearly.0641.desc.vs_parochial:0 "falar com seus vassalos mais isolados, deixando-os saber que a capital está sensível às preocupações deles\"."
 bp2_yearly.0641.desc.vs_zealot:0 "falar com seus vassalos mais zelosos, assegurando-lhes sua piedade em nome de [ROOT.Char.GetFaith.HighGodName]\"."
 bp2_yearly.0641.desc.war_income:0 "organizar uma taxa de guerra a ser cobrada nestes tempos difíceis\"."
 bp2_yearly.0641.t:0 "Quid Pro Quo"
 bp2_yearly.0651.a:0 "E você jura que nunca me trairá?"
 bp2_yearly.0651.b:0 "[ROOT.Char.GetFirstNameNoTooltip] e [regent.GetFirstNameNoTooltip], amigos para sempre!"
 bp2_yearly.0651.c:0 "Isso é legal, mas estou contando uma história."
 bp2_yearly.0651.d:0 "Vamos lá, vamos contar à corte sobre o meu dia!"
 bp2_yearly.0651.desc.intro:0 "Meu [ROOT.Char.GetDiarchTitle] [regent.GetFirstName] ouve atentamente minha história, olhos brilhando com interesse e afeição enquanto"
 bp2_yearly.0651.desc.outro:0 "\n\n\"Sempre estarei aqui para você, meu [ROOT.Char.GetTitleAsNameNoTooltip]. Mesmo quando chegar a ascensão do [regent.GetFaith.random_NegativeAfterLife], você pode contar comigo\"."
 bp2_yearly.0651.desc.rationale.compassion:0 "\n\n\"Sinto-me tão sortud[Select_CString( regent.IsFemale, 'a', 'o' )] por servi-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], pequen[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetFirstNameNoTooltip],\" [regent.GetSheHe] suspira, \"sortud[Select_CString( regent.IsFemale, 'a', 'o' )] por poder ver [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetWomanMan] em que você está se tornando.\""
 bp2_yearly.0651.desc.rationale.fallback:0 "\n\n\"Pequeno [ROOT.Char.GetFirstNameNoTooltip], um dia, você vai ser o maior [ROOT.Char.GetTitleAsNameNoTooltip] que [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] já teve. Estou tão orgulhoso do [ROOT.Char.GetWomanMan] em que você está se transformando\"."
 bp2_yearly.0651.desc.rationale.loyalty:0 "\n\n\"Você me deixa orgulhoso, você sabia disso? Orgulhoso em [Select_CString( ROOT.Char.IsFemale, 'protegê-la como uma', 'protegê-lo como um' )] [ROOT.Char.Custom('GirlBoy')], e um dia, ainda mais orgulhoso em servir como [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetWomanMan]\"."
 bp2_yearly.0651.desc.rationale.predecessor:0 "\n\n\"[Select_CString( ROOT.Char.IsFemale, 'Pequena', 'Pequeno' )] [ROOT.Char.GetFirstNameNoTooltip], você me lembra tanto [predecessor.GetFirstName] quando fala assim,\" suspira [Select_CString( regent.IsFemale, 'a', 'o' )] [regent.GetWomanMan], claramente perdid[Select_CString( regent.IsFemale, 'a', 'o' )] em memórias junto com minhas palavras; \"você se parece tanto com [Select_CString( predecessor.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('RelationToMeShort', predecessor)].\""
 bp2_yearly.0651.desc.story.bossy.court_protocol:0 "Detalho e demonstro o novo protocolo da corte que desejo implementar. Acho que realmente demonstrará minha dignidade como o único e verdadeiro [ROOT.Char.GetTitleAsName] de [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]."
 bp2_yearly.0651.desc.story.bossy.organised_game:0 "Explico como organizei um jogo com as outras crianças da corte, as coloquei em times e conduzi tudo sozinho."
 bp2_yearly.0651.desc.story.bossy.servants_caught:0 "Conto a [regent.GetSheHe] sobre os servos que peguei vagabundeando e como disciplinadamente os repreendi por sua atitude negligente com o trabalho."
 bp2_yearly.0651.desc.story.charming.composed_poem:0 "Discuto o simbolismo e o significado por trás de um poema que escrevi. Acho que é o meu melhor até agora, embora eu não saiba se eu me chamaria exatamente de um poeta ainda."
 bp2_yearly.0651.desc.story.charming.new_friend:0 "Conto a [regent.GetSheHe] sobre um dos filhos dos servos que parece estar encantado com meus jogos. Acho que fiz um amigo, pelo menos para a estação."
 bp2_yearly.0651.desc.story.charming.new_word:0 "Explico como pronunciar a nova palavra que inventei. Espero que pegue logo, uma vez que meus súditos ouvirem o #EMP [ROOT.Char.GetTitleAsNameNoTooltip]#! usando-a."
 bp2_yearly.0651.desc.story.curious.book_gift:0 "Explico detalhadamente o conteúdo de um livro que um dos meus vassalos menores comprou para mim — não é a obra mais gloriosa, mas devorei seu conteúdo com entusiasmo."
 bp2_yearly.0651.desc.story.curious.distant_land:0 "Conto a [regent.GetSheHe] sobre a terra estranha e distante que descobri recentemente, e as pessoas estranhas que a habitam."
 bp2_yearly.0651.desc.story.curious.strange_bird:0 "Aponto as diferentes partes do meu esboço, tentando transmitir como o estranho pássaro que desenhei se movia de maneira estranha, como era a plumagem e faço minha melhor imitação de seu canto trinado."
 bp2_yearly.0651.desc.story.pensive.distant_letter:0 "Falo sobre a carta que montei com muito cuidado para um nobre distante de quem ouvi histórias. Não sei se minha mensagem chegará até eles, mas só o pensamento de que eles possam me escrever de volta é tão encantador."
 bp2_yearly.0651.desc.story.pensive.draft_law:0 "a lei que tenho tentado elaborar. Ela ainda não está #EMP completamente#! terminada, mas estou orgulhoso de até onde cheguei com ela."
 bp2_yearly.0651.desc.story.pensive.foreign_custom:0 "Informo [regent.GetSheHe] sobre um costume estrangeiro estranho que descobri recentemente, um que eu gostaria muito que fosse a norma aqui em [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier] também."
 bp2_yearly.0651.desc.story.rowdy.climbed_roof:0 "Detalho a rota que segui para chegar à nova torre — é bem perigosa, mas sou o melhor escalador em [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTier]."
 bp2_yearly.0651.desc.story.rowdy.invented_game:0 "Explico detalhadamente as regras do novo jogo de bola que acabei de inventar. Estou #EMP muito#! orgulhoso disso."
 bp2_yearly.0651.desc.story.rowdy.prank:0 "Dou risadinhas ao contar sobre a última brincadeira que fiz — talvez eu tenha sido o único rindo, mas eu estava rindo #EMP muito#!."
 bp2_yearly.0651.t:0 "Sempre Que Você Precisar [regent.GetHerHim|U]"
 bp2_yearly.0661.a:0 "[regent.GetFirstNameNoTooltip] está certo, vergonha para você [offended_family.GetFirstNameNoTooltip]!"
 bp2_yearly.0661.b:0 "[offended_family.GetFirstNameNoTooltip] é meu(a) [ROOT.Char.Custom2('RelationToMeShort', offended_family)] e você vai respeitar [offended_family.GetSheHe]."
 bp2_yearly.0661.c.bossy:0 "Eu posso lidar com esses dois quando for verdadeiramente [ROOT.Char.GetTitleAsNameNoTooltip]."
 bp2_yearly.0661.c.charming:0 "Não há nada a ganhar escolhendo um favorito aqui."
 bp2_yearly.0661.c.curious:0 "Fascinante, mas sobre aquele servo..."
 bp2_yearly.0661.c.pensive:0 "Não quero fazer parte dessa discussão."
 bp2_yearly.0661.c.rowdy:0 "Deixe eles resolverem, tenho lugares para ir."
 bp2_yearly.0661.desc:0 "\"#EMP [Select_CString( ROOT.Char.IsFemale, 'A', 'O' )] [offended_family.Custom2('GetWomanManGirlBoy', ROOT.Char)] é [Select_CString( ROOT.Char.IsFemale, 'minha', 'meu' )] [offended_family.Custom2('RelationToMeShort', ROOT.Char)]!#!\" grita [offended_family.GetFirstName], confrontando meu [ROOT.Char.GetDiarchTitle] [regent.GetFirstName] em um dos muitos corredores vazios de [ROOT.Char.GetCapitalLocation.GetName], \"você não pode me afastar [ROOT.Char.GetHerHim] assim\".\n\nEu não pretendia escutar, tropeçando na conversa acidentalmente enquanto perseguia um servo, mas agora permaneço à margem, fora de vista, enquanto os dois discutem.\n\n\"[ROOT.Char.GetSheHe|U] pode ser seu(a) [offended_family.Custom2('RelationToMeShort', ROOT.Char)], mas [ROOT.Char.GetSheHe] é #EMP meu#! pupilo, até que eu considere [ROOT.Char.GetSheHe] pronto para gerenciar seus próprios assuntos. Até lá, falo em nome de [ROOT.Char.GetTitledFirstName], e na minha opinião, seu tipo é a pior influência possível para uma mente jovem\"."
 bp2_yearly.0661.t:0 "Uma Ferramenta para Usar"
