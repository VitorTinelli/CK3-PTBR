 bp2_yearly_0641_war_income_modifier:0 "Imposto de Guerra"
 bp2_yearly_0641_war_income_modifier_desc:0 "As circunstâncias políticas deram uma mãozinha a este personagem durante a guerra."
 frequent_daydreamer_modifier:0 "Sonhador Frequente"
 frequent_daydreamer_modifier_desc:0 "Este personagem muitas vezes parece estar perdido em pensamentos profundos e pesados."
 loyal_pack_of_hounds_modifier:0 "Matilha Leal de Cães"
 loyal_pack_of_hounds_modifier_desc:0 "Este personagem nunca está sem seus cães leais. Onde eles vão, os caninos vão — isso torna a corte constrangedora, mas a campanha suportável."
 next_free_ho_hire_modifier:0 "Contratação Gratuita de Ordem Sagrada"
 next_free_ho_hire_modifier_desc:0 "A próxima contratação de uma ordem sagrada por este personagem será gratuita."
 strong_flock_of_eagles_modifier:0 "Bando Forte de Águias"
 strong_flock_of_eagles_modifier_desc:0 "Este personagem é frequentemente visto com um bando de águias, que parecem segui-lo onde quer que vá. As aves são um símbolo de força e poder."
 teeming_horde_of_cats_modifier:0 "Horda Abundante de Gatos"
 teeming_horde_of_cats_modifier_desc:0 "Este personagem parece estar perpetuamente cercado por uma banda errante de felinos arrogantes. Os animais dignos garantem que não haja pestes ao redor deles."
