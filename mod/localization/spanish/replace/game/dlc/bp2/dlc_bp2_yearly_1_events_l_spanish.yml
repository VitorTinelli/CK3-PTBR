l_spanish:
 REMINDED_OF_CHILDHOOD_DECISION:0 "Isso te lembrou de outra decisão de infância..."
 REMINDS_OF_CHILDHOOD_DECISION:0 "Isso te lembra de outra decisão de infância..."
 UPON_HOLDING_COMPLETION:0 "Após a conclusão do domínio:"
 august_presence_modifier:0 "Augusto"
 august_presence_modifier_desc:0 "Este personagem valoriza a arte da diplomacia em vez de brigas."
 bonded_over_architecture_opinion:0 "Unidos pela Arquitetura"
 bp2_yearly.1000.a.flavor:0 "Tenho certeza de que [appropriate_child.GetFirstNameNoTooltip] ficará bem..."
 bp2_yearly.1000.a.flavor_good:0 "Certamente nem todos os hábitos são ruins?"
 bp2_yearly.1000.a.tt:0 "Sua exibição pode ter um impacto duradouro em [appropriate_child.GetShortUIName]"
 bp2_yearly.1000.a:0 "Não foi exatamente o meu melhor momento..."
 bp2_yearly.1000.a_good:0 "Agora, onde eu estava..."
 bp2_yearly.1000.b.flavor:0 "Quanto mais, melhor!"
 bp2_yearly.1000.b.flavor_agitated:0 "A #EMP audácia#! de algumas pessoas!"
 bp2_yearly.1000.b.flavor_athletic:0 "...bem, não que eu tenha tentado."
 bp2_yearly.1000.b.flavor_confider:0 "Confiar é uma arte!"
 bp2_yearly.1000.b.flavor_contrite:0 "Segredos são como feridas infectadas..."
 bp2_yearly.1000.b.flavor_flagellant:0 "É a verdade."
 bp2_yearly.1000.b.flavor_improvident:0 "Devemos cuidar dos menos afortunados."
 bp2_yearly.1000.b.flavor_inappetetic:0 "Devemos voltar a fazer o trabalho real."
 bp2_yearly.1000.b:0 "Quer se juntar a mim?"
 bp2_yearly.1000.b_agitated:0 "O que é que você está #EMP olhando!#!?"
 bp2_yearly.1000.b_athletic:0 "Eu até posso correr mais rápido que [ROOT.Char.GetFaith.WitchGodName], sabe?"
 bp2_yearly.1000.b_contrite:0 "Quais são #EMP as suas#! confissões, criança?"
 bp2_yearly.1000.b_drunkard:0 "Quer #EMP *hic*#! se juntar a mim?"
 bp2_yearly.1000.b_flagellant:0 "Às vezes, o chicote é o seu único consolo."
 bp2_yearly.1000.b_hashishiyah:0 "...quer experimentar?"
 bp2_yearly.1000.b_improvident:0 "Minha bolsa está leve, mas meu coração ainda mais leve."
 bp2_yearly.1000.b_inappetetic:0 "Comida é para os animais."
 bp2_yearly.1000.b_reclusive:0 "Por favor, #EMP vá embora#!."
 bp2_yearly.1000.b_us:0 "Quer se juntar a nós?"
 bp2_yearly.1000.desc_athletic:0 "Faço mais uma volta ao redor do [ROOT.Char.Custom('ResidenceBuilding')], suor escorrendo pelas minhas costas, captando alguns olhares de transeuntes. Um corpo forte realmente gera uma mente saudável!\n\nCom um rugido, paro abruptamente; pego uma grande pedra e a levanto até meu peito."
 bp2_yearly.1000.desc_comfort_eater:0 "Recosto-me na cadeira, #EMP provavelmente#! bem satisfeito, mas mais uma gostosura sedutora passa pelos meus lábios. As adversidades da minha manhã movimentada parecem ter desaparecido.\n\nPercebo que estou cercado por incontáveis pratos vazios de [ROOT.Char.Custom('FavoriteTreat')]. Incontáveis."
 bp2_yearly.1000.desc_confider:0 "Seja no café da manhã ou em uma função informal, frequentemente me inclino para meu confidente, [confider_friend.GetTitledFirstName], e compartilho minha perspectiva sobre os assuntos.\n\nQue bom é ouvir meus pensamentos em minhas próprias palavras, confiar nas opiniões de um amigo! Com o conselho de [confider_friend.GetFirstNamePossessiveNoTooltip] sobre um assunto trivial em mãos, olho para a mesa movimentada..."
 bp2_yearly.1000.desc_contrite:0 "[other_guest.GetTitledFirstName] me olha chocado, horrorizado pelas informações íntimas que acabei de confessar durante o jantar. \"Você fez #EMP o quê#!?\" [other_guest.GetSheHe] repete, confuso.\n\nMinha contrição tem seus lados positivos — e negativos, admito. Sinto-me aliviado... mas será que é porque estou transferindo o fardo para outros?"
 bp2_yearly.1000.desc_drunkard:0 "\"Mais uma rodada, por favor... #EMP *hic*#!\"\n\nO [ROOT.Char.Custom('RegionalAlcoholicDrink')] está arruinando meu discurso, mas estou tão envolto em seu conforto que não me importo mais. Com me importar com a maioria das coisas, na verdade.\n\nNum grande jorro molhado, o álcool escolhe sair do meu corpo — todo ele vai parar no meu jantar! Os convidados ao redor bufam de nojo."
 bp2_yearly.1000.desc_flagellant:0 "#EMP *CRAQUE!*#! Meu chicote me rasga com raiva, #EMP novamente#! e #EMP novamente.#! A intensa, isolada e ardente dor me concentra.\n\nDou mais algumas chicotadas no meu corpo. Cada golpe me aproxima um pouquinho mais da doce absolvição."
 bp2_yearly.1000.desc_hashishiyah:0 "O hashish é de excelente qualidade desta vez — tão forte que minha pele começa a coçar e minhas roupas parecem #EMP muito#! apertadas!#!\n\nEu me despido e, seguindo um capricho, persigo o canto de alguns pássaros do lado de fora. Um momento depois, volto..."
 bp2_yearly.1000.desc_improvident:0 "Um excelente sermão, um rito perfeito. Ao sairmos de um[ROOT.Char.GetFaith.HouseOfWorship], eu — claro — dignifico o(a) [ROOT.Char.Custom('DefaultPriestTitle')] com não apenas moedas, mas com todas as joias que posso oferecer. Alguns me olham com desconfiança.\n\nMas o ouro é uma coisa passageira! Mais pesada é a carga da culpa e da vergonha..."
 bp2_yearly.1000.desc_inappetetic:0 "Cutuco a comida à minha frente, mexendo-a para dar a impressão de que comi. Não quero causar preocupação.\n\nQuem tem tempo para comer? O dia é para governar; a noite é para fazer política. Como posso encontrar prazer na comida, enquanto tudo isso pesa sobre mim?"
 bp2_yearly.1000.desc_irritable:0 "É tarde da noite. Os aborrecedores bajuladores falam sem parar ao meu redor. Minha cabeça dolorida crava pregos em meus pensamentos.\n\nUm jarro derrubado se despedaça no chão ao meu lado.\n\nSem hesitar, eu estalo e grito para o servo ofensivo: \"Você insolente #EMP [dummy_gender.Custom2('InsultNounClumsy', ROOT.Char)]!#! Foi gerado por um ogro [dummy_gender.Custom2('InsultAdjectiveClumsy', ROOT.Char)]?!\""
 bp2_yearly.1000.desc_journaller:0 "Solto um suspiro de alívio, colocando de lado meus materiais de escrita. Deixo meus olhos percorrerem o comprimento do meu pequeno diário muito amassado, uma coleção de rabiscos que raramente deixo de lado.\n\nLevanto a cabeça e vejo que a luz do sol da manhã deu lugar ao pôr do sol. Apenas #EMP quanto tempo#! tenho me dedicado a escrever?"
 bp2_yearly.1000.desc_profligate:0 "#EMP Hmm#! isto parece bom. Sim, aquilo também. Feitas as minhas escolhas, jogo as finas mercadorias para os meus servos.\n\nVirando-me, vejo a pilha completa de frivolidades que acumulei. Está ficando bem... extensa. E minha bolsa... está bem vazia."
 bp2_yearly.1000.desc_reclusive:0 "\"Malditos tolos e cães rançosos, todos eles!\" Murmuro, finalmente encontrando a solidão no silêncio. Massageio minhas têmporas e fecho os olhos.\n\nUm barulho inesperado me traz de volta à realidade. Meus olhos se abrem rapidamente. #EMP Não estou sozinho, como desejo estar?!#! Murmuro uma maldição."
 bp2_yearly.1000.outro:0 "\n\n...então percebo m[Select_CString( appropriate_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName] olhando para mim, intrigado."
 bp2_yearly.1000.outro_bad:0 "\n\n...e então vejo [appropriate_child.GetTitledFirstName], m[Select_CString( appropriate_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))], olhando diretamente para mim. #EMP Hmm.#!"
 bp2_yearly.1000.t:0 "O Que Vem Por Aí..."
 bp2_yearly.1001.a.flavor:0 "Faça o que eu digo, não faça o que eu faço."
 bp2_yearly.1001.a.flavor_good:0 "Esse comportamento deve ser incentivado!"
 bp2_yearly.1001.a.no_trait.desc:0 "[appropriate_child.GetFirstNameNoTooltip] abandona o hábito"
 bp2_yearly.1001.a.no_trait.t:0 "Tutorado"
 bp2_yearly.1001.a.trait.desc:0 "[appropriate_child.GetFirstNameNoTooltip] abraça o hábito"
 bp2_yearly.1001.a.trait.t:0 "Traço Adquirido"
 bp2_yearly.1001.a:0 "[appropriate_child.GetFirstNameNoTooltip], venha aqui."
 bp2_yearly.1001.b.flavor:0 "Devo me aprimorar."
 bp2_yearly.1001.b:0 "O que #EMP estou#! fazendo?"
 bp2_yearly.1001.c.flavor:0 "Tenho certeza de que outra pessoa lidará com isso."
 bp2_yearly.1001.c.flavor_callous:0 "Quem disse que criar filhos era difícil?"
 bp2_yearly.1001.c.flavor_ecc_sadist:0 "Deixe a carne #EMP cantar.#!"
 bp2_yearly.1001.c:0 "Eu... não consigo lidar com isso agora."
 bp2_yearly.1001.c_callous:0 "Quem sou eu para interromper?"
 bp2_yearly.1001.c_ecc_sadist:0 "[Select_CString( appropriate_child.IsFemale, 'Essa é a minha', 'Esse é o meu' )] [appropriate_child.Custom('GirlBoy')]!"
 bp2_yearly.1001.desc_athletic:0 "Ao sair, crianças passam voando: uma é claramente mais rápida e ágil do que seus pares.\n\nÉ [Select_CString( appropriate_child.IsFemale, 'minha própria', 'meu próprio' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName] superando o restante!\n\nSorrio encorajando, impressionad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] com a inesperada demonstração de vontade e perseverança de [appropriate_child.GetHerHis]. Logo, os outros corredores param cedo. O orgulho por [appropriate_child.GetFirstNameNoTooltip] queima em meu coração!"
 bp2_yearly.1001.desc_comfort_eater:0 "Seguindo minha rotina, percebo algo incomum: meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName], compartilhando um esconderijo com uma bagunça de [appropriate_child.Custom('FavoriteTreat')], mastigando.\n\nHouve #EMP muita coisa acontecendo aqui ultimamente, e [appropriate_child.GetSheHe] #EMP ficou#! um pouco mais redondo..."
 bp2_yearly.1001.desc_confider:0 "Tenho notado uma mudança sutil em m[Select_CString( appropriate_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName] recentemente. [appropriate_child.GetSheHe|U] está passando mais tempo com seus amigos íntimos, sussurrando e rindo.\n\nJuro que [Select_CString( appropriate_child.IsFemale, 'essas', 'esses' )] [appropriate_child.Custom('GirlBoyPlural')] sabem mais sobre [appropriate_child.GetSheHe] do que eu, e o vínculo entre eles parece forte. Amigos como esses, amigos confiáveis com quem se pode falar abertamente, são verdadeiramente um presente."
 bp2_yearly.1001.desc_contrite:0 "Nosso próprio [appropriate_child.GetFirstName] está em cima de um baú. [appropriate_child.GetSheHe|U] reuniu uma multidão de crianças, entretendo-as com os segredos mais mundanos imagináveis. Por sua vez, [appropriate_child.GetSheHe] faz as crianças revelarem suas próprias travessuras.\n\n\"Eu-eu peguei o último [appropriate_child.Custom('FavoriteTreat')],\" admite [Select_CString( dummy_gender.IsFemale, 'uma', 'um' )] [dummy_gender.Custom('GirlBoy')], tremendo. \"Eu matei um rato!\" confidencia outra criança."
 bp2_yearly.1001.desc_drunkard:0 "As lojas estão #EMP geralmente#! seguras; isso é facilmente lembrado devido às queixas incessantes do cozinheiro sobre ratos. Cautelosamente, me aproximo do sombrio e aberto [ROOT.Char.Custom('GetRoom')].\n\n[Select_CString( appropriate_child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName] aparece, com a boca aberta, olhos vidrados, e o hálito exalando [ROOT.Char.Custom('RegionalAlcoholicDrink')] — e guloseimas roubadas."
 bp2_yearly.1001.desc_flagellant:0 "Meus [ROOT.Char.Custom('GetDungeonPlural')] reverberam com gritos de dor... #EMP gritos#! juvenis. Apresso-me.\n\nEsfregando os olhos, vejo que o culpado é [Select_CString( appropriate_child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName] e... #EMP é um dos meus chicotes?#! Minha mandíbula cai, enquanto [appropriate_child.GetFirstNameNoTooltip] se fere em nome de [ROOT.Char.GetFaith.HighGodNameAlternate]."
 bp2_yearly.1001.desc_hashishiyah:0 "Uma risadinha vem de um [ROOT.Char.Custom('GetRoom')] aparentemente deserto. Eu entro, curioso, e encontro [Select_CString( appropriate_child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName] escondido em um canto.\n\n[appropriate_child.GetSheHe|U] tenta conter sua risada, mas eu #EMP sei#! aquele sorriso torto — sem mencionar os olhos avermelhados e o palpável cheiro de hashish!"
 bp2_yearly.1001.desc_improvident:0 "Nos últimos dias, notei que m[Select_CString( appropriate_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName] está dando muitos dos seus brinquedos a outras crianças.\n\nNos raros momentos entre os comuns, [appropriate_child.GetSheHe] me importuna para dar aos mendigos — e para a em cada história de tristeza de uma viúva pobre!"
 bp2_yearly.1001.desc_inappetetic:0 "No jantar, meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName] sempre parece impaciente, gesticulando para os serviçais que trazem a bandeja para deixá-la sozinha.\n\n Talvez [appropriate_child.GetSheHe] esteja apenas ansioso para sair para outras atividades? Ou — se eu não estiver imaginando coisas — as bochechas [appropriate_child.GetHerHim] estão ficando um pouco... pálidas e finas?"
 bp2_yearly.1001.desc_irritable:0 "No meu caminho do jantar para o privativo, encontro [Select_CString( appropriate_child.IsFemale, 'a', 'o' )] [appropriate_child.GetFirstName] #EMP muito#! furios[Select_CString( appropriate_child.IsFemale, 'a', 'o' )].\n\n\"#EMP Seu [appropriate_child.Custom2('InsultNounClumsy', SCOPE.sC('appropriate_child'))] insolente!#!\" [appropriate_child.GetSheHe] grita. \"Você manchou meu [appropriate_child.Custom('child_object_of_interest')]! Por que você não vai se afogar nesse [ROOT.Char.Custom('RegionalDrink')]!?\""
 bp2_yearly.1001.desc_journaller:0 "Tem havido um influxo de notas escritas à mão espalhadas por meu [ROOT.Char.Custom('GetCourt')] recentemente. A fonte? [Select_CString( appropriate_child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName], curvad[Select_CString( appropriate_child.IsFemale, 'a', 'o' )] sobre um vazio [ROOT.Char.Custom('GetChamber')], rabiscando para seu contento.\n\nConsidero meu próprio hábito de escrita, meu diário rico em reflexões. Talvez eu tenha compartilhado uma prática valiosa."
 bp2_yearly.1001.desc_profligate:0 "Pela terceira vez em tantas semanas, [appropriate_child.GetFirstName] pediu um novo brinquedo caro. Os vendedores nos perseguem a cada movimento a partir do [ROOT.Char.Custom('FortifiedBuilding')].\n\nIsso me preocupa um pouco. Afinal, e se [appropriate_child.GetSheHe] tivesse seu próprio tesouro algum dia? Tais gastos...\n\nE o que é isso? [appropriate_child.GetSheHe] comprou a mesma [ROOT.Char.Custom('GetAccessory')] que eu comprei uma vez?"
 bp2_yearly.1001.desc_reclusive:0 "[Select_CString( appropriate_child.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('appropriate_child'))] [appropriate_child.GetFirstName] não foi visto em nossas residências há dias. Com os servos começando a murmurar e os parentes demonstrando preocupação, me aproximo do [ROOT.Char.Custom('GetChamber')] de [appropriate_child.GetFirstName].\n\nAo entrar — tudo #EMP é#! meu domínio, afinal — [appropriate_child.GetFirstNameNoTooltip] se vira sem a menor formalidade ou cortesia, sussurrando para eu sair e deixá-l[Select_CString( appropriate_child.IsFemale, 'a', 'o' )] em solidão."
 bp2_yearly.1001.outro:0 "\n\nTalvez não seja um hábito tão terrível afinal?"
 bp2_yearly.1001.outro_bad:0 "\n\nEu me afasto da cena. É assim que #EMP eu#! ajo?"
 bp2_yearly.1001.t:0 "...Gira em Torno"
 bp2_yearly.1005.a.flavor:0 "O que isso poderia fazer de mal...?"
 bp2_yearly.1005.a.insight.desc:0 "Você encontra um jeito melhor"
 bp2_yearly.1005.a.insight.t:0 "Visão"
 bp2_yearly.1005.a.stressed.desc:0 "Não foi #EMP nada#! uma experiência agradável"
 bp2_yearly.1005.a.stressed.t:0 "Estressado"
 bp2_yearly.1005.a.trait.desc:0 "Você gosta disso #EMP muito#!"
 bp2_yearly.1005.a:0 "Deveria tentar."
 bp2_yearly.1005.b:0 "Melhor não."
 bp2_yearly.1005.desc_athletic:0 "venha sol ou chuva, fazendo várias voltas ao redor do perímetro do [stressed_adult.Custom('ResidenceBuilding')] recentemente.\n\nAlguns dos cortesãos torcem o nariz para o cheiro musky percebido após o treino; mas parece que os sussurros depreciativos apenas tornam [stressed_adult.GetSheHe] mais resiliente em sua determinação.\n\nIsso me intriga."
 bp2_yearly.1005.desc_comfort_eater:0 "devorando muitos [stressed_adult.Custom('FavoriteTreat')] ultimamente.\n\nQuando digo muitos, não quero dizer cinco ou dez — mas sim o triplo, e ouvi os criados cochicharem sobre a necessidade de aumentar o tamanho da camisa [stressed_adult.GetHerHim].\n\nEntretanto, o ato de indulgência parece acalmar [stressed_adult.GetSheHe]..."
 bp2_yearly.1005.desc_confider:0 "sendo figurativamente colado ao ouvido de seu confidente [confidant_friend.GetTitledFirstNamePossessive] ultimamente.\n\nEles parecem compartilhar tudo entre si, enquanto caminham lado a lado, rindo.\n\nDeve ser bom poder relatar tudo que é bom e ruim na sua vida para alguém."
 bp2_yearly.1005.desc_contrite:0 "assumindo e confessando as mínimas indiscrições ultimamente.\n\nOutro dia [stressed_adult.GetSheHe] confessou ao servo que [stressed_adult.GetSheHe] não se importava muito com as roupas do servo e que [stressed_adult.GetSheHe] estava com a consciência culpada por isso.\n\nPode parecer um tanto trivial, mas se isso tranquiliza sua mente... ?"
 bp2_yearly.1005.desc_drunkard:0 "tendo [ROOT.Char.Custom('RegionalAlcoholicDrink')] com bastante frequência ultimamente.\n\nUma vez, eu até encontrei [stressed_adult.GetSheHe] em um canto do [stressed_adult.Custom('ResidenceBuilding')], de cara para baixo em uma poça de... origem duvidosa. Bebido até perder a razão, [stressed_adult.GetSheHe] estava.\n\nMas, independentemente da aparência [stressed_adult.GetHerHim], [stressed_adult.GetSheHe] #EMP parecia#! bastante em paz."
 bp2_yearly.1005.desc_flagellant:0 "causando danos voluntários a [stressed_adult.GetHerselfHimself] ultimamente.\n\nOutro dia, ouvi [stressed_adult.GetSheHe] chicoteando sua pele enquanto recitava versos religiosos.\n\nMe assustou a princípio — mas parecia aliviar a mente [stressed_adult.GetHerHim]."
 bp2_yearly.1005.desc_hashishiyah:0 "fugindo frequentemente para queimar hashishiyah ultimamente.\n\nEm um momento, encontrei [stressed_adult.GetSheHe] deitado no chão de seu [stressed_adult.Custom('GetChamber')] durante todo um dia, \"em um esforço para inspecionar o teto,\" [stressed_adult.GetSheHe] disse, com os olhos vidrados.\n\nParecia bastante relaxante."
 bp2_yearly.1005.desc_improvident:0 "doador uma grande quantia de ouro para caridade ultimamente.\n\nIsso parece ser malvisto por algumas pessoas na corte, eu percebi — eles até vão tão longe a ponto de dizer que [stressed_adult.GetSheHe] não sabe lidar com ouro.\n\nMas se isso eleva o ânimo [stressed_adult.GetHerHim], isso não é algo bom, certo...?"
 bp2_yearly.1005.desc_inappetetic:0 "negligenciando o jantar ocasionalmente.\n\nBem, na verdade, eu não vi [stressed_adult.GetSheHe] comer desde ontem de manhã. Os criados cochicham sobre o alfaiate ter sido forçado a diminuir o tamanho das camisas [stressed_adult.GetHerHim] na semana passada também.\n\nIsso é algo ruim?"
 bp2_yearly.1005.desc_irritable:0 "dando palestras severas e explodindo com coisas insignificantes recentemente.\n\nOutro dia, [stressed_adult.GetSheHe] quase arrancou a cabeça de um dos criados por virar as folhas da cama de sua maneira errada.\n\nDepois, [stressed_adult.GetSheHe] parecia bem sereno, no entanto."
 bp2_yearly.1005.desc_journaller:0 "com manchas de tinta nos dedos recentemente.\n\n[stressed_adult.GetSheHe|U] não vai a lugar algum sem aquele livro encadernado em couro ao seu lado, sempre fazendo anotações.\n\nApesar das manchas de tinta, [stressed_adult.GetSheHe] parece mais calmo e organizado ultimamente. Parece... agradável."
 bp2_yearly.1005.desc_profligate:0 "adquirindo muitos itens exclusivos ultimamente.\n\nAlguns dos criados parecem ignorar os itens como tralhas insignificantes e descrevem o comportamento [stressed_adult.GetHerHim] como 'jogar ouro pelo ralo'.\n\nNão tenho tanta certeza — [stressed_adult.GetSheHe] parece gostar de colecionar as tralhas?"
 bp2_yearly.1005.desc_reclusive:0 "permanecendo fora de vista de seu [stressed_adult.Custom('GetChamber')] ultimamente.\n\nNa semana passada, [stressed_adult.GetSheHe] permaneceu lá por vários dias, até recebendo refeições entregues.\n\nParecia bastante pacífico, embora ao fazer isso [stressed_adult.GetSheHe] tenha negligenciado alguns eventos ao redor do [stressed_adult.Custom('GetCourt')]."
 bp2_yearly.1005.intro:0 "Tenho observado [Select_CString( stressed_adult.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('stressed_adult'))], [stressed_adult.GetTitledFirstName],"
 bp2_yearly.1005.t:0 "Criança Vê, Criança..."
 bp2_yearly.1010.a.flavor:0 "Não chore. NÃO chore."
 bp2_yearly.1010.a.flavor_callous:0 "Agora, me solte..."
 bp2_yearly.1010.a:0 "Você é [Select_CString( hugging_child.IsFemale, 'uma boa', 'um bom' )] [hugging_child.Custom('GetDaughterSon')]..."
 bp2_yearly.1010.a_callous:0 "Pronto, pronto."
 bp2_yearly.1010.desc_kid:0 "entra na sala.\n\n[hugging_child.GetSheHe|U] me olha com um olhar indecifrável por um momento e então vem até mim, me envolvendo em um abraço apertado."
 bp2_yearly.1010.desc_rambler:0 "correndo como o vento em minha direção, gritando #EMP 'Abraaaaço!'#!\n\n[hugging_child.GetSheHe|U] se inclina perto e agarra meus quadris em um abraço firme."
 bp2_yearly.1010.desc_teenager:0 "entra no [ROOT.Char.Custom('GetRoom')], aparentemente desinteressado na minha presença.\n\nEntão, sem aviso, sou envolto em um abraço apertado. [hugging_child.GetSheHe|U] rapidamente solta, com uma expressão envergonhada."
 bp2_yearly.1010.desc_toddler:0 "caminhando até mim a uma velocidade surpreendente para sua idade.\n\n[hugging_child.GetSheHe|U] se envolve firmemente em minha perna, me abraçando forte e inclinando sua cabeça para trás para me olhar."
 bp2_yearly.1010.intro:0 "Enquanto me inclino sobre o mapa em meu [ROOT.Char.Custom('GetChamber')], um súbito #EMP rangido#! vira minha cabeça em direção à entrada. [Select_CString( hugging_child.IsFemale, 'Minha', 'Meu' )] [hugging_child.Custom2('RelationToMeShort', SCOPE.sC('hugging_child'))] [hugging_child.GetFirstName] aparece na soleira."
 bp2_yearly.1010.outro_callous:0 "\n\nO que é esse sentimento caloroso no meu peito...?"
 bp2_yearly.1010.outro_older:0 "\n\nOlho para [hugging_child.GetSheHe], uma lágrima escondida em meu olho enquanto minha mão aperta seu ombro em um esforço para retribuir o gesto."
 bp2_yearly.1010.outro_young:0 "\n\nOlho para [hugging_child.GetSheHe], uma lágrima escondida em meu olho enquanto minha mão afaga seu cabelo em um esforço para retribuir o gesto."
 bp2_yearly.1010.t:0 "Incondicionalmente"
 bp2_yearly.1015.a.flavor:0 "Uma criança tão agradável."
 bp2_yearly.1015.a.flavor_greedy:0 "Isso é tudo...?"
 bp2_yearly.1015.a:0 "Muito obrigado!"
 bp2_yearly.1015.b.tt:0 "Isso irá promover ainda mais o [education_focus|E] [Concept('stewardship', 'Administrativo')|E] de [golden_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1015.b.tt_matching:0 "Isso irá promover grandemente o [education_focus|E] [Concept('stewardship', 'Administrativo')|E] de [golden_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1015.b:0 "Fique com isso. Invista!"
 bp2_yearly.1015.desc_guardian:0 "\n\n\"[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip],"
 bp2_yearly.1015.desc_parent:0 "\n\n\"[golden_child.Custom2('RelationToMeShort', ROOT.Char)|U],"
 bp2_yearly.1015.intro:0 "Uma manhã, enquanto me preparo para encarar o dia, [Select_CString( golden_child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('golden_child'))] [golden_child.GetFirstName] se aproxima de mim:"
 bp2_yearly.1015.outro:0 "encontramos isso enquanto explorávamos o [ROOT.Char.Custom('ResidenceBuilding')] ontem. Você deve ficar com isso.\" [golden_child.GetSheHe] entrega um pequeno saquinho de moedas surrado. Ele faz um som de tilintar."
 bp2_yearly.1015.t:0 "Filho Dourado"
 bp2_yearly.1020.a.secret.t:0 "Segredo Aprendido"
 bp2_yearly.1020.a.tt:0 "Você aprende um segredo sobre um de seus cortesãos"
 bp2_yearly.1020.a:0 "Bem, então, fale!"
 bp2_yearly.1020.b.tt:0 "Isso irá promover ainda mais o [education_focus|E] de [intrigue|E] de [secrety_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1020.b.tt_matching:0 "Isso irá promover grandemente o [education_focus|E] de [intrigue|E] de [secrety_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1020.b:0 "A-a! Segredos são uma moeda, [Select_CString( secrety_child.IsFemale, 'minha querida', 'meu querido' )] [secrety_child.Custom('GirlBoy')]!"
 bp2_yearly.1020.desc:0 "Você #EMP não vai acreditar#! no que eu descobri sobre [secret_keeper.GetTitledFirstName]!\" [secrety_child.GetSheHe|U] pausa para recuperar o fôlego, para um efeito dramático."
 bp2_yearly.1020.desc_guardian:0 "\"[ROOT.Char.Custom('MistressMaster')|U] [ROOT.Char.GetFirstNameNoTooltip]!"
 bp2_yearly.1020.desc_parent:0 "\"[secrety_child.Custom2('RelationToMeShort', ROOT.Char)|U]!"
 bp2_yearly.1020.intro:0 "Enquanto me inclino para pegar uma escritura para estudar, [Select_CString( secrety_child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('secrety_child'))] [secrety_child.GetFirstName] irrompe no [ROOT.Char.Custom('GetRoom')], interrompendo minha tranquila solitude."
 bp2_yearly.1020.t:0 "Aqui Há Segredos"
 bp2_yearly.1030.a.tt_change:0 "[education_focus|E] de [focus_child.GetFirstNamePossessiveNoTooltip] muda para [THIS.Char.Custom('GetEducationTraitConcept')]"
 bp2_yearly.1030.a.tt_tutor:0 "Você pessoalmente tutora [focus_child.GetFirstNameNoTooltip] para compensar qualquer educação perdida"
 bp2_yearly.1030.a:0 "Moldarei [focus_child.GetSheHe] à minha imagem."
 bp2_yearly.1030.b.tt:0 "Isso irá promover ainda mais o [education_focus|E] [focus_child.Custom('GetEducationTraitConcept')] de [focus_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1030.b:0 "Um conjunto de habilidades variado é sempre benéfico."
 bp2_yearly.1030.desc:0 "Ultimamente tenho refletido sobre a educação [Select_CString( focus_child.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('focus_child'))] [focus_child.GetFirstName] — será que [focus_child.Custom('GetChildEducationFocus')] é realmente a direção apropriada?\n\nDesde que fui treinado em [ROOT.Char.Custom('education_focus')], tenho percebido que esse conhecimento em particular tem sido útil para mim.\n\nCertamente deve ser o mesmo para [focus_child.GetSheHe]?"
 bp2_yearly.1030.t:0 "A Queda da Maçã"
 bp2_yearly.1035.a.flavor:0 "Isso é... uma gema?"
 bp2_yearly.1035.a:0 "Oh. Obrigado."
 bp2_yearly.1035.b.tt:0 "Isso irá promover ainda mais o [education_focus|E] de [learning|E] de [rock_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1035.b.tt_matching:0 "Isso irá promover grandemente o [education_focus|E] de [learning|E] de [rock_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1035.b:0 "Você deveria estudar essa, criança."
 bp2_yearly.1035.desc:0 "Durante uma de nossas aulas em meu [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('rock_child'))] [rock_child.GetFirstNamePossessive] [ROOT.Char.Custom('GetChamber')], noto uma impressionante quantidade de pedras cuidadosamente exibidas em uma prateleira.\n\nUma das pedras se destaca na coleção — é bastante áspera, mas ao olhar de perto, há um tom vermelho profundo e brilhante contido dentro.\n\n[rock_child.GetFirstNameNoTooltip] percebe meu interesse enquanto [rock_child.GetSheHe] a pega e me entrega: 'Você pode ficar com ela.'"
 bp2_yearly.1035.desc_guardian:0 "[ROOT.Char.Custom('MistressMaster')] [ROOT.Char.GetFirstNameNoTooltip]."
 bp2_yearly.1035.desc_parent:0 "[rock_child.Custom2('RelationToMeShort', ROOT.Char)]."
 bp2_yearly.1035.t:0 "Uma Gema em Bruto"
 bp2_yearly.1040.a.flavor:0 "\"Segure a empunhadura, não a ponta afiada.\" Hum."
 bp2_yearly.1040.a:0 "Intrigante."
 bp2_yearly.1040.b.tt:0 "Isso irá promover ainda mais o [education_focus|E] [martial|E] de [sparring_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1040.b.tt_matching:0 "Isso irá promover grandemente o [education_focus|E] [martial|E] de [sparring_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1040.b:0 "Deveríamos experimentar!"
 bp2_yearly.1040.desc:0 "Ao pegar as espadas acolchoadas para um treino de sparring com [Select_CString( sparring_child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('sparring_child'))] [sparring_child.GetFirstName], noto um diário surrado jogado de lado.\n\nPela capa, parece conter exercícios e melhores práticas relacionadas às artes marciais.\n\n[sparring_child.GetFirstNameNoTooltip] lança um olhar em minha direção: 'Oh. Aquela coisa — eu leio principalmente por causa das ilustrações. Você pode pegar emprestado.'"
 bp2_yearly.1040.t:0 "Uma Pena Poderosa"
 bp2_yearly.1045.a.flavor:0 "Lutando; #EMP em meu próprio quintal#!..."
 bp2_yearly.1045.a.perk.t:0 "Vantagem Obtida"
 bp2_yearly.1045.a:0 "#EMP Interrompam isso, ambos vocês.#!"
 bp2_yearly.1045.b.flavor:0 "Aquele parece feroz."
 bp2_yearly.1045.b.loss.desc:0 "Seu lutador perde"
 bp2_yearly.1045.b.loss.t:0 "Derrota na Luta"
 bp2_yearly.1045.b.win.desc:0 "Seu lutador vence"
 bp2_yearly.1045.b.win.t:0 "Vitória na Luta"
 bp2_yearly.1045.b:0 "#EMP Tentador#!! Eu gostaria de apostar em..."
 bp2_yearly.1045.c.tt:0 "Isso irá promover ainda mais o [education_focus|E] [Concept('diplomacy', 'Diplomático')|E] de [diplomacy_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1045.c.tt_matching:0 "Isso irá promover grandemente o [education_focus|E] [Concept('diplomacy', 'Diplomático')|E] de [diplomacy_child.GetFirstNamePossessiveNoTooltip]"
 bp2_yearly.1045.c:0 "[diplomacy_child.GetFirstNameNoTooltip], ajude-os a mediar."
 bp2_yearly.1045.desc:0 "Eles acabaram de começar a se golpear quando...\n\n[diplomacy_child.GetSheHe|U] é interrompid[Select_CString( diplomacy_child.IsFemale, 'a', 'o' )] por um grito agudo, virando nossa atenção para a briga na rua.\n\nOs combatentes parecem ser alguns jovens da #EMP minha#! [ROOT.Char.Custom('GetCourt')], circulando um ao outro em preparação para outra luta."
 bp2_yearly.1045.desc_guardian:0 "$bp2_yearly.1020.desc_guardian$"
 bp2_yearly.1045.desc_parent:0 "\"[diplomacy_child.Custom2('RelationToMeShort', ROOT.Char)|U]!"
 bp2_yearly.1045.intro:0 "Durante meu passeio vespertino pelas ruas de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], m[Select_CString( diplomacy_child.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('diplomacy_child'))] [diplomacy_child.GetFirstName] corre até mim:"
 bp2_yearly.1045.t:0 "O Negociador"
 bp2_yearly.1050.a.flavor:0 "Eu realmente gosto dessas pedras, mas é por uma boa causa."
 bp2_yearly.1050.a.flavor_twig:0 "Eu realmente gosto dessas pedras, mas é por uma boa causa."
 bp2_yearly.1050.a:0 "Eu vou subornar a maré com essas pedras brilhantes!"
 bp2_yearly.1050.a_twig:0 "Eu vou subornar a tempestade com essas pedras brilhantes!"
 bp2_yearly.1050.b.flavor:0 "#EMP Eu#! sempre me sinto seguro com paredes."
 bp2_yearly.1050.b:0 "Eu devo reforçar as paredes exteriores."
 bp2_yearly.1050.c.flavor:0 "[ROOT.Char.GetFaith.HighGodNameAlternate] certamente irá protegê-lo!"
 bp2_yearly.1050.c:0 "Um pequeno santuário na praça principal será suficiente."
 bp2_yearly.1050.desc:0 "O majestoso castelo de areia ergue-se sobre a praia, pois passei a tarde esculpindo detalhes minuciosos na areia úmida e granulada.\n\nNo entanto, à medida que o tempo avança implacavelmente, o mesmo acontece com a maré, e a cada segundo ela se aproxima de minha obra-prima enlameada, mordiscando seus pés.\n\nEu encaro a maré desesperadamente, tentando descobrir como garantir a segurança do meu castelo antes de recuar."
 bp2_yearly.1050.desc_desert:0 "Os serviçais têm trazido água para meu majestoso castelo de areia do deserto o dia todo, com o sol batendo implacavelmente em nossas costas.\n\nEsculpo o último detalhe no mais alto dos torreões quando percebo a tempestade de areia se aproximando no horizonte.\n\nMinha testa imediatamente se franze, enquanto tento descobrir como proteger meu castelo da tempestade iminente antes de recuar."
 bp2_yearly.1050.desc_twig:0 "O magnífico castelo modelo que fiz com galhos e pequenas pedras realmente tem um ar de esplendor.\n\nEnquanto aplico os toques finais no torreão mais alto, a chuva começa a cair, à medida que a tempestade que estava se formando no horizonte finalmente alcança minha localização.\n\nEu lanço um olhar desesperado à tempestade, tentando furiosamente descobrir como garantir a segurança da minha criação antes de recuar."
 bp2_yearly.1050.t:0 "$bp2_yearly.1050.t_builder$: Castelos de Areia na Areia"
 bp2_yearly.1050.t_builder:0 "O Construtor"
 bp2_yearly.1050.t_twig:0 "$bp2_yearly.1050.t_builder$: A Tempestade que se Aproxima"
 bp2_yearly.1051.a:0 "Você vence #EMP esta#! rodada, maré."
 bp2_yearly.1051.a_twig:0 "Você vence #EMP esta#! rodada, tempestade."
 bp2_yearly.1051.desc:0 "No dia seguinte, ao retornar à praia, eu me apresso até o local onde, no dia anterior, meu majestoso castelo erguia-se sobre a areia úmida."
 bp2_yearly.1051.desc_desert:0 "À medida que a tempestade diminui no dia seguinte, eu me apresso até o local onde construí cuidadosamente meu majestoso castelo de areia apenas no dia anterior."
 bp2_yearly.1051.desc_twig:0 "No início da madrugada, a tempestade finalmente se acalma, e eu me apresso pelas moitas para avaliar os danos causados ​​ao meu magnífico castelo de galhos."
 bp2_yearly.1051.outro:0 "\n\nA maior parte se foi, mas um detalhe permanece de pé — o torreão mais alto, com a pequena insígnia que eu esculpi cuidadosamente para mim mesmo. #EMP Sucesso.#!\n\nAos pés dele, encontro uma pequena pedra iridescente, meio enterrada na terra. Pode ser coisa da minha imaginação, mas ao examiná-la de perto, consigo ver vagamente a forma de um pequeno... martelo?"
 bp2_yearly.1051.t:0 "$bp2_yearly.1050.t_builder$: Areias Mutantes"
 bp2_yearly.1051.t_twig:0 "$bp2_yearly.1050.t_builder$: Tudo o que Resta"
 bp2_yearly.1055.a.flavor:0 "Não é trapaça se for pago."
 bp2_yearly.1055.a:0 "Deixe-me apenas contratar esses trabalhadores..."
 bp2_yearly.1055.b.flavor:0 "Com paredes altas."
 bp2_yearly.1055.b:0 "Nós podemos construir um abrigo mais forte #EMP juntos!#!"
 bp2_yearly.1055.c.flavor:0 "[ROOT.Char.GetFaith.HighGodName] é o único que pode julgar #EMP o#! meu trabalho."
 bp2_yearly.1055.c:0 "Estou ocupado construindo este altar. Vá embora."
 bp2_yearly.1055.desc:0 "O dia foi passado brincando do lado de fora na natureza — no geral, um dia bem agradável — quando de repente eu sou abordado por"
 bp2_yearly.1055.desc_liege:0 "uma criança local: \"Eu sou [den_challenger.GetTitledFirstName], e eu desafio você para uma competição de construção de abrigos, [ROOT.Char.GetLadyLord] [ROOT.Char.GetFirstNameNoTooltip]!\""
 bp2_yearly.1055.desc_related:0 "meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('den_challenger'))], [den_challenger.GetTitledFirstName]: \"Eu desafio você para uma competição de construção de abrigos, [den_challenger.Custom2('RelationToMeShort', ROOT.Char )]!"
 bp2_yearly.1055.desc_relations:0 "meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('den_challenger'))], [den_challenger.GetTitledFirstName]: \"Eu desafio você para uma competição de construção de abrigos, [ROOT.Char.GetFirstNameNoTooltip]!"
 bp2_yearly.1055.outro:0 "\n\n[den_challenger.GetSheHe|U] se exibe e sorri triunfantemente para mim, esperando completamente vencer."
 bp2_yearly.1055.t:0 "$bp2_yearly.1050.t_builder$: E Então Eles Foram..."
 bp2_yearly.1056.a_economy:0 "O emprego é verdadeiramente a #EMP raiz#! da prosperidade."
 bp2_yearly.1056.a_martial:0 "Alianças são uma ótima defesa. E paredes."
 bp2_yearly.1056.a_pious:0 "Isso certamente é um sinal de [ROOT.Char.GetFaith.HighGodNameAlternate]!"
 bp2_yearly.1056.desc_economy:0 "Contratar os jovens locais e pagar-lhes com [ROOT.Char.Custom('RegionalRootVegetablePlural')] funcionou maravilhas para construir o abrigo mais glorioso deste lado de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip].\n\n[den_challenger.GetTitledFirstName|U] olha com desgosto para a minha criação e resmunga enquanto a construção insignificante [den_challenger.GetHerHim] mal mantém a chuva afastada."
 bp2_yearly.1056.desc_martial:0 "[den_challenger.GetTitledFirstName] é surpreendentemente forte, e entre os dois construímos um abrigo adequado e resistente — bem a tempo de os céus se abrirem e despejarem uma chuva intensa.\n\nOs relâmpagos cruzam o céu; nenhum deles atinge-nos, já que estamos protegidos pelas paredes do abrigo.\n\nEnquanto nos sentamos dentro do esconderijo, mantendo-nos secos e seguros graças ao nosso trabalho árduo, não posso deixar de contemplar o valor do trabalho em equipe e da camaradagem."
 bp2_yearly.1056.desc_pious:0 "Assim que coroo o altar com um galho envelhecido, as chuvas começam a cair com força, nos forçando a procurar abrigo. Um relâmpago maciço vindo do céu atinge o altar com um *THWACK* estrondoso, e eu me apresso para avaliar os danos.\n\nQuando o altar entra em vista, uma leve plumagem de fumaça vem do galho, que está escurecido em uma das extremidades e recebeu um belo machucado do impacto.\n\nEu o observo cuidadosamente enquanto o pego. Ele ainda está quente em minha mão."
 bp2_yearly.1056.t_economy:0 "$bp2_yearly.1050.t_builder$: ... Muitos"
 bp2_yearly.1056.t_martial:0 "$bp2_yearly.1050.t_builder$: ... Dois"
 bp2_yearly.1056.t_pious:0 "$bp2_yearly.1050.t_builder$: ... Encharcados"
 bp2_yearly.1060.a.flavor:0 "O que faz um bom centro comercial?"
 bp2_yearly.1060.a:0 "[steward_character.GetTitledFirstNameNoTooltip] parece experiente."
 bp2_yearly.1060.b.flavor:0 "Uma boa defesa é o melhor ataque. ... espere."
 bp2_yearly.1060.b:0 "Eu deveria inspecionar nossas defesas no complexo."
 bp2_yearly.1060.c.flavor:0 "Como podemos nos aproximar mais de [ROOT.Char.GetFaith.HighGodNameAlternate]?"
 bp2_yearly.1060.c:0 "Fé em primeiro lugar. Vamos à [ROOT.Char.GetFaith.HouseOfWorship]."
 bp2_yearly.1060.desc:0 "Não tendo nada planejado para o dia, esta é uma ótima oportunidade para me enriquecer nas várias facetas da nossa gloriosa região, [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName].\n\nA pergunta é o que seria mais produtivo — devo ir ao complexo militar liderado por [martial_character.GetTitledFirstName], ao distrito comercial gerenciado por [steward_character.GetTitledFirstName], ou fazer uma visita a [learned_character.GetTitledFirstName] na [ROOT.Char.GetFaith.HouseOfWorship] local?"
 bp2_yearly.1060.t:0 "$bp2_yearly.1050.t_builder$: Uma Visão para Recordar"
 bp2_yearly.1061.a.flavor:0 "Aprendi tanto."
 bp2_yearly.1061.a:0 "Hoje foi um bom dia."
 bp2_yearly.1061.desc_martial:0 "O dia é gasto inspecionando os armamentos militares de [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName], suas forças — e de fato — suas fraquezas.\n\nQualquer corrente é tão forte quanto seu elo mais fraco, [architecture_character.GetTitledFirstName] repete durante o passeio, e eu estou inclinado a concordar."
 bp2_yearly.1061.desc_religion:0 "Tenho dificuldade em lembrar de um dia mais sereno e pacífico, enquanto [architecture_character.GetTitledFirstName|U] e eu passeamos pelas [ROOT.Char.GetFaith.HouseOfWorshipPlural] e altares de [ROOT.Var('the_builder_sightseed_capital').GetProvince.GetName].\n\nEm um momento, [architecture_character.GetSheHe] se vira para mim e diz: \"Um arco bem construído pode evocar um tipo específico de espiritualidade — você não acha?\""
 bp2_yearly.1061.desc_steward:0 "Passamos o dia percorrendo os salões das guildas, inspecionando a colocação dos artesãos em relação ao espaço de mercado deles e outros aspectos econômicos da construção da cidade.\n\n[architecture_character.GetTitledFirstName|U] é um guia experiente, falando sobre impostos e taxas, pintando o quadro de nossa situação econômica atual."
 bp2_yearly.1061.outro:0 "\n\n[architecture_character.GetSheHe|U] encerra o passeio me entregando [book_to_get.GetName], um livro muito usado sobre o assunto."
 bp2_yearly.1061.t:0 "$bp2_yearly.1050.t_builder$: Antes do Pôr do Sol"
 bp2_yearly.1065.a.flavor:0 "Uma economia próspera é boa para todos."
 bp2_yearly.1065.a:0 "Devemos focar no comércio e na produção."
 bp2_yearly.1065.b.flavor:0 "Um pouquinho de violência resolve qualquer problema."
 bp2_yearly.1065.b:0 "O domínio precisa de mais força militar."
 bp2_yearly.1065.c.flavor:0 "A fé é tudo o que precisamos."
 bp2_yearly.1065.c.tt:0 "#X Isso vai alterar o [holding_type|E] e remover quaisquer construções inválidas em [1065_province_for_building.GetName]#!"
 bp2_yearly.1065.c:0 "Um pouco mais de fervor só traria benefícios."
 bp2_yearly.1065.desc:0 "\n\nO construtor e o almoxarife de [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] estiveram discutindo durante toda a manhã sobre quais deveriam ser as novas melhorias, e as discussões agora chegaram a um impasse."
 bp2_yearly.1065.desc_mayor:0 "\n\nO governante de [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip], [province_holder.GetTitledFirstName], e seu mestre de obras estiveram tendo discussões intensas durante toda a manhã e agora chegaram a um impasse."
 bp2_yearly.1065.desc_parent:0 "\n\nMeu(a) [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))] e o construtor de [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] estiveram tendo discussões acaloradas durante toda a manhã e agora chegaram a um impasse."
 bp2_yearly.1065.desc_parent_mayor:0 "\n\nO governante de [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip], [province_holder.GetTitledFirstName], e [Select_CString( current_regent.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))] estiveram tendo discussões intensas durante toda a manhã e agora chegaram a um impasse."
 bp2_yearly.1065.desc_regent:0 "\n\n[current_regent.GetFirstNameNoTooltip] e o construtor de [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip] estiveram tendo discussões acaloradas durante toda a manhã e agora chegaram a um impasse."
 bp2_yearly.1065.desc_regent_mayor:0 "\n\nO governante de [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetNameNoTooltip], [province_holder.GetTitledFirstName], e [current_regent.GetFirstNameNoTooltip] estiveram tendo discussões intensas durante toda a manhã e agora chegaram a um impasse."
 bp2_yearly.1065.intro:0 "Chegou a hora de substituir a área comunal de [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetName], e fui convidado a opinar sobre o assunto."
 bp2_yearly.1065.intro_parent:0 "Chegou a hora de substituir a área comunal de [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetName], e meu(a) [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('current_regent'))] [current_regent.GetTitledFirstName] me pediu para opinar sobre o assunto."
 bp2_yearly.1065.intro_regent:0 "Chegou a hora de substituir a área comunal de [ROOT.Var('the_builder_constructed_building_in').GetProvince.GetName], e meu [ROOT.Char.GetDiarchTitle|l] [current_regent.GetTitledFirstName] me pediu para opinar sobre o assunto."
 bp2_yearly.1065.outro:0 "\n\nAo entrar na sala, eles direcionam sua atenção para mim, claramente esperando uma resposta para esta pergunta."
 bp2_yearly.1065.t:0 "$bp2_yearly.1050.t_builder$: A Comunal"
 bp2_yearly.1070.a.flavor:0 "Vamos construir um próspero centro econômico!"
 bp2_yearly.1070.a.flavor_none:0 "Uma bolsa cheia pode resolver qualquer problema."
 bp2_yearly.1070.a:0 "Uma cidade seria uma opção sólida."
 bp2_yearly.1070.a_buff:0 "Ajustar a favor do comércio é bom."
 bp2_yearly.1070.a_none:0 "Construa para a economia; e eles virão."
 bp2_yearly.1070.b.flavor:0 "Com muralhas magníficas."
 bp2_yearly.1070.b.flavor_none:0 "... e manterão os estranhos projéteis à distância."
 bp2_yearly.1070.b:0 "Mais castelos são o caminho do futuro."
 bp2_yearly.1070.b_buff:0 "A defesa é o melhor seguro para a prosperidade."
 bp2_yearly.1070.b_none:0 "Muralhas unirão os cidadãos."
 bp2_yearly.1070.c.flavor:0 "Este domínio será dedicado a [ROOT.Char.GetFaith.HighGodNameAlternate]."
 bp2_yearly.1070.c.flavor_none:0 "Verdadeiramente."
 bp2_yearly.1070.c:0 "[ROOT.Char.GetFaith.HighGodName] proporciona crescimento."
 bp2_yearly.1070.desc:0 "\n\nChegou a hora de deixar minha marca no mundo fundando um novo domínio na província de [1070_province_to_build_in.GetName]; e cabe a mim decidir nossa direção."
 bp2_yearly.1070.desc_no_province:0 "\n\n[1070_province_to_buff.GetName] precisa de um retoque e cabe a mim aplicar meu conhecimento e melhorar o domínio como ele está."
 bp2_yearly.1070.desc_no_province_no_buff:0 "\n\nE embora meus domínios sejam imaculados e não precisem de nenhum trabalho manual ou retoque adicional; estou perturbado pela pergunta insistente no fundo da minha mente — onde está a essência da construção? Economia? Fé?"
 bp2_yearly.1070.intro:0 "Todos os meus anos estudando a arte da construção — desde construir castelos de mentira quando criança, tocas na selva, estudar a grande arquitetura de [sightseed_capital.GetName] e aconselhar sobre a expansão de [constructed_building_in.GetName] entre outras coisas — me levaram a este exato momento."
 bp2_yearly.1070.t:0 "$bp2_yearly.1050.t_builder$: O que há em um Arco"
 bp2_yearly.1071.a.flavor:0 ""
 bp2_yearly.1071.a:0 "Isso servirá."
 bp2_yearly.1071.desc_castle:0 "As torres brilhando ao sol da manhã; as imponentes muralhas mantendo qualquer atacante à distância."
 bp2_yearly.1071.desc_city:0 "A agitação da minuciosamente planejada área de mercado flui sem problemas para os distritos de artesanato e se estende até as lojas de comércio para envio e recebimento de bens do exterior."
 bp2_yearly.1071.desc_temple:0 "Um testemunho a [ROOT.Char.GetFaith.HighGodNameAlternate] — arcos que exalam um ar de espiritualidade; muralhas com uma base sólida, assim como nossa fé."
 bp2_yearly.1071.outro:0 "\n\n[constructed_holding.GetName] é verdadeiramente uma magnífica obra de construção, e uma que ficará na história como o começo promissor de um novo talento arquitetônico — a saber, eu mesmo."
 bp2_yearly.1071.t_castle:0 "O Construtor de Castelos"
 bp2_yearly.1071.t_city:0 "O Construtor de Cidades"
 bp2_yearly.1071.t_temple:0 "O Construtor de Templos"
 bp2_yearly.1072.a:0 "Ah, bem."
 bp2_yearly.1072.desc:0 "Eu... Eu... não tenho certeza do que aconteceu. O domínio que estava planejado para construção em [cancelled_holding.GetName] se dissipou e não existe mais."
 bp2_yearly.1072.t:0 "$bp2_yearly.1050.t_builder$: Construtor de Sonhos Quebrados"
