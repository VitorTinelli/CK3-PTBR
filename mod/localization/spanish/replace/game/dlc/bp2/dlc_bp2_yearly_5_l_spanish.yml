l_spanish:
 bp2_yearly.5000.a.failure:0 "Sua estratégia falha"
 bp2_yearly.5000.a.flavor:0 "#WEAK A poderosa Torre manterá o infeliz [tower_prince.Custom('GetPrincessPrince')]!#!"
 bp2_yearly.5000.a.success:0 "O ardil tem sucesso"
 bp2_yearly.5000.a.tt:0 "Todos os vassalos de [tower_prince.GetFirstName|U] perdem #negative_value 15#! de opinião a seu respeito#!"
 bp2_yearly.5000.a:0 "Isso deve ser feito."
 bp2_yearly.5000.b:0 "Eu não sou um monstro."
 bp2_yearly.5000.desc:0 "Meu poder como regente é quase absoluto, mas ainda sinto que minha autoridade se baseia em fundações instáveis. Sou um usurpador, e pessoas como eu frequentemente precisam tomar medidas drásticas.\n\nHá uma pedra no meu sapato que, com cuidado, poderia ser removida. [tower_prince.GetFirstName|U] é jovem, mas [tower_prince.GetSheHe] ainda é o [tower_prince.GetTitleAsNameNoTooltip] legítimo. Mesmo enquanto meu domínio se fortalece nesta região, haverá aqueles que questionarão minha posição à medida que o jovem cresce até a idade adulta.\n\nTalvez, então, a criança possa ser trazida sob meu controle? Com as mãos certas untadas..."
 bp2_yearly.5000.t:0 "A Ponta Solta"
 bp2_yearly.5001.a.flavor:0 "O jovem [tower_prince.Custom('GetPrincessPrince')] verá a luz do dia novamente, mas com olhos muito diferentes..."
 bp2_yearly.5001.a:0 "Adeus, meu perturbador do sono..."
 bp2_yearly.5001.b.bypass:0 "#WEAK Isso permitirá que você ignore quaisquer requisitos de tempo para a [decision|E] de Tentar Derrubar o Senhor#!"
 bp2_yearly.5001.b.flavor:0 "Uma quantia substancial de moedas nos lugares certos, e eu terei lançado as bases para um golpe!"
 bp2_yearly.5001.b.tt:0 "Todos os [vassals|E] de [tower_prince.GetFirstName|U] ganham #P 25#! de opinião a seu respeito#!"
 bp2_yearly.5001.b:0 "Talvez agora eu possa forçar algumas mãos..."
 bp2_yearly.5001.c:0 "[tower_prince.GetSheHe|U] pode ser libertado, se [tower_prince.GetSheHe] apoiar minha posição."
 bp2_yearly.5001.desc:0 "Com meu ardil bem-sucedido e [tower_prince.GetFirstName|U] silenciosamente trancado, minha autoridade é quase inquestionável. Ainda assim, ouço sussurros nos corredores, sussurros perguntando, rezando, exigindo: #EMP Onde está o jovem [tower_prince.GetTitleAsNameNoTooltip]?#!\n\nDeixar a criança viva e usá-la para fortalecer minha posição poderia ser a jogada certa, mas trazer [tower_prince.GetSheHe] de volta poderia encorajar aqueles que desejam me depor.\n\nHá uma terceira opção. As mentes das pessoas se dispersam rapidamente. Como isso se dissiparia rapidamente se [tower_prince.GetSheHe] fosse encontrado... em situação inconveniente?"
 bp2_yearly.5001.t:0 "A [tower_prince.Custom('GetPrincessPrince')] na Torre"
 bp2_yearly.5005.a.tt:0 "Talvez eles sintam o mesmo?"
 bp2_yearly.5005.a:0 "Eu..."
 bp2_yearly.5005.b:0 "É... nada."
 bp2_yearly.5005.desc:0 "Quanto mais vejo de [foreign_hostage.GetFirstName], mais sou cativado por sua presença. [foreign_hostage.GetSheHe|U] gira ao redor e se posiciona para tentar me ultrapassar enquanto nos perseguimos no jardim, a luz do sol filtrada caindo sobre seu rosto.\n\nMeu coração dispara por mais do que o esforço. Eu diminuo a velocidade e paro. O que está acontecendo comigo?\n\n\"[ROOT.Char.GetFirstNameNoTooltip]? O que há de errado?\" [foreign_hostage.GetFirstName] pausa por um segundo, ligeiramente preocupado com minha consternação.\n\nEstou #EMP tão#! nervoso..."
 bp2_yearly.5005.t:0 "Um Estrangeiro [foreign_hostage.Custom('GetPrettyAdjective')|U]"
 bp2_yearly.5006.a:0 "Eu também gosto de você!"
 bp2_yearly.5006.b:0 "Isso é estranho. Você é estranho."
 bp2_yearly.5006.desc:0 "Enquanto [crusher.GetFirstName] e eu brincamos e corremos no jardim, percebo que [crusher.GetSheHe] parou. Me viro para olhar [crusher.GetSheHe], mas [crusher.GetSheHe] evita meu olhar, olhando para o chão.\n\n\"Eu... Eu...\" [crusher.GetSheHe] consegue gaguejar depois de alguns segundos. Engolindo com dificuldade, [crusher.GetSheHe] levanta a cabeça para olhar diretamente para um ponto logo acima da minha cabeça.\n\n\"Eu realmente... gosto de você!\" [crusher.GetSheHe] consegue dizer, quase tremendo de nervosismo."
 bp2_yearly.5006.t:0 "Palavras Doces"
 bp2_yearly.5007.a:0 "Eu tenho um presente para você."
 bp2_yearly.5007.b:0 "Funcionou! É assim que eu me senti melhor na vida!"
 bp2_yearly.5007.desc:0 "Para meu alívio infinito, o rosto de [foreign_hostage.GetFirstNamePossessive] se ilumina. [foreign_hostage.GetSheHe|U] sorri, acenando timidamente, mas entusiasticamente. Nenhum de nós consegue encontrar muitas palavras para dizer.\n\nEm vez disso, [foreign_hostage.GetFirstNameNoTooltip] estende uma mão e segura a minha suavemente. [foreign_hostage.GetSheHe|U] sorri novamente.\n\nNós passeamos pelo jardim de colunatas, de mãos dadas, alheios ao mundo exterior. Silenciosamente, desejo que o momento nunca termine."
 bp2_yearly.5007.t:0 "Amor Jovem"
 bp2_yearly.5008.a:0 "Talvez... talvez [foreign_hostage.GetSheHe] mude de ideia depois?"
 bp2_yearly.5008.b:0 "Como você pode ser tão #EMP cruel#!, [foreign_hostage.GetFirstNameNoTooltip]?"
 bp2_yearly.5008.desc:0 "Para meu horror, o rosto de [foreign_hostage.GetFirstNamePossessive] se transforma em uma careta incerta.\n\n\"O que você quer dizer? Por que está sendo tão estranho?\" [foreign_hostage.GetSheHe|U] pergunta com desdém.\n\nMeu coração está despedaçado na brita do jardim. Escondo meu rosto para que [foreign_hostage.GetSheHe] não possa ver as lágrimas.\n\n\"Não é nada. Preciso ir."
 bp2_yearly.5008.t:0 "Punhal no Coração"
 bp2_yearly.5009.a:0 "Claro que vamos!"
 bp2_yearly.5009.b:0 "Muita coisa pode mudar..."
 bp2_yearly.5009.desc:0 "O sol brilha alegremente enquanto [marry_crush.GetFirstName] e eu damos um passeio pelo jardim. [marry_crush.GetSheHe|U] se vira para mim.\n\n\"Quando formos mais velhos, nós nos casaremos?\" [marry_crush.GetSheHe|U] pergunta sinceramente. Minha expressão inquisitiva claramente provoca um acompanhamento. \"Quando ambos estivermos na idade certa, com certeza nos casaremos. É nosso destino!\"\n\nEu considero a possibilidade silenciosamente. Minhas paixões ardem tão intensamente: certamente não pode haver futuro para mim sem [marry_crush.GetFirstNameNoTooltip]?"
 bp2_yearly.5009.t:0 "Planejando o Futuro"
 bp2_yearly.5010.a.flavor:0 "Alguns lampejos dessas brasas da infância ainda permanecem..."
 bp2_yearly.5010.a.tt:0 "Você pede [marry_crush.GetFirstNameNoTooltip] em casamento"
 bp2_yearly.5010.a:0 "Bem... que tal?"
 bp2_yearly.5010.b:0 "Foram bons tempos, não foram?"
 bp2_yearly.5010.desc:0 "\"É como nos velhos tempos, não é?\"\n\nSou despertado da minha contemplação por [marry_crush.GetFirstName]. [marry_crush.GetSheHe|U] se senta ao meu lado, sorrindo amplamente. Apenas ter [marry_crush.GetSheHe] neste jardim comigo realmente traz lembranças de quando éramos jovens e embaraçosamente devotados um ao outro.\n\n\"Você se lembra de todo aquele tempo atrás? Até fizemos promessas de nos casar se ainda estivéssemos solteiros quando adultos!\" [marry_crush.GetSheHe|U] ri alto com a lembrança. Nós realmente éramos tão ingênuos.\n\nEmbora..."
 bp2_yearly.5010.t:0 "Recordações do Passado"
 bp2_yearly.5011.a:0 "...sim. Sim, vamos fazer isso."
 bp2_yearly.5011.b:0 "Que tolice infantil! Se recomponha."
 bp2_yearly.5011.desc:0 "\"Você se lembra,\" diz [root_crush.GetFirstName], virando-se para mim enquanto conversamos no jardim, \"que prometemos nos casar quando éramos crianças, se ambos ainda estivéssemos solteiros quando adultos?\"\n\nSurpreso, repasso minhas lembranças. Eu #EMP me#! lembro. Em um jardim muito parecido com este, fizemos essas promessas ingênuas e esperançosas da infância. Éramos tão jovens, tão apaixonados. A memória traz um sorriso não solicitado.\n\n\"Eu não esqueci.\" [root_crush.GetFirstNameNoTooltip] é um grau mais sincero do que eu esperava. [root_crush.GetSheHe|U] pega minha mão. \"Eu disse o que disse. Estamos ambos solteiros. Lembro-me de como éramos felizes.\""
 bp2_yearly.5011.t:0 "Uma Proposta Decente"
 bp2_yearly.5012.a:0 "Para sempre e sempre!"
 bp2_yearly.5012.b:0 "...talvez eu devesse reconsiderar isso, na verdade."
 bp2_yearly.5012.desc:0 "O rosto de [marry_crush.GetFirstNamePossessive] fica indecifrável por alguns momentos, mas rapidamente se transforma em surpresa feliz.\n\n\"Claro que sim! Claro que sim!\" [marry_crush.GetSheHe|U] me abraça. Por um momento, é como se fôssemos crianças novamente, navegando por sentimentos alegres e confusos.\n\nPego na mão [marry_crush.GetHerHim], e seguimos em direção à entrada do jardim. Há muito o que organizar, afinal."
 bp2_yearly.5012.t:0 "Reacendido"
 bp2_yearly.5013.a:0 "Oh..."
 bp2_yearly.5013.desc:0 "O rosto de [marry_crush.GetFirstNamePossessive] fica indecifrável por alguns momentos, mas rapidamente se transforma em confusão.\n\n\"O que você quer dizer? Você está falando sério?\" [marry_crush.GetSheHe|U] franze a testa. \"Por que você está falando sobre promessas infantis antigas?\"\n\nTento formular as palavras, mas [marry_crush.GetSheHe] já está indo embora, balançando a cabeça com desdém."
 bp2_yearly.5013.t:0 "Apagado"
 bp2_yearly.5050.a:0 "\"Eu já sei mais de um! Me ensine!\""
 bp2_yearly.5050.b:0 "Mas... eu quero!"
 bp2_yearly.5050.c:0 "Isso é bom saber, pelo menos."
 bp2_yearly.5050.desc:0 "Enquanto eu vagueio pelo pátio, um pedaço de pergaminho gira na brisa. Eu o pego, mas os estranhos traços rabiscados nele são diferentes de tudo que já vi.\n\n\"Ah! Você encontrou meu bilhete!\" A voz de [polyglot.GetFirstNamePossessive] me assusta. Sentindo meu espanto, [polyglot.GetSheHe] toca o pedaço tranquilizadoramente.\n\n\"É de outro idioma, [Select_CString( ROOT.Char.IsFemale, 'minha pequena', 'meu pequeno' )] [ROOT.Char.GetLadyLord], não se preocupe! Eu posso ler, mas você não precisa se preocupar com isso agora.\""
 bp2_yearly.5050.t:0 "O Poliglota"
 bp2_yearly.5051.a:0 "É bom que eles estejam passando tempo juntos!"
 bp2_yearly.5051.b:0 "\"[child.GetFirstNameNoTooltip]! Lembre-se de fazer seus estudos!\""
 bp2_yearly.5051.desc:0 "Eu consigo ouvir, ecoando por todo o [ROOT.Char.Custom('ResidenceBuilding')]. Risadinhas leves, ocasionalmente se transformando em gargalhadas completas. Quando entro em um [ROOT.Char.Custom('GetRoom')], os culpados são revelados.\n\n[child.GetFirstName] — com, a julgar pelos livros espalhados pela mesa, seus estudos completamente abandonados — está com seu [child.Custom2('RelationToMe', baby)] [baby.GetFirstName] agarrad[Select_CString( baby.IsFemale, 'a', 'o' )] em seus braços. O bebê balbucia feliz enquanto [child.GetFirstNameNoTooltip] espreita por entre os dedos para [baby.GetSheHe], ambos rindo alegremente."
 bp2_yearly.5051.t:0 "Esconde-Esconde!"
 bp2_yearly.5052.a:0 "\"Bem... e sobre a vez #EMP que eu#! fiz isso, hein?\""
 bp2_yearly.5052.b:0 "\"Se importa se eu me juntar a este círculo animado?\""
 bp2_yearly.5052.c:0 "Isso é fofo. É melhor deixá-los em paz."
 bp2_yearly.5052.desc:0 "Meu passo desacelera enquanto me aproximo de um [ROOT.Char.Custom('GetRoom')]. Acho que consigo ouvir uma voz. Sim, lá está!\n\nEu avisto [Select_CString( grandparent.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('grandparent'))] [grandparent.GetFirstName], segurando grandemente [Select_CString( child.IsFemale, 'sua neta', 'seu neto' )], [child.GetFirstName], encantad[Select_CString( child.IsFemale, 'a', 'o' )] com uma história. Eu também escuto, captando apenas alguns trechos.\n\n[grandparent.GetFirstNameNoTooltip] está contando algumas histórias de uma vida bem vivida, e as narrativas de tempos novos e antigos claramente ressoam profundamente com [child.GetFirstNameNoTooltip], cuja boca está aberta de entusiasmo."
 bp2_yearly.5052.t:0 "Velhas Histórias"
 bp2_yearly.5053.a:0 "\"Você sabe que nunca posso substituir minha família, [angry_kid.GetFirstNameNoTooltip].\""
 bp2_yearly.5053.b.failure:0 "Eles não acreditam em você"
 bp2_yearly.5053.b.success:0 "Você os convence"
 bp2_yearly.5053.b:0 "\"Eu nunca me sentiria assim!\""
 bp2_yearly.5053.c:0 "[ward.GetFirstNameNoTooltip] é mais uma criança para mim do que você jamais foi!"
 bp2_yearly.5053.desc:0 "[ward.GetFirstName] sorri para minha observação, acenando um adeus carinhoso enquanto [ward.GetSheHe] volta para seus estudos. De repente, [Select_CString( angry_kid.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('angry_kid'))] [angry_kid.GetFirstName] vem furiosamente até mim.\n\n\"Admita!\" [angry_kid.GetSheHe|U] grita com raiva. \"Você tem ficado cada vez mais apaixonado por aquela #EMP estrangeira!#! Você está mais apegado a [ward.GetSheHe] do que a #EMP mim#! — seu próprio sangue!\"\n\nClaramente, meu crescente sentimento de pertencimento a [ward.GetFirstNameNoTooltip] simplesmente #EMP é compartilhado#! por todos..."
 bp2_yearly.5053.t:0 "Refém do Coração"
 bp2_yearly.5054.a:0 "É bom vê-los se dando bem."
 bp2_yearly.5054.b.tt:0 "[child.GetSheHe|U] terá que saber que você não pode simplesmente confiar em todos."
 bp2_yearly.5054.b:0 "\"[child.GetFirstNameNoTooltip]! Espere um momento e ouça...\""
 bp2_yearly.5054.desc:0 "Risadas e luz invadem meus aposentos, anunciando a chegada de [Select_CString( child.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] e meu(a) [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] [hostage.GetFirstName]. Os dois estão alegremente perseguindo um ao outro com brinquedos.\n\nDuas crianças de origens bastante diferentes se encontrando inocentemente brincando, suas semelhanças provando ser mais numerosas do que suas diferenças.\n\nTalvez isso seja uma coisa boa?"
 bp2_yearly.5054.t:0 "Amigos Firmes"
 bp2_yearly.5100.a.tt:0 "Inicia um duelo com [challenger.GetFirstNameNoTooltip]."
 bp2_yearly.5100.a:0 "Tudo bem. Assuma sua postura!"
 bp2_yearly.5100.b.tt:0 "Com foco em manobras, certamente pouparemos nossas cabeças de dores..."
 bp2_yearly.5100.b:0 "Que tal realizarmos uma batalha simulada, em vez disso?"
 bp2_yearly.5100.desc:0 "#EMP Swish-crack!#! O som de uma espada de madeira cortando o ar e acertando seu alvo é emocionante para mim. Me preparo para dar outro golpe, mas chamo a atenção de outro. [challenger.GetFirstName] desce os degraus, brandindo uma espada própria.\n\n\"[ROOT.Char.GetFirstNameNoTooltip]! Vamos ver como você se sai contra #EMP mim!#!\"\n\nOlho [challenger.GetFirstNameNoTooltip] com cautela. Essas 'espadas' provavelmente podem causar bastante dano se você acertar alguém com elas, e [challenger.GetFirstNameNoTooltip] parece um pouco... #EMP entusiasmado#! para o meu gosto."
 bp2_yearly.5100.t:0 "Desafiante Aproximando-se"
 bp2_yearly.5101.a:0 "Como #EMP ousa#! me dar ordens?!"
 bp2_yearly.5101.b.failure:0 "Você perde a corrida"
 bp2_yearly.5101.b.success:0 "Você vence a corrida"
 bp2_yearly.5101.b.tt:0 "Nenhum deles vai perceber que estou fazendo isso apenas para tirar a gente da sala..."
 bp2_yearly.5101.b:0 "Eu vou te desafiar lá fora, [child.GetFirstNameNoTooltip]!"
 bp2_yearly.5101.c:0 "\"Desculpe, [councillor.GetFirstNameNoTooltip]. Nós vamos parar.\""
 bp2_yearly.5101.desc:0 "A porta se fecha com estrondo enquanto galopo atrás de [child.GetFirstName], ambos montados em nossos cavalos de brinquedo e rindo animadamente enquanto rasgamos a sala de estudos. [councillor.GetFirstName], [Select_CString( councillor, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('councillor'))], olha cansado das folhas de pergaminho [councillor.GetSheHe] estava lendo.\n\n\"Você realmente precisa criar esse barulho infernal aqui?\" [councillor.GetSheHe|U] grita, apontando para nós dois. \"#EMP Alguém#! tem que ajudar a governar este reino, [ROOT.Char.Custom('FormOfAddressForLiege')], e eu realmente apreciaria a paz e o silêncio para fazer isso!\"\n\nOlho novamente para [child.GetFirstNameNoTooltip], que ainda está pulando animadamente."
 bp2_yearly.5101.t:0 "Passatempo de Cavalo"
 bp2_yearly.5102.a.tt:0 "[sibling.GetFirstNameNoTooltip] recebe [newly_created_artifact.GetName]"
 bp2_yearly.5102.a:0 "Por favor, pare! Eu... Eu vou... vou comprar um brinquedo para você!"
 bp2_yearly.5102.b.failure:0 "[sibling.GetFirstNameNoTooltip] não se deixa persuadir"
 bp2_yearly.5102.b.success:0 "Você convence [sibling.GetFirstNameNoTooltip]"
 bp2_yearly.5102.b:0 "Não, não conte para [Select_CString( parent.IsFemale, 'a', 'o' )] [parent.GetMotherFather]!"
 bp2_yearly.5102.c:0 "\"Ah, supere isso, seu chorão mimado!\""
 bp2_yearly.5102.desc:0 "É a vez de [sibling.GetFirstNamePossessive] me perseguir enquanto brincamos no pátio, e meu coração dispara enquanto eu me movo entre os canteiros de flores.\n\nDesequilibrado, [sibling.GetFirstNameNoTooltip] dá um salto mortal e, sem pensar, dou um empurrão oportunista n[sibling.GetSheHe]. [sibling.GetFirstNameNoTooltip] cai precipitadamente... direto em um arbusto de rosas espinhoso!\n\nO choro imediato que rasgou o ar era previsível e alto. Cambaleando para os pés, [sibling.GetSheHe] imediatamente começa a trotar na direção da sala de nossos pais — notei com horror."
 bp2_yearly.5102.t:0 "Repercussões Imediatas"
 bp2_yearly.5103.a:0 "\"Você não pode me impedir! Eu vou #EMP dominar#! em breve!\""
 bp2_yearly.5103.b.failure:0 "[Select_CString( parent.IsFemale, 'Sua', 'Seu' )] [child.Custom2('RelationToMeShort', parent)] pega você e lhe dá uma bronca"
 bp2_yearly.5103.b.success:0 "Você consegue escapar, com um doce na mão"
 bp2_yearly.5103.b:0 "Hora de dar o fora!"
 bp2_yearly.5103.c:0 "\"Desculpe. Não farei isso de novo.\""
 bp2_yearly.5103.desc:0 "Ao passar, sinto um aroma maravilhoso vindo das cozinhas. Meu estômago roncando me leva até a porta, e uma espiada cautelosa revela exatamente o que eu estava esperando.\n\n[ROOT.Char.Custom('FavoriteTreatDemand')|U]! Sem supervisão! Ou #EMP aparentemente#!, pelo menos. Um olhar cauteloso ao redor da sala não revela nada óbvio. Só preciso dar o fora e—\n\n\"[ROOT.Char.GetFirstNameNoTooltip]!\" Eu congelo, mão estendida, a poucos centímetros da felicidade. \"O que você pensa que está fazendo?\" A voz de [parent.GetFirstNamePossessive], meu(a) [ROOT.Char.Custom2('RelationToMeShort', parent)], é tão firme quanto comovente."
 bp2_yearly.5103.t:0 "Contrabando de Doces"
 bp2_yearly.5104.a:0 "Vou apenas sentar aqui e compartilhar o clima com eles."
 bp2_yearly.5104.b.failure:0 "Nada que você faça consegue animar [child.GetFirstNameNoTooltip]"
 bp2_yearly.5104.b.success:0 "Você consegue persuadir [child.GetFirstNameNoTooltip] a brincar, e eles logo ficam mais animados"
 bp2_yearly.5104.b:0 "\"Vamos lá, [child.GetFirstNameNoTooltip], venha brincar!\""
 bp2_yearly.5104.c.tt:0 "Talvez eu possa aprender algo com isso..."
 bp2_yearly.5104.c:0 "Bem... é melhor deixá-los em paz?"
 bp2_yearly.5104.desc:0 "Eu corro para o pátio, brinquedo na mão, apenas para encontrar [child.GetFirstName] encostado em um banco. [child.GetSheHe|U] mal me nota, suspirando diante das minhas tentativas de animar [child.GetSheHe]. Meu brinquedo fica intocado, deixando-me coçando a cabeça.\n\nO que eu faço agora?"
 bp2_yearly.5104.t:0 "A Criança Solitária"
 bp2_yearly.5105.a.failure:0 "[child.GetFirstNameNoTooltip] dá o primeiro golpe"
 bp2_yearly.5105.a.success:0 "Você marca um golpe bem-sucedido"
 bp2_yearly.5105.a.tt:0 "A justa começa!"
 bp2_yearly.5105.a:0 "\"Venha então, [child.GetLadyLord|U] [child.GetFirstNameNoTooltip]! Vamos duelar!\""
 bp2_yearly.5105.b:0 "Acho que a discrição é a melhor parte da coragem aqui."
 bp2_yearly.5105.desc:0 "\"[ROOT.Char.GetFirstNameNoTooltip]!\" Uma voz aguda ecoa pelo pátio. \"Eu desafio você para um torneio de justa para defender sua honra! Escolha seu cavalo e empunhe sua lança, nobre guerreiro!\"\n\n[child.GetFirstName] brande um galho, segurando um cavalo de brinquedo entre suas pernas. Meu próprio cavalo foi cuidadosamente colocado em um banco próximo, ao lado de um galho de tamanho semelhante.\n\nParece que [child.GetFirstNameNoTooltip] realmente está preparado para a batalha!"
 bp2_yearly.5105.t:0 "Pela Honra e Glória!"
 bp2_yearly.5106.a.failure:0 "O bastão de [child.GetFirstNamePossessiveNoTooltip] se infiltra"
 bp2_yearly.5106.a.success:0 "Seu golpe é preciso"
 bp2_yearly.5106.a.tt:0 "Esta rodada é crucial: ou vencer, ou permanecer na competição..."
 bp2_yearly.5106.a:0 "Vamos ver como isso se desenrola..."
 bp2_yearly.5106.b:0 "\"Podemos parar agora?\""
 bp2_yearly.5106.desc.losing:0 "A 'lança' de [child.GetFirstNamePossessive] me atinge em cheio no peito, me fazendo recuar. [child.GetSheHe|U] se afasta triunfantemente."
 bp2_yearly.5106.desc.winning:0 "Minha 'lança' atinge [child.GetFirstName] no peito, deixando uma pequena marca na pele. Me afasto triunfantemente enquanto [child.GetSheHe] esfrega o torso com desconforto."
 bp2_yearly.5106.ending:0 "\n\nA primeira justa é sempre uma incógnita. Agora, tudo se resume a lembrar do treinamento e das lições, e eu considero qualquer vantagem tática.\n\nO vento faz as folhas das árvores tremularem enquanto nos alinhamos para mais uma — possivelmente crucial — justa."
 bp2_yearly.5106.t:0 "Um Golpe, Registrado"
 bp2_yearly.5107.a.failure:0 "[child.GetFirstNameNoTooltip] é simplesmente rápido demais"
 bp2_yearly.5107.a.success:0 "Você acerta em cheio e vence a justa"
 bp2_yearly.5107.a:0 "Pela vitória!"
 bp2_yearly.5107.b.tt:0 "\"Uma justa equilibrada mesmo\""
 bp2_yearly.5107.b.tt_fail:0 "Foi apenas um jogo"
 bp2_yearly.5107.b.tt_success:0 "Você pode vencer o próximo torneio"
 bp2_yearly.5107.b:0 "\"Bem, ambos vencemos uma, que tal chamarmos de empate?\""
 bp2_yearly.5107.b_tt_fail:0 "Você não aprende nada com isso"
 bp2_yearly.5107.desc.losing:0 "[child.GetFirstName] não é tão fraco quanto eu esperava. Em vez de fraquejar, [child.GetFirstNamePossessive] bastão se choca contra o meu abdômen. Dobrei-me, lutando para esconder minha irritação enquanto [child.GetFirstNameNoTooltip] exibe um sorriso."
 bp2_yearly.5107.desc.winning:0 "Meu bastão mergulha, sobe, pisca por baixo de [child.GetFirstNamePossessive] e acerta [child.GetSheHe] perfeitamente no estômago! O ar é expelido [child.GetHerHim], e [child.GetFirstNameNoTooltip] luta para se endireitar."
 bp2_yearly.5107.ending:0 "Ambos carregamos as marcas da batalha em nossos corpos agora.\n\nA primeira justa acalma os nervos, a segunda emprega táticas, mas a terceira... a terceira rodada é sobre entender seu oponente, aplicar todo o conhecimento que você adquiriu até agora, identificar pistas.\n\nEstou pronto."
 bp2_yearly.5107.t:0 "Um Golpe, Retornando"
 bp2_yearly.5108.a:0 "\"Você duelou com grande habilidade, [child.GetFirstNameNoTooltip].\""
 bp2_yearly.5108.b:0 "\"Hah! E é por isso que eu sou o #EMP melhor!#!\""
 bp2_yearly.5108.c:0 "\"Uma justa excelente, [child.GetFirstNameNoTooltip]!\""
 bp2_yearly.5108.d:0 "Eu vou pegar [child.GetSheHe] por causa desse golpe de sorte..."
 bp2_yearly.5108.desc.losing:0 "O bastão de [child.GetFirstNamePossessive] vacila por um instante, mas não é um tropeço, mas sim um blefe. Ele martela meu torso, tirando o ar dos meus pulmões, e eu caio no chão.\n\n[child.GetFirstNameNoTooltip] fica de lado enquanto eu me levanto, mas a dor da derrota machuca mais do que meus arranhões e hematomas."
 bp2_yearly.5108.desc.winning:0 "Quase fecho os olhos no momento do impacto, mas meu golpe é novamente certeiro. Meu bastão colide com o esterno de [child.GetFirstNamePossessive], quebrando espetacularmente.\n\nIsso derruba [child.GetSheHe] completamente, na verdade, e me vejo em pé sobre o corpo prostrado [child.GetHerHim] por um momento antes de [child.GetFirstNameNoTooltip] lutar para seus pés.\n\nA vitória é minha, e é verdadeiramente, #EMP verdadeiramente#! doce."
 bp2_yearly.5108.t:0 "Uma Justa Excelente!"
 bp2_yearly.5109.a:0 "\"Lembre-se. [parent.GetSheHe|U] está cuidando de você, sempre.\""
 bp2_yearly.5109.b.failure:0 "[child.GetFirstNameNoTooltip] está inconsolável"
 bp2_yearly.5109.b.success:0 "Você consegue confortar [child.GetSheHe]"
 bp2_yearly.5109.b:0 "Pode ser bom tentar distrair sua mente."
 bp2_yearly.5109.c.tt:0 "Vou ver se posso me afastar discretamente..."
 bp2_yearly.5109.c:0 "Não tenho certeza do que dizer aqui."
 bp2_yearly.5109.desc:0 "O pátio ecoa com o som de soluços suaves. [child.GetFirstName] está sentado em um banco, lágrimas escorrendo pelo rosto. [child.GetSheHe|U] tenta contê-las enquanto eu me aproximo, fazendo um gesto para o espaço ao lado [child.GetHerHim], miseravelmente.\n\n"
 bp2_yearly.5109.desc_sibling:0 "\"Sinto muita falta [Select_CString( parent.IsFemale, 'da', 'do' )] [parent.GetMotherFather]. Eu... Eu não consigo parar de pensar nel[Select_CString( parent.IsFemale, 'a', 'e' )].\"\n\nJá faz algum tempo desde que noss[Select_CString( parent.IsFemale, 'a', 'o' )] [parent.GetMotherFather] [parent.GetFirstName] faleceu, mas está claro que [child.GetSheHe] ainda sente profundamente a perda."
 bp2_yearly.5109.desc_unrelated:0 "\"Sinto muita falta [Select_CString( parent.IsFemale, 'da minha', 'do meu' )] [parent.GetMotherFather]. Eu... Eu não consigo parar de pensar nel[Select_CString( parent.IsFemale, 'a', 'e' )].\"\n\nJá faz algum tempo desde que [Select_CString( parent.IsFemale, 'a', 'o' )] [parent.GetMotherFather] de [child.GetFirstNamePossessiveNoTooltip] [parent.GetFirstName] faleceu, mas está claro que [child.GetSheHe] ainda sente profundamente a perda."
 bp2_yearly.5109.t:0 "Coração Partido Duradouro"
