l_spanish:
 destiny_child.0001.a.tt:0 "Há algo #EMP especial#! sobre [destiny_child.GetSheHe]..."
 destiny_child.0001.a:0 "Esta criança precisa de cuidado."
 destiny_child.0001.b:0 "Que absurdo. A cria saberá do seu lugar."
 destiny_child.0001.desc:0 "Existe uma certa intensidade no olhar de [destiny_child.GetFirstNamePossessive].\n\n[destiny_child.GetSheHe|U] também caminha com um orgulhoso graciosidade. [destiny_child.GetSheHe|U] fala com convicção e firmeza, com uma clareza requintada de sílaba. Anciãos com cinco vezes a idade [destiny_child.GetHerHim] ouvem atentamente enquanto [destiny_child.GetSheHe] o faz, atraídos pelo magnetismo da personalidade de [destiny_child.GetFirstNamePossessiveNoTooltip] como se fossem mariposas atraídas pela chama.\n\nHá algo especial sobre esta criança. As antigas canções falam daqueles que são marcados para liderar o seu povo, uma figura de grande porte e habilidade ainda maiores. Será que é verdade?\n\nSerá que [destiny_child.GetFirstNameNoTooltip] está ungido pelo destino?"
 destiny_child.0001.t:0 "A Criança Destinada"
 destiny_child.1000.a:0 "\"Excelente golpe! Continue assim!\""
 destiny_child.1000.b:0 "\"Não negligencie a resistência, [destiny_child.GetFirstNameNoTooltip].\""
 destiny_child.1000.desc:0 "Me ocorre — enquanto observo [destiny_child.GetFirstName] praticando golpes de espada — que [destiny_child.GetSheHe] está realmente se tornando um belo espécime físico.\n\nOutro golpe corta o ar, com [destiny_child.GetFirstNameNoTooltip] seguindo com graça e determinação. Estremeço ao imaginar como seria estar no fim de tal golpe, mas uma pequena parte de mim se pergunta se esse foco em poder é realmente benéfico."
 destiny_child.1000.t:0 "Um Jovem Robusto"
 destiny_child.1005.a:0 "Tanta eloquência! Tanta sabedoria!"
 destiny_child.1005.b:0 "\"Você está impedindo [destiny_child.GetFirstNameNoTooltip] de prosseguir nas suas atividades marciais, [realm_priest.GetFirstNameNoTooltip].\""
 destiny_child.1005.c:0 "Tenho certeza de que [destiny_child.GetFirstNameNoTooltip] aprenderá muito com isso."
 destiny_child.1005.desc:0 "Dobro uma esquina e encontro [destiny_child.GetFirstName] e o(a) meu(a) [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('realm_priest'))|U] [realm_priest.GetFirstName] envolvidos em um debate. Não uma discussão, pelo que posso ver, mas sim uma troca animada de ideias.\n\n[destiny_child.GetFirstNameNoTooltip], com seus olhos brilhantes, está fervorosamente discutindo minúcias religiosas em grande detalhe. [realm_priest.GetFirstNameNoTooltip|U], para o crédito dele, parece estar tratando [destiny_child.GetFirstNameNoTooltip] como um igual, apesar da diferença de idade."
 destiny_child.1005.t:0 "Pensamento Lateral"
 destiny_child.1010.a.tt:0 "O domínio de estratégias marciais de [destiny_child.GetFirstNamePossessiveNoTooltip|U] já é avançado, mas há muito que [destiny_child.GetSheHe] ainda não sabe."
 destiny_child.1010.a:0 "\"Verdade, mas isso os deixaria expostos. Veja!\""
 destiny_child.1010.b:0 "Minha nossa. [destiny_child.GetFirstNameNoTooltip|U] está certo(a)!"
 destiny_child.1010.c:0 "\"Aqui, repasse comigo mais uma vez?"
 destiny_child.1010.desc:0 "O(a) meu(a) [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))|U] [marshal.GetFirstName] e eu estamos concentrados em um jogo de guerra, examinando uma mesa com pequenos marcadores representando várias tropas. Mal percebo [destiny_child.GetFirstName] se aproximando, mas seu olhar feroz direcionado para a mesa imediatamente revela a intensidade de seus cálculos internos.\n\n\"Aqui.\" A voz de [destiny_child.GetFirstNamePossessiveNoTooltip] me assusta. \"Esse grupo está engajado frontalmente. Se você usasse aquela floresta para proteger a sua abordagem, poderia pegá-los completamente desprevenidos...\"\n\n[marshal.GetFirstNameNoTooltip] levanta as sobrancelhas sobre o ombro de [destiny_child.GetFirstNamePossessiveNoTooltip] enquanto [destiny_child.GetSheHe] se inclina para mover os marcadores."
 destiny_child.1010.t:0 "Mente Militar"
 destiny_child.1015.a.critfailure:0 "[destiny_child.GetSheHe|U] comete um erro terrível devido à pressão"
 destiny_child.1015.a.failure:0 "[destiny_child.GetSheHe|U] se excede [destiny_child.GetHerselfHimself]"
 destiny_child.1015.a.success:0 "[destiny_child.GetFirstNameNoTooltip] atinge novos patamares de habilidade"
 destiny_child.1015.a:0 "\"Você deve se esforçar mais, [destiny_child.GetFirstNameNoTooltip]!\""
 destiny_child.1015.b.failure:0 "Você se mostra igualmente incapaz de acompanhar [destiny_child.GetFirstNameNoTooltip]"
 destiny_child.1015.b.success:0 "Suas instruções se mostram ainda mais valiosas do que as de [knight.GetFirstNamePossessiveNoTooltip]"
 destiny_child.1015.b:0 "Talvez eu deva assumir?"
 destiny_child.1015.c:0 "\"Continuem assim, vocês dois, e alguma moeda para os problemas de [knight.GetFirstNamePossessiveNoTooltip]!\""
 destiny_child.1015.desc:0 "Duas lâminas se chocam sob a luz do sol brilhante, raspando ao longo dos seus comprimentos com um #EMP shing!#! metálico.\n\n[destiny_child.GetFirstName] recua levemente, segurando a lâmina como se fosse uma extensão do seu braço. Seu parceiro de sparring, [knight.GetFirstName|U], tropeça após [destiny_child.GetSheHe], ofegando levemente.\n\nOs dois têm lutado por um tempo agora, e [destiny_child.GetFirstNameNoTooltip] mal transpirou. Eu me pergunto se [destiny_child.GetSheHe] está sequer #EMP tentando#!."
 destiny_child.1015.t:0 "A Prática Faz..."
 destiny_child.1020.a:0 "Tempo com um médico pode ser bem gasto..."
 destiny_child.1020.b:0 "A botânica é uma área interessante de pesquisa!"
 destiny_child.1020.c:0 "\"Apenas... não permita que isso tome muito tempo dos estudos dela.\""
 destiny_child.1020.desc:0 "Sight estranho tem uma maneira de se apresentar quando você menos espera. Isso se comprova quando o(a) meu(a) [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('physician'))|U] [physician.GetFirstName] e [herbalist.GetFirstName], uma curandeira experiente, me confrontam com a animada [destiny_child.GetFirstName] a reboque.\n\n\"O jovem [destiny_child.GetFirstNameNoTooltip] deseja aprender uma das nossas profissões, [ROOT.Char.Custom('FormOfAddressForLiege')],\" começa [physician.GetFirstNameNoTooltip], \"e estaríamos inclinados a ensinar [destiny_child.GetSheHe].\" [herbalist.GetFirstNameNoTooltip] interrompe exasperadamente.\n\n\"Só precisamos da sua permissão, porque eu não vou ser o único a tirar [destiny_child.GetSheHe] dos estudos sem isso!\""
 destiny_child.1020.t:0 "Aprendizado Extracurricular"
 destiny_child.1025.a:0 "#EMP \"Vá embora,#! assassino maldito! #EMP Guardas!#!"
 destiny_child.1025.b:0 "Treinar [destiny_child.GetSheHe]? Uma ideia maravilhosa!"
 destiny_child.1025.c:0 "\"Talvez você possa até ser persuadido a ficar?\""
 destiny_child.1025.desc:0 "O bufar de um cavalo me assusta. Um [famous_knight.Custom('KnightCultureNoTooltip')|l] montado em um corcel cavalga em minha direção.\n\n\"[ROOT.Char.GetTitledFirstName]! É você?\" [famous_knight.GetSheHe|U] inclina a cabeça respeitosamente. \"Vim à procura de uma criança — [destiny_child.GetFirstNameNoTooltip]. [destiny_child.GetSheHe|U] está sob seus cuidados, não está?\" Assinto, enquanto meus atentos guardas se aproximam.\n\n\"Não tenha medo. Sou renomado por meu próprio mérito... mas a fama do talento de [destiny_child.GetFirstNamePossessiveNoTooltip] se espalha como fogo! Eu ficaria honrado em conhecer [destiny_child.GetSheHe], e talvez ajudar a nutrir essa promessa.\""
 destiny_child.1025.t:0 "Palavra Viaja Longe"
 destiny_child.1030.a.failure:0 "Seus planos são notados, e uma agitação se desenvolve"
 destiny_child.1030.a.success:0 "Suas maquinações silenciosas têm sucesso"
 destiny_child.1030.a:0 "Se eu usar todos os meus truques, talvez isso se encaixe..."
 destiny_child.1030.b:0 "Eu não posso arriscar deixar a história de [destiny_child.GetFirstNamePossessiveNoTooltip] sem ser contada."
 destiny_child.1030.c.tt:0 "Eu devo preparar o verdadeiro herdeiro, mas também fornecer a [destiny_child.GetFirstNameNoTooltip] as habilidades para proteger [current_heir.GetSheHe]."
 destiny_child.1030.c:0 "As leis são como são. Elas não podem ser subvertidas."
 destiny_child.1030.desc:0 "[destiny_child.GetFirstName] é verdadeiramente talentoso(a). As palavras [destiny_child.GetHerHim|U] têm o peso de alguém com décadas de experiência, e as pessoas seguem instintivamente a liderança [destiny_child.GetHerHim]. Não há dúvida de onde está o futuro de minha família. E, no entanto...\n\nApesar do apelo e da habilidade de [destiny_child.GetFirstNamePossessiveNoTooltip], as leis da [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'acampamento', 'terra')] são o que são. [destiny_child.GetSheHe|U] não é [Select_CString( destiny_child.IsFemale, 'minha herdeira', 'meu herdeiro' )] principal. Quando eu partir, todo esse talento e habilidade serão apenas utilizados a serviço dos esquemas de [Select_CString( current_heir.IsFemale, 'sua', 'seu' )] [destiny_child.Custom2('RelationToMeShort', SCOPE.sC('current_heir'))] [current_heir.GetFirstNamePossessive].\n\nAli, brilhando no canto da minha mente, estão as apostas. Esta é uma decisão da qual meu legado dependerá."
 destiny_child.1030.t:0 "O Próximo na Linha?"
 destiny_child.1035.a:0 "[destiny_child.GetFirstNameNoTooltip] parece estar atraídp(a) por [flirter_1.GetFirstNameNoTooltip]..."
 destiny_child.1035.b:0 "Acho que [destiny_child.GetFirstNameNoTooltip] está interessado(a) por [flirter_2.GetFirstNameNoTooltip]!"
 destiny_child.1035.c:0 "\"É bom que você não deixe essas bobagens te afetarem, [destiny_child.GetFirstNameNoTooltip].\""
 destiny_child.1035.d.tt:0 "Haverá tempo para #EMP isso#! mais tarde na vida [destiny_child.GetHerHim]..."
 destiny_child.1035.d:0 "\"Você deve se concentrar, [destiny_child.GetFirstNameNoTooltip]!\""
 destiny_child.1035.desc:0 "As habilidades de [destiny_child.GetFirstNamePossessive] são tais que às vezes esqueço que [destiny_child.GetSheHe] ainda é uma criança, mas enquanto viajamos pelo [ROOT.Char.Custom('GetCourtyard')] e ouço o riso de duas crianças ao nosso lado, sou subitamente lembrado de que crianças ainda serão crianças.\n\nAs duas crianças risonhas estão claramente encantadas com [destiny_child.GetFirstNameNoTooltip], a ponto de ambas imediatamente olharem furiosamente para o chão quando [destiny_child.GetSheHe] as cumprimenta alegremente."
 destiny_child.1035.interested:0 "\n\nEmbora [destiny_child.GetSheHe] seja mais sábio(a) que as crianças de sua idade, eu posso ver o sorriso no canto da boca de [destiny_child.GetFirstNamePossessiveNoTooltip]..."
 destiny_child.1035.notinterested:0 "\n\nPara minha surpresa, no entanto, [destiny_child.GetSheHe] não diz mais nada. Completamente destemida, [destiny_child.GetSheHe] segue em frente, pulando os degraus que levam para dentro."
 destiny_child.1035.t:0 "Amor Jovem"
 destiny_child.9999.a:0 "Foi uma honra."
 destiny_child.9999.desc:0 "O crescimento contínuo de [destiny_child.GetFirstName] se aproximou de mim, mas agora eu olho para [destiny_child.GetSheHe] com os olhos de um igual. Todo aquele tempo atrás, eu vi o potencial n[destiny_child.GetHerHim] e resolvi nutri-lo. Eu tinha pouca ideia do que esperar naquela época, mas está claro que meus esforços não foram em vão.\n\n[destiny_child.GetFirstNameNoTooltip] fica cara a cara comigo, sorrindo, e apesar da nossa familiaridade, eu não posso deixar de sentir aquele puxão natural que [destiny_child.GetSheHe] exala. Não pode haver dúvida: essa [destiny_child.GetWomanMan] está marcada para a grandeza de alguma maneira misteriosa.\n\nTenho certeza de que fiz a coisa certa ao auxiliar sua jornada pelo caminho traiçoeiramente entrelaçado do destino."
 destiny_child.9999.t:0 "Destino Realizado"
