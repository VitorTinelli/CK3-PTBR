l_spanish:
 bp2_make_hostage_less_loyal:0 "[hostage.GetFirstName] será menos propens[Select_CString( hostage.IsFemale, 'a', 'o' )] a ser leal a você quando [hostage.GetSheHe] se tornar adult[Select_CString( hostage.IsFemale, 'a', 'o' )]"
 bp2_make_hostage_more_loyal:0 "[hostage.GetFirstName] será mais propens[Select_CString( hostage.IsFemale, 'a', 'o' )] a ser leal a você quando [hostage.GetSheHe] se tornar adult[Select_CString( hostage.IsFemale, 'a', 'o' )]"
 bp2_security_compromised:0 "Segurança Comprometida"
 bp2_security_compromised_desc:0 "Este personagem descobriu que alguém na corte está compartilhando informações comprometedoras"
 bp2_start_loyalty_story_cycle:0 "[hostage.GetFirstName] começará a questionar a quem [hostage.GetSheHe] deve sua lealdade."
 bp2_yearly.8050.a:0 "\"Claro, eu sou seu [ROOT.Char.Custom('GetAuntieUncle')].\""
 bp2_yearly.8050.b:0 "\"Você é um refém, nada mais.\""
 bp2_yearly.8050.desc.intro:0 "Encontro [hostage.GetName] hoje olhando de maneira pensativa e contemplativa, observando as pessoas abaixo de nós.\n\nAproximo-me e coloco minha mão no ombro relaxado [hostage.GetHerHim] e pergunto o que pesa tanto em sua mente.\n\n\"Oh [ROOT.Char.Custom('GetAuntUncle')],"
 bp2_yearly.8050.desc.mid.childhood_friendship:0 "[hostage_friend.GetFirstName] tem sido mais um amigo para mim do que qualquer pessoa no lugar que eu costumava chamar de lar."
 bp2_yearly.8050.desc.mid.culture:0 "Eu simplesmente não me identifico mais com a cultura de [hated_parent.GetCulture.GetName] e sinto que seria um alienígena para meus pais. Me sinto muito mais à vontade com as práticas da cultura [hostage.GetCulture.GetName] que adotei aqui."
 bp2_yearly.8050.desc.mid.faith:0 "m[Select_CString( hated_parent.IsFemale, 'inha', 'eu' )] [hated_parent.GetMotherFather] é um [hated_parent.GetFaith.GetAdherentName], e eu sou um [hostage.GetFaith.GetAdherentName]. Como posso me considerar [hostage.Custom('GetDaughterSon')] [hated_parent.GetHerHim] quando nossas crenças são tão opostas?"
 bp2_yearly.8050.desc.mid.friendship:0 "você tem sido mais um amigo para mim do que qualquer pessoa no lugar que eu costumava chamar de lar."
 bp2_yearly.8050.desc.mid.hatred:0 "[hated_parent.Custom2('MyCharacterIntroduction', SCOPE.sC('hostage'))] é um[Select_CString( hated_parent.IsFemale, 'a', '' )] [hated_parent.Custom2('InsultNoun', SCOPE.sC('hostage'))] [hated_parent.Custom2('InsultAdjective', SCOPE.sC('hostage'))] completo, e eu não consigo suportar a ideia de retornar para [hated_parent.GetSheHe]."
 bp2_yearly.8050.desc.mid.traits:0 "Sinto que temos muito mais em comum do que eu tenho com as pessoas no lugar que eu costumava chamar de lar."
 bp2_yearly.8050.desc.outro:0 "Não posso deixar de me perguntar, quem sou eu? [hostage.GetHouse.GetName|U] ou [ROOT.Char.GetHouse.GetName]?"
 bp2_yearly.8050.t:0 "Quem Sou Eu?"
 bp2_yearly.8051.a:0 "\"Oh [hostage.Custom('GetNieceNephew')], tudo está perdoado.\""
 bp2_yearly.8051.b:0 "\"Você nunca mais escreverá para casa.\""
 bp2_yearly.8051.c:0 "\"Você nunca mais sairá do seu quarto!\""
 bp2_yearly.8051.desc:0 "Entro no quarto [hostage.GetFirstNamePossessive], mas encontro o quarto [hostage.GetHerHim] vazio. Espalhadas pela mesa [hostage.GetHerHim] de escrita, no entanto, encontro uma pilha de cartas meio escritas endereçadas a [hostage.GetHomeCourt.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip].\n\nAs cartas estão cheias de detalhes sobre minha corte: esconderijos, quem fornece minhas refeições e os nomes de servos descontentes propensos a me trair. Volto-me e vejo [hostage.GetFirstNameNoTooltip] parada na entrada, como um animal caçado momentos antes de fugir."
 bp2_yearly.8051.t:0 "Cartas Comprometedoras"
 bp2_yearly.8052.a:0 "[mean_child.GetFirstNameNoTooltip] deveria parar de ser um valentão."
 bp2_yearly.8052.b.failure:0 "[hostage.GetFirstName] se machucou"
 bp2_yearly.8052.b.success:0 "[hostage.GetFirstName] apreciou a lição"
 bp2_yearly.8052.b:0 "Deveria incentivar [hostage.GetFirstNameNoTooltip] a se defender."
 bp2_yearly.8052.c:0 "Não me importo."
 bp2_yearly.8052.desc:0 "O pátio está cheio dos sons familiares de correrias e gritos, enquanto as crianças da corte brincam. Apesar do barulho, é estranhamente tranquilo, até que os gritos de dor de [hostage.GetFirstName] me chamam para intervir.\n\n\"Pare com isso! Pare com isso! [ROOT.Char.GetFirstNameNoTooltip], [mean_child.GetFirstName] continua me batendo!\""
 bp2_yearly.8052.t:0 "Bullying"
 bp2_yearly.8053.a:0 "Uma bela frase."
 bp2_yearly.8053.b:0 "Essas palavras são apenas para os lábios de [ROOT.Char.GetHouse.GetNameNoTooltip]!"
 bp2_yearly.8053.desc:0 "As crianças estão mais uma vez brincando no pátio, e hoje estão engajadas com suas espadas de brinquedo. [hostage.GetFirstName|U] parece implacável com as outras crianças, enfrentando várias ao mesmo tempo e vencendo com facilidade.\n\nEntre os gritos habituais de brincadeira, meus ouvidos se aguçam de repente quando [hostage.GetSheHe] grita \"#EMP [ROOT.Char.GetHouse.GetMotto]#!, canalhas!\""
 bp2_yearly.8053.t:0 "Uma Frase Maravilhosa"
 bp2_yearly.8054.a:0 "Você já ouviu falar de [ROOT.Char.GetHouse.GetFounder.GetNameNoTooltip]?"
 bp2_yearly.8054.b.failure:0 "[hostage.GetFirstName] não acredita em você"
 bp2_yearly.8054.b.success:0 "[hostage.GetFirstName] fica impressionado com sua história"
 bp2_yearly.8054.b:0 "Eu sou algo de uma lenda eu mesmo."
 bp2_yearly.8054.c:0 "Já mencionei que matei um dragão?"
 bp2_yearly.8054.desc:0 "Encontro um raro momento a sós com [hostage.GetFirstName], dando minhas habituais lições sobre assuntos mundanos e piedosos, mas [Select_CString( hostage.IsFemale, 'essa', 'esse' )] [hostage.Custom('GirlBoy')] parece ter algo mais em mente.\n\n\"Tenho estado fascinado pela sua ilustre casa, [ROOT.Char.Custom('GetAuntUncle')]. Você poderia me contar algumas das lendas da Casa de [ROOT.Char.GetHouse.GetNameNoTooltip]?\""
 bp2_yearly.8054.t:0 "Lendas dos [ROOT.Char.GetHouse.GetNameNoTooltip|U]"
 bp2_yearly.8055.a:0 "Talvez eu possa mudar!"
 bp2_yearly.8055.b:0 "Não vivo para impressionar [hostage.GetSheHe]."
 bp2_yearly.8055.c.failure:0 "[hostage.GetFirstName|U] fica insultado"
 bp2_yearly.8055.c.success:0 "Você convence [hostage.GetSheHe] dos seus caminhos"
 bp2_yearly.8055.c:0 "[hostage.GetSheHe|U] deveria ser incentivado a mudar."
 bp2_yearly.8055.desc:0 "[hostage.GetFirstName] tem parecido bastante distante e esquivo comigo ultimamente, me evitando nos momentos de contato que temos. Quando finalmente pego um momento a sós com [hostage.GetSheHe], coloco uma mão simpática no ombro gelado [hostage.GetHerHim].\n\n[hostage.GetSheHe|U] simplesmente ignora, e se afasta de mim. \"O que você quer comigo? Cada momento que estamos juntos é simplesmente torturante! Você é um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('hostage'))] e mal posso esperar para sair deste lugar.\""
 bp2_yearly.8055.t:0 "Choque de Personalidades"
 bp2_yearly.8056.a:0 "Maravilhoso."
 bp2_yearly.8056.b:0 "Finalmente, alguém que realmente me #EMP entende#!."
 bp2_yearly.8056.desc:0 "A conversa com [hostage.GetFirstName] é simplesmente um deleite, e [hostage.GetSheHe] parece sentir da mesma forma. Temos tanto em comum, muitas vezes parece que compartilhamos uma mente.\n\nDurante nossa lição hoje, [hostage.GetSheHe] se apega a cada palavra minha, verdadeiramente uma criança que vale a pena chamar de meu(a) [hostage.Custom('GetNieceNephew')]."
 bp2_yearly.8056.t:0 "Um Refém Cordial"
 bp2_yearly.8057.a:0 "Que maravilha."
 bp2_yearly.8057.b:0 "Isso deve ser elogiado!"
 bp2_yearly.8057.desc:0 "No pátio, [hostage.GetFirstName] e [nice_child.GetFirstName] estão felizes brincando, como todas as crianças deveriam estar. Entre os cantos habituais e o farfalhar da criação de [ROOT.Char.GetFaith.CreatorNamePossessive], estão as risadas alegres das crianças, e o mundo parece como deveria.\n\nNo meu momento de paz, até ouço [nice_child.GetFirstNameNoTooltip] casualmente chamar [hostage.GetFirstNameNoTooltip] de \"[hostage.Custom('SisterBrother')]\"."
 bp2_yearly.8057.t:0 "Como [Select_CString( hostage.IsFemale, 'uma', 'um' )] [hostage.Custom('SisterBrother')|U]"
 bp2_yearly.8060.a:0 "\"[ROOT.Char.GetMotherFather|U] servirá muito bem.\""
 bp2_yearly.8060.b:0 "\"Você é m[Select_CString( hostage.IsFemale, 'inha', 'eu' )] [hostage.Custom('GetDaughterSon')], apenas no nome.\""
 bp2_yearly.8060.c:0 "\"Sempre serei [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom('GetAuntUncle')].\""
 bp2_yearly.8060.desc:0 "Finalmente, [hostage.GetFirstName] é oficialmente um[Select_CString( hostage.IsFemale, 'a', '' )] [hostage.GetWomanMan] agora e não poderia estar mais orgulhoso de vê-l[Select_CString( hostage.IsFemale, 'a', 'o' )] caminhar confiante para a corte esta manhã, com toda a graça e grandiosidade que eu esperaria de um[Select_CString( hostage.IsFemale, 'a', '' )] dos meus. Ainda está para ser visto se [hostage.GetSheHe] permanecerá na corte, mas enquanto [hostage.GetSheHe] se aproxima de mim para as saudações habituais da corte, sinto como se estivesse olhando para [Select_CString( hostage.IsFemale, 'a minha própria', 'o meu próprio' )] [hostage.Custom('GetDaughterSon')].\n\n\"Que honra é vê-l[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )], [ROOT.Char.GetMotherFather].\" São necessários alguns suspiros e murmúrios da corte para que [hostage.GetSheHe] perceba seu erro. \"Oh, quero dizer, [ROOT.Char.Custom('GetAuntUncle')]!\""
 bp2_yearly.8060.t:0 "[ROOT.Char.GetMotherFather|U]?"
 bp2_yearly.8061.a:0 "Maravilhoso."
 bp2_yearly.8061.desc:0 "Já faz tanto tempo desde que [hostage.GetFirstName] chegou à corte e me tornei [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom('GetAuntUncle')]. Agora, ao ver [hostage.GetSheHe] como um adulto, sinto um vínculo familiar com [hostage.GetSheHe], como se fôssemos do mesmo sangue.\n\n[hostage.GetFirstNameNoTooltip] ajoelha-se diante de mim na corte e jura sua lealdade eterna a mim, como [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom('GetAuntUncle')] favorito."
 bp2_yearly.8061.t:0 "[ROOT.Char.Custom('GetAuntUncle')|U] para Sempre"
 bp2_yearly.8063.a:0 "Oops."
 bp2_yearly.8063.desc:0 "Já faz tanto tempo desde que [hostage.GetFirstName] chegou à corte e me tornei [Select_CString( ROOT.Char.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom('GetAuntUncle')]. Agora, [Select_CString( hostage.IsFemale, 'uma', 'um' )] [hostage.GetWomanMan], [hostage.GetSheHe] mal consegue me encarar. Sentado(a) na corte, seus olhos mostram um ódio e malícia em relação a mim que só pode ser atribuído à minha tentativa fracassada de uma educação adequada da Casa [ROOT.Char.GetHouse.GetNameNoTooltip]."
 bp2_yearly.8063.t:0 "Um Refém Desprezado"
 bp2_yearly.8065.a:0 "Loucura!"
 bp2_yearly.8065.desc:0 "Há muito tempo sinto que [new_parent.GetFirstName] é [Select_CString( new_parent.IsFemale, 'a minha verdadeira', 'o meu verdadeiro' )] [new_parent.GetMotherFather], e finalmente colocamos isso por escrito. A partir de hoje, estou desassociad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] da minha antiga casa e agora sou um membro pleno da Casa [new_parent.GetHouse.GetName]."
 bp2_yearly.8065.t:0 "[ROOT.Char.Custom2('AppropriateGreetingNegative', ROOT.Char )]"
 friend_deep_understanding:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] compartilharam um entendimento pessoal profundo um do outro"
 hostage_loyalty:0 "Refém Leal"
 invalidates_hostage_tt:0 "[hostage.GetFirstName|U] deixará de ser seu refém"
 rival_chastised_child:0 "[CHARACTER.GetShortUIName|U] repreendeu [TARGET_CHARACTER.GetShortUIName]"
 rival_chastised_child_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] repreendeu [CHARACTER.GetShortUIName]"
 rival_manipulated_me:0 "[TARGET_CHARACTER.GetShortUIName|U] tentou manipular [CHARACTER.GetShortUIName]"
 rival_manipulated_me_corresponding:0 "[CHARACTER.GetShortUIName|U] tentou manipular [TARGET_CHARACTER.GetShortUIName]"
