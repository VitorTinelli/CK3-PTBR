l_spanish:
 abandoned_opinion:0 "Abandonado"
 bp2_yearly.4000.a.flavor:0 "Será que conseguirei cumprir essa promessa?"
 bp2_yearly.4000.a:0 "Eu prometo! Não vou te abandonar!"
 bp2_yearly.4000.b.flavor:0 "E todos passamos pela vida sozinhos."
 bp2_yearly.4000.b:0 "O mundo é um lugar cruel, meu filho."
 bp2_yearly.4000.c:0 "Em [ROOT.Char.GetFaith.HighGodNameAlternate] coloco minha esperança."
 bp2_yearly.4000.desc:0 "Enquanto embalo meu recém-nascido [first_babby.Custom('GetDaughterSon')], [first_babby.GetName], a alegria extática se mistura com a tristeza e um medo pungente rastejando pela minha espinha.\n\n[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [ROOT.Char.GetMotherFather] me embalava assim antes que ambos [ROOT.Char.GetSheHe] e minha mãe falecessem, enquanto eu ainda era jovem, e me deixassem sozinho?\n\nIsso é uma maldição? [ROOT.Char.GetFaith.FateGodName] roubará meu doce filho de seus pais, como [ROOT.Char.GetFaith.FateGodSheHe] fez comigo?"
 bp2_yearly.4000.t:0 "Medos do Passado"
 bp2_yearly.4001.a:0 "[murdered_relative.GetSheHe|U] não deseja mais nada, graças a você, [imprisoned_murderer.Custom2('InsultNoun', ROOT.Char)]!"
 bp2_yearly.4001.b:0 "Há força no perdão, em escolher o que é certo."
 bp2_yearly.4001.desc:0 "Eu era apenas uma criança quando a vida de meu(a) [ROOT.Char.Custom2('RelationToMeShort', murdered_relative)] [murdered_relative.GetName] foi abruptamente interrompida por ordens de [imprisoned_murderer.GetName]. Naquela época, eu era impotente para impedir isso, impotente para impor justiça.\n\nHoje, é [imprisoned_murderer.GetNameNoTooltip] quem está impotente, amarrado e sujeito à minha vontade. O que [murdered_relative.GetFirstNameNoTooltip] gostaria, eu me pergunto? Vingança, uma vida por sua vida, ou um gesto de misericórdia?"
 bp2_yearly.4001.t:0 "Justiça Adiada"
 bp2_yearly.4002.a:0 "Antepassados, me deem forças! Eu não vou mais beber!"
 bp2_yearly.4002.b:0 "Um brinde a vocês dois, [first_aa_relative.GetFirstNameNoTooltip] e [second_aa_relative.GetFirstNameNoTooltip]!"
 bp2_yearly.4002.desc:0 "Outra noite, mais uma rodada de álcool. Há quanto tempo venho bebendo agora? Dias? Semanas? Isso importa? Na espuma rodopiante do meu caneco meio cheio, vejo algo estranho e peculiar. Os rostos preocupados de meus parentes já falecidos, [first_aa_relative.GetFirstNameNoTooltip] e [second_aa_relative.GetFirstNameNoTooltip], olham para mim.\n\nA névoa etílica é perfurada por minhas memórias de infância esquecidas de encontrá-los mortos por excesso de bebida, com os corpos inchados e ainda embriagados.\n\nEstou destinado a compartilhar o mesmo destino que eles?"
 bp2_yearly.4002.t:0 "Um Chamado Espiritual"
 bp2_yearly.4003.a:0 "Você seguirá meu caminho, [child_ruler.GetFirstNameNoTooltip]."
 bp2_yearly.4003.b:0 "Não repetiremos os erros do passado."
 bp2_yearly.4003.c:0 "Este condado vale mais do que a educação [child_ruler.GetHerHim]!"
 bp2_yearly.4003.desc:0 "[child_ruler.GetName|U] agora tem a mesma idade que eu tinha quando ascendi ao poder. Meu caminho foi cheio de dificuldades, sendo responsável por todo o reino em uma idade tão jovem, mas isso me tornou a [ROOT.Char.GetWomanMan] que sou hoje. Minha infância foi muito diferente da dos meus pares: em vez de brincadeiras infantis, eu jogava o jogo dos adultos. Eu jogava e aprendia bem.\n\nHá uma terra adequada, [giveaway_county.GetDefinitiveName], onde [child_ruler.GetFirstNameNoTooltip] pode se tornar um governante como eu fiz. Mas [child_ruler.GetSheHe] está pronto? Meu caminho é o único que prepara para o futuro difícil?"
 bp2_yearly.4003.t:0 "O Caminho de um Governante"
 bp2_yearly.4010.a:0 "Humbildemente? Eu não sou humilde!"
 bp2_yearly.4010.b.flavor:0 "Eu serei famoso, brilharei intensamente, não importa o custo."
 bp2_yearly.4010.b:0 "Um dia serei como você, [famous_parent.GetFirstNameNoTooltip]!"
 bp2_yearly.4010.c.flavor:0 "E estou satisfeito em viver à sombra [famous_parent.GetHerHim]."
 bp2_yearly.4010.c:0 "Fico feliz por ter um[Select_CString( famous_parent.IsFemale, 'a', '' )] [famous_parent.GetMotherFather] tão famoso!"
 bp2_yearly.4010.desc:0 "Há sussurros sobre os contos e feitos [Select_CString( famous_parent.IsFemale, 'da minha', 'do meu' )] [famous_parent.GetMotherFather], [ROOT.Char.Custom('ParentPrestigeLevelText')] [famous_parent.GetTitledFirstName], em todos os lugares por onde passo. Perto ou longe, parece que não há ninguém que não tenha ouvido o nome [famous_parent.GetHerHim].\n\nEu me pergunto, ficarei para sempre na sombra [Select_CString( famous_parent.IsFemale, 'da minha', 'do meu' )] [famous_parent.GetMotherFather]? Ou conseguirei alcançar tanta fama em minha vida quanto [famous_parent.GetSheHe]? Até onde conseguirei chegar?"
 bp2_yearly.4010.t:0 "Sombra da Fama: Crepúsculo"
 bp2_yearly.4011.a:0 "O mundo lembrará de [famous_dead_parent.GetFirstNameNoTooltip] como #EMP [Select_CString( famous_dead_parent.IsFemale, 'minha', 'meu' )]#! [famous_dead_parent.GetMotherFather]!"
 bp2_yearly.4011.b:0 "Ai de mim, sempre serei s[Select_CString( ROOT.Char.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom('GetDaughterSon')]."
 bp2_yearly.4011.c:0 "Já alcancei o suficiente."
 bp2_yearly.4011.d:0 "$bp2_yearly.4011.a$"
 bp2_yearly.4011.desc:0 "[Select_CString( famous_dead_parent.IsFemale, 'Minha', 'Meu' )] [famous_dead_parent.GetMotherFather], [Select_CString( famous_dead_parent.IsFemale, 'a', 'o' )] grande [famous_dead_parent.GetTitledFirstName], [famous_dead_parent.GetDeathReason] há muito tempo. No entanto, a chama da vida [famous_dead_parent.GetHerHim] ainda brilha intensamente. O que o cercava por toda parte agora parece me seguir.\n\nMuitos ainda me consideram seu(a) [ROOT.Char.Custom('GetDaughterSon')], em vez de uma [ROOT.Char.GetWomanMan] por direito próprio! Apenas ontem, um velho camponês estava elogiando [famous_dead_parent.GetSheHe] como se [famous_dead_parent.GetSheHe] ainda estivesse vivo!\n\nChegou a hora de sair da sombra [famous_dead_parent.GetHerHim]! De deixar minha marca no mundo! De ser reconhecido como o grande [ROOT.Char.GetTitledFirstName]!"
 bp2_yearly.4011.t:0 "Sombra da Fama: Aurora"
 bp2_yearly.4012.a:0 "Ainda há muito para eu alcançar."
 bp2_yearly.4012.b:0 "Ah, por que se preocupar. Vou viver para sempre na sombra de [famous_dead_parent.GetFirstNameNoTooltip]."
 bp2_yearly.4012.c:0 "Somos iguais agora, [famous_dead_parent.GetMotherFather|U]."
 bp2_yearly.4012.d:0 "Nunca é o suficiente! Nunca!"
 bp2_yearly.4012.desc:0 "Muito tempo se passou desde que decidi focar em emular a fama [Select_CString( famous_dead_parent.IsFemale, 'da minha', 'do meu' )] [famous_dead_parent.GetMotherFather], já faz ainda mais tempo desde a morte [famous_dead_parent.GetHerHim]. É estressante e exigente sair de sua sombra. Ainda sinto o mundo me julgando não apenas por minhas ações, mas sempre em comparação com [famous_dead_parent.GetTitledFirstName].\n\nEu sei que sou respeitado, mas será o suficiente? O que mais posso fazer para ser lembrado? Para ser mais do que [Select_CString( famous_dead_parent.IsFemale, 'minha', 'meu' )] [famous_dead_parent.GetMotherFather] jamais foi!"
 bp2_yearly.4012.t:0 "Sombra da Fama: Claridade"
 bp2_yearly.4013.a:0 "Eu falhei com você [famous_dead_parent.GetFirstNameNoTooltip] e falhei comigo mesmo."
 bp2_yearly.4013.b:0 "[ROOT.Char.Custom('PrestigeLevelText')] [ROOT.Char.GetFirstNameNoTooltip]. Gosto desse som."
 bp2_yearly.4013.c:0 "Não descansarei até que meu nome seja conhecido em toda a Terra!"
 bp2_yearly.4013.desc_failure:0 "Hoje acordei com um pensamento avassalador: Apesar de anos de esforços, minhas realizações de vida ainda empalidecem em comparação com [Select_CString( famous_dead_parent.IsFemale, 'minha', 'meu' )] grande [famous_dead_parent.GetMotherFather], [famous_dead_parent.GetTitledFirstName]. Eu me esforcei, mas ainda não consegui escapar da longa sombra de sua fama.\n\nIsso é uma maldição que tod[Select_CString( famous_dead_parent.IsFemale, 'a', 'o' )] [famous_dead_parent.GetMotherFather] traz sobre seus filhos? Será que todos nós nascemos para uma corrida fútil contra os gigantes do passado?"
 bp2_yearly.4013.desc_success:0 "Hoje acordei certa pela primeira vez em minha vida: Minha fama parece não ter limites e eu não sou mais apenas a [ROOT.Char.Custom('GetDaughterSon')] de [famous_dead_parent.GetTitledFirstName]. Posso desfrutar do meu próprio brilho, finalmente livre da sombra [Select_CString( famous_dead_parent.IsFemale, 'da', 'do' )] [famous_dead_parent.GetMotherFather].\n\nSerá hora de pausar minha busca incessante por reconhecimento? Ou devo queimar e brilhar ainda mais até que todas as crianças pronunciem meu nome, até mesmo gerações no futuro?"
 bp2_yearly.4013.t:0 "Sombra da Fama: Zenith"
 bp2_yearly.4020.b.flavor:0 "Serei virtuoso, servirei [ROOT.Char.GetFaith.HighGodName], não importa o custo."
 bp2_yearly.4020.b:0 "Um dia serei como você, [pious_parent.GetFirstNameNoTooltip]!"
 bp2_yearly.4020.c.flavor:0 "E estou contente em viver na sombra [pious_parent.GetHerHim]."
 bp2_yearly.4020.c:0 "Estou feliz por ter um[Select_CString( pious_parent.IsFemale, 'a', '' )] [pious_parent.GetMotherFather] tão piedoso!"
 bp2_yearly.4020.desc:0 "Que alegria é ser um[Select_CString( ROOT.Char.IsFemale, 'a', '' )] [ROOT.Char.Custom('GetDaughterSon')] de um exemplar servidor de [ROOT.Char.GetFaith.HighGodName]! A devoção que sinto em meu coração quando todos se referem a [pious_parent.GetSheHe] como [ROOT.Char.Custom('ParentPietyLevelText')] [pious_parent.GetTitledFirstName]! Sua virtude é reverenciada pelos [ROOT.Char.GetFaith.PriestNeuterPlural] e pelos devotos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] igualmente.\n\nEu me pergunto, devo humildemente permanecer na sombra [Select_CString( pious_parent.IsFemale, 'da minha', 'do meu' )] [pious_parent.GetMotherFather]? Ou alcançarei e ultrapassarei tal piedade em minha própria vida? A boa graça de [ROOT.Char.GetFaith.HighGodName] será tão visível em mim quanto é n[pious_parent.GetSheHe]?"
 bp2_yearly.4020.t:0 "Sombra da Fé: Crepúsculo"
 bp2_yearly.4021.a:0 "[ROOT.Char.GetFaith.HighGodName] me verá como eu sou!"
 bp2_yearly.4021.b:0 "Ai de mim, honrarei a memória de [pious_dead_parent.GetFirstNameNoTooltip] e [ROOT.Char.GetFaith.HighGodName] ficando em sua sombra."
 bp2_yearly.4021.c:0 "Já alcancei o suficiente."
 bp2_yearly.4021.d:0 "[ROOT.Char.GetFaith.HighGodName] conhecerá [pious_dead_parent.GetFirstNameNoTooltip] como #EMP [Select_CString( pious_dead_parent.IsFemale, 'minha', 'meu' )]#! [pious_dead_parent.GetMotherFather]!"
 bp2_yearly.4021.desc:0 "Anos se passaram desde a morte [Select_CString( pious_dead_parent.IsFemale, 'da minha', 'do meu' )] grande [pious_dead_parent.GetMotherFather], [pious_dead_parent.GetTitledFirstName] [pious_dead_parent.GetDeathReason]. Espero que [pious_dead_parent.GetSheHe] esteja servindo [ROOT.Char.GetFaith.HighGodName] no [ROOT.Char.GetFaith.PositiveAfterLife|U] agora. No entanto, o espírito da fé [pious_dead_parent.GetHerHim] ainda está presente entre os vivos, tanto como inspiração quanto como desafio. Ainda sou considerado seu(a) [ROOT.Char.Custom('GetDaughterSon')] pelos piedosos [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip]. Apenas ontem, um velho [ROOT.Char.GetFaith.PriestNeuter] estava elogiando [pious_dead_parent.GetSheHe] como o governante atual!\n\nEu me pergunto se [ROOT.Char.GetFaith.HighGodName] sente o mesmo por mim? Sinto a necessidade ardente de provar a mim mesmo como [ROOT.Char.GetWomanMan] de fé por direito próprio, de sair da sombra [Select_CString( pious_dead_parent.IsFemale, 'da minha', 'do meu' )] [pious_dead_parent.GetMotherFather]!"
 bp2_yearly.4021.t:0 "Sombra da Fé: Aurora"
 bp2_yearly.4022.a:0 "Ainda há muito para eu alcançar."
 bp2_yearly.4022.b:0 "Ah, por que se preocupar. Espero que [ROOT.Char.GetFaith.HighGodName] seja indulgente."
 bp2_yearly.4022.c:0 "Somos iguais agora, [pious_dead_parent.GetMotherFather|U]."
 bp2_yearly.4022.d:0 "Nunca é o suficiente! Nunca!"
 bp2_yearly.4022.desc:0 "A luz de [ROOT.Char.GetFaith.HighGodName] me guia em minha busca sagrada, como já guiou [Select_CString( pious_dead_parent.IsFemale, 'minha', 'meu' )] [pious_dead_parent.GetMotherFather], o grande [pious_dead_parent.GetTitledFirstName]. A vida do servo piedoso de [ROOT.Char.GetFaith.HighGodName] não é fácil, mas sinto a necessidade de me tornar ainda maior do que [Select_CString( pious_dead_parent.IsFemale, 'minha', 'meu' )] [pious_dead_parent.GetMotherFather].\n\nDeve um bom [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] sempre buscar incansavelmente o reconhecimento de seus pares e de [ROOT.Char.GetFaith.HighGodName]? O exemplo de um[Select_CString( pious_dead_parent.IsFemale, 'a', '' )] [pious_dead_parent.GetMotherFather] é um farol a ser seguido ou um objetivo a ser alcançado e superado?"
 bp2_yearly.4022.t:0 "Sombra da Fé: Claridade"
 bp2_yearly.4023.a:0 "Eu falhei com você! [ROOT.Char.GetFaith.HighGodName], por favor, me perdoe."
 bp2_yearly.4023.b:0 "[ROOT.Char.Custom('PietyLevelText')] [ROOT.Char.GetFirstNameNoTooltip]. Gosto desse som."
 bp2_yearly.4023.c:0 "[ROOT.Char.GetFaith.PositiveAfterLife|U] e a Terra sempre conhecerão meu nome!"
 bp2_yearly.4023.desc_failure:0 "Hoje acordei com um pensamento avassalador: Eu me esforcei por anos para ser o mais piedoso possível. No entanto, ainda sinto que a luz de [ROOT.Char.GetFaith.HighGodName] é obscurecida pela memória [Select_CString( pious_dead_parent.IsFemale, 'da minha', 'do meu' )] [pious_dead_parent.GetMotherFather], o grande [pious_dead_parent.GetTitledFirstName]. Isso é a vontade de [ROOT.Char.GetFaith.FateGodNamePossessive]?\n\nIsso é uma maldição que todo pai traz para seus filhos? Será que todos nós nascemos em uma corrida fútil contra os gigantes do passado? Será este o mundo que [ROOT.Char.GetFaith.CreatorName] pretendia?"
 bp2_yearly.4023.desc_success:0 "[ROOT.Char.GetFaith.FateGodNamePossessive|U], seja louvado! Hoje acordei certo pela primeira vez em minha vida: Eu provei sem sombra de dúvida ser um [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] exemplar, não apenas [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.Custom('GetDaughterSon')] de [pious_dead_parent.GetTitledFirstName]. Eu desfruto da luz de [ROOT.Char.GetFaith.HighGodName]. Não estou mais na sombra [Select_CString( pious_dead_parent.IsFemale, 'da minha', 'do meu' )] [pious_dead_parent.GetMotherFather].\n\nSerá hora de focar mais nos assuntos terrenos e ter a certeza de que estou na graça de [ROOT.Char.GetFaith.HighGodName]? Ou um bom [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] nunca deve se cansar, nunca deve parar na busca sagrada pelo reconhecimento de [ROOT.Char.GetFaith.HighGodName]?"
 bp2_yearly.4023.t:0 "Sombra da Fé: Zenith"
 bp2_yearly.4030.a:0 "E com o sol, a vitória!"
 bp2_yearly.4030.b.flavor:0 "Ouçam, guerreiros de [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]! Assim como a noite é longa, o sol virá! E com ele, a vitória! Voltaremos com glória eterna e a certeza de que nenhuma dificuldade pode nos deter!"
 bp2_yearly.4030.b:0 "\"Quem é [frosty_knight.GetSheHe] para desejar isso? Meu $knight_culture_player_no_tooltip$, [frosty_knight.GetFirstNameNoTooltip]?\""
 bp2_yearly.4030.c.tt:0 "Fortaleça-se com o inverno rigoroso"
 bp2_yearly.4030.c:0 "Outro inverno rigoroso? Bom treino para o próximo!"
 bp2_yearly.4030.desc:0 "\"N-nós temos marchado por estas terras congeladas por [frosty_knight.GetFaith.CreatorName], só Deus sabe por quanto tempo! Todos aqueles homens em [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] que não fazem nada e dormem em suas camas quentes!\" meu $knight_culture_player_no_tooltip$ [frosty_knight.GetFirstName] reclama, tremendo de frio. Por quanto tempo realmente? Os dias têm sido curtos e escuros, sem respiro do sol acima.\n\nEu fecho os olhos. O sol! Sou atingido pela memória do primeiro raio de sol de um longo inverno, de um inverno que parecia durar toda a minha vida. A memória de infância se espalha como água quente em minhas veias, oferecendo conforto e consolo. Sol e primavera vieram então.\n\nE eles virão agora!"
 bp2_yearly.4030.t:0 "Em uma Noite de Neve"
 bp2_yearly.4031.a.ct:0 "Tentativas de fuga são mais propensas a ter sucesso, embora falhas se tornem mais perigosas..."
 bp2_yearly.4031.a.flavor:0 "Quebre as correntes, maldita escuridão!"
 bp2_yearly.4031.a:0 "Nunca mais! Serei livre!"
 bp2_yearly.4031.b.flavor:0 "E eu vou aguentar agora."
 bp2_yearly.4031.b:0 "Paciência, [ROOT.Char.GetFirstNameNoTooltip]. Eu aguentei naquela época."
 bp2_yearly.4031.desc_base:0 "Agora é [Select_CString( new_imp.IsFemale, 'a', 'o' )] [new_imp.Custom2('InsultAdjective', ROOT.Char)] [new_imp.GetTitledFirstName] que me mantém cativ[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )].\n\nSerá o destino que me trouxe aqui mais uma vez? Será que até as correntes são as mesmas? Minha liberdade foi apenas uma breve interrupção na minha cativeiro?"
 bp2_yearly.4031.desc_first:0 "Mais uma vez em minha vida estou desprovid[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] de meu livre arbítrio e lançad[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] em algemas. Fui criança uma vez, pres[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] pel[Select_CString( old_imp.IsFemale, 'a', 'o' )] [old_imp.Custom2('InsultAdjective', ROOT.Char)] [old_imp.GetTitledFirstName].\n\n"
 bp2_yearly.4031.desc_last:0 "Serei sempre sujeito ao capricho de outra pessoa?\n\nNão! Eu sobrevivi como criança e recuperei minha liberdade. O que me retém agora?"
 bp2_yearly.4031.desc_same_captor:0 "Agora, [old_imp.GetSheHe] me mantém cativ[Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] mais uma vez!\n\nAquel[Select_CString( old_imp.IsFemale, 'a', 'e' )] velh[Select_CString( old_imp.IsFemale, 'a', 'o' )] [old_imp.Custom2('InsultNoun', ROOT.Char)] teve a audácia de me conceder a #EMP cortesia#! da mesma cela! Foi apenas a má vontade [old_imp.GetHerHim] que me trouxe de volta? Talvez seja destino que minha liberdade tenha sido apenas uma breve interrupção na minha cativeiro?\n\n"
 bp2_yearly.4031.t:0 "Círculo de Cativeiro"
 bp2_yearly.4032.a.flavor:0 "Lembre-se dessas palavras. Todos [ROOT.Char.GetDynasty.GetNameNoTooltip] é chamado a servir um dia. Seu dia chegou hoje."
 bp2_yearly.4032.a:0 "[ROOT.Char.GetHouse.GetMotto], [Select_CString( hostage_kiddo.IsFemale, 'minha', 'meu' )] [hostage_kiddo.Custom('GetDaughterSon')]."
 bp2_yearly.4032.b:0 "Você voltará para casa um dia, assim como eu."
 bp2_yearly.4032.desc:0 "É hora de [hostage_kiddo.GetFirstName] partir. Olho nos olhos [hostage_kiddo.GetHerHim] e me vejo como uma criança quando fui enviado como refém para o [new_papa.GetTitledFirstName]. [tru_papa.GetTitledFirstName] estava olhando para mim na época. Que palavras foram ditas naquele dia, eu não me lembro. Que pensamentos [tru_papa.GetSheHe] teve quando eu parti?\n\nSerá que [hostage_kiddo.GetFirstNameNoTooltip] enviará seus filhos como reféns no futuro? O que posso oferecer a [hostage_kiddo.GetSheHe] neste último momento?"
 bp2_yearly.4032.t:0 "Reféns Passados e Presentes"
 childhood_prison_endure:0 "Roda do Destino: Aguentar"
 childhood_prison_endure_desc:0 "Este personagem suporta silenciosamente seu destino de aprisionamento recorrente."
 childhood_prison_escape:0 "Roda do Destino: Fuga"
 childhood_prison_escape_desc:0 "Este personagem está muito determinado a escapar de seu aprisionamento e provavelmente terá sucesso, ou perecerá tentando."
 delayed_justice_piety:0 "Justiça Adiada: Convicções Pessoais"
 delayed_justice_piety_desc:0 "Este personagem lidou com o assassino de um parente de acordo com suas convicções."
 delayed_justive_stress:0 "Justiça Adiada: Princípios da Fé"
 delayed_justive_stress_desc:0 "Este personagem lidou com o assassino de um parente de acordo com os princípios de sua fé."
 drinking_binge:0 "Bebida Excessiva"
 drinking_stop:0 "Abstinência Abrupta"
 drinking_stop_desc:0 "Este personagem parou abruptamente de beber."
 famed_parent_became_very_famous:0 "Pai Famoso"
 famed_parent_became_very_famous_3_desc:0 "M[Select_CString( famed_parent.IsFemale, 'inha', 'eu' )] [famed_parent.GetMotherFather], [famed_parent.GetFirstNameNoTooltip], tornou-se $PRESTIGE_LEVEL_LABEL_3$"
 famed_parent_became_very_famous_3_desc_second_perspective:0 "s[Select_CString( famed_parent.IsFemale, 'ua', 'eu' )] [famed_parent.GetMotherFather], [famed_parent.GetFirstNameNoTooltip], tornou-se $PRESTIGE_LEVEL_LABEL_3$"
 famed_parent_became_very_famous_3_desc_third_perspective:0 "[Select_CString( famed_parent.IsFemale, 'a', 'o' )] [famed_parent.GetMotherFather] de [owner.GetTitledFirstName], [famed_parent.GetFirstNameNoTooltip], tornou-se $PRESTIGE_LEVEL_LABEL_3$"
