l_spanish:
 pet_rock.0001.a.tt:0 "Suas aventuras juntos começam!"
 pet_rock.0001.a:0 "Seremos melhores amigos!"
 pet_rock.0001.b.tt:0 "Deveria passar menos tempo lá fora..."
 pet_rock.0001.b:0 "O que eu estou pensando?"
 pet_rock.0001.desc:0 "#EMP Plink!#! \n\nEstou caminhando do lado de fora quando meu sapato colide com uma pequena pedra. O seixo faz um som brilhante ao bater em alguns de seus companheiros, parando a uma curta distância de mim. Movido por uma curiosidade repentina, eu o pego. Sua superfície rugosa parece estranhamente quente.\n\nDe repente, eu sei exatamente o que ele quer. A pedra está projetando uma aura #EMP amigável#!. Quando olho para ela, aninhada na palma da minha mão, seu peso parece reconfortante e emocionante ao mesmo tempo."
 pet_rock.0001.t:0 "Pedras no Caminho"
 pet_rock.0002.a:0 "Que ótimo nome!"
 pet_rock.0002.desc:0 "Enquanto a pedra repousa em meu colo, sentada ali contente, pondero o que devo chamar [ROOT.Char.Custom('RockStorySheHe')]. Algo histórico? Algo aludindo à sua forma? Algo que descreva a sensação suave que sinto quando acaricio a sua exterior [ROOT.Char.Custom('RockColor')]?\n\nAh, eu sei! Vou chamá-la de..."
 pet_rock.0002.t:0 "Uma Pedra"
 pet_rock.0100.a:0 "Acho que posso aguentar isso um pouco mais."
 pet_rock.0100.desc:0 "Depois de mais um dia estressante, me jogo em uma cadeira no meu [ROOT.Char.Custom('GetChamber')] – por quanto tempo conseguirei manter isso?\n\nQuando movo meu pé, ouço um pequeno barulho, e encontro minha pedra de estimação [ROOT.Char.Custom('RockStoryName')] ao lado do meu assento. Sento-me com [ROOT.Char.Custom('RockStorySheHe')] por um tempo, apenas ouvindo o silêncio relaxante e acariciando o exterior [ROOT.Char.Custom('RockColor')] [ROOT.Char.Custom('RockStoryHerHim')]."
 pet_rock.0100.t:0 "[ROOT.Char.Custom('RockStoryName')]: Valor Sedimentar"
 pet_rock.0101.a:0 "Tudo bem, tudo bem, vamos te polir."
 pet_rock.0101.b:0 "Você vai ter que se contentar."
 pet_rock.0101.desc:0 "Na borda da minha mesa, minha pedra [ROOT.Char.Custom('RockStoryName')] está sentada com um ar de tristeza. Olho para [ROOT.Char.Custom('RockStorySheHe')]. É claro que [ROOT.Char.Custom('RockStorySheHe')] está emburrada.\n\nAmbos sabemos que [ROOT.Char.Custom('RockStorySheHe')] quer um polimento, para deixar aquela bela exterior [ROOT.Char.Custom('RockColor')] brilhando. É só que o polimento favorito [ROOT.Char.Custom('RockStoryHerHim')] é tão #EMP caro#!..."
 pet_rock.0101.t:0 "[ROOT.Char.Custom('RockStoryName')]: Um Brilho de Espelho"
 pet_rock.0102.a:0 "A reunião pode esperar!"
 pet_rock.0102.b:0 "Outro dia, [ROOT.Char.Custom('RockStoryName')]."
 pet_rock.0102.desc:0 "A cor vibrante normalmente presente no exterior de [ROOT.Char.Custom('RockStoryName')] está um tanto apagada hoje. [ROOT.Char.Custom('RockStorySheHe')|U] está sentada em seu lugar habitual, me olhando de forma acusadora, implorando por um banho.\n\nEu #EMP realmente#! tenho uma audiência importante hoje, não tenho? Essa vai ser uma explicação difícil..."
 pet_rock.0102.t:0 "[ROOT.Char.Custom('RockStoryName')]: Muito Limpo"
 pet_rock.0103.a:0 "Vamos ver se consigo roubar algumas folhas para [ROOT.Char.Custom('RockStorySheHe')]..."
 pet_rock.0103.b:0 "É melhor eu não."
 pet_rock.0103.desc:0 "Outro prato cheio de comida é colocado à minha frente, meu estômago praticamente gemendo sob o peso das porções anteriores. Um cheiro maravilhoso atinge meu nariz: hortelã!\n\nAssim que sinto o aroma, penso na minha pedra [ROOT.Char.Custom('RockStoryName')]. Hortelã é o cheiro favorito [ROOT.Char.Custom('RockStoryHerHim')].\n\nEu posso praticamente #EMP sentir#! a presença implorante [ROOT.Char.Custom('RockStoryHerHim')] irradiando de sua posição na minha bolsa."
 pet_rock.0103.t:0 "[ROOT.Char.Custom('RockStoryName')]: Sustento Sorrateiro"
 pet_rock.0104.a:0 "Bem, há uma lá fora que parece ser #EMP parecida#!..."
 pet_rock.0104.b.failure.tt:0 "Seu amigo se foi para sempre."
 pet_rock.0104.b.failure:0 "...[ROOT.Char.Custom('RockStoryName')]?"
 pet_rock.0104.b.success:0 "Você encontra [ROOT.Char.Custom('RockStorySheHe')] em um baú."
 pet_rock.0104.b:0 " #EMP [ROOT.Char.Custom('RockStoryName')]!#! Onde está [ROOT.Char.Custom('RockStorySheHe')]?"
 pet_rock.0104.c.tt:0 "Suponho que [ROOT.Char.Custom('RockStorySheHe')] tenha seguido em frente..."
 pet_rock.0104.c:0 "Talvez [ROOT.Char.Custom('RockStorySheHe')] tenha ido visitar um amigo?"
 pet_rock.0104.desc:0 "Refletindo, caminho pelo [ROOT.Char.Custom('GetRoom')]. Tantas provações e tribulações se acumulam para um [ROOT.Char.GetTitleAsNameNoTooltip]! Talvez minha pedra [ROOT.Char.Custom('RockStoryName')] tenha algum bom conselho?\n\nDou um tapinha na minha bolsa, o lugar habitual [ROOT.Char.Custom('RockStoryHerHim')]. Nada. De repente, sinto-me perdido sem a orientação calma [ROOT.Char.Custom('RockStoryHerHim')].\n\nO pânico começa a se instalar."
 pet_rock.0104.t:0 "[ROOT.Char.Custom('RockStoryName')]: Fundo do Poço"
 pet_rock.0105.a:0 "Que pedra com aparência estúpida."
 pet_rock.0105.b:0 "Tenho certeza de que eles vão se dar maravilhosamente bem!"
 pet_rock.0105.c:0 "Desculpe, [ROOT.Char.Custom('RockStoryName')] é um pouco tímida."
 pet_rock.0105.desc:0 "Estou conversando com minha pedra [ROOT.Char.Custom('RockStoryName')] do lado de fora, refletindo sobre nosso primeiro encontro, quando um grito feliz chega aos meus ouvidos. [other_rock_owner.GetFirstName] está se aproximando segurando... isso é uma-\n\n'Estou tão feliz em ver que você também tem um companheiro de pedra, [ROOT.Char.Custom('FormOfAddressForLiege')]!' [other_rock_owner.GetFirstName] estende a mão, mostrando sua própria pedra. 'Talvez eles possam ser amigos?'"
 pet_rock.0105.t:0 "[ROOT.Char.Custom('RockStoryName')]: Prazer em Conhecer Você"
 pet_rock.0106.a:0 "Hah! Seu pequeno tolo!"
 pet_rock.0106.desc:0 "Estou na minha mesa, lendo algumas cartas e relatórios. [ROOT.Char.Custom('RockStoryName')] está ao meu lado, aproveitando o calor de um raio de sol.\n\nEstendo a mão para acariciar o exterior [ROOT.Char.Custom('RockColor')] [ROOT.Char.Custom('RockStoryHerHim')], mas parece que [ROOT.Char.Custom('RockStorySheHe')] está de muito bom humor. Quando alcanço, a mesa balança, e [ROOT.Char.Custom('RockStoryName')] se joga para fora dela!"
 pet_rock.0106.t:0 "[ROOT.Char.Custom('RockStoryName')]: Thunk!"
 pet_rock.0107.a:0 "[ROOT.Char.Custom('RockStoryName')] pode ficar comigo na minha cama!"
 pet_rock.0107.b.failure:0 "Você bate o polegar"
 pet_rock.0107.b.success:0 "Você constrói um abrigo satisfatório"
 pet_rock.0107.b:0 "Vou tentar, por que não?"
 pet_rock.0107.c:0 "Acho que [ROOT.Char.Custom('RockStorySheHe')] é do tipo que gosta do ar livre."
 pet_rock.0107.desc:0 "Enquanto levo [ROOT.Char.Custom('RockStoryName')] para meus aposentos, com o exterior [ROOT.Char.Custom('RockColor')] aconchegado felizmente na minha mão, considero se [ROOT.Char.Custom('RockStorySheHe')] está com ciúmes de mim. Afinal, tenho um [ROOT.Char.Custom('ResidenceBuilding')] inteiro para chamar de meu, decorar como eu quiser, e abrigar meus amigos e família.\n\n[ROOT.Char.Custom('RockStoryName')] não tem. Talvez, então, seja hora de remediar isso?\n\nOlho para [ROOT.Char.Custom('RockStorySheHe')] e pondero."
 pet_rock.0107.t:0 "[ROOT.Char.Custom('RockStoryName')]: Transformado em Granito"
 pet_rock.0108.a.adventurer:0 "É hora de deixar ir."
 pet_rock.0108.a.tt:0 "Suas aventuras com a sua pedra chegam ao fim."
 pet_rock.0108.a:0 "Não posso pensar em uma honra maior!"
 pet_rock.0108.adventurer:0 "feliz nesse novo lar? Talvez até possamos encontrar novos amigos para apresentar a [ROOT.Char.Custom('RockStorySheHe')] na próxima vez que retornarmos..."
 pet_rock.0108.b.tt:0 "[ROOT.Char.Custom('RockStorySheHe')|U] viajará comigo, sempre."
 pet_rock.0108.b:0 "Nunca poderia deixar [ROOT.Char.Custom('RockStorySheHe')] ir!"
 pet_rock.0108.desc:0 "Há um ponto curioso nesta parede, penso, enquanto [ROOT.Char.Custom('RockStoryName')] está aninhado na palma da minha mão. A parede fora do meu [ROOT.Char.Custom('ResidenceBuilding')] está com um pedaço faltando.\n\nPosso sentir a curiosidade de [ROOT.Char.Custom('RockStoryName')] na minha mão. Ergo [ROOT.Char.Custom('RockStorySheHe')] para ver e, por impulso, coloco [ROOT.Char.Custom('RockStorySheHe')] diretamente no buraco. Como eu suspeitava, [ROOT.Char.Custom('RockStorySheHe')] encaixa perfeitamente.\n\nA ideia me ocorre: talvez fosse melhor para mim e [ROOT.Char.Custom('RockStorySheHe')] se [ROOT.Char.Custom('RockStorySheHe')] ficasse aqui,"
 pet_rock.0108.landed:0 "como parte da minha casa e lar? Talvez até possamos encontrar novas e melhores maneiras de montar os amigos [ROOT.Char.Custom('RockStoryHerHim')] em construções próprias?"
 pet_rock.0108.t:0 "[ROOT.Char.Custom('RockStoryName')]: Tudo ou Nada?"
