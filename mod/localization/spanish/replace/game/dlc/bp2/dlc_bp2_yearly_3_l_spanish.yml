l_spanish:
 bp2_yearly.3000.a.tt:0 "Há uma chance de que sua educação tenha um resultado melhor"
 bp2_yearly.3000.a:0 "O conhecimento é a chave do universo!"
 bp2_yearly.3000.b:0 "Um pouco de esforço não pode machucar."
 bp2_yearly.3000.c:0 "Por que estudar quando se pode #EMP brincar#!?"
 bp2_yearly.3000.desc:0 "A voz de [educator.Custom2('MyCharacterIntroduction', ROOT.Char)] continua interminável enquanto [educador.GetSheHe] me dá mais uma palestra sobre as maneiras adequadas de [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.GetLadyLord], intercaladas com citações austeras do [educador.GetFaith.ReligiousText|U]."
 bp2_yearly.3000.desc_ending:0 "\n\nCertamente, tudo isso é muito importante para o meu futuro, mas... Alguém realmente notaria se eu saísse uma vez — ou talvez duas vezes — para brincar?"
 bp2_yearly.3000.desc_no_educator:0 "Enquanto viro outra página, olho com tristeza para as outras crianças da [ROOT.Char.Custom('GetCourt')] brincando do lado de fora. O riso, os gritos alegres... Olho de volta para a cópia de [ROOT.Char.GetFaith.ReligiousText|U] que está sobre a mesa."
 bp2_yearly.3000.t:0 "Qual é o Valor de um Dia de Estudo?"
 bp2_yearly.3010.a.tt:0 "[child.GetFirstNameNoTooltip] abraçou a diversidade [child.GetHerHim]"
 bp2_yearly.3010.a:0 "Preciso conversar com [child.GetSheHe]."
 bp2_yearly.3010.b.tt:0 "[child.GetFirstNameNoTooltip] se apegou às suas origens"
 bp2_yearly.3010.b:0 "[child.GetSheHe|U] superará isso."
 bp2_yearly.3010.desc:0 "Meu coração se aperta ao ver [Select_CString( child.IsFemale, 'minha amada', 'meu amado' )] [child.Custom('GetDaughterSon')], [child.GetFirstName], olhando fixamente ao redor, mais uma vez confuso e sem reconhecer nada.\n\n[child.GetSheHe|U] deu seus primeiros passos nestes mesmos aposentos, mas isso foi há muito tempo. Os muitos anos passados como refém no exterior devem ter apagado as memórias da mente jovem [child.GetHerHim].\n\nMais uma vez, [child.GetSheHe] olha ao redor e suspira."
 bp2_yearly.3010.t:0 "[child.GetSheHe|U] Conhece Este Quarto"
 bp2_yearly.3011.a:0 "Agora sou um estranho."
 bp2_yearly.3011.b:0 "Eu ainda pertenço aqui!"
 bp2_yearly.3011.desc:0 "Em algum canto da minha mente, eu #EMP sei#! que já estive aqui antes, mas as memórias são mais nebulosas que sonhos, e sonhos de casa já me enganaram antes. Após tantos anos passados como refém no exterior, é difícil até distinguir o que é #EMP casa#! e o que não é...\n\nSerá que esta lareira sempre esteve aqui? Este corredor sempre foi tão escuro? Eu simplesmente não sei."
 bp2_yearly.3011.desc_no_parent:0 "\n\nQuando encontro os olhos [Select_CString( parent.IsFemale, 'da minha', 'do meu' )] [parent.GetMotherFather] através da sala, [parent.GetSheHe] apenas suspira e desvia o olhar."
 bp2_yearly.3011.desc_parent:0 "\n\nQuando encontro os olhos [Select_CString( parent.IsFemale, 'da minha', 'do meu' )] [parent.GetMotherFather] através da sala, vejo minha própria tristeza refletida nos olhos [parent.GetHerHim], e nos abraçamos apertadamente."
 bp2_yearly.3011.t:0 "Eu Já Passei Por Este Chão"
