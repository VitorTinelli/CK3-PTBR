 bp2_hostage_system.0401.imprisoned_fail:0 "\n\nUma maneira ultrajante de tratar um[Select_CString( hostage.IsFemale, 'a', '' )] refém, com certeza, mas o retorno seguro de [hostage.GetFirstNamePossessiveNoTooltip] é uma bênção."
