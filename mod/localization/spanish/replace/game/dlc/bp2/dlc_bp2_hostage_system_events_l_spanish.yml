 bp2_hostage_system.0401.imprisoned_hostage_fail:0 "Descobri que [Select_CString( hostage.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], escapou por pouco de ser aprisionado pel[Select_CString( imprisoner.IsFemale, 'a', 'o' )] guardiã[Select_CString( imprisoner.IsFemale, '', 'o' )] [imprisoner.GetTitledFirstName]!"
 bp2_hostage_system.0401.imprisoned_hostage_self:0 "Descobri que [Select_CString( hostage.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], foi escandalosamente aprisionado por [warden.GetTitledFirstName], que prometeu cuidar [warden.GetHerHim] como refém."
 bp2_hostage_system.0401.landed_hostage:0 "Com [Select_CString( hostage.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstNamePossessive], herdeiro de [hostage.GetPrimaryTitle.GetNameNoTierNoTooltip], [warden.GetTitledFirstName] agora se encontra cuidando de um[Select_CString( hostage.IsFemale, 'a', '' )] [hostage.GetTitleAsNameNoTooltip]!"
 bp2_hostage_system.0401.ruler_hostage:0 "Com [Select_CString( hostage.IsFemale, 'minha', 'meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], agora no comando de um(a) [hostage.GetDomicile.GetType.GetName|l] próprio(a), [warden.GetTitledFirstName] se vê cuidando de um[Select_CString( hostage.IsFemale, 'a', '' )] [hostage.GetTitleAsNameNoTooltip]!"
 bp2_hostage_system.0401.unlanded_home_court:0 "Com a perda de minhas terras, meu pacto com [warden.GetTitledFirstName], [Select_CString( warden.IsFemale, 'a', 'o' )] [hostage.Custom2('RelationToMe', SCOPE.sC('warden'))] de [Select_CString( hostage.IsFemale, 'minha', 'meu' )] refém, [hostage.GetFirstName], perde de repente seu propósito."
