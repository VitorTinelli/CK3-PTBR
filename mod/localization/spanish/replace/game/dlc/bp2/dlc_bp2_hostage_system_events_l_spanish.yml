l_spanish:
 bp2_hostage_system.0100.a:0 "Eu tomei minha decisão."
 bp2_hostage_system.0100.b:0 "[hostage.GetFirstNameNoTooltip] está segur[Select_CString( hostage.IsFemale, 'a', 'o' )], por enquanto."
 bp2_hostage_system.0100.desc:0 "Qualquer dano que eu possa infligir aos vis [hostage_home_court.GetPrimaryTitle.GetAdjectiveNoTooltip] é útil, e [hostage_home_court.GetFirstNameNoTooltip] só tem [hostage_home_court.GetHerselfHimself] para culpar."
 bp2_hostage_system.0100.executed_hostage:0 "[Select_CString( hostage_home_court.IsFemale, 'Aquela vilã', 'Aquele vilão' )] executou m[Select_CString( victim.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('victim'))], [victim.GetFirstName]. A justiça exige que eu seja implacável..."
 bp2_hostage_system.0100.intro:0 "Com minha [war.Custom('WarCasusBelliShort')] agora em andamento, o destino de meu refém, [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] d[Select_CString( hostage_home_court.IsFemale, 'a', 'o' )] [hostage_home_court.GetTitledFirstNamePossessive], [hostage.GetFirstName], ainda está por ser decidido.\n\n"
 bp2_hostage_system.0100.my_hostage:0 "\n\nMas e quanto [Select_CString( my_hostage.IsFemale, 'a minha', 'ao meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName] — [my_hostage.GetSheHe] está à mercê de [hostage_home_court.GetTitledFirstNamePossessiveNoTooltip]..."
 bp2_hostage_system.0100.spared_hostage:0 "[hostage_home_court.GetFirstNameNoTooltip] mostrou clemência ao m[Select_CString( my_hostage.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName]. Talvez deixar nossas disputas para os campos de batalha seja justificado..."
 bp2_hostage_system.0100.t:0 "A Qualquer Custo"
 bp2_hostage_system.0110.a:0 "[hostage_home_court.GetFirstNameNoTooltip] fez a escolha del[Select_CString( hostage_home_court.IsFemale, 'a', 'e' )]."
 bp2_hostage_system.0110.b:0 "Vamos não ser precipitados..."
 bp2_hostage_system.0110.desc:0 "Apesar de enviar s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], à minha corte, [hostage_home_court.GetTitledFirstName], [Select_CString( hostage_home_court.IsFemale, 'a', 'o' )] [hostage_home_court.Custom2('InsultNoun', ROOT.Char)] traiçoeir[Select_CString( hostage_home_court.IsFemale, 'a', 'o' )] declara guerra contra mim por parte de [hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip].\n\n[hostage_home_court.GetSheHe|U] deve me considerar fraco de coração, ou não ter consideração alguma pelo bem-estar de [hostage.GetFirstNamePossessiveNoTooltip], para declarar uma [war.Custom('WarCasusBelliShort')] contra o tutor [hostage_home_court.GetHerHim]..."
 bp2_hostage_system.0110.t:0 "Promessa Vazia"
 bp2_hostage_system.0120.a:0 "A situação mudou."
 bp2_hostage_system.0120.b:0 "Isso é entre [war_joiner_ally.GetFirstNameNoTooltip] e [hostage_home_court.GetFirstNameNoTooltip]..."
 bp2_hostage_system.0120.desc:0 "A paz com [hostage_home_court.GetPrimaryTitle.GetNameNoTierNoTooltip] era meu objetivo, mas não há mais nada a fazer. A misericórdia pode manter um grau de confiança, mas, então novamente, tudo é justo em tempos de guerra."
 bp2_hostage_system.0120.intro:0 "Eventos conspiram contra [Select_CString( hostage.IsFemale, 'minha refém', 'meu refém' )], [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))] de [hostage_home_court.GetTitledFirstNamePossessive], [hostage.GetFirstName]. Embora eu tenha levado [hostage.GetSheHe] para minha corte com intenções honrosas, tenho outras obrigações a cumprir na [war.Custom('WarCasusBelliShort')] de [war_joiner_ally.GetTitledFirstNamePossessive]...\n\n"
 bp2_hostage_system.0120.t:0 "O Inimigo do Meu Amigo"
 bp2_hostage_system.0130.a:0 "Não faço ameaças vazias."
 bp2_hostage_system.0130.b:0 "As coisas não são tão preto e branco."
 bp2_hostage_system.0130.desc:0 "Descobri que [hostage_home_court.GetTitledFirstName] tola e ingenuamente pega em armas ao lado do meu inimigo [war_joiner_ally.GetTitledFirstName], apesar de enviar s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], para ser meu refém.\n\nEssa mesquinha [war.Custom('WarCasusBelliShort')] deixou à mostra o valor das promessas de paz [hostage_home_court.GetHerHim], e, muito menos, o desprezo insensível [hostage_home_court.GetHerHim] por [hostage.GetFirstNameNoTooltip]."
 bp2_hostage_system.0130.t:0 "O Amigo do Meu Inimigo"
 bp2_hostage_system.0140.a.attacker:0 "Inimaginável..."
 bp2_hostage_system.0140.a.attacker_ally:0 "Como [executioner.GetSheHe] pôde..."
 bp2_hostage_system.0140.a.defender:0 "Você vai pagar..."
 bp2_hostage_system.0140.a.defender_ally:0 "Sem coração..."
 bp2_hostage_system.0140.attacker:0 "Sua miserável tentativa de me enganar com suas promessas de paz chega ao fim hoje. Que seu(a) [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], encontre mais paz em [executioner.GetFaith.PositiveAfterLife]."
 bp2_hostage_system.0140.attacker_ally:0 "Encontramos guerra graças a [war_joiner_ally.GetTitledFirstName], e, como tal, a vida do meu refém, s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], está perdida."
 bp2_hostage_system.0140.defender:0 "Sua invasão desonrosa, mesmo após enviar s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], como meu refém, só pode ter uma resposta. Que tanto [hostage.GetSheHe] quanto [executioner.GetFaith.HighGodName] te perdoem."
 bp2_hostage_system.0140.defender_ally:0 "Sua traição custou a vida de s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName]. Só espero que sua amizade com [war_joiner_ally.GetTitledFirstName] tenha valido a pena."
 bp2_hostage_system.0140.opening:0 "[executioner.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0141.a.attacker:0 "Obrigado, [ROOT.Char.GetFaith.HighGodName]..."
 bp2_hostage_system.0141.a.attacker_ally:0 "É um alívio..."
 bp2_hostage_system.0141.a.defender:0 "Talvez [hostage_sparer.GetSheHe] não seja tão mau assim..."
 bp2_hostage_system.0141.a.defender_ally:0 "É alguma coisa, pelo menos..."
 bp2_hostage_system.0141.attacker:0 "pois [hostage.GetSheHe] é apenas um peão inocente em seus jogos enganosos."
 bp2_hostage_system.0141.attacker_ally:0 "pois [hostage.GetSheHe] não precisa sofrer por conta de [war_joiner_ally.GetTitledFirstNamePossessive]."
 bp2_hostage_system.0141.defender:0 "apesar de seu ataque traiçoeiro em desrespeito aos nossos pactos."
 bp2_hostage_system.0141.defender_ally:0 "pois [hostage.GetSheHe] não precisa sofrer por conta de [war_joiner_ally.GetTitledFirstNamePossessive]."
 bp2_hostage_system.0141.intro:0 "Decidi poupar s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName],"
 bp2_hostage_system.0141.opening:0 "[hostage_sparer.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0141.request:0 "\n\nConfio em que você mostrará a mesma misericórdia [Select_CString( my_hostage.IsFemale, 'a minha', 'ao meu' )] [spared.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName]."
 bp2_hostage_system.0200.a:0 "Pegue suas coisas, é hora de ir para casa."
 bp2_hostage_system.0200.b.my_hostage:0 "Uma vez que [my_hostage.GetFirstNameNoTooltip] for devolvid[Select_CString( hostage.IsFemale, 'a', 'o' )], [hostage.GetFirstNameNoTooltip] será."
 bp2_hostage_system.0200.b:0 "[hostage.GetFirstNameNoTooltip] deve ficar um pouco mais."
 bp2_hostage_system.0200.closing:0 "\n\nNo entanto, devo olhar para os interesses de minha própria casa."
 bp2_hostage_system.0200.desc:0 "M[Select_CString( hostage.IsFemale, 'inha', 'eu' )] refém, [hostage.GetFirstName], agora é um[Select_CString( hostage.IsFemale, 'a', '' )] [hostage.GetWomanMan], e aguarda ansiosamente para ser enviad[Select_CString( hostage.IsFemale, 'a', 'o' )] para casa em breve, como é costume. S[Select_CString( hostage_home_court.IsFemale, 'ua', 'eu' )] [hostage.Custom2('RelationToMe', SCOPE.sC('hostage_home_court'))], [hostage_home_court.GetTitledFirstName], certamente estará esperando o mesmo."
 bp2_hostage_system.0200.my_hostage:0 "\n\nTalvez seja realmente melhor manter a boa vontade, pelo menos enquanto m[Select_CString( my_hostage.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName], permanece nas garras [hostage_home_court.GetPrimaryTitle.GetAdjectiveNoTooltip]..."
 bp2_hostage_system.0200.t:0 "Totalmente Crescido"
 bp2_hostage_system.0201.a:0 "Há tanto para colocar em dia!"
 bp2_hostage_system.0201.b:0 "[my_hostage.GetFirstNameNoTooltip] também pode ir."
 bp2_hostage_system.0201.c.adult:0 "Eu não acho que sim."
 bp2_hostage_system.0201.c:0 "Talvez quando [my_hostage.GetSheHe] for mais velh[Select_CString( my_hostage.IsFemale, 'a', 'o' )]."
 bp2_hostage_system.0201.desc:0 "M[Select_CString( hostage.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetTitledFirstName], enviado para ser um refém [hostage_warden.GetPrimaryTitle.GetAdjectiveNoTooltip], finalmente retornou como um[Select_CString( hostage.IsFemale, 'a', '' )] [hostage.GetWomanMan] adult[Select_CString( hostage.IsFemale, 'a', 'o' )]! O pacto com [hostage_warden.GetTitledFirstName] terminou, mas m[Select_CString( hostage.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('hostage'))] está segur[Select_CString( hostage.IsFemale, 'a', 'o' )]."
 bp2_hostage_system.0201.my_hostage:0 "\n\n[hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] d[Select_CString( my_hostage.IsFemale, 'a', 'o' )] [hostage_warden.GetFirstNamePossessiveNoTooltip], [my_hostage.GetFirstName], continua sendo m[Select_CString( my_hostage.IsFemale, 'inha', 'eu' )] refém, embora [my_hostage.GetSheHe] ainda seja apenas [Select_CString( my_hostage.IsFemale, 'uma', 'um' )] [my_hostage.Custom('GirlBoy')]."
 bp2_hostage_system.0201.my_hostage_adult:0 "\n\n[hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))] d[Select_CString( my_hostage.IsFemale, 'a', 'o' )] [hostage_warden.GetFirstNamePossessiveNoTooltip], [my_hostage.GetFirstName], continua sendo m[Select_CString( my_hostage.IsFemale, 'inha', 'eu' )] refém, embora um[Select_CString( my_hostage.IsFemale, 'a', '' )] [my_hostage.GetWomanMan] adult[Select_CString( my_hostage.IsFemale, 'a', 'o' )], e observa com certa inveja. Seria justo devolver [my_hostage.GetSheHe] também..."
 bp2_hostage_system.0202.a:0 "Deve haver uma boa razão."
 bp2_hostage_system.0202.desc:0 "Aguardei com esperanças conforme o aniversário [Select_CString( hostage.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstNamePossessive], se aproximava, sendo o costume que os reféns sejam enviados para casa quando não são mais crianças.\n\nPorém, parece que o plano de [hostage_warden.GetTitledFirstNamePossessive] é manter [hostage.GetFirstNameNoTooltip] em [hostage_warden.GetCapitalLocation.GetNameNoTooltip] por um pouco mais de tempo...\n\n"
 bp2_hostage_system.0202.t:0 "Aguardado Retorno"
 bp2_hostage_system.0203.closing:0 "A resposta foi rápida, no entanto, e logo [my_hostage.GetFirstName], m[Select_CString( my_hostage.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], estava em meus portões!"
 bp2_hostage_system.0203.desc:0 "Aguardei com alguma apreensão a resposta de [hostage_home_court.GetTitledFirstNamePossessive], depois de enviar s[Select_CString( hostage.IsFemale, 'ua', 'eu' )] [hostage_home_court.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], em seu caminho.\n\n"
 bp2_hostage_system.0203.t:0 "De Volta ao Lar"
 bp2_hostage_system.0204.a:0 "[Select_CString( my_hostage.IsFemale, 'Coitada da', 'Coitado do' )] [my_hostage.Custom('GirlBoy')]..."
 bp2_hostage_system.0204.closing:0 "A resposta foi clara; [hostage_home_court.GetTitledFirstName] deve manter m[Select_CString( my_hostage.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName], por um futuro previsível, para garantir a paz contínua..."
 bp2_hostage_system.0204.t:0 "Preso em Limbo"
 bp2_hostage_system.0300.a.killer:0 "Pois bem..."
 bp2_hostage_system.0300.a.violent:0 "Muito trágico..."
 bp2_hostage_system.0300.a:0 "Trágico..."
 bp2_hostage_system.0300.desc:0 "\n\nNão há nada a ser feito; [hostage_home_court.GetTitledFirstName] ficará furios[Select_CString( hostage_home_court.IsFemale, 'a', 'o' )] assim que a notícia chegar à corte [hostage_home_court.GetPrimaryTitle.GetAdjectiveNoTooltip], e nossos acordos serão deixados de lado."
 bp2_hostage_system.0300.fallback:0 "e no entanto, [hostage.GetFirstName] agora está morto."
 bp2_hostage_system.0300.intro:0 "A segurança de um refém é a responsabilidade, o juramento, de um guardião. Faço um pacto de honra para proteger [hostage.GetSheHe] de qualquer mal,"
 bp2_hostage_system.0300.killer:0 "e mesmo assim, matei [hostage.GetFirstName]."
 bp2_hostage_system.0300.my_hostage:0 "\n\nSó espero que [hostage_home_court.GetTitledFirstName] pense melhor antes de buscar justiça contra m[Select_CString( my_hostage.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName]."
 bp2_hostage_system.0300.t:0 "Sob Minha Vigilância"
 bp2_hostage_system.0300.violent:0 "mas [hostage.GetFirstName] encontrou um fim bastante trágico em minha corte."
 bp2_hostage_system.0301.a.killer:0 "Esse... #EMP canalha!#!"
 bp2_hostage_system.0301.a.violent:0 "[hostage.GetFirstNameNoTooltip]... por que...?"
 bp2_hostage_system.0301.a:0 "Não pode ser..."
 bp2_hostage_system.0301.b:0 "Um olho por um olho!"
 bp2_hostage_system.0301.desc:0 "Espero que um dia você possa me perdoar, pelo bem de nós dois."
 bp2_hostage_system.0301.fallback:0 "Peço desculpas por falhar miseravelmente em minhas funções como guardião [hostage.GetHerHim]."
 bp2_hostage_system.0301.intro:0 "Lamento informar que [Select_CString( hostage.IsFemale, 'sua', 'seu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], está [Select_CString( hostage.IsFemale, 'morta', 'morto' )].\n\n"
 bp2_hostage_system.0301.killer:0 "Saiba que não tive escolha a não ser tirar a vida [hostage.GetHerHim]."
 bp2_hostage_system.0301.my_hostage:0 "\n\nO que quer que tenha acontecido aqui, [Select_CString( my_hostage.IsFemale, 'minha', 'meu' )] [hostage_warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName], é inocente nesse assunto."
 bp2_hostage_system.0301.opening:0 "[hostage_warden.Custom2('AppropriateGreeting', ROOT.Char)]"
 bp2_hostage_system.0301.violent:0 "A maneira como [hostage.GetSheHe] deixou este mundo, sob minha proteção, vai me assombrar."
 bp2_hostage_system.0400.a:0 "Não há nada a ser feito."
 bp2_hostage_system.0400.adopted:0 "Com meu antigo refém, [hostage.GetFirstName], agora considerado um membro sólido da Casa [ROOT.Char.GetHouse.GetBaseName], o acordo prévio com [home_court.GetTitledFirstName] é redundante."
 bp2_hostage_system.0400.adopted_stay:0 "\n\nMesmo assim, [hostage.GetSheHe] decidiu alegremente permanecer em minha corte em [ROOT.Char.GetCapitalLocation.GetName] por enquanto."
 bp2_hostage_system.0400.b:0 "E [hostage.GetSheHe] é muito bem-vind[Select_CString( hostage.IsFemale, 'a', 'o' )]!"
 bp2_hostage_system.0400.dead_home_court:0 "[home_court.GetTitledFirstName], [Select_CString( home_court.IsFemale, 'a', 'o' )] [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] [Select_CString( hostage.IsFemale, 'da minha', 'do meu' )] refém, [hostage.GetFirstName], morreu sem garantir a sucessão da [home_court.GetHouse.GetBaseNameNoTooltip], e nosso pacto de repente se encontra sem propósito."
 bp2_hostage_system.0400.family:0 "\n\n[hostage.GetFirstNameNoTooltip] está livre para se despedir e se reunir à sua família, se [hostage.GetSheHe] assim desejar."
 bp2_hostage_system.0400.home:0 "[hostage.GetFirstNameNoTooltip] parte"
 bp2_hostage_system.0400.imprisoned:0 "\n\nTenho certeza de que [hostage.GetFirstNameNoTooltip] logo será libertado..."
 bp2_hostage_system.0400.imprisoned_hostage:0 "Com [Select_CString( hostage.IsFemale, 'minha', 'meu' )] refém, [hostage.GetFirstName], definhando na prisão de [imprisoner.GetTitledFirstNamePossessive], meu pacto com [home_court.GetTitledFirstName] de repente perde seu propósito."
 bp2_hostage_system.0400.imprisoned_hostage_fail:0 "Com [Select_CString( hostage.IsFemale, 'minha', 'meu' )] ex-refém, [hostage.GetFirstName], tendo escapado das minhas tentativas de aprisionar [hostage.GetSheHe], meu pacto com [home_court.GetTitledFirstName] definitivamente chegou ao fim."
 bp2_hostage_system.0400.imprisoned_hostage_self:0 "Com [Select_CString( hostage.IsFemale, 'minha antiga', 'meu antigo' )] antigo refém, [hostage.GetFirstName], agora definhando em minha prisão, meu pacto com [home_court.GetTitledFirstName] está definitivamente encerrado."
 bp2_hostage_system.0400.imprisoned_self:0 "\n\n[home_court.GetFirstNameNoTooltip] não ficará feliz..."
 bp2_hostage_system.0400.landed_hostage:0 "Com [Select_CString( hostage.IsFemale, 'minha', 'meu' )] refém, [hostage.GetFirstNamePossessive], herdeiro do [hostage.GetPrimaryTitle.GetNameNoTierNoTooltip], agora me vejo cuidando de um[Select_CString( hostage.IsFemale, 'a', '' )] [hostage.GetTitleAsNameNoTooltip]!"
 bp2_hostage_system.0400.my_hostage:0 "\n\nEspero que [Select_CString( my_hostage.IsFemale, 'minha própria', 'meu próprio' )] [warden.Custom2('RelationToMe', SCOPE.sC('my_hostage'))], [my_hostage.GetFirstName], retorne em troca."
 bp2_hostage_system.0400.no_family:0 "\n\n[hostage.GetFirstNameNoTooltip] está livre para partir, embora o destino [hostage.GetHerHim] esteja longe de ser certo."
 bp2_hostage_system.0400.ruler:0 "\n\n[hostage.GetFirstNameNoTooltip] logo partirá para assumir seu trono em [hostage.GetCapitalLocation.GetName]."
 bp2_hostage_system.0400.ruler_hostage:0 "Com [Select_CString( hostage.IsFemale, 'minha', 'meu' )] refém, [hostage.GetFirstName], agora no comando de um(a) [hostage.GetDomicile.GetType.GetName|l] próprio(a), me vejo cuidando de um[Select_CString( hostage.IsFemale, 'a', '' )] [hostage.GetTitleAsNameNoTooltip]!"
 bp2_hostage_system.0400.t:0 "Mudança nas Circunstâncias"
 bp2_hostage_system.0400.unlanded_home_court:0 "[home_court.GetTitledFirstName], [Select_CString( home_court.IsFemale, 'a', 'o' )] [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] [Select_CString( hostage.IsFemale, 'da minha', 'do meu' )] refém, [hostage.GetFirstName], perdeu suas terras, e nosso pacto de repente se encontra sem propósito."
 bp2_hostage_system.0400.unlanded_home_court_title:0 "[home_court.GetTitledFirstName], [Select_CString( home_court.IsFemale, 'a', 'o' )] [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] [Select_CString( hostage.IsFemale, 'da minha', 'do meu' )] refém, [hostage.GetFirstName], perdeu suas terras [lost_title.GetAdjectiveNoTooltip], e nosso pacto de repente se encontra sem propósito."
 bp2_hostage_system.0400.unlanded_warden:0 "Com a perda de minhas terras, meu pacto com [home_court.GetTitledFirstName], [Select_CString( home_court.IsFemale, 'a', 'o' )] [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] de [Select_CString( hostage.IsFemale, 'minha', 'meu' )] refém, [hostage.GetFirstName], perde de repente seu propósito."
 bp2_hostage_system.0400.unlanded_warden_title:0 "Com a perda de [lost_title.GetNameNoTierNoTooltip], meu pacto com [home_court.GetTitledFirstName], [Select_CString( home_court.IsFemale, 'a', 'o' )] [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] de meu refém, [hostage.GetFirstName], perde de repente seu propósito."
 bp2_hostage_system.0400.unrelated_hostage:0 "Com [Select_CString( hostage.IsFemale, 'minha', 'meu' )] refém, [hostage.GetFirstNamePossessive], não mais relevante para [home_court.GetTitledFirstName], nosso pacto de repente se encontra sem propósito."
 bp2_hostage_system.0401.a:0 "Seja como for."
 bp2_hostage_system.0401.adopted:0 "Ouvi rumores de que m[Select_CString( hostage.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('hostage'))], [hostage.GetFirstName], agora considera [hostage.GetHerselfHimself] parte da Casa [hostage.GetHouse.GetBaseName]! [warden.GetTitledFirstName], aquel[Select_CString( warden.IsFemale, 'a', 'e' )] [warden.Custom2('InsultNoun', ROOT.Char)], deve ter envenenado a mente [hostage.GetHerHim]!"
 bp2_hostage_system.0401.adopted_stay:0 "\n\nDizem até que [hostage.GetFirstNameNoTooltip] considera #EMP [warden.GetCapitalLocation.GetName]#! como seu verdadeiro lar, não [ROOT.Char.GetCapitalLocation.GetName]!"
