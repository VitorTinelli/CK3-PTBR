 bp2_hostage_system.0401.unlanded_warden_title:0 "[warden.GetTitledFirstName], [Select_CString( warden.IsFemale, 'a', 'o' )] [hostage.Custom2('RelationToMe', SCOPE.sC('warden'))] do meu refém, [hostage.GetFirstName], perdeu suas terras [lost_title.GetAdjectiveNoTooltip], e nosso pacto de repente se encontra sem propósito."
 bp2_hostage_system.0401.unrelated_hostage:0 "Com [hostage.GetFirstName], enviad[Select_CString( hostage.IsFemale, 'a', 'o' )] daqui para ser um[Select_CString( hostage.IsFemale, 'a', '' )] refém [warden.GetPrimaryTitle.GetAdjectiveNoTooltip], não mais relevante para [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], nosso pacto com [warden.GetTitledFirstName] de repente se encontra sem propósito."
 bp2_hostage_system.0402.a:0 "Precisamos partir."
