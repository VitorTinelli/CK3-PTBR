 bp2_hostage_system.0410.desc:0 "As circunstâncias de [home_court.GetTitledFirstName], [Select_CString( home_court.IsFemale, 'a', 'o' )] [hostage.Custom2('RelationToMe', SCOPE.sC('home_court'))] do meu refém, [hostage.GetFirstName], mudaram; [home_court.GetSheHe] agora se encontra [Select_CString( home_court.IsFemale, 'reduzida a uma mera', 'reduzido a um mero' )] [home_court.GetTitleAsNameNoTooltip].\n\nNosso pacto foi feito sob suposições bem diferentes, e talvez seja sábio reconsiderar agora..."
