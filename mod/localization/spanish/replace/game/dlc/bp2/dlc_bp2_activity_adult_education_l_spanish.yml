 sic_et_non_book_desc:0 "Este livro é o resultado das reflexões teológicas e filosóficas de [book_creator.GetTitledFirstNamePossessive] enquanto estudava em [location.GetBaronyNameExplicitly].\n\nEle contém uma discussão profunda e bem articulada das contradições da teologia [book_creator.GetFaith.GetAdjective], e como melhor reconciliá-las."
