 apa_university_discussions_title:0 "[first.GetShortUIName|U] discutiu [second.Custom('education_conversation_subject')] com [second.GetShortUIName]"
 available_friend_lover:0 "Essa opção está disponível por você ser [friends|E] ou [lovers|E]"
 available_higher_tier:0 "Essa opção está disponível porque a sua [rank|E] é superior ao de [local_ruler.GetFirstName]"
 available_liege:0 "Essa opção está disponível por você ser [liege|E] d[Select_CString( local_ruler.IsFemale, 'a', 'o' )] [local_ruler.GetFirstNamePossessive]"
 balanced_teachers_opinions_log:0 "[CHARACTER.GetTitledFirstName|U] levou seus professores a um acordo em um debate acadêmico"
 balanced_teachers_opinions_log_title:0 "Encontrou Equilíbrio Entre Professores"
 blew_off_some_steam_opinion:0 "Desestressei um Pouco Juntos"
 bp2_adult_education.0005.a:0 "Em breve."
 bp2_adult_education.0005.desc:0 "Minhas esperanças e sonhos de crescimento pessoal foram destruídos.\n\nEnquanto estou em minha cela, só posso imaginar com nostalgia todo o conhecimento que eu poderia estar adquirindo. Isso terá que esperar para outro momento."
 bp2_adult_education.0005.t:0 "Invalidado"
 bp2_adult_education.0009.a:0 "Conhecimento é poder!"
 bp2_adult_education.0009.b:0 "[teacher_1.GetFirstNameNoTooltip] seria uma ótima adição ao meu [ROOT.Char.Custom('GetCourt')]."
 bp2_adult_education.0009.c:0 "[teacher_2.GetFirstNameNoTooltip], preciso que você me ensine mais!"
 bp2_adult_education.0009.d:0 "O lugar de um professor é com seus alunos."
 bp2_adult_education.0009.desc:0 "Esta tem sido uma experiência incrível!\n\nQuando parti, não podia imaginar a quantidade de homens sábios que estudam em [province.GetName], a profundidade de seu pensamento e a amplitude de sua pesquisa! Só estar no mesmo ambiente deles me tornou uma pessoa muito melhor, e com o conhecimento que adquiri, posso voltar para casa muito satisfeito."
 bp2_adult_education.0009.desc_teacher_1:0 "\n\nNo entanto, durante minha estadia, me aproximei de um dos meus professores, [teacher_1.GetFirstName], e detesto ter que me separar tão cedo."
 bp2_adult_education.0009.desc_teacher_2:0 "\n\nPor outro lado, meu professor [teacher_2.GetFirstName] me causou uma grande impressão, e gostaria de passar mais tempo juntos."
 bp2_adult_education.0009.e:0 "Vamos manter contato."
 bp2_adult_education.0009.t:0 "Conclusão"
 bp2_adult_education.0010.a:0 "Hora de começar."
 bp2_adult_education.0010.desc_end:0 "\n\nÉ claro que os principais centros de cultura também são mercados ativos e oferecem todas as #EMP distrações#! que um estudante poderia desejar..."
 bp2_adult_education.0010.desc_religious:0 "Finalmente estou aqui, caminhando pelos corredores sagrados de [location.GetBaronyNameExplicitly], o venerado centro de todo conhecimento do mundo [location.GetCounty.GetFaith.GetAdjective|U].\n\nTenho muito a aprender com os homens e mulheres santos que se reúnem entre estas veneráveis paredes! E quanto aos antigos pergaminhos e livros?"
 bp2_adult_education.0010.desc_uni:0 "Aqui estou, finalmente às portas de [location.GetBaronyNameExplicitly], a renomada sede da Universidade.\n\nTodo o conhecimento é reunido nestes sagrados corredores, e estudiosos de renome de todo o mundo se reúnem nestes mesmos corredores para preservar e aumentar uma verdadeira riqueza de sabedoria. E logo me juntarei a eles!"
 bp2_adult_education.0010.desc_very_very_far:0 "\n\nEnquanto considero todas as minhas possibilidades, os locais me olham com uma mistura de curiosidade e confusão. Está claro que não é todo dia que eles veem nós [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
 bp2_adult_education.0010.t:0 "Chegada em [location.GetBaronyNameExplicitlyNoTooltip]"
 bp2_adult_education.1000.a.failure.tt:0 "[student.GetFirstNameNoTooltip] te superou"
 bp2_adult_education.1000.a.failure:0 "Você admite que [student.GetFirstNameNoTooltip] está certo"
 bp2_adult_education.1000.a.success.tt:0 "Você convenceu [student.GetFirstNameNoTooltip]"
 bp2_adult_education.1000.a.success:0 "[student.GetFirstNameNoTooltip] é convencido"
 bp2_adult_education.1000.a.tt:0 "Você cita os clássicos"
 bp2_adult_education.1000.a:0 "Mas, como disse o Mestre..."
 bp2_adult_education.1000.b.failure.tt:0 "Você não convenceu [student.GetFirstNameNoTooltip]"
 bp2_adult_education.1000.b.failure:0 "[student.GetFirstNameNoTooltip] não é convencido"
 bp2_adult_education.1000.b.success.tt:0 "Você venceu [student.GetFirstNameNoTooltip]"
 bp2_adult_education.1000.b.success:0 "[student.GetFirstNameNoTooltip] fica sem palavras"
 bp2_adult_education.1000.b.tt:0 "Você tenta confundir [student.GetSheHe] com rimas provocantes"
 bp2_adult_education.1000.b:0 "Meu ponto está correto, e você não pode lutar!"
 bp2_adult_education.1000.c:0 "Deixa pra lá, tenho mais livros para ler."
 bp2_adult_education.1000.desc:0 "[location.GetBaronyNameExplicitly] é frequentemente palco de debates fervorosos entre professores e alunos. Depois de uma palestra particularmente esclarecedora de nosso professor [teacher.GetTitledFirstName], me vejo arrastado para um debate com outro aluno, [student.GetFirstName].\n\n\"Não! Você não faz sentido nenhum! Você está deturpando completamente o ponto do Filósofo!\" eu grito.\n\n\"#EMP Você#! está completamente delirante!\" [student.GetSheHe|U] responde.\n\nDo canto do olho, vejo [teacher.GetFirstNameNoTooltip] nos observando com um olhar pensativo em seu rosto."
 bp2_adult_education.1000.t:0 "Um Debate Intelectual"
 bp2_adult_education.1010.a:0 "Preciso estudar muito para me integrar!"
 bp2_adult_education.1010.b.failure.tt:0 "A língua local ainda escapa de você!"
 bp2_adult_education.1010.b.failure:0 "Você ainda não entende a língua local"
 bp2_adult_education.1010.b.success.tt:0 "Você dominou a língua local"
 bp2_adult_education.1010.b.success:0 "Você domina a língua local"
 bp2_adult_education.1010.b:0 "A poesia será minha professora!"
 bp2_adult_education.1010.c:0 "Não posso me distrair com isso."
 bp2_adult_education.1010.d.tt:0 "Você tenta aprender a língua em bordéis, tavernas e mercados."
 bp2_adult_education.1010.d:0 "Qual professor melhor do que o povo em si?"
 bp2_adult_education.1010.desc:0 "Meus estudos em [location.GetBaronyNameExplicitly] estão indo bem, mas não posso deixar de me sentir um pouco isolado da comunidade que me rodeia.\n\nSou um estranho em uma terra estranha, e a língua destas terras, [location.GetCounty.GetCulture.GetLanguage.GetName], como falada pelos locais nas tavernas e mercados da cidade, é exótica e misteriosa para mim. Até entre meus colegas e professores, muitos nasceram e foram criados aqui, e ser capaz de compartilhar conhecimento de forma mais direta com eles certamente melhoraria a qualidade dos meus estudos."
 bp2_adult_education.1010.t:0 "A Linguagem do Povo"
 bp2_adult_education.1011.a:0 "Hora de estudar muito."
 bp2_adult_education.1011.b.failure:0 "As aulas não são suficientes"
 bp2_adult_education.1011.b.tt:0 "Mas pelo menos você teve tempo livre para perseguir seus outros interesses"
 bp2_adult_education.1011.b:0 "As aulas são mais do que suficientes."
 bp2_adult_education.1011.d.failure.tt:0 "Você não aprendeu a língua litúrgica"
 bp2_adult_education.1011.d.failure:0 "Você se faz de bobo"
 bp2_adult_education.1011.d.success.tt:0 "Você dominou a língua litúrgica"
 bp2_adult_education.1011.d.success:0 "Você domina a língua litúrgica"
 bp2_adult_education.1011.d:0 "Os Mestres mesmos me ensinarão!"
 bp2_adult_education.1011.desc:0 "Pessoas de todo o mundo conhecido se reúnem em universidades e centros religiosos para adquirir e compartilhar conhecimento, mas isso só é possível pelo conhecimento compartilhado de uma língua comum, geralmente alguma língua antiga de liturgia carregada de autoridade tradicional.\n\nInfelizmente, não estou muito familiarizado com o idioma da cultura falado em [location.GetBaronyNameExplicitly], o que está tornando meus estudos muito mais difíceis do que deveriam ser.\n\nNão é uma tarefa fácil, mas não é isso que a educação superior significa?"
 bp2_adult_education.1011.t:0 "A Linguagem do Conhecimento"
 bp2_adult_education.1012.a.failure.tt:0 "Você não aprendeu a língua de [teacher.GetFirstNamePossessiveNoTooltip]"
 bp2_adult_education.1012.a.failure:0 "Você não consegue aprender a língua de [teacher.GetFirstNamePossessiveNoTooltip]"
 bp2_adult_education.1012.a.success.tt:0 "Você aprendeu a língua de [teacher.GetFirstNamePossessiveNoTooltip]"
 bp2_adult_education.1012.a.success:0 "Você aprende a língua de [teacher.GetFirstNamePossessiveNoTooltip]"
 bp2_adult_education.1012.a:0 "Isso me aproximará do Magister!"
 bp2_adult_education.1012.b.tt:0 "Tudo é possível com as conexões certas!"
 bp2_adult_education.1012.b:0 "Vou precisar de alguém para me ajudar..."
 bp2_adult_education.1012.desc:0 "[teacher.GetFirstName|U], um dos professores mais respeitados em [location.GetBaronyNameExplicitly], é claramente um estrangeiro: seu sotaque e maneirismos o denunciam como um [teacher.GetCulture.GetName].\n\nEmbora não seja estritamente necessário para meus estudos, aprender a língua materna de [teacher.GetFirstNameNoTooltip] iria promover um relacionamento privilegiado com [teacher.GetFirstNameNoTooltip], o que certamente seria um bom investimento para o futuro."
 bp2_adult_education.1012.t:0 "A Linguagem do Mestre"
 bp2_adult_education.1020.a:0 "Isso é #EMP ABSURDO#!!"
 bp2_adult_education.1020.b.tt:0 "Ter um gostinho desse estilo de vida \"Goliardic\" não pode ser tão ruim, não é?"
 bp2_adult_education.1020.b:0 "Por que não...?"
 bp2_adult_education.1020.c.tt:0 "Você se meteu em algumas confusões sérias!"
 bp2_adult_education.1020.c:0 "Você precisa perguntar?"
 bp2_adult_education.1020.d:0 "Talvez na próxima vez."
 bp2_adult_education.1020.desc.carmina_burana:0 "\n\n\"#EMP O Fortuna velut luna statu variabilis, semper crescis aut decrescis#!\" canta [student.GetFirstName], cercado por uma multidão animada."
 bp2_adult_education.1020.desc.dice:0 "\n\nUm grupo barulhento de estudantes cerca [student.GetFirstName] e outra pessoa que eu não reconheço, que estão jogando dados nas escadas do [location.Custom('GetLocationFaithTemple')]."
 bp2_adult_education.1020.desc.donkey:0 "\n\n[student.GetFirstName] está liderando um #EMP burro#!, cantando seus louvores. Uma multidão de estudantes responde \"Hee Haw, Senhor Burro, Hee haw!\" após cada verso."
 bp2_adult_education.1020.desc.drinking_poetry:0 "\n\n[student.GetFirstName], claramente embriagado e mal se sustentando em pé, está encantando uma multidão animada com algumas rimas elegantes sobre as alegrias da bebida, bem conhecidas pelo clero local."
 bp2_adult_education.1020.desc.end:0 "Quando eles me notam, eles cantam para mim: \"JUNTE-SE A NÓS! JUNTE-SE A NÓS!\"\n\nA expressão carrancuda no rosto de [teacher.GetFirstNamePossessiveNoTooltip] fala volumes sobre os pensamentos dele sobre todo o assunto."
 bp2_adult_education.1020.desc.lusty_poetry:0 "\n\nUm grupo barulhento de estudantes liderado por [student.GetFirstName] está se aproximando, todos cantando uma canção #EMP lasciva#! sobre suas escapadas sexuais — e em detalhes, devo dizer."
 bp2_adult_education.1020.desc.satyre_poetry:0 "\n\nO que só posso descrever como uma #EMP procissão#! de estudantes está se aproximando, com [student.GetFirstName] à frente. Enquanto tentam manter a seriedade, eles alternam citações do [location.GetCounty.GetFaith.ReligiousText] e paródias sacrílegas de seus ritos."
 bp2_adult_education.1020.desc:0 "Enquanto saio da aula após uma aula profunda e instigante de [teacher.GetFirstName], minha atenção é atraída pelas risadas caóticas e gritos vindos de fora."
 bp2_adult_education.1020.t:0 "Os Goliards"
 bp2_adult_education.1030.a.failure.tt:0 "Você não os impressionou"
 bp2_adult_education.1030.a.failure:0 "Os outros estudantes riem de suas tentativas insignificantes"
 bp2_adult_education.1030.a.success.tt:0 "Eles gostaram de você"
 bp2_adult_education.1030.a.success:0 "Os outros estudantes entoam seu nome"
 bp2_adult_education.1030.a:0 "... talvez?"
 bp2_adult_education.1030.b.tt:0 "Eles estão impressionados com você!"
 bp2_adult_education.1030.b:0 "Me chama!"
 bp2_adult_education.1030.c:0 "Não, obrigado."
 bp2_adult_education.1030.desc:0 "As universidades e centros de ensino superior são sempre agitados polos de socialização.\n\nNesses corredores sagrados, os estudantes são todos colegas, todos aprendizes ao longo do caminho do conhecimento, por isso pode ser útil fazer amigos e se sentir parte de uma comunidade."
 bp2_adult_education.1030.desc_alcohol:0 "\n\nPelo menos esses são meus primeiros pensamentos quando [student.GetFirstName] se aproxima de mim, o cheiro de [student.Custom('RegionalAlcoholicDrink')] em sua respiração.\n\n\"Junte-se a mim e aos meus amigos, [ROOT.Char.GetFirstNameNoTooltip]! Prove para nós o poder de um [ROOT.Char.GetTitleAsNameNoTooltip] bebendo mais copos do que qualquer outra pessoa, e consideraremos você um de nós!\""
 bp2_adult_education.1030.desc_fallback:0 "\n\nPelo menos esses são meus primeiros pensamentos quando [student.GetFirstName] se aproxima de mim, um sorriso suspeito em seu rosto.\n\n\"Junte-se a mim e aos meus amigos, [ROOT.Char.GetFirstNameNoTooltip]! Prove para nós a resistência de um [ROOT.Char.GetTitleAsNameNoTooltip] passando a noite inteira festejando! Então consideraremos você um de nós!\""
 bp2_adult_education.1030.t:0 "[Select_CString( ROOT.Char.IsFemale, 'Uma das', 'Um dos' )] [ROOT.Char.Custom('GirlBoyPlural')|U]"
 bp2_adult_education.1040.a:0 "[teacher_1.GetFirstNameNoTooltip] está certo."
 bp2_adult_education.1040.b:0 "[teacher_2.GetFirstNameNoTooltip] busca o conhecimento mais valioso."
 bp2_adult_education.1040.c.failure.tt:0 "Os professores não estão impressionados"
 bp2_adult_education.1040.c.failure:0 "Eles acham que você está apenas confundindo as águas"
 bp2_adult_education.1040.c.success.tt:0 "Você impressionou seus professores"
 bp2_adult_education.1040.c.success:0 "Eles estão convencidos e satisfeitos com a sua tese"
 bp2_adult_education.1040.c:0 "Há grandes méritos em ambas as disciplinas."
 bp2_adult_education.1040.d.failure.tt:0 "Os professores te culparam"
 bp2_adult_education.1040.d.failure:0 "A discussão se intensifica"
 bp2_adult_education.1040.d.success.tt:0 "Você pacificou os professores"
 bp2_adult_education.1040.d.success:0 "Eles encontram um acordo graças a você"
 bp2_adult_education.1040.d.tt:0 "Você talvez possa acalmar [teacher_1.GetFirstNameNoTooltip] e [teacher_2.GetFirstNameNoTooltip] com boa comida e bebidas"
 bp2_adult_education.1040.d:0 "Por que não mudamos a discussão para a taverna?"
 bp2_adult_education.1040.desc:0 "Os corredores da Universidade de [location.GetBaronyNameExplicitly] frequentemente ecoam com os debates de estudantes e professores, alguns dos quais se transformam em rivalidades notórias, como entre [teacher_1.GetFirstName] e [teacher_2.GetFirstName].\n\nQuando eu os encontro hoje, eles estão — como de costume — gritando um com o outro, tentando provar qual campo de estudo está melhor equipado para discutir [teacher_1.Custom('EruditeTopic')]. Algo menos comum, no entanto, é que eles de repente me notam se aproximando e pedem #EMP a mim#! para tomar uma posição."
 bp2_adult_education.1040.e:0 "Isso realmente importa?"
 bp2_adult_education.1040.t:0 "Escolas de Pensamento"
 bp2_adult_education.1050.a:0 "Podemos todos aprender uns com os outros!"
 bp2_adult_education.1050.b:0 "Um brinde às nossas diferenças!"
 bp2_adult_education.1050.c:0 "Eu estou aqui apenas para estudar."
 bp2_adult_education.1050.desc:0 "[location.GetBaronyNameExplicitly] é um centro de estudos que realmente atrai estudantes de todo o mundo!\n\nEssa percepção me atinge quando considero como eu mesmo e muitos dos meus colegas buscadores do conhecimento, incluindo [student_1.GetFirstName] e [student_2.GetFirstName], somos todos estrangeiros em [location.GetBaronyNameExplicitlyNoTooltip]. Eu me pergunto se há alguma maneira de eu aproveitar isso..."
 bp2_adult_education.1050.t:0 "Estrangeiros nesta Terra"
 bp2_adult_education.1060.a.crit_success.tt:0 "Agora tudo faz sentido"
 bp2_adult_education.1060.a.crit_success:0 "Suas reflexões são tão esclarecedoras que podem ajudar futuros estudiosos também"
 bp2_adult_education.1060.a.failure.tt:0 "Você não consegue entender"
 bp2_adult_education.1060.a.failure:0 "Você está mais confuso do que antes"
 bp2_adult_education.1060.a.success.tt:0 "Você fez algum progresso"
 bp2_adult_education.1060.a.success:0 "Você se sente mais sábio e mais próximo da verdade"
 bp2_adult_education.1060.a.tt:0 "Você ganha um Artefato de Livro"
 bp2_adult_education.1060.a:0 "Deve haver significado nas contradições..."
 bp2_adult_education.1060.b.tt:0 "Qual era a pergunta mesmo?"
 bp2_adult_education.1060.b:0 "A resposta deve vir da experiência empírica!"
 bp2_adult_education.1060.c:0 "Minha cabeça está doendo."
 bp2_adult_education.1060.desc:0 "Meus estudos aprofundados na doutrina [ROOT.Char.GetFaith.GetAdjective] em [location.GetBaronyNameExplicitly] me confrontaram com tantas novas perguntas, nem todas parecem ter respostas claras. Algumas até têm explicações contraditórias!\n\nA fé deve ser complementada pela razão ou não?\nA fé lida apenas com o invisível ou não?\nNós realmente podemos saber o que é invisível ou não?\n\n#EMP Sim ou não?#!"
 bp2_adult_education.1060.t:0 "Sim e Não"
 bp2_adult_education.1070.a.failure.tt:0 "Você perdeu o debate!"
 bp2_adult_education.1070.a.failure:0 "Você está em desvantagem"
 bp2_adult_education.1070.a.success.tt:0 "Você ganhou o debate!"
 bp2_adult_education.1070.a.success:0 "Sua posição está mais forte"
 bp2_adult_education.1070.a:0 "Deixe-me começar a partir do [ROOT.Char.GetFaith.ReligiousText|U]. Como todos sabem..."
 bp2_adult_education.1070.b.failure:0 "Você não pode confundir os pensamentos de [student.GetFirstNamePossessiveNoTooltip]"
 bp2_adult_education.1070.b.success:0 "Você confunde habilmente as águas o suficiente para que seu adversário se renda"
 bp2_adult_education.1070.b:0 "Não posso dizer que você está errado, mas estaria mentindo se dissesse?"
 bp2_adult_education.1070.c:0 "Achei que [student_2.GetFirstNameNoTooltip] quisesse uma chance!"
 bp2_adult_education.1070.desc:0 "O ensino em [location.GetBaronyNameExplicitly] ocorre em sua maioria na forma oral, e os estudantes são incentivados a exercitar sua habilidade retórica e a mostrar o progresso de seu aprendizado em debates diante de seus colegas e professores.\n\nHoje, [teacher.GetFirstName] me pediu e [student.GetFirstName] para adotar lados opostos sobre o tópico de [teacher.Custom('EruditeTopic')] para debatê-lo."
 bp2_adult_education.1070.t:0 "O Debate"
 bp2_adult_education.1080.a:0 "Não me importo, desde que [teacher.GetSheHe] tenha algo a ensinar."
 bp2_adult_education.1080.b.tt:0 "A brincadeira teve resultados inesperados"
 bp2_adult_education.1080.b:0 "É meu dever [ROOT.Char.GetFaith.GetReligion.GetAdjectiveNoTooltip] pregar uma peça no [ROOT.Char.Custom2('GetUnbelieverTerm', teacher)]!"
 bp2_adult_education.1080.c:0 "Como um [teacher.GetFaith.GetAdherentNameNoTooltip] poderia me ensinar algo de valor?!"
 bp2_adult_education.1080.d:0 "Talvez [teacher.GetSheHe] tenha as respostas que estou perdendo..."
 bp2_adult_education.1080.desc:0 "[location.GetBaronyNameExplicitly] é um renomado centro de estudos que atrai tanto professores quanto estudantes de longe e perto.\n\nEu mal tinha pensado muito nisso até hoje, quando uma referência religiosa de [teacher.GetFirstName] me chocou como blasfêmia e contrária a tudo o que já me ensinaram na vida. Isso revelou [teacher.GetSheHe] como um [teacher.GetFaith.GetAdherentNameNoTooltip], um verdadeiro [ROOT.Char.Custom2('GetUnbelieverTerm', teacher)], e eu não sei como me sentir sobre isso."
 bp2_adult_education.1080.e:0 "[teacher.GetFirstNameNoTooltip] deve ter muito mais a ensinar então!"
 bp2_adult_education.1080.t:0 "Questão de Fé?"
 bp2_adult_education.1090.a.tt:0 "Essa ação contradiz suas crenças"
 bp2_adult_education.1090.a:0 "Eu me voluntario para ajudar!"
 bp2_adult_education.1090.b.tt:0 "Você rapidamente o desmascara e o solta na classe para estudar o caos que se segue!"
 bp2_adult_education.1090.b:0 "Professor, deixe-me cuidar do animal..."
 bp2_adult_education.1090.c:0 "Muito interessante."
 bp2_adult_education.1090.desc:0 "Hoje\", nosso professor, [teacher.GetFirstName], começa, \"vamos examinar a anatomia de um falcão.\"\n\nUm murmúrio animado se espalha pela sala de aula, à medida que todos nós apreciamos a ave encapuzada em pé orgulhosamente no braço enluvado do professor.\n\n\"Muito pode ser aprendido estudando o corpo dos animais, como os antigos nos ensinaram. Alguém quer me ajudar com a demonstração da dissecação?\""
 bp2_adult_education.1090.t:0 "Dar uma Olhada"
 bp2_adult_education.9000.a.failure:0 "Você é sumariamente escoltado para fora do auditório"
 bp2_adult_education.9000.a.success:0 "Você destrói [guest_speaker.GetFirstNameNoTooltip] com #EMP fatos#! e #EMP lógica#!"
 bp2_adult_education.9000.a:0 "O quê!? Isso é pensamento herético!"
 bp2_adult_education.9000.b:0 "#EMP *Rabiscar furiosamente notas*#!"
 bp2_adult_education.9000.c:0 "\"Todo mundo sabe que está ligado à natureza de [guest_speaker.GetFaith.random_EvilGodNames]!\""
 bp2_adult_education.9000.d:0 "Não posso ficar, tenho uma reunião com algumas [ROOT.Char.Custom('GetExpensiveDrink_Singular')]!"
 bp2_adult_education.9000.desc:0 "Estudantes, temos um palestrante ilustre conosco hoje!\" Exclama meu professor [teacher.GetFirstName]. \"Vamos dar as boas-vindas a [guest_speaker.GetFullName] — a máxima autoridade na doutrina [guest_speaker.GetFaith.GetAdjective] de [location.GetName].\"\n\n\"Saudações.\" [guest_speaker.GetFirstNameNoTooltip] começa solenemente, enquanto [guest_speaker.Custom('quirk_pos_pp')]. \"Hoje exploraremos [guest_speaker.Custom('education_conversation_subject')], e como isso se conecta à natureza de [guest_speaker.GetFaith.HighGodName].\"\n\nOs outros estudantes endireitam as costas e pegam suas canetas. Isso vai demorar um pouco."
 bp2_adult_education.9000.e:0 "Aha? Hm. Oh? Fascinante, sim, sim..."
 bp2_adult_education.9000.t:0 "O Palestrante Convidado"
 bp2_adult_education.9100.a:0 "Eu poderia usar alguns servos para carregar todos os meus livros..."
 bp2_adult_education.9100.b:0 "\"Camponeses — peguem mais copos para nós, estou trazendo os outros estudantes!\""
 bp2_adult_education.9100.c:0 "É melhor avisar aos professores antes que eles destruam tudo..."
 bp2_adult_education.9100.desc:0 "De repente, sou distraído de meus estudos da meia-noite por um alto #EMP *Estrondo*#!, um #EMP *ESTOURO*#! ensurdecedor e um #EMP *Estilhaço*#! que soa caro. O que diabos está acontecendo!?\n\nA fonte da perturbação parece ser dois camponeses, [ROOT.Char.GetFaith.HighGodName] sabe como eles entraram aqui, sorvendo avidamente um barril da [ROOT.Char.Custom('GetExpensiveDrink_Singular')] da universidade!\n\n\"Isto vai #EMP *hic*#! ensiná-los!\" Um deles grita. \"Sim, eles pensam que são melhores do que nós só porque podem #EMP ler!#!\" O outro segue."
 bp2_adult_education.9100.read:0 "Pobres almas infelizes... Verei que vocês aprendam a ler!"
 bp2_adult_education.9100.t:0 "Uma Festa de Camponeses"
 bp2_adult_education.9200.a:0 "Devo. Me. Concentrar. No. Livro."
 bp2_adult_education.9200.b:0 "\"Quer fazer isso no telhado da universidade?\""
 bp2_adult_education.9200.c:0 "Acho que é hora de um estudo anatômico prático!"
 bp2_adult_education.9200.d:0 "Isso é inútil... Preciso descansar..."
 bp2_adult_education.9200.desc:0 "A biblioteca está vazia, exceto por mim e [student_flirt.GetFirstName]. Eu tenho lido a mesma página em [SCOPE.Custom('RandomInformativeTextName')] repetidamente, mas é inútil — eu não consigo me concentrar.\n\nNão quando [student_flirt.GetSheHe] continua mordiscando suavemente a ponta da pena, enquanto passa suavemente um dedo por seu(a) [student_flirt.Custom('ObjectifiedFeature')] — e ela continua me olhando #EMP diretamente nos olhos#! enquanto faz isso!\n\n\"Eu acho que merecemos uma... pausa, m[Select_CString( ROOT.Char.IsFemale, 'inha', 'eu' )] [ROOT.Char.Custom('RomanticComplimentNoun')]?\" [student_flirt.GetSheHe|U] geme suavemente."
 bp2_adult_education.9200.t:0 "Uma Pausa Sensual nos Estudos"
 bp2_adult_education.9300.a:0 "Não tenho tempo para suas bobagens, [eccentric_student.GetFirstNameNoTooltip]."
 bp2_adult_education.9300.b:0 "Conte-me mais! Conte-me #EMP tudo!#!"
 bp2_adult_education.9300.c:0 "Eu... só vou embora."
 bp2_adult_education.9300.desc:0 "\"Escutem-me!\" [eccentric_student.GetFirstName] grita, maniacamente. \"Se vocês lerem nas entrelinhas de [SCOPE.Custom('RandomInformativeTextName')], é óbvio; vocês só precisam combinar [eccentric_student.Custom('ThrowableObjectArticle')], um [eccentric_student.Custom('RandomWeirdObject')], e um [eccentric_student.Custom('GetObjectToBalanceOnNose')] — tudo enquanto aderem aos princípios de [eccentric_student.Custom('EruditeTopic')] — confiem em mim, #EMP isso vai funcionar!#!\"\n\nTalvez não tenha sido uma boa ideia para [eccentric_student.GetFirstNameNoTooltip] estudar por trinta e seis horas seguidas..."
 bp2_adult_education.9300.eccentric:0 "É autoevidente!"
 bp2_adult_education.9300.t:0 "Ideias Excêntricas"
 bp2_adult_education.9400.desc:0 "\"Atenção, estudantes!\" Meu professor [teacher.GetFirstName] grita, com [local_ruler.GetTitledFirstName] ao lado. \"Nosso benfeitor [local_ruler.GetTitledFirstNameNoTooltip] nos concedeu uma visita — [local_ruler.GetSheHe] é o governante destas terras — comportem-se da melhor maneira!\"\n\n\"Ah, vocês estão debatendo sobre [local_ruler.Custom('education_conversation_subject')]? Eu também gosto desse assunto! Espero que seus estudos estejam indo bem.\" O [local_ruler.GetTitleAsNameNoTooltip] diz enquanto [local_ruler.Custom('quirk_pos_pp')].\n\nO [local_ruler.GetTitleAsNameNoTooltip] tem o poder de conceder privilégios especiais a estudantes como eu, talvez eu deva aproveitar essa oportunidade para me manifestar..."
 bp2_adult_education.9400.drink:0 "\"Que desinteressante. Vou para a cidade!\""
 bp2_adult_education.9400.friend:0 "\"É um prazer te reencontrar!\""
 bp2_adult_education.9400.gold.toast:0 "Estudante Universitário Faz Doação de Ouro"
 bp2_adult_education.9400.gold:0 "\"Por favor, aceite este humilde presente.\""
 bp2_adult_education.9400.gold_lots.toast:0 "Estudante Universitário Faz Doação Generosa"
 bp2_adult_education.9400.gold_lots:0 "\"Eu gostaria de fazer uma doação generosa!\""
 bp2_adult_education.9400.liege:0 "\"Ah, meu leal súdito. Você se importaria de lembrar a todos quem eu sou?\""
 bp2_adult_education.9400.nothing:0 "\"Você é muito [local_ruler.Custom('ComplimentAdjective')].\""
 bp2_adult_education.9400.t:0 "Uma Visita do [local_ruler.GetTitleAsNameNoTooltip]"
 bp2_adult_education.9400.tier.toast:0 "[root_scope.GetTitleAsNameNoTooltip] visita a sua Universidade"
 bp2_adult_education.9400.tier:0 "\"Você deveria se sentir honrado por ter um [root_scope.GetTitleAsNameNoTooltip] presente!\""
