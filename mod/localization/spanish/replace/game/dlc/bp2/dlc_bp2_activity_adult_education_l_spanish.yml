 activity_adult_education:0 "Visita Universitária"
 activity_adult_education_conclusion_desc:0 "A [GetActivityType( 'activity_adult_education' ).GetName] foi concluída"
 activity_adult_education_desc:0 "Passe um semestre em um renomado centro de estudos, aprendendo com as mentes mais sábias da terra.\n\nÉ uma ocasião para preencher as lacunas em sua educação juvenil, mas também para melhorar-se como um todo, desenvolver suas habilidades, aprender novas capacidades e fazer conexões importantes."
 activity_adult_education_destination_selection:0 "Você só pode iniciar um [GetActivityType('activity_adult_education').GetName] em províncias com um Centro Religioso Grande ou uma Universidade."
 activity_adult_education_guest_desc:0 ""
