 activity_adult_education_predicted_cost:0 "O custo de uma [GetActivityType( 'activity_adult_education' ).GetNameNoTooltip] é principalmente afetado pelas [activity_options|E] que você seleciona."
 activity_adult_education_province_desc:0 "Você inicia uma [GetActivityType( 'activity_adult_education' ).GetName] em [ROOT.Province.GetName]\nVários fatores influenciam ser $activity_adult_education_success$"
 activity_adult_education_selection_tooltip:0 "Faça uma [GetActivityType('activity_adult_education').GetName], um período em um renomado centro de estudos\n\nRecompensas Antecipadas:\n$BULLET_WITH_TAB$[education_trait|E]\n$BULLET_WITH_TAB$[diplomacy_i][martial_i][stewardship_i][intrigue_i][learning_i] Pontos de [skills|E]\n$BULLET_WITH_TAB$[lifestyle_experience|E] [diplomacy_i][martial_i][stewardship_i][intrigue_i][learning_i]"
