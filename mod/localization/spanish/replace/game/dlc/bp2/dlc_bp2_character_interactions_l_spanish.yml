l_spanish:
 bp2_character_interaction.1001.a.flavor:0 "Vocês começam a se entender melhor, e [recipient.GetSheHe] começa a se assemelhar mais a você."
 bp2_character_interaction.1001.a.tt:0 "Traço [target_trait.GetNameNoTooltip(GetPlayer)|l] herdado"
 bp2_character_interaction.1001.a:0 "Esse é [Select_CString( recipient.IsFemale, 'a minha', 'o meu' )] [recipient.Custom('GirlBoy')]!"
 bp2_character_interaction.1001.desc_ambitious:0 "$bp2_character_interaction.desc_ambitious$\"Não! Há muito a ser feito,\" responde [recipient.GetFirstNameNoTooltip]. \"Espere só! Todos vão olhar para a minha liderança um dia.\""
 bp2_character_interaction.1001.desc_arbitrary:0 "$bp2_character_interaction.desc_arbitrary$\"Sim,\" concorda [recipient.GetFirstNameNoTooltip], pegando o brinquedo, \"por que tentar ser justo em um mundo injusto?\""
 bp2_character_interaction.1001.desc_arrogant:0 "$bp2_character_interaction.desc_arrogant$\"Hah!\" zomba [recipient.GetFirstNameNoTooltip]. \"Você está, talvez, um pouco com inveja?\""
 bp2_character_interaction.1001.desc_brave_liege:0 "$bp2_character_interaction.desc_brave$\"[recipient.GetFaith.HighGodName] e [recipient.GetLiege.GetPrimaryTitle.GetNameNoTier]!\" exclama [recipient.GetFirstNameNoTooltip]. \"Eu não vou falhar!\""
 bp2_character_interaction.1001.desc_brave_root:0 "$bp2_character_interaction.desc_brave$\"[recipient.GetFaith.HighGodName] e [ROOT.Char.GetPrimaryTitle.GetNameNoTier]!\" exclama [recipient.GetFirstNameNoTooltip]. \"Eu não vou falhar!\""
 bp2_character_interaction.1001.desc_brave_self:0 "$bp2_character_interaction.desc_brave$\"[recipient.GetFaith.HighGodName] e [recipient.GetPrimaryTitle.GetNameNoTier]!\" grita [recipient.GetFirstNameNoTooltip]. \"Eu não vou falhar!\""
 bp2_character_interaction.1001.desc_callous:0 "$bp2_character_interaction.desc_callous$\"Eca,\" zomba [recipient.GetFirstNameNoTooltip], \"Não.\""
 bp2_character_interaction.1001.desc_calm:0 "$bp2_character_interaction.desc_calm$Depois de uma pausa, [recipient.GetFirstName] suspira e diz: \"Eu vou tentar.\""
 bp2_character_interaction.1001.desc_chaste:0 "$bp2_character_interaction.desc_chaste$\"Eu juro,\" efunde [recipient.GetFirstNameNoTooltip], \"abominar a carne!\""
 bp2_character_interaction.1001.desc_compassionate:0 "$bp2_character_interaction.desc_compassionate$\"Vou tentar ser nobre por todos os meus dias!\" chora [recipient.GetFirstNameNoTooltip]."
 bp2_character_interaction.1001.desc_content:0 "$bp2_character_interaction.desc_content$\"Sou grato — sou! Grato por este tempo com você, [recipient.Custom2('RelationToMeShort', ROOT.Char)],\" irradia [recipient.GetFirstNameNoTooltip]."
 bp2_character_interaction.1001.desc_craven:0 "$bp2_character_interaction.desc_craven$[recipient.GetFirstNameNoTooltip] se humilha. \"Por favor, não me machuque!\" [recipient.GetSheHe] implora."
 bp2_character_interaction.1001.desc_cynical:0 "$bp2_character_interaction.desc_cynical$\"Eu vejo...\" luta [recipient.GetFirstNameNoTooltip], \"um mundo triste.\""
 bp2_character_interaction.1001.desc_deceitful:0 "$bp2_character_interaction.desc_deceitful$\"Oh, meu(a) [recipient.Custom2('RelationToMeShort', ROOT.Char)]! Você é a cobra que eu mais amo,\" mente [recipient.GetFirstNameNoTooltip]."
 bp2_character_interaction.1001.desc_diligent:0 "$bp2_character_interaction.desc_diligent$[recipient.GetFirstNameNoTooltip] se levanta. \"Eu não vou te decepcionar, [recipient.Custom2('RelationToMeShort', ROOT.Char)]!\""
 bp2_character_interaction.1001.desc_eccentric:0 "$bp2_character_interaction.desc_eccentric$\"Rindo, meu(a) [ROOT.Char.Custom2('RelationToMeShort', recipient)] mostra a língua em acordo."
 bp2_character_interaction.1001.desc_fickle:0 "$bp2_character_interaction.desc_fickle$[recipient.GetSheHe|U] dá de ombros e diz: \"Claro. De qualquer forma, eu não estou mais interessado nessas coisas.\""
 bp2_character_interaction.1001.desc_forgiving:0 "$bp2_character_interaction.desc_forgiving$\"Sim,\" suspira [recipient.GetSheHe], \"Vou me lembrar disso.\""
 bp2_character_interaction.1001.desc_generous:0 "$bp2_character_interaction.desc_generous$\"Enquanto você viver por mim,\" suspira [recipient.GetFirstNameNoTooltip], \"eu posso tentar viver por outros.\""
 bp2_character_interaction.1001.desc_gluttonous:0 "$bp2_character_interaction.desc_gluttonous$\"\"Com prazer!\" [recipient.GetSheHe] arrota."
 bp2_character_interaction.1001.desc_greedy:0 "$bp2_character_interaction.desc_greedy$\"\"Ou,\" [recipient.GetSheHe] responde. \"Talvez uma troca... uma #EMP muito#! vantajosa troca..."
 bp2_character_interaction.1001.desc_gregarious:0 "$bp2_character_interaction.desc_gregarious$\"Certo,\" sorri [recipient.GetFirstNameNoTooltip]. \"Me ensine.\""
 bp2_character_interaction.1001.desc_honest:0 "$bp2_character_interaction.desc_honest$\"Bem... eu menti antes,\" admite [recipient.GetFirstNameNoTooltip]. \"Mas eu quero ser como você, [recipient.Custom2('RelationToMeShort', ROOT.Char)]. Bom e verdadeiro!\""
 bp2_character_interaction.1001.desc_humble:0 "$bp2_character_interaction.desc_humble$\"Por favor!\" implora [recipient.GetFirstNameNoTooltip]. \"Me perdoe!\""
 bp2_character_interaction.1001.desc_impatient:0 "$bp2_character_interaction.desc_impatient$\"Nunca vou esperar por você novamente!\" [recipient.GetFirstNameNoTooltip] uiva. \"#EMP Eu juro isso!#!\""
 bp2_character_interaction.1001.desc_intro:0 "Me aproximo [Select_CString( recipient.IsFemale, 'da minha', 'do meu' )] [ROOT.Char.Custom2('RelationToMeShort', recipient)] [recipient.GetFirstName]"
 bp2_character_interaction.1001.desc_just:0 "$bp2_character_interaction.desc_just$\"Não seja um tirano, [ROOT.Char.GetTitleAsNameNoTooltip]! Isso não é certo!\"\n\n\"De fato,\" eu sorrio. \"Isso é injusto.\""
 bp2_character_interaction.1001.desc_lazy:0 "$bp2_character_interaction.desc_lazy$Com um pequeno bocejo, [recipient.GetFirstNameNoTooltip] concorda. \"Ah, sim!\""
 bp2_character_interaction.1001.desc_lustful:0 "$bp2_character_interaction.desc_lustful$\"Ah, isso é bom,\" [recipient.GetSheHe] ri. \"Talvez um dia eu tenha beijado todo o [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l]!\""
 bp2_character_interaction.1001.desc_paranoid:0 "$bp2_character_interaction.desc_paranoid$[recipient.GetFirstNameNoTooltip] corre para minha proteção, revelando uma adaga habilmente escondida."
 bp2_character_interaction.1001.desc_patient:0 "$bp2_character_interaction.desc_patient$[recipient.GetFirstNameNoTooltip] sorri. \"Foi bom ter tempo para pensar.\""
 bp2_character_interaction.1001.desc_sadistic:0 "$bp2_character_interaction.desc_sadistic$\"Sim,\" sussurra [recipient.GetFirstNameNoTooltip], \"Sim, eu gostaria...\""
 bp2_character_interaction.1001.desc_shy:0 "$bp2_character_interaction.desc_shy$[recipient.GetFirstNameNoTooltip] murmura consentimento, evitando contato visual comigo."
 bp2_character_interaction.1001.desc_stubborn:0 "$bp2_character_interaction.desc_stubborn$\"Sim,\" reflete [recipient.GetSheHe], \"eu sei o que eu quero! Por que eu deixaria alguém me mudar?\""
 bp2_character_interaction.1001.desc_temperate:0 "$bp2_character_interaction.desc_temperate$\"\"Eu juro,\" [recipient.GetSheHe] então. \"[Select_CString( ROOT.Char.IsFemale, 'Minha', 'Meu' )] [recipient.Custom2('RelationToMeShort', ROOT.Char)], estou tão [Select_CString( recipient.IsFemale, 'envergonhada', 'envergonhado' )]...\""
 bp2_character_interaction.1001.desc_trusting:0 "$bp2_character_interaction.desc_trusting$Uma lágrima se formando nos olhos, [recipient.GetFirstNameNoTooltip] responde: \"Eu confio em você.\""
 bp2_character_interaction.1001.desc_vengeful:0 "$bp2_character_interaction.desc_vengeful$\"Vingança,\" ri [recipient.GetFirstName], \"Eu tenho algumas ideias...\""
 bp2_character_interaction.1001.desc_wrathful:0 "$bp2_character_interaction.desc_wrathful$\"Só espere,\" [recipient.GetSheHe] grita, \"os tolos aprenderão #EMP Eu respiro fogo!#!\""
 bp2_character_interaction.1001.desc_zealous:0 "$bp2_character_interaction.desc_zealous$\"Estou arrepiado, [recipient.Custom2('RelationToMeShort', ROOT.Char)]!\" grita [recipient.GetFirstNameNoTooltip]. \"Sinto o favor de [recipient.GetFaith.HighGodName]!\""
 bp2_character_interaction.1001.t:0 "$influence_child_personality_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Successo"
 bp2_character_interaction.1002.a.flavor:0 "Suas ensinamentos caem em ouvidos relutantes."
 bp2_character_interaction.1002.a.tt:0 "Falha ao passar a característica [target_trait.GetNameNoTooltip(GetPlayer)|l]"
 bp2_character_interaction.1002.a:0 "Algum dia eu alcançarei essa [recipient.Custom('GetLassLad')]...?"
 bp2_character_interaction.1002.desc_ambitious:0 "$bp2_character_interaction.desc_ambitious$Eu... não me importo,\" suspira [recipient.GetFirstNameNoTooltip]. \"Vou definhar de qualquer maneira."
 bp2_character_interaction.1002.desc_arbitrary:0 "$bp2_character_interaction.desc_arbitrary$Talvez isso seja seu direito como [ROOT.Char.GetTitleAsNameNoTooltip],\" responde [recipient.GetFirstNameNoTooltip], \"Mas eu não sou #EMP permitido#! o mesmo..."
 bp2_character_interaction.1002.desc_arrogant:0 "$bp2_character_interaction.desc_arrogant$Eu não sei... talvez eu tenha ganhado por acaso..."
 bp2_character_interaction.1002.desc_brave:0 "$bp2_character_interaction.desc_brave$Mas... eu,\" geme [recipient.GetFirstNameNoTooltip]. \"Eu não quero morrer..."
 bp2_character_interaction.1002.desc_callous:0 "$bp2_character_interaction.desc_callous$Bem, alguém tem que cuidar dessas almas pobres!"
 bp2_character_interaction.1002.desc_calm:0 "$bp2_character_interaction.desc_calm$Meu julgamento é claro!\" retruca [recipient.GetFirstNameNoTooltip]. \"Eu julgo isso como estúpido!"
 bp2_character_interaction.1002.desc_chaste:0 "$bp2_character_interaction.desc_chaste$Mas...\" lamenta [recipient.GetFirstNameNoTooltip], \"meu coração não me trairia assim!"
 bp2_character_interaction.1002.desc_compassionate:0 "$bp2_character_interaction.desc_compassionate$Bondade? Eu poderia ser ferido em seguida — e como a bondade me protegeria?!\""
 bp2_character_interaction.1002.desc_content:0 "$bp2_character_interaction.desc_content$Mas um dia,\" murmura [recipient.GetFirstNameNoTooltip], \"um dia eu terei muito mais..."
 bp2_character_interaction.1002.desc_craven:0 "$bp2_character_interaction.desc_craven$Me solte!\" grita [recipient.GetFirstNameNoTooltip]. \"Como um [recipient.Custom('KnightCultureNoTooltip')|l] nobre, eu não temo a morte!"
 bp2_character_interaction.1002.desc_cynical:0 "$bp2_character_interaction.desc_cynical$Vejo a ordem escolhida por [recipient.GetFaith.HighGodNamePossessive]!\" retruca [recipient.GetFirstNameNoTooltip], \"E [recipient.GetFaith.HighGodName] é bom!"
 bp2_character_interaction.1002.desc_deceitful:0 "$bp2_character_interaction.desc_deceitful$Há um poço, sim,\" retruca [recipient.GetFirstNameNoTooltip], \"Mas eu acho que só há cobras presas dentro."
 bp2_character_interaction.1002.desc_diligent:0 "$bp2_character_interaction.desc_diligent$Eu não sei o que fazer!\" lamenta [recipient.GetFirstNameNoTooltip]. \"Por favor, me deixe sozinho..."
 bp2_character_interaction.1002.desc_eccentric:0 "$bp2_character_interaction.desc_eccentric$Eu acho,\" [recipient.GetSheHe] se encolhe, \"que eu preferiria me encaixar...\""
 bp2_character_interaction.1002.desc_fickle:0 "$bp2_character_interaction.desc_fickle$Mas,\" [recipient.GetSheHe] protesta, \"eu dei minha palavra aos meus amigos!"
 bp2_character_interaction.1002.desc_forgiving:0 "$bp2_character_interaction.desc_forgiving$\"Apenas um #EMP amigo?!#!\" [recipient.GetSheHe] uiva. \"Não! Eu ainda seria perseguido por um #EMP trapaceiro#!"
 bp2_character_interaction.1002.desc_generous:0 "$bp2_character_interaction.desc_generous$Me dê um novo chapéu dourado,\" implora [recipient.GetFirstNameNoTooltip], \"E eu vou #EMP pensar#! nisso..."
 bp2_character_interaction.1002.desc_gluttonous:0 "$bp2_character_interaction.desc_gluttonous$Mas... eu só quero sentir #EMP controle#!..."
 bp2_character_interaction.1002.desc_greedy:0 "$bp2_character_interaction.desc_greedy$Uma pedra?\" pergunta [recipient.GetSheHe]. \"Sim... eu acho que ninguém gosta de alguém duro como uma pedra..."
 bp2_character_interaction.1002.desc_gregarious:0 "$bp2_character_interaction.desc_gregarious$Por favor...\" [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.Custom('GirlBoy')] se encolhe, \"me deixe sozinh[Select_CString( recipient.IsFemale, 'a', 'o' )]."
 bp2_character_interaction.1002.desc_honest:0 "$bp2_character_interaction.desc_honest$\"Eu? Claro que não,\" insiste [recipient.GetFirstNameNoTooltip], vazia. \"Como eu disse... eu sou sempre verdadeiro."
 bp2_character_interaction.1002.desc_humble:0 "$bp2_character_interaction.desc_humble$Em breve...\" murmura [recipient.GetName]. \"Em breve, serei imbatível..."
 bp2_character_interaction.1002.desc_impatient:0 "$bp2_character_interaction.desc_impatient$Eh...\" eu ouço [recipient.GetFirstNameNoTooltip] resmungar, \"ficar de galinha foi bastante relaxante."
 bp2_character_interaction.1002.desc_intro:0 "$bp2_character_interaction.1001.desc_intro$"
 bp2_character_interaction.1002.desc_just:0 "$bp2_character_interaction.desc_just$\"Bem,\" diz [recipient.GetFirstName], sorrindo maliciosamente, \"se você insiste...\""
 bp2_character_interaction.1002.desc_lazy:0 "$bp2_character_interaction.desc_lazy$Não!\" responde [recipient.GetFirstNameNoTooltip]. \"Eu não posso falhar! Eu vou me esforçar mais."
 bp2_character_interaction.1002.desc_lustful:0 "$bp2_character_interaction.desc_lustful$Oh...\" [recipient.GetSheHe] resmunga. \"Mas há tantas coisas #EMP melhores#! para fazer..."
 bp2_character_interaction.1002.desc_paranoid:0 "$bp2_character_interaction.desc_paranoid$[recipient.GetFirstNameNoTooltip] ri."
 bp2_character_interaction.1002.desc_patient:0 "$bp2_character_interaction.desc_patient$Bem,\" resmunga [recipient.GetFirstNameNoTooltip], \"eu não quero ser uma galinha."
 bp2_character_interaction.1002.desc_sadistic:0 "$bp2_character_interaction.desc_sadistic$Nunca!\" [recipient.GetFirstNameNoTooltip] recua. \"Eu quero ser bom!"
 bp2_character_interaction.1002.desc_shy:0 "$bp2_character_interaction.desc_shy$Se você ouvisse as coisas que as pessoas dizem quando você não está lá, [recipient.Custom2('RelationToMeShort', ROOT.Char)]... você não se sentiria gracioso."
 bp2_character_interaction.1002.desc_stubborn:0 "$bp2_character_interaction.desc_stubborn$Talvez...\" [recipient.GetSheHe] suspira. \"Mas está tudo bem...\""
 bp2_character_interaction.1002.desc_temperate:0 "$bp2_character_interaction.desc_temperate$Mas — só um pouco de [recipient.Custom('GetLocalStreetFood')]?\" [recipient.GetSheHe] protesta. \"E [ROOT.Char.GetFaith.HealthGodName] permite tal alegria!"
 bp2_character_interaction.1002.desc_trusting:0 "$bp2_character_interaction.desc_trusting$Uh-huh,\" murmura [recipient.GetFirstNameNoTooltip]. \"#EMP Claro...\""
 bp2_character_interaction.1002.desc_vengeful:0 "$bp2_character_interaction.desc_vengeful$Mas... então ele nunca mais jogaria comigo..."
 bp2_character_interaction.1002.desc_wrathful:0 "$bp2_character_interaction.desc_wrathful$Mas...\" [recipient.GetSheHe] engole em seco, \"Eu nunca quero sentir isso de novo..."
 bp2_character_interaction.1002.desc_zealous:0 "$bp2_character_interaction.desc_zealous$Por favor, [recipient.Custom2('RelationToMeShort', ROOT.Char)],\" resmunga [recipient.GetFirstNameNoTooltip], \"Você acabou de cuspir em mim."
 bp2_character_interaction.1002.t:0 "$influence_child_personality_interaction$: [target_trait.GetNameNoTooltip(GetPlayer)] — Falhou"
 bp2_character_interaction.desc_ambitious:0 "$bp2_character_interaction.desc_ambitious_common$Prove a eles o quão tolos são! Mostre entusiasmo; esforce-se para ser mais do que você é. A menos que... você #EMP queira#! ser desprezado como uma criança... mesmo quando seu corpo murcha com a idade?\"\n\n"
 bp2_character_interaction.desc_ambitious_common:0 "com a pergunta: \"Você gosta de ser uma criança?\"\n\n\"Não,\" [recipient.GetSheHe] enruga o nariz, \"Os adultos me tratam como um cão! Eles sempre me dizem o que fazer!\"\n\n"
 bp2_character_interaction.desc_arbitrary:0 "$bp2_character_interaction.desc_arbitrary_common$Então jogue-o fora! É apenas um símbolo, [recipient.Custom('GirlBoy')]. Aja apenas com base em seus próprios sentimentos e julgamentos, desconsidere regras e leis, e você será livre para fazer o que desejar. Você pode ter tudo o que desejar.\"\n\n"
 bp2_character_interaction.desc_arbitrary_common:0 "trazendo o brinquedo favorito de outra criança [recipient.Custom( 'child_favorite_toy' )], dizendo: \"Você pode ter isso.\"\n\n\"Por quê?\" [recipient.GetSheHe] se pergunta. \"Eu nem quero isso.\"\n\n"
 bp2_character_interaction.desc_arrogant:0 "$bp2_character_interaction.desc_arrogant_common$\"Excelente. Isso, [recipient.Custom('GirlBoy')], é porque você tem um grande destino. Não tema o seu orgulho: apenas covardes não têm fé em suas habilidades! Deixe todos verem quem você é, e eles o honrarão como tal!\"\n\n"
 bp2_character_interaction.desc_arrogant_common:0 "e parabenizo [recipient.GetSheHe] por vencer um dos tutores [recipient.GetHerHim] em [SCOPE.Custom('BG_GameType_Generic')].\n\n\"Não foi nada,\" responde [recipient.GetSheHe]. \"Na verdade, eu venci a maioria dos adultos com quem joguei!\"\n\n"
 bp2_character_interaction.desc_brave:0 "$bp2_character_interaction.desc_craven_common$\"Faça isso!\" insisto, até ser atingido em meu rosto sorridente.\n\n\"Não tema nada, [recipient.Custom('GirlBoy')]! Pois se você pode me atingir, o que #EMP você não pode fazer?! Tente, esforce-se, falhe! Então você morrerá pela honra, pelo amor, pelo dever — todos melhores do que uma morte sem sentido!\"\n\n"
 bp2_character_interaction.desc_callous:0 "$bp2_character_interaction.desc_callous_common$\"Aquele servo,\" respondo, \"só fará seu trabalho por medo de espancamentos. Sem violência, sem força, nosso lugar neste mundo está perdido. Além disso... você deseja desperdiçar sua vida chorando por servos?\"\n\n"
 bp2_character_interaction.desc_callous_common:0 "em preocupação. [recipient.GetSheHe|U] esteve presente recentemente enquanto um dos meus [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] mutilava um servo desobediente.\n\nA criança temerosa pergunta: \"Por que as pessoas são tão violentas?\"\n\n"
 bp2_character_interaction.desc_calm:0 "$bp2_character_interaction.desc_wrathful_common$Ter [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l] e nobres ao seu comando? Eu perdi meu [recipient.Custom('GetAccessory')] favorito hoje e ninguém parece se importar...\"\n\n\"O poder começa com o poder sobre si mesmo,\" eu explico. \"Olhando para os outros, ficando chateado e reagindo, você está afastando sentimentos de impotência e tolice. Em vez disso, respire fundo e encontre julgamento claro.\"\n\n"
 bp2_character_interaction.desc_chaste:0 "com a pergunta: \"Olhar para outro alguém já acendeu seu coração?\"\n\n\"Sim...\" [recipient.GetSheHe] responde hesitante. \"Às vezes.\"\n\n\"Esse fogo deve ser extinguido. Enquanto seu coração arde com o fogo do [ROOT.Char.GetFaith.NegativeAfterLife], você acha que [ROOT.Char.GetFaith.FertilityGodName] irá te abençoar? Enquanto você se entrega a desejos obscuros? Não! Lembre-se, [recipient.Custom('GirlBoy')]: a luxúria é a ruína.\"\n\n"
 bp2_character_interaction.desc_compassionate:0 "$bp2_character_interaction.desc_callous_common$\"Seus corações são bons,\" murmuro, abraçando [recipient.GetSheHe]. \"Mas o poder pode cegar e a força pode escravizar. Não deixe que visões malignas ceguem seu coração: em vez disso, veja nelas a necessidade de bondade.\""
 bp2_character_interaction.desc_content:0 "$bp2_character_interaction.desc_ambitious_common$\"Mas,\" eu contraponho, \"você deseja resolver disputas de propriedade, calcular impostos e sentir que aqueles que você ama dependem de você completamente, sempre? Logo, brincar não será mais para você. Aproveite o que você tem, [recipient.Custom('GirlBoy')]. Aproveite profundamente.\"\n\n"
 bp2_character_interaction.desc_craven:0 "$bp2_character_interaction.desc_craven_common$Na verdade, eu sou, [recipient.Custom('GirlBoy')]. Colocar a mão em mim trará um terrível castigo. Você deve lembrar disso: o dever e a paixão podem destruir você igualmente. É melhor sobreviver do que morrer por tolice!\"\n\n"
 bp2_character_interaction.desc_craven_common:0 "e puxo [recipient.GetSheHe] pela gola, cuspindo: #EMP \"Me ataque!\"#!\n\n[recipient.GetSheHe|U] se acovarda, protestando: \"Mas você é o [ROOT.Char.GetTitleAsNameNoTooltip]!\"\n\n"
 bp2_character_interaction.desc_cynical:0 "$bp2_character_interaction.desc_cynical_common$Não apenas bom, mas também #EMP poderoso#!. [ROOT.Char.GetFaith.HighGodName] mantém a ordem nos reinos [recipient.GetFaith.GetAdjectiveNoTooltip]. E ao invocar o sagrado, [ROOT.Char.GetFaith.AltPriestTermPlural] podem imitar lordes e [ROOT.Char.GetFaith.DevoteeNeuterPlural] podem buscar ganho terreno. Você enxerga a mão de [ROOT.Char.GetFaith.HighGodName] nessas coisas? Ou os artifícios dos humanos?\"\n\n"
 bp2_character_interaction.desc_cynical_common:0 "com a pergunta: \"Por que eu sigo o [recipient.GetFaith.GetName]?\"\n\n\"Porque [ROOT.Char.GetFaith.HighGodName] é bom,\" [recipient.GetSheHe] recita.\n\n"
 bp2_character_interaction.desc_deceitful:0 "$bp2_character_interaction.desc_deceitful_common$Você está mentindo agora,\" eu dou risada. \"Mal. Quando você aprenderá a contar mentiras pequenas, mas constantes, todas com o sabor doce da verdade? Deseja ser um grande [recipient.GetWomanMan]? O mundo é um ninho de cobras, e apenas as mais astutas brilham no topo.\""
 bp2_character_interaction.desc_deceitful_common:0 "com a pergunta: \"Você mente para mim?\"\n\n\"Eu... uh... nunca!\"\n\n"
 bp2_character_interaction.desc_diligent:0 "$bp2_character_interaction.desc_lazy_common$O seu melhor? Eu não espero habilidade de você ainda, [recipient.Custom('GirlBoy')]. Eu espero perseverança. Você não sente a alegria do jogo quando fez um bom trabalho? Pare de duvidar, pensando — faça! Apenas faça!\"\n\n"
 bp2_character_interaction.desc_eccentric:0 "e habilmente joga um rato se contorcendo no colo [recipient.GetHerHim].\n\nDepois que [recipient.GetSheHe] termina de pular e gritar de surpresa, [recipient.GetSheHe] pergunta: \"Por quê? Por quê!\"\n\n\"Uma pessoa não deve viver envergonhada por suas peculiaridades. Especialmente não um [ROOT.Char.GetTitleAsNameNoTooltip]! Ignore expectativas, siga o seu próprio caminho, e você se tornará... algo. Algo grandioso.\""
 bp2_character_interaction.desc_fickle:0 "por impulso, perguntando: \"Quais alegrias nos esperam hoje?\"\n\nEnquanto [recipient.GetSheHe] lista planos, eu me encolho.\n\n\"Como um inimigo poderia facilmente rastrear seus movimentos! Pense em como essas mesmas delícias logo se tornarão monótonas! É possível planejar sentir alegria? Conhecer a dor? Não! Deixe-se livre para fazer o que quiser.\""
 bp2_character_interaction.desc_forgiving:0 "enquanto [recipient.GetSheHe] lamenta de mau humor por um jogo perdido de [ROOT.Char.Custom('BG_GameType_Generic')].\n\n\"A vigarista trapaceou!\" insiste [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.Custom('GirlBoy')]. \"Ela merecia aquele pedaço no olho! Mas... ela não quer ser mais minha amiga...\"\n\nAproveito o momento, dizendo: \"Pense sobre o perdão. Deixe-o viver em seu coração, sempre. Se você tivesse mostrado misericórdia à trapaceira, você não teria agora mais uma amiga?\"\n\n"
 bp2_character_interaction.desc_generous:0 "$bp2_character_interaction.desc_greedy_common$Quantas brigas acontecem por coisas insignificantes? Abaixe seu arco, [recipient.Custom('GirlBoy')]. Você nunca perderá algo tão querido quanto a honra. E, sendo sábio, qualquer coisa dada ainda lhe servirá.\"\n\n"
 bp2_character_interaction.desc_gluttonous:0 "$bp2_character_interaction.desc_gluttonous_common$\"Os criados te trouxeram mais alguma coisa?\" Eu sorrio. \"Estou #EMP faminto!#!\"\n\nEnquanto compartilhamos a refeição, [Select_CString( recipient.IsFemale, 'incentivo a', 'incentivo o' )] [recipient.Custom('GirlBoy')] a comer, comer, para que [recipient.GetSheHe] possa crescer forte. \"Não tenha vergonha de sonhos e desejos! Desfrute de todas as bênçãos da corte.\"\n\n"
 bp2_character_interaction.desc_gluttonous_common:0 "e a sua cara culpada e oleosa, perguntando [recipient.GetSheHe]: \"O que você comeu...?\"\n\n\"Oh! Como esse [recipient.Custom('GetLocalStreetFood')] chegou aqui?\"\n\n"
 bp2_character_interaction.desc_greedy:0 "$bp2_character_interaction.desc_greedy_common$\"\"Fique calmo, pois a mente calculista é a que mais prospera. Sim, todos irão suplicar, mas, uma vez que saibam que você protege o que é seu, eles se rendem. Nenhum deles pode tirar sangue de uma pedra! Não dê nem sangue nem ouro, [recipient.GetFirstNameNoTooltip].\"\n\n"
 bp2_character_interaction.desc_greedy_common:0 "enquanto [recipient.GetSheHe] empunha um arco, gritando o nome de outro jovem.\n\n\"Um dos escudeiros dos [ROOT.Char.Custom('KnightCulturePluralNoTooltip')|l]!\" grita [recipient.GetSheHe]. \"Vou perfurar a garganta dele por suplicar por algo que é meu!\"\n\n"
 bp2_character_interaction.desc_gregarious:0 "$bp2_character_interaction.desc_shy_common$\"Pense,\" respondo. \"Existem memórias queridas de momentos sozinho? Onde está a excitação, o calor e o amor? Se você quiser, posso ensinar a contar histórias, a fazer piadas: o riso e os cochichos estarão sob o seu comando!\"\n\n"
 bp2_character_interaction.desc_honest:0 "$bp2_character_interaction.desc_deceitful_common$Talvez. Isso é algo que eu não posso saber,\" eu explico. \"Mas você não pode #EMP ser#! [Select_CString( recipient.IsFemale, 'uma mentirosa', 'um mentiroso' )], [recipient.Custom('GirlBoy')]? Eu conheço um mentiroso: [recipient.GetSheHe] é uma pessoa sem honra, sem consideração pelo que pode acontecer com a falsidade... é isso que você quer ser?\"\n\n"
 bp2_character_interaction.desc_humble:0 "$bp2_character_interaction.desc_arrogant_common$Gostaria de enfrentar... eu? Vamos convidar todos os [ROOT.Char.GetPrimaryTitle.GetTierAsName],\" finjo, enquanto [recipient.GetFirstNameNoTooltip] encolhe e protesta.\n\n\"Devemos tomar cuidado,\" digo eu, \"para não nos intoxicarmos com nossas virtudes a ponto de mostrarmos desrespeito, de nos julgarmos mal\"\n\n"
 bp2_character_interaction.desc_impatient:0 "$bp2_character_interaction.desc_impatient_common$Eu dou um tapa na palma [recipient.GetHerHim], rachando o ovo. Goo envolve a mão [recipient.GetHerHim] — choque, o rosto [recipient.GetHerHim]!\n\n\"Você desperdiçou o dia, [recipient.Custom('GirlBoy')]...\" eu digo, enquanto vou embora.\n\n"
 bp2_character_interaction.desc_impatient_common:0 "e coloco um ovo na mão [recipient.GetHerHim], dizendo: \"Segure isso. Eu vou voltar.\"\n\nEu parto, indo sobre o meu dia. Depois de horas, volto para encontrar [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.Custom('GirlBoy')] encolhido no mesmo banco, ainda segurando o ovo.\n\n"
 bp2_character_interaction.desc_just:0 "$bp2_character_interaction.desc_arbitrary_common$\"Não? Por quê? É natural desejar o que não é seu, se empolgar ao superar os outros. Por que não pegar o que puder e permitir que eu use meu poder como desejar?\"\n\n"
 bp2_character_interaction.desc_lazy:0 "$bp2_character_interaction.desc_lazy_common$Na verdade... atingir padrões sem esforço é tão bom quanto superá-los,\" digo, bagunçando o cabelo [recipient.GetHerHim]. \"Você se tornará o que será, independentemente. Vamos cortar toda a pompa de 'serviço' de uma vez! Tire sonecas com mais frequência, talvez.\""
 bp2_character_interaction.desc_lazy_common:0 "e pergunto: \"Quando eu te chamo para me acompanhar, você serve bem?\"\n\n\"Eu... eu faço o meu melhor, [ROOT.Char.GetTitleAsNameNoTooltip].\"\n\n"
 bp2_character_interaction.desc_lustful:0 "com a pergunta: \"Você já conheceu o amor?\"\n\n\"Sim,\" [recipient.GetSheHe] responde timidamente. \"Eu amo meus parentes! E... bem... tem alguém em quem não consigo parar de pensar...\"\n\n\"Pursua esse sentimento, [recipient.Custom('GirlBoy')]. O romance e a satisfação não apenas acontecem; eles devem ser perseguidos! Abraçe essa caçada, pois seu desejo é simplesmente humano.\"\n\n"
 bp2_character_interaction.desc_paranoid:0 "$bp2_character_interaction.desc_paranoid_common$\"Então acredite em mim quando digo... na corte, estamos sempre sendo observados. Ouça os sussurros pelas suas costas. Nem mesmo... nem mesmo confie em mim...\"\n\nUm rosto escurece uma janela próxima. \"#EMP Rápido!#!\" eu sibilo. \"Fique atrás de mim, [recipient.Custom('GirlBoy')]!\"\n\n"
 bp2_character_interaction.desc_paranoid_common:0 "com a pergunta: \"Em quem você confia mais?\"\n\n\"Claro — em você,\" [recipient.GetSheHe] responde obedientemente.\n\n"
 bp2_character_interaction.desc_patient:0 "$bp2_character_interaction.desc_impatient_common$Pegando-o [recipient.GetHerHim], eu abraço [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.Custom('GirlBoy')]. \"Estou tão orgulhoso de você. Como a galinha nutre a vida? Como o galo vigilante protege suas parceiras? Paciência.\"\n\n"
 bp2_character_interaction.desc_sadistic:0 "$bp2_character_interaction.desc_callous_common$O mundo é violência,\" eu respondo. \"As pessoas são fracas e egoístas, criança. E são muitas. Derramar o sangue delas é sem sentido. Pense no poder que meu [ROOT.Char.Custom('KnightCultureNoTooltip')|l] sentiu. Você gostaria desse poder, não é mesmo...?\"\n\n"
 bp2_character_interaction.desc_shy:0 "$bp2_character_interaction.desc_shy_common$Isso nunca muda, receio,\" suspiro. \"Você sempre enfrentará pedidos para passar tempo com os outros, para ser apenas um rosto público sem alma privada. Mantenha-se firme. Há graça na solidão.\"\n\n"
 bp2_character_interaction.desc_shy_common:0 "enquanto [recipient.GetSheHe] brinca sozinho, algo que [recipient.GetSheHe] tem feito com frequência ultimamente. Pergunto: \"Por quê?\"\n\n\"Qual é o sentido disso, meu(a) [recipient.Custom2('RelationToMeShort', ROOT.Char)]? Todo esse riso, os cochichos... é tudo um desperdício.\"\n\n"
 bp2_character_interaction.desc_stubborn:0 "cheio de convicção, perguntando: \"Quais alegrias nos esperam hoje?\"\n\n\"Oh... meus amigos me convenceram a pegar flores estúpidas novamente...\"\n\n\"[recipient.GetFirstNameNoTooltip]!\" eu exclamo. \"Quanto da sua vida você vai desperdiçar nos caprichos dos outros? Defenda seus julgamentos; mantenha-se firme como um [ROOT.Char.Custom('KnightCultureNoTooltip')|l]! Você não acha que a sua escolha será a mais divertida?\"\n\n"
 bp2_character_interaction.desc_temperate:0 "$bp2_character_interaction.desc_gluttonous_common$Eu pego o [recipient.Custom('GetLocalStreetFood')] e jogo-o para longe. \"Você não tem #EMP paciência?! Nenhum controle?#! Jure moderar-se em todas as coisas, [recipient.Custom('GirlBoy')]. Jure sua contenção a [ROOT.Char.GetFaith.HealthGodName]! O mundo não precisa de mais um degenerado.\"\n\n"
 bp2_character_interaction.desc_trusting:0 "$bp2_character_interaction.desc_paranoid_common$Eu me ajoelho diante [recipient.GetHerHim] e seguro sua mão na minha.\n\n\"Eu juro nunca te decepcionar, criança. Você #EMP deve#! confiar nos outros para sobreviver neste mundo mortal, e entre aqueles em quem você pode depender... sempre serei eu.\""
 bp2_character_interaction.desc_vengeful:0 "enquanto [recipient.GetSheHe] lamenta de mau humor por um jogo perdido de [ROOT.Char.Custom('BG_GameType_Generic')].\n\n\"O canalha trapaceou!\" insiste [Select_CString( recipient.IsFemale, 'a', 'o' )] [recipient.Custom('GirlBoy')]. \"Será que meus amigos nunca vão parar de tentar me superar?\"\n\nAproveito o momento, dizendo: \"Eles sabem que podem passar por cima de você, criança, sem medo. Coloque um pedaço no olho do trapaceiro! Quebre o tabuleiro nas costas do trapaceiro! Deixe todos saberem que você não perdoa injustiças!\"\n\n"
 bp2_character_interaction.desc_wrathful:0 "$bp2_character_interaction.desc_wrathful_common$Uma pequena chama brilha nos olhos [recipient.GetHerHim], enquanto eu respondo. \"Poder é liberdade na raiva. Liberdade para derrubar, humilhar, aqueles que lhe trazem ira.\"\n\n\"Como quando [Select_CString( recipient.IsFemale, 'alguma', 'algum' )] [recipient.Custom('GirlBoy')] idiota rasgou minha capa! Eu nunca me senti mais fervoroso,\" reclama [recipient.GetSheHe], enquanto eu concordo.\n\n"
 bp2_character_interaction.desc_wrathful_common:0 "com a pergunta: \"O que é poder?\"\n\n"
 bp2_character_interaction.desc_zealous:0 "$bp2_character_interaction.desc_cynical_common$\"Sim. Sua bondade é de [ROOT.Char.GetFaith.HighGodNamePossessive]. Sua sabedoria é de [ROOT.Char.GetFaith.KnowledgeGodNamePossessive]. Sua coragem é de [ROOT.Char.GetFaith.WarGodNamePossessive]. Você deseja estar sozinho neste mundo, vazio? Ou será um porta-voz do divino? Posso guiá-lo até lá.\""
