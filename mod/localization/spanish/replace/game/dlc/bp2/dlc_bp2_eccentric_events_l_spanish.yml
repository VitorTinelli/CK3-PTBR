l_spanish:
 bird_cruelty:0 "Crueldade com Pássaros"
 bird_cruelty_desc:0 "Este personagem tem exagerado recentemente em relação aos pássaros. Mesmo um leve piar ou grasnar do lado de fora parece ser o suficiente para deixá-los furiosos."
 bp2_yearly.8000.a:0 "Vou ensinar [hostage.GetSheHe] pessoalmente."
 bp2_yearly.8000.b.tt:0 "[hostage.GetFirstNameNoTooltip|U] será desencorajado de aprender sua [court_language|E]"
 bp2_yearly.8000.b:0 "Que tentativa patética de [ROOT.Char.GetCourtLanguage.GetNameNoTooltip]."
 bp2_yearly.8000.c:0 "Isso é legal."
 bp2_yearly.8000.desc.chaplain:0 "[hostage.GetFirstNameNoTooltip|U] me diz que seus educadores do clero, como [tutor.Custom2('MyCharacterIntroduction', ROOT.Char)], merecem créditos pelo domínio de sua língua da corte."
 bp2_yearly.8000.desc.guardian:0 "É evidente que [hostage.GetFirstNameNoTooltip] e [tutor.GetFirstName] estão desenvolvendo um vínculo bastante forte, e posso esperar surpresas ainda mais bem-vindas na educação [hostage.GetHerHim]."
 bp2_yearly.8000.desc.intro:0 "[hostage.Custom2('MyCharacterIntroduction', ROOT.Char)|U] tem falado comigo exclusivamente em [ROOT.Char.GetCourtLanguage.GetNameNoTooltip], e [hostage.GetSheHe] faz isso com notável proficiência.\n\n"
 bp2_yearly.8000.desc.tutor:0 "Sem dúvida, é o tempo todo sob os cuidados do meu tutor da corte, [tutor.GetFirstName], que tornou essa criança um raio de luz brilhante para o idioma, e estou ansioso para ver seu domínio da língua da corte avançar ainda mais."
 bp2_yearly.8000.t:0 "À Minha Imagem"
 bp2_yearly.8010.a.failure:0 "Você não consegue ensinar o [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]"
 bp2_yearly.8010.a.success:0 "Você ensina com sucesso o [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]"
 bp2_yearly.8010.a.tt:0 "Você passa as próximas aulas falando o [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip] básico"
 bp2_yearly.8010.a:0 "Talvez eu devesse ensinar [child.GetSheHe] rudimentos do [ROOT.Char.GetCulture.GetLanguage.GetNameNoTooltip]."
 bp2_yearly.8010.b.failure:0 "Você é ainda mais humilhado"
 bp2_yearly.8010.b.success:0 "Você zomba com sucesso da criança"
 bp2_yearly.8010.b:0 "\"Não, #EMP você#! fala engraçado!\""
 bp2_yearly.8010.c:0 "Ok."
 bp2_yearly.8010.d.tt:0 "Você passa a aula inventando uma língua secreta juntos"
 bp2_yearly.8010.d:0 "Oway areway uway?"
 bp2_yearly.8010.desc:0 "Estou no meio de uma aula com [child.Custom2('MyCharacterIntroduction', ROOT.Char)], e o sorriso contido [child.GetHerHim] me faz suspeitar que [child.GetSheHe] não está prestando atenção em uma palavra que digo. De vez em quando, [child.GetSheHe] apenas repete algo que eu disse com alguma voz estranha.\n\n\"O que você está fazendo?\"\n\n\"O que você está fazendo?\" [Select_CString( child.IsFemale, 'A', 'O' )] [child.Custom2('InsultNoun', ROOT.Char)] explode em risos. \"Desculpe, seu sotaque é tão engraçado!\""
 bp2_yearly.8010.t:0 "Fala Engraçada"
 bp2_yearly.8020.a.lose:0 "Você perdeu..."
 bp2_yearly.8020.a.win:0 "Você venceu!"
 bp2_yearly.8020.a:0 "Vamos correr em pernas de pau!"
 bp2_yearly.8020.b:0 "Vamos brincar com o teetotum!"
 bp2_yearly.8020.c:0 "Todos ganham com marionetes."
 bp2_yearly.8020.desc:0 "Tenho brincado com [other_child.Custom2('MyCharacterIntroduction', ROOT.Char)] durante boa parte do dia e me divertindo muito! Jogamos [ROOT.Char.Custom('BG_GameType_Generic')] e, quando nosso jogo está chegando ao fim, [other_child.GetSheHe] me vence e eu fico sem palavras.\n\n\"Isso foi divertido! Agora, o que vamos fazer?\"\n\nEsta é a minha chance de escolher algo em que eu ainda posso ganhar..."
 bp2_yearly.8020.t:0 "O Que Você Quer Fazer?"
 bp2_yearly.8021.a:0 "Isso foi muito fácil! Perdedor!"
 bp2_yearly.8021.b:0 "Bom jogo."
 bp2_yearly.8021.c:0 "Eu disse que o vencedor teria um favor..."
 bp2_yearly.8021.desc.intro:0 "Deixamos o tabuleiro de jogo de lado e preparamos"
 bp2_yearly.8021.desc.stilts.outro:0 "\n\n[other_child.GetFirstNameNoTooltip|U] mal percorre alguns metros antes de cair de cara no chão, me deixando como vencedor. Dominando meu oponente com minhas pernas de pau poderosas, estou livre para pegar meu prêmio."
 bp2_yearly.8021.desc.stilts:0 "nossas pernas de pau. Sou erguido no ar, quase tão alto quanto um adulto, e minhas pernas pequenas lutam para me manter no alto a essas alturas impressionantes. Assim que meu oponente se levanta e encontra seu equilíbrio instável, começamos!"
 bp2_yearly.8021.desc.teetotum.outro:0 "sozinho com todas as bolas no final. [other_child.GetFirstNameNoTooltip|U] solta um suspiro derrotado, e eu sou orgulhosamente o proprietário de todas as bolas."
 bp2_yearly.8021.desc.teetotum:0 "o teetotum. Gira e gira, cada um de nós apostando nossas bolas nele. Embora não haja nada de valor em jogo, sinto meu coração acelerar quando ele cai de lado.\n\nO jogo vai e vem, bolas trocando de mãos, mas logo eu me encontro"
 bp2_yearly.8021.t:0 "O Jogo"
 bp2_yearly.8022.a.mean:0 "\"Cala a boca! Eu te odeio!\""
 bp2_yearly.8022.a:0 "Tanto faz."
 bp2_yearly.8022.b:0 "\"Guardas!\""
 bp2_yearly.8022.c:0 "\"Sim, deveríamos jogar de novo!\""
 bp2_yearly.8022.desc.normal_child:0 "\n\n\"Isso foi muito divertido!\""
 bp2_yearly.8022.desc.rubbed_it_in:0 "\n\n[other_child.GetSheHe|U] está longe de ser humilde na vitória, zombando e menosprezando-me por perder."
 bp2_yearly.8022.desc.stilts.outro:0 "\n\nEstou correndo o mais rápido que posso com meus pés instáveis, mas depois de apenas alguns metros, caio de cara no chão e [other_child.GetFirstNameNoTooltip] é o vencedor."
 bp2_yearly.8022.desc.teetotum.outro:0 "Estou completamente sem bolas, tornando [other_child.GetFirstNameNoTooltip] o vencedor."
 bp2_yearly.8030.a:0 "[child_1.GetFirstNameNoTooltip] adoraria isso!"
 bp2_yearly.8030.b:0 "Esta boneca me lembra muito [child_2.GetFirstNameNoTooltip]."
 bp2_yearly.8030.desc:0 "Chamas e gritos me cercam em [ROOT.Char.GetCurrentLocation.GetName] enquanto meu exército saqueia em busca de bens valiosos e prisioneiros. O fedor acre de carne queimada preenche o ar.\n\nEm meio aos escombros, uma pequena boneca jaz abandonada. Seus pequenos olhos de botão e sorriso costurado à mão me lembram da inocência que me espera em casa.\n\nMesmo coberto de lama, seu cabelo macio parece tão delicado em minha mão. Não consigo evitar pensar que seria um presente perfeito para uma das crianças da corte."
 bp2_yearly.8030.t:0 "Uma Boneca Solitária"
 bp2_yearly.8040.a:0 "Vou confessar meu amor!"
 bp2_yearly.8040.b:0 "Devo deixar de lado esses pensamentos infantis."
 bp2_yearly.8040.c:0 "Nos casaremos de manhã!"
 bp2_yearly.8040.desc.intro:0 "Já faz um bom tempo desde que vi minha antiga paixão, [crush.GetFirstName]."
 bp2_yearly.8040.desc.mid.different_location:0 "Mesmo após todos esses anos, o pensamento [crush.GetHerHim] como o objeto de minha infatuação de infância ocupa minha mente nas horas da meia-noite.\n\n[crush.GetSheHe|U] é um[Select_CString( crush.IsFemale, 'a', '' )] [crush.GetWomanMan] agora, e não posso deixar de me sentir alcançando minha pena quando penso n[crush.GetSheHe]."
 bp2_yearly.8040.desc.mid.same_location:0 "Então, vejo [crush.GetSheHe] entrar na minha [ROOT.Char.Custom('GetCourt')], tão radiante como sempre, uma visão de [ROOT.Char.GetFaith.PositiveAfterLife] se é que já houve uma. Sinto meu coração acelerar e minhas mãos suarem, assim como acontecia quando eu era apenas [Select_CString( ROOT.Char.IsFemale, 'uma', 'um' )] [ROOT.Char.Custom('GirlBoy')].\n\nÉ difícil acreditar que [crush.GetSheHe] é [Select_CString( crush.IsFemale, 'a mesma', 'o mesmo' )] [crush.Custom('GirlBoy')] por quem eu me encantava na juventude, e mais difícil ainda acreditar que meus sentimentos permanecem inalterados."
 bp2_yearly.8040.desc.outro:0 "Talvez eu deva finalmente tornar meus sentimentos conhecidos."
 bp2_yearly.8040.t:0 "[crush.GetSheHe|U] é um[Select_CString( crush.IsFemale, 'a', '' )] [crush.GetWomanMan|U] Agora"
 bp2_yearly.8041.a:0 "Eu retribuo o amor [crushee.GetHerHim]!"
 bp2_yearly.8041.b:0 "Não sinto da mesma forma."
 bp2_yearly.8041.desc.intro.different_location:0 "Encontro entre minhas cartas usuais de estado algo muito incomum. Delicadamente embrulhado com uma fita vermelha-sangue, há uma carta com a imagem de um coração adornando o selo de cera.\n\nÉ de [crushee.Custom2('MyCharacterIntroduction', ROOT.Char)] e detalha os profundos sentimentos [crushee.GetHerHim] por mim."
 bp2_yearly.8041.desc.intro.same_location:0 "Entro em [ROOT.Char.Custom('ResidenceBuilding')] e encontro [crushee.Custom2('MyCharacterIntroduction', ROOT.Char)] me encarando como um(a) selvagem faminto(a) observando sua próxima refeição. [crushee.GetSheHe|U] atravessa a multidão e"
 bp2_yearly.8041.desc.mid.different_location_lovers:0 "\n\n\"Meu amor, respiro apenas por você, e não suporto mais ficar separado por muito tempo. Amei você desde que era apenas [Select_CString( crushee.IsFemale, 'uma', 'um' )] [crushee.Custom('GirlBoy')]. Por favor, retribua meu amor e prometo fazer você feliz para sempre.\""
 bp2_yearly.8041.desc.mid.different_location_marriage:0 "Após um longo tempo discutindo a infatuação de infância [crushee.GetHerHim] por mim, a carta continua propondo que [crushee.GetSheHe] se torne [Select_CString( crushee.IsFemale, 'minha', 'meu' )] [crushee.Custom('WifeHusband')]!\n\n\"Nós seríamos casados assim que você responder, meu amor. Aceite-me e me esforçarei para tornar sua felicidade o propósito da minha vida.\""
 bp2_yearly.8041.desc.mid.same_location_lovers:0 "me puxa para um canto tranquilo da [ROOT.Char.Custom('GetCourt')] e sussurra suavemente no meu ouvido.\n\n\"Eu tenho sentimentos profundos de amor por você desde que éramos crianças. Ofereço meu amor, se você aceitar.\""
 bp2_yearly.8041.desc.mid.same_location_marriage:0 "se abaixa a meus pés.\n\n\"Oh meu doce [ROOT.Char.Custom('LoverPetName')], eu tive olhos para você desde que éramos apenas crianças. Meu amor é mais puro do que qualquer um que você encontrará neste mundo, e eu seria [Select_CString( crushee.IsFemale, 'sua', 'seu' )] [crushee.Custom('WifeHusband')] se você me aceitar!\""
 bp2_yearly.8041.t:0 "Agora Você é um [ROOT.Char.GetWomanMan|U]"
 bp2_yearly.8042.a:0 "Que maravilha."
 bp2_yearly.8042.desc.intro:0 "Professo meu amor a [crush.GetFirstName]"
 bp2_yearly.8042.desc.mid.different_location:0 "em uma carta, e leva apenas alguns dias para [crush.GetSheHe] responder que [crush.GetSheHe] sente da mesma forma!"
 bp2_yearly.8042.desc.mid.same_location:0 "e [crush.GetSheHe] se inclina em meu ouvido e sussurra de volta afeições [crush.GetHerHim] para mim."
 bp2_yearly.8042.desc.outro:0 "\n\nEstou radiante e simplesmente pasmo que nosso amor conseguiu transcender as tolices de nossa juventude e florescer em um namoro maduro."
 bp2_yearly.8042.t:0 "Afetos Correspondidos"
 bp2_yearly.8043.a:0 "Talvez [crush.GetSheHe] possa ser persuadido."
 bp2_yearly.8043.b:0 "Ai de mim."
 bp2_yearly.8043.desc:0 "Parece que meus sentimentos continuam unilaterais. [crush.GetFirstName|U] parece completamente desinteressado de mim como amante, e estou deixado com o coração partido."
 bp2_yearly.8043.t:0 "Afeições Desprezadas"
 bp2_yearly_8040_confess_crush:0 "Você e [crush.GetFirstName] podem se tornar amantes"
 bp2_yearly_8042_rejection:0 "[crushee.GetFirstName] será informado da sua rejeição"
 changing_habits:0 "Hábitos em Mudança"
 changing_habits_desc:0 "Este personagem está tentando ajustar seu comportamento para agradar aos outros."
 child_learning_language_tt:0 "[hostage.GetFirstNameNoTooltip|U] será incentivado a iniciar um [scheme|E] para aprender a sua [court_language|E]"
 child_personality.7300.a:0 "Eu... eu acho que falo cavalo!"
 child_personality.7300.b:0 "Eles são como nós."
 child_personality.7300.c:0 "Um animal é uma ferramenta, nada mais."
 child_personality.7300.desc:0 "Eu costumo me sentir muito mais à vontade perto dos animais dos jardins zoológicos e estábulos do que perto dos meus colegas e tutores na corte. Me encontro mais uma vez nos estábulos, cuidando e montando meu cavalo.\n\nSinto uma forte afinidade, como um bom amigo. Desmonto, dou uma boa escovada no meu corcel e me pergunto se deveríamos tratar nossos montes mais como camaradas."
 child_personality.7300.t:0 "Amigo dos Animais"
 child_personality.7301.callous.desc:0 "mas quando confrontada, [child.GetSheHe] insiste que um animal é apenas uma ferramenta a ser usada e descartada quando não é mais útil.\n\n[child.GetFirstNameNoTooltip] não parece preocupada com a segurança ou o conforto do animal ao montar, ficando ativamente irritada quando o animal demonstra qualquer preocupação com sua própria segurança."
 child_personality.7301.callous:0 "\"Excelente, mantenha esse sentimento.\""
 child_personality.7301.change.callous:0 "\"Criança tola, um cavalo é apenas uma ferramenta.\""
 child_personality.7301.change.compassionate:0 "\"Um cavalo é um companheiro como nenhum outro, [child.GetFirstNameNoTooltip].\""
 child_personality.7301.change.eccentric:0 "\"Não, fale com o cavalo. Me diga o que ele diz.\""
 child_personality.7301.compassionate.desc:0 "e afirma que até mesmo os animais merecem cuidado e dignidade.\n\nO cavalo está impecavelmente cuidado, ao contrário de [child.GetFirstNameNoTooltip], que claramente tem feito o trabalho de um ajudante de estábulo."
 child_personality.7301.compassionate:0 "Faça aos outros..."
 child_personality.7301.desc:0 "[child.GetFirstName] tem passado uma quantidade incomum de tempo nos estábulos ultimamente e começou a negligenciar seus colegas na corte. A criança parece fixada em um cavalo específico."
 child_personality.7301.eccentric.desc:0 "e até mesmo começou a afirmar que [child.GetSheHe] \"fala cavalo\".\n\nA criança então começou a fazer barulhos com os lábios e a fazer sons de relincho, ocasionalmente parando para me informar sobre o que [child.GetSheHe] e o cavalo estavam conversando."
 child_personality.7301.eccentric.fallback:0 "Aparentemente, esta criatura deseja fazer parte do conselho."
 child_personality.7301.eccentric.obligatory_glitterhoof_reference:0 "Aparentemente, esta criatura tem ambições de subir à posição de [child.GetFaith.ReligiousHeadName]."
 child_personality.7301.eccentric:0 "Que imaginação maravilhosa."
 child_personality.7301.t:0 "$child_personality.7300.t$"
 child_personality.7400.a:0 "\"Por que não os dois?\""
 child_personality.7400.b:0 "\"Não, vamos jogar O MEU jogo DO MEU jeito!\""
 child_personality.7400.c:0 "\"Ok, montar soa bem também...\""
 child_personality.7400.desc.outro.older:0 "\"Ah, vamos lá, [ROOT.Char.GetFirstNameNoTooltip], ficamos o dia todo dentro de casa. Talvez devêssemos sair para um passeio!\""
 child_personality.7400.desc.outro.young:0 "\"Eu não quero jogar algo tão chato e entediante. Quero montar cavalos!\""
 child_personality.7400.desc:0 "Tenho passado felizmente um tempo com [other_child.GetFirstName] durante boa parte do dia, e sinto que poderia brincar com [other_child.GetSheHe] até meu corpo doer.\n\nMas então vejo seu rosto cair quando pego meu conjunto de [ROOT.Char.Custom('BG_GameType_Generic')].\n\n"
 child_personality.7400.t:0 "Jogar ou Montar?"
 child_personality.7401.change.eccentric:0 "\"Por que não jogar ambos ao mesmo tempo?\""
 child_personality.7401.change.fickle:0 "\"Os caprichos devem ser tão mutáveis quanto a água fluente.\""
 child_personality.7401.change.stubborn:0 "\"Não, mantenha os pés firmes no chão e exija que os outros se movam.\""
 child_personality.7401.desc:0 "[child.GetFirstName] tem estado estranhamente quieto durante a maior parte do dia, então decido verificar como [child.GetSheHe] está. Encontro [child.GetSheHe]"
 child_personality.7401.eccentric.desc:0 "no pátio de montaria com [other_child.GetFirstName]. Os dois estão gritando em voz alta de cima dos cavalos, recitando o que parece ser movimentos do jogo [child.Custom('BG_GameType_Generic')]. Após uma inspeção mais próxima, os dois estão jogando o jogo de tabuleiro em cima dos cavalos, ou pelo menos tentando. O pátio de montaria inteiro está cheio de peças do jogo e os dois caíram dos cavalos mais de uma vez."
 child_personality.7401.eccentric:0 "\"Que excelente compromisso!\""
 child_personality.7401.fickle.desc:0 "no pátio de montaria com [other_child.GetFirstName]. [child.GetFirstNameNoTooltip|U] parece menos animado por estar lá, como se [child.GetSheHe] estivesse sendo obrigado a estar lá por seu amigo de brincadeira.\n\n\"Eu queria jogar jogos de tabuleiro, mas [other_child.GetFirstNameNoTooltip] disse que deveríamos montar cavalos, e isso também pareceu bom!\""
 child_personality.7401.fickle:0 "\"Os caprichos mudam mais do que o tempo.\""
 child_personality.7401.stubborn.desc:0 "no seu quarto com [other_child.GetFirstName], que parece estar jogando [child.Custom('BG_GameType_Generic')] de maneira pouco entusiasmada com um [child.GetFirstNameNoTooltip] entusiasmado.\n\n\"[other_child.GetFirstNameNoTooltip|U] queria montar, mas eu decidi que deveríamos jogar jogos de tabuleiro!"
 child_personality.7401.stubborn:0 "\"Permaneça inabalável como uma pedra.\""
 child_personality.7401.t:0 "$child_personality.7400.t$"
 child_personality.keeps_eccentric_tt:0 "[child.GetFirstName] mantém o traço [GetTrait('eccentric').GetName( child.Self )]"
 close_tutelage:0 "Tutela Próxima"
 close_tutelage_desc:0 "Este personagem está recebendo atenção especial de um professor, tornando o processo de aprendizado muito mais fácil."
 close_tutelage_scheme:0 "Tutela Próxima"
 close_tutelage_tutor:0 "Tutela Próxima"
 close_tutelage_tutor_desc:0 "Este personagem está fornecendo orientação pessoal próxima a uma criança, auxiliando em sua educação, mas ao custo de sua própria estabilidade mental."
 erratic_behaviour:0 "Comportamento Errático"
 erratic_behaviour_desc:0 "Este personagem tem se irritado sua corte recentemente ao se comportar de maneira irracional e estranha."
 friend_boardgames_on_horseback:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUiName] passaram um dia juntos jogando jogos de tabuleiro a cavalo"
 friend_gave_a_good_lesson:0 "[CHARACTER.GetShortUIName|U] ministrou uma lição importante durante a infância de [TARGET_CHARACTER.GetShortUIName]"
 friend_gave_a_good_lesson_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] ministrou uma lição importante durante a infância de [CHARACTER.GetShortUIName]"
 friend_language_tutor:0 "[CHARACTER.GetShortUIName|U] ofereceu orientação próxima a [TARGET_CHARACTER.GetShortUIName] para aprender a língua da corte de [CHARACTER.GetShortUINamePossessive]"
 friend_language_tutor_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] ofereceu orientação próxima a [CHARACTER.GetShortUIName] para aprender a língua da corte de [TARGET_CHARACTER.GetShortUIName]"
 friend_played_together:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] se divertiram jogando juntos quando eram crianças"
 friend_secret_language:0 "[CHARACTER.GetShortUIName|U] e [TARGET_CHARACTER.GetShortUIName] inventaram uma linguagem secreta juntos"
 rival_humiliated_a_child:0 "[CHARACTER.GetShortUIName|U] humilhou cruelmente [TARGET_CHARACTER.GetShortUIName] quando criança"
 rival_humiliated_a_child_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] humilhou cruelmente [CHARACTER.GetShortUIName] quando criança"
 rival_made_fun_of_my_accent:0 "[TARGET_CHARACTER.GetShortUIName|U] zombou do sotaque de [CHARACTER.GetShortUINamePossessive]"
 rival_made_fun_of_my_accent_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] zombou do sotaque de [CHARACTER.GetShortUINamePossessive]"
 stress_threshold.2360.a.eccentric.effect:0 "Ah, um visitante a esta hora! Vamos bater um papo."
 stress_threshold.2360.a.eccentric.gain:0 "Acho que ele está falando comigo."
 stress_threshold.2360.b.irritable.effect:0 "Vou matar esse maldito pássaro!"
 stress_threshold.2360.b.irritable.gain:0 "Não aguento mais isso!"
 stress_threshold.2360.c:0 "Tenho certeza de que ele vai embora eventualmente."
 stress_threshold.2360.desc:0 "Finalmente encontro algum alívio das tensões da vida na [ROOT.Char.Custom('GetCourt')|l] em meu privado [ROOT.Char.Custom('GetChamber')|l], mas enquanto cochilo, à beira do sono, ouço uma batida melódica e firme.\n\nAbro a [ROOT.Char.Custom('GetDoor')] para ver quem é este visitante da meia-noite, apenas para ser atacado no rosto por um pequeno pássaro preto.\n\nNormalmente, uma visita de uma das criaturas de [ROOT.Char.GetFaith.CreatorNamePossessive] seria um presente, mas este pequeno incômodo preto voa incessantemente pelo [ROOT.Char.Custom('GetRoom')|l], grasnando e gritando para mim. Sinto meus punhos se apertarem e meu coração começar a acelerar."
 stress_threshold.2360.t:0 "Colapso Mental: Um Visitante"
 tutor_child_in_language_tt:0 "[hostage.GetFirstNameNoTooltip|U] iniciará um [scheme|E] para aprender sua [court_language|E] com um bônus poderoso"
 tutor_child_in_native_language_tt:0 "[child.GetFirstName|U] começará um [scheme|E] para aprender a sua [language|E] com um bônus poderoso"
