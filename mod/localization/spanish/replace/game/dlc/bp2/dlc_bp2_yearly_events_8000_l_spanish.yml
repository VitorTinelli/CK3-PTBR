 bad_child_wingman:0 "Difamação"
 bp2_yearly.8070.a:0 "Prefiro brincar sozinho."
 bp2_yearly.8070.b.failure:0 "Vocês têm um tempo cheio de brigas"
 bp2_yearly.8070.b.success:0 "Vocês se divertem juntos"
 bp2_yearly.8070.b:0 "Tudo é mais divertido com um amigo!"
 bp2_yearly.8070.desc.intro:0 "Finalmente, estou sozinho para brincar, e é claro que pego meu"
 bp2_yearly.8070.desc.mid.board_game:0 "tabuleiro favorito de [ROOT.Char.Custom('BG_GameType_Generic')] da minha caixa de brinquedos. Não há nada melhor do que provar minha inteligência e ver todas as peças se encaixarem, e não há melhor adversário do que eu mesmo."
 bp2_yearly.8070.desc.mid.horses:0 "cavalo de madeira confiável da minha caixa de brinquedos e sonho em cavalgar em um grande torneio."
 bp2_yearly.8070.desc.mid.marbles:0 "mármores maravilhosos da caixa de brinquedos. Realmente, nada reúne os amigos como um bom saco de mármores e um pouco de imaginação!"
 bp2_yearly.8070.desc.mid.puppets:0 "pequenos bonecos previsíveis da caixa de brinquedos e começo a brincar. Sempre é bom ter controle total sobre suas vidas pequenas e atuar em cenários com eles de acordo com meu design."
 bp2_yearly.8070.desc.mid.teetotum:0 "teetotum complicado da caixa de brinquedos. Há algo tão satisfatório em vê-lo girar e girar, apostando onde ele pode cair."
 bp2_yearly.8070.desc.outro:0 "\n\nMas então, [other_child.GetFirstName|U] se aproxima de mim com expectativa e pergunta: 'Posso brincar?'"
 bp2_yearly.8070.t:0 "Hora de Brincar"
 bp2_yearly.8071.a.gambler:0 "Eu sempre soube quando apostar minhas fichas."
 bp2_yearly.8071.a.marbles:0 "Devo reunir as pessoas, assim como meus mármores faziam."
 bp2_yearly.8071.a.puppet:0 "Eu poderia ser o mestre dos marionetes novamente!"
 bp2_yearly.8071.a:0 "Devo viver meus sonhos de infância."
 bp2_yearly.8071.b:0 "Vamos ver o que [other_child.GetFirstNameNoTooltip] está fazendo!"
 bp2_yearly.8071.c:0 "Sou uma pessoa diferente agora, e está tudo bem."
 bp2_yearly.8071.desc.intro:0 "Enquanto vasculho minhas coisas antigas em busca de algum assunto de estado, encontro algo familiar."
 bp2_yearly.8071.desc.mid.board_games:0 "Meu primeiro tabuleiro de [ROOT.Char.Custom('BG_GameType_Generic')] está no fundo de um baú antigo, faltando pelo menos metade das suas peças e muito danificado. Cada lasca e rachadura é uma história da minha juventude que eu achava que havia esquecido.\n\n"
 bp2_yearly.8071.desc.mid.horses:0 "Um pequeno cavalo de madeira descansa em algum canto escondido do meu guarda-roupa, enterrado entre as roupas. Ele parece tão leve e pequeno nas minhas mãos. Estas são as mãos de uma [ROOT.Char.GetWomanMan] agora, para onde foi o tempo?\n\n"
 bp2_yearly.8071.desc.mid.marbles:0 "Encontro um pequeno saco de couro com mármores cobertos de poeira escondido entre meus outros pertences negligenciados. Muitos dos mármores estão danificados ou faltando, mas aqueles que permanecem são mais preciosos para mim do que ouro.\n\n"
 bp2_yearly.8071.desc.mid.other_child_alive:0 "Lembro-me de passar muitas tardes de verão brincando com [other_child.GetFirstName], e nada mais parecia importar. Eu me pergunto o que [other_child.GetSheHe] está fazendo agora, ou se [other_child.GetSheHe] ainda se lembra das brincadeiras que compartilhamos.\n\n"
 bp2_yearly.8071.desc.mid.other_child_dead:0 "Lembro-me de que minha infância era cheia de risos de [other_child.GetFirstName] enquanto brincávamos juntos. É uma risada que nunca vou esquecer, ou ouvir novamente.\n\n"
 bp2_yearly.8071.desc.mid.puppets:0 "Uma pequena coleção de bonecos empoeirados fica inativa no fundo de um baú antigo. Suas cores estão desbotadas, e suas roupas rasgadas de anos de uso amoroso, e muitos mais de negligência.\n\n"
 bp2_yearly.8071.desc.mid.spinning_top:0 "Um pequeno teetotum fica entre as cartas de estado. Houve um tempo em que nada importava mais para mim do que esse pequeno pião, agora ele é pouco mais do que um peso de papel. Como pude deixar isso acontecer?\n\n"
 bp2_yearly.8071.desc.outro:0 "Com meu brinquedo favorito agora em minhas mãos, parece que estou segurando minha própria infância."
 bp2_yearly.8071.t:0 "Um Favorito da Infância"
 bp2_yearly.8080.a.dislikes.tt:0 "[ward.GetFirstNameNoTooltip] fala mal de você"
 bp2_yearly.8080.a.likes.tt:0 "[ward.GetFirstNameNoTooltip] fala bem de você"
 bp2_yearly.8080.a:0 "Vamos fazer isso!"
 bp2_yearly.8080.b:0 "Não vou recorrer a isso."
 bp2_yearly.8080.desc:0 "Por mais que eu tente, as afeições de [target.Custom2('MyCharacterIntroduction', ROOT.Char)] ainda me escapam, mas posso sentir que estou prestes a alcançar algo grandioso. Com meu tutelamento sobre [ward.Custom2('MyCharacterIntroduction', ROOT.Char)], talvez eu seja capaz de ter sucesso em minha conquista ainda!\n\nUm empurrãozinho, e talvez [ward.GetFirstNameNoTooltip] cante minhas virtudes, e prove que tenho jeito com crianças que qualquer [target.GetWomanMan] acharia irresistível."
 bp2_yearly.8080.t:0 "Charme infantil"
 bp2_yearly.8081.a:0 "Que criança maravilhosa."
 bp2_yearly.8081.desc:0 "Eu envio [ward.GetFirstName] até o alvo das minhas afeições, e em pouco tempo [target.GetFirstName] está olhando para mim com um sorriso no rosto enquanto [target.GetSheHe] conversa com meu jovem pupilo."
 bp2_yearly.8081.t:0 "Cantando Minhas Virtudes"
 bp2_yearly.8082.a:0 "Maldita seja, criança!"
 bp2_yearly.8082.b:0 "Fedido? Devo intervir!"
 bp2_yearly.8082.desc:0 "Eu envio [ward.GetFirstName] até o alvo das minhas afeições, com nada além das melhores expectativas em minha mente. No entanto, logo [target.GetFirstName] está olhando para mim e rindo profusamente cada vez que [ward.GetFirstNameNoTooltip] abre a boca.\n\nNão consigo ouvir muito, mas escuto as palavras '[ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('ward'))]', '[ROOT.Char.Custom2('InsultNoun', SCOPE.sC('ward'))]' e 'fedorento' sendo mencionadas frequentemente."
 bp2_yearly.8082.t:0 "Desprezado"
 bp2_yearly.8090.a:0 "O cavalo."
 bp2_yearly.8090.b:0 "Os bonecos."
 bp2_yearly.8090.c:0 "O tabuleiro de [ROOT.Char.Custom('BG_GameType_Generic')]."
 bp2_yearly.8090.d:0 "O pião."
 bp2_yearly.8090.desc:0 "Sou conduzido a uma sala pouco iluminada por [monk.Custom2('MyCharacterIntroduction', ROOT.Char)]. [monk.GetSheHe|U] me apresenta uma série de brinquedos antigos, todos lascados e envelhecidos pelo tempo.\n\n\"Eu suspeito há muito tempo que você seja o espírito reencarnado de [ancestor.GetName], e agora que você completou [ROOT.Char.GetAge], é hora de eu testar essa teoria. Diante de você estão cinco objetos, apenas um deles pertencia ao grande [ancestor.GetFirstNameNoTooltip]. Você se lembra da [ancestor.GetWomanMan] que costumava ser? Qual desses objetos é seu?\""
 bp2_yearly.8090.e:0 "Os mármores."
 bp2_yearly.8090.f:0 "Nenhum deles."
 bp2_yearly.8090.t:0 "Brinquedos Familiares"
 bp2_yearly.8091.a.knew_them:0 "Eu sou meu(a) próprio(a) [ROOT.Char.Custom2('RelationToMeShort',ancestor)]."
 bp2_yearly.8091.a:0 "Uau! Quem é esse?"
 bp2_yearly.8091.desc:0 "Quando dou minha resposta, vejo os olhos de [monk.GetName] se arregalarem. [monk.GetSheHe|U] cai de joelhos em reverência a mim.\n\n\"Brilhante criança! Não tenho mais dúvidas, você simplesmente deve ser [ancestor.GetName] renascido!\""
 bp2_yearly.8091.t:0 "Não Reencarnado!"
 bp2_yearly.8092.a:0 "Posso tentar de novo?"
 bp2_yearly.8092.desc:0 "Dou minha resposta, e [monk.GetName] desaba desanimado de joelhos.\n\n\"Ah, minha imaginação deve ter ido longe demais. Esse objeto não pertencia ao grande [ancestor.GetName], e minha busca pela alma [ancestor.GetHerHim] continua.\""
 bp2_yearly.8092.t:0 "Não Mais Reencarnado"
 bp2_yearly.8100.a:0 "Amor!"
 bp2_yearly.8100.b:0 "Ódio!"
 bp2_yearly.8100.c:0 "Indigestão!"
 bp2_yearly.8100.desc:0 "Estou brincando nos jardins de [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] com meus colegas, em um raro momento livre dos olhares atentos de nossos guardiões e tutores.\n\nTudo acontece tão repentinamente, sou varrido dos meus pés e caio rolando por uma colina íngreme, com [potential_crush.GetFirstName] segurando firmemente em mim enquanto rolamos para baixo. Uma vez na parte inferior, fico atordoado com os olhos [potential_crush.GetHerHim] olhando profundamente nos meus enquanto [potential_crush.GetSheHe] sorri e ri de mim.\n\nSinto algo estranho no peito quando olho para [potential_crush.GetSheHe], o que é esse sentimento?"
 bp2_yearly.8100.t:0 "Rolando"
 bp2_yearly.8110.a:0 "\"Muito obrigado a todos.\""
 bp2_yearly.8110.b:0 "Sei que posso sempre contar com [caretaker_1.GetFirstNameNoTooltip]."
 bp2_yearly.8110.c:0 "[caretaker_2.GetFirstNameNoTooltip] ganhou minha afeição."
 bp2_yearly.8110.d:0 "[caretaker_3.GetFirstNameNoTooltip] sabe exatamente do que preciso."
 bp2_yearly.8110.desc:0 "Ter um filho crescendo em meu ventre é uma coisa maravilhosa e sagrada, mas certamente tem tornado as atividades cotidianas um teste para minha paciência. Felizmente, à medida que minha gravidez avança, encontro-me com uma abundância de pessoas dispostas a me apoiar.\n\n[caretaker_1.Custom2('MyCharacterIntroduction', ROOT.Char)|U] está sempre presente para provar sua devoção tanto a [caretaker_1.GetFaith.HighGodName|U] quanto a mim, atendendo a todos os meus caprichos. [caretaker_2.Custom2('MyCharacterIntroduction', ROOT.Char)|U] também parece estar tentando conquistar minha afeição aliviando o estresse da vida diária. [caretaker_3.Custom2('MyCharacterIntroduction', ROOT.Char)|U], sempre leal, tem sido capaz de antecipar todas as minhas necessidades sem que eu precise dizer nada."
 bp2_yearly.8110.t:0 "Corteses Cortesãos"
 bp2_yearly.8120.a:0 "Farei tudo por você."
 bp2_yearly.8120.b:0 "Não é para isso que existem servos?"
 bp2_yearly.8120.c:0 "Tenho certeza de que sei como aliviar um pouco o estresse."
 bp2_yearly.8120.desc:0 "[spouse.Custom2('MyCharacterIntroduction', ROOT.Char)|U] agora está pesada devido à gravidez, e até as tarefas mais simples parecem ser um verdadeiro fardo para [spouse.GetSheHe]. Eu fico na cama e assisto enquanto [spouse.GetSheHe] luta para se despir, mesmo com a ajuda de criados.\n\n[spouse.GetSheHe|U] se vira para mim, um olhar saudoso mas cansado em seu olhar, como se estivesse me pedindo ajuda."
 bp2_yearly.8120.t:0 "O Peso da Gravidez"
 building_new_skills:0 "Novos Horizontes"
 building_new_skills_desc:0 "Depois de refletir sobre a infância, este personagem está determinado a aprender e experimentar coisas novas."
