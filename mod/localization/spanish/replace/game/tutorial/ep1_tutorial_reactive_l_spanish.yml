l_spanish:
 action_reactive_advice_royal_court:0 "$open_tutorial_lesson$$ra_rc_intro$"
 action_reactive_advice_royal_court_click:0 "$click_to_open_lesson$"
 action_reactive_advice_royal_court_desc:0 "Abra isso para uma introdução ao seu Tribunal Real"
 action_reactive_advice_should_form_hybrid_culture:0 "$open_tutorial_lesson$$reactive_advice_should_form_hybrid_culture$"
 action_reactive_advice_should_form_hybrid_culture_click:0 "$click_to_open_lesson$"
 action_reactive_advice_should_form_hybrid_culture_desc:0 "Trabalhe para formar uma [hybrid_culture|E] com os [culture.GetCollectiveNoun]."
 lessons_ep1_form_hybrid_culture:0 "$reactive_advice_should_form_hybrid_culture$"
 lessons_ep1_fund_inspiration:0 "Inspirar Fundações"
 lessons_ep1_hybrid_culture_benefits:0 "Benefícios das Culturas Híbridas"
 lessons_ep1_hybrid_culture_benefits_desc:0 "Formar uma Cultura Híbrida traz vários benefícios:\n\n$EFFECT_LIST_BULLET$Você poderá escolher [culture_pillars|E] e [culture_traditions|E] de ambas as Culturas Parentais\n$EFFECT_LIST_BULLET$Sua nova cultura herdará todas as [innovations|E] de ambas as Culturas Parentais\n$EFFECT_LIST_BULLET$Sua nova cultura terá alta Aceitação Cultural com ambas as Culturas Parentais\n$EFFECT_LIST_BULLET$Uma Cultura Híbrida pode converter as terras de suas culturas parentais muito mais rápido por alguns anos após sua formação"
 lessons_ep1_should_form_hybrid_culture_desc:0 "Você pode formar uma [hybrid_culture|E] com esta [culture|E], se a [cultural_acceptance|E] for alta o suficiente e sua Cultura tiver mais de 50 anos!\n\nIsso significa que você criará uma nova Cultura, com elementos tanto da sua Cultura quanto da outra Cultura.\n\nVocê pode ganhar Aceitação Cultural ao:\n$EFFECT_LIST_BULLET$Conceder [counties|E] dessa Cultura para [characters|E] dessa Cultura\n$EFFECT_LIST_BULLET$Usar a [councillor_task|E] de [accept_culture|E]\n$EFFECT_LIST_BULLET$Aumentar o [culture_intermingling|E]\n$EFFECT_LIST_BULLET$Ter [vassals|E] dessa Cultura\n\nSe você tiver alta Aceitação Cultural e pelo menos um condado dessa Cultura dentro do seu [realm|E], poderá formar uma Cultura Híbrida!"
 ra_inspiration_court_view:0 "Encontrando Inspirações"
 ra_inspiration_court_view_desc:0 "Dentro do seu [royal_court|E], você pode ver todas as [inspirations|E] atualmente presentes no seu tribunal à esquerda.\n\nVocê pode verificar o status delas clicando no ícone (destacado)."
 ra_inspiration_court_view_prompt:0 "Clique em um Ícone de Inspiração (destacado)"
 ra_inspiration_funding:0 "Financiando Inspirações"
 ra_inspiration_funding_desc:0 "Aqui, você pode ver o Personagem Inspirado, o que eles pretendem criar, quão boa é sua habilidade, se você pode se dar ao luxo de financiar a Inspiração e quanto isso vai custar.\n\nSe a Inspiração já estiver em andamento, você pode ver quanto tempo falta para a conclusão; se ainda não começou, você pode iniciá-la."
 ra_inspiration_open:0 "Inspirações"
 ra_inspiration_open_desc:0 "Agora você pode financiar a sua primeira [inspiration|E]. Uma Inspiração é o desejo de um personagem de realizar um [artifact|E].\n\n[characters|E] [inspired|E] vão e vêm dos [royal_courts|E] mais prestigiados do mundo; quando um deles chega ao seu tribunal, você é notificado e convidado a [sponsor|E] o [project|E] desse personagem.\n\nAo pagar uma quantia variável de [gold|E], você pode garantir os serviços desse personagem e, após algum tempo, obter um novo Artefato!"
 ra_rc_amenities:0 "Amenidades da Corte"
 ra_rc_amenities_desc:0 "[amenities|E] são vários serviços e conveniências que você oferece a todos que frequentam seu [royal_court|E]. Cada uma oferece seus próprios benefícios, e todas contribuem para o [grandeur|E].\n\nTodas elas custam [gold|E] mensalmente, então tome cuidado para não gastar demais!"
 ra_rc_artifacts:0 "Artefatos da Corte"
 ra_rc_artifacts_desc:0 "Aqui, você pode escolher quais [court_artifacts|E] serão exibidos no seu [royal_court|E].\n\nOs Artefatos da Corte são [artifacts|E] especiais, como estátuas e tapeçarias, que você pode expor. Eles fornecem vários bônus, e muitos também aumentam o seu [grandeur|E].\n\nAgora, vamos voltar para a Sala do Trono."
 ra_rc_artifacts_open:0 "$ra_rc_artifacts$"
 ra_rc_artifacts_open_desc:0 "Por fim, vamos dar uma olhada nos Artefatos da Corte, outra fonte de [grandeur|E], bem como outros benefícios."
 ra_rc_artifacts_open_prompt:0 "Abrir a Aba dos Artefatos da Corte (destacada)"
 ra_rc_conclusion:0 "$ra_rc_intro$"
 ra_rc_conclusion_desc:0 "Este é o fim do nosso tour pelo seu [royal_court|E].\n\nPor enquanto, fique à vontade para experimentar o que quiser. Sugerimos que você [hold_court|E] para celebrar seu novo status!"
 ra_rc_court_types_and_language:0 "Tipos de Corte e Linguagem da Corte"
 ra_rc_court_types_and_language_desc:0 "Se você deseja aprofundar-se no [grandeur|E], você pode explorar [court_types|E] e [court_language|E].\n\nOs Tipos de Corte afetam o que certos [grandeur_levels|E] proporcionam a você, enquanto a mudança da Linguagem da Corte pode aumentar o seu [grandeur|E] total."
 ra_rc_grandeur:0 "Esplendor da Corte"
 ra_rc_grandeur_desc:0 "Seu [grandeur_level|E] é uma medida de quão famoso é o seu [royal_court|E].\n\nVários fatores contribuem para o seu [grandeur|E], mas as principais fontes são [amenities|E] e [court_artifacts|E].\n\nConforme seu [realm|E] fica maior, espera-se que você tenha atingido um nível de Esplendor mais alto, conhecido como [grandeur_expectations|E]."
 ra_rc_grandeur_open:0 "$ra_rc_grandeur$"
 ra_rc_grandeur_open_desc:0 "No entanto, ninguém pode querer ir ao seu [royal_court|E] se ele não for bem conhecido! Em seguida, vamos dar uma olhada no Esplendor da Corte!"
 ra_rc_grandeur_open_prompt:0 "Abrir a Aba do Esplendor da Corte (destacada)"
 ra_rc_hold_court:0 "Realizar Corte"
 ra_rc_hold_court_desc:0 "Se você sentir que sua Sala do Trono não está animada o suficiente, você pode [hold_court|E]. Isso convida requerentes de todo o seu [realm|E], trazendo seus problemas diante do seu sábio julgamento."
 ra_rc_intro:0 "Tribunal Real"
 ra_rc_intro_desc:0 "Agora você tem acesso à sua própria [royal_court|E]!\n\nA Corte Real é um tipo especial de corte, representando sua grande entrada no cenário mundial, oferecendo diversas novas opções e benefícios.\n\nEla está disponível para [kings|E] e [emperors|E] do [government|E] [GetGovernment( 'feudal_government' ).GetName], [GetGovernment( 'clan_government' ).GetName], [GetGovernment( 'tribal_government' ).GetName] e [GetGovernment( 'administrative_government' ).GetName]."
 ra_rc_open:0 "$ra_rc_intro$"
 ra_rc_open_desc:0 "Você pode fazer muitas coisas no seu [royal_court|E], então fique à vontade para explorar essas opções por conta própria!\n\nPor enquanto, vamos fazer um rápido tour por todas as novas ações disponíveis para você."
 ra_rc_open_prompt:0 "Abrir o Tribunal Real (destacado)"
 ra_rc_throne_room:0 "$ra_rc_intro$"
 ra_rc_throne_room_desc:0 "Esta é a sua Sala do Trono. Várias situações e [court_events|E] podem ocorrer aqui de tempos em tempos, e você pode escolher intervir no que está acontecendo."
 ra_rc_throne_room_open:0 "$ra_rc_intro$"
 ra_rc_throne_room_open_desc:0 "Para continuar, vamos voltar para a Sala do Trono"
 ra_rc_throne_room_open_prompt:0 "Abrir a Aba da Sala do Trono (destacada)"
 reactive_advice_fund_inspiration:0 "$lessons_ep1_fund_inspiration$"
 reactive_advice_royal_court:0 "$ra_rc_intro$"
 reactive_advice_should_form_hybrid_culture:0 "Culturas Híbridas"
