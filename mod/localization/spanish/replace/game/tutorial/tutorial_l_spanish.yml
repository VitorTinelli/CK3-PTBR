l_spanish:
 TUTORIAL_STEP_INSTRUCTIONS:0 "#low To continue:#!"
 full_tutorial_desc:0 "Iniciar Avançado"
 full_tutorial_explanation_desc:0 "\n#TUT 2 Horas#!"
 lesson_army_movement:0 "Movimento do Exército"
 lesson_army_movement_step_1:0 "Movimento do Exército"
 lesson_army_movement_step_1_desc:0 "Para mover seu [army|E], clique no $game_concept_army$ (no mapa) e clique com o botão direito na área para onde deseja que ele vá.\n\nPara vencer uma [war|E], normalmente você precisa capturar a [realm_capital|E] inimiga em um [siege|E]. Portanto, este geralmente é o foco quando estiver no ataque.\n\n#TUT Se você ordenar que seu $game_concept_army$ atravesse águas, ele irá [embark|E], transformando-se em uma [fleet|E]. Por enquanto, vamos permanecer em terra firme.#!"
 lesson_army_purpose:0 "Propósito do Exército"
 lesson_army_purpose_step_1:0 "Exército"
 lesson_army_purpose_step_1_desc:0 "Agora que seu [army|E] está em movimento, provavelmente está se dirigindo para a batalha com forças inimigas. Isso pode ser um encontro direto com outros $game_concept_armies$, ou o início de um [siege|E].\n\n#TUT [battles|E] acontecerão automaticamente se dois $game_concept_armies$ hostis se cruzarem. Da mesma forma, $game_concept_sieges$ ocorrem quando você coloca seu $game_concept_army$ em uma [holding|E] inimiga.\n\nEste é um bom momento para #EMP despausar o jogo#!, se você ainda não o fez. Caso contrário, o tempo ficará parado e seus $game_concept_armies$ não se moverão!#!"
 lesson_basics:0 "I — O Básico"
 lesson_basics_already_married:0 "$lesson_basics_marriage_concept_1$"
 lesson_basics_already_married_desc:0 "Sempre que você estiver organizando um [marriage|E] entre [characters|E], a etapa final antes de enviar uma proposta apresenta os detalhes da união, juntamente com opções adicionais, como ter o casamento [matrilineal|E].\n\n#TUT Seu personagem já está casado — bom trabalho!#!"
 lesson_basics_arrange_marriage_concept:0 "Combinar casamento ($lesson_basics_marriage$)"
 lesson_basics_arrange_marriage_concept_desc:0 "\n\n#TUT Isso pode ser útil para fazer combinações entre seus [courtiers|E], ou para estabelecer uma [alliance|E] matrimonial específica.#!"
 lesson_basics_buildings:0 "Seus edifícios ($lesson_basics_holdings$)"
 lesson_basics_buildings_complete:0 "$lesson_basics_holdings_and_buildings$"
 lesson_basics_buildings_complete_desc:0 "Bom trabalho! No entanto, levará algum tempo para a [building|E] ficar pronta - $cn_luimneach$ não foi construída em um dia... Sinta-se à vontade para fechar a janela de construção do #EMP $building_type_curtain_walls_01$#!.\n\n#TUT Assim que sua construção for concluída, você receberá os benefícios da Construção ou Melhorias que escolheu.#!"
 lesson_basics_buildings_desc:0 "[holdings|E] fornecem diferentes níveis de [taxes|E] e [levies|E], bem como [buildings|E] que você pode construir e melhorar, dependendo do [holding_type|E].\n\n#TUT Sugerimos que você comece atualizando as #TUT_KW $building_curtain_walls_01$.#!#!"
 lesson_basics_buildings_no_GUI_highlight:0 "Edíficios ($lesson_basics_holdings$)"
 lesson_basics_camera:0 "Câmera ($lesson_basics$)"
 lesson_basics_camera_desc:0 "Use as teclas A, W, S e D para mover a câmera pelo mapa. Você também pode mover o cursor pelas bordas do mapa para movimentá-lo. Pressionar a tecla ‘HOME’ leva você para sua [realm_capital|E].\n\nPara aumentar ou diminuir o zoom, use a Rodinha do Mouse.\n\n#TUT Diferentes informações são mostradas de acordo com o nível do zoom; [detail_zoom|E], [political_zoom|E], e [paper_zoom|E].\n\nCom o zoom ampliado, você pode selecionar e administrar suas [holdings|E]. Diminuindo o zoom, você tem uma visão geral de todo seu [realms|E].#!"
 lesson_basics_casus_belli:0 "Guerra ($lesson_basics_war$)"
 lesson_basics_casus_belli_desc:0 "Para começar uma [war|E], você precisará de um motivo legítimo, um [casus_belli|E], contra outro [ruler|E].\n\nExistem várias maneiras de obter um $game_concept_casus_belli$: você talvez tenha [titles|E] [de_jure|E] que te faz o [rightful_liege|E] de seu alvo, você pode herdar [claims|E], ou você poderia perseguir [holy_wars|E] contra infiéis próximos.\n\nAlthough estes são os mais comuns, existem dezenas de tipos diferentes de $game_concept_casus_bellis$ para você descobrir e usar enquanto joga!\n\n#TUT A maneira mais fácil e direta de adquirir as $game_concept_claims$ é usar #EMP [fabricate_claim|E]#!. Isso é algo que o seu [court_chaplain|E] trata, por meio de uma das suas [councillor_tasks|E]."
 lesson_basics_change_map_mode_1_tt:0 "Mude para o modo de mapa de títulos de Ducado"
 lesson_basics_change_map_mode_2_tt:0 "Retornar ao modo de mapa de Reinos"
 lesson_basics_character:0 "III — Personagem"
 lesson_basics_characters:0 "Personagens ($lesson_basics_character$)"
 lesson_basics_characters_click_on_character:0 "Clique no seu Personagem"
 lesson_basics_characters_desc:0 "Você está jogando como um dos muitos [characters|E] neste mundo, representados pelos avatares dos Personagens. Seu Personagem é [ruler|E] de um [realm|E]!\n\n#TUT Você terá que ter certeza que sua [dynasty|E] sobreviva e prospere através das eras. Seu [titles|E] concede poder e controle sobre o território e outros Personagens (que podem querer deter títulos e terras próprias).#!"
 lesson_basics_choosing_a_spouse:0 "Filtro de Personagens ($lesson_basics_marriage$)"
 lesson_basics_choosing_a_spouse_desc:0 "Existem muitos fatores a serem considerados ao escolher um [spouse|E]. Para ajudá-lo, existe um filtro disponível para classificação. Entre as coisas a serem consideradas, existem [alliances|E], [skills|E], [traits|E] de personalidade, uma esperada [fertility|E], e mais.\n\nAlguns Traços são [congenital|E], o que significa que podem ser herdados pelos filhos — talvez alguém com um Traço como esse seja um bom lugar para começar?\n\n#TUT Você pode alterar sua seleção clicando no #TUT_KW Apagar Characters#! entre os personagens que você está configurando para se casar. Nada vai acontecer até você clicar #TUT_KW Send Proposal#!. #!"
 lesson_basics_choosing_a_spouse_no_GUI_highlight:0 "$lesson_basics_choosing_a_spouse$"
 lesson_basics_council:0 "XIII — Conselho"
 lesson_basics_council_concept:0 "Conselho ($lesson_basics_council$)"
 lesson_basics_council_concept_desc:0 "Gerenciar um [realm|E] é um trabalho árduo. Como [ruler|E], você conta com a ajuda do seu [council|E] - eles podem ser [vassals|E] ou membros da sua [court|E], e atuam como seus conselheiros de confiança.\n\n#TUT Existe uma posição no Conselho correspondente a cada [skill|E], e [rulers|E] casados também terão seus [spouse|E] os ajudando.#!"
 lesson_basics_council_fabricate_claim_tt:0 "Fabricar uma $game_concept_claim$ em um $game_concept_county$ fora das suas fronteiras"
 lesson_basics_council_tasks:0 "Tarefas do Conselho ($lesson_basics_council$)"
 lesson_basics_council_tasks_desc:0 "Os [councillors|E] podem ser designados para realizar diferentes tarefas!\n\nVocê pode alterar a tarefa de um Conselheiro clicando no botão próximo ao retrato deles na visualização do Conselho.\n\n#TUT Ser um Conselheiro é uma posição prestigiosa - [powerful_vassals|E] esperam ser nomeados e ficarão insatisfeitos se forem excluídos.#!"
 lesson_basics_council_view_tt:0 "Abra a vista do Conselho (destacado)"
 lesson_basics_culture:0 "Cultura"
 lesson_basics_culture_culture_head:0 "Culturas (Líder Cultural)"
 lesson_basics_culture_culture_head_desc:0 "O [culture_head|E] é o [ruler|E] de uma [culture|E] com o maior [realm|E]. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_culture_head_desc_INGAME', '' )]\n\nO Culture Head pode estabelecer novas Tradições para a sua Cultura.\n\nEles também desempenham um papel importante no desenvolvimento tecnológico e societal de sua Cultura, que veremos agora."
 lesson_basics_culture_culture_head_desc_INGAME:0 "[SelectLocalization(ObjectsEqual(GetPlayer, GetPlayer.GetCulture.GetCultureHead), 'lesson_basics_culture_culture_head_desc_YOU', 'lesson_basics_culture_culture_head_desc_OTHER' )]"
 lesson_basics_culture_culture_head_desc_OTHER:0 "[GetPlayer.GetCulture.GetCultureHead.GetName] é o Culture Head da sua Cultura."
 lesson_basics_culture_culture_head_desc_YOU:0 "Você é o Culture Head da sua Cultura."
 lesson_basics_culture_elements:0 "Culturas"
 lesson_basics_culture_elements_desc:0 "Uma [culture|E] é definida por suas [Concept('ethos', 'Éticas')|E], [culture_pillars|E] e [traditions|E]. Cada um determina vários benefícios ou penalidades para todos os membros da cultura.\n\nA #V Ética#! descreve os valores principais de uma cultura. É o principal determinante do que as Tradições estão disponíveis para uma cultura. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_elements_desc_INGAME', '' )]\n\nOs #V Pilares Culturais#! refletem as origens de uma cultura e também não podem ser alterados. Eles têm um grande impacto na [cultural_acceptance|E] de outras culturas, mas são de menor importância do que a Ética.\n\nAs #V Tradições#! de uma cultura são mais flexíveis, mas ainda podem ser incrivelmente importantes para uma cultura. Ao contrário da Ética e dos Pilares, as Tradições podem ser alteradas pelo líder cultural, que é nosso próximo tópico."
 lesson_basics_culture_elements_desc_INGAME:0 "A Ética da sua cultura, [GetPlayer.GetCulture.GetCollectiveNounNoTooltip], é [GetPlayer.GetCulture.GetEthos.GetName]."
 lesson_basics_culture_innovations:0 "Culturas (Inovações)"
 lesson_basics_culture_innovations_desc:0 "[innovations|E] são as invenções e adaptações que uma [culture|E] pode descobrir ao longo do tempo. $game_concept_innovations$ dão novos bônus, [buildings|E] e [men_at_arms|E] para todos os membros da $game_concept_culture$.\n\nAs inovações são agrupadas em [eras|E], então a maioria das inovações simplesmente não estão disponíveis nas partes iniciais do jogo. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_innovations_desc_INGAME', '' )]"
 lesson_basics_culture_innovations_desc_INGAME:0 "Sua Cultura está atualmente na Era [GetPlayer.GetCulture.GetCultureEra.GetName]."
 lesson_basics_culture_innovations_open:0 "Culturas (Inovações)"
 lesson_basics_culture_innovations_open_desc:0 "Sua [culture|E] determina quais [innovations|E] você tem acesso, mostrado na aba Inovações."
 lesson_basics_culture_innovations_spread:0 "Culturas (Inovações)"
 lesson_basics_culture_innovations_spread_desc:0 "[innovations|E] são geralmente descobertas muito lentamente. No entanto, o [culture_head|E] também pode fazer uma [culture|E] descobrir uma Inovação mais rapidamente, escolhendo-a como [fascination|E] da Cultura (destacada).\n\n#I Quando você é o líder cultural, pode clicar em uma Inovação para defini-la como a nova Fascinação.#!\n\nCulturas também descobrem Inovações mais rapidamente se já foram descobertas por Culturas vizinhas."
 lesson_basics_culture_open_innovations_tab_trigger:0 "Abra a aba Inovações (destacado)"
 lesson_basics_culture_open_view:0 "Culturas"
 lesson_basics_culture_open_view_desc:0 "Cada [character|E] e [county|E] pertence a uma [culture|E]. [SelectLocalization( GetPlayer.IsValid, 'lesson_basics_culture_open_view_desc_INGAME', '' )]"
 lesson_basics_culture_open_view_desc_INGAME:0 "\n\nSeu atual [ruler|E] faz parte da cultura [GetPlayer.GetCulture.GetNameNoTooltip], como mostrado no canto inferior esquerdo."
 lesson_basics_culture_open_view_trigger:0 "Abrir a Visualização de Cultura (destacado)"
 lesson_basics_de_jure_cbs:0 "De Jure $lesson_basics_de_jure_titles$"
 lesson_basics_de_jure_cbs_complete_1:0 "$lesson_basics_de_jure_cbs$"
 lesson_basics_de_jure_cbs_complete_2:0 "$lesson_basics_de_jure_cbs$"
 lesson_basics_de_jure_cbs_desc:0 "Dizemos \"legalmente\" porque, como Crusader Kings III permite que você jogue com a história, não há como garantir que um [king|E] esteja #EMP realmente#! no controle de todos os [titles|E] que seu [kingdom|E] está \"supostamente\" a conter dentro de suas fronteiras.\n\nChamamos essa hierarquia de $game_concept_title$ de [de_jure|E], e se a estrutura estiver quebrada, muitas vezes é possível declarar guerra por territórios errantes.\n\n#TUT Se você mudar para o modo de mapa de Títulos de Ducados, poderá ver que, como governante do [duchy|E] de $d_munster$, o [county|E] de $c_desmond$ deveria, legalmente, fazer parte do seu reino.#!"
 lesson_basics_de_jure_titles:0 "Títulos ($lesson_basics_titles$)"
 lesson_basics_de_jure_titles_desc:0 "A maioria dos [titles|E] pertence a uma hierarquia em forma de pirâmide, de acordo com seu [title_tier|E] de $game_concept_title$:\n\n[barony|E] - governado por um Barão ou Baronesa\n[county|E] - governado por um Conde ou Condessa\n[duchy|E] - governado por um Duque ou Duquesa\n[kingdom|E] - governado por um Rei ou Rainha\n[empire|E] - governado por um Imperador ou Imperatriz\n\nCada $game_concept_title$ faz legalmente parte de um $game_concept_title$ um nível acima na hierarquia, por exemplo, cada $game_concept_county$ é assim parte de um $game_concept_duchy$.\n\n#TUT Observação: Existem muitos nomes dinâmicos para esses Títulos - seu governante atual é responsável por um \"Reino Pequeno\", que corresponde ao Nível [duchy|E].#!"
 lesson_basics_domain:0 "XII — Domínio"
 lesson_basics_domain_1:0 "Reino e Domínio ($lesson_basics_domain$)"
 lesson_basics_domain_1_b:0 "Reino e Domínio ($lesson_basics_domain$)"
 lesson_basics_domain_1_b_desc:0 "Um exemplo: o [county|E] Essex está vivendo uma queda no número de soldados disponíveis, devido à área sendo invadida por #EMP cannibals#!. O [holder|E] de Essex será alertado sobre isso, pois está dentro da fronteira de seu [domain|E]. O seu [liege|E] não será. \n\n#TUT O #EMP Senhor Feudal#! do Condado de Essex, tem Essex dentro do seu [realm|E], e só descobrirão o que está acontecendo porque clicaram no condado no mapa e viram o modificador. Ou, se eles notaram que seu Vassalo estava fornecendo menos milícias."
 lesson_basics_domain_1_desc:0 "Seu #EMP [realm|E]#! é o conjunto completo de terras e [titles|E] que você controla, incluindo as áreas mantidas por seus [vassals|E]. No momento, isso significa os [counties|E] (chamados de 'Condados ou Earldoms', devido à sua [culture|E] irlandesa) de $c_ennis$, $c_thomond$ e $c_ormond$.\n\nQuando o #EMP [domain|E]#! é usado, estamos nos referindo à terra que você possui pessoalmente, sem $game_concept_vassals$: $c_ennis$ e $c_thomond$.\n\n#TUT Algumas coisas que acontecem afetarão apenas o seu [domain|E] ($c_ennis$ e $c_thomond$), enquanto outras afetarão todo o seu [realm|E], o [duchy|E] (ou 'Reino Pequeno') de Munster.#!"
 lesson_basics_domain_2:0 "$lesson_basics_domain_1$"
 lesson_basics_domain_2_desc:0 "Repare que há um limite para a quantidade de terreno que você pode manter pessoalmente, antes de começar a incorrer em penalidades: o [domain_limit|E].\n\n#TUT Quando você ultrapassar o limite do seu domínio, pode ser uma boa ideia usar o #TUT_KW Grant Title#! interação com [characters|E] você tem amizade, tornando-os seus [vassals|E].\n\nComo você não tem títulos excedentes para doar, você não pode fazer isso no momento, mas de outra forma você o encontraria no $game_concept_character$ menu, visível ao clicar com o botão direito em um $game_concept_character$.#!"
 lesson_basics_dynasty_and_house:0 "Dinastia e Casa($lesson_basics_titles$)"
 lesson_basics_dynasty_and_house_desc:0 "Família é importante! O [player_heir|E] virá sempre da sua [dynasty|E], e na maioria das vezes de sua [house|E].\n\n#TUT No futuro, não faz mal ficar de olho na sua família - e na [line_of_succession|E] #EMP deles#!. Dependendo das [succession_laws|E], você pode acabar herdando [titles|E] (along with land and [vassals|E]) from your relatives.#!"
 lesson_basics_find_spouse_concept:0 "Escolhendo um Cônjuge ($lesson_basics_marriage$)"
 lesson_basics_find_spouse_concept_desc:0 "Escolher #TUT_KW Encontrar Cônjuge#! abre uma lista de potenciais [spouses|E] — eles vêm de [courts|E] de todo o Mundo!\n\nChoosing #TUT_KW Arranjar Casamento#! também abre uma lista de potenciais [spouses|E], mas apenas com pessoas da [court|E] do personagem que você clicou.\n\n#TUT Ynosso próprio Personagem é visível à esquerda, porque este casamento precisa #EMP your#! aprovação. Quem é o [liege|E] do outro cônjuge aparecerá no lado direito, pois a união também precisará de sua aprovação.\n\n#TUT_KW Arranjar Casamento#! pode ser útil para fazer combinações entre seus [courtiers|E], ou para estabelecer uma [alliance|E] matrimonial específica. Por enquanto, #TUT_KW Encontrar Cônjuge#! é mais relevante para nossos propósitos.#!"
 lesson_basics_get_married_tt:0 "Get married — select a Spouse for your Character and click #TUT_KW Send Proposal #! to suggest the union"
 lesson_basics_happy_vassals:0 "$lesson_basics_vassals_concept$"
 lesson_basics_happy_vassals_desc:0 "Vale a pena manter seus [vassals|E] felizes - isso os mantém longe de [schemes|E] e [factions|E] contra você.\n\nNão importa o quão poderoso seja o [ruler|E] seu [character|E], se o seu [realm|E] se unir contra você, seja para te [depose|E] através de [war|E] ou apenas para [GetScheme('murder').GetTypeName] você enquanto dorme, seu reinado está fadado a ser interrompido.\n\n#TUT Alguns dos seus Vassalos podem servir em seu [council|E], tornando sua [opinion|E] extra importante, pois eles serão confiados com as [councillor_tasks|E].#!"
 lesson_basics_holdings:0 "X — Propriedades"
 lesson_basics_holdings_and_buildings:0 "Suas Propriedades ($lesson_basics_holdings$)"
 lesson_basics_holdings_and_buildings_desc:0 "O [de_jure|E] Título de Munster consiste em três [counties|E]. Seus nomes devem estar visíveis no mapa: Thomond (possuído por você), Desmond (possuído por um [ruler|E]) vizinho, and Ormond (possuído pelo seu [vassal|E]).\n\nEstes [counties|E] são compostos de pequenos pedaços de terra chamados [baronies|E]. É neste nível que encontramos as suas [holdings|E]. \n\n#TUT Propriedades representam assentamentos em sua terra!#!"
 lesson_basics_hooks:0 "Secrets ($lesson_basics_schemes$)"
 lesson_basics_hooks_and_secrets_tab_tt:0 "Inspecione o separador Ganchos e Segredos"
 lesson_basics_hooks_complete:0 "Ganchos ($lesson_basics_schemes$)"
 lesson_basics_hooks_complete_desc:0 "Este [weak_hook|E] pode ser usado para várias coisas. Por exemplo, você pode aumentar as [obligations|E] definidas pelo [vassal_contract|E] que você tem com um [vassal|E] [GetGovernment('feudal_government').GetName].\n\n#TUT Para acessar o menu para alterar seu Contrato de Vassalo, vá para a lista de Vassalos na visualização do Reino, ou clique com o botão direito no retrato dele para escolher #TUT_KW Modificar Contrato de Vassalo.#!\n\nVocê pode notar que algumas interações não estão imediatamente visíveis. Quando você tem muitas interações disponíveis, o menu de interações do [character|E] exibe apenas as mais comuns.\n\nPara exibir interações ausentes, clique no botão \"Mais...\" em uma categoria.#!"
 lesson_basics_hooks_desc:0 "Às vezes, [schemes|E] podem dar origem a [secrets|E] — se você pegar alguém tentando cometer [GetScheme('murder').GetTypeName], provavelmente é do interesse deles garantir que você mantenha isso em segredo.\n\nVocê também pode [blackmail|E] eles para obter um [hook|E]! $game_concept_hooks$ representam um favor que você pode pedir ou um controle que você tem sobre um [character|E] específico, permitindo que você os encoraje (ou force) a fazer o que deseja.\n\nConforme você joga, encontrará muitas maneiras diferentes de obter e usar $game_concept_hooks$. Experimente com eles!\n\n#TUT Em seguida, vamos fingir que você conseguiu obter um [hook|E] em um de seus [vassals|E]...#!"
 lesson_basics_interacting:0 "VI — Interagindo"
 lesson_basics_interacting_1:0 "Outros Personagens ($lesson_basics_interacting$)"
 lesson_basics_interacting_1_desc:0 "Agora, tendo selecionado um [focus|E], podemos continuar para outras pessoas! Se você é novo neste jogo, interagir com outros [characters|E] é a chave, e você tem muitas opoções de como fazê-lo.\n\n#TUT Você pode clicar com o botão direito no retrato de um Personagem, incluindo o seu próprio, para ter acesso a uma lista de interações possíveis, como arranjar um casamento ou iniciar um [scheme|E]. Aqui também é onde você começa [wars|E], mas vamos tentar outra coisa primeiro.#!"
 lesson_basics_interacting_2:0 "Mandar Presente ($lesson_basics_interacting$)"
 lesson_basics_interacting_2_desc:0 "Vamos começar com o básico - todo mundo gosta de ouro! Tente enviar um suborno para o seu herdeiro.\n\n#TUT A maioria das [interactions|E] abrirá uma segunda janela com detalhes quando selecionadas. Você pode confirmar ou cancelar uma ação nesta janela.#!"
 lesson_basics_interacting_3:0 "Presente Enviado ($lesson_basics_interacting$)"
 lesson_basics_interacting_3_desc:0 "Bem feito! Você #P aumentou#! com sucesso a [opinion|E] de alguém sobre você.\n\nCertos modificadores de Opinião duram para sempre, como laços familiares. Outros irão desaparecer com o tempo, como a memória desvanescente de receber um presente em dinheiro...\n\n#TUT Se você passar seu cursor sobre o número da Opinião de outro Personagem, você pode ver exatamente de onde os vários números estão vindo. Isto se deve graças a uma aliança matrimonial , um presente de ouro, ou simplesmente que eles apreciam sua natureza honesta?#!"
 lesson_basics_intrigue_view_tt:0 "Abra a vista Intriga (destacado)"
 lesson_basics_landed_titles:0 "Terrenos e títulos ($lesson_basics_titles$)"
 lesson_basics_landed_titles_desc:0 "Nem todos na sua [dynasty|E] serão proprietários de terras, mas cada pedaço de terra no mapa #EMP tem#! um dono.\n\nÀs vezes, esse dono é você, às vezes é um de seus [vassals|E], e às vezes é outro [realm|E] completamente (muitos dos quais também têm ou são $game_concept_vassals$)."
 lesson_basics_levies:0 "Guerra ($lesson_basics_war$)"
 lesson_basics_levies_complete:0 "$lesson_basics_levies$"
 lesson_basics_levies_desc:0 "Os eventos mais importantes em qualquer guerra são as [battles|E], que são travadas por [armies|E]. A maioria dos seus soldados virá das [levies|E], mas você pode expandir seu $game_concept_army$ empregando soldados profissionais (homens de armas).\n\n#TUT Se as coisas ficarem realmente difíceis, você também pode contratar [mercenaries|E] — desde que tenha [gold|E] suficiente!#!"
 lesson_basics_lifestyle_choose_focus_tt:0 "Escolha um Foco"
 lesson_basics_lifestyle_open_window_tt:0 "Clique no butão de Estilo de Vida (destacado)"
 lesson_basics_lifestyles:0 "V — Estilo de Vida"
 lesson_basics_lifestyles_1:0 "Estilos de Vida ($lesson_basics_lifestyles$)"
 lesson_basics_lifestyles_1_desc:0 "Além de ter [traits|E], seu [character|E] também pode escolher um [lifestyle|E]. Existem [SelectLocalization( HasDlcFeature( 'wandering_nobles' ), 'number_six', 'number_five' )] $game_concept_lifestyles$, um para cada habilidade.\n\n$game_concept_lifestyles$ representam onde você concentra seus esforços no dia a dia, e cada um possui vários [focuses|E] relacionados.\n\nCada $game_concept_focus$ concede um bônus único e aumenta a chance de eventos associados a esse $game_concept_focus$ acontecerem."
 lesson_basics_lifestyles_2:0 "Foco ($lesson_basics_lifestyles$)"
 lesson_basics_lifestyles_2_b:0 "$lesson_basics_lifestyles_2$"
 lesson_basics_lifestyles_2_b_desc:0 "Tendo selecionado um [focus|E], você pode já ter achado que seu [character|E] irá ganhar [lifestyle_experience|E] com o passar do tempo. $lesson_basics_lifestyles_2_reuse$#!"
 lesson_basics_lifestyles_2_desc:0 "Clique em qualquer [lifestyle|E] para ver seus [focuses|E].\n\nCom o tempo, seu [character|E] ganhará [lifestyle_experience|E] por manter um determinado $game_concept_lifestyle$. Quando você adquirir experiência suficiente, poderá escolher um dos [perks|E] desse $game_concept_lifestyle$ de qualquer uma de suas árvores.\n\n$game_concept_perks$ representam você praticando e desenvolvendo-se ao longo do tempo e oferecem bônus exclusivos (como traços especiais) ou desbloqueiam mecânicas e conteúdo específicos do $game_concept_lifestyle$ (como a habilidade de iniciar [schemes|E] de [GetScheme('abduct').GetTypeName]).$lesson_basics_lifestyles_2_reuse$"
 lesson_basics_lifestyles_2_reuse:0 "\n\n#TUT Como um exemplo, o $martial_strategy_focus_short$, $martial_authority_focus_short$, assim como o Foco $martial_chivalry_focus_short$, todos dão Experiência Marcial, que podem ser usadas para comprar quaisquer [perks|E] de Estilo de Vida Marcial.\n\nA árvore de Vantagens, por sua vez, levam a diferentes Traços de Estilo de Vida!#!"
 lesson_basics_lifestyles_no_GUI_highlight:0 "$lesson_basics_lifestyles_2$"
 lesson_basics_many_lives_1:0 "Jogando com uma Família ($lesson_basics_succession$)"
 lesson_basics_many_lives_1_desc:0 "Agora, vamos falar sobre a sua [dynasty|E]. Conforme o jogo avança, a menos que o seu [character|E] encontre um \"acidente\" prematuro ou uma terrível doença, ele vai envelhecer e, eventualmente, morrer.\n\n#TUT A história não termina aí - só termina [game_over|E] se você não tiver um herdeiro de sua própria dinastia!#!"
 lesson_basics_many_lives_2:0 "Um Herdeiro ($lesson_basics_succession$)"
 lesson_basics_many_lives_2_desc:0 "Desde que os seus [titles|E] tenham [heirs|E] de sua [dynasty|E], o seu legado continuará. Quando o seu atual [character|E] morrer, você simplesmente começa a jogar com um novo: o [player_heir|E].\n\nDependendo do tipo de [succession|E] que o seu [realm|E] tem, é provável que seja um dos seus filhos - talvez um que você tenha preparado para [Concept('ruler', 'Governar')|E]?\n\n#TUT A sua $game_concept_dynasty$ tem seu próprio brasão, que está destacado no momento, e pode ser clicado para obter mais informações.\n\nVocê não precisa fazer nada com isso agora, mas se quiser ver os detalhes da sua $game_concept_dynasty$ mais tarde, você pode encontrá-la aqui.\n\n#!"
 lesson_basics_many_lives_2_no_GUI_highlight:0 "$lesson_basics_many_lives_2$"
 lesson_basics_map:0 "II — Mapa"
 lesson_basics_map_modes:0 "Governando sobre Outros ($lesson_basics_map$)"
 lesson_basics_map_modes_desc:0 "Como [ruler|E], você só pode ter tanta terra por conta própria — você terá frequentemente outros $game_concept_rulers$ ajudando na administração do [realm|E] ao manter terras ([titles|E]) dentro de suas fronteiras, tornando-os seus [vassals|E].\n\n#TUT Para encontrar sua própria terra, seu [domain|E], pressione a tecla 'Home' e aproxime-se. Uma vez mais perto, você pode ver etiquetas azuis nos [baronies|E] que pertencem a você (neste caso, será $cn_luimneach$ e $cn_inis$).\n\nO Condado de $c_ormond$ é detido pelo seu Vassalo.#!"
 lesson_basics_marriage:0 "VIII — Matrimônio"
 lesson_basics_marriage_concept_1:0 "Casamento ($lesson_basics_marriage$)"
 lesson_basics_marriage_concept_1_desc:0 "Para garantir o futuro da sua [dynasty|E], você precisa de membros da família. Ajuda se você for [married|E], mas não podemos prometer que você vai se casar por amor. @arrange_marriage_icon!"
 lesson_basics_marriage_concept_2:0 "Encontrando um Cônjuge ($lesson_basics_marriage$)"
 lesson_basics_marriage_concept_2_b:0 "$lesson_basics_marriage_concept_2$"
 lesson_basics_marriage_concept_2_b_desc:0 "Embora seu personagem já seja casado, vamos guiá-lo através das etapas envolvidas.\n\nPara personagens solteiros no seu [domain|E], você pode combinar [marriages|E] (ou [betrothals|E]) clicando com o botão direito no personagem e escolhendo #TUT_KW Encontrar Cônjuge#!, ou #TUT_KW Arranjar Casamento#!.\n\n#TUT Você não precisa se casar com outra pessoa, mas selecionar #TUT_KW Encontrar Cônjuge#! irá abrir a vista Casamento para nós.#!"
 lesson_basics_marriage_concept_2_desc:0 "Vamos nos casar!\n\nPara personagens solteiros em seu [domain|E], você pode combinar [marriages|E] (ou [betrothals|E]) clicando com o botão direito no personagem e escolhendo #TUT_KW Encontrar Cônjuge#!, ou #TUT_KW Arranjar Casamento#!.\n\n#TUT As duas opções se comportam de maneira diferente, então vamos examinar as duas...#!"
 lesson_basics_marriage_final_notes:0 "Parabéns! ($lesson_basics_marriage$)"
 lesson_basics_marriage_final_notes_desc:0 "Excelente! Que vocês vivam longos e felizes juntos!\n\n#TUT Você deve ter notado a mensagem #bold Toast#! no topo da tela - as mensagens Toast fornecem informações rápidas relevantes para você ou seu personagem. Os casamentos também são geralmente acompanhados de um #bold Evento#! quando o [liege|E] potencial do seu possível [spouse|E] aceita (ou rejeita) sua oferta com uma carta. Existem diferentes tipos de eventos e eles são fundamentais para moldar seu destino, então fique atento a eles!#!\n\nPara este tutorial, recomendamos que você use o #TUT_KW Encontrar Cônjuge#! também para seu filho.\n\n#TUT Assim que seu filho estiver casado, ele pode começar a produzir membros de sua família (e [heirs|E] para seus [titles|E] que são de sua [dynasty|E]).#!"
 lesson_basics_marriage_instruction_open_window:0 "$lesson_basics_marriage_concept_1$"
 lesson_basics_marriage_instruction_open_window_desc:0 "Vamos encontrar alguém com quem seu personagem se casar!"
 lesson_basics_marriage_view_tt:0 "Seleciona #TUT_KW Encontrar Cônjuge#!"
 lesson_basics_military_view_tt:0 "Abra a vista Militar (Destacado)"
 lesson_basics_open_character_view_tt:0 "Abra a Visualização de Personagem"
 lesson_basics_open_interactions_marriage_alt_tt:0 "Clique com o botão direito em um #EMP unmarried#! Personagem"
 lesson_basics_open_interactions_marriage_tt:0 "Clique com o botão direito no seu próprio personagem"
 lesson_basics_open_interactions_tt:0 "Clique com o botão direito no retrato do seu herdeiro $game_concept_character$ para ver as interações disponíveis"
 lesson_basics_opinion:0 "Opinião ($lesson_basics_character$)"
 lesson_basics_opinion_desc:0 "Todos os [characters|E] (sim, #EMP todos#!) têm uma [opinion|E] uns dos outros, que impulsiona seu comportamento.\n\n#N Uma#! $game_concept_opinion$ baixa pode fazer as pessoas se revoltarem contra você ou se recusarem a ajudá-lo. #P Uma#! $game_concept_opinion$ alta, por outro lado, pode fazer com que $game_concept_characters$ fiquem mais inclinados a se juntar aos seus [schemes|E]...\n\n#TUT Como você escolhe interagir com outros $game_concept_characters$ frequentemente afetará a opinião deles sobre você.#!"
 lesson_basics_paused_intro:0 "Pausando ($lesson_basics$)"
 lesson_basics_paused_intro_desc:0 "Crusader Kings III abrange centenas de anos e várias gerações. No momento, o tempo está parado porque o jogo está #EMP pausado#!.\n\n#TUT Nesta parte do tutorial, manteremos o jogo pausado enquanto explicamos alguns conceitos do jogo.#!"
 lesson_basics_pausing_2:0 "Quase lá ($lesson_basics_unpause$)"
 lesson_basics_pausing_2_desc:0 "Em breve, deixaremos você retomar o jogo! Existem apenas algumas coisas para revisar primeiro.\n\nEm primeiro lugar, é importante saber que existem cinco velocidades diferentes disponíveis para você jogar (pressione as teclas 1-5 para alternar facilmente entre elas), e você poderá pausar ou alterar o ritmo sempre que quiser.\n\n#BOLD Em segundo lugar, para certos eventos importantes, o jogo fará uma pausa automática para você.#!\n\n#TUT Não há nada de errado em jogar em velocidades mais baixas, aumentar a velocidade quando as coisas estão quietas ou desacelerar quando você vai para a guerra.\n\nGeralmente, recomendamos que você pause o jogo ao inspecionar os menus ou quando se deparar com decisões difíceis.#!"
 lesson_basics_pausing_3:0 "Iniciando o Jogo ($lesson_basics_unpause$)"
 lesson_basics_pausing_3_desc:0 "Para iniciar o avanço do tempo, despause o jogo (usando a tecla #EMP Barra de Espaço# ou clicando no botão de reprodução no canto inferior direito).\n\nIsso permitirá que os dias, meses e anos passem. Exércitos instruídos a marchar se moverão, eventos ocorrerão na tela, cartas serão enviadas e os [characters|E] envelhecerão.\n\n#TUT Encontre uma velocidade que seja confortável para você — você sempre pode alterá-la posteriormente.#!"
 lesson_basics_quick_camera:0 "Câmera"
 lesson_basics_quick_camera_desc:0 "Use as teclas W, A, S e D para mover a câmera pelo mapa.\n\nVocê também pode mover o cursor para a borda da tela para deslocar a visão.\n\nPressionar a tecla '#V Home#!' no seu teclado retorna você para sua casa em [GetPlayer.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip]."
 lesson_basics_quick_characters:0 "Personagens"
 lesson_basics_quick_characters_desc:0 "Você joga como [GetPlayer.GetShortUINameNotMeNoTooltip], um dos muitos [characters|E] deste mundo, representado por avatares de personagens.\n\nSeu personagem é o [ruler|E] de um [realm|E] feudal!"
 lesson_basics_quick_council_1:0 "O Conselho"
 lesson_basics_quick_council_1_desc:0 "Felizmente, você não precisa gerenciar seu [realm|e] sozinho. Vamos dar uma olhada no seu [council|e], outra visualização acessível na barra à direita."
 lesson_basics_quick_council_2:0 "O Conselho"
 lesson_basics_quick_council_2_desc:0 "@tutorial_screenshot_4! Este é o seu [council|e], que consiste em seis [councillors|e], incluindo seu [spouse|e]. Eles podem, por exemplo, $task_collect_taxes$ ou $task_find_secrets$ através das [councillor_tasks|e]."
 lesson_basics_quick_council_3:0 "Tarefas dos Conselheiros"
 lesson_basics_quick_council_3_desc:0 "Vamos tentar usar uma [councillor_task|e]! Não seria bom se você tivesse outro [county|e] dentro do seu [realm|e]? Para conseguir isso, você precisará de uma [claim|e]. Você pode fazer com que seu [realm_priest|e] fabrique uma."
 lesson_basics_quick_done:0 "Boa Sorte!"
 lesson_basics_quick_done_desc:0 "Parabéns por completar o Tutorial Rápido! O jogo agora está despausado, e o tempo está progredindo. A partir deste ponto, cabe a você moldar o futuro da Casa [GetPlayer.GetHouse.GetName].\n\n#TUT Você é livre para fazer o que quiser, mas fique de olho em @reactive_advice_icon! Conselhos Reactivos aparecendo no topo da sua tela.\n\nQuem sabe, talvez você até se torne o Rei da Irlanda?#!"
 lesson_basics_quick_find_spouse_tt:0 "Casar-se"
 lesson_basics_quick_holdings:0 "Posses"
 lesson_basics_quick_holdings_desc:0 "Atualmente, o seu [domain|E] consiste dos [counties|E] (chamados 'Earldoms', devido à sua [culture|E] irlandesa) de $c_thomond$ e $c_ennis$. Como $c_ormond$ é mantido pelo seu [vassal|e], ele não faz parte do seu $game_concept_domain$.\n\nEsses [counties|E] são compostos de partes menores de terra - [baronies|E], as [holdings|E] individuais de um [realm|E].\n\n#TUT As posses representam assentamentos em suas terras!#!"
 lesson_basics_quick_marriage_window:0 "$lesson_basics_quick_this_is_you_2$"
 lesson_basics_quick_marriage_window_desc:0 "Encontrar o [spouse|E] certo não é fácil, mas algumas coisas para ter em mente:\n\n$EFFECT_LIST_BULLET$Política: [marriages|E] são a principal forma de formar uma [alliance|E]\n$EFFECT_LIST_BULLET$Habilidade: As [skills|E] dela serão adicionadas às suas\n$EFFECT_LIST_BULLET$Genética: [congenital_traits|E], como [GetTrait('intellect_good_2').GetName( GetNullCharacter )], podem ser herdadas por seus [children|E]\n$EFFECT_LIST_BULLET$Nobreza: Casar-se com um [lowborn|E] fará você perder [prestige|E]"
 lesson_basics_quick_married_great_job:0 "Seu Cônjuge"
 lesson_basics_quick_married_great_job_desc:0 "Parabéns por se casar!\n\nA união entre você e seu [spouse|e] forjou uma [alliance|e] entre você e o [ruler|e] do [realm|e] de onde vem o seu $game_concept_spouse$. Isso significa que vocês podem se chamar para participar de [wars|e] um do outro!\n\n#TUT Se não houver outros membros vivos de sua [dynasty|e] após a morte do seu personagem, você perderá o jogo. Ter um $game_concept_spouse$ pode ajudá-lo a evitar isso.#!"
 lesson_basics_quick_nested_tooltips:0 "Dicas Aninhadas"
 lesson_basics_quick_nested_tooltips_complete:0 "$lesson_basics_quick_nested_tooltips$"
 lesson_basics_quick_nested_tooltips_complete_desc:0 "$lesson_basics_quick_nested_tooltips_desc$"
 lesson_basics_quick_nested_tooltips_desc:0 "$lesson_basics_tooltips_in_tooltips_desc$"
 lesson_basics_quick_nested_tooltips_hover_word:0 "$lesson_basics_tooltips_in_tooltips_hover_word$"
 lesson_basics_quick_nested_tooltips_hover_word_deeper:0 "$lesson_basics_tooltips_in_tooltips_hover_word_deeper$"
 lesson_basics_quick_realm:0 "Reino"
 lesson_basics_quick_realm_desc:0 "Vamos dar uma olhada na barra do lado direito da tela. Existem alguns botões aqui, mas para começar, estamos interessados em olhar para o seu [realm|e]."
 lesson_basics_quick_realm_great_job:0 "Condados e Posses"
 lesson_basics_quick_realm_great_job_desc:0 "Lembra dos [titles|e] que vimos anteriormente? Nesta visualização, você pode inspecionar a terra que eles representam com mais detalhes. Eles são [counties|e], mas têm um nome diferente e único por causa da sua [culture|e] irlandesa.\n\n$game_concept_counties$ (ou, no seu caso, Condados) são compostos por partes menores de terra chamadas [holdings|e]. Uma $game_concept_holding$ pode suportar várias [buildings|e], que fornecem vários benefícios."
 lesson_basics_quick_relationships:0 "Outros Personagens"
 lesson_basics_quick_relationships_desc:0 "@tutorial_screenshot_3!\nNesta seção, você pode ver uma variedade de outros [characters|e] com os quais você tem uma conexão. Isso inclui sua [family|e], qualquer pessoa com quem você tenha um [relationship|e], seus [courtiers|e] e seus [subjects|e]."
 lesson_basics_quick_resources_1:0 "Recursos"
 lesson_basics_quick_resources_1_desc:0 "Bom trabalho! Seu [councillor|e] está trabalhando agora para obter uma [claim|e] para você.\n\nEm seguida, vamos dar uma olhada na barra no canto superior direito da tela. Aqui, você encontrará vários recursos que podem ser usados para interagir com o mundo de várias maneiras."
 lesson_basics_quick_resources_gold:0 "@gold_icon! $game_concept_gold$"
 lesson_basics_quick_resources_gold_desc:0 "[gold_i|e] [gold|e] é uma medida de sua riqueza pessoal e pode ser usado para pagar por várias coisas, incluindo edifícios, exércitos e subornos. \n\nGeralmente falando, ter uma boa [skill|e] de [stewardship_i|e][stewardship|e] irá ajudá-lo em seus empreendimentos de ganhar $game_concept_gold$."
 lesson_basics_quick_resources_piety:0 "[piety_i|e] $game_concept_piety$"
 lesson_basics_quick_resources_piety_desc:0 "[piety_i|e] [piety|e] é um recurso que reflete o quão virtuoso é seu personagem. Pode ser gasto para interagir com sua [faith|e] de várias maneiras, como declarar [holy_wars|e].\n\nSeu [piety_level|e] também aumenta com sua $game_concept_piety$ acumulada. Focar em [learning_i|e][learning|e] pode ser uma boa ideia para um personagem especialmente devoto."
 lesson_basics_quick_resources_prestige:0 "@prestige_icon! $game_concept_prestige$"
 lesson_basics_quick_resources_prestige_desc:0 "[prestige_i|e] [prestige|e] representa sua glória e renome pessoal. À medida que você ganha $game_concept_prestige$, você também aumentará seu [prestige_level|e].\n\nComo recurso, $game_concept_prestige$ pode ser gasto para tomar decisões seculares dentro do seu [realm|e]. Um alto [diplomacy_i|e][diplomacy|e] ajudará você a ganhar mais $game_concept_prestige$."
 lesson_basics_quick_resources_renown:0 "@dynasty_prestige_icon! $game_concept_dynasty_prestige$"
 lesson_basics_quick_resources_renown_desc:0 "[dynasty_prestige_i|e] [dynasty_prestige|e] da dinastia representa o quão influente é sua [dynasty|e], e pode ser gasto em decisões que moldarão o futuro de sua família.\n\n$game_concept_dynasty_prestige$ está ligado ao seu [dynasty_prestige_level|e], que é uma medida geral de quão famosa é sua $game_concept_dynasty$."
 lesson_basics_quick_resources_time:0 "Tempo"
 lesson_basics_quick_resources_time_desc:0 "Agora que terminamos de falar sobre recursos, vamos encerrar com algumas últimas dicas. No momento, o jogo está pausado. Você pode controlar a velocidade com que o tempo progride no mundo no canto inferior direito.\n\n#TUT Crusader Kings III é um jogo que se desenrola ao longo de centenas de anos, então fique à vontade para ir com calma.#!"
 lesson_basics_quick_skills:0 "Habilidades"
 lesson_basics_quick_skills_desc:0 "Personagens também têm [skills|e]! Vamos dar uma olhada nelas.\n\nAs cinco principais $game_concept_skills$ que definem as habilidades do seu personagem são [diplomacy_i|e][diplomacy|e], [martial_i|e][martial|e], [stewardship_i|e][stewardship|e], [intrigue_i|e][intrigue|e] e [learning_i|e][learning|e].\n\n#TUT $game_concept_skills$ podem mudar ao longo do jogo com base em suas ações.#!"
 lesson_basics_quick_this_is_you_1:0 "Este É Você"
 lesson_basics_quick_this_is_you_1_desc:0 "Aqui é onde você verá a si mesmo e sua [family|e] mais próxima.\n\nÀ direita, você pode ver seu [heir|e], que está definido para herdar seu $game_concept_realm$ após sua morte.\n\n#TUT Se você se perder no mapa, pode clicar no seu personagem para recentrar a câmera em seu [realm|e].#!"
 lesson_basics_quick_this_is_you_2:0 "Seu Cônjuge"
 lesson_basics_quick_this_is_you_2_desc:0 "Normalmente, é uma boa ideia ter um [spouse|E]. Eles ajudarão você a governar seu [realm|e] e garantir o futuro da sua [dynasty|e].\n\nNo momento, você não é casado. Que tal fazermos algo a respeito?"
 lesson_basics_quick_this_is_you_3:0 "Traços"
 lesson_basics_quick_this_is_you_3_desc:0 "Estes são os [traits|e] do seu personagem! Como você pode ver, ele é @temperate_icon_tutorial! [GetTrait('temperate').GetName( GetNullCharacter )], @gregarious_icon_tutorial! [GetTrait('gregarious').GetName( GetNullCharacter )], e @impatient_icon_tutorial! [GetTrait('impatient').GetName( GetNullCharacter )].\n\n#TUT $game_concept_traits$ afetam como seu personagem reage a eventos no mundo do jogo. Você também pode adquirir novos traits enquanto joga.#!"
 lesson_basics_quick_unpause_tt:0 "Despausar o jogo pressionando a barra de espaço, ou clicando no botão no canto inferior direito"
 lesson_basics_quick_vassals:0 "Vassalos"
 lesson_basics_quick_vassals_2:0 "Vassalos"
 lesson_basics_quick_vassals_desc:0 "Note como $c_ormond$ está incluído no contorno do seu [realm|e] no mapa, apesar de não aparecer na visualização de [domain|e]? Para explicar por que isso acontece, precisamos olhar para os seus [vassals|e]."
 lesson_basics_quick_vassals_great_job:0 "Vassalos"
 lesson_basics_quick_vassals_great_job_2:0 "Domínio & Reino"
 lesson_basics_quick_vassals_great_job_2_desc:0 "Há uma diferença importante entre o seu [domain|e] e o seu [realm|e]. Seu $game_concept_domain$ é a terra que você pessoalmente detém, enquanto o seu $game_concept_realm$ também inclui toda a terra detida pelos seus [vassals|e].\n\n#TUT Seu [domain_limit|e] desencoraja muito você de deter uma quantidade ilimitada de [titles|e] você mesmo, o que significa que você precisará contar com os $game_concept_vassals$ para continuar expandindo suas fronteiras.#!"
 lesson_basics_quick_vassals_great_job_desc:0 "@tutorial_screenshot_5! Este é um [vassal|e], outro [ruler|e] que ajuda na administração do seu [realm|e] governando um [county|e] fora do seu [domain|e].\n\nComo o [liege|e] de um $game_concept_vassal$, você recebe pagamento na forma de $game_concept_taxes$ (@gold_icon![gold|e]) e @soldier_icon! [levies|e]."
 lesson_basics_quick_your_domain_1:0 "Seu Domínio"
 lesson_basics_quick_your_domain_2:0 "Seu Brasão de Armas"
 lesson_basics_quick_your_domain_3:0 "Seus Títulos"
 lesson_basics_quick_your_domain_desc_1:0 "@tutorial_screenshot_2! Em seguida, vamos dar uma olhada no seu [domain|e], que consiste em todas as terras que você possui pessoalmente. Uma visão geral do seu $game_concept_domain$ é exibida na seção destacada."
 lesson_basics_quick_your_domain_desc_2:0 "Este é o Brasão de Armas de [GetPlayer.GetPrimaryTitle.GetName]. Ele é usado para representar o seu [realm|e] em vários lugares. Por exemplo, você pode vê-lo flutuando sobre a sua [capital|e], $cn_luimneach$.\n\n#TUT Veja a pequena coroa acima do seu Brasão de Armas? Isso representa o seu [title_tier|e]. À medida que os $game_concept_title_tiers$ avançam em classificação, a coroa no topo de seus Brasões de Armas associados terá coroas mais extravagantes!#!"
 lesson_basics_quick_your_domain_desc_3:0 "Você atualmente detém um total de três [titles|e], que todos representam territórios no mapa. Seu $game_concept_title$ principal, e mais importante, é o da esquerda. Ele determina o nome do seu [realm|e]. Você também possui os $game_concept_titles$ $c_thomond$ e $c_ennis$. \n\n#TUT Passar o mouse sobre os $game_concept_titles$ no seu Painel de Personagem mostrará a você que território eles representam no mapa.#!"
 lesson_basics_quick_zoom:0 "Zoom"
 lesson_basics_quick_zoom_desc:0 "Para dar zoom in e out no mapa, use a Roda do Mouse.\n\nZoom total, você verá o $game_concept_detail_zoom$. Um pouco de zoom out, e você verá o $game_concept_political_zoom$. Por fim, ao dar zoom totalmente para fora, verá o $game_concept_paper_zoom$."
 lesson_basics_rally_points:0 "Guerra ($lesson_basics_war$)"
 lesson_basics_rally_points_desc:0 "Quando uma [war|E] começa, você pode reunir seus [armies|E] com um único clique no grande botão vermelho \"$RAISE_ALL$\" que aparecerá junto com o ícone de $game_concept_war_score$ na parte inferior direita da tela — você também pode $RAISE_ALL$ nesta visualização militar.\n\nQuando uma $game_concept_war$ acaba, você precisa desmobilizar seus soldados antes de começar outra $game_concept_war$.\n\n#TUT Os [rally_points|E] são locais de recrutamento para as [levies|E] e [men_at_arms|E] sob o seu comando; é onde elas aparecerão quando convocadas para a guerra!#!"
 lesson_basics_realm:0 "Bordas ($lesson_basics_map$)"
 lesson_basics_realm_desc:0 "Se você passar o cursor sobre o retrato do seu personagem, o brasão de armas sobre a sua [realm_capital|E] ($cn_luimneach$) irá brilhar e todo o seu [realm|E] será destacado. Munster é o seu [primary_title|E], por isso o seu $game_concept_realm$ recebe o nome dele.\n\nVocê também possui o Condado de Thomond como um $game_concept_title$ separado.\n\n#TUT Se você der um zoom para fora, aparecerá \"Munster\" nesta parte do mapa, porque você é o governante máximo da área.#!"
 lesson_basics_realm_view_tt:0 "Abra a visualização do Reino no lado direito da tela (destacado)"
 lesson_basics_religion:0 "Religião"
 lesson_basics_religion_1:0 "Fés e Religiões"
 lesson_basics_religion_1_desc:0 "Todos [characters|E] creem em uma [faith|E], que por sua vez pertence a uma [religion|E]. Por exemplo, o catolicismo é uma $game_concept_faith$, wque pertence à $christianity_religion$.\n\nToda a $game_concept_faith$ é diferente de todos as outras $game_concept_faith$ — Vamos olhar mais de perto."
 lesson_basics_religion_1_read_only:0 "$lesson_basics_religion_1$"
 lesson_basics_religion_2:0 "Doutrinas ($lesson_basics_religion$)"
 lesson_basics_religion_2_desc:0 "Sua [faith|E] possui diversas [doctrines|E]. Essas $game_concept_doctrines$ definem regras para os membros da $game_concept_faith$ e regulam muitas coisas, como as [succession_laws|E] de Gênero disponíveis ou quais personagens podem controlar as [temple_holdings|E].\n\nOs [core_tenets|E], no topo, são $game_concept_doctrines$ especiais que concedem bônus ou opções para seu personagem, como a habilidade de meditar ou participar das [great_holy_wars|E].\n\n#TUT Todas as Fés também possuem [sins|E] e [virtues|E], indicando comportamentos que são ou desaprovados ou celebrados por seus pares.#"
 lesson_basics_religion_3:0 "@fervor_icon! Fervor ($lesson_basics_religion$)"
 lesson_basics_religion_3_desc:0 "Todas as [faiths|E] têm [fervor|E], que aumenta e diminui ao longo do tempo, dependendo do número de aderentes à $game_concept_faith$, como [holy_wars|E] estão indo, e mais. $game_concept_fervor$ representa o quão fanáticos a maioria dos membros da $game_concept_faith$ estão se sentindo atualmente, incluindo muitos camponeses sujos em todo o mundo.\n\nQuando o $game_concept_fervor$ da sua $game_concept_faith$ é alto, é mais fácil converter [counties|E] (usando [convert_county|E]) para a sua $game_concept_faith$, e $game_concept_counties$ da sua $game_concept_faith$ #EMP resist#! à conversão para outra $game_concept_faiths$.\n\nQuando o $game_concept_fervor$ é baixo, entretanto, $game_concept_rulers$ podem decidir abandonar seu atual $game_concept_faith$ em favor de outro da mesma [religion|E], gerando uma [heresy|E]. \n\n#TUT $game_concept_rulers$ Hereges irão se converter junto com seus territórios e vassalos mais próximos, e são livres para espalhar sua nova $game_concept_faith$ no lugar da antiga.#!"
 lesson_basics_religion_4:0 "Nova Fé ($lesson_basics_religion$)"
 lesson_basics_religion_4_desc:0 "Na vista [faith|E] , é possível criar uma nova $game_concept_faith$ por si própria. As [doctrines|E] e os [core_tenets|E] vão custar uma certa quantia de [piety|E] dependendo de quais $game_concept_core_tenets$ a tua $game_concept_faith$ atual tem.\n\nIsso não é algo com que se preocupar na primeira [character|E], mas pode ser uma primeira meta muito divertida para trabalhar quando você estiver se sentindo mais confiante!\n\n#TUT [family_members|E] e [vassals|E] Que tenham uma alta [opinion|E] de você provavelmente se juntarão a sua nova $game_concept_faith$, e alto habilidade de [learning|E] pode convencer muitos mais, mas qualquer um de sua antiga $game_concept_faith$ que não se converteram irão considerá-lo um herege.#!"
 lesson_basics_religion_4_no_GUI_highlight:0 "$lesson_basics_religion_4$"
 lesson_basics_religion_click_religion_tt:0 "Abra a vista Fé (destacado)"
 lesson_basics_religion_divergence:0 "Divergência de @divergence_icon! ($lesson_basics_religion$)"
 lesson_basics_religion_divergence_desc:0 "Sua [rite|e] mudará ao longo do tempo ao adotar novos [core_tenets|e] e [doctrines|e]. Quanto mais estes diferirem das crenças do [mainline_rite|e] de sua [faith|e], mais [rite_divergent|e] sua $game_concept_rite$ será considerada.\n\nEm uma [organized|e] $game_concept_faith$ com um [head_of_faith|e], o líder religioso pode definir o [tenet_status|e] de $game_concept_core_tenets$ que são conhecidos pela $game_concept_faith$. Nesses $game_concept_faiths$, o [prohibited_tenet_status|e] $game_concept_core_tenet$ contribuirá com mais $game_concept_rite_divergence$ do que um [permitted_tenet_status|e] $game_concept_core_tenet$.\n\n#TUT $game_concept_rite_divergent$ $game_concept_rites$ altamente divergentes se tornarão [heresies|e] e eclodirão em suas próprias $game_concept_faiths$, que podem desenvolver $game_concept_rites$ próprios.#!"
 lesson_basics_renown:0 "Renown ($lesson_basics_succession$)"
 lesson_basics_renown_desc:0 "Como membro de uma [dynasty|E], você também possui [dynasty_prestige|E]. Compartilhado por todos na sua $game_concept_dynasty$, a $game_concept_dynasty_prestige$ cresce de várias maneiras diferentes e reflete quão famosa é a sua #EMP Dinastia#!, em vez de apenas você.\n\nAumentar a sua $game_concept_dynasty_prestige$ ecoará ao longo das gerações para seus descendentes, elevando o seu [dynasty_prestige_level|E]. Como o [dynast|E] (o membro mais poderoso da sua $game_concept_dynasty$), a Renome permitirá que você desbloqueie [dynasty_perks|E] que beneficiarão todos os seus parentes.\n\n#TUT Para ver os $game_concept_dynasty_perk$ de uma Dinastia, clique no seu escudo de armas da Dinastia.#!"
 lesson_basics_renown_no_GUI_highlight:0 "$lesson_basics_renown$"
 lesson_basics_renown_no_GUI_highlight_2:0 "$lesson_basics_renown$"
 lesson_basics_resources:0 "IV — Recursos"
 lesson_basics_resources_1:0 "[gold_i|E] Ouro ($lesson_basics_resources$)"
 lesson_basics_resources_1_desc:0 "Para avançar em seus objetivos, você precisará de [gold|E]. Entre outras coisas, o $game_concept_gold$ paga por [buildings|E], [armies|E] e subornos. O ouro é coletado de forma passiva tanto de suas [holdings|E] quanto de seus [vassals|E], na forma de [tax|E]. Vassalos maiores e propriedades mais importantes tendem a render mais impostos.\n\nNo entanto, dinheiro não pode comprar tudo - certas coisas só podem ser alcançadas gastando a quantidade certa de [prestige|E] ou, para assuntos religiosos, [piety|E].\n\n#TUT Você pode ver o estado atual do seu Ouro, Prestígio e Piedade na barra no canto superior direito.#!"
 lesson_basics_resources_2:0 "[prestige_i|E] Prestígio ($lesson_basics_resources$)"
 lesson_basics_resources_2_desc:0 "Seu [prestige|E] indica o quanto você é respeitado. Ele pode ser ganho de forma passiva ao longo do tempo (por possuir muitos [titles|E], por exemplo) ou de forma ativa (como se casar com [dynasties|E] prestigiosas ou lutar como um [ally|E] em [wars|E]).\n\nSempre que você ganha prestígio, você avança para o próximo [prestige_level|E]. Níveis mais altos de prestígio fazem com que outros [characters|E] pensem melhor de você e trazem formas poderosas de travar $game_concept_war$.\n\n#TUT Algumas ações #EMP custam#! prestígio, como declarar $game_concept_war$. Essas ações permitem que você use sua celebridade em benefício próprio, e os personagens não pensarão menos de você por usá-las.\n\nGastar prestígio não afeta o progresso do seu nível de prestígio, apenas o seu prestígio atual.#!"
 lesson_basics_resources_3:0 "[piety_i|E] Piedade ($lesson_basics_resources$)"
 lesson_basics_resources_3_desc:0 "Com muita [piety|E], você terá mais facilidade para interagir com o [head_of_faith|E]. Como você é um adepto do catolicismo, este é o Papa.\n\nA piedade pode ser adquirida de forma passiva através da [skill|E] de [learning|E] e de [traits|E] [Concept('virtuous', 'Virtuosos')|E], ou de forma ativa através de ações piedosas, como fazer uma [pilgrimage|E].\n\nVocê também possui um [piety_level|E], que aumenta ao longo do tempo sempre que você ganha $game_concept_piety$ e pode ter efeitos positivos para o seu personagem.\n\n#TUT Semelhante ao Prestígio, algumas ações exigem que você #EMP gaste#! $game_concept_piety$, como declarar [holy_wars|E] ou criar uma nova [faith|E].\n\nGastar $game_concept_piety$ dessa forma é normal, e outros [characters|E] não pensarão pior de você por isso.#!"
 lesson_basics_said_yes:0 "$lesson_basics_say_yes$"
 lesson_basics_say_yes:0 "Enviar proposta ($lesson_basics_marriage$)"
 lesson_basics_say_yes_desc:0 "Quando você seleciona dois personagens para o seu [marriage|E], são apresentados os detalhes da união, juntamente com opções adicionais, como tornar o casamento [matrilineal|E].\n\n#TUT Se você está satisfeito com o casamento, vá em frente e envie uma proposta. Essa ação normalmente leva alguns dias, mas faremos instantânea para o tutorial.#!"
 lesson_basics_schemes:0 "XIV — Esquemas"
 lesson_basics_schemes_concept:0 "Esquemas ($lesson_basics_schemes$)"
 lesson_basics_schemes_concept_complete:0 "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_concept_desc:0 "[schemes|E] são objetivos de longo prazo, destinados a outro Personagem. Eles podem ter objetivos hostis, como tentar [GetScheme('murder').GetTypeName] ou [GetScheme('abduct').GetTypeName] seu alvo, ou ser mais saudáveis, como o Esquema [GetScheme('befriend').GetTypeName]."
 lesson_basics_schemes_murder:0 "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_murder_desc:0 "Um bom momento para usar um [scheme|E] pode ser quando você percebe que a [line_of_succession|E] não é tão clara e favorável como você gostaria - uma maneira de se dar bem é simplesmente #EMP remover#! a concorrência.\n\nSilenciosamente e sem testemunhas.\n\n#TUT Uma tentativa de [GetScheme('murder').GetTypeName] vem com o risco de ser descoberto. Se a sua tentativa falhar, isso tornará o seu [character|E] impopular - especialmente com o alvo pretendido.#!"
 lesson_basics_schemes_sway:0 "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_sway_complete:0 "$lesson_basics_schemes_concept$"
 lesson_basics_schemes_sway_complete_desc:0 "Excelente! Uma vez iniciado, o seu [scheme|E] irá progredir lentamente ao longo do tempo. O tempo necessário para chegar a uma conclusão varia com base na [success_chance|E] do Esquema, que pode ser afetada por [skills|E] relevantes - neste caso, é afetada pela sua [diplomacy|E].\n\n#TUT Se você não estiver satisfeito com o seu Esquema, você sempre pode cancelá-lo clicando no botão #bold Abandonar Esquema#! (#TUT_KW X#!) ao lado do Esquema.#!"
 lesson_basics_schemes_sway_desc:0 "A influência [scheme|E] é feito para aumentar a [opinion|E] alguém tem de seu personagem. Vamos experimentar!"
 lesson_basics_schemes_tab_tt:0 "Inspecione o separador Esquemas (deve estar aberta por defeito)"
 lesson_basics_send_gift_tt:0 "Confirme uma Interção #TUT_KW Enviar Presente#! com o seu herdeiro"
 lesson_basics_skills:0 "Habilidades ($lesson_basics_character$)"
 lesson_basics_skills_desc:0 "[characters|E] possuem [skills|E], indicando sua proficiência em um determinado campo. Alguns são ótimos conversadores, enquanto outros preferem deixar suas intenções claras no campo de batalha.\n\n#TUT As principais habilidades são:\n#![diplomacy_i|E] [diplomacy|E]\n#weak Melhorar a opinião dos outros sobre você#!\n[martial_i|E] [martial|E]\n#weak Levantar e comandar exércitos#!\n[stewardship_i|E] [stewardship|E]\n#weak Gerenciar suas terras pessoais#!\n[intrigue_i|E] [intrigue|E]\n#weak Planejar e descobrir segredos#!\n[learning_i|E] [learning|E]\n#weak Estudar teologia e tecnologia#!"
 lesson_basics_start_construction_tt:0 "Clique na sua [holding|E] de Capital ($cn_luimneach$), selecione #TUT_KW $building_curtain_walls_01$#! entre suas construções e #TUT_KW Melhore#! a estrutura"
 lesson_basics_succession:0 "VII — Dinastia"
 lesson_basics_succession_laws:0 "Leis de Sucessão ($lesson_basics_succession$)"
 lesson_basics_succession_laws_complete_2:0 "$lesson_basics_succession_laws$"
 lesson_basics_succession_laws_complete_2_desc:0 "$lesson_basics_succession_laws_desc$"
 lesson_basics_succession_laws_desc:0 "[succession_laws|E] determinam como todos os [titles|E] e os recursos são divididos entre os [heirs|E] quando um [character|E] morre. Você atualmente tem apenas um herdeiro, mas vamos dar uma vista de olhos de qualquer maneira!\n\n#TUT Em alguns casos, quando você assume o controle de seu novo personagem, você pode até descobrir que eles são responsáveis pela morte prematura de seu governante anterior...#!"
 lesson_basics_succession_tab_tt:0 "Inspecione a separador da Sucessão"
 lesson_basics_taxes:0 "Tributação ($lesson_basics_holdings$)"
 lesson_basics_taxes_desc:0 "Cada [holding|E] fornece [taxes|E] para seu [holder|E]. Se esse Proprietário for um [vassal|E], eles, por sua vez, pagarão impostos ao seu [liege|E].\n\nImpostos são sua principal fonte de renda de [gold_i] [gold|E]!\n\n#TUT As [obligations|E] podem afetar o valor desses impostos. Estar em [war|E] pode afetar o nível de [control|E] em um [county|E], o que por sua vez afeta os impostos.#!"
 lesson_basics_titles:0 "IX — Títulos"
 lesson_basics_tooltips_in_tooltips:0 "Dicas Aninhadas ($lesson_basics$)"
 lesson_basics_tooltips_in_tooltips_complete:0 "$lesson_basics_tooltips_in_tooltips$"
 lesson_basics_tooltips_in_tooltips_complete_desc:0 "$lesson_basics_tooltips_in_tooltips_desc$"
 lesson_basics_tooltips_in_tooltips_desc:0 "Termos-chave são marcados com [highlighted_text|E] azul. Isso significa que você pode passar o cursor sobre as palavras para abrir uma dica informativa.\n\nEssas dicas também podem ter palavras-chave destacadas, que também podem ser passadas com o cursor.\n\nLeva #bold alguns segundos#! para que uma dica 'fixe' durante o movimento do mouse."
 lesson_basics_tooltips_in_tooltips_hover_word:0 "Coloque o cursor sobre este [highlighted_text|E] para abrir uma dica"
 lesson_basics_tooltips_in_tooltips_hover_word_deeper:0 "Passe o cursor sobre a palavra 'neat' dentro da dica que abriu"
 lesson_basics_traits_1:0 "Traços ($lesson_basics_character$)"
 lesson_basics_traits_1_desc:0 "[characters|E] também possuem [traits|E], que podem afetar as [skills|E], assim como suas reações às coisas. Esses traços são ilustrados por ícones na Visualização do Personagem.\n\nAlguns traços revelam a personalidade de um $game_concept_character$, como [GetTrait('fickle').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )] ou [GetTrait('generous').GetName( GetNullCharacter )]. Outros traços são específicos de como um $game_concept_character$ viveu sua vida, como um [tutorial_education_trait|E] ou [commander_traits|E].\n\n#TUT Você possui:\n@temperate_icon_tutorial! [GetTrait('temperate').GetName( GetNullCharacter )]\n@gregarious_icon_tutorial! [GetTrait('gregarious').GetName( GetNullCharacter )]\n@impatient_icon_tutorial! [GetTrait('impatient').GetName( GetNullCharacter )]\n\nQuando um personagem decide agir de forma contrária aos seus traços de personalidade, isso pode causar [stress|E].#!"
 lesson_basics_traits_2:0 "Traços ($lesson_basics_character$)"
 lesson_basics_traits_2_desc:0 "[traits|E] também podem impactar como outros [characters|E] reagem a #EMP you#!.\n\nAlgumas pessoas se impressionam pelo Traço @brave_icon! [GetTrait('brave').GetName( GetNullCharacter )], enquanto um Personagem @lustful_icon! [GetTrait('lustful').GetName( GetNullCharacter )] é mais provável a aparecer em fofocas obcenas...\n\n#TUT Traços influenciam a moral e ganância de outros Personagens, o que pode afetar tanto suas ações amigáveis quanto hostis.#!"
 lesson_basics_unpause:0 "XVI — Despausando"
 lesson_basics_vassal_limit:0 "Limite de vassalos ($lesson_basics_vassals$)"
 lesson_basics_vassal_limit_desc:0 "Há um limite para quantos [vassals|E] você pode gerenciar confortavelmente antes que seu [realm|E] se torne difícil de controlar. Ultrapassar o [vassal_limit|E] afeta os [taxes|E] e [levies|E] fornecidos a você.\n\nIsso não importa para o tutorial, mas quando você começar a construir seu próprio reino, tenha cuidado para não crescer rápido demais.\n\n#TUT Se você exceder seu Limite de Vassalos, pode conceder Títulos de [title_tier|E] inferior aos seus Vassalos. Às vezes, você pode até mesmo [create|E] #EMP novos#! Títulos de [title_tier|E] alto para consolidar seu poder em uma região e fortalecer seu domínio sobre os Títulos inferiores [de_jure|E] subordinados ao seu novo Título.#!"
 lesson_basics_vassals:0 "XI — Vassalos"
 lesson_basics_vassals_concept:0 "Vassalos ($lesson_basics_vassals$)"
 lesson_basics_vassals_concept_complete_2:0 "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_desc:0 "Como um [ruler|E], você provavelmente será o [liege|E] de pelo menos um [vassal|E]. Eles são $game_concept_rulers$ que prestaram juramento de fidelidade a você e, portanto, fazem parte do seu [realm|E].\n\n#TUT Os vassalos fornecem a você [gold|E] (impostos) e soldados (levies).\n\nÉ possível ser tanto um $game_concept_liege$ quanto um $game_concept_vassal$ ao mesmo tempo.#!"
 lesson_basics_vassals_concept_great_job:0 "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_great_job_desc:0 "Aqui está uma lista dos seus atuais [vassals|E], juntamente com algumas informações adicionais sobre eles.\n\nNo topo da lista está o [ruler|E] de $c_ormond$, cuja terra você pode ver no mapa - este é um Condado (um [title|E] de [title_tier|E] [county|E]) dentro do seu [realm|E].\n\n#TUT Venha aqui para ter uma visão geral das coisas, como a [opinion|E] atual dos seus Vassalos sobre você, se eles são considerados [powerful_vassals|E] ou não, e os níveis de [taxes|E] e [levies|E] que eles estão atualmente fornecendo para você.#!"
 lesson_basics_vassals_concept_greyed_out:0 "$lesson_basics_vassals_concept$"
 lesson_basics_vassals_concept_greyed_out_desc:0 "Aqui também é onde você pode mudar [vassal_contracts|E], que determina quanto (ou pouco) [levies|E] e [taxes|E] um Feudal [vassal|E] dá a si."
 lesson_basics_vassals_tab_tt:0 "Inspecione o separador Vassalos"
 lesson_basics_war:0 "XV — Guerra"
 lesson_basics_warfare:0 "Guerra ($lesson_basics_war$)"
 lesson_basics_warfare_desc:0 "A [war|E] é uma parte essencial do Crusader Kings III. Existem muitos conceitos para abordar, mas por enquanto, vamos falar brevemente sobre alguns deles.\n\n#TUT O restante e os detalhes deixaremos para você descobrir enquanto começa a jogar!#!"
 lesson_basics_web_of_titles:0 "Governantes da Terra ($lesson_basics_map$)"
 lesson_basics_web_of_titles_desc:0 "Agora, vamos falar sobre o #EMP jogo#!! Tudo acontece no mapa à sua frente. O mundo consiste em territórios grandes e pequenos — [titles|E] possuídos por vários [rulers|E].\n\n#TUT $game_concept_titles$ são representados por brasões elaborados, mostrados como ícones no mapa.\n\nO ícone que representa seu [realm|E] é o de seu [primary_title|E], o $game_concept_title$ mais importante e prestigioso que você possui.#!"
 lesson_basics_welcome:0 "Bem-vindo ao Crusader Kings III"
 lesson_battle_mechanics:0 "Batalhas"
 lesson_battle_mechanics_step_1:0 "Uma Batalha!"
 lesson_battle_mechanics_step_1_desc:0 "O resultado de uma [battle|E] entre dois [armies|E] dependem de uma série de coisas: o número de [levies|E] ambos os lados têm, que (se houverem) [men_at_arms|E] ambos os lados estão usando, os [commanders|E] envolvidos, e até mesmo o [terrain|E] onde você está lutando.\n\n#TUT Mais detalhes podem ser obtidos na vista de Combate - clique em seu $game_concept_army$ combatente para o abrir."
 lesson_declare_war:0 "Declarar Guerra"
 lesson_declare_war_step_1:0 "E agora?"
 lesson_declare_war_step_1_complete:0 "$lesson_declare_war_step_1$"
 lesson_declare_war_step_1_desc:0 "Agora, como primeira tarefa, vamos lembrar seu vizinho, o Conde de $c_desmond$, quem é realmente é o [rightful_liege|E] dele... Se isto acontecer para expandir seu [realm|E], que assim seja!\n\nUsando o sistema de interação do personagem que vimos anteriormente e selecionando-o no mapa, declare guerra ao [ruler|E] de $c_desmond$. Você já deve ter um válido [casus_belli|E], como seu [title|E] é [de_jure|E] uma parte do seu $game_concept_realm$.\n\n#TUT Para uma experiência mais prática, agora vamos orientá-lo sobre o que acontece no decorrer de uma guerra.#!"
 lesson_declare_war_step_2:0 "$lesson_declare_war_step_1$"
 lesson_declare_war_tt:0 "#TUT_KW Declare War#! sobre Earl Muiredach de $c_desmond$"
 lesson_guided_final_notes_mission_step_1:0 "E agora?"
 lesson_guided_final_notes_mission_step_1_desc:0 "Há muitas coisas que você pode fazer agora que já teve um primeiro contato com alguns dos sistemas essenciais — Crusader Kings III é sobre definir seus próprios objetivos.\n\nSe quiser uma sugestão, recomendamos que tente se tornar o Rei ou Rainha de toda a $k_ireland$! [war|E] não é o único caminho, também...\n\nOu você pode clicar no botão #bold Dicas#! no topo e ver se algum dos itens lá chama sua atenção!"
 lesson_losing_wars:0 "Perdendo Guerras"
 lesson_losing_wars_step_1:0 "Derrota iminente"
 lesson_losing_wars_step_1_desc:0 "Esta [war|E] não está indo bem! Pode ser hora de solicitar por [white_peace|E].\n\nWhile #EMP this#! $game_concept_war$ pode ser uma causa perdida, não há mal nenhum em aceitar a derrota e viver para lutar outro dia, clicando com o botão direito no seu inimigo e escolhendo #TUT_KW White Peace#! (ou #TUT_KW Surrender#!, se a Paz Branca não estiver disponível) na vista de interação."
 lesson_open_war_overview_tt:0 "Abra a vista da Guerra (destacado)"
 lesson_raise_troops:0 "Convocar Exército"
 lesson_raise_troops_step_1:0 "Levantar Exércitos"
 lesson_raise_troops_step_1_desc:0 "Você está agora envolvido em uma [war|E]! Em seguida, você deve reunir seus [armies|E]. Um botão apareceu na parte inferior da tela para ajudá-lo, mas você também pode fazer isso a partir da sua visualização Militar.\n\n#TUT Onde quer que seja o seu [rally_point|E] (neste caso, $c_thomond$), é lá que seu [army|E] se reunirá e aguardará suas ordens.\n\nObservação: você terá que despausar o jogo (pressione a tecla 'Barra de Espaço'!) para que seu $game_concept_army$ reúna mais do que um punhado de homens. Deixe-o por alguns dias, e o Exército estará em plena força!#!"
 lesson_raise_troops_step_2:0 "$lesson_raise_troops_step_1$"
 lesson_raise_troops_tt:0 "Levante seus exércitos"
 lesson_siege_mechanics:0 "Cercos"
 lesson_siege_mechanics_step_1:0 "Um Cerco!"
 lesson_siege_mechanics_step_1_desc:0 "Seu [army|E] está atacando uma [holding|E] inimiga! Clique no ícone destacado (as pontas de lança!) para descobrir como está indo.\n\nVocê precisa vencer $game_concept_sieges$ para ganhar a maioria das guerras, pois elas aumentam sua [war_score|E].\n\nSempre que um $game_concept_siege$ é vencido (leva algumas rodadas de ataque), a área se tornará [occupied|E], alterando sua aparência regular no mapa de uma cor sólida para cores listradas, quando ampliado."
