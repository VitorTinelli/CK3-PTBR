 lesson_war_final_notes_defeat_step_1:0 "Derrota de Guerra"
 lesson_war_final_notes_defeat_step_1_desc:0 "Nós lamentamos a sua [defeat|E] juntamente consigo, mas tenha certeza de que agora você superou um aspecto desafiador do jogo, e só vai ficar mais fácil daqui para frente.$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_invalidated_step_1:0 "Guerra Invalidada"
 lesson_war_final_notes_invalidated_step_1_desc:0 "Você ainda esta aqui! Excelente! Que estranho que a guerra deixou de ser válida embora.$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_reuse:0 "\n\n#TUT As lições do tutorial terminam aqui. No entanto, dicas ainda aparecerão ocasionalmente como ícones de alerta ao longo do topo da tela. Clique nesses alertas de dicas para aprender mais sobre certas situações ou sistemas com os quais você está lidando!\n\nObrigado por nos acompanhar — e boa sorte!#!"
 lesson_war_final_notes_victory_step_1:0 "Vitória de Guerra!"
 lesson_war_final_notes_victory_step_1_desc:0 "Parabéns pela sua [victory|E]!\n\nVocê já experimentou como é passar por uma parte essencial do jogo.$lesson_war_final_notes_reuse$"
 lesson_war_final_notes_white_peace_step_1:0 "Paz Branca"
 lesson_war_final_notes_white_peace_step_1_desc:0 "Quantas lições aprendidas! As coisas que você levará com você para o futuro!$lesson_war_final_notes_reuse$"
 lesson_warscore:0 "Mérito"
 lesson_warscore_step_1:0 "Mérito"
 lesson_warscore_step_1_desc:0 "Para ter uma ideia de quem está ganhando em uma [war|E], você sempre pode olhar para a [war_score|E], no canto inferior direito. Vai de #N -100#! a #P 100#!, e muda baseado em [battles|E] e [sieges|E] ganhos ou perdidos, bem como território ocupado.\n\n#TUT Aos #P 100#! da $game_concept_war_score$, você pode forçar o outro lado a aceitar a sua [peace_offer|E].\n\nPor outro lado, em #N -100#! $game_concept_war_score$, #EMP eles#! podem forçar #EMP você#! a aceitar a [peace_offer|E] #EMP deles#!."
 lesson_warscore_step_2:0 "Resultados da Guerra"
 lesson_warscore_step_2_desc:0 "Todas as [wars|E] terminam de três maneiras diferentes:\n$EFFECT_LIST_BULLET$[victory|E]\n$EFFECT_LIST_BULLET$[white_peace|E]\n$EFFECT_LIST_BULLET$[defeat|E]\n\nAs consequências exatas de qualquer uma dessas opções mudam dependendo do [casus_belli|E].\n\n#TUT Os detalhes de uma guerra específica podem ser encontrados clicando com o botão direito no [ruler|E] inimigo e selecionando #TUT_KW Oferecer Paz#!, ou clicando no ícone de $game_concept_war_score$ na parte inferior direita e, em seguida, selecionando uma das abas na parte inferior da tela.#!"
 lesson_welcome_desc:0 "@tutorial_screenshot_1!\nVocê é um governante medieval! Seu reinado pode ser breve, mas através dos seus herdeiros você pode elevar sua dinastia à proeminência.\n\nTerras estão ao seu alcance, seja pela espada ou por meio de casamentos, enquanto uma diplomacia inteligente pode estender seu alcance muito além dos sonhos mais loucos de qualquer conquistador..."
 lesson_winning_wars:0 "Vencendo Guerras"
 lesson_winning_wars_step_1:0 "A vitória está próxima"
 lesson_winning_wars_step_1_desc:0 "Sua [war_score] está em #P +100%#!!\n\nAgora você pode impor suas demandas clicando na ícone $game_concept_war_score$ para abrir a visualização de Guerra e, em seguida, selecionar a guia #TUT_KW Impor Demandas#! na parte inferior da tela.\n\n#TUT Você também pode clicar com o botão direito no [ruler|E] inimigo e selecionar #TUT_KW Oferecer Paz#!.#!"
