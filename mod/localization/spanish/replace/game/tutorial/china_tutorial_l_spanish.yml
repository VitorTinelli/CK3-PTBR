l_spanish:
 TUTORIAL_OPEN_DECISION_PANEL_PROMPT:0 "Abrir o Painel '$DECISIONS_VIEW_TITLE$'"
 action_reactive_advice_china_council:0 "Conselho: $ra_china_council_1$"
 action_reactive_advice_china_council_click:0 "$click_to_open_lesson$"
 action_reactive_advice_china_council_desc:0 "Como um $game_concept_governor$, você pode contar com seu $game_concept_council$ para auxiliar na administração de sua $game_concept_province$. Abra isto para obter uma introdução de como o Conselho funciona."
 lesson_china_STUDY_SCHEME_SEGMENT:0 "Estudos"
 lesson_china_admin_intro:0 "Carreira no Governo"
 lesson_china_admin_intro_desc:0 "Por mais agradável que seja, você não deve passar toda sua vida em seu [estate|E].\n\nComo oficial, espera-se que você prove seu [merit|E] e suba na hierarquia, tornando-se [governor|E] e possivelmente até [minister|E]."
 lesson_china_admin_merit:0 "$lesson_china_admin_intro$"
 lesson_china_admin_merit_desc:0 "Este é o seu atual [merit_level|E].\n\nSeu $game_concept_merit_level$ mede seu valor e posição na burocracia imperial. O Rank mais baixo é #V 9º#! e o mais meritório é #V 1º.#!\n\nNeste ponto, você ainda não se provou, portanto não possui $game_concept_merit_level$ e não é elegível para se tornar [governor|E]."
 lesson_china_admin_open:0 "$lesson_china_admin_intro$"
 lesson_china_admin_open_desc:0 "Vamos aumentar nosso [merit_level|E]!"
 lesson_china_admin_open_prompt:0 "Abrir o Painel '$ADMINISTRATIVE_GOVERNMENT_HEADER$' (destacado)"
 lesson_china_camera:0 "$lesson_basics_quick_camera$"
 lesson_china_camera_desc:0 "$lesson_basics_quick_camera_desc$"
 lesson_china_characters:0 "Personagens"
 lesson_china_characters_desc:0 "Você joga como [GetPlayer.GetShortUINameNotMeNoTooltip], um dos muitos [characters|E] neste mundo, representados por avatares de Personagem.\n\nVocê é um aspirante a burocrata em [GetTitleByKey('h_china').GetDefinitiveName]!"
 lesson_china_decisions:0 "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_decisions_desc:0 "Estas são Decisões, várias ações pessoais que você pode tomar.\n\nPor enquanto, vamos escolher a decisão $tgp_china_study_confucian_classics_decision|V$."
 lesson_china_decisions_open:0 "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_decisions_open_desc:0 "Uma vez que você decida participar de um [imperial_examination|E], é útil estar bem preparado.\n\nVocê pode se preparar para os $game_concept_examinations$ estudando os Clássicos Confucionistas."
 lesson_china_decisions_open_prompt:0 "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$"
 lesson_china_decisions_prompt:0 "Iniciar a Decisão '$tgp_china_study_confucian_classics_decision$'"
 lesson_china_done:0 "$lesson_basics_quick_done$"
 lesson_china_done_desc:0 "O jogo agora está despausado, e o tempo está progredindo. A partir deste ponto, você é livre para moldar o futuro do sobrenome da família [GetPlayer.GetHouse.GetName].\n\n#TUT Fique atento ao @reactive_advice_icon! Conselhos Reativos aparecerão no topo da sua tela com mais orientações!#!\n\nPor enquanto, seu objetivo mais importante é aguardar o próximo [imperial_examination|E] e participar dele."
 lesson_china_estate_build_list:0 "$lesson_china_estate_heading$"
 lesson_china_estate_build_list_desc:0 "Um [estate_building|E] que aumenta sua renda de [gold|E], como o $rice_field_01_domicile_building|V$, seria um bom começo.\n\nNo entanto, sinta-se à vontade para escolher qualquer outro Building que desejar."
 lesson_china_estate_build_list_prompt:0 "Construir qualquer $game_concept_estate_building$"
 lesson_china_estate_close:0 "$lesson_china_estate_heading$"
 lesson_china_estate_close_desc:0 "Vamos sair do seu Estate por enquanto.\n\nVocê deve primeiro fechar seu Manor e depois a Janela do Estate."
 lesson_china_estate_close_prompt:0 "Fechar a Janela do Estate"
 lesson_china_estate_heading:0 "Sua Propriedade Familiar"
 lesson_china_estate_intro:0 "$lesson_china_estate_heading$"
 lesson_china_estate_intro_desc:0 "Os benefícios que você recebe do seu [estate|E] vêm dos [estate_buildings|E], então vamos construir um agora!"
 lesson_china_estate_intro_prompt:0 "Selecione o slot de construção vazio (destacado)"
 lesson_china_estate_manor:0 "$lesson_china_estate_heading$"
 lesson_china_estate_manor_desc:0 "A construção está em andamento, ótimo!\n\nVocê deve ter notado que há um limite de slots para construir [estate_buildings|E]. Para abrir espaço para mais Buildings, eventualmente você precisará atualizar seu #V Solar#!"
 lesson_china_estate_manor_prompt:0 "Selecione seu Manor (destacado)"
 lesson_china_estate_manor_selected:0 "$lesson_china_estate_heading$"
 lesson_china_estate_manor_selected_desc:0 "Todos os [estate_buildings|E] podem ser atualizados, e seu Manor não é exceção.\n\nAtualizar seu Manor é importante, pois fornece slots para mais $game_concept_estate_buildings$.\n\nAtualizar o Solar é relativamente caro, então não faremos isso agora."
 lesson_china_estate_summary:0 "$lesson_china_estate_heading$"
 lesson_china_estate_summary_desc:0 "Como mencionado anteriormente, seu [estate|E] é sua propriedade privada.\n\nEle acompanhará você quando eventualmente jogar como seu [player_heir|E].\n\nEmbora você possa eventualmente se tornar [governor|E] de uma [province|E] rica, quaisquer investimentos feitos lá pertencem ao estado.\n\nPortanto, gastar o [gold|E] que você ganha para melhorar seu [estate|E] é uma boa ideia!"
 lesson_china_exam:0 "$lesson_china_admin_intro$"
 lesson_china_exam_desc:0 "O império é uma meritocracia, e os [imperial_examinations|E] garantem que apenas os mais habilidosos e virtuosos administrarão as [provinces|E] como [governors|E].\n\nVocê pode aumentar seu [merit_level|E] participando das [activities|E] $activity_local_examination|V$ e $activity_imperial_examination|V$.\n\nOs $game_concept_examinations$ são organizados tanto pelos [governors|E] quanto pelo próprio [son_of_heaven|E].\n\nVocê receberá um convite assim que eles forem realizados."
 lesson_china_find_elder_tt:0 "Clique com o botão direito do mouse no seu $game_concept_liege$"
 lesson_china_find_spouse_tt:0 "$lesson_basics_quick_find_spouse_tt$"
 lesson_china_house:0 "$game_concept_house$"
 lesson_china_house_desc:0 "Esta é a sua [house|E], #V Casa [GetPlayer.GetHouse.GetNameNoTooltip]#!; uma família de [nobles|E] chineses.\n\nComo [house_head_head|E] da sua $game_concept_house$, espera-se que você conduza os membros da sua $game_concept_house$ ao sucesso dentro do governo chinês.\n\nSua $game_concept_house$ é pequena, mas crescerá ao longo do tempo conforme [children|E] nasçam nela.\n\n#TUT Cada [house|E] pertence a uma [dynasty|E]. Contudo, a Casa [GetPlayer.GetHouse.GetNameNoTooltip] é tão pequena que o $game_concept_house$ e o $game_concept_dynasty$ são uma única entidade.#!"
 lesson_china_introduction:0 "$lesson_basics_welcome$"
 lesson_china_introduction_desc:0 "@tutorial_screenshot_1_china!\nVocê é um jovem estudioso na China; sua posição é humilde, mas cheia de potencial. Através do aprendizado, astúcia e conduta meritória, você pode ascender nas fileiras imperiais.\n\nEmbora sua vida seja breve, seus herdeiros podem levar o nome de sua casa à glória duradoura.\n\nSob o governo estável da Dinastia Song, os exames imperiais oferecem um caminho para a governadoria — e talvez até para o próprio trono imperial."
 lesson_china_liege_introduction:0 "$game_concept_liege$"
 lesson_china_liege_introduction_desc:0 "Seu [liege|e] é o [son_of_heaven|e], o Imperador da China. Uma das maneiras de interagir com ele é clicando com o botão direito do mouse.\n\nIsso abrirá o Menu de Interação, que permite, por exemplo, #high Encontrar Ancião#! ou #high Solicitar Mentoria#!."
 lesson_china_liege_introduction_good_job:0 "Outros Personagens"
 lesson_china_liege_introduction_good_job_desc:0 "Bom trabalho! Você pode interagir com a maioria dos [characters|e] clicando com o botão direito do mouse.\n\nTalvez você queira [GetScheme('seduce').GetTypeName] seu [spouse|e], ou #high Educar #! seus irmãos mais novos?"
 lesson_china_marriage_window:0 "$lesson_basics_quick_this_is_you_2$"
 lesson_china_marriage_window_desc:0 "Encontrar o [spouse|E] certo não é fácil, mas algumas coisas devem ser consideradas:\n\n$EFFECT_LIST_BULLET$Habilidade: Suas [skills|E] serão somadas às suas\n$EFFECT_LIST_BULLET$Genética: [congenital_traits|E], como [GetTrait('lisping').GetName( GetNullCharacter )], podem ser herdadas por seus [children|E]\n$EFFECT_LIST_BULLET$Nobreza: Casar com um [lowborn|E] fará você perder [prestige|E]"
 lesson_china_married_great_job:0 "$lesson_basics_quick_married_great_job$"
 lesson_china_married_great_job_desc:0 "Parabéns pelo casamento!\n\nSe não houver outros membros vivos de sua [dynasty|e] após a morte de seu personagem, você perde o jogo. Ter um $game_concept_spouse$ pode ajudá-lo a evitar isso."
 lesson_china_nested_tooltips:0 "Dicas Aninhadas"
 lesson_china_nested_tooltips_complete:0 "$lesson_china_nested_tooltips$"
 lesson_china_nested_tooltips_complete_desc:0 "$lesson_china_nested_tooltips_desc$"
 lesson_china_nested_tooltips_desc:0 "$lesson_basics_tooltips_in_tooltips_desc$"
 lesson_china_nested_tooltips_hover_word:0 "$lesson_basics_tooltips_in_tooltips_hover_word$"
 lesson_china_nested_tooltips_hover_word_deeper:0 "$lesson_basics_tooltips_in_tooltips_hover_word_deeper$"
 lesson_china_open_estate:0 "$lesson_china_estate_heading$"
 lesson_china_open_estate_desc:0 "Como [house_head_head|E] da sua [house|E], você possui um [estate|E].\n\nEste é o seu centro de poder privado, e quaisquer investimentos feitos nele permanecerão com você durante todo o jogo.\n\nEle está localizado em [GetPlayer.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] e permanecerá aqui mesmo se você se tornar [governor|E] em outro lugar."
 lesson_china_open_estate_prompt:0 "Abra sua Propriedade (destacada)"
 lesson_china_realm:0 "$game_concept_realm$"
 lesson_china_realm_desc:0 "Esta área mostra seu [realm|E], ou, simplificando, as terras e recursos que você controla.\n\nComo você é apenas um humilde Cavalheiro, está sem [land|e], significando que seu $game_concept_realm$ é limitado. Para adquirir terras, você pode buscar se tornar um [governor|e]. Mais sobre isso depois."
 lesson_china_relationships:0 "$lesson_basics_quick_relationships$"
 lesson_china_relationships_desc:0 "Nesta seção, você pode ver diversos outros [characters|e] com os quais você possui conexão. Isso inclui sua [family|e], qualquer pessoa com quem você tenha um [relationship|e], seus [courtiers|e] e seus [subjects|E]."
 lesson_china_resources_1:0 "$lesson_basics_quick_resources_1$"
 lesson_china_resources_1_desc:0 "Em seguida, vamos olhar para a barra no canto superior direito da tela.\n\nAqui, você encontrará diversos recursos que podem ser usados para interagir com o mundo de diferentes maneiras."
 lesson_china_resources_gold:0 "$lesson_basics_quick_resources_gold$"
 lesson_china_resources_gold_desc:0 "$lesson_basics_quick_resources_gold_desc$"
 lesson_china_resources_influence:0 "@influence_icon! $game_concept_influence$"
 lesson_china_resources_influence_desc:0 "[influence_i] [influence|e] é sua capacidade de fazer os outros ouvirem o que você diz. Quando você ganha $game_concept_influence$, seu [influence_level|e] também aumenta.\n\nComo recurso, $game_concept_influence$ é principalmente gasto para promover seu candidato desejado a [governor|E] de uma [province|E]."
 lesson_china_resources_piety:0 "$lesson_basics_quick_resources_piety$"
 lesson_china_resources_piety_desc:0 "[piety_i|e] [piety|e] é um recurso que reflete quão virtuoso seu personagem é.\n\nSeu [piety_level|e] também aumenta com seu $game_concept_piety$ acumulado. Focar em [learning_i|e][learning|e] pode ser uma boa ideia para um personagem particularmente devoto."
 lesson_china_resources_prestige:0 "$lesson_basics_quick_resources_prestige$"
 lesson_china_resources_prestige_desc:0 "$lesson_basics_quick_resources_prestige_desc$"
 lesson_china_resources_renown:0 "$lesson_basics_quick_resources_renown$"
 lesson_china_resources_renown_desc:0 "$lesson_basics_quick_resources_renown_desc$"
 lesson_china_schemes_list:0 "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_schemes_list_desc:0 "Este é o seu [scheme|E] $study_confucian_classics$.\n\nEste é um $game_concept_scheme$ repetitivo. Ao ser concluído, será resolvido com base em sua [scheme_success_chance|E], e então recomeçará.\n\nComo este $game_concept_scheme$ aumenta seu [stress|E], você eventualmente terá que abandoná-lo.\n\n#I Para abandonar um $game_concept_scheme$, use o botão no canto superior direito do $game_concept_scheme$."
 lesson_china_schemes_open:0 "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_schemes_open_desc:0 "Estudar é um [scheme|E]: um projeto pessoal de longo prazo. Vamos dar uma olhada rápida no status do seu $game_concept_scheme$."
 lesson_china_schemes_open_prompt:0 "Abrir o Painel 'Intriga'"
 lesson_china_skills:0 "$lesson_basics_quick_skills$"
 lesson_china_skills_desc:0 "$lesson_basics_quick_skills_desc$"
 lesson_china_stress:0 "$lesson_china_STUDY_SCHEME_SEGMENT$"
 lesson_china_stress_desc:0 "Ótimo, você começou seus estudos!\n\nEstudar aumentará seu [stress_i][stress|E]. Além disso, $game_concept_stress$ geralmente é ganho ou perdido dependendo de como você age de acordo com seus [personality_traits|E].\n\nSe você ganhar [GetDefine('NCharacter', 'STRESS_PER_LEVEL')|0V] $game_concept_stress$, seu [stress_level|E] aumentará e sua saúde mental sofrerá.\n\n#I Fique de olho no indicador destacado de $game_concept_stress$ para evitar colapsos mentais#!"
 lesson_china_this_is_you_1:0 "$lesson_basics_quick_this_is_you_1$"
 lesson_china_this_is_you_1_desc:0 "Aqui você verá a si mesmo e sua [family|e] mais próxima.\n\nÀ direita, você pode ver seu [player_heir|e], que você controlará quando seu [character|E] atual morrer.\n\n#TUT Se você se perder no mapa, pode clicar no seu personagem para recentrar a câmera em seu [realm|e].#!"
 lesson_china_this_is_you_2:0 "$lesson_basics_quick_this_is_you_2$"
 lesson_china_this_is_you_2_desc:0 "É geralmente uma boa ideia ter um [spouse|E]. Eles vão ajudá-lo a governar seu [realm|e] e garantir o futuro de sua [dynasty|e].\n\nNo momento, você está solteiro. Que tal fazermos algo a respeito?"
 lesson_china_this_is_you_3:0 "$lesson_basics_quick_this_is_you_3$"
 lesson_china_this_is_you_3_desc:0 "Estes são os [traits|e] do seu personagem! Como você pode ver, ele é @ambitious_icon_tutorial![Nbsp][GetTrait('ambitious').GetName( GetNullCharacter )], @compassionate_icon_tutorial![Nbsp][GetTrait('compassionate').GetName( GetNullCharacter )], e @gregarious_icon_tutorial![Nbsp][GetTrait('gregarious').GetName( GetNullCharacter )].\n\n#TUT $game_concept_traits$ afetam como seu personagem reage a eventos no mundo do jogo. Você também pode adquirir novas traits enquanto joga.#!"
 lesson_china_titles:0 "$game_concept_titles$"
 lesson_china_titles_desc:0 "Você possui apenas um [title|E]. $game_concept_titles$ representam a propriedade de terras.\n\nSeu único $game_concept_title$, [GetPlayer.GetPrimaryTitle.GetName], concede a posse da [estate|E] privada da sua família. Voltaremos a este $game_concept_estate$ em breve.\n\n#TUT Quando você governa uma [province|E] como [governor|E], ela também aparecerá como um $game_concept_title$ nesta área.#!"
 lesson_china_unpause:0 "$lesson_basics_quick_resources_time$"
 lesson_china_unpause_desc:0 "Neste momento, o jogo está pausado. Você pode controlar a velocidade do tempo no canto inferior direito.\n\n#TUT Crusader Kings III é um jogo que se desenrola ao longo de centenas de anos, então sinta-se à vontade para levar o tempo que precisar.#!\n\nEnquanto o jogo estiver pausado, ninguém realizará um [imperial_examination|E] para você participar, nem seu [scheme|E] $study_confucian_classics$ avançará, então vamos despausar o jogo e aguardar o convite!"
 lesson_china_unpause_tt:0 "$lesson_basics_quick_unpause_tt$"
 lesson_china_zoom:0 "$lesson_basics_quick_zoom$"
 lesson_china_zoom_desc:0 "$lesson_basics_quick_zoom_desc$"
 ra_china_council_1:0 "Conselho do Governador"
 ra_china_council_1_desc:0 "Como um [governor|E], você não precisa administrar sua [province|E] sozinho. Vamos dar uma olhada em seu [council|e], que se expandiu desde antes de você se tornar um $game_concept_governor$."
 ra_china_council_1_prompt:0 "$lesson_basics_council_view_tt$"
 ra_china_council_2:0 "$ra_china_council_1$"
 ra_china_council_2_desc:0 "Este é o seu [council|e], que consiste em seis [councillors|e], incluindo seu [spouse|e].\n\nEles podem, por exemplo, $task_collect_taxes|V$ ou $task_find_secrets|V$ através das [councillor_tasks|e].\n\nAgora que você é um [governor|E], eles também podem $task_develop_county|V$ ou $task_conversion|V$, entre outras coisas."
