l_spanish:
 action_lesson_tgp_playtest_intro_mandala:0 "Governo Mandala"
 action_lesson_tgp_playtest_intro_mandala_click:0 "$click_to_open_lesson$"
 action_lesson_tgp_playtest_intro_mandala_desc:0 "Mandala é um Governo especial focado em Piedade e Tributários. Abra isto para uma introdução a este governo."
 lesson_tgp_playtest_intro_mandala_step_end:0 "Governo Mandala"
 lesson_tgp_playtest_intro_mandala_step_end_desc:0 "Um grande [ruler|E] [mandala|E] depende de [piety|E], [tributaries|E] e da força de seu [mandala_aspect|E]. Domine estes elementos, e sua influência se espalhará por todo o Sudeste Asiático."
 lesson_tgp_playtest_intro_mandala_step_government:0 "Governo Mandala"
 lesson_tgp_playtest_intro_mandala_step_government_desc:0 "Sua base de poder vem de uma rede mais fluida de [tributaries|E], com apenas alguns [vassals|E] mais permanentes.\n\nIsso significa que você pode 'roubar' Tributários de outros governantes Mandala, por exemplo, usando a [character_interaction|E] $offer_tributary_status_interaction|V$.\n\nA religião também desempenha um papel central no [mandala_government|E]. Para realizar muitas ações centrais do governo, você deve gastar [piety|E]."
 lesson_tgp_playtest_intro_mandala_step_intro:0 "Mandala"
 lesson_tgp_playtest_intro_mandala_step_intro_desc:0 "Você é um [ruler|E] [mandala|E]!\n\n$game_concept_mandala$ é um [government|E] especial no Sudeste Asiático focado na fé e na [piety|E]."
 lesson_tgp_playtest_intro_mandala_step_mandala_aspect:0 "Aspecto Mandala"
 lesson_tgp_playtest_intro_mandala_step_mandala_aspect_desc:0 "Como [house_head|E] [mandala|E], sua [house|E] possui um [mandala_aspect|E], semelhante a um [powerful_family_attribute|E] no Império Bizantino.\n\nEste atributo não afeta seu [liege|E], se você tiver um, e pode ser melhorado ao longo do tempo gastando [piety|E] e [prestige|E]."
 lesson_tgp_playtest_intro_mandala_step_temple_complex:0 "Complexo do Templo"
 lesson_tgp_playtest_intro_mandala_step_temple_complex_desc:0 "Além disso, para aumentar os limites do tamanho do seu [realm|E], você deve atualizar seu [great_building|E] Complexo do Templo na sua [capital|E].\n\nIsso é feito iniciando um [great_project|E]. Pode ser bastante caro, mas se seus [subjects|E] adicionarem suas próprias [great_project_contributions|E], você não precisa pagar o custo total.\n\n#I Você pode iniciar Grandes Projetos na aba de Grandes Projetos do Painel '$DECISIONS_VIEW_TITLE$'.#!"
