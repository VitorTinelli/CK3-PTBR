l_spanish:
 action_reactive_advice_lead_your_soryo_bloc:0 "Conselho: $action_reactive_advice_lead_your_soryo_bloc_NAME$"
 action_reactive_advice_lead_your_soryo_bloc_NAME:0 "Liderando seu $game_concept_house_bloc$"
 action_reactive_advice_lead_your_soryo_bloc_click:0 "$click_to_open_lesson$"
 action_reactive_advice_lead_your_soryo_bloc_desc:0 "Você é o $game_concept_house_head$ da $game_concept_leading_house$ em seu $game_concept_bloc$. Abra isto para aprender a administrar seu $game_concept_bloc$."
 action_reactive_advice_soryo_intro:0 "Conselho: Governante $japan_feudal_government$"
 action_reactive_advice_soryo_intro_click:0 "$click_to_open_lesson$"
 action_reactive_advice_soryo_intro_desc:0 "Você é um Governante Soryo, um senhor de guerra local. Abra isto para uma introdução a este Tipo de Governo."
 action_reactive_advice_soryo_regent_become_shogun:0 "Conselho: $reactive_advice_soryo_regent_become_shogun_NAME$"
 action_reactive_advice_soryo_regent_become_shogun_click:0 "$click_to_open_lesson$"
 action_reactive_advice_soryo_regent_become_shogun_desc:0 "Você é o $game_concept_ceremonial_regent$. Abra isto para aprender como consolidar ainda mais seu poder e se tornar $game_concept_shogun$."
 action_reactive_advice_welcome_to_japan:0 "Conselho: Japão"
 action_reactive_advice_welcome_to_japan_click:0 "$click_to_open_lesson$"
 action_reactive_advice_welcome_to_japan_desc:0 "No período Heian, o Japão equilibra-se entre oficiais imperiais e senhores locais. Abra isto para uma introdução a esta estrutura política única."
 ra_become_shogun_decision:0 "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_decision_desc:0 "'$tgp_japan_become_shogun_decision_TUTORIAL|V$' é a [decision|E] a ser tomada para se tornar [shogun|E].\n\nNo entanto, para isso, existem três grandes obstáculos a superar:\n$EFFECT_LIST_BULLET$Promulgar a [law|E] [GetLaw('japanese_bureaucracy_2').GetName]\n$EFFECT_LIST_BULLET$Seu [prestige_level|E] é [prestige_i][GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L] ou superior\n$EFFECT_LIST_BULLET$Seu [legitimacy_level|E] é maior ou igual a #V 4#!"
 ra_become_shogun_end:0 "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_end_desc:0 "As rédeas do poder já repousam em suas mãos — basta segurá-las com firmeza para se tornar [shogun|E].\n\nPromulgue [GetLaw('japanese_bureaucracy_2').GetName] e o país será seu!"
 ra_become_shogun_intro:0 "Conselho: $reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_intro_desc:0 "Você é o [ceremonial_regent|E] do Japão e seu de facto [ruler|E]. No entanto, como [shogun|E], você teria ainda mais poder e controle!"
 ra_become_shogun_laws:0 "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_laws_desc:0 "Aqui, você pode gradualmente implementar uma administração mais restritiva. Para se tornar [shogun|E], você precisa de pelo menos a [law|E] [GetLaw('japanese_bureaucracy_2').GetName].\n\nEsteja ciente de que isso custa [prestige|E] e reduz a [opinion|E] que seus [vassals|E] têm de você."
 ra_become_shogun_open_decisions:0 "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_open_decisions_desc:0 "Para se tornar [shogun|E], há alguns requisitos que você deve cumprir, vamos analisá-los agora."
 ra_become_shogun_open_decisions_prompt:0 "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$"
 ra_become_shogun_open_laws:0 "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_open_laws_desc:0 "Primeiro, vamos analisar o estado de suas [laws|E]."
 ra_become_shogun_open_laws_prompt:0 "Abra a aba '$MY_REALM_WINDOW_BODY_TITLE_LAWS|V$' no painel '#V Reino#!' (destacado)"
 ra_become_shogun_open_subjects:0 "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_open_subjects_desc:0 "Em seguida, devemos analisar seus [vassals|E] [GetGovernment('japan_administrative_government').GetNameWithIcon]."
 ra_become_shogun_open_subjects_prompt:0 "Abra a aba '$MY_REALM_WINDOW_BODY_TITLE_SUBJECTS|V$' no painel '#V Reino#!' (destacado)"
 ra_become_shogun_subjects:0 "$reactive_advice_soryo_regent_become_shogun_NAME$"
 ra_become_shogun_subjects_desc:0 "Você não pode se tornar [shogun|E] sem remover quaisquer remanescentes antiquados do [government|E] [GetGovernment('japan_administrative_government').GetNameWithIcon].\n\nSe algum de seus [vassals|E] for $japan_administrative_government$, você pode encontrá-los aqui e tomar seus [titles|E] usando a [character_interaction|E] $revoke_title_interaction|V$."
 ra_soryo_basics:0 "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_basics_desc:0 "O [government|E] [GetGovernment('japan_feudal_government').GetName] é muito similar ao $game_concept_government$ [GetGovernment('feudal_government').GetName] encontrado fora do Japão.\n\nNo entanto, no Japão Heian, expandir seu [realm|E] por meio de [war|E] é considerado um [crime|E]. Como tal, seu [top_liege|E] pode revogar livremente seus [titles|E].\n\nPara evitar que seu $game_concept_top_liege$ tome o que você conquistou, você deve garantir que faça parte de um [house_bloc|E]. Caso seu $game_concept_top_liege$ declare $game_concept_war$ contra você, as [houses|E] do seu $game_concept_bloc$ se juntarão a você como [allies|E].\n\n#I Se você já faz parte de um $game_concept_bloc$, pode selecioná-lo com o botão destacado#!."
 ra_soryo_bloc_end:0 "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_end_desc:0 "Como líder do seu [bloc|E], assegure que ele cresça ao longo do tempo conquistando mais terras através de [war|E].\n\nCom um $game_concept_bloc$ forte e alta [cohesion|E], você estará pronto para formar sua [faction|E] $replace_ceremonial_regent_faction_name|V$!"
 ra_soryo_bloc_leader_cohesion:0 "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_cohesion_2:0 "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_cohesion_2_desc:0 "Para melhorar a [cohesion|E] de uma certa [house|E], primeiro certifique-se de que compartilha a mesma [house_aspiration|E], usando a [character_interaction|E] $demand_aspiration_change_interaction|V$ no [house_head|E].\n\nAinda assim, $game_concept_cohesion$ vem principalmente de boas [house_relations|E] entre todas as $game_concept_houses$ no [bloc|E]. $game_concept_house_relations$ podem ser melhoradas, por exemplo, organizando casamentos com membros da $game_concept_house$.\n\nSe tudo mais falhar, você pode simplesmente usar a interação $kick_from_house_bloc_interaction|V$ $game_concept_character_interaction$."
 ra_soryo_bloc_leader_cohesion_desc:0 "Tentar unificar [houses|E] dispersas em um grande [bloc|E] vem com desafios, já que cada $game_concept_house$ contribui para a [cohesion|E] geral do $game_concept_bloc$.\n\nAlém dos bônus concedidos por um alto $game_concept_cohesion$, você precisa de uma quantidade mínima de $game_concept_cohesion$ para formar uma [faction|E]."
 ra_soryo_bloc_leader_expanding:0 "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_expanding_desc:0 "Um [bloc|E] forte é aquele com muitas e poderosas [houses|E].\n\nNo mapa, você pode ver a extensão de todos os $game_concept_blocs$ e encontrar qualquer [house_heads|E] sem um $game_concept_bloc$. Você pode tentar convencê-los a se juntar ao seu $game_concept_bloc$ usando a [character_interaction|E] $invite_to_house_bloc_interaction|V$.\n\nNo entanto, eles podem nem sempre aceitar... Em vez disso, como [ruler|E] [GetGovernment('japan_feudal_government').GetName], você pode expandir seu $game_concept_bloc$ através da [war|E].\n\nVocê tem duas opções diferentes:\n$EFFECT_LIST_BULLET$[bloc_expansion|E] permite conquistar terras que passam a estar sob o controle do seu $game_concept_bloc$.\n$EFFECT_LIST_BULLET$[bloc_supremacy|E] é uma guerra total entre dois $game_concept_blocs$, onde os membros do $game_concept_bloc$ perdedor podem se juntar ao vencedor."
 ra_soryo_bloc_leader_intro:0 "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_intro_desc:0 "Você é o [house_head|E] da [leading_house|E] em seu [house_bloc|E], excelente!\n\nComo líder do seu $game_concept_bloc$, ele não é mais apenas um escudo, mas também uma forma de você formar uma poderosa [faction|E] para se instalar como [ceremonial_regent|E]!"
 ra_soryo_bloc_leader_open_bloc:0 "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_open_bloc_desc:0 "Vamos dar uma olhada no seu [house_bloc|E]."
 ra_soryo_bloc_leader_open_bloc_prompt:0 "Selecione seu $game_concept_bloc$ (destacado)"
 ra_soryo_bloc_leader_strength_details:0 "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_strength_details_desc:0 "A força de todos os membros do [bloc|E] é mostrada aqui.\n\nQuanto mais forte seu $game_concept_bloc$, maior a probabilidade de sua [faction|E] conseguir impor suas demandas e instalar você como [ceremonial_regent|E]."
 ra_soryo_bloc_leader_strength_intro:0 "$action_reactive_advice_lead_your_soryo_bloc_NAME$"
 ra_soryo_bloc_leader_strength_intro_desc:0 "As [houses|E] em seu [bloc|E] se juntarão à [leading_house|E] quando iniciarem [factions|E].\n\nSe você deseja se tornar [ceremonial_regent|E] e eventualmente [shogun|E], elas se juntarão à sua $replace_ceremonial_regent_faction_name|V$ $game_concept_faction$!"
 ra_soryo_end:0 "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_end_desc:0 "Como um [ruler|E] [GetGovernment('japan_feudal_government').GetName], seu caminho para se tornar [shogun|E] é aberto pela espada.\n\nConsolide o poder local, forme uma [faction|E] com seu [house_bloc|E], e um dia você poderá governar como $game_concept_shogun$."
 ra_soryo_intro:0 "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_intro_desc:0 "Você é um [ruler|E] [GetGovernment('japan_feudal_government').GetName]: um senhor de guerra que governa pela força das armas, em vez da autoridade legítima da burocracia imperial."
 ra_soryo_intro_install_regent_faction:0 "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_intro_install_regent_faction_desc:0 "Para se tornar o [ceremonial_regent|E], você deve formar uma [faction|E] $replace_ceremonial_regent_faction_name|V$ e impor com sucesso suas demandas.\n\nComo [leading_house|E], todas as [houses|E] do seu $game_concept_bloc$ se juntarão a você na $game_concept_faction$. Quanto mais forte for a força militar do seu $game_concept_bloc$, maior a probabilidade de sucesso do $game_concept_faction$.\n\nVocê também precisa garantir que a [cohesion|E] seja alta o suficiente, caso contrário não poderá nem formar a $game_concept_faction$."
 ra_soryo_intro_open_factions:0 "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_intro_open_factions_desc:0 "Para se instalar como [ceremonial_regent|E], você deve iniciar uma [faction|E]."
 ra_soryo_intro_open_factions_prompt:0 "Abra a aba '$factions_tab_my_factions|V$' no painel '$FACTIONS_WINDOW|V$'"
 ra_soryo_open_decisions:0 "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_open_decisions_desc:0 "O desejo final de qualquer [ruler|E] [GetGovernment('japan_feudal_government').GetName] é se tornar [shogun|E], um $game_concept_ruler$ militar e hereditário do Japão.\n\nPara alcançar isso, há duas [decisions|E] principais que você pode tomar. Vamos analisá-las agora."
 ra_soryo_open_decisions_prompt:0 "$TUTORIAL_OPEN_DECISION_PANEL_PROMPT$"
 ra_soryo_regional_dominion:0 "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_regional_dominion_desc:0 "A primeira [decision|E] a visar é '$tgp_japan_assert_regional_dominion_government_decision|V$'.\n\nIsso permite que você conquiste o [duchy|E] da sua região local. Embora não seja necessário para se tornar [shogun|E], é um passo útil.\n\n#TUT Se você já possui [rank|E] de [duke|E], este $game_concept_decision$ não está disponível.#!"
 ra_soryo_shogunate:0 "$reactive_advice_soryo_intro_NAME$"
 ra_soryo_shogunate_desc:0 "A [decision|E] real para se tornar [shogun|E] é '$tgp_japan_become_shogun_decision_TUTORIAL|V$'.\n\nNo entanto, para sequer começar a considerar isso, você primeiro precisa ser o [ceremonial_regent|E]."
 reactive_advice_soryo_intro_NAME:0 "Governo $japan_feudal_government$"
 reactive_advice_soryo_regent_become_shogun_NAME:0 "Formar $empire_shogunate_japanese$"
 reactive_advice_welcome_to_japan_step_blocs:0 "Blocos de Casas"
 reactive_advice_welcome_to_japan_step_blocs_desc:0 "A maioria dos [vassals|E] no Japão governa apenas um único [county|E].\n\nPara consolidar o poder, a maioria das [houses|E] pertence a um [house_bloc|E], uma aliança defensiva de [houses|E].\n\nOs membros de um $game_concept_house_bloc$ geralmente têm a mesma [house_aspiration|E] e mantêm boas [house_relations|E] entre si. Caso contrário, a [bloc_cohesion|E] é reduzida e a [leading_house|E] pode escolher expulsar $game_concept_houses$ controversas do $game_concept_bloc$.\n\n#I Se você faz parte de um $game_concept_bloc$, pode visualizar o status do seu $game_concept_bloc$ clicando no botão destacado.#!"
 reactive_advice_welcome_to_japan_step_emperor_and_regent:0 "O Imperador e seu Regente"
 reactive_advice_welcome_to_japan_step_emperor_and_regent_2:0 "O Imperador e seu Regente"
 reactive_advice_welcome_to_japan_step_emperor_and_regent_2_desc:0 "O verdadeiro poder no Japão está, na verdade, com o [ceremonial_regent|E], mostrado aqui.\n\nEles são o verdadeiro [ruler|E] [independent|E] do Japão. Além de quaisquer poderes padrão de qualquer $game_concept_independent$ $game_concept_ruler$, eles também definem a [law|E] [imperial_policy|E] que afeta todo o [realm|E]."
 reactive_advice_welcome_to_japan_step_emperor_and_regent_desc:0 "Este é o [japanese_emperor|E], também conhecido como $king_tenno_male_japanese$.\n\nEmbora seu nome indique que governa o Japão, ele é conhecido como [ceremonial_liege|E] e não possui poder real.\n\nNo entanto, casar-se com sua família ainda concede muito [prestige|E], e um ambicioso $king_tenno_male_japanese$ pode tentar tomar o poder."
 reactive_advice_welcome_to_japan_step_end:0 "Japão"
 reactive_advice_welcome_to_japan_step_end_desc:0 "No Japão, a política é sempre uma luta entre dois lados. Conduza sua [house|E] com sabedoria e você determinará o futuro do Japão."
 reactive_advice_welcome_to_japan_step_government:0 "Governo"
 reactive_advice_welcome_to_japan_step_government_desc:0 "O Japão é um [realm|E] dividido entre dois tipos de senhores.\n\n[rulers|E] possuem uma destas formas de [government|E]:\n$EFFECT_LIST_BULLET$[ritsuryo_i][ritsuryo|E] #fraco (oficiais imperiais)#!\n$EFFECT_LIST_BULLET$[soryo_i][soryo|E] #fraco (senhores feudais)#!\n\nHistoricamente, os senhores $game_concept_soryo$ cresceram em força, o que eventualmente resultou no domínio dos [shogun|E] no Japão."
 reactive_advice_welcome_to_japan_step_house_aspirations:0 "Aspirações da Casa"
 reactive_advice_welcome_to_japan_step_house_aspirations_desc:0 "Todas as [houses|E] japonesas possuem uma [house_aspiration|E].\n\nEste atributo afeta todos os membros do $game_concept_house$, e pode ser melhorado ao longo do tempo pelo [house_head|E] gastando [prestige_i|E][prestige|E].\n\n#I Como $game_concept_house_head$, você pode ver e melhorar sua $game_concept_house_aspiration$ através do botão destacado."
 reactive_advice_welcome_to_japan_step_intro:0 "Japão"
 reactive_advice_welcome_to_japan_step_intro_desc:0 "Bem-vindo ao Período Heian!\n\nNesta era, o Japão equilibra tradição e violência. [houses|E] ambiciosas competem pelo poder e controle do trono imperial.\n\n#TUT Assumimos que você já tem alguma experiência jogando Crusader Kings 3.#!"
 reactive_advice_welcome_to_japan_step_manor:0 "$japanese_manor_domicile_type$"
 reactive_advice_welcome_to_japan_step_manor_desc:0 "Todo [house_head|E] no Japão possui um $japanese_manor_domicile_type$, que você pode expandir e desenvolver com o [gold|E] que ganhar.\n\nEm contraste com as [holdings|E] em seu [domain|E], seu $japanese_manor_domicile_type$ permanece com o [house_head|E] e não é perdido se seu [domain|E] for conquistado.\n\n#I Se você for o $game_concept_house_head$, você visualiza e desenvolve seu $japanese_manor_domicile_type$ usando o botão destacado#!."
 reactive_advice_welcome_to_japan_step_open_families_tab:0 "$reactive_advice_welcome_to_japan_step_emperor_and_regent$"
 reactive_advice_welcome_to_japan_step_open_families_tab_desc:0 "No Japão, quem é dito governar e quem #EMP realmente#! governa não é o mesmo. Vamos dar uma olhada agora."
 reactive_advice_welcome_to_japan_step_open_families_tab_prompt:0 "Abra a aba '$administraction_tab_families|V$' no painel '$ADMINISTRATIVE_GOVERNMENT_HEADER|V$' (destacado)"
