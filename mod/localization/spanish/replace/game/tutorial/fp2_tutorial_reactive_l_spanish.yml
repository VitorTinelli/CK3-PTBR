l_spanish:
 action_reactive_advice_struggle:0 "Conselho: Desafios"
 action_reactive_advice_struggle_click:0 "$click_to_open_lesson$"
 action_reactive_advice_struggle_desc:0 "Você pode participar de um Desafio. Abra isso para aprender mais sobre o que isso significa para você."
 lessons_ending_struggle:0 "Encerrando a Luta"
 lessons_ending_struggle_desc:0 "Aqui você pode ver todas as Decisões de Encerramento para o [struggle|E].\n\nLembre-se de que cada Decisão de Encerramento requer que você esteja em uma fase específica para ativá-las. Você será notificado se uma delas estiver disponível."
 lessons_ending_struggle_open:0 "Encerrando a Luta"
 lessons_ending_struggle_open_desc:0 "O [struggle|E] continuará mudando de fase até que um participante acione uma das Decisões de Encerramento e finalize o [struggle|E]. Você sempre pode verificar as Decisões de Encerramento para verificar os requisitos e efeitos."
 lessons_ending_struggle_open_prompt:0 "Abrir as Decisões de Encerramento"
 lessons_explore_struggle_open:0 "Explorar a Luta"
 lessons_explore_struggle_open_desc:0 "Agora que você conhece todos os conceitos básicos e está pronto para o seu primeiro [struggle|E].\n\nVerificar os efeitos da fase atual e as próximas fases potenciais em que você pode querer trabalhar é um bom ponto de partida."
 lessons_next_struggle_phases:0 "Próximas Fases da Luta"
 lessons_next_struggle_phases_desc:0 "A [struggle_phase|E] atual terminará quando uma das próximas fases potenciais atingir [GetDefine('NStruggle', 'POINT_BASED_PHASE_DEFAULT_DURATION')] de progresso. Para aumentar o progresso de qualquer uma das fases seguintes potenciais, você deve completar qualquer [struggle_catalyst_catalyst|E] listado sob elas.\n\n#TUT Inspecione as fases potenciais seguintes para aprender mais sobre elas, seus efeitos e o progresso recente do [struggle_catalyst|E]. Selecioná-las abrirá a lista do [struggle_catalyst|E], que pode ser concluída ilimitadamente por você ou outros participantes [Concept('struggle_involved', 'Envolvidos')|E] no [struggle|E].#!"
 lessons_struggle_current_phases_and_effects:0 "Fases Atuais e Efeitos"
 lessons_struggle_current_phases_and_effects_desc:0 "A [struggle_phase|E] atual impacta toda a [struggle_region|E], aplicando efeitos especiais para os participantes [Concept('struggle_involved', 'Envolvidos')|E], [struggle_interloper_interlopers|E] e [Concept('struggle_uninvolved', 'Não Envolvidos')|E].\n\nNesta seção, você pode verificar os efeitos da fase na [war|E], [faith|E], [culture|E] e outros efeitos."
 lessons_struggle_introduction:0 "Desafios"
 lessons_struggle_introduction_desc:0 "Agora você faz parte de um [struggle|E]!\n\n[struggle_struggles|E] são conflitos prolongados dentro de uma [region|E] onde as ações de todos os participantes irão mudar o estado da área, estabelecendo diferentes [struggle_phase_phases|E]. As mudanças no estado da região virão com efeitos na [war|E], [faith|E] e [culture|E].\n\nNo final, todos os participantes competem para serem aqueles que decidirão como o [struggle|E] termina, afetando todos os participantes na região."
 lessons_struggle_involvement_view:0 "Envolvimento na Luta"
 lessons_struggle_involvement_view_desc:0 "Aqui você pode ver suas informações de envolvimento, juntamente com uma análise do que o torna [struggle_involved|E], [struggle_interloper|E] ou [struggle_uninvolved|E].\n\nAlém do seu envolvimento pessoal, você pode ver a lista de participantes do [struggle|E] e o envolvimento deles. [struggle_involved_cultures|E] e [struggle_involved_faiths|E] também podem ser encontrados aqui.\n\n#TUT Saber o envolvimento de outros jogadores é importante ao planejar quais Catalysts você pode querer buscar, porque os Catalysts podem fazer com que você direcione sua atenção para outro participante do [struggle|E], [faith|E] ou [culture|E].#!"
 lessons_struggle_involvement_view_open:0 "Envolvimento na Luta"
 lessons_struggle_involvement_view_open_desc:0 "Em um [struggle|E], todos os [characters|E] na região podem acionar [struggle_catalyst_catalysts|E]. Portanto, é importante saber quem são os participantes [Concept('struggle_involved', 'Envolvidos')|E] e [struggle_interloper_interlopers]. A visualização do Envolvimento no [struggle|E] oferece informações sobre isso."
 lessons_struggle_involvement_view_open_prompt:0 "Abrir a Visualização de Envolvimento no [struggle|E]"
 lessons_struggle_region_open:0 "Região do Desafio"
 lessons_struggle_region_open_desc:0 "A [struggle_region|E] é delimitada por uma nova fronteira que é destacada quando você passa o mouse sobre o botão do Desafio. Apenas personagens que possuem terras na região participam do [struggle|E].\n\n#TUT [characters|E] fora da região podem se juntar a um [struggle|E] adquirindo terras dentro da [struggle_region|E] e movendo sua [capital|E] para a área.#!"
 lessons_struggle_view:0 "Visualização do Desafio"
 lessons_struggle_view_desc:0 "Na Visualização do Desafio, você pode aprender mais sobre a [struggle_phase|E] atual e seus efeitos. Você também pode ver as próximas fases potenciais e os [struggle_catalyst_catalysts|E] necessários para completar e avançar o [struggle|E] em direção a elas."
 lessons_struggle_view_open:0 "Acessando a Visualização do Desafio"
 lessons_struggle_view_open_desc:0 "Aqui você pode abrir a visualização do [struggle|E], o local onde você pode inspecionar todas as informações relacionadas ao [struggle|E]."
 lessons_struggle_view_open_prompt:0 "Abrir a visualização do [struggle|E]"
 reactive_advice_struggle:0 "Desafios"
 reactive_advice_struggle_introduction:0 "$lessons_struggle_introduction$"
