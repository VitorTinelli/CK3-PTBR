 ra_admin_gov_1b:0 "$reactive_advice_admin_gov$"
 ra_admin_gov_2:0 "$reactive_advice_admin_gov$"
 ra_admin_gov_2_desc:0 "Estes são todos os $TUTORIAL_PROVINCES$ presentes dentro do [top_realm|e].\n\nUm $TUTORIAL_GOVERNOR$ só pode governar um $TUTORIAL_PROVINCE_NO_TOOLTIP$, crescer em poder significa distribuir o controle sobre $TUTORIAL_PROVINCES_NO_TOOLTIP$ entre os membros de sua [house|e].\n\nComo $TUTORIAL_GOVERNORS_NO_TOOLTIP$ não possuem seus $TUTORIAL_PROVINCE_NO_TOOLTIP$, eles precisarão garantir suas posições por meio de [schemes|e] e ação política.\n\n#I Você pode inspecionar $TUTORIAL_PROVINCES_NO_TOOLTIP$ clicando neles no mapa ou na lista.#!"
 ra_admin_gov_2b:0 "$reactive_advice_admin_gov$"
 ra_admin_gov_3:0 "Visão Geral da Província"
 ra_admin_gov_3_desc:0 "As [skills|e] de um $TUTORIAL_GOVERNOR_NO_TOOLTIP$ e sua classificação no [trait|e] [GetTrait('governor').GetName( GetNullCharacter )] determinarão sua [governor_efficiency|e], que mede quantos [levies|e] e [taxes|e] eles poderão coletar para seu $game_concept_top_liege$.\n\nAlta $game_concept_governor_efficiency$ também fortalece os $TUTORIAL_PROVINCIAL_ARMIES$ da [province|E].\n\nSe você é o [top_liege|e], deve garantir que $game_concept_provinces$ sejam governados por $TUTORIAL_GOVERNORS_NO_TOOLTIP$ com alta $game_concept_governor_efficiency$."
 ra_admin_gov_3_prompt:0 "Abra a aba 'Nomeação de $TUTORIAL_GOVERNOR_NO_TOOLTIP$'"
 ra_admin_gov_4:0 "Sucessão e Influência"
 ra_admin_gov_4_desc:0 "A [succession|e] de um $TUTORIAL_PROVINCE$ em um [administrative_government|e] é determinada por uma eleição, onde você gasta @influence_icon![influence|e] para aumentar a [candidate_score|E] de um candidato.\n\nSe você deseja expandir seu poder dentro do [realm|e], deve garantir que membros de sua [house|e] sejam $TUTORIAL_GOVERNORS$, ou até mesmo possuam o [title|e] do $game_concept_top_realm$."
 ra_admin_gov_5:0 "Governança da Província"
 ra_admin_gov_5_desc:0 "Cada $TUTORIAL_PROVINCE$ é [governed|e] por uma [family|e]. Você pode ver o brasão da [house|e] exibido ao lado de cada $TUTORIAL_PROVINCE_NO_TOOLTIP$.\n\nÀ medida que seu $game_concept_house$ adquire mais [titles|e], você se tornará mais proeminente, potencialmente se tornando uma [powerful_family|e]."
 ra_admin_gov_5b:0 "Governança da Província"
 ra_admin_gov_6:0 "Famílias Poderosas"
 ra_admin_gov_6_desc:0 "Uma [powerful_family|e] é uma [house|e] influente no [administrative_government|e]. A família do [top_liege|e] é sempre considerada poderosa, não importa sua [powerful_family_rating_mid|e]. Além disso, pode haver cinco outras $game_concept_powerful_families$.\n\nEnquanto qualquer $game_concept_house$ pode definir um [powerful_family_attribute|E], isso só estará em vigor se sua família associada for considerada Poderosa."
 ra_admin_gov_7:0 "Estatutos"
 ra_admin_gov_7_desc:0 "Uma [estate|e] é um tipo de [domicile|e], que representa uma posse de terra privada não atrelada a nenhum [title|e] de [land|e] específico. Em um [administrative_government|e], ela serve como uma base de operações para sua [family|e] e será herdada dentro de sua [house|e].\n\nVocê pode melhorar e construir novos [estate_buildings|e] dentro de sua $game_concept_estate$ para aumentar sua [influence|e] e influência política dentro do [realm|e].\n\n#TUT Notavelmente, [rulers|e] [Concept('feudal', 'feudais')|e] dentro de um $game_concept_administrative_government$ não terão acesso a uma $game_concept_estate$.#!"
 ra_admin_gov_8:0 "No Caminho para o Poder"
 ra_admin_gov_8_desc:0 "@ra_admin_gov_8! Um [administrative_government|e] é tudo sobre família, influência política, intriga e nomear a pessoa certa para o trabalho certo.\n\nVocê fará uso de [influence|e] para melhorar sua posição dentro do [realm|e] enquanto direciona membros de sua [dynasty|e] para posições de poder.\n\n[scheme|e] contra seus rivais e minar sua autoridade através de intrigas políticas. O caminho para o poder é longo e tortuoso, mas jogue suas cartas certas e você pode conseguir navegar por ele."
 ra_admin_gov_troops_1:0 "Militar em um Governo Administrativo"
 ra_admin_gov_troops_1_desc:0 "@ra_admin_troops_1! Em um [administrative_government|e], a gestão militar e de tropas funciona de forma diferente de outros tipos de $game_concept_government$.\n\nEmbora você continue tendo acesso e controle total sobre suas próprias tropas, também tem acesso a $TUTORIAL_PROVINCIAL_ARMIES$. Em um $game_concept_administrative_government$, cada [province|e] pode ter seu próprio [army|e], que pertence especificamente a esse [title|e].\n\n[governors|e] desempenham tanto um papel cívico quanto militar, enquanto o [top_liege|e] tem a capacidade de gerenciar as tropas dos $game_concept_governors$, assumindo o controle delas ou atribuindo-as a outros $game_concept_governors$ dentro do [realm|e]."
 ra_admin_gov_troops_1_prompt:0 "Abrir a aba $TUTORIAL_PROVINCIAL_ARMIES_NO_TOOLTIP$ (destacada)"
 ra_admin_gov_troops_1b:0 "Militar em um Governo Administrativo"
 ra_admin_gov_troops_2:0 "Militar em um Governo Administrativo"
 ra_admin_gov_troops_2_desc:0 "[governors|e] podem criar [men_at_arms|e] como parte do $game_concept_governorship$ pelo qual são responsáveis. Essas tropas pertencem ao [title|e] e podem ser emprestadas a outros $game_concept_governors$ dentro do [realm|e].\n\nO [top_liege|e] tem os $TUTORIAL_PROVINCIAL_ARMIES$ à sua disposição e pode gerenciar as tropas dos $game_concept_governors$. Ele pode assumir o controle delas em suas próprias [wars|e] ou realocá-las para $game_concept_governors$ que possam estar precisando.\n\nIsso lhes dá a capacidade de mobilizá-las e usá-las, melhorando as defesas ao longo das fronteiras do $game_concept_realm$."
 ra_admin_gov_troops_2_prompt:0 "Inspecionar um [GetPlayer.Custom('GetProvincialArmyConceptNoTooltip')]"
 ra_admin_gov_troops_2b:0 "Militar em um Governo Administrativo"
 ra_admin_gov_troops_3:0 "Adquirindo Exércitos Adicionais"
 ra_admin_gov_troops_3_desc:0 "Como [governor|E], você pode usar sua [influence|e] para solicitar a ajuda de um $game_concept_army$ de uma [province|e] diferente.\n\nO [top_liege|e] pode forçar qualquer $game_concept_governor$ a realocar seu $game_concept_army$ ou assumir o controle dele diretamente."
 ra_admin_gov_troops_4:0 "Especificações do Exército"
 ra_admin_gov_troops_4_desc:0 "O status mostra se o [army|e] está disponível ou não.\n\nSe as tropas forem levantadas pelo [governor|e] em uma [war|e], o [top_liege|e] não pode reatribuir as tropas até que tenham sido dispensadas.\n\nEm caso de revoltas dos $game_concept_governors$ contra o [liege|e], o $game_concept_governor$ retoma quaisquer tropas que tenham origem em seu [governorship|e].\n\nFique de olho na situação em todo o reino para otimizar seu uso."
 ra_admin_gov_troops_5:0 "No Caminho para o Poder"
 ra_admin_gov_troops_5_desc:0 "@ra_admin_troops_5! Enquanto um [realm|e] [administrative|e] é alimentado por ações políticas e intrigas, ter um Militar forte e bem gerido não apenas melhorará suas defesas, mas também ajudará em suas empreitadas diplomáticas.\n\nAfinal, a força militar é apenas um dos muitos Caminhos para o Poder..."
 ra_agent_scheme_rework_1:0 "Esquemas Complexos"
 ra_agent_scheme_rework_1_desc:0 "Vamos dedicar um momento para revisar os [schemes|e] complexos. Esses $game_concept_schemes$ consistem em três parâmetros principais: [success_chance|e], [scheme_speed_single|e] e [secrecy|e].\n\nPara ajudá-lo a completar um $game_concept_scheme$, existem diferentes tipos de [agents|e], que geralmente vêm em grupos pré-selecionados de cinco ao iniciar um $game_concept_scheme$ complexo."
 ra_agent_scheme_rework_2:0 "Detalhes do Esquema Complexo"
 ra_agent_scheme_rework_2_desc:0 "Um [scheme|e] complexo se desenrolará ao longo de várias [scheme_phases|e]. Cada $game_concept_scheme_phase$ consiste em um número de dias, após os quais sua [success_chance|e] aumentará.\n\nHá uma chance de que você obtenha uma [scheme_opportunity_opportunity|e] após cada $game_concept_scheme_phase$, que você pode usar para convencer [agents|e] a se juntar, ou para executar o $game_concept_scheme$ com uma maior $game_concept_success_chance$."
 ra_agent_scheme_rework_3:0 "Potencial do Esquema Complexo"
 ra_agent_scheme_rework_3_desc:0 "Cada [scheme|e] tem um [scheme_potential|e] associado. Este Potencial pode ser aumentado através do uso de [agents|e], e serve como um limite rígido para a [success_chance|e] máxima que você pode acumular.\n\nO $game_concept_scheme_potential$ nunca pode exceder 95%, o que significa que todos os $game_concept_schemes$, independentemente do número de [scheme_opportunity_opportunities|e] gastos para aumentar a $game_concept_success_chance$, sempre terão uma chance de falhar."
 ra_agent_scheme_rework_4:0 "Segredo do Esquema Complexo"
 ra_agent_scheme_rework_4_desc:0 "Um [scheme|e] complexo tem um certo nível de [secrecy|e] associado a ele. Este é um valor que representa a probabilidade do $game_concept_scheme$ ser descoberto.\n\nAo iniciar um $game_concept_scheme$, haverá um período de graça de alguns meses, durante o qual não pode ser descoberto sob nenhuma circunstância. Após esse período, o $game_concept_scheme$ está em risco de ser descoberto através de [scheme_breaches|e].\n\nVocê pode executar um esquema mesmo que ele tenha $game_concept_scheme_breaches$, mas isso reduzirá a sua [success_chance|e]. Se o seu $game_concept_scheme$ acumular sete $game_concept_scheme_breaches$, ele será cancelado.\n\n#TUT Além disso, certos esquemas básicos, como [GetScheme('seduce').GetTypeName], também podem ser considerados secretos e ter um período de graça associado.#!"
 ra_agent_scheme_rework_5:0 "Agentes em Esquemas Complexos"
 ra_agent_scheme_rework_5_desc:0 "[schemes|e] complexos têm cinco vagas de [agent|e] que podem ser preenchidos com potenciais co-conspiradores. Geralmente, é uma boa ideia preencher o maior número possível das vagas de $game_concept_agent$, pois eles podem fornecer bônus benéficos para a [scheme_speed|e], [secrecy|e] ou [scheme_potential|e].\n\nDiferentes tipos de $game_concept_agent$ favorecem diferentes [skills|e]. Por exemplo, um [GetAgentSlotType( 'agent_infiltrator' ).GetName] se beneficia de [intrigue_i|e] [intrigue|e] e [diplomacy_i|e] [diplomacy|e] além de certos [traits|e]."
 ra_agent_scheme_rework_6:0 "Executando um Esquema"
 ra_agent_scheme_rework_6_desc:0 "Uma vez que você se sinta confiante de que planejou o suficiente, pode ser hora de considerar executar seu [scheme|e]. Para fazer isso, você pode utilizar [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t1_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t2_value')], [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t3_value')] ou [EmptyScope.ScriptValue('multi_ending_scheme_charge_to_advance_threshold_t4_value')] das suas [scheme_opportunity_opportunities|e] acumuladas.\n\nAlém disso, se você suspeitar que alguém está tramando contra você, pode ser interessante mudar seu [scheme_countermeasure|e] ativo para evitar possíveis contratempos.\n\nBoa sorte e boas tramas!"
 ra_army_auto_explain:0 "$reactive_advice_army_automation$"
 ra_army_auto_explain_desc:0 "Aqui você pode decidir se seus [armies|E] devem ser automatizados ou não. Você pode fazer isso a qualquer momento, até mesmo no meio de uma [war|E].\n\nVocê ainda pode recrutar manualmente [men_at_arms|E], contratar [mercenaries|E] e realizar [raids|E]. Você pode ajustar esse comportamento aqui, clicando no botão de Configurações de $ARMY_AUTOMATION_FEATURE_NAME$."
 ra_army_auto_intro:0 "$reactive_advice_army_automation$"
 ra_army_auto_intro_desc:0 "Se quiser focar em outras coisas além de controlar seus [armies|E], pode deixar o jogo controlá-los."
 ra_army_auto_open:0 "$reactive_advice_army_automation$"
 ra_army_auto_open_desc:0 "Você pode ativar $ARMY_AUTOMATION_FEATURE_NAME$ na Visão Militar."
 ra_army_auto_open_prompt:0 "Abrir a Visão Militar"
 ra_artifact_inventory_general:0 "Inventário"
 ra_artifact_inventory_general_desc:0 "Você adquiriu seu primeiro [inventory_artifact|E]. Esses [artifacts|E] são carregados com você e fornecem vários benefícios."
 ra_artifact_inventory_open_step:0 "$ra_artifact_inventory_general$"
 ra_artifact_inventory_open_step_desc:0 "Os [inventory_artifacts|E] são armazenados no seu Inventário, vamos abri-lo agora."
 ra_artifact_inventory_open_step_open:0 "Abra o Inventário (destacado)"
 ra_artifact_inventory_welcome:0 "$ra_artifact_inventory_general$"
 ra_artifact_inventory_welcome_desc:0 "No seu Inventário, você pode equipar [inventory_artifacts|E] para obter vários benefícios, como aumentar determinada [skill|E] ou aumentar seu [prestige|E].\n\nVocê também pode [repair|E] ou [reforge|E] [inventory_artifacts|E], o que restaurará sua [durability|E] e impedirá que sejam destruídos com o tempo.\n\nVocê também pode ver quais [artifact_claims|E] você possui e tentar obter esses [artifacts|E] para si mesmo!"
 ra_christian_situation:0 "A Igreja Cristã"
 ra_christian_situation_1:0 "$ra_christian_situation$"
 ra_christian_situation_1_desc:0 "Como [GetReligionByKey('christianity_religion').GetAdjective], você é membro de [GetSituation('the_christian_church').GetName]. Esta é uma [situation|e] que representa a natureza em constante mudança da crença cristã na Europa medieval.\n\nVamos dedicar um momento para analisá-la."
 ra_christian_situation_2:0 "$ra_christian_situation$"
 ra_christian_situation_2_desc:0 "[GetSituation('the_christian_church').GetName] pode ser acessado através do painel de Situações ou clicando no botão destacado."
 ra_christian_situation_2_prompt:0 "Abra a Situação da Igreja Cristã (destacada)"
 ra_christian_situation_2b:0 "$ra_christian_situation$"
 ra_christian_situation_3:0 "$ra_christian_situation$"
 ra_christian_situation_3_desc:0 "A área destacada mostra a [the_christian_church_chapter_short|e] atual de [GetSituation('the_christian_church').GetName]. Como você pode ver, a [situation|e] está atualmente na [GetSituation('the_christian_church').GetTopSubRegion.GetCurrentPhase.GetName].\n\nCada $game_concept_the_christian_church_chapter_short$ vem com seu próprio conjunto de benefícios (e às vezes desvantagens) para [secular_rulers|e] e [clergy|e]. Por exemplo, $game_concept_secular_rulers$ podem nomear seus próprios [court_chaplains|e] durante a [GetSituationType('the_christian_church').GetPhaseType('investiture_crisis').GetName]."
 ra_christian_situation_4:0 "$ra_christian_situation$"
 ra_christian_situation_4_desc:0 "Esta seção mostra todas as potenciais [the_christian_church_chapters_short|e] nas quais [GetSituation('the_christian_church').GetName] pode transicionar atualmente.\n\nCada $game_concept_the_christian_church_chapter_short$ leva a um número limitado de outras $game_concept_the_christian_church_chapters_short$, então você vai querer empurrar a Igreja para aquela que lhe interessa enquanto ainda pode! Mais sobre isso mais tarde."
 ra_christian_situation_4b:0 "$ra_christian_situation$"
 ra_christian_situation_4b_desc:0 "[situation_catalyst_catalysts|e] ditam o fluxo dos Capítulos. Vamos dar uma olhada neles."
 ra_christian_situation_4b_prompt:0 "Clique no botão #V Ver Catalisadores#! de um futuro Capítulo potencial (destacado)"
 ra_christian_situation_4c:0 "$ra_christian_situation$"
 ra_christian_situation_4c_desc:0 "Nesta janela, você pode ver uma lista de todos os [situation_catalyst_catalysts|e] que contribuem com progresso para um [the_christian_church_chapter_short|e] específico.\n\n$game_concept_situation_catalyst_catalysts$ podem ser acionados por qualquer [GetReligionByKey('christianity_religion').GetAdjective] [ruler|e]. Não há limite para quantas vezes um $game_concept_situation_catalyst_catalyst$ pode ser acionado. Cada vez que um é acionado, ele concederá uma certa quantidade de pontos de progresso para o Capítulo ao qual está vinculado.\n\nAlguns Catalisadores acontecerão naturalmente com o tempo, enquanto outros requerem mais esforço ativo para serem acionados. Para que um $game_concept_the_christian_church_chapter_short$ se torne ativo, ele deve atingir #V 1000#! pontos de progresso. Isso geralmente acontece ao longo de muitos anos de jogo."
 ra_christian_situation_4d:0 "$ra_christian_situation$"
 ra_christian_situation_4d_desc:0 "Aqui, você verá algumas [decisions|e] importantes que você pode tomar para moldar o futuro de [GetReligionByKey('christianity_religion').GetAdjective] [faith|e]. Certas $game_concept_decisions$ só estarão disponíveis durante certas [the_christian_church_chapters_short|e].\n\nSe você quiser direcionar a Igreja para um $game_concept_the_christian_church_chapter_short$ específico, você pode tomar a #V Decisão Guiar a Igreja Cristã#! $game_concept_decision$, disponível uma vez a cada dez anos."
 ra_christian_situation_5:0 "$ra_christian_situation$"
 ra_christian_situation_5_desc:0 "Nesta aba, podemos ver os seis [situation_participant_groups|e] de [GetSituation('the_christian_church').GetName].\n\nO Poder Principal é definido como a [GetReligionByKey('christianity_religion').GetAdjective] [faith|e] que controla mais [counties|e] no mundo. Em 1066, este é [GetFaithByKey('catholic').GetName].\n\nO Grupo de Poderes Secundários consiste em qualquer outra $game_concept_faiths$ cristã que siga a [doctrine|e] [GetDoctrine('special_doctrine_ecumenical_christian').GetBaseName]. Em 1066, [GetFaithByKey('orthodox').GetName] e [GetFaithByKey('miaphysitism').GetName] se qualificam.\n\nPor fim, o Grupo de Hereges $game_concept_situation_participant_group$ consiste em todas as outras $game_concept_faiths$ cristãs que não seguem a $game_concept_doctrine$ [GetDoctrine('special_doctrine_ecumenical_christian').GetBaseNameNoTooltip]."
 ra_christian_situation_6:0 "$ra_christian_situation$"
 ra_christian_situation_6_desc:0 "[GetSituation('the_christian_church').GetName] oscilará em poder e influência entre diferentes [the_christian_church_chapters_short|e] conforme o tempo progride. Tanto [secular_rulers|e] quanto [clergy|e] têm a capacidade de empurrar [GetReligionByKey('christianity_religion').GetName] na direção que desejam.\n\nVocê pode construir grandes catedrais durante um [the_christian_church_stability|e], procurar espalhar a [faith|e] durante um [the_christian_church_zeal|e], ou tentar guiar a Igreja para longe do pecado durante um [the_christian_church_crisis|e].\n\nTalvez você consiga reparar o cisma? Ou até mesmo impedir que ele aconteça de vez? Talvez a Igreja considere sua [rite|e] herética? Em todo caso, boa sorte!"
 ra_christian_situation_close_catalyst_subwindow:0 "$ra_christian_situation$"
 ra_christian_situation_close_catalyst_subwindow_desc:0 "Com [situation_catalyst_catalysts|e] abordados, vamos falar sobre [decisions|e] na parte inferior da Situação."
 ra_christian_situation_close_catalyst_subwindow_prompt:0 "Fechar a subjanela de Catalisadores"
 ra_christian_situation_college_of_cardinals:0 "$ra_christian_situation$"
 ra_christian_situation_college_of_cardinals_desc:0 "Você pode dar uma espiada no [college_of_cardinals|e] clicando no botão destacado. O futuro Papa será um de três [cardinals|e], com cada um preenchendo um nicho diferente.\n\nVocê pode influenciar diretamente quem será o próximo Papa aumentando a [papabile_score|e] de um $game_concept_cardinal$ ou convencendo outros $game_concept_cardinals$ a votarem neles."
 ra_christian_situation_go_to_overview:0 "$ra_christian_situation$"
 ra_christian_situation_go_to_overview_desc:0 "Para esta próxima parte, precisamos olhar para a aba Visão Geral."
 ra_christian_situation_go_to_overview_prompt:0 "Abra a aba Visão Geral (destacada)"
 ra_christian_situation_go_to_participants:0 "$ra_christian_situation$"
 ra_christian_situation_go_to_participants_desc:0 "Para esta próxima parte, precisamos olhar para a aba Participantes."
 ra_christian_situation_go_to_participants_prompt:0 "Abra a aba Participantes (destacada)"
 ra_contracts_1_desc:0 "$game_concept_task_contract_desc$"
 ra_court_pos_appointing:0 "$ra_court_pos_open_view$"
 ra_court_pos_appointing_desc:0 "Você pode nomear novas [court_positions|E] clicando em um dos retratos vazios para uma Posição na Corte vaga. Um Personagem com uma alta [aptitude|E] para a Posição lhe dará um bônus maior.\n\n#TUT Quando você nomeia alguém para uma Posição, isso também afeta a [opinion|E] deles sobre você. Por causa disso, pode ser benéfico nomear alguém com pouca $game_concept_aptitude$ apenas para fazê-los gostar mais de você.#!"
 ra_court_pos_open_view:0 "Posições na Corte"
 ra_court_pos_open_view_desc:0 "Este é um bom momento para revisar as [court_positions|E]. São atribuições e honras que você pode dar aos seus [courtiers|E] e [vassals|E].\n\nCada uma delas proporciona um benefício, ao custo de um salário mensal. Por exemplo, um [GetCourtPositionType('court_physician_court_position').GetName()] manterá você e sua [court|E] saudáveis."
 ra_court_pos_open_view_trigger:0 "Abra a aba Posições na Corte (destacada)"
 ra_court_pos_salary:0 "$ra_court_pos_open_view$"
 ra_create_accolade_attributes:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_attributes_desc:0 "Cada [acclaimed_knight|E] possui dois [accolade_types|E] (destacados), um primário e um secundário. Antes de criar o [accolade|E], esses Atributos são mostrados para cada candidato.\n\nCada Atributo concede vários bônus a você e aos seus [armies|E], à medida que o Louvor ganha [glory|E]. Glória é adquirida por meio da participação em [contests|E] e [battles|E] do tipo [GetActivityType( 'activity_tournament' ).GetName()].\n\nO Atributo primário faz sempre parte do [accolade|E] e não pode ser alterado na [accolade_succession|E]."
 ra_create_accolade_candidates:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_candidates_desc:0 "Ao criar um [accolade|E], você escolhe um dos seus [knights|E] válidos na lista."
 ra_create_accolade_candidates_prompt:0 "Escolha um Candidato na lista (destacado)"
 ra_create_accolade_conclusion:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_conclusion_desc:0 "Agora você pode criar este [accolade|E] se desejar.\n\nMais Louvores ficarão disponíveis conforme a sua [culture|E] descobre [innovations|E]."
 ra_create_accolade_knights_panel:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 ra_create_accolade_knights_panel_desc:0 "Agora você pode conceder um [accolade|E] a um dos seus [knights|E]!\n\nCada cavaleiro que possui um Louvor se torna um [acclaimed_knight|E] e concede bônus a você e aos seus [armies|E].\n\nO Louvor permanecerá até que seja removido, e será repassado aos futuros cavaleiros por meio da [accolade_succession|E]."
 ra_create_accolade_knights_panel_prompt:0 "Selecione um Louvor não atribuído (destacado)"
 ra_domicile_arrive_task:0 "Concluir sua Viagem de Acampamento"
 ra_domicile_camp_task:0 "Navegar até a janela do Acampamento"
 ra_domicile_depart_task:0 "Iniciar sua Viagem de Acampamento"
 ra_domicile_travel_task:0 "Navegar até a visualização de $relocate_camp_to_interaction$"
 ra_dynastic_cycle_era_actions:0 "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_actions_desc:0 "Você também pode realizar Ações para influenciar o [dynastic_cycle|e], seja por conta própria ou por meio de seu [movement|e].\n\nVocê pode encontrar essas Ações na parte inferior da janela.\n\nSe você ainda está $dynastic_cycle_participant_group_undecided_movement|V$, deveria juntar-se a um $game_concept_movement$."
 ra_dynastic_cycle_era_effects:0 "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_effects_desc:0 "A China está em uma [dynastic_cycle_era_short|e] de Avanço.\n\nSe você é um oficial de baixo escalão, a coisa mais importante a entender é como isso afeta você, o que é mostrado aqui.\n\nExistem muitos diferentes $game_concept_dynastic_cycle_eras_short$, cada um deles direcionando a China de uma maneira distinta."
 ra_dynastic_cycle_era_group_leader:0 "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_group_leader_desc:0 "Cada [movement|E] possui um [movement_leader|E], que pode fazer petições para promover a causa de seu $game_concept_movement$.\n\nPara se tornar um $game_concept_movement_leader$, você precisa ter o maior [movement_power|E] dentro do seu $game_concept_movement$."
 ra_dynastic_cycle_era_groups:0 "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_groups_desc:0 "Muitos [characters|E] dentro e ao redor da China têm impacto sobre seu futuro. Esses $game_concept_characters$ pertencem a [movements|e], cada um dos quais deseja direcionar a China de maneira diferente.\n\nPor exemplo, o $dynastic_cycle_participant_group_advancement_movement|V$ deseja melhorar o Império olhando para dentro através da [dynastic_cycle_era_short|e] de Avanço, enquanto o $dynastic_cycle_participant_group_expansion_movement|V$ deseja que a China cresça e se expanda por força militar através da Era de Expansão."
 ra_dynastic_cycle_era_open_eras:0 "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_open_eras_desc:0 "Primeiro, vamos ver em qual [dynastic_cycle_era_short|e] o Ciclo Dinástico se encontra."
 ra_dynastic_cycle_era_open_eras_trigger:0 "Abrir a aba '$dynastic_cycle_tab_dynastic_cycle$'"
 ra_dynastic_cycle_era_open_groups:0 "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_era_open_groups_desc:0 "O estado do império não pode mudar sozinho, mas é influenciado por grupos poderosos de [characters|E] dentro das fronteiras da China. Vamos observar estes $game_concept_characters$ agora."
 ra_dynastic_cycle_era_open_groups_trigger:0 "Abrir a aba '$dynastic_cycle_tab_movements$'"
 ra_dynastic_cycle_intro:0 "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_intro_desc:0 "#F O império, há muito dividido, deve se unir;\nhá muito unido, deve se dividir.\nAssim sempre foi.\n\n — #italic Luó Guànzhōng\nRomance dos Três Reinos#!#!\n\nHistoricamente, a China foi governada por muitas [dynasties|E] diferentes, separadas por eras de guerra e divisão.\n\nO [dynastic_cycle|E] representa esse processo, assim como a luta por influência e reforma dentro do império."
 ra_dynastic_cycle_open:0 "$game_concept_dynastic_cycle$"
 ra_dynastic_cycle_open_desc:0 "O [dynastic_cycle|E] é uma [situation|E] envolvendo todos os [rulers|e] dentro e ao redor da China.\n\nVamos dar uma olhada agora."
 ra_dynastic_cycle_open_trigger:0 "Abrir a visualização do $game_concept_dynastic_cycle$"
 ra_epidemics_1:0 "$reactive_advice_epidemics$"
 ra_epidemics_1_desc:0 "[epidemics|E] são surtos de doenças que se espalham pelo mapa, afetando tanto [characters|E] quanto as [holdings|E]. Quando uma Praga está presente em uma área, os [baronies|E] afetados têm uma [infection_rate|E] que governa a gravidade de seu impacto.\n\nA visualização de [epidemics|E] pode ser encontrada no canto inferior direito."
 ra_epidemics_2:0 "$reactive_advice_epidemics$"
 ra_epidemics_2_desc:0 "Cada [epidemic|E] no mapa é dividida em seções no painel $reactive_advice_epidemics$.\n\nOs painéis de $reactive_advice_epidemics$ do reino fornecem informações sobre $reactive_advice_epidemics$ dentro do seu reino, os painéis de $reactive_advice_epidemics$ do mundo informam sobre $reactive_advice_epidemics$ no resto do mundo, e os painéis de $reactive_advice_epidemics$ próximos mostram o progresso de $reactive_advice_epidemics$ que ainda não estão dentro do seu reino, mas estão próximos o suficiente para potencialmente representar uma ameaça no futuro."
 ra_epidemics_3:0 "$reactive_advice_epidemics$"
 ra_epidemics_3_desc:0 "Dentro deste painel, informações relevantes são armazenadas para cada Praga. Ele rastreia qual é a gravidade da Praga - Menor, Maior ou Apocalíptica - quando e onde ela começou, quantos [characters|E] ela matou, e ambos os [modifiers|E] de personagem e localização, para [baronies|E] e [counties|E].\n\nO botão 'Ver Praga' o levará a mais detalhes."
 ra_epidemics_4:0 "$reactive_advice_epidemics$"
 ra_epidemics_4_desc:0 "Este painel inclui informações sobre a [infection_rate|E] de cada [barony|E] impactado pela Praga. A [infection_rate|E] progredirá em direção ao seu valor máximo em diferentes taxas dependendo da intensidade da Praga, e pode ser mitigada com $game_concept_epidemic_resistance$.\n\n#weak Como você gerencia e lida com $reactive_advice_epidemics$ não apenas governará como seu [realm|E] se recupera e subsequentemente prospera, mas também quanto [legitimacy|E] você perderá como governante.#!"
 ra_epidemics_panel_prompt:0 "Abrir o painel de [epidemics|E]"
 ra_favorite_child_1:0 "$reactive_advice_favorite_child$"
 ra_favorite_child_1_desc:0 "Agora você pode escolher quem é seu [favorite_child|E]. Isso significa que eles terão uma [opinion|E] mais alta em relação a você e, quando você morrer, poderá escolher continuar seu legado através deles, em vez do seu herdeiro.\n\nSeu filho favorito pode ser:\n$BULLET_WITH_TAB$Filhos\n$BULLET_WITH_TAB$Netos\n$BULLET_WITH_TAB$Bisnetos\nDesde que eles estejam em sua [dynasty|E]."
 ra_favorite_child_1_prompt:0 "Abra a visão do seu Personagem (destacado)"
 ra_favorite_child_2:0 "$reactive_advice_favorite_child$"
 ra_favorite_child_2_desc:0 "Na visão do personagem, encontre a criança que você deseja designar como sua favorita.\n\nClique com o botão direito na criança para interagir e procure a opção Escolher Filho Favorito. Ou clique nas crianças a partir dos seus filhos.\n\nLembre-se de que escolher um $game_concept_favorite_child$ também significa que os outros filhos podem ter uma opinião mais baixa sobre você."
 ra_favorite_child_2_prompt:0 "Clique com o botão direito em uma de suas crianças para ver as Interações disponíveis (destacado)"
 ra_favorite_child_3:0 "$reactive_advice_favorite_child$"
 ra_favorite_child_3_desc:0 "Após selecionar um filho favorito, haverá um ícone em seu retrato. E mesmo que eles não sejam seu herdeiro, será possível continuar como eles após sua morte.\n\nSe você quiser mudar seu filho favorito, volte à visão do personagem e selecione outro."
 ra_gp_1:0 "Grandes Projetos"
 ra_gp_1_desc:0 "Você pode iniciar ou contribuir para um [great_project|e]! Vamos dedicar um momento para falar sobre eles."
 ra_gp_1_prompt:0 "Abra a aba Projetos no painel de Decisões (destacada)"
 ra_gp_2:0 "$ra_gp_1$"
 ra_gp_2_desc:0 "[great_projects|e] são empreendimentos de grande escala que podem ser concluídos com a ajuda de vários [characters|e].\n\nEles são usados para construir [great_buildings|e] e se recuperar de [natural_disasters|e], entre outras coisas.\n\nVamos dar uma olhada em um $game_concept_great_project$."
 ra_gp_2_prompt:0 "Abra um Grande Projeto (destacado)"
 ra_gp_3:0 "$ra_gp_1$"
 ra_gp_3_desc:0 "[great_projects|e] têm uma localização e um Custo que deve ser pago antes que possam ser iniciados.\n\nUma vez iniciado, o Fundador e seus [subjects|e] poderão fornecer [great_project_contributions|e] para ajudar a concluí-lo, o que significa que o Fundador geralmente não precisará pagar por todas as contribuições do $game_concept_great_project$ sozinho.\n\n$game_concept_great_projects$ normalmente exigem muito tempo e esforço para serem concluídos."
 ra_great_steppe_1:0 "$reactive_advice_great_steppe$"
 ra_great_steppe_1_desc:0 "Bem-vindo à [the_great_steppe|E]!\n\nJogando como um [ruler|E] [GetGovernment( 'nomad_government' ).GetName], garantir que seu [herd|E] cresça é sua principal preocupação. O rebanho cresce ao ter terras férteis para pastar, por isso você precisará se mover em busca de vastos campos de pastagem para que você e seu rebanho prosperem.\n\nOs Nômades governam na Região da Estepe, onde você fará parte de uma [situation|E]. A Estepe é dividida em três regiões, onde o foco está na [county_fertility|E] da terra."
 ra_great_steppe_1_prompt:0 "Clique no botão Situações para continuar (destacado)"
 ra_great_steppe_1b:0 "$ra_great_steppe_1$"
 ra_great_steppe_2:0 "$reactive_advice_great_steppe$"
 ra_great_steppe_2_desc:0 "Cada uma das três regiões será afetada por uma [steppe_season|E]. Essas estações não são o inverno ou verão comuns, mas um efeito de longo prazo sobre a [county_fertility|E] da terra.\n\nComo e onde esses efeitos irão te afetar é visível através dos efeitos das estações. Por exemplo, viver em uma região com pastagem abundante terá impacto na fertilidade para o seu [herd|E] pastar, mas também afetará a opinião das pessoas que o seguem."
 ra_great_steppe_3:0 "$reactive_advice_great_steppe$"
 ra_great_steppe_3_desc:0 "Para ser capaz de planejar, você pode contar com a ajuda do seu [GetCourtPositionType('court_astrologer_court_position').GetName()]. O Astrólogo preditor preverá a chance de duas estações serem as próximas em uma Região.\n\nCom essa informação, você pode decidir se é melhor ficar em um local ou tentar [migrate|E] para uma região vizinha.\n\nQuanto mais tempo você puder ficar em terras férteis, maior será seu [herd|E] e mais felizes serão seus seguidores."
 ra_great_steppe_4:0 "$reactive_advice_great_steppe$"
 ra_great_steppe_4_desc:0 "Para ter uma visão geral de como os outros [nomads|E] em [the_great_steppe|E] estão, você pode visualizar isso na parte inferior do painel. O Nômade com o maior [herd|E] detém o título de [gurkhan|E], com a força de seu rebanho sendo a maior Ameaça ou o maior Aliado que você pode encontrar na estepe. Se você detiver esse título, poderá também aumentar seu [dominance|E] (no painel de reinos) até o quinto e último nível, Dominância Ilimitada.\n\nA força dos rebanhos será usada durante guerras e incursões, mas na forma de [horde|E]. Horda é a parte do seu rebanho que é apta para lutar, então pense nisso como seus cavalos, camelos e pessoas que podem usar arco e flecha, enquanto o restante do rebanho é composto por ovelhas, vacas, crianças e assim por diante."
 ra_great_steppe_5:0 "$reactive_advice_great_steppe$"
 ra_great_steppe_5_desc:0 "Para visualizar outras regiões, você pode clicar nelas nesta visualização, mas a que te impacta é a que você está atualmente.\n\nAgora, você está pronto para liderar seu rebanho durante tempos abundantes e difíceis? Encontrar novas terras através de [war|E] ou [migration|E] é sempre uma opção para um forte [ruler|E] [GetGovernment( 'nomad_government' ).GetName] mostrar ao seu povo o caminho para as terras ricas, a Maçã de Ouro da estepe."
 ra_house_unity_1:0 "$reactive_advice_house_unity$"
 ra_house_unity_1_desc:0 "Como um [clan|E], você tem acesso à [house_unity|E]!\n\nA Unidade da Casa representa o estado das relações internas em sua [house|E], que variam de Antagônico a Harmonioso. Cada [house_unity_level|E] traz uma série de efeitos para todos os membros da Casa e determinará a [succession_law|E] ativa.\n\nSaber como afetar a Unidade da Casa será útil para alcançar seus objetivos."
 ra_house_unity_2:0 "$reactive_advice_house_unity$"
 ra_house_unity_2_desc:0 "Primeiro, você precisa saber como visualizar a [house_unity|E]. Para isso, abra a visualização da sua [house|E]."
 ra_house_unity_3:0 "$reactive_advice_house_unity$"
 ra_house_unity_3_desc:0 "A aba de Unidade da Casa contém todas as informações e interações necessárias para aproveitar ao máximo a Unidade da Casa. Você pode ver sua pontuação atual de Unidade da Casa, o Nível atual e ter uma visão geral dos Níveis mais altos e mais baixos de Unidade da Casa.\n\nAlém disso, aqui você pode ver as mudanças recentes na Unidade. Isso é importante, pois todos os membros da Casa podem realizar [house_unity_unifying_actions|E] ou [house_unity_devisive_actions|E] para afetar a Unidade da Casa."
 ra_house_unity_4:0 "$reactive_advice_house_unity$"
 ra_house_unity_4_desc:0 "Como mencionado anteriormente, cada [house_unity_level|E] tem seus próprios efeitos. Nesta seção, você pode ver a lista de efeitos ativos.\n\nLembre-se de que esses efeitos são para todos os membros da [house|E]. Entre os efeitos, você encontrará a [succession_law|E] ativa da sua Casa."
 ra_house_unity_5:0 "$reactive_advice_house_unity$"
 ra_house_unity_5_desc:0 "Por fim, cada Casa de Clã tem acesso a Decisões de Unidade da Casa. Essas [decisions|E] concederão diferentes benefícios para todos os membros da Casa. No entanto, em sua maioria, apenas o [house_head|E] pode promulgá-las.\n\n#weak Você pode tentar se tornar o Líder da Casa usando a interação \"Desafiar o Líder da Casa\" no seu Líder da Casa atual.#!"
 ra_house_unity_6:0 "$reactive_advice_house_unity$"
 ra_house_unity_6_desc:0 "Agora você sabe tudo o que precisa sobre a Unidade da Casa!\n\nUse esse conhecimento para garantir que sua Casa deixe uma marca duradoura na história."
 ra_house_unity_panel_prompt:0 "Abrir a visualização da [house|E]"
 ra_kurultai_1:0 "$reactive_advice_kurultai$"
 ra_kurultai_1_desc:0 "Você tem um [council|E] [kurultai|E] como governante na [the_great_steppe|E].\n\nVocê pode já estar familiarizado com ter um Conselho, mas jogando como um [nomad|E] você terá um novo tipo de administradores que se concentrarão mais em apoiar o crescimento da sua [county_fertility|E] ou [herd|E]."
 ra_kurultai_1_prompt:0 "Clique no Painel do Conselho para continuar (destacado)"
 ra_kurultai_1b:0 "$reactive_advice_kurultai$"
 ra_kurultai_2:0 "$reactive_advice_kurultai$"
 ra_kurultai_2_desc:0 "Você pode ter 4 membros do [kurultai|E] no seu [council|E], junto com seu [spouse|E] e um [spymaster|E]. O curiltai pode ter várias tarefas vinculadas a diferentes [skills|E], por exemplo, Gerenciar Fertilidade, que será uma tarefa baseada na [stewardship|E] do seu curiltai. Se você tiver um curiltai atribuído, pode clicar no botão no canto inferior esquerdo para trocar a tarefa."
 ra_kurultai_3:0 "$reactive_advice_kurultai$"
 ra_kurultai_3_desc:0 "O [kurultai|E] trabalhará nas tarefas atribuídas, mas seu maior impacto será na [succession|E] do seu [realm|E].\n\nCada personagem em [the_great_steppe|E] pode ser [obedient|E] a um [ruler|E], e a obediência é muito importante especificamente para os membros do seu curiltai e sua influência sobre quem será seu [heir|E]."
 ra_kurultai_3_prompt:0 "Clique na aba de reinos para continuar (destacado)"
 ra_kurultai_4:0 "$reactive_advice_kurultai$"
 ra_kurultai_4_desc:0 "Na parte superior deste painel, você pode ver se a sua [succession|E] é considerada estável ou caótica. Isso será um indicador de se seu [heir|E] herdará todo o seu [realm|E] ou se será dividido entre outros personagens mais poderosos."
 ra_kurultai_4_prompt:0 "Clique na aba de sucessão para continuar (destacado)"
 ra_kurultai_5:0 "$reactive_advice_kurultai$"
 ra_kurultai_5_desc:0 "Na barra destacada, você verá uma indicação de se seu [kurultai|E] e seus filhos mais velhos aprovarão a [succession|E] ou a irão opor.\n\nPara alcançar uma sucessão estável, você precisa manter seu curiltai [obedient|E] a você, mas também precisará que as [steppe_seasons|E] joguem a seu favor. Se a estação atual afetar suas terras de forma negativa, como o Zud faria, seu povo achará que você está sendo punido e questionará seu governo e a decisão sobre quem será seu sucessor.\n\nPara manter o controle da Sucessão, mantenha seu povo obediente e [migrate|E] para terras que estejam a seu favor."
 ra_laamp_contract_move_1:0 "Encontrando Contratos"
 ra_laamp_contract_move_1_desc:0 "Se o trabalho acabou na sua área local, ou você busca uma ocupação mais emocionante, mudar seu [camp|E] é a maneira mais fácil de encontrar uma variedade de novos [task_contracts|E].\n\nVocê deve [travel|E] uma distância considerável de onde seu antigo acampamento estava para garantir que encontrará novas oportunidades ao chegar."
 ra_laamp_contract_move_2:0 "Mudando seu Acampamento"
 ra_laamp_contract_move_2_desc:0 "Aqui está um exemplo de um destino a uma distância justa do seu atual local de [camp|E].\n\nVocê pode planejar a [travel|E] diretamente da visão do [county|E], para qualquer [barony|E] selecionado no Condado.\n\n#weak Nota: Você também pode iniciar a Viagem do Acampamento a partir da janela do Acampamento, usando o botão Mover Domicílio na parte inferior.#!"
 ra_laamp_contract_move_3:0 "Viajar com seu Acampamento"
 ra_laamp_contract_move_3_desc:0 "[traveling|E] com seu [camp|E] funciona exatamente como uma Viagem normal, mas você traz todos os [camp_buildings|E] e [followers|E] com você, e deve gastar [provisions|E]."
 ra_laamp_contract_move_4:0 "$ra_laamp_contract_move_3$"
 ra_laamp_contract_move_4_desc:0 "$ra_laamp_contract_move_3_desc$"
 ra_laamp_contract_move_5:0 "Novos Contratos"
 ra_laamp_contract_move_5_desc:0 "Agora que você chegou, múltiplos novos [task_contracts|E] estarão disponíveis para você na região!\n\nLembre-se, você pode mover seu [camp|E] a qualquer momento para encontrar novos [task_contracts|E], e novas oportunidades surgirão desde que você [travel|E] longe o suficiente — pelo menos duas [duchies|E] [de_jure|E] de distância do seu antigo acampamento é uma boa regra geral."
 ra_landless_adventurer_1:0 "Aventureiro Sem Terra"
 ra_landless_adventurer_1_desc:0 "@ra_landless_adventurer_2! \nVocê é um [adventurer|e]! Viaje pelo mundo, visite as [courts|e] de [rulers|e] para encontrar trabalho e complete [task_contracts|e] para recompensas valiosas. Você pode melhorar seu [camp|e], recrutar [followers|e] e construir uma vasta [contact_list|e]."
 ra_landless_adventurer_2:0 "Seu Acampamento"
 ra_landless_adventurer_2_desc:0 "Como um [adventurer|e], você não está preso a nenhuma terra específica, tendo a liberdade de viajar pelo mundo. Sua base de operações como um $game_concept_adventurer$ é seu [camp|e], que você pode atualizar e expandir com [camp_buildings|e] ao longo de sua carreira de aventuras."
 ra_landless_adventurer_3:0 "Seus Seguidores"
 ra_landless_adventurer_3_desc:0 "Durante suas viagens, você pode reunir [followers|e], que servem a um propósito semelhante ao dos [courtiers|e] dos [rulers|e] com terras. Ao [traveling|e] como um [adventurer|e], você terá a oportunidade de utilizar a [travel_option|e] de [GetTravelOption('adventurers_scout_for_talent_option').GetName].\n\nAlém disso, você também pode adquirir novos $game_concept_followers$ ao tomar a [decision|e] de Visitar a Propriedade. Em seu $game_concept_camp$, você pode visualizar seus $game_concept_followers$ através do botão no canto superior esquerdo do painel."
 ra_landless_adventurer_4:0 "Contratos"
 ra_landless_adventurer_4_desc:0 "Como um [adventurer|e], sua principal fonte de renda será [task_contracts|e]. Você pode vê-los representados como pergaminhos no mapa. Os $game_concept_task_contracts$ podem ser encontrados por todo o mundo e requerem que você complete uma tarefa específica para um empregador.\n\nSeu [prestige_level|E] determina o [task_contract_tier|e] dos $game_concept_task_contracts$ que você recebe. Obter o Nível de Fama [GetPrestigeLevelName('(int32)2')] ou superior desbloqueia a compra ou conquista de [land|E], caso você deseje fazer a transição para um [ruler|E] [landed|E]. Níveis mais altos desbloqueiam opções mais poderosas.\n\nVocê pode acessar novos $game_concept_task_contracts$ movendo seu [camp|e], uma ação que custará uma quantidade de [provisions_i][provisions|e] com base na distância percorrida."
 ra_landless_adventurer_5:0 "Propósito do Acampamento"
 ra_landless_adventurer_5_desc:0 "Você pode visualizar detalhes sobre seu [camp|e] na aba do $game_concept_realm$ (destacada). A partir daí, você pode alterar seu [camp_purpose|e] e abrir a visão geral do $game_concept_camp$.\n\nO propósito do seu $game_concept_camp$ determinará o tipo de [task_contracts|e] que você poderá encontrar, pode desbloquear certas [decisions|e] e [camp_buildings|e], bem como uma variedade de outros benefícios."
 ra_landless_adventurer_6:0 "No Caminho para o Poder"
 ra_landless_adventurer_6_desc:0 "@ra_landless_adventurer!\nAceite [task_contracts|e], mova seu [camp|e] para explorar diferentes partes do mundo e cresça seu [following|e].\n\nComo um [adventurer|e], você tem a liberdade de escolher o futuro caminho de sua [dynasty|e]. Você vai ficar na estrada, tentar ganhar um [title|e] em uma terra distante ou se envolver nos assuntos de [rulers|e] pelo mundo?"
 ra_legends_1:0 "$action_reactive_advice_legends$"
 ra_legends_1_desc:0 "[legends|E] são contos de feitos famosos que um [character|E] realizou durante sua vida. Cada Lenda tem seu próprio [legend_type|E]: Legitimadora, Heroica ou Sagrada.\n\nA visualização de [legends|E] pode ser encontrada no canto inferior esquerdo."
 ra_legends_2:0 "$action_reactive_advice_legends$"
 ra_legends_2_desc:0 "Cada [legend|E] disponível para você é visível aqui, assim como todas as suas informações.\n\nNo topo estão [legend_seeds|E], a base de uma Lenda. Elas podem ser conquistadas ou, em alguns casos, podem ser já de sua propriedade devido ao seu personagem cumprir certos critérios. Abaixo delas estão as $action_reactive_advice_legends$ do Mundo, que rastreiam outras $action_reactive_advice_legends$ no mundo não promovidas ativamente por você.\n\n#weak 'Promotores' são os personagens que apoiam ativamente uma determinada Lenda.#!"
 ra_legends_3:0 "$action_reactive_advice_legends$"
 ra_legends_3_desc:0 "As informações incluídas no painel $action_reactive_advice_legends$ incluem custo base, manutenção, efeitos ativos e Qualidade da Lenda.\n\nDestacado está o botão usado para selecionar uma Lenda da sua lista."
 ra_legends_4:0 "$action_reactive_advice_legends$"
 ra_legends_4_desc:0 "Este painel inclui informações sobre a Lenda que você está prestes a criar, bem como lhe dá uma seleção de [characters|E]. Esses personagens são as escolhas potenciais para os [legend_protagonists|E].\n\n#weak Iniciar uma Lenda acionará o Cronograma da Lenda, a partir do qual você pode aumentar a [legend_quality|E] ou completar a Lenda.#!"
 ra_legends_panel_prompt:0 "Abrir o painel de [legends|E]"
 ra_legends_view_panel_prompt:0 "Abrir o painel de Criação de Lendas"
 ra_legitimacy_1:0 "$reactive_advice_legitimacy$"
 ra_legitimacy_1_desc:0 "[legitimacy|E] é a representação do seu 'direito de governar'. Seus [vassals|E] geram [legitimacy_expectations|E], e espera-se que você as atenda.\n\nUm $game_concept_legitimacy$ mais alto lhe oferece uma série de benefícios, e uma $game_concept_legitimacy$ baixa afetará adversamente a facilidade com que você governa.\n\n#weak $game_concept_legitimacy$ possui 5 [legitimacy_levels|E] e um nível inferior 'Ilegítimo', com uma certa fração da [legitimacy|E] do governante anterior sendo herdada pelo seu [heir|E]. Você ganha $game_concept_legitimacy$ por meio de diversos meios, incluindo vencer guerras, criar [legends|E] ou participar de [activities|E]. Da mesma forma, ela pode ser perdida ao perder guerras e títulos, ou por [epidemics|E] descontroladas devastando a terra.#!"
 ra_legitimacy_2:0 "$reactive_advice_legitimacy$"
 ra_legitimacy_2_desc:0 "A visualização de [legitimacy|E] pode ser encontrada no canto inferior esquerdo. Ela contém informações sobre o seu [legitimacy_level|E], suas [legitimacy_expectations|E], quanto [legitimacy|E] você possui atualmente e também os efeitos atuais de todos os itens acima.\n\n#weak Desvantagens e benefícios de ter uma determinada pontuação de [legitimacy|E] incluem penalidades e vantagens de opinião, malus e bônus de [dynasty_prestige|E], custos aumentados e diminuídos do [casus_belli|E], e limiares variáveis para adesão a [alliances|E] e [faction|E].#!"
 ra_maa_stationing_click_station_button:0 "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_click_station_button_desc:0 "Você pode posicionar um [regiment|E] de [men_at_arms|E] por [holding|E] em seu [domain|E]\n\nTodos os Domínios são válidos para todos os tipos de Regimentos, mas alguns oferecem maiores bônus do que outros.\n\nVamos selecionar um Domínio para posicionar este Regimento."
 ra_maa_stationing_click_station_button_tt:0 "Clique no botão 'Alterar Domínio Posicionado' (destacado)"
 ra_maa_stationing_finished:0 "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_finished_desc:0 "O [regiment|E] de [men_at_arms|E] agora está [stationed|E], você pode ver o quanto ele melhorou abaixo de seu retrato (parte destacada).\n\nLembre-se de verificar de vez em quando para garantir que seus Regimentos estejam posicionados nas [holdings|E] ideais.\n\nIsso é especialmente importante se você conquistar ou herdar novos territórios, ou se decidir especializar um Domínio com [buildings|E] como [GetBuilding('smiths_01').GetName] ou [GetBuilding('stables_01').GetName]."
 ra_maa_stationing_open_card_step:0 "Posicionando os Homens de Armas"
 ra_maa_stationing_open_card_step_desc:0 "Você possui [men_at_arms|E] que ainda não foram [stationed|E].\n\nAo posicionar seus [regiments|E], você os torna mais poderosos e melhores em combate, o que pode ser vital para vencer as [battles|E].\n\nVamos posicionar um Regimento agora!"
 ra_maa_stationing_open_card_step_tt:0 "Clique em um dos seus Homens de Armas marcado com o texto '#X $MAA_UNSTATIONED$#!' (destacado)"
 ra_maa_stationing_select_station:0 "$ra_maa_stationing_open_card_step$"
 ra_maa_stationing_select_station_desc:0 "Diferentes [holdings|E] oferecem quantidades diferentes de bônus, dependendo de quais [buildings|E] você escolhe construir.\n\nNesta visualização, você pode ver exatamente o quanto seu [regiment|E] de [men_at_arms|E] se tornaria melhor se estivesse posicionado em um Domínio.\n\nClique em um Domínio #P Verde#! no mapa que você acha que oferece o melhor bônus para o seu Regimento."
 ra_maa_stationing_select_station_tt:0 "Clique em qualquer Domínio #P Verde#! no mapa"
 ra_merit_candidacy_child_exams:0 "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_child_exams_desc:0 "Se houver membros da [house|E] que ainda são [children|E], você também pode ajudar na carreira deles enviando-os para o @child_exam_icon!#V Exame Infantil#!.\n\nSe forem bem-sucedidos, isso acelera seu progresso para futuros $game_concept_examinations$."
 ra_merit_candidacy_exams:0 "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_exams_desc:0 "Cada [imperial_examination|E] concluída aumenta [merit|E] e desbloqueia [merit_levels|E] mais altos.\n\nOutros membros do $game_concept_house$ irão se juntar a você se você participar de um $game_concept_examinations$ e tentar concluí-lo.\n\nPortanto, retornar a um $game_concept_examination$ que você já completou traz benefícios além de você mesmo."
 ra_merit_candidacy_house_members:0 "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_house_members_desc:0 "Esta lista mostra como cada membro da sua [house|E] está se saindo na burocracia.\n\nComo você pessoalmente só pode ser [governor|E] de uma [province|E], auxiliar sua família estendida em sua carreira também é importante."
 ra_merit_candidacy_intro:0 "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_intro_desc:0 "Apenas aqueles com o maior [merit_level|E] se tornarão [governors|E].\n\nSempre que um $game_concept_governor$ deixa seu cargo, outra pessoa é automaticamente nomeada para ocupar seu lugar.\n\nPortanto, simplesmente tendo um bom $game_concept_merit_level$, você será eventualmente nomeado [governor|E], desde que a [law|e] do seu [realm|e] permita."
 ra_merit_candidacy_merit:0 "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_merit_desc:0 "Cada [character|E] possui um [merit_level|E]. Quanto melhor o $game_concept_merit_level$, maiores [title_tier|E] [provinces|E] eles podem governar como [governor|E].\n\nÀ medida que seu $game_concept_merit_level$ aumenta, nomeações mais influentes se tornam disponíveis:\n$BULLET_WITH_TAB$#V 9º a 8º#!: $game_concept_governor$ de um $county_celestial_chinese_vassal$ #weak (um título de [county|E])#!\n$BULLET_WITH_TAB$#V 7º a 6º#!: $game_concept_governor$ de um $duchy_celestial_chinese_vassal$ #weak (um título de [duchy|E])#!\n$BULLET_WITH_TAB$#V 5º a 4º#!: $game_concept_governor$ de um $kingdom_celestial_chinese_vassal$ #weak (um título de [kingdom|E])#!\n$BULLET_WITH_TAB$#V 3º a 1º#!: [minister|E] para o [son_of_heaven|E] #weak (um título de [empire|E])#!\n\n$game_concept_characters$ sem um $game_concept_merit_level$ não podem se tornar $game_concept_governor$."
 ra_merit_candidacy_open:0 "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_open_desc:0 "Vamos ver como você e sua [house|E] estão progredindo na burocracia!"
 ra_merit_candidacy_open_prompt:0 "Abra o Painel '$ADMINISTRATIVE_GOVERNMENT_HEADER$' (destacado)"
 ra_merit_candidacy_score:0 "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_score_desc:0 "Embora [merit_level|E] seja importante, se dois candidatos tiverem o mesmo [merit_level|E], aquele com a maior @appointment_score![candidate_score|E] receberá uma [province|E] primeiro.\n\nPortanto, aumentar sua $game_concept_candidate_score$ significa que você não terá que esperar tanto para se tornar um [governor|E].\n\nPara aumentar o $game_concept_candidate_score$ de um membro da [house|E], você gasta [influence_i][influence|E] usando [scheme|E] $influence_meritorious_career_interaction|V$, ou um $promote|V$ #weak (ambos destacados).#!"
 ra_merit_candidacy_summary:0 "$reactive_advice_merit_candidacy$"
 ra_merit_candidacy_summary_desc:0 "Garantindo que você tenha níveis cada vez melhores de [merit_level|E], participando de [imperial_examinations|E] e governando bem sua [province|E], você avançará até o topo da burocracia.\n\nNo topo da hierarquia, você pode até ser nomeado como [minister|E], servindo diretamente ao [son_of_heaven|E]!"
 ra_merit_governor_activities_open:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_activities_open_desc:0 "Como [governor|E], outra maneira de usar sua [treasury|E] é realizar a [activity|E] $activity_survey|V$."
 ra_merit_governor_activities_open_prompt:0 "Abra o Painel 'Atividades'"
 ra_merit_governor_advancing:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_advancing_desc:0 "Cada [governor|E] governa uma [province|E] de determinado [title_tier|E].\n\nDo menor para o maior, estes são:\n$EFFECT_LIST_BULLET$$county_celestial_chinese_vassal$ #fraco (um título de [county|E])#!\n$EFFECT_LIST_BULLET$$duchy_celestial_chinese_vassal$ #fraco (um título de [duchy|E])#!\n$EFFECT_LIST_BULLET$$kingdom_celestial_chinese_vassal$ #fraco (um título de [kingdom|E])#!\n\nPara avançar na hierarquia e alcançar um $game_concept_title_tier$ superior, você deve aumentar seu [merit_level|E] ganhando [merit|E], e eventualmente se aposentar para completar os [imperial_examinations|E]."
 ra_merit_governor_advancing_retire:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_advancing_retire_desc:0 "Não importa quanto [merit|E] você ganhe, para desbloquear níveis superiores de [merit_levels|E] você também deve completar os [imperial_examinations|E].\n\nNo entanto, [governors|E] não podem se inscrever nos [imperial_examinations|E].\n\nPortanto, uma vez que você atingir seu máximo atual de [merit_level|E], se aposentar e participar dos $game_concept_examinations$ é a única forma de progredir para um [province|E] de [title_tier|E] superior.\n\n#I Você pode se aposentar de ser um $game_concept_governor$ usando a decisão $renounce_governorship_decision|V$ no Painel '$DECISIONS_VIEW_TITLE$'."
 ra_merit_governor_domain_tab_open:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_domain_tab_open_desc:0 "As [holdings|E] que você governa estão listados na aba 'Domínio'."
 ra_merit_governor_domain_tab_open_prompt:0 "Abra a Aba 'Domínio'"
 ra_merit_governor_finish:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_finish_desc:0 "Isso é tudo que há para dizer sobre ser um [governor|E], por enquanto. Mais conselhos podem aparecer ao longo do tempo à medida que você encontrar situações mais específicas.\n\nConstruir [buildings|E] nos [holdings|E] da [province|E] e realizar a $activity_survey|V$ [activity|E] é um bom começo, pois lhe renderá [merit|E]."
 ra_merit_governor_holding_view:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_holding_view_desc:0 "Aqui estão os espaços onde [buildings|E] podem ser construídos no [holding|E] selecionado.\n\nComo esses $game_concept_buildings$ pertencem à [province|E], você paga por sua construção usando [treasury|E], não seu [gold|E] pessoal.\n\nConstruir $game_concept_buildings$ como [governor|E] concederá [merit|E], permitindo eventualmente governar [provinces|E] de [title_tier|E] mais altas.\n\n#I Sinta-se à vontade para iniciar uma construção antes de prosseguirmos.#!"
 ra_merit_governor_holdings_list:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_holdings_list_desc:0 "Aqui você pode ver cada [holding|E] que você governa, também conhecido como seu [domain|E].\n\nCada [holding|E] é um assentamento central onde [taxes|E] são coletados e tropas de [levy|E] são reunidas."
 ra_merit_governor_holdings_list_prompt:0 "Selecione um de seus $game_concept_holdings$"
 ra_merit_governor_inspection:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_inspection_desc:0 "A [activity|E] $activity_survey|V$ deduzirá da [treasury|E] de sua [province|E], mas também melhorará a $game_concept_province$ e lhe dará uma chance de ganhar [merit|E]."
 ra_merit_governor_intro:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_intro_desc:0 "Você é um [governor|E]!\n\nComo um servidor civil valorizado, você tem acesso aos recursos do governo, mas deve usá-los sabiamente."
 ra_merit_governor_realm_open:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_realm_open_desc:0 "Então, com acesso a [treasury|E], seria bom colocá-lo em uso.\n\nComo [governor|E], você governa a terra e o povo em sua [province|E]. Usar o $game_concept_treasury$ para investir nela seria uma boa ideia."
 ra_merit_governor_realm_open_prompt:0 "Abra o Painel 'Reino'"
 ra_merit_governor_treasury_1:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_treasury_1_desc:0 "$ra_treasury_1_desc$"
 ra_merit_governor_treasury_2:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_treasury_2_desc:0 "$ra_treasury_2_desc$"
 ra_merit_governor_treasury_3:0 "$reactive_advice_meritocratic_governor$"
 ra_merit_governor_treasury_3_desc:0 "$ra_treasury_3_desc$"
 ra_migration_1:0 "$reactive_advice_migration$"
 ra_migration_1_desc:0 "Ao jogar como um [nomad|E] em [the_great_steppe|E], você tem a possibilidade de [migrate|E].\nA Migração é importante para os Nômades, pois é uma ótima maneira de encontrar novas terras para o seu [herd|E] pastar e crescer.\n\nO rebanho representa seu povo e seu rebanho, e seu rebanho precisa de terras com boa [county_fertility|E] para se alimentar.\nVamos dar uma olhada em como encontrar os melhores lugares na estepes onde a fertilidade beneficiará você e seu [realm|E]."
 ra_migration_1_prompt:0 "Clique no botão de Migração (destacado)"
 ra_migration_1b:0 "$ra_migration_1$"
 ra_migration_2:0 "$reactive_advice_migration$"
 ra_migration_2_desc:0 "Escolher um novo local para você e seu [herd|E] deve ser baseado principalmente na [county_fertility|E]. A fertilidade da terra é medida em uma escala de 0 a 100 e diminuirá gradualmente à medida que você habitar as terras. Quando for totalmente esgotada, você precisará [migrate|E] para um novo local para continuar crescendo."
 ra_migration_2_prompt:0 "Clique no modo de mapa para visualizar o modo de mapa de fertilidade (destacado)"
 ra_migration_3:0 "$reactive_advice_migration$"
 ra_migration_3_desc:0 "A distância que você pode [migrate|E] depende dos seus [title_tiers|E] e da lei de [dominance|E] que você atualmente impõe. Reinos com um grande Domínio e alta Dominância terão necessidades diferentes em relação à Migração, e em algum momento você pode não precisar migrar mais para o propósito de fazer seu [herd|E] crescer. Para selecionar um local ao qual você potencialmente deseja migrar, clique em um título [de_jure|E] no mapa."
 ra_migration_3_prompt:0 "Clique em qualquer local dentro do alcance no mapa"
 ra_migration_4:0 "$reactive_advice_migration$"
 ra_migration_4_desc:0 "Dependendo da sua localização escolhida, você verá pinos no mapa informando a [county_fertility|E] específica, ou a soma da [domain_fertility|E] de todo o título [de_jure|E] selecionado."
 ra_migration_5:0 "$reactive_advice_migration$"
 ra_migration_5_desc:0 "A localização escolhida para sua [migration|E] sempre terá pelo menos um [nomad|E] ou [herder|E] com quem você terá que negociar para obter permissão para migrar para a área deles. Você pode oferecer [herd|E], [gold|E] ou usar um [hook|E] para ajudá-lo a convencê-los a aceitar sua proposta de migração para sua área."
 ra_migration_6:0 "$reactive_advice_migration$ (Aceitar Negociação)"
 ra_migration_6_desc:0 "Pode haver vários [nomads|E] no mesmo local da sua área alvo. Se você [migrate|E] de forma Hostil, todos reagirão, mas se conseguir persuadir o Personagem mais forte na área para aceitar sua migração, será bem-vindo por todos. \n\n Se a negociação de Migração for aceita, você deixará seu título atual para trás e possivelmente seus [subjects|E] também."
 ra_migration_7:0 "$reactive_advice_migration$ (Negociação Recusada)"
 ra_migration_7_desc:0 "Se o [nomad|E] com o maior [herd|E] na área não aceitar sua proposta, você terá que declarar [war|E] contra ele e todos os outros nômades que habitam o local escolhido. Você pode ver a força total do rebanho exibida na janela nesses casos.\n\nAssim como se a negociação fosse aceita, uma proposta recusada resultará em você deixar seu [title|E] atual para trás e possivelmente seus [subjects|E] também. Você também será considerado [unlanded|E], o que significa que você não tem [county_fertility|E] e, portanto, seu rebanho não crescerá.\n\nSerá de interesse extremo ganhar a guerra ou, depois disso, encontrar outro local para você e seu rebanho migrarem."
 ra_migration_8:0 "$reactive_advice_migration$"
 ra_migration_8_desc:0 "Se tudo correr bem com a [migration|E], você terá novas terras para pastar, novas possibilidades de lidar com um [settlement_issue|E] que oferece a oportunidade de resolver conflitos e aumentar o [county_control|E] local no novo [domain|E].\n\nAs terras mudam de mãos frequentemente em [the_great_steppe|E], então, certifique-se de equilibrar seu [dread|E] com [opinion|E] para manter todas as portas abertas. Perder um título para um [nomad|E] significa que o triplo estará ao alcance, desde que continue fazendo seu [herd|E] e [dominance|E] crescer."
 ra_natural_disasters_1:0 "$reactive_advice_natural_disasters$"
 ra_natural_disasters_1_desc:0 "Oh não! Um [natural_disaster|e] atingiu seu [realm|e].\n\nVamos ver o que você pode fazer a respeito."
 ra_natural_disasters_1_prompt:0 "Abra a situação de Desastre Natural"
 ra_natural_disasters_2:0 "$reactive_advice_natural_disasters$"
 ra_natural_disasters_2_desc:0 "Um [natural_disaster|e] possui três [situation_phases|e].\n\n#high Aviso#!: um $game_concept_natural_disaster$ está prestes a acontecer.\n#high Impacto#!: o desastre está em efeito.\n#high Recuperação#!: você pode começar a reconstruir.\n\nComo [ruler|e], seus [subjects|e] esperam que você lide com as consequências de um $game_concept_natural_disaster$."
 ra_open_admin_gov_open_estate_prompt:0 "Veja sua Propriedade"
 ra_open_admin_gov_panel_prompt:0 "Abra a aba '$TUTORIAL_PROVINCES_NO_TOOLTIP$' no Painel de Governo Administrativo (destacado)"
 ra_open_admin_gov_powerful_families_intro:0 "Abra a aba das Famílias Nobres (destacada)"
 ra_open_admin_gov_theme_detail_prompt:0 "Inspecione um $TUTORIAL_PROVINCE_NO_TOOLTIP$"
 ra_plague_resistance_1:0 "$reactive_advice_plague_resistance$"
 ra_plague_resistance_1_desc:0 "Ao lidar com Pragas, você tem algumas opções para restringir seu progresso por suas terras.\n\nO principal fator que governa isso é a [epidemic_resistance|E]. Quanto maior for a Resistência à Praga de seus [baronies|E] e [counties|E], melhor você poderá conter uma Praga.\n\n#weak Embora você possa combater Pragas, é importante lembrar que é improvável que você consiga detê-las completamente. Esteja preparado para que Pragas maiores se espalhem apesar de seus melhores esforços.#!"
 ra_plague_resistance_2:0 "$reactive_advice_plague_resistance$"
 ra_plague_resistance_2_desc:0 "A $reactive_advice_plague_resistance$ pode ser aumentada de várias maneiras. Construções como $building_type_hospices_01$ e $building_type_charnel_grounds_01$ dão bônus inatos à $reactive_advice_plague_resistance$ para o [county|E] ou [barony|E] em que são construídos.\n\n Outras opções menos permanentes incluem [court_position_tasks|E] realizadas pelo $court_physician_court_position$, [decisions|E] ou eventos."
 ra_plague_resistance_3:0 "$reactive_advice_plague_resistance$"
 ra_plague_resistance_3_desc:0 "À medida que a $reactive_advice_plague_resistance$ aumenta, a [infection_rate|E] dos [baronies|E] relevantes diminui.\n\nEmbora seja improvável que você consiga erradicar completamente uma Praga grande apenas tomando medidas como essas, reduzir a [infection_rate|E] ajudará a reduzir a devastação geral em seu [realm|E]."
 ra_regency_future_regent_conclusion:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_conclusion_desc:0 "Por enquanto, considere designar um [regent|E], se você deseja ter mais controle sobre quem governará em seu lugar."
 ra_regency_future_regent_current_regent:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_current_regent_desc:0 "O seu futuro [regent|E] é mostrado aqui.\n\nA menos que você designe um, o candidato com a maior [regent_succession_score|E] será escolhido."
 ra_regency_future_regent_intro:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_intro_desc:0 "No futuro, você pode se tornar incapaz de governar seu [realm|E] pessoalmente, nesse caso, uma [regency|E] será iniciada.\n\nAntes que isso aconteça, você pode ver o seu futuro [regent|E] e até mesmo designar um você mesmo!\n\n$REACTIVE_ADVICE_YOU_REGENCY_REASONS$"
 ra_regency_future_regent_open_UI:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_open_UI_desc:0 "O seu status de [regency|E] é mostrado aqui, no topo da Visão do Reino."
 ra_regency_future_regent_open_UI_prompt:0 "Abra a Visão da Regência (destacado)"
 ra_regency_future_regent_open_realm_panel:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_open_realm_panel_desc:0 "Vamos visualizar a sua futura [regency|E]! Você pode vê-la na Visão do Reino."
 ra_regency_future_regent_open_realm_panel_prompt:0 "Abra a Visão do Reino (destacado)"
 ra_regency_future_regent_open_tab:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_open_tab_desc:0 "O seu futuro [regent|E] é mostrado na guia '$DIARCHY_WINDOW_YOUR_TAB$'."
 ra_regency_future_regent_open_tab_prompt:0 "$ra_regency_liege_open_tab_prompt$"
 ra_regency_future_regent_succession:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_succession_desc:0 "Se o seu [regent|E] atual morrer ou não puder agir como um [regent|E], o próximo Personagem na ordem de Sucessão assumirá o seu lugar."
 ra_regency_future_regent_swap_regent:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
 ra_regency_future_regent_swap_regent_desc:0 "Você pode designar um [regent|E] usando esse botão.\n\nVocê deve tentar encontrar um Regente que tenha uma alta [diarch_loyalty|E] e uma alta [Concept( 'diarch_aptitude', 'Aptidão' )|E]."
 ra_regency_liege_conclusion:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_conclusion_desc:0 "As regências são em sua maioria uma questão reativa. Por enquanto, fique de olho nas [scales_of_power|E].\n\nQuando o [regent|E] usar um de seus [diarch_powers|E], você será informado e poderá decidir o que fazer a respeito."
 ra_regency_liege_effects:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_effects_desc:0 "Em uma [regency|E], você ainda pode realizar qualquer ação que normalmente faria.\n\nNo entanto, o [regent|E] possui [diarch_powers|E] especiais que podem ser usados em você ou em seus [vassals|E]. Você sempre tem o direito de [veto|E] sobre esses $game_concept_diarch_powers$."
 ra_regency_liege_ending:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_ending_desc:0 "Se as condições que iniciaram a [regency|E] não forem mais válidas, você pode tentar encerrá-la.\n\nO [regent|E] precisa aceitar isso, mas você pode oferecer coisas como [gold|E] ou um [favor|E] para aumentar a probabilidade de aceitação. \n\nSe eles recusarem, eles podem declarar [war|E] contra você!"
 ra_regency_liege_intro:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_intro_desc:0 "Agora você tem um [regent|E].\n\n$REACTIVE_ADVICE_YOU_REGENCY_REASONS$"
 ra_regency_liege_mandate:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_mandate_desc:0 "Você pode atribuir um [mandate|E] ao seu [regent|E], direcionando seus esforços para essa área específica.\n\nVocê sempre pode alterar esse Mandato posteriormente, dependendo das suas prioridades."
 ra_regency_liege_open_UI:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_open_UI_desc:0 "Vamos dar uma olhada na sua [regency|E] agora!"
 ra_regency_liege_open_UI_prompt:0 "$REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT$"
 ra_regency_liege_open_tab:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_open_tab_desc:0 "Seu [regent|E] é mostrado na guia '$DIARCHY_WINDOW_YOUR_TAB$'."
 ra_regency_liege_open_tab_prompt:0 "Abra a guia '$DIARCHY_WINDOW_YOUR_TAB$' (destacado)"
 ra_regency_liege_scales_of_power:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_liege_scales_of_power_desc:0 "Estas são as [scales_of_power|E].\n\nQuanto mais as Escalas favorecerem o seu [regent|E], mais [diarch_powers|E] eles terão acesso, e será mais difícil encerrar a [regency|E].\n\nVocê pode influenciar diretamente as Escalas a seu favor com o botão '$DIARCHY_WINDOW_SWING_SCALES$'."
 ra_regency_regent_conclusion:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_conclusion_desc:0 "Como [regent|E], você pode tentar usar seus [diarch_powers|E] em seu [liege|E] ou em seus colegas [vassals|E].\n\nSe você não deseja antagonizar seu Senhor Feudal, você pode simplesmente reagir às oportunidades que surgem, e seu Senhor Feudal pode recompensá-lo por sua lealdade!"
 ra_regency_regent_ending:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_ending_desc:0 "Se as condições que iniciaram a [regency|E] não forem mais verdadeiras, seu [liege|E] poderá tentar encerrá-la.\n\nSe as [scales_of_power|E] estiverem fortemente a seu favor, você pode até resistir ao encerramento da Regência, talvez até iniciando uma [war|E] pelo [primary_title|E] deles!"
 ra_regency_regent_intro:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_intro_desc:0 "Você está atuando como [regent|E] para o seu [liege|E].\n\nUma [regency|E] pode ocorrer por muitos motivos, incluindo:\n$BULLET_WITH_TAB$Quando o seu Senhor Feudal [Concept( 'travels', 'Viaja' )|E] para fora do seu [realm|E]\n$BULLET_WITH_TAB$Quando o seu Senhor Feudal é uma [child|E]\n$BULLET_WITH_TAB$O seu Suserano se torna [GetTrait('incapable').GetName( GetPlayer )]"
 ra_regency_regent_mandate:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_mandate_desc:0 "Seu [liege|E] pode lhe dar um [mandate|E], que lhe proporcionará oportunidades para melhorar o [realm|E].\n\nSe você lidar bem com essas oportunidades, você inclinará as [scales_of_power|E] a seu favor."
 ra_regency_regent_open_UI:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_open_UI_desc:0 "Vamos dar uma olhada na sua [regency|E] agora!"
 ra_regency_regent_open_UI_prompt:0 "$REACTIVE_ADVICE_REGENCY_OPEN_VIEW_PROMPT$"
 ra_regency_regent_open_tab:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_open_tab_desc:0 "Seu status como [regent|E] é exibido na guia '$DIARCHY_WINDOW_LIEGE_TAB$'."
 ra_regency_regent_open_tab_prompt:0 "Abra a guia '$DIARCHY_WINDOW_LIEGE_TAB$' (destacado)"
 ra_regency_regent_powers:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_powers_desc:0 "Como [regent|E], você possui [diarch_powers|E] especiais que pode usar em seu [liege|E] ou em seus colegas [vassals|E]. Seu Senhor Feudal sempre tem o direito de [veto|E] sobre esses $game_concept_diarch_powers$.\n\nUsar esses Poderes em seus colegas Vassalos pode ser visto como um abuso de poder, resultando em uma penalidade de [opinion|E] de [strife|E]."
 ra_regency_regent_scales_of_power:0 "$REACTIVE_ADVICE_REGENCY_TERM$"
 ra_regency_regent_scales_of_power_desc:0 "Essas são as [scales_of_power|E].\n\nQuanto mais as Escalas favorecerem você, mais [diarch_powers|E] você terá acesso, e será mais difícil encerrar a [regency|E].\n\nVocê pode influenciar diretamente as Escalas a seu favor com o botão '$DIARCHY_WINDOW_SWING_SCALES$'."
 ra_specific_epidemics_panel_prompt:0 "Abrir o painel 'Ver Epidemias'"
 ra_tax_collector_1:0 "$reactive_advice_tax_collector$"
 ra_tax_collector_1_desc:0 "Você tem [tax_collectors|E]!\n\nEles ajudarão a coletar [gold|E] e [levies|E] de seus Vassalos do Clã. Os arrecadadores de impostos também ajudarão a gerenciar [tax_jurisdictions|E] e aplicar Decretos Fiscais.\n\n#weak A aptidão de seus arrecadadores de impostos afetará a contribuição que você receberá de seus Contribuintes.#!"
 ra_tax_collector_2:0 "$reactive_advice_tax_collector$"
 ra_tax_collector_2_desc:0 "Primeiro, você precisa saber onde encontrar suas [tax_jurisdictions|E], como nomear [tax_collectors|E] e designar Contribuintes."
 ra_tax_collector_3:0 "$reactive_advice_tax_collector$"
 ra_tax_collector_3_desc:0 "Bem-vindo à visualização de suas [tax_jurisdictions|E]!\n\nAqui você pode visualizar e gerenciar tudo sobre suas jurisdições.\n\nNo topo, você pode ver quantos [tax_collectors|E] você nomeou e o total de [gold|E] e [levies|E] que está recebendo de seus Contribuintes."
 ra_tax_collector_4:0 "$reactive_advice_tax_collector$"
 ra_tax_collector_4_desc:0 "Estas são suas [tax_jurisdictions|E], onde você pode designar seus Vassalos do Clã como Contribuintes e selecionar Decretos Fiscais para cada jurisdição. Você também precisará nomear um [tax_collector|E] para gerenciar cada uma de suas jurisdições fiscais e aplicar os Decretos Fiscais.\n\n#weak Uma jurisdição com Contribuintes, mas sem um Arrecadador de Impostos, estará isenta de impostos, o que significa que você não receberá [gold|E] ou [levies|E] dela.#!"
 ra_tax_collector_5:0 "$reactive_advice_tax_collector$"
 ra_tax_collector_5_desc:0 "Parabéns!\n\nVocê conhece todos os conceitos básicos da coleta de impostos. Lembre-se de configurar os Decretos Fiscais das [tax_jurisdictions|E] para adaptar as [vassal_obligations|E] às suas necessidades atuais.\n\nQue seu [clan|E] deixe uma marca duradoura na história."
 ra_tax_collector_panel_prompt:0 "Abrir o painel de [tax_jurisdictions|E]"
 ra_tours_picking_vassals_add:0 "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_add_desc:0 "Primeiro, você precisa selecionar quais [vassals|E] visitar.\n\nQuem visitar depende do tipo de [GetActivityType( 'activity_tour' ).GetName()]. Por exemplo, em uma [majesty_tour|E] cada [stop|E] aumenta a [opinion|E] desse vassalo, então você pode escolher vassalos com baixa opinião de você.\n\nViajar longas distâncias entre as Paradas aumenta o custo de [gold|E] para cada Parada."
 ra_tours_picking_vassals_add_prompt:0 "Adicione pelo menos um vassalo para visitar, clicando no mapa"
 ra_tours_picking_vassals_conclusion:0 "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_conclusion_desc:0 "Assim que estiver satisfeito com as [stops|E] e a ordem em que estão, você pode avançar para a próxima etapa do planejamento."
 ra_tours_picking_vassals_intro:0 "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_intro_desc:0 "Você está prestes a embarcar em uma [GetActivityType( 'activity_tour' ).GetName()] pelo seu [realm|E].\n\nDurante uma Viagem, você irá [travel|E] para visitar seus [vassals|E], investindo [gold|E] para obter recompensas como [county_control|E], [opinion|E], [cultural_acceptance|E] e muito mais!"
 ra_tours_picking_vassals_stops:0 "$REACTIVE_ADVICE_TOURS$"
 ra_tours_picking_vassals_stops_desc:0 "Em cada [stop|E] da Viagem, você pode escolher entre:\n$BULLET_WITH_TAB$[tour_the_grounds|E], aumentando o [county_control|E]\n$BULLET_WITH_TAB$Solicitar um [hosted_dinner|E], formando [hooks|E] e [relations|E]\n$BULLET_WITH_TAB$Pedir ao seu [vassal|E] para organizar um [cultural_festival|E], aumentando a [county_opinion|E] e [cultural_acceptance|E]"
 ra_travel_planning_caravan_master:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_caravan_master_desc:0 "Você pode nomear um [GetCourtPositionType('travel_leader_court_position').GetName()]; uma [court_position|E] especial que se juntará a você em todas as suas [travels|E].\n\nEles têm um grande impacto em sua [travel_speed|E] e [travel_safety|E], então você normalmente gostaria de ter alguém nessa posição em viagens mais longas."
 ra_travel_planning_conclusion:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_conclusion_desc:0 "Antes de partir, verifique o Tempo Total de Viagem e certifique-se de que há poucas chances de [travel_danger|E] em sua rota.\n\nBoa viagem!"
 ra_travel_planning_custom_route:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_custom_route_desc:0 "Por fim, você pode personalizar sua rota para evitar [travel_danger|E] no caminho, em vez de ir diretamente para o destino."
 ra_travel_planning_entourage:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_entourage_desc:0 "Você raramente [travel|E] sozinho; os [characters|E] que viajam com você são sua [entourage|E].\n\nEsses personagens também costumam se juntar a você em seu destino."
 ra_travel_planning_intro:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_intro_desc:0 "Você está prestes a [travel|E] para longe de sua localização atual. Antes de partir, você deve planejar sua viagem."
 ra_travel_planning_speed_safety:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_speed_safety_desc:0 "Existem dois fatores principais a serem considerados ao planejar sua [travel|E]: [travel_speed|E] e [travel_safety|E].\n\nA velocidade base é de 100%, e uma alta velocidade significa que você chegará ao seu destino mais rapidamente.\n\nA segurança neutraliza qualquer [travel_danger|E] que você possa encontrar no caminho. Ter uma alta segurança significa que você e sua [entourage|E] podem viajar por áreas perigosas com menos riscos envolvidos."
 ra_travel_planning_travel_options:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 ra_travel_planning_travel_options_desc:0 "Você também pode escolher até duas [travel_options|E] para esta jornada específica.\n\nAs opções de viagem geralmente custam [gold|E] e oferecem vários benefícios, principalmente para [travel_speed|E] e [travel_safety|E].\n\nMuitas opções reduzem o [travel_danger|E] para tipos específicos de [terrain|E] em sua rota. Cada tipo de perigo em uma localização é mostrado no mapa com uma cor única. Quaisquer perigos que você possa encontrar também são mostrados como ícones em sua rota."
 ra_treasury_1:0 "$reactive_advice_treasury$"
 ra_treasury_1_desc:0 "Neste [realm|E], o [top_liege|E] e cada [governor|E] possuem uma [treasury_i] [treasury|E].\n\nEnquanto [gold|E] é sua riqueza pessoal, o $game_concept_treasury$ deve ser usado apenas para fins governamentais (como melhorar sua [province|E] se você for um $game_concept_governor$).\n\nO $game_concept_treasury$ está vinculado ao seu [title|E] atual, então se sua posição dentro do [realm|E] mudar, você não terá mais acesso ao seu antigo $game_concept_treasury$."
 ra_treasury_2:0 "$ra_treasury_1$"
 ra_treasury_2_desc:0 "Você pode doar seu próprio [gold|E] para complementar a [treasury|E] caso ele esteja acabando.\n\nAviso: não há forma legal de recuperar o $game_concept_gold$ doado!\n\n#I Se desejar fazer isso, você pode usar o botão destacado#!"
 ra_treasury_3:0 "$ra_treasury_1$"
 ra_treasury_3_desc:0 "Se seu [gold|E] estiver baixo, você pode usar o [scheme|E] $celestial_siphon_treasury_interaction_without_scheme_suffix|V$ em si mesmo ou em qualquer [governor|E] no [realm|E]. Isso converte a [treasury|E] do [character|E] alvo em seu próprio $game_concept_gold$.\n\nNo entanto, você não gostaria de ser pego desviando dinheiro do estado..."
 ra_tributaries_1:0 "$reactive_advice_tributaries$"
 ra_tributaries_1_desc:0 "[tributaries|E] são um tipo de [subject|E], uma relação entre dois [rulers|e] onde um acordo de [truce|E] é estabelecido em troca de um pagamento periódico. Quando o acordo é firmado, o tributário então fornece [herd|E], [taxes|E] ou [prestige|E] ao outro, seu [suzerain|E]."
 ra_tributaries_1_prompt:0 "Clique no painel de Reinos para continuar (destacado)"
 ra_tributaries_2:0 "$reactive_advice_tributaries$"
 ra_tributaries_2_desc:0 "Em comparação ao tipo usual de [subject|E], [vassals|E], os [tributaries|E] têm um pouco mais de liberdade em relação ao seu [suzerain|E]. Eles podem se libertar se suas próprias exigências sobre um líder não forem atendidas e procurar a sorte em outro lugar."
 ra_tributaries_2_prompt:0 "Clique na guia Subjects para continuar (destacado)"
 ra_tributaries_3:0 "$reactive_advice_tributaries$"
 ra_tributaries_3_desc:0 "Todos os tipos de [subjects|E] serão exibidos no painel de reinos. Na lista de Subjects, você verá a chance dos seus [tributaries|E] de quererem se libertar e um [tributary_contract|E] especial onde você, como [suzerain|E], pode por exemplo aumentar ou diminuir seus pagamentos, ou o apoio à guerra que qualquer um de vocês terá em futuros conflitos."
 ra_tributaries_4:0 "$reactive_advice_tributaries$"
 ra_tributaries_4_desc:0 "Como [migration|E] é uma ação comum para [nomads|E], se afastar das terras de seus [tributaries|E] tem um grande impacto na disposição deles de continuar sendo seu tributo. Se não puderem testemunhar sua grandeza, logo procurarão proteção e tréguas com outros [rulers|e] mais próximos."
 ra_tributaries_5:0 "$reactive_advice_tributaries$"
 ra_tributaries_5_desc:0 "Se você mesmo tem o papel de [tributary|E], isso pode permitir que você faça sua [herd|E] crescer em paz sob a proteção de um maior [suzerain|E], mas o poder pode trocar de mãos rapidamente em [the_great_steppe|E]; certifique-se de que você e as pessoas que considera amigas se ajudem quando precisarem crescer, mas não tenha medo de se libertar e se juntar ao lado de um Cã maior quando a situação exigir."
 ra_tutorial_schemes_1:0 "$game_concept_schemes$"
 ra_tutorial_schemes_1_desc:0 "Você acabou de iniciar um [scheme|E]! Os $game_concept_schemes$ são metas de longo prazo, direcionadas a outro Personagem. Eles podem ter objetivos hostis, como tentar [GetScheme('murder').GetTypeName] ou [GetScheme('abduct').GetTypeName] seu alvo, ou serem mais benevolentes, como o $game_concept_scheme$ de [GetScheme('befriend').GetTypeName]."
 ra_tutorial_schemes_2:0 "$game_concept_schemes$"
 ra_tutorial_schemes_2_desc:0 "Você acabou de iniciar um [scheme|E]! Os $game_concept_schemes$ são metas de longo prazo, direcionadas a outro Personagem. Eles podem ter objetivos hostis, como tentar [GetScheme('murder').GetTypeName] ou [GetScheme('abduct').GetTypeName] seu alvo, ou serem mais benevolentes, como o $game_concept_scheme$ de [GetScheme('befriend').GetTypeName]."
 ra_tutorial_schemes_3:0 "$game_concept_schemes$"
 ra_tutorial_schemes_3_desc:0 "Aqui você verá todos os seus esquemas ativos. Você pode ter um [personal_scheme|e] e um [hostile_scheme|e] ativo ao mesmo tempo.\n\n#TUT Use os esquemas sempre que quiser, mas tenha em mente que seu personagem será melhor ou pior em certos esquemas dependendo de seus [traits|e] e [skills|e]. Certos [perks|e] de [lifestyles|e] podem desbloquear esquemas adicionais para seu personagem.#!"
 ra_women_in_china:0 "Mulheres na China"
 ra_women_in_china_desc:0 "Para poder se tornar um [governor|e] como mulher na China, você precisa alterar as Leis de Gênero da [hegemony|e]. Para isso, você deve primeiro se tornar o [hegemon|e].\n\nSe esta é uma experiência que lhe interessa, recomendamos alterar as Regras de Leis de Gênero durante a Configuração, ou criar seu próprio Personagem Personalizado para ser $game_concept_hegemon$ na Tela de Favoritos."
 reactive_advice_admin_gov:0 "Governo Administrativo"
 reactive_advice_admin_gov_troops:0 "Militar Administrativo"
 reactive_advice_agent_scheme_rework:0 "$ra_agent_scheme_rework_1$"
 reactive_advice_army_automation:0 "$ARMY_AUTOMATION_FEATURE_NAME$"
 reactive_advice_artifact_inventory:0 "$ra_artifact_inventory_general$"
 reactive_advice_bankruptcy:0 "$reactive_advice_bankruptcy_step_1$"
 reactive_advice_bankruptcy_desc:0 "Você está sem [gold_i][gold|E] - isso é muito ruim, você deve reduzir suas despesas e tentar encher seu tesouro o mais rápido possível!\n\n#TUT Estar em [debt|E] impede que você faça muitas coisas, como declarar [wars|E] ou reforçar [men_at_arms|E], e causará [county_corruption|E]. Não deixe sua Dívida sair do controle!\n\nA coisa mais óbvia a fazer é encerrar qualquer [wars|E] que você possa estar travando - pois quando você está em paz, não precisa pagar a manutenção de seus [armies|E]. Se você estiver perdendo muito Ouro, talvez queira considerar a dissolução de alguns Homens de Armas.\n\nSe sua [faith|E] permitir, você pode usar a #TUT_KW $hof_ask_for_gold_interaction$#! [interaction|E] no seu [head_of_faith|E], ou a Decisão #TUT_KW $borrow_from_holy_order_decision$#!.\n\nTambém pode ser uma boa ideia mudar para o [focus|E] $stewardship_wealth_focus_short$, se você ainda não o tiver.#!"
 reactive_advice_bankruptcy_step_1:0 "Dívida"
 reactive_advice_bastards:0 "$reactive_advice_bastards_step_1$"
 reactive_advice_bastards_desc:0 "Ops! Parece que você tem um filho [bastard|E]! Isso pode ser uma ameaça ou uma oportunidade...\n\n#TUT Ter filhos bastardos nem sempre é ruim; eles podem ser casados para garantir [alliances|E], enquanto não representam uma ameaça direta para a sua [succession|E], pois não são considerados [Concept('legitimate', 'Legítimos')|E].\n\nPode até ser uma boa ideia manter alguns filhos bastardos por perto, para que eles possam ser [Concept('legitimized', 'Legitimados')|E] caso você tenha poucos filhos não bastardos. No entanto, lembre-se de ficar de olho na [opinion|E] que seu [spouse|E] tem de você...\n\nSe você deseja ter filhos bastardos, recomendamos que você use o [scheme|E] de [GetScheme('seduce').GetTypeName] em personagens solteiros. Se você seduzir uma mulher casada, o marido dela pode pensar que a criança é dele - se isso acontecer, você não poderá legitimar a criança.#!"
 reactive_advice_bastards_step_1:0 "Bastardos"
 reactive_advice_bishop_endorsement:0 "$reactive_advice_bishop_endorsement_step_1$"
 reactive_advice_bishop_endorsement_desc:0 "A [faith|E] do seu personagem faz com que você tenha um [realm_priest|E] em seu [council|E].\n\nEsses bispos têm um poder imenso e estão mais do que dispostos a compartilhá-lo com você - desde que você fique do lado deles...\n\n#TUT Seu bispo fornece [taxes|E] e [levies|E] de todas as [temple_holdings|E] em seu [realm|E], e quanto eles lhe dão depende da [opinion|E] deles sobre você.\n\nSer impopular significa que você não receberá nada, e o bispo até pode dificultar sua vida! Eles podem, por exemplo, forçá-lo a se divorciar do seu [spouse|E]...\n\nVocê deve fazer o seu melhor para melhorar a opinião deles sobre você. Usar a #TUT_KW $gift_interaction$#! [interaction|E] ou iniciar um [scheme|E] de [GetScheme('sway').GetTypeName] são duas boas opções a considerar.\n\nSe tudo mais falhar, [GetScheme('murder').GetTypeName] é sempre uma opção... Talvez o sucessor deles seja mais amigável?#!"
 reactive_advice_bishop_endorsement_step_1:0 "Endosso do Bispo"
 reactive_advice_clerical_regions:0 "Conselho: $game_concept_clerical_regions$"
 reactive_advice_clerical_regions_1:0 "$game_concept_clerical_regions$"
 reactive_advice_clerical_regions_2:0 "$game_concept_clerical_regions$"
 reactive_advice_clerical_regions_2_desc:0 "Bom trabalho! Agora você está visualizando todas as [faiths|e] e [rites|e] no mundo. A partir daqui, você pode alternar para visualizar [clerical_regions|e] clicando no botão destacado."
 reactive_advice_clerical_regions_3:0 "$game_concept_clerical_regions$"
 reactive_advice_clerical_regions_3_desc:0 "A partir daqui, você pode ver todas as [clerical_regions|e] presentes no mundo. Estas são divisões administrativas dentro de sua [faith|e]. Para a $game_concept_faiths$ cristã, essas regiões são chamadas de [archdioceses|e].\n\nSe você quiser alternar entre as camadas administrativas, pode usar #V E#! para ver os Domínios no mapa, e #V SHIFT+R#! para ver $game_concept_clerical_regions$."
 reactive_advice_clerical_regions_4:0 "$game_concept_clerical_regions$"
 reactive_advice_clerical_regions_4_desc:0 "Uma [clerical_region|e] é uma área geográfica mantida por um membro do [clergy|e]. Na [faiths|e] cristã, essas regiões são chamadas de [archdioceses|e] e seus [holders|e] são chamados de [archbishops|e]. $game_concept_archbishops$ têm acesso a um [domicile|e], que é herdado junto com o [title|e] de $game_concept_clerical_region$.\n\nComo um [secular_ruler|e], você deve ficar de olho no $game_concept_archbishop$ que preside a $game_concept_clerical_region$ onde sua [capital|e] está localizada.\n\nUm $game_concept_archbishop$ pode, por exemplo, aumentar sua [legitimacy|e] por meio da #! de #TUT_KW $request_legitimacy_interaction$[interaction|e], tornar [titles|e] vizinhos [de_jure|e] por meio da $ecclesiastical_de_jure_shifting_interaction$ de #TUT_KW #!, ou impor um [white_peace|e] entre você e outro [ruler|e] cristão."
 reactive_advice_clerical_regions_5:0 "$game_concept_clerical_regions$"
 reactive_advice_clerical_regions_5_desc:0 "O [rite|e] de um [holder|e] de [clerical_region|e] se espalhará gradualmente para os condados dentro da região.\n\nSe quiser evitar que suas terras sejam convertidas, pode ser prudente tentar encontrar um [archbishop|e] que compartilhe sua $game_concept_rite$. Como [secular_ruler|e], você pode conseguir isso ordenando a um [puppet|e] que peça um [clerical_title|e] ao seu [head_of_faith|e]."
 reactive_advice_clerical_regions_6:0 "$game_concept_clerical_regions$"
 reactive_advice_clerical_regions_6_desc:0 "Personagens só podem manter uma [clerical_region|e] de cada vez.\n\nSe um [holder|e] de uma $game_concept_clerical_region$ tiver terras e receber outra região fora de seu [realm|e], ele perderá suas terras.\n\nO [head_of_faith|e] está isento disso, pois ele sempre manterá a $game_concept_clerical_region$ da capital, não importa onde mais ele possua terras."
 reactive_advice_clerical_regions_desc:0 "Você tem terras dentro de uma [clerical_region|e]. Você está sob a jurisdição da $game_concept_clerical_region$ que contém sua [capital|e]. Antes de nos aprofundarmos, vamos dar uma olhada no mapa."
 reactive_advice_clerical_regions_faiths_map_mode_prompt:0 "Mude para o modo de mapa de Fé clicando no botão no canto inferior direito (destacado)"
 reactive_advice_clerical_regions_map_mode_prompt:0 "Mude para o modo de mapa de Regiões Clericais (destacado)"
 reactive_advice_clerical_regions_select_region_prompt:0 "Clique em uma $game_concept_clerical_region$ no mapa"
 reactive_advice_county_control:0 "$reactive_advice_county_control_step_1$"
 reactive_advice_county_control_desc:0 "Um de seus [counties|E] está com [control|E] baixo, o que significa que você receberá menos [taxes|E] e [levies|E] dele. No entanto, há maneiras de aumentar o Controle novamente!\n\n#TUT Há vários lugares onde você pode ver o Controle: na aba Domínio na Visão do Reino, na aba Dicas e na Visão do Condado.\n\nPara aumentar o controle, vá até a aba do Conselho e atribua ao seu [marshal|E] a tarefa [increase_control|E]. O Controle também aumenta com o tempo, mas esse processo é muito lento — recomendamos que você use um Marechal com alta habilidade.\n\nSe você deixar um Condado com baixo Controle por muito tempo, ele pode adquirir [county_corruption|E]. Para evitar isso, recomendamos que você não conquiste muitas terras de uma só vez.#!"
 reactive_advice_county_control_step_1:0 "Controle de condado"
 reactive_advice_court_positions:0 "$ra_court_pos_open_view$"
 reactive_advice_create_accolade:0 "$REACTIVE_ADVICE_CREATE_ACCOLADE$"
 reactive_advice_domain_limit:0 "$reactive_advice_domain_limit_step_1$"
 reactive_advice_domain_limit_desc:0 "Você está atualmente mantendo mais terras em seu [domain|E] do que seu personagem é capaz de gerenciar por conta própria - é hora de criar novos [vassals|E]!\n\nComo você deseja manter títulos valiosos em seu domínio, recomendamos que você vá até a guia Domínio em sua visualização Reino, onde poderá ver quanto cada título vale para você. Considere também quais títulos estão em seu [de_jure|E].\n\n#TUT Ficar sobre o [domain_limit|E] por muito tempo deve ser evitado, pois isso terá consequências.\n\nTo fique abaixo do limite, você deseja conceder excesso [titles|E] para novos vassalos. Embora você possa conceder títulos a seus vassalos existentes, muitas vezes é uma ideia melhor encontrar alguém sem terra para doar.\n\nDistante [dynasty|E] membros ou [courtiers|E] com o [trait|E] [GetTrait('content').GetName( GetPlayer )] fazer excelentes vassalos. [claimants|E] aos seus títulos, ou [GetTrait('ambitious').GetName( GetPlayer )] Cortesãos menos.#!"
 reactive_advice_domain_limit_step_1:0 "Limite de Domínio"
 reactive_advice_dynamic_culture:0 "Cultura"
 reactive_advice_dynastic_cycle:0 "$game_concept_dynastic_cycle$"
 reactive_advice_ecclesiastical_ruler:0 "Conselho: Governo [ecclesiastical|e]"
 reactive_advice_ecclesiastical_ruler_1:0 "Governo $game_concept_ecclesiastical$"
 reactive_advice_ecclesiastical_ruler_2:0 "Cardeais"
 reactive_advice_ecclesiastical_ruler_2_desc:0 "Para começar, se sua [faith|e] carece de um [head_of_faith|e] #weak (como o Calcedonianismo em 867)#!, o Papa é simplesmente um nome especial para o [head_of_rite|e] do Rito Romano. Para ser elegível #weak (ou papabile, se preferir)#! para o Papado, você deve se tornar um [cardinal|e]. Estes são [titles|e] especiais que o Papa concederá aos membros do [clergy|e].\n\nNesta janela, você pode ver os três $game_concept_cardinals$ com maior probabilidade de se tornarem o novo Papa, bem como a forma como todos os $game_concept_cardinals$ estão votando. Você pode usar a Interação de $request_clerical_elector_title_interaction$ #V #! no Papa para se tornar um $game_concept_cardinal$."
 reactive_advice_ecclesiastical_ruler_3:0 "Tornando-se um Chefe Religioso"
 reactive_advice_ecclesiastical_ruler_3_desc:0 "Se você preferir evitar o Rito Romano em favor do seu próprio, você pode tornar seu próprio [rite|e] ramificado o novo Rito Principal. Há algumas maneiras de fazer isso, dependendo se sua [faith|e] tem ou não um [head_of_faith|e].\n\nQuando não há $game_concept_head_of_faith$, seu $game_concept_rite$ deve ter mais [counties|e] o seguindo, e deve controlar tantas ou mais [holy_sites|e] quanto o Rito Principal atual para superá-lo.\n\nSe #EMP houver#! um $game_concept_head_of_faith$, seu $game_concept_rite$ poderá se tornar o principal se você for eleito Papa. Falhando nisso, você poderia se promover ou promover outra pessoa como [antipope|e].\n\nAlternativamente, se você for [heretical|e] o suficiente, você pode simplesmente ramificar e se tornar o Chefe de sua própria e novíssima $game_concept_faith$."
 reactive_advice_ecclesiastical_ruler_archdiocese_succession:0 "Tornando-se um $game_concept_archbishop$"
 reactive_advice_ecclesiastical_ruler_archdiocese_succession_desc:0 "Ao jogar como um personagem [ecclesiastical|e], e especialmente se você ainda não for um [archbishop|e], convém ficar de olho na [succession|e] do [title|e].\n\nPara adquirir um $game_concept_archdiocese$, você pode usar a Interação de $influence_clerical_candidacy_interaction$ #V #! em si mesmo. Isso aumenta sua [candidate_score|e] para o [title|e].\n\nA $game_concept_candidate_score$ clerical também pode ser aumentada por vários outros meios, como uma alta [learning|e] de [skill|e], ou por ter traços [virtuous|e]."
 reactive_advice_ecclesiastical_ruler_archdiocese_view:0 "$game_concept_archdioceses$"
 reactive_advice_ecclesiastical_ruler_archdiocese_view_desc:0 "Este é o [rite|e] da [archdiocese|e]. É determinado pelo $game_concept_rite$ do [title|e] [holder|e]. Você também pode ver o [treasury|e] anexado ao $game_concept_title$.\n\nAbaixo dele, você também pode ver o [independent_rulers|e] com capitais dentro dele."
 reactive_advice_ecclesiastical_ruler_cathedral_complex:0 "$game_concept_cathedral_complexes$"
 reactive_advice_ecclesiastical_ruler_cathedral_complex_desc:0 "Aqui você pode ver o [cathedral_complex|e] do [holder|e]. Este é um tipo especial de [domicile|e] que pode ser aprimorado por meio de um [great_project|e]. Como ele está anexado ao [title|e], será herdado junto com ele."
 reactive_advice_ecclesiastical_ruler_desc:0 "Como um personagem [ecclesiastical|e], você faz parte do [clergy|e] de sua [faith|e].\n\nAo jogar com este tipo de governo, seu [heir|e] é a primeira pessoa na linha de sucessão para herdar seu [primary_title|e], independentemente da [dynasty|e] deles."
 reactive_advice_ecclesiastical_ruler_map_mode:0 "$game_concept_clerical_regions$ no Mapa"
 reactive_advice_ecclesiastical_ruler_map_mode_desc:0 "Sua [faith|e] divide suas terras em [clerical_regions|e] chamadas de [archdioceses|e], cada uma mantida por um membro do [clergy|e].\n\nComo um [ecclesiastical|e] [ruler|e], você só pode manter uma $game_concept_archdiocese$ de cada vez.\n\nVamos dar uma olhada nelas!"
 reactive_advice_ecclesiastical_ruler_map_mode_prompt:0 "Abra o modo de mapa de $game_concept_clerical_regions$ (destacado)"
 reactive_advice_ecclesiastical_ruler_open_archdiocese:0 "Inspecionar uma $game_concept_archdiocese$"
 reactive_advice_ecclesiastical_ruler_open_archdiocese_desc:0 "Estas são todas as [clerical_regions|e] dentro de sua [faith|e]. Manter uma [archdiocese|e] dá acesso a um [cathedral_complex|e], um tipo especial de [domicile|e].\n\nSe você ainda não for um [archbishop|e], tornar-se um seria um bom primeiro objetivo. De qualquer forma, vamos dar uma olhada na visualização de $game_concept_clerical_region$."
 reactive_advice_ecclesiastical_ruler_open_archdiocese_prompt:0 "Selecione uma $game_concept_clerical_region$ no mapa"
 reactive_advice_ecclesiastical_ruler_open_cardinals:0 "Tornando-se o Papa"
 reactive_advice_ecclesiastical_ruler_open_cardinals_college_tt:0 "Abra o $game_concept_college_of_cardinals$ (destacado)"
 reactive_advice_ecclesiastical_ruler_open_cardinals_desc:0 "Tudo bem, mas e se você quiser se tornar o Papa? Para descobrir isso, devemos dar uma olhada no [college_of_cardinals|e]."
 reactive_advice_education:0 "$reactive_advice_education_step_1$"
 reactive_advice_education_desc:0 "Parece que seu [player_heir|E] não tem um [guardian|E]! Sem uma [education|E] adequada, eles terão [skills|E] pobres e [traits|E] aleatórios.\n\n#TUT Use a #TUT_KW $educate_child_interaction$#! [interaction|E] em seu Herdeiro e encontre um personagem adequado para ser o [guardian|E].\n\nVocê deseja encontrar um personagem que seja conhecedor na área em que você deseja que o [ward|E] se destaque. Recomendamos que você procure um tutor com um [education_trait|E] de alto nível (por exemplo, [GetTrait('education_martial_4').GetName( GetPlayer )]) ou um Traço como [GetTrait('intellect_good_1').GetName( GetPlayer )] ou [GetTrait('intellect_good_3').GetName( GetPlayer )]. Se você não está disposto a correr o risco de permitir que outra pessoa molde a personalidade de seu filho, você pode educar seu Herdeiro você mesmo!\n\nGeralmente, você deseja que todos os seus filhos tenham uma boa educação. No entanto, se você tiver filhos pelos quais não se importa muito (como o quarto ou quinto filho), você sempre pode atribuí-los aos seus [vassals|E] para obter um aumento de [opinion|E]. A maneira mais fácil de encontrar um possível tutor é usar a #TUT_KW $offer_ward_interaction$#! diretamente em um Vassalo.#!"
 reactive_advice_education_step_1:0 "Educação"
 reactive_advice_encyclopedia:0 "$reactive_advice_encyclopedia_step_1$"
 reactive_advice_encyclopedia_desc:0 "Crusader Kings III tem muitos conceitos e termos que você pode aprender. Se você está se perguntando sobre um conceito de jogo, você pode abrir a Enciclopédia.\n\nSiga a IU destacada para ver como fazer isso.\n\n#TUT A categoria 'Aulas do tutorial' da Enciclopédia lista muitas seções do tutorial, caso você precise refrescar a memória. #!"
 reactive_advice_encyclopedia_step_1:0 "Enciclopédia"
 reactive_advice_epidemics:0 "Epidemias"
 reactive_advice_fabricate_claim:0 "$reactive_advice_fabricate_claim_step_1$"
 reactive_advice_fabricate_claim_desc:0 "Você não pode declarar uma guerra sem um [casus_belli|E]. A fonte mais comum de Causas Belli são [claims|E], mas às vezes é difícil conseguir a Reivindicação que você deseja.\n\nÉ aí que entram as [fabricated_claims_short|E]!\n\n#TUT Você pode designar o seu [court_chaplain|E] para fabricar uma Reivindicação em qualquer [county|E] próximo, o que pode ser feito na visão do [council|E]. Você só pode fabricar uma Reivindicação de cada vez, e cada uma levará tempo para ser concluída.\n\nEssa ferramenta é especialmente útil quando você está jogando com um [ruler|E] pequeno, já que as Causas Belli se tornam mais fáceis de obter quanto maior é o seu [realm|E].\n\nRecomendamos que você fabrique Reivindicações em seus vizinhos imediatos - idealmente aqueles que são mais fracos do que você! Se você está jogando como um Conde, foque em Reivindicar títulos dentro do mesmo [duchy|E] [de_jure|E] que sua [realm_capital|E].#!"
 reactive_advice_fabricate_claim_step_1:0 "Fabricação de reivindicações"
 reactive_advice_favorite_child:0 "Filho Favorito"
 reactive_advice_great_projects:0 "$action_reactive_advice_great_projects$"
 reactive_advice_great_steppe:0 "A Grande Estepe"
 reactive_advice_house_unity:0 "Unidade da Casa"
 reactive_advice_imprisoned:0 "$reactive_advice_imprisoned_step_1$"
 reactive_advice_imprisoned_desc:0 "Seu personagem foi capturado e agora está à mercê de outra pessoa. Não há muito que você possa fazer sobre isso.\n\nVá até o personagem que o mantém [prisoner|E] e use a [interaction|E] #TUT_KW 'Resgatar-se'#! - se você tiver sorte, poderá pagar sua liberdade! Se tiver azar, eles podem optar por [execute|E].\n\n#TUT Se você está em [war|E] com quem o prendeu, eles podem impor uma [victory|E]. Não há nada que você possa fazer sobre isso, exceto ser mais cuidadoso no futuro!\n\nSe você foi capturado enquanto [commanding|E] um [army|E], é possível que isso tenha acontecido porque você tinha pouca [prowess_i][prowess|E]. Às vezes, é uma boa ideia mitigar esse risco evitando liderar exércitos pessoalmente.\n\nSe você foi capturado em um [siege|E], então foi porque um inimigo [Concept('occupied', 'Ocupou')|E] sua [realm_capital|E]. Você sempre deve tentar fazer com que os inimigos se mantenham afastados da sua capital!#!"
 reactive_advice_imprisoned_step_1:0 "Você foi preso!"
 reactive_advice_kurultai:0 "Conselho Curiltai"
 reactive_advice_laamp_contract_move:0 "$ra_laamp_contract_move_1$"
 reactive_advice_landless_adventurer:0 "Aventureiro Sem Terra"
 reactive_advice_legends:0 "Legendas"
 reactive_advice_legitimacy:0 "Legitimidade"
 reactive_advice_lesson_army_movement:0 "$lesson_army_movement$"
 reactive_advice_lesson_army_purpose:0 "Batalhas e Cerco"
 reactive_advice_lesson_battle_mechanics:0 "$lesson_battle_mechanics$"
 reactive_advice_lesson_losing_wars:0 "$lesson_losing_wars$"
 reactive_advice_lesson_siege_mechanics:0 "$lesson_siege_mechanics$"
 reactive_advice_lesson_warscore:0 "$lesson_warscore$"
 reactive_advice_lesson_winning_wars:0 "$lesson_winning_wars$"
 reactive_advice_looming_game_over:0 "$reactive_advice_looming_game_over_step_1$"
 reactive_advice_looming_game_over_desc:0 "Ops! Parece que você não tem um [player_heir|E]. Se você morrer agora, será [game_over|E] - vamos tentar evitar isso!\n\n#TUT Se você estiver nessa situação, provavelmente significa que você é o último de sua dinastia. A partir daqui, há apenas uma ação válida - produzir um herdeiro [legitimate|E]!\n\nSe você estiver em uma sociedade que permite que apenas um gênero herde, pode tentar mudar sua [gender_law|E] para ser menos restritiva. Se tiver algum [bastard|E], agora é a hora de legitimá-los!\n\nAlém disso, certifique-se de estar [married|E] com um personagem com alta [fertility|E] (como regra geral, mulheres com mais de 45 anos raramente são férteis). Se isso ainda não parecer funcionar, [Concept('divorce', 'Divorcie')|E] ou tente [GetScheme('murder').GetTypeName] seu [spouse|E] e se casar novamente com outra pessoa - ou tente usar o [scheme|E] de [GetScheme('seduce').GetTypeName] para produzir um bastardo.\n\nO tempo é essencial, não assuma nenhum risco desnecessário!#!"
 reactive_advice_looming_game_over_step_1:0 "Evitando Game Over"
 reactive_advice_megaduke_penalty:0 "$reactive_advice_megaduke_penalty_step_1$"
 reactive_advice_megaduke_penalty_desc:0 "Seu [duchy|E] está desmoronando sob a pressão de ter terras demais. Você deveria [create|E] ou [usurp|E] um [kingdom|E]!\n\n#TUT Talvez você já possa criar um Reino? Se sim, abra a visualização das Dicas e veja se há um que você possa criar. Se não, há uma [decision|E] para fundar seu próprio Reino - porém, cuidado, os títulos que você funda geralmente são mais fracos do que os [de_jure|E] existentes.\n\nSe você é um [vassal|E] e seu [liege|E] é um Rei, você deve exigir independência antes de se tornar um Rei. O primeiro passo é se juntar ou iniciar uma [independence_faction|E].#!"
 reactive_advice_megaduke_penalty_step_1:0 "Ducado muito grande!"
 reactive_advice_mercenaries:0 "$reactive_advice_mercenaries_step_1$"
 reactive_advice_mercenaries_desc:0 "Se você está perdendo uma guerra, você pode inclinar a balança a seu favor contratando [mercenaries|E].\n\nCusto de mercenários [gold|E], mas irá fornecer a você um [army|E] significativo. Uma vez empregado, você será capaz de controlá-los como faria com qualquer outro exército.\n\n#TUT Você pode querer contratar uma unidade de mercenários para sua guerra atual. Enquanto você pode entrar em [debt|E] contratá-los, recomendamos que você encontre um acessível, a menos que você esteja perdendo a guerra gravemente.#!"
 reactive_advice_mercenaries_step_1:0 "Mercenários"
 reactive_advice_mercenaries_task:0 "Navegue até o $HIRE_TROOPS$ veja e selecione qualquer banda mercenária"
 reactive_advice_merit_candidacy:0 "Candidatos a Governador"
 reactive_advice_meritocratic_governor:0 "Governador"
 reactive_advice_migration:0 "Migração"
 reactive_advice_natural_disasters:0 "Desastres Naturais"
 reactive_advice_perk_bonus_cap:0 "$action_perk_bonus_cap_modes$"
 reactive_advice_perk_bonus_cap_desc:0 "$action_perk_bonus_cap_modes_desc$ Enquanto estiver acima do limite, o bônus não aumentará mais e não diminuirá até que você esteja abaixo do limite."
 reactive_advice_perk_bonus_cap_step_1:0 "$action_perk_bonus_cap_modes$"
 reactive_advice_personal_beliefs:0 "Conselho: Crenças Pessoais"
 reactive_advice_personal_beliefs_1:0 "Crenças Pessoais"
 reactive_advice_personal_beliefs_2:0 "Seus $game_concept_personal_tenets$"
 reactive_advice_personal_beliefs_2_desc:0 "Estes são seus [personal_tenets|e]. Todos os [core_tenets|e] têm um $game_concept_personal_tenet$ correspondente com seus próprios efeitos exclusivos disponíveis para aqueles que o adotam.\n\nVocê só pode adotar um número limitado de $game_concept_personal_tenets$. Trocar um Princípio ou rejeitá-lo totalmente geralmente resultará em uma perda de [spiritual_fulfillment|e].\n\nO número de espaços que você possui é limitado e cresce com seu [piety_level|e]. Certos [traits|e] e [dynasty_perks|e] também podem aumentar seu número de espaços de $game_concept_personal_tenets$."
 reactive_advice_personal_beliefs_3:0 "$game_concept_spiritual_fulfillment$"
 reactive_advice_personal_beliefs_3_desc:0 "Este é o seu [spiritual_fulfillment|e]. Ao atingir um novo [spiritual_fulfillment_level|e], os efeitos desse nível ficam disponíveis para você.\n\nPor exemplo, no nível mais baixo de Realização, você para de ganhar estresse com #V [GetScheme('murder').GetTypeName]#! [schemes|e], enquanto no nível mais alto você desbloqueia a habilidade de #V [GetScheme('befriend').GetTypeName]#! o seu [head_of_faith|e].\n\nFora de adotar [personal_tenets|e], você também pode perder e ganhar $game_concept_spiritual_fulfillment$ agindo de maneiras que sua [faith|e] considera [sinful|e] ou [virtuous|e]. Isso acontece principalmente em eventos."
 reactive_advice_personal_beliefs_4:0 "Aprendendo $game_concept_core_tenets$ e $game_concept_doctrines$"
 reactive_advice_personal_beliefs_4_desc:0 "A seção à direita desta janela é dedicada a todos os [core_tenets|e] e [doctrines|e] que você conhece. Sempre que você souber de um $game_concept_core_tenet$ ou $game_concept_doctrine$ de outro Personagem, ele aparecerá aqui.\n\nNo início, você conhecerá todos os $game_concept_core_tenets$ e $game_concept_doctrines$ que sua [faith|e] conhece. Através de [travel|e], [activities|e] e eventos, você poderá aprender sobre outros.\n\nAssim que você souber de um $game_concept_core_tenet$ ou $game_concept_doctrine$, poderá torná-lo uma crença central da sua própria [rite|e], caso decida criar uma. Naturalmente, $game_concept_core_tenets$ e $game_concept_doctrines$ conhecidos por você, mas não pela sua $game_concept_faith$, geralmente serão considerados [rite_divergent|e]..."
 reactive_advice_personal_beliefs_desc:0 "[spiritual_fulfillment|e] é um número entre #N -100#! e #P 100#!, e mede o quão em paz você está com sua [faith|e]. Um $game_concept_spiritual_fulfillment$ alto concederá a você uma variedade de benefícios, principalmente relacionados à sua $game_concept_faith$.\n\nPor outro lado, ter um $game_concept_spiritual_fulfillment$ baixo aumentará seu ganho de [stress|e], mas também traz certos benefícios..."
 reactive_advice_personal_beliefs_open_window_prompt:0 "Abra a janela de $PERSONAL_BELIEFS_VIEW_TITLE$ (destacada)"
 reactive_advice_plague_resistance:0 "Resistência a Pragas"
 reactive_advice_protect_against_factions:0 "$reactive_advice_protect_against_factions_step_1$"
 reactive_advice_protect_against_factions_2_desc:0 "Condados com baixa [county_opinion|E] tendem a se juntar ao [peasant_faction|E]. Ao contrário de outras facções, esta facção se levantará, não importa se eles têm uma chance de vencer ou não!\n\nAs vezes, basta colocar os camponeses em seus lugares ...\n\n#TUT Você deve sempre ficar de olho nas Facções Camponesas. Se eles atacarem enquanto você está em guerra, eles podem causar danos significativos ao seu [control|E].#!"
 reactive_advice_protect_against_factions_desc:0 "Uma [faction|E] se formou contra você, mas não entre em pânico - ainda há tempo para acertar as coisas!\n\n[vassals|E] e [counties|E] entram em facções quando estão insatisfeitos com o seu governo. Para combater isso, você pode aumentar a [opinion|E] deles sobre você ou tentar se tornar [dreaded|E].\n\n#TUT Para evitar facções, recomendamos que você aumente a [opinion|E] de seus vassalos sobre você, diminua o ritmo de suas conquistas e tente [GetScheme('murder').GetTypeName] qualquer [claimants|E] mais popular que você.\n\nVocê frequentemente terá tempo para acalmar seus Vassalos antes que a Facção pressione suas demandas - use este tempo sabiamente.#!"
 reactive_advice_protect_against_factions_step_1:0 "Proteção contra facções"
 reactive_advice_protect_against_factions_step_2:0 "$reactive_advice_protect_against_factions_step_1$"
 reactive_advice_protecting_against_hostile_schemes:0 "$reactive_advice_protecting_against_hostile_schemes_step_1$"
 reactive_advice_protecting_against_hostile_schemes_2_desc:0 "Ter um Espião Mestre com uma opinião muito baixa sobre você pode ser uma sentença de morte, pois não há como você descobrir [secret_schemes|E]!\n\n#TUT Considere tudo isso se você estiver planejando jogar como um [tyrant|E], como se você pudesse suprimir seus assuntos via [dread|E] eles ainda podem tramar contra você.\n\nFinalmente, cuidado com [claimants|E] [GetTrait('sadistic').GetName( GetPlayer )] ou [GetTrait('ambitious').GetName( GetPlayer )] ao seu trono ...#!"
 reactive_advice_protecting_against_hostile_schemes_desc:0 "Cuidado onde pisa! Como governante, há muitos que gostariam [scheme|E] para te ver morto ...\n\nTente se certificar de que seus assuntos tenham uma alta [opinion|E] de você - mas o mais importante, #emphasis always#! mantenha seu [spymaster|E] fiel.\n\n#TUT Você pode não saber que eles existem, mas [hostile_schemes|E] pode ter como alvo você a qualquer momento. Para evitar esquemas, recomendamos que você mantenha seu [vassals|E] e [courtiers|E] feliz.#!"
 reactive_advice_protecting_against_hostile_schemes_step_1:0 "Proteção contra esquemas"
 reactive_advice_protecting_against_hostile_schemes_step_2:0 "$reactive_advice_protecting_against_hostile_schemes_step_1$"
 reactive_advice_puppets:0 "Conselho: $game_concept_puppets$"
 reactive_advice_puppets_1:0 "$game_concept_puppets$"
 reactive_advice_puppets_2:0 "$game_concept_puppets$"
 reactive_advice_puppets_2_desc:0 "Nesta janela, você pode ver os vários [puppet_types|e] aos quais tem acesso. Uma vez que um personagem ocupa um espaço de $game_concept_puppet_type$, ele é considerado seu [puppet|e].\n\nNem todos os $game_concept_characters$ são adequados para todos os $game_concept_puppet_types$. Por exemplo, o [clerical_puppet|e] $game_concept_puppet_type$ só pode ser ocupado pelo seu [realm_priest|e]."
 reactive_advice_puppets_3:0 "Agindo Através de $game_concept_puppets$"
 reactive_advice_puppets_3_desc:0 "Assim que um [character|e] ocupa um espaço de $game_concept_puppet_type$, ele é seu [puppet|e] e você pode agir através dele.\n\nPor meio de um $game_concept_puppet$, você pode realizar [interactions|e], tomar [decisions|e] e iniciar [great_projects|e] que não conseguiria de outra forma.\n\nComo exemplo, se você é um [secular_ruler|e] e deseja criar sua própria [rite|e], você pode fazê-lo através do seu [clerical_puppet|e]."
 reactive_advice_puppets_4:0 "Ações de $game_concept_puppet$"
 reactive_advice_puppets_4_desc:0 "Há um conjunto de ações comuns compartilhadas por todos os [puppets|e], mas cada [puppet_type|e] também tem acesso ao seu próprio conjunto de ações únicas. Por exemplo, todos os $game_concept_puppets$ podem ser ordenados a realizar a interação [send_gift|e], mas apenas um [clerical_puppet|e] pode ser ordenado a [excommunicate|e] alguém.\n\nSe uma ação tiver um custo, seu $game_concept_puppet$ usará seus próprios Recursos para realizá-la. No nosso exemplo de #high Enviar Presente #!, o $game_concept_puppet$ gastará seu próprio [gold|e], e o destinatário da [interaction|e] terá sua opinião sobre o $game_concept_puppet$ aumentada.\n\nPara agir como seu $game_concept_puppet$, abra o Menu de $game_concept_interaction$ clicando com o botão direito em um personagem. Se você tiver um $game_concept_puppet$, poderá acessar suas $game_concept_interactions$ clicando no botão correspondente ao seu $game_concept_puppet_type$."
 reactive_advice_puppets_5:0 "$game_concept_puppets$"
 reactive_advice_puppets_5_desc:0 "[puppets|e] são versáteis. Como [secular_ruler|e], você pode usá-los para moldar sua [faith|e] ao seu gosto. Como membro de [clergy|e], por que não fantoches de um [ruler|e] para controlar seu [realm|e] das sombras?\n\nBoa sorte e bom fantochismo!"
 reactive_advice_puppets_desc:0 "[puppets|e] podem ser vistos na janela de Intrigas. Vamos navegar até lá para dar uma olhada melhor nos diferentes [puppet_types|e] aos quais você tem acesso."
 reactive_advice_puppets_open_panel_prompt:0 "Abra a janela de Intrigas e selecione a aba $game_concept_puppets$"
 reactive_advice_regency_for_liege:0 "$action_reactive_advice_regency_for_liege$"
 reactive_advice_regency_for_regent:0 "$action_reactive_advice_regency_for_regent$"
 reactive_advice_religion:0 "$lesson_basics_religion_1$"
 reactive_advice_religion_rites:0 "$lesson_basics_religion_1$"
 reactive_advice_rightful_liege:0 "$reactive_advice_rightful_liege_step_1$"
 reactive_advice_rightful_liege_2_desc:0 "Ao conquistar novas terras, você geralmente obterá novos Vassalos, dos quais não é o Senhor Feudal Legítimo. O planejamento adequado de suas conquistas pode mitigar esse problema.\n\n#TUT Para evitar ter muitos vassalos que não gostam de você, recomendamos que você tente concentrar suas conquistas em uma área De Jure de cada vez. Assim você pode #emphasis eventualmente#! tornar-se Senhor Feudal Legítimo deles. Anote para verificar se você pode [create|E] novos títulos frequentemente!\n\nLembre-se de usar os modos de mapa De Jure sempre que estiver planejando suas conquistas!#!"
 reactive_advice_rightful_liege_desc:0 "Você não é o [rightful_liege|E] de um [vassal|E]. Isso diminuirá a [opinion|E] dele sobre você e fará com que ele entregue menos [taxes|E] e [levies|E].\n\nVocê deve se esforçar para ser o Senhor Feudal Legítimo de todos os seus Vassalos!\n\n#TUT Para isso, você precisa possuir o [title|E] [de_jure|E] que está um nível acima do deles. Um Vassalo de nível [county|E] deseja estar sob seu [duchy|E] de jure. Por exemplo, o Conde de $c_madrid$ quer estar sob o Duque de $d_toledo$.\n\nÉ muito comum ter alguns Vassalos dos quais você #emphasis não#! é o Senhor Feudal Legítimo — não há muito o que fazer quanto a isso, e é completamente normal! No entanto, lembre-se de usar a [interaction|E] #TUT_KW $grant_vassal_interaction$#! para organizar seus Vassalos; você não pode manter todos os títulos sozinho.#!"
 reactive_advice_rightful_liege_step_1:0 "Senhor Feudal Legítimo"
 reactive_advice_rightful_liege_step_2:0 "$reactive_advice_rightful_liege_step_1$"
 reactive_advice_set_future_regent:0 "$REACTIVE_ADVICE_FUTURE_REGENT$"
 reactive_advice_station_maa:0 "$ra_maa_stationing_open_card_step$"
 reactive_advice_succession:0 "$reactive_advice_succession_step_1$"
 reactive_advice_succession_desc:0 "O rei está morto, longa vida ao rei!\n\nNão se preocupe - embora o seu personagem antigo tenha morrido, Crusader Kings III é um jogo de dinastias. Como o seu [ruler|E] tinha um [player_heir|E], agora você irá controlá-lo(a)!\n\n#TUT A morte é uma parte natural do jogo, e você frequentemente continuará como o(a) seu(sua) filho(a) mais velho(a) elegível (dependendo das [succession_laws|E] do seu reino). Para planejar uma sucessão segura, recomendamos que você tenha pelo menos dois filhos(as) - o segundo servindo como um reserva caso o primeiro morra.\n\nNa sucessão, você pode perder alguns dos [titles|E] que o seu personagem anterior possuía. Não se preocupe, você mantém [claims|E] em todos os títulos que perdeu.#!\n\n#weak Recomendamos que você reserve algum tempo para se familiarizar com o seu novo personagem antes de prosseguir.#!"
 reactive_advice_succession_step_1:0 "Sucessão"
 reactive_advice_tax_collector:0 "Arrecadação de Impostos"
 reactive_advice_tooltip_modes:0 "$reactive_advice_tooltip_modes_step_1$"
 reactive_advice_tooltip_modes_2_desc:0 "Se você é um jogador experiente ou apenas prefere não ter suas dicas bloqueadas automaticamente, recomendamos tentar #V Action Lock#!. Com este modo, você pressiona o #V Middle-mouse Button#! para bloquear dicas.\n\n#I Você muda os modos de dicas indo para o #V In-game Menu#!, então, para #V Settings#!, então a seção #V Game#! — a #V Tooltip Mode setting#! existe.#!"
 reactive_advice_tooltip_modes_desc:0 "Os modos de dicas de ferramenta controlam #EMP como#! você acessa [highlighted_text|E] e informações nas dicas de ferramenta #weak (ou seja, como travar as dicas de ferramenta para que você possa mover o mouse sobre elas)#!.\n\nO modo de dicas de ferramenta padrão é chamado de #V Bloqueio por Tempo#!. Com esse modo, as dicas de ferramenta ficarão travadas no lugar após um tempo determinado, indicado por uma pequena barra de progresso."
 reactive_advice_tooltip_modes_step_1:0 "Modos de dica de ferramenta"
 reactive_advice_tooltip_modes_step_2:0 "Modos de dica de ferramenta avançados"
 reactive_advice_tours_picking_vassals:0 "$REACTIVE_ADVICE_TOURS$"
 reactive_advice_travel_planning:0 "$REACTIVE_ADVICE_TRAVEL_PLANNING$"
 reactive_advice_treasury:0 "$game_concept_treasury$"
 reactive_advice_tributaries:0 "Tributários"
 reactive_advice_tutorial_schemes:0 "$ra_tutorial_schemes_1$"
 reactive_advice_tutorial_war:0 "Guerra"
 reactive_advice_varangian_adventure:0 "$game_concept_varangian_adventures$"
 reactive_advice_varangian_adventure_desc:0 "Você pode declarar uma [varangian_adventure|E].\n\nDurante a [era|E] tribal $culture_era_tribal$, este tipo de guerra estará disponível para permitir que você comece uma nova vida em uma terra distante, longe das frias costas de sua terra natal.\n\nAs $game_concept_varangian_adventures$ bem-sucedidas não apenas relocarão seu reino para uma localização estrangeira, mas também deixarão todas as suas terras existentes independentes, incluindo seus vassalos.\n\nSua primeira [varangian_adventure|E] realizada como governante do grupo $north_germanic_group$ também convocará tropas adicionais de condados de mesma [faith|E] e mesma [culture|E] possuídos na [GetGeographicalRegion('dlc_fp1_region_core_mainland_scandinavia').GetName] para ajudá-lo a conquistar sua nova casa."
 reactive_advice_varangian_adventure_step_1:0 "$game_concept_varangian_adventures$"
 reactive_advice_vassal_limit:0 "$reactive_advice_vassal_limit_step_1$"
 reactive_advice_vassal_limit_desc:0 "Ninguém consegue administrar uma horda de condes - aspirantes a conquistadores precisam confiar em níveis mais altos [vassals|E], como Duque, para administrar suas terras para eles!\n\nVocê pode ver o seu Limite de Vassalo atual na visualização do Domínio.\n\n#TUT Muito parecido com o seu limite de domínio, você não quer exceder o seu [vassal_limit|E]. Para evitar essa penalidade, você deve consolidar seus vassalos.\n\nA melhor maneira de fazer isso é concedendo [duchies|E] aos seus vassalos, isso os fará governar uma área maior para que você não precise fazer isso! Embora para que isso funcione, você deve ter um [kingdom|E] ou um [empire|E], não cometa o erro de doar um de seus [primary_titles|E]!\n\nSe você estiver excedendo o Limite de Vassalo como Duque, sugerimos que forme um Reino assim que puder.#!"
 reactive_advice_vassal_limit_step_1:0 "Limite de vassalo"
 reactive_advice_women_in_china:0 "Mulheres na China"
