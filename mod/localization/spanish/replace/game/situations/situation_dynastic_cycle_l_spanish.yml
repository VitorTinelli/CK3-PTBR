 cycle_history_key_an_lushan_rebellion:0 "O general Ān Lùshān lidera uma rebelião malsucedida contra a dinastia Tang, com consequências catastróficas para milhões de pessoas"
 cycle_history_key_collapse_of_the_qin:0 "A dinastia Qin, assolada por rebeliões internas, rapidamente desmorona em dezoito reinos em conflito"
 cycle_history_key_collapse_of_the_tang:0 "O assassinato do último imperador Tang marca o fim da dinastia, com mais de uma dúzia de senhores da guerra competindo pelo reconhecimento como seu sucessor"
 cycle_history_key_decline_of_the_sui:0 "Projetos de infraestrutura dispendiosos e desventuras militares levam a dinastia Sui à ruína; o imperador é assassinado e uma criança assume o trono"
 cycle_history_key_northern_southern_dynasties:0 "O caos do período das Dezesseis Dinastias dá gradualmente lugar às mais consolidadas Dinastias do Norte e do Sul, embora a reunificação permaneça um sonho"
 cycle_history_key_rise_of_the_han:0 "A ordem é restaurada na terra pelo triunfo da dinastia Han sobre seus rivais"
 cycle_history_key_rise_of_the_jin:0 "O período dos Três Reinos chega ao fim pelo regente de Wei, que força o imperador a abdicar e estabelece a dinastia Jin"
 cycle_history_key_rise_of_the_qin:0 "As terras dos antigos Sete Estados Combatentes são unidas pela dinastia Qin, a primeira dinastia verdadeiramente imperial"
 cycle_history_key_rise_of_the_song:0 "Um brilhante general une os reinos em guerra e inaugura uma nova era de paz e prosperidade como fundador da dinastia Song"
 cycle_history_key_rise_of_the_sui:0 "Após a morte do instável Imperador Xuan do Norte de Zhou, seu sogro toma o poder e funda a dinastia Sui"
 cycle_history_key_rise_of_the_tang:0 "Forçando o imperador criança da Sui a renunciar, o regente imperial ascende como o primeiro imperador da dinastia Tang"
 cycle_history_key_sack_of_kaifeng_by_jin:0 "A dinastia Song sofre uma grande derrota quando a capital imperial é saqueada pela dinastia Jurchen Jin, com o próprio imperador feito prisioneiro"
 cycle_history_key_sixteen_kingdoms:0 "O estabelecimento de um reino separatista em Sichuan anuncia a desintegração do norte em estados rivais fragmentados"
 cycle_history_key_three_kingdoms_period:0 "Com a abdicação forçada do último imperador da dinastia Han, inicia-se oficialmente a era de partição entre os três reinos de Wei, Shu e Wu"
 cycle_history_key_war_of_the_eight_princes:0 "O reinado do Imperador Hui de Jin é marcado por frequentes conflitos, à medida que os príncipes da casa imperial guerreiam pelo controle do imperador"
 cycle_history_key_yellow_turban_rebellion:0 "Massas descontentes, inspiradas por profecias revolucionárias, se erguem contra a dinastia Han, levando a décadas de conflitos internos"
