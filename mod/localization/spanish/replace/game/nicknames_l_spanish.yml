 nick_muhyi_al_din:0 "Muhyi al-Dīn"
 nick_muhyi_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Muhyi al-Dīn — o Revigorador da Fé."
 nick_muizz_al_dawla:0 "Muʾizz al-Dawla"
 nick_muizz_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Muʾizz al-Dawla — o Glorificador do Estado."
 nick_murasaki_shikibu:0 "Murasaki Shikibu"
 nick_murasaki_shikibu_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] é conhecida pelo epíteto #EMP Murasaki Shikibu#!, derivado da flor de glicínia púrpura — #EMP murasaki#! — conhecida como #EMP fujiwara#!, de onde sua família tirou o nome, e da posição de seu pai no #EMP Shikibu-shō#!, o Ministério de Assuntos Cerimoniais."
 nick_musharraf_al_dawla:0 "Musharraf al-Dawla"
 nick_musharraf_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Musharraf al-Dawla — o Elevado do Estado."
 nick_muzaffar_al_din:0 "Muzaffar al-Dīn"
 nick_muzaffar_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Muzaffar al-Dīn — o Vitor da Fé."
 nick_najm_al_din:0 "Najm al-Dīn"
 nick_najm_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Najm al-Dīn — a Estrela da Fé."
 nick_nasir_al_din:0 "Nasir al-Dīn"
 nick_nasir_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Nasir al-Dīn — o Protetor da Fé."
 nick_natures_bane:0 "O Flagelo da Natureza"
 nick_natures_bane_desc:0 "A força de [CHARACTER.GetShortUINameNoTooltipNoFormat] é tal que até a própria natureza se curva à sua vontade."
 nick_nizam_al_dawla:0 "Nizām al-Dawla"
 nick_nizam_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Nizām al-Dawla — a Ordem do Estado."
 nick_nizam_al_din:0 "Nizām al-Dīn"
 nick_nizam_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Nizām al-Dīn — a Ordem da Fé."
 nick_nizam_al_mulk:0 "Nizām al-Mulk"
 nick_nizam_al_mulk_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Nizām al-Mulk — a Ordem do Reino."
 nick_no_pants:0 "Sem-Calças"
 nick_no_pants_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem sido ridicularizad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por ser um[Select_CString(CHARACTER.IsFemale, 'a', '')] [CHARACTER.GetWomanMan] em uma cultura dominada por ideais de masculinidade."
 nick_nord_foe:0 "Inimigo dos Nórdicos"
 nick_nord_foe_desc:0 "Alguns tolos dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] não consegue assustar um nórdico, que eles têm gelo nas veias. [CHARACTER.GetShortUINameNoTooltipNoFormat] sabem que eles morrem gritando e sangrando como todos os outros."
 nick_northmen_slayer:0 "[Select_CString( CHARACTER.IsFemale, 'Matadora de Nórdicos', 'Matador de Nórdicos' )]"
 nick_northmen_slayer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] notoriamente abateu um saqueador nórdico."
 nick_nur_al_din:0 "Nur al-Dīn"
 nick_nur_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Nur al-Dīn — a Luz da Fé."
 nick_of_a_thousand_faces:0 "das Mil Faces"
 nick_of_a_thousand_faces_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é raramente vist[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] com a mesma máscara dois dias seguidos... se é que é [CharYouSheHe(CHARACTER)|U]..."
 nick_of_clairvaux:0 "de Clairvaux"
 nick_of_clairvaux_desc:0 "A origem [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] é importante para distingui-lo de um número francamente ridículo de outros Bernards competidores."
 nick_of_the_empty_pockets:0 "das Bolsas Vazias"
 nick_of_the_empty_pockets_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem buracos em seus bolsos, e [CHARACTER.GetShortUINameNoTooltipNoFormat] sempre será lembrad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] pela dívida que [CHARACTER.GetShortUINameNoTooltipNoFormat] afundou o tesouro."
 nick_old_man_of_the_mountain:0 "[Select_CString(CHARACTER.IsFemale, 'a Velha', 'o Velho')] da Montanha"
 nick_old_man_of_the_mountain_desc:0 "Com uma longa barba branca e um cajado torto, [CHARACTER.GetShortUINameNoTooltipNoFormat] é temido por não-crentes por organizar e liderar os temidos Assassinos de seu refúgio nas montanhas."
 nick_one_eye:0 "Olho-Único"
 nick_one_eye_desc:0 "$nick_monophthalmos_desc$"
 nick_one_eyed:0 "De Um Olho Só"
 nick_one_eyed_desc:0 "$nick_monophthalmos_desc$"
 nick_one_hand:0 "Mão-Única"
 nick_one_hand_desc:0 "O braço ausente de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] é uma característica tão distinta que todos o chamam de [CHARACTER.GetNicknameNoTooltip]."
 nick_one_leg:0 "Perna-Única"
 nick_one_leg_desc:0 "A perna ausente de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] é uma característica tão distinta que todos o chamam de [CHARACTER.GetNicknameNoTooltip]."
 nick_order_of_the_realm:0 "da Ordem do Reino"
 nick_order_of_the_realm_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um dos funcionários civis mais justos, capazes e bem-vistos do reino."
 nick_pauper_king:0 "[Select_CString(CHARACTER.IsFemale, 'a Rainha Mendiga', 'o Rei Mendigo')]"
 nick_pauper_king_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString(CHARACTER.IsFemale, 'a', 'o')] por suas tendências de frequentemente beber com os moradores das suas cidades e vilas."
 nick_pendragon:0 "Pendragon"
 nick_pendragon_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se apoiou... em #EMP antigas#! lendas para reivindicar a Britânia."
 nick_pennyfather:0 "Pennyfather"
 nick_pennyfather_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ama dinheiro, ouro, prata, moedas, ganho, joias..."
 nick_phrangopoulos:0 "Phrangopoulos"
 nick_phrangopoulos_desc:0 "Como muitos mercenários estrangeiros do distante ocidente, [CHARACTER.GetShortUINameNoTooltipNoFormat] é conhecido como 'Phrangopoulos' para os gregos: Filho dos francos."
 nick_pirate_slayer:0 "Flagelo dos Mares"
 nick_pirate_slayer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] massacrou um pirata notório."
 nick_prester_joan:0 "Preste Joana"
 nick_prester_joan_desc:0 "$nick_prester_john_desc$"
 nick_prester_john:0 "Preste João"
 nick_prester_john_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se envolveu um pouco demais em lendas estrangeiras exóticas."
 nick_priest_eater:0 "[Select_CString(CHARACTER.IsFemale, 'a Devoradora de Sacerdotes', 'o Devorador de Sacerdotes')]"
 nick_priest_eater_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] não gosta de nada relacionado ao clero, exceto pelo seu sabor."
 nick_priest_hater:0 "[Select_CString(CHARACTER.IsFemale, 'a Odiadora de Sacerdotes', 'o Odiador de Sacerdotes')]"
 nick_priest_hater_desc:0 "A aversão [CHARACTER.GetHerHim] pelo clero é conhecida e, devido à alfabetização clerical, bem documentada."
 nick_prince_of_fashion:0 "[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] [CHARACTER.Custom('GetPrincessPrince')] da Moda"
 nick_prince_of_fashion_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] foi ridicularizado por suas escolhas de moda."
 nick_protosebaste:0 "Protosebaste"
 nick_protosebaste_desc:0 "Uma alta honra da corte bizantina reservada para muito poucos, o título de 'primeira Augusta' marca [CHARACTER.GetShortUINameNoTooltipNoFormat] com estima imperial."
 nick_protosebastos:0 "Protosebastos"
 nick_protosebastos_desc:0 "Uma alta honra da corte bizantina reservada para muito poucos, o título de 'primeiro Augusto' marca [CHARACTER.GetShortUINameNoTooltipNoFormat] com estima imperial."
 nick_qasim_al_dawla:0 "Qāsim al-Dawla"
 nick_qasim_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Qāsim al-Dawla — o Distribuidor do Estado."
 nick_qutb_al_din:0 "Qutb al-Dīn"
 nick_qutb_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Qutb al-Dīn — o Eixo da Fé."
 nick_rashid_al_dawla:0 "Rashīd al-Dawla"
 nick_rashid_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Rashīd al-Dawla — a Orientação do Estado."
 nick_rashid_al_din:0 "Rashīd al-Dīn"
 nick_rashid_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Rashīd al-Dīn — a Orientação da Fé."
 nick_ring:0 "Anel"
 nick_ring_desc:0 "Ninguém realmente sabe por que o mundo chama [CHARACTER.GetShortUINameNoTooltipNoFormat] de \"$nick_ring$\", embora os camponeses esperançosos esperem que seja porque [CHARACTER.GetShortUINameNoTooltipNoFormat] é generos[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] com sua bolsa."
 nick_royalsbane:0 "[Select_CString(CHARACTER.IsFemale, 'Flageladora de Nobres', 'Flagelador de Nobres')]"
 nick_royalsbane_desc:0 "Sussurros abundam de que mais de um nobre caiu em batalha pelas mãos de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]."
 nick_rukn_al_din:0 "Rukn al-Dīn"
 nick_rukn_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Rukn al-Dīn — o Pilar da Fé."
 nick_sad_al_dawla:0 "Sād al-Dawla"
 nick_sad_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Sād al-Dawla — a Felicidade do Estado."
 nick_saddle_born:0 "Nascido na Sela"
 nick_saddle_born_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] parece se encaixar tão naturalmente na sela que alguns sussurram que [CHARACTER.GetShortUINameNoTooltipNoFormat] nunca tocou o chão."
 nick_salah_al_din:0 "Salāh al-Dīn"
 nick_salah_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Ṣalāḥ al-Dīn — a Justiça da Fé."
 nick_saltfish:0 "Peixe Salgado"
 nick_saltfish_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] [CharWereWas(CHARACTER)] adotou um estilo de vida preguiçoso e acomodado, mas quem sabe o que acontecerá depois?"
 nick_samsam_al_dawla:0 "Samsam al-Dawla"
 nick_samsam_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Samsam al-Dawla — a Espada do Estado."
 nick_sayf_al_dawla:0 "Sayf al-Dawla"
 nick_sayf_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Sayf al-Dawla — a Espada do Estado."
 nick_sayf_al_din:0 "Sayf al-Dīn"
 nick_sayf_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Sayf al-Dīn — a Espada da Fé."
 nick_sayf_al_islam:0 "Sayf al-Islām"
 nick_sayf_al_islam_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Sayf al-Islām — a Espada do Islã."
 nick_scourge_of_the_baltic:0 "Flagelo dos Bálticos"
 nick_scourge_of_the_baltic_desc:0 "Graças a [CHARACTER.GetShortUINameNoTooltipNoFormat], a Livônia certamente perdurará — sobre uma sólida fundação de ossos e sofrimento."
 nick_sei_shonagon:0 "Sei Shōnagon"
 nick_sei_shonagon_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] é conhecida pelo epíteto #EMP Sei Shōnagon#!, derivado de #EMP Sei#!, uma leitura chinesa de #EMP Kiyohara#!, seu sobrenome, e da posição de um parente masculino como #EMP Shōnagon#!, Conselheiro Menor do Estado."
 nick_shams_al_din:0 "Shams al-Dīn"
 nick_shams_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Shams al-Dīn — o Sol da Fé."
 nick_shams_al_mulk:0 "Shams al-Mulk"
 nick_shams_al_mulk_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Shams al-Mulk — o Sol do Reino."
 nick_sharaf_al_dawla:0 "Sharaf al-Dawla"
 nick_sharaf_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Sharaf al-Dawla — a Honra do Estado."
 nick_sharaf_al_din:0 "Sharaf al-Dīn"
 nick_sharaf_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Sharaf al-Dīn — a Honra da Fé."
 nick_shibl_al_dawla:0 "Shibl al-Dawla"
 nick_shibl_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Shibl al-Dawla — o Filhote de Leão do Estado."
 nick_shinno:0 "Shin'nō"
 nick_shinno_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido por declarar [Select_CString(CHARACTER.IsFemale, 'a si mesma', 'a si mesmo')] [Select_CString(CHARACTER.IsFemale, 'a', 'o')] 'nov[Select_CString(CHARACTER.IsFemale, 'a', 'o')] imperador[Select_CString(CHARACTER.IsFemale, 'a', '')]' do Japão e liderar uma rebelião contra o governo central."
 nick_sisyphus:0 "[Select_CString( CHARACTER.IsFemale, 'a Sísifa', 'o Sísifo' )]"
 nick_sisyphus_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é mais conhecido por tentar mover objetos pesados ao longo de trajetórias impossíveis."
 nick_snake_in_the_eye:0 "Cobra-no-Olho"
 nick_snake_in_the_eye_desc:0 "Viajantes sussurram que [CHARACTER.GetShortUINameNoTooltipNoFormat] carrega a imagem da ouroboros como uma mancha em seu olho — o símbolo eterno de uma cobra mordendo sua própria cauda. Poucos estão dispostos a se aproximar o suficiente para verificar a veracidade de tais afirmações."
 nick_softsword:0 "Espada Fraca"
 nick_softsword_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é nem um campeão no campo de batalha... nem na cama."
 nick_son_of_dangerous_animal:0 "[CHARACTER.Custom('GetDaughterSon')|U] de [CHARACTER.Custom('GetAnimalPlural')]"
 nick_son_of_dangerous_animal_desc:0 "Claro que chamam [CHARACTER.GetSheHe] disso - que útero humano poderia ter produzido tal fera?"
 nick_strongarm:0 "Braço Forte"
 nick_strongarm_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] está sempre pront[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] para a briga - principalmente porque [CHARACTER.GetShortUINameNoTooltipNoFormat] sabe que [CHARACTER.GetShortUINameNoTooltipNoFormat] vencerá."
 nick_sultan_al_dawla:0 "Sultān al-Dawla"
 nick_sultan_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Sultān al-Dawla — o Sultão do Estado."
 nick_sure_footed:0 "o Pé-Seguro"
 nick_sure_footed_desc:0 "$nick_monopod_desc$"
 nick_swan_neck:0 "Pescoço de Cisne"
 nick_swan_neck_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é bel[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e elegante, como um cisne gracioso."
 nick_taj_al_din:0 "Tāj al-Dīn"
 nick_taj_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Tāj al-Dīn — a Coroa da Fé."
 nick_taj_al_mulk:0 "Taj al-Mulk"
 nick_taj_al_mulk_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Taj al-Mulk — a Coroa do Reino."
 nick_tanglehair:0 "Cabelo Embaraçado"
 nick_tanglehair_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] fez um voto de nunca pentear, cortar ou limpar seu cabelo antes de unir os senhores feudais da Noruega."
 nick_tengri_khagan:0 "Tengri Grão-cã"
 nick_tengri_khagan_desc:0 "Nos antigos dias dos poderosos Grão-cãs Göktürks, este título foi gravado em pedra! Tengri Grão-cã — o Nascido do Céu, o Sábio: [CHARACTER.GetShortUINameNoTooltipNoFormat] foi criado pelo Grande Céu Azul para governar o mundo."
 nick_tenjin:0 "Tenjin"
 nick_tenjin_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] acredita-se ter se tornado um espírito vingativo após o tratamento injusto [CHARACTER.GetHerHim], sendo agora venerado como um ser celestial."
 nick_the_King_of_Thieves:0 "o Rei dos Ladrões"
 nick_the_King_of_Thieves_desc:0 "Um senhor dos bandidos, marginais, ladrões e outros malfeitores."
 nick_the_Queen_of_Thieves:0 "a Rainha dos Ladrões"
 nick_the_Queen_of_Thieves_desc:0 "$nick_the_King_of_Thieves_desc$"
 nick_the_Thief_Slayer:0 "[Select_CString( CHARACTER.IsFemale, 'a Matadora de Ladrões', 'o Matador de Ladrões' )]"
 nick_the_Thief_Slayer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] não tem paciência para ladrões."
 nick_the_able:0 "o Capaz"
 nick_the_able_desc:0 "Governar um reino? Lutar em uma batalha? Cozinhar uma refeição? Acalmar uma criança? Projetar um edifício? Arrancar um dente? Há pouco que [CHARACTER.GetShortUINameNoTooltipNoFormat] não possa fazer quando [CHARACTER.GetShortUINameNoTooltipNoFormat] coloca sua mente nisso. Especialização é, afinal, para insetos."
 nick_the_abominable:0 "[Select_CString( CHARACTER.IsFemale, 'a Abominável', 'o Abominável' )]"
 nick_the_abominable_desc:0 "A aparência de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] é associada à seu terrível comportamento e convida a comparações com bestas horríveis."
 nick_the_accursed:0 "[Select_CString(CHARACTER.IsFemale, 'a Amaldiçoada', 'o Amaldiçoado')]"
 nick_the_accursed_desc:0 "É raro um[Select_CString( CHARACTER.IsFemale, 'a', '' )] [CHARACTER.GetFaith.PriestNeuter] capaz de mencionar o seu nome sem cuspi-lo no pó."
 nick_the_actually_bald:0 "o Careca de Verdade"
 nick_the_actually_bald_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é amplamente zombad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por sua falta de cabelo."
 nick_the_affable:0 "o Afável"
 nick_the_affable_desc:0 "Calmo, tranquilo, agradável. [CHARACTER.GetShortUINameNoTooltipNoFormat] não se importa com qual epíteto as pessoas chamam [CHARACTER.GetSheHe], mas felizmente, quase sempre é algo #EMP agradável#!."
 nick_the_ambidextrous:0 "[Select_CString( CHARACTER.IsFemale, 'a Ambidestra', 'o Ambidestro' )]"
 nick_the_anathema:0 "a Anátema"
 nick_the_anathema_desc:0 "O caos do mundo mortal se afasta de [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_angel_of_death:0 "o Anjo da [CHARACTER.GetFaith.DeathDeityName|U]"
 nick_the_angel_of_death_desc:0 "Para a sua mente, [CHARACTER.GetShortUINameNoTooltipNoFormat] encerrou seu sofrimento. Não é assim que o resto do mundo vê."
 nick_the_angelic:0 "o Angélico"
 nick_the_angelic_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] envolto em uma santidade verdadeiramente mística e sobrenatural."
 nick_the_anointed:0 "[Select_CString( CHARACTER.IsFemale, 'a Ungida', 'o Ungido' )]"
 nick_the_anointed_desc:0 "Camponeses sussurram que [CHARACTER.GetFaith.HighGodName] escolheu [CHARACTER.GetShortUINameNoTooltipNoFormat] para realizar o trabalho de [CHARACTER.GetFaith.HighGodHerHis] no mundo mortal."
 nick_the_apostate:0 "[Select_CString( CHARACTER.IsFemale, 'a Apóstata', 'o Apóstata' )]"
 nick_the_apostate_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] resistiu à maré do sucesso de outra fé e proclamou seu amor e lealdade por [CHARACTER.GetFaith.HighGodName] em vez disso."
 nick_the_apostle:0 "o Apóstolo"
 nick_the_apostle_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] foi um dos companheiros pessoais de Jesus Cristo, acompanhando-o durante toda a vida e pregando seu caminho após seu martírio."
 nick_the_apostle_paul:0 "o Apóstolo"
 nick_the_apostle_paul_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nunca caminhou ao lado de Jesus Cristo em vida, mas foi chamado ao Seu caminho após a crucificação e o levou aos gentios por todo o mundo."
 nick_the_architect:0 "[Select_CString(CHARACTER.IsFemale, 'a Arquiteta', 'o Arquiteto')]"
 nick_the_architect_desc:0 "A maioria olha para um monte de tijolos e madeira e vê o trabalho de um operário. [CHARACTER.GetShortUINameNoTooltipNoFormat] vê #EMP potencial#!."
 nick_the_avenger:0 "o Vingador"
 nick_the_avenger_desc:0 "Os inimigos de [CHARACTER.GetShortUINameNoTooltipNoFormat] o conhecem como uma força implacável e incansável em busca de justiça, a qualquer custo."
 nick_the_backstabber:0 "[Select_CString(CHARACTER.IsFemale, 'a', 'o')] Fura-Olhos"
 nick_the_backstabber_desc:0 "Muitas facas, literais e figurativas, foram cravadas nas costas a pedido de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]."
 nick_the_bald:0 "[Select_CString( CHARACTER.IsFemale, 'a Careca', 'o Calvo' )]"
 nick_the_bald_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] sofreu com a falta de cabelo, e ninguém parece contente em deixar [CHARACTER.GetSheHe] esquecer disso."
 nick_the_bald_ironic:0 "$nick_the_bald$"
 nick_the_bald_ironic_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] passou a maior parte da vida sem uma coroa adequada adornando sua cabeça, e a corte se recusa a deixar [CHARACTER.GetSheHe] esquecer disso."
 nick_the_bandit_king:0 "o Rei Bandido"
 nick_the_bandit_king_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é temido em toda a terra como um marauder violento e traiçoeiro."
 nick_the_bandit_queen:0 "a Rainha Bandida"
 nick_the_bandit_queen_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é temida em toda a terra como um marauder violento e traiçoeiro."
 nick_the_bane_of_danes:0 "o Flagelo dos Dinamarqueses"
 nick_the_bane_of_danes_desc:0 "A opinião popular afirma que não há uma família na Escandinávia que não tenha perdido um parente para a sua lâmina."
 nick_the_bard:0 "[Select_CString( CHARACTER.IsFemale, 'a Barda', 'o Bardo' )]"
 nick_the_bard_desc:0 "A sua bela voz e seus dedos habilidosos para tocar fazem de [CHARACTER.GetShortUINameNoTooltipNoFormat] algo como uma celebridade em todas as cortes que [CHARACTER.GetShortUINameNoTooltipNoFormat] resolve visitar."
 nick_the_bard_ironic:0 "$nick_the_bard$"
 nick_the_bard_ironic_desc:0 "Eles chamam [CHARACTER.GetShortUINameNoTooltipNoFormat] de \"$nick_the_bard$\", porque [CHARACTER.GetShortUINameNoTooltipNoFormat] seria mais divertido amarrado ao lado de um cavalo em carga do que tentando cantar."
 nick_the_bastard:0 "[Select_CString( CHARACTER.IsFemale, 'a Bastarda', 'o Bastardo' )]"
 nick_the_bastard_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] nasceu fora do casamento, e [CHARACTER.GetShortUINameNoTooltipNoFormat] não consegue esquecer isso. O resto do mundo certamente não vai esquecer."
 nick_the_beanstalk:0 "o Pé de Feijão"
 nick_the_beanstalk_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é enormemente alt[Select_CString( CHARACTER.IsFemale, 'a', 'o' )], mas magr[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e esgui[Select_CString( CHARACTER.IsFemale, 'a', 'o' )], convidando comparações com a planta."
 nick_the_bear:0 "[Select_CString( CHARACTER.IsFemale, 'a Ursa', 'o Urso' )]"
 nick_the_bear_desc:0 "A forma peluda e imponente de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] pode ser intimidante - embora, admitidamente, não para todos."
 nick_the_bearded:0 "o Barbudo"
 nick_the_bearded_desc:0 "Como muitos homens, [CHARACTER.GetShortUINameNoTooltipNoFormat] tem uma barba. [CHARACTER.GetShortUINameNoTooltipNoFormat] realmente não entende por que as pessoas insistem em apontar isso."
 nick_the_beautiful:0 "[Select_CString( CHARACTER.IsFemale, 'a Bela', 'o Belo' )]"
 nick_the_beautiful_beard:0 "a Bela Barba"
 nick_the_beautiful_beard_desc:0 "Seu volume, seus cachos, seu perfume fragrante; alguém no mundo pode alegar ostentar uma barba tão majestosa quanto [CHARACTER.GetShortUINameNoTooltipNoFormat]?"
 nick_the_beautiful_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é divin[Select_CString( CHARACTER.IsFemale, 'a', 'o' )], deslumbrante e perpetuamente cobiçad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )]."
 nick_the_beautiful_desc_generous:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] talvez não seja bonito no sentido tradicional, mas mesmo assim é chamado assim devido às suas ações."
 nick_the_beautiful_generous:0 "[Select_CString( CHARACTER.IsFemale, 'a Bela', 'o Belo' )]"
 nick_the_beguiling:0 "[Select_CString(CHARACTER.IsFemale, 'a Encantadora', 'o Encantador')]"
 nick_the_beguiling_desc:0 "Dizem que um olhar discreto de [CHARACTER.GetShortUINameNoTooltipNoFormat] pode enfraquecer os joelhos..."
 nick_the_bell_keeper:0 "[Select_CString( CHARACTER.IsFemale, 'a Guardiã dos Sinos', 'o Guardião dos Sinos' )]"
 nick_the_bell_keeper_desc:0 "As opiniões de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] sobre tocar sinos são... um tanto unorthodoxas."
 nick_the_bellower:0 "[Select_CString( CHARACTER.IsFemale, 'a Gritadora', 'o Gritador' )]"
 nick_the_bellower_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é muito, muito alt[Select_CString( CHARACTER.IsFemale, 'a', 'o' )]. E muito, muito aterrorizante."
 nick_the_benevolent:0 "[Select_CString( CHARACTER.IsFemale, 'a Benevolente', 'o Benevolente' )]"
 nick_the_benevolent_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] faz questão de se envolver em patronato e caridade sempre que [CHARACTER.GetShortUINameNoTooltipNoFormat] pode."
 nick_the_berserker:0 "o Berserker"
 nick_the_berserker_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um[Select_CString( CHARACTER.IsFemale, 'a', '' )] guerreir[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] temível e #EMP furioso#!, quebrando a moral de qualquer um diante [CHARACTER.GetHerHim]."
 nick_the_betrayer:0 "[Select_CString( CHARACTER.IsFemale, 'a Traidora', 'o Traidor' )]"
 nick_the_betrayer_desc:0 "Todo mundo sabe o que [CHARACTER.GetShortUINameNoTooltipNoFormat] fez."
 nick_the_bewitched:0 "[Select_CString(CHARACTER.IsFemale, 'a Enfeitiçada', 'o Enfeitiçado')]"
 nick_the_bewitched_desc:0 "Abandonad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por [CHARACTER.GetFaith.HighGodName], amaldiçoad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por [CHARACTER.GetFaith.WitchGodName], quando falam de [CHARACTER.GetShortUINameNoTooltipNoFormat], muitas vezes é com pena."
 nick_the_big_halberd:0 "a Grande Alabarda"
 nick_the_black:0 "[Select_CString(CHARACTER.IsFemale, 'a Bruxa', 'o Bruxo')]"
 nick_the_black_adder:0 "[Select_CString( CHARACTER.IsFemale, 'a Víbora Negra', 'o Víbora Negra' )]"
 nick_the_black_adder_desc:0 "Com muitos planos astutos, embora os inimigos de [CHARACTER.GetShortUINameNoTooltipNoFormat] achem [CHARACTER.GetShortUINameNoTooltipNoFormat] uma criaturinha horrível."
 nick_the_black_desc:0 "Uma atitude cruel, negociações notoriamente injustas e um comportamento amaldiçoado em relação aos seus semelhantes dão a [CHARACTER.GetShortUINameNoTooltipNoFormat] uma má reputação."
 nick_the_black_sheep:0 "a Ovelha Negra"
 nick_the_black_sheep_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] e a maioria da sua família não estão se falando."
 nick_the_black_whirlwind:0 "o Redemoinho Negro"
 nick_the_black_whirlwind_desc:0 "O olhar de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] inspira medo nos corações dos homens."
 nick_the_blessed:0 "[Select_CString(CHARACTER.IsFemale, 'a Abençoada', 'o Abençoado')]"
 nick_the_blessed_desc:0 "Uma disposição justa e uma voz firme em defesa da fé são tudo sobre o que as pessoas falam quando descrevem [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_blind:0 "[Select_CString(CHARACTER.IsFemale, 'a Cega', 'o Cego')]"
 nick_the_blind_desc:0 "A falta de visão [CharYourHerHim(CHARACTER)|U] parece ser a única coisa que o mundo pode enxergar em [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_blood_motherfather:0 "[Select_CString( CHARACTER.IsFemale, 'a Mãe de Sangue', 'o Pai de Sangue' )]"
 nick_the_blood_motherfather_desc:0 "As pessoas sussurram o seu epônimo com medo e admiração — é preciso um certo tipo de [CHARACTER.Custom('MatriarchPatriarch')] para tratar sua família como [CHARACTER.GetShortUINameNoTooltipNoFormat] faz."
 nick_the_bloody:0 "[Select_CString( CHARACTER.IsFemale, 'a Sanguinária', 'o Sanguinário' )]"
 nick_the_bloody_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é destemido diante de um pouco de bagunça — não importa quantas pessoas costumavam ser."
 nick_the_blushing:0 "[Select_CString( CHARACTER.IsFemale, 'a Corada', 'o Corado' )]"
 nick_the_blushing_desc:0 "Situações sociais têm o dom de fazer brilhar as suas bochechas."
 nick_the_boar:0 "o Javali"
 nick_the_boar_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é forte, resistente e tenaz... mas não agradável de se olhar."
 nick_the_bogatyr:0 "[Select_CString( CHARACTER.IsFemale, 'a Bogatyr', 'o Bogatyr' )]"
 nick_the_bogatyr_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomado por unir com sucesso todos os povos eslavos."
 nick_the_bold:0 "[Select_CString(CHARACTER.IsFemale, 'a Destemida', 'o Destemido')]"
 nick_the_bold_desc:0 "Audaciosa, destemida, intrépida, valente, heroica - Seu nome é sinônimo de ação direta rapidamente tomada. Até mesmo seus inimigos chamam [CHARACTER.GetShortUINameNoTooltipNoFormat] de \"$nick_the_bold$\"; pelo menos isso impede a enxurrada de sinônimos."
 nick_the_boneless:0 "[Select_CString(CHARACTER.IsFemale, 'a Sem-Ossos', 'o Sem-Ossos')]"
 nick_the_boneless_desc:0 "O esqueleto frágil de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] desmente a ferocidade [CHARACTER.GetHerHim] mente e espírito."
 nick_the_brave:0 "[Select_CString(CHARACTER.IsFemale, 'a Brava', 'o Bravo')]"
 nick_the_brave_desc:0 "Nem coxas trêmulas nem pulsos tremidos impedem [CHARACTER.GetShortUINameNoTooltipNoFormat] de alcançar seus objetivos."
 nick_the_brilliant:0 "[Select_CString( CHARACTER.IsFemale, 'a Brilhante', 'o Brilhante' )]"
 nick_the_brilliant_desc:0 "Poucos podem igualar os seus dons intelectuais — e menos ainda são ousados o suficiente para tentar."
 nick_the_brute:0 "[Select_CString( CHARACTER.IsFemale, 'a Bruta', 'o Bruto' )]"
 nick_the_brute_desc:0 "Nunca um a se esquivar da violência, [CHARACTER.GetShortUINameNoTooltipNoFormat] não faz muita distinção entre danos físicos, sociais e mentais. Tudo corta do mesmo jeito no final, não é mesmo?"
 nick_the_builder:0 "[Select_CString( CHARACTER.IsFemale, 'a Construtora', 'o Construtor' )]"
 nick_the_builder_desc:0 "A maioria dos governantes se refere a construir seu reino apenas no sentido teórico. [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharDoDoes(CHARACTER)] não."
 nick_the_bully:0 "[Select_CString( CHARACTER.IsFemale, 'a Valentona', 'o Valentão' )]"
 nick_the_bully_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] gosta de intimidar aqueles que [CHARACTER.GetShortUINameNoTooltipNoFormat] considera abaixo [CHARACTER.GetHerHim]."
 nick_the_burner_of_ash:0 "[Select_CString( CHARACTER.IsFemale, 'a Incendiária das Cinzas', 'o Incendiário das Cinzas' )]"
 nick_the_burner_of_ash_desc:0 "Nada cheira tão bem quanto um dracar em chamas numa manhã de primavera."
 nick_the_butcher:0 "[Select_CString( CHARACTER.IsFemale, 'a Carniceira', 'o Carniceiro' )]"
 nick_the_butcher_desc:0 "Carne é carne. Tudo para de gritar eventualmente."
 nick_the_caliph_protector:0 "[Select_CString( CHARACTER.IsFemale, 'a Protetora do Califado', 'o Protetor do Califado' )]"
 nick_the_caliph_protector_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] subjulgou o Califado Sunita."
 nick_the_campeador:0 "[Select_CString( CHARACTER.IsFemale, 'a Campeadora', 'o Campeador' )]"
 nick_the_campeador_desc:0 "Muitos argumentam que nunca houve uma expressão mais pura de virtude marcial e bondade cavalheiresca — [CHARACTER.GetShortUINameNoTooltipNoFormat] despreza os elogios, e é contente em viver de acordo com os ideais [CHARACTER.GetShortUINameNoTooltipNoFormat] estabeleceu[CharYourHerHimself(CHARACTER)]."
 nick_the_cannibal:0 "[Select_CString(CHARACTER.IsFemale, 'a Canibal', 'o Canibal')]"
 nick_the_cannibal_desc:0 "Poucas pessoas conseguem suportar o sorriso de seus lábios abertos, especialmente quando sangue fresco escorre sobre seus dentes bem cuidados."
 nick_the_careless:0 "[Select_CString( CHARACTER.IsFemale, 'a Descuidada', 'o Descuidado' )]"
 nick_the_careless_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] abusou do seu poder, ganhando este apelido desagradável durante uma guerra civil."
 nick_the_carpenter:0 "[Select_CString( CHARACTER.IsFemale, 'a Carpinteira', 'o Carpinteiro' )]"
 nick_the_carpenter_desc:0 "Assim como Jesus era carpinteiro, é [CHARACTER.GetShortUINameNoTooltipNoFormat]. Piedos[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e diligente."
 nick_the_castellan:0 "[Select_CString( CHARACTER.IsFemale, 'a Castelã', 'o Castelão' )]"
 nick_the_castellan_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem supervisionad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] muitos projetos de construção dentro do domínio [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )]."
 nick_the_castle_builder:0 "[Select_CString(CHARACTER.IsFemale, 'a Construtora de Castelos', 'o Construtor de Castelos')]"
 nick_the_castle_builder_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomado por seu conhecimento sobre como construir castelos robustos e confiáveis."
 nick_the_champion:0 "[Select_CString( CHARACTER.IsFemale, 'a Campeã', 'o Campeão' )]"
 nick_the_champion_desc:0 "Campeão! #EMP Campeão#!! Os chamados ecoam onde quer que [CHARACTER.GetShortUINameNoTooltipNoFormat] vá - embora o reconhecimento seja adorável, o volume não."
 nick_the_chaste:0 "[Select_CString(CHARACTER.IsFemale, 'a Casta', 'o Casto')]"
 nick_the_chaste_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomada por sua preferência por uma boa noite de sono."
 nick_the_cheater:0 "[Select_CString( CHARACTER.IsFemale, 'a Trapaceira', 'o Trapaceiro' )]"
 nick_the_cheater_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] é um modelo de desonra e duplicidade."
 nick_the_child:0 "a Criança"
 nick_the_child_desc:0 "Infelizmente, a vida [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] terminou cedo demais para [CHARACTER.GetShortUINameNoTooltipNoFormat] ser conhecido por qualquer coisa além de seu fim abrupto."
 nick_the_child_killer:0 "[Select_CString( CHARACTER.IsFemale, 'a Matadora de Crianças', 'o Matador de Crianças' )]"
 nick_the_child_killer_desc:0 "Os estudiosos bíblicos geralmente argumentam que [CHARACTER.GetShortUINameNoTooltipNoFormat] não entendeu o propósito do julgamento de Salomão."
 nick_the_child_of_devilgod:0 "[Select_CString(CHARACTER.IsFemale, 'a Filha do Deus Demônio', 'o Filho do Deus Demônio')]"
 nick_the_child_of_devilgod_desc:0 "Línguas maldosas fofocam que [CHARACTER.GetShortUINameNoTooltipNoFormat] é a criança maldita de [CHARACTER.GetFaith.DevilName|U]. Pelo menos, até [CHARACTER.GetShortUINameNoTooltipNoFormat] arrancar sua língua."
 nick_the_childless:0 "o Sem Filhos"
 nick_the_childless_desc:0 "Apesar dos maiores esforços de [CHARACTER.GetHerHis], [CHARACTER.GetShortUINameNoTooltipNoFormat] não conseguiu [CHARACTER.GetMotherFather] um filho."
 nick_the_chimera:0 "a Quimera"
 nick_the_chimera_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é abençoad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e amaldiçoad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] quando se trata de atributos físicos."
 nick_the_chivalrous:0 "[Select_CString( CHARACTER.IsFemale, 'a Cavalheiresca', 'o Cavalheiresco' )]"
 nick_the_chivalrous_desc:0 "A honra pode ser barata para alguns, mas para [CHARACTER.GetShortUINameNoTooltipNoFormat], não há nada mais precioso no mundo."
 nick_the_chronicler:0 "[Select_CString( CHARACTER.IsFemale, 'a Cronista', 'o Cronista' )]"
 nick_the_chronicler_desc:0 "As futuras gerações certamente ficarão felizes com o seu nariz meticuloso para a documentação."
 nick_the_cid_campeador:0 "El Cid Campeador"
 nick_the_cid_campeador_desc:0 "A lenda de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] é de reverência, cavalheirismo, traição e honra."
 nick_the_city_builder:0 "[Select_CString(CHARACTER.IsFemale, 'a Construtora de Cidades', 'o Construtor de Cidades')]"
 nick_the_city_builder_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomado por seu conhecimento e habilidade na arte de construir cidades."
 nick_the_clever:0 "[Select_CString(CHARACTER.IsFemale, 'a', 'o')] Inteligente"
 nick_the_clueless:0 "[Select_CString( CHARACTER.IsFemale, 'a Desorientada', 'o Desorientado' )]"
 nick_the_clueless_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] simplesmente parece nunca ser[em] capaz[es] de tomar uma decisão, indo de uma coisa para outra com a convicção de uma sardinha."
 nick_the_clumsy:0 "[Select_CString( CHARACTER.IsFemale, 'a Desajeitada', 'o Desajeitado' )]"
 nick_the_clumsy_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] não é especialmente conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por sua destreza."
 nick_the_collector:0 "[Select_CString( CHARACTER.IsFemale, 'a Colecionadora', 'o Colecionador' )]"
 nick_the_collector_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem acumulado uma coleção verdadeiramente incrível de artefatos únicos."
 nick_the_compassionate:0 "[Select_CString( CHARACTER.IsFemale, 'a Compassiva', 'o Compassivo' )]"
 nick_the_compassionate_desc:0 "O que há de melhor na vida de [CHARACTER.GetShortUINameNoTooltipNoFormat]? Fazer amizade com um inimigo, ver o ódio deles se render diante [CHARACTER.GetHerHim] e sentir a alegria da reconciliação."
 nick_the_conceding:0 "[Select_CString( CHARACTER.IsFemale, 'a Concedente', 'o Concedente' )]"
 nick_the_conceding_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] foi forçado a fazer concessões para se manter no poder."
 nick_the_confessor:0 "[Select_CString(CHARACTER.IsFemale, 'a Confessora', 'o Confessor')]"
 nick_the_confessor_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomada por sua contrição, mesmo pelos pecados mais leves."
 nick_the_conqueror:0 "[Select_CString(CHARACTER.IsFemale, 'a Conquistadora', 'o Conquistador')]"
 nick_the_conqueror_desc:0 "Que feito mais poderoso pode ser registrado nos anais do que a subjugação de um #EMP reino#! inteiro? [CHARACTER.GetShortUINameNoTooltipNoFormat] certamente não deixará as pessoas esquecerem sua conquista."
 nick_the_convicted:0 "o Condenado"
 nick_the_convicted_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] capturado durante uma invasão viking e acusado pelas investidas inconvenientes de [CharYourHerHis(CHARACTER)]. [CharYouSheHe(CHARACTER)|U] parece[_s(CHARACTER)] desesperado para voltar para casa."
 nick_the_coppersmith:0 "[Select_CString( CHARACTER.IsFemale, 'a Ferradora', 'o Ferrador' )]"
 nick_the_corpulent:0 "[Select_CString(CHARACTER.IsFemale, 'a Corpulenta', 'o Corpulento')]"
 nick_the_corpulent_desc:0 "Cavalos e pisos tremem igualmente sob o monte gorduroso de carne que é [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_corrupt:0 "[Select_CString(CHARACTER.IsFemale, 'a Corrupta', 'o Corrupto')]"
 nick_the_corrupt_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é uma criatura astuta, empoleirada sobre um tesouro dourado de procedência duvidosa."
 nick_the_cosmic_poet:0 "[Select_CString( CHARACTER.IsFemale, 'a Poeta Cósmica', 'o Poeta Cósmico' )]"
 nick_the_cosmic_poet_desc:0 "A cabeça [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] está nas nuvens e os seus pensamentos estão entre as estrelas."
 nick_the_courageous:0 "[Select_CString( CHARACTER.IsFemale, 'a Corajosa', 'o Corajoso' )]"
 nick_the_courageous_desc:0 "Através do fogo e da chama, [CHARACTER.GetShortUINameNoTooltipNoFormat] pode ser confiado para continuar."
 nick_the_craven:0 "[Select_CString( CHARACTER.IsFemale, 'a Covarde', 'o Covarde' )]"
 nick_the_craven_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] foi sempre achad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] que a discrição é a melhor parte da coragem."
 nick_the_crow:0 "o Corvo"
 nick_the_crow_desc:0 "Aqueles que gostam de [CHARACTER.GetShortUINameNoTooltipNoFormat] dizem que é por causa sua mente afiada e visão precisa. Aqueles que não gostam dizem que a morte paira ao redor [CHARACTER.GetHerHim]."
 nick_the_crowned:0 "[Select_CString( CHARACTER.IsFemale, 'a Coroada', 'o Coroado' )]"
 nick_the_crowned_desc:0 "Houve coroas antes [CharYoursHerHim(CHARACTER)], é claro, mas mal as consideramos."
 nick_the_crownless:0 "[Select_CString( CHARACTER.IsFemale, 'a Sem Coroa', 'o Sem Coroa' )]"
 nick_the_crownless_desc:0 "Embora não seja especialmente poético, o epíteto de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] é evocativo, direto e queima os seus ouvidos toda vez."
 nick_the_cruel:0 "[Select_CString(CHARACTER.IsFemale, 'a Cruel', 'o Cruel')]"
 nick_the_cruel_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] gosta de pensar que [CHARACTER.GetShortUINameNoTooltipNoFormat] tem uma disposição relativamente ensolarada, na verdade. As pessoas simplesmente não parecem entender o senso de humor [CHARACTER.GetHerHim]."
 nick_the_crusader:0 "[Select_CString(CHARACTER.IsFemale, 'a Cruzada', 'o Cruzado')]"
 nick_the_crusader_desc:0 "Infiéis, apóstatas e hereges caem diante da lâmina [CHARACTER.GetHerHim]."
 nick_the_cucumber_king:0 "[Select_CString( CHARACTER.IsFemale, 'A Rainha do Pepino', 'O Rei do Pepino' )]"
 nick_the_cucumber_king_desc:0 "Não muitas pessoas podem dizer que usurparam um reino. Menos ainda podem argumentar que um tubérculo estrategicamente desviado foi fundamental para o ato."
 nick_the_culture:0 "[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] [CHARACTER.MakeScope.Var('nick_the_culture_var').Culture.GetNameNoTooltip]"
 nick_the_culture_desc:0 "Os habitantes do reino preferem se referir a [CHARACTER.GetShortUINameNoTooltipNoFormat] pela cultura que percebem que [CHARACTER.GetSheHe] possui."
 nick_the_culture_wall:0 "a Muralha da [CHARACTER.GetCulture.GetNameNoTooltip]"
 nick_the_culture_wall_desc:0 "Nenhum invasor estrangeiro, nenhum viking escravagista, nenhum saqueador faminto navega pelas suas vias fluviais ou predam o seu povo."
 nick_the_curthose:0 "Curthose"
 nick_the_curthose_desc:0 "Quando criança, seu pai chamava [CHARACTER.GetShortUINameNoTooltipNoFormat] de \"Little Boot\". Como adulto, [CHARACTER.GetShortUINameNoTooltipNoFormat] não consegue fazer as pessoas pararem de chamá-lo de \"Little Boot\"."
 nick_the_cyclops:0 "o Ciclope"
 nick_the_cyclops_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é alt[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] com apenas um olho, como o ciclo mitológico."
 nick_the_dane:0 "[Select_CString( CHARACTER.IsFemale, 'a Dinamarquêsa', 'o Dinamarquês' )]"
 nick_the_dane_desc:0 "O mundo conhece [CHARACTER.GetShortUINameNoTooltipNoFormat] como um escandinavo infame. Não importa muito o tipo."
 nick_the_deceiver:0 "[Select_CString( CHARACTER.IsFemale, 'a Enganadora', 'o Enganador' )]"
 nick_the_deceiver_desc:0 "Por que se preocupar com aço caro e sangue quando as palavras são de graça?"
 nick_the_deep_minded:0 "o Mente Profunda"
 nick_the_deep_minded_desc:0 "As pessoas falam sobre os seus pensamentos profundos e opiniões ponderadas. [CHARACTER.GetShortUINameNoTooltipNoFormat] prefere sentar e pensar."
 nick_the_defender_of_highgod:0 "[Select_CString( CHARACTER.IsFemale, 'a Defensora de [CHARACTER.GetFaith.HighGodName]', 'o Defensor de [CHARACTER.GetFaith.HighGodName]' )]"
 nick_the_defender_of_highgod_desc:0 "[CHARACTER.GetFaith.GetName] tem poucos guardiões tão devotados no mundo mortal quanto [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_defiant:0 "[Select_CString( CHARACTER.IsFemale, 'a Desafiadora', 'o Desafiador' )]"
 nick_the_defiant_desc:0 "Que venham, que todos venham! O caminho de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] é o caminho certo, e [CHARACTER.GetShortUINameNoTooltipNoFormat] matará quantas pessoas forem necessárias para provar isso!"
 nick_the_demon:0 "o Demônio"
 nick_the_demon_desc:0 "[CHARACTER.GetFaith.DevilName|U] certamente daria uma referência favorável a [CHARACTER.GetShortUINameNoTooltipNoFormat] no Parlamento de [CHARACTER.GetFaith.random_NegativeAfterLife]."
 nick_the_depraved:0 "[Select_CString(CHARACTER.IsFemale, 'a Depravada', 'o Depravado')]"
 nick_the_depraved_desc:0 "Pessoas boas cochicham que os seus desejos são antinaturais. [CHARACTER.GetShortUINameNoTooltipNoFormat] os considera simplesmente #EMP refinados#!."
 nick_the_desired:0 "[Select_CString( CHARACTER.IsFemale, 'a Desejada', 'o Desejado' )]"
 nick_the_desired_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é desejad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por todos os lados."
 nick_the_destroyer:0 "[Select_CString(CHARACTER.IsFemale, 'a Destruidora', 'o Destruidor')]"
 nick_the_destroyer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecida por incendiar propriedades, queimar construções e deixar a terra semeada com sal e os ossos dos mortos."
 nick_the_destroyer_prophecy:0 "$nick_the_destroyer$"
 nick_the_destroyer_prophecy_desc:0 "Uma profecia notável atribui a [CharYourSheHe(CHARACTER)] o epônimo. Se seu destino é derrubar uma ordem corrupta ou queimar uma justa é motivo de debate."
 nick_the_determined:0 "[Select_CString( CHARACTER.IsFemale, 'a Determinada', 'o Determinado' )]"
 nick_the_determined_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por definir a mente para algo e #EMP fazer isso.#!."
 nick_the_devil:0 "[Select_CString(CHARACTER.IsFemale, 'a Diaba', 'o Diabo')]"
 nick_the_devil_desc:0 "Má intenção envolve as ações [CHARACTER.GetHerHim] como um manto, e toda a terra pensa nas ações [CHARACTER.GetHerHim] com a pior intenção possível."
 nick_the_devourer:0 "[Select_CString(CHARACTER.IsFemale, 'a Devoradora', 'o Devorador')]"
 nick_the_devourer_desc:0 "O mundo estremece ao considerar quantas vidas caíram na sua boca sem fundo..."
 nick_the_diplomat:0 "[Select_CString( CHARACTER.IsFemale, 'a Diplomata', 'o Diplomata' )]"
 nick_the_diplomat_desc:0 "Uma solução pacífica é aquela que pode ser encontrada com palavras — e [CHARACTER.GetShortUINameNoTooltipNoFormat] é muito#! bom com palavras."
 nick_the_dirty:0 "[Select_CString( CHARACTER.IsFemale, 'a Suja', 'o Sujo' )]"
 nick_the_dirty_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] luta tão sujo quanto [CHARACTER.GetShortUINameNoTooltipNoFormat] parece."
 nick_the_diseased:0 "[Select_CString( CHARACTER.IsFemale, 'a Doente', 'o Doente' )]"
 nick_the_diseased_desc:0 "A primeira coisa que as pessoas costumam ouvir sobre [CHARACTER.GetShortUINameNoTooltipNoFormat] é a tosse [CHARACTER.GetHerHim]."
 nick_the_disgraceful:0 "[Select_CString( CHARACTER.IsFemale, 'a Desprezível', 'o Desprezível' )]"
 nick_the_disgraceful_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é de uma família respeitável, mas não conseguiu corresponder às expectativas."
 nick_the_divine:0 "[Select_CString( CHARACTER.IsFemale, 'a Divina', 'o Divino' )]"
 nick_the_divine_desc:0 "Poucos que ouvem falar de [CHARACTER.GetShortUINameNoTooltipNoFormat] conseguem pensar em qualquer outra coisa — certamente [CHARACTER.GetShortUINameNoTooltipNoFormat] é pelo menos tocado pelo divino?"
 nick_the_dragon:0 "o Dragão"
 nick_the_dragon_desc:0 "$nick_the_dragoness_desc$"
 nick_the_dragoness:0 "a Dragoa"
 nick_the_dragoness_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é temível... e os rumores dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] come pessoas."
 nick_the_dragonslayer:0 "[Select_CString(CHARACTER.IsFemale, 'a Matadora de Dragões', 'o Matador de Dragões')]"
 nick_the_dragonslayer_desc:0 "A lendária caçada de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] a um dragão selvagem não tem igual."
 nick_the_dreadful:0 "[Select_CString(CHARACTER.IsFemale, 'a', 'o')] Temível"
 nick_the_dreadful_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] acredita que a única maneira de ser respeitado é ser temid[Select_CString(CHARACTER.IsFemale, 'a', 'o')]."
 nick_the_drunkard:0 "[Select_CString(CHARACTER.IsFemale, 'a Bêbada', 'o Bêbado')]"
 nick_the_drunkard_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] passa sua vida procurando clareza no fundo de um caneco. Todos sabem que [CHARACTER.GetShortUINameNoTooltipNoFormat] nunca vai encontrá-la."
 nick_the_drunkard_michael_iii:0 "[Select_CString(CHARACTER.IsFemale, 'a Bebedeira', 'o Bebedeiro')]"
 nick_the_drunkard_michael_iii_desc:0 "Pobre Michael, um jovem imperador, derrubado por sua mais #EMP antichristã#! indulgência excessiva em álcool. Uma lição para todos nós de que o nascimento pode indicar talento, mas não o garante."
 nick_the_dry:0 "[Select_CString( CHARACTER.IsFemale, 'a Séria', 'o Sério' )]"
 nick_the_dry_desc:0 "É considerado impossível dizer se [CHARACTER.GetShortUINameNoTooltipNoFormat] está rindo constantemente internamente sem demonstração externa, ou se simplesmente... não entende o conceito de #EMP diversão#! desde o início."
 nick_the_dull:0 "[Select_CString( CHARACTER.IsFemale, 'a Maçante', 'o Maçante' )]"
 nick_the_dull_desc:0 "Ninguém realmente lembra por que exatamente [CHARACTER.GetShortUINameNoTooltipNoFormat] foi chamado de $nick_the_dull$. Todos concordam que não vale a pena lembrar."
 nick_the_dung_named:0 "O Chamado de Estrume"
 nick_the_dung_named_desc:0 "Detratores sussurram que [CHARACTER.GetShortUINameNoTooltipNoFormat] sujou a fonte batismal pouco após o nascimento..."
 nick_the_dunged:0 "[Select_CString( CHARACTER.IsFemale, 'a Estrumada', 'o Estrumado' )]"
 nick_the_dunged_desc:0 "[CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] prefere não pensar na memória - todos os outros tentam não mencionar o cheiro."
 nick_the_eager:0 "[Select_CString( CHARACTER.IsFemale, 'a Ávida', 'o Ávido' )]"
 nick_the_eager_desc:0 "O entusiasmo é a sua palavra-chave, o gosto seu credo."
 nick_the_eagle_of_arasbaran:0 "a Águia de Arasbaran"
 nick_the_eagle_of_arasbaran_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] restaurou uma grande fortaleza nas montanhas de Arasbaran."
 nick_the_ecumenist:0 "[Select_CString( CHARACTER.IsFemale, 'a Ecumenista', 'o Ecumenista' )]"
 nick_the_ecumenist_desc:0 "Os seus esforços em prol da consolidação e conciliação do mundo cristão tornam [CHARACTER.GetShortUINameNoTooltipNoFormat] um herói para muitos - se também um herege para alguns."
 nick_the_effeminate:0 "o Efeminado"
 nick_the_effeminate_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem sido diminuíd[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por sua falta de habilidade como guerreiro em uma cultura dominada por ideais de masculinidade."
 nick_the_elder:0 "[Select_CString( CHARACTER.IsFemale, 'a Anciã', 'o Ancião' )]"
 nick_the_elder_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem vivid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por muitos, muitos anos. Muitos mais do que se poderia esperar."
 nick_the_elegant:0 "[Select_CString( CHARACTER.IsFemale, 'a Elegante', 'o Elegante' )]"
 nick_the_elegant_desc:0 "Um toque delicado produz um resultado gracioso, um processo refinado cultiva uma reputação sofisticada."
 nick_the_elegist:0 "[Select_CString(CHARACTER.IsFemale, 'a Elegíaca', 'o Elegíaco')]"
 nick_the_elegist_desc:0 "Os versos tristes e melancólicos pelos quais [CHARACTER.GetShortUINameNoTooltipNoFormat] é famoso trazem lágrimas até mesmo aos ouvintes mais duros."
 nick_the_eloquent:0 "[Select_CString( CHARACTER.IsFemale, 'a Eloquente', 'o Eloquente' )]"
 nick_the_eloquent_desc:0 "Seu discurso é tão distinto quanto sua postura."
 nick_the_elysian_muse:0 "a Musa Elysiana"
 nick_the_elysian_muse_desc:0 "Renomado em toda esta terra e muitas outras por sua capacidade absolutamente transcendental de evocar um verso magnífico, [CHARACTER.GetShortUINameNoTooltipNoFormat] demonstra domínio completo da palavra falada em todas as suas formas."
 nick_the_enlightened:0 "[Select_CString( CHARACTER.IsFemale, 'a Iluminada', 'o Iluminado' )]"
 nick_the_enlightened_desc:0 "O aprendizado superior é sua própria recompensa, mas ser conhecido por isso #EMP é#! bastante agradável."
 nick_the_equitable:0 "[Select_CString( CHARACTER.IsFemale, 'a Justa', 'o Justo' )]"
 nick_the_equitable_desc:0 "Uma partilha justa e equitativa é a preferência [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] em todas as coisas."
 nick_the_eunuch:0 "[Select_CString( CHARACTER.IsFemale, 'a Eunuca', 'o Eunuco' )]"
 nick_the_eunuch_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é desprovid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] de virilidade, o que as pessoas gostam de apontar."
 nick_the_evil:0 "[Select_CString( CHARACTER.IsFemale, 'a Má', 'o Mal' )]"
 nick_the_evil_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é pecaminos[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e ímpio, e não tem tido medo de intimidar sacerdotes e súditos igualmente."
 nick_the_executioner:0 "[Select_CString( CHARACTER.IsFemale, 'a Carrasca', 'o Carrasco' )]"
 nick_the_executioner_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é grande admirador[Select_CString( CHARACTER.IsFemale, 'a', '' )] do machado do carrasco e o vê em ação com frequência."
 nick_the_exile:0 "[Select_CString(CHARACTER.IsFemale, 'a Exilada', 'o Exilado')]"
 nick_the_exile_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] foi expulso de sua terra natal ou a deixou para escapar de algum fardo inesperado, buscando refúgio no exterior."
 nick_the_faceless:0 "o Sem-Rosto"
 nick_the_faceless_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] quase nunca sido vist[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] desde que ficou desfigurad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )]."
 nick_the_fair:0 "[Select_CString(CHARACTER.IsFemale, 'a Justa', 'o Justo')]"
 nick_the_fair_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é considerad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] ter uma aparência agradável."
 nick_the_faith:0 "o [CHARACTER.GetFaith.GetAdherentNameNoTooltip]"
 nick_the_faith_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um[Select_CString( CHARACTER.IsFemale, 'a', '' )] [CHARACTER.GetFaith.GetAdherentNameNoTooltip] ardente fora do lugar, tornando [CharYouSheHe(CHARACTER)|U] uma novidade aos olhos dos outros."
 nick_the_fat:0 "[Select_CString(CHARACTER.IsFemale, 'a Gorda', 'o Gordo')]"
 nick_the_fat_desc:0 "Dizem que as bochechas de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] costumam soltar pernas inteiras de frango."
 nick_the_father_culture:0 "o [CHARACTER.GetFather.GetCulture.GetNameNoTooltip]"
 nick_the_father_culture_desc:0 "O apelido [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] traça a linhagem materna, não sua própria."
 nick_the_fearless:0 "[Select_CString(CHARACTER.IsFemale, 'a Destemida', 'o Destemido')]"
 nick_the_fearless_desc:0 "Soldados de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] afirmam nunca terem visto [CHARACTER.GetShortUINameNoTooltipNoFormat] recuar — nem diante de homens, cavalos ou projéteis. A maioria das pessoas acredita neles."
 nick_the_feeble:0 "[Select_CString( CHARACTER.IsFemale, 'a Fraca', 'o Fraco' )]"
 nick_the_feeble_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] raramente consegue reunir a força necessária para mover até objetos pequenos e é frequentemente ridicularizad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por esse fato."
 nick_the_ferocious_giant:0 "[Select_CString( CHARACTER.IsFemale, 'a Gigante Feroz', 'o Gigante Feroz' )]"
 nick_the_ferocious_giant_desc:0 "O epônimo de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] pode não ser poético, mas poucos podem negar sua precisão."
 nick_the_fierce:0 "[Select_CString(CHARACTER.IsFemale, 'a', 'o')] Feroz"
 nick_the_fierce_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] reputação por tenacidade que precede [CHARACTER.GetHerHim]."
 nick_the_fire_quencher:0 "[Select_CString( CHARACTER.IsFemale, 'a Apagadora de Fogo', 'o Apagador de Fogo' )]"
 nick_the_fire_quencher_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é famoso por ter apagado as Chamas Sagradas."
 nick_the_firekeeper:0 "[Select_CString( CHARACTER.IsFemale, 'a Guardiã do Fogo', 'o Guardião do Fogo' )]"
 nick_the_firekeper_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido por ter reformado o [CHARACTER.GetFaith.GetName], mas salvado as Chamas Sagradas."
 nick_the_fishy:0 "[Select_CString( CHARACTER.IsFemale, 'a Peixosa', 'o Peixoso' )]"
 nick_the_fishy_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] simplesmente #EMP não consegue#! se livrar do rumor ocasional de um cheiro de peixe que o acompanha."
 nick_the_flash:0 "o Relâmpago de [CHARACTER.GetFaith.HighGodName]"
 nick_the_flash_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharTryTries(CHARACTER)] não pensar em [CharYourHerHimself(CHARACTER)] como a Ira de [CHARACTER.GetFaith.HighGodName]. \"Relâmpago\" é muito mais diplomático."
 nick_the_flayer:0 "[Select_CString( CHARACTER.IsFemale, 'a Esfoladora', 'o Esfolador' )]"
 nick_the_flayer_desc:0 "Graças a [CHARACTER.GetShortUINameNoTooltipNoFormat], o reino está intimamente familiarizado com o que dizem sobre os segredos de um homem esfolado."
 nick_the_flightless:0 "[Select_CString( CHARACTER.IsFemale, 'A Sem Asas', 'O Sem Asas' )]"
 nick_the_flightless_desc:0 "As invenções de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] alcançaram pouco além de um final climático."
 nick_the_flying:0 "[Select_CString( CHARACTER.IsFemale, 'A Voadora', 'O Voador' )]"
 nick_the_flying_desc:0 "As invenções de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] alcançaram coisas lendárias."
 nick_the_foolish:0 "[Select_CString( CHARACTER.IsFemale, 'a Tola', 'o Tolo' )]"
 nick_the_foolish_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido por sua... abordagem #EMP única#! para a tomada de decisões."
 nick_the_footstool:0 "[Select_CString( CHARACTER.IsFemale, 'a Descansa Pés', 'o Descansa Pés' )]"
 nick_the_footstool_desc:0 "As responsabilidades de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] são... onerosas. E muito discutidas."
 nick_the_foreign_father:0 "o [CHARACTER.GetFather.GetCulture.GetNameNoTooltip]"
 nick_the_foreign_father_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é incapaz de viver com a vergonha de sua herança paternal estrangeira, e é feito para sofrer uma série de barbs étnicos baratos."
 nick_the_foreign_mother:0 "a [CHARACTER.GetMother.GetCulture.GetNameNoTooltip]"
 nick_the_foreign_mother_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é incapaz de viver com a vergonha de sua herança maternal estrangeira, e é feito para sofrer uma série de barbs étnicos baratos."
 nick_the_foreigner:0 "[Select_CString( CHARACTER.IsFemale, 'a Estrangeira', 'o Estrangeiro' )]"
 nick_the_foreigner_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é de terras distantes daqui."
 nick_the_forgetful:0 "[Select_CString( CHARACTER.IsFemale, 'a Esquecida', 'o Esquecido' )]"
 nick_the_forgetful_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] frequentemente esquece seus deveres, para o desgosto de seus súditos."
 nick_the_fortress_builder:0 "[Select_CString( CHARACTER.IsFemale, 'a Construtora de Fortalezas', 'o Construtor de Fortalezas' )]"
 nick_the_fortress_builder_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] reconstruiu uma grande fortaleza nas montanhas."
 nick_the_fortunate:0 "[Select_CString( CHARACTER.IsFemale, 'a Afortunada', 'o Afortunado' )]"
 nick_the_fowler:0 "[Select_CString(CHARACTER.IsFemale, 'a Pescadora', 'o Pescador')]"
 nick_the_fowler_desc:0 "Fofocas na corte dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] passa tanto tempo caçando aves selvagens quanto governando."
 nick_the_fox:0 "a Raposa"
 nick_the_fox_desc:0 "Astúcia, sagacidade, ambição - as suas virtudes podem não ser cavalheirescas, mas elas #EMP são#! eficazes."
 nick_the_frail:0 "[Select_CString( CHARACTER.IsFemale, 'a Frágil', 'o Frágil' )]"
 nick_the_frail_desc:0 "Dizem frequentemente que os ossos de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] são feitos de vidro - pelo menos, eles se quebram como se fossem."
 nick_the_frog:0 "[Select_CString( CHARACTER.IsFemale, 'a Sapa', 'o Sapo' )]"
 nick_the_frog_desc:0 "As características de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] têm algo de anfíbio - explicações menos #EMP polidas#! geralmente são usadas longe dos ouvidos."
 nick_the_fury:0 "a Fúria"
 nick_the_fury_desc:0 "A ira, o ódio, a #EMP terror#! do inimigo motiva [CHARACTER.GetShortUINameNoTooltipNoFormat], instigando [CHARACTER.GetSheHe] a atos de sede de sangue e crueldade. Atos muito, muito eficazes."
 nick_the_gambler:0 "[Select_CString(CHARACTER.IsFemale, 'a Jogadora', 'o Jogador')]"
 nick_the_gambler_desc:0 "As apostas de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] são monumentais, mesmo quando as perspectivas são escassas... e #EMP especialmente#! quando os riscos são altos."
 nick_the_gardener:0 "[Select_CString( CHARACTER.IsFemale, 'a Jardineira', 'o Jardineiro' )]"
 nick_the_gardener_desc:0 "Para sua mente, todo o mundo é um jardim - cultive-o, e ele crescerá."
 nick_the_garlic:0 "o Rei do Alho"
 nick_the_garlic_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é popularmente retratado em uma cantiga infantil zombeteira."
 nick_the_generous:0 "[Select_CString( CHARACTER.IsFemale, 'a Generosa', 'o Generoso' )]"
 nick_the_generous_desc:0 "Você daria a camisa de [CharYourHerHimself(CHARACTER)] para alguém — se a última pessoa não tivesse a pegado."
 nick_the_gentle:0 "[Select_CString(CHARACTER.IsFemale, 'a Gentil', 'o Gentil')]"
 nick_the_gentle_desc:0 "Quando [CHARACTER.GetShortUINameNoTooltipNoFormat] faz as coisas corretamente, as pessoas não têm certeza se [CHARACTER.GetShortUINameNoTooltipNoFormat] fez algo de fato."
 nick_the_german:0 "[Select_CString(CHARACTER.IsFemale, 'a Germana', 'o Germano')]"
 nick_the_german_desc:0 "O povo do reino [CHARACTER.GetHerHim] chama [CHARACTER.GetShortUINameNoTooltipNoFormat] de $nick_the_german$, mas [CHARACTER.GetShortUINameNoTooltipNoFormat] realmente não entende por quê."
 nick_the_german_post_mortem:0 "$nick_the_german$"
 nick_the_german_post_mortem_desc:0 "Sua morte marcou a transição difícil quando o Reino Franco Oriental passou a ser chamado de Alemanha."
 nick_the_giant:0 "[Select_CString( CHARACTER.IsFemale, 'a Gigante', 'o Gigante' )]"
 nick_the_giant_desc:0 "Dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] é tão grande quanto uma casa — na experiência de [CHARACTER.GetShortUINameNoTooltipNoFormat], isso depende da casa."
 nick_the_girthy:0 "[Select_CString( CHARACTER.IsFemale, 'a Volumosa', 'o Volumoso' )]"
 nick_the_girthy_desc:0 "A pura massa, a resistência duradoura e a imensa corpulência de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] são assunto de todas as cidades que [CHARACTER.GetShortUINameNoTooltipNoFormat] visita[CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_glass:0 "[CHARACTER.GetWomanMan|U] de Vidro"
 nick_the_glass_desc:0 "A obsessão de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] em construir cabanas estranhas de vidro é tão comentada quanto confusa."
 nick_the_glorious:0 "[Select_CString( CHARACTER.IsFemale, 'a Gloriosa', 'o Glorioso' )]"
 nick_the_glorious_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] certamente será lembrado na história como uma das pessoas mais majestosas que já graçaram o mundo."
 nick_the_goliath:0 "o Golias"
 nick_the_goliath_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um guerreiro enorme, como o Golias bíblico."
 nick_the_good:0 "[Select_CString(CHARACTER.IsFemale, 'a Boa', 'o Bom')]"
 nick_the_good_desc:0 "Sua disposição justa e comprometimento com os valores da sua fé fazem com que outros [CHARACTER.GetFaith.GetAdherentNamePluralNoTooltip] admirem [CHARACTER.GetShortUINameNoTooltipNoFormat] com reverência."
 nick_the_gouty:0 "da Gota"
 nick_the_gouty_desc:0 "Suas articulações inflamadas, inchadas e membros dolorosamente deformados destacam [CHARACTER.GetShortUINameNoTooltipNoFormat] como membro das classes luxuosas da sociedade. Talvez até um pouco #EMP demais#! luxuoso."
 nick_the_graceful:0 "[Select_CString( CHARACTER.IsFemale, 'a Graciosa', 'o Gracioso' )]"
 nick_the_graceful_desc:0 "Seu passo, dicção e pura #EMP elegância#! impressionam os espectadores."
 nick_the_gracious:0 "[Select_CString(CHARACTER.IsFemale, 'a Graciosa', 'o Gracioso')]"
 nick_the_gracious_desc:0 "Suas boas maneiras, postura nobre e indulgência majestosa fazem de [CHARACTER.GetShortUINameNoTooltipNoFormat] uma pessoa popular em muitas mesas."
 nick_the_grazer:0 "[Select_CString(CHARACTER.IsFemale, 'a Pastejadora', 'o Pastejador')]"
 nick_the_grazer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomado por viver asceticamente como uma besta selvagem."
 nick_the_great:0 "[Select_CString(CHARACTER.IsFemale, 'a Grande', 'o Grande')]"
 nick_the_great_and_terrible:0 "[Select_CString( CHARACTER.IsFemale, 'a Grande e Terrível', 'o Grande e Terrível' )]"
 nick_the_great_and_terrible_desc:0 "Um pirata sem igual, [Select_CString( CHARACTER.IsFemale, 'uma', 'um' )] [CHARACTER.GetLadyLord] de sangue e ouro, a própria encarnação de uma espada brilhante erguida sobre ondas de sal marinho crepitante. [CHARACTER.GetShortUINameNoTooltipNoFormat] conquistou o direito de ser chamado de o Grande e [CHARACTER.GetShortUINameNoTooltipNoFormat] forjou a reputação de ser chamado o #EMP Terrível#!."
 nick_the_great_desc:0 "As realizações de [CHARACTER.GetShortUINameNoTooltipNoFormat] são lendárias - os plebeus cantam canções sobre as façanhas [CHARACTER.GetHerHim], enquanto a nobreza resmunga sobre expectativas injustas."
 nick_the_greedy:0 "[Select_CString(CHARACTER.IsFemale, 'a Gananciosa', 'o Ganancioso')]"
 nick_the_greedy_desc:0 "O que é melhor do que um saco de prata? Dois sacos de prata!"
 nick_the_green:0 "[Select_CString( CHARACTER.IsFemale, 'a Verde', 'o Verde' )]"
 nick_the_green_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é considerad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] hábil com uma colher de pedreiro."
 nick_the_griffin:0 "[Select_CString( CHARACTER.IsFemale, 'a Grifo', 'o Grifo' )]"
 nick_the_griffin_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é feroz tanto com espada quanto com estratégia."
 nick_the_guardian:0 "[Select_CString( CHARACTER.IsFemale, 'a Guardiã', 'o Guardião' )]"
 nick_the_guardian_desc:0 "Chova ou faça sol, amigo ou inimigo, [CHARACTER.GetShortUINameNoTooltipNoFormat] sempre está lá para aqueles que tem jurado proteger."
 nick_the_gullible:0 "[Select_CString( CHARACTER.IsFemale, 'a Ingênua', 'o Ingênuo' )]"
 nick_the_gullible_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um pouco confiante demais para o seu próprio bem."
 nick_the_hairy:0 "[Select_CString( CHARACTER.IsFemale, 'a Peluda', 'o Peludo' )]"
 nick_the_hairy_desc:0 "Seja [CHARACTER.GetShortUINameNoTooltipNoFormat] [CHARACTER.GetWomanMan] ou [CHARACTER.Custom('GetGenderAlliteratingAnimal')]? À primeira vista, é difícil dizer."
 nick_the_hammer:0 "o Martelo"
 nick_the_hammer_desc:0 "A quem quiser saber por que chamam [CHARACTER.GetShortUINameNoTooltipNoFormat] de $nick_the_hammer$ só precisa perguntar aos infortunados inimigos [CHARACTER.GetHerHim]."
 nick_the_handsome:0 "[Select_CString(CHARACTER.IsFemale, 'a Bonita', 'o Bonito')]"
 nick_the_handsome_desc:0 "#EMP Oh céus#! Poucos no mundo ostentam esse queixo esculpido, esses ombros retos ou esses [CHARACTER.Custom('Eye_ArticleBlank')]belos [CHARACTER.Custom('EyeEyes')]."
 nick_the_harvester:0 "o Ceifador"
 nick_the_harvester_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] é admirado pelas grandes colheitas que [CHARACTER.GetSheHe] acumulou em [CHARACTER.GetHerHis] braços e devolveu ao povo."
 nick_the_haunted:0 "[Select_CString( CHARACTER.IsFemale, 'a Assombrada', 'o Assombrado' )]"
 nick_the_haunted_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é constantemente atormentad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por visões horríveis e sonhos traumáticos."
 nick_the_hawk:0 "[Select_CString( CHARACTER.IsFemale, 'a Águia', 'o Falcão' )]"
 nick_the_hawk_desc:0 "Pouco escapa ao olhar perspicaz [CHARACTER.GetHerHim] - nada escapa dàs suas garras afiadas."
 nick_the_headless:0 "[Select_CString( CHARACTER.IsFemale, 'a Sem-Cabeça', 'o Sem-Cabeça' )]"
 nick_the_headless_desc:0 "Rápido e direto ao ponto. Muito parecido com o seu fim."
 nick_the_healer:0 "[Select_CString( CHARACTER.IsFemale, 'a Curandeira', 'o Curandeiro' )]"
 nick_the_healer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem aprendid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] a arte da medicina, e não hesita em tratar aqueles que precisam."
 nick_the_heart_throb:0 "o Coração Ardente"
 nick_the_heart_throb_desc:0 "É raro um coração não palpitar na sua esteira."
 nick_the_heartbreaker:0 "[Select_CString( CHARACTER.IsFemale, 'a Quebra-corações', 'o Quebra-corações' )]"
 nick_the_heartbreaker_desc:0 "Dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] gosta de um pouco de perigo."
 nick_the_heartless:0 "[Select_CString( CHARACTER.IsFemale, 'a Desalmada', 'o Desalmado' )]"
 nick_the_heartless_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é do tipo insensível, tendo executado um amante."
 nick_the_heathen:0 "[Select_CString(CHARACTER.IsFemale, 'a Pagã', 'o Pagão')]"
 nick_the_heathen_desc:0 "Em uma conversão verdadeiramente drástica, [CHARACTER.GetShortUINameNoTooltipNoFormat] abandonou não apenas sua fé, não apenas sua religião, mas toda a tradição religiosa [CHARACTER.GetHerHim], adotando uma visão totalmente separada da ordem divina."
 nick_the_heathen_rebel:0 "$nick_the_heathen$"
 nick_the_heathen_rebel_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é [Select_CString( CHARACTER.IsFemale, 'conhecida', 'conhecido' )] por sua rebelião contra o que [CHARACTER.GetShortUINameNoTooltipNoFormat] vê como os caminhos idólatras de seus conterrâneos e sua falsa teologia."
 nick_the_heretic:0 "[Select_CString( CHARACTER.IsFemale, 'a Herege', 'o Herege' )]"
 nick_the_heretic_desc:0 "A conversão de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] para o [CHARACTER.GetFaith.GetName] foi tão dramática que é uma das coisas que as pessoas mais lembram sobre [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_hermit:0 "[Select_CString( CHARACTER.IsFemale, 'a Eremita', 'o Eremita' )]"
 nick_the_hermit_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] prefere[oem] a companhia de ninguém e raramente é vist[Select_CString( CHARACTER.IsFemale, 'a', 'o' )]."
 nick_the_hideous:0 "[Select_CString( CHARACTER.IsFemale, 'a Repugnante', 'o Repugnante' )]"
 nick_the_hideous_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem um rosto que, esperamos, pelo menos uma mãe poderia amar."
 nick_the_historian:0 "[Select_CString( CHARACTER.IsFemale, 'a Historiadora', 'o Historiador' )]"
 nick_the_historian_desc:0 "Aqueles que não tentam pelo menos aprender com a história estão fadados a repeti-la."
 nick_the_holy:0 "[Select_CString(CHARACTER.IsFemale, 'a Santa', 'o Santo')]"
 nick_the_holy_desc:0 "Nenhum vício, nenhum pecado, nenhuma profanação, nenhuma impiedade mancha a vida divinamente ordenada [CHARACTER.GetHerHim]."
 nick_the_honest:0 "[Select_CString( CHARACTER.IsFemale, 'a Honesta', 'o Honesto' )]"
 nick_the_honest_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] considera a honestidade sempre a melhor política."
 nick_the_honest_hipped:0 "[Select_CString( CHARACTER.IsFemale, 'a de Quadris Sinceros', 'o de Quadris Sinceros' )]"
 nick_the_honest_hipped_desc:0 "[CHARACTER.GetSheHe|U] faz um homem querer falar $language_iberian_name$."
 nick_the_honorable:0 "[Select_CString(CHARACTER.IsFemale, 'a Honrada', 'o Honrado')]"
 nick_the_honorable_desc:0 "Quando um acordo é feito, quando sua palavra é dada, [CHARACTER.GetShortUINameNoTooltipNoFormat] pode ser confiado[_a(CHARACTER)] para mantê-lo tão firmemente quanto o aço."
 nick_the_horse:0 "[Select_CString( CHARACTER.IsFemale, 'a Égua', 'o Cavalo' )]"
 nick_the_horse_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um guerreiro das estepes de renome, liderando hordas galopantes para saquear terras estrangeiras."
 nick_the_hotspur:0 "[Select_CString( CHARACTER.IsFemale, 'a Audaz', 'o Audaz' )]"
 nick_the_hotspur_desc:0 "Dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] toma decisões tão rapidamente que as suas esporas calcanhares raramente tocam o chão."
 nick_the_humble:0 "[Select_CString( CHARACTER.IsFemale, 'a Humilde', 'o Humilde' )]"
 nick_the_humble_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem uma atitude excessivamente altruísta e humilde, creditando o divino por cada sucesso."
 nick_the_hunchback:0 "[Select_CString(CHARACTER.IsFemale, 'a Corcunda', 'o Corcunda')]"
 nick_the_hunchback_desc:0 "Ninguém que olhe para [CHARACTER.GetShortUINameNoTooltipNoFormat] pode deixar de notar o calombo distintivo em suas costas e o ângulo saliente de sua cabeça. Às vezes, parece que é tudo o que conseguem ver."
 nick_the_hunter:0 "[Select_CString(CHARACTER.IsFemale, 'a Caçadora', 'o Caçador')]"
 nick_the_hunter_desc:0 "A mira rápida e os olhos ágeis de [CHARACTER.GetShortUINameNoTooltipNoFormat] são conhecidos em todas as direções por muitas léguas. Dizem que o arco [CHARACTER.GetHerHim] pode alcançar tão longe quanto seu nome se espalha."
 nick_the_idle:0 "[Select_CString( CHARACTER.IsFemale, 'a Ociosa', 'o Ocioso' )]"
 nick_the_idle_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por... não fazer nada."
 nick_the_ill_ruler:0 "[Select_CString( CHARACTER.IsFemale, 'a Governante Inábil', 'o Governante Inábil' )]"
 nick_the_ill_ruler_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um governante fraco, comandando pouco respeito após ter mau utilizado o seu poder, ou provado ser incapaz de manter a estabilidade no reino."
 nick_the_ill_tempered:0 "[Select_CString( CHARACTER.IsFemale, 'a Má-Humorada', 'o Mal-Humorado' )]"
 nick_the_ill_tempered_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é rápid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] para a raiva... e os súditos [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] sabem disso."
 nick_the_illuminator:0 "[Select_CString( CHARACTER.IsFemale, 'a Iluminadora', 'o Iluminador' )]"
 nick_the_illuminator_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é louvado por ser o primeiro a trazer a luz da #EMP Verdadeira#! Fé para o povo, tornando-se a origem de sua salvação."
 nick_the_immortal:0 "[Select_CString( CHARACTER.IsFemale, 'a Imortal', 'o Imortal' )]"
 nick_the_immortal_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] parece muito jovem para sua idade."
 nick_the_impaler:0 "[Select_CString(CHARACTER.IsFemale, 'a Empaladora', 'o Empalador')]"
 nick_the_impaler_desc:0 "Os métodos de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] para a justiça podem ser severos, mas a taxa de reincidência #EMP é#! baixa."
 nick_the_imperious:0 "[Select_CString( CHARACTER.IsFemale, 'a Imperiosa', 'o Imperioso' )]"
 nick_the_imperious_desc:0 "O poder faz o certo, e como [CHARACTER.GetShortUINameNoTooltipNoFormat] está sempre certo, cabe a [CHARACTER.GetShortUINameNoTooltipNoFormat] garantir que [CHARACTER.GetShortUINameNoTooltipNoFormat] seja visto como poderoso."
 nick_the_incompetent:0 "[Select_CString(CHARACTER.IsFemale, 'a', 'o')] Incompetente"
 nick_the_incompetent_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] não estava preparado para o poder e a responsabilidade que foram colocados em suas mãos."
 nick_the_indolent:0 "[Select_CString( CHARACTER.IsFemale, 'a Indolente', 'o Indolente' )]"
 nick_the_indolent_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por ser petulantemente ocios[Select_CString( CHARACTER.IsFemale, 'a', 'o' )]."
 nick_the_inevitable:0 "[Select_CString( CHARACTER.IsFemale, 'a Inevitável', 'o Inevitável' )]"
 nick_the_inevitable_desc:0 "No final, as coisas sempre acontecem do seu jeito. As pessoas aprendem isso por si mesmas, ou então [CHARACTER.GetShortUINameNoTooltipNoFormat] as ensina."
 nick_the_insane:0 "[Select_CString( CHARACTER.IsFemale, 'a Insana', 'o Insano' )]"
 nick_the_insane_desc:0 "As pessoas pisam em cascas de ovos ao redor de [CHARACTER.GetShortUINameNoTooltipNoFormat] — talvez justamente, talvez não, mas por quê arriscar ofender [Select_CString( CHARACTER.IsFemale, 'essa', 'esse' )] [CHARACTER.GetWomanMan]?"
 nick_the_insubordinate:0 "[Select_CString(CHARACTER.IsFemale, 'a Insubordinada', 'o Insubordinado')]"
 nick_the_insubordinate_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] está sempre pronto para resistir e retaliar, um péssimo servo e um vassalo infiel."
 nick_the_iron_and_golden_king:0 "o Rei de Ferro e Ouro [CHARACTER.GetTitleAsNameNoTooltip]"
 nick_the_iron_and_golden_king_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem uma vasta riqueza na forma de minas e um imponente grupo de cavaleiros pesados."
 nick_the_iron_wearer:0 "[Select_CString(CHARACTER.IsFemale, 'a Portadora', 'o Portador')] de Ferro"
 nick_the_iron_wearer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomado por viver em mortificação ascética da carne, coberto por pesadas correntes."
 nick_the_ironside:0 "[Select_CString(CHARACTER.IsFemale, 'a Incólume', 'o Incólume')]"
 nick_the_ironside_desc:0 "Lança, machado, espada, flecha - [CHARACTER.GetShortUINameNoTooltipNoFormat] é [Select_CString( CHARACTER.IsFemale, 'conhecida', 'conhecido' )] por conseguir desviar qualquer golpe, desde o mais imponente até a lâmina de um assassino."
 nick_the_jade_unicorn:0 "o Unicórnio de Jade"
 nick_the_jade_unicorn_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é considerado imbatível com uma vara."
 nick_the_jolly:0 "[Select_CString( CHARACTER.IsFemale, 'a Alegre', 'o Alegre' )]"
 nick_the_jolly_desc:0 "Música e boa comida! Isso é tudo que [CHARACTER.GetShortUINameNoTooltipNoFormat] se importa aos olhos de seus súditos."
 nick_the_jovial:0 "[Select_CString( CHARACTER.IsFemale, 'a Jovial', 'o Jovial' )]"
 nick_the_jovial_desc:0 "Festas! Danças! Comida! [CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por ser boa companhia em todos os tipos de reuniões."
 nick_the_joyless:0 "[Select_CString( CHARACTER.IsFemale, 'a Sem Humor', 'o Sem Humor' )]"
 nick_the_joyless_desc:0 "Qualquer pessoa que lida com [CHARACTER.GetShortUINameNoTooltipNoFormat] diariamente logo aprende a ser exato e preciso em suas palavras, porque [CHARACTER.GetShortUINameNoTooltipNoFormat] nunca será nada menos que isso em sua compreensão."
 nick_the_judge:0 "[Select_CString( CHARACTER.IsFemale, 'a Juiza', 'o Juiz' )]"
 nick_the_judge_desc:0 "$k_israel$ chamou por juízes justos e verdadeiros ao longo da história. [CHARACTER.GetShortUINameNoTooltipNoFormat] é algumas vezes lembrado ao lado deles."
 nick_the_just:0 "[Select_CString(CHARACTER.IsFemale, 'a Justa', 'o Justo')]"
 nick_the_just_desc:0 "A lei e a ordem são a base de tudo o que é bom na vida. Sem a lei, a ordem é tirânica; sem ordem, a lei é impotente."
 nick_the_just_widowed:0 "[Select_CString( CHARACTER.IsFemale, 'a Recém-Viúva Justa', 'o Recém-Viúvo Justo' )]"
 nick_the_just_widowed_desc:0 "O cônjuge recém-casado de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] morreu de forma tão trágica e prematura."
 nick_the_justicar:0 "[Select_CString( CHARACTER.IsFemale, 'a Juiza', 'o Juiz' )]"
 nick_the_justicar_desc:0 "A maioria das pessoas concorda que as suas decisões são justas e imparciais."
 nick_the_kind:0 "[Select_CString(CHARACTER.IsFemale, 'a Bondosa', 'o Bondoso')]"
 nick_the_kind_desc:0 "Uma palavra calma, um sorriso reconfortante, um convite em um dia frio - [CHARACTER.GetShortUINameNoTooltipNoFormat] acredita que o mundo pode ser tocado com apenas um pouco de compaixão."
 nick_the_knight_of_gabriel:0 "[Select_CString( CHARACTER.IsFemale, 'a Cavaleira de Gabriel', 'o Cavaleiro de Gabriel' )]"
 nick_the_knight_of_gabriel_desc:0 "A espada ardente do anjo vingador de Deus, [CHARACTER.GetShortUINameNoTooltipNoFormat] construiu $e_outremer$ tijolo por tijolo com muito sangue."
 nick_the_ladder_legs:0 "Pernas de Escada"
 nick_the_ladder_legs_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] anda com pernas longas como pernas de pau, convidando comentários maldosos."
 nick_the_ladylord_of_the_ganges:0 "[Select_CString( CHARACTER.IsFemale, 'a Senhora do Ganges', 'o Senhor do Ganges' )]"
 nick_the_ladylord_of_the_ganges_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é o fiel guardião do rio mais sagrado do mundo."
 nick_the_lame:0 "[Select_CString(CHARACTER.IsFemale, 'a Manca', 'o Manco')]"
 nick_the_lame_desc:0 "Atormentad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por uma perna defeituosa, o mundo não apenas se recusa a se adaptar, eles nem mesmo permitem que [CHARACTER.GetShortUINameNoTooltipNoFormat] esqueça."
 nick_the_lawgiver:0 "[Select_CString(CHARACTER.IsFemale, 'a Legisladora', 'o Legislador')]"
 nick_the_lawgiver_desc:0 "Regras, ordem, devido processo - os presentes de [CHARACTER.GetShortUINameNoTooltipNoFormat] para o seu povo são muitos."
 nick_the_lazy:0 "[Select_CString(CHARACTER.IsFemale, 'a Preguiçosa', 'o Preguiçoso')]"
 nick_the_lecher:0 "[Select_CString(CHARACTER.IsFemale, 'a Lasciva', 'o Lascivo')]"
 nick_the_lecher_desc:0 "As pessoas gostam de se acostumar com a sua baba. Ou elas vão embora."
 nick_the_legend_riad:0 "a Lenda"
 nick_the_legend_riad_desc:0 "A sombra da lenda de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] paira sobre o mundo inteiro."
 nick_the_leper:0 "[Select_CString(CHARACTER.IsFemale, 'a Leprosa', 'o Leproso')]"
 nick_the_leper_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] jamais poderia esquecer a doença debilitante que lentamente consome a sua carne. O mundo gosta de lembrar [CHARACTER.GetSheHe] de qualquer maneira."
 nick_the_lewd:0 "[Select_CString(CHARACTER.IsFemale, 'a Obscena', 'o Obsceno')]"
 nick_the_lewd_desc:0 "Os comentários, a sua postura e os seus gestos físicos vigorosos ocasionais são, na melhor das hipóteses, pouco sutis."
 nick_the_liberal:0 "o Liberal"
 nick_the_liberal_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomado pela sua generosidade aberta e muitas benfeitorias."
 nick_the_liberator:0 "[Select_CString(CHARACTER.IsFemale, 'a Libertadora', 'o Libertador')]"
 nick_the_liberator_desc:0 "Por meio de aço afiado ou palavras prateadas, [CHARACTER.GetShortUINameNoTooltipNoFormat] conquistou grandes liberdades para aqueles que estavam em cativeiro."
 nick_the_linguist:0 "[Select_CString( CHARACTER.IsFemale, 'a Linguista', 'o Linguista' )]"
 nick_the_linguist_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] fala mais idiomas do que alguns dos súditos têm dentes."
 nick_the_lion:0 "[Select_CString(CHARACTER.IsFemale, 'a Leoa', 'o Leão')]"
 nick_the_lion_desc:0 "Nobre, feroz, majestoso: se o leão é o rei das feras, então a óbvia semelhança de [CHARACTER.GetShortUINameNoTooltipNoFormat] com o animal sugere um destino brilhante para [CharYourSheHe(CHARACTER)]."
 nick_the_lionheart:0 "o Coração de Leão"
 nick_the_lionheart_desc:0 "Corajoso até o extremo, devastador em batalha, mortal em um duelo. Aqueles que se perguntam como [CHARACTER.GetShortUINameNoTooltipNoFormat] conquistou esse nome claramente não conhecem [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_lisp_and_lame:0 "[Select_CString(CHARACTER.IsFemale, 'a Gaga e Manca', 'o Gago e Manco')]"
 nick_the_lisp_and_lame_desc:0 "Insatisfeito com um passo lento e desajeitado, [CHARACTER.GetFaith.HealthGodName] achou adequado amaldiçoar [CHARACTER.GetShortUINameNoTooltipNoFormat] com um horrível sotaque também."
 nick_the_little:0 "[Select_CString( CHARACTER.IsFemale, 'a Pequena', 'o Pequeno' )]"
 nick_the_little_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é geralmente considerado de baixa estatura."
 nick_the_lord_of_realm:0 "[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] [CHARACTER.GetLadyLord|U] de [CHARACTER.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 nick_the_lord_of_realm_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é tão amad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por seus súditos que eles proclamaram [CHARACTER.GetShortUINameNoTooltipNoFormat] de '[CHARACTER.GetNicknameNoTooltip]'."
 nick_the_lover_of_elegance:0 "[Select_CString( CHARACTER.IsFemale, 'a Amante da Elegância', 'o Amante da Elegância' )]"
 nick_the_lover_of_elegance_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ama a vida cortesã e todas as tradições e regras que a acompanham."
 nick_the_loyal:0 "[Select_CString( CHARACTER.IsFemale, 'a Leal', 'o Leal' )]"
 nick_the_loyal_desc:0 "Chova ou faça sol, aconteça o que acontecer, os seus amigos sabem que [CHARACTER.GetShortUINameNoTooltipNoFormat] estará ao lado deles."
 nick_the_lucky:0 "[Select_CString( CHARACTER.IsFemale, 'a Sortuda', 'o Sortudo' )]"
 nick_the_lucky_desc:0 "Os desafios na vida são meros solavancos no caminho para [CHARACTER.GetShortUINameNoTooltipNoFormat], que obviamente é abençoad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] pelos poderes supremos."
 nick_the_lute_player:0 "[Select_CString( CHARACTER.IsFemale, 'a Lautista', 'o Lautista' )]"
 nick_the_lute_player_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido por ser extremamente habilidoso com um alaúde."
 nick_the_mace:0 "a Maça"
 nick_the_mace_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] pode esmagar qualquer inimigo até a submissão."
 nick_the_mad:0 "[Select_CString(CHARACTER.IsFemale, 'a Louca', 'o Louco')]"
 nick_the_mad_desc:0 "Se eles soubessem o que [CHARACTER.GetShortUINameNoTooltipNoFormat] sabe, então eles também estariam rindo: toda essa vida é um jogo de um deus louco."
 nick_the_magnanimous:0 "[Select_CString(CHARACTER.IsFemale, 'a Magnânima', 'o Magnânimo')]"
 nick_the_magnanimous_desc:0 "Que nunca se diga que [CHARACTER.GetShortUINameNoTooltipNoFormat] deixou de conceder algo que foi pedido."
 nick_the_magnificent:0 "[Select_CString(CHARACTER.IsFemale, 'a Magnífica', 'o Magnífico')]"
 nick_the_magnificent_desc:0 "Contos dos esplêndidos feitos [CHARACTER.GetHerHim] são contados da Irlanda à Catay."
 nick_the_maiden_of_virgin:0 "a Donzela da Virgem"
 nick_the_maiden_of_virgin_desc:0 "A pureza [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] é tão renomada quanto a da abençoada Mãe de Deus."
 nick_the_mapmaker:0 "[Select_CString(CHARACTER.IsFemale, 'a Cartógrafa', 'o Cartógrafo')]"
 nick_the_mapmaker_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString(CHARACTER.IsFemale, 'a', 'o')] por ser bem viajad[Select_CString(CHARACTER.IsFemale, 'a', 'o')], mas também por ter passado um tempo considerável desenhando mapas das áreas que visitou."
 nick_the_martyr:0 "[Select_CString(CHARACTER.IsFemale, 'a Mártir', 'o Mártir')]"
 nick_the_martyr_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] morreu pelo [CHARACTER.GetFaith.HighGodName], e os [CHARACTER.GetFaith.GetAdherentNamePlural] do mundo lembram do sacrifício [CHARACTER.GetHerHim]."
 nick_the_martyr_king:0 "o Rei Mártir"
 nick_the_martyrophile:0 "o Mártir"
 nick_the_martyrophile_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é amplamente creditado dentro da sua fé por documentar a vida de seus mártires sagrados."
 nick_the_maul:0 "[Select_CString( CHARACTER.IsFemale, 'a Destruidora', 'o Destruidor' )]"
 nick_the_maul_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por esmagar toda oposição com um poderoso martelo."
 nick_the_merciful:0 "[Select_CString( CHARACTER.IsFemale, 'a Misericordiosa', 'o Misericordioso' )]"
 nick_the_merciful_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é perdoador[Select_CString( CHARACTER.IsFemale, 'a', '' )], benevolente e lent[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] para se irritar. Os prisioneiros raramente passam muito tempo na masmorra [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )]."
 nick_the_merciless:0 "[Select_CString( CHARACTER.IsFemale, 'a Implacável', 'o Implacável' )]"
 nick_the_merciless_desc:0 "Nenhum quarto dado ou esperado. Amigos chamam [CHARACTER.GetShortUINameNoTooltipNoFormat] pragmático, inimigos chamam [CHARACTER.GetSheHe] de sem honra."
 nick_the_merry:0 "[Select_CString(CHARACTER.IsFemale, 'a Alegre', 'o Alegre')]"
 nick_the_merry_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido[_a(CHARACTER)] pelo bom humor, piadas divertidas e excelentes festas."
 nick_the_messenger_of_christ:0 "[Select_CString( CHARACTER.IsFemale, 'a Mensageira de Cristo', 'o Mensageiro de Cristo' )]"
 nick_the_messenger_of_christ_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] levou a palavra do Cordeiro de Deus a todas as pessoas de $e_outremer$."
 nick_the_meticulous:0 "[Select_CString( CHARACTER.IsFemale, 'a Minuciosa', 'o Minucioso' )]"
 nick_the_meticulous_desc:0 "A atenção aos detalhes é importante, e a falta dela demonstra uma falha de caráter - pelo menos, de acordo com [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_mindbreaker:0 "[Select_CString( CHARACTER.IsFemale, 'a Quebra-mente', 'o Quebra-mente' )]"
 nick_the_mindbreaker_desc:0 "As pessoas sussurram temerosamente sobre o que acontece com aqueles que experimentam a sua intenção torturante."
 nick_the_miracle_worker:0 "[Select_CString( CHARACTER.IsFemale, 'a Trabalhadora de Milagres', 'o Trabalhador de Milagres' )]"
 nick_the_miracle_worker_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem flertad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] com assuntos místicos, mas [CHARACTER.GetShortUINameNoTooltipNoFormat] usa o que [CHARACTER.GetShortUINameNoTooltipNoFormat] aprende para realizar boas ações."
 nick_the_miser:0 "[Select_CString(CHARACTER.IsFemale, 'a Avara', 'o Avaro')]"
 nick_the_miser_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é mesquinho a ponto de incomodar, muito para o desgosto dos servos e parentes."
 nick_the_missionary:0 "[Select_CString( CHARACTER.IsFemale, 'a Missionária', 'o Missionário' )]"
 nick_the_missionary_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] não descansará enquanto houver uma alma não salva pela luz do [CHARACTER.GetFaith.GetName]."
 nick_the_monk:0 "[Select_CString(CHARACTER.IsFemale, 'a Monja', 'o Monge')]"
 nick_the_monk_desc:0 "A aparência religiosa e o estilo de vida regrado fazem de [CHARACTER.GetShortUINameNoTooltipNoFormat] o monge ideal na mente de muitos."
 nick_the_monster:0 "[Select_CString(CHARACTER.IsFemale, 'a Monstra', 'o Monstro')]"
 nick_the_monster_desc:0 "Os camponeses consideram [CHARACTER.GetShortUINameNoTooltipNoFormat] um monstro, um pesadelo sugador de sangue vindo para se alimentar da medula de seus filhos. Esperamos que estejam errados."
 nick_the_mother_culture:0 "a [CHARACTER.GetMother.GetCulture.GetNameNoTooltip]"
 nick_the_mother_culture_desc:0 "O apelido [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] traça a linhagem paterna, não sua própria."
 nick_the_motherfather_of_spain:0 "[Select_CString( CHARACTER.IsFemale, 'a Mãe da Espanha', 'o Pai da Espanha' )]"
 nick_the_motherfather_of_spain_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] casou diversos reinos ibéricos distintos em uma base sólida - a Espanha."
 nick_the_mountain_dweller:0 "o Habitante da Montanha"
 nick_the_mountain_dweller_desc:0 "É raro ver [CHARACTER.GetShortUINameNoTooltipNoFormat] fora de sua casa nas montanhas."
 nick_the_mountain_king:0 "[Select_CString( CHARACTER.IsFemale, 'a Rainha da Montanha', 'o Rei da Montanha' )]"
 nick_the_mountain_king_desc:0 "As majestosas salas de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] são bem-reputadas."
 nick_the_nameless:0 "[Select_CString( CHARACTER.IsFemale, 'a Sem Nome', 'o Sem Nome' )]"
 nick_the_nameless_desc:0 "Quem?"
 nick_the_narrow_minded:0 "[Select_CString(CHARACTER.IsFemale, 'a', 'o')] de Mente Estreita"
 nick_the_narrow_minded_desc:0 "Tudo que é familiar é bom para [CHARACTER.GetShortUINameNoTooltipNoFormat|U], e o oposto também é verdade."
 nick_the_navigator:0 "[Select_CString( CHARACTER.IsFemale, 'a Navegadora', 'o Navegador' )]"
 nick_the_navigator_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um[Select_CString( CHARACTER.IsFemale, 'a', '' )] mestr[Select_CString( CHARACTER.IsFemale, 'a', 'e' )] dos mares, navegando nas ondas como uma serpente marinha."
 nick_the_naysayer:0 "[Select_CString( CHARACTER.IsFemale, 'a Negadora', 'o Negador' )]"
 nick_the_naysayer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ficou diante de [CHARACTER.GetFaith.HighGodName] e do Mundo e traiu um compromisso sagrado que [CHARACTER.GetShortUINameNoTooltipNoFormat] fez."
 nick_the_negotiator:0 "[Select_CString( CHARACTER.IsFemale, 'a Negociadora', 'o Negociador' )]"
 nick_the_negotiator_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um diplomata habilidoso e forjou muitas alianças poderosas."
 nick_the_noble:0 "[Select_CString( CHARACTER.IsFemale, 'a Nobre', 'o Nobre' )]"
 nick_the_noble_desc:0 "Embora haja muitos nobres neste mundo, poucos vivem de acordo com os ideais da palavra como [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_nun:0 "a Freira"
 nick_the_nun_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem um foco piedoso interno, preferindo passar dias em oração silenciosa."
 nick_the_oathbreaker:0 "o Quebra-Juramentos"
 nick_the_oathbreaker_desc:0 "Um[Select_CString(CHARACTER.IsFemale, 'a', '')] [CHARACTER.GetWomanMan] vale tanto quanto a palavra [CHARACTER.GetHerHim]."
 nick_the_obscene:0 "[Select_CString(CHARACTER.IsFemale, 'a Obscena', 'o Obsceno')]"
 nick_the_obscene_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é notório por sua vulgaridade franca e de linguagem chula. A inocência não sobrevive muito tempo ao alcance dos ouvidos."
 nick_the_old:0 "[Select_CString(CHARACTER.IsFemale, 'a Velha', 'o Velho')]"
 nick_the_old_desc:0 "Não é incomum as pessoas cumprimentarem [CHARACTER.GetShortUINameNoTooltipNoFormat] com espanto por [CHARACTER.GetShortUINameNoTooltipNoFormat] ainda estar vivo."
 nick_the_one_eyed:0 "[Select_CString( CHARACTER.IsFemale, 'a de Um Olho', 'o de Um Olho' )]"
 nick_the_one_eyed_desc:0 "$nick_monophthalmos_desc$"
 nick_the_oppressor:0 "[Select_CString( CHARACTER.IsFemale, 'a Opressora', 'o Opressor' )]"
 nick_the_oppressor_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é o governante menos famoso que os seus súditos já tiveram."
 nick_the_overseer:0 "[Select_CString( CHARACTER.IsFemale, 'a Supervisora', 'o Supervisor' )]"
 nick_the_overseer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é notório por sua... atenção rigorosa."
 nick_the_own_culture:0 "[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] [CHARACTER.GetCulture.GetNameNoTooltip]"
 nick_the_own_culture_desc:0 "O epônimo [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] é um rótulo de sua história, algo do qual [CHARACTER.GetShortUINameNoTooltipNoFormat] se orgulha."
 nick_the_pagan:0 "[Select_CString( CHARACTER.IsFemale, 'a Pagã', 'o Pagão' )]"
 nick_the_pagan_desc:0 "A maioria pretende zombar de [CHARACTER.GetShortUINameNoTooltipNoFormat] quando o rotulam assim. Deixe-os. [CHARACTER.GetShortUINameNoTooltipNoFormat] sabe a verdade."
 nick_the_panther_head:0 "a Cabeça de Pantera"
 nick_the_panther_head_desc:0 "Os olhos viscerais, os bigodes eriçados e o rosnar de seu felino ganham mais do que merecido o epíteto de [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_passionate:0 "[Select_CString( CHARACTER.IsFemale, 'a Apaixonada', 'o Apaixonado' )]"
 nick_the_passionate_desc:0 "Amigos e aliados amam a sua determinação, mas detratores acham que [CHARACTER.GetShortUINameNoTooltipNoFormat] precisa se acalmar."
 nick_the_patron_of_arts:0 "[Select_CString( CHARACTER.IsFemale, 'a Patrona das Artes', 'o Patrono das Artes' )]"
 nick_the_patron_of_arts_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é famos[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por patrocinar artistas e artesãos."
 nick_the_peaceful:0 "[Select_CString( CHARACTER.IsFemale, 'a Pacificadora', 'o Pacificador' )]"
 nick_the_peaceful_desc:0 "Não podemos todos apenas nos dar bem?"
 nick_the_peacemaker:0 "[Select_CString( CHARACTER.IsFemale, 'a Pacificadora', 'o Pacificador' )]"
 nick_the_peacemaker_desc:0 "A paz vale qualquer preço."
 nick_the_peacock:0 "o Pavão"
 nick_the_peacock_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é vaidos[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e superficial, e exibe as suas novas roupas como um pássaro do paraíso."
 nick_the_persevering:0 "[Select_CString( CHARACTER.IsFemale, 'a Perseverante', 'o Perseverante' )]"
 nick_the_persevering_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se tornou conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] como [CHARACTER.GetNicknameNoTooltip] após mostrar extrema resiliência apesar das muitas lesões permanentes [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )]."
 nick_the_petulant:0 "[Select_CString( CHARACTER.IsFemale, 'a Petulante', 'o Petulante' )]"
 nick_the_petulant_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é frequentemente insolente e rude, de maneira quase infantil."
 nick_the_philosopher:0 "[Select_CString( CHARACTER.IsFemale, 'a Filósofa', 'o Filósofo' )]"
 nick_the_philosopher_desc:0 "O mundo natural está cheio de curiosidades, mistérios e enigmas, e [CHARACTER.GetShortUINameNoTooltipNoFormat] adora falar sobre eles. Compridamente."
 nick_the_pilgrim:0 "[Select_CString( CHARACTER.IsFemale, 'a Peregrina', 'o Peregrino' )]"
 nick_the_pilgrim_desc:0 "Poucos viajam tão longe ou tão amplamente quanto [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharDoDoes(CHARACTER)], mas [CHARACTER.GetShortUINameNoTooltipNoFormat] sabe que para realmente entender a sua fé, [CHARACTER.GetShortUINameNoTooltipNoFormat] deve experienciá-la, seus lugares mais sagrados e suas muitas expressões."
 nick_the_pious:0 "[Select_CString(CHARACTER.IsFemale, 'a Piedosa', 'o Piedoso')]"
 nick_the_pious_desc:0 "O fervor e dedicação de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] sobre o [CHARACTER.GetFaith.GetName] são considerados sinais de uma devoção intensa e inspiradora."
 nick_the_pious_michael_iii:0 "[Select_CString(CHARACTER.IsFemale, 'a Piedosa', 'o Piedoso')]"
 nick_the_pious_michael_iii_desc:0 "Embora um acidente trágico tenha reclamado sua vida de forma notavelmente precoce, Michael certamente está em alta na graça do Céu por seu papel #EMP crucial#! em acabar com o iconoclasmo."
 nick_the_pirate_king:0 "o Rei Pirata"
 nick_the_pirate_king_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é o terror dos mares, espalhando medo nos corações de todos que ousassem aventurar-se nas águas."
 nick_the_pirate_queen:0 "a Rainha Pirata"
 nick_the_pirate_queen_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é o terror dos mares, espalhando medo nos corações de todos que ousassem aventurar-se nas águas."
 nick_the_plaguebearer:0 "[Select_CString( CHARACTER.IsFemale, 'a Portadora da Peste', 'o Portador da Peste' )]"
 nick_the_plaguebearer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é doente e chei[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] de humores ruins, fazendo com que as pessoas se afastem."
 nick_the_ploughman:0 "[Select_CString(CHARACTER.IsFemale, 'a Aradora', 'o Arador')]"
 nick_the_ploughman_desc:0 "Apenas um humilde fazendeiro na época, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] foi encontrado no seu arado quando os enviados chegaram para convocar-[Select_CString(CHARACTER.IsFemale, 'la', 'lo')] a assumir o trono."
 nick_the_plump:0 "[Select_CString( CHARACTER.IsFemale, 'a Rechonchuda', 'o Rechonchudo' )]"
 nick_the_plump_desc:0 "A maioria das pessoas chama [CHARACTER.GetSheHe] de $nick_the_plump$, porque há tanto de [CHARACTER.GetShortUINameNoTooltipNoFormat] para amar."
 nick_the_poet:0 "[Select_CString( CHARACTER.IsFemale, 'a Poeta', 'o Poeta' )]"
 nick_the_poet_desc:0 "Onde quer que [CHARACTER.GetShortUINameNoTooltipNoFormat] vá, o som de uma caneta riscando desajeitadamente rimas e versos segue logo atrás."
 nick_the_poetaster:0 "[Select_CString(CHARACTER.IsFemale, 'a Poetastra', 'o Poetastro')]"
 nick_the_poetaster_desc:0 "A poesia de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] é famosa, mas talvez não exatamente pela razão que gostaria."
 nick_the_polyanitsa:0 "[Select_CString( CHARACTER.IsFemale, 'a Polyanitsa', 'o Polyanitsa' )]"
 nick_the_polyanitsa_desc:0 "$nick_the_bogatyr_desc$"
 nick_the_pragmatic:0 "[Select_CString( CHARACTER.IsFemale, 'a Pragmática', 'o Pragmático' )]"
 nick_the_pragmatic_desc:0 "A melhor solução é a mais apropriada para o momento."
 nick_the_prisoner:0 "o Prisioneiro"
 nick_the_prisoner_desc:0 "A vida de [CHARACTER.GetShortUINameNoTooltipNoFormat] foi marcada pela ignominiosa captura e prisão de [CHARACTER.GetHerHis] pelas mãos de [CHARACTER.GetHerHis] inimigos."
 nick_the_prodigy:0 "[Select_CString( CHARACTER.IsFemale, 'a Prodigiosa', 'o Prodigioso' )]"
 nick_the_prodigy_desc:0 "Um polímata renomado, [CHARACTER.GetShortUINameNoTooltipNoFormat] demonstra uma habilidade imensa em praticamente tudo o que [CHARACTER.GetShortUINameNoTooltipNoFormat] coloca em sua mente."
 nick_the_prophet:0 "[Select_CString( CHARACTER.IsFemale, 'a Profeta', 'o Profeta' )]"
 nick_the_prophet_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um ícone religioso de renome."
 nick_the_proud:0 "[Select_CString(CHARACTER.IsFemale, 'a Orgulhosa', 'o Orgulhoso')]"
 nick_the_proud_desc:0 "A maioria dos nobres aprende a manter as costas retas o tempo todo, mas poucos transformam isso em um ponto de orgulho como [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_quarreller:0 "[Select_CString(CHARACTER.IsFemale, 'a Briguenta', 'o Briguento')]"
 nick_the_quarreller_desc:0 "É considerado sábio não iniciar uma conversa com [CHARACTER.GetShortUINameNoTooltipNoFormat] a menos que você tenha algumas horas sobrando. Às vezes, dias."
 nick_the_quarrelsome:0 "[Select_CString( CHARACTER.IsFemale, 'a Briguenta', 'o Briguento' )]"
 nick_the_quarrelsome_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem muitos rivais e ama brigar com todos eles."
 nick_the_quick:0 "[Select_CString( CHARACTER.IsFemale, 'a Rápida', 'o Rápido' )]"
 nick_the_quick_desc:0 "Rápido de raciocínio, rápido de corpo."
 nick_the_quick_ironic:0 "$nick_the_quick$"
 nick_the_quick_ironic_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] diz às pessoas que é porque [CHARACTER.GetShortUINameNoTooltipNoFormat] é perspicaz. Não é."
 nick_the_rash:0 "[Select_CString( CHARACTER.IsFemale, 'a Impulsiva', 'o Impulsivo' )]"
 nick_the_rash_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] pensa de [CharYourHerHimself(CHARACTER)] como direto, mas o mundo em geral vê [CHARACTER.GetShortUINameNoTooltipNoFormat] como descuidado e apressado."
 nick_the_real:0 "[Select_CString( CHARACTER.IsFemale, 'A Verdadeira', 'O Verdadeiro' )]"
 nick_the_real_desc:0 "Pessoas em todos os lugares conhecem a história de [CHARACTER.GetShortUINameNoTooltipNoFormat] enfrentando seu #EMP maligno#! doppelganger."
 nick_the_recluse:0 "[Select_CString( CHARACTER.IsFemale, 'a Reclusa', 'o Recluso' )]"
 nick_the_recluse_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] frequentemente se isola longe de qualquer olhar curioso."
 nick_the_red:0 "[Select_CString( CHARACTER.IsFemale, 'a Ruiva', 'o Ruivo' )]"
 nick_the_red_desc:0 "Seja pelo cabelo vermelho-fogo de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] ou pela pele ainda mais pálida, as pessoas frequentemente comentam sobre isso. Com frequência tediosa, na sua experiência."
 nick_the_reformer:0 "[Select_CString(CHARACTER.IsFemale, 'a Reformadora', 'o Reformador')]"
 nick_the_reformer_desc:0 "[CHARACTER.GetPrimaryTitle.GetBaseNameNoTier] foi transformado e os [CHARACTER.GetCulture.GetCollectiveNoun] iluminados pelo governo audacioso e perspicaz de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]."
 nick_the_rekindler_of_iran:0 "a Chama da Pérsia"
 nick_the_rekindler_of_iran_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] restaurou a independência persa após séculos de hegemonia árabe."
 nick_the_repulsive:0 "[Select_CString( CHARACTER.IsFemale, 'a Repulsiva', 'o Repulsivo' )]"
 nick_the_repulsive_desc:0 "A superlotação raramente é um problema quando [CHARACTER.GetShortUINameNoTooltipNoFormat] está por perto."
 nick_the_requiem:0 "[Select_CString( CHARACTER.IsFemale, 'a Réquiem', 'o Réquiem' )]"
 nick_the_requiem_desc:0 "E que melodia foi essa."
 nick_the_resilient:0 "[Select_CString( CHARACTER.IsFemale, 'a Resiliente', 'o Resiliente' )]"
 nick_the_resilient_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se tornou conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] como [CHARACTER.GetNicknameNoTooltip] após mostrar extrema resiliência apesar das muitas lesões permanentes [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )]."
 nick_the_restorer:0 "[Select_CString(CHARACTER.IsFemale, 'a Restauradora', 'o Restaurador')]"
 nick_the_restorer_desc:0 "Quando o reino parecia perdido na escuridão, #EMP [CHARACTER.GetShortUINameNoTooltipNoFormat]#! surgiu para trazê-lo de volta à luz."
 nick_the_rhymer:0 "[Select_CString(CHARACTER.IsFemale, 'a Rímadora', 'o Rímador')]"
 nick_the_rhymer_desc:0 "Armado com um olhar para aliterações e parelhas que combinam, [CHARACTER.GetShortUINameNoTooltipNoFormat] é admirado por seus pares pela habilidade ágil no uso de versos."
 nick_the_rich:0 "o Rico"
 nick_the_rich_desc:0 "Histórias da vasta fortuna e dos hábitos de gastos opulentos de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] precedem [CHARACTER.GetHerHim]."
 nick_the_righteous:0 "[Select_CString( CHARACTER.IsFemale, 'a Justa', 'o Justo' )]"
 nick_the_righteous_caliph:0 "[Select_CString( CHARACTER.IsFemale, 'a Justa', 'o Justo' )]"
 nick_the_righteous_caliph_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido por ser justo e íntegro aos olhos de [CHARACTER.GetFaith.HighGodNameAlternate]"
 nick_the_righteous_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por ter um forte senso de justiça e equidade."
 nick_the_rotund:0 "[Select_CString( CHARACTER.IsFemale, 'a Redonda', 'o Redondo' )]"
 nick_the_rotund_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é quase tão larg[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] quanto [CHARACTER.GetShortUINameNoTooltipNoFormat] é alt[Select_CString( CHARACTER.IsFemale, 'a', 'o' )], praticamente esféric[Select_CString( CHARACTER.IsFemale, 'a', 'o' )]!"
 nick_the_ruthless:0 "[Select_CString(CHARACTER.IsFemale, 'a Implacável', 'o Implacável')]"
 nick_the_ruthless_desc:0 "Não todos têm a força para fazer o que precisa ser feito. Não todos, mas [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharDoDoes(CHARACTER)]."
 nick_the_sage:0 "[Select_CString( CHARACTER.IsFemale, 'a Sábia', 'o Sábio' )]"
 nick_the_sage_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é erudito e mais do que disposto a transmitir conhecimento aos jovens."
 nick_the_saint:0 "[Select_CString(CHARACTER.IsFemale, 'a Santa', 'o Santo')]"
 nick_the_saint_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ficou registrado na história do [CHARACTER.GetFaith.GetName] como um dos seus mais abençoados seguidores. Sempre."
 nick_the_saoshyant:0 "[Select_CString( CHARACTER.IsFemale, 'a Saoshyant', 'o Saoshyant' )]"
 nick_the_saoshyant_desc:0 "Quando todo o mundo parecia engolido por [CHARACTER.GetFaith.DevilName], [CHARACTER.GetShortUINameNoTooltipNoFormat] foi lá para restaurar a Luz."
 nick_the_savage:0 "[Select_CString( CHARACTER.IsFemale, 'a Selvagem', 'o Selvagem' )]"
 nick_the_savage_desc:0 "Não há nada e ninguém que [CHARACTER.GetShortUINameNoTooltipNoFormat] hesitaria em desmembrar. Homem, mulher, criança, cachorro — [CHARACTER.GetShortUINameNoTooltipNoFormat] mataria todos eles, e deixaria [CHARACTER.GetFaith.HighGodName] resolver o resto."
 nick_the_scholar:0 "[Select_CString(CHARACTER.IsFemale, 'a Erudita', 'o Erudito')]"
 nick_the_scholar_desc:0 "A sabedoria e o conhecimento de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] fazem parte do currículo de muitas academias eruditas."
 nick_the_scourge_of_the_northerners:0 "o Flagelo dos Habitantes do Norte"
 nick_the_scourge_of_the_northerners_desc:0 "Eles vêm para as suas terras em busca de escravos e pilhagem. O dinamarquês, o norueguês, o sueco. [CHARACTER.GetShortUINameNoTooltipNoFormat] dão a eles apenas uma morte rápida e uma eternidade em [CHARACTER.GetFaith.random_NegativeAfterLife]."
 nick_the_scribe:0 "o Escriba"
 nick_the_scribe_desc:0 "A mão de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] copiou, traduziu e registrou sabedorias que são honradas em toda a terra."
 nick_the_sea_king:0 "[Select_CString( CHARACTER.IsFemale, 'a Rainha dos Mares', 'o Rei dos Mares' )]"
 nick_the_sea_king_desc:0 "É o seu jeito saquear e pilhar, pegar o que [CHARACTER.GetShortUINameNoTooltipNoFormat] quer de quem [CHARACTER.GetShortUINameNoTooltipNoFormat] quer. [CHARACTER.GetShortUINameNoTooltipNoFormat] se recusa a mudar suas maneiras nisso, ou permitir que seu povo mude as deles."
 nick_the_seducer:0 "o Sedutor"
 nick_the_seducer_desc:0 "$nick_the_seductress_desc$"
 nick_the_seductress:0 "a Sedutora"
 nick_the_seductress_desc:0 "Um sorriso diz mil palavras - palavras que provavelmente não poderiam ser ditas em uma companhia educada."
 nick_the_seer:0 "[Select_CString( CHARACTER.IsFemale, 'a Vidente', 'o Vidente' )]"
 nick_the_seer_desc:0 "Ver é acreditar, mas aqueles que não conseguem se ver precisam recorrer a alguém como [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_selfish:0 "[Select_CString( CHARACTER.IsFemale, 'a Egoísta', 'o Egoísta' )]"
 nick_the_selfish_desc:0 "O mundo inteiro sabe que [CHARACTER.GetShortUINameNoTooltipNoFormat] não pensa em mais ninguém além de #EMP [CharYourHerHimself(CHARACTER)]#!."
 nick_the_shadow:0 "[Select_CString(CHARACTER.IsFemale, 'a Sombra', 'o Sombra')]"
 nick_the_shadow_desc:0 "Rumor tem isso que onde quer que a escuridão caia, [CHARACTER.GetShortUINameNoTooltipNoFormat] tem um ouvido."
 nick_the_shadow_riad:0 "$nick_the_shadow$"
 nick_the_shadow_riad_desc:0 "$nick_the_legend_riad_desc$"
 nick_the_shepherd:0 "[Select_CString( CHARACTER.IsFemale, 'a Pastora', 'o Pastor' )]"
 nick_the_shepherd_desc:0 "Não importa para onde os Escolhidos de Deus vaguem, [CHARACTER.GetShortUINameNoTooltipNoFormat] os ajuda a voltar em segurança para casa."
 nick_the_shield_of_capital:0 "o Escudo de [CHARACTER.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 nick_the_shield_of_capital_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um guerreiro firme que é amad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] pelo povo da capital [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )]."
 nick_the_short:0 "[Select_CString( CHARACTER.IsFemale, 'a Baixinha', 'o Baixinho' )]"
 nick_the_short_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é de estatura baixa, o que todos logo apontam."
 nick_the_shrewd:0 "[Select_CString(CHARACTER.IsFemale, 'a Astuta', 'o Astuto')]"
 nick_the_shrewd_desc:0 "É sábio nunca jogar contra [CHARACTER.GetShortUINameNoTooltipNoFormat] - poucas pessoas podem ter certeza do que [CHARACTER.GetShortUINameNoTooltipNoFormat] esconde na manga."
 nick_the_shy:0 "[Select_CString( CHARACTER.IsFemale, 'a Tímida', 'o Tímido' )]"
 nick_the_shy_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é tão raramente visto que seu epônimo é tudo o que a maioria sabe sobre [CHARACTER.GetSheHe]."
 nick_the_silent:0 "[Select_CString(CHARACTER.IsFemale, 'a Silenciosa', 'o Silencioso')]"
 nick_the_silent_desc:0 "O silêncio é ouro, e [CHARACTER.GetShortUINameNoTooltipNoFormat] tem uma grande quantidade dele."
 nick_the_silly:0 "[Select_CString( CHARACTER.IsFemale, 'a Boba', 'o Bobo' )]"
 nick_the_silly_desc:0 "O que quer que os outros digam sobre [CHARACTER.GetShortUINameNoTooltipNoFormat], [CHARACTER.GetShortUINameNoTooltipNoFormat] nunca leva a vida #EMP muito#! a sério."
 nick_the_silver_tongue:0 "Língua de Prata"
 nick_the_silver_tongue_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem um dom com as palavras que poucos outros possuem, e é capaz de virar a maioria das situações a seu favor."
 nick_the_simple:0 "[Select_CString(CHARACTER.IsFemale, 'a Simples', 'o Simples')]"
 nick_the_simple_desc:0 "Os pensamentos de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] podem ser melhor descritos como 'abençoadamente desimpedidos'."
 nick_the_slayer_of_the_snake:0 "[Select_CString( CHARACTER.IsFemale, 'a Matadora da Serpente', 'o Matador da Serpente' )]"
 nick_the_slayer_of_the_snake_desc:0 "Originalmente de Bagdá, [CHARACTER.GetShortUINameNoTooltipNoFormat] matou a poderosa serpente Sarki, causadora do terrível período de seca, para conquistar a mão da Rainha de Daura."
 nick_the_sleeper:0 "[Select_CString( CHARACTER.IsFemale, 'a Dorminhoca', 'o Dorminhoco' )]"
 nick_the_sleeper_desc:0 "As pessoas frequentemente comentam que [CHARACTER.GetShortUINameNoTooltipNoFormat] talvez fosse mais feliz como um gato doméstico."
 nick_the_sleeping_king:0 "[Select_CString( CHARACTER.IsFemale, 'a Rainha Adormecida', 'o Rei Adormecido' )]"
 nick_the_sleeping_king_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] passa o dia e a noite na cama, provocando especulações de seus súditos. Talvez seja uma maldição?"
 nick_the_slobberer:0 "[Select_CString( CHARACTER.IsFemale, 'a Babona', 'o Babão' )]"
 nick_the_slobberer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem dificuldade para comer com dignidade em eventos diplomáticos."
 nick_the_slow:0 "[Select_CString( CHARACTER.IsFemale, 'a Lenta', 'o Lento' )]"
 nick_the_slow_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] não é a pessoa mais brilhante que a corte já viu."
 nick_the_sluggard:0 "[Select_CString( CHARACTER.IsFemale, 'a Preguiçosa', 'o Preguiçoso' )]"
 nick_the_sluggard_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] leva o tempo que quiser para fazer #EMP qualquer coisa#!..."
 nick_the_sly:0 "[Select_CString( CHARACTER.IsFemale, 'a Astuta', 'o Astuto' )]"
 nick_the_sly_desc:0 "Hmm? Ah, esse olhar? Não é nada. Não se preocupe com isso."
 nick_the_smelly:0 "[Select_CString( CHARACTER.IsFemale, 'a Fedida', 'o Fedido' )]"
 nick_the_smelly_desc:0 "De alguma forma, de alguma maneira, #EMP ainda#! perdura."
 nick_the_snorer:0 "[Select_CString( CHARACTER.IsFemale, 'a Roncadora', 'o Roncador' )]"
 nick_the_snorer_desc:0 "Se [CHARACTER.GetShortUINameNoTooltipNoFormat] ronca ou não é motivo de especulação ociosa, mas quando [CHARACTER.GetShortUINameNoTooltipNoFormat] está em casa, a corte certamente está repleta disso."
 nick_the_spear_of_capital:0 "a Lança de [CHARACTER.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 nick_the_spear_of_capital_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um[Select_CString( CHARACTER.IsFemale, 'a', '' )] modelo de luta com lança."
 nick_the_spider:0 "[Select_CString(CHARACTER.IsFemale, 'a Aranha', 'o Aranha')]"
 nick_the_spider_desc:0 "Tenha cuidado na corte, dizem. Onde quer que você vá, você encontrará $nick_the_spider$."
 nick_the_springer:0 "o Saltador"
 nick_the_springer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] é conhecido por uma fuga dramática, saltando de uma janela alta para escapar [CHARACTER.GetHerHis] prisão."
 nick_the_stallion:0 "[Select_CString( CHARACTER.IsFemale, 'a Garanhona', 'o Garanhão' )]"
 nick_the_stallion_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é forte, atlético... e frequentemente olhad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] com olhos cobiçosos."
 nick_the_stalwart:0 "[Select_CString( CHARACTER.IsFemale, 'a Inabalável', 'o Inabalável' )]"
 nick_the_stalwart_desc:0 "Não importa a tempestade, não importa quantas lâminas estejam no ar ou quantas sepulturas no chão, [CHARACTER.GetShortUINameNoTooltipNoFormat] resistirá. [CHARACTER.GetShortUINameNoTooltipNoFormat] tem que fazê-lo."
 nick_the_stammerer:0 "[Select_CString(CHARACTER.IsFemale, 'a Gaga', 'o Gago')]"
 nick_the_stammerer_desc:0 "Embora a fraseologia [CHARACTER.GetHerHim] possa ser eloquente, a forma como [CharYourSheHe(CHARACTER)] se expressa deixa muito a desejar."
 nick_the_stonefaced:0 "o Rosto de Pedra"
 nick_the_stonefaced_desc:0 "Dê um sorriso. Por favor? Apenas uma vez?"
 nick_the_stout:0 "[Select_CString(CHARACTER.IsFemale, 'a Robusta', 'o Robusto')]"
 nick_the_stout_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] é largo de corpo e robusto de estrutura."
 nick_the_strange:0 "[Select_CString( CHARACTER.IsFemale, 'a Estranha', 'o Estranho' )]"
 nick_the_strange_desc:0 "Embora seus súditos não achem [CharYouSheHe(CHARACTER)|U] mal, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem passatempos... excêntricos."
 nick_the_stranger:0 "[Select_CString(CHARACTER.IsFemale, 'a Estrangeira', 'o Estrangeiro')]"
 nick_the_stranger_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] chegou ao reino [CHARACTER.GetHerHim] vindo de muito longe - até hoje, muitos dos seus maneirismos ainda são estranhos e estrangeiros."
 nick_the_strong:0 "[Select_CString(CHARACTER.IsFemale, 'a Forte', 'o Forte')]"
 nick_the_strong_desc:0 "O mundo em geral considera [CHARACTER.GetSheHe] capaz de quebrar rochas. Com os dentes."
 nick_the_stud:0 "[Select_CString( CHARACTER.IsFemale, 'a Garanhona', 'o Garanhão' )]"
 nick_the_stud_desc:0 "A aparência de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] já deu #EMP ideias#!."
 nick_the_stumbler:0 "[Select_CString( CHARACTER.IsFemale, 'a Tropeçadora', 'o Tropeçador' )]"
 nick_the_stumbler_desc:0 "Palavras e pés têm a tendência de atrapalhar [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_stupor_mundi:0 "Stupor Mundi"
 nick_the_stupor_mundi_desc:0 "Talvez seja um pouco arrogante, mas... o que mais [CHARACTER.GetShortUINameNoTooltipNoFormat] é, se não a Maravilha do Mundo?"
 nick_the_stutterer:0 "[Select_CString( CHARACTER.IsFemale, 'a Gaga', 'o Gago' )]"
 nick_the_stutterer_desc:0 "As pessoas parecem se deliciar em lembrar [CHARACTER.GetShortUINameNoTooltipNoFormat] de algumas palavras tropeçadas."
 nick_the_stylite:0 "[Select_CString(CHARACTER.IsFemale, 'a', 'o')] Estilita"
 nick_the_stylite_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomado por viver asceticamente no topo de uma coluna."
 nick_the_sword_of_god:0 "a Espada de Deus"
 nick_the_sword_of_god_desc:0 "Como a arma escolhida do Senhor justo, [CHARACTER.GetShortUINameNoTooltipNoFormat] esculpiu $e_outremer$ das terras dos infiéis."
 nick_the_tactician:0 "[Select_CString( CHARACTER.IsFemale, 'a Estrategista', 'o Estrategista' )]"
 nick_the_tactician_desc:0 "Estratégia pode exigir astúcia, mas táticas exigem sagacidade."
 nick_the_tall:0 "[Select_CString(CHARACTER.IsFemale, 'a Alta', 'o Alto')]"
 nick_the_tall_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é longilíneo de pernas e braços, sua altura prodigiosa frequentemente invejada por aqueles menos verticalmente abençoados."
 nick_the_tattooed_monk:0 "[Select_CString( CHARACTER.IsFemale, 'a Monge Tatuada', 'o Monge Tatuado' )]"
 nick_the_tattooed_monk_desc:0 "A força prodigiosa de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] pode ser lendária, mas [CHARACTER.GetShortUINameNoTooltipNoFormat] fica feliz que as pessoas pensem primeiro nas suas tatuagens decorativas."
 nick_the_temple_builder:0 "[Select_CString(CHARACTER.IsFemale, 'a Construtora de Templos', 'o Construtor de Templos')]"
 nick_the_temple_builder_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] está mostrando sua dedicação a um plano superior ao construir monumentos na terra."
 nick_the_temptress:0 "[Select_CString(CHARACTER.IsFemale, 'a Tentadora', 'a Tentador')]"
 nick_the_temptress_desc:0 "Com o seu dedo torto, nobres e plebeus são capturados igualmente."
 nick_the_terrible:0 "[Select_CString( CHARACTER.IsFemale, 'a Terrível', 'o Terrível' )]"
 nick_the_terrible_desc:0 "Crianças choram, camponeses tremem e o leite azeda quando [CHARACTER.GetShortUINameNoTooltipNoFormat] passa. Supostamente."
 nick_the_theologian:0 "[Select_CString( CHARACTER.IsFemale, 'a Teóloga', 'o Teólogo' )]"
 nick_the_theologian_desc:0 "Para que serve a vida se não para explorar a verdadeira natureza de [CHARACTER.GetFaith.CreatorName]?"
 nick_the_thoughtless:0 "[Select_CString( CHARACTER.IsFemale, 'a Descuidada', 'o Descuidado' )]"
 nick_the_thoughtless_desc:0 "Dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharDontDoesnt(CHARACTER)|U] fala antes de [CHARACTER.GetShortUINameNoTooltipNoFormat] pensar - [CHARACTER.GetShortUINameNoTooltipNoFormat] simplesmente não [CharDontDoesnt(CHARACTER)|U] pensa de forma alguma."
 nick_the_thunderbolt:0 "o Relâmpago"
 nick_the_thunderbolt_desc:0 "O senso comum diz que os seus inimigos só o ouvem após [CHARACTER.GetShortUINameNoTooltipNoFormat] já ter atacado."
 nick_the_tiger_of_place:0 "[Select_CString( CHARACTER.IsFemale, 'a Tigresa', 'o Tigre' )] de [CHARACTER.GetCapitalLocation.GetTitle.GetBaseNameNoTierNoTooltip]"
 nick_the_tiger_of_place_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um[Select_CString( CHARACTER.IsFemale, 'a', '' )] guerreir[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] temid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e valente defensor."
 nick_the_timely_rain:0 "a Chuva Oportuna"
 nick_the_timely_rain_desc:0 "A generosidade de seu espírito e o respeito em sua atitude creditam muito a [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_timid:0 "[Select_CString( CHARACTER.IsFemale, 'a Tímida', 'o Tímido' )]"
 nick_the_timid_desc:0 "De temperamento ameno, até assustado, [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharDontDoesnt(CHARACTER)] lida bem com o confronto direto."
 nick_the_tormentor:0 "[Select_CString(CHARACTER.IsFemale, 'a Torturadora', 'o Torturador')]"
 nick_the_tormentor_desc:0 "A maioria preferiria morrer na lâmina de um oficial de justiça do que se permitir ser levado às suas masmorras."
 nick_the_toxophilite:0 "[Select_CString( CHARACTER.IsFemale, 'a Toxofilita', 'o Toxofilita' )]"
 nick_the_toxophilite_desc:0 "Arcos, projéteis, balistas - há pouco sobre a arte do combate direto à distância que [CHARACTER.GetShortUINameNoTooltipNoFormat] não pode encontrar entusiasmo."
 nick_the_traitor:0 "[Select_CString( CHARACTER.IsFemale, 'a Traidora', 'o Traidor' )]"
 nick_the_traitor_desc:0 "A palavra de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] vale tanto quanto o ar que é carregado."
 nick_the_transcriber:0 "[Select_CString( CHARACTER.IsFemale, 'a Transcritora', 'o Transcritor' )]"
 nick_the_transcriber_desc:0 "O conhecimento depende da transmissão, e que instrumentos melhores para isso existem do que livros e pergaminhos que podem ser lidos por gerações?"
 nick_the_trembling:0 "[Select_CString( CHARACTER.IsFemale, 'a Tremelicante', 'o Tremelicante' )]"
 nick_the_trembling_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] não pode ser considerado conhecido por charme ousado ou cargas audaciosas, infelizmente."
 nick_the_trickster:0 "[Select_CString( CHARACTER.IsFemale, 'a Trapaceira', 'o Trapaceiro' )]"
 nick_the_trickster_desc:0 "Será que #EMP [CHARACTER.GetShortUINameNoTooltipNoFormat]#! realmente conta mentiras descaradas como os contos que os outros contam sobre [CHARACTER.GetSheHe]?"
 nick_the_triumphant:0 "[Select_CString( CHARACTER.IsFemale, 'a Triunfante', 'o Triunfante' )]"
 nick_the_triumphant_desc:0 "Quando o mundo trouxe um campeão que alegou ser invencível, [CHARACTER.GetShortUINameNoTooltipNoFormat] o derrubou e desfez sua lenda."
 nick_the_trojan:0 "[Select_CString( CHARACTER.IsFemale, 'a Troiana', 'o Troiano' )]"
 nick_the_trojan_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] rivalizou com as façanhas do antigo Corineus, revivendo o verdadeiro herdeiro de Troia — Dumnonia."
 nick_the_troubadour:0 "[Select_CString(CHARACTER.IsFemale, 'a Trovadora', 'o Trovador')]"
 nick_the_troubadour_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por sua bela voz de cantor[Select_CString( CHARACTER.IsFemale, 'a', '' )] e inclinação para a música. Pelo menos, pelos que gostam [CHARACTER.GetHerHim]."
 nick_the_true_culture:0 "o Verdadeiro [CHARACTER.GetCulture.GetNameNoTooltip]"
 nick_the_true_culture_desc:0 "Um forte defensor e incansável defensor, preferindo sempre os caminhos e costumes [CHARACTER.GetCulture.GetName]."
 nick_the_trustworthy:0 "[Select_CString( CHARACTER.IsFemale, 'a Confiável', 'o Confiável' )]"
 nick_the_trustworthy_desc:0 "Sólido, confiável, encantadoramente sincero - embora chocantemente ingênuo para os seus inimigos."
 nick_the_trustworthy_ironic:0 "$nick_the_trustworthy$"
 nick_the_trustworthy_ironic_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] literalmente nunca disse uma mentira em toda sua vida."
 nick_the_truthseeker:0 "[Select_CString( CHARACTER.IsFemale, 'a Buscadora da Verdade', 'o Buscador da Verdade' )]"
 nick_the_truthseeker_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é bem conhecido por buscar a verdade, não importa onde ela o leve e qual seja o custo."
 nick_the_truthspeaker:0 "[Select_CString( CHARACTER.IsFemale, 'a Faladora da Verdade', 'o Falador da Verdade' )]"
 nick_the_truthspeaker_desc:0 "Não importa a gravidade do assunto, as pessoas sabem que podem contar com a sua honestidade e integridade."
 nick_the_tuatha_de_danann:0 "[Select_CString( CHARACTER.IsFemale, 'a Tuatha Dé Danann', 'o Tuatha Dé Danann' )]"
 nick_the_tuatha_de_danann_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se apoiou em antigas lendas para reivindicar a Britânia."
 nick_the_turbulent:0 "[Select_CString( CHARACTER.IsFemale, 'a Turbulenta', 'o Turbulento' )]"
 nick_the_turbulent_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é instruíd[Select_CString( CHARACTER.IsFemale, 'a', 'o' )], mas dramátic[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] tanto em comportamento quanto em opinião."
 nick_the_turbulent_river_dragon:0 "o Dragão Turbulento dos Rios"
 nick_the_turbulent_river_dragon_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] se sente em casa na água e nas terras alagadas como um... dragão."
 nick_the_tyrant:0 "[Select_CString( CHARACTER.IsFemale, 'a Tirana', 'o Tirano' )]"
 nick_the_tyrant_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] #EMP é#! o reino, e quem discordar aprenderá o que o reino faz com traidores."
 nick_the_unchaste:0 "[Select_CString(CHARACTER.IsFemale, 'a Impura', 'o Impuro')]"
 nick_the_unchaste_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é considerad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] um[Select_CString( CHARACTER.IsFemale, 'a', '' )] libertin[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] fora do casamento."
 nick_the_undefeated:0 "[Select_CString( CHARACTER.IsFemale, 'a Invicta', 'o Invicto' )]"
 nick_the_undefeated_desc:0 "Completamente, totalmente invicto em batalha, [CHARACTER.GetShortUINameNoTooltipNoFormat] nunca provou o amargo gosto da derrota ignominiosa."
 nick_the_understanding:0 "[Select_CString( CHARACTER.IsFemale, 'a Compreensiva', 'o Compreensivo' )]"
 nick_the_understanding_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é compassiv[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e racional, e aconselha de boa vontade aqueles que precisam."
 nick_the_undying:0 "[Select_CString( CHARACTER.IsFemale, 'a Imortal', 'o Imortal' )]"
 nick_the_undying_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] deveria, por todas as contas, estar doente, mas está tremendamente saudável."
 nick_the_unfaithful:0 "[Select_CString(CHARACTER.IsFemale, 'a Infiel', 'o Infiel')]"
 nick_the_unfaithful_desc:0 "Votos de casamento são mais como... diretrizes de casamento, na sua opinião"
 nick_the_unfortunate:0 "[Select_CString(CHARACTER.IsFemale, 'a Infeliz', 'o Infeliz')]"
 nick_the_unfortunate_desc:0 "Algo sobre a própria existência de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat]... é infeliz. Estar na sombra da sua bandeira é conhecer a inquietação."
 nick_the_unifier_of_africa:0 "[Select_CString( CHARACTER.IsFemale, 'a Unificadora da África', 'o Unificador da África' )]"
 nick_the_unifier_of_africa_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é a primeira pessoa na história a unir toda a África conhecida sob sua bandeira."
 nick_the_universal_spider:0 "a Aranha Universal"
 nick_the_universal_spider_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ama tecer intricadas teias de tramas e conspirações."
 nick_the_unlucky:0 "[Select_CString( CHARACTER.IsFemale, 'a Azarada', 'o Azarado' )]"
 nick_the_unlucky_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] simplesmente não parece conseguir um descanso, desde o nascimento [CHARACTER.GetShortUINameNoTooltipNoFormat] tem sido seguid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por infortúnios."
 nick_the_unready:0 "[Select_CString(CHARACTER.IsFemale, 'a Despreparada', 'o Despreparado')]"
 nick_the_unready_anglo_saxon:0 "$nick_the_unready$"
 nick_the_unready_anglo_saxon_desc:0 "Seu nome é traduzido literalmente como 'Conselheiro Nobre'. Causa a [CHARACTER.GetSheHe] uma boa dose de irritação ser chamado de $E_thelrE_d$-Unræd, ou 'Conselheiro Nobre-Sem Conselho'. Presumivelmente porque alguém achou o trocadilho engraçado."
 nick_the_unready_desc:0 "É raro um conflito ou discussão que não seja completamente avassalador[Select_CString( CHARACTER.IsFemale, 'a', '' )] para [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_unrelenting:0 "[Select_CString( CHARACTER.IsFemale, 'a Implacável', 'o Implacável' )]"
 nick_the_unrelenting_desc:0 "Quando [CHARACTER.GetShortUINameNoTooltipNoFormat] decide algo, [CHARACTER.GetShortUINameNoTooltipNoFormat] o alcança. Não importa quanto tempo leve."
 nick_the_unrestrained:0 "[Select_CString( CHARACTER.IsFemale, 'a Irrestrita', 'o Irrestrito' )]"
 nick_the_unrestrained_desc:0 "O apelido de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] é tanto um comentário sobre sua língua solta quanto sobre sua capacidade de superar os captores."
 nick_the_unworthy:0 "[Select_CString( CHARACTER.IsFemale, 'a Indigna', 'o Indigno' )]"
 nick_the_unworthy_desc:0 "Um fracasso como [CHARACTER.GetWomanMan], na teoria e na prática."
 nick_the_usurper:0 "[Select_CString(CHARACTER.IsFemale, 'a Usurpadora', 'o Usurpador')]"
 nick_the_usurper_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] derrubou o senhor feudal legítimo do seu reino, tomando o que deveria ter sido seu à força da espada."
 nick_the_vain:0 "[Select_CString( CHARACTER.IsFemale, 'a Vaidosa', 'o Vaidoso' )]"
 nick_the_vain_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é vist[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] pelos súditos como terrivelmente superficial e fútil."
 nick_the_valiant:0 "[Select_CString( CHARACTER.IsFemale, 'a Valente', 'o Valente' )]"
 nick_the_valiant_desc:0 "Um líder que não lidera na linha de frente não é líder de verdade."
 nick_the_vanquisher:0 "[Select_CString( CHARACTER.IsFemale, 'a Vencedora', 'o Vencedor' )]"
 nick_the_vanquisher_desc:0 "Deixe qualquer um que desejar se opor a [CHARACTER.GetShortUINameNoTooltipNoFormat] — [CHARACTER.GetShortUINameNoTooltipNoFormat] é a foice de [CHARACTER.GetFaith.DeathDeityName]."
 nick_the_venator:0 "[Select_CString( CHARACTER.IsFemale, 'a Caçadora', 'o Caçador' )]"
 nick_the_venator_desc:0 "Nenhum mero animal pode escapar dos instintos de caça afiados [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )]."
 nick_the_venerable:0 "[Select_CString( CHARACTER.IsFemale, 'a Venerável', 'o Venerável' )]"
 nick_the_venerable_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem passad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] de uma maneira nobre, conquistando a confiança [CHARACTER.GetHerHim]."
 nick_the_victorious:0 "[Select_CString(CHARACTER.IsFemale, 'a Vitoriosa', 'o Vitorioso')]"
 nick_the_victorious_desc:0 "A vitória vem naturalmente para [CHARACTER.GetShortUINameNoTooltipNoFormat], e o mundo concorda."
 nick_the_viking:0 "[Select_CString(CHARACTER.IsFemale, 'a Viking', 'o Viking')]"
 nick_the_viking_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] sempre acreditou que a propriedade é um conceito mais maleável do que a maioria das pessoas."
 nick_the_virgin:0 "a Virgem"
 nick_the_virgin_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] a mãe de Jesus Cristo e a Rainha do Céu. $pam_luke_1_42_default_short$"
 nick_the_wake:0 "[Select_CString( CHARACTER.IsFemale, 'a Vigilante', 'o Vigilante' )]"
 nick_the_wake_desc:0 "[CHARACTER.Custom('EyeEyes')|U] sempre atentos à injustiça, conquistadores estrangeiros e traidores nativos tremem apenas com a menção do seu nome."
 nick_the_wary:0 "[Select_CString( CHARACTER.IsFemale, 'a Cautelosa', 'o Cauteloso' )]"
 nick_the_wary_desc:0 "Os olhos rápidos e a expressão suspeita [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] são as coisas que as pessoas mais lembram sobre [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_weak:0 "[Select_CString( CHARACTER.IsFemale, 'a Fraca', 'o Fraco' )]"
 nick_the_weak_desc:0 "Certas crianças fanfarronas acham que poderiam lutar com [CHARACTER.GetShortUINameNoTooltipNoFormat] e vencer. [CHARACTER.GetShortUINameNoTooltipNoFormat] preferiria não testar essa teoria."
 nick_the_wend:0 "[Select_CString( CHARACTER.IsFemale, 'a Vendo', 'o Vendo' )]"
 nick_the_wend_desc:0 "Ao unificar os reinos eslavos ocidentais dispersos, [CHARACTER.GetShortUINameNoTooltipNoFormat] se tornou uma lenda em sua própria época."
 nick_the_whetstone:0 "[Select_CString( CHARACTER.IsFemale, 'a Afiadora', 'o Afiador' )]"
 nick_the_whetstone_desc:0 "Como todas as boas afiadoras, [CHARACTER.GetShortUINameNoTooltipNoFormat] é conhecido por ceder até mesmo a lâminas cegas."
 nick_the_whirlwind:0 "o Redemoinho"
 nick_the_whirlwind_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] ataca com força, rapidez e, acima de tudo, imprevisibilidade."
 nick_the_whisperer:0 "[Select_CString(CHARACTER.IsFemale, 'a Sussurradora', 'o Sussurrador')]"
 nick_the_whisperer_desc:0 "Assim chamad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] porque [CHARACTER.GetShortUINameNoTooltipNoFormat] passa mais tempo falando baixo do que é conveniente."
 nick_the_white:0 "[Select_CString( CHARACTER.IsFemale, 'a Branca', 'o Branco' )]"
 nick_the_white_desc:0 "Se eles chamam [CHARACTER.GetShortUINameNoTooltipNoFormat] de $nick_the_white$ por sua pele pálida ou cabelos mais claros, [CHARACTER.GetShortUINameNoTooltipNoFormat] é incerto. Existem nomes piores para se ter."
 nick_the_wicked:0 "[Select_CString(CHARACTER.IsFemale, 'a Malvada', 'o Malvado')]"
 nick_the_wicked_desc:0 "[CHARACTER.GetFaith.GetName] possui muitas restrições - [CHARACTER.GetShortUINameNoTooltipNoFormat] tende a quebrá-las habitualmente."
 nick_the_wild:0 "[Select_CString( CHARACTER.IsFemale, 'a Selvagem', 'o Selvagem' )]"
 nick_the_wild_desc:0 "Louco de aparência, lunático em ação e frenético no campo de batalha."
 nick_the_winged_tiger:0 "o Tigre Alado"
 nick_the_winged_tiger_desc:0 "A única coisa igual à sua ferocidadeé o seu salto vertical."
 nick_the_wise:0 "[Select_CString(CHARACTER.IsFemale, 'a Sábia', 'o Sábio')]"
 nick_the_wise_desc:0 "É considerado sensato pedir a sua opinião, se [CHARACTER.GetShortUINameNoTooltipNoFormat] puder ser persuadido a dar."
 nick_the_witch:0 "[Select_CString(CHARACTER.IsFemale, 'a Bruxa', 'o Bruxo')]"
 nick_the_witch_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é considerad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] um[Select_CString( CHARACTER.IsFemale, 'a', '' )] traficante de coisas estranhas além do véu da mundanidade."
 nick_the_wizard:0 "[Select_CString( CHARACTER.IsFemale, 'a Maga', 'o Mago' )]"
 nick_the_wizard_desc:0 "As pessoas muitas vezes estão tão focadas na peculiaridade do seu cronometro que falham em considerar as suas travessuras astutas."
 nick_the_wolf:0 "[Select_CString( CHARACTER.IsFemale, 'a Loba', 'o Lobo' )]"
 nick_the_wolf_desc:0 "Astuto, cruel, nobre, mas raramente honrado. Existem piores maneiras de resumir [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_wonderful:0 "o Maravilhoso"
 nick_the_wonderful_desc:0 "Os feitos de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat] [CHARACTER.GetHerHim] distinguem como uma figura respeitada entre o povo."
 nick_the_worthy:0 "[Select_CString( CHARACTER.IsFemale, 'a Digna', 'o Digno' )]"
 nick_the_worthy_desc:0 "Quem julgou [CHARACTER.GetShortUINameNoTooltipNoFormat] assim é motivo de debate, mas todos concordam que [CHARACTER.GetShortUINameNoTooltipNoFormat] verdadeiramente foi uma pessoa de mérito."
 nick_the_wrathful:0 "[Select_CString( CHARACTER.IsFemale, 'a Irascível', 'o Irascível' )]"
 nick_the_wrathful_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por ter pavio curto, e uma distância ainda mais curta para sacar uma espada."
 nick_the_young:0 "[Select_CString(CHARACTER.IsFemale, 'a Jovem', 'o Jovem')]"
 nick_the_young_desc:0 "Quando era jovem, [CHARACTER.GetShortUINameNoTooltipNoFormat] encontrou distinção e notoriedade. Não importa quantos anos passem, [CHARACTER.GetShortUINameNoTooltipNoFormat] tem certeza de que o epíteto vai perdurar."
 nick_the_young_michael_iii:0 "[Select_CString(CHARACTER.IsFemale, 'a', 'o')] Jovem"
 nick_the_young_michael_iii_desc:0 "Governando desde a infância, parece uma piada cruel que Michael tenha tido um reinado tão longo, mas morrido tão jovem. Acidentalmente."
 nick_the_younger:0 "[Select_CString(CHARACTER.IsFemale, 'a Mais Nova', 'o Mais Novo')]"
 nick_the_younger_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem a infelicidade de compartilhar o nome com outra pessoa notável e, consequentemente, foi eternamente rebaixad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] a $nick_the_younger$."
 nick_the_younger_missionary:0 "[Select_CString( CHARACTER.IsFemale, 'a Missionária Jovem', 'o Missionário Jovem' )]"
 nick_the_younger_missionary_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido por defender a causa [CHARACTER.GetFaith.GetAdherentNameNoTooltip], embora menos do que [Select_CString( CHARACTER.IsLocalPlayer, 'seu', 'seu' )] irmão."
 nick_the_zealot:0 "[Select_CString( CHARACTER.IsFemale, 'a Fanática', 'o Fanático' )]"
 nick_the_zealot_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por ser violentamente devot[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] à sua fé."
 nick_theophorus:0 "o Teóforo"
 nick_theophorus_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] chamado Teóforo, o Portador de Deus: bispo de Antioquia que caminhou em correntes para o martírio romano."
 nick_tiny:0 "Pequeno"
 nick_tiny_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por suas ambições de altura."
 nick_troll_slayer:0 "Matador de Trolls"
 nick_troll_slayer_desc:0 "O povo comum se orgulha muito do seu toque protetor, de como [CHARACTER.GetShortUINameNoTooltipNoFormat] matou um troll em seu nome."
 nick_troublemaker:0 "[Select_CString( CHARACTER.IsFemale, 'Encrenqueira', 'Encrenqueiro' )]"
 nick_troublemaker_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecidos por suas opiniões, percepção e voz alta."
 nick_twistedbeard:0 "Barba Torcida"
 nick_twistedbeard_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um governante bretão ou de ascendência bretã com significante habilidade marcial."
 nick_ushiwakamaru:0 "Ushiwakamaru"
 nick_ushiwakamaru_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido por ter a força e tenacidade de um touro jovem, temido por aqueles ao redor de [CharYourHerHim(CHARACTER)]."
 nick_wang_khan:0 "Vã Cã"
 nick_wang_khan_desc:0 "As grandes vitórias de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] em batalha contra os Tártaros [Select_CString( CHARACTER.IsFemale, 'a', 'o' )] tornaram conhecido como Rei Cã! Certamente um futuro longo e brilhante [Select_CString( CHARACTER.IsFemale, 'a', 'o' )] espera após isso?"
 nick_whiteshirt:0 "Camisabranca"
 nick_whiteshirt_desc:0 "As pessoas costumam perguntar a [CHARACTER.GetShortUINameNoTooltipNoFormat] por que a chamam de $nick_whiteshirt$. [CHARACTER.GetShortUINameNoTooltipNoFormat] apenas sorri."
 nick_with_the_lock:0 "com o Cacho"
 nick_with_the_lock_desc:0 "$nick_with_the_tress_desc$"
 nick_with_the_tress:0 "com a Trança"
 nick_with_the_tress_desc:0 "Românticos suspirantes ao redor do mundo falam sobre como [CHARACTER.GetShortUINameNoTooltipNoFormat] nunca vai a lugar algum sem um pedaço do cabelo de seu amado."
 nick_wolf_father:0 "o Pai Lobo"
 nick_wolf_father_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido em toda a terra por ajudar uma loba grávida a dar à luz e criar uma ninhada de filhotes."
 nick_wolf_mother:0 "a Mãe Loba"
 nick_wolf_mother_desc:0 "$nick_wolf_father_desc$"
 nick_wolf_slayer:0 "[Select_CString(CHARACTER.IsFemale, 'a Matadora', 'o Matador')] de Lobos"
 nick_wolf_slayer_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido em toda a terra como aquele que bravamente matou um lobo feroz em acampamento."
 nick_xormuzta:0 "Xormuzta"
 nick_xormuzta_desc:0 "Um honorífico antigo, há muito associado à 'deidade celestial' iraniana antiga, e agora usado entre os cristãos orientais e seus semelhantes para venerar fundadores lendários como [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_yekhe_khagan:0 "Yekhe Grão-cã"
 nick_yekhe_khagan_desc:0 "O Grande, o Grandioso, o soberano do mar de grama e de todas as terras habitadas! [CHARACTER.GetShortUINameNoTooltipNoFormat|U] é o cavalo que monta o mundo."
 nick_yumm_al_din:0 "Yumm al-Dīn"
 nick_yumm_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Yumm al-Dīn — o Dia da Fé."
 nick_zahir_al_din:0 "Zahir al-Dīn"
 nick_zahir_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Zahir al-Dīn — o Defensor da Fé."
 nick_zahir_al_mulk:0 "Zahir al-Mulk"
 nick_zahir_al_mulk_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Zahir al-Mulk — o Brilho do Reino."
 nick_zayn_al_dawla:0 "Zayn al-Dawla"
 nick_zayn_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Zayn al-Dawla — o Ornamento do Estado."
 nick_zayn_al_din:0 "Zayn al-Dīn"
 nick_zayn_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Zayn al-Dīn — a Graça da Fé."
