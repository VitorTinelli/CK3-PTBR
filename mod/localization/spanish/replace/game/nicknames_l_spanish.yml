l_spanish:
 DEFAULT_NICKNAME_DESC:0 "Amigos e inimigos por todo o reino conhecem [CHARACTER.GetShortUINameNoTooltipNoFormat] como '[CHARACTER.GetNicknameNoTooltip]'."
 nick_adud_al_dawla:0 "ʿAḍud al-Dawla"
 nick_adud_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico ʿAḍud al-Dawla — o Braço do Estado."
 nick_akhshunwar:0 "Akhshunwar"
 nick_akhshunwar_desc:0 "Os mestres da Rota da Seda carregaram títulos altos como #EMP Ikhshid#!, #EMP Shahanshah#!, e #EMP Akhshunwar#!, mas nenhum antes de [CHARACTER.GetShortUINameNoTooltipNoFormat] foi digno de ostentar o honorífico 'portador de poder'!"
 nick_ala_al_dawla:0 "ʿAlāʾ al-Dawla"
 nick_ala_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico ʿAlāʾ al-Dawla — a Sublimidade do Estado."
 nick_ala_al_din:0 "Alā al-Dīn"
 nick_ala_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Alā al-Dīn — a Nobreza da Fé."
 nick_alam_al_din:0 "ʿAlam al-Dīn"
 nick_alam_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico ʿAlam al-Dīn — o Estandarte da Fé."
 nick_albaghid:0 "Albaghid"
 nick_albaghid_desc:0 "Enquanto alguns o descreveriam como um revolucionário idealista, as andanças de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] de um lugar para outro, escapando das autoridades após muitas revoltas fracassadas, lhe renderam o epíteto de 'Albaghid', o Abominável."
 nick_ale_lover:0 "Amante de Cerveja"
 nick_ale_lover_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] consegue beber qualquer um sob a mesa!"
 nick_amad_al_dawla:0 "Amād al-Dawla"
 nick_amad_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Amād al-Dawla — o Pilar do Estado."
 nick_asad_al_din:0 "Asad al-Dīn"
 nick_asad_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Asad al-Dīn — o Leão da Fé."
 nick_aurei_testiculi:0 "Aurei Testiculi"
 nick_aurei_testiculi_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem sido abençoad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] com uma abundância de filhos."
 nick_baby_eating:0 "[Select_CString( CHARACTER.IsFemale, 'A Comedora de Bebês', 'O Comedor de Bebês' )]"
 nick_baby_eating_desc:0 "O epônimo de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] é autoexplicativo, é a sua razão que confunde as pessoas."
 nick_bad_hand:0 "Mão Ruim"
 nick_bad_hand_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] alega que é o seu soco direito firme, mas a maioria sabe que [CHARACTER.GetShortUINameNoTooltipNoFormat] é simplesmente péssimo em cartas."
 nick_badr_al_din:0 "Badr al-Dīn"
 nick_badr_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Badr al-Dīn — a Lua Cheia da Fé."
 nick_baha_al_dawla:0 "Bahāʾ al-Dawla"
 nick_baha_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Bahāʾ al-Dawla — o Esplendor do Estado."
 nick_baha_al_din:0 "Bahā al-Dīn"
 nick_baha_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Bahā al-Dīn — o Esplendor da Fé."
 nick_barbarossa:0 "Barbarossa"
 nick_barbarossa_desc:0 "Em homenagem duvidosa ao manto outrora escarlate que adornava seu queixo, [CHARACTER.GetShortUINameNoTooltipNoFormat] recebeu a alcunha de #italic Barbarossa#! - Barba Vermelha - por seus inimigos italianos."
 nick_benavert:0 "Benavert"
 nick_beth_nahrain:0 "Soberano dos Dois Rios"
 nick_beth_nahrain_desc:0 "A presença deste indivíduo sozinha envia uma onda de choque pelas massas, deixando-as envolvidas em admiração e maravilha pelos seus feitos de unificação."
 nick_bloody:0 "[Select_CString( CHARACTER.IsFemale, 'Sanguinária', 'Sanguinário' )]"
 nick_bloody_desc:0 "Não é incomum para a nobreza matar alguns inimigos em suas vidas. Alguns se perguntam desconfortavelmente quantos #EMP [CHARACTER.GetShortUINameNoTooltipNoFormat]#! teve que matar para ser conhecido exclusivamente por isso."
 nick_bloody_hand:0 "a Mão Ensanguentada"
 nick_bloody_hand_desc:0 "Após um ato desesperado de automutilação, [CHARACTER.GetShortUINameNoTooltipNoFormat] ficou conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] para sempre como '[CHARACTER.GetNicknameNoTooltip]'"
 nick_blotsven:0 "Blot-Sven"
 nick_blotsven_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] apedrejou um missionário."
 nick_blue_lion:0 "o Leão Azul"
 nick_blue_lion_desc:0 "Todos sabem que, no inverno, $nick_blue_lion$ ruge #EMP apenas#! à meia-noite."
 nick_blue_snake:0 "Cobra Azul"
 nick_blue_snake_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharDoDoes(CHARACTER)] não responde a perguntas sobre o seu epônimo."
 nick_bluetooth:0 "Bluetooth"
 nick_bluetooth_desc:0 "Um dente solitário e enegrecido dá a [CHARACTER.GetShortUINameNoTooltipNoFormat] um sorriso famoso e único."
 nick_brown_cheeks:0 "Bochechas Marrons"
 nick_brown_cheeks_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] tentou iniciar uma revolta contra o seu líder... e ficou realmente assustado."
 nick_canmore:0 "o de Cabeça Grande"
 nick_canmore_desc:0 "Também chamado de \"Grande Chefe\", [CHARACTER.GetShortUINameNoTooltipNoFormat] é considerad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] uma força forte e unificadora para o reino."
 nick_cengiz_khan:0 "Cengiz Cã"
 nick_cengiz_khan_desc:0 "$nick_genghis_khan_desc$"
 nick_chief_of_the_zanj:0 "Sahib az-Zanj"
 nick_chief_of_the_zanj_desc:0 "Após ser adotado pelos maltratados trabalhadores Zanj como líder em sua luta pela liberdade, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido como o Chefe dos Zanj."
 nick_chubbycheeks:0 "Chubbycheeks"
 nick_chubbycheeks_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] simplesmente não consegue resistir às tortas de pêssego."
 nick_cihangir:0 "Cihangir"
 nick_cihangir_desc:0 "Pela divina vontade de Alá, [CHARACTER.GetShortUINameNoTooltipNoFormat] é o conquistador de todo o mundo. Nunca o Dar al-Islam e as terras dos infiéis ouviram tão alto o estrondo dos cascos!"
 nick_cuckoo:0 "Cuco"
 nick_cuckoo_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem muitos filhos em muitos ninhos diferentes..."
 nick_culture_khagan:0 "Grão-cã [CHARACTER.GetCulture.GetNameNoTooltip]"
 nick_culture_khagan_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] foi reverenciado como o maior de todos os [CHARACTER.GetCulture.GetCollectiveNounNoTooltip], e os [CHARACTER.GetCulture.GetCollectiveNounNoTooltip] [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] — os filhos do destino, os cavaleiros que pisoteiam cidades, que empunham as espadas e chicotes do império!"
 nick_curtmantle:0 "Curtmantle"
 nick_curtmantle_desc:0 "Um[Select_CString(CHARACTER.IsFemale, 'a', '')] [CHARACTER.GetWomanMan] prático, [CHARACTER.GetShortUINameNoTooltipNoFormat] é conhecido por favorecer capas de viagem mais curtas em detrimento de assuntos mais floridos ou elaborados."
 nick_danishmend:0 "Danişmend"
 nick_danishmend_desc:0 "Dotado de profundo conhecimento, [CHARACTER.GetShortUINamePossessiveNoFormat] é amplamente conhecido e respeitado por muitos."
 nick_do_nothing:0 "Não Faça Nada"
 nick_do_nothing_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por ser preguiços[Select_CString( CHARACTER.IsFemale, 'a', 'o' )], inativ[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e sem ambição."
 nick_dort_yonlug_khagan:0 "Dört Yönlüg Grão-cã"
 nick_dort_yonlug_khagan_desc:0 "A terra se estende em quatro vastas direções, e — até o último, até os lugares escuros e desconhecidos — tudo pertence por direito a [CHARACTER.GetShortUINameNoTooltipNoFormat]! O cosmos está disposto para o conforto [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )], sob o comando [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )]."
 nick_elbow_high:0 "Cotovelo-Alto"
 nick_elbow_high_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é não mais alt[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] do que uma criança, muito para o entretenimento mesquinho de seus pares."
 nick_fabulous_she_he:0 "[Select_CString( CHARACTER.IsFemale, 'Fabulosa', 'Fabuloso' )] [CHARACTER.GetSheHe|U], [CHARACTER.GetFirstNameNoTooltip|U]"
 nick_fabulous_she_he_desc:0 "Não é desconhecido observadores casuais se ajoelharem em sinal de respeito quando essa pessoa passa."
 nick_fairhair:0 "Cabelo Claro"
 nick_fairhair_desc:0 "Após unir a Noruega sob a sua bandeira, [CHARACTER.GetShortUINameNoTooltipNoFormat] ganhou o direito de cortar, estilizar e perfumar seu cabelo mais uma vez. Nenhum cabelo é mais belo do que aquele conquistado com trabalho árduo e luta."
 nick_fakhr_al_din:0 "Fakhr al-Dīn"
 nick_fakhr_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Fakhr al-Dīn — o Orgulho da Fé."
 nick_father_of_the_baltic:0 "Pai dos Bálticos"
 nick_father_of_the_baltic_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] trouxe a Livônia a este mundo com sangue, suor e trabalho árduo."
 nick_feareater:0 "[Select_CString( CHARACTER.IsFemale, 'Devoradora de Medo', 'Devorador de Medo' )]"
 nick_feareater_desc:0 "O medo, o ódio, o #EMP terror#! do inimigo motiva [CHARACTER.GetShortUINameNoTooltipNoFormat], impulsionando [CHARACTER.GetSheHe] a atos de sede de sangue e crueldade. Atos muito, muito eficazes."
 nick_foul_fart:0 "Pum Fedorento"
 nick_foul_fart_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é renomad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por ter... controle questionável de suas funções corporais durante festas, reuniões do conselho e encontros públicos."
 nick_gajapati:0 "Gajapati"
 nick_gajapati_desc:0 "O uso inovador de elefantes de guerra por parte de [CHARACTER.GetShortUINameNoTooltipNoFormat|U] certamente ficará registrado na história."
 nick_garlic_queen:0 "a Rainha do Alho"
 nick_garlic_queen_desc:0 "$nick_the_garlic_desc$"
 nick_genghis_khan:0 "Gengis Cã"
 nick_genghis_khan_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é o castigo de [CHARACTER.GetFaith.HighGodName] por todos os pecados do mundo — pois se o mundo não estivesse cheio de pecadores, [CHARACTER.GetFaith.HighGodName] teria enviado alguém como #EMP [Select_CString( CHARACTER.IsFemale, 'ela', 'ele' )]#! como punição?"
 nick_ghiyath_al_din:0 "Ghiyāth al-Dīn"
 nick_ghiyath_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Ghiyāth al-Dīn — o Ajudante da Fé."
 nick_greataxe:0 "Machado Grande"
 nick_greataxe_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é um[Select_CString( CHARACTER.IsFemale, 'a', '' )] mestr[Select_CString( CHARACTER.IsFemale, 'a', 'e' )] do machado, inimigos cuidado!"
 nick_haardraade:0 "Governante Rigoroso"
 nick_haardraade_desc:0 "À sua frente, as pessoas chamam [CHARACTER.GetShortUINameNoTooltipNoFormat] de $nick_haardraade$. Por trás das costas [CHARACTER.GetHerHim], sua atitude sem alegria e justiça severa faz com que [CHARACTER.GetSheHe] seja chamado de $nick_the_tyrant$."
 nick_half_hand:0 "Meia-Mão"
 nick_half_hand_desc:0 "Algumas lendas dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] não tem um dedo, outras metade da sua mão, e ainda outras que o braço [CHARACTER.GetHerHim] está dividido ao meio até o cotovelo. [CHARACTER.GetShortUINameNoTooltipNoFormat] [CharDontDoesnt(CHARACTER)] gosta de comentar."
 nick_hand:0 "Mão Ruim"
 nick_hand_desc:0 "A falta de sorte [CHARACTER.GetHerHim] e a propensão para tomar decisões que mais tarde se mostram desastrosas já foram notadas ocasionalmente."
 nick_hardeknud:0 "Harthacnut"
 nick_hardeknud_desc:0 "Muitos súditos não conseguem concordar com a pronúncia exata do seu nome, e [CHARACTER.GetShortUINameNoTooltipNoFormat] é conhecid[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] por muitas variantes."
 nick_health_god_mercy:0 "A Misericórdia de [CHARACTER.GetFaith.HealthGodNamePossessive|U]"
 nick_health_god_mercy_desc:0 "Apesar de humildes começos, [CHARACTER.GetShortUINameNoTooltipNoFormat] encontrou o caminho para o mundo da medicina e fez um nome para [CharYourHerHimself(CHARACTER)] cuidando dos pobres."
 nick_hildetand:0 "Dente de Verruga"
 nick_hildetand_desc:0 "Lendas abundam sobre [CHARACTER.GetShortUINameNoTooltipNoFormat] perdendo dentes dramaticamente em batalha — apenas para brotar dois novos milagrosamente."
 nick_hisn_al_dawla:0 "Ḥiṣn al-Dawla"
 nick_hisn_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Ḥiṣn al-Dawla — a Fortaleza do Estado."
 nick_ho_seung:0 "Ho-seung"
 nick_ho_seung_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é cercado por uma lenda flutuante que conta a história de um tigre que morreu ao cair em uma armadilha de fosso, renasceu como humano e tornou-se monge. Segundo essa lenda, esse monge nada mais é do que [Select_CString( CHARACTER.IsFemale, 'ela mesma', 'ele mesmo' )]."
 nick_hotspur:0 "Hotspur"
 nick_hotspur_desc:0 "Seus inimigos sussurram que, quando em campanha, suas esporas nem mesmo tocam o chão, tal é o seu tempo que passa na sela e a fúria de seus ataques. Isso se reflete um pouco em suas habilidades medianas no futebol."
 nick_husam_al_dawla:0 "Ḥusām al-Dawla"
 nick_husam_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Ḥusām al-Dawla — a Espada do Estado."
 nick_ikhtiyar_al_din:0 "Ikhtiyar al-Dīn"
 nick_ikhtiyar_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Ikhtiyar al-Dīn — o Escolhido da Fé."
 nick_imad_al_dawla:0 "Imād al-Dawla"
 nick_imad_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Imād al-Dawla — o Pilar do Estado."
 nick_imad_al_din:0 "Imād al-Dīn"
 nick_imad_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Imad al-Dīn — o Pilar da Fé."
 nick_irontooth:0 "Dente de Ferro"
 nick_irontooth_desc:0 "Dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] tem as presas de um animal selvagem - pelo menos, [CHARACTER.GetShortUINameNoTooltipNoFormat] certamente tem a força da mandíbula."
 nick_iscariot:0 "Iscariot"
 nick_iscariot_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é conhecido por trair os princípios mais sólidos e mais preciosos do seu coração, tendo vendido todos por seu próprio ganho."
 nick_izumi_shikibu:0 "Izumi Shikibu"
 nick_izumi_shikibu_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] é conhecida pelo epíteto #EMP Izumi Shikibu#!, derivado da posição de seu marido como governador da província de #EMP Izumi#!, e da posição de seu pai no #EMP Shikibu-shō#!, o Ministério de Assuntos Cerimoniais."
 nick_izz_al_din:0 "Izz al-Dīn"
 nick_izz_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Izz al-Dīn — a Glória da Fé."
 nick_jahan_pahlavan:0 "Jahan Pahlavan"
 nick_jahan_pahlavan_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Jahan Pahlavan — o Herói do Mundo."
 nick_jalal_al_dawla:0 "Jalāl al-Dawla"
 nick_jalal_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Jalāl al-Dawla — a Majestade do Estado."
 nick_jalal_al_din:0 "Jalāl al-Dīn"
 nick_jalal_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Jalāl al-Dīn — a Majestade da Fé."
 nick_kanz_al_dawla:0 "Kanz al-Dawla"
 nick_kanz_al_dawla_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Kanz al-Dawla — o Tesouro do Estado."
 nick_khatam_an_nabiyyin:0 "Khatam an-Nabiyyin"
 nick_khatam_an_nabiyyin_desc:0 "Traduzido diretamente como \"Selo dos Profetas\", é um termo usado por Alá no Alcorão para descrever [CharYouHerHim(CHARACTER)]."
 nick_king_of_fashion:0 "[CHARACTER.GetTitleAsNameNoTooltip] da Moda"
 nick_king_of_fashion_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] encontrou poder e influência em um mundo de seda e peles."
 nick_lackland:0 "[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] Sem Terra"
 nick_lackland_desc:0 "As terras de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] são insignificantes em comparação com as de seus irmãos."
 nick_lackland_ironic:0 "$nick_lackland_young$"
 nick_lackland_ironic_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] pode ter sido uma vez um filho menor de pais maiores, mas [CHARACTER.GetShortUINameNoTooltipNoFormat] tem conseguido conquistar um domínio respeitável apesar das dificuldades — e das risadas discretas."
 nick_lackland_old:0 "$nick_lackland_young$"
 nick_lackland_old_desc:0 "Que embaraçoso deve ser para [CHARACTER.GetShortUINameNoTooltipNoFormat] vir a possuir um domínio tão grande, apenas para perder tanto dele — e quão profético é o seu nome eponímico."
 nick_lackland_young:0 "Lackland"
 nick_lackland_young_desc:0 "Pobre [CHARACTER.GetShortUINameNoTooltipNoFormat], nascido como um filho mais novo de uma série de irmãos ilustres. Como pode [CHARACTER.GetShortUINameNoTooltipNoFormat] ser esperado para governar algo que seja?"
 nick_lacks_laughs:0 "Sem-Risadas"
 nick_lacks_laughs_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é tão conhecido por sua seriedade que, segundo a lenda, [CHARACTER.GetShortUINameNoTooltipNoFormat] não ouviu um humano rir até [CHARACTER.GetShortUINameNoTooltipNoFormat] se tornar um[Select_CString(CHARACTER.IsFemale, 'a', '')] [CHARACTER.GetWomanMan] adulto. [CHARACTER.GetShortUINameNoTooltipNoFormat] pensou que eles estavam tendo um ataque."
 nick_little:0 "[Select_CString( CHARACTER.IsFemale, 'Pequena', 'Pequeno' )]"
 nick_little_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat] pode ser pequeno, mas [CHARACTER.GetShortUINameNoTooltipNoFormat] tem toda a raiva e fúria de uma doninha raivosa."
 nick_lodbrok:0 "Loðbrók"
 nick_lodbrok_desc:0 "As massas acovardadas do mundo chamam [CHARACTER.GetShortUINameNoTooltipNoFormat] de \"Calças Peludas\", pois dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] usa calças feitas de couro arrancado do cadáver de um poderoso dragão. Naturalmente, um #EMP [CHARACTER.GetShortUINameNoTooltipNoFormat]#! matou."
 nick_longshanks:0 "Pernas Longas"
 nick_longshanks_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é atlétic[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] e musculos[Select_CString( CHARACTER.IsFemale, 'a', 'o' )], e é mais frequentemente encontrad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] malhando."
 nick_longsword:0 "Espada Longa"
 nick_longsword_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] tem estudad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] a espada quando os outros estavam festejando."
 nick_majd_al_din:0 "Majd al-Dīn"
 nick_majd_al_din_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] assumiu ou recebeu o honorífico Majd al-Dīn — a Glória da Fé."
 nick_mar_sargis:0 "Mar Sargis"
 nick_mar_sargis_desc:0 "Diz-se que [Select_CString( CHARACTER.IsFemale, 'ela', 'ele' )] foi guiad[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] para um governo piedoso por visões sagradas, e o patrono de [CHARACTER] é o mártir São Sargis."
 nick_monarch_of_beauty_and_noblesse:0 "Rainha da Beleza e Nobreza"
 nick_monarch_of_beauty_and_noblesse_desc:0 "$nick_monarch_of_beauty_and_noblesse_masc_desc$"
 nick_monarch_of_beauty_and_noblesse_masc:0 "Rei da Beleza e Nobreza"
 nick_monarch_of_beauty_and_noblesse_masc_desc:0 "Os súditos [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] são notoriamente efusivos em seus elogios a [CharYouSheHe(CHARACTER)|U]."
 nick_monarch_of_dice:0 "[Select_CString( CHARACTER.IsFemale, 'a', 'o' )] [CHARACTER.GetTitleAsNameNoTooltip] dos Dados"
 nick_monarch_of_dice_desc:0 "O coração, determinação e simplesmente a sorte fenomenal [CHARACTER.GetHerHim] parecem capazes de levá-lo através de qualquer jogo de azar."
 nick_monarch_of_fools:0 "Dama Bispo dos Tolos"
 nick_monarch_of_fools_desc:0 "$nick_monarch_of_fools_masc_desc$"
 nick_monarch_of_fools_masc:0 "Bispo dos Tolos"
 nick_monarch_of_fools_masc_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] é considerado algo como um arauto entre os bufões."
 nick_monarch_of_grim_and_grievance:0 "Rainha das Sombras e Descontentamento"
 nick_monarch_of_grim_and_grievance_desc:0 "$nick_monarch_of_grim_and_grievance_masc_desc$"
 nick_monarch_of_grim_and_grievance_masc:0 "Rei do Sombras e Descontentamento"
 nick_monarch_of_grim_and_grievance_masc_desc:0 "Os súditos [Select_CString( CHARACTER.IsFemale, 'dela', 'dele' )] não têm respeito algum por [CharYouSheHe(CHARACTER)|U], principalmente por sua aparência."
 nick_moneybags:0 "Bolsos Cheios"
 nick_moneybags_desc:0 "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] talvez prefira ser conhecido como \"o Rico\", mas infelizmente as pessoas têm uma visão muito específica de sua riqueza."
 nick_monophthalmos:0 "Monofálmio"
 nick_monophthalmos_desc:0 "O olho remanescente de [CHARACTER.GetShortUINamePossessiveNoTooltipNoFormat|U] recebe muito mais atenção do que o par deles jamais recebeu."
 nick_monopod:0 "[Select_CString( CHARACTER.IsFemale, 'a Monopé', 'o Monopé' )]"
 nick_monopod_desc:0 "Dizem que [CHARACTER.GetShortUINameNoTooltipNoFormat] poderia duelar na cabeça de um alfinete - se [CHARACTER.GetShortUINameNoTooltipNoFormat] assim o desejasse."
 nick_mother_of_the_baltic:0 "Mãe dos Bálticos"
