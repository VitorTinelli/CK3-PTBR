l_spanish:
 PROWESS_MUSCLE_INFO:0 "Aumentar a bravura através de fontes naturais #weak (não através de [artifacts|E])#! aumentará a massa muscular de um personagem."
 PROWESS_MUSCLE_INFO_PERSONAL:0 "Aumentar a sua [prowess|E] aumentará a sua massa muscular."
 additional_mandala_government_piety_levels:0 "O [government|E] [mandala|E] pode desbloquear Níveis adicionais de Devoção após [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L], até e incluindo [GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]. Para alcançar esse grau de divindade, sua Devoção precisa ser provada ao longo das gerações."
 game_concept_abandon_celibacy:0 "Abandonar o Celibato"
 game_concept_abandon_celibacy_decision:0 "Decisão de abandonar o celibato"
 game_concept_abandon_celibacy_desc:0 "Uma [decision|E] que permite a um personagem perder os [traits|E] [GetTrait('celibate').GetName(GetNullCharacter)] à vontade."
 game_concept_abandon_hook_interaction:0 "Interação de $abandon_hook_interaction$"
 game_concept_abandon_hook_interaction_desc:0 "Uma [interaction|E] que permite abandonar um [hook|E] que você possui em troca da perda de [stress_loss_i][stress|E]."
 game_concept_absolute:0 "Absoluta"
 game_concept_absolute_control:0 "Controle Absoluto"
 game_concept_absolute_control_desc:0 "$game_concept_absolute_control$ é um estado especial de [control|E] habilitado pelo [perk|E] de $absolute_control_perk_name$, indicando que o governante tem um controle de ferro sobre a população.\n\nSempre que o $game_concept_control$ estiver em #V 100#!, ele irá mostrar '$ABSOLUTE_COUNTY_CONTROL$' e irá dar um bônus adicional de [taxes|E] e [levies|E]."
 game_concept_absolute_control_short:0 "Absoluto"
 game_concept_absolute_crown_authority:0 "Autoridade da Coroa Absoluta"
 game_concept_absolute_crown_authority_desc:0 "$game_concept_absolute_crown_authority$ é o maior nível da [crown_authority|E]. [vassals|E] têm uma penalidade de #N -30#! de [opinion|E] contra seu [liege|E].\n\nNeste nível — Além dos efeitos da Autoridade da Coroa [high|E] e [limited|E] — o governante pode escolher um [designated_heir|E] por um custo de [prestige|E].\n\nAlém disso, vassalos não podem declarar guerras nem contra governantes estrangeiros."
 game_concept_absolute_tribal:0 "Absoluta"
 game_concept_absolute_tribal_authority:0 "Autoridade Tribal Absoluta"
 game_concept_absolute_tribal_authority_desc:0 "$game_concept_absolute_tribal_authority$ é o maior nível da [tribal_authority|E]. [vassals|E] têm uma penalidade de #N -30#! de [opinion|E] contra seu [liege|E].\n\nNeste nível, além dos efeitos da Autoridade Tribal [limited_tribal|E] e [high_tribal|E], governantes podem agora se estabeler e se tornar [feudal|E].\n\nUm governo [tribal|E] [GetReligionFamily('rf_pagan').GetName] não reformado precisa desta lei para poder reformar sua [faith|E]."
 game_concept_accept_culture:0 "$task_accept_culture$"
 game_concept_accept_culture_desc:0 "$game_concept_accept_culture$ é uma [councillor_task|E] realizada pelo [steward|E].\n\nIsso aumenta a [cultural_acceptance|E] entre a [culture|E] alvo e a [culture|E] do governante."
 game_concept_acclaimed:0 "Aclamado"
 game_concept_acclaimed_knight:0 "Cavaleiro Aclamado"
 game_concept_acclaimed_knight_desc:0 "O [knight|E] que possui uma [accolade|E].\n\nPara ser um Cavaleiro Aclamado, um Cavaleiro deve ser [unlanded|E] ou um [baron|E], com pelo menos [EmptyScope.ScriptValue('accolade_prowess_requirement_value')|0V] de [prowess|E] ou mais. Um Cavaleiro Aclamado deve ser elegível para pelo menos um [accolade_type|E] que ainda não seja possuído por outro Cavaleiro Aclamado do seu [liege|E].\n\nCavaleiros Aclamados têm menor probabilidade de serem mortos ou feitos prisioneiros em batalha. Eles podem aumentar sua [glory|E] principalmente lutando em [wars|E] e participando de [activities|E] como o [GetActivityType( 'activity_tournament' ).GetName].\n\nCavaleiros Aclamados podem ocasionalmente ganhar [skills|E] e [traits|E] relacionados aos Atributos de sua Honraria."
 game_concept_acclaimed_knight_possessive:0 "do Cavaleiro Aclamado"
 game_concept_acclaimed_knights:0 "Cavaleiros Aclamados"
 game_concept_accolade:0 "Honraria"
 game_concept_accolade_desc:0 "As Aclamações são títulos concedidos aos [knights|E] por seu [liege|E].\n\nO Cavaleiro que recebe uma Honraria torna-se um [acclaimed_knight|E].\n\nÀ medida que o Cavaleiro Aclamado ganha [glory|E], a Aptidão de seus [accolade_squires|E] aumenta (melhorando [accolade_succession|E]) e [accolade_ranks|E] podem ser obtidos. Estes permitem desbloquear mais [accolade_types|E], oferecendo bônus mais fortes.\n\nQuando um Cavaleiro Aclamado morre, ocorre a [accolade_succession|E] e o cavaleiro é imediatamente substituído por um sucessor cujas habilidades são modificadas pela Aptidão dos [accolade_squires|E].\n\n[innovations|E] e [title_tiers|E] mais altos permitem que os [rulers|E] possuam mais Aclamações simultaneamente."
 game_concept_accolade_possessive:0 "da Honraria"
 game_concept_accolade_rank:0 "Nível da Honraria"
 game_concept_accolade_rank_desc:0 "Uma [accolade|e] possui #value 6#! Níveis progressivos que desbloqueiam bônus específicos de seus [accolade_types|e], como [knight_army_modifiers|e].\n\nGanhar [glory|E] desbloqueia cada Nível, enquanto perder Glória pode fazer com que eles sejam perdidos.\n\nOs Níveis ímpares são fornecidos pelo Atributo Primário da Honraria, e os Níveis pares pelo Atributo Secundário."
 game_concept_accolade_rank_short:0 "Nível"
 game_concept_accolade_ranks:0 "Níveis da Honraria"
 game_concept_accolade_squire:0 "Escudeiro"
 game_concept_accolade_squires:0 "Escudeiros"
 game_concept_accolade_squires_desc:0 "Cada [accolade|E] possui uma métrica de Aptidão dos Escudeiros, que modifica os [traits|E] e [skills|E] (principalmente [prowess_skill|E], [martial_skill|E] e [trait_level_track_xp|E] para [GetTrait('tourney_participant').GetName( GetNullCharacter )]) do próximo [acclaimed_knight|E].\n\nExistem 5 níveis de Aptidão para Escudeiros:\n$EFFECT_LIST_BULLET$Habilidoso\n$EFFECT_LIST_BULLET$Capaz\n$EFFECT_LIST_BULLET$Inexperiente\n$EFFECT_LIST_BULLET$Inútil\n$EFFECT_LIST_BULLET$Patético\n\nTer uma Aptidão de Inexperiente ou superior fará com que o Cavaleiro Aclamado influencie esporadicamente os [traits|E] e [skills|E] de jovens [courtiers|E] de gênero marcial, dando-lhes prioridade para assumir a Honraria durante a [accolade_succession|E].\n\nOs Escudeiros são principalmente aprimorados pelo ganho de [glory|E], mas também:\n$EFFECT_LIST_BULLET$O [prowess_skill|E] do Cavaleiro Aclamado\n$EFFECT_LIST_BULLET$O [martial_skill|E] do Cavaleiro Aclamado\n$EFFECT_LIST_BULLET$O Cavaleiro Aclamado ganhando [trait_level_track_xp|E] para [GetTrait('tourney_participant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$O Cavaleiro Aclamado ganhando [trait_level_track_xp|E] para [GetTrait('lifestyle_blademaster').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$O [martial_skill|E] do [liege|E] da Honraria\n$EFFECT_LIST_BULLET$O [prowess_skill|E] do [liege|E] da Honraria\n\nCada [accolade_succession|E] redefine os Escudeiros da Honraria."
 game_concept_accolade_succession:0 "Sucessão da Honraria"
 game_concept_accolade_succession_desc:0 "A Sucessão de Honraria ocorre quando um [acclaimed_knight|E] morre ou se torna inválido.\n\nO antigo Cavaleiro Aclamado é imediatamente substituído. Jovens [courtiers|E] e [knights|E] treinados devido à Aptidão dos [accolade_squires|E] da Honraria são inicialmente favorecidos como Sucessores; em seguida, outros cavaleiros, outros cortesãos, aventureiros e, finalmente, [characters|E] recém-criados. Com base na Aptidão dos [accolade_squires|E] da Honraria, o novo Cavaleiro receberá aumento em [prowess_skill|E], [martial_skill|E], [trait_level_track_xp|E] para [GetTrait('tourney_participant').GetName( GetNullCharacter )], e possivelmente outras [skills|E].\n\nApós a Sucessão da Honraria, uma pequena quantidade de [glory|E] pode ser perdida, e a Aptidão dos Escudeiros da Honraria é redefinida para refletir agora as habilidades e experiência do novo Cavaleiro Aclamado.\n\nSe o Cavaleiro Aclamado morrer em batalha, duelo ou outro modo honroso, a perda de Glória é anulada e a Aptidão dos Escudeiros da Honraria é aprimorada."
 game_concept_accolade_type:0 "Atributo da Honraria"
 game_concept_accolade_type_desc:0 "Uma [accolade|E] possui até #value 3#! Atributos, que fornecem bônus escaláveis à medida que seus níveis mais altos são desbloqueados. Cada Atributo possui #value 3#! Níveis. Quando uma Honraria aumenta seu [accolade_rank|E], seu dono pode aumentar o nível de um Atributo existente ou adicionar um novo Atributo à Honraria. O [acclaimed_knight|E], no entanto, deve satisfazer os requisitos de qualquer novo Atributo.\n\nCada [knight|E] é elegível apenas para certos Atributos, que podem ser baseados em [traits|E], [skills|E] ou desbloqueios por experiência enquanto servia como Cavaleiro.\n\nCada Honraria deve ter Atributos únicos: um Senhor Feudal #high não pode#! duplicar Atributos entre Aclamações. Cada Honraria também pode se especializar em apenas #value 1#! Atributo do tipo de [men_at_arms|E]."
 game_concept_accolade_types:0 "Atributos da Honraria"
 game_concept_accolades:0 "Honrarias"
 game_concept_activities:0 "Atividades"
 game_concept_activity:0 "Atividade"
 game_concept_activity_attending:0 "Participando"
 game_concept_activity_desc:0 "Uma $game_concept_activity$ é uma ocasião especial realizada com um propósito específico, como participar de uma [GetActivityType( 'activity_hunt' ).GetName] para aliviar o [stress|E].\n\nO [activity_host_short|E] realiza a atividade em um local específico, o que a afeta de várias maneiras, e todos os participantes devem se [travel|E] até lá.\n\nCada personagem participante interage entre si estabelecendo uma [intent|E], que eles tentam seguir durante a atividade.[SelectLocalization( HasDlcFeature( 'advanced_activities' ), 'game_concept_activity_desc_GRAND_ACTIVITY_DLC', '' )]"
 game_concept_activity_desc_GRAND_ACTIVITY_DLC:0 "\n\nUma $game_concept_activity$ regular, como uma [GetActivityType( 'activity_feast' ).GetName] ou uma [GetActivityType( 'activity_hunt' ).GetName], são menores e menos impressionantes do que as [grand_activities|E]."
 game_concept_activity_guest:0 "Convidado da Atividade"
 game_concept_activity_guest_desc:0 "Um Convidado em uma [activity|E] é qualquer [character|E] convidado pelo [activity_host|E].\n\nEmbora geralmente não possam afetar a Atividade tanto quanto seu Anfitrião, eles ainda podem seguir sua [intent|E]."
 game_concept_activity_guest_short:0 "Convidado"
 game_concept_activity_guests:0 "Convidados da Atividade"
 game_concept_activity_guests_short:0 "Convidados"
 game_concept_activity_host:0 "Anfitrião da Atividade"
 game_concept_activity_host_desc:0 "O Anfitrião de uma [activity|E] é o [ruler|E] que a iniciou.\n\nEles escolhem o [activity_type|E], [location|E], [activity_options|E] e quais [activity_guests_short|E] convidar."
 game_concept_activity_host_possessive:0 "do Anfitrião da Atividade"
 game_concept_activity_host_short:0 "Anfitrião"
 game_concept_activity_option:0 "Opção da Atividade"
 game_concept_activity_option_desc:0 "Todas as [activities|E] têm opções que permitem personalizar o planejamento da atividade. As opções têm vários custos e requisitos."
 game_concept_activity_options:0 "Opções da Atividade"
 game_concept_activity_phase:0 "Fase da Atividade"
 game_concept_activity_phase_action:0 "Ação da Fase da Atividade"
 game_concept_activity_phase_action_desc:0 "A cada #V 7#! dias durante uma [activity|E], há uma chance de algo acontecer fora dos eventos regulares. Esses acontecimentos são exibidos no canto superior direito da janela de Atividade.\n\nO que pode acontecer depende do [activity_type|E], por exemplo: o [activity_host|E] pode ganhar [prestige|E] ou o [activity_guest|E] pode ter sua [opinion|E] afetada em uma [GetActivityType('activity_feast').GetName].\n\nSempre há uma chance de nada acontecer, isso é especialmente provável antes da fase atual da atividade ser [activity_state_active|E]."
 game_concept_activity_phase_desc:0 "Uma fase de ação de uma atividade, como um [contest|E] em um [GetActivityType( 'activity_tournament' ).GetName], [stop|E] em um [tour|E] ou destino de uma [pilgrimage|E] durante a qual eventos ocorrem."
 game_concept_activity_phases:0 "Fases da Atividade"
 game_concept_activity_state_active:0 "Ativa"
 game_concept_activity_state_active_desc:0 "Quando o anfitrião e os convidados chegaram e estão envolvidos em uma [activity|E], ela é considerada ativa."
 game_concept_activity_state_passive:0 "Passiva"
 game_concept_activity_state_passive_desc:0 "Uma [activity|E] está em uma fase passiva quando o anfitrião ou os convidados ainda não chegaram, ou quando estão entre uma [stop|E] e a próxima em um [tour|E]."
 game_concept_activity_type:0 "Tipo de Atividade"
 game_concept_activity_type_desc:0 "Algumas [activities|E] e [grand_activities|E] têm diferentes tipos correspondentes a variantes especiais da atividade.\n\nPor exemplo, ao planejar uma caçada, você pode escolher entre Padrão, Falcoaria e Lendária se cumprir os requisitos para esse tipo."
 game_concept_activity_types:0 "Tipos de Atividade"
 game_concept_additional_piety_level_desc:0 "\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_6' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_7' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_8' ).GetNameWithTooltip|L]"
 game_concept_adopt:0 "Adotar"
 game_concept_adopted:0 "Adotado"
 game_concept_adopting:0 "Adotando"
 game_concept_adoption:0 "Adoção"
 game_concept_adoption_desc:0 "A adoção é o ato de trazer outro [character|E] para sua [house|E] e [dynasty|E]."
 game_concept_adopts:0 "Adoções"
 game_concept_adult:0 "Adulto"
 game_concept_adult_desc:0 "Um $game_concept_adult$ é um personagem com ao menos #V 16#! anos de idade."
 game_concept_adult_health:0 "Saúde Adulta"
 game_concept_adult_health_desc:0 "Certos [traits|E], como [GetTrait('ill').GetName( GetNullCharacter )], são mais perigosos para os [adults|E].\n\nQualquer penalidade para $game_concept_adult_health$ acumula com as penalidades regulares para a [health|E], mesmo dos mesmos Traços."
 game_concept_adulthood:0 "Idade Adulta"
 game_concept_adults:0 "Adultos"
 game_concept_advanced_succession:0 "Sucessão Avançada"
 game_concept_advanced_succession_desc:0 "Uma $game_concept_advanced_succession$ substitui a herança comum por uma forma especial de selecionar o próximo [holder|E], como a designação de um único [heir|E], aclamação ou nomeação."
 game_concept_advantage:0 "Vantagem"
 game_concept_advantage_roll:0 "Rolagem de Vantagem"
 game_concept_advantage_rolls:0 "Rolagens de Vantagem"
 game_concept_aftermath:0 "Consequência"
 game_concept_aftermath_desc:0 "A Fase de $game_concept_aftermath$ de uma [battle|E] ocorre quando um dos lados vence. O vitorioso irá tentará alcançar e matar quantos [soldiers|E] [Concept( 'retreat', 'Recuando' )|E] for possível.\n\n[men_at_arms|E] com um valor alto em [pursuit|E] são capazes de matar mais $game_concept_soldiers$ na Fase de $game_concept_aftermath$, enquanto $game_concept_men_at_arms$ com um valor alto em [screen|E] irão proteger [soldiers|E] aliados."
 game_concept_agent:0 "Agente"
 game_concept_agent_discovery:0 "Descoberta de Agente"
 game_concept_agent_discovery_desc:0 "[agents|E] descobertos do [secret_scheme|E] podem ser vistos como [criminals|E] por seu [liege|E], e provavelmente serão [Concept('imprisoned', 'Aprisionados')|E] se isso acontecer."
 game_concept_agent_discovery_discovered:0 "Descobertos"
 game_concept_agent_i:0 "@scheme_agent_icon!"
 game_concept_agents:0 "Agentes"
 game_concept_agents_desc:0 "Um $game_concept_agent$ é um participante em um [scheme|E], que pode fornecer um dos três benefícios. Eles podem aumentar a [success_chance|e], reduzir a [scheme_speed_single|e] ou melhorar o [secrecy|e]. Apenas os [courtiers|E], [guests|E] e [direct_vassals|E] do alvo podem ser recrutados como Agentes.\n\nPara os esquemas [Concept('scheme_hostile', 'Hostis')|E], ter agentes próximos ao alvo é muito importante. Por exemplo, os [councillors|E] ou a [close_family|E] do Alvo do Esquema contribuem mais para a $game_concept_scheme_speed_single$ e $game_concept_success_chance$.\n\nSer um $game_concept_agent$ em um [hostile_scheme|e] é um [crime|E], e o $game_concept_agent$ corre o risco de ser [Concept('agent_discovery_discovered', 'Descoberto')|E]."
 game_concept_ai_cautious_personality:0 "Cauteloso"
 game_concept_ai_cautious_personality_desc:0 "Um [ruler|E] com personalidade $game_concept_ai_cautious_personality$ quer estar preparado para que [war|E] sejam declaradas contra eles. Eles são um pouco avessos a declarar [war|E] ofensiva, preferindo uma acumulação lenta. Eles mantêm um estoque de [gold|E] para ajudar a se defender e investem em [buildings|E] e [men_at_arms|E] para ajudá-los a se sentirem seguros.\n\nOs governantes com personalidade $game_concept_ai_cautious_personality$ são menos propensos a criar e promover [legends|E].\n\nOs Governantes reservados e cuidadosos tendem a ser $game_concept_ai_cautious_personality$.\nTraços comuns incluem [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('craven').GetName( GetNullCharacter )], [GetTrait('paranoid').GetName( GetNullCharacter )] e [GetTrait('content').GetName( GetNullCharacter )]. Eles nunca serão [GetTrait('fickle').GetName( GetNullCharacter )]."
 game_concept_ai_conqueror_personality:0 "Conquistador"
 game_concept_ai_conqueror_personality_desc:0 "Um $game_concept_ai_conqueror_personality$ deseja expandir seu [realm|E] por meio de [war|E], a qualquer custo. Eles investirão todo o seu [gold|E] no [war_chest|E] ou para comprar [men_at_arms|E].\n\nTendem a declarar muito mais [wars|E] do que o normal e são [allies|E] bastante não confiáveis. Eles abandonam a maioria dos prazeres fúteis da vida, como hospedar ou participar de [activities|E] e patrocinar [inspirations|E] — para economizar [gold|E] para esmagar seus inimigos. Eles usarão Atividades apenas para ganhar [prestige|E] suficiente e [piety|E] para ir à [war|E].\n\nQualquer [ruler|E] não [ai_cautious_personality|E] tem o potencial de se tornar um $game_concept_ai_conqueror_personality$, mas normalmente não há mais do que um punhado de Governantes em todo o mundo com esse arquétipo."
 game_concept_ai_conquerors_personality:0 "Conquistadores"
 game_concept_ai_economical_boom_personality:0 "Construtor"
 game_concept_ai_economical_boom_personality_desc:0 "Um governante com personalidade $game_concept_ai_economical_boom_personality$ quer investir todo o seu [gold|E] no [realm|E]. Eles esvaziarão seu tesouro para financiar [buildings|E] e [men_at_arms|E], e frequentemente construirão mais [economic_buildings|E] e [holdings|E]. Eles só economizarão ouro se estiverem diretamente ameaçados, como por uma [faction|E] forte.\n\nOs governantes com personalidade $game_concept_ai_economical_boom_personality$ são um pouco menos propensos a criar e promover [legends|E].\n\nGovernantes audaciosos com uma propensão para construir e sem uma inclinação particular para a [war|E] tendem a ser $game_concept_ai_economical_boom_personality$es.\nTraços comuns incluem [GetTrait('calm').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )], [GetTrait('generous').GetName( GetNullCharacter )], [GetTrait('stubborn').GetName( GetNullCharacter )], [GetTrait('profligate').GetName( GetNullCharacter )] e [GetTrait('improvident').GetName( GetNullCharacter )]. Governantes com o [GetFocus('stewardship_domain_focus').GetName] também tendem a ser Construtores."
 game_concept_ai_economical_unpredictable_personality:0 "Imprevisível"
 game_concept_ai_economical_unpredictable_personality_desc:0 "Um governante $game_concept_ai_economical_unpredictable_personality$ não possui [traits|E] que o direcionem para qualquer Arquétipo Econômico específico e pode decidir por qualquer estratégia.\n\nEles podem optar por investir temporariamente pesadamente em [buildings|E], como um [ai_economical_boom_personality|E], ou construir seu [realm|E] lentamente com uma reserva de [gold|E]. Eles vão à [war|E] em um ritmo regular."
 game_concept_ai_pious_builder_personality:0 "Construtor Piedoso"
 game_concept_ai_pious_builder_personality_desc:0 "Um $game_concept_ai_pious_builder_personality$ deseja investir todo o seu [gold|E] em aumentar sua [piety|E].\n\nEles gastam seu tesouro para financiar [buildings|E], [great_projects|E], [activities|E] e [decisions|E] religiosos e cerimoniais, e frequentemente constroem mais [pious_buildings|E] e [holdings|E] do tipo [temple|E] ou [temple_citadel|E]. Eles só acumulam ouro se estiverem diretamente ameaçados, como por uma forte [faction|E].\n\n$game_concept_ai_pious_builder_personality$s têm mais probabilidade de criar e promover [legends|E] sagradas.\n\n[rulers|E] zelosos [AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ai_pious_builder_personality_desc_or_mandala' )]com inclinação para a [virtue|E] e sem interesse particular por [war|E], tendem a ser $game_concept_ai_pious_builder_personality$s.\nTraços comuns incluem [GetTrait('zealous').GetName( GetNullCharacter )], [GetTrait('forgiving').GetName( GetNullCharacter )], [GetTrait('improvident').GetName( GetNullCharacter )], [GetTrait('humble').GetName( GetNullCharacter )], [GetTrait('patient').GetName( GetNullCharacter )], [GetTrait('diligent').GetName( GetNullCharacter )] e [GetTrait('generous').GetName( GetNullCharacter )]. Governantes com o [GetFocus('learning_theology_focus').GetName] também tendem a ser $game_concept_ai_pious_builder_personality$s."
 game_concept_ai_pious_builder_personality_desc_or_mandala:0 "ou [mandala|E] "
 game_concept_ai_warlike_personality:0 "Guerrilheiro"
 game_concept_ai_warlike_personality_desc:0 "Um [ruler|E] com personalidade $game_concept_ai_warlike_personality$ quer estar pronto para declarar [war|E], sempre. Eles guardarão [gold|E] para a [war|E] antes de investir em desenvolver seu [realm|E]. Se um Governante com personalidade $game_concept_ai_warlike_personality$ estiver em paz por um longo período de tempo, eles usarão o Ouro em seu cofre de guerra para construir as [buildings|E].\n\nOs governantes com personalidade $game_concept_ai_warlike_personality$ são mais propensos a criar e promover [legends|E] heroicas.\n\nOs Governantes audaciosos e gananciosos tendem a ser Guerreiros.\nTraços comuns incluem [GetTrait('wrathful').GetName( GetNullCharacter )], [GetTrait('impatient').GetName( GetNullCharacter )], [GetTrait('sadistic').GetName( GetNullCharacter )], [GetTrait('ambitious').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], [GetTrait('irritable').GetName( GetNullCharacter )] e [GetTrait('zealous').GetName( GetNullCharacter )]."
 game_concept_alliance:0 "Aliança"
 game_concept_alliance_desc:0 "Uma $game_concept_alliance$ é uma relação diplomática entre dois [rulers|E]. Governantes [Concept('independent', 'Independentes')|E] podem chamar seus Aliados para se juntarem às suas [wars|E].\n\nAs alianças são criadas e mantidas por meio de um [marriage|E] ou [betrothal|E], desde que os dois personagens que se casam estejam suficientemente relacionados aos dois governantes. Por exemplo, se um [king|E] casa sua filha com o filho de outro rei, os dois reis se tornam Aliados.\n\n[lieges|E] também podem criar $game_concept_alliances$ com seus [vassals|E]. O Senhor feudal não pode convocar o Vassalo para a guerra, mas impede que eles se juntem as [factions|E]."
 game_concept_alliances:0 "Alianças"
 game_concept_allied:0 "Aliado"
 game_concept_allies:0 "Aliados"
 game_concept_ally:0 "Aliado"
 game_concept_ally_i:0 "@alliance_icon!"
 game_concept_archer:0 "Arqueiro"
 game_concept_archer_cavalry:0 "Arqueiros Montados"
 game_concept_archer_cavalry_desc:0 "$game_concept_archer_cavalry$ são [men_at_arms|E] montados, equipados com armas de longo alcance.\n\nEmbora todos os tipos de $game_concept_archer_cavalry$ sejam únicos, eles geralmente são [heavy_infantry|E] e, por sua vez, são contrapostos por [archers|E] com bestas.\n\n$game_concept_archer_cavalry$ também são frequentemente fortes em [terrains|E] planos, especialmente em estepes."
 game_concept_archers:0 "Arqueiros"
 game_concept_archers_desc:0 "Arqueiros são [men_at_arms|E] que lutam a pé com armas de longo alcance.\n\nEnquanto cada tipo de Arqueiro é único, eles costumam [counters|E] [skirmishers|E], e sofrem Contra-Ataques de [heavy_cavalry|E] e [light_cavalry|E]."
 game_concept_armies:0 "Exércitos"
 game_concept_army:0 "Exército"
 game_concept_army_commander:0 "Comandante de Exército"
 game_concept_army_commander_desc:0 "Um $game_concept_army_commander$ é um personagem sob comando de um [army|E]. Qualquer um dos seus [courtiers|E] ou [vassals|E] diretos pode ser designado como um Comandante (sujeito à idade, [health|E], e [doctrines|E]).\n\nEm [battle|E], à [martial_skill|E] de um Comandante influência muito a [advantage|E]. Enquanto o Comandante estiver presente, [rolls|E] adicionais serão feitas para tentar aumentar a $game_concept_advantage$.\n\nAlém do mais, [commander_traits|E] podem fornecer à um Exército muitos benefícios diferentes, dentro e fora de Batalha."
 game_concept_army_commanders:0 "Comandantes de Exército"
 game_concept_army_desc:0 "Os exércitos são usados para vencer [wars|E] ao se envolver em [battle|E] com outros exércitos, e para [besiege|E] e [occupy|E] territórios inimigos fortificados. Os exércitos são recrutados nos [rally_points|E] e consistem principalmente de [levies|E] e [men_at_arms|E], mas também podem ser reforçados por [mercenaries|E] e [holy_orders|E].\n\nOs exércitos podem se mover por água pagando uma quantia em [gold|E] para garantir o transporte. Eles podem sofrer perdas por [attrition|E] se o [barony|E] local não conseguir fornecer [Concept('supply', 'Suprimentos')|E] adequados."
 game_concept_artifact_rarity:0 "Raridade de Artefato"
 game_concept_artifact_rarity_desc:0 "Alguns [artifacts|E] são mais raros do que outros, o que é refletido em sua raridade.\n\nOs níveis variam da raridade mais baixa para a mais alta:\n$BULLET_WITH_TAB$Comum (não mostrado por padrão)\n$BULLET_WITH_TAB$$masterwork$\n$BULLET_WITH_TAB$$famed$\n$BULLET_WITH_TAB$$illustrious$"
 game_concept_asexual:0 "Assexual"
 game_concept_asexual_desc:0 "Em #EMP Crusader Kings III#!, este personagem sente pouca ou nenhuma atração por outros personagens, independentemente do gênero."
 game_concept_assault:0 "Assaltar"
 game_concept_assault_desc:0 "Um Assalto ocorre quando um [army|E] que está [besieging|E] tenta invadir uma [fortified_holding|E] correndo o risco de perder muitos [soldiers|E]. Assaltos só podem ocorrer se as muralhas da Propriedade estiverem Quebradas, o que só ocorre se o Exército tiver [siege_weapons|E]."
 game_concept_assaulted:0 "Assaltou"
 game_concept_assaulting:0 "Assaltando"
 game_concept_assaults:0 "Assaultos"
 game_concept_at_peace_opinion:0 "Opinião sobre Paz"
 game_concept_at_peace_opinion_desc:0 "Personagens que possuem o [core_tenet|E] [GetFaithDoctrine('tenet_warmonger').GetBaseName] como parte de sua [faith|E] terão a '$game_concept_at_peace_opinion$' em vez da penalidade de [offensive_war_opinion|E].\n\nSe você estiver em paz por muito tempo, seus [vassals|E] pensarão menos de você #weak (se eles compartilharem sua Fé).#!"
 game_concept_at_peace_opinion_short:0 "Paz"
 game_concept_attracted:0 "Atraído"
 game_concept_attraction:0 "Atração"
 game_concept_attraction_desc:0 "A atração é um tipo de [opinion|E] que afeta somente personagens cuja [sexuality|E] corresponde ao seu gênero.\n\nPor exemplo, um homem [homosexual|E] experimentará essa Opinião em relação a outros homens, um personagem [asexual|E] não experimentará em relação a ninguém, e uma mulher [heterosexual|E] experimentará em relação aos homens.\n\nEsse tipo de Opinião deixa de ter efeito para mulheres acima de [GetDefine('NCharacter', 'FEMALE_ATTRACTION_CUTOFF_AGE')] anos de idade e para homens acima de [GetDefine('NCharacter', 'MALE_ATTRACTION_CUTOFF_AGE')] anos de idade."
 game_concept_attrition:0 "Atrito"
 game_concept_attrition_desc:0 "[armies|E] podem sofrer $game_concept_attrition$, que é quando [soldiers|E] são perdidos por deserção, doenças ou fome.\n\n$game_concept_attrition$ ocorre quando um Exército está sem [Concept('supplies', 'Suprimento')|E], sitiando uma [fortified_holding|E], ou se movendo de um [county|E] hostil para outro, se a localização alvo não fizer fronteira com um $game_concept_county$ já controlado."
 game_concept_attrition_i:0 "@attrition_icon!"
 game_concept_autonomous_vassals:0 "Vassalos Autônomos"
 game_concept_autonomous_vassals_crown_authority:0 "Autoridade da Coroa de Vassalos Autônomos"
 game_concept_autonomous_vassals_crown_authority_desc:0 "'$game_concept_autonomous_vassals$' é o nível mais baixo da [crown_authority|E]. Neste nível, [vassals|E] não têm nenhuma penalidade de [opinion|E] contra seu [liege|E], e seu senhor feudal tem apenas poderes básicos sobre eles."
 game_concept_available_spouse:0 "Côjuge Disponível"
 game_concept_available_spouse_desc:0 "Para servir no [council|E] de um governante, um [spouse|E] deve estar disponível para desempenhar as responsabilidades desse cargo.\n\nVárias circunstâncias podem impedir um $game_concept_spouse$ de cumprir essas responsabilidades, mas algumas das mais comuns incluem:\n$BULLET_WITH_TAB$Ser o [ruler|E] de seu próprio [realm|E]\n$BULLET_WITH_TAB$Residir na [court|E] de outro Governante\n$BULLET_WITH_TAB$Estar [imprisoned|E], tanto em casa como no exterior\n$BULLET_WITH_TAB$Possuir o [trait|E] [GetTrait('incapable').GetName( GetNullCharacter )]\n\nSe um Cônjuge indisponível tornar-se disponível novamente, ele retomará automaticamente suas funções no Conselho.\n\nCônjuges que são Governantes por direito próprio ainda podem servir no Conselho se forem seus [direct_vassals|E], mas caso contrário nunca serão considerados disponíveis."
 game_concept_banish:0 "Banir"
 game_concept_banish_reason:0 "Motivo de Banimento"
 game_concept_banish_reason_desc:0 "Um $game_concept_banish_reason$ dá a um [liege|E] a oportunidade de banir livremente qualquer súdito que tenha em sua [dungeon|E]. Eles são mais frequentemente obtidos pelo súdito sendo um [criminal|E]."
 game_concept_banish_reasons:0 "Motivos de Banimento"
 game_concept_banished:0 "Banido"
 game_concept_banishment:0 "Banimento"
 game_concept_banishment_desc:0 "Personagens [Concept('imprisoned', 'Aprisionados')|E] podem ser Banidos do [realm|E], o que é indiscutivelmente a forma mais dura de punição. Governantes [landed|E] Banidos são depostos, Enquanto [courtiers|E] Banidos têm seus bens apreendidos.\n\nBanimento sem uma razão (Por exemplo, algum [crime|E] severo) é considerado um ato extremamente [tyrannical|E]."
 game_concept_baron:0 "Barão"
 game_concept_baron_desc:0 "Um $game_concept_baron$ é um [ruler|E] cujo [primary_title|E] é um [barony|E].\n\nSeu [rank|E] é o mais baixo possível, diretamente abaixo dos [counts|E]. Por isso, eles não podem ter [vassals|E], e qualquer não-$game_concept_baron$ pode ser seu [liege|E]."
 game_concept_baronies:0 "Baronatos"
 game_concept_barons:0 "Barões"
 game_concept_barony:0 "Baronato"
 game_concept_barony_desc:0 "Um $game_concept_barony$ é um [title|E] do menor [title_tier|E].\n\n$game_concept_baronies$ possuem a menor área no mapa, organizadas dentro de [counties|E] maiores.\n\n$game_concept_barony$ $game_concept_titles$ devem sempre ter um [holder|E] se contiverem uma [holding|E]."
 game_concept_barter:0 "Troca"
 game_concept_barter_desc:0 "Os [rulers|E] do [GetGovernment( 'wanua_government' ).GetName] podem reunir [barterers|E] para ganhar [gold|E] por meios pacíficos. A troca funciona de forma semelhante ao [raid|E], com algumas diferenças importantes — não é uma ação de [hostile_army|E] e exige [barter_goods|E].\n\nVocê precisa de #V 2#! Bens de Troca para ganhar #V 1#! [loot|E] de uma [holding|E]. Se você tiver muito pouco, nada acontecerá.\n\nA troca é uma ação amigável, e a propriedade alvo receberá [GetModifier('recently_bartered_modifier').GetNameWithTooltip] ao ser concluída. Ao contrário do Saque, você pode realizar Trocas livremente nas terras de seus [tributaries|E] e [suzerain|E]."
 game_concept_barter_goods:0 "Bens de Troca"
 game_concept_barter_goods_desc:0 "Os Bens de Troca — que representam vários tipos de mercadorias insulares, como peixes secos ou artesanatos de [Glossary('rattan', 'RATTAN_GLOSS')] — são usados para [barter|E] e manter [armies|E] pelos [rulers|E] do [GetGovernment( 'wanua_government' ).GetName].\n\nOs $game_concept_barter_goods$ são produzidos pelo [GetBuilding('tribe_01').GetName] e por outras [buildings|E]."
 game_concept_barter_goods_i:0 "@barter_goods_icon!"
 game_concept_barter_i:0 "@barter_icon!"
 game_concept_bartered:0 "Trocado"
 game_concept_barterer:0 "Trocador"
 game_concept_barterer_desc:0 "Os [rulers|E] do [GetGovernment( 'wanua_government' ).GetName] podem realizar [barter|E] levantando seus [armies|E] como $game_concept_barterers$. Eles funcionam de forma semelhante aos [raiders|E], exceto que não serão uma [hostile_army|E] para o [holder|E] da [holding|E] alvo.\n\nExércitos de Saqueadores de outros governantes podem lutar contra Trocadores e roubar seu [loot|E]."
 game_concept_barterers:0 "Trocadores"
 game_concept_bartering:0 "Trocando"
 game_concept_barters:0 "Trocas"
 game_concept_bastard:0 "Bastardo"
 game_concept_bastard_desc:0 "$game_concept_bastards$ são filhos ilegítimos nascidos fora do casamento. Como tal, eles são impedidos de herdar [titles|E]. No entanto, seus pais podem [Concept( 'legitimized', 'legitimizar' )|E] seu filho com a aprovação do [house_head|E].\n\nA qual [house|E] um bastardo pertence é determinado pelas [doctrines|E] da [faith|E] de seus pais quando eles nascem.\n\nSe os Bastardos receberem títulos ou tiverem filhos, eles fundarão uma nova [dynasty|E]."
 game_concept_bastards:0 "Bastardos"
 game_concept_bastardy:0 "Bastardia"
 game_concept_bastardy_desc:0 "$game_concept_bastard_desc$"
 game_concept_battle:0 "Batalha"
 game_concept_battle_advantage:0 "Vantagem de Batalha"
 game_concept_battle_advantage_desc:0 "$game_concept_battle_advantage$ faz com que um dado da [battle|E] cause mais dano. Quanto maior a $game_concept_advantage$, mais dano os [soldiers|E] irão causar.\n\nBatalhas costumam começar com um lado tendo uma Vantagem maior baseada no [terrain|E], e na [martial_skill|E] e [commander_traits|E] do [commander|E]. Qualquer lado então pode ganhar $game_concept_advantage$ adicional por [rolls|E] do $game_concept_commander$."
 game_concept_battle_desc:0 "$game_concept_battles$ se iniciam quando dois [armies|E] opostos se encontram no mesmo [barony|E].\n\nNo início de uma $game_concept_battle$, um lado normalmente começa com uma [advantage|E] que depende de fatores como [terrain|E], [commander|E] e [commander_traits|E].\n\nExércitos sofrem [casualties|E] baseadas na quantidade de [damage|E] sofrido. Uma $game_concept_battle$ entra no estágio de [aftermath|E] quando não há nenhum [soldier|E] restante em um dos lados.\n\nO vencedor de uma $game_concept_battle$ é premiado com [war_score|E] dependente da magnitude da vitória."
 game_concept_battles:0 "Batalhas"
 game_concept_behave:0 "Comportar-se"
 game_concept_beneficiaries:0 "Beneficiários"
 game_concept_beneficiary:0 "Beneficiário"
 game_concept_beneficiary_desc:0 "Todo participante em uma [great_holy_war|E] pode escolher um $game_concept_beneficiary$ de sua [dynasty|E]. Em uma Vitória, o $game_concept_beneficiary$ irá receber terras no reino alvo proporcionalmente à [war_contribution|E] do Governante patrono.\n\nO maior contribuídor pode forçar o seu beneficiário a receber o título principal sendo disputado."
 game_concept_besiege:0 "Sitiar"
 game_concept_besieged:0 "Sitiada"
 game_concept_besieging:0 "Sitiando"
 game_concept_best_friend:0 "Melhor Amigo"
 game_concept_best_friend_desc:0 "Um $game_concept_best_friend$ é uma $game_concept_relation$ que indica dedicação e apoio vitalícios. É uma relação mais forte do que a de um [friend|E]. Um [character|E] pode ter apenas um $game_concept_best_friend$."
 game_concept_best_friend_possessive:0 "Do Melhor Amigo"
 game_concept_best_friends:0 "Melhores Amigos"
 game_concept_best_friends_possessive:0 "Dos Melhores Amigos"
 game_concept_bestow_royal_favor:0 "$task_bestow_royal_favor$"
 game_concept_bestow_royal_favor_desc:0 "Uma [councillor_task|lE] realizada pelo [chancellor|lE] que melhora a opinião de um [vassal|E] escolhido do [realm|lE] sobre seu [liege|lE]."
 game_concept_betrothal:0 "Noivado"
 game_concept_betrothal_desc:0 "[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_betrothal_desc_TOTO_DLC', 'game_concept_betrothal_desc_NO_TOTO_DLC' )]"
 game_concept_betrothal_desc_NO_TOTO_DLC:0 "Um $game_concept_betrothal$ é uma promessa de um futuro [marriage|E] que pode ser feita quando uma das partes ainda não é um [adult|E].\n\nOs betrothals podem conceder [alliances|E] assim como os casamentos, mas podem ser facilmente rompidos. Ao atingir a idade adulta, o betrothal pode ser convertido em um casamento adequado."
 game_concept_betrothal_desc_TOTO_DLC:0 "Um $game_concept_betrothal$ é uma promessa de um futuro [marriage|E]. Pode ser feito quando uma das partes ainda não é um [adult|E], ou quando um [GetActivityType( 'activity_wedding' ).GetName] é [grand_wedding_promised|E].\n\nOs noivos podem conceder [alliances|E] assim como os casamentos. Os noivos regulares podem durar o tempo necessário e ser facilmente rompidos. Eles podem ser convertidos em um casamento adequado ao atingir a idade adulta, enquanto o Grande Casamento de Noivado são convertidos em um casamento ao completar um [GetActivityType( 'activity_wedding' ).GetName]."
 game_concept_betrothals:0 "Noivados"
 game_concept_betrothed:0 "Noivo"
 game_concept_bisexual:0 "Bissexual"
 game_concept_bisexual_desc:0 "Em #EMP Crusader Kings III#!, este personagem é atraído por personagens do mesmo gênero ou do gênero oposto."
 game_concept_blackmail:0 "Chantagear"
 game_concept_blackmail_desc:0 "Se você souber de um [secret|E] de [crime|E] de outro Personagem, você pode usar uma [character_interaction|E] de $game_concept_blackmail$ para potencialmente ganhar um [hook|E] sobre essa pessoa.\n\nA força deste Gancho varia conforme a serveridade do Segredo, o que é normalmente determinado por [doctrines|E]."
 game_concept_blackmailed:0 "Chantageou"
 game_concept_blackmailing:0 "Chantageando"
 game_concept_bloc_expansion:0 "Expansão de Bloco"
 game_concept_bloc_expansion_war:0 "Guerra de Expansão de Bloco"
 game_concept_bloc_expansion_war_desc:0 "Uma $game_concept_bloc_expansion_war$ é um tipo especial de [war|E] travada por um membro de um [bloc|E].\n\nSe vitorioso, o vencedor pode nomear um [ruler|E] para os [titles|E] disputados ou mantê-los para si.\n\nNomear um $game_concept_ruler$ dessa forma concederá um [hook|E] sobre o beneficiário, o adicionará ao $game_concept_bloc$ do vencedor e fundará uma nova [house|E] caso o beneficiário não seja um [house_head|E]."
 game_concept_bloc_supremacy:0 "Supremacia de Bloco"
 game_concept_bloc_supremacy_war:0 "Guerra de Supremacia de Bloco"
 game_concept_bloc_supremacy_war_desc:0 "Uma $game_concept_bloc_supremacy_war$ é um tipo especial de [war|E] travada entre os [leading_houses|E] de dois [house_blocs|E] [soryo|E].\n\n#high Diferente de outras $game_concept_wars$, todos os membros de ambos os $game_concept_blocs$ participarão.#!\n\nO $game_concept_bloc$ vitorioso ganhará [cohesion|E], enquanto o $game_concept_bloc$ derrotado perderá um terço de sua $game_concept_cohesion$.\n\nAlém disso, quaisquer [member_houses|E] [soryo|E] do $game_concept_bloc$ derrotado cujo [house_head|E] não seja [GetTrait('loyal').GetName( GetNullCharacter )], [hooked|E] por, um sub-[vassal|E] de, um [ally|E] de, [friends|E] com, ou [cowed|E] pelo $game_concept_house_head$ $game_concept_leading_house_possessive$ derrotado, se unirão ao $game_concept_bloc$ vitorioso."
 game_concept_blood_brother:0 "Irmão de Sangue"
 game_concept_blood_brother_desc:0 "Um $game_concept_blood_brother$ é uma forma especial de [friend|E] e [ally|E]. [characters|E] podem ter apenas um $game_concept_blood_brother$: este $game_concept_blood_brother$ se torna um membro simbólico de sua família (e, portanto, não deve já ser [family|E]). Se o chamado de [war|E] de um $game_concept_blood_brother$ for recusado, o [relation|E] será rompido e os dois se tornarão [rivals|E].\n\nIrmãos de Sangue, suas [children|E] e seus Cônjuges Primários têm uma [opinion|E] mútua aumentada e podem negociar [alliances|E] entre si.\n\nA Irmandade de Sangue está disponível através do [nomadic_government|E], do [trait|E] [GetTrait('nomadic_philosophy').GetName( GetNullCharacter )], ou via [tradition|E]."
 game_concept_blood_brother_possessive:0 "de Melhor Amigo"
 game_concept_blood_brotherhood:0 "Irmandade de Sangue"
 game_concept_blood_brothers:0 "Irmãos de Sangue"
 game_concept_blood_brothers_possessive:0 "de Melhores Amigos"
 game_concept_board_game:0 "Jogo de Tabuleiro"
 game_concept_board_game_game:0 "Jogo"
 game_concept_board_game_match:0 "Partida"
 game_concept_board_game_match_desc:0 "Um jogo de tabuleiro consiste em dois jogadores testando sua sorte e habilidade um contra o outro em um jogo de astúcia e chance. Eles podem ser jogados como partidas amistosas ou com uma aposta de algum tipo.\n\n#weak Existem muitos [board_game_types|E], embora as formas de [board_game_win|E] e jogar cada um permaneçam as mesmas. Somente as habilidades utilizadas diferem.#!"
 game_concept_board_game_type:0 "Tipo de Jogo de Tabuleiro"
 game_concept_board_game_type_chess:0 "Xadrez"
 game_concept_board_game_type_chess_desc:0 "$game_concept_board_game_type_desc_guts$\n\nNo $game_concept_board_game_type_chess$:\n$EFFECT_LIST_BULLET$ [martial|E] $game_concept_board_game_type_counters$ [learning|E]\n$EFFECT_LIST_BULLET$ [learning|E] $game_concept_board_game_type_counters$ [intrigue|E]\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [martial|E]"
 game_concept_board_game_type_counter:0 "contra-ataque"
 game_concept_board_game_type_counters:0 "contra-ataca"
 game_concept_board_game_type_desc:0 "$game_concept_board_game_type_desc_guts$\n\nJogos disponíveis são:\n$EFFECT_LIST_BULLET$ [board_game_type_chess|E]\n$EFFECT_LIST_BULLET$ [board_game_type_pachisi|E]\n$EFFECT_LIST_BULLET$ [board_game_type_hnefatafl|E]\n$EFFECT_LIST_BULLET$ [board_game_type_tabula|E]\n$EFFECT_LIST_BULLET$ [board_game_type_go|E]\n$EFFECT_LIST_BULLET$ [board_game_type_fidchell|E]"
 game_concept_board_game_type_desc_guts:0 "Ao jogar um $game_concept_board_game$, estilos de jogo diferentes $game_concept_board_game_type_counter$ seu oponente. Contrapor seus movimentos reduz drasticamente os pontos que eles ganham, mesmo se forem bem-sucedidos. Oponentes habilidosos podem observar suas próprias habilidades e tentar deliberadamente $game_concept_board_game_type_counter$ #EMP você#!."
 game_concept_board_game_type_fidchell:0 "Fidchell"
 game_concept_board_game_type_fidchell_desc:0 "$game_concept_board_game_type_desc_guts$\n\nNo jogo $game_concept_board_game_type_fidchell$:\n$EFFECT_LIST_BULLET$ [learning|E] $game_concept_board_game_type_counters$ [prowess|E]\n$EFFECT_LIST_BULLET$ [prowess|E] $game_concept_board_game_type_counters$ [diplomacy|E]\n$EFFECT_LIST_BULLET$ [diplomacy|E] $game_concept_board_game_type_counters$ [learning|E]"
 game_concept_board_game_type_go:0 "Go"
 game_concept_board_game_type_go_desc:0 "$game_concept_board_game_type_desc_guts$\n\nNo jogo $game_concept_board_game_type_go$:\n$EFFECT_LIST_BULLET$ [learning|E] $game_concept_board_game_type_counters$ [martial|E]\n$EFFECT_LIST_BULLET$ [martial|E] $game_concept_board_game_type_counters$ [intrigue|E]\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [learning|E]"
 game_concept_board_game_type_hnefatafl:0 "Hnefatafl"
 game_concept_board_game_type_hnefatafl_desc:0 "$game_concept_board_game_type_desc_guts$\n\nNo $game_concept_board_game_type_hnefatafl$:\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [martial|E]\n$EFFECT_LIST_BULLET$ [martial|E] $game_concept_board_game_type_counters$ [prowess|E]\n$EFFECT_LIST_BULLET$ [prowess|E] $game_concept_board_game_type_counters$ [intrigue|E]"
 game_concept_board_game_type_pachisi:0 "Pachisi"
 game_concept_board_game_type_pachisi_desc:0 "$game_concept_board_game_type_desc_guts$\n\nNo $game_concept_board_game_type_pachisi$:\n$EFFECT_LIST_BULLET$ [diplomacy|E] $game_concept_board_game_type_counters$ [intrigue|E]\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [stewardship|E]\n$EFFECT_LIST_BULLET$ [stewardship|E] $game_concept_board_game_type_counters$ [diplomacy|E]"
 game_concept_board_game_type_tabula:0 "Tabula"
 game_concept_board_game_type_tabula_desc:0 "$game_concept_board_game_type_desc_guts$\n\nNo $game_concept_board_game_type_tabula$:\n$EFFECT_LIST_BULLET$ [intrigue|E] $game_concept_board_game_type_counters$ [learning|E]\n$EFFECT_LIST_BULLET$ [learning|E] $game_concept_board_game_type_counters$ [stewardship|E]\n$EFFECT_LIST_BULLET$ [stewardship|E] $game_concept_board_game_type_counters$ [intrigue|E]"
 game_concept_board_game_types:0 "Tipos de Jogos de Tabuleiro"
 game_concept_board_game_win:0 "Venceu"
 game_concept_board_game_winning:0 "Vencendo"
 game_concept_board_game_winning_desc:0 "Vencer em um $game_concept_board_game$ é alcançado de uma das duas maneiras:\n$EFFECT_LIST_BULLET$ Obtendo uma vantagem dramática na pontuação sobre seu oponente.\n$EFFECT_LIST_BULLET$ Sendo o jogador defensor se não houver um vencedor claro após a rodada [EmptyScope.ScriptValue('bg_round_cap_value')|0]."
 game_concept_board_game_winning_sudden_death:0 "Morte Súbita"
 game_concept_board_games:0 "Jogos de Tabuleiro"
 game_concept_bred:0 "Reproduzido"
 game_concept_breed:0 "Reproduzir"
 game_concept_breeding:0 "Reprodução"
 game_concept_breeding_desc:0 "Organizar [marriages|E] entre personagens com bons [traits|E] [Concept('congenital', 'Congênitos')|E], tornará possível reproduzir filhos com os mesmos Traços. Filhos sortudos podem até mesmo nascer com uma versão ainda mais poderosa destes Traços.\n\nPorém, o mesmo é válido para Traços Congênitos ruins como o traço de [GetTrait('beauty_bad_2').GetName( GetNullCharacter )].\n\nPode ser tentador organizar casamentos entre personagens próximos para reproduzir melhores Traços para seus filhos, porém isto também traz a chance de tais filhos nascerem com defeitos de [inbreeding|E]."
 game_concept_builder_i:0 "@builder_icon!"
 game_concept_building:0 "Construção"
 game_concept_building_desc:0 "$game_concept_buildings$ são melhorias que podem ser feitas em [holdings|E].\n\nMuitos tipos de Construção só podem ser feitas em [baronies|E] específicos ou em um certo [terrain|E].\n\nCada Propriedade tem um número limitado de vagas para Construções, portanto uma propriedade é incapaz de conter todos os tipos de Construção. [county_capitals|E] têm acesso a uma Vaga de Construção adicional.\n\n[duchy_buildings|E] e [special_buildings|E] utilizam-se de suas próprias vagas."
 game_concept_buildings:0 "Construções"
 game_concept_bullies:0 "Valentões"
 game_concept_bullies_possessive:0 "Dos valentões"
 game_concept_bully:0 "Valentão"
 game_concept_bully_desc:0 "Um $game_concept_bully$ é uma [child|E] cruel que provoca outra $game_concept_child$ (sua [victim|E]), por diversão, lucro ou simplesmente tédio. Ao atingir a [adulthood|E], um $game_concept_bully$ pode se tornar um [rival|E], ou pode superar seu ódio infantil."
 game_concept_bully_possessive:0 "Do valentão"
 game_concept_buy_artifact_claim:0 "Reivindicação de artefato"
 game_concept_buy_artifact_claim_desc:0 "Uma interação que permite que um personagem compre [personal_artifact_claims|E] em troca de [piety|E] ou [prestige|E]."
 game_concept_buy_artifact_claim_interaction:0 "Interação de reivindicação de artefato"
 game_concept_buy_claim:0 "$buy_claim_interaction$"
 game_concept_buy_claim_desc:0 "Uma interação que permite a um personagem comprar [unpressed_claims|E] em troca de [piety|E].\n\n$EFFECT_LIST_BULLET$Um [vassal|E] não pode comprar uma reivindicação em qualquer [title|E] do seu [liege|E], e um Senhor Feudal não pode comprar uma reivindicação em qualquer título de um vassalo\n$EFFECT_LIST_BULLET$Um [king|E] ou [emperor|E] não pode comprar reivindicações em Títulos de Reino, e Imperadores não podem comprar reivindicações em outros Impérios\n$EFFECT_LIST_BULLET$Ninguém pode comprar uma reivindicação em seu [head_of_faith|E]"
 game_concept_buy_claim_interaction:0 "Interatividade de Compra de Reivindicação"
 game_concept_cadet_branch:0 "Ramo Cadete"
 game_concept_cadet_branches:0 "Ramos Cadete"
 game_concept_cadet_branching:0 "Ramificação Cadete"
 game_concept_cadet_branching_desc:0 "[dynasties|E] sempre terão uma [house|E] fundadora, porém para se tornarem [house_heads|E], membros da [house|E] podem optar por criarem suas prórimas Casas — um Ramo Cadete.\n\nMembros destas Casas são livres para fazerem o mesmo, eventualmente criando uma árvore de Casas dentro de uma Dinastia maior."
 game_concept_calculating_schemes:0 "Esquemas Calculados"
 game_concept_camel_cavalry:0 "Cavalaria de Camelos"
 game_concept_camel_cavalry_desc:0 "$game_concept_camel_cavalry$ são [men_at_arms|E] montados que se assemelham à [light_cavalry|E], especialmente para reconhecimento e perseguição do inimigo.\n\nEles são geralmente contrapostos por $game_concept_light_cavalry$ e, por sua vez, são contrapostos por [spearmen|E].\n\n$game_concept_camel_cavalry$ também são frequentemente fortes em [terrains|E] desérticos e áridos."
 game_concept_capital:0 "Capital"
 game_concept_capital_duchy:0 "Ducado da Capital"
 game_concept_capital_duchy_desc:0 "O Modificador $game_concept_capital_duchy$ aumenta a quantidade de [levies|E] obtidas de todas as [holdings|E] que você possui dentro do mesmo [duchy|E] [de_jure|E] da sua [capital|E]. Ele também fornece um bônus a todos os [men_at_arms|E] [stationed|E]. Para que este modificador esteja ativo, você precisa pessoalmente possuir o Ducado associado.\n\nEste modificador não se acumula com o bônus da Capital do Reino."
 game_concept_capital_possessive:0 "da Capital"
 game_concept_capitals:0 "Capitais"
 game_concept_castle:0 "Castelo"
 game_concept_castle_holding:0 "Propriedade do Castelo"
 game_concept_castle_holding_desc:0 "Castelo é o [holding_type|E] mais fortificado e tem o mesmo padrão para [rulers|E] seja um governo [feudal|E], [clan|E], [tribal|E] ou uma [holy_order|E]. Ele costuma prover mais [levies|E] do que [taxes|E]."
 game_concept_castle_holdings:0 "Propriedades do Castelo"
 game_concept_castles:0 "Castelos"
 game_concept_casualties:0 "Casualidades"
 game_concept_casualty:0 "Casualidade"
 game_concept_casualty_desc:0 "[armies|E] sofrerão uma certa quantidade de $game_concept_casualties$ em uma [battle|E] dependente da quantidade de [damage|E] sofrido.\n\nQuando [soldiers|E] são removidos de uma $game_concept_battle$, eles irão ser considerados [routed_soldiers|E] ou [dead_soldiers|E]."
 game_concept_casus_belli:0 "Casus Belli"
 game_concept_casus_belli_desc:0 "Um 'Motivo para Guerra' necessário para declarar uma [war|E] contra outro [ruler|E]. O $game_concept_casus_belli$ especifica sobre o que a guerra é, normalmente um território específico — o [war_target|E]. Não é possível ganhar nada mais do que o $game_concept_casus_belli$ permitir, independente de o quão fácil o inimigo é derrotado.\n\nUm dos Casus Bellis mais importantes é o de [claims|E], seja ele um passado por [succession|E] ou da tarefa de [fabricate_claim|E]."
 game_concept_casus_bellis:0 "Casus Bellis"
 game_concept_cautious_i:0 "@cautious_icon!"
 game_concept_chancellor:0 "Chanceler"
 game_concept_chancellor_desc:0 "O $game_concept_chancellor$ é o [councillor|E] encarregado nos esforços diplomáticos, ambos dentro e fora do [realm|E]."
 game_concept_chancellors:0 "Chanceleres"
 game_concept_character:0 "Personagem"
 game_concept_character_death:0 "Morte de Personagem"
 game_concept_character_death_death:0 "Morte"
 game_concept_character_death_deaths:0 "Mortes"
 game_concept_character_death_desc:0 "A morte desencadeia uma [succession|E], o que é importante para [rulers|E].\n\nSe o Personagem de um Jogador morrer, o jogador irá continuar a jogar com o [player_heir|E] — ou irá sofrer um Fim de Jogo, se ele não tiver nenhum herdeiro válido."
 game_concept_character_death_die:0 "Morrer"
 game_concept_character_death_dies:0 "Morre"
 game_concept_character_death_dying:0 "Morrendo"
 game_concept_character_desc:0 "Os personagens podem ser [nobles|E] ou [Concept('lowborn', 'Plebeus')|E], [landed|E] ou [unlanded|E], cada um com seu próprio conjunto de [skills|E], [traits|E], objetivos e aspirações. Eles se apresentam como [rulers|E], [courtiers|E] e [guests|E]. Desde que estejam dentro da [diplomatic_range|E], podem interagir uns com os outros."
 game_concept_character_interaction:0 "Interação de Personagem"
 game_concept_character_modifier:0 "Modificador de Personagem"
 game_concept_character_modifier_desc:0 "[modifiers|E] mantidos por um Personagem, afetando sua personalidade, [skills|E], e até mesmo [income|E]. Ao contrário dos [traits|E], os $game_concept_character_modifiers$ tendem a representar efeitos temporários."
 game_concept_character_modifiers:0 "Modificadores de Personagem"
 game_concept_character_personality:0 "Personalidade"
 game_concept_character_possessive:0 "do Personagem"
 game_concept_characters:0 "Personagens"
 game_concept_characters_possessive:0 "dos Personagens"
 game_concept_child:0 "Criança"
 game_concept_child_desc:0 "Uma $game_concept_child$ é um personagem com menos de #V 16#! anos de idade."
 game_concept_child_health:0 "Saúde Infantil"
 game_concept_child_health_desc:0 "Certos [traits|E], como [GetTrait('measles').GetName( GetNullCharacter )], são especialmente perigosos para as [children|E].\n\nQualquer penalidade para $game_concept_child_health$ acumula com as penalidades regulares para a [health|E], mesmo dos mesmos Traços."
 game_concept_child_possessive:0 "da Criança"
 game_concept_childhood_trait:0 "Traço de Infância"
 game_concept_childhood_trait_desc:0 "Toda criança recebe um Traço de Infância enquanto eles estão crescendo, como o traço de [GetTrait('rowdy').GetName( GetNullCharacter )] ou [GetTrait('charming').GetName( GetNullCharacter )].\n\nO traço recebido irá indicar qual [education_focus|E] combina mais com eles."
 game_concept_children:0 "Crianças"
 game_concept_church:0 "Igreja"
 game_concept_church_authority:0 "Autoridade da Igreja"
 game_concept_church_authority_desc:0 "$game_concept_church_authority$ representa o poder que um [theocratic|E] [ruler|E] exerce sobre seu [clergy|E] e seus [vassals|E].\n\nHá quatro níveis de $game_concept_church_authority$; $church_authority_0$, $church_authority_1$, $church_authority_2$ e $church_authority_3$. Aumentar a $game_concept_church_authority$ custa uma quantidade de [piety|E] e [prestige|E] dependendo do nível e da [learning_skill|E] do governante.\n\n#weak Os vassalos desaprovam níveis mais altos de $game_concept_church_authority$, e reduzi-la é o objetivo principal das [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!"
 game_concept_church_holding:0 "Propriedade da Igreja"
 game_concept_church_holdings:0 "Propriedades da Igreja"
 game_concept_church_property:0 "Propriedades da Igreja"
 game_concept_church_property_desc:0 "Propriedades da Igreja são [temples|E] sob controle de um [realm_priest|E].\n\nEm [faiths|E] com a [doctrine|E] de [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName], não existem Propriedades da Igreja e [temples|E] podem ser diretamente controlados por [rulers|E] seculares sem penalidades."
 game_concept_cities:0 "Cidades"
 game_concept_city:0 "Cidade"
 game_concept_city_holding:0 "Propriedade da Cidade"
 game_concept_city_holding_desc:0 "Cidade é o [holding_type|E] mais rico, favorcendo mais [taxes|E] do que [levies|E]. Estão associadas às [republics|E], e controlá-las com qualquer outra [government_form|E] irá sempre resultar em penalidades."
 game_concept_city_holdings:0 "Propriedades da Cidade"
 game_concept_civil_war:0 "Guerra Civil"
 game_concept_civil_war_desc:0 "Uma [war|E] onde um ou mais [vassals|E] e/ou [counties|E] levantam uma revolta contra seu [liege|E]. Eles geralmente são o resultado de uma [faction|E] cujas demanas não foram acatadas.\n\nPerder uma $game_concept_civil_war$ costuma ter mais consequências do que as demandas originais da facção que se rebelou."
 game_concept_civil_wars:0 "Guerras Civis"
 game_concept_claim:0 "Reivindicação"
 game_concept_claim_i:0 "@pressed_claim!"
 game_concept_claimant:0 "Reivindicador"
 game_concept_claimant_desc:0 "Um $game_concept_claimant$ é uma pessoa com uma ou mais [claims|E] em [titles|E]. Um [ruler|E] Reivindicador podem pressionar estas reivindicações utilizando o [casus_belli|E] de Reivindicação para declarar [wars|E].\n\nEste Casus Belli também pode ser usado para pressionar as Reivindicações de [vassals|E] ou até mesmo de personagens [unlanded|E] em seu [realm|E].\n\nReivindicadores também podem liderar [factions|E] — mesmo se eles não residirem no seu Reino."
 game_concept_claimant_faction:0 "$claimant_faction$"
 game_concept_claimant_faction_desc:0 "A $game_concept_claimant_faction$ busca instalar um determinado [claimant|E] no trono de um [title|E] mantido por seu [liege|E]. Se bem-sucedida, o Senhor Feudal terá que renunciar ao título para o reivindicante e a estrutura [vassal|E] será atualizada adequadamente. Todos os membros da [faction|E] ganharão um [hook|E] no reivindicante."
 game_concept_claimant_factions:0 "Facções de Reivindicação"
 game_concept_claimant_possessive:0 "do Reivindicador"
 game_concept_claimants:0 "Reivindicadores"
 game_concept_claimed:0 "Reivindicado"
 game_concept_claims:0 "Reivindicações"
 game_concept_clan:0 "Clã"
 game_concept_clan_desc:0 "Os clãs são uma [government_form|E] em que a quantidade de [levies|E] e [taxes|E] fornecidos a um [liege|E] por seus [vassals|E] é determinada pela [aptitude|E] do [tax_collector|E] desse Senhor Feudal. Os clãs também fazem uso da [house_unity|E]."
 game_concept_clan_government:0 "Governo do Clã"
 game_concept_clan_house_head:0 "Chefe da Casa do Clã"
 game_concept_clan_house_head_desc:0 "Um $game_concept_clan_house_head$ é de muitas maneiras semelhante a um [house_head|E] normal, mas difere em alguns aspectos notáveis.\n\n$game_concept_clan_house_heads$ não adquirem um [weak_hook|E] com todos os membros de sua [house|E]. Eles têm mais influência sobre a [house_unity|E] do que outros membros da casa. Além disso, qualquer membro da casa pode desafiar um $game_concept_clan_house_head$ para se tornar o $game_concept_house_head$ eles próprios."
 game_concept_clan_house_head_head:0 "$game_concept_house_head_head$"
 game_concept_clan_house_heads:0 "Chefes das Casas do Clã"
 game_concept_clan_i:0 "@government_type_clan!"
 game_concept_clans:0 "Clãs"
 game_concept_clergy:0 "Clero"
 game_concept_clergy_desc:0 "[court_chaplains|E], [realm_priests|E], Governantes [Concept('theocratic', 'Teocráticos')|E], e qualquer um com o traço de [GetTrait('devoted').GetName( GetNullCharacter )] são considerados membros do Clero.\n\nAs [doctrines|E] da [faith|E] determinam quem pode ser um membro do Clero, e se membros do Clero podem se casar, herdar terras, etc."
 game_concept_clergy_opinion:0 "Opinião do Clero"
 game_concept_clergy_opinion_desc:0 "Este tipo de [opinion|E] só afeta o [clergy|E] de sua própria [faith|E]."
 game_concept_clerical:0 "Clerical"
 game_concept_close_family:0 "Família Próxima"
 game_concept_close_family_desc:0 "A Família Próxima de um personagem inclui:\n$BULLET_WITH_TAB$Pais\n$BULLET_WITH_TAB$Avós\n$BULLET_WITH_TAB$Filhos\n$BULLET_WITH_TAB$Netos\n$BULLET_WITH_TAB$Irmãos"
 game_concept_close_family_member:0 "Membro Próximo da Família"
 game_concept_close_family_members:0 "Membros Próximos da Família"
 game_concept_co_emperor:0 "Co-Imperador"
 game_concept_co_emperors:0 "Co-Imperadores"
 game_concept_co_monarch:0 "Co-Monarca"
 game_concept_co_monarchies:0 "Co-Monarquias"
 game_concept_co_monarchs:0 "Co-Monarcas"
 game_concept_co_monarchy:0 "Co-Monarquia"
 game_concept_co_monarchy_desc:0 "$game_concept_co_monarchies$ são um tipo de [diarchy|E] que fornece ao [feudal|E] uma maneira de selecionar um [designated_heir|E] mesmo em [eras|E] mais antigas.\n\nO custo para isso é entrar em um acordo permanente de $game_concept_diarchy$ com eles, onde terão acesso facilitado a muitos dos mesmos poderes que um [entrenched_regent|E].\n\n#WEAK $game_concept_co_monarchs$ estão disponíveis apenas para [kings|E] e [emperors|E].#!"
 game_concept_co_ruler:0 "Co-Governante"
 game_concept_co_rulers:0 "Co-Governantes"
 game_concept_co_rulership:0 "Co-Governação"
 game_concept_co_rulership_desc:0 "$game_concept_co_rulers$ são uma forma de [diarchies|E] onde o [diarch|E] é considerado oficialmente e permanentemente a compartilhar o governo do [realm|E].\n\nEles são sempre o [designated_heir|E] (embora possam ainda perder eleições) e só podem ser removidos do cargo por [execution|E] — a menos que seu [liege|E] tenha uma [culture_tradition|E] apropriada, caso em que eles podem ser mutilados em vez disso.\n\nDe forma única, quando um $game_concept_co_ruler$ executa seu $game_concept_liege$ ou os derrota em uma guerra, ele [Concept('usurp', 'Usurpa')|E] seus [titles|E]. Em [cultures|E] onde a mutilação é uma forma aceitável de remover um $game_concept_co_ruler$, então o $game_concept_co_ruler$ pode também mutilar seu $game_concept_liege$ para $game_concept_usurpar$ eles.\n\n#WEAK Exemplos de $game_concept_co_rulerships$ incluem:\n$EFFECT_LIST_BULLET$[duumvirates|E]\n$EFFECT_LIST_BULLET$[nominal_duumvirates|E]\n$EFFECT_LIST_BULLET$[co_monarchies|E]#!"
 game_concept_co_rulerships:0 "Co-Governações"
 game_concept_cognomen:0 "Cognome"
 game_concept_cognomens:0 "Cognomes"
 game_concept_collect_taxes:0 "$task_collect_taxes$"
 game_concept_collect_taxes_desc:0 "$game_concept_collect_taxes$ é uma [councillor_task|E] realizada pelo [steward|E].\n\nAumenta todos os impostos no [domain|E] pessoal de um personagem."
 game_concept_combat_phase:0 "Fase de batalha"
 game_concept_combat_phase_desc:0 "Uma $game_concept_combat_phase$ é uma parte de uma [battle|E]. As batalhas possuem três fases distintas; [maneuver|E], [main_phase|E] e [aftermath|E]."
 game_concept_combat_roll:0 "Rolagem da Batalha"
 game_concept_combat_roll_desc:0 "Rolagens de [advantage|E] são feitar por cada [commander|E] durante uma [battle|E]. Estas são feitas em uma escada de 0 à 10 e são completamente aleatórias, mas podem ter um efeito decisivo no resultado de uma $game_concept_battle$."
 game_concept_combat_width:0 "Largura de Combate"
 game_concept_combat_width_desc:0 "$game_concept_combat_width$ indica a quantidade de [soldiers|E] que podem lutar ao mesmo tempo de cada lado em uma [battle|E], pode ser afetado por fatores como o [terrain|E].\n\nIsto previne que um lado oprima completamente o outro, e é determinado no início de uma Batalha."
 game_concept_command_modifier:0 "Modificador de Comando"
 game_concept_command_modifier_desc:0 "Este [modifier|E] está ativo apenas para [commanders|E].\n\nSe um personagem com um Modificador de Comando comanda um [Concept( 'army', 'exército' )|E], ele receberá este efeito."
 game_concept_command_modifier_i:0 "@command_modifier_icon!"
 game_concept_command_modifiers:0 "Modificadores de Comando"
 game_concept_commander:0 "Comandante"
 game_concept_commander_trait:0 "Traço de Comandante"
 game_concept_commander_trait_desc:0 "$game_concept_commander_traits$ são [traits|E] especiais que fornecem benefícios a personagens que estiverem como [commanders|E] de um [army|E].\n\nTraços de Comandante costumam ser adquiridos por crianças quando criadas com o [education_focus|E] Marcial, mas também podem ser ganhos por meio do [martial_lifestyle|E] dentre outras formas."
 game_concept_commander_traits:0 "Traços de Comandante"
 game_concept_commanders:0 "Comandantes"
 game_concept_commanding:0 "Comandando"
 game_concept_commission_epic:0 "$commission_epic_decision$"
 game_concept_commission_epic_decision:0 "Decisão de comissionar uma epopeia"
 game_concept_commission_epic_desc:0 "Uma [decision|E] que permite a um personagem trocar [gold|E] por um [artifact|E], ao encomendar um épico familiar.\nO épico fornecerá [dynasty_prestige|E] e também poderá conceder outros bônus dependendo de suas escolhas."
 game_concept_common:0 "$artifacts_rarity_common$"
 game_concept_commoner:0 "Cidadão"
 game_concept_commoner_desc:0 "Um Personagem $game_concept_commoner$ ou $game_concept_lowborn$ não é membro de uma [dynasty|E] [noble|E]. Eles podem, no entanto, ainda serem [rulers|E] poderosos das [theocracies|E] e [republics|E].\n\nSe um Plebeu se tornar um personagem [landed|E], eles irão se tornar Nobres imediatamente e irão fundar suas próprias [dynasties|E] (exceto em [republics|E] e [theocracies|E], que são governadas por Plebeus)."
 game_concept_commoners:0 "Cidadãos"
 game_concept_complete_control:0 "Controle Completo"
 game_concept_complete_control_desc:0 "Esta condição é cumprida quando todos os [titles|E] [de_jure|E] de vassalo do título alvo estiverem sob controle seja pelo [ruler|E] ou seus [vassals|E] e nenhum dos seus Condados está [Concept('occupied', 'Ocupado')|E] por [armies|E] inimigos."
 game_concept_complete_control_region:0 "Controle Completo"
 game_concept_complete_control_region_desc:0 "Esta condição é cumprida quando todos os [counties|E] da [region|E] alvo estiverem sob controle seja pelo governante ou seus [vassals|E] e nenhum dos seus Condados está Ocupado por exércitos inimigos."
 game_concept_completely_control:0 "Controle Completamente"
 game_concept_completely_control_region:0 "Controla Completamente"
 game_concept_completely_controlled:0 "Completamente Controlado"
 game_concept_completely_controls:0 "Controla Completamente"
 game_concept_completely_controls_region:0 "Controla Completamente"
 game_concept_concubinage:0 "Concubinato"
 game_concept_concubinage_desc:0 "Uma Concubina tem status inferior ao de um [spouse|E], permitido em [faiths|E] com a [doctrine|E] [GetFaithDoctrine('doctrine_concubines').GetBaseName].\n\nAo contrário do [marriage|E], a Concubinagem não gera [alliances|E]. As concubinas também podem ser dispensadas a qualquer momento, sem as complicações de um [divorce|E]. Os filhos das concubinas são considerados [Concept('legitimate', 'Legítimos')|E].\n\nA Concubinagem é mutuamente exclusiva com [GetFaithDoctrine('doctrine_polygamy').GetBaseName]."
 game_concept_concubine:0 "Concubina"
 game_concept_concubine_female:0 "Concubina"
 game_concept_concubine_male:0 "Concubino"
 game_concept_concubines:0 "Concubinas"
 game_concept_confidant:0 "$councillor_vizier$"
 game_concept_confidant_desc:0 "$councillor_vizier_desc$"
 game_concept_congenital:0 "Congênito"
 game_concept_congenital_desc:0 "Alguns [traits|E] são Congênitos e podem ser herdados por filhos. Através de [breeding|E] adequada, é até mesmo possível reforçar alguns destes Traços.\n\nPor exemplo, se ambos os pais tiverem o traço de [GetTrait('intellect_good_1').GetName( GetNullCharacter )], haverá uma chance que os filhos nasçam com um traço ainda melhor ([GetTrait('intellect_good_2').GetName( GetNullCharacter )]).\n\n[skills|E] base não são congênitas."
 game_concept_congenital_trait:0 "Traço Congênito"
 game_concept_congenital_traits:0 "Traços Congênitos"
 game_concept_conqueror_i:0 "@conqueror_icon!"
 game_concept_contest:0 "Competição"
 game_concept_contest_aptitude:0 "Aptidão para o Concurso"
 game_concept_contest_aptitude_desc:0 "Diferentes [contests|E] requerem diferentes talentos: a Pé, Montado, Arco, Inteligência ou uma combinação.\n\nSua aptidão é derivada das suas [skills|E], [health|E], [traits|E] e do nível de experiência em [GetTrait('tourney_participant').GetName( GetNullCharacter )].\n\nPor exemplo, um [GetTrait('giant').GetName( GetNullCharacter )] com alta [prowess|E] tem uma vantagem natural em um concurso de Luta."
 game_concept_contest_category_race:0 "Corrida"
 game_concept_contest_category_race_desc:0 "O vencedor das [contests|E] de $game_concept_contest_category_race$ é o [contest_qualifying|E] [contestant|E] cujo cavalo inscrito chega em primeiro lugar no final da corrida.\n\n$game_concept_contest_category_race$ Contests:\n$EFFECT_LIST_BULLET$Corrida de Cavalos"
 game_concept_contest_category_team:0 "Equipes"
 game_concept_contest_category_team_desc:0 "Nas [contests|E] de $game_concept_contest_category_team$, todos os [contest_qualifying|E] [contestants|E] da equipe com a maior pontuação combinada ao final do concurso recebem recompensas.\n\n$game_concept_contest_category_team$ Contests:\n$EFFECT_LIST_BULLET$Luta corpo a corpo"
 game_concept_contest_category_turn:0 "Rodadas"
 game_concept_contest_category_turn_desc:0 "O vencedor de uma [contest|E] de $game_concept_contest_category_turn$ é o [contest_qualifying|E] [contestant|E] com mais pontos ao final da competição.\n\n$game_concept_contest_category_turn$ Contests:\n$EFFECT_LIST_BULLET$Tiro com Arco\n$EFFECT_LIST_BULLET$Recital"
 game_concept_contest_category_versus:0 "Eliminação"
 game_concept_contest_category_versus_desc:0 "O vencedor de uma [contest|E] de $game_concept_contest_category_versus$ é o último que resta depois de três [contest_rounds|E] entre [contest_qualifying|E] [contestants|E].\n\n$game_concept_contest_category_versus$ Contests:\n$EFFECT_LIST_BULLET$Luta\n$EFFECT_LIST_BULLET$Duelo\n$EFFECT_LIST_BULLET$Justa\n$EFFECT_LIST_BULLET$Jogos de Tabuleiro"
 game_concept_contest_desc:0 "Um [GetActivityType( 'activity_tournament' ).GetName] é composto por uma série de $game_concept_contests$, selecionados pelo [activity_host|E], onde os [contest_qualifying|E] [contestants|E] podem competir para ganhar [prizes|E] e outras recompensas.\n\nCada $game_concept_contest$ usa uma das quatro maneiras diferentes de determinar um vencedor: [contest_category_versus|E], [contest_category_turn|E], [contest_category_team|E] e [contest_category_race|E].\n\nSua chance de vencer um $game_concept_contest$ é determinada por suas [skills|E], [traits|E], preparação e outros fatores. A elegibilidade para entrar em $game_concept_contests$ físicos é determinada pela saúde e sexo, com base na [culture|E] e [faith|E] do [activity_host|E]."
 game_concept_contest_qualification:0 "Qualificação"
 game_concept_contest_qualification_desc:0 "Embora um [GetActivityType( 'activity_tournament' ).GetName] atraia muitos [contestants|E] elegíveis, apenas um pequeno número se qualificará para cada [contest|E], com chance de ganhar glória e seu [prize|E].\n\nPara garantir a qualificação, seu [progress_to_victory|E] deve estar acima do limite quando o Concurso começar."
 game_concept_contest_qualifier:0 "Classificador"
 game_concept_contest_qualifiers:0 "Classificadores"
 game_concept_contest_qualifies:0 "Classifica"
 game_concept_contest_qualify:0 "Qualificar"
 game_concept_contest_qualifying:0 "Classificação"
 game_concept_contest_round:0 "Rodada do Concurso"
 game_concept_contest_round_desc:0 "[contest_category_versus|E] [contests|E] determinam um vencedor emparelhando todos os [contest_qualifying|E] [contestants|E] uns contra os outros em confrontos eliminatórios até restar apenas um.\n\nHá três rodadas: quartas de final, semifinais e a final."
 game_concept_contest_rounds:0 "Rodadas do Concurso"
 game_concept_contestant:0 "Participante"
 game_concept_contestant_desc:0 "Para competir em [contests|E] do [GetActivityType( 'activity_tournament' ).GetName], você deve cumprir seus requisitos. Jogos de Tabuleiro permitem que todos os personagens compitam, enquanto outros, como Luta, dependem das regras Marciais.\n\nPersonagens que não competem serão [spectators|E], e [contestants|E] em potencial podem optar por não participar se desejarem assistir.\n\nA elegibilidade para entrar em Contests é determinada pelo gênero e saúde, com base na [culture|E] e [religion|E] do anfitrião."
 game_concept_contestants:0 "Participantes"
 game_concept_contests:0 "Competições"
 game_concept_contract:0 "Contrato"
 game_concept_contribute:0 "Colaborar"
 game_concept_contribution:0 "Colaboração"
 game_concept_control:0 "Controle"
 game_concept_control_i:0 "@control_icon!"
 game_concept_convert:0 "Converter"
 game_concept_convert_county:0 "$task_conversion$"
 game_concept_convert_county_desc:0 "Uma [councillor_task|E] realizada pelo [court_chaplain|E] que visa um [county|E] de uma fé diferente da do [liege|E].\n\nO progresso aumenta a cada mês, e quando atinge 100%, a maioria do Condado-Alvo mudou de sua fé anterior para a fé do Senhor Feudal.\n\nA velocidade de conversão é afetada por muitos fatores, incluindo a [learning_skill|E] do [councillor|E] e o [fervor|E] das duas fés."
 game_concept_converted:0 "Convertido"
 game_concept_converting:0 "Convertendo"
 game_concept_convince_dejure:0 "$task_convince_dejure$"
 game_concept_convince_dejure_desc:0 "Uma [councillor_task|E] realizada pelo [steward|E]. Destina-se a um [county|E] [de_jure|E] do [liege|E] do conselheiro que é possuído por um [ruler|E] [independent|E]. Quando o condado é persuadido, eles pedirão ao seu [ruler|E] para liberá-los para o seu [liege|E] [de_jure|E]."
 game_concept_core:0 "Principal"
 game_concept_core_tenet:0 "Princípio"
 game_concept_core_tenet_desc:0 "Enquanto [doctrines|E] representam problemas que uma [faith|E] deve tomar uma posição sobre, $game_concept_core_tenets$ representam as peculiaridades e ritos únicos da Fé."
 game_concept_core_tenets:0 "Princípios"
 game_concept_council:0 "Conselho"
 game_concept_council_desc:0 "O $game_concept_council$ consiste de seis [councillors|E] que auxiliam seu [ruler|E] na administração do [realm|E]. Como os chefes de seus respectivos departamentos, eles podem ser atribuídos com diversas [councillor_tasks|E] importantes."
 game_concept_council_i:0 "@council_icon!"
 game_concept_councillor:0 "Conselheiro"
 game_concept_councillor_desc:0 "Conselheiros são os assistentes principais de qualquer [ruler|E], e compõem o [council|E]. Há seis cargos no conselho: [chancellor|E], [marshal|E], [steward|E], [spymaster|E], [court_chaplain|E] (ou [realm_priest|E]) e, por fim, seu [spouse|E].\n\nCada um é responsável por um departamento que pode receber diferentes [councillor_tasks|E] para executar.\n\n[powerful_vassals|E] ficarão descontentes se não forem nomeados para uma dessas posições, o que significa que você frequentemente terá que escolher entre agradar um vassalo poderoso ou nomear alguém realmente competente.\n\nServir como Conselheiro para seu [liege|E] concede um bônus, que aumenta com a [rank|E] do Senhor Feudal."
 game_concept_councillor_task:0 "Tarefa do Conselheiro"
 game_concept_councillor_task_desc:0 "$game_concept_councillor_tasks$ são empregos importantes que podem ser atribuídos aos seus [councillors|E]. Essas tarefas podem ser gerais ou direcionadas especificamente a um [county|E] ou [court|E].\n\nSe você tiver uma [relation|E] com um Conselheiro, as Tarefas com tempo de conclusão podem levar mais ou menos tempo.\n\n#weak Observe que os conselheiros não estão fisicamente presentes para executar essas tarefas, mas apenas lideram os esforços.#!"
 game_concept_councillor_task_possible_side_effects:0 "Possíveis Efeitos Colaterais"
 game_concept_councillor_task_possible_side_effects_desc:0 "Uma [councillor_task|E] talvez tenha consequências inesperadas com o passar do tempo. Elas podem ser boas ou ruins, com efeitos positivos se tornando mais comuns quanto maior o nível da [skill|E] relevante do Conselheiro, e efeitos negativos são mais comuns quanto menor o nível da habilidade relevante do conselheiro."
 game_concept_councillor_tasks:0 "Tarefas do Conselheiro"
 game_concept_councillors:0 "Conselheiros"
 game_concept_count:0 "Conde"
 game_concept_count_desc:0 "Um $game_concept_count$ é um [ruler|E] cujo [primary_title|E] é um [county|E].\n\nSeu [rank|E] está apenas acima dos [barons|E] e diretamente abaixo dos [dukes|E], e por isso eles podem ter $game_concept_barons$ como [vassals|E] e um $game_concept_duke$ ou superior como seu [liege|E]."
 game_concept_counter:0 "Contra-Atacar"
 game_concept_counters:0 "Contra-Ataca"
 game_concept_counties:0 "Condados"
 game_concept_counts:0 "Condes"
 game_concept_county:0 "Condado"
 game_concept_county_capital:0 "Capital do Condado"
 game_concept_county_capital_desc:0 "A $game_concept_county_capital$ e a [holding|E] principal de um [county|E]. Esta propriedade não pode ser destruída ou [Concept('leased', 'Alugada')|E] e sempre irá pertencer ao [ruler|E] que controla o [title|E] do Condado.\n\nCapitais de Condado permite a criação de uma [building|E] adicional comparado com uma Propriedade comum."
 game_concept_county_capitals:0 "Capitais de Condado"
 game_concept_county_control:0 "Controle no Condado"
 game_concept_county_control_desc:0 "$game_concept_county_control$ mede o controle que o governo tem sobre a população de um [county|E]. Isso é especialmente crucial para a coleta de [taxes|E] das [holdings|E].\n\nQuando um Condado troca de mãos através de [war|E], o Controle diminui drasticamente, sendo uma boa razão para vassalizar o atual [holder|E] (se o [casus_belli|E] permitir). O Controle do Condado também pode ser prejudicado por [sieges|E] e [Concept( 'peasant_faction', 'Rebeliões Camponesas' )|E].\n\nBaixo Controle pode levar à [county_corruption|E], e a principal maneira de aumentar o Controle é atribuir uma [councillor_task|E] ao seu [marshal|E]."
 game_concept_county_corruption:0 "Corrupção do Condado"
 game_concept_county_corruption_desc:0 "Quando um [county|E] tem um [control|E] baixo, ou seu [holder|E] está em [debt|E], o Condado pode receber $game_concept_county_corruption$. Estes são diversos tipos de [county_modifiers|E] negativos.\n\n$game_concept_county_corruption$ irá se esvair com o tempo, mas se a causa inicial persistir ([debt|E] ou baixo [control|E]), ela pode retornar.\n\nA $game_concept_councillor_task$ de $task_increase_control$ do seu $councillor_marshal$ pode se livrar da $game_concept_county_corruption$ mais rapidamente."
 game_concept_county_desc:0 "Um $game_concept_county$ é um [title|E] abaixo de um [duchy|E] e acima de um [barony|E].\n\nO título inclui a [county_capital|E], e também os direitos [de_jure|E] para todos os Baronatos no Condado.\n\nCondados sempre devem ter [holders|E] pois a capital de condados não pode ser destruída."
 game_concept_county_development:0 "Desenvolvimento"
 game_concept_county_development_desc:0 "$game_concept_county_development$ é uma medida do avanço na infraestrutura e tecnologia local em um [county|E]. \n\nUm $game_concept_county_development$ Alto aumenta a quantidade de [levies|E], [taxes|E], e [supply_limit|E] recebidos de tal $game_concept_county$."
 game_concept_county_development_growth:0 "Crescimento de Desenvolvimento"
 game_concept_county_development_growth_desc:0 "$game_concept_county_development_growth$ mede o quão próximo um [county|E] está de aumentar seu nível de [development|E].\n\nAo atingir 100 de $game_concept_county_development_growth$, o nível de $game_concept_county_development$ é aumentado em 1."
 game_concept_county_modifier:0 "Modificador do Condado"
 game_concept_county_modifier_desc:0 "$game_concept_county_modifiers$ são modificadores que afetam os valores de um [county|E].\n\n[baronies|E] têm seus próprios modificadores, e eles podem ser vistos nas [holdings|E] do $game_concept_county$."
 game_concept_county_modifiers:0 "Modificadores do Condado"
 game_concept_county_opinion:0 "Opinião Popular"
 game_concept_county_opinion_desc:0 "A População geral de cada [county|E] tem uma [opinion|E] sobre o [character|E] que é proprietário do $game_concept_county$. Se a população não estiver feliz, eles podem entrar ou criar uma [peasant_faction|E] ou [popular_faction|E], qualquer uma dos quais pode se espalhar por todo um [realm|E].\n\nA forma mais fácil de controlar a $game_concept_county_opinion$ é garantir que o [holder|E] do $game_concept_county$ é da mesma [culture|E] e [faith|E] que sua população.\n\n$game_concept_county_opinion$ por ter uma [faith|E] diferente é modificada pela [faith_hostility|E] e o seu [fervor|E], escalando linearmente entre 0 e 100 de $game_concept_fervor$."
 game_concept_court:0 "Corte"
 game_concept_court_chaplain:0 "Capelão da Corte"
 game_concept_court_chaplain_desc:0 "O $game_concept_court_chaplain$ é o [councillor|E] encarregado de assuntos espirituais de [faiths|E] e religiosos com base na [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName].\n\nReligiões com a Doutrina de [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName] têm o muito mais poderoso (e problemático) [realm_priest|E] ao invés do $game_concept_court_chaplain$."
 game_concept_court_chaplain_possessive:0 "Do Capelão da Corte"
 game_concept_court_chaplains:0 "Capelões da Corte"
 game_concept_court_chaplains_possessive:0 "Dos Capelães da Corte"
 game_concept_court_desc:0 "Todo [ruler|E] tem uma $game_concept_court$, consistida de diversos Personagens [unlanded|E] que servem seu [liege|E].\n\nNormalmente, estes [courtiers|E] consistem basicamente da família do Governante e uma mistura de [nobles|E] e plebeus não relacionados."
 game_concept_court_guest:0 "Convidado da Corte"
 game_concept_court_guest_desc:0 "[wanderers|E] às vezes aparecem em sua [court|E] como Visitantes. Eles irão ficar por apenas um período de tempo limitado, mas podem ser recrutados como [courtiers|E] permanentes pelo [ruler|E]."
 game_concept_court_host:0 "Anfitrião da Corte"
 game_concept_court_host_desc:0 "Um $game_concept_court_host$ é um [ruler|E] que não é o Senhor Feudal de um personagem, mas ainda assim o tem em sua [court].\n\nExistem várias razões possíveis para isso acontecer, como [wanderers|E] visitando um governante ou [wards|E] permanecendo na mesma Corte que seu [guardian|E]."
 game_concept_court_position_task:0 "Tarefa da Posição na Corte"
 game_concept_court_position_task_desc:0 "Algumas [court_positions|E] podem desempenhar uma tarefa adicional, geralmente oferecendo mais benefícios com um custo extra.\n\nApenas uma tarefa pode estar ativa por vez por [court_position|E]."
 game_concept_court_position_task_short:0 "Tarefa"
 game_concept_court_position_task_short_desc:0 "$game_concept_court_position_task_desc$"
 game_concept_court_position_tasks:0 "Tarefas da Posição na Corte"
 game_concept_court_position_tasks_desc:0 "$game_concept_court_position_task_desc$"
 game_concept_court_position_tasks_short:0 "Tarefas"
 game_concept_court_position_tasks_short_desc:0 "$game_concept_court_position_task_desc$"
 game_concept_courtier:0 "Cortesão"
 game_concept_courtier_desc:0 "Um $game_concept_courtier$ é um personagem [unlanded|E] que serve a um [ruler|E] em sua [court|E].\n\nCortesãos podem:\n$BULLET_WITH_TAB$Servir como [councillor|E]\n$BULLET_WITH_TAB$Servir em [court_positions|E]\n$BULLET_WITH_TAB$Servir em [armies|E] como [commanders|E] ou [knights|E]\n$BULLET_WITH_TAB$Tornar-se [vassal|E] de seu Governante se receberem um [title|E]\n$BULLET_WITH_TAB$Permitir que seu Governante pressione suas [claims|E] em [wars|E]\n\n#WEAK [adventurers|E] têm [followers|E] em vez de $game_concept_courtiers$ — eles desempenham o mesmo papel, embora geralmente sejam mais fedorentos e com mais lama.#!"
 game_concept_courtiers:0 "Cortesãos"
 game_concept_courts:0 "Cortes"
 game_concept_cowed:0 "Apavorado"
 game_concept_cowed_desc:0 "Personagens aterrorizados são paralisados pelo medo de outro personagem e raramente tomam quaisquer ações hostis contra esse personagem, incluindo iniciar [factions|E].\n\nPersonagens ficam aterrorizados ou [Concept('intimidated', 'Intimidados')|E] por causa do [dread|E] e/ou uma personalidade covarde."
 game_concept_create:0 "Criar"
 game_concept_create_title:0 "Criar Título"
 game_concept_created:0 "Criado"
 game_concept_created_title:0 "Título Criado"
 game_concept_crime:0 "Crime"
 game_concept_crime_desc:0 "$game_concept_crimes$ são ações que a sociedade vê como algo questionável o suficiente para ser digno de punição.\n\nCrimes podem ser seculares (como um [vassal|E] se [revolting|E] contra seu [liege|E]) ou religiosos (qualquer tipo de comportamento [shunned|E] que é tornado ilegal por uma [doctrine|E]). Crimes Seculares só podem ser punidos pelos personagens que foram prejudicados por tais atos, mas qualquer [ruler|E] pode punir seus súditos por Crimes religiosos.\n\nTodos os crimes dão uma razão válida para [imprison|E] os $game_concept_criminals$, e, dependendo da severidade do Crime você também pode [revoke|E] seus [titles|E], [banish|E], [torture|E], ou [execute|E]. Cada Crime só pode ser punido por um Governante uma vez, embora alguns Crimes irão dar ao Criminoso um [fame_trait|E] negativo que irá durar a vida toda.\n\nÀs vezes personagens escapam com Crimes, os quais serão tornados [secrets|E] que podem ser descobertos por outros personagens e usados para [blackmail|E]."
 game_concept_crime_i:0 "@crime_icon!"
 game_concept_crimes:0 "Crimes"
 game_concept_criminal:0 "Criminoso"
 game_concept_criminals:0 "Criminosos"
 game_concept_critical_failure:0 "Falha Crítica"
 game_concept_critical_failure_desc:0 "Alguns [schemes|E] têm a possibilidade de $game_concept_critical_failure$ durante a execução.\n\nOs resultados exatos variam, mas incluem o $game_concept_scheme$ se voltar contra o [scheme_owner_owner|E], ou impedir que eles tentem o mesmo $game_concept_scheme$ contra o mesmo [scheme_target_target|E] por algum tempo."
 game_concept_critically_fail:0 "Falhar Criticamente"
 game_concept_crown_authority:0 "Autoridade da Coroa"
 game_concept_crown_authority_desc:0 "A $game_concept_crown_authority$ representa o poder geral que um [ruler|E] tem sobre seus [vassals|E].\n\nExistem quatro níveis de $game_concept_crown_authority$; [autonomous_vassals|E], [limited|E], [high|E], e [absolute|E]. Aumentar a $game_concept_crown_authority$ custa uma quantidade de [prestige|E] dependendo do nível e a [learning_skill|E] do governante.\n\n#weak Vassalos não gostam de altos níveis de $game_concept_crown_authority$, e abaixar isto é o objetivo principal de qualquer [Concept( 'liberty_faction', 'Facção da Liberdade' )|E].#!"
 game_concept_crusade:0 "Crusada"
 game_concept_crusades:0 "Crusadas"
 game_concept_crush:0 "Paixão"
 game_concept_crush_desc:0 "Um $game_concept_crush$ é outra [child|E] por quem esta $game_concept_child$ está desenvolvendo seus primeiros sentimentos (bastante dolorosamente desajeitados). Ao atingir a [adulthood|E], se o $game_concept_crush$ for mútuo, pode florescer em um relacionamento de [lovers|E], ou o [character|E] pode seguir em frente com sua vida."
 game_concept_crush_possessive:0 "Da paixão"
 game_concept_crushes:0 "Paixões"
 game_concept_crushes_possessive:0 "Das paixões"
 game_concept_cultural:0 "Cultural"
 game_concept_cultural_acceptance:0 "Aceitação cultural"
 game_concept_cultural_acceptance_baseline:0 "Valor base de aceitação cultural"
 game_concept_cultural_acceptance_baseline_desc:0 "[cultural_acceptance|E] tem uma linha de base para a qual decairá se for excedida. A linha de base depende de:\n$EFFECT_LIST_BULLET$[heritage|E] compartilhada\n$EFFECT_LIST_BULLET$[language|E] compartilhada\n$EFFECT_LIST_BULLET$[faith|E] e [religion|E] compartilhadas, especialmente se [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] ou [GetReligionFamily('rf_eastern').GetName]\n$EFFECT_LIST_BULLET$[ethos|E] compartilhada dentro da mesma [region|E]"
 game_concept_cultural_acceptance_desc:0 "Aceitação Cultural mede o quão aceitas duas [cultures|E] são uma pela outra.\n\nPrimariamente, afeta o quanto a [opinion|E] é reduzida entre Personagens de diferentes Culturas. Também afeta a [county_opinion|E] e o custo de formar uma [hybrid_culture|E].\n\nA Aceitação Cultural pode mudar a partir de várias ações, especialmente [wars|E], concessão e revogação de [titles|E], e a [councillor_task|E] de [accept_culture|E].\n\nCom o tempo, a Aceitação irá retornar ao [cultural_acceptance_baseline|E] se excedida."
 game_concept_cultural_acceptance_i:0 "@cultural_acceptance_icon!"
 game_concept_cultural_fascination:0 "Fascinação Cultural"
 game_concept_cultural_fascination_desc:0 "Cada Cultura está sempre Fascinada por uma [innovation|E] específica, o que aumenta muito a velocidade de descoberta em uma taxa que depende das [skills|E] do atual [culture_head|E]. Cada Inovação se beneficia de uma Habilidade específica.\n\nO Chefe Cultural pode mudar a Fascinação Cultural livremente."
 game_concept_cultural_festival:0 "Festival Cultural"
 game_concept_cultural_festival_desc:0 "Uma [activity_phase|E] durante um [royal_tour|E] na qual um [vassal|E] é esperado para entreter seu [liege|E], o que frequentemente resulta em um aumento na [county_opinion|E] e [cultural_acceptance|E]."
 game_concept_cultural_festivals:0 "Festivais Culturais"
 game_concept_cultural_head:0 "Chefe Cultural"
 game_concept_cultural_spread:0 "Disseminação Cultural"
 game_concept_cultural_spread_desc:0 "O contato com outras [cultures|E] que possuam [innovations|E] ainda não descobertas fará com que uma dessas $game_concept_innovations$ seja descoberta mais rapidamente. Entre as [cultures|E] elegíveis, aquela com a maior [cultural_acceptance|E] será escolhida para disseminar o progresso da [innovation|E]."
 game_concept_culture:0 "Cultura"
 game_concept_culture_desc:0 "A $game_concept_culture$ representa a língua e os costumes de um Personagem ou [county|E].\n\nPersonagens de diferentes Culturas terão [opinions|E] mais baixas um do outro. Essa penalidade pode ser reduzida aumentando a [cultural_acceptance|E]."
 game_concept_culture_festival:0 "Festival Cultural"
 game_concept_culture_festivals:0 "Festivais Culturais"
 game_concept_culture_head:0 "Chefe da Cultura"
 game_concept_culture_head_desc:0 "Um '$game_concept_culture_head$' é o [ruler|E] que tem mais influência sobre sua própria [culture|E].\n\nEspecificamente, o governante com o maior número total de [counties|E] da mesma cultura dentro de seu [realm|E] se tornará o $game_concept_cultural_head$, independentemente de onde esteja seu [domain|E] ou dos condados de outras culturas que possa possuir.[AddLocalizationIf( HasDlcFeature( 'khans_of_the_steppe' ), 'game_concept_culture_head_desc_NOMAD_DLC', )]\n\nO $game_concept_cultural_head$ pode influenciar qual [innovation|E] deve ser priorizada para descoberta ao definir a [cultural_fascination|E].\n\n[SelectLocalization( HasDlcFeature( 'reform_culture' ), 'game_concept_culture_head_desc_REFORM_DLC', 'game_concept_culture_head_desc_NO_REFORM_DLC' )]"
 game_concept_culture_head_desc_NOMAD_DLC:0 "\n\n[rulers|E] [nomadic|E], no entanto, escolherão seu $game_concept_cultural_head$ com base em quem possui o maior [herd|E], independentemente do título. Caso governantes sedentários compartilhem a mesma [culture|E] que nômades, o [military_power|E] será o fator decisivo."
 game_concept_culture_head_desc_NO_REFORM_DLC:0 "O $game_concept_culture_head$ pode estabelecer novas [traditions|E] para a própria cultura."
 game_concept_culture_head_desc_REFORM_DLC:0 "O $game_concept_culture_head$ também pode [reform|E] partes da própria cultura."
 game_concept_culture_i:0 "@culture_icon!"
 game_concept_culture_intermingling:0 "Intercâmbio cultural"
 game_concept_culture_intermingling_desc:0 "Quanto mais duas [cultures|E] coexistirem no mesmo [realm|E], mais elas se misturam, aumentando assim a [cultural_acceptance|E] entre as culturas."
 game_concept_culture_pillar:0 "Pilar da cultura"
 game_concept_culture_pillar_desc:0 "[SelectLocalization(HasDlcFeature('reform_culture'), 'game_concept_culture_pillar_desc_REFORM_DLC', 'game_concept_culture_pillar_desc_NO_REFORM_DLC')]"
 game_concept_culture_pillar_desc_NO_REFORM_DLC:0 "Os Pilares são qualidades imutáveis que refletem as origens de uma [culture|E].\n\nExistem 5 Pilares Culturais distintos:\n$EFFECT_LIST_BULLET$[ethos|E]\n$EFFECT_LIST_BULLET$[heritage|E]\n$EFFECT_LIST_BULLET$[language|E]\n$EFFECT_LIST_BULLET$[martial_custom|E]\n$EFFECT_LIST_BULLET$Estética"
 game_concept_culture_pillar_desc_REFORM_DLC:0 "Os Pilares são qualidades que refletem as origens de uma [culture|E].\n\nExistem 5 Pilares Culturais distintos:\n$EFFECT_LIST_BULLET$[ethos|E]\n$EFFECT_LIST_BULLET$[heritage|E]\n$EFFECT_LIST_BULLET$[language|E]\n$EFFECT_LIST_BULLET$[martial_custom|E]\n$EFFECT_LIST_BULLET$Estética\n\nDentre eles, Ética, Linguagem e Costumes Marciais podem ser alterados pelo [culture_head|E] por meio de uma [reformation|E]."
 game_concept_culture_pillars:0 "Pilares da cultura"
 game_concept_culture_possessive:0 "da Cultura"
 game_concept_culture_tradition:0 "Tradição Cultural"
 game_concept_culture_tradition_desc:0 "Tradições representam os costumes, tradições, valores e ética das [cultures|E].\n\nCada tradição concede um bônus ou habilidade especial para [characters|E] ou [counties|E] desta cultura.\n\n[SelectLocalization(HasDlcFeature('reform_culture'), 'game_concept_culture_tradition_desc_REFORM_DLC', 'game_concept_culture_tradition_desc_NO_REFORM_DLC')]\n\n$game_concept_cultures$ podem ter até 6 tradições. No entanto, a maioria tem menos."
 game_concept_culture_tradition_desc_NO_REFORM_DLC:0 "O [culture_head|E] pode introduzir novas tradições para uma cultura, que custa [prestige|E]."
 game_concept_culture_tradition_desc_REFORM_DLC:0 "O [culture_head|E] pode introduzir novas tradições para uma cultura ou substituir as existentes através da [reformation|E], que custa [prestige|E]."
 game_concept_culture_traditions:0 "Tradições Culturais"
 game_concept_cultures:0 "Culturas"
 game_concept_damage:0 "Dano"
 game_concept_damage_desc:0 "O Dano de um [soldier|E] determina a quantidade de [casualties|E] que eles podem causar durante uma [battle|E].\n\nUm Soldado de uma [levy|E] causa [GetDefine('NCombat', 'LEVY_ATTACK')|0] de Dano."
 game_concept_de_jure:0 "De Jure"
 game_concept_de_jure_capital:0 "Capital De Jure"
 game_concept_de_jure_capital_desc:0 "A $game_concept_de_jure_capital$ de um [title|E] é o [county|E] em que sua capital histórica era localizada. Você sempre poderá mover sua [realm_capital|E] para a $game_concept_de_jure_capital$ do seu [primary_title|E], mesmo se ela já tiver sido movida."
 game_concept_de_jure_desc:0 "A maioria dos [titles|E] são considerados parte de um título $game_concept_de_jure$ de maior nível.\n\nPor exemplo, um [ruler|E] pode ser [king|E] da Inglaterra, mas seu [realm|E] ainda não está no controle de todas as terras que são consideradas legalmente como parte da Inglaterra.\n\nO [holder|E] de um [duchy|E], [kingdom|E], ou [empire|E] sempre terá um [casus_belli|E] para tomar controle de seus títulos $game_concept_de_jure$ constituintes.\n\n[vassals|E] também irão decidir quem é seu [rightful_liege|E] baseados à qual parte do seu [primary_title|E] De Jure fizer parte em um título de maior nível."
 game_concept_de_jure_drift:0 "Transferência de De Jure"
 game_concept_de_jure_drift_desc:0 "$game_concept_de_jure_drift_desc_part_1$\n\n$game_concept_de_jure_drift_desc_part_2$"
 game_concept_de_jure_drift_desc_part_1:0 "Um lento processo no qual um [title|E] [de_jure|E] pode mudar de [liege|E]. Isso ocorre naturalmente quando um [duchy|E] ou [kingdom|E] é completamente controlado por um [ruler|E] que não possui o título de jure de senhor feudal no território.\n\nEste processo pode ser acelerado ao designar seu [chancellor|E] para a [councillor_task|E] apropriada #weak ($task_integrate_title$)#!. Ducados só podem sofrer uma $game_concept_de_jure_drift$ em Reinos, e Reinos só podem ser transferidos entre [empires|E].\n\nDeixar títulos De Jure serem transferidos em seu [primary_title|E] é uma boa forma de se livrar da penalidade de não ser um [rightful_liege|E]."
 game_concept_de_jure_drift_desc_part_2:0 "#weak Exemplo: O Ducado de $d_northumberland$ é parte De Jure da $k_england$, mas o território do ducado está inteiramente dentro da $k_scotland$. Já que o Rei da $k_scotland$ também não é dono da $k_england$, o ducado irá começar a sofrer uma $game_concept_de_jure_drift$ para se tornar parte da $k_scotland$.#!"
 game_concept_de_jure_drift_drift:0 "Transferir"
 game_concept_de_jure_drift_drifted:0 "Transferido"
 game_concept_de_jure_drifting:0 "Deriva de Jure"
 game_concept_de_jure_partition:0 "Partição de Direito"
 game_concept_de_jure_partition_desc:0 "Os [realms|E] que foram $game_concept_de_jure_partitioned$ foram divididos em dois [titles|E] do mesmo [title_tier|E], mas ainda podem ser facilmente reunidos.\n\nQualquer um dos $game_concept_titles$ pode [de_jure_drift_drift|E] [duchies|E] [completely_controlled|E] do outro $game_concept_title$ em seu [de_jure|E] instantaneamente via [decision|E].\n\nSe qualquer um dos $game_concept_titles$ for destruído ou perder o último de seus [counties|E] $game_concept_de_jure$, então o $game_concept_title$ restante absorve todos os seus $game_concept_de_jure$."
 game_concept_de_jure_partitioned:0 "Particionado de Direito"
 game_concept_dead_soldiers:0 "Baixas Fatais"
 game_concept_dead_soldiers_desc:0 "Durante uma [battle|E], muitos (mas normalmente não a maioria) [soldiers|E] serão mortos ou estarão severamente feridos ao ponto de nunca poderem lutar novamente. Estas são [casualties|E] permantentes, diferente de [routed_soldiers|E]."
 game_concept_death_combat:0 "Combate"
 game_concept_death_combat_desc:0 "Receber um golpe fatal ao participar de uma batalha, duelo ou outros confrontos marciais, como Torneios, são as principais formas de partir de maneira $game_concept_death_combat$."
 game_concept_death_murder:0 "Assassinato"
 game_concept_death_murder_desc:0 "A morte finalmente o alcançando por meio de um assassinato — uma morte envolta em engano. A forma como viveu; a forma como morreu."
 game_concept_death_natural_cause:0 "Causa Natural"
 game_concept_death_natural_causes:0 "Causas Naturais"
 game_concept_death_natural_causes_desc:0 "Partir em paz é a chave para morrer de $game_concept_death_natural_causes$. Para esse propósito, a velhice e as doenças crônicas são as principais formas de deixar este mundo."
 game_concept_death_religion:0 "Religião"
 game_concept_death_religion_desc:0 "Ser conduzido ao próximo mundo por pagãos e pela profana separação do corpo mortal — martírio, crucificação — mantendo-se fiel à sua fé até o fim; há maneira mais genuína de partir?"
 game_concept_death_religious:0 "Religiosa"
 game_concept_debt:0 "Dívida"
 game_concept_debt_desc:0 "Dívida é o estado de possuir uma quantidade negativa de [gold_i][gold|E]. Isso normalmente acontece quando um [ruler|E] em guerra contrata [mercenaries|E] sem ter ouro suficiente para cobrir o custo total, ou quando permanece em guerra por muito tempo.\n\nEnquanto estiver em dívida, você não pode declarar novas [wars|E], seus [men_at_arms|E] não se reforçam, e seus inimigos terão uma [advantage|E] sobre você nas batalhas. Quanto mais fundo na dívida você cair, mais penalidades receberá — menos [levies|E], redução na [county_opinion|E], e seus [vassals|E] gostarão menos de você.\n\nAlém disso, vários outros pequenos eventos desestabilizadores podem ocorrer, como o aumento de [county_corruption|E] em seus [counties|E] do [domain|E].\n\n#help É geralmente uma boa ideia atacar seus inimigos enquanto estão em dívida, pois lutarão com uma [advantage|E] reduzida!#!"
 game_concept_deceitful_progress_hostile_schemes_decision:0 "Decisão de $deceitful_progress_hostile_schemes_decision$"
 game_concept_deceitful_progress_hostile_schemes_decision_desc:0 "Uma [decision|E] que permite melhorar seus [hostile_schemes|E]. Concede [success_chance|E] e [scheme_speed|E] em troca de [stress|E]."
 game_concept_decide:0 "Decidir"
 game_concept_decision:0 "Decisão"
 game_concept_decision_desc:0 "Uma $game_concept_decision$ é uma ação especial que um [character|E] pode escolher à sua vontade.\n\nCada decisão tem seus próprios efeitos, os quais podem ir de pequenas Alterações em um Personagem até impactados capazes de sacudir um [empire|e] inteiro.\n\nDecisões que movem um Personagem à um local específico por um certo período de tempo são chamadas de [activities|E]."
 game_concept_decisions:0 "Decisões"
 game_concept_defeat:0 "Derrota"
 game_concept_defeat_desc:0 "$game_concept_defeat$ é um dos três tipos de [peace_offers|E]. O resultado de uma Derrota em uma [war|E] depende do [casus_belli|E] utilizado, mas normalmente Defensores derrotados perdem [titles|E] que fazem parte do [war_target|E], enquanto Atacantes derrotados irão perder coisas como [gold|E], [prestige|E] e [piety|E]."
 game_concept_demand_conversion:0 "Demandar Conversão"
 game_concept_demand_conversion_desc:0 "[rulers|E] que tiverem vassalos de outra [faith|E] podem Demandar Conversão para mudarem a Fé de tal vassalo para a sua própria. A habilidade em [learning|E] do Governante e a [opinion|E] do vassalo sobre seu senhor feudal são os fatores mais determinantes se o vassalo irá aceitar a demanda, ou [Concept('refuse_conversion_crime','negar')|E]."
 game_concept_demand_payment:0 "Exigir Pagamento"
 game_concept_demand_payment_decision:0 "Interação de Exigir Pagamento"
 game_concept_demand_payment_desc:0 "Uma Interação Diplomática que permite a um personagem exigir o pagamento de [gold|E] em troca de quaisquer [hooks|E] que tenha."
 game_concept_demanding_conversion:0 "Exigindo conversão"
 game_concept_denounce:0 "Delatar"
 game_concept_denounce_desc:0 "Um [dynast|E] pode delatar um membro de sua [dynasty|E] por um custo de [dynasty_prestige|E].\n\nQualquer membro da mesma dinastia (incluindo o Chefe da Dinastia) irá receber um [imprisonment_reason|E] sobre o membro delatado."
 game_concept_denouncement:0 "Delatagem"
 game_concept_depose:0 "Depor"
 game_concept_depose_desc:0 "[rulers|E] podem ser Depostos como resultado das demandas de uma [faction|E] ou eventos especiais. Seus [heirs|E] irão herdar seus [titles|E] mesmo que o governante anterior ainda estiver vivo."
 game_concept_deposed:0 "Deposto"
 game_concept_designated_heir:0 "Herdeiro Designado"
 game_concept_designated_heir_desc:0 "O $game_concept_designated_heir$ tem prioridade ao decidir quem se torna o [realm_heir|E]."
 game_concept_designated_terrain:0 "Terreno Designado"
 game_concept_designated_terrain_desc:0 "Uma [decision|E] desbloqueada na árvore do [wanderer_lifestyle|E], onde é possível escolher um grupo de [terrain|E] para especialização. Certos [perks|E] oferecerão benefícios diferentes ao grupo de terreno escolhido.\n\nGrupos de terreno que podem ser escolhidos:\n$BULLET_WITH_TAB$@forest! Florestas / @jungle! Selvas / @taiga! Taiga / @wetlands! Pântanos\n$BULLET_WITH_TAB$@mountains! Montanhas / @hills! Colinas / @desert_mountains! Montanhas do Deserto\n$BULLET_WITH_TAB$@plains! Planícies / @steppe! Estepe / @farmlands! Terras Agrícolas / @floodplains! Planícies de Alagamento\n$BULLET_WITH_TAB$@desert! Desertos / @drylands! Terras Áridas / @oasis! Oasis"
 game_concept_destination:0 "Destino"
 game_concept_destination_desc:0 "O Destino é o objetivo ao [traveling|E], ou um dos objetivos. Para uma [pilgrimage|E], seria o [holy_site|E] para o qual se viaja, enquanto em uma [tour|E] cada [vassal|E] visitado seria considerado um Destino."
 game_concept_detail_zoom:0 "$ZOOM_LEVEL_DETAILS$"
 game_concept_detail_zoom_desc:0 "$ZOOM_LEVEL_DETAILS_TOOLTIP$"
 game_concept_develop_county:0 "$task_develop_county$"
 game_concept_develop_county_desc:0 "Uma [councillor_task|E] realizada pelo [steward|E]. Destina-se a um [county|E], onde acelera o [development_growth|E] e reduz o tempo de construção das [buildings|E]."
 game_concept_development:0 "Desenvolvimento"
 game_concept_development_growth:0 "Crescimento de Desenvolvimento"
 game_concept_development_i:0 "@development_icon!"
 game_concept_diarch:0 "Diarca"
 game_concept_diarch_affected_actions:0 "Ações Comuns"
 game_concept_diarch_affected_actions_desc:0 "Quando as [scales_of_power|E] favorecem o [diarch|E] durante a [power_sharing|E], algumas [interactions|E] realizadas pelo [liege|E] podem começar a custar [prestige|E].\n\nAs ações afetadas são:\n$EFFECT_LIST_BULLET$ [revoke|E] um [title|E]\n$EFFECT_LIST_BULLET$ [retracting|E] um [vassal|E]\n$EFFECT_LIST_BULLET$ [imprisoning|E] [characters|E]\n$EFFECT_LIST_BULLET$ [executing|E] $game_concept_characters$ #weak (a menos que a [faith|E] do $game_concept_liege$ pratique algum tipo de sacrifício humano)#!"
 game_concept_diarch_aptitude:0 "Aptidão do Diarca"
 game_concept_diarch_aptitude_desc:0 "A $game_concept_diarch_aptitude$ governa o quão bem um [diarch|E] alcança cada [mandate|E] estabelecido pelo seu [liege|E].\n\nTanto as [skills|E] quanto os [personality_traits|E] desempenham um papel. Por exemplo, um $game_concept_diarch$ com o traço [GetTrait('greedy').GetName(GetNullCharacter)] encarregado do Mandato '$fill_coffers_mandate$' pode não enviar tanto [gold|E] ao seu Senhor Feudal.\n\n#WEAK [diarchs|E] são adequados para um $game_concept_mandate$ quando possuem uma $game_concept_aptitude$ de cerca de 40 ou mais.#!"
 game_concept_diarch_desc:0 "O parceiro júnior durante a [diarchy|E], um $game_concept_diarch$ auxilia seu [liege|E] no governo do [realm|E].\n\nO $game_concept_diarch$ tem acesso aos [diarch_powers|E] e ganha mais deles conforme as [scales_of_power|E] se inclinam a seu favor."
 game_concept_diarch_loyal:0 "Leal"
 game_concept_diarch_loyalty:0 "Lealdade"
 game_concept_diarch_loyalty_desc:0 "A $game_concept_diarch_loyalty$ de um [diarch|E] determina quão provável é que eles abusem de seus poderes, às custas de seu [liege|E] ou do [realm|E].\n\n$DIARCHY_WINDOW_VISIBLY_LOYAL$ Os $game_concept_diarchs$ se abstêm de usar [diarch_powers|E], tentam cumprir o [mandate|E] estabelecido para eles com diligência e renunciam ao poder voluntariamente quando solicitados.\n\n$DIARCHY_WINDOW_VISIBLY_DISLOYAL$ Os $game_concept_diarchs$ usam $game_concept_diarch_powers$ liberalmente, tentam cumprir seu $game_concept_mandate$ para inclinar as [scales_of_power|E] a seu favor e podem se recusar a renunciar ao poder se as $game_concept_scales_of_power_scales$ estiverem fortemente inclinadas a seu favor.\n\n$DIARCHY_WINDOW_UNKNOWN_LOYALTY$ Os $game_concept_diarchs$ podem usar $game_concept_diarch_powers$, geralmente compartilham os benefícios do $game_concept_mandate$ com seu $game_concept_liege$ ou simplesmente o ignoram por completo, e podem precisar de suborno para renunciar ao seu cargo se as $game_concept_scales_of_power$ os beneficiarem."
 game_concept_diarch_loyalty_explicit:0 "Lealdade do Diarca"
 game_concept_diarch_possessive:0 "Do Diarca"
 game_concept_diarch_power:0 "Poder Emprestado"
 game_concept_diarch_power_desc:0 "Um [diarch|E] em uma [power_sharing|E] ativo tem acesso a $game_concept_diarch_powers$ especiais.\n\nEsses são [character_interaction|E] especiais que imitam as habilidades do seu [liege|E] ou são outros abusos de poder. Exemplos incluem [revoke|E] [titles|E] de outros [vassals|E] ou desviar [gold|E] do seu Senhor Feudal.\n\nMuitos $game_concept_diarch_powers$ dão ao Senhor Feudal a oportunidade de [veto|E]."
 game_concept_diarch_power_possessive:0 "Do Poder Emprestado"
 game_concept_diarch_power_power:0 "Poder"
 game_concept_diarch_power_power_possessive:0 "do Poder"
 game_concept_diarch_power_powers:0 "Poderes"
 game_concept_diarch_power_powers_possessive:0 "dos Poderes"
 game_concept_diarch_powers:0 "Poderes Emprestados"
 game_concept_diarch_powers_possessive:0 "Dos Poderes Emprestados"
 game_concept_diarch_succession:0 "Sucessão"
 game_concept_diarch_succession_desc:0 "A $game_concept_diarch_succession_explicit$ governa quem, entre os [vassals|E] diretos ou [courtiers|E] de um [liege|E], é automaticamente nomeado [diarch|E] quando necessário.\n\nIsso ocorre quando um $game_concept_liege$ inicia um [diarchy|E] ou quando o $game_concept_diarch$ atual morre ou é removido do cargo.\n\n#weak Diferentes tipos de $game_concept_power_sharing$ podem calcular a ordem de sucessão de maneira diferente - em uma [regency|E], [characters|E] sem terras com fortes conexões pessoais com seu $game_concept_liege$ tendem a dominar.\n\nFalar a [language|E] do $game_concept_liege$ (e a [court_language|E], se houver) é quase sempre crucial.#!"
 game_concept_diarch_succession_explicit:0 "Sucessão Diarca"
 game_concept_diarchies:0 "Compartilhamento de Poder"
 game_concept_diarchs:0 "Diarcas"
 game_concept_diarchs_possessive:0 "Dos Diarcas"
 game_concept_diarchy:0 "Compartilhamento de Poder"
 game_concept_diarchy_desc:0 "O Compartilhamento de Poder ocorre quando um [ruler|E] divide parte de sua autoridade com um de seus [vassals|E] ou [courtiers|E], que se torna seu [diarch|E].\n\nO governante que compartilha seu poder pode estabelecer [mandates|E] para seu $game_concept_diarch$, enquanto o $game_concept_diarch$ pode usar [diarch_powers|E] especiais.\n\nAs [scales_of_power|E] medem se o Governante ou o $game_concept_diarch$ têm mais autoridade."
 game_concept_diligent_development_focus_decision:0 "Decisão de $diligent_development_focus_decision$"
 game_concept_diligent_development_focus_decision_desc:0 "Uma [decision|E] que permite melhorar sua [capital|E]. Concede [development|E] em troca de [stress|E]."
 game_concept_diplomacy:0 "Diplomacia"
 game_concept_diplomacy_i:0 "@skill_diplomacy_icon!"
 game_concept_diplomacy_lifestyle:0 "Estilo de Vida em Diplomacia"
 game_concept_diplomacy_lifestyle_desc:0 "O $game_concept_diplomacy_lifestyle$ é adequado para Personagens que gostariam de ganhar [claims|E] e [casus_bellis|E], aumentar seu [prestige|E], ou ganhar bençãos da Família e Amigos."
 game_concept_diplomacy_lifestyle_i:0 "@diplomacy_lifestyle_icon!"
 game_concept_diplomacy_skill:0 "Habilidade Diplomática"
 game_concept_diplomacy_skill_desc:0 "$game_concept_diplomacy$ é a [skill|E] que representa a habilidade de encantar, negociar e persuadir de um Personagem.\n\nDiplomacia afeta diretamente as [opinions|E] de outros personagens sobre você. Também é utilizada para promover [schemes|E] Diplomáticos.\n\nO [lifestyle|E] correspondente é o [diplomacy_lifestyle|E]."
 game_concept_diplomatic_range:0 "Alcance Diplomático"
 game_concept_diplomatic_range_desc:0 "Você só pode interagir com personagens que estiverem dentro do seu Alcance Diplomático. Porém, [realms|E] vizinhos sempre estarão em Alcance."
 game_concept_direct_vassal:0 "Vassalo Direto"
 game_concept_direct_vassal_desc:0 "Seus $game_concept_direct_vassals$ são os [vassals|E] que servem diretamente à você. Vassalos de Vassalos #emphasis não#! estão inclusos."
 game_concept_direct_vassals:0 "Vassalos Diretos"
 game_concept_directed_great_holy_war:0 "Grande Guerra Sagrada Direcionada"
 game_concept_directed_great_holy_war_desc:0 "Uma $game_concept_directed_great_holy_war$ é declarada por um [head_of_faith|E] $doctrine_temporal_head_name$ com a intenção de trazer um [kingdom|E] sobre seu controle.\n\n[rulers|E] de sua [faith|E] talvez optem por auxiliar o Chefe da Fé, e podem receber recompensas por tal. Recompensas incluem [piety|E] e potencialmente tornar sua [dynasty|E] uma Dinastia [landed|E] dentro do Reino conquistado.\n\nGovernantes da [religion|E] alvo também podem optar por se defenderem contra esta guerra sem a necessidade de uma [alliance|E]."
 game_concept_directed_great_holy_wars:0 "Grandes Guerras Sagradas Direcionadas"
 game_concept_directive:0 "Diretiva"
 game_concept_directives:0 "Diretivas"
 game_concept_discontent:0 "Descontentamento"
 game_concept_diseases:0 "Doenças"
 game_concept_disinherit:0 "Deserdar"
 game_concept_disinherit_desc:0 "Um [dynast|E] pode deserdar um membro de sua [dynasty|E] pelo custo de [dynasty_prestige|E].\n\nIsso irá remover o membro da dinastia de qualquer [line_of_succession|E] de quaisquer títulos carregados por membros da dinastia."
 game_concept_disinherited:0 "Deserdado"
 game_concept_disinheriting:0 "Deserdar"
 game_concept_disinherits:0 "Deserde"
 game_concept_dismiss_strong_hook_interaction:0 "Interação de $dismiss_strong_hook_interaction$"
 game_concept_dismiss_strong_hook_interaction_desc:0 "Uma [interaction|E] que permite descartar um [hook|E] que esteja visando você em troca de [prestige|E]."
 game_concept_disparate_tribes:0 "Tribos Desiguais"
 game_concept_disparate_tribes_tribal_authority:0 "Autoridade Tribal de Tribos Desiguais"
 game_concept_disparate_tribes_tribal_authority_desc:0 "$game_concept_disparate_tribes$ é o menor nível da [tribal_authority|E]. Neste nível, [vassals|E] não têm nenhuma penalidade de [opinion|E] contra seu [liege|E], e o senhor feudal não tem nenhum poder além da habilidade de demandar [levies|E] e [taxes|E] deles."
 game_concept_disrupt_schemes:0 "$task_disrupt_schemes$"
 game_concept_disrupt_schemes_desc:0 "$game_concept_disrupt_schemes$ é uma [councillor_task|E] realizada pelo [spymaster|E].\n\nEla aumenta a [scheme_discovery_chance|E] do [ruler|E] e desacelera as ações hostis do $game_concept_spymaster$ de outros $game_concept_rulers$, como [espionage|E]."
 game_concept_diverge:0 "Divergir"
 game_concept_divergent_culture:0 "Cultura Divergente"
 game_concept_divergent_culture_desc:0 "[SelectLocalization( HasDlcFeature( 'diverge_culture' ), 'game_concept_divergent_culture_desc_DLC', 'game_concept_divergent_culture_desc_NO_DLC' )]"
 game_concept_divergent_culture_desc_DLC:0 "Uma $game_concept_divergent_culture$ é um ramo de uma [culture|E] existente, criado por um [ruler|E].\n\nA $game_concept_divergent_culture$ mantém sua [heritage|E], mas outros aspectos da cultura original podem ser alterados.\n\nA cultura da qual ela divergiu deve ter pelo menos [EmptyScope.ScriptValue('culture_divergence_cooldown')|0] anos, e o custo de [prestige|E] para divergir é baseado no tamanho do reino do governante criador.\n\nNovas culturas também podem surgir como [hybrid_culture|E]."
 game_concept_divergent_culture_desc_NO_DLC:0 "Uma $game_concept_divergent_culture$ é um ramo de uma [culture|E] existente.\n\nNovas culturas também podem surgir como [hybrid_culture|E]."
 game_concept_divergent_cultures:0 "Culturas Divergentes"
 game_concept_diverges:0 "Diverge"
 game_concept_divorce:0 "Divorcio"
 game_concept_divorce_desc:0 "[spouses|E] [Concept('married', 'Casados')|E] podem organizar um $game_concept_divorce$, embora as regras, requerimentos e consequências dependam das [doctrines|E] de suas [faiths|E].\n\n[concubines|E] podem ser deixadas de lado à sua vontade."
 game_concept_divorced:0 "Divorciado"
 game_concept_divorces:0 "Divorcia"
 game_concept_divorcing:0 "Divorciando"
 game_concept_doctrine:0 "Doutrina"
 game_concept_doctrines:0 "Doutrinas"
 game_concept_doctrines_desc:0 "Doutrinas poderiam ser consideradas leis religiosas que determinam o que é um comportamento aceitável dentro de uma [faith|E]."
 game_concept_domain:0 "Domínio"
 game_concept_domain_desc:0 "Os $game_concept_domains$ de um [ruler|E] é a coleção de todas as [holdings|E] que eles são pessoalmente donos.\n\nO bastante estático valor do [domain_limit|E] significa que Gorvernantes têm de depender de [vassals|E] para aumentar o tamanho de seu [realm|E] acima de um certo ponto."
 game_concept_domain_i:0 "@domain_icon!"
 game_concept_domain_income:0 "Lucro do Domínio"
 game_concept_domain_income_desc:0 "Seu $game_concept_domain_income$ consiste de [taxes|E] que você coleta de seu próprio [domain|E]. A quantidade coletada depende do [control|E] e nível de [development|E] local."
 game_concept_domain_limit:0 "Limite de Domínios"
 game_concept_domain_limit_desc:0 "O $game_concept_domain_limit$ determina quantas [holdings|E] você pode legalmente ter em seu [domain|E]. O $game_concept_domain_limit$ é afetado por muitas coisas, como sua [succession_law|E] e o nível do seu [primary_title|E].\n\nApesar de você poder ir acima do seu $game_concept_domain_limit$, fazer isto irá reduzir seu [income|E] e a [opinion|E] de seus [vassals|E]."
 game_concept_domain_size:0 "Tamanho de Domínio"
 game_concept_domain_size_desc:0 "O $game_concept_domain_size$ de um personagem reflete quantos [titles|E] de [barony|E] e [county|E] eles estão carregando pessoalmente."
 game_concept_domain_taxes:0 "Impostos do Domínio"
 game_concept_domains:0 "Domínios"
 game_concept_domestic_affairs:0 "$task_domestic_affairs$"
 game_concept_domestic_affairs_desc:0 "Uma [councillor_task|E] realizada pelo [chancellor|E], que aumenta a opinião que [vassals|E] no [realm|E] têm em relação ao [liege|E]."
 game_concept_draw_up_new_charts:0 "$draw_up_new_charts_decision$"
 game_concept_draw_up_new_charts_decision:0 "Decisão $draw_up_new_charts_decision$"
 game_concept_draw_up_new_charts_desc:0 "Uma [decision|E] que permite a um personagem trocar [gold|E] por um [artifact|E], ao encomendar um itinerário de viagem descrevendo os lugares que visitou.\nO [artifact|E] de itinerário fornecerá diferentes efeitos dependendo de onde você esteve e das escolhas que fizer."
 game_concept_dread:0 "Medo"
 game_concept_dread_desc:0 "$game_concept_dread$ é uma medida de quão temido um [ruler|E] é.\n\nGovernantes aumentam o $game_concept_dread$ realizando atos cruéis e hediondos, como torturar e executar [prisoners|E].\n\nO Dread torna viável jogar como um [tyrant|E], pois [vassals|E] indisciplinados podem ser [Concept('intimidated', 'Intimidados')|E] ou [Concept('cowed', 'Apavorados')|E], tornando-os muito assustados para se opor a você.\n\nO Dread de um personagem pode variar de 0 a 100, exceto para os [nomads|E], que podem alcançar 150. Com o tempo, o Dread deles tende para o Dread Natural, que é definido por seus [personality_traits|E].\n\n#high Um [ruler] temível colhe os seguintes benefícios:#!\n$BULLET_WITH_TAB$[vassals] são desencorajados de entrar em [factions|E]\n$BULLET_WITH_TAB$[vassals] são desencorajados de [Concept('scheming', 'Conspirar')|E]\n$BULLET_WITH_TAB$Aumenta a aceitação do [vassal] #weak (Ex: Revogação de Título)#!\n$BULLET_WITH_TAB$Aumenta a aceitação de [offer_vassalization|E]\n$BULLET_WITH_TAB$Faz os [electors|E] mais propensos a votar como você\n$BULLET_WITH_TAB$Torna os vassalos improváveis de se opor a mudanças na [law|E]\n\n#weak Observe que vassalos corajosos e audaciosos são menos afetados pelo Medo!#"
 game_concept_dread_i:0 "@dread_icon!"
 game_concept_dreaded:0 "Temido"
 game_concept_dreadful:0 "Temível"
 game_concept_dreams:0 "Sonhos"
 game_concept_dreams_desc:0 "Personagens que seguem uma fé com o preceito de adivinhação ocasionalmente podem ter sonhos. Esses sonhos podem então ser interpretados por um místico, o que pode resultar em várias situações, tanto boas quanto ruins."
 game_concept_ducal_conquest:0 "Conquista Ducal"
 game_concept_ducal_conquest_casus_belli:0 "Causus Belli de Conquista Ducal"
 game_concept_ducal_conquest_casus_belli_desc:0 "Um [casus_belli|E] que permite a apreensão de [counties|E] necessários para criar um [uncreated_title|E] de nível [duchy|E]."
 game_concept_duchies:0 "Ducados"
 game_concept_duchy:0 "Ducado"
 game_concept_duchy_building:0 "Construção de Ducado"
 game_concept_duchy_building_desc:0 "$game_concept_duchy_buildings$ são poderosas [buildings|E] que só podem ser feitas na [de_jure_capital|E] de um [duchy|E]. Apenas um tipo pode ser feito em cada Ducado.\n\n$game_concept_duchy_buildings$ só são ativas se o proprietário também for dono do [title|E] do respectivo Ducado.\n\nMuitas $game_concept_duchy_buildings$ têm modificadores que afetam todas as [holdings|E] do Ducado, fazendo com que sejam ferramentas poderosas para especializar seu [domain|E]."
 game_concept_duchy_buildings:0 "Construções de Ducado"
 game_concept_duchy_desc:0 "Um $game_concept_duchy$ é um [title|E] abaixo de um [kingdom|E] e acima de [county|E].\n\nO [holder|E] de um Ducado tem direitos [de_jure|E] sobre os Condados constituintes e pode ter Condes como [vassals|E].\n\nDucados podem ser dormentes e não ter nenhum Proprietário. Estes títulos podem ser criados por um [ruler|E] que controla ao menos metade de seus Condados."
 game_concept_duke:0 "Duque"
 game_concept_duke_desc:0 "Um $game_concept_duke$ é um [ruler|E] cujo [primary_title|E] é um [duchy|E].\n\nSeu [rank|E] está diretamente acima dos [counts|E] e diretamente abaixo dos [kings|E], e por isso eles podem ter $game_concept_counts$ como [vassals|E] e um $game_concept_king$ ou superior como seu [liege|E]."
 game_concept_dukes:0 "Duques"
 game_concept_dungeon:0 "Masmorra"
 game_concept_dungeon_desc:0 "Personagens mantidos [Concept('imprisoned', 'Aprisionados')|E] na $game_concept_dungeon$ ou $game_concept_stockade$ sofrem com o aumento de [stress|E], além de uma penalidade na [health|E]. Com o tempo, é provável que morram de [Concept('illness', 'Doenças')|E] ou sofram colapsos mentais.\n\nPara [rulers|E] [landed|E], [commoners|E] são automaticamente presos na Masmorra, mas podem ser movidos para uma [house_arrest|E]."
 game_concept_dungeons:0 "Masmorras"
 game_concept_duumvirate:0 "Duumvirado"
 game_concept_duumvirate_desc:0 "Um $game_concept_duumvirate$ é o governo de um [empire|E] por dois [characters|E]. Um imperador sênior (o [liege|E]) e um imperador júnior (o $game_concept_co_emperor$).\n\nEles geram [influence|E] passiva para ambos, eles mesmos e seu imperador sênior. Quanto exatamente aumenta a cada [EmptyScope.ScriptValue('co_emperor_scale_years_in_job_value')|0] anos no cargo, incluindo qualquer tempo que passaram como [junior_emperor|E].\n\nNa prática, a maior parte do poder ainda reside nas mãos do $game_concept_liege$ que realmente detém o título imperial em vez de seu [diarch|E], mas o $game_concept_co_emperor$ tem acesso a várias maneiras poderosas de afetar o [realm|E] e é um candidato mais barato para promover posições [administrative|E].\n\nNotavelmente, $game_concept_co_emperors$ podem usar o [casus_belli|E] [imperial_expedition_cb|E] em níveis mais altos de [scales_of_power|E].\n\n#WEAK $game_concept_co_emperors$ podem [usurp|E] seu imperador sênior por meio da mutilação ritual.#!"
 game_concept_duumvirates:0 "Duumvirados"
 game_concept_dynast:0 "Chefe da Dinastia"
 game_concept_dynast_desc:0 "Um $game_concept_dynast$ é o [house_head|E] que lidera toda a [dynasty|E] e todas as suas [houses|E].\n\nO Chefe da Dinastia exerce certos poderes únicos sobre os membros da Dinastia, conhecidos como [dynast_interactions|E]. O $game_concept_dynast$ também escolhe os [dynasty_perks|E] para a $game_concept_dynasty$.\n\nNormalmente, o $game_concept_dynast$ é o $game_concept_house_head$ que pode ter mais [soldiers|E]. Se todos os $game_concept_house_heads$ possuírem o [government|E] [administrative|E], o $game_concept_dynast$ será, em vez disso, aquele que tiver a maior [powerful_family_rating|E]."
 game_concept_dynast_interaction:0 "Interação de Chefe da Dinastia"
 game_concept_dynast_interaction_desc:0 "Interações que são unicamente disponíveis ao [dynast|E] de uma [dynasty|E], sobre outros membros da dinastia.\n\nEles custam [dynasty_prestige|E] para serem utilizados."
 game_concept_dynast_interactions:0 "Interações de Chefe da Dinastia"
 game_concept_dynastic:0 "Dinástico"
 game_concept_dynasties:0 "Dinastias"
 game_concept_dynasty:0 "Dinastia"
 game_concept_dynasty_desc:0 "Uma $game_concept_dynasty$ é um grupo de descendentes [nobles|E] de um ancestral [landed|E]; o fundador da Dinastia. A [house|E] original pode se dividir em novas ([cadet_branches|E]), sendo todos membros da Dinastia maior.\n\nQuando o seu Personagem morre, você deve ter um [player_heir|E], ou o jogo será finalizado (apesar de você poder pegar outro governante e continuar a jogar no mesmo mundo).\n\nComo o [prestige|E] de personagens, dinastias têm a [dynasty_prestige|E]."
 game_concept_dynasty_members:0 "Membros da Dinastia"
 game_concept_dynasty_perk:0 "Legado da Dinastia"
 game_concept_dynasty_perk_desc:0 "$game_concept_dynasty_perks$ são bençãos que podem ser desbloqueadas e fornecem efeitos poderosos a todos os membros de uma [dynasty|E].\n\nO [dynast|E] desbloqueia os $game_concept_dynasty_perks$ ao gastar [dynasty_prestige|E], a cada Legado na mesma faixa sendo progressivamente mais caro e poderoso.\n\n$game_concept_dynasty_perks$ são adquiridos lentamente, mas ficam na Dinastia para sempre."
 game_concept_dynasty_perks:0 "Legados da Dinastia"
 game_concept_dynasty_prestige:0 "Notoriedade"
 game_concept_dynasty_prestige_desc:0 "$game_concept_dynasty_prestige$ é semelhante ao [prestige|E], mas é compartilhado por toda a [dynasty|E].\n\nUma dinastia ganha $game_concept_dynasty_prestige$ através de:\n$BULLET_WITH_TAB$O número de membros vivos\n$BULLET_WITH_TAB$O número de [rulers|E]\n$BULLET_WITH_TAB$O número de [spouses|E] de outros governantes\nObserve que os governantes não trazem $game_concept_dynasty_prestige$ se tiverem [Concept('lieges', 'suseranos')|E] da mesma dinastia.\n\nAssim como o prestígio, $game_concept_dynasty_prestige$ também afeta o [dynasty_prestige_level|E].\n\n$game_concept_dynasty_prestige$ pode ser usado pelo [dynast|E] para desbloquear os [dynasty_perks|E] e influenciar os membros da dinastia de várias maneiras.\n\n#weak Uma dinastia dispersa por vários [realms|E] gerará mais $game_concept_dynasty_prestige$ do que uma dinastia concentrada em um único reino.#!"
 game_concept_dynasty_prestige_i:0 "@dynasty_prestige_icon!"
 game_concept_dynasty_prestige_level:0 "Nível de Prestígio da Dinastia"
 game_concept_dynasty_prestige_level_0:0 "Origem Comum"
 game_concept_dynasty_prestige_level_0_desc:0 "#T $game_concept_dynasty_prestige_level_0$#!\n[GetDynastyPrestigeLevelEffect('(int32)0')][GetDynastyPrestigeLevelNext('(int32)0')]"
 game_concept_dynasty_prestige_level_10:0 "Lendário"
 game_concept_dynasty_prestige_level_10_desc:0 "#T $game_concept_dynasty_prestige_level_10$#!\n[GetDynastyPrestigeLevelEffect('(int32)10')]\nEste é o maior nível de Esplendor."
 game_concept_dynasty_prestige_level_1:0 "Obscuro"
 game_concept_dynasty_prestige_level_1_desc:0 "#T $game_concept_dynasty_prestige_level_1$#!\n[GetDynastyPrestigeLevelEffect('(int32)1')][GetDynastyPrestigeLevelNext('(int32)1')]"
 game_concept_dynasty_prestige_level_2:0 "Insignificante"
 game_concept_dynasty_prestige_level_2_desc:0 "#T $game_concept_dynasty_prestige_level_2$#!\n[GetDynastyPrestigeLevelEffect('(int32)2')][GetDynastyPrestigeLevelNext('(int32)2')]"
 game_concept_dynasty_prestige_level_3:0 "Notável"
 game_concept_dynasty_prestige_level_3_desc:0 "#T $game_concept_dynasty_prestige_level_3$#!\n[GetDynastyPrestigeLevelEffect('(int32)3')][GetDynastyPrestigeLevelNext('(int32)3')]"
 game_concept_dynasty_prestige_level_4:0 "Respeitável"
 game_concept_dynasty_prestige_level_4_desc:0 "#T $game_concept_dynasty_prestige_level_4$#!\n[GetDynastyPrestigeLevelEffect('(int32)4')][GetDynastyPrestigeLevelNext('(int32)4')]"
 game_concept_dynasty_prestige_level_5:0 "Renomado"
 game_concept_dynasty_prestige_level_5_desc:0 "#T $game_concept_dynasty_prestige_level_5$#!\n[GetDynastyPrestigeLevelEffect('(int32)5')][GetDynastyPrestigeLevelNext('(int32)5')]"
 game_concept_dynasty_prestige_level_6:0 "Significante"
 game_concept_dynasty_prestige_level_6_desc:0 "#T $game_concept_dynasty_prestige_level_6$#!\n[GetDynastyPrestigeLevelEffect('(int32)6')][GetDynastyPrestigeLevelNext('(int32)6')]"
 game_concept_dynasty_prestige_level_7:0 "Famoso"
 game_concept_dynasty_prestige_level_7_desc:0 "#T $game_concept_dynasty_prestige_level_7$#!\n[GetDynastyPrestigeLevelEffect('(int32)7')][GetDynastyPrestigeLevelNext('(int32)7')]"
 game_concept_dynasty_prestige_level_8:0 "Glorioso"
 game_concept_dynasty_prestige_level_8_desc:0 "#T $game_concept_dynasty_prestige_level_8$#!\n[GetDynastyPrestigeLevelEffect('(int32)8')][GetDynastyPrestigeLevelNext('(int32)8')]"
 game_concept_dynasty_prestige_level_9:0 "Fabuloso"
 game_concept_dynasty_prestige_level_9_desc:0 "#T $game_concept_dynasty_prestige_level_9$#!\n[GetDynastyPrestigeLevelEffect('(int32)9')][GetDynastyPrestigeLevelNext('(int32)9')]"
 game_concept_dynasty_prestige_level_desc:0 "$game_concept_dynasty_prestige_level$ é uma medida da fama de uma [dynasty|E]. A dinastia sobe de nível quando ganha [dynasty_prestige_level|E]. O prestígio inicial dos personagens depende do $game_concept_dynasty_prestige_level$ em que nasceram. [spouses|E] também recebem algum prestígio dependendo da dinastia em que se [Concept('marry', 'casaram')|E].\n\nOs níveis são:\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_0|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_1|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_2|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_3|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_4|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_5|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_6|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_7|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_8|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_9|E]\n$EFFECT_LIST_BULLET$[dynasty_prestige_level_10|E]"
 game_concept_eastern_roman_empire:0 "Império Romano Oriental"
 game_concept_eastern_roman_empire_desc:0 "Um [title|E] de [empire|E] que pode ser criado pelo portador do Império Romano.\n\nO título é criado ao tomar a [decision|E] #EMP $split_roman_empire_decision$#!."
 game_concept_economic_building:0 "Construção Econômica"
 game_concept_economic_building_desc:0 "$game_concept_economic_buildings$ são [buildings|E] cuja função primária é aumentar o [domain_income|E] da Propriedade."
 game_concept_economic_buildings:0 "Construções Econômicas"
 game_concept_economical_archetype:0 "Arquétipo Econômico"
 game_concept_economical_archetype_desc:0 "O Arquetipo Econômico do [ruler|E] afeta como ele decide gastar seu [gold_i][gold|E]. Ele se baseia em grande parte em seus [traits|E].\n\n#low Os Arquetipos Econômicos são:#!\n$EFFECT_LIST_BULLET$[ai_warlike_personality|E]\n$EFFECT_LIST_BULLET$[ai_cautious_personality|E]\n$EFFECT_LIST_BULLET$[ai_economical_boom_personality|E]\n$EFFECT_LIST_BULLET$[ai_economical_unpredictable_personality|E]\n$EFFECT_LIST_BULLET$[ai_conqueror_personality|E]"
 game_concept_educate:0 "Educar"
 game_concept_educated:0 "Educado"
 game_concept_education:0 "Educação"
 game_concept_education_focus:0 "Foco Educacional"
 game_concept_education_focus_desc:0 "Todas as [children|E] entre a idade de #V 6#! e #V 9#! podem receber um $game_concept_education_focus$ voltado a uma das cinco [skills|E].\n\nA Educação termina com um [education_trait|E] na chegada da [adulthood|E].\n\nA qualidade do $game_concept_education_trait$ que irão receber depende do quão bom o seu [childhood_trait|E] combinou com seu Foco Educacional, bem como a Habilidade relevante de seu [guardian|E].\n\nQuando escolhendo um Foco Educacional, você também pode especificar se a criança irá ou não crescer com a [faith|E] e/ou [culture|E] de seu [guardian|E]."
 game_concept_education_focus_short:0 "Foco"
 game_concept_education_trait:0 "Traço Educacional"
 game_concept_education_trait_desc:0 "Ao chegar à [adulthood|E], todo personagem recebe um $game_concept_education_trait$.\n\nExistem cinco tipos de Traços de Educação, cada um correspondente a uma [skill|E] específica.\n\nA qualidade do [trait|E] que um personagem recebe irá depender do quão bom o seu [childhood_trait|E] combinou com o seu Foco Educacional, bem como a Habilidade relevante de seu [guardian|E].\n\nO $game_concept_education_trait$ de um personagem melhora o quão rápido eles irão progredir no [lifestyle|E] correspondente."
 game_concept_education_traits:0 "Traços Educacionais"
 game_concept_educations:0 "Educações"
 game_concept_elderly_health:0 "Saúde dos Idosos"
 game_concept_elderly_health_desc:0 "Certos [traits|E], como [GetTrait('pneumonic').GetName( GetNullCharacter )], são mais perigosos para aqueles com pelo menos [GetDefine( 'NCharacter', 'FEMALE_ELDERLY_AGE' )|V] anos de idade.\n\nQualquer penalidade para $game_concept_elderly_health$ acumula com as penalidades regulares para a [health|E], mesmo dos mesmos Traços."
 game_concept_election:0 "Eleição"
 game_concept_elections:0 "Eleições"
 game_concept_elective_succession:0 "Sucessão Eletiva"
 game_concept_elective_succession_desc:0 "Sob uma $game_concept_elective_succession$, os [electors|E] votam para escolher o próximo [holder|E] do [title|E] em vez de o título passar por herança comum."
 game_concept_elector:0 "Eleitor"
 game_concept_elector_desc:0 "Eleitores são personagens que podem votar em um [title_heir|E] de sua preferência nas [succession_laws|E] Eletivas. A Lei específica determina quem é considerdado um Eleitor."
 game_concept_elector_i:0 "@election_icon!"
 game_concept_electors:0 "Eleitores"
 game_concept_elephant_cavalry:0 "Cavalaria de Elefantes"
 game_concept_elephant_cavalry_desc:0 "$game_concept_elephant_cavalry$ são [men_at_arms|E] pesadamente blindados.\n\nEmbora todos os tipos de $game_concept_elephant_cavalry$ sejam únicos, eles geralmente são contrapostos por infantaria e, por sua vez, são contrapostos por [spearmen|E].\n\n$game_concept_elephant_cavalry$ também são frequentemente fortes em [terrains|E] de selva."
 game_concept_eligible_child:0 "Criança Elegível"
 game_concept_eligible_child_desc:0 "$game_concept_eligible_children$ são, pela lei, permitidas de herdar os [titles|E] de seus pais.\n\n[bastards|E] não são considerados elegíveis, como também filhos de certo sexo dependendo das [gender_laws|E] presentes."
 game_concept_eligible_children:0 "Crianças Elegíveis"
 game_concept_embark:0 "Embarcar"
 game_concept_embarkation:0 "Embarcação"
 game_concept_embarked:0 "Embarcado"
 game_concept_embarked_i:0 "@embarked_icon!"
 game_concept_embarking:0 "Embarcando"
 game_concept_embarking_desc:0 "Um [army|E] irá automaticamente $game_concept_embark$ em uma [fleet|E] quando receber uma ordem para se mover dentro de uma Zona de Oceano, ou quando não à caminho por terra até o [barony|E] alvo.\n\n$game_concept_embark$ suas tropas em uma [fleet|E] irá custar uma quantia em [gold|E], simboizando a construção e compra de navios. Para cada #V 100#! tropas Embarcando, um custo de #V [GetDefine('NFleet', 'EMBARK_GOLD_COST_PER_HUNDRED')|0]#! [gold_i] será pago."
 game_concept_embrace_celibacy:0 "Abraçar o Celibato"
 game_concept_embrace_celibacy_decision:0 "Decisão Abraçar o Celibato"
 game_concept_embrace_celibacy_desc:0 "Uma [decision|E] que permite a um personagem obter os [traits|E] [GetTrait('celibate').GetName( GetNullCharacter )] à vontade."
 game_concept_eminent_holy_site:0 "Local Sagrado Eminente"
 game_concept_eminent_holy_site_desc:0 "Um $game_concept_eminent_holy_site$ é um [holy_site|E] de alta importância para uma [faith|E]. Cada fé pode designar apenas alguns de seus $game_concept_holy_sites$ como eminentes.\n\nApenas Locais Sagrados Eminentes contribuem com modificadores que afetam todos os seguidores de uma fé."
 game_concept_eminent_holy_site_short:0 "Eminente"
 game_concept_eminent_holy_sites:0 "Locais Sagrados Eminentes"
 game_concept_emperor:0 "Imperador"
 game_concept_emperor_desc:0 "Um $game_concept_emperor$ é um [ruler|E] cujo [primary_title|E] é um [empire|E].\n\nSeu [rank|E] está diretamente acima dos [kings|E] e diretamente abaixo dos [hegemons|E], e por isso eles podem ter $game_concept_kings$ e inferiores como [vassals|E], e apenas um $game_concept_hegemon$ pode ser seu [liege|E]."
 game_concept_emperors:0 "Imperadores"
 game_concept_empire:0 "Império"
 game_concept_empire_desc:0 "Um $game_concept_empire$ é um [title|E] um [title_tier|E] abaixo de uma [hegemony|E] e um acima de um [kingdom|E].\n\nO [holder|E] de um Império possui direitos [de_jure|E] sobre seus territórios constituintes e pode ter [kings|E] como [vassals|E].\n\n$game_concept_empires$ podem estar dormentes e não possuir um $game_concept_holder$ atual. Tais $game_concept_titles$ podem ser criados por um [ruler|E] que controla mais de 80% dos [counties|E] dentro dele."
 game_concept_empires:0 "Impérios"
 game_concept_end_date:0 "Data Final"
 game_concept_end_date_desc:0 "1453 AD é a Data Final, ao atingir esta data o jogo será finalizado."
 game_concept_entourage:0 "Comitiva"
 game_concept_entourage_desc:0 "É perigoso viajar sozinho, então você deve trazer alguns companheiros na sua Comitiva. Todos que [Concept('travels', 'Viajam')|E] com você fazem parte da sua Comitiva e compartilham dos desafios que você pode enfrentar na jornada.\n\nSeu [GetCourtPositionType('travel_leader_court_position').GetName()] é o líder da Comitiva e gerencia seus planos de viagem.\n\nAlguns [characters|E] são adicionados automaticamente à sua Comitiva ao planejar uma viagem. [travel_options|E] e as [activity_options|E] oferecem maneiras adicionais de incluir personagens."
 game_concept_entrenched_regencies:0 "Regências Enraizadas"
 game_concept_entrenched_regency:0 "Regência Enraizada"
 game_concept_entrenched_regency_desc:0 "Se uma [regency|E] durar muito tempo, ela pode se tornar Enraizada, e o [regent|E] se torna ainda mais poderoso em comparação ao seu [liege|E].\n\nOs benefícios que o [regent|E] obtém das [scales_of_power|E] se tornam muito mais poderosos.\n\nPara encerrar uma $game_concept_entrenched_regency$, o Regente deve aceitar um presente de seu Senhor Feudal, ou o Senhor Feudal deve inclinar as Escalas a seu favor."
 game_concept_entrenched_regency_entrench:0 "Enraizar"
 game_concept_entrenched_regency_entrenched:0 "Enraizada"
 game_concept_entrenched_regency_regency:0 "Regência"
 game_concept_entrenched_regent:0 "Regente Enraizado"
 game_concept_entrenched_regents:0 "Regentes Enraizados"
 game_concept_epithet:0 "Epíteto"
 game_concept_epithets:0 "Epítetos"
 game_concept_era:0 "Era"
 game_concept_era_desc:0 "[innovations|E] só podem ser descobertas se a [culture|E] tiver alcançado a Era requisitada. A próxima era só pode ser iniciada após um certo ano, e se ao menos #V 50%#! das Inovações da Era anterior tiverem sido descobertas.\n\nGovernantes em um [tribal_government|E] e [nomadic_government|E] só podem fazer uso de Inovações da Era Tribal."
 game_concept_eras:0 "Eras"
 game_concept_escalated_peasant_faction:0 "$peasant_faction$ Escalada"
 game_concept_escalated_peasant_faction_desc:0 "A $game_concept_escalated_peasant_faction$ é composta por [counties|E] com baixa [county_opinion|E] que já impuseram as exigências de uma [peasant_faction|E] a um dos seus [vassals|E]. Liderada por um chefe infame, essa facção é perigosa e capaz de se separar do seu [realm|E]."
 game_concept_escalated_peasant_factions:0 "Facções Camponesas Escaladas"
 game_concept_espionage:0 "$task_find_secrets$"
 game_concept_espionage_desc:0 "$game_concept_espionage$ é uma [councillor_task|E] realizada pelo [spymaster|E].\n\nEle visa a [court|E] de um [ruler|E] e tenta descobrir [secrets|E] sobre os personagens lá."
 game_concept_ethos:0 "Ética"
 game_concept_ethos_desc:0 "A ética de uma [culture|E] determina seus valores centrais, seus princípios orientadores e a atitude de seus membros em relação à vida em geral.\n\nAlém disso, a ética tem um grande impacto nos custos de introdução das novas [traditions|E] pelo [culture_head|E].[SelectLocalization(HasDlcFeature('reform_culture'), 'game_concept_ethos_desc_REFORM_DLC', '')]"
 game_concept_ethos_desc_REFORM_DLC:0 "\n\nO [culture_head|E] pode substituir a $game_concept_ethos$ atual através da [reformation|E]."
 game_concept_exceptional_epic:0 "Epopeia Excepcional"
 game_concept_exceptional_epic_desc:0 "Uma Epopeia de Família escrita através da $commission_epic_decision$ tem uma chance de ser uma Epopeia Excepcional, que confere bônus maiores do que uma epopeia normal.\n\nA chance da Epopeia ser Excepcional pode ser afetada por escolhas de eventos."
 game_concept_excommunicate:0 "Excomungar"
 game_concept_excommunicated:0 "Excomungado"
 game_concept_excommunicated_ruler:0 "Governante Excomungado"
 game_concept_excommunicated_ruler_desc:0 "Em uma Guerra de Excomunhão, os atacantes estão lutando para remover um Governante [excommunicated|E] do poder.\n\nSe vitoriosos, os atacantes irão receber um grande valor de [piety|E] e a aprovação de seu [head_of_faith|E], enquanto o Governante Excomungado é forçado a abdicar-se para seu [heir|E].\n\nPorém, se o Governante Excomungado vencer, seu [head_of_faith|E] é forçado a remover a Excomunhão, já que provaram sua integridade no campo de batalha."
 game_concept_excommunication:0 "Excomunhão"
 game_concept_excommunication_desc:0 "Personagens que forem [GetTrait('excommunicated').GetName( GetNullCharacter )]s por seu [head_of_faith|E] são vistos como [criminals|E] por outros personagens de sua [faith|E].\n\n[rulers|E] [Concept('independent', 'Independentes')|E] que forem [GetTrait('excommunicated').GetName( GetNullCharacter )]s podem ter uma [excommunication_war|E] declarada sobre eles.\n\nA Excomunhão pode ser removida ao pedir perdão ao [head_of_faith|E] ou ao mudar para uma [faith|E] diferente."
 game_concept_excommunication_war:0 "Guerra de Excomunhão"
 game_concept_execute:0 "Executar"
 game_concept_execute_desc:0 "Personagens [Concept('imprisoned', 'Aprisionados')|E] podem ser executados. Isto é considerado um ato [tyrannical|E] caso não haja uma [execute_reason|E].\n\nExecuções aumentam o seu [dread|E] e nunca são bem vistas pela [close_family|E] do alvo."
 game_concept_execute_reason:0 "Motivo de Execução"
 game_concept_execute_reason_desc:0 "Um $game_concept_execute_reason$ dá a um [liege|E] a oportunidade de executar livremente um súdito que ele tem em sua [dungeon|E]. Eles são mais frequentemente obtidos pelo súdito sendo um [criminal|E]."
 game_concept_execute_reasons:0 "Motivos de Execução"
 game_concept_executed:0 "Executado"
 game_concept_executing:0 "Executando"
 game_concept_execution:0 "Execução"
 game_concept_executions:0 "Execuções"
 game_concept_existing_development:0 "Desenvolvimento Existente"
 game_concept_existing_development_desc:0 "A Tarefa de [develop_county|E] sofre de rendimentos decrescentes. Quanto maior o [development|E] que um [county] já têm, maior a penalização no [development_growth|E].\n\nPor padrão, [counties] chegam à penalidade máxima de [existing_development] no nível 10 de [development|E]. Cada [era|E] tem uma [innovation|E] que aumenta significativamente este limite, indo até 90 de [development|E] na [era] $culture_era_late_medieval$.\n\nInovações que afetam o modificador de $game_concept_existing_development$:\n$EFFECT_LIST_BULLET$ $innovation_development_01$\n$EFFECT_LIST_BULLET$ $innovation_development_02$\n$EFFECT_LIST_BULLET$ $innovation_development_03$\n$EFFECT_LIST_BULLET$ $innovation_development_04$"
 game_concept_expected_legitimacy:0 "Legitimidade Esperada"
 game_concept_expected_legitimacy_desc:0 "O [legitimacy_level|E] que os [vassals|E] esperam de seu [ruler|E], com base em sua relação histórica. Alguns fatores que diminuem as Expectativas são:\n$BULLET_WITH_TAB$Ser o [liege|E] [de_jure|E] do vassalo\n$BULLET_WITH_TAB$Fazer parte da [close_family|E] do vassalo\n$BULLET_WITH_TAB$Ser o [preferred_heir|E] do vassalo\n$BULLET_WITH_TAB$Ser da mesma [dynasty|E] que o vassalo serviu por mais de #color_white 50#! anos\n$BULLET_WITH_TAB$O vassalo não ser um [powerful_vassal|E]\n\nSe o nível real estiver abaixo de suas Expectativas, eles podem se tornar rebeldes: sua [opinion|E] será mais baixa e eles podem se juntar as [factions|E] contra seu [liege|E].\n\nAs Expectativas aumentam com o nível de seu [primary_title|E], assim como com a [era|E]."
 game_concept_experience:0 "Experiência"
 game_concept_extended_family:0 "Família Extendida"
 game_concept_extended_family_desc:0 "A Família Extendida de um personagem inclui:\n$BULLET_WITH_TAB$Primos/Primas\n$BULLET_WITH_TAB$Tios\n$BULLET_WITH_TAB$Tias\n$BULLET_WITH_TAB$Sobrinhos\n$BULLET_WITH_TAB$Sobrinhas"
 game_concept_extended_family_members:0 "Membros da Família Extendida"
 game_concept_extort_subjects:0 "Extorquir Súditos"
 game_concept_extort_subjects_decision:0 "Decisão Extorquir Súditos"
 game_concept_extort_subjects_decision_desc:0 "Uma [decision|E] que oferece diferentes oportunidades de exigir [gold|E] extra dos súditos, a um custo diferente..."
 game_concept_extramarital_sex:0 "Sexo Extraconjugal"
 game_concept_extramarital_sex_desc:0 "Se forem descobertos, dois personagens envolvidos em sexo extraconjugal sofrerão consequências dependendo das [doctrines|E] de sua [faithpossessive|E].\n\n$EFFECT_LIST_BULLET$Cada personagem se tornará conhecido como um [GetTrait('fornicator').GetName( GetNullCharacter )] ou um [GetTrait('adulterer').GetName( GetNullCharacter )], dependendo do seu próprio estado civil.\n$EFFECT_LIST_BULLET$Se um homem e uma mulher dormirem juntos, isso pode resultar em um [bastard|E] na gravidez.\n$EFFECT_LIST_BULLET$Se os personagens forem do mesmo gênero, as consequências serão determinadas pela [doctrine|E] $doctrine_homosexuality_name$ de sua [faith|E].\n$EFFECT_LIST_BULLET$Qualquer [sickness|E] sexualmente transmissível mantida por um personagem pode infectar o outro."
 game_concept_extramarital_sex_sleeping_with:0 "dormindo com"
 game_concept_fabricate_claim:0 "$task_fabricate_claim$"
 game_concept_fabricate_claim_desc:0 "Uma [councillor_task|E] realizada pelo [court_chaplain|E].\nAlveja um [county|E] e constrói progresso ao longo do tempo. Com 100% de progresso, uma [claim|E] pode ser fabricada por um custo de [gold|E]."
 game_concept_fabricate_claim_short:0 "Fabricar Reivindicação"
 game_concept_fabricated_claims_short:0 "Reivindicações Fabricadas"
 game_concept_fabricating_claims:0 "Fabricando reivindicações"
 game_concept_faction:0 "Facção"
 game_concept_faction_commitment:0 "Comprometimento com a Facção"
 game_concept_faction_commitment_desc:0 "A probabilidade de um [character|E] apoiar uma [faction|E] contra seu [liege|E].\n\nPode ser influenciada por vários fatores, sendo os mais comuns [personality|E], [opinion|E] e [culture|E]."
 game_concept_faction_desc:0 "Uma $game_concept_faction$ é um grupo de [vassals|E] com interesses políticos comuns. A população local de [counties|E] também pode se juntar a certos tipos de Facções, como a Facção Camponesa.\n\nAs Facções tornam-se perigosas quando seu [faction_discontent|E] atinge um certo ponto, momento em que emitirão um ultimato.\n\nSe o [liege|E] não cumprir, a Facção se revoltará, desencadeando uma [civil_war|E]. Se a Facção se dissolver, o Senhor Feudal deve ter pelo menos [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] de [war_score|E] para vencer a Guerra."
 game_concept_faction_discontent:0 "Descontentamento"
 game_concept_faction_discontent_desc:0 "$game_concept_faction_discontent$ é uma medida de quão próximo uma [faction|E] está de emitir um utimato.\n\nSe o [military_power|E] de uma facção está no limite, o Descontentamento irá aumentar a cada mês. Se o Poder Militar estiver abaixo do limite, o Descontentamento irá diminuir. Facções muito poderosas irão aumentar seu Descontentamento mais rapidamente."
 game_concept_faction_independence:0 "Independência"
 game_concept_faction_liberty:0 "Liberdade"
 game_concept_faction_military_power:0 "Poder Militar da Facção"
 game_concept_faction_military_power_desc:0 "$game_concept_faction_military_power$ é uma medida do total de força militar que a [faction|E] tem relativamente ao seu alvo.\n\nCada membro individual da facção adiciona toda sua força para a facção enquanto forem membros da mesma. Se o alvo da pacção for o [liege|E] de um mebro, a força do membro é também subtraída da força do senhor feudal."
 game_concept_factions:0 "Facções"
 game_concept_faith:0 "Fé"
 game_concept_faith_astray:0 "Desviado"
 game_concept_faith_astray_desc:0 "Esta [faith|E] difere de uma maneira que não é particularmente significativa.\n\nOcasionalmente ocorre intercasamento.\n#S Efeitos:\n#![GetHostilityDescription( '(int32)1' )]"
 game_concept_faith_desc:0 "Uma Fé é uma denominação específica de uma [religion|E] maior. Todos os personagens e [counties|E] têm uma Fé como também uma [culture|E].\n\nCada Fé é definida por um conjunto de [doctrines|E] com vastas consequências para seus adeptos.\n\nCada Fé também tem um valor de [fervor|E] que controla o quão vulnerável está à [heresy|E] ([rulers|E] e Condados convertendo para outras Religiões da mesma Fé)."
 game_concept_faith_evil:0 "Mal"
 game_concept_faith_evil_desc:0 "Esta [faith|E] é considerada anátema.\nRaramente ocorre intercasamento e [holy_wars|E] podem ser travadas.\n\n#S Efeitos:\n#![GetHostilityDescription( '(int32)3' )]"
 game_concept_faith_hostile:0 "Hostil"
 game_concept_faith_hostile_desc:0 "Esta [faith|E] desvia-se significativamente.\nOcasionalmente ocorre intercasamento e [holy_wars|E] podem ser travadas.\n\n#S Efeitos:\n#![GetHostilityDescription( '(int32)2' )]"
 game_concept_faith_hostility:0 "Hostilidade entre Fés"
 game_concept_faith_hostility_desc:0 "Todas as [faith|E]s têm uma relação umas com as outras, chamada de $game_concept_faith$, que é determinada por quão intimamente relacionadas elas são.\n\nA proximidade é decidida por vários fatores, como se elas compartilham a mesma [religion|E], [religious_family|E] ou se a fé possui [doctrines|E] especiais.\n\nSe duas fés estiverem distantes, muitas vezes são capazes de travar [holy_war|E] uma contra a outra.\n\nAs seguintes relações existem: [faith_righteous|L], [faith_astray|L], [faith_hostile|L] e [faith_evil|L]."
 game_concept_faith_righteous:0 "Justo"
 game_concept_faith_righteous_desc:0 "Esta [faith|E] é considerada legítima. O casamento entre membros de diferentes [religion|E] é comum.\n\n#S Efeitos:\n#![GetHostilityDescription( '(int32)0' )]"
 game_concept_faithpossessive:0 "Fé"
 game_concept_faiths:0 "Religiões"
 game_concept_fallback_heir:0 "Herdeiro Alternativo"
 game_concept_fallback_heir_desc:0 "O $game_concept_fallback_heir$ se torna o [realm_heir|E] para o [title|E] alvo quando a linha regular de [succession|E] está vazia."
 game_concept_fallback_heir_title:0 "Título de Herdeiro Alternativo"
 game_concept_fallback_heir_title_desc:0 "O [holder|E] do $game_concept_fallback_heir_title$ se torna o [realm_heir|E] para o [title|E] alvo quando a linha regular de [succession|E] está vazia."
 game_concept_fame_trait:0 "Traço de fama"
 game_concept_fame_trait_desc:0 "Um $game_concept_fame_trait$ é um [trait|E] especial adquirido por circunstâncias específicas e afeta a [opinion|E] dos outros sobre a pessoa. Pode-se adquirir esses traços como resultado de uma ação positiva, ou quando os [secrets|E] obscuros de alguém são expostos. Outros são o resultado das circunstâncias do nascimento da pessoa."
 game_concept_fame_traits:0 "Traços de Fama"
 game_concept_famed:0 "$artifacts_rarity_famed$"
 game_concept_family:0 "Família"
 game_concept_family_desc:0 "A Família de um personagem consiste de seus [close_family_members|E] e [extended_family_members|E]."
 game_concept_family_member:0 "Membro da Família"
 game_concept_family_members:0 "Membros da Família"
 game_concept_fascination:0 "Fascinação"
 game_concept_fatalities:0 "Fatalidades"
 game_concept_fatalities_desc:0 "[characters|E] que pereceram como resultado direto de uma [epidemic|E] ou [natural_disaster|E]."
 game_concept_favor:0 "Favor"
 game_concept_favor_desc:0 "Personagens podem dever $game_concept_favors$ uns com os outros, o que é considerado um tipo de [hook|E].\n\nFavores podem ser obtidos de diversas formas, mas comumente é por meio de eventos ensaiados. Cada criança nascida em uma [house|E] [noble|E] também deve um Favor ao [house_head|E]."
 game_concept_favorite_child:0 "Filho Favorito"
 game_concept_favorite_child_desc:0 "Um $game_concept_favorite_child$ é um descendente direto da mesma [dynasty|E] que um governante jogador pode escolher favorecer. Eles terão uma [opinion|E] mais alta de você e, quando você morrer, poderá escolher continuar seu legado como eles, em vez de seu herdeiro.\n\nSeu filho favorito pode ser qualquer filho, neto ou bisneto, desde que estejam em sua dinastia."
 game_concept_favors:0 "Favores"
 game_concept_feast:0 "$activity_feast$"
 game_concept_feast_desc:0 "Uma [activity|E] onde governantes e cortesãos de um reino se reúnem para celebrar... algo.\n\nOs Paritipantes irão perder [stress|E] e aumentar sua [opinion|E] sobre o anfitrião. Reunir estas pessoas também pode trazer muitas consequências.\n\nUm [ruler|E] irá convidar o seu [liege|E] e seus [vassals|E] (junto de vários [courtiers|E]) para uma $activity_feast$."
 game_concept_fertility:0 "Fertilidade"
 game_concept_fertility_desc:0 "$game_concept_fertility$ mede o quão apto um Personagem está para produzir filhos."
 game_concept_fervor:0 "Fervor"
 game_concept_fervor_desc:0 "O $game_concept_fervor$ de uma [faith|E] pode variar de #V 0#! até #V 100%#!. Baixo $game_concept_fervor$ torna mais fácil para [rulers|E] criarem novas religiões próprias e aumenta a chance de [counties|E] e personagens converterem para outras Religiões, incluindo [heresies|E]. Alto $game_concept_fervor$ aumenta a velocidade de conversão de Condados.\n\n$game_concept_fervor$ se altera naturalmente com o tempo. Religiões menores tendem a ter um Fervor maior. Religiões grandes tender a ter um $game_concept_fervor$ mais baixo.\n\nPromover Grandes Guerras Santas e Guerras Santas de sucesso irão diminuir o $game_concept_fervor$. Ser o alvo irá aumentar o $game_concept_fervor$. Surtos de [heresy|E] irão aumentar significativamente o $game_concept_fervor$."
 game_concept_fervor_i:0 "@fervor_icon!"
 game_concept_feudal:0 "Feudal"
 game_concept_feudal_desc:0 "Em uma [government_form|E] Feudal, o [liege|E] da [land|E] para seus [vassals|E] governarem em troca de [levies|E] e [taxes|E], reguladas por [vassal_contract|E] individuais entre Vassalo e Senhor Feudal."
 game_concept_feudal_government:0 "Governo Feudal"
 game_concept_feudal_i:0 "@government_type_feudal!"
 game_concept_feudalism:0 "Feudalismo"
 game_concept_fleet:0 "Frota"
 game_concept_fleet_desc:0 "[armies|E] que se movem para uma Zona Marítima automaticamente se [Concept('embark', 'Embarcam')|E] em uma $game_concept_fleet$. A [embarkation] tem um custo em [gold|E], simbolizando a aquisição e construção de navios.\n\nEnquanto estiverem em uma $game_concept_fleet$, os [armies] poderão atravessar a água em um ritmo rápido, porém terão um custo de manutenção #V 25%#! maior e começarão a perder [Concept('supplies', 'Suprimento')|E] após #V [GetDefine('NFleet', 'ATTRITION_AFTER_DAYS')|0]#! dias no mar.\n\n$game_concept_fleets$ não se envolvem em [battles|E] umas com as outras.\n\nQuando um $game_concept_army$ desembarca, a $game_concept_fleet$ desaparece e o $game_concept_army$ se torna [recently_disembarked|E]."
 game_concept_fleets:0 "Frotas"
 game_concept_flowery_war:0 "Roubo por Cativos"
 game_concept_flowery_war_desc:0 "Este é um tipo especial de [war|E], iniciado por um [ruler|E] cuja [faith|E] pratica sacrifício humano. O objetivo principal do $game_concept_flowery_warring$ é batalhar e capturar [prisoners|E] para sacrifício, com ambos os lados sendo capazes de alcançar [war_score|E] através do combate para vencer sem precisar fazer um [siege|E].\n\nAo final da $game_concept_war$, se o vencedor (incluindo o defensor) segue uma $game_concept_faith$ que pratica sacrifício humano, então eles levarão vários $game_concept_prisoners$ da [court|E] do perdedor. Se ambos os principais combatentes em uma $game_concept_flowery_war$ seguirem a mesma fé, então a guerra é considerada sagrada, significando que o perdedor ainda recebe [piety|E] (reduzida) mesmo em derrota.\n\nVocê não pode conduzir ou continuar uma $game_concept_flowery_war$ se você tiver algum $game_concept_prisoner$ obtido através da vitória em uma $game_concept_flowery_war$ em sua [dungeon|E]."
 game_concept_flowery_warring:0 "Roubando Cativos"
 game_concept_flowery_wars:0 "Roubos por Cativos"
 game_concept_focus:0 "Foco"
 game_concept_focus_desc:0 "Cada [lifestyle|E] tem um número de $game_concept_focuses$, no qual um tem de ser escolhido ao selecionar o $game_concept_lifestyle$.\n\n$game_concept_focuses$ fornecem bônus e influênciam os tipos de eventos que irão aparecer. #weak (Por exemplo, ter o beneficio de $intrigue_temptation_focus$ irá te dar um bônus em [fertility|E] e aumentar as chances de eventos de Sedução aparecerem.)#!\n\nPersonagens podem mudar seu $game_concept_focus$ dentro de um mesmo $game_concept_lifestyle$ sem perder a habilidade de ganhar experiência em tal $game_concept_lifestyle$."
 game_concept_focuses:0 "Focos"
 game_concept_force_duel_anyone_interaction:0 "Interação de $force_duel_anyone_interaction$"
 game_concept_force_duel_anyone_interaction_desc:0 "Uma [interaction|E] que permite [single_combat_duel|E] qualquer pessoa quando você está [stressed|E]."
 game_concept_force_duel_criminals_interaction:0 "Interação de $force_duel_criminals_interaction$"
 game_concept_force_duel_criminals_interaction_desc:0 "Uma [interaction|E] que permite [single_combat_duel|E] criminosos quando você está [stressed|E]."
 game_concept_foreign_affairs:0 "$task_foreign_affairs$"
 game_concept_foreign_affairs_desc:0 "Uma [councillor_task|E] realizada pelo [chancellor|E].\nPara um [ruler|E] [independent|E], aumenta a opinião que outros rulers independentes têm deles. Para um vassalo, aumenta a opinião que outros vassalos do mesmo [liege|E] têm deles."
 game_concept_fort_level:0 "Nível de Forte"
 game_concept_fort_level_desc:0 "Algumas [holdings|E] são fortificadas e precisam ser [Concept('besieged', 'sitiadas')|E] e [Concept('occupied', 'ocupadas')|E] para que se obtenha o controle do [county|E].\n\nO $game_concept_fort_level$ dessas [fortified_holdings|E] determina quanto tempo o Cerco pode durar.\n\nUm $game_concept_fort_level$ alto exigirá [siege_weapons|E] para ser $game_concept_besieged$ de forma eficiente, embora cada Arma de Cerco seja eficaz apenas até certo Nível de Fortaleza.\n\nAumentar o Nível de Fortaleza de uma Propriedade não fortificada não tem efeito."
 game_concept_fort_level_i:0 "@fort_icon!"
 game_concept_fortification_building:0 "Construção de Fortificação"
 game_concept_fortification_building_desc:0 "$game_concept_fortification_buildings$ são [buildings|E] cuja função primária é para aumentar o [fort_level|E] da propriedade ou garantir mais [advantage|E] para defensores."
 game_concept_fortification_buildings:0 "Construções de Fortificação"
 game_concept_fortified_holding:0 "Propriedade Fortificada"
 game_concept_fortified_holding_desc:0 "Uma $game_concept_fortified_holding$ é uma [holding|E] com [buildings|E] que aumentam seu [fort_level|E]. [county_capitals|E] sempre são Fortificadas.\n\nPara [occupy|E] completamente um [county|E], todas as suas Propriedades Fortificadas devem ser Ocupadas."
 game_concept_fortified_holdings:0 "Propriedades Fortificadas"
 game_concept_friend:0 "Amigo"
 game_concept_friend_desc:0 "Um $game_concept_friend$ é uma $game_concept_relation$ que indica uma amizade próxima e apoio, e pode ser tido tanto por [children|E] quanto por [adults|E].\n\n$game_concept_friends$ com uma conexão profunda podem se tornar [best_friends|E]."
 game_concept_friend_possessive:0 "Do Amigo"
 game_concept_friends:0 "Amigos"
 game_concept_friends_possessive:0 "Dos Amigos"
 game_concept_friendship:0 "Amizade"
 game_concept_friendships:0 "Amizades"
 game_concept_funeral:0 "Funeral"
 game_concept_funeral_desc:0 "Uma [activity|E] na qual um [host|E] convida vários [characters|E] para oferecer seus respeitos após uma recente [character_death|E]. Funerais frequentemente resultam em aumento de [legitimacy|E], diminuição do [stress|E] e oportunidades para mostrar [piety|E]."
 game_concept_funerals:0 "Funerais"
 game_concept_game_over:0 "Fim de Jogo"
 game_concept_game_over_desc:0 "O jogo termina quando sua linhagem atual morre.\n\nNo entanto, mesmo que o jogo termine para sua linhagem, você ainda pode escolher jogar como outro [ruler|E] em qualquer lugar do mundo.\n\nO jogo pode terminar de duas maneiras:\n$BULLET_WITH_TAB$Você morre sem [player_heir|E]\n$BULLET_WITH_TAB$Você atinge o ano de 1453"
 game_concept_game_rule_extreme:0 "Regra de Jogo Extrema"
 game_concept_game_rule_extreme_desc:0 "Esta Regra de Jogo torna o jogo #bold significativamente#! mais difícil."
 game_concept_game_rule_extreme_i:0 "@warning_icon!"
 game_concept_game_rule_unique:0 "Regra de Jogo Única"
 game_concept_game_rule_unique_desc:0 "Esta Regra de Jogo #bold significativamente#! altera a experiência de jogo."
 game_concept_game_rule_unique_i:0 "@alert_icon!"
 game_concept_garrison:0 "Guarnição"
 game_concept_garrison_desc:0 "A $game_concept_garrison$ de uma [fortified_holding|E] protege-a de ser [Concept('besieged', 'Sitiada')|E] por [armies|E] menores.\n\nO exército sitiante precisa ter mais [soldiers|E] do que a guarnição para que o cerco progrida.\n\nQuando um [siege|E] é perdido, a $game_concept_garrison$ é definida como [GetDefine('NDomain', 'HOLDING_MIN_GARRISON_COUNT')|0]. A partir daí, a $game_concept_garrison$ se reabastece todo mês dependendo do [garrison_reinforcement|E] até atingir sua capacidade máxima.\n\nQuando um [siege|E] começa, o efetivo da $game_concept_garrison$ afeta a quantidade necessária de [siege_progress|E]."
 game_concept_garrison_reinforcement:0 "Reforço de guarnição"
 game_concept_garrison_reinforcement_desc:0 "O $game_concept_garrison_reinforcement$ de uma [Concept('fortified_holding', 'Propriedade Fortificada')|E] determina a rapidez com que a [garrison|E] se recupera após um [siege|E].\n\nA cada mês, a [garrison|E] recupera uma porcentagem da sua capacidade máxima, equivalente à taxa atual. Essa taxa pode ser aumentada através de melhorias na [Concept('holding', 'propriedade')|E].\n\nDurante um [siege|E], no entanto, o reforço é interrompido e a taxa cai para 0."
 game_concept_gender_doctrines:0 "Doutrinas de Gênero"
 game_concept_gender_doctrines_desc:0 "Estas [doctrines|E] determinam quais [gender_laws|E] estarão disponíveis para personagens desta [faith|E].\n\nEla também determina certas regras adicionais, como quais [claims|E] devem ser herdados, quais personagens podem ser [commanders|E] e [knights|E], e para qual [house|E] um [bastard|E] irá pertencer.\n\nAs Doutrinas de Gêneros são:\n$BULLET_WITH_TAB$Dominado por Homens\n$BULLET_WITH_TAB$Igual\n$BULLET_WITH_TAB$Dominado por Mulheres"
 game_concept_gender_law:0 "Lei de Gênero"
 game_concept_gender_law_desc:0 "Todo [ruler|E] tem uma Lei de Gênero principal que determina para quem seus [titles|E] irão em uma [succession|E]. Leis de Gênero também afetam quem pode comandar [armies|E] e a eligibilidade de ter múltiplos [spouses|E] ou [concubines|E].\n\nLeis de Gênero disponíveis dependem da [doctrine|E] de 'Visão sobre Gêneros' de sua [faith|E]."
 game_concept_gender_laws:0 "Leis de Gênero"
 game_concept_gift:0 "Presente"
 game_concept_gift_desc:0 "Enviar um presente para outro personagem irá aumentar a [opinion|E] deles sobre você em troca de [gold|E][gold_i].\n\nQuanto mais ganancioso for o destinatário, mais Ouro você terá que enviar, e mais Opinião receberá.\n\nQuanto mais alta for sua [diplomacy|E], mais Opinião você receberá."
 game_concept_gifts:0 "Presentes"
 game_concept_glory:0 "Glória"
 game_concept_glory_desc:0 "A Glória de uma [accolade|E] aumenta seu [accolade_rank|E].\n\nA Glória é adquirida pelo [acclaimed_knight|E] ao vencer [battles|E], derrotar guerreiros, competir em [contests|E] de [GetActivityType( 'activity_tournament' ).GetName] e participar de [activities|E].\n\nNo entanto, a Glória da Honraria é reduzida quando o Cavaleiro Aclamado se envolve em batalhas perdidas, na [accolade_succession|e] e quando a Honraria se torna uma [inactive_accolade|E]."
 game_concept_gold:0 "Ouro"
 game_concept_gold_desc:0 "'Ouro' realmente representa todos os ativos líquidos de um Personagem; sua riqueza. Ele pode ser gasto em muitas coisas, mais notavelmente na criação de [buildings|E], pagar por [regiments|E], e criando [titles|E]."
 game_concept_gold_i:0 "@gold_icon!"
 game_concept_goliardic_shenanigans:0 "Travessuras Goliardas"
 game_concept_goliardic_shenanigans_desc:0 "Um personagem na [GetActivityType('activity_adult_education').GetName] pode se envolver em todo tipo de travessuras ao abraçar a vida de estudante. As consequências de suas aventuras são imprevisíveis e incluem pontos de [skill|E], [traits|E] de estilo de vida e estresse, experiência de estilo de vida, doenças e ferimentos."
 game_concept_government:0 "Governo"
 game_concept_government_authority:0 "Autoridade Governamental"
 game_concept_government_authority_desc:0 "$game_concept_government_authority$ representa o poder geral que um [ruler|E] exerce sobre seus [vassals|E].\n\nDiferentes [governments|E] têm diferentes formas de $game_concept_government_authority$. Por exemplo, [feudal|E] [realms|E] usam [crown_authority|E], [clans|E] usam [tribal_authority|E] e [administrative|E] usam [imperial_bureaucracy|E]. Aumentar a $game_concept_government_authority$ custa uma quantidade de [prestige|E] dependendo do nível e da [learning_skill|E] do governante.\n\n#weak Os vassalos desaprovam níveis mais altos de $game_concept_government_authority$, e reduzi-la é o objetivo principal das [Concept( 'liberty_faction', 'Liberty Factions' )|E].#!\n\nNem todos os [governments|E] possuem $game_concept_government_authority$."
 game_concept_government_desc:0 "A $game_concept_government_form$ de um [ruler|E] determina que tipo de [laws|E] eles têm acesso, bem como as [obligations|E] que possuem para com seu [liege|E], caso não sejam [Concept('independent', 'Independentes')|E].\n\nAs formas de Governo são: [feudal|E], [tribal|E], [clan|E], [theocracy|E], [republic|E], [administrative|E], [GetGovernment( 'nomad_government' ).GetName] e [herder|E]."
 game_concept_government_form:0 "Forma de Governo"
 game_concept_government_forms:0 "Formas de Governo"
 game_concept_governments:0 "Governos"
 game_concept_grand_activities:0 "Grandes Atividades"
 game_concept_grand_activity:0 "Grande Atividade"
 game_concept_grand_activity_desc:0 "Exibições esplêndidas de riqueza e magnificência, as $game_concept_grand_activities$ são, por natureza, maiores e mais #EMP grandiosas#! do que as [activities|E] regulares. Elas podem ter várias [activity_phases|E] e oferecer mais oportunidades de personalização no planejamento.\n\nAs excursões proporcionam a oportunidade de visitar vários [vassals|E] em seu [realm|E], enquanto os Torneios oferecem uma variedade de [contests|E] para sediar."
 game_concept_grand_tour:0 "Tour Grande"
 game_concept_grand_tours:0 "Tours Grandes"
 game_concept_grand_wedding_promise:0 "Grande Promessa de Casamento"
 game_concept_grand_wedding_promise_desc:0 "Um [betrothal|E] com a promessa de que um [GetActivityType('activity_wedding').GetName] será celebrado para a união dos dois personagens envolvidos.\n\nA Grande Promessa de Casamento expirará após 3 anos. Não organizar um [GetActivityType('activity_wedding').GetName] a tempo ou romper o Betrothal acarretará em consequências severas."
 game_concept_grand_wedding_promised:0 "Prometido"
 game_concept_grand_wedding_promises:0 "Grandes Promessas de Casamento"
 game_concept_great_building:0 "Grande Edificação"
 game_concept_great_building_desc:0 "As $game_concept_great_buildings$ são [buildings|E] únicas, construídas como resultado de [great_projects|E]. Um exemplo famoso são as Grandes Muralhas da China.\n\nAs $game_concept_great_buildings$ geralmente são muito poderosas, mas sua utilidade está ligada a condições específicas."
 game_concept_great_buildings:0 "Grandes Edificações"
 game_concept_great_holy_war:0 "Grande Guerra Sagrada"
 game_concept_great_holy_war_desc:0 "Uma $game_concept_great_holy_war$ é um tipo especial de [war|E] que somente o [head_of_faith|E] de algumas [faiths|E] podem declarar, cujo alvo é trazer um [kingdom|E] para o controle de sua Fé.\n\n$game_concept_great_holy_wars$ têm como alvo todos os [rulers|E] de outra [religion|E] dentro de um [kingdom|E], forçando-os a se defenderem juntos. Se vitoriosos, todos os [titles|E] dentro do Reino alvo irão ser confiscados e divididos entre os atacantes.\n\nDependendo de suas [doctrines|E], uma Fé pode ter acesso as [directed_great_holy_wars|E], [undirected_great_holy_wars|E] ou não ter acesso às $game_concept_great_holy_wars$ :\n$EFFECT_LIST_BULLET$Os [core_tenets|E] de [GetFaithDoctrine('tenet_armed_pilgrimages').GetBaseName], [GetFaithDoctrine('tenet_struggle_submission').GetBaseName], ou [GetFaithDoctrine('tenet_warmonger').GetBaseName] são necessários para acessar Grandes Guerras Sagradas em geral\n$EFFECT_LIST_BULLET$Religiões com um Chefe da Fé [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] só têm acesso à Grandes Guerras Sagradas Direcionadas\n$EFFECT_LIST_BULLET$Religiões com um Chefe da Fé [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] só tem acesso à Grandes Guerras Sagradas Não Direcionadas\n$EFFECT_LIST_BULLET$Religiões sem um Chefe da Fé não podem declarar Grandes Guerras Sagras, mesmo que normalmente seriam elegíveis\nAlgumas Religiões têm nomes epesciais para suas Grandes Guerras Sagradas, como 'Crusada' ou 'Jihad'. Estas Grandes Guerras Sagradas só se diferem no nome, sua funcionalidade é igual à qualquer outra Grande Guerra Sagrada."
 game_concept_great_holy_war_directed:0 "Direcionada"
 game_concept_great_holy_war_undirected:0 "Não Direcionada"
 game_concept_great_holy_wars:0 "Grandes Guerras Sagradas"
 game_concept_grudge:0 "Rancor"
 game_concept_grudge_desc:0 "Um $game_concept_grudge$ é uma $game_concept_relation$ que indica ódio e ressentimento unilaterais. O alvo de um ressentimento não retribui os sentimentos e pode nem mesmo saber.\n\n#WEAK $game_concept_grudges$ são formados mais comumente quando um [character|E] faz algo horrível a outro sem nem perceber que eles existem — por exemplo, um rei deixando um camponês em sua [dungeon|E] por quarenta anos.#!"
 game_concept_grudge_possessive:0 "do Rancor"
 game_concept_grudges:0 "Rancores"
 game_concept_grudges_possessive:0 "dos Rancores"
 game_concept_guardian:0 "Guardião"
 game_concept_guardian_desc:0 "Um $game_concept_guardian$ é um [character|E] designado para [educate|E] uma [child|E] (chamada de seu [ward|E]).\n\n$game_concept_guardians$ tendem a transmitir seus [personality_traits|E] para seus $game_concept_wards$, bem como sua [culture|E] e/ou [faith|E], se especificado no $game_concept_education_focus$.\n\nO $game_concept_guardian$ pode residir em uma [court|E] diferente. Confiar a um [close_family_member|E] à misericórdia de outro [ruler|E] dessa maneira aumentará a [opinion|E] deles sobre você."
 game_concept_guardian_possessive:0 "Do Guardião"
 game_concept_guardians:0 "Guardiões"
 game_concept_guardians_possessive:0 "Dos Guardiões"
 game_concept_guardianship:0 "Tutela"
 game_concept_guest:0 "Visitante"
 game_concept_guests:0 "Visitantes"
 game_concept_gunpowder:0 "Atirador de Canhão de Mão"
 game_concept_gunpowder_desc:0 "Os Atiradores de Canhão de Mão são [men_at_arms|E] armados com potentes armas de pólvora.\n\nEmbora cada tipo de Atirador de Canhão de Mão seja único, eles geralmente [counters|E] [heavy_infantry|E], e por sua vez são contra-atacados por [heavy_cavalry|E] e [light_cavalry|E]."
 game_concept_gunpowders:0 "Atiradores de Canhão de Mão"
 game_concept_hajj:0 "Hajj"
 game_concept_hajj_desc:0 "Personagens da maioria das [faiths|E] islâmicas podem escolher realizar uma [activity|E] para fazer um $game_concept_hajj$ para Meca como parte de sua [doctrine|E] de $game_concept_pilgrimage$ uma vez por ano.\n\nEssa jornada pode estar repleta de oportunidades e perigos, mas ao chegar à cidade sagrada, os personagens ganharão [piety|E] e podem receber outras recompensas."
 game_concept_hajjes:0 "Hajjes"
 game_concept_harrying_pacification:0 "Pacificação"
 game_concept_harrying_pacification_desc:0 "A Pacificação acompanha a eficácia dos novos governantes normandos da Inglaterra em subduzir a ressentida população anglo-saxônica. Supondo que a Pacificação seja #BOL maior#! que [harrying_resistance|E], ela confere efeitos nos seguintes níveis:\n\n#S Pacificação acima de #V 5#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] anglo-saxônica/normanda: +[EmptyScope.ScriptValue('miniscule_cultural_acceptance_gain')|0V] por mês\n\n#S Pacificação acima de #V 8#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] anglo-saxônica/normanda: +[EmptyScope.ScriptValue('minor_cultural_acceptance_gain')|0V] por mês\n$EFFECT_LIST_BULLET$Adiciona [dread_i]#V 1#! [dread|E] ao governante da Inglaterra por mês\n\n#S Pacificação acima de #V 11#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] anglo-saxônica/normanda: +[EmptyScope.ScriptValue('medium_cultural_acceptance_gain')|0V] por mês\n$EFFECT_LIST_BULLET$Adiciona [dread_i]#V 2#! [dread|E] ao governante da Inglaterra por mês\n\n#S Pacificação acima de #V 14#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] anglo-saxônica/normanda: +[EmptyScope.ScriptValue('major_cultural_acceptance_gain')|0V] por mês\n$EFFECT_LIST_BULLET$Adiciona [dread_i]#V 3#! [dread|E] ao governante da Inglaterra por mês\n$EFFECT_LIST_BULLET$Habilita a [decision|E] #V $embrace_english_culture_decision$#!"
 game_concept_harrying_resistance:0 "Resistência"
 game_concept_harrying_resistance_desc:0 "A Resistência mede a oposição contínua ao domínio normando na Inglaterra pela população anglo-saxônica pré-existente. Supondo que a Resistência seja #BOL maior#! que [harrying_pacification|E], ela confere efeitos nos seguintes níveis:\n\n#S Resistência acima de #V 7#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] anglo-saxônica/normanda: [EmptyScope.ScriptValue('miniscule_cultural_acceptance_loss')|0V] por mês\n\n#S Resistência acima de #V 10#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] anglo-saxônica/normanda: [EmptyScope.ScriptValue('minor_cultural_acceptance_loss')|0V] por mês\n$EFFECT_LIST_BULLET$Levemente aumentado a chance de [claimant_factions|E] contra o governante da Inglaterra\n\n#S Resistência acima de #V 13#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] anglo-saxônica/normanda: [EmptyScope.ScriptValue('medium_cultural_acceptance_loss')|0V] por mês\n$EFFECT_LIST_BULLET$Alguma chance aumentada de [claimant_factions|E] contra o governante da Inglaterra\n$EFFECT_LIST_BULLET$[county_control|E] em todos os [counties|E] reduzido por [EmptyScope.ScriptValue('minor_discontent_loss')|0V] a cada #V 3#! meses para cada [vassal|E] da Inglaterra\n\n#S Resistência acima de #V 16#!#!\n$EFFECT_LIST_BULLET$[cultural_acceptance|E] anglo-saxônica/normanda: [EmptyScope.ScriptValue('major_cultural_acceptance_loss')|0V] por mês\n$EFFECT_LIST_BULLET$Grande aumento na chance de [claimant_factions|E] contra o governante da Inglaterra\n$EFFECT_LIST_BULLET$[county_control|E] em todos os [counties|E] reduzido por [EmptyScope.ScriptValue('medium_discontent_loss')|0V] a cada #V 3#! meses para cada [vassal|E] da Inglaterra"
 game_concept_harrying_widget:0 "@harrying_widget! Massacre do Norte"
 game_concept_harrying_widget_desc:0 "Os governantes normandos e os recentemente depostos nobres anglo-saxões estão presos em uma feroz batalha pelo controle da Inglaterra. Tal contestação não terminará até que um ou ambos os grupos tenham sido completamente removidos do poder.\n\nÀ medida que a situação avança, as ações que eles e outros personagens realizam governarão os níveis de [harrying_resistance|E] e [harrying_pacification|E] da região.\n\n#TS Maior #EMP Resistência#! levará a:#!\n$EFFECT_LIST_BULLET$Menor [cultural_acceptance|E]\n$EFFECT_LIST_BULLET$Menor [county_control|E]\n$EFFECT_LIST_BULLET$Uma maior chance de [claimant_factions|E] ou até mesmo uma [civil_war|E].\n\n#TS Maior #EMP Pacificação#! levará a:#!\n$EFFECT_LIST_BULLET$Maior [cultural_acceptance|E]\n$EFFECT_LIST_BULLET$Aumento do [dread|E] para o governante da Inglaterra\n$EFFECT_LIST_BULLET$Acesso à [decision|E] $embrace_english_culture_decision$."
 game_concept_harrying_widget_i:0 "@harrying_widget!"
 game_concept_head_of_faith:0 "Chefe da Fé"
 game_concept_head_of_faith_desc:0 "Um $game_concept_head_of_faith$ é um líder formal de uma [faith|E]. Os poderes e natureza deste $game_concept_head_of_faith$ são dependentes das [doctrines|E] desta Fé.\n\nAlgumas Religiões têm um [spiritual_head_of_faith|E] #weak (Por exemplo, o Papa)#!, algumas têm um [temporal_head_of_faith|E] #weak (Por exemplo, o Califa)#!, e algumas nem se quer têm um $game_concept_head_of_faith$."
 game_concept_head_of_faith_possessive:0 "Do Líder da Fé"
 game_concept_head_of_faith_spiritual:0 "Espiritual"
 game_concept_head_of_faith_temporal:0 "Temporal"
 game_concept_heads_of_faith:0 "Chefes da Fé"
 game_concept_health:0 "Saúde"
 game_concept_health_desc:0 "$game_concept_health$ mede a probabilidade de um Personagem morrer por [illnesses|E] e velhice.\n\nPersonagens idosos têm uma chance de perder saúde a cada ano, aumentando conforme ficam mais velhos."
 game_concept_health_trait:0 "Traço de saúde"
 game_concept_health_trait_desc:0 "Um $game_concept_health_trait$ é um [trait|E] que afeta diretamente a [health|E] física e mental de alguém, como [diseases|E]. Traits temporários que impactam as capacidades corporais, como gravidezes e ferimentos, também se enquadram nesta categoria.\n\n[characters|E] idosos podem ganhar [Concept( 'elder_traits', 'Traços de Idoso' )|E]."
 game_concept_healthy:0 "Saudável"
 game_concept_heavy_cavalry:0 "Cavalaria Pesada"
 game_concept_heavy_cavalry_desc:0 "Cavalaria Pesada é constituída de [men_at_arms|E] montados fortemente blindados\n\nEnquanto cada tipo de Cavalaria Pesada é único, eles costumam [counters|E] [archers|E], e sofrem Contra-Ataques de [spearmen|E].\n\nHCavalaria Pesada também costuma ser forte quando em [terrain|E] plano.\n\nEm comparação com a [light_cavalry|E], eles costumam ser mais fortes em [damage|E] bruto e [toughness|E]."
 game_concept_heavy_infantry:0 "Infantaria Pesada"
 game_concept_heavy_infantry_desc:0 "Infantarias Pesadas são [men_at_arms|E] que lutam a pé, com armaduras e armas mais pesadas.\n\nEnquanto cada tipo de Infantaria Pesada é único, eles costumam [counters|E] [spearmen|E], e sofrem Contra-Ataques de [skirmishers|E]."
 game_concept_hegemon:0 "Hegemom"
 game_concept_hegemon_desc:0 "Um $game_concept_hegemon$ é um [ruler|E] cujo [primary_title|E] é uma [hegemony|E].\n\nSeu [rank|E] é o mais alto possível, diretamente acima dos [emperors|E]. Assim, eles podem ter qualquer não-$game_concept_hegemons$ como seus [vassals|E], e nunca podem ter um [liege|E]."
 game_concept_hegemonies:0 "Hegemonias"
 game_concept_hegemons:0 "Hegemons"
 game_concept_hegemony:0 "Hegemonia"
 game_concept_hegemony_desc:0 "Uma $game_concept_hegemony$ é um [title|E] do mais alto [title_tier|E].\n\nO [holder|E] de uma $game_concept_hegemony$ possui direitos [de_jure|E] sobre seus territórios constituintes e pode ter [emperors|E] como [vassals|E]."
 game_concept_heir:0 "Herdeiro"
 game_concept_heir_desc:0 "Um Herdeiro é um Personagem que pode herdar um ou mais [titles|E].\n\nCada [title|E] tem um $game_concept_heir$, determinado pelas [succession_laws|E] do atual [holder|E]. Quando o atual Proprietário morrer, ou ativar uma [succession|E], o $game_concept_heir$ do Título irá herdá-lo.\n\nLembre-se que títulos carregados pelo mesmo [ruler|E] podem ter diferentes $game_concept_heirs$. O [primary_title|E] é dado ao [primary_heir|E] e jogadores irão continuar a jogar com o [player_heir|E]."
 game_concept_heir_possessive:0 "do Herdeiro"
 game_concept_heirs:0 "Herdeiros"
 game_concept_held:0 "Possuído"
 game_concept_heresies:0 "Heresias"
 game_concept_heresy:0 "Heresia"
 game_concept_heresy_desc:0 "Quando o [fervor|E] de uma [faith|E] está baixo, um surto de Heresia pode ocorrer. Quando isso acontece, um [ruler|E] desta fé com baixo fervor irá converter para outra Fé, se tornando um [GetTrait('heresiarch').GetName( GetNullCharacter )]. Eles irão espalhar sua nova Fé para seus [counties|E] e [vassals|E].\n\nSe um surto for pequeno, ele irá parar por ali. Se for um grande surto, mais governantes na área irão converter. Se você estiver nesta área, você também poderá optar por se converter, se você quiser."
 game_concept_heretical:0 "Herético"
 game_concept_heritage:0 "Herança"
 game_concept_heritage_desc:0 "A \"Herança\" é um [culture_pillar|E] que representa a ancestralidade compartilhada entre diferentes [cultures|E].\n\nCulturas que compartilham a mesma herança geralmente têm alta [Concept( 'cultural_acceptance','aceitação cultural')|E] uma pela outra."
 game_concept_heterosexual:0 "Heterossexual"
 game_concept_heterosexual_desc:0 "Em #EMP Crusader Kings III#!, este personagem é atraído por personagens do gênero oposto."
 game_concept_high:0 "Alta"
 game_concept_high_crown_authority:0 "Autoridade da Coroa Alta"
 game_concept_high_crown_authority_desc:0 "$game_concept_high_crown_authority$ é o segundo maior nível. [vassals|E] têm uma penalidade de #N -20#! de [opinion|E] contra seu [liege|E].\n\nNeste nível — Além dos poderes que o senhor feudal adquire na [limited_crown_authority|E] — vassalos sob o mesmo senhor feudal não podem mais travar guerras uns contra os outros, o governante pode alterar entre todas as [succession_laws|E] disponíveis, e [titles|E] de vassalos não podem ser herdados por governantes fora do [realm|E] do senhor feudal.\n\nPor último, recusar a [revocation|E] de um título ou o [retraction|E] de um vassalo é considerado um [crime|E] mesmo se o senhor feudal não tiver justificativas o suficiente."
 game_concept_high_tribal:0 "Alta"
 game_concept_high_tribal_authority:0 "Autoridade Tribal Alta"
 game_concept_high_tribal_authority_desc:0 "$game_concept_high_tribal_authority$ é o segundo maior nível da [tribal_authority|E]. [vassals|E] têm uma penalidade de #N -20#! de [opinion|E] contra seu [liege|E].\n\nNeste nível, além da habilidade de [imprison|E] [characters|E], o senhor feudal pode [revoke|E] [titles|E] e [retract|E] vassalos de vassalos."
 game_concept_highlighted_text:0 "Texto em Destaque"
 game_concept_highlighted_text_desc:0 "Essa informação está aqui para você sempre que tiver dúvidas sobre um conceito do jogo.\n\n#TUT Você pode até mesmo mover seu cursor para dentro #EMP desta#! tooltip para obter ainda mais informações! [highlighted_text_example|E]#!"
 game_concept_highlighted_text_example:0 "Legal!"
 game_concept_highlighted_text_example_desc:0 "Bom trabalho!"
 game_concept_hike:0 "Caminhada"
 game_concept_hike_desc:0 "Parta em uma expedição solitária para se afastar das pressões da vida na corte.\n\nRecompensas esperadas:\n$activity_roaming_host_desc$"
 game_concept_hike_i:0 "@activity_hike!"
 game_concept_hired_troops:0 "Soldados Contratados"
 game_concept_hired_troops_desc:0 "Soldados Contratados são [mercenaries|E] ou [holy_orders|E]."
 game_concept_hold:0 "Posse"
 game_concept_holder:0 "Proprietário"
 game_concept_holder_desc:0 "Um $game_concept_holder$ de um [title|E] é o personagem dono do título. Títulos de [barony|E] e [county|E] sempre terão um $game_concept_holder$ quando estabelecidos, no entanto títulos de [duchy|E], [kingdom|E] e [empire|E] talvez não tenham sido criados ainda. Outra ressalva, o $game_concept_holder$ de um título de alto nível talvez nem esteja no controle de nenhum território correspondente à area de um título [de_jure|E].\n\nTer títulos de maior nível permite que você tenha [vassals|E] de maior nível. Por exemplo, Duques podem ter Condes como Vassalos, e Reis podem ter Duques."
 game_concept_holder_possessive:0 "do Proprietário"
 game_concept_holders:0 "Proprietários"
 game_concept_holders_possessive:0 "dos Proprietários"
 game_concept_holding:0 "Propriedade"
 game_concept_holding_desc:0 "Uma $game_concept_holding$ é a instalação principal de um [barony|E] ou da [county_capital|E].\n\nFornece [taxes|E] e [levies|E] para o seu [holder|E], dependendo do seu [holding_type|E]. A coleção de Posses pessoalmente possuídas por um [ruler|E] é chamada de [domain|E]."
 game_concept_holding_type:0 "Tipo da Propriedade"
 game_concept_holding_type_desc:0 "Existem quatro tipos de [holdings|E]: [castles|E], [cities|E], [tribes|E] e [temples|E]. Cada tipo permite diferentes tipos de [buildings|E]. A [government_form|E] de um [ruler|E] determina quais tipos de Posses o Governante pode possuir pessoalmente sem penalidades. No caso dos Templos, as [doctrines|E] da sua [faith|E] também podem desempenhar um papel."
 game_concept_holding_types:0 "Tipos da Propriedade"
 game_concept_holdings:0 "Propriedades"
 game_concept_holy_order:0 "Ordem Sagrada"
 game_concept_holy_order_desc:0 "$game_concept_holy_orders$ são organizações militares independentes que trabalham em defender e expandir a influência de sua [faith|E].\n\nGovernantes de sua Fé podem contrata-los se eles estiverem em [war|E] contra uma [faith|E] [faith_hostile|L] ou [faith_evil|L], por um custo de [piety|E]. Quando esta Guerra for finalizada, eles não irão mais lutar por este Governante.\n\nUma $game_concept_holy_order$ pode ter um [holy_order_patron|E], que não precisa pagar por seus serviços."
 game_concept_holy_order_i:0 "@government_type_holy_order!"
 game_concept_holy_order_patron:0 "Patrono da Ordem Sagrada"
 game_concept_holy_order_patron_desc:0 "O $game_concept_holy_order_patron$ de uma [holy_order|E] é como um Rei ou Imperador que compartilha sua [faith|E] e cujo [realm|E] contém sua Capital.\n\nO $game_concept_holy_order_patron$ pode pode pedir o apoio de uma $game_concept_holy_order$ contra inimigos religiosos de graça, sem precisar pagar com [piety|E].\n\nNem todas as $game_concept_holy_orders$ têm um $game_concept_holy_order_patron$."
 game_concept_holy_order_patronage:0 "Patrocínio de Ordem Sagrada"
 game_concept_holy_order_patronize:0 "Patrocinar"
 game_concept_holy_order_possessive:0 "Da Ordem Sagrada"
 game_concept_holy_order_vicinity:0 "Proximidade da Ordem"
 game_concept_holy_order_vicinity_desc:0 "O alcance mínimo no qual uma [monastic_holy_order|E] ou [military_holy_order|E] é acessível a um [ruler|E].\n\nPara satisfazer a Proximidade da Ordem Sagrada, a Ordem deve possuir um [leased|E] [holding|E] que esteja dentro do seu sub-[realm|E] ou de um [county|E] vizinho.\n\nOrdens Militares devem estar dentro da Proximidade da Ordem Sagrada para serem contratadas para [wars|E]. Da mesma forma, a maioria das [interactions|E] de Ordens Monásticas não está disponível enquanto a [monastic_holy_order|E] estiver muito distante."
 game_concept_holy_orders:0 "Ordens Sagradas"
 game_concept_holy_orders_possessive:0 "Das Ordens Sagradas"
 game_concept_holy_site:0 "Local Sagrado"
 game_concept_holy_site_desc:0 "Um $game_concept_holy_site$ é um [county|E] que tem um significado religioso para uma [faith|E]. $game_concept_holy_sites$ mantidos por um Personagem da Fé Correta irá fornecer um efeito para todos desta Fé, e também podem permitir a criação de [special_buildings|E] ou [holy_orders|E]. Cada Fé tem diferentes $game_concept_holy_sites$."
 game_concept_holy_sites:0 "Locais Sagrados"
 game_concept_holy_war:0 "Guerra Sagrada"
 game_concept_holy_war_desc:0 "Uma $game_concept_holy_war$ é um tipo especial de [war|E] travada por um [ruler|E] de uma [faith|E] contra um Governante de uma fé diferente.\n\nAs $game_concept_holy_wars$ são geralmente bastante destrutivas, com o vencedor de uma Guerra Santa normalmente assumindo todos os [counties|E] da área alvo para si mesmo. No entanto, se a fé do atacante for [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName] ou se o defensor tiver [vassals|E] da própria fé do atacante na área alvo, alguns ou todos os Governantes Vassalos na área alvo podem ser simplesmente transferidos para o atacante.\n\nAo contrário de outras guerras, Governantes da mesma fé do alvo podem escolher se unir em sua defesa sem a necessidade de uma [alliance|E].\n\nAs Guerras Santas podem ser permitidas ou restritas dependendo das diferentes [religious_families|E]."
 game_concept_holy_war_holy:0 "Sagrada"
 game_concept_holy_wars:0 "Guerras Sagradas"
 game_concept_home_court:0 "Corte Local"
 game_concept_home_court_desc:0 "Um [ruler|E] que é um [close_family_member|E] de um [hostage|E] e os enviou para um [warden|E] como garantia de paz ou submissão."
 game_concept_home_courts:0 "Cortes Locais"
 game_concept_home_courts_possessive:0 "Da Corte Local"
 game_concept_homosexual:0 "Homossexual"
 game_concept_homosexual_desc:0 "Em #EMP Crusader Kings III#!, este personagem é atraído por personagens do mesmo gênero."
 game_concept_honorary_guest:0 "Convidado Honorário"
 game_concept_honorary_guest_desc:0 "$honorary_guest_desc$"
 game_concept_hook:0 "Gancho"
 game_concept_hook_desc:0 "Um $game_concept_hook$ é um termo geral para um relacionamento entre personagens, onde um pode fazer com que o outro faça sua vontade.\n\nExistem dois tipos, [weak_hooks|E] e [strong_hooks|E], que são adquiridos de diferentes maneiras.\n\n$game_concept_hooks$ podem ser usados para forçar diversas interações, como propostas de [marriage|E] e mudanças de [vassal_contract|E]."
 game_concept_hook_i:0 "@cs_weak_hook_icon!"
 game_concept_hooked:0 "Comprometido"
 game_concept_hooks:0 "Ganchos"
 game_concept_host:0 "Anfitrião"
 game_concept_host_a_dinner:0 "Hospedar um Jantar"
 game_concept_hostage:0 "Refém"
 game_concept_hostage_desc:0 "Um [close_family_member|E] de um [ruler|E], enviado para longe de sua [home_court|E] como garantia de paz ou submissão.\n\nA reputação dos $game_concept_rulers$ que declararem [war|E] apesar de enviar ou receber um $game_concept_hostage$ será drasticamente prejudicada, e os $game_concept_wardens$ podem executar livremente os $game_concept_hostages$ de seus inimigos.\n\nOs $game_concept_hostages$ tratados com respeito provavelmente se tornarão leais ao seu $game_concept_warden$, que pode obter um [hook|E], ou até mesmo se tornar [friend|E] deles.\n\nOs $game_concept_hostages$ devem ser crianças sem terras, irmãos, sobrinhos, netos ou bisnetos do $game_concept_ruler$ da $game_concept_home_court$.\n\nOs $game_concept_wardens$ têm a chance de obter um [perpetual_hook|E] em um $game_concept_hostage$ quando este atingir a maioridade, com base na personalidade, opinião e anos passados na corte dos $game_concept_wardens$."
 game_concept_hostages:0 "Reféns"
 game_concept_hostages_possessive:0 "Do Refém"
 game_concept_hosted_dinner:0 "Jantar Hospedado"
 game_concept_hosted_dinner_desc:0 "Uma [activity_phase|E] durante uma [royal_tour|E] na qual um [vassal|E] é esperado para entreter seu [liege|E], o que muitas vezes resulta no aumento de [hooks|E] e [relations|E] mutuamente formadas."
 game_concept_hosted_dinners:0 "Jantares Hospedados"
 game_concept_hostile_army:0 "Inimigo"
 game_concept_hostile_army_desc:0 "Um exército $game_concept_hostile_army$ pode ser combatido como se você estivesse em [war|E] com o proprietário, embora nenhum [war_score|E] seja dada.\n\nA hostilidade é causada por você ter interesses conflitantes, incluindo:\n$BULLET_WITH_TAB$Inimigos do seu [liege|E]\n$BULLET_WITH_TAB$[vassals|E] de seus inimigos\n$BULLET_WITH_TAB$Governantes #emphasis atacando# o mesmo inimigo"
 game_concept_hostile_scheme:0 "Esquema Hostil"
 game_concept_hostile_scheme_desc:0 "$game_concept_hostile_schemes$ são [schemes|E] que têm como objetivo causar dano a um [character|E]. A maioria dos $game_concept_hostile_schemes$ faz uso de [secrecy|E].\n\nExemplos de $game_concept_hostile_schemes$ são:\n$BULLET_WITH_TAB$[GetScheme('murder').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('abduct').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('claim_throne').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('fabricate_hook').GetTypeName]"
 game_concept_hostile_scheme_resistance:0 "Resistência à Esquemas Hostis"
 game_concept_hostile_schemes:0 "Esquemas Hostis"
 game_concept_hosting:0 "Hospedagem"
 game_concept_house:0 "Casa"
 game_concept_house_arrest:0 "Prisão Domiciliar"
 game_concept_house_arrest_desc:0 "$game_concept_house_arrest$ é uma forma mais branda da [prison|E] onde Personagens não sofrem por efeitos de doenças, exceto o tédio. Porém, [rulers|E] podem jogá-los na [dungeon|E], embora isto abaixe as [opinions|E] da [close_family|E] do Prisioneiro.\n\n[nobles|E] capturados são automaticamente colocados em uma [house_arrest|E]."
 game_concept_house_desc:0 "A $game_concept_house$ é um ramo de membros na àrvore maior de uma [dynasty|E]. Casas são criadas por [rulers|E] que não desejam mais responder ao seu [house_head|E] atual e desejam mais ser o Chefe de uma nova Casa.\n\nEmbora Casas tenham seus próprios nomes e Brasões, eles ainda compartilham [dynasty_prestige|E], e outros membros da Dinastia ainda podem ser um [player_heir|E] válido."
 game_concept_house_head:0 "Chefe da Casa"
 game_concept_house_head_desc:0 "Cada [house|E] dentro de uma [dynasty|E] possui um $game_concept_house_head$, que exerce certos poderes únicos sobre os membros da Casa.\n\nNotavelmente, o $game_concept_house_head$ pode legitimar [bastards|E], convocar os membros da Casa para a [war|E] e exigir a conversão de membros [landed|E]. O $game_concept_house_head$ também obtém um [weak_hook|E] sobre todos os membros de sua Casa que nascerem enquanto ele estiver no poder.\n\nQuando ele morre, seu [primary_heir|E] se torna o novo $game_concept_house_head$.\n\n[clan_house_heads|E] possuem regras e privilégios especiais."
 game_concept_house_head_head:0 "Chefe"
 game_concept_house_head_heads:0 "Líderes"
 game_concept_house_head_interaction:0 "Interação de Chefe da Casa"
 game_concept_house_head_interaction_desc:0 "[interactions|E] especiais que só podem ser feitas pelo [house_head|E] contra membros de sua [house|E]."
 game_concept_house_heads:0 "Chefes da Casa"
 game_concept_house_heads_possessive:0 "do Chefe da Casa"
 game_concept_house_possessive:0 "da Casa"
 game_concept_house_succession_law:0 "Lei de Sucessão da Casa"
 game_concept_house_succession_law_desc:0 "Em [realms|E] do [GetGovernment('clan_government').GetName], o atual [house_unity_level|E] dita qual [succession_law|E] é usada.\n\nOs clãs podem mudar para uma Lei de Sucessão de $SUCCESSION_LAW_CHANGE_WINDOW_SINGLE_HEIR_LAWS$, o que impedirá a [house_unity|E] de mudá-la, mas fazer isso é muito mais difícil do que o normal."
 game_concept_house_unity:0 "Unidade da Casa"
 game_concept_house_unity_desc:0 "$game_concept_house_unity$ representa o estado das relações internas dentro de um [clan|E] ou [house|E], e a atitude dos membros uns em relação aos outros.\n\nExistem vários [house_unity_levels|E], que oferecem aos membros da Casa vários benefícios e penalidades.\n\nA $game_concept_house_unity$ muda dependendo das ações que os membros da Casa tomam uns em relação aos outros. [house_unity_unifying_actions|E] geralmente aumentam a $game_concept_house_unity$, enquanto [house_unity_devisive_actions|E] a diminuem. O [house_head|E] geralmente têm um grau maior de influência sobre a $game_concept_unity$ da sua casa."
 game_concept_house_unity_devisive_actions:0 "Ações Divisivas"
 game_concept_house_unity_devisive_actions_desc:0 "Ações divisivas em relação aos membros da sua [house|E] diminuirão a [house_unity|E].\n\n[house_heads|E] podem usar a [decision|E] #V $unity_steer_house_direction_decision$#! e a [interaction|E] #V $accuse_of_decandence_interaction$#! para diminuir significativamente a Unidade.\n\n#weak Alguns exemplos de ações divisivas são:$house_unity_decrease_examples$#!"
 game_concept_house_unity_i:0 "@dynasty_house_unity!"
 game_concept_house_unity_level:0 "Nível de Unidade da Casa"
 game_concept_house_unity_level_desc:0 "$game_concept_house_unity_level$ é o estado atual da [house_unity|E]. A mudança de nível ocorre à medida que a Unidade aumenta por meio de [house_unity_unifying_actions|E] ou diminui por meio de [house_unity_devisive_actions|E], e cada nível oferece aos membros de uma [house|E] vários benefícios e penalidades.\n\nExistem cinco níveis diferentes:\n[GetCurrentHouseUnityStagesDescForLocalPlayer]\n\nCada nível tem sua própria [succession_law|E] da [house|E]."
 game_concept_house_unity_levels:0 "Níveis de Unidade da Casa"
 game_concept_house_unity_unifying_actions:0 "Ações de Unificação"
 game_concept_house_unity_unifying_actions_desc:0 "Ações de unificação em relação aos membros da sua [house|E] aumentarão a [house_unity|E].\n\n[house_heads|E] podem usar a [decision|E] #V $unity_steer_house_direction_decision$#! e a [interaction|E] #V $extoll_virtuousness_interaction$#! para aumentar significativamente a Unidade.\n\n#weak Alguns exemplos de ações de unificação são:$house_unity_increase_examples$#!"
 game_concept_houses:0 "Casas"
 game_concept_hungarian_invasion:0 "$HUNGARIAN_INVASION_CB_NAME$"
 game_concept_hungarian_invasion_casus_belli:0 "Casus Belli de $HUNGARIAN_INVASION_CB_NAME$"
 game_concept_hungarian_invasion_casus_belli_desc:0 "Um [casus_belli|E] poderoso que só pode ser usado uma vez, para conquistar todos os territórios sob controle do alvo dentro da Panônia.\n\nNa vitória, todos os $mogyer_collective_noun$ no [realm|E] do atacante irão se mover para Panônia, [counties|E] #EMP e#! [vassals|E], deslocando $game_concept_counties$ de $avar$. Outros vassalos fora da Panônia serão abandonados, enquanto $game_concept_counties$ formalmente ocupados ou sob controle de $mogyer_collective_noun$ são deixados para pequenos senhores da guerra e tribos estepes rivais."
 game_concept_hunt_danger:0 "Perigo na Caçada"
 game_concept_hunt_danger_desc:0 "A imprevisibilidade até mesmo das feras selvagens mais gentis, combinada com a frenesi da perseguição, desfez muitos guerreiros poderosos.\n\nAnimais mais $game_concept_hunt_dangerous$ concederão maior [prestige_i|E][prestige|E] ao caçador.\n\nA distância da civilização e a abundância de oportunidades também não devem ser ignoradas ao escolher os convidados..."
 game_concept_hunt_danger_no_prefix:0 "Perigo"
 game_concept_hunt_dangerous:0 "Perigoso"
 game_concept_hunt_sighting:0 "Avistamento de Caça"
 game_concept_hunt_sighting_desc:0 "Um $game_concept_hunt_sighting$ é um relatório de animais prestigiosos específicos avistados em um [county|E], que podem ser perseguidos em uma [GetActivityType('activity_hunt').GetName] realizada lá.\n\nO [GetCourtPositionType('master_of_hunt_court_position').GetName()] procurará por $game_concept_hunt_sightings_no_prefix$."
 game_concept_hunt_sighting_no_prefix:0 "Avistamento"
 game_concept_hunt_sightings:0 "Avistamentos de Caça"
 game_concept_hunt_sightings_no_prefix:0 "Avistamentos"
 game_concept_hunt_success_chance:0 "Chance de Sucesso na Caçada"
 game_concept_hunt_success_chance_desc:0 "Ao sair em uma [GetActivityType('activity_hunt').GetName], não há garantia de que você irá encurralar sua presa. Os principais fatores são:\n$BULLET_WITH_TAB$[GetTrait('lifestyle_hunter').GetName( GetNullCharacter )] [trait_level_track_xp|E]\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_hunt_court_position').GetName()] [aptitude|E]\n$BULLET_WITH_TAB$[buildings|E], [terrain|E] e [development|E]\n$BULLET_WITH_TAB$Avistamentos de animais\n\nA $game_concept_hunt_success_chance$ nunca pode ser maior que #V 80#!.\n\n#weak Caçadas bem-sucedidas terminam com o abate da presa, onde artefatos de troféu podem ser obtidos e grande [prestige_i|E][prestige|E] é conferido ao caçador.#!"
 game_concept_hunt_success_chance_no_prefix:0 "Chance de Sucesso"
 game_concept_hybrid_culture:0 "Cultura Híbrida"
 game_concept_hybrid_culture_desc:0 "[SelectLocalization( HasDlcFeature( 'hybridize_culture' ), 'game_concept_hybrid_culture_desc_DLC', 'game_concept_hybrid_culture_desc_NO_DLC' )]"
 game_concept_hybrid_culture_desc_DLC:0 "Uma $game_concept_hybrid_culture$ é uma [culture|E] criada por um [ruler|E] como a combinação de duas culturas existentes.\n\nA $game_concept_hybrid_culture$ é uma mistura das [traditions|E], [culture_pillars|E] e estéticas das duas culturas originais.\n\nSomente culturas da [heritage|E] diferentes podem formar um híbrido, e o custo de [prestige|E] para fazê-lo é baseado em sua [cultural_acceptance|E] mútua.\n\nQuanto maior a Aceitação Cultural, mais [counties|E] serão convertidos quando um híbrido for formado. Os soberanos de uma cultura híbrida [promote_culture|E] muito mais rápido nos condados de suas culturas parentais por #V [EmptyScope.ScriptValue('culture_hybrid_cooldown')|0]#! anos após a formação.\n\nNovas culturas também podem surgir como [divergent_culture|E]."
 game_concept_hybrid_culture_desc_NO_DLC:0 "Uma $game_concept_hybrid_culture$ é uma [culture|E] formada pela combinação de duas outras culturas.\n\nNovas culturas também podem surgir como [divergent_culture|E]."
 game_concept_hybrid_cultures:0 "Culturas Híbridas"
 game_concept_hybridize:0 "Hibridar"
 game_concept_hybridized:0 "Hibridado"
 game_concept_hybridizes:0 "Hibrida"
 game_concept_hybridizing:0 "Hibridando"
 game_concept_ill:0 "Doente"
 game_concept_illness:0 "Doença"
 game_concept_illness_desc:0 "Doenças são [traits|E] negativos que irão reduzir a quantidade de [health|E] de um Personagem. A duração e letalidade de Traços de Doença podem variar muito."
 game_concept_illnesses:0 "Doenças"
 game_concept_illustrious:0 "$artifacts_rarity_illustrious$"
 game_concept_impatient_rushing_all_schemes_decision:0 "Decisão de $impatient_rushing_all_schemes_decision$"
 game_concept_impatient_rushing_all_schemes_decision_desc:0 "Uma [decision|E] que permite acelerar seus [schemes|E]. Concede [scheme_opportunity_opportunities|E] em troca de [stress|E]."
 game_concept_imperial_expedition_cb:0 "Expedição Imperial"
 game_concept_imperial_expedition_cb_desc:0 "Um [casus_belli|E] extremamente poderoso utilizável por [co_emperors|E] em $game_concept_duumvirates$.\n\nUma $game_concept_imperial_expedition_cb$ pode ser lançada contra qualquer [realm|E] que faça fronteira com o [empire|E] ou que possua terras que [de_jure|E] pertencem ao imperador sênior.\n\nPode (e geralmente irá) visar #BER todos#! os [duchies|E] que, de fato, fazem fronteira com o $game_concept_empire$ $game_concept_de_jure$ ou que pertencem a ele.\n\nAlém disso, cada [governor|E] que faça fronteira com o defensor será chamado à força para [war|E] como um [ally|E]. $game_concept_governors$ remotos com [province_administrations|E] militares podem optar por se juntar ao conflito.\n\nSe a $game_concept_war$ for vencida, o $game_concept_co_emperor$ deve decidir entre:\n$EFFECT_LIST_BULLET$Entregar as terras conquistadas ao seu imperador sênior por [influence|E] e [opinion|E]\n$EFFECT_LIST_BULLET$Manter os territórios para si (custando $game_concept_opinion$)\n$EFFECT_LIST_BULLET$Entregar a maior parte delas, enquanto mantém o melhor [duchy|E] (reduzindo levemente [influence|E] e [opinion|E])\n$EFFECT_LIST_BULLET$Nomear $game_concept_governors$ interinos locais que estarão endividados com eles\n\n#WEAK Todas as recompensas escalam para a terra conquistada: uma grande conquista ganha #EMP significativamente#! mais $game_concept_influence$ do que uma pequena guerra de fronteira.#!"
 game_concept_imperial_expedition_cb_expedition:0 "Expedição"
 game_concept_implicit_claim:0 "Reivindicação Implícita"
 game_concept_implicit_claim_desc:0 "[claims|E] $game_concept_implicit_claims$ são dadas as [eligible_children|E] sob todos os [titles|E] pertencentes aos seus pais. Se um dos pais perde um [title|E], a $game_concept_implicit_claim$ de tal título será removida dos filhos também."
 game_concept_implicit_claim_i:0 "@implicit_claim!"
 game_concept_implicit_claims:0 "Reivindicações Implícitas"
 game_concept_imprison:0 "Aprisionar"
 game_concept_imprisoned:0 "Aprisionado"
 game_concept_imprisoning:0 "Aprisionando"
 game_concept_imprisonment:0 "Aprisionamento"
 game_concept_imprisonment_reason:0 "Motivo de Prisão"
 game_concept_imprisonment_reason_desc:0 "Um $game_concept_imprisonment_reason$ dá a um [liege|E] a oportunidade de prender livremente um súdito. Eles são mais frequentemente obtidos pelo súdito sendo um [criminal|E]."
 game_concept_imprisonment_reasons:0 "Motivos de Prisão"
 game_concept_imprisons:0 "Aprisiona"
 game_concept_inbred:0 "Consanguíneo"
 game_concept_inbreeding:0 "Cosanguinidade"
 game_concept_inbreeding_desc:0 "As [children|E] de dois [characters|E] intimamente relacionados correm o risco de nascer com um defeito [congenital|E], sendo o mais grave o [trait|E] [GetTrait('inbred').GetName( GetNullCharacter )].\n\nIsso é raro na primeira geração, mas o $game_concept_inbreeding$ sucessivo aumenta o risco.\n\nGerações de $game_concept_inbreeding$ podem, no entanto, resultar também no $game_concept_trait$ [GetTrait('pure_blooded').GetName( GetNullCharacter )], que (se ambos os pais o possuírem) torna a prole imune a defeitos de nascimento, pois todos os defeitos foram eliminados da linhagem por meio de [bred|E]."
 game_concept_incest:0 "Incesto"
 game_concept_incest_desc:0 "Incesto refere-se a atividade sexual entre parentes próximos.\nQuais relações são incestuosas são determinadas pela [doctrine|E] $doctrine_consanguinity_name$ do personagem em sua [faith|E]."
 game_concept_incestuous:0 "Incestuoso"
 game_concept_income:0 "Lucro"
 game_concept_income_desc:0 "Existem muitas fontes de [gold|E], mas as duas mais importantes são [taxation|E] de suas próprias [holdings|E] e as de seus [vassals|E]."
 game_concept_increase_control:0 "$task_increase_control$"
 game_concept_increase_control_desc:0 "$game_concept_increase_control$ é uma [councillor_task|E] realizada pelo [marshal|E].\n\nSeu objetivo é aumentar o [control|E] e remover a [county_corruption|E] ao longo do tempo em um determinado [county|E]."
 game_concept_independence_faction:0 "Facção da Independência"
 game_concept_independence_faction_desc:0 "A $game_concept_independence_faction$ busca independência para todos os seus membros. Se bem-sucedida, eles se tornarão [Concept('independent', 'Independentes')|E] de seu [liege|E]."
 game_concept_independence_factions:0 "Facções da Independência"
 game_concept_independent:0 "Independente"
 game_concept_independent_ruler:0 "Governante Independente"
 game_concept_independent_ruler_desc:0 "[rulers|E] $game_concept_independent$s não têm um [liege|E] e portanto, aproveitam de uma maior liberdade de ação (Por exemplo, em declarar [wars|E]).\n\nPorém, diferente de [vassals|E] eles podem sofrer ataques diretos por [rulers|E] estrangeiros."
 game_concept_independent_rulers:0 "Governantes Independentes"
 game_concept_indirect_schemes:0 "Esquemas Indiretos"
 game_concept_influence_ward_personality:0 "Influenciar a Personalidade do Pupilo"
 game_concept_influence_ward_personality_desc:0 "Uma [interaction|E] onde é possível tentar influenciar um [ward|E] a adotar um [personality_trait|E] semelhante ao seu."
 game_concept_initial_legitimacy:0 "Legitimidade Inicial"
 game_concept_initial_legitimacy_desc:0 "A $game_concept_legitimacy$ que um [character|E] possui ao se tornar um detentor de terra.\n\nÉ calculada com base no [dynasty_prestige_level|E], relação com seu predecessor, [court_grandeur|E], gênero, [bastardy|E], anos como um [ruler|E], a [legitimacy|E] do [dynasty_perk|E], [diplomacy|E], [virtues|E], [sins|E] e outros [traits|E] especiais, como [GetTrait('sayyid').GetName( GetNullCharacter )], [GetTrait('diplomat').GetName( GetNullCharacter )] e [GetTrait('just').GetName( GetNullCharacter )].\n\n[heirs|E] herdarão [GetDefine( 'NCharacter', 'LEGITIMACY_INHERITED' )|V%^] da $game_concept_legitimacy$ do governante anterior se estiverem herdando um [title|E] de [title_tier|E] superior."
 game_concept_innovation:0 "Inovação"
 game_concept_innovation_desc:0 "Inovações são tecnologias e outros avanços que beneficiam todos os personagens de uma [culture|E]. Inovações são agrupadas em [eras|E] onde podem ser descobertas.\n\nAtravés do contato com Culturas vizinhas, cada cultura sempre é [Concept('spread', 'Disseminada')|E] para uma Inovação específica que irá ser descoberta mais rapidamente.\n\nEm adição, o [culture_head|E] pode escolher outra (ou a mesma) Inovação como sua [cultural_fascination|E] para um bônus adicional."
 game_concept_innovations:0 "Inovações"
 game_concept_inspection:0 "Inspeção"
 game_concept_inspection_desc:0 "Uma atividade onde o [liege|E] viaja para um [county|E] em seu [realm|E] para supervisionar os magnatas e nobres locais.\n\nEle terá oportunidades em uma das seguintes áreas de foco: $rewards_inspection_tt$"
 game_concept_inspection_i:0 "@activity_inspection!"
 game_concept_inspection_success_chance:0 "Chance de Sucesso na Inspeção"
 game_concept_inspection_success_chance_desc:0 "O sucesso não é garantido ao realizar uma [inspection|E]. Os principais fatores que afetam essas chances são:\n$BULLET_WITH_TAB$@skill_learning_icon![skills|E]\n$BULLET_WITH_TAB$@control_icon![county_control|E]\n$BULLET_WITH_TAB$@county_icon!Fronteira com [realm|E] Estrangeiro\n\nA Chance de Sucesso na Inspeção nunca pode ser maior que #bold 95#!."
 game_concept_inspection_success_chance_no_prefix:0 "Chance de Sucesso"
 game_concept_inspections:0 "Inspeções"
 game_concept_integrate_title:0 "$task_integrate_title$"
 game_concept_integrate_title_desc:0 "Uma [councillor_task|E] realizada pelo [chancellor|E], que acelera o processo de [de_jure_drift|E] de um [title|E]."
 game_concept_intent:0 "Intenção"
 game_concept_intent_desc:0 "Uma $game_concept_intent$ representa o que um personagem busca pessoalmente realizar em uma [activity|E]; o anfitrião e os convidados têm seus próprios motivos e objetivos."
 game_concept_intents:0 "Intenções"
 game_concept_interacting:0 "Interagindo"
 game_concept_interaction:0 "Interação"
 game_concept_interaction_desc:0 "Ações realizadas por um personagem em relação a outro. Elas podem ter uma ampla variedade de propósitos e efeitos.\n\nAlgumas interações requerem a aprovação do personagem alvo, enquanto outras podem ser realizadas sem ela.\n\nGeralmente, elas são acessadas clicando com o botão direito do mouse em um personagem para acessar o Menu de Interação para o personagem alvo, mas às vezes elas estão disponíveis por meio de interfaces especiais."
 game_concept_interactions:0 "Interações"
 game_concept_intimidated:0 "Intimidado"
 game_concept_intimidated_desc:0 "Personagens que sentem muito medo de outro personagem são Intimidados por eles. Isto normalmente é causado por [dread|E] e/ou uma personalidade covarde.\n\nPersonagens Intimidados tem menos chance de tomarem ações hostis contra o personagem no qual eles sentem medo, isto inclui entrar ou criar [factions|E].\n\nPersonagens que tiverem ainda mais medo são marcados como [Concept('cowed', 'Apavorados')|E]."
 game_concept_intimidated_i:0 "@intimidated_icon!"
 game_concept_intimidation_tour:0 "Visita de Intimidação"
 game_concept_intimidation_tour_desc:0 "Um [tour_type|E] no qual você tenta intimidar seus [vassals|E], ganhando [dread|E] e forçando-os a sair de [factions|E]."
 game_concept_intrigue:0 "Intriga"
 game_concept_intrigue_9_14_20_18_9_7_21_5:0 "9 14 20 18 9 7 21 5"
 game_concept_intrigue_i:0 "@skill_intrigue_icon!"
 game_concept_intrigue_lifestyle:0 "Estilo de Vida em Intriga"
 game_concept_intrigue_lifestyle_desc:0 "O $game_concept_intrigue_lifestyle$ é adequado para Personagens que gostariam de ter sucesso em [schemes|E], ganhar [dread|E], ou Seduzir outros com facilidade."
 game_concept_intrigue_lifestyle_i:0 "@intrigue_lifestyle_icon!"
 game_concept_intrigue_lqwuljxh:0 "Lqwuljxh"
 game_concept_intrigue_rigueint:0 "Rigueint"
 game_concept_intrigue_skill:0 "Habilidade em Intriga"
 game_concept_intrigue_skill_desc:0 "$game_concept_intrigue$ é a [skill|E] que representa a habilidade de um Personagem em entender e manipular outros personagens, e também organizar e elaborar tramas.\n\nÉ usado principalmente para promover - e se defender de - esquemas de Intriga.\n\nO [lifestyle|E] correspondente é o [intrigue_lifestyle|E]."
 game_concept_jailor:0 "Carceireiro"
 game_concept_jihad:0 "Jihad"
 game_concept_jihads:0 "Jihads"
 game_concept_junior_emperor:0 "Co-Imperador Nominal"
 game_concept_junior_emperors:0 "Co-Imperadores Nominais"
 game_concept_king:0 "Rei"
 game_concept_king_desc:0 "Um $game_concept_king$ é um [ruler|E] cujo [primary_title|E] é um [kingdom|E].\n\nSeu [rank|E] está diretamente acima dos [dukes|E] e diretamente abaixo dos [emperors|E], e por isso eles podem ter $game_concept_dukes$ e inferiores como [vassals|E], e um $game_concept_emperor$ ou superior como seu [liege|E]."
 game_concept_kingdom:0 "Reino"
 game_concept_kingdom_desc:0 "Um $game_concept_kingdom$ é um [title|E] abaixo de um [empire|E] e acima de um [duchy|E].\n\nO [holder|E] de um Reino tem direitos [de_jure|E] sobre seu território constituinte e pode ter Duques como [vassals|E].\n\nReinos podem ser dormentes e não ter nenhum Proprietário. Estes podem ser criados por um [ruler|E] que controla ao menos meta de seus Condados."
 game_concept_kingdoms:0 "Reinos"
 game_concept_kings:0 "Reis"
 game_concept_kinslayer:0 "Assassino de Parente"
 game_concept_kinslayers:0 "Assassino de Parentes"
 game_concept_kinslaying:0 "Kinslaying"
 game_concept_kinslaying_desc:0 "Um Assassino de Parente é um Personagem que é reconhecido como alguém que matou um [family_member|E]. Algumas [faiths|E] veem Assassinato de Parentes como um ato [criminal|E].\nOs três traços de Assassino de Parentes são:\n$BULLET_WITH_TAB$[GetTrait('kinslayer_3').GetName( GetNullCharacter )] — Dado à quem mata um membro da [close_family|E]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_2').GetName( GetNullCharacter )] — Dado à quem mata um membro da [extended_family|E]\n$BULLET_WITH_TAB$[GetTrait('kinslayer_1').GetName( GetNullCharacter )] — Dado à quem mata um membro da sua [dynasty|E]"
 game_concept_knight:0 "Cavaleiro"
 game_concept_knight_army_modifier:0 "Modificador de Exército de Cavaleiro"
 game_concept_knight_army_modifier_desc:0 "Um efeito aplicado a qualquer [army|e] que #high contenha#! o [acclaimed_knight|e] pertinente.\n\nO [knight|e] #high não#! precisa ser o [commander|e] do exército para que o Modificador de Exército de Cavaleiro seja aplicado."
 game_concept_knight_army_modifiers:0 "Modificadores de Exército de Cavaleiro"
 game_concept_knight_desc:0 "Um $game_concept_knight$ é um [vassal|E], [courtier|E] ou [follower|E] que luta diretamente em seu [army|E].\n\nDurante as [battles|E], $game_concept_knights$ usam sua [prowess_skill|E] para lutar de maneira mais eficaz. Uma alta $game_concept_prowess$ significa que eles poderão causar mais dano ao inimigo e têm mais chances de sobreviver ou até sair da $game_concept_battle$ ilesos.\n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Os cavaleiros podem ser conhecidos por diferentes nomes dependendo da [culture] ou [faith]. Por exemplo, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ ou $knight_baghatur_no_tooltip_plural$.\n\nCavaleiros representam tanto o personagem quanto seu séquito de tropas.#!"
 game_concept_knight_desc_ACCOLADE_DLC:0 "Cavaleiros que recebem uma [accolade|E] se tornam [acclaimed_knights|E].\n\n"
 game_concept_knight_desc_NO_TOTO_DLC:0 ""
 game_concept_knight_desc_TOTO_DLC:0 "Você ganha [prestige|E] cada vez que um de seus $game_concept_knights$ se [contest_qualifies|E] com sucesso ou vence um [GetActivityType( 'activity_tournament' ).GetName] [contest|E].\n\n"
 game_concept_knight_effectiveness:0 "Efetividade dos Cavaleiros"
 game_concept_knight_effectiveness_desc:0 "A Efetividade dos Cavaleiros de um [ruler|E] determina o quão bem seus [knights|E] lutam em [battle|E].\n\nCom 100%, os Cavaleiros lutam normalmente, mas com 200% eles lutam como se sua [prowess|E] estivesse duplicada."
 game_concept_knight_i:0 "@knight_icon!"
 game_concept_knights:0 "Cavaleiros"
 game_concept_knights_possessive:0 "Do Cavaleiro"
 game_concept_land:0 "Terra"
 game_concept_landed:0 "Com Terra"
 game_concept_landed_desc:0 "Um Personagem $game_concept_landed$ é um [ruler|E] que tem [holdings|E]. Exceto em [theocracies|E] e [republics|E], [commoners|E] automaticamente se tornam [nobles|E] quando eles têm terras, fundando uma nova [dynasty|E]."
 game_concept_language:0 "Língua"
 game_concept_language_desc:0 "Um Idioma é o [culture_pillar|E] que determina qual idioma a população em geral de uma [culture|E] fala. $game_concept_cultures$ que falam o mesmo idioma ganham um bônus permanente para o seu [cultural_acceptance_baseline|E].\n\nUm [character|E] pode conhecer um ou mais idiomas. Conhecer um idioma reduz pela metade a penalidade de [opinion|E] da [cultural_acceptance|E] em relação a Personagens e [counties|E] que falam esse idioma. Também desencoraja [faction_independence|E] e [claimant_factions|E].\n\nOs personagens podem aprender idiomas adicionais usando o [scheme|E] [GetScheme('learn_language').GetTypeName]. Os personagens podem aprender confortavelmente idiomas até o seu [language_limit|E]."
 game_concept_language_limit:0 "Limite de línguas estrangeiras"
 game_concept_language_limit_desc:0 "Uma pessoa pode se lembrar de um certo número de [languages|E]. No entanto, se essa quantidade for ultrapassada, a pessoa pode esquecer uma língua ou sofrer [stress|E].\n\nA língua falada por sua [culture|E] não conta para esse limite.\n\nO limite é determinado da seguinte forma:\n$EFFECT_LIST_BULLET$Todo mundo começa com um valor base de #V 1#!\n$EFFECT_LIST_BULLET$Para cada [EmptyScope.ScriptValue('language_learning_divide_value')|V0] pontos de [learning_i][learning|E], o limite aumenta em #V 1#!\n$EFFECT_LIST_BULLET$O [perk|E] [GetPerk('open_minded_perk').GetName(GetNullCharacter)] aumenta em #V 2#!\n$EFFECT_LIST_BULLET$O [perk|E] [GetPerk('smooth_operator_perk').GetName(GetNullCharacter)] aumenta em #V 1#!\n$EFFECT_LIST_BULLET$O [dynasty_perk|E] [GetDynastyPerk('ep1_culture_legacy_1').GetName] aumenta em #V 1#!"
 game_concept_languages:0 "Línguas"
 game_concept_law:0 "Lei"
 game_concept_law_desc:0 "As Leis do [realm|E] determinam como esse Reino é estruturado.\n\nA mais fundamental delas é a [crown_authority|E] do Reino (ou [tribal_authority|E] para [tribes|E], [imperial_bureaucracy|E] para [administrative|E] e [nomadic_authority|E] para [nomads|E]), pois essas Leis determinam como [lieges|E] e [vassals|E] interagem regularmente.\n\nEmbora menos impactantes no dia a dia dos [rulers|E] de um Reino, as [succession_laws|E] e [title_laws|E] ainda são muito importantes a se considerar para a [succession|E]."
 game_concept_law_i:0 "@law_icon!"
 game_concept_laws:0 "Leis"
 game_concept_learning:0 "Aprendizado"
 game_concept_learning_i:0 "@skill_learning_icon!"
 game_concept_learning_lifestyle:0 "Estilo de Vida em Aprendizado"
 game_concept_learning_lifestyle_desc:0 "O $game_concept_learning_lifestyle$ é adequado para Personagens que gostariam de viver vidas longas e saudáveis, ganhar [piety|E], ou ganhar benefícios adicionais de sua [faith|E]."
 game_concept_learning_lifestyle_i:0 "@learning_lifestyle_icon!"
 game_concept_learning_skill:0 "Habilidade em Aprendizado"
 game_concept_learning_skill_desc:0 "$game_concept_learning$ é a [skill|E] que mede a alfabetização e sabedoria de um Personagem. A Habilidade em Aprendizado em um [ruler|E] afeta o custo de aumentar a [crown_authority|E], e também fornece uma quantia de [piety|E] mensal.\n\nPode-se esperar que Personagens com um alto nível de Aprendizado tenham um amplo conhecimento sobre todos os esforços acadêmicos comuns, incluindo teologia, filosofia, linguagens e matemática.\n\nO [lifestyle|E] correspondente é o [learning_lifestyle|E]."
 game_concept_lease:0 "Alugar"
 game_concept_leased:0 "Alugado"
 game_concept_leases:0 "Locações"
 game_concept_leasing:0 "Alugando"
 game_concept_leasing_desc:0 "Pequenos [baronies|E] podem ser [Concept('leased', 'Alugados')|E] para [holy_orders|E] ou para um [clergy|E]. Baronatos alugados fornecem [taxes|E] e [levies|E] para o [lessee|E] ao invés do [holder|E].\n\nUma Ordem Sagrada pode alugar as [castle_holdings|E], enquanto um clero pode alugar as [temple_holdings|E].\n\n[holdings|E] alugadas ainda são consideradas parte do [realm|E] do proprietário. [county_capitals|E] não podem ser alugadas."
 game_concept_legalism:0 "Legalismo"
 game_concept_legalism_desc:0 "O [core_tenet|E] enfatizam práticas legais e tradições em teologia e devoção. Afeta os custos de leis e a associação de [vassals|E] à [factions|E] baseado no número de [sins|E] ou [virtues|E] que um [ruler|E] tem."
 game_concept_legalistic:0 "Legalista"
 game_concept_legitimacy:0 "Legitimidade"
 game_concept_legitimacy_desc:0 "$game_concept_legitimacy$ é a representação do direito de um [ruler|E] de reinar. Os [vassals|E] também geram [legitimacy_expectations|E] que o [liege|E] deve atender.\n\nApenas [rulers|E] possuem $game_concept_legitimacy$, que é calculada no momento em que eles se tornam governantes e resulta em sua [initial_legitimacy|E]. Uma fração da $game_concept_legitimacy$ do governante anterior também é herdada por seu [heir|E].\n\nA $game_concept_legitimacy$ afeta muitos sistemas do jogo, tornando propostas de [marriage|E], [vassalization|E] e [alliances|E] mais propensas a serem aceitas, além de tornar [claims|E] mais baratas e influenciar as [scales_of_power|E] durante uma [regency|E].\n\nNormalmente, a $game_concept_legitimacy$ possui 5 [legitimacy_levels|E] e um nível inferior #weak Ilegítimo#!.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_desc_nomadic' )][AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'game_concept_legitimacy_desc_mandala' )]"
 game_concept_legitimacy_desc_mandala:0 "\n\nOs [rulers|E] [GetGovernment( 'mandala_government' ).GetName] possuem um tipo especial de $game_concept_legitimacy$, independente de seu [rank|E] e com níveis adicionais."
 game_concept_legitimacy_desc_nomadic:0 "\n\n[rulers|E] [GetGovernment( 'nomad_government' ).GetName] têm um tipo especial de $game_concept_legitimacy$, independente da sua [rank|E]."
 game_concept_legitimacy_expectations:0 "Expectativas de Legitimidade"
 game_concept_legitimacy_expectations_desc:0 "$game_concept_expected_legitimacy_desc$"
 game_concept_legitimacy_gain:0 "Ganho de Legitimidade"
 game_concept_legitimacy_i:0 "[GetLocalPlayerLegitimacyTextIcon]"
 game_concept_legitimacy_level:0 "Nível de Legitimidade"
 game_concept_legitimacy_level_desc:0 "$game_concept_legitimacy_levels$ podem ser conquistados de várias maneiras: vencendo [wars|E], libertando [valuable_prisoners|E], criando [legends|E], mantendo a [court|E], ou participando de [activities|E].\n\nNo entanto, também podem ser perdidos: [epidemics|E] devastando a [capital|E], perdendo guerras (especialmente as [faction|E] wars), perdendo [titles|E], ou um [hostile_scheme|E] exposto são algumas das principais formas de o $game_concept_legitimacy$ diminuir.[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_nomadic' ), 'game_concept_legitimacy_level_desc_nomadic' )]"
 game_concept_legitimacy_level_desc_nomadic:0 "\n\n[rulers|E] [GetGovernment( 'nomad_government' ).GetName] ganham #V 50%#! mais Legitimidade ao vencer guerras, mas também perdem o dobro em caso de derrota. Eles também ganham Legitimidade ao participar de [single_combat_duel_plural|E] e ao se casar com [courtiers|E] de linhagem nobre de alguém de [dominance|E] igual ou superior."
 game_concept_legitimacy_levels:0 "Níveis de Legitimidade"
 game_concept_legitimate:0 "Legítimo"
 game_concept_legitimate_desc:0 "Filhos nascidos de pais [Concept('married', 'Casados')|E] são considerados um filho $game_concept_legitimate$, diferente de [bastards|E] que não podem herdar [titles|E] algum. Filhos de [concubines|E] também são considerados um filho [legitimate|E], embora de status um pouco inferior."
 game_concept_legitimized:0 "Legitimado"
 game_concept_legitimized_bastard:0 "Bastardo Legitimado"
 game_concept_legitimized_bastard_desc:0 "Um [bastard|E] pode ser Legitimado, no nascimento, ou por uma [character_interaction|E] mais tarde, dependendo da aprovação do [house_head|E].\n\nUm Bastardo Legitimado tem os mesmos direitos de herança que um filho [legitimate|E], mas a mancha de bastardia irá persegui-los por toda sua vida."
 game_concept_lessee:0 "Inquilino"
 game_concept_levies:0 "Milícias"
 game_concept_levies_desc:0 "A maior parte dos [armies|E] é feita de $game_concept_levies$.\n\nCada [holding|E] provê um número definido de $game_concept_levies$ para o seu [holder|E]. Em retorno [vassals|E] proveem parte das suas $game_concept_levies$ para o seu [liege|E].\n\n$game_concept_levies$ são formadas em sua maioria por combatentes mau equipados #weak (milícia de camponeses, rufiões, mercenários locais, nobres destituídos, pequenos proprietários de terra, etc.)#! e são considerados seu próprio tipo de unidade.\n\nUma $game_concept_levy$ tem [GetDefine('NCombat', 'LEVY_ATTACK')|0] de [damage|E] e [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] de [toughness|E]. O outro tipo de [soldiers|E] no jogo são os [men_at_arms|E] — São profissionais caros e treinados."
 game_concept_levy:0 "Milícia"
 game_concept_liberty_faction:0 "$liberty_faction$"
 game_concept_liberty_faction_desc:0 "A $game_concept_liberty_faction$ busca reduzir a [crown_authority|E] e, se aplicável, seus próprios [vassal_contracts|E]. Se bem sucedidos, seu [liege|E] será incapaz de mudar a Autoridade da Coroa do [realm|E] por um tempo."
 game_concept_liberty_factions:0 "Facções da Liberdade"
 game_concept_liege:0 "Senhor Feudal"
 game_concept_liege_desc:0 "Um $game_concept_liege$ é um [ruler|E] com ao menos um [vassal|E]. Os próprios Senhores Feudais podem ser Vassalos de alguém de nível ainda maior, e assim por diante."
 game_concept_liege_possessive:0 "do Senhor Feudal"
 game_concept_liege_taxes:0 "Impostos do Senhor Feudal"
 game_concept_liege_taxes_desc:0 "Seus $game_concept_liege_taxes$ são [taxes|E] que você deve pagar para o seu [liege|E] como parte de suas [obligations|E]. Você não paga nada de $game_concept_liege_taxes$ se você for [independent|E].\n\nDo ponto de vista do seu Senhor Feudal, estes impostos são chamados de [vassal_taxes|E] para distingui-los de quaisquer impostos que eles devem pagar para seus próprios $game_concept_lieges$."
 game_concept_lieges:0 "Senhores Feudais"
 game_concept_life_expectancy:0 "Expectativa de Vida"
 game_concept_life_expectancy_desc:0 "$game_concept_life_expectancy$ é o número de anos que um personagem é esperado viver antes de morrer por causas naturais.\n\nUma alta $game_concept_life_expectancy$ irá fazer os personagens ficarem visualmente mais velhos de forma mais devagar e produzir [children|E] por mais tempo."
 game_concept_lifestyle:0 "Estilo de Vida"
 game_concept_lifestyle_desc:0 "[rulers|E] [Concept('adult', 'adultos')|E] podem escolher um $game_concept_lifestyle$, no qual irá permitir a escolha de um [focus|E] e começar a receber [perks|E].\n\nCada $game_concept_lifestyle$ tem o seu próprio tipo de [experience|E], que é utilizada para adquirir $game_concept_perks$. Por exemplo, Experiência no [intrigue_lifestyle|E] é necessária para receber $game_concept_perks$ como o beneficio [GetPerk( 'dreadful_perk' ).GetName( GetNullCharacter )] ou [GetPerk( 'like_weed_in_a_garden_perk' ).GetName( GetNullCharacter )].\n\nOs $game_concept_lifestyles$ são:\n$BULLET_WITH_TAB$ [diplomacy_lifestyle|E]\n$BULLET_WITH_TAB$ [stewardship_lifestyle|E]\n$BULLET_WITH_TAB$ [martial_lifestyle|E]\n$BULLET_WITH_TAB$ [intrigue_lifestyle|E]\n$BULLET_WITH_TAB$ [learning_lifestyle|E]\n$BULLET_WITH_TAB$ [wanderer_lifestyle|E]"
 game_concept_lifestyle_experience:0 "Experiência no Estilo de Vida"
 game_concept_lifestyle_experience_desc:0 "$game_concept_lifestyle_experience$ é acumulada passivamente ao ter um [focus|E] selecionado, ou é dada por eventos. Existem tipos diferentes de $game_concept_lifestyle_experience$, uma para cada [lifestyle|E].\n\nGanhar $game_concept_lifestyle_experience$ o suficiente em uma categoria irá lhe prover em [perk|E]."
 game_concept_lifestyle_trait:0 "Traço de Estilo de Vida"
 game_concept_lifestyle_trait_desc:0 "Um $game_concept_lifestyle_trait$ é o resultado de escolher certos [lifestyles|E], [decisions|E] ou [interactions|E].\n\nAlguns traços de Estilo de Vida podem ser aprimorados à medida que o personagem melhora sua habilidade. Os níveis variam de 1 a 3, e as estrelas no ícone do traço indicam o nível atual."
 game_concept_lifestyle_traits:0 "Traços de Estilo de Vida"
 game_concept_lifestyles:0 "Estilos de Vida"
 game_concept_light_cavalry:0 "Cavalaria Leve"
 game_concept_light_cavalry_desc:0 "Cavalaria Leve é constituída de [men_at_arms|E] montados que se destacam em perseguir o inimigo.\n\nEnquanto cada tipo de Cavalaria Leve é único, eles costuman [counters|E] [archers|E], e sofrem Contra-Ataques de [spearmen|E].\n\nCavalaria Leve também costuma ser forte quando em [terrain|E] plano.\n\nEm comparação com a [heavy_cavalry|E], eles costumam ser melhores em [pursuit|E] e [screen|E]."
 game_concept_limited:0 "Limitada"
 game_concept_limited_crown_authority:0 "Autoridade da Coroa Limitada"
 game_concept_limited_crown_authority_desc:0 "'$game_concept_limited_crown_authority$' é o segundo menor nível da [crown_authority|E]. [vassals|E] têm uma penalidade de #N -10#! de [opinion|E] contra seu [liege|E], e o senhor feudal pode [revoke|E] [titles|E] e [retract|E] vassalos de vassalos. O [ruler|E] pode alterar entre as [succession_laws|E]."
 game_concept_limited_tribal:0 "Limitada"
 game_concept_limited_tribal_authority:0 "Autoridade Tribal Limitada"
 game_concept_limited_tribal_authority_desc:0 "$game_concept_limited_tribal_authority$ é o segundo menor nível da [tribal_authority|E]. [vassals|E] têm uma penalidade de #N -10#! de [opinion|E] contra seu [liege|E], e o senhor feudal agora pode [imprison|E] [characters|E] em seu [realm|E]."
 game_concept_line:0 "Linha"
 game_concept_line_of_succession:0 "Linha de Sucessão"
 game_concept_line_of_succession_desc:0 "A Linha de Sucessão é uma ordem no qual certos personagens são colocados para herdar certos [titles|E], determinada pela [succession_law|E]."
 game_concept_local_arbitration:0 "$local_arbitration_decision$"
 game_concept_local_arbitration_decision:0 "Decisão $local_arbitration_decision$"
 game_concept_local_arbitration_desc:0 "Uma [decision|E] que permite a um personagem melhorar um [county|E] em sua localização atual."
 game_concept_locale:0 "Locais"
 game_concept_locale_desc:0 "Você pode escolher como explorar o [GetActivityType( 'activity_tournament').GetName] enquanto os [contests|E] estão sendo preparados.\n\nCada Local oferece oportunidades para socializar com os convidados, melhorar o [progress_to_victory|E] ou sabotar os [contestants|E].\n\nSe um Local não for selecionado, você visitará um aleatoriamente após um curto período de tempo."
 game_concept_locales:0 "Locais"
 game_concept_location:0 "Local"
 game_concept_location_desc:0 "Cada [character|E] possui um local que indica onde eles estão atualmente no mundo. Para ir de um local a outro, é necessário [travel|E]."
 game_concept_locations:0 "Locais"
 game_concept_long_reign:0 "Reinado Longo"
 game_concept_long_reign_desc:0 "'Reinado Longo' é um bônus de [opinion|E] crescente que todos os personagens em um [realm|E] recebem sobre um [liege|E] que esteve governado-os por muito tempo.\n\nDe forma similar, também é possível obter a penalidade decrescente de Opinião de [short_reign|E] sobre novos Senhores Feudais."
 game_concept_loot:0 "Pilhagem"
 game_concept_loot_desc:0 "Se uma [holding|E] for [Concept( 'raid', 'saqueada' )|E], [occupied|E] em um [siege|E] ou envolvida em [barter|E], o atacante ou [barterer|E] receberá uma quantia de [gold|E] equivalente a $game_concept_loot$. Quanto mais próspera for uma [holding|E], mais $game_concept_loot$ ela terá.\n\nUma Propriedade que foi recentemente Saqueada, Sitiada ou Negociada não terá nenhum Saque."
 game_concept_loot_i:0 "@loot_icon!"
 game_concept_lover:0 "Amante"
 game_concept_lover_desc:0 "Um $game_concept_lover$ é uma $game_concept_relation$ que indica uma associação amorosa e sexual contínua entre dois [characters|E].\n\nComo muitas vezes acontecem fora dos laços do [marriage|E] ou [concubinage|E], a maioria dos $game_concept_lover$ $game_concept_relations$ começam como [secrets|E].\n\nSe um homem e uma mulher são $game_concept_lovers$, a mulher pode engravidar do filho do homem. Se eles não estão Casados (e um não é Concubino do outro), a criança será um [bastard|E], secreto ou não.\n\n$game_concept_lovers$ que são profundamente leais e afetuosos podem se tornar [soulmates|E]."
 game_concept_lover_possessive:0 "Do Amante"
 game_concept_lovers:0 "Amantes"
 game_concept_lovers_possessive:0 "Dos Amantes"
 game_concept_lowborn:0 "Plebeu"
 game_concept_main_phase:0 "Fase Principal"
 game_concept_main_phase_desc:0 "Na Fase Principal de uma [battle|E], [soldiers|E] e [knights|E] dos dois lados lutam entre si.\n\nA Fase Principal termina quando todas as tropas de um lado se tornaram [casualties|E] ou um lado decidiu [Concept( 'retreat', 'recuar' )|E].\n\nDepois da Fase Principal, o combate entra na [aftermath|E]."
 game_concept_majesty_tour:0 "Visita de Majestade"
 game_concept_majesty_tour_desc:0 "Um [tour_type|E] no qual você tenta persuadir seus [vassals|E] aumentando sua [opinion|E]."
 game_concept_manage_guards:0 "$task_manage_guards$"
 game_concept_manage_guards_desc:0 "$game_concept_increase_control$ é uma [councillor_task|E] realizada pelo [marshal|E].\n\nEla aumenta a [knight_effectiveness|E] e diminui a [success_chance|E] do [hostile_scheme|E] contra o [liege|E] do conselheiro."
 game_concept_mandate:0 "Mandato"
 game_concept_mandate_desc:0 "$game_concept_mandates$ são tarefas úteis que um [liege|E] pode atribuir ao seu [diarch|E] quando estão [sharing_power|E].\n\nSimilarmente às [councillor_tasks|E], o $game_concept_liege$ seleciona um $game_concept_mandate$ e recebe benefícios gradualmente.\n\nQuando um $game_concept_diarch$ desempenha bem o seu papel, eles inclinam as [scales_of_power|E] a seu favor #EMP e#! geram [strife|E] com outros [vassals|E].\n\nA quantidade de benefícios que o $game_concept_liege$ recebe depende da [diarch_aptitude|E] e da [diarch_loyalty|E] do $game_concept_diarch_possessive$."
 game_concept_mandate_possessive:0 "Do Mandato"
 game_concept_mandates:0 "Mandatos"
 game_concept_mandates_possessive:0 "Dos Mandatos"
 game_concept_maneuver:0 "Manobra"
 game_concept_maneuver_desc:0 "A fase de $game_concept_maneuver$ ocorre no início de uma [battle|E] e indica o tempo que leva até que a [main_phase|E] comece e os [armies|E] entrem em combate."
 game_concept_manipulation:0 "Manipulação"
 game_concept_manipulation_desc:0 "$game_concept_manipulation$ é uma forma de [hook|E] onde você foi capaz de manipular a mente de outro personagem de alguma forma para que eles façam sua vontade."
 game_concept_marriage:0 "Casamento"
 game_concept_marriage_desc:0 "$game_concept_marriages$ são uma união entre dois [spouses|E], e são (junto com os [betrothals|E]) a principal forma de forjar uma [alliance|E] com outro [ruler|E].\n\nOs $game_concept_spouses$ também podem ter filhos [Concept('legitimate', 'Legítimos')|E], que podem ser [bred|E] e educados como [heirs|E] adequados.\n\nOs $game_concept_marriages$ só terminam quando um dos $game_concept_spouses$ morre ou se [divorces|E] um do outro.[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_marriage_desc_TOTO_DLC', '' )]"
 game_concept_marriage_desc_TOTO_DLC:0 "\n\nRealizar um [GetActivityType( 'activity_wedding' ).GetName] aumenta significativamente a aceitação de uma proposta de casamento."
 game_concept_marriages:0 "Casamentos"
 game_concept_married:0 "Casado"
 game_concept_marries:0 "Casa"
 game_concept_marry:0 "Casar"
 game_concept_marrying:0 "Casando"
 game_concept_marshal:0 "Marechal"
 game_concept_marshal_desc:0 "O $game_concept_marshal$ é seu [commander|E] chefe e o [councillor|E] encarregado em questões militares em geral."
 game_concept_marshals:0 "Marechais"
 game_concept_martial:0 "Marcial"
 game_concept_martial_custom:0 "Tradição marcial"
 game_concept_martial_custom_desc:0 "A \"Tradição Marcial\" é um [culture_pillar|E] que determina qual gênero pode atuar como [commanders|E] ou [knights|E].\n\nAlgumas [traditions|E] e [doctrines|E] podem alterar essas regras para certos [characters|E]."
 game_concept_martial_i:0 "@skill_martial_icon!"
 game_concept_martial_lifestyle:0 "Estilo de Vida Marcial"
 game_concept_martial_lifestyle_desc:0 "O $game_concept_martial_lifestyle$ é adequado para Personagens que gostariam de melhorar seus [men_at_arms|E] e [knights|E], também seu [control|E] em seus [domains|E], ou suas chances de vencer [wars|E]."
 game_concept_martial_lifestyle_i:0 "@martial_lifestyle_icon!"
 game_concept_martial_skill:0 "Habilidade Marcial"
 game_concept_martial_skill_desc:0 "$game_concept_martial$ é a [skill|E] que indica o quão bom um Personagem é em travar uma [war|E] e liderando [armies|E] em [battle|E].\n\nUm nível alto de Habilidade Marcial é importante para o [army_commanders|E], já que isto melhora sua [advantage|E] em [battle|E].\n\nO [lifestyle|E] correspondente é o [martial_lifestyle|E]."
 game_concept_master_terrain:0 "Terreno Mestre"
 game_concept_master_terrain_desc:0 "Uma [decision|E] desbloqueada na árvore do [wanderer_lifestyle|E], onde você pode escolher um [terrain|E] para especialização, com base no grupo escolhido em [designated_terrain|E].\n\nEsta decisão oferecerá grandes benefícios para o terreno escolhido, concedendo bônus como aumento de [advantage|E], melhoria na [combat_roll|E], redução de [attrition|E] e aumento de [prestige|E] e [prestige_experience|E] de [battle|E]."
 game_concept_masterwork:0 "$artifacts_rarity_masterwork$"
 game_concept_matrilineal:0 "Matrilinear"
 game_concept_matrilineal_desc:0 "Em um [marriage|E] $game_concept_matrilineal$, filhos serão nascidos na [house|E] de sua mãe ao invés da do seu pai."
 game_concept_matrilineally:0 "Matrilinearmente"
 game_concept_maximum_piety_level:0 "Nível Máximo de Devoção"
 game_concept_maximum_piety_level_desc:0 "O $game_concept_maximum_piety_level$ representa o mais alto [piety_level|E] que um [ruler|E] pode alcançar em sua vida. Por padrão, esse nível é [GetModifier( 'piety_level_5' ).GetNameWithTooltip|L].[AddLocalizationIf( GetPlayer.GetGovernment.HasGovernmentFlag( 'government_is_mandala' ), 'maximum_piety_level_mandala')]"
 game_concept_medical_treatments:0 "Tratamentos Médicos"
 game_concept_medical_treatments_desc:0 "Quando um personagem fica [ill|E] ou [GetTrait('wounded_1').GetName( GetNullCharacter )], um Tratamento Médico pode ajudá-lo a se recuperar mais rápido.\n\nA responsabilidade de tratar você e seus [courtiers|E] é do [GetCourtPositionType('court_physician_court_position').GetName()]. Tente sempre ter um empregado se puder pagar seu salário.\n\nQuanto mais tratamentos um $court_physician_court_position$ realiza, mais sua habilidade crescerá, concedendo-lhes [traits|E] de [GetTrait('lifestyle_physician').GetName( GetNullCharacter )]."
 game_concept_megaduke_penalty:0 "Superextensão"
 game_concept_megaduke_penalty_desc:0 "Quando você tem mais de [GetDefine('NCharacter', 'MAX_COUNTIES_IN_REALM_AS_DUKE')] [counties|E] em seu [realm|E] como um [duke|E], você sofrerá uma Penalidade de $game_concept_megaduke_penalty$, Reduzindo o [tax|E] recebido.\n\nSe tornando um [king|E] ou [emperor|E] irá remover esta penalidade."
 game_concept_men_at_arms:0 "Homens de Armas"
 game_concept_men_at_arms_counter:0 "Contra-Ataque de Séquitos"
 game_concept_men_at_arms_counter_desc:0 "A maioria dos [men_at_arms|E] são capazes de $game_concept_counter$ outros tipos de $game_concept_men_at_arms$.\n\nQuando um [regiment|E] é Contra-Atacado, sua efetividade durante a [battle|E] é diminuída. Quanto mais um $game_concept_regiment$ é superado em números por seu Contra-Atacante, maior é a penalidade."
 game_concept_men_at_arms_desc:0 "$game_concept_men_at_arms$ são [soldiers|E] profissionais superiores as [levies|E].\n\nO jogador tem controle direto sobre a composição e o tamanho dos seus [regiments|E] de Homens de Armas.\n\nDiferentes tipos de Homens de Armas são melhores ou piores em diferentes tipos de [terrain|E]. Cada tipo também possui [Concept('counters', 'Contra-Ataque')|E] sobre outro tipo.\n\nOs Homens de Armas podem ser [stationed|E] em [holdings|E] para aumentar sua efetividade."
 game_concept_mental_break:0 "Colapso Mental"
 game_concept_mental_break_desc:0 "Quando o [stress|e] domina um personagem ele irá sofrer um Colapso Mental — uma crise pessoal em que eles se sentem obrigados a fazer algo para diminuir o seu Estresse, não importando o custo.\n\nPersonagens sofrendo um Colapso Mental irão ter diversas formas de lidar com a situação, porém a maioria terá consequências negativas.\n\nEm um [stress_levels|E] baixo estas consequências são menores e podem ser controladas facilmente. Conforme o Nível de Estresse aument, estas consequências também irão, eventualmente atingindo a insanidade ou a morte."
 game_concept_mental_breaks:0 "Colapsos Mentais"
 game_concept_mentor:0 "Mentor"
 game_concept_mentor_desc:0 "$game_concept_mentors$ são [character|E] que ajudam a melhorar as [skills|E] de seus [student|E]. Eles podem ser obtidos por meio de eventos quando o [focus|E] de seu [lifestyle|E] é definido para uma $game_concept_skill$ específica."
 game_concept_mentor_possessive:0 "Do mentor"
 game_concept_mentors:0 "Mentores"
 game_concept_mentors_possessive:0 "Dos mentores"
 game_concept_mercenaries:0 "Mercenários"
 game_concept_mercenary:0 "Mercenário"
 game_concept_mercenary_company:0 "Compania Mercenária"
 game_concept_mercenary_company_desc:0 "[mercenaries|E] são [soldiers|E] contratados para lutar em troca de [gold|E]. [armies|E] Mercenários podem ter diferentes tamanhos, com diferentes tipos de [men_at_arms|E] e número de [knights|E].\n\nMercenários fazem contratos de #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] meses#! que podem ser extendidos por outros #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] meses#! se você ainda estivem em [war|E]. Contratos de Mercenários se persistem mesmo se seus Regimentos forem dispensados — eles podem ser erguidos novamente sem custos extras.\n\nVocê esta permitido de entrar em [debt|E] para contratar Mercenários #weak (em até [GetDefine('NMercenary', 'ALLOWED_DEBT_MONTHS')] meses)#!."
 game_concept_mercenary_contract:0 "Contrato de Mercenário"
 game_concept_mercenary_contract_desc:0 "Estabelecer um Contrato de [mercenary|E] incorre um custo único que permite o uso de suas tropas por #V [GetDefine('NMercenary', 'BASE_HIRE_MONTHS')] meses#!."
 game_concept_mercenary_contracts:0 "Contratos de Mercenário"
 game_concept_mercenary_i:0 "@government_type_mercenary!"
 game_concept_military_building:0 "Construção Militar"
 game_concept_military_building_desc:0 "$game_concept_military_buildings$ são [buildings|E] cuja função primária é aumentar a quantidade de [levies|E] que fornecem ao seu [holder|E]."
 game_concept_military_buildings:0 "Construções Militares"
 game_concept_military_power:0 "Poder Militar"
 game_concept_modifier:0 "Modificador"
 game_concept_modifier_base_contributes:0 "Contribui Base"
 game_concept_modifier_base_contribution:0 "Contribuição Base"
 game_concept_modifier_base_contribution_desc:0 "Um [modifier|E] pode mudar a $game_concept_modifier_base_contribution$ das [obligations|E] dos seus [vassals|E]. Isso não é o mesmo que [modifier_contribution|E].\n\nSe você tem um [vassal] que tem um [income|E] total de #V 10#! [gold|E] e lhe paga #V 1#! [gold] por mês, e você ganha um [modifier] que aumenta a $game_concept_modifier_base_contribution$ em #V 10%#!, então o [vassal] passa a pagar #V 2#! [gold]."
 game_concept_modifier_base_contributions:0 "Contribuições Base"
 game_concept_modifier_contributes:0 "Contribui"
 game_concept_modifier_contribution:0 "Contribuição"
 game_concept_modifier_contribution_desc:0 "Um [modifier|E] pode mudar a $game_concept_modifier_contribution$ das [obligations|E] dos seus [vassals|E]. Isso não é o mesmo que [modifier_base_contribution|E].\n\nSe você tem um [vassal] que lhe paga #V 1#! [gold|E] por mês, e você ganha um [modifier] que aumenta a $game_concept_modifier_contribution$ em #V 10%#!, então o [vassal] passa a pagar #V 1,1#! [gold]."
 game_concept_modifier_contributions:0 "Contribuições"
 game_concept_modifier_desc:0 "Um $game_concept_modifier$ é um efeito que muda um valor ao longo de um período de tempo. Pode, por exemplo, mudar o valor das [skills|E] de um personagem, ou a [success_chance|E] de um [scheme|E].\n\nModificadores geralmente aparecem para Personagens, Esquemas ou [counties|E]."
 game_concept_modifiers:0 "Modificadores"
 game_concept_mongol_empire:0 "Império Mongol"
 game_concept_mongol_empire_desc:0 "Um [title|E] de [empire|E] que pode ser criado por um poderoso governante tribal nos Estepes. Isto permite o [mongol_invasion_casus_belli|E].\n\nO título é criado ao concluir a [decision|E] de #EMP $become_greatest_of_khans_decision$#!."
 game_concept_mongol_invasion_casus_belli:0 "Casus Belli de Invasão Mongol"
 game_concept_mongol_invasion_casus_belli_desc:0 "Um [casus_belli|E] poderoso disponível apenas para o [ruler|E] do [mongol_empire|E].\n\nEle pode ter como alvo um [title|E] de [kingdom|E] inteiro de uma vez só, e pemite uma expansão rápida através de grandes áreas no mapa."
 game_concept_monument_expedition:0 "Expedição a Monumento"
 game_concept_monument_expedition_desc:0 "Uma atividade em que um personagem decide viajar para um monumento ou marco famoso para se aprimorar, explorando sua história, conhecimento e mistérios.\n\nRecompensas esperadas:\n\t$BULLET_WITH_TAB$[intrigue_i|E][diplomacy_i|E][martial_i|E][learning_i|E][stewardship_i|E] Pontos de [skill|E]\n$BULLET_WITH_TAB$[court_position_i][aptitude|E] Excelente da [court_positions|E]\n$BULLET_WITH_TAB$[prestige_i|E][prestige|E]"
 game_concept_monument_expedition_i:0 "@activity_monument_expedition!"
 game_concept_movement_lock:0 "Bloqueio de Movimento"
 game_concept_movement_locked:0 "Movimento Bloqueado"
 game_concept_movement_locked_desc:0 "Depois que um [army|E] completar mais da metade de uma determinada ordem de movimento, não será possível mudá-la até que eles cheguem ao seu destino."
 game_concept_natural_prowess:0 "Bravura Natural"
 game_concept_nemeses:0 "Nêmeses"
 game_concept_nemeses_possessive:0 "Dos Nêmeses"
 game_concept_nemesis:0 "Nêmeses"
 game_concept_nemesis_desc:0 "Um $game_concept_nemesis$ é uma $game_concept_relation$ que indica completo (e mútuo) desprezo e ódio. É uma relação mais forte do que a de [rival|E]. Um personagem só pode ter um $game_concept_nemesis$."
 game_concept_nemesis_possessive:0 "Do Nêmeses"
 game_concept_nickname:0 "Apelido"
 game_concept_nickname_desc:0 "$game_concept_nicknames$, $game_concept_epithets$ e $game_concept_cognomens$ são todos nomes secundários dados ou atribuídos a [characters|E] (por exemplo, Carlos 'o Calvo'). $game_concept_nicknames$ são puramente estéticos, embora as circunstâncias em torno de sua aquisição geralmente sejam eventos dramáticos ou notáveis.\n\nOs maus $game_concept_nicknames$ às vezes são substituídos por bons (como William 'o Bastardo' se tornando William 'o Conquistador')."
 game_concept_nicknames:0 "Apelidos"
 game_concept_nobility:0 "Nobreza"
 game_concept_noble:0 "Nobre"
 game_concept_noble_desc:0 "$game_concept_nobles$ são considerados personagens de uma [dynasty|E]. Personagens sem uma Dinastia são considerados [commoners|E] humildes."
 game_concept_nobleman:0 "Homem Nobre"
 game_concept_noblemen:0 "Homens Nobres"
 game_concept_nobles:0 "Nobres"
 game_concept_noblewoman:0 "Mulher Nobre"
 game_concept_noblewomen:0 "Mulheres Nobres"
 game_concept_nominal_duumvirate:0 "Duumvirado Nominal"
 game_concept_nominal_duumvirate_desc:0 "Um $game_concept_duumvirate$ é o governo de um [empire|E] por dois [characters|E]. Um imperador sênior (o [liege|E]) e um imperador júnior (o $game_concept_junior_emperor$).\n\nEles são considerados $game_concept_nominal_duumvirates$ quando o imperador júnior é uma [child|E] que não pode governar efetivamente, mas transitará para ser um pleno [duumvirates|E] quando atingir a maioridade.\n\n$game_concept_junior_emperors$ geram [influence|E] passiva para ambos, eles mesmos e seu imperador sênior. Quanto exatamente aumenta a cada [EmptyScope.ScriptValue('co_emperor_scale_years_in_job_value')|0] anos no cargo, transferindo-se quando se tornam um pleno $game_concept_co_emperor$.\n\n#WEAK Nomear uma $game_concept_child$ $game_concept_junior_emperor$ os marca como sendo treinados para um dia provavelmente serem o imperador sênior. Quanto mais prática eles têm, mais treinamento recebem.\n\nIsso é representado como [skill|E] adicionais distribuídas a eles quando se tornam um [adult|E], dependendo da [scales_of_power|E].\n\nCrianças não recebem eventos de [mandate|E].#!"
 game_concept_nominal_duumvirates:0 "Duumvirados Nominais"
 game_concept_nominate:0 "Nominar"
 game_concept_nominate_desc:0 "Sob as [succession_laws|E] Eletivas, cada [elector|E] pode Nominar seu [title_heir|E] preferido. Candidatos válidos e Preferências de Voto podem ser diferentes dependendo da Lei específica."
 game_concept_nominate_heir:0 "Nominar Herdeiro"
 game_concept_nomination:0 "Nominação"
 game_concept_nominations:0 "Nominações"
 game_concept_objectives:0 "Objetivos"
 game_concept_objectives_desc:0 "Certas partes de um [realm|E] inimigo (normalmente a [realm_capital|E] e [holdings|E] dentro da região do [war_target|E] de uma [war|E]) são consideradas $game_concept_objectives$. [occupying|E] $game_concept_objectives$, você começará a ganhar [war_score|E] com o tempo.\n\nPara o Defensor, [war_score|E] é ganha (depois de um período inicial) se o Atacante não estiver Ocupando quaisquer $game_concept_objectives$."
 game_concept_obligation:0 "Obrigação"
 game_concept_obligations:0 "Obrigações"
 game_concept_occupation:0 "Ocupação"
 game_concept_occupation_desc:0 "[holdings|E] Ocupadas estão temporariamente sob controle de um [ruler|E] hostil durante uma [war|E]. Um [army|E] posicionado em um [barony|E] com uma [fortified_holding|E] hostil irá começar a [besiege|E] o local se o número de [soldiers|E] no exército for maior que o de [garrison|E].\n\nSe o Cerco for concluido com sucesso, a Propriedade é Ocupada, o que irá fornecer [war_score|E] para o lado Ocupante na [war|E].\n\nOcupar uma Propriedade não significa que ela é sua! Apenas o território especificado como um [war_target|E] pode realmente mudar de mãos, e somente se o Atacante [wins|E]."
 game_concept_occupations:0 "Ocupações"
 game_concept_occupied:0 "Ocupada"
 game_concept_occupies:0 "Ocupado"
 game_concept_occupy:0 "Ocupar"
 game_concept_occupying:0 "Ocupando"
 game_concept_offensive_war_opinion:0 "Opinião sobre Guerra Ofensiva"
 game_concept_offensive_war_opinion_desc:0 "Ser o principal atacante em uma guerra fará com que seus [vassals|E] gostem menos de você gradualmente após [GetDefine('NCharacterOpinion', 'OFFENSIVE_WAR_PENALTY_GRACE_PERIOD')] meses. [civil_wars|E] e [great_holy_wars|E] estão excluídas disso. Uma vez fora de tal guerra, a penalidade diminuirá lentamente."
 game_concept_offensive_war_opinion_short:0 "Guerra Ofensiva"
 game_concept_offer_vassalization:0 "Oferecer Vassalização"
 game_concept_offer_vassalization_desc:0 "Uma interação que oferece [vassalage|E] a um [ruler|E] [independent|E] de menor [title_rank|E] de maneira pacífica, adicionando-os ao reino."
 game_concept_offer_vassalization_interaction:0 "Interação Oferecer Vassalização"
 game_concept_opinion:0 "Opinião"
 game_concept_opinion_desc:0 "Todo personagem tem uma $game_concept_opinion$ de mão única sobre todos os outros personagens, representada por um valor que pode ir de #N -100#! até #P +100#!.\n\nA opinião que outro personagem tem sobre você é de importância crucial, isso irá definir seu comportamento com você!\n\nVocê deve dar uma atenção especial para as Opiniões de seus [powerful_vassals|E], [spymaster|E] e [spouse|E]."
 game_concept_opinion_i:0 "@opinion_icon!"
 game_concept_opinions:0 "Opiniões"
 game_concept_opportunistic_schemes:0 "Esquemas Oportunistas"
 game_concept_organize_levies:0 "$task_organize_levies$"
 game_concept_organize_levies_desc:0 "Uma [councillor_task|E] realizada pelo [marshal|E]. Ela aumenta o tamanho da [garrison|E] e a taxa de reforço de [levy|E] no [realm|E] do [liege|E] do conselheiro."
 game_concept_organized:0 "Organizado"
 game_concept_organized_desc:0 "Uma fé Organizada tem uma hierarquia religiosa. O culto e as práticas são mais organizados e as escrituras são formalizadas.\n\nAs fés de [GetReligionFamily('rf_pagan').GetName] com a doutrina [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] podem se tornar Organizadas através de reformas, enquanto outras Fés são sempre consideradas Organizadas."
 game_concept_papal_recipient:0 "Candidato Favorecido"
 game_concept_papal_recipient_desc:0 "Se o alvo principal de uma [great_holy_war|E] já estiver sob controle ou reivindicado por um mebro da fé agressora, eles irão ser considerados o destinatário legítimo do título sendo disputado, a não ser que o [Concept( 'war_contribution', 'Contribuidor' )|E] principal decida dar preferência ao seu [beneficiary|E]."
 game_concept_paper_zoom:0 "$ZOOM_LEVEL_PAPER_MAP$"
 game_concept_paper_zoom_desc:0 "$ZOOM_LEVEL_PAPER_MAP_TOOLTIP$"
 game_concept_partition_share:0 "Compartilhamento de Partição"
 game_concept_partition_share_desc:0 "Sob qualquer [succession_law|E] com múltiplos [realm_heirs|E], um $game_concept_partition_share$ de um [character|E] é quais [titles|E] esse herdeiro particular irá herdar após a [succession|E]. Normalmente, isso significa dividir entre os filhos de um [ruler|E], ou, raramente, seus irmãos.\n\nTipicamente, dependendo do tipo de $game_concept_succession$ em vigor, $game_concept_titles$ podem ser divididos igualmente entre diferentes [realms|E], igualmente dentro do mesmo $game_concept_realm$, ou dados principalmente para o principal $game_concept_heir$ enquanto o restante é dividido igualmente entre quaisquer outros $game_concept_heirs$."
 game_concept_patrilineal:0 "Patrilinear"
 game_concept_patrilineal_desc:0 "Em um [marriage|E] $game_concept_patrilineal$, filhos serão nascidos na [house|E] de seu pai."
 game_concept_pax_romana_invasion_casus_belli:0 "Casus Belli da Pax Romana"
 game_concept_pax_romana_invasion_casus_belli_desc:0 "Um poderoso [casus_belli|E] disponível apenas para o [ruler|E] do Império Romano com o propósito de inaugurar uma nova era de [Glossary( 'Pax Romana', 'PAX_ROMANA_GLOSS' )].\n\nPode visar um [title|E] de [empire|E] inteiro de uma só vez e permite uma rápida expansão por grandes extensões de terra."
 game_concept_peace:0 "Paz"
 game_concept_peace_desc:0 "[wars|E] podem ter três tipos diferentes de $game_concept_peace$: [victory|E], [defeat|E], ou [white_peace|E].\n\nAo atingir #V 100%#! de [war_score|E], o outro lado não será capaz de negar um Pedido de Paz e será obrigado a aceitar a [defeat|E].\n\nOs Efeitos de uma $game_concept_victory$ ou $game_concept_defeat$ dependem inteiramente no tipo de [casus_belli|E] que foi utilizado ao declarar a guerra e seus [war_targets|E] associados."
 game_concept_peace_offer:0 "Oferta de Paz"
 game_concept_peace_offers:0 "Ofertas de Paz"
 game_concept_peasant_faction:0 "$peasant_faction$"
 game_concept_peasant_faction_desc:0 "A $game_concept_peasant$ é composta por [counties|E] com baixa [county_opinion|E]. Ao contrário de outras [factions|E], esta sempre se revoltará mesmo que o [faction_military_power|E] seja baixo, pois os camponeses são geralmente otimistas e analfabetos... Revoltas bem-sucedidas de camponeses diminuirão significativamente o Controle em seu [realm|E]."
 game_concept_peasant_factions:0 "Facções Camponesas"
 game_concept_peasant_militia:0 "Milícia Camponesa"
 game_concept_peasant_militia_desc:0 "As Milícias Camponesas são [men_at_arms|E] armadas com forcados e lanças.\n\nEmbora cada tipo de Milícia seja único, elas geralmente [counters|E] a [heavy_cavalry|E] e [light_cavalry|E], e por sua vez são contra-atacadas por [heavy_infantry|E].\n\nAs Milícias Camponesas são fortes em [terrain|E] montanhoso e fértil."
 game_concept_peasant_militias:0 "Milícias Camponesas"
 game_concept_perk:0 "Benefício"
 game_concept_perk_desc:0 "Os benefícios são vantagens desbloqueáveis que fornecem muitos efeitos úteis e interessantes. Eles são desbloqueados selecionando um [focus|E] dentro de um [lifestyle|E] e gastando a forma de [experience|E] associada #weak (por exemplo, $game_concept_experience$ de Intriga se você deseja desbloquear um $game_concept_perk$ no $game_concept_intrigue_lifestyle$.)#!"
 game_concept_perks:0 "Benefícios"
 game_concept_perpetual_hook:0 "Gancho Perpétuo"
 game_concept_perpetual_hook_desc:0 "Um $game_concept_perpetual_hook$ é um [hook|E] que você pode ter em um personagem que lhe deve um favor ou que você manipulou para fazer sua vontade.\n\nEles não podem ser usados para forçar alguém a se tornar seu [agent|E] em [GetScheme('murder').GetTypeName] e não fornecem um benefício passivo #weak (para isso, um [strong_hook|E] é necessário.)#!\n\n$game_concept_perpetual_hooks$ não são gastos quando usados, mas sim entram em tempo de recarga antes de poderem ser usados novamente.#!"
 game_concept_perpetual_hooks:0 "Ganchos Perpétuos"
 game_concept_personal:0 "Pessoal"
 game_concept_personal_scheme:0 "Esquema Pessoal"
 game_concept_personal_scheme_desc:0 "$game_concept_personal_schemes$ são [schemes|E] que têm como objetivo induzir um status entre o [scheme_owner|E] e o [scheme_target|E].\n\nExemplos de $game_concept_personal_schemes$ são:\n$BULLET_WITH_TAB$[GetScheme('sway').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('befriend').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('seduce').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('elope').GetTypeName]"
 game_concept_personal_schemes:0 "Esquemas Pessoais"
 game_concept_personalities:0 "Personalidades"
 game_concept_personality:0 "Personalidade"
 game_concept_personality_desc:0 "Personagens agirão contra você e outros de acordo com sua Personalidade, que é determinada principalmente pelos seu [personality_traits|E]."
 game_concept_personality_i:0 "@personality_icon!"
 game_concept_personality_trait:0 "Traço de Personalidade"
 game_concept_personality_trait_desc:0 "Um $game_concept_personality_trait$ é um [trait|E] que determina a visão de mundo de uma pessoa e as ações que ela é mais propensa a tomar. Eles também afetam a [opinion|E] dos outros. Alguém pode tanto perder quanto ganhar novos traços ao longo da vida. Agir contra sua própria Personalidade causa [stress|E]."
 game_concept_personality_traits:0 "Traços de Personalidade"
 game_concept_physical_trait:0 "Traço Físico"
 game_concept_physical_trait_desc:0 "Um $game_concept_physical_trait$ é um descritor de um [trait|E] físico ligado à aparência ou comportamento e ao nível de intelecto que um personagem tem. Muitas características físicas afetam o quão [attracted|E] os outros estão por eles.\n\nEles são frequentemente [congenital|E], assim sendo ganhos no nascimento e permanentes."
 game_concept_physical_traits:0 "Traços Físicos"
 game_concept_piety:0 "Piedade"
 game_concept_piety_desc:0 "$game_concept_piety$ representa a virtude de um Personagem.\n\nAgir piedosamente (de acordo com as [doctrines|E] da sua [faith|E]) aumentará a Piedade de um Personagem, como realizar uma [GetActivityType('activity_pilgrimage').GetName].\n\nA Piedade pode ser gasta em várias questões religiosas, dependendo da [government_form|E], das Doutrinas, etc.\n\nCada vez que um Personagem ganha $game_concept_piety$, ele também avança para o próximo [piety_level|E]."
 game_concept_piety_experience:0 "Devoção"
 game_concept_piety_experience_desc:0 "A cada ponto de Devoção o personagem aumenta seu progresso para o próximo [piety_level|E]. Quando um personagem ganha [piety|E] ele também ganha um valor igual em Devoção."
 game_concept_piety_i:0 "[GetLocalPlayerPietyTextIcon]"
 game_concept_piety_level:0 "Nível de Devoção"
 game_concept_piety_level_desc:0 "O $game_concept_piety_level$ de um Personagem é uma medida de quão virtuoso e devoto ele é, bem como de sua posição entre outros membros de sua [faith|E].\n\nCada vez que um Personagem ganha [piety|E], ele também progride em direção ao próximo Nível de Devoção.\n\n[AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'additional_mandala_government_piety_levels' )]\n\nOs Níveis são:\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'piety_level_5' ).GetNameWithTooltip|L][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_additional_piety_level_desc' )]"
 game_concept_piety_level_impact:0 "Impacto do Nível de Devoção"
 game_concept_piety_level_impact_desc:0 "O Impacto do Nível de Devoção aumenta ou diminui os [modifiers|E] obtidos do seu [piety_level|E] atual."
 game_concept_piety_levels:0 "Níveis de Devoção"
 game_concept_pilgrimage:0 "Peregrinação"
 game_concept_pilgrimage_desc:0 "Personagens de várias [faiths|E] podem optar por se envolver em uma [activity|E] para fazer uma $game_concept_pilgrimage$ a um [holy_site|E]. Cada [holy_site|E] tem um período de graça individual antes que você possa visitá-lo novamente. \n\nEssa jornada pode estar repleta de oportunidades e perigos, mas ao alcançar seu destino, os personagens ganharão [piety|E] e podem receber outras recompensas."
 game_concept_pilgrimages:0 "Peregrinações"
 game_concept_pious:0 "Piedoso"
 game_concept_pious_builder_i:0 "@pious_builder_icon!"
 game_concept_pious_building:0 "Edificação Piedosa"
 game_concept_pious_building_desc:0 "As $game_concept_pious_buildings$ são [buildings|E] cuja função principal é aumentar a [piety|E] de sua propriedade."
 game_concept_pious_buildings:0 "Edificações Piedosas"
 game_concept_playdate:0 "$activity_playdate$"
 game_concept_playdate_desc:0 "Uma [activity|E] onde governantes e cortesãos abaixo da idade de [EmptyScope.ScriptValue('less_than_two_years_to_adulthood_value')|0V] se reúnem para brincar e esquecer a monotonia do dia.\n\nOs participantes perderão [stress|E] e aumentarão sua [opinion|E] sobre o anfitrião. Também pode haver várias outras consequências ao reunir tantas crianças juntas.\n\nUm [ruler|E] convidará seu [liege|E] e seus [vassals|E] (junto com vários [courtiers|E]) para um $activity_playdate$."
 game_concept_player_heir:0 "Herdeiro do Jogador"
 game_concept_player_heir_desc:0 "O $game_concept_player_heir$ é o [heir|E] que o jogador continuará controlando em [succession|E].\n\nO $game_concept_player_heir$ geralmente é o mesmo que o [primary_heir|E], mas se a [succession_law|E] do seu [primary_title|E] determinar que ele deva ir para um personagem fora da sua [dynasty|E], você passará a controlar o herdeiro dinástico do seu título de segunda categoria mais alta (ou terceiro, quarto, etc.).\n\nEsta situação é comum quando seu $game_concept_player_heir$ é removido sob uma Lei de Sucessão Eletiva. Se você for [house_head|E] de uma [noble_family|E] em um [realm|E] [administrative|E], pode perder seu Reino para os Herdeiros Primários fora da sua [house|E], mas manter seu Título de Família Nobre."
 game_concept_point_of_interest:0 "Ponto de Interesse"
 game_concept_point_of_interest_desc:0 "Um $game_concept_point_of_interest$ é um local no mundo que vale a pena visitar. Quando você visita esse local pela primeira vez, você obterá os benefícios associados a ele."
 game_concept_points_of_interest:0 "Pontos de Interesses"
 game_concept_political:0 "Político"
 game_concept_political_scheme:0 "Esquema Político"
 game_concept_political_scheme_desc:0 "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'game_concept_political_scheme_desc_tgp', 'game_concept_political_scheme_desc_default' )]"
 game_concept_political_scheme_desc_default:0 "$game_concept_political_schemes$ inclui todos os [schemes|E] usados exclusivamente por [administrative_governments|E]. Eles incluem:\n$BULLET_WITH_TAB$[GetScheme('challenge_status').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('depose').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('expand_power_base').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('generate_claim').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('promote').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('slander').GetTypeName]\n"
 game_concept_political_scheme_desc_tgp:0 "$game_concept_political_schemes$ inclui [schemes|E] que são principalmente de natureza política e burocrática, comumente usados pelos tipos [administrative|E] e [mandala_government|E].\n\nEsquemas Políticos Administrativos:\n$BULLET_WITH_TAB$[GetScheme('challenge_status').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('depose').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('expand_power_base').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('generate_claim').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('promote').GetTypeName]\n$BULLET_WITH_TAB$[GetScheme('slander').GetTypeName]\n\nEsquemas Políticos Mandala:\n$BULLET_WITH_TAB$[GetScheme('coerce_tributary').GetTypeName]\n"
 game_concept_political_schemes:0 "Esquemas Políticos"
 game_concept_political_zoom:0 "$ZOOM_LEVEL_POLITICAL$"
 game_concept_political_zoom_desc:0 "$ZOOM_LEVEL_POLITICAL_TOOLTIP$"
 game_concept_popular_faction:0 "$populist_faction$"
 game_concept_popular_faction_desc:0 "A $game_concept_popular_faction$ é composta por condados com baixa [county_opinion|E] que compartilham um elemento em comum, como [culture|E] ou [faith|E]. Eles buscam se libertar e escolher um novo [ruler|E] com base em sua cultura ou fé. Esse tipo de levante é geralmente muito perigoso."
 game_concept_popular_factions:0 "Facções Populistas"
 game_concept_power_sharing:0 "Partilha de Poder"
 game_concept_powerful_vassal:0 "Vassalo Poderoso"
 game_concept_powerful_vassal_desc:0 "$game_concept_powerful_vassals$ são um punhado de [vassals|E] com a maior quantidade de [soldiers|E] e maior [income|E]. Você precisa prestar muita atenção nestes vassalos, pois eles esperam ter uma cadeira em seu [council|E] e terão uma [opinion|E] significativamente menor se não tiverem uma.\n\nAlterar a [succession_law|E] requer que todos os $game_concept_powerful_vassals$ tenham uma [opinion|E] positiva sobre voce, serem [cowed|E] por você, ou estarem [Concept('imprisoned', 'Aprisionados')|E]."
 game_concept_powerful_vassal_possessive:0 "dos Vassalos Poderosos"
 game_concept_powerful_vassal_powerful:0 "Poderoso"
 game_concept_powerful_vassals:0 "Vassalos Poderosos"
 game_concept_predicted_difficulty:0 "Dificuldade Previsível"
 game_concept_predicted_scheme_difficulty:0 "Dificuldade Previsível do Esquema"
 game_concept_predicted_scheme_difficulty_desc:0 "Muitos fatores influenciam o sucesso de um [scheme|E], alguns dos quais não podem ser conhecidos até que ele comece e os [agents|E] sejam recrutados.\n\nEmbora qualquer $game_concept_scheme$ seja possível, muitos podem ser custosos.\n\nOs cinco níveis de dificuldade são:\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_excellent$ #WEAK — provavelmente fácil, rápido e silencioso#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_high$ #WEAK — esforço mínimo necessário#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_medium$ #WEAK — alguns subornos podem ser necessários#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_low$ #WEAK — o sucesso será caro#!\n$EFFECT_LIST_BULLET$$scheme_odds_prediction_level_abysmal$ #WEAK — o sucesso é improvável e caro#!"
 game_concept_preferred_heir:0 "Herdeiro Preferido"
 game_concept_preferred_heirs:0 "Herdeiros Preferidos"
 game_concept_preparation_phase:0 "Fase de Preparação"
 game_concept_preparation_phase_desc:0 "A $game_concept_preparation_phase$ é o tempo antes de uma [undirected_great_holy_war|E] ser declarada.\n\nDurante este tempo, [rulers|E] da [faith|E] atacante podem escolher prometer apoio militar para a guerra e/ou doar para o [war_chest|E].\n\nUm cronômetro fará uma contagem regressiva até que a $game_concept_preparation_phase$ termine, aonde à guerra será declarada.\n\nGovernantes das [religions|E] defensoras podem optar por fazer uma contra-promessa de suporte militar durante este tempo, dando uma visão geral da força dos dois lados."
 game_concept_pressed:0 "Pressionada"
 game_concept_pressed_claim:0 "Reivindicação Pressionada"
 game_concept_pressed_claim_desc:0 "[claims|E] $game_concept_pressed$ são consideradas legalmente fortes, e são herdades como [unpressed_claims|E] pelos filhos do [claimant|E]."
 game_concept_pressed_claim_i:0 "@pressed_claim!"
 game_concept_pressed_claims:0 "Reivindicações Pressionadas"
 game_concept_prestige:0 "Prestígio"
 game_concept_prestige_desc:0 "$game_concept_prestige$ representa a fama de um Personagem e sua posição social.\n\nPrestígio pode ser gasto em diversos assuntos mundanos dependendo da [government_form|E], das [doctrines|E], etc.\n\nA cada vez que um Personagem recebe Prestígio, ele também constribui para o seu próximo [prestige_level|E]."
 game_concept_prestige_experience:0 "Fama"
 game_concept_prestige_experience_desc:0 "Cada ponto de Fama que um personagem recebe aumenta seu progresso para o seu próximo [prestige_level|E]. Quando um personagem recebe [prestige|E] ele também ganha um valor igual em Fama."
 game_concept_prestige_experience_i:0 "$game_concept_prestige_i$"
 game_concept_prestige_i:0 "@prestige_icon!"
 game_concept_prestige_level:0 "Nível de Fama"
 game_concept_prestige_level_desc:0 "O $game_concept_prestige_level$ de um Personagem mede sua reputação geral e como são bem vistos por todos.\n\nCada vez que um Personagem ganha [prestige|E], ele também avança para o próximo $game_concept_prestige_level$.\n\nOs níveis são:\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_0' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_1' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_2' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_3' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_4' ).GetNameWithTooltip|L]\n$EFFECT_LIST_BULLET$[GetModifier( 'prestige_level_5' ).GetNameWithTooltip|L]"
 game_concept_prestige_level_impact:0 "Impacto do Nível de Fama"
 game_concept_prestige_level_impact_desc:0 "O Impacto do Nível de Fama aumenta ou diminui os [modifiers|E] obtidos do seu [prestige_level|E] atual."
 game_concept_prestige_levels:0 "Níveis de Fama"
 game_concept_prestigious:0 "Prestigioso"
 game_concept_prevented_murder:0 "Assassinato Prevenido"
 game_concept_prevented_murder_desc:0 "Raramente, certas situações na vida do [scheme_target_target|E] de um [GetScheme('murder').GetTypeName] podem fazer com que o [scheme|E] falhe nas etapas finais de sua execução.\n\nIsso substitui a [success_chance|E].\n\n#WEAK Exemplos incluem a intervenção de um guarda-costas, um provador de comida, uma escudeira ou um animal de estimação leal.#!"
 game_concept_prevented_murder_prevent:0 "Prevenir"
 game_concept_primary_heir:0 "Herdeiro Primário"
 game_concept_primary_heir_desc:0 "O $game_concept_primary_heir$ é o personagem que irá receber o [primary_title|E] de um [ruler|E] em uma [succession|E]. Isso é normalmente — mas não sempre — o mesmo personagem que o [player_heir|E]."
 game_concept_primary_heir_possessive:0 "do Herdeiro Primário"
 game_concept_primary_heirs:0 "Herdeiros Primários"
 game_concept_primary_spouse:0 "Cônjuge Primário"
 game_concept_primary_spouse_desc:0 "Nas [faiths|E] com [GetFaithDoctrine('doctrine_polygamy').GetBaseName], [rulers|E] devem escolher um de seus [spouses|E] para ser seu $game_concept_primary_spouse$. O $game_concept_primary_spouse$ de um governante recebe um bônus de [fertility|E], e um aumento de [opinion|E] sobre ele, e pode servir no [council|E]."
 game_concept_primary_title:0 "Título Primário"
 game_concept_primary_title_desc:0 "O $game_concept_primary_title$ do [ruler|E] é o seu [title|E] de maior nível que eles mais se identificam como, determinando seu Brasão e o seu [realm|E].\n\nSe você controla múltiplos títulos do mesmo nível, você pode escolher qual será o seu $game_concept_primary_title$."
 game_concept_primary_titles:0 "Títulos Primários"
 game_concept_prince_elector:0 "Príncipe-Eleitor"
 game_concept_prince_elector_desc:0 "$game_concept_prince_electors$ são os #V 7#! [electors|E] que selecionam um [title_heir|E] junto com o Imperador sob a [GetLaw('princely_elective_succession_law').GetName] [succession_law|E] usada por [SelectLocalization( GetPlayer.IsValid, 'game_concept_prince_elector_desc_ingame', 'e_hre' )].\n\n[holders|E] de #V 7#! preferidos [titles|E] são priorizados como $game_concept_prince_electors$. Esses Títulos são selecionados quando o Império é criado.\n\nSe um Título de $game_concept_prince_elector$ for destruído, não for mantido por um [vassal|E] Imperial [de_jure|E], for mantido por outro $game_concept_prince_elector$, ou se a [religion|E] do Detentor diferir da do Imperador, outro Título de De Jure mantido por um Vassalo Imperial direto ou [independent_ruler|E] será selecionado com base nestes critérios:\n$EFFECT_LIST_BULLET$[rulers|E] de [faith|E] e [culture|E] do Imperador são favorecidos\n$EFFECT_LIST_BULLET$[theocratic|E] e [feudal|E] Governantes são favorecidos\n\n#help Títulos Preferidos são listados na visualização de Eleição#!"
 game_concept_prince_elector_desc_ingame:0 "[GetTitleByKey('e_hre').GetDefinitiveName]"
 game_concept_prince_electors:0 "Príncipes-Eleitores"
 game_concept_prison:0 "Prisão"
 game_concept_prison_desc:0 "[rulers|E] [landed|E] podem manter outros Personagens como Prisioneiros, seja em sua [dungeon|E] ou sob uma simples [house_arrest|E]. Em um [camp|E], todos os Prisioneiros são mantidos na [stockade|E]. Personagens correm o risco de serem presos em [battle|E] ou ao final de um [siege|E].\n\nPersonagens também podem prender qualquer um dentro de seu próprio [realm|E] ou [camp|E]. No entanto, isso é visto como [tyrannical|E], a menos que o Personagem seja culpado de um [crime|E].\n\nPrisioneiros estão à sua mercê e podem ser [Concept('executed', 'Executados')|E], [Concept('tortured', 'Torturados')|E], Resgatados ou simplesmente Libertados."
 game_concept_prisoner:0 "Prisioneiro"
 game_concept_prisoner_of_war:0 "Prisioneiro de Guerra"
 game_concept_prisoner_of_war_desc:0 "Um $game_concept_prisoner_of_war$ é um [prisoner|E] capturado durante uma [war|E], mas que não é importante o suficiente para fornecer aos capturadores [war_score|E].\n\n[valuable_prisoners|E] são libertados quando a guerra termina, ao contrário dos prisioneiros de guerra, mas ainda podem ser resgatados em troca de libertação."
 game_concept_prisoners:0 "Prisioneiros"
 game_concept_prisoners_of_war:0 "Prisioneiros de Guerra"
 game_concept_prisons:0 "Prisões"
 game_concept_privation:0 "Privação"
 game_concept_privation_desc:0 "Quando um [camp|E] está estacionário, eles podem se sustentar trocando comida por pequenos serviços, caçando, forrageando ou pescando onde for permitido e possível, e, em geral, #EMP mal#! conseguindo manter-se na situação de abastecimento.\n\nAssim que começam a [traveling|E], eles dependem inteiramente de suas $game_concept_provisions$ para sobreviver, já que não podem se mover e obter comida suficiente ao mesmo tempo. À medida que as $game_concept_provisions$ se esgotam (e acabam #EMP totalmente#!), os ânimos se exaltam e os [followers|E] passam fome.\n\nQuando isso acontece, [characters|E] começarão a deixar o $camp$, [modifiers|E] negativos são aplicados cada vez mais, e aqueles que permanecem acabarão se revoltando ou morrendo."
 game_concept_prize:0 "Prêmio"
 game_concept_prize_desc:0 "Os $game_concept_prizes$ são [artifacts|E] concedidos aos vencedores dos [GetActivityType( 'activity_tournament' ).GetName] [contests|E] com um único vencedor.\n\nA qualidade do $game_concept_prize$ depende das opções escolhidas pelo [activity_host|E] e pela [era|E]."
 game_concept_prizes:0 "Prêmios"
 game_concept_progress_to_victory:0 "Progresso para a Vitória"
 game_concept_progress_to_victory_desc:0 "Uma abstração da sua probabilidade de vencer um determinado [contest|E] em relação aos outros [contestants|E], com base nas suas [skills|E], [health|E] e [traits|E]. Por exemplo, um [GetTrait('giant').GetName( GetNullCharacter )] com alta [prowess|E] tem uma vantagem em concursos físicos lutados a pé, como Luta.\n\nUm mínimo de $game_concept_progress_to_victory$ é necessário para garantir a [contest_qualification|E] em um [contest|E]. Visite [locales|E] para oportunidades de melhorar suas chances e sabotar seus oponentes.\n\nO quadro de #V Líderes#! do Torneio exibe o $game_concept_progress_to_victory$ atual de todos os [contestants|E]."
 game_concept_progress_to_victory_locale_tt:0 "Visite [locales|E] para oportunidades de melhorar suas chances ou sabotar seus oponentes."
 game_concept_promote_culture:0 "$task_promote_culture$"
 game_concept_promote_culture_desc:0 "$game_concept_promote_culture$ é uma [councillor_task|E] realizada pelo [steward|E].\n\nMuda a [culture|E] de um [county|E] para coincidir com a $game_concept_culture$ do seu governante."
 game_concept_promote_other_culture_development_decision:0 "Decisão de promover o desenvolvimento de outras culturas"
 game_concept_promote_other_culture_development_decision_desc:0 "Uma [decision|E] que permite melhorar o [development|E], o [control|E], os custos da [building|E] e a [advantage|E] defensiva em [counties|E] de diferentes [cultures|E] com uma [cultural_acceptance|E] de #V 75%#! ou mais.\n\nTomar a decisão também aumentará sua [prestige|E] [prestige_i] e [levies|E].\n\nTodos os condados no [realm|E] são afetados. O custo em [gold|E] aumenta com o número de condados afetados."
 game_concept_promoting_cultural_acceptance:0 "Promovendo a Aceitação Cultural"
 game_concept_provision:0 "Provisão"
 game_concept_provisions:0 "Provisões"
 game_concept_provisions_desc:0 "$game_concept_provisions$ representam a quantidade total de comida, água e abrigo que um [camp|E] pode fornecer.\n\n$game_concept_camps$ perdem $game_concept_provisions$ enquanto se movem dos Locais. A quantidade exata é afetada pelo tamanho de seus [men_at_arms|E], pelo [terrain|E] atravessado, e pelos [officers|E] atualmente contratados.\n\nSeguidores do $game_concept_camp$ com poucas $game_concept_provisions$ começarão a sofrer eventos de [privation|E]: começando com [characters|E] rapidamente perdendo [opinion|E] de seu líder, escalando rapidamente para fome e morte.\n\n#WEAK $game_concept_provisions$ podem ser reabastecidas enquanto estão estacionárias, solicitando-as de [contact_list_contacts|E], tomando uma [decision|E], ou como recompensas de [task_contract|E].#!"
 game_concept_provisions_i:0 "@provisions_icon!"
 game_concept_prowess:0 "Bravura"
 game_concept_prowess_i:0 "@skill_prowess_icon!"
 game_concept_prowess_skill:0 "Habilidade de Bravura"
 game_concept_prowess_skill_desc:0 "$game_concept_prowess$ é uma [skill|E] que reflete a aptidão do Personagem em combate pessoal.\n\nUma Habilidade de Bravura alta significa que ele tem mais chances de sobreviver e se sair bem tanto como [knights|E] em [battles|E] quanto em [single_combat_duel_plural|E].\n\nCada ponto de Bravura concede a um Cavaleiro:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$"
 game_concept_pursuit:0 "Perseguição"
 game_concept_pursuit_desc:0 "Um [army|E] vitorioso aumenta a quantidade de [casualties|E] que causam no período de [aftermath|E] de uma [battle|E] determinado pelo valor combinado de $game_concept_pursuit$ do $game_concept_army$, convertendo [routed_soldiers|E] em [dead_soldiers|E]."
 game_concept_raid:0 "Saque"
 game_concept_raid_desc:0 "[armies|E] podem ser levantadas como $game_concept_raiders$ a partir dos [rally_points|E]. $game_concept_raiders$ podem se mover para terras vizinhas e saqueá-las em busca de [gold|E].\n\nPara $game_concept_raid$, um Exército de Saque deve parar em uma [holding|E] pertencente a um [ruler|E] estrangeiro e escolher começar o Saque — ao fazer isso, eles ficarão presos ao Saque por algum tempo, após o qual receberão Ouro e saquearão a Propriedade.\n\nO Ouro será armazenado no Exército, e só será adicionado ao tesouro quando chegarem em casa. Se você derrotar um Exército de Saque carregando Ouro, você o tomará, e eles não poderão saquear você por um tempo.\n\nApenas alguns Governantes estão autorizados a $game_concept_raid$, sendo os mais notáveis os Governantes [Concept('tribal', 'Tribais')|E] e [GetGovernment( 'nomad_government' ).GetName].\n\n[raid_intents|E] específicos podem ser definidos para obter diferentes recompensas."
 game_concept_raid_i:0 "@raid_icon!"
 game_concept_raided:0 "Saqueado"
 game_concept_raider:0 "Saqueador"
 game_concept_raiders:0 "Saqueadores"
 game_concept_raiding:0 "Saqueando"
 game_concept_raids:0 "Saques"
 game_concept_rally_point:0 "Ponto de Encontro"
 game_concept_rally_point_desc:0 "Um $game_concept_rally_point$ é um campo de reunão para as [levies|E] e os [men_at_arms|E] sobre seu comando.\n\nEm tempos de [war|E], você pode chamar seus [soldiers|E] em um Ponto de Encontro e criar um [army|E].\n\nAs Milícias associadas a um Ponto de Encontro devem vir seja do seu [domain|E] ou dos seus [vassals|E]. Pontos de Encontro podem ser reorganizados, divididos e fundidodos como você desejar."
 game_concept_rally_points:0 "Pontos de Encontro"
 game_concept_range:0 "Alcance"
 game_concept_rank:0 "Coroa"
 game_concept_ranks:0 "Coroas"
 game_concept_rarity:0 "Raridade"
 game_concept_real_father:0 "Pai Verdadeiro"
 game_concept_real_father_desc:0 "O pai verdadeiro de um personagem. Para a maioria dos personagens, este é o personagem amplamente reconhecido com seu pai, mas para bastardos secretos, esta é uma pessoa diferente."
 game_concept_realm:0 "Reino"
 game_concept_realm_capital:0 "Capital do Reino"
 game_concept_realm_capital_desc:0 "Uma $game_concept_realm_capital$ é a [holding|E] onde um [ruler|E] e sua [court|E] reside. Esta Propriedade tem um bônus de [tax|E], e será sempre herdada pelo [primary_heir|E].\n\n[occupying|E] a Capital de um Reino inimigo irá dar uma quantidade significativa de [war_score|E] e pode às vezes lhe permitir [imprison|E] membros da família inimiga."
 game_concept_realm_capital_possessive:0 "da Capital do Reino"
 game_concept_realm_capitals:0 "Capitais dos Reinos"
 game_concept_realm_desc:0 "Um $game_concept_realm$ é toda a terra que um [ruler|E] controla, seja diretamente ou por meio de [vassals|E] (em contraste a um [domain|E], que é apenas as [holdings|E] pertencentes ao Governante pessoalmente)."
 game_concept_realm_heir:0 "Herdeiro do Reino"
 game_concept_realm_heir_desc:0 "O Herdeiro do Reino é um dos [heirs|E] de um [realm|E], e irá receber todas ou uma parte dos [titles|E] que o [ruler|E] atual tiver ao morrer.\n\nUm Reino pode ter um ou mais Herdeiros do Reino dependendo de sua [succession_law|E]."
 game_concept_realm_heirs:0 "Herdeiros do Reino"
 game_concept_realm_law:0 "Lei do Reino"
 game_concept_realm_law_desc:0 "Leis que são aplicada ao reino deste personagem, como o nível da [crown_authority|E] ou [tribal_authority|E]."
 game_concept_realm_possessive:0 "do Reino"
 game_concept_realm_priest:0 "Padre do Reino"
 game_concept_realm_priest_desc:0 "O $game_concept_realm_priest$ é o [councillor|E] encarregado de assuntos espirituais de [faiths|E] e religiosos com base na [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_temporal').GetBaseName].\n\nAo contrário do seu equivalente do [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] ([court_chaplains|E]), $game_concept_realm_priests$ automaticamente [Concept('lease', 'Alugam')|E] todas as [temple_holdings|E] no [domain|E] de um [ruler|E], e recebem uma porção dos [taxes|E] e [levies|E] de [vassals|E] $game_concept_realm_priests$.\n\n$game_concept_realm_priests$ fornecem Milícias e Impostos para seu [liege|E] se eles tiverem uma opinião positiva dele. Quanto maior a [opinion|E] sobre seu [liege|E], mais irão fornecer.\n\n$game_concept_realm_priests$ com uma Opinião baixa sobre seu senhor feudal não irão fornecer Milícias e Impostos, e podem causar problemas."
 game_concept_realm_priest_possessive:0 "do Padre do Reino"
 game_concept_realm_priests:0 "Padres do Reino"
 game_concept_realm_size:0 "Tamanho do Reino"
 game_concept_realm_size_desc:0 "O $game_concept_realm_size$ de um Personagem é o número de [counties|E] sob seu controle ou de seus [vassals|E]."
 game_concept_realms:0 "Reinos"
 game_concept_rebuilding:0 "Reconstruindo"
 game_concept_rebuilt:0 "Reconstruída"
 game_concept_rebuilt_building:0 "Edificação Reconstruída"
 game_concept_rebuilt_building_desc:0 "O ato de reconstruir uma edificação [ruined|E], restaurando-a à sua antiga glória."
 game_concept_recently_acquired_holding:0 "Propriedade Recentemente Adquirida"
 game_concept_recently_acquired_holding_desc:0 "[holdings|E] adquiridas no último ano que deixarem seu governante acima do seu [domain_limit|E] não causam penalidades à outras propriedades, mas também não lhe fornecem nada em [taxes|E] ou [levies|E]."
 game_concept_recently_acquired_holdings:0 "Propriedades Recentemente Adquiridas"
 game_concept_recently_disembarked:0 "Recentemente Desembarcado"
 game_concept_recently_disembarked_desc:0 "Um [army|E] irá se tornar '$game_concept_recently_disembarked$' sempre que desembarcar de uma [fleet|E]. Isto irá fazer com que o $game_concept_army$ sofra uma penalidade de [advantage|E] em [battles|E] por um certo tempo."
 game_concept_reform:0 "Reforma"
 game_concept_reformation:0 "Reforma"
 game_concept_reformation_desc:0 "O [culture_head|E] é capaz de mudar certas partes de sua [culture|E] por meio da $game_concept_reformation$. Esse é um processo que leva muito tempo e não pode ser interrompido uma vez iniciado. As partes reformáveis são:\n$BULLET_WITH_TAB$[traditions|E]\n$BULLET_WITH_TAB$[ethos|E]\n$BULLET_WITH_TAB$[martial_custom|E]"
 game_concept_refuse_conversion_crime:0 "Recusar Conversão"
 game_concept_refuse_conversion_crime_desc:0 "Recusar uma Conversão será considerado um [crime|E] se:\n$EFFECT_LIST_BULLET$O [character|E] que negar for da mesma [religion|E] que o $game_concept_character$ fazendo a demanda\n$EFFECT_LIST_BULLET$A $game_concept_religion$ tem [heresies|E]\n$EFFECT_LIST_BULLET$A [faith|E] do $game_concept_character$ fazendo a demanda é uma [faith_hostile|E] ou mais para a recusa da $game_concept_faith$ do $game_concept_character$"
 game_concept_refused_conversion_crime:0 "Recusou Conversão"
 game_concept_refusing_conversion_crime:0 "Recusando Conversão"
 game_concept_regencies:0 "Regências"
 game_concept_regencies_possessive:0 "Das Regências"
 game_concept_regency:0 "Regência"
 game_concept_regency_desc:0 "Uma Regência é uma forma especial de [diarchy|E] quando o [ruler|E] não consegue governar seu [realm|E] sozinho.\n\nGeralmente ocorre quando o Governante é [child|E], está [imprisoned|E], possui a [GetTrait('incapable').GetName(GetNullCharacter)] ou está envolvido em uma [activity|E] fora do seu Reino.\n\nUma $game_concept_regency$ que persiste por muito tempo pode se tornar uma [entrenched_regency|E]."
 game_concept_regency_possessive:0 "Da Regência"
 game_concept_regency_veto:0 "Veto de Diarquia"
 game_concept_regency_veto_desc:0 "Quando um [diarch|E] usa seus [diarch_powers|E], seu [liege|E] pode usar o Veto de Diarquia para impedi-lo, ao custo de [prestige|E]."
 game_concept_regent:0 "Regente"
 game_concept_regent_desc:0 "Um Regente é o nome dado a um [diarchy|E] durante uma [regency|E].\n\nUm [ruler|E] pode designar um Regente antes que uma Regência ocorra. Caso contrário, o candidato com a maior [regent_succession_score|E] é escolhido automaticamente."
 game_concept_regent_possessive:0 "Do Regente"
 game_concept_regent_succession_score:0 "Pontuação de Sucessão da Regência"
 game_concept_regent_succession_score_desc:0 "Em uma [regency|E], o próximo [regent|E] é escolhido com base no candidato com a maior $game_concept_regent_succession_score$.\n\nSe o [ruler|E] do [realm|E] designa um Regente, eles irão sobrepor a ordem de sucessão e serão escolhidos em seu lugar.\n\n#WEAK Isso favorece [characters|E] relacionados ao $game_concept_ruler$, especialmente [family|E] sem terras em sua [court|E] e os politicamente astutos.#!"
 game_concept_regents:0 "Regentes"
 game_concept_regents_possessive:0 "Dos Regentes"
 game_concept_regiment:0 "Regimento"
 game_concept_regiment_desc:0 "Um $game_concept_regiment$ é um grupo de [soldiers|E] de um único tipo (exemplo., arqueiros, infantes, ou [levies|E]). Apesar de $game_concept_levies$ serem organizadas em $game_concept_regiments$, os que realmente são interessantes são os [men_at_arms|E]."
 game_concept_regiments:0 "Regimentos"
 game_concept_region:0 "Região"
 game_concept_region_desc:0 "Uma região constitui uma área geográfica no mapa. Diferente de [de_jure|E], regiões nunca estão sujeitas a mudanças"
 game_concept_regions:0 "Regiões"
 game_concept_relation:0 "Relação Especial"
 game_concept_relation_desc:0 "$game_concept_relations$ são relações que um personagem possui e que não estão ligadas por laços familiares ou de [vassalage|E]. Essas $game_concept_relations$ se dividem em várias categorias diferentes, podendo conceder [character_modifiers|E] ao personagem envolvido e determinar que tipos de interações podem ocorrer entre eles.\n\nRelações Padrão:\n$EFFECT_LIST_BULLET$ [friend|E]\n$EFFECT_LIST_BULLET$ [lover|E]\n$EFFECT_LIST_BULLET$ [rival|E]\n$EFFECT_LIST_BULLET$ [guardian|E]\n$EFFECT_LIST_BULLET$ [ward|E]\n$EFFECT_LIST_BULLET$ [mentor|E]\n$EFFECT_LIST_BULLET$ [student|E]\n$EFFECT_LIST_BULLET$ [elder|E]\n$EFFECT_LIST_BULLET$ [disciple|E]\n\nRelações Avançadas:\n$EFFECT_LIST_BULLET$ [best_friend|E]\n$EFFECT_LIST_BULLET$ [soulmate|E]\n$EFFECT_LIST_BULLET$ [nemesis|E]\n\nRelações de Infância:\n$EFFECT_LIST_BULLET$ [bully|E]\n$EFFECT_LIST_BULLET$ [victim|E]\n$EFFECT_LIST_BULLET$ [crush|E]"
 game_concept_relations:0 "Relações Especiais"
 game_concept_relationship:0 "Relação Especial"
 game_concept_religion:0 "Religião"
 game_concept_religion_desc:0 "Uma $game_concept_religion$ pode consistir em várias denominações diferentes, chamadas de [faiths|E]. As religiões, por sua vez, pertencem a uma das quatro maiores [religious_families|E]; [GetReligionFamily('rf_abrahamic').GetName], [GetReligionFamily('rf_eastern').GetName], [GetReligionFamily('rf_sinitic').GetName] ou [GetReligionFamily('rf_pagan').GetName]."
 game_concept_religions:0 "Religiões"
 game_concept_religious_families:0 "Famílias Religiosas"
 game_concept_religious_family:0 "Família Religiosa"
 game_concept_religious_family_desc:0 "Uma $game_concept_religious_family$ é um grupo de [religions|E]. A $game_concept_religious_family$ afeta como as diversas [faiths|E] que fizerem parte desta família, veem umas as outras.\n\nA Família [GetReligionFamily('rf_abrahamic').GetName] condena [holy_wars|E] contra todos #weak (incluindo outros Abraâmicos)#!. Religiões estão sucetíveis à [heresy|E].\n\nA Família [GetReligionFamily('rf_eastern').GetName] apenas condena Guerras Sagradas controla outras Famílias Religiosas.\n\nA Família [GetReligionFamily('rf_pagan').GetName] condena Guerras Sagradas contra todos, mas Fés dentro de Religiões devem ser reformadas para terem acesso à elas."
 game_concept_religious_head_succession_law:0 "Lei de Sucessão do Chefe da Fé"
 game_concept_religious_head_succession_law_desc:0 "[rulers|E] que também forem [heads_of_faith|E] têm uma lei de [succession|E] adicional no reino, requerindo que seu [heir|E] seja da mesma [faith|E] que eles. Isso nunca pode ser alterado, e [titles|E] de $game_concept_head_of_faith$ não podem ter sua própria lei de [title_succession|E]. A única forma de remover este tipo de lei do reino é se uma força externa forçar a destruição do $game_concept_title$ do [head_of_faith|E]."
 game_concept_religious_head_succession_law_short:0 "Lei do Chefe da Fé"
 game_concept_religious_head_succession_laws:0 "Leis de Sucessão do Chefe da Fé"
 game_concept_religious_head_succession_laws_short:0 "Leis do Chefe da Fé"
 game_concept_religious_relations:0 "$task_religious_relations$"
 game_concept_religious_relations_desc:0 "Uma [councillor_task|E] realizada pelo [court_chaplain|E].\nAumenta a opinião dos líderes [Concept('theocratic', 'Teocráticos')|E] da mesma [faith|E] em relação ao personagem e aumenta o ganho mensal de [piety|E]."
 game_concept_renounce:0 "Renunciar"
 game_concept_renounce_desc:0 "[prisoners|E] podem ser soltos em troca de Renunciarem todas as suas [claims|E] sobre [titles|E] dentro do seu [realm|E].\n\nPorém, filhos do [holder|E] atual nunca irão perder suas Reivindicações enquanto o Proprietário ainda estiver vivo."
 game_concept_renounced:0 "Renunciou"
 game_concept_renown:0 "$game_concept_dynasty_prestige$"
 game_concept_republic:0 "República"
 game_concept_republic_desc:0 "$game_concept_republic_government$ é uma [government_form|E] não jogável, onde um cidadão eleito governa por toda a vida — a $game_concept_government_form$ dos burgueses e mercadores.\n\nOs [vassals|E] republicanos têm [obligations|E] estáticas que não podem ser alteradas, proporcionando sempre uma quantidade confiável e previsível de [levies|E] e [taxes|E]."
 game_concept_republic_government:0 "Governo Republicano"
 game_concept_republic_i:0 "@government_type_republic!"
 game_concept_republican:0 "Republicano"
 game_concept_republics:0 "Republicas"
 game_concept_retinue_maa:0 "Homens-de-Armas da Retinência"
 game_concept_retinue_maa_desc:0 "Alguns [accolade_types|E] dão acesso a [men_at_arms|E] especiais. Eles são desbloqueados ao ter um [acclaimed_knight|E] com progresso no [trait_level_track|E] para [GetTrait('tourney_participant').GetName( GetNullCharacter )] relevante ou um [commander_trait|E] correspondente.\n\nOs $game_concept_men_at_arms$ da Retinência são restritos a um único [regiment|E]. Eles são duas vezes mais eficazes contra outros $game_concept_men_at_arms$."
 game_concept_retirement_age:0 "$celestial_retirement_law$"
 game_concept_retirement_age_desc:0 "A [law|E] $celestial_retirement_law$ é a idade, determinada pelo [top_liege|E] do [realm|E], além da qual [governors|E] e [ministers|E] podem escolher se aposentar por meio de uma [decision|E] ou ser obrigados a fazê-lo através de uma [character_interaction|E], devido à sua iminente decrepitude e capacidade reduzida de servir."
 game_concept_retract:0 "Recolher"
 game_concept_retract_desc:0 "Com a [limited_crown_authority|E] ou maior, [rulers|E] podem $game_concept_retract$ o [vassal|E] de um Vassalo, mas a menos que o último esteja [imprisoned|E] isto é arriscado, pois o Vassalo pode negar e se rebelar.\n\nRecolhimento de Vassalo é considerado um ato [tyrannical|E] a não ser que o Alvo seja culpado de um [crime|E] severo."
 game_concept_retracted:0 "Recolhido"
 game_concept_retracting:0 "Recolhendo"
 game_concept_retraction:0 "Recolhimento"
 game_concept_retractions:0 "Recolhimentos"
 game_concept_retreat:0 "Recuar"
 game_concept_retreat_desc:0 "Um [army|E] irá $game_concept_retreat$ se ele perder uma [battle|E]. Exércitos também podem ser ordenados a $game_concept_retreat$ durante uma $game_concept_battle$. Enquanto Recuando, o $game_concept_army$ não poderá ser separado ou receber ordens de movimento."
 game_concept_retreats:0 "Recua"
 game_concept_revocation:0 "Revogação"
 game_concept_revocations:0 "Revogações"
 game_concept_revoke:0 "Revogar"
 game_concept_revoke_desc:0 "Com a [limited_crown_authority|E] ou maior, [rulers|E] podem $game_concept_revoke$ [titles|E] de seus [vassals|E], mas se o Vassalo não estiver [imprisoned|E] isto é uma proposta arrisacada, pois os Vassalo pode negar e se rebelar.\n\nRevogação de Título é considerada um ato [tyrannical|E] a não ser que o Vassalo seja culpado de algum [crime|E] severo."
 game_concept_revoke_title_reason:0 "Motivo de Revogação de Título"
 game_concept_revoke_title_reason_desc:0 "Um $game_concept_revoke_title_reason$ dá a um [liege|E] a oportunidade de revogar livremente um [title|E] de um súdito. Eles são mais frequentemente obtidos pelo súdito sendo um [criminal|E]."
 game_concept_revoke_title_reasons:0 "Motivos de Revogação de Título"
 game_concept_revoked:0 "Revogado"
 game_concept_revoking:0 "Revogando"
 game_concept_revolt:0 "Revolta"
 game_concept_revolting:0 "Revoltando"
 game_concept_revolts:0 "Revoltas"
 game_concept_rightful_liege:0 "Senhor Feudal Legítimo"
 game_concept_rightful_liege_desc:0 "$game_concept_rightful_liege_desc_part1$\n\n$game_concept_rightful_liege_desc_part2$"
 game_concept_rightful_liege_desc_part1:0 "O $game_concept_rightful_liege$ de um [vassal|E] é o [ruler|E] que carrega diretamento o [title|E] de [liege|E] [de_jure|E] do [primary_title|E] do $game_concept_vassal$. Se um $game_concept_vassal$ não estiver sob um $game_concept_rightful_liege$, eles irão contribuir menos em [taxes|E] e [levies|E] além de sofrer uma penalidade em [opinion|E] contra o seu $game_concept_liege$. Carregar um $game_concept_title$ de maior [title_tier|E] do mesmo $game_concept_de_jure$ resultará em penalidades reduzidas.\n\nUma exceção a isso são [dukes|E] que são parte da hierarquia de um [empire|E] $game_concept_de_jure$ e diretamente vassalizados ao seu $game_concept_emperor$, que ainda contrubui totalmente, exatamente como se o $game_concept_emperor$ carregasse o seu $game_concept_title$ $game_concept_de_jure$ de [kingdom|E]."
 game_concept_rightful_liege_desc_part2:0 "#weak Exemplo: O Conde de $c_dunbar$ é um vassalo direto do Rei da $k_england$. Já que o Rei não é Duque de $d_lothian$, Rei da $k_scotland$, ou Imperador da $e_britannia$, o Conde de $c_dunbar$ contribui apenas uma pequena quantidade de seus impostos e milícias.\n\nO Conde de $c_norfolk$ é também um vassalo direto do Rei da $k_england$. O rei não é dono do Ducado de $d_norfolk$, então o Conde também constribui de forma reduzida seus impostos e milícias. Porém, como a $k_england$ é o Reino De Jure de $c_norfolk$, o Conde de $c_norfolk$ ainda constribui significativamente mais com impostos e milícias para o Rei que o Conde de $c_dunbar$.#!"
 game_concept_rival:0 "Rival"
 game_concept_rival_desc:0 "Um $game_concept_rival$ é uma $game_concept_relation$ que indica ressentimento duradouro, senão ódio. \n$game_concept_rivals$ que verdadeiramente se odeiam podem se tornar [nemeses|E]."
 game_concept_rival_possessive:0 "Do Rival"
 game_concept_rivalries:0 "Rivalidades"
 game_concept_rivalry:0 "Rivalidade"
 game_concept_rivals:0 "Rivais"
 game_concept_rivals_possessive:0 "Dos Rivais"
 game_concept_roaming_longer_length_travel:0 "Caminhada Longa"
 game_concept_roaming_longer_length_travel_desc:0 "Caminhada Longa é uma [activity_option|E] para a [activity|E] [GetActivityType('activity_roaming').GetName]. O personagem passará um tempo significativamente maior na atividade e terá mais oportunidades."
 game_concept_roll:0 "Rolagem"
 game_concept_rolls:0 "Rolagens"
 game_concept_routed_soldiers:0 "Soldados Incapacitados"
 game_concept_routed_soldiers_desc:0 "Durante uma [battle|E], a maior parte das [casualties|E] são na verdade $game_concept_routed_soldiers$ que não estão mortos ou severamente feridos. Diferente de [dead_soldiers|E], estes [soldiers|E] irão sobreviver para lutar outro dia e retornar ao [army|E] quando a $game_concept_battle$ for concluída. Eles ainda podem ser mortos pelo lado vencedor durante a fase de [aftermath|E] de uma $game_concept_battle$, incluindo se o $game_concept_army$ [retreats|E] voluntariamente."
 game_concept_royal_tour:0 "Tour Real"
 game_concept_royal_tours:0 "Tours Reais"
 game_concept_ruined:0 "Arruinada"
 game_concept_ruined_building:0 "Edificação Arruinada"
 game_concept_ruined_building_desc:0 "Uma construção que foi $game_concept_ruined$ foi destruída, desfigurada ou saqueada por forças externas.\n\nEssas forças externas podem incluir coisas como:\n$BULLET_WITH_TAB$[natural_disasters|E][AddLocalizationIf( HasDlcFeature( 'all_under_heaven' ), 'game_concept_ruined_buildings_tgp' )]"
 game_concept_ruined_buildings_tgp:0 "\n$BULLET_WITH_TAB$Governantes [mandala|E] vingativos"
 game_concept_ruler:0 "Governante"
 game_concept_ruler_desc:0 "Um $game_concept_ruler$ é um [character|E] que tem ao menos um [title|E]."
 game_concept_rulerpossessive:0 "do Governante"
 game_concept_rulers:0 "Governantes"
 game_concept_scales_of_power:0 "Escalas de Poder"
 game_concept_scales_of_power_desc:0 "Durante a [power_sharing|E], o equilíbrio de poder entre o [liege|E] e seu [diarch|E] é medido nas $game_concept_scales_of_power$.\n\nÀ medida que as $game_concept_scales_of_power_scales$ se inclinam a favor do $game_concept_diarch$, eles desbloqueiam [diarch_powers|E] e podem adicionar custos às [diarch_affected_actions|E] do Senhor Feudal.\n\nÀ medida que se inclinam a favor do $game_concept_liege$, torna-se mais fácil para o Senhor Feudal encerrar a [diarchy|E].\n\nAs $game_concept_scales_of_power_scales$ podem ser inclinadas através de:\n$EFFECT_LIST_BULLET$Usando a interação $swing_scales_currency_interaction$ [character_interaction|E] contra a parte oposta\n$EFFECT_LIST_BULLET$Como $game_concept_diarch$, servindo bem seu $game_concept_liege$ (mesmo que de maneira cínica) nos eventos de [mandate|E]"
 game_concept_scales_of_power_scales:0 "Escalas"
 game_concept_scheme:0 "Esquema"
 game_concept_scheme_breach:0 "Violação do Esquema"
 game_concept_scheme_breach_desc:0 "Uma $game_concept_scheme_breach_short$ representa uma complicação em um [secret_scheme|e]. Quando um [scheme|e] é violado, sua [success_chance|e] é reduzida. A penalidade para $game_concept_success_chance$ aumenta para cada $game_concept_scheme_breach_short$ acumulativa. Uma vez que um $game_concept_scheme$ atinge #V 5#! $game_concept_scheme_breaches_short$, ele falhará automaticamente.\n\n#WEAK $game_concept_schemes$ também verificam seu $game_concept_secrecy$ quando são finalmente executados — as violações não têm efeito nisso, de nenhuma forma.#!"
 game_concept_scheme_breach_short:0 "Violação"
 game_concept_scheme_breaches:0 "Violações do Esquema"
 game_concept_scheme_breaches_short:0 "Violações"
 game_concept_scheme_countermeasure:0 "Foco em Contramedida"
 game_concept_scheme_countermeasure_countermeasure:0 "Contramedida"
 game_concept_scheme_countermeasure_countermeasures:0 "Contramedidas"
 game_concept_scheme_countermeasure_desc:0 "Quando você suspeita que um [scheme|e] está direcionado a você, pode fazer algo a respeito direcionando todas as suas defesas contra um tipo de $game_concept_scheme$ em detrimento de outros.\n\nPor causa disso, apenas um pode estar ativo por vez. Reforçar defesas em uma área envolve desviar a atenção de outra.\n\nElas podem ser usadas para reduzir [secrecy|E] ou ajustar a [success_chance|E] de diferentes grupos de $game_concept_schemes$. Elas podem te dar tempo ou reforçar suas defesas, mas vêm com desvantagens que significam que você não quer ter uma ativa o tempo todo."
 game_concept_scheme_countermeasures:0 "Focos em Contramedida"
 game_concept_scheme_desc:0 "Um $game_concept_scheme$ é uma tentativa de longo prazo para afetar o mundo ao seu redor. $game_concept_schemes$ podem direcionar [characters|e], [titles|e], [cultures|e] e [faiths|e], e vêm em quatro tipos: [personal|e], [scheme_hostile|e], [political|e] e [contract_schemes|e].\n\nA [success_chance|e] do seu $game_concept_scheme$ aumenta ao longo do tempo, dependendo de quão proficiente você é na [skill|e] associada, e também pode ser impactada pelos [agents|e] com quem você trama seu $game_concept_scheme$.\n\n#WEAK [secret_schemes|e] são ocultas de seu alvo, mas podem ser descobertas se seu [secrecy|e] estiver baixo. #!"
 game_concept_scheme_discovery_chance:0 "Chance de Descobrimento de Esquema"
 game_concept_scheme_discovery_chance_desc:0 "Esse número é subtraído diretamente do escore de [secrecy|E] de qualquer [secret_scheme|E] contra você ou seus [courtiers|E].\n\n#WEAK $game_concept_secrecy$ é verificado quando um $game_concept_scheme$ é executado, e a uma taxa reduzida uma vez por mês.#!"
 game_concept_scheme_group_calculating:0 "Calculando"
 game_concept_scheme_group_calculating_desc:0 "$game_concept_calculating_schemes$ envolvem ações premeditadas, geralmente com um incidente final em que os conspiradores atacam.\n\nEles são melhor frustrados pelas $game_concept_scheme_countermeasure_countermeasures$ armadas, como #V $scheme_countermeasure_type_redouble_guards$#!.\n\nExemplos incluem:\n$EFFECT_LIST_BULLET$[GetScheme('abduct').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('murder').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('overthrow_regent').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('steal_back_artifact').GetTypeName]"
 game_concept_scheme_group_indirect:0 "Indireto"
 game_concept_scheme_group_indirect_desc:0 "$game_concept_indirect_schemes$ não precisam, em geral, interagir pessoalmente com seu [scheme_target|E].\n\nPor causa disso, eles não podem ser efetivamente contra-atacados, mas algumas $game_concept_scheme_countermeasure_countermeasures$ podem torná-los piores.\n\nExemplos incluem:\n$EFFECT_LIST_BULLET$[GetScheme('claim_throne').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('fabricate_hook').GetTypeName]"
 game_concept_scheme_group_opportunistic:0 "Oportunista"
 game_concept_scheme_group_opportunistic_desc:0 "$game_concept_opportunistic_schemes$ envolvem ações impromptu, repetidas, entre [characters|E] se encontrando informalmente.\n\nEles são melhor frustrados pelas $game_concept_scheme_countermeasure_countermeasures$ vigilantes, como #V $scheme_countermeasure_type_strengthen_sentries$#!.\n\nExemplos incluem:\n$EFFECT_LIST_BULLET$[GetScheme('seduce').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('befriend').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('convert_to_witchcraft').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('courting').GetTypeName]\n$EFFECT_LIST_BULLET$[GetScheme('elope').GetTypeName]"
 game_concept_scheme_growth:0 "Crescimento do Esquema"
 game_concept_scheme_growth_desc:0 "A cada [scheme_phase_phase|E], a [success_chance|E] de um $game_concept_scheme$ é aumentada por este valor, até atingir o máximo atual do [scheme_potential_potential|E].\n\n#WEAK Por exemplo, se um $game_concept_scheme$ atualmente tem 50% de $game_concept_success_chance$, um $game_concept_scheme_potential_potential$ de 54%, e um $game_concept_scheme_growth_growth$ de 3%, então após uma $game_concept_scheme_phase_phase$, terá 53% de $game_concept_success_chance$.\n\nComo o $game_concept_scheme_growth_growth$ ainda é limitado pelo $game_concept_scheme_potential_potential$, após a próxima fase, o $game_concept_scheme$ terá apenas 54% de $game_concept_success_chance$.#!"
 game_concept_scheme_growth_grow:0 "Crescer"
 game_concept_scheme_growth_grow_desc:0 "$game_concept_scheme_growth_desc$"
 game_concept_scheme_growth_growth:0 "Crescimento"
 game_concept_scheme_hostile:0 "Hostil"
 game_concept_scheme_opportunities:0 "Vantagens do Esquema"
 game_concept_scheme_opportunity:0 "Vantagem do Esquema"
 game_concept_scheme_opportunity_desc:0 "$game_concept_scheme_opportunity_opportunities$ representam o progresso feito em direção ao objetivo de um [scheme|e]. Eles podem ser gastos para convencer os [agents|e] a se juntar a um $game_concept_scheme$, ou para executar um com uma [success_chance|e] aumentada."
 game_concept_scheme_opportunity_i:0 "@scheme_opportunity_icon!"
 game_concept_scheme_opportunity_opportunities:0 "Vantagens"
 game_concept_scheme_opportunity_opportunity:0 "Vantagem"
 game_concept_scheme_owner:0 "Autor do Esquema"
 game_concept_scheme_owner_desc:0 "O $game_concept_scheme_owner_owner$ de $game_concept_scheme$ é o [character|E] que está tramando contra o [scheme_target|E].\n\n#WEAK Por exemplo, o suposto assassino em um $game_concept_scheme$ de [GetScheme('murder').GetTypeName].#!"
 game_concept_scheme_owner_owner:0 "Proprietário"
 game_concept_scheme_owners:0 "Autores do Esquema"
 game_concept_scheme_phase:0 "Fase do Esquema"
 game_concept_scheme_phase_desc:0 "Uma $game_concept_scheme_phase_phase$ é o tempo que leva para aumentar a [scheme_success_chance|E] #EMP uma vez#!.\n\nCada $game_concept_scheme_phase_phase$ o $game_concept_scheme$ ganhará uma [scheme_opportunity_opportunity|e]. A [scheme_speed_single|e] pode ser encurtada nomeando os [agents|e], e é aumentada pela [scheme_resistance|e] do alvo."
 game_concept_scheme_phase_phase:0 "Fase"
 game_concept_scheme_phase_phases:0 "Fases"
 game_concept_scheme_phases:0 "Fases do Esquema"
 game_concept_scheme_potential:0 "Potencial do Esquema"
 game_concept_scheme_potential_desc:0 "Um [scheme|e] tem uma [success_chance|e], um valor percentual que determina seu resultado, alcançado através do [scheme_growth|E]. Isso é limitado pelo $game_concept_scheme_potential$, que serve como limite superior para um $game_concept_scheme$.\n\nO $game_concept_scheme_potential$ pode ser aumentado contratando os [agents|e] apropriados, mas nunca pode exceder 95%, exceto para [contract_schemes|e].\n\n#WEAK $game_concept_agents$ harmoniosos podem dar bônus adicionais através de eventos.\n\nO excesso da $game_concept_success_chance$ acima do $game_concept_scheme$ $game_concept_scheme_potential_potential$ é perdido.#!"
 game_concept_scheme_potential_potential:0 "Potencial"
 game_concept_scheme_precaution:0 "Medida Extra"
 game_concept_scheme_precaution_desc:0 "Nem todo [character|E] pode realizar um $game_concept_scheme$ apenas com [skill|E] — quando o [scheme_target_target|E] é muito difícil, pagar por $game_concept_scheme_precautions$ pode ajudar a compensar uma fraqueza em detrimento de outra.\n\n#WEAK $game_concept_scheme_precaution_precautions$ são opcionais: use-os taticamente.#!"
 game_concept_scheme_precaution_precaution:0 "Medida"
 game_concept_scheme_precaution_precautions:0 "Medidas"
 game_concept_scheme_precautions:0 "Medidas Extras"
 game_concept_scheme_resistance:0 "Resistência à Esquemas"
 game_concept_scheme_resistance_desc:0 "A $game_concept_scheme_resistance$ de um [character|E] desacelera os $game_concept_schemes$ contra ele.\n\nA [scheme_speed|E] do [scheme_owner|E] é reduzida por este valor, aumentando o tempo necessário para que o $game_concept_scheme$ ganhe [scheme_opportunity_opportunities|E].\n\n#WEAK A $game_concept_scheme_resistance$ é aumentada pela [skill|E] correspondente do [scheme_target|E] e de seu [spymaster|E], assim como pela [councillor_task|E] de '$task_disrupt_schemes$' (se o Esquema for [scheme_hostile|E]).#!"
 game_concept_scheme_resistance_single:0 "Resistência"
 game_concept_scheme_speed:0 "Duração da Fase do Esquema"
 game_concept_scheme_speed_desc:0 "$game_concept_scheme_speed_single$ refere-se a quantos dias leva para completar uma única [scheme_phase|e]. A velocidade é afetada pela sua [skill|E], pelos [agents|E], e pelo seu [spymaster|E], bem como pela [councillor_task|E] de '$task_support_schemes$' se o Esquema for [scheme_hostile|E].\n\n#WEAK Uma menor $game_concept_scheme_speed_single$ é benéfica, pois fará com que um [scheme|e] progrida mais rapidamente."
 game_concept_scheme_speed_i:0 "@scheme_phase_duration_icon!"
 game_concept_scheme_speed_single:0 "Duração da Fase"
 game_concept_scheme_success_chance:0 "Chance de sucesso do Esquema"
 game_concept_scheme_success_chance_desc:0 "A $game_concept_success_chance$ de um [scheme|e] determina a probabilidade de sucesso ao ser executado.\n\nA $game_concept_success_chance$ do $game_concept_scheme$ irá [scheme_growth_grow|E] ao longo do tempo e é baseada nos [agents|e] designados, bem como em uma [skill|e] associada. O $game_concept_success_chance$ é limitado pelo [scheme_potential|e]. Nenhum $game_concept_scheme$ pode exceder 95% de $game_concept_success_chance$, exceto para [contract_schemes|e].\n\n#WEAK [secret_schemes|e] têm o risco de serem descobertos pelo alvo. Se isso acontecer, sua $game_concept_success_chance$ será fortemente reduzida.#!"
 game_concept_scheme_target:0 "Alvo do Esquema"
 game_concept_scheme_target_desc:0 "O $game_concept_scheme_target_target$ de $game_concept_scheme$ é o [character|E] que está sendo alvo de um esquema por parte do [scheme_owner|E].\n\n#WEAK Por exemplo, a potencial vítima em um $game_concept_scheme$ de [GetScheme('murder').GetTypeName].#!"
 game_concept_scheme_target_target:0 "Alvo"
 game_concept_scheme_targets:0 "Alvos do Esquema"
 game_concept_schemer:0 "Esquematizador"
 game_concept_schemes:0 "Esquemas"
 game_concept_scheming:0 "Conspirando"
 game_concept_screen:0 "Barragem"
 game_concept_screen_desc:0 "Um [army|E] derrotado reduz a quantidade de [casualties|E] sofridas no período de [aftermath|E] de uma [battle|E] determinado pelo valor combinado de Barragem do Exército."
 game_concept_secrecy:0 "Segredo"
 game_concept_secrecy_desc:0 "O $game_concept_secrecy$ de um [hostile_scheme|e] determina a probabilidade de permanecer indetectável pelo alvo do [scheme|e].\n\nO $game_concept_secrecy$ de um $game_concept_scheme$ terá um período de imunidade inicial em que não poderá ser descoberto. Após este período, o $game_concept_scheme$ estará em risco de ser descoberto a cada mês através de um [scheme_breach_short|e]. Seus [agents|e] podem impactar significativamente a capacidade de manter seu $game_concept_scheme$ em segredo.\n\n#WEAK Um $game_concept_scheme$ com um $game_concept_secrecy$ de 80% tem 20% de chance de ser descoberto na execução e 2% de chance de ser descoberto a cada mês que continuar.#!"
 game_concept_secrecy_grace:0 "Graça"
 game_concept_secrecy_grace_desc.boilerplate:0 "A maioria dos $game_concept_schemes$ tem um período de graça de cerca de ~[EmptyScope.ScriptValue('secrecy_grace_period_value')] meses antes de serem descobertos mensalmente."
 game_concept_secrecy_grace_desc:0 "$game_concept_secrecy_grace_desc.boilerplate$\n\nApós o término do período de graça, os $game_concept_schemes$ podem ser descobertos mensalmente, causando uma [scheme_breach_short|E]. Isso ocorre a uma taxa muito reduzida em comparação com a execução do esquema, mas é verificado com muito mais frequência."
 game_concept_secrecy_i:0 "@scheme_secrecy_icon!"
 game_concept_secret:0 "Segredo"
 game_concept_secret_desc:0 "$game_concept_secrets$ são informações que os personagens não desejam que outros saibam pois são embaraçosos, imorais ou um ato [criminal|E].\n\nSegredos podem ser descobertos pela [councillor_task|E] de '$task_find_secrets$' de um [spymaster|E]. Depois que você souber o $game_concept_secret$ de alguém, você poderá fazer [Concept('blackmail', 'Chantagem')|E] contra o personagem para receber um [hook|E]."
 game_concept_secret_scheme:0 "Esquema Secreto"
 game_concept_secret_scheme_desc:0 "Um $game_concept_secret_scheme$ é um [scheme|E] que progride sem o conhecimento do [scheme_target|E].\n\nContudo, ele pode ser descoberto, causando uma redução na [success_chance|E], e aumentando chance do [scheme_owner|E] ser descoberto na Execução do esquema.\n\n[agents|E] que forem recrutados para um $game_concept_secret_scheme$ têm uma chance de serem [agent_discovery_discovered|E]."
 game_concept_secret_scheme_single:0 "Secreto"
 game_concept_secret_schemes:0 "Esquemas Secretos"
 game_concept_secrets:0 "Segredos"
 game_concept_secular:0 "Secular"
 game_concept_secular_desc:0 "$game_concept_secular_ruler_desc$"
 game_concept_secular_opinion:0 "Opinião Secular"
 game_concept_secular_opinion_desc:0 "Este tipo de [opinion|E] afeta todos os personagens que #emphasis não#! forem parte do [clergy|E]."
 game_concept_secular_ruler:0 "Governante Secular"
 game_concept_secular_ruler_desc:0 "Um $game_concept_secular_ruler$ é um [ruler|E] que não faz parte de um [government_form|E] religioso."
 game_concept_secular_rulers:0 "Governantes Seculares"
 game_concept_secular_rulers_desc:0 "$game_concept_secular_ruler_desc$"
 game_concept_sell_titles:0 "Vender Títulos"
 game_concept_sell_titles_decision:0 "Decisão Vender Títulos"
 game_concept_sell_titles_decision_desc:0 "Uma [decision|E] que permite a venda de títulos triviais - títulos de importância puramente simbólica. Concede [gold|E] em troca de [prestige|E]."
 game_concept_send_gift:0 "Enviar Presente"
 game_concept_sexuality:0 "Orientação Sexual"
 game_concept_sexuality_desc:0 "A orientação sexual de um personagem determina quais outros personagens eles são potencialmente [attracted|E].\n\nA orientação sexual não afeta a possibilidade de [marry|E], mas pode reduzir a [fertility|E] de um casal se um dos cônjuges não corresponder à preferência do outro.\n\nAs orientações sexuais limitadas modeladas em #EMP Crusader Kings III#! incluem:\n$EFFECT_LIST_BULLET$[heterosexual|E]\n$EFFECT_LIST_BULLET$[homosexual|E]\n$EFFECT_LIST_BULLET$[bisexual|E]\n$EFFECT_LIST_BULLET$[asexual|E]"
 game_concept_share_power:0 "Compartilhar Poder"
 game_concept_sharing_power:0 "Compartilhamento de Poder"
 game_concept_short_reign:0 "Reinado Curto"
 game_concept_short_reign_desc:0 "'Reinado Curto' é uma penalidade de [opinion|E] decrescente que todos os personagens em um [realm|E] recebem contra um novo [liege|E].\n\nDe forma similar, também é possivel obter o bônus crescente de Opinião de [long_reign|E] sobre Senhores Feudais que estão governando à muito tempo."
 game_concept_shunned:0 "Evitado"
 game_concept_shunned_desc:0 "Muitas [faiths|E] têm [doctrines|E] que designam certos comportamentos como Evitados. Dependendo da Doutrina específica, estes comportamentos também podem ser considerados um ato [criminal|E].\n\nPersonagens que são descobertos praticando comportamentos que são considerados Evitados por sua fé irão perder um [piety_level|E] e ganhar um [fame_trait|E] correspondente; este Traço não irá ser apreciado por todos cuja suas crenças considerarem tal ato como um comportamento Evitado ou Criminoso.\nExemplos de comportamentos Evidados incluem:\n$EFFECT_LIST_BULLET$[GetTrait('fornicator').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('adulterer').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('deviant').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('sodomite').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('kinslayer_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[GetTrait('witch').GetName( GetNullCharacter )]"
 game_concept_sick:0 "Doente"
 game_concept_sickness:0 "Doença"
 game_concept_siege:0 "Cerco"
 game_concept_siege_desc:0 "Um Cerco ocorre quando um [army|E] circunda uma [fortified_holding|E] para forçar os cidadãos à submissão para que a propriedade seja [occupied|E]. Um Cerco se inicia automaticamente assim que um exército adentra o local onde a Propriedade Fortificada inimiga está — isto é, se o Éxercito for maior que a [garrison|E].\n\nO Exército que está Sitiando pode [assault|E] a Propriedade se suas muralhas estiverem Quebradas."
 game_concept_siege_progress:0 "Progresso do Cerco"
 game_concept_siege_progress_desc:0 "O $game_concept_siege_progress$ indica o quão perto um [siege|E] está de ser concluído e quanto tempo se espera que o $game_concept_siege$ dure. Quando o Progresso estiver completo, a [holding|E] será [occupied|E].\n\nA quantidade de $game_concept_siege_progress$ necessária é afetada pelo [fort_level|E] e pela [garrison|E].\n\nO Progresso é ganho diariamente e é afetado por Eventos de Cerco. Também pode ser aumentado ao possuir [siege_weapons|E] ou um [army|E] que supere em muito a [garrison|E]."
 game_concept_siege_weapon:0 "Arma de Cerco"
 game_concept_siege_weapon_desc:0 "$game_concept_siege_weapons$ são [men_at_arms|E] que focam inteiramente nos [sieges|E].\n\nEles não têm efeito em [battles|E], mas irão terminar um $game_concept_siege$ muito mais rápido aumentando o [siege_progress|E].\n\nPorém, $game_concept_siege_weapons$ só são efetivas em sitiar [holdings|E] até um certo [fort_level|E]."
 game_concept_siege_weapons:0 "Armas de Cerco"
 game_concept_sieges:0 "Cercos"
 game_concept_sin:0 "Pecado"
 game_concept_sin_desc:0 "Toda [faith|E] considera certos [traits|E] como pecaminosos. Personagens com esses Traços sofrem penalidades em [opinion|E] de todos os personagens que também consideram esses traços pecaminosos, mesmo que não compartilhem da mesma fé. Além disso, personagens que têm traços que sua própria Fé considera pecaminosos perderão [piety|E] todos os meses.\n\nQuais traços são considerados pecados variam de fé para fé, mas geralmente são determinados por uma combinação dos [core_tenets|E] dessa fé e da [religion|E] à qual a fé pertence."
 game_concept_sin_weight:0 "Peso do Pecado"
 game_concept_sin_weight_desc:0 "$game_concept_virtue_weight_desc$"
 game_concept_sinful:0 "Pecaminoso"
 game_concept_single_combat_duel:0 "Duelo"
 game_concept_single_combat_duel_plural:0 "Duelos"
 game_concept_single_combat_fight:0 "Combate Individual"
 game_concept_single_combat_fight_desc:0 "Em uma $game_concept_single_combat_fight$, dois [characters|E] lutam, seja até a [character_death_death|E] ou até desenhar sangue. A cada rodada, ambos os $game_concept_characters$ selecionam uma opção escolhida aleatoriamente de uma lista, trocando golpes até que um $game_concept_character$ acerte um golpe sólido, com as opções disponíveis dependendo de sua [prowess|E] e [traits|E].\n\nAlgumas opções podem dar efeitos especiais, e a maioria aumentará sua [single_combat_success_chance|E] e [single_combat_injury_chance|E]. Conforme os $game_concept_single_combat_duel_plural$ prosseguem, eles se tornam mais perigosos e incertos, e se torna mais fácil vencer ou se machucar. Após várias rodadas, os $game_concept_single_combat_duel_plural$ entram em morte súbita, encerrando imediatamente com o combatente de maior $game_concept_prowess$ vencendo.\n\nAo lutar em $game_concept_single_combat_duel_plural$, você pode obter [single_combat_prowess_bonus|E] temporários ou [single_combat_prowess_malus|E] [character_modifiers|E], aumentando ou reduzindo sua $game_concept_prowess$ até o fim do $game_concept_single_combat_duel$."
 game_concept_single_combat_fight_plural:0 "Combates Individuais"
 game_concept_single_combat_fight_sudden_death:0 "Morte Súbita"
 game_concept_single_combat_injury_chance:0 "Risco de Lesão"
 game_concept_single_combat_injury_chance_desc:0 "[characters|E] em $game_concept_single_combat_fight_plural$ correm o risco de se machucar, seja por abrir acidentalmente a sua guarda para o oponente ou por se ferir com sua própria arma. Conforme lutam, também aumentam o $game_concept_single_combat_injury_chance$.\n\nOs $game_concept_single_combat_duel_plural$ que duram mais tempo tornam mais fácil se machucar.\n\nO oposto de $game_concept_single_combat_injury_chance$ é [single_combat_success_chance|E]."
 game_concept_single_combat_injury_chance_injure:0 "Lesionar"
 game_concept_single_combat_injury_chance_injury_risk:0 "Risco de Lesão"
 game_concept_single_combat_prowess_bonus:0 "Bônus de Vantagem no Duelo"
 game_concept_single_combat_prowess_bonus_desc:0 "À medida que [characters|E] $game_concept_single_combat_duel$, eles podem ganhar vantagem temporária, como alavancando [terrain|E] ou [traits|E] especiais. Isso aumenta a sua [prowess|E] durante a duração do combate atual e é perdido imediatamente após.\n\nO oposto de $game_concept_single_combat_prowess_bonus$ é [single_combat_prowess_malus|E]."
 game_concept_single_combat_prowess_malus:0 "Penalidade de Limite de Duelo"
 game_concept_single_combat_prowess_malus_desc:0 "À medida que [characters|E] $game_concept_single_combat_duel$, eles podem ser afetados por desvantagem temporária, geralmente devido a seu oponente ter causado ferimentos graves ou intimidado-os severamente. Isso diminui a sua [prowess|E] durante a duração do combate atual, mas é recuperado imediatamente após.\n\nO oposto de $game_concept_single_combat_prowess_malus$ é [single_combat_prowess_bonus|E]."
 game_concept_single_combat_success_chance:0 "Probabilidade de Sucesso"
 game_concept_single_combat_success_chance_desc:0 "Ao lutar em um $game_concept_single_combat_fight$, o seu $game_concept_single_combat_success_chance$ é o quão bem você está indo no $game_concept_single_combat_duel$. Para vencer, você deve obter uma vantagem maior sobre o seu oponente.\n\nConforme as rodadas passam, fica mais fácil vencer, o que significa que você precisa de uma vantagem menor sobre o seu oponente.\n\nO oposto de $game_concept_single_combat_success_chance$ é [single_combat_injury_chance|E]."
 game_concept_single_combat_success_chance_skill:0 "Sucesso no Duelo"
 game_concept_sins:0 "Pecados"
 game_concept_skill:0 "Habilidade"
 game_concept_skill_challenges:0 "Desafios de Habilidade"
 game_concept_skill_challenges_desc:0 "Desafios de habilidade são momentos em que um personagem tem a chance de usar uma de suas [skills|E] para influenciar o desfecho de um evento. Quanto maior a habilidade, ou habilidades, maior a chance de o personagem obter seu objetivo ou de ocorrer um resultado benéfico."
 game_concept_skill_challenges_no_prefix:0 "Desafios"
 game_concept_skills:0 "Habilidades"
 game_concept_skills_desc:0 "As Habilidades de um Personagem medem o quão bom eles são em diversas coisas.\n\nAs cinco habilidades principais são: [diplomacy|E], [martial|E], [stewardship|E], [intrigue|E], [learning|E]."
 game_concept_skirmisher:0 "Escaramuçador"
 game_concept_skirmishers:0 "Escaramuçadores"
 game_concept_skirmishers_desc:0 "Escaramuçadores são [men_at_arms|E] que estão levemente armados e são habilidosos em perturbar o inimigo.\n\nEnquanto cada tipo de Escaramuçador é único, eles costumam [counters|E] [heavy_infantry|E], e sofrem Contra-Ataques de [archers|E]."
 game_concept_soldier:0 "Soldado"
 game_concept_soldier_i:0 "@soldier_icon!"
 game_concept_soldiers:0 "Soldados"
 game_concept_soldiers_desc:0 "$game_concept_soldiers$ é um termo coletivo para as tropas em um [regiment|E] ou um [army|E], seja ele formado por [levies|E], [men_at_arms|E] ou [knights|E].\n\nTer mais $game_concept_soldiers$ pode ajudar a ganhar [battles|E] e [sieges|E]."
 game_concept_soulmate:0 "Alma Gêmea"
 game_concept_soulmate_desc:0 "Uma $game_concept_soulmate$ é uma $game_concept_relation$ que indica um amor romântico profundo e intenso. É uma relação mais forte do que a de um [lover|E]. Um $game_concept_character$ pode ter apenas uma $game_concept_soulmate$."
 game_concept_soulmate_possessive:0 "Da Alma Gêmea"
 game_concept_soulmates:0 "Almas Gêmeas"
 game_concept_soulmates_possessive:0 "Das Almas Gêmeas"
 game_concept_spearmen:0 "Lanceiros"
 game_concept_spearmen_desc:0 "Lanceiros são [men_at_arms|E] que lutam a pé com diversas Armas de Ponta.\n\nEnquanto cada tipo de Lanceiro é único, eles costumam [counters|E] [heavy_cavalry|E] e [light_cavalry|E], e sofrem Contra-Ataques de [heavy_infantry|E].\n\nLanceiros também costumam ser fortes em [terrains|E] montanhosos e em colinas."
 game_concept_special_building:0 "Construção Especial"
 game_concept_special_building_desc:0 "$game_concept_special_buildings$ são [buildings|E] únicas que estão presentes em alguns lugares pré-determinados ao redor do mundo.\n\nExemplos incluem maravilhas antigas, grandiosas catedrais e minas notáveis. Algumas já estão construídas no início do jogo, enquanto outras precisam ser construídas.\n\n$game_concept_special_buildings$ geralmente são muito poderosas e valem a pena lutar por elas."
 game_concept_special_buildings:0 "Construções Especiais"
 game_concept_special_guest:0 "Convidado Especial"
 game_concept_special_guest_desc:0 "Os Convidados Especiais ocupam um lugar especial de honra nas [grand_activities|E]. Honre alguém em sua [GetActivityType( 'activity_feast' ).GetName] ou selecione um $special_guest_champion$ para representá-lo em seu [GetActivityType( 'activity_tournament' ).GetName]!\n\nEles têm mais chances de aceitar seu convite e qualquer atividade para a qual forem convidados não começará até que eles cheguem."
 game_concept_special_guests:0 "Convidados Especiais"
 game_concept_special_troops:0 "Soldados Especiais"
 game_concept_special_troops_desc:0 "$game_concept_special_troops$ não são como [armies|E] normais, já que eles não são convocados a partir de uma [holding|E]. $game_concept_special_troops$ podem ser ganhos em Eventos, e representam diversas coisas como séquitos, hordas vorazes e camponeses ambiciosos.\n\nNormalmente não apresentam um custo de manutenção, e não recebem reforços. Use-os sabiamente se você os tiver.\n\nMuitos [rulers|E] históricos começam com $game_concept_special_troops$."
 game_concept_spectate:0 "Assistir"
 game_concept_spectating:0 "Assistindo"
 game_concept_spectator:0 "Espectador"
 game_concept_spectator_desc:0 "Qualquer personagem que não seja permitido competir em um [contest|E] irá [spectate|E] em vez disso.\n\nTambém é possível para [contestants|E] em potencial optar por não competir e assistir ao invés disso."
 game_concept_spectators:0 "Espectadores"
 game_concept_spiritual_head_of_faith:0 "Chefe da Fé Espiritual"
 game_concept_spiritual_head_of_faith_desc:0 "Um [head_of_faith|E] [GetFaithDoctrine('doctrine_spiritual_head').GetBaseName] é [theocratic|E] e não precisa ser alguém [landed|E] #weak (porém podem ter)#!.\n\n$game_concept_heads_of_faith$ $game_concept_head_of_faith_spiritual$ normalmente têm acesso à interações como ser capaz de conceder [claims|E] ou [gold|E].\n\nSe as [doctrines|E] da [faith|E] permitirem [great_holy_wars|E] então elas serão uma [great_holy_war_undirected|E] #weak (Por exemplo, Crusadas)#!."
 game_concept_spouse:0 "Cônjuge"
 game_concept_spouse_desc:0 "Um $game_concept_spouse$ é o marido ou mulher de um personagem; o resultado de um [marriage|E].\n\nPara legitimizar um filho e produzir [heirs|E], você deve ter um Cônjuge ou uma [concubine|E] (apesar de [bastards|E] poderem ser legitimizados).\n\nA única forma de fundar uma [alliance|E] é através de um casamento ou [betrothal|E]; seu ou de um familiar próximo.\n\nSeu (principal) Cônjuge també um membro do seu [council|E] e pode executar muitas [councillor_tasks|E] úteis.\n\n[doctrines|E] de [faith|E] determinam quantos $game_concept_spouses$ você pode ter e de que forma você pode se [Concept('divorced', 'Divorciar')|E]."
 game_concept_spouse_possessive:0 "do Cônjuge"
 game_concept_spouses:0 "Côjuges"
 game_concept_spread:0 "Disseminação"
 game_concept_spymaster:0 "Mestre Espião"
 game_concept_spymaster_desc:0 "O $game_concept_spymaster$ é o seu [councillor|E] responsável por assuntos de intriga e inteligência. Cuidado ao ter um Mestre Espião desleal, pois eles podem facilmente ocultar e participar de um [GetScheme('murder').GetTypeName] contra você e sua família próxima!"
 game_concept_state_faith:0 "Fé do Estado"
 game_concept_state_faith_desc:0 "$game_concept_state_faith$ é a [faith|E] apoiada e endossada por um [administrative_government|E]. Esta fé está vinculada ao [title|E] e não a nenhum [character|E] específico. É mais fácil converter personagens no [realm|E] para a fé do estado e muito difícil convertê-los de volta.\n\nSomente o [ruler|E] de um Reino Administrativo pode mudar a Fé do Estado, mas os [governors|E] podem se converter livremente a ela."
 game_concept_state_rite:0 "Rito Estatal"
 game_concept_state_rite_desc:0 "$game_concept_state_rite$ é o [rite|E] apoiado e tolerado por um [administrative_government|E]. Este rito está vinculado ao [title|E] e não a qualquer [character|E] específico. É mais fácil converter personagens no [realm|E] para o rito estatal e muito difícil desviá-los dele.\n\nApenas o [ruler|E] de um Domínio Administrativo pode alterar o Rito Estatal, mas [governors|E] podem se converter livremente a ele."
 game_concept_station:0 "Estação"
 game_concept_station_regiment:0 "Estacionar Regimento"
 game_concept_stationed:0 "Estacionado"
 game_concept_stationed_holding:0 "Propriedade Estacionada"
 game_concept_stationed_regiment:0 "Regimento Estacionado"
 game_concept_stationed_regiment_desc:0 "Um [regiment|E] de [men_at_arms|E] recebe bônus em sua eficácia por estar Estacionado em uma [holding|E].\n\n[buildings|E] podem aumentar ainda mais esses bônus - às vezes para qualquer tipo de Homem de Armas, mas mais comumente para um ou dois tipos. Por exemplo, [GetBuilding('stables_01').GetName] fornece um bônus para Homens de Armas Estacionados de [light_cavalry|E] e [heavy_cavalry|E].\n\nVocê pode Estacionar a qualquer momento, exceto durante [war|E] ou se a Propriedade estiver [occupied|E]. Se uma Propriedade for perdida, qualquer Homem de Armas Estacionado será desestacionado."
 game_concept_steward:0 "Administrador"
 game_concept_steward_desc:0 "O $game_concept_steward$ é o [councillor|E] encarregado da administração de um [domain|E], por exemplo, questões de [taxation|E], [culture|E] e [development|E]."
 game_concept_stewards:0 "Administradores"
 game_concept_stewardship:0 "Administração"
 game_concept_stewardship_i:0 "@skill_stewardship_icon!"
 game_concept_stewardship_lifestyle:0 "Estilo de Vida em Administração"
 game_concept_stewardship_lifestyle_desc:0 "O $game_concept_stewardship_lifestyle$ é adequado para Personagens que gostariam de aumentar seu [domain|E], apaziguar seu [liege|E] e [vassals|E], ou ganhar muito [gold|E]."
 game_concept_stewardship_lifestyle_i:0 "@stewardship_lifestyle_icon!"
 game_concept_stewardship_skill:0 "Habilidade Administrativa"
 game_concept_stewardship_skill_desc:0 "$game_concept_stewardship$ é a [skill|E] que auxilia [rulers|E] a controlar seus [domains|E]. Aumenta diretamente a [taxation|E], tornando-a uma Habilidade muito útil para todos os governantes.\n\nO [lifestyle|E] correspondente é o [stewardship_lifestyle|E]."
 game_concept_stockade:0 "Paliçada"
 game_concept_stockade_desc:0 "$game_concept_dungeon_desc$"
 game_concept_stockades:0 "Paliçadas"
 game_concept_stop:0 "Parada"
 game_concept_stops:0 "Paradas"
 game_concept_story_content_el_cid:0 "$game_concept_story_generic_prefix$ $bookmark_laamps_el_cid$"
 game_concept_story_content_el_cid_desc:0 "#tooltip_heading Estilo de História: Leve#!\n\nComo El Cid, você será injustamente afastado por seu senhor. Em exílio, poderá optar por permanecer leal ou encontrar seu próprio caminho, culminando eventualmente com um retorno à corte #EMP ou#! o prêmio supremo — Valência.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hasan:0 "$game_concept_story_generic_prefix$ $bookmark_laamps_hassan_sabbah$"
 game_concept_story_content_hasan_desc:0 "#tooltip_heading Estilo de História: Moderado#!\n\nComo Hasan, você será guiado por um caminho de fanatismo religioso, escolhendo um lugar para trazer a luz da Verdadeira Fé e convertendo [counties|E] sob seus [rulers|E].\n\nEventualmente, sua história culminará com uma grande revolta religiosa contra seu inimigo escolhido.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_hereward:0 "$game_concept_story_generic_prefix$ $bookmark_laamps_hereweard_the_wake$"
 game_concept_story_content_hereward_desc:0 "#tooltip_heading Estilo de História: Extensivo#!\n\nComo Hereward, seu exílio no exterior será breve. Com a Inglaterra sob o jugo estrangeiro, você retornará para lutar pela liberdade, limpar seu nome e matar normandos.\n\nUma mecânica especial estará ativa durante a duração, mapeando a resistência da Inglaterra ao domínio normando, e eventos de história roteirizados ocorrerão durante isso. Sua história culminará com a morte: a sua ou a do seu inimigo.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_jamukha:0 "$game_concept_story_generic_prefix$ $bookmark_nomads_temujin$"
 game_concept_story_content_jamukha_desc:0 "#tooltip_heading Estilo da História: Leve#!\n\nComo Jamukha, você sempre viveu sob a longa sombra de Temüjin, mas chegou a hora de provar sua própria força. Permanecerá leal a ele ou cortará sua garganta no escuro?\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_temujin:0 "$game_concept_story_generic_prefix$ $bookmark_nomads_temujin$"
 game_concept_story_content_temujin_desc:0 "#tooltip_heading Estilo da História: Leve#!\n\nComo Temüjin, você buscará vingança contra uma tribo rival que aprisionou sua esposa e testará a lealdade de seu vassalo e amigo mais próximo — Jamukha.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_content_wallada:0 "$game_concept_story_generic_prefix$ $bookmark_laamps_wallada_bint_al_mustakfi$"
 game_concept_story_content_wallada_desc:0 "#tooltip_heading Estilo de História: Moderado#!\n\nComo Wallada, você irá evoluir o [GetTrait('violet_poet').GetName( GetNullCharacter )] sob medida, escrevendo poesia e fundando salões líricos ao redor do mundo, melhorando um tomo único à medida que avança.\n\nA conclusão da sua história é tão dramática quanto você escolher, mas apesar de não ter filhos, você terá maneiras de continuar jogando.\n\n$game_concept_story_generic_desc_boilerplate$"
 game_concept_story_cycle:0 "História"
 game_concept_story_cycle_desc:0 "Uma História é uma situação pessoal ligada a um [ruler|E].\n\nExistem muitos tipos de Histórias — desde possuir um [GetModifier('dog_story_modifier').GetNameWithTooltip] até se tornar um #V [GetTrait('conqueror').GetName( GetNullCharacter )]#!. Cada uma é construída a partir de elementos diferentes, geralmente envolvendo [characters|E], [titles|E] ou [decisions|E] importantes."
 game_concept_story_cycles:0 "Histórias"
 game_concept_story_generic_desc_boilerplate:0 "#WEAK O conteúdo da história é opcional. Você pode optar por não participar dele assim que começar a jogar."
 game_concept_story_generic_prefix:0 "A História de"
 game_concept_stress:0 "Estresse"
 game_concept_stress_critical_i:0 "@stress_critical_icon!"
 game_concept_stress_desc:0 "Personagens acumulam Estresse ao tomar ações que entram em conflito com seus [personality_traits|E].\n\nPersonagens que acumulam Estresse suficiente também atingem um [stress_level|E], causando vários efeitos negativos em sua saúde mental que persistem até que eles consigam reduzir seu Estresse.\n\nUma maneira direta de aliviar o Estresse é participar de [activities|E] como uma [GetActivityType( 'activity_hunt' ).GetName]."
 game_concept_stress_gain_i:0 "@stress_gain_icon!"
 game_concept_stress_i:0 "@stress_icon!"
 game_concept_stress_level:0 "Nível de Estresse"
 game_concept_stress_level_desc:0 "A cada 100 de [stress|E] que um personagem acumular, isto irá fazer com que o mesmo ganhe um Nível de Estresse. Níveis de Estresse vão de 1 à 3, com cada nível causando mais penalidades à [fertility|E] e [health|E] do personagem.\n\nEm complemento, enquanto o personagem tiver ao menos 1 Nível de Estresse ele estará vulnerável à [mental_breaks|E]."
 game_concept_stress_levels:0 "Níveis de Estresse"
 game_concept_stress_loss:0 "Redução de Estresse"
 game_concept_stress_loss_i:0 "@stress_loss_icon!"
 game_concept_stressed:0 "Estressado"
 game_concept_strife:0 "Conflito"
 game_concept_strife_desc:0 "$game_concept_strife$ é uma penalidade de [opinion|E] entre [vassals|E] aliados.\n\nO Conflito ocorre quando um súdito do [liege|E] toma uma ação contra outro [vassal|E]. Por exemplo, quando o $game_concept_diarch$ usa seus [diarch_powers|E], ou em eventos de [mandate|E], já que o $game_concept_diarch$ não possui a mesma autoridade que seu [liege|E]."
 game_concept_strife_opinion:0 "Opinião de Conflito"
 game_concept_strong_hook:0 "Gancho Forte"
 game_concept_strong_hook_desc:0 "Um $game_concept_strong_hook$ é um [hook|E] muito poderoso que você pode ter em um personagem que você [blackmailed|E].\n\nOs $game_concept_strong_hooks$ são muito mais poderosos do que os [weak_hooks|E] e podem forçar alguém a fazer ações terríveis para você, como se tornar seu [agent|E] em [GetScheme('murder').GetTypeName] #weak (além de tudo o que um $game_concept_weak_hook$ pode fazer!)#!\n\nUm $game_concept_strong_hook$ também impede que o alvo tome qualquer ação hostil em relação ao detentor do Hook.\n\nOs $game_concept_strong_hooks$ não são gastos quando usados, mas têm um tempo de recarga antes de poderem ser usados novamente. O efeito passivo não é perdido quando o Hook é usado."
 game_concept_strong_hook_i:0 "@unspent_strong_hook_icon!"
 game_concept_strong_hooks:0 "Ganchos Fortes"
 game_concept_strong_vassal:0 "Vassalo Forte"
 game_concept_strong_vassal_desc:0 "Um $game_concept_strong_vassal$ é um [vassal|E] que se aproxima ou supera seu [liege|E] em poder, tendo uma penalidade em [opinion|E]. #weak Eles veem seu senhor feudal como um fraco e não apropriado para governar o reino.#!"
 game_concept_strong_vassals:0 "Vassalos Fortes"
 game_concept_student:0 "Estudante"
 game_concept_student_desc:0 "$game_concept_students$ são [character|E] que se beneficiam do conselho de um [mentor|E], que os ajuda a avançar em uma de suas [skills|E]. Os $game_concept_mentors$ são obtidos por meio de eventos quando o [focus|E] de seu [lifestyle|E] é definido para uma $game_concept_skill$ em que eles se destacam."
 game_concept_student_possessive:0 "Do estudante"
 game_concept_students:0 "Estudantes"
 game_concept_students_possessive:0 "Dos estudantes"
 game_concept_success_chance:0 "Chance de Sucesso"
 game_concept_success_chance_growth_i:0 "@scheme_success_growth_icon!"
 game_concept_success_chance_i:0 "@scheme_success_icon!"
 game_concept_success_chance_max_i:0 "@scheme_success_max_icon!"
 game_concept_succession:0 "Sucessão"
 game_concept_succession_desc:0 "Uma $game_concept_succession$ ocorre quando um [ruler|E] morre, dividindo seu [gold|E] e [titles|E] entre seus [heirs|E] de acordo com as [succession_laws|E].\n\nJogadores podem continuar jovando como o [player_heir|E] mesmo se alguns títulos forem perdidos para outros personagens.\n\nSe não houver um herdeiro, o jogo é finalizado.\n\n#weak Algumas raras situações podem forçar uma Sucessão a ocorrer antes de um governante morrer, como ser derrotado em uma [excommunication_war|E]. Legalmente falando, contudo, Governantes não podem escolher abdicar-se por conta própria.#!"
 game_concept_succession_law:0 "Lei de Sucessão"
 game_concept_succession_law_desc:0 "Cada [ruler|E] tem uma Lei de de sucessão principal que determina o que acontece com seus [titles|E] em uma [succession|E].\n\nAlém disso, um Título individual pode às vezes ter sua própria Lei [title_succession|E], isto tem maior prioridade sobre a lei padrão. Por exemplo, o Sacro Império Romano talvez seja Eletivo mesmo que o imperador tenha uma Lei de Sucessão de Partição.\n\nVocê só pode alterar a Lei de Sucessão quando tiver o nível da [crown_authority|E] apropriada."
 game_concept_succession_laws:0 "Leis de Sucessão"
 game_concept_supplied:0 "Suprido"
 game_concept_supplies:0 "Suprimentos"
 game_concept_supply:0 "Suprimento"
 game_concept_supply_desc:0 "$game_concept_supply$ é a quantidade de comida e equipamento que um [army|E] carrega. Exércitos irão começar a perder $game_concept_supply$ quando seu tamanho for maios que o [supply_limit|E] do local onde estiverem.\n\nExércitos que estiverem com poucos $game_concept_supplies$ irão sofrer uma penalidade de [advantage|E] em [battle|E], e quando ficarem sem suprimentos irão começar a sofrer [attrition|E].\n\nSuprimento aumenta com o tempo, isto é, se o Exército estiver abaixo do $game_concept_supply_limit$ e em um território aliado."
 game_concept_supply_limit:0 "Limite de Suprimentos"
 game_concept_supply_limit_desc:0 "O $game_concept_supply_limit$ dita a quantidade de [soldiers|E] que você pode ter em um [barony|E], este limite é determinado pelo [terrain|E] e [development|E] do Baronato.\n\nSe seu tamanho de [army|E] for maior que o $game_concept_supply_limit$, seus $game_concept_armies$ irão começar a perder [Concept('supply', 'Suprimentos')|E] e eventualmente sofrer de [attrition|E]."
 game_concept_supply_limit_mult:0 "Multiplicador do Limite de Suprimentos"
 game_concept_supply_state:0 "Estado de Suprimentos"
 game_concept_supremacy:0 "Supremacia"
 game_concept_suzerain_taxes:0 "Impostos de Suserano"
 game_concept_suzerain_taxes_desc:0 "Seus $game_concept_suzerain_taxes$ são os [taxes|E] que você deve pagar ao seu [suzerain|E] como parte de suas [obligations|E].\n\nDo ponto de vista do seu Suserano, esses mesmos impostos são chamados de [tributary_taxes|E] para diferenciá-los de quaisquer impostos que eles possam dever ao seu próprio $game_concept_suzerain$."
 game_concept_swing_scales_of_power:0 "$swing_scales_currency_interaction$"
 game_concept_swing_scales_of_power_desc:0 "Ao custo de [prestige|E], [piety|E] ou [gold|E], um [liege|E] ou um [diarch|E] pode mover as [scales_of_power|E] a seu favor."
 game_concept_swing_scales_of_power_interaction:0 "$game_concept_swing_scales_of_power$"
 game_concept_tax:0 "Imposto"
 game_concept_tax_collector:0 "Arrecadador de Impostos"
 game_concept_tax_collector_desc:0 "Um $game_concept_tax_collector$ permite o funcionamento das [tax_jurisdictions|E].\n\nSua [aptitude|E] determina a quantidade de [taxes|E] e [levies|E] que coletam para seu [liege|E]."
 game_concept_tax_collectors:0 "Arrecadadores de Impostos"
 game_concept_tax_decree:0 "Decreto Fiscal"
 game_concept_tax_decree_desc:0 "Cada [tax_jurisdiction|E] pode ter um $game_concept_tax_decree$, modificando os [taxes|E] e [levies|E] contribuídos por seus [taxpayers|E].\n\n$game_concept_tax_decrees$ frequentemente mudam as [obligations|E] em troca de outra penalidade ou benefício."
 game_concept_tax_decrees:0 "Decretos Fiscais"
 game_concept_tax_jurisdiction:0 "Jurisdição Fiscal"
 game_concept_tax_jurisdiction_desc:0 "Uma $game_concept_tax_jurisdiction$ é um grupo de [taxpayers|E] formado por [vassals|E] do [clan|E]. Cada $game_concept_tax_jurisdiction$ suporta até #V 12#! $game_concept_taxpayers$.\n\nCada $game_concept_tax_jurisdiction$ pode ter um [tax_decree|E].\n\nO número de $game_concept_tax_jurisdictions$ disponíveis é determinado pela [rank|E], [traditions|E] e [innovations|E].\n\nUma $game_concept_tax_jurisdiction$ requer um [tax_collector|E] para ser nomeado."
 game_concept_tax_jurisdictions:0 "Jurisdições Fiscais"
 game_concept_taxation:0 "Tributação"
 game_concept_taxation_tour:0 "Tour de Tributação"
 game_concept_taxation_tour_desc:0 "Um [tour_type|E] no qual você tenta extrair riqueza de seus [vassals|E], obtendo [gold|E]."
 game_concept_taxes:0 "Impostos"
 game_concept_taxes_desc:0 "Os $game_concept_taxes$ são a principal fonte mensal de [income|E] de [gold|E] para [rulers|E].\n\nCada [holding|E] que um governante possui fornece a ele alguns [domain_taxes|E] a cada mês. Além disso, a maioria dos [vassals|E] tem a [obligation|E] de pagar uma parte dos seus próprios impostos coletados ao seu [liege|E] na forma de [liege_taxes|E]."
 game_concept_taxpayer:0 "Contribuinte"
 game_concept_taxpayer_desc:0 "$game_concept_taxpayers$ são [vassals|E] do [clan|E] que foram designados a uma [tax_jurisdiction|E] e contribuirão com [taxes|E] mensais e [levies|E] desde que um [tax_collector|E] seja nomeado."
 game_concept_taxpayer_i:0 "@tax_collector_icon!"
 game_concept_taxpayers:0 "Contribuintes"
 game_concept_temple:0 "Templo"
 game_concept_temple_citadel:0 "Cidadela do Templo"
 game_concept_temple_citadel_holding:0 "Posse de Cidadela do Templo"
 game_concept_temple_citadel_holding_desc:0 "As Cidadelas do Templo são uma combinação pragmática entre a fortificação de um [castle|E] e o local de culto de um [temple|E] — sendo o [holding_type|E] padrão para [rulers|E] [mandala|E]. Elas fornecem uma quantidade equilibrada de [levies|E], [piety|E] e [taxes|E]."
 game_concept_temple_citadel_holdings:0 "Posses de Cidadela do Templo"
 game_concept_temple_citadels:0 "Cidadelas do Templo"
 game_concept_temple_holding:0 "Propriedade do Templo"
 game_concept_temple_holding_desc:0 "Templo é o [holding_type|E] que pode ser mantido por membros do [clergy|E] como [church_property|E] (a [government_form|E] [theocratic|E]). No entanto, em [faiths|E] com a [doctrine|E] [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName], qualquer um pode manter Templos sem penalidade.\n\nTemplos fornecem uma mistura bastante equilibrada de [levies|E] e [taxes|E]."
 game_concept_temple_holdings:0 "Propriedades do Templo"
 game_concept_temples:0 "Templos"
 game_concept_temporal_head_of_faith:0 "Chefe da Fé Temporal"
 game_concept_temporal_head_of_faith_desc:0 "Um [head_of_faith|E] [GetFaithDoctrine('doctrine_temporal_head').GetBaseName] age de forma parecida com um [ruler|E] normal, com o [title|E] de $game_concept_head_of_faith$ sendo destrúido se eles perderem todas as suas terras.\n\nSe as [doctrines|E] da [faith|E] permitirem [great_holy_wars|E] então elas serão uma [great_holy_war_directed|E] #weak (Por Exemplo, Jihads)#!."
 game_concept_tenet:0 "Princípio"
 game_concept_tenet_desc:0 "Enquanto [doctrines|E] representam questões sobre as quais um [rite|E] deve tomar uma posição, $game_concept_tenets$ representam as peculiaridades e práticas únicas do Rito."
 game_concept_tenets:0 "Princípios"
 game_concept_terrain:0 "Terreno"
 game_concept_terrain_desc:0 "Cada [barony|E] tem um tipo de Terreno dominante, o que irá afetar coisas como o [supply|E], velocidade de movimento de um [army|E], e a eficácia de diversos tipos de [regiments|E] de [men_at_arms|E] em uma [battle|E] e as [buildings|E] que podem ser feitas no local.\n\nMuitos [commander_traits|E] também interagem com o tipo de Terreno."
 game_concept_terrains:0 "Terrenos"
 game_concept_terrified_i:0 "@terrified_icon!"
 game_concept_theocracies:0 "Teocracias"
 game_concept_theocracy:0 "Teocracia"
 game_concept_theocracy_desc:0 "$game_concept_theocracy$ é uma [government_form|E] não jogável, disponível para algumas [faiths|E] dependendo das [doctrines|E]. Eles são normalmente lideradas por um [head_of_faith|E] ou um [realm_priest|E] [landed|E]. Um Bisto também pode se tornar um governante Teocrático [independent|E] por direito próprio."
 game_concept_theocracy_government:0 "Governo Teocrático"
 game_concept_theocracy_i:0 "@government_type_theocracy!"
 game_concept_theocratic:0 "Teocrático"
 game_concept_theocratic_government:0 "Governo Teocrático"
 game_concept_theocratic_vassal:0 "Vassalo Teocrático"
 game_concept_theocratic_vassal_desc:0 "Vassalos que possuem a forma de [theocratic_government|E].\n\nSua função é determinada pelas [doctrines|E] de uma [faithpossessive|E]."
 game_concept_theocratic_vassals:0 "Vassalos Teocráticos"
 game_concept_title:0 "Título"
 game_concept_title_allegiance:0 "Fidelidade à Título"
 game_concept_title_allegiance_desc:0 "[vassals|E] podem jurar Aliança à um [title|E] específico ao invés do seu [liege|E]. Isto só pode ocorrer se o Título tiver sua própria [succession_law|E]. Na [succession|E], estes Vassalos irão se tornar Vassalos do novo [holder|E] do Título."
 game_concept_title_claim:0 "Reivindicação de Título"
 game_concept_title_claim_desc:0 "Uma $game_concept_claim$ em um [title|E] representa um direito legal sobre o mesmo e oferece um [casus_belli|E] para conquistá-lo através de uma [war|E]. As reivindicações também fornecem uma justificativa válida para [revoke|E] [titles|E] se um [vassal|E] for o [holder|E].\n\nGeralmente, os [rulers|E] obtêm reivindicações quando perdem o controle sobre os títulos, mas também podem ser criadas por meio da opção [fabricate_claim_short|E].\n\nAlém disso, cada filho de um governante (até mesmo [bastards|E]) tem uma [implicit_claim|E] sobre os [titles|E] do governante. Se eles não herdarem o título do [ruler] após a morte deste, essas [implicit_claims] são convertidas em [pressed_claims|E], que podem ser herdadas por seus próprios filhos como [unpressed_claims|E]."
 game_concept_title_claims:0 "Reivindicações de Título"
 game_concept_title_creation:0 "Criação de Título"
 game_concept_title_creation_desc:0 "Um [ruler|E] que controla a maioria das terras [de_jure|E] do [title|E] ainda não criado poderá criá-lo. A criação de um título custa [gold|E], mas dá [prestige|E].\n\nApenas títulos de níveis [duchy|E], [kingdom|E] ou [empire|E] podem ser criados.\n\nO widget de Problemas contém uma lista de todos os títulos que você pode criar no momento."
 game_concept_title_desc:0 "Um $game_concept_title$ é essencialmente um certificado de propriedade de terra.\n\nA menor unidade de terra no mapa é o [barony|E]. Baronatos são organizados em áreas maiores chamadas de [counties|E]. Condados [de_jure|E] pertencem à um [duchy|E], Ducados à um [kingdom|E], e Reinos à um [empire|E].\n\nDucados, Reinos e Impérios nem sempre têm um [holder|E], mas são títulos que podem ser [created|E] por um governante que controla o suficiente do território correspondente ao título."
 game_concept_title_heir:0 "Herdeiro do Título"
 game_concept_title_heir_desc:0 "O Herdeiro do Título é o [heir|E] de um [title|E] específico com sua própria [title_succession|E]. Eles irão receber tal título quando o [holder|E] atual morrer."
 game_concept_title_heirs:0 "Herdeiros do Título"
 game_concept_title_i:0 "@titles_icon!"
 game_concept_title_law:0 "Lei de Título"
 game_concept_title_law_desc:0 "[titles|E] podem ter uma can Lei [title_specific_succession|E] para este título em específico. Esta lei irá ditar diferentes regras para a sucessão que os outros títulos carregados pelo mesmo personagem."
 game_concept_title_laws:0 "Leis de Título"
 game_concept_title_rank:0 "Coroa"
 game_concept_title_rank_desc:0 "O equivalente ao [title_tier|E] de Título pessoal, $game_concept_title_rank$ determina a posição de um [ruler|E] dentro da hierarquia do jogo.\n\nTodos os Níveis de Título tem um Nível associado, que determina qual o maior Nível dos [vassals|E] que o [holder|E] pode ter.\n\n[hegemony|E] > [emperor|E] > [king|E] > [duke|E] > [count|E] > [baron|E]."
 game_concept_title_ranks:0 "Coroas"
 game_concept_title_specific_succession:0 "Título Específico"
 game_concept_title_succession:0 "Sucessão de Título"
 game_concept_title_succession_desc:0 "Um [title|E] pode ter sua própria [succession_law|E], que é diferente da do [holder|E] em seu [realm|E].\n\n[kingdoms|E] e [empires|E] são os mais propensos a possuir uma $game_concept_title_succession$ tradicional.\n\nO $game_concept_holder$ do $game_concept_title$ pode adicionar ou remover Leis de Sucessão Específicas do Título, geralmente ao custo de [prestige|E].\n\n[domiciles|E] também possuem sua própria $game_concept_title_succession$, que não pode ser removida."
 game_concept_title_tier:0 "Nível"
 game_concept_title_tier_desc:0 "A terra equivalente de uma [rank|E] de Título, o $game_concept_title_tier$ determina a posição de um [title|E] dentro da hierarquia do jogo.\n\nTodos os Títulos tem um Nível, que determina qual o maior Nível dos [vassals|E] que o [holder|E] pode ter.\n\n[hegemony|E] > [empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]."
 game_concept_title_tiers:0 "Níveis"
 game_concept_titlepossessive:0 "do Título"
 game_concept_titles:0 "Títulos"
 game_concept_titular_title:0 "Título Titular"
 game_concept_titular_title_desc:0 "Um $game_concept_titular_title$ é um [title|E] que não tem [de_jure|E] no mapa. Títulos não titulares podem se tornar titulares por meio da [de_jure_drift|E].\n\nTítulos [mercenaries|E], [head_of_faith|E] e [holy_order|E] são frequentemente Titulares."
 game_concept_tolerance:0 "Tolerância"
 game_concept_tolerate:0 "Tolerar"
 game_concept_tolerates:0 "Tolera"
 game_concept_top_liege:0 "Senhor Feudal Supremo"
 game_concept_top_liege_desc:0 "O '$game_concept_top_liege$' é o [liege|E] no topo da hierarquia de [vassals|E].\nÉ um [ruler|E] totalmente [independent|E] que não responde a nenhum mortal."
 game_concept_top_liege_possessive:0 "do Senhor Feudal Supremo"
 game_concept_top_lieges:0 "Senhores Feudais Supremos"
 game_concept_top_realm:0 "Reino Superior"
 game_concept_top_realm_desc:0 "O '$game_concept_top_realm$' é o [realm|E] do [top_liege|E]."
 game_concept_torture:0 "Torturar"
 game_concept_torture_desc:0 "Personagens [Concept('imprisoned', 'Aprisionados')|E] podem ser Torturados, causando danos a sua [health|E] ou até mesmo mutilando-os de diferentes maneiras.\n\nTortura pode diminuir o [stress|E] de Personagens com o traço de [GetTrait('callous').GetName( GetNullCharacter )] e/ou [GetTrait('sadistic').GetName( GetNullCharacter )], mas causa Estresse para aqueles de natureza gentil.\n\nTorturar [rulers|E] também pode aumentar seu [dread|E]."
 game_concept_tortured:0 "Torturado"
 game_concept_torturing:0 "Torturando"
 game_concept_toughness:0 "Resistência"
 game_concept_toughness_desc:0 "A Resistência de um [soldier|E] determina quanto [damage|E] ele pode sofrer em uma [battle|E] antes de se tornar uma [casualty|E].\n\nUm Soldado de uma [levy|E] tem [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] de Resistência."
 game_concept_tour:0 "Tour"
 game_concept_tour_desc:0 "Uma [grand_activity|E] na qual um [liege|E] faz uma visita real a uma coleção de seus [vassals|E] para obter recompensas como [gold|E], [dread|E], [opinion|E], [control|E] e [cultural_acceptance|E]."
 game_concept_tour_grounds:0 "Visita Terrenos"
 game_concept_tour_of_the_grounds:0 "Visita aos Terrenos"
 game_concept_tour_stop:0 "Parada da Visita"
 game_concept_tour_stop_desc:0 "Uma [activity_phase|E] durante uma [royal_tour|E] na qual um senhor pode escolher entre: participar de um [hosted_dinner|E], [tour_the_grounds|E] de seu [vassal|E], ou desfrutar de um [cultural_festival|E]."
 game_concept_tour_stops:0 "Paradas da Visita"
 game_concept_tour_success:0 "Sucesso da Visita"
 game_concept_tour_success_desc:0 "Um valor que determina as recompensas que você receberá no final da sua [grand_tour|E]. Você pode ganhar e perder pontos selecionando certas opções no início da sua visita e tomando decisões que estejam alinhadas com o seu [tour_type|E]."
 game_concept_tour_success_point:0 "Ponto de Sucesso da Visita"
 game_concept_tour_success_points:0 "Pontos de Sucesso da Visita"
 game_concept_tour_the_grounds:0 "Visitar os Terrenos"
 game_concept_tour_the_grounds_desc:0 "Uma [activity_phase|E] durante uma [royal_tour|E] na qual um [vassal|E] é visitado por seu [liege|E], o que muitas vezes resulta no aumento do [control|E] em seus [counties|E]."
 game_concept_tour_type:0 "Tipo de Visita"
 game_concept_tour_type_desc:0 "Uma opção que determina que tipo de [tour|E] você está tendo e que recompensas você ganhará. Os tipos de visita incluem [majesty_tour|E], [intimidation_tour|E] e [taxation_tour|E]."
 game_concept_touring_the_grounds:0 "Visita aos Terrenos"
 game_concept_tours:0 "Tours"
 game_concept_tradition:0 "Tradição"
 game_concept_traditions:0 "Tradições"
 game_concept_trait:0 "Traço"
 game_concept_trait_desc:0 "Os $game_concept_traits$ de um personagem descrevem sua personalidade, peculiaridades, feitos e estado de ser.\n\nTraços podem ter muitos efeitos, mas a maioria afeta as [skills|E] do Personagem.\n\nTraços de Personalidade também afetam muito como os personagens devem agir. Agir contra sua Personalidade irá gerar [stress|E].\n\nAlguns Traços são [congenital|E]s e podem ser herdados por filhos."
 game_concept_trait_level_track:0 "Caminho de Traço"
 game_concept_trait_level_track_desc:0 "Alguns [traits|E] oferecem vários caminhos, cada um dos quais mudará o Traço de maneiras diferentes.\n\nGanhar [trait_level_track_xp|E] é necessário para avançar em um caminho."
 game_concept_trait_level_track_xp:0 "Experiência de Traço"
 game_concept_trait_level_track_xp_desc:0 "Experiência é necessária para avançar em um [trait_level_track|E] e mudar os bônus que o [trait|E] oferece."
 game_concept_traits:0 "Traços"
 game_concept_transfer:0 "Transferir"
 game_concept_transfer_desc:0 "[rulers|E] podem $game_concept_transfer$ um de seus [vassals|E] para outro Vassalo, contanto que o primeiro seja de um nível menor que o último. Isto é uma boa forma de aumentar a [opinion|E] de um Vassalo, particularmente se o vassalo Transferido é parte [de_jure|E] do seu [realm|E]."
 game_concept_transferred:0 "Transferido"
 game_concept_transferring:0 "Transferindo"
 game_concept_travel:0 "Viagem"
 game_concept_travel_danger:0 "Perigo"
 game_concept_travel_danger_desc:0 "Durante suas [travels|E], você pode passar por terras perigosas, como desertos ou pântanos, que podem dificultar sua jornada.\n\nVocê pode mitigar os riscos do Perigo melhorando sua [travel_safety|E]. Você pode fazer isso investindo em [travel_options|E] ou contratando um [GetCourtPositionType('travel_leader_court_position').GetName()].\n\nVárias [culture_traditions|E] reduzem ou eliminam os riscos de certos tipos de Perigo."
 game_concept_travel_danger_i:0 "@travel_danger_icon!"
 game_concept_travel_desc:0 "$game_concept_travel$ é o meio pelo qual um [character|E] se desloca de um [location|E] para outro, principalmente para participar de [activities|E].\n\nExistem várias maneiras de planejar sua jornada, como escolher um [GetCourtPositionType('travel_leader_court_position').GetName()] para contratar, selecionar [travel_options|E] e personalizar sua rota. Você encontrará muitos personagens interessantes ao longo do caminho, mas tenha cuidado com os [travel_danger|E] que podem estar à espreita."
 game_concept_travel_destination:0 "Destino de Viagem"
 game_concept_travel_option:0 "Opção de Viagem"
 game_concept_travel_option_desc:0 "Uma opção que você escolhe ao planejar sua [travel|E] para aprimorar ou modificar a jornada que você está prestes a iniciar."
 game_concept_travel_options:0 "Opções de Viagem"
 game_concept_travel_safety:0 "Segurança"
 game_concept_travel_safety_desc:0 "Ter um valor alto de Segurança ajudará você a evitar [travel_danger|E] durante suas [travels|E]. Sua Segurança é afetada pelas suas [skills|E] e também pelas do seu [GetCourtPositionType('travel_leader_court_position').GetName()].\n\n$min_travel_contribution$"
 game_concept_travel_speed:0 "Velocidade"
 game_concept_travel_speed_desc:0 "Ter uma alta Velocidade ao [traveling|E] permitirá que você chegue mais rápido ao seu destino. Sua Velocidade é afetada pelas suas [skills|E] e também pelas do seu [GetCourtPositionType('travel_leader_court_position').GetName()].\n\n$min_travel_contribution$"
 game_concept_traveled:0 "Viajado"
 game_concept_traveling:0 "Viajando"
 game_concept_travels:0 "Viagens"
 game_concept_treasury_debt:0 "Dívida do Tesouro"
 game_concept_treasury_debt_desc:0 "Dívida do Tesouro é o estado de possuir uma quantidade negativa de [treasury_i][treasury|E]. Isso normalmente acontece quando um [governor|E] em guerra contrata [mercenaries|E] sem ter fundos suficientes no Tesouro para cobrir o custo total, quando permanece em guerra por muito tempo, ou quando paga demais em [Concept( 'treasury_budgeting', 'Salários' )|E] em relação ao que arrecada de seus [vassals|E].\n\nEnquanto estiver em dívida, você não pode declarar novas [wars|E], seus [men_at_arms|E] que dependem do Tesouro não se reforçam, e seus inimigos terão uma [advantage|E] sobre você nas batalhas. Quanto mais fundo na dívida você cair, mais penalidades receberá — menos [levies|E], redução na [county_opinion|E], e seus [vassals|E] gostarão menos de você.\n\nAlém disso, vários outros pequenos eventos desestabilizadores podem ocorrer, como o aumento de [county_corruption|E] em seus [counties|E] do [domain|E].\n\n#help É geralmente uma boa ideia atacar seus inimigos enquanto estão em dívida, pois lutarão com uma [advantage|E] reduzida!#!"
 game_concept_tribal:0 "Tribal"
 game_concept_tribal_authority:0 "Autoridade Tribal"
 game_concept_tribal_authority_desc:0 "$game_concept_tribal_authority$ representa a influência geral que um [ruler|E] [tribal|E] exerce sobre seus [vassals|E]. Em comparação com a [crown_authority|E], oferece menos poderes e apenas em níveis mais avançados.\n\nExistem quatro níveis de $game_concept_tribal_authority$: [disparate_tribes|E], [limited_tribal|E], [high_tribal|E] e [absolute_tribal|E]. Aumentar a $game_concept_tribal_authority$ custa uma quantidade de [prestige|E] que depende do nível e da [learning_skill|E] do governante, mas geralmente é mais caro do que aumentar a autoridade da coroa.\n\n#weak Vassalos não gostam de níveis mais altos da $game_concept_tribal_authority$, e reduzi-la é o objetivo principal de qualquer [liberty_faction|E].#!"
 game_concept_tribal_desc:0 "Reinos Tribais têm condados com um [development|E] atrofiado, não podem passar além das [innovations|E] da Era Tribal, não podem construir novas [holdings|E], e normalmente são incapazes de alterar sua [succession_law|E].\n\nPorém, eles podem fazer uso de [prestige|E] ao invés de [gold|E] para construir seus reinos e contratar [men_at_arms|E], e ter acesso à mais [casus_bellis|E] se comparados com Reinos do tipo [feudal|E]. Exércitos Não Tribais sofrem com uma penalidade de [supply_limit|E] em território Tribal hostil."
 game_concept_tribal_government:0 "Governo Tribal"
 game_concept_tribal_holding:0 "Propriedade da Tribo"
 game_concept_tribal_holding_desc:0 "Propriedade Tribal são pobres no fornecimento de [taxes|E] porém são ricas no fornecimento de melhorias em [levies|E], [prestige|E], e [men_at_arms|E]. Tem um potencial de melhorias limitado e, mesmo que fortes no início, caem em poder com o passar do tempo. Apenas um personagem [tribal|E] pode controlá-las sem penalidades.\n\nSe uma Tribo existe em um [county|E], nenhuma outra [holding|E] poder ser construída. Um governante [feudal|E] terá que gastar [gold|E] para transformar Tribos em [castles|E]."
 game_concept_tribal_holdings:0 "Propriedades da Tribo"
 game_concept_tribal_i:0 "@government_type_tribal!"
 game_concept_tribe:0 "Tribo"
 game_concept_tribes:0 "Tribos"
 game_concept_tributary_contract:0 "Contrato Tributário"
 game_concept_tributary_contract_desc:0 "$game_concept_tributary_contract$ ditam as [obligations|E] entre um [tributary|E] e seu [suzerain|E].\n\nTodos os Tributários têm acesso a diferentes [obligations|E], negociadas individualmente para cada Tributário.\n\nOs Tributários pagam uma porcentagem de seus [taxes|E], [levies|E], [herd|E], [prestige|E] ou até [piety|E] para seu Suserano, com base em suas [obligations|E]."
 game_concept_tributary_contracts:0 "Contratos Tributários"
 game_concept_tributary_taxes:0 "Impostos de Tributário"
 game_concept_tributary_taxes_desc:0 "Seus $game_concept_tributary_taxes$ consistem nos [taxes|E] que você recebe de seus [tributaries|E]. O valor depende das [obligations|E] de cada Tributário.\n\nDo ponto de vista dos seus Tributários, esses mesmos impostos são chamados de [suzerain_taxes|E] para diferenciá-los de quaisquer $game_concept_tributary_taxes$ que eles recolham de seus próprios $game_concept_tributaries$."
 game_concept_trilateral_interaction:0 "Interação Trilateral"
 game_concept_trilateral_interaction_desc:0 "$game_concept_trilateral_interactions$ exigem não apenas a aprovação de um destinatário, mas também de uma terceira parte.\n\nUm exemplo seriam os [diarch_powers|E], onde um [liege|E] pode usar seu [regency_veto|E]."
 game_concept_trilateral_interactions:0 "Interações Trilaterais"
 game_concept_troop_quality:0 "Qualidade"
 game_concept_troop_quality_desc:0 "$game_concept_troop_quality$ mede o poder de um [army|E] relativo ao seu número de [soldiers|E].\n\nUm $game_concept_army$ que contem apenas [knights|E] e [men_at_arms|E] será de alta $game_concept_troop_quality$ enquanto um $game_concept_army$ que contem uma grande quantidade de [levies|E] irá ter uma menor $game_concept_troop_quality$.\n\nIsto significa que um $game_concept_army$ menor com uma alta $game_concept_troop_quality$ ainda será capaz de causar bastante dano — considere cuidadosamente ambos, a quantidade de Soldados #Emphasis e#! $game_concept_troop_quality$ antes de entrar em batalhas com o inimigo!"
 game_concept_truce:0 "Trégua"
 game_concept_truce_desc:0 "Toda [war|E] termina com uma $game_concept_truce$; um período de tempo em que o Atacante não poderá declarar Guerra novamente no mesmo [ruler|E] (o Defensor não recebe um período de Trégua).\n\nTréguas podem ser quebradas, mas haverá penalidades severas."
 game_concept_truces:0 "Tréguas"
 game_concept_tutorial_education_trait:0 "Traço de Educação"
 game_concept_tutorial_education_trait_desc:0 "O Rei Pequeno Murchad (seu [character|E]) seguiu uma [education|E] [martial|E]. Ao atingir a idade adulta, ele recebeu o traço Tático Habilidoso."
 game_concept_tutorial_education_trait_i:0 "@tutorial_education_trait_icon!"
 game_concept_tyrannical:0 "Tirânico"
 game_concept_tyranny:0 "Tirania"
 game_concept_tyranny_desc:0 "Muitas ações de um [ruler|E] são consideradas um ato $game_concept_tyrannical$ — contra a lei ou [doctrine|E] religiosas. Por exemplo, [imprisoning|E] ou [revoking|E] [titles|E] de alguém que não tenha cometido nenhum [crime|E] é considerado um ato Tirânico.\n\nTirania atua como um modificado de [opinion|E] geral, para todos os personagens no [realm|E]."
 game_concept_tyrant:0 "Tirano"
 game_concept_unassigned_vassal:0 "Vassalos Não Tributados"
 game_concept_unassigned_vassal_desc:0 "$game_concept_unassigned_vassals$ são [vassals|E] do [clan|E] que não são designados a uma [tax_jurisdiction|E] como [taxpayers|E], e portanto não contribuem com [taxes|E] ou [levies|E].\n\nUma vez designados a uma $game_concept_tax_jurisdiction$ com um [tax_collector|E], eles começarão a pagar mensalmente."
 game_concept_unassigned_vassal_short:0 "Não Tributados"
 game_concept_unassigned_vassals:0 "Vassalos Não Tributados"
 game_concept_uncreated_title:0 "Título Não Criado"
 game_concept_undirected_great_holy_war:0 "Grande Guerra Sagrada Não Direcionada"
 game_concept_undirected_great_holy_war_desc:0 "Uma $game_concept_undirected_great_holy_war$ é declarada por um [head_of_faith|E] $doctrine_spiritual_head_name$ com a intenção de trazer um [kingdom|E] sobre o controle de sua [faith|E].\n\n$game_concept_undirected_great_holy_wars$ não são iniciadas imediatamente, em vez disso entram em uma [preparation_phase|E].\n\nAntes e durante a guerra, governantes da Fé atacante podem escolher doar [gold|E] para o [war_chest|E].\n\nSe vitoriosos, o Reino alvo será conquistado e dado à um personagem da Fé atacante. Recompensas para os atacantes incluem [piety|E] e potencialmente tornar sua [dynasty|E] uma Dinastia [landed|E] dentro do Reino conquistado."
 game_concept_undirected_great_holy_wars:0 "Grandes Guerras Sagradas Não Direcionadas"
 game_concept_unity:0 "Unidade"
 game_concept_unlanded:0 "Sem Terra"
 game_concept_unlanded_desc:0 "Personagens $game_concept_unlanded$ não têm [holdings|E] sob seu [domain|E], mas podem teoricamente ser considerados [rulers|E] de alguma forma. Por exemplo, isto pode ser o caso de [heads_of_faith|E] e os Grandes Mestres das [holy_orders|E]."
 game_concept_unpredictable_i:0 "@unpredictable_icon!"
 game_concept_unpreferred_heir:0 "Herdeiro Não Preferido"
 game_concept_unpreferred_heirs:0 "Herdeiros Não Preferidos"
 game_concept_unpressed:0 "Não Pressionada"
 game_concept_unpressed_claim:0 "Reivindicação Não Pressionada"
 game_concept_unpressed_claim_desc:0 "[claims|E] $game_concept_unpressed$ são legalmente tênues, e não são herdadas pelos filhos do [claimant|E].\n\nPorém, Reivindicações Não Pressionadas, podem se tornar [Concept('pressed', 'Pressionadas')|E] se forem usadas em um [casus_belli|E] para declarar uma [war|E] — mesmo se a guerra terminar com uma [white_peace|E]."
 game_concept_unpressed_claim_i:0 "@unpressed_claim!"
 game_concept_unpressed_claims:0 "Reivindicações Não Pressionadas"
 game_concept_unreformed_pagan_combat_bonus:0 "Vantagem de Combate Pagã Não-Reformada"
 game_concept_unreformed_pagan_combat_bonus_desc:0 "As [faiths|E] [GetReligionFamily('rf_pagan').GetName] [GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] possuem uma [advantage|E] de [battle|E] nos [counties|E] da sua fé."
 game_concept_untaxed_jurisdiction:0 "Jurisdição Não Tributada"
 game_concept_untaxed_jurisdiction_desc:0 "Uma $game_concept_untaxed_jurisdiction$ é uma [tax_jurisdiction|E] com [taxpayers|E], mas sem um [tax_collector|E]. Isso significa que os $game_concept_taxpayers$ designados não pagarão [taxes|E] ou [levies|E] ao seu [liege|E]."
 game_concept_untaxed_jurisdiction_short:0 "Não Tributada"
 game_concept_untaxed_jurisdictions:0 "Jurisdições Não Tributadas"
 game_concept_usurp:0 "Usurpar"
 game_concept_usurp_title:0 "Usurpar Título"
 game_concept_usurp_title_desc:0 "Um [title|E] carregado por um [ruler|E] estrangeiro pode ser Usurpado se mais de #V 50%#! dos seus [counties|E] [de_jure|E] estiverem em seu [realm|E]. Este processo da o [title|E] para você, o que é particularmente importante para garantir que você seja o [rightful_liege|E] de seus [vassals|E].\n\nUsurpação é mais difícil se a [faith|E] do Proprietário atual é hostil à sua; neste caso, usurpação só é possível se proprietário não possuir nenhum dos [counties|E] [de_jure|E] dentro do seu Reino."
 game_concept_usurpation:0 "Usurpação"
 game_concept_usurped:0 "Usurpou"
 game_concept_valuable_prisoner:0 "Prisioneiro de Valor"
 game_concept_valuable_prisoner_desc:0 "Um $game_concept_valuable_prisoner$ é um [prisoner|E] que fornece [war_score|E] quando capturado durante uma [war|E].\n\nPara que alguém seja considerado um $game_concept_valuable_prisoner$, essa pessoa deve estar em terceiro lugar ou superior na linha de sucessão para herdar o título principal de seu líder de guerra.\n\n$game_concept_valuable_prisoners$ são libertados quando a guerra termina, ao contrário dos [prisoners_of_war|E]."
 game_concept_valuable_prisoners:0 "Prisioneiros de Valor"
 game_concept_vassal:0 "Vassalo"
 game_concept_vassal_contract:0 "Contrato Vassálico"
 game_concept_vassal_contract_desc:0 "$game_concept_vassal_contracts$ ditam as [obligations|E] entre um [vassal|E] e seu [liege|E].\n\nVassalos das $game_concept_government_forms$ [feudal|E], [clan|E], [administrative|E] e [nomadic|E] têm acesso a diferentes [obligations|E], negociados individualmente para cada Vassalo.\n\nTodos os Vassalos pagam uma porcentagem de seus [taxes|E] e [levies|E] para seu Senhor Feudal, com base em suas [obligations|E]. #EMP Estes [modifier_contributions|E] podem, por sua vez, ser modificados por opções de 'letra miúda', como [GetSubjectContractType( 'fortification_rights' ).GetObligationName( 'fortification_rights_granted' )].#!\n\nAlguns Contratos Especiais são limitados a certos Níveis:\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_march' )|V] e [GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_scutage' )|V]: [duke|E] e acima\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_palatinate' )|V]: [count|E] e acima\n$EFFECT_LIST_BULLET$[GetSubjectContractType( 'special_contract' ).GetObligationName( 'special_contract_castellan' )|V]: [count|E] apenas\n\n#weak Nota, [obligations|E] de [governor|E] também são conhecidos como [province_administrations|E].#!"
 game_concept_vassal_contracts:0 "Contratos Vassálicos"
 game_concept_vassal_desc:0 "Um $game_concept_vassal$ é um [ruler|E] que jurou lealdade a outro governante — O [liege|E] dele.\n\nO $game_concept_vassal$ provê para o seu senhor feudal [levies|E] e [taxes|E] — suas [obligations|E] — em troca de proteção.\n\nSe a [opinion|E] de um $game_concept_vassal$ sobre seu senhor feudal está baixa, ele pode se juntar às [factions|E], ou um [scheme|E] para substituir seu senhor feudal."
 game_concept_vassal_directive:0 "Diretiva do Vassalo"
 game_concept_vassal_directive_desc:0 "Como [liege|E], você pode emitir Diretivas para seus [vassals|E], influenciando suas [councillor_tasks|E] e quais [buildings|E] eles constroem.\n\nPara emitir uma Diretiva, você precisa ativá-la, como ter #P 50#! ou mais [opinion|E] com o Vassalo. [government_forms|E] avançadas não exigem isso."
 game_concept_vassal_directives:0 "Diretivas dos Vassalos"
 game_concept_vassal_limit:0 "Limite de Vassalos"
 game_concept_vassal_limit_desc:0 "O $game_concept_vassal_limit$ determina quantos [direct_vassals|E] você pode legalmente ter (não incluindo vassalos do nível de [barony|E]).\n\nApesar de você poder ir acima do seu $game_concept_vassal_limit$, fazer isso irá reduzir a quantidade de [taxes|E] e [levies|E] que você recebe deles, e talvez você se saia melhor [transferring|E] alguns vassalos para continuar abaixo do limite."
 game_concept_vassal_obligations:0 "Obrigações de Vassalo"
 game_concept_vassal_obligations_desc:0 "$game_concept_vassal_obligations$ definem quanto [tax|E] e quantas [levies|E] um [vassal|E] fornece ao seu [liege|E]. A [government_form|E] de um vassalo determina como suas $game_concept_obligations$ são modificadas.\n\n#weak Por exemplo, as $game_concept_obligations$ dos [vassals|E] [GetGovernment('feudal_government').GetName] e [GetGovernment('clan_government').GetName] dependem de seu [vassal_contract|E], enquanto os vassalos do [GetGovernment('administrative_government').GetName] dependem de sua [province_administration|E]."
 game_concept_vassal_possessive:0 "do Vassalo"
 game_concept_vassal_stance:0 "Postura de Vassalo"
 game_concept_vassal_stance_desc:0 "Cada [vassal|E] tem uma Posição de Vassalo que afeta a [opinion|E] que eles têm com você como seu [liege|E], e qual [heir|E] eles preferem como sucessor do [realm|E].\n\nVassalos na mesma posição terão gostos e desgostos semelhantes. Por exemplo, todos os Vassalos [GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName] não gostam quando você perde [wars|E].\n\nCada Posição de Vassalo prefere um Heir específico. Após a sucessão, cada Heir preferido terá uma [legitimacy_expectations|E] mais baixa com os Vassalos dessa posição.\n\n#low As Posicões de Vassalo são:#!\n$EFFECT_LIST_BULLET$[GetVassalStance( 'courtly' ).GetTextIcon][GetVassalStance( 'courtly' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'parochial' ).GetTextIcon][GetVassalStance( 'parochial' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'glory_hound' ).GetTextIcon][GetVassalStance( 'glory_hound' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'zealot' ).GetTextIcon][GetVassalStance( 'zealot' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'minority' ).GetTextIcon][GetVassalStance( 'minority' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'barons_and_minor_landholders' ).GetTextIcon][GetVassalStance( 'barons_and_minor_landholders' ).GetName]\n$EFFECT_LIST_BULLET$[GetVassalStance( 'belligerent' ).GetTextIcon][GetVassalStance( 'belligerent' ).GetName]"
 game_concept_vassal_stances:0 "Posturas de Vassalo"
 game_concept_vassal_taxes:0 "Impostos de Vassalos"
 game_concept_vassal_taxes_desc:0 "Seus $game_concept_vassal_taxes$ consistem dos [taxes|E] que você recebe de seus [vassals|E]. A quantidade depende das [obligations|E] de cada Vassalo.\n\nDo ponto de vista dos seus Vassalos, estes impostos são chamados de [liege_taxes|E] para distingui-lo dos $game_concept_vassal_taxes$ que eles coletam de seus próprios $game_concept_vassals$."
 game_concept_vassalage:0 "Vassalagem"
 game_concept_vassalization:0 "Vassalização"
 game_concept_vassalization_casus_belli:0 "Vassalização Forçada"
 game_concept_vassalize:0 "Vassalizar"
 game_concept_vassalize_casus_belli:0 "Causus Belli de Vassalização Forçada"
 game_concept_vassalize_casus_belli_desc:0 "Um [casus_belli|E] que permite a [vassalization|E] forçada de um [ruler|E] vizinho independente de menor nível. Desbloqueado pelo [perk|E] [GetPerk('forced_vassalage_perk').GetName(GetNullCharacter)].\n\nVocê pode Vassalizar qualquer governante que não tenha mais do que #V [EmptyScope.ScriptValue('vassalize_default_size')|0]#! [counties|E] em seu [realm|E].\n\nEste limite é aumentado por #P +[EmptyScope.ScriptValue('vassalize_growth_per_innovation')|0]#! para cada uma das seguintes inovações:\n$EFFECT_LIST_BULLET$#V $innovation_casus_belli$#!\n$EFFECT_LIST_BULLET$#V $innovation_chronicle_writing$#!\n$EFFECT_LIST_BULLET$#V $innovation_divine_right$#!\n$EFFECT_LIST_BULLET$#V $innovation_rightful_ownership$#!"
 game_concept_vassalized_casus_belli:0 "Vassalizado a Força"
 game_concept_vassals:0 "Vassalos"
 game_concept_vassals_possessive:0 "dos Vassalos"
 game_concept_veto:0 "Veto"
 game_concept_victim:0 "Vítima"
 game_concept_victim_desc:0 "Uma $game_concept_victim$ é uma [child|E] que está sendo assediada por outra $game_concept_child$, muitas vezes por razões obscuras para qualquer pessoa além de seu [bully|E]. Ao atingir a [adulthood|E], eles podem se tornar [rivals|E] de seu $game_concept_bully$, ou aprender a superar as lutas da juventude."
 game_concept_victim_possessive:0 "Da vítima"
 game_concept_victims:0 "Vítimas"
 game_concept_victims_possessive:0 "Das vítimas"
 game_concept_victory:0 "Vitória"
 game_concept_victory_desc:0 "$game_concept_victory$ é um dos três tipos de [peace_offers|E]. O resultado de uma Vitória em uma [war|E] depende do [casus_belli|E] utilizado.\n\nPara o Atacante, normalmente envolve a apreensão de [titles|E] que são parte do [war_target|E].\n\nPara o Defensor, Vitória normalmente significa que o Atacante terá que pagar uma alta quantia de ouro em reparações de guerra."
 game_concept_virtue:0 "Virtude"
 game_concept_virtue_desc:0 "Toda [faith|E] considera alguns [traits|E] como Virtuosos. Personagens que tiverem tais Traços recebem um bônus em [opinion|E] de todos os personagens que também considerarem tais traços como Virtudes, mesmo se não tiverem a mesma Fé. Em adição, Personagens que tem Traços cuja sua Fé considera Virtuosos irão receber um bônus de [piety|E] todo mês.\n\nQuais traços exatamente são considerados Virtudes Variam de Fé para Fé, mas é tipicamente determinado por uma combinação dos [core_tenets|E] de tal Fé e a [religion|E] que a Fé pertence."
 game_concept_virtue_weight:0 "Peso da Virtude"
 game_concept_virtue_weight_desc:0 "Características podem ter um [sin|E] ou [virtue|E] associado, determinado pelos [core_tenets|E] e [doctrines|E] de um [rite|E], e pelo [religion|E] ao qual pertence.\n\nAs características com maior Peso de Pecado ou Virtude dentro de um Rito se tornam os [sins|E] e [virtues|E] desse Rito."
 game_concept_virtues:0 "Virtudes"
 game_concept_virtuous:0 "Virtuoso"
 game_concept_vizier:0 "Vizir"
 game_concept_vizier_desc:0 "Um $game_concept_vizier$ é um tipo de [diarch|E] que [rulers|E] do [clan|E] podem nomear voluntariamente para ajudar a aumentar seu [income|E]. Eles têm menos [diarch_powers|E], mas podem ser muito difíceis de remover.\n\n$game_concept_viziers$ concedem a seu [liege|E] bônus de [tax_jurisdictions|E] escalonadas com base em sua [stewardship|E], e aumentam a [aptitude|E] dos [tax_collectors|E] de acordo com o favorecimento das [scales_of_power|E].\n\nEssencialmente, os $game_concept_lieges$ podem drenar os $game_concept_viziers$ de seu [gold_i][gold|E] por meio da [interaction|E] $mulct_vizier_interaction$.\n\n#WEAK Por serem servidores civis empoderados, os $game_concept_viziers$ não são considerados uma posição prestigiada para [nobles|E] apesar de sua influência. Seu sucessor é escolhido de acordo com [vizier_succession_score|E].#!\n\n$variant_diarchs_replace_regents_boilerplate$"
 game_concept_vizier_extravagance:0 "Extravagância do Vizir"
 game_concept_vizier_extravagance_desc:0 "Enquanto no cargo, os [viziers|E] gastarão seu [gold|E] em [modifiers|E] de $game_concept_vizier_extravagance_extravagance$ cada vez mais ornamentais, mimando a si mesmos e à outra elite social da [capital|E] de seu [liege|E].\n\nO $game_concept_liege$ pode saquear esses $game_concept_modifiers$ usando a [interaction|E] $mulct_vizier_interaction$, transformando-os em $game_concept_gold$ que o $game_concept_vizier$ é forçado a transferir.\n\n#WEAK Quando um $game_concept_vizier$ para de [sharing_power|E], ele perde a capacidade de manter seu estilo de vida extravagante, e quaisquer $game_concept_modifiers$ remanescentes são perdidos.\n\nSaquear mais e os níveis posteriores proporcionam mais $game_concept_gold$ — os quatro níveis de $game_concept_vizier_extravagance_extravagance$ são:\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t1_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t2_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t3_title$\n$EFFECT_LIST_BULLET$ $vizier_extravagance_t4_title$#!"
 game_concept_vizier_extravagance_extravagance:0 "Extravagância"
 game_concept_vizier_extravagance_extravagances:0 "Extravagâncias"
 game_concept_vizier_extravagances:0 "Extravagâncias do Vizir"
 game_concept_vizier_succession_score:0 "Pontuação de Sucessão do Vizir"
 game_concept_vizier_succession_score_desc:0 "Em um [vizierate|E], o próximo $game_concept_vizier$ é escolhido com base em qual candidato tem a maior $game_concept_vizier_succession_score$.\n\nOs candidatos em potencial ocasionalmente tentam convencer o [ruler|E] a permitir que eles substituam o titular em troca de [gold|E].\n\n#WEAK Isso permite apenas [characters|E] sem terras e de [title_tier|E] [baron|E], favorecendo aqueles com uma forte [diplomacy|E], [stewardship|E] e [intrigue|E], além dos [traits|E] que fazem um bom servidor civil.\n\nAs [relations|E] com o titular $game_concept_vizier$ ou com [spouses|E] do [liege|E], [concubines|E] e [Concept('children', 'Filhos Adultos')|E] sem terras podem afetar drasticamente a pontuação.#!"
 game_concept_vizierate:0 "Vizirato"
 game_concept_viziers:0 "Vizires"
 game_concept_vote_strength:0 "Força de Voto"
 game_concept_voter_strength:0 "Força do Eleitor"
 game_concept_voter_strength_desc:0 "Força do Voto representa a quantidade de influência que o Eleitor carrega quando votando em uma [succession_law|E] eletiva. Este valor normalmente aumenta dependendo da [rank|E] do governante, mas outros fatores podem alterar este valor também dependendo da Lei do [title|E]."
 game_concept_voting_power:0 "Força de Voto"
 game_concept_voting_strength:0 "Força de Voto"
 game_concept_wanderer:0 "Andarilho"
 game_concept_wanderer_desc:0 "Personagens que não pertencem à uma [court|E] ou têm quaisquer [titles|e] são chamados de Andarilhos. Eles viajam por todo o mundo, visitando Cortes como. Andarilhos podem se tornar um Capitão [mercenary|E], Líderes das [holy_orders|E], membros de um [clergy|E], ou proprietários de uma [city|E]."
 game_concept_wanderer_lifestyle:0 "Estilo de Vida de Viajante"
 game_concept_wanderer_lifestyle_desc:0 "O $game_concept_wanderer_lifestyle$ é adequado para Personagens que desejam ver [points_of_interest|E] ou ganhar bônus adicionais ao [traveling|E]."
 game_concept_wanderers:0 "Andarilhos"
 game_concept_wanua:0 "Wanua"
 game_concept_wanua_desc:0 "O [government|E] $wanua_government_adjective$ compartilha fraquezas com o [government|E] [GetGovernment('tribal_government').GetNameWithIcon], mas também possui [domain_limit|E] e [vassal_limit|E] reduzidos. Embora use [gold|E] para construir [buildings|E] e recrutar [men_at_arms|E], ele ganha muito pouco Ouro com Edificações.\n\nNo entanto, pode realizar [barter_goods_i][barter|E], [raid|E], e tem sinergia com o [GetGovernment('mandala_government').GetName] por ganhar [legitimacy|E] ao ser um [tributary|E]."
 game_concept_wanua_government:0 "Governo Wanua"
 game_concept_wanua_i:0 "@government_type_wanua!"
 game_concept_war:0 "Guerra"
 game_concept_war_chest:0 "Cofre de Guerra"
 game_concept_war_chest_desc:0 "O $game_concept_war_chest$ é uma coleção de [gold|E], [piety|E] e [prestige|E]. Os conteúdos são primariamente utilizados como recompensas na vitória de uma [undirected_great_holy_wars|E], onde são dividios entre os atacantes baseado na participação de cada um na [war|E].\n\nUma porção do que estiver no $game_concept_war_chest$ também é dividida entre os atacantes quando a a GUerra é declarada.\n\nSe uma [undirected_great_holy_war|E] é derrotada, os defensores irão dividir a Piedade e Prestigio do $game_concept_war_chest$ entre sí #weak (o Ouro é perdido.)#!"
 game_concept_war_contribution:0 "Colaboração de Guerra"
 game_concept_war_contribution_desc:0 "[rulers|E] que estiverem ajudando seus [allies|E] em uma [war|E] ganham $game_concept_war_contribution$ dependendo do número e tamanho de [battles|E] que lutarem, e também a quantidade de [holdings|E] que eles conseguirem [occupy|E].\n\nAo fim de uma guerra, cada Colaborador é recompensado de acordo com sua Colaboração. Os Ganhos dependem do [casus_belli|E] utilizado na guerra, mas normalmente é [gold|E], [prestige|E] ou [piety|E].\n\nLembre-se que sua Colaboração aumenta mesmo ao ser derrotado em Batalhas."
 game_concept_war_desc:0 "Um Conflito Armado é a forma mais direta de expandir seu [realm|E]. Porém, declarar uma $game_concept_war$ precisa de uma justificativa, sendo esta justificativa chamada de [casus_belli|E]. Você não pode obter mais do que um Casus Belli permite em uma $game_concept_war$.\n\nGuerras são ganhas por derrotar [armies|E] inimigos em [battle|E] e [occupying|E] [holdings|E] inimigas. Fazer isto irá gerar [war_score|E] à seu favor, eventualmente forçando o inimigo a aceitar a [defeat|E] na [peace_offer|E].\n\nIndependentemente do resultado de uma $game_concept_war$, o atacante ganha uma [truce|E] contra o defensor por um tempo, porém o defensor esta livre para declarar uma nova guerra imediatamente."
 game_concept_war_leader:0 "Líder da Guerra"
 game_concept_war_leaders:0 "Líderes da Guerra"
 game_concept_war_leaders_desc:0 "O principal atacante e o principal defensor de uma [war|E]. Normalmente, esse é o personagem que iniciou a guerra e o [top_liege|E] do personagem que detém o [war_target|E].\n\nExistem diversos [casus_belli|E] para muitos tipos diferentes de guerra, alguns com personagens diferentes como os $game_concept_war_leaders$."
 game_concept_war_score:0 "Mérito"
 game_concept_war_score_desc:0 "Uma medida utilizada para saber qual lado está ganhando em uma [war|E]. Pode ir de #N -100#! até #P 100#!, se um lado estiver em #N -25#! o outro estará com #P 25#!. Ao atingir #P 100#! Pontos de Guerra, você poderá forçar o outro lado a aceitar sua [peace_offer|E].\n\nMérito pode ser ganho por:\n$EFFECT_LIST_BULLET$ Derrotar [armies|E] em [battle|E]\n$EFFECT_LIST_BULLET$ [imprisoning|E] o [ruler|E] inimigo ou seus [heirs|E] (não inclui seus [allies|E])\n$EFFECT_LIST_BULLET$ [occupying|E] [holdings|E] inimigas (especialmente as contidas no [war_target|E])\n$EFFECT_LIST_BULLET$ Ocupar a [realm_capital|E] inimiga\n$EFFECT_LIST_BULLET$ Controlar todos os [objectives|E] por um longo período de tempo"
 game_concept_war_target:0 "Alvo de Guerra"
 game_concept_war_target_desc:0 "Uma região alvo de um [casus_belli|E] em uma [war|E]. Se o casus belli não tiver uma região específica como alvo, a [realm_capital|E] do defensor é o $game_concept_war_target$.\n\nO lado atacante ganha mais [war_score|E] [occupying|E] [holdings|E] contidas no $game_concept_war_target$. Inversamente, o defensor irá — após um período de carência inicial — acumular pontos por se manter no controle de todos os [counties|E] dentro da região do $game_concept_war_target$."
 game_concept_war_targets:0 "Alvos de Guerra"
 game_concept_ward:0 "Protegido"
 game_concept_ward_desc:0 "Um $game_concept_ward$ é uma [child|E] sendo [Concept('educate', 'Educada')|E] por um [guardian|E]. Cada $game_concept_guardian$ pode cuidar de até dois $game_concept_wards$."
 game_concept_ward_possessive:0 "Do Protegido"
 game_concept_warden:0 "Guardião"
 game_concept_warden_desc:0 "Um [ruler|E] que recebeu um [hostage|E] de uma [home_court|E] estrangeira como garantia de paz ou submissão.\n\nUm [warden|E] acumulará [prestige_i|E][prestige|E] ao longo do tempo para cada [hostage|E] em sua [court|E]."
 game_concept_wardens:0 "Guardiões"
 game_concept_wardens_possessive:0 "Do Guardião"
 game_concept_wards:0 "Protegidos"
 game_concept_wards_possessive:0 "Dos Protegidos"
 game_concept_warlike_i:0 "@warlike_icon!"
 game_concept_wars:0 "Guerras"
 game_concept_weak_hook:0 "Gancho Fraco"
 game_concept_weak_hook_desc:0 "Um $game_concept_weak_hook$ é um [hook|E] relativamente comum que você pode ter sobre um personagem que lhe deve um favor ou que você manipulou para fazer sua vontade.\n\nEmbora existam muitas interações onde um $game_concept_weak_hook$ pode ser usado, como em propostas de [marriage|E], eles não podem ser usados para forçar alguém a se tornar seu [agent|E] em [GetScheme('murder').GetTypeName] e não fornecem nenhum benefício passivo #weak (para isso, um [strong_hook|E] é necessário.)#!\n\nToda criança nascida em uma [house|E] [noble|E] também deve um $game_concept_weak_hook$ inicial ao [house_head|E].\n\nUma vez que um $game_concept_weak_hook$ é usado, ele é #emphasis gasto.#!"
 game_concept_weak_hooks:0 "Ganchos Fracos"
 game_concept_wedding_banquet:0 "Banquete"
 game_concept_wedding_banquet_desc:0 "A [activity_phase|E] em um [GetActivityType('activity_wedding').GetName] em que comida e bebidas são oferecidas, e os convidados desfrutam do entretenimento e se misturam."
 game_concept_wedding_ceremony:0 "Cerimônia"
 game_concept_wedding_ceremony_desc:0 "A [activity_phase|E] em um [GetActivityType('activity_wedding').GetName] em que os [spouses|E] trocam votos e se [Concept('married', 'Casam')|E]."
 game_concept_wedding_night:0 "Noite de Núpcias"
 game_concept_wedding_night_desc:0 "A [activity_phase|E] em um [GetActivityType('activity_wedding').GetName] em que os [spouses|E] consumam o casamento, e os convidados continuam a celebração."
 game_concept_white_peace:0 "Paz Branca"
 game_concept_white_peace_desc:0 "Uma $game_concept_white_peace$ é um dos três tipos de [peace_offers|E]. Às vezes, os dois lados irão concordar que a [war|E] não não vale mais a pena.\n\nCom uma Paz Branca, o Atacande normalmente ainda perde alguma [piety|E] ou [prestige|E], porém muito menos do que em uma [defeat|E] humilhante."
 game_concept_win:0 "Vencer"
 game_concept_winning:0 "Vencendo"
 game_concept_wins:0 "Vence"
 game_concept_winter:0 "Severidade do Inverno"
 game_concept_winter_desc:0 "O inverno drena constantemente o [supply|E] ao longo do tempo, fazendo com que os exércitos percam suprimento enquanto estão em uma baronia afetada pelo inverno. A penalidade de suprimento aumenta a cada severidade. O inverno tem três severidades diferentes; [Concept( 'winter_severity_mild', 'Leve' )|E], [Concept( 'winter_severity_normal', 'Normal' )|E] e [Concept( 'winter_severity_harsh', 'Rigoroso' )|E]."
 game_concept_winter_severity_harsh:0 "Inverno Rigoroso"
 game_concept_winter_severity_harsh_desc:0 "[GetModifier( 'winter_harsh_modifier' ).GetDescWithEffects]"
 game_concept_winter_severity_mild:0 "Inverno Leve"
 game_concept_winter_severity_mild_desc:0 "[GetModifier( 'winter_mild_modifier' ).GetDescWithEffects]"
 game_concept_winter_severity_normal:0 "Inverno Normal"
 game_concept_winter_severity_normal_desc:0 "[GetModifier( 'winter_normal_modifier' ).GetDescWithEffects]"
