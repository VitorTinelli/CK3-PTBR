 update_diarchy_swing_with_perspective_effect.neutral_perspective.miniscule_sop_swing_liege_gain.tt:0 "$update_diarchy_swing_with_perspective_effect.preamble$ [EmptyScope.ScriptValue('miniscule_sop_swing_diarch_gain')|0V] $update_diarchy_swing_with_perspective_effect.postamble.liege$"
 update_diarchy_swing_with_perspective_effect.neutral_perspective.minor_sop_swing_diarch_gain.tt:0 "$update_diarchy_swing_with_perspective_effect.preamble$ [EmptyScope.ScriptValue('minor_sop_swing_diarch_gain')|0V] $update_diarchy_swing_with_perspective_effect.postamble.diarch$"
 update_diarchy_swing_with_perspective_effect.neutral_perspective.minor_sop_swing_liege_gain.tt:0 "$update_diarchy_swing_with_perspective_effect.preamble$ [EmptyScope.ScriptValue('minor_sop_swing_diarch_gain')|0V] $update_diarchy_swing_with_perspective_effect.postamble.liege$"
 update_diarchy_swing_with_perspective_effect.neutral_perspective.monumental_sop_swing_diarch_gain.tt:0 "$update_diarchy_swing_with_perspective_effect.preamble$ [EmptyScope.ScriptValue('monumental_sop_swing_diarch_gain')|0V] $update_diarchy_swing_with_perspective_effect.postamble.diarch$"
 update_diarchy_swing_with_perspective_effect.neutral_perspective.monumental_sop_swing_liege_gain.tt:0 "$update_diarchy_swing_with_perspective_effect.preamble$ [EmptyScope.ScriptValue('monumental_sop_swing_diarch_gain')|0V] $update_diarchy_swing_with_perspective_effect.postamble.liege$"
 update_diarchy_swing_with_perspective_effect.postamble.diarch:0 "#!em direção a [liege_loc.GetDiarchy.GetDiarch.GetShortUIName]"
 update_diarchy_swing_with_perspective_effect.postamble.liege:0 "#!em direção a [liege_loc.GetShortUIName]"
 update_diarchy_swing_with_perspective_effect.preamble:0 "[scales_of_power|E] da [liege_loc.LocalPlayerString( 'sua ', '' )][liege_loc.GetDiarchyTypeName][liege_loc.LocalPlayerString( '', 'Loc_ES_de_GetShortUIName' )] oscilam"
 viz_extravagance.t1.activities.auctions:0 "Este personagem regularmente realiza leilões de caridade, vendendo alguns de seus tesouros acumulados para arrecadar dinheiro para os necessitados do reino."
 viz_extravagance.t1.activities.board_game_tourneys:0 "Este personagem se deleita em organizar torneios competitivos de jogos de tabuleiro para a classe alta, com as grandes e boas pessoas de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] jogando todas as últimas variações."
 viz_extravagance.t1.activities.exhibitions:0 "Este personagem tem gosto pela arte e faz questão de patrocinar as artes e exibir os frutos de sua benevolência, às vezes até para os membros mais humildes da sociedade."
 viz_extravagance.t1.activities.feasts.commoners:0 "Este personagem gosta de festas regulares e fartas, mas faz questão de convidar os cidadãos mais notáveis de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], mesmo que sua classe os impeça de outra forma."
 viz_extravagance.t1.activities.feasts.weekly:0 "Este personagem se deleita em realizar grandes banquetes toda semana — a nobreza inferior de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] quase depende deles apenas para suas cozinhas."
 viz_extravagance.t1.activities.feasts:0 "Este personagem gosta de banquetear regularmente a nobreza local em encontros privados. Alguns sussurram que sangue real já foi derramado para conseguir um convite."
 viz_extravagance.t1.activities.festivals:0 "Este personagem é conhecido por abrir os jardins e salões inferiores de suas residências privadas para pequenos festivais, permitindo que os plebeus tenham uma breve amostra da grandiosidade nobre."
 viz_extravagance.t1.activities.orgies:0 "Este personagem é conhecido por realizar encontros #EMP discretos#! para alguns dos moradores mais... salaces de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.activities.parades:0 "Este personagem se deleita em organizar desfiles nos quais moedas e alimentos são atirados aos necessitados, sempre às suas próprias custas — e em seu próprio nome."
 viz_extravagance.t1.activities.pigeon_racing:0 "Este personagem tem uma fascinação um tanto embaraçosa com corridas de pombos competitivas; eles até mesmo possuem um pombal espaçoso."
 viz_extravagance.t1.charity.awkward_children:0 "Este personagem paga por um esquema que compra jarras de água de reposição para crianças jovens empregadas que quebram as suas enquanto vão buscar a água da manhã — sem que ninguém das casas das crianças ouça falar sobre seus pequenos acidentes."
 viz_extravagance.t1.charity.beggars:0 "Este personagem paga por um fundo que alimenta e veste os mendigos e desamparados de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], uma linha vital para a escória do reino."
 viz_extravagance.t1.charity.birds:0 "Este personagem paga para que sementes sejam regularmente semeadas em certos becos para os pássaros da capital — apenas os bárbaros deixariam tais animais sofrerem e passarem fome."
 viz_extravagance.t1.charity.building_repair:0 "Este personagem paga por um pequeno fundo acessível aos cidadãos da capital cujos prédios sofram danos — se eles não puderem arcar com os reparos, então recebem uma bolsa."
 viz_extravagance.t1.charity.civil_service.guard:0 "Este personagem paga por um pequeno posto de guarda, e sentinela ocupante, para ficar do lado de fora de um dos prédios administrativos mais importantes em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.charity.feasts.religious:0 "Este personagem subsidia uma série de festas religiosas anuais para os plebeus de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.charity.judges:0 "Este personagem paga para que alguns dos juízes profissionais do reino dediquem mais tempo a ouvir casos e viajar pelos seus circuitos."
 viz_extravagance.t1.charity.kitchens:0 "Este personagem paga por uma série de pequenas cozinhas gratuitas, alimentando os pobres agradecidos de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.charity.monastery:0 "Este personagem financia a manutenção (e pagou pela criação) de uma comunidade religiosa isolada, longe dos pecados da vida normal."
 viz_extravagance.t1.charity.orphans:0 "Este personagem paga por uma pensão pública para acolher e educar um número definido de órfãos a cada ano. Os jovens recebem uma educação adequada, alimentação, alojamento e instrução ética até atingirem a maioridade."
 viz_extravagance.t1.charity.widowers:0 "Este personagem paga pensões para alguns dos viúvos desamparados da capital."
 viz_extravagance.t1.charity.widows:0 "Este personagem paga pensões para algumas das viúvas desamparadas da capital."
 viz_extravagance.t1.property.agent_network:0 "Este personagem mantém uma rede de agentes por todo o reino, monitorando e mantendo seus interesses comerciais até nos postos mais distantes."
 viz_extravagance.t1.property.gangers:0 "Este personagem #EMP supostamente#! tem uma das principais gangues de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] em sua folha de pagamento; o que exatamente um funcionário público respeitável faria com um bando de bandidos cruéis é uma incógnita."
 viz_extravagance.t1.property.hostel:0 "Este personagem possui uma hospedaria barata em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], voltada deliberadamente para os mais pobres e menos capazes da sociedade."
 viz_extravagance.t1.property.manse:0 "Este personagem possui uma mansão privada nos arredores de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — perto o suficiente para ser conveniente, longe o suficiente para ser discreta."
 viz_extravagance.t1.property.market_officials_on_payroll:0 "Este personagem é conhecido por ter todos os inspetores e fiscais de um dos principais mercados da capital em sua folha de pagamento. Tudo para manter sua integridade para o reino, é claro."
 viz_extravagance.t1.property.minor_businesses:0 "Os interesses comerciais deste personagem são muitos e diversos, incluindo pequenas oficinas, guildas menores e domínios livres por toda a capital."
 viz_extravagance.t1.property.rooftop_garden:0 "Este personagem paga para manter um amplo jardim no telhado em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], para espanto dos cidadãos abaixo."
 viz_extravagance.t1.property.small_arena:0 "Este personagem possui e mantém uma pequena arena privada para corridas de cavalos. O jogo que isso permite é, é claro, um benefício adicional."
 viz_extravagance.t1.property.toll_road:0 "Este personagem é o único proprietário de uma estrada com pedágio particularmente lucrativa que leva até [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Como eles vieram a possuí-la e quando o pedágio foi estabelecido, são questões de muita especulação."
 viz_extravagance.t1.property.townhouse:0 "Este personagem possui uma casa na cidade ricamente decorada, mas adequadamente modesta, em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.treasure.clothing:0 "Este personagem tem um guarda-roupa aparentemente interminável de roupas finas em todas as últimas tendências - além de muitas prontas para criar suas próprias modas."
 viz_extravagance.t1.treasure.cosmetics:0 "Este personagem certamente tem acesso a uma quantidade anormalmente grande de perfumes, ungüentos e cosméticos finos para alguém de sua posição."
 viz_extravagance.t1.treasure.drugs:0 "Os armários deste personagem são conhecidos por abrigar uma bela coleção de drogas, bebidas e poções exóticas, muitas das quais estão entre as substâncias mais raras acessíveis em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t1.treasure.furniture:0 "Os móveis deste personagem são sempre feitos das melhores madeiras e minérios estrangeiros importados - substituídos tão frequentemente quanto a moda permite, ditada pelo bom gosto."
 viz_extravagance.t1.treasure.game_pieces:0 "Este personagem tem uma cópia de todos os jogos de tabuleiro conhecidos neste canto do mundo, com peças esculpidas em tudo, desde pedras preciosas até ossos de bestas lendárias."
 viz_extravagance.t1.treasure.hankerchiefs:0 "Este personagem passa por um número simplesmente desproporcional de lenços de linho finos - dez por dia no verão, mas ainda assim os joga fora após o uso."
 viz_extravagance.t1.treasure.hats:0 "Este personagem raramente se preocupa em usar o mesmo chapéu por mais de uma ou duas semanas - por que se restringir quando há tantas variedades mais novas e altas a cada ano?"
 viz_extravagance.t1.treasure.hourglasses:0 "Este personagem possui alguns dos ampulhetas mais meticulosamente precisos do planeta - para um funcionário público, há poucas ferramentas mais luxuosas."
 viz_extravagance.t1.treasure.jewellery:0 "Este personagem nunca parece ficar sem enfeites para se adornar; ouro, prata e pedras preciosas piscam em seu rosto e mãos."
 viz_extravagance.t1.treasure.relics:0 "Este personagem é conhecido por possuir uma pequena, mas fina, coleção de relíquias sagradas."
 viz_extravagance.t2.activities.amnesties:0 "Este personagem acredita que qualquer um pode ser perdoado, desde que se arrependam e façam as pazes — eles usam sua posição administrativa para organizar anistias regulares para criminosos que se mostram suficientemente penitentes."
 viz_extravagance.t2.activities.animal_baiting:0 "Este personagem ama nada mais do que os bufidos, rosnados e gritos de uma fera feroz lutando por sua vida. Domadores, cães e criaturas ferozes tanto exóticas quanto mundanas lutam em arenas na maioria de suas festas."
 viz_extravagance.t2.activities.concerts:0 "Este personagem valoriza a música acima das outras artes, considerando sua ausência a verdadeira de todas as tragédias. Muitas de suas festividades são essencialmente grandes concertos — às vezes até grandes o suficiente para alguns plebeus participarem."
 viz_extravagance.t2.activities.feasts.interactive:0 "As festas deste personagem são conhecidas por seu componente interativo: bolsas de moedas escondidas na comida dos convidados, escrituras de terras que precisam apenas de um nome assinado deixado no banheiro, esculturas que se desdobram para revelar uma pedra preciosa para a primeira pessoa a desvendar seus segredos e muitos outros."
 viz_extravagance.t2.activities.feasts.long:0 "Este personagem é um firme crente de que uma festa não termina até que as despensas do anfitrião se esgotem — consequentemente, algumas de suas festas são conhecidas por durar uma semana ou mais."
 viz_extravagance.t2.activities.feasts.pool:0 "Este personagem se deleita em realizar festividades em torno de uma espaçosa piscina artificial, construída com grande despesa em uma de suas residências particulares e cercada por almofadas felpudas, divãs e o tilintar de bebidas sendo servidas."
 viz_extravagance.t2.activities.gambling.horse:0 "O orgulho e a alegria deste personagem são uma coleção inteira de competitivos cavalos de corrida — quase todos de linhagem estrangeira mais pura."
 viz_extravagance.t2.activities.poetry:0 "Este personagem se considera algo poeta — concordem os outros ou não, os convites para as festas luxuosas onde declamam suas leituras são muito cobiçados."
 viz_extravagance.t2.activities.sermons:0 "Este personagem é apaixonadamente religioso além do que a decência pede, e faz questão de encher suas festividades com sermões e [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural] itinerantes."
 viz_extravagance.t2.activities.theatre:0 "Este personagem ama a teatralidade, a atuação e os malabarismos como poucos. Suas festas apresentam um número desproporcional de artistas itinerantes, e os clássicos antigos com novos rostos são uma peça comum em cada festa."
 viz_extravagance.t2.charity.circumcision:0 "Este personagem financia pessoalmente a circuncisão e educação religiosa de um certo número de meninos órfãos das ruas de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] a cada ano."
 viz_extravagance.t2.charity.civil_service.extra_positions:0 "Este personagem financia pessoalmente o preenchimento de posições-chave no serviço civil, multiplicando o poder da burocracia muitas vezes ao fornecer financiamento onde mais importa."
 viz_extravagance.t2.charity.hospitals:0 "Este personagem financia pessoalmente vários hospitais famosos em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], instituições que tratam os mais pobres da sociedade, mas dependem inteiramente de sua generosidade."
 viz_extravagance.t2.charity.police:0 "Este personagem financia pessoalmente uma equipe leal de guardas e agentes para percorrer [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], garantindo que a lei seja obedecida exatamente na medida em que o visir exige."
 viz_extravagance.t2.charity.poor_funerals:0 "Este personagem financia pessoalmente os funerais daqueles que morrem em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] sem os fundos, família ou amigos para morrer com dignidade."
 viz_extravagance.t2.charity.preachers:0 "Este personagem financia pessoalmente [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural] mendicantes para percorrer a terra, atendendo aos fiéis necessitados e oferecendo conselhos espirituais sólidos aos menos fiéis."
 viz_extravagance.t2.charity.scholars.legal:0 "Este personagem financia pessoalmente alguns dos advogados proeminentes, juristas e clérigos legais do reino, ajudando a esclarecer e fazer valer uma paz justa para todos."
 viz_extravagance.t2.charity.scholars.mystical:0 "Este personagem financia pessoalmente diversos místicos, esotéricos e êxtases conhecidos que empregam seu estranho conhecimento pelos tribunais de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t2.charity.scholars.philosophical:0 "Este personagem financia pessoalmente vários filósofos importantes e instituições focadas em explorar as maneiras mais profundas do mundo."
 viz_extravagance.t2.charity.scholars.theological:0 "Este personagem financia pessoalmente alguns dos mais famosos estudiosos de teologia no reino, investindo no avanço da boa teoria [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.GetAdjective] em nome de seus colegas fiéis."
 viz_extravagance.t2.charity.schools:0 "Este personagem financia pessoalmente várias escolas dedicadas ao ensino de crianças que, de outra forma, não teriam a menor esperança de educação."
 viz_extravagance.t2.property.defensible_palace:0 "Este personagem mantém um pequeno palácio fortificado em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — supostamente repleto de passagens secretas e rotas de fuga ocultas."
 viz_extravagance.t2.property.exotic_market:0 "Este personagem é dono e retira um generoso imposto de um dos mercados mais famosos de produtos exóticos em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t2.property.fort:0 "Este personagem possui uma pequena fortaleza em uma região perigosa localizada próxima a [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural]. Embora cara de manter, a rica colheita de criaturas capturadas na região é lucrativa."
 viz_extravagance.t2.property.messenger_network:0 "Este personagem emprega uma rede em todo o reino de mensageiros discretos (e mais importante #EMP leais#!), capazes de transmitir sua vontade e instruções para todos os postos avançados da terra."
 viz_extravagance.t2.property.mine:0 "Este personagem possui uma mina lucrativa próxima à capital, uma fonte vital de metais comuns para uso doméstico e mercantil."
 viz_extravagance.t2.property.monopoly:0 "Este personagem tem a sorte de ter um monopólio na venda de itens essenciais dentro dos muros de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]; que eles controlem o escritório que concede tais monopólios é provavelmente sem relação."
 viz_extravagance.t2.property.personal_temple:0 "Este personagem é dono de um[ROOT.Char.GetDiarchy.GetDiarch.GetFaith.HouseOfWorship] pessoal, utilizável apenas por eles, sua família e seus aliados mais próximos."
 viz_extravagance.t2.property.treasury:0 "O tesouro deste personagem é tão grande que ocupa seu próprio prédio — um complexo fortificado no coração de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] onde sua moeda está segura."
 viz_extravagance.t2.property.warehouses:0 "Este personagem é dono de um conjunto verdadeiramente expansivo de armazéns escondidos perto do centro mercantil da capital. Tão bem abastecido com produtos de comércio exóticos que os locais o chamam de 'Os Cofres d[Select_CString( ROOT.Char.GetDiarchy.GetDiarch.IsFemale, 'a', 'o' )] [ROOT.Char.GetDiarchy.GetDiarch.GetFirstNameNoTooltip]'."
 viz_extravagance.t2.property.workshops:0 "Este personagem possui quase todas as oficinas em uma das ruas mais industriais de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], uma viela famosa por seus produtos diversos e belos."
 viz_extravagance.t2.treasure.bezoar_cutlery:0 "Este personagem possui um conjunto de talheres de bezoar exorbitantemente caros: essas pedras arcanas são ditas retardar, neutralizar ou até reverter os efeitos dos venenos mais letais, tornando os utensílios tanto supremamente estilosos #EMP quanto#! práticos."
 viz_extravagance.t2.treasure.cabinet_of_curiosities:0 "Este personagem tem um cômodo dedicado a curiosidades exóticas e parafernálias estranhas de terras distantes; embora de pouco uso prático, #EMP é#! uma queridinha entre os convidados."
 viz_extravagance.t2.treasure.crockery:0 "Este personagem frequentemente se vangloria de que sua cozinha possui algumas das maiores panelas e frigideiras feitas dos materiais mais raros acessíveis a [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t2.treasure.decorative_martial_gear:0 "Este personagem aprecia armas e armaduras decorativas — suas residências são repletas de paramentos militares ornamentalmente elaborados, de espadas douradas a escudos incrustados de gemas."
 viz_extravagance.t2.treasure.fly_stones:0 "Este personagem tem uma pequena coleção de pedras de mosca: um tipo de rocha mística que dizem repelir forçadamente moscas, mosquitos e outros insetos zumbidores dentro de um pequeno raio, o que as torna um enfeite muito apreciado na mesa de jantar."
 viz_extravagance.t2.treasure.gems:0 "Este personagem, segundo relatos, possui saco após saco de gemas preciosas. Aqueles poucos que viram sua coleção afirmam que cada bolsa é dedicada a uma família única de pedras preciosas."
 viz_extravagance.t2.treasure.horse_armour:0 "Os muitos corcéis deste personagem raramente são vistos sem os mesmos adornos preciosos e ornamentação ostensiva que eles próprios usam — de selas adornadas com pérolas a rédeas de prata."
 viz_extravagance.t2.treasure.indexed_bribes:0 "Este personagem é conhecido por seus subornos meticulosamente organizados e escalonados, dizendo-se tão regulares e previsíveis que eles devem certamente ter cem bolsas de cada tamanho prontas para uso a qualquer momento — cada uma com uma contagem exata de moedas."
 viz_extravagance.t2.treasure.map_of_world:0 "Este personagem possui um mapa do mundo conhecido inteiro. Supostamente um dos mais precisos do reino, ele cobre uma parede inteira — eles podem ser encontrados frequentemente olhando para ele, perdidos em pensamento."
 viz_extravagance.t2.treasure.sculpture:0 "Este personagem é um grande amante das artes, e suas residências frequentemente apresentam estátuas fundidas em metais preciosos ou esculpidas nas mais polidas pedras caras."
 viz_extravagance.t3.activities.aid:0 "Este personagem mantém os nobres vizinhos de suas propriedades satisfeitos com pequenos presentes aqui e ali: cem tapetes de luxo, três mil selas finas, doze potes de âmbar cinza, dez mil boas lanças, esse tipo de coisa."
 viz_extravagance.t3.activities.feasts.coin_shower:0 "Este personagem gosta de realizar exibições deliciosamente literais de riqueza em suas festas: eles regularmente fazem grandes chuvas de centenas ou milhares de moedas sobre seus convidados favoritos."
 viz_extravagance.t3.activities.feasts.give_away:0 "Este personagem gosta de hospedar festas para seus aliados leais, seguidores e comparsas — puramente por coincidência, eles frequentemente distribuem uma fortuna em propriedades em tais eventos, mas sempre parecem ter mais presentes exorbitantes para dar."
 viz_extravagance.t3.activities.feasts.spectacle:0 "As festas deste personagem são focadas no espetáculo: se não puderem ostentar pelo menos um contorcionista saltitante equilibrando um mastro com uma criança capering que malha brasas, qual é mesmo o ponto?"
 viz_extravagance.t3.activities.feasts.surprise:0 "Este personagem é conhecido por realizar festas com doações surpresa aos convidados encantadores: uma piada espirituosa é recompensada com dez mil cabeças de gado, uma roupa deslumbrante com um palácio remoto e seus servos, ou uma conversa fascinante com um traje de seda tingida."
 viz_extravagance.t3.activities.gambling.palanquin:0 "Este personagem afirma ter inventado e dominado um esporte peculiar: corrida de palanquins, onde seus carregadores competem com desafiantes para levar sua carga a uma parte específica de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] no melhor tempo."
 viz_extravagance.t3.activities.land_and_livestock_grants:0 "As hordas abundantes de gado deste personagem são o material das lendas locais; a quantidade de animais que eles oferecem como recompensa por bons serviços ou compensação caridosa facilmente chega às dezenas de milhares a cada ano."
 viz_extravagance.t3.activities.orgies:0 "Este personagem realiza abertamente festas com foco em delícias carnais, onde os convidados são mimados e servidos ao máximo, e da maneira mais oleosa, grau."
 viz_extravagance.t3.activities.parades:0 "Este personagem acredita que a riqueza é inútil se escondida: eles têm uma fascinação por realizar desfiles exibindo seus animais de estimação exóticos, belos cavalos, servos bem-vestidos e trajes caros, todos desfilando pelas ruas de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] regularmente."
 viz_extravagance.t3.activities.scholars.debates:0 "Este personagem convida estudiosos de todas as áreas de todo o mundo conhecido para seus encontros, deleitando-se com as conversas trazidas pelas maiores mentes da época sentadas à mesma mesa."
 viz_extravagance.t3.charity.bathhouses:0 "Este personagem construiu e ainda subsidia um grande banho público em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], tornando-os populares entre os plebeus que, de outra forma, poderiam lutar para pagar por tal luxo expansivo."
 viz_extravagance.t3.charity.beggar_spies:0 "A lendária paranoia deste personagem supostamente se estende a manter metade completa dos mendigos e vagabundos do reino em sua folha de pagamento, fornecendo-lhes comida e alojamento ocasionalmente em troca de seus olhos e ouvidos."
 viz_extravagance.t3.charity.civil_service.expansion:0 "Este personagem fornece salários para uma ampla variedade de funções administrativas, distribuindo a carga de trabalho diária de maneira mais uniforme e reduzindo a pressão sobre o estado."
 viz_extravagance.t3.charity.hajj_water_tanks:0 "Este personagem paga pessoalmente pela criação e enchimento de reservatórios fora da sagrada Meca, cuja água ajudará a sustentar peregrinos sedentos realizando o justo Hajj."
 viz_extravagance.t3.charity.holy_warrior_gear:0 "Este personagem doa regularmente armas e armaduras à soldadesca que serve diversas causas sagradas, seja saqueando os inimigos da fé ou guardando seus adeptos."
 viz_extravagance.t3.charity.hospitals.equipment:0 "Este personagem dedica tempo não apenas para financiar hospitais locais, mas também para garantir que eles estejam equipados com o que há de mais moderno em ungüentos médicos, instrumentos cirúrgicos e parafernálias médicas esotéricas variadas."
 viz_extravagance.t3.charity.libraries:0 "A moeda deste personagem frequentemente é direcionada para a criação, expansão e preservação de um número selecionado de bibliotecas, copiando grandes obras para proliferar o conhecimento entre a nobreza."
 viz_extravagance.t3.charity.observatories:0 "Este personagem patrocina um grande observatório, observando os céus e registrando os movimentos das estrelas."
 viz_extravagance.t3.charity.universities:0 "Este personagem financia várias universidades locais, pequenas mas prestigiadas, promovendo a erudição e a academia em seu nome."
 viz_extravagance.t3.charity.watermills:0 "Este personagem financia a criação de moinhos d'água comunitários em aldeias empobrecidas e outras áreas rurais, melhorando substancialmente sua qualidade de vida."
 viz_extravagance.t3.property.bathhouse:0 "Este personagem mantém um elaborado banho privado para si e seus aliados mais próximos, um centro político para todas as atividades mais sórdidas, mas espantosamente limpas, de trapaças em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t3.property.business.stolen:0 "Este personagem parece estar continuamente adquirindo negócios de menor porte que não conseguem pagar suas dívidas, seja a vários agiotas ou ao próprio estado. A autopreservação impede que a maioria faça comentários sobre isso."
 viz_extravagance.t3.property.businesses:0 "Os interesses comerciais deste personagem são uma confusão torcida e labiríntica de rotas comerciais interconectadas, monopólios, patronato e propriedades."
 viz_extravagance.t3.property.den_of_vice:0 "Rumores sugerem que este personagem é o proprietário de um dos mais notórios antros de vícios em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], um estabelecimento onde qualquer mistura de substâncias exóticas pode ser adquirida. Com dinheiro suficiente, é claro."
 viz_extravagance.t3.property.fleet.commercial:0 "Este personagem é dono de dezenas de embarcações comerciais privadas, uma verdadeira frota de embarcações espalhadas pelo mundo."
 viz_extravagance.t3.property.palace.huge:0 "Este personagem mantém um palácio que, oficialmente, é apenas um pouco menor que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNamePossessiveNoTooltip]. Aqueles que o viram pessoalmente geralmente têm suas dúvidas."
 viz_extravagance.t3.property.pool.cushions:0 "Este personagem mantém uma grande piscina forrada de almofadas — dar um mergulho não deve ser motivo para falta de luxo."
 viz_extravagance.t3.property.pool.gold:0 "Este personagem possui uma piscina cujo fundo eles mantêm revestido com uma espessa crosta de moedas de ouro — qual é o ponto da riqueza se você não pode flutuar sobre ela?"
 viz_extravagance.t3.property.stables:0 "Este personagem possui um estábulo simplesmente colossal, abrigando centenas ou mais dos melhores corcéis no reino."
 viz_extravagance.t3.property.tycoon:0 "Este personagem possui quase um quarto completo de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], bairros inteiros caindo dentro de suas propriedades privadas."
 viz_extravagance.t3.treasure.birth_control:0 "Este personagem possui fórmulas, pílulas e meios mais exóticos para garantir uma cópula segura, feliz e infrutífera."
 viz_extravagance.t3.treasure.carpets:0 "Este personagem possui um tapete especialmente famoso: cem cúbitos de comprimento e a metade de largura, confeccionado com seda floss, costurado com fios de ouro e adornado por um forro de cetim prateado, bordado com cenas religiosas e históricas que dizem contar toda a história do mundo."
 viz_extravagance.t3.treasure.exotic_pets:0 "Este personagem cativa e aterroriza os convidados com sua coleção de animais de estimação exóticos: leões, tigres, estranhos veados estrangeiros, e criaturas mais bizarras além enfeitam sua menagerie pessoal."
 viz_extravagance.t3.treasure.fabrics:0 "Este personagem se orgulha de possuir quantidades abundantes dos tecidos mais luxuosos do mundo conhecido: sedas, damascos, veludos, finos brocados, cobertores elaborados e um mar quase infinito de variações menores e especialidades regionais."
 viz_extravagance.t3.treasure.gold_mattress:0 "Este personagem possui um colchão supostamente tecido exclusivamente com fios de ouro, e que foi agraciado por algumas das figuras mais famosas da história recente."
 viz_extravagance.t3.treasure.mirrors:0 "Este personagem possui dezenas dos espelhos mais nítidos que o dinheiro pode comprar, proporcionando um nível quase indecoroso de luxo vaidoso que mesmo poucos nobres podem sonhar."
 viz_extravagance.t3.treasure.parasols:0 "Este personagem parece possuir um guarda-sol para cada dia do ano: alguns bordados com ouro, alguns com prata, alguns feitos de seda, alguns de damasco, alguns cravejados de rubis, alguns com esmeraldas, e assim por diante, e assim por diante..."
 viz_extravagance.t3.treasure.plants:0 "Este personagem possui uma famosa coleção de plantas raras, musgos e ervas — cada uma mantida em uma das quinhentas panelas de cristal."
 viz_extravagance.t3.treasure.sculpture.articulated:0 "O orgulho e a alegria deste personagem é uma escultura multiarticulada de si mesmo, cuja pose e vestimenta podem ser alteradas infinitamente à vontade do visir."
 viz_extravagance.t3.treasure.silk_bigtop:0 "Este personagem possui uma tenda de viagem para cinquenta ou mais pessoas feita do mais luxuoso cetim — cada painel ricamente bordado, cada poste de um metal precioso ou laca cara."
 viz_extravagance.t4.activities.aid:0 "A largueza deste personagem paga por pacotes de ajuda tão generosos que alguns supostos 'nobres' nas proximidades parecem totalmente dependentes de suas doações para manter as aparências."
 viz_extravagance.t4.activities.feasts.big:0 "O que este personagem chama de 'um banquete privado entre amigos', a maioria dos outros chamaria de 'um festival expansivo uma vez por década'."
 viz_extravagance.t4.activities.feasts.cannibal:0 "Todos concordam que este personagem realiza alguns dos banquetes mais deliciosos que o reino já conheceu, repletos de suculentas peças de carne — embora poucos concordem que tipo de carne deve ser."
 viz_extravagance.t4.activities.feasts.pool.rose:0 "Este personagem é conhecido por dar festas onde sua piscina é coberta com dezenas de milhares de moedas em flores, um espetáculo fragrante em uma escala além do que a maioria dos convidados verá em suas vidas."
 viz_extravagance.t4.activities.gambling.xtra_xtreme:0 "Este personagem aposta moedas, bestas, terras, vidas e qualquer outra coisa que lhes agrade — tudo em quantidades tão vastas que alguns se perguntam se sua riqueza é realmente #EMP sem fim#!."
 viz_extravagance.t4.activities.give_aways:0 "Este personagem dá presentes impulsivos que superam as fortunas que até mesmo os comerciantes mais sortudos poderiam esperar fazer em suas vidas."
 viz_extravagance.t4.activities.host:0 "Este personagem considera hospedar diplomatas estrangeiros de suma importância, apenas superado por gastar quantidades vastas de moedas demonstrando o quão inferiores são os reinos de seus convidados em comparação."
 viz_extravagance.t4.activities.masquerade:0 "Este personagem realiza festas a fantasia regulares, definindo temas da história e mito para seus convidados seguirem, e esperando que cada um gaste uma renda mensal ou mais em cada traje."
 viz_extravagance.t4.activities.menagerie:0 "A menagerie deste personagem apresenta répteis sibilantes, pássaros radiantes, mamíferos enormes e aparentemente algo de todo o vasto panorama de bestas que o mundo tem a oferecer."
 viz_extravagance.t4.activities.plants.ever_changing:0 "Este personagem acredita que a variedade de especiarias é a vida, e mantém um jardim de plantas, fragrâncias e ervas exóticas em constante mudança, todas florescendo e frutificando em diferentes épocas do ano e sob diferentes condições."
 viz_extravagance.t4.charity.aqueducts:0 "Este personagem é responsável pela criação e manutenção de vários aquedutos curtos trazendo água fresca para [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], algo que lhes rende a gratidão de muitos dos mais pobres da sociedade."
 viz_extravagance.t4.charity.bridges:0 "Este personagem é renomado pelo dinheiro que gasta construindo e mantendo pontes novas por todo o reino, uma marca de prestígio supremo para qualquer funcionário público."
 viz_extravagance.t4.charity.civil_service.fire:0 "Este personagem é pessoalmente responsável pela manutenção de um serviço de combate a incêndios para [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — algo quase inaudito no resto do mundo."
 viz_extravagance.t4.charity.dole:0 "Este personagem subsidia uma doação privada de alimentos para os cidadãos mais necessitados de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], garantindo que ninguém passe fome enquanto tiver moedas sobrando."
 viz_extravagance.t4.charity.festivals:0 "Este personagem paga por um grandioso festival anual para todos os residentes de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], um evento que a cidade aguarda o ano todo."
 viz_extravagance.t4.charity.gardens:0 "Este personagem paga pela manutenção de um grande jardim público — um pequeno bastião de paz e tranquilidade em um mundo que às vezes parece ser demais cruel."
 viz_extravagance.t4.charity.housing:0 "Este personagem financia a construção de pequenos conjuntos habitacionais em áreas desocupadas de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], ou junto às suas paredes, para aqueles mais necessitados de abrigo."
 viz_extravagance.t4.charity.loans:0 "Este personagem administra um fundo de caridade que organiza remessas para empréstimos e dívidas, legais ou não, que afligem os pobres do reino."
 viz_extravagance.t4.charity.pilgrimage:0 "Este personagem administra um fundo de caridade que fornece às pessoas uma mesada, equipamento adequado e conhecimento de viagem para iniciar uma peregrinação bem-sucedida."
 viz_extravagance.t4.charity.waystations:0 "Este personagem paga por estações de descanso e caravansarás em todo o reino, concentrando-se em atender a grupos menores e viajantes solitários."
 viz_extravagance.t4.property.army:0 "Este personagem mantém um exército privado de bandidos e batedores, pronto para impor sua vontade em qualquer lugar em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]."
 viz_extravagance.t4.property.bordello:0 "Este personagem administra um bordel privado, onde seus artistas favoritos proporcionam os prazeres mais lascivos regularmente."
 viz_extravagance.t4.property.gaol:0 "Este personagem possui uma prisão privada de devedores — quando pessoas mais pobres não conseguem pagar suas dívidas para o vizir, a punição é rápida e clara. Até que sua família encontre o dinheiro, esperamos."
 viz_extravagance.t4.property.livestock:0 "Os vastos rebanhos privados deste personagem, tanto equinos quanto bestas de carga, se espalham por grande parte do reino."
 viz_extravagance.t4.property.palace.guest:0 "Este personagem mantém um palácio privado especificamente para visitantes — uma declaração de riqueza e poder que poucos deixam de notar."
 viz_extravagance.t4.property.palace.monthly:0 "Este personagem mantém uma dúzia ou mais de palácios em toda [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], mudando de um para o próximo mensalmente."
 viz_extravagance.t4.property.palace.pool:0 "Este personagem mantém um palácio separado para abrigar sua piscina massiva. Eles residem em outro lugar, e desta forma conseguem manter seus aposentos privados e escritórios totalmente separados de onde eles recebem os convidados."
 viz_extravagance.t4.property.palace.spa:0 "Este personagem possui um retiro espaçoso no campo, logo nos arredores de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], um lugar tranquilo longe do agito da cidade, mantido em privacidade por hectares e hectares de propriedades circundantes."
 viz_extravagance.t4.property.palace.torture:0 "'Inferno d[Select_CString( ROOT.Char.GetDiarchy.GetDiarch.IsFemale, 'a', 'o' )] [ROOT.Char.GetDiarchy.GetDiarch.GetFirstNameNoTooltip],' como [Select_CString( ROOT.Char.GetDiarchy.GetDiarch.IsFemale, 'a', 'o' )] chamam — o jardim de estranhas delícias e instrumentos horríveis onde este personagem visita suas cruéis ministras sobre seus inimigos e rivais."
 viz_extravagance.t4.property.spire:0 "Este personagem conduz grande parte de seus negócios de vizir de uma torre sinistra, erguendo-se alto sobre a maioria dos edifícios em [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. Supostamente, é possível ver cada beco e esquina de suas muitas janelas."
 viz_extravagance.t4.treasure.cosmetics:0 "Este personagem possui um resgate imperial em perfumaria: âmbar precioso em jarra, água de rosas perfumada, ghaliya perfumada, pó de almíscar, extrato de madeira de áloe e, claro, açafrão, tudo em quantidades e recipientes que poderiam pagar exércitos inteiros."
 viz_extravagance.t4.treasure.crockery.historic:0 "Este personagem mantém um conjunto completo de louças e talheres festivos, onde, dizem, cada peça já pertenceu ao governante de um reino estrangeiro exótico ou antigo império falecido."
 viz_extravagance.t4.treasure.cushions:0 "Este personagem possui milhares e milhares de almofadas, uma avalanche quase interminável de tafetá e seda que torna cada cômodo de todas as suas residências um deleite para sentar (ou, de fato, tirar uma soneca)."
 viz_extravagance.t4.treasure.fleet.personal:0 "Este personagem é famoso pela figura impressionante cortada por sua barca de prazer pessoal, assim como pelas numerosas embarcações menores que navegam pelos cursos d'água de [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] em seu nome."
 viz_extravagance.t4.treasure.martial_gear:0 "Este personagem gosta um pouco demais de brinquedos marciais; dizem que eles têm mais armas decorativas e armaduras do que [Select_CString( ROOT.Char.IsFemale, 'a', 'o' )] [ROOT.Char.GetTitleAsNameNoTooltip] tem #EMP unidades reais#! de ambas."
 viz_extravagance.t4.treasure.massive_sword:0 "Este personagem infamemente possui uma espada decorativa tão comprida quanto três soldados colocados de pés à cabeça, posicionada ao longo de uma das largas paredes de seu salão favorito."
 viz_extravagance.t4.treasure.mystic_ingredients:0 "Sussurra-se sobre este personagem por sua coleção de ingredientes alquímicos exóticos: plantas estrangeiras estranhas, minérios estranhos de profundezas abaixo da superfície da Terra e pós derivados da carne e ossos de criaturas lendárias."
 viz_extravagance.t4.treasure.office:0 "O gabinete vizirial deste personagem é esculpido a partir, e mobiliado com, pedra cara com incrustações de metal e vidro, irradiando um poder sóbrio e firme."
 viz_extravagance.t4.treasure.precious_orchard:0 "Este personagem é famoso por seu pomar precioso: um pátio repleto de árvores artificiais forjadas em ouro e prata, carregando frutas diversas esculpidas em pedras preciosas."
 viz_extravagance.t4.treasure.sensible_investments_for_smart_adults:0 "Este personagem possui um único manuscrito iluminado apresentando uma imagem desagradável de um macaco — supostamente, a obra é extraordinariamente cara, mas a fonte desse valor não está clara."
 vizier_candidate_has_studied_recently_modifier:0 "Estudo Intenso"
 vizier_candidate_has_studied_recently_modifier_desc:0 "Este personagem fez recentemente um esforço concentrado para melhorar suas habilidades como servidor civil, e os resultados falam por si — assim como os custos."
