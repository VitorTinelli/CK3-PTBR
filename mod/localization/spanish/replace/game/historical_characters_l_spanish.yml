 generic_importance:0 "Este personagem é de importância histórica real."
 historical_char_creation_events.1.a:0 "Eu me pergunto que destino aguarda [historical_character.GetHerHim]..."
 historical_char_creation_events.1.b:0 "Tal [historical_character.GetWomanMan] poderia me servir bem!"
 historical_char_creation_events.1.c:0 "[historical_character.GetFullNameNoTooltip]? Quem se importa!"
 historical_char_creation_events.2.a:0 "Estas palavras sagradas devem ser compartilhadas!"
 historical_char_creation_events.2.desc:0 "[inspiration_owner.GetFullName] passou incontáveis dias e noites analisando livros, escrituras, e escreveu inúmeros documentos e teses. O gênio [inspiration_owner.GetHerHim|U] é inquestionável enquanto leio o que [inspiration_owner.GetSheHe] escreveu...\n\nIncrível. Isso pode mudar #EMP tudo.#!"
 historical_char_creation_events.2.t:0 "Reforma Religiosa: Sucesso"
 historical_char_creation_events.desc:0 "[historical_character.Custom('HistoricalCharacterJobDesc')] conhecido como [historical_character.GetFullNameNicknamed] está supostamente vagando pelo meu reino em busca de emprego. [historical_character.GetSheHe|U] é oriundo de [birth_location.GetName], e tem um certo ar sobre [historical_character.GetHerHim]... [historical_character.Custom('DescriptorPositiveStandalone')] mas um tanto [historical_character.Custom('DescriptorNegativeStandalone')].\n\n\n@historical_character_icon! #weak Este personagem é histórico:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_char_creation_events.t:0 "Ecos da História: [historical_character.GetFullNameNicknamedNoTooltip]"
 historical_char_creation_events_alternative.desc:0 "[historical_character.Custom('HistoricalCharacterJobDesc')], conhecido como [historical_character.GetFullNameNicknamed], fez um nome para [historical_character.GetHerselfHimself] na corte. [historical_character.GetSheHe|U] é [historical_character.Custom('DescriptorPositiveStandalone')], e enquanto não consigo identificar, há algo extraordinário sobre [historical_character.GetSheHe]...\n\n\n@historical_character_icon! #weak Este personagem é histórico:#!\n#help_light_background [historical_character.Custom('HistoricalCharacterDesc')]#!"
 historical_character.aaron_of_lincoln:0 "Aaron de Lincoln foi um financista e agiota inglês do século XII, conhecido por ser um dos judeus mais ricos da Inglaterra medieval. Ele forneceu empréstimos significativos à nobreza e à Igreja para projetos de construção, incluindo catedrais. Após sua morte, o rei Henrique II confiscou seus vastos bens."
 historical_character.abhinavagupta:0 "Abhinavagupta foi um filósofo e místico indiano do século X-XI, da Caxemira. Ele é considerado um dos maiores estudiosos do Shaivismo Não-Dual. As obras de Abhinavagupta influenciam a filosofia hindu, especialmente suas teorias sobre estética e espiritualidade em seu comentário, \"Abhinavabharati.\""
 historical_character.ahmad_yasawi:0 "Aḥmad Yasawī foi um místico sufi do século XII de Sayram que fundou a ordem yasawi, a primeira grande tariqa sufi a se enraizar entre os povos túrquicos da Ásia Central. Seus versos devocionais em túrquico, o \"Diwan-i Hikmet\", levaram o islamismo profundamente às estepes e moldaram a espiritualidade da região por séculos."
 historical_character.akka_mahadevi:0 "Akka Mahadevi foi uma poeta canará do século XII e uma figura proeminente no movimento Bhakti Lingayat. Conhecida por suas vachanas ou composições poéticas, ela seguiu um caminho de devoção espiritual e libertação, desafiando normas sociais ao renunciar à vida mundana e advogar pela igualdade e empoderamento das mulheres nas práticas espirituais."
 historical_character.al_biruni:0 "Al-Biruni foi um erudito e polímata persa do século XI que fez contribuições significativas em várias disciplinas científicas, incluindo astronomia, matemática e geografia. Ele escreveu extensivamente sobre o raio da Terra e compilou um estudo abrangente das religiões e filosofias da Índia após acompanhar a invasão gaznavida."
 historical_character.al_farabi:0 "Abū Naṣr al-Fārābī foi um filósofo do século X da Idade de Ouro Islâmica, chamado de \"Segundo Mestre\" após o próprio Aristóteles por seus profundos comentários sobre o pensamento grego. Trabalhando em Bagdá, Alepo e Damasco, ele escreveu sobre lógica, metafísica, teoria musical e a ordem política ideal."
 historical_character.al_mutanabbi:0 "Al-Mutanabbi foi um poeta árabe do século X, frequentemente aclamado como o maior da língua. Nascido em Kufa de origens humildes, seus ferozes panegíricos e sátiras mordazes lhe renderam o patrocínio do príncipe hamadânida Sayf al-Dawla, mas sua própria arrogância fez inimigos suficientes para vê-lo abatido em uma estrada no deserto."
 historical_character.al_razi:0 "Abū Bakr al-Rāzī, conhecido na Europa medieval como Rasis, foi um polímata persa dos séculos IX-X e o principal médico de sua época. Suas observações clínicas distinguiram pela primeira vez a varíola do sarampo, e sua vasta enciclopédia médica, o \"Kitāb al-Ḥāwī\", permaneceu um texto padrão na Europa Latina por séculos."
 historical_character.alhazen:0 "Hasan al-Haytham foi um matemático e físico árabe do século XI, famoso por seu trabalho em óptica. Seu livro \"Kitab al-Manazir\" (\"O Livro de Óptica\") estabeleceu os princípios da óptica moderna e influenciou a ciência ocidental durante a Idade Média. Ele é lembrado por sua abordagem experimental rigorosa e contribuições significativas para a Idade de Ouro Islâmica."
 historical_character.amir_khusrau:0 "Amir Khusrau foi um poeta, cortesão e músico de língua persa que serviu a sete sultões de Déli. Discípulo devoto de Nizamuddin Auliya, ele é creditado por ajudar a moldar o vernáculo hindavi primitivo e estabelecer as bases da tradição musical hindustani."
 historical_character.andrea_pisano:0 "Andrea Pisano foi um escultor e arquiteto italiano do século XIV, mais conhecido pelas portas sul do Batistério de Florença, uma obra-prima em relevo de bronze. Mais tarde, ele sucedeu Giotto como mestre de obras da Catedral Florentina."
 historical_character.andrei_rublev:0 "Andrei Rublev foi um monge ortodoxo russo e o pintor de ícones mais celebrado da moscovia medieval. Sua luminosa \"Trindade\", pintada para a Lavra da Trindade de São Sérgio, é amplamente considerada a obra-prima suprema da arte sacra russa."
 historical_character.anonymus_belae_regis:0 "Conhecido apenas como \"Magister P.\" ou Anônimo, o notário sem nome do rei Béla III compôs os \"Gesta Hungarorum\" por volta da virada do século XIII. Sua crônica em latim da conquista magiar, misturando genealogia com lenda imaginativa, permanece a narrativa fundacional das origens da Hungria."
 historical_character.arethas_of_caesarea:0 "Arethas de Cesaréia foi um arcebispo do século X, estudioso e prolífico coletor de manuscritos gregos antigos. Servindo como arcebispo de Cesaréia na Capadócia, Arethas fez contribuições significativas para a vida intelectual e cultural de Bizâncio, garantindo a sobrevivência do conhecimento clássico que mais tarde influenciaria o Renascimento."
 historical_character.arnaldus_de_villa_nova:0 "Arnaldus de Villa Nova foi um médico, alquimista e erudito catalão do século XIII, renomado por suas contribuições à medicina e à química. Ele foi um dos primeiros defensores do método científico na prática médica e é creditado com vários textos médicos e escritos alquímicos. Seu trabalho influenciou significativamente o pensamento médico europeu e o campo emergente da química."
 historical_character.artist:0 "Um artista talentoso e procurado"
 historical_character.atisha:0 "Um dos maiores nomes do Budismo Medieval, Atisha foi um líder religioso originário de Bengala, mas fortemente associado ao mosteiro Vikramashila em Bihar. Através de suas obras, ele foi responsável pela difusão do Budismo Mahayana, assim como do Budismo Vajrayana em toda a Ásia do Sudeste e no Tibete."
 historical_character.attar:0 "Farīd al-Dīn 'Attār foi um poeta sufi e boticário persa de Nishapur, cuja \"Conferência dos Pássaros\" alegoriza a jornada da alma em direção ao divino. Seus versos tornaram-se uma das grandes fontes do misticismo persa posterior, influenciando profundamente Rumi e a tradição sufi."
 historical_character.auliya:0 "Nizamuddin Auliya foi um mestre sufi dos séculos XIII-XIV da ordem chishti em Déli, amado em todo o Sultanato por sua acolhida a todas as fés e posições sociais. Seus ensinamentos de devoção interior e serviço altruísta moldaram séculos da vida espiritual indiana e inspiraram os versos de seu discípulo Amir Khusrau."
 historical_character.author:0 "Um autor e poeta prolífico"
 historical_character.averroes:0 "Averróis (Ibn Rushd) foi um polímata andaluz do século XII, renomado por seus escritos sobre filosofia aristotélica. Seu trabalho se concentrou na integração das tradições islâmicas com a filosofia grega clássica. Seus esforços para racionalizar a filosofia fizeram dele uma figura central na história intelectual tanto islâmica quanto europeia, contribuindo significativamente para o Renascimento."
 historical_character.avicenna:0 "Avicena, também conhecido como Ibn Sina, foi um polímata persa que é considerado um dos médicos, astrônomos, pensadores e escritores mais significativos da Idade de Ouro Islâmica. Ele é mais conhecido por suas obras monumentais \"O Livro da Cura\" e \"O Cânone da Medicina,\" que foram utilizadas como textos médicos padrão tanto no mundo islâmico quanto na Europa por séculos."
 historical_character.awkal:0 "Yusuf ibn 'Awkal foi um comerciante e viajante judeu do século X do mundo islâmico, conhecido por seus relatos detalhados de suas jornadas comerciais pelo Mediterrâneo, Oriente Próximo e partes da África. Seus escritos fornecem valiosas percepções sobre as práticas comerciais, interações culturais e a vida vibrante das comunidades judaicas ao longo de suas rotas comerciais."
 historical_character.banker:0 "Um banqueiro habilidoso e rico"
 historical_character.bar_sauma:0 "Rabban Bar Sauma foi um monge nestoriano que se tornou diplomata da China da dinastia Yuan. Originalmente partiu em uma peregrinação malsucedida a Jerusalém, passou anos em Bagdá. Mais tarde, na vida, ele atuou como embaixador mongol na Europa, encontrando-se com monarcas europeus, o imperador bizantino e o Papa para discutir uma possível aliança franco-mongol."
 historical_character.basava:0 "Basava foi um filósofo e reformador social indiano do século XII que fundou o movimento Lingayat. Seus ensinamentos desafiaram o sistema de castas tradicional e enfatizaram a devoção a Senhor Shiva. Os vachanas de Basava, ou composições poéticas, defendiam a igualdade espiritual e moldaram o movimento Bhakti. Suas ideias impactaram significativamente a sociedade e a religião indiana medieval."
 historical_character.basil_lekapenos:0 "Basilio Lecapeno foi um poderoso eunuco e administrador que serviu como ministro-chefe durante o reinado de vários imperadores bizantinos no final do século X e início do XI. Filho ilegítimo do imperador Romano I, Basilio exercia uma influência substancial dentro da corte bizantina através de seu papel como parakoimomenos, ou camareiro."
 historical_character.basilios_bessarion:0 "Basílio Bessarion foi um estudioso, filósofo e cardeal do século XV. Bessarion converteu-se ao catolicismo e defendeu a união das Igrejas Ortodoxa e Católica durante o Concílio de Florença, argumentando que tal movimento reforçaria a unidade cristã contra a crescente ameaça otomana."
 historical_character.benedict_the_pole:0 "Bento, o Polonês, foi um frade franciscano do século XIII que acompanhou Giovanni da Pian del Carpine na perigosa embaixada papal à corte do Grão-Cã Güyük em Karakorum. Seu breve, mas vívido, relatório em latim sobre o mundo mongol esteve entre os primeiros relatos europeus confiáveis das estepes orientais."
 historical_character.benjamin_of_tudela:0 "Benjamin de Tudela foi um viajante e explorador judeu do século XII. Ele é mais conhecido por seu diário de viagem, \"As Viagens de Benjamin\", que documenta suas jornadas pela Europa, Ásia e África. Benjamin forneceu relatos detalhados das comunidades judaicas em todo o mundo medieval."
 historical_character.bernard_of_clairvaux:0 "Bernardo de Claraval foi um abade, pregador e teólogo cisterciense, famoso por fundar a Abadia de Claraval e por sermões e cartas que moldaram a Cristandade Latina. Ele defendeu a reforma cisterciense, pregou a Segunda Cruzada e escreveu Em Louvor à Nova Cavalaria em defesa dos Templários."
 historical_character.bhaskaracharya:0 "Bhaskaracharya foi um matemático e astrônomo indiano do século XII que escreveu a obra seminal \"Siddhanta Shiromani\". Este tratado abrangente cobre tópicos como aritmética, álgebra, matemática dos planetas e trigonometria esférica. Seu trabalho sobre cálculo antecede Newton e Leibniz em mais de cinco séculos."
 historical_character.bonaventure:0 "Boaventura foi um franciscano, teólogo e filósofo italiano do século XIII, chamado de \"Doutor Seráfico\" por sua síntese de misticismo e razão escolástica. Ele serviu como Ministro-Geral da Ordem dos Frades Menores e foi uma figura de destaque no Segundo Concílio de Lião, trabalhando para reconciliar as igrejas latina e grega."
 historical_character.borgia:0 "Alfonso de Borgia foi um cardeal e diplomata espanhol que mais tarde se tornou o Papa Calisto III em 1455. Antes de seu papado, ele serviu como um respeitado jurista e administrador, desempenhando um papel fundamental na reconciliação das partes conflitantes do Compromisso de Caspe."
 historical_character.botond:0 "Botond é um lendário guerreiro magiar de meados do século X, que, segundo as crônicas húngaras, teria destruído o portão de ferro de Constantinopla com um único golpe de seu machado e derrotado um campeão bizantino em combate singular. Tendo existido em carne e osso ou não, seu nome tornou-se sinônimo do poder magiar."
 historical_character.bridget_of_sweden:0 "Bridget da Suécia foi uma mística e santa do século XIV, conhecida por suas profundas visões religiosas e pela fundação da Ordem Brigida. Após a morte de seu marido, ela dedicou sua vida ao serviço religioso e fez várias peregrinações a locais sagrados."
 historical_character.catherine_of_siena:0 "Catarina de Siena foi uma mística dominicana do século XIV cujas visões e cartas políticas a tornaram uma das mulheres mais influentes da Igreja do final da Idade Média. Ela é creditada por persuadir o Papa Gregório XI a retornar o papado de Avinhão para Roma e mais tarde foi nomeada tanto santa quanto Doutora da Igreja."
 historical_character.chishti:0 "Mu'in al-Din Chishti foi um místico sufi nascido na Pérsia que, por volta de 1192, estabeleceu-se em Ajmer, no Rajastão, e fundou a ordem chishti na Índia. Renomado por sua ética de compaixão universal, seu santuário permanece um dos locais de peregrinação mais amados do subcontinente, atraindo devotos de todas as fés."
 historical_character.chretien_de_troyes:0 "As histórias de Chrétien, escritas em francês antigo, desempenharam um papel fundamental no desenvolvimento da lenda arturiana. Sua introdução do amor cortês e do Santo Graal em obras como \"Lancelot, o Cavaleiro da Cesta\" e \"Perceval, a História do Graal\" influenciou a literatura cavalheiresca. Seus escritos enfatizam temas de cavalheirismo, heroísmo e amor cortês."
 historical_character.christine_pizan:0 "Christine de Pizan foi uma escritora e poetisa francesa do século XIV, renomada por suas obras que defendiam os direitos das mulheres e a educação. Ela escreveu \"O Livro da Cidade das Mulheres,\" que desafiou a misoginia de sua época e celebrou as conquistas das mulheres. Os escritos de Christine foram alguns dos primeiros a abordar a igualdade de gênero, tornando-a uma pioneira feminista na Europa medieval."
 historical_character.chu_van_an:0 "Estimado professor confucionista da dinastia Tran, chefe da Academia Imperial em Thăng Long; conhecido por sua integridade, reformas educacionais e pela famosa petição das 'Sete Decapitações', instando o rei a eliminar oficiais corruptos."
 historical_character.cimabue:0 "Cimabue, nascido Cenni di Pepo, foi um pintor florentino cujos retábulos e afrescos do final do século XIII romperam com as rígidas convenções bizantinas em direção a um estilo mais naturalista. A tradição o credita por descobrir o jovem Giotto e colocar o Trecento italiano em seu curso."
 historical_character.constantine_the_paphlagonian:0 "Constantino, o Paflagônio, foi um eunuco bizantino e oficial de corte influente no século IX. Ele serviu como parakoimomenos, ou camareiro, do imperador Leão VI, o Sábio. É conhecido por seus esforços para manter a estabilidade dentro da corte durante um período de intrigas políticas e faccionalismo."
 historical_character.crescas:0 "Hasdai Crescas foi um filósofo judeu do século XIV, conhecido por desafiar a filosofia aristotélica predominante de sua época. Ele é mais conhecido por sua obra filosófica \"Or Adonai\" (A Luz do Senhor), que argumentou contra as visões aristotélicas e lançou ideias fundamentais para a filosofia judaica moderna, influenciando pensadores como Espinosa."
 historical_character.dafydd_ap_gwilym:0 "Dafydd ap Gwilym é amplamente considerado o maior dos poetas galeses medievais, um mestre do século XIV da forma cywydd. Seus versos, alternadamente lúdicos, devocionais e eróticos, misturavam a tradição clássica galesa com as modas cortesãs da Europa continental."
 historical_character.dante_alighieri:0 "Dante Alighieri foi um poeta italiano renomado por \"A Divina Comédia,\" uma jornada épica pelo Inferno, Purgatório e Paraíso. Sua obra teve um impacto duradouro na literatura ocidental e na teologia cristã. A exploração de Dante sobre moralidade e natureza humana lhe rendeu o título de \"Pai da língua italiana.\""
 historical_character.daun_penh:0 "Viúva reverenciada do século XIV, Daun Penh teria descoberto estátuas sagradas de Buda dentro de uma árvore koki flutuante durante uma enchente no Tonlé Sap. Interpretando isso como um sinal divino, ela estabeleceu um santuário no topo de uma colina, Wat Phnom, onde consagrou as relíquias. Seu ato de devoção deu origem à cidade de Phnom Penh, que leva seu nome."
 historical_character.demetrios_kydones:0 "Demétrio Kydones foi um proeminente estudioso, tradutor e diplomata do século XIV, conhecido por sua defesa das tradições latina e católica romana dentro do Império Bizantino ortodoxo. Ele traduziu muitas obras de Tomás de Aquino e outros filósofos escolásticos latinos para o grego."
 historical_character.dharmaja:0 "Poeta do reinado do Rei Airlangga, Mpu Dharmaja é conhecido por compor o Kakawin Smaradahana, poema que influenciou a literatura javanesa posterior."
 historical_character.diplomat:0 "Um diplomata tático e bem-quisto"
 historical_character.dogen:0 "Fundador da escola Sōtō do Zen Budismo no Japão, reverenciado por seus ensinamentos sobre meditação e por sua obra principal Shōbōgenzō, que moldou a filosofia Zen japonesa."
 historical_character.durand_of_huesca:0 "Durand de Huesca foi um erudito pregador valdense de origem aragonesa cujas disputas com cátaros e teólogos romanos culminaram em sua reconciliação com o Papa Inocêncio III. Concedido permissão para pregar dentro da Igreja, ele fundou os Pobres Católicos — uma comunidade que praticava a pobreza apostólica valdense enquanto professava a ortodoxia católica."
 historical_character.dwijendra:0 "Líder espiritual que desempenhou papel significativo na difusão do Hinduísmo em Lombok e Bali, Mpu Dwijendra é conhecido por seus ensinamentos e pela fundação de templos nas ilhas."
 historical_character.egil_skallagrimrsson:0 "Um renomado poeta-guerreiro islandês, Egil Skallagrímsson é a figura central na \"Saga de Egil.\" Conhecido por seu temperamento feroz e talento poético, ele é lembrado por seus atos violentos, versos poderosos e seu papel significativo no início da colonização da Islândia e nas invasões vikings na Inglaterra."
 historical_character.eisai:0 "Nascido em uma família de santuário, $Eisai$ tornou-se monge, mas estava insatisfeito com as escolas Pundarika ou Tendai dominantes do Budismo e viajou à China para estudar os ensinamentos de pensadores Dhyana ou Chan. Ao retornar, introduziu essas ideias no Japão, fundando a escola Zen Rinzai, estabelecendo seu primeiro templo e popularizando novamente o chá verde."
 historical_character.erik_rode:0 "Erik Röde, também conhecido como Erik, o Vermelho, foi um explorador viking e fundador dos primeiros assentamentos nórdicos na Groenlândia. Ele é conhecido por seu espírito aventureiro e por liderar os esforços de colonização, estabelecendo uma comunidade que duraria vários séculos."
 historical_character.erudite:0 "Um erudito renomado"
 historical_character.eunuch:0 "Um eunuco habilidoso e subserviente"
 historical_character.eustathius_of_thessalonica:0 "Eustácio de Tessalônica foi um estudioso bizantino, teólogo e arcebispo de Tessalônica do século XII. Renomado por sua escrita prolífica, Eustácio é autor de comentários detalhados sobre as obras de Homero. Seu mandato como arcebispo foi marcado por seus esforços para reconstruir e reformar o papel da igreja na sociedade após a invasão siciliana de Tessalônica."
 historical_character.explorer:0 "Um explorador bem conhecido e audacioso"
 historical_character.ezra:0 "Abraham ibn Ezra foi um erudito, poeta e polímata judeu do século XII da Espanha. Conhecido por suas profundas contribuições à exegese bíblica, astrologia e matemática, ibn Ezra viajou extensivamente pelo Mediterrâneo, influenciando círculos intelectuais com seus escritos."
 historical_character.fan_zhongyan:0 "Estadista, chanceler e estudioso neoconfucionista do Norte Song, conhecido pelo famoso lema 'Seja o primeiro a se preocupar e o último a desfrutar'; implementou reformas marcantes para melhorar a governança e o bem-estar social."
 historical_character.ferdowsi:0 "Ferdowsi foi um poeta persa dos séculos X-XI cujo monumental \"Shahnameh\", cerca de cinquenta mil dísticos compostos ao longo de três décadas, preservou o passado mítico e heróico do Irã na língua de seus ancestrais. Largamente não recompensado em vida, ele agora é reverenciado como o salvador da língua persa."
 historical_character.fibonacci:0 "Leonardo Fibonacci foi um matemático italiano dos séculos XII-XIII, mais conhecido por introduzir o sistema numérico hindu-arábico na Europa. Seu livro \"Liber Abaci\" popularizou o uso de números arábicos e aritmética no mundo ocidental. Fibonacci também é reconhecido pela sequência de Fibonacci, um conceito matemático que descreve um padrão encontrado na natureza e em vários campos de estudo."
 historical_character.francis_of_assisi:0 "Francisco de Assisi foi um frade italiano do século XIII que renunciou à riqueza de sua família de comerciantes para abraçar a pobreza radical e pregar aos pobres. Fundador da Ordem Franciscana, ele buscou imitar a vida de Cristo de maneira literal e humilde, tornando-se um dos santos mais amados da cristandade medieval e o primeiro receptor registrado dos estigmas."
 historical_character.friar_julianus:0 "O Frei Julianus foi um dominicano húngaro do século XIII que empreendeu duas jornadas extraordinárias para o leste em busca da terra natal dos magiares. Ele encontrou uma comunidade de língua húngara na Basquiria, mas sua segunda viagem foi interrompida pelas notícias do avanço mongol — um aviso que logo alcançaria toda a Hungria."
 historical_character.gabriol:0 "Salomão ibn Gabirol foi um filósofo e poeta judeu do século XI da Espanha muçulmana. Conhecido por suas obras neoplatônicas, notavelmente \"Fons Vitae\" (\"A Fonte da Vida\"), ele explorou a natureza de Deus e do universo, influenciando significativamente o pensamento judaico e cristão. Ibn Gabirol também foi um prolífico escritor de poesia hebraica."
 historical_character.gallant_knight:0 "Um [ROOT.Char.Custom('KnightCultureNoTooltip')|l] galante"
 historical_character.gallus_anonymus:0 "Gallus Anonymus foi um anônimo monge beneditino — possivelmente franco ou veneziano — que compôs a primeira crônica narrativa da Polônia no início do século XII na corte de Bolesław III, o Boca Torta. Seus \"Gesta principum Polonorum\" continuam sendo o texto fundacional da historiografia polonesa."
 historical_character.gemistus_pletho:0 "Gemisto Pletho foi um filósofo do século XV. Um fervoroso defensor do neoplatonismo, Pletho desempenhou um papel crítico na revitalização intelectual que precedeu a queda de Constantinopla. Ele foi fundamental durante o Concílio de Florença, onde argumentou a favor da reunificação das igrejas ortodoxa e católica."
 historical_character.geoffrey_chaucer:0 "Geoffrey Chaucer foi um poeta e autor inglês do século XIV, mais conhecido por \"Os Contos de Cantuária,\" uma coleção de histórias que retratam uma peregrinação a Cantuária. Seu trabalho é celebrado por seus personagens vívidos, humor e exploração da sociedade medieval. As contribuições de Chaucer à literatura inglesa lhe renderam o título de \"Pai da poesia inglesa.\""
 historical_character.geoffrey_of_monmouth:0 "Geoffrey de Monmouth foi um clérigo galês do século XII e uma das figuras mais significativas no desenvolvimento da historiografia britânica e da literatura arturiana. Sua obra seminal, 'Historia Regum Britanniae' (A História dos Reis da Britânia), é um relato pseudo-histórico que cronica as vidas dos reis da Britânia."
 historical_character.george_akropolites:0 "George Akropolites foi um estadista, erudito e historiador bizantino do século XIII nas cortes do Império de Niceia e do restaurado império paleólogo. Sua crônica dos anos entre o saque latino de Constantinopla e sua recuperação é a principal fonte dessa era crucial."
 historical_character.georgius_pachymeres:0 "Geórgio Pachymeres foi um historiador e estudioso bizantino do século XIII, conhecido por seu trabalho abrangente, \"História Bizantina\", que cronica a história do Império Bizantino de 1255 a 1308. Seus escritos fornecem um relato detalhado do reinado da dinastia Palaiologos e do impacto da ocupação latina."
 historical_character.gerardo_of_borgo_san_donnino:0 "Gerardo de Borgo San Donnino foi um jovem frade franciscano que, por volta de 1254, reuniu os escritos proféticos de Joaquim de Fiore no Liber Introductorius in Evangelium Aeternum — o 'Evangelho Eterno'. Ele proclamou que a Era do Espírito estava próxima e que a Igreja institucional seria logo substituída por uma ordem contemplativa de pobres. O Papa Alexandre IV condenou o livro em 1255; Gerardo recusou-se a retratar-se e foi condenado à prisão perpétua, morrendo em sua cela cerca de vinte anos depois."
 historical_character.gersonides:0 "Levi ben Gershon (Gersonides) foi um filósofo, astrônomo e matemático judeu francês do século XIV. Renomado por sua abordagem científica, ele escreveu vários tratados influentes sobre matemática e astronomia. Ele também é conhecido por seu trabalho na melhoria do design de instrumentos astronômicos e por sua exploração filosófica do livre-arbítrio e da presciência divina."
 historical_character.giotto_di_bondone:0 "Giotto di Bondone foi um pintor e arquiteto italiano dos séculos XIII-XIV, celebrado por seu uso inovador de perspectiva e realismo na arte. Seu trabalho marcou uma ruptura com a tradição bizantina estilizada, lançando as bases para o Renascimento. Os afrescos de Giotto na Capela Scrovegni em Pádua são considerados obras-primas, influenciando gerações de artistas."
 historical_character.giovanni_boccaccio:0 "Giovanni Boccaccio foi um escritor e poeta italiano do século XIV, mais conhecido por sua obra \"O Decameron,\" uma coleção de histórias contadas por dez pessoas que escapam da Peste Negra. A narrativa vívida de Boccaccio e a exploração do comportamento humano o tornaram uma figura-chave na literatura do início do Renascimento. Suas obras influenciaram escritores posteriores, como Chaucer, e ajudaram a moldar a tradição literária italiana."
 historical_character.grigor_tatevatsi:0 "Grigor Tatevatsi foi um filósofo, teólogo e estudioso armênio do século XIV, conhecido por seu papel como professor e chefe da escola do Mosteiro de Tatev na Armênia medieval."
 historical_character.guilhabert_de_castres:0 "Guilhabert de Castres foi um perfectus cátaro e bispo de Toulouse cuja pregação itinerante de décadas levou a fé dualista tanto a cortes nobres quanto a vilas camponesas. Ele sobreviveu aos piores anos da Cruzada Albigense na fortaleza alpina de Montségur, organizando sua igreja no exílio até sua morte."
 historical_character.gunnlaug_ormstunga:0 "Gunnlaug Ormstunga, o protagonista da \"Saga de Gunnlaug Ormstunga,\" foi um poeta-guerreiro viking conhecido por suas viagens e rivalidades poéticas. A saga narra sua trágica história de amor e sua luta contra um rival poético, capturando a dinâmica de honra e fama na sociedade viking."
 historical_character.hafez:0 "Hafiz de Shiraz foi um poeta lírico persa do século XIV cujos gazéis, alternadamente extáticos, irônicos e silenciosamente devocionais, são reverenciados como a suprema realização do verso persa. Ainda hoje seu \"Divã\" é consultado como um livro de oráculos em lares iranianos."
 historical_character.haji_bektash:0 "Haji Bektash Veli foi um místico sufi do século XIII que viajou de Coração para a Anatólia na esteira das invasões mongóis. Seus ensinamentos de devoção interior e tolerância deram origem à ordem Bektashi, que mais tarde se tornaria o coração espiritual do corpo de janízaros e uma base da tradição Alevi da Anatólia."
 historical_character.heloise_dargenteuil:0 "Héloïse d'Argenteuil foi uma abadessa e erudita francesa do século XII, mais conhecida por sua correspondência com Pedro Abelardo. Suas cartas são renomadas por seu conteúdo apaixonado e intelectual, ilustrando sua profunda inteligência e profundidade emocional. Héloïse mais tarde se tornou abadessa da Abadia de Paraclete, onde demonstrou forte liderança."
 historical_character.hemachandra:0 "Hemachandra foi um estudioso indiano do século XII, polímata e monge jainista. Ele fez contribuições significativas para a matemática, gramática, prosódia e filosofia. O \"Siddhahem\" de Hemachandra é uma obra-chave na literatura Jain, e seus ensinamentos influenciaram muito a educação e as práticas jainistas."
 historical_character.hildegard:0 "Hildegard von Bingen foi uma abadessa, mística, escritora e compositora visionária, conhecida por suas visões religiosas e obras acadêmicas. Ela escreveu textos sobre teologia, medicina e música, contribuindo para o pensamento cristão medieval. Hildegard também era conhecida por suas composições litúrgicas e peças, enfatizando a cura espiritual e holística."
 historical_character.hodja:0 "Nasreddin 'o Hodja' é um herói folclórico e figura literária icônica nas culturas turcas, frequentemente retratado como um homem sábio e espirituoso que dá conselhos enigmáticos ou enfrenta infortúnios, resolvendo tudo com sua astúcia e humor."
 historical_character.honen:0 "$HO_nen$ foi ordenado ainda criança após o assassinato de seu pai, ascendendo com sucesso ao sacerdócio Tendai. Insatisfeito com o grande conforto dos monges em contraste à miséria do povo, reconheceu o [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] como doutrina inclusiva, tornando-se líder da Terra Pura. Suas ideias radicais despertaram a ira de outras seitas, levando ao exílio na perseguição Jogen."
 historical_character.hrotsvitha:0 "Hrotsvitha foi uma canonisa, poeta e dramaturga alemã do século X, conhecida como a primeira dramaturga feminina da era cristã. Escrevendo a partir da Abadia de Gandersheim, ela compôs peças, poemas e lendas que incorporaram temas cristãos com influências clássicas, frequentemente celebrando a força e a inteligência das mulheres."
 historical_character.ibn_battuta:0 "Ibn Battuta foi um explorador marroquino do século XIV, conhecido por suas extensas viagens, que abrangem mais de 120.000 quilômetros pelo mundo islâmico e além. Seu diário de viagem, \"Rihla,\" oferece insights detalhados sobre culturas e sociedades medievais, tornando-o um dos viajantes mais celebrados da história."
 historical_character.ibn_fadlan:0 "Ibn Fadlan foi um enviado abássida do século X enviado pelo califa al-Muqtadir à corte dos búlgaros do Volga. Seu vívido relato de viagem — incluindo uma famosa descrição ocular do funeral de um chefe rus' no Volga — continua sendo uma das fontes mais valiosas sobre o início da estepe medieval e o oriente nórdico."
 historical_character.ibn_hazm:0 "Ibn Hazm foi um pensador andaluz de amplo espectro do século XI, jurista da escola literalista zahirita e autor de \"O Colar da Pomba\", o tratado sobre o amor mais famoso do árabe clássico. Amargurado com o colapso do Califado Omíada de Córdoba, a quem havia servido, voltou-se na velhice para uma polêmica religiosa ácida."
 historical_character.ibn_khaldun:0 "Ibn Khaldun foi um erudito árabe do século XIV de Tunis, considerado um dos pais da sociologia moderna, da historiografia e da economia. Sua obra mais famosa, a \"Muqaddimah\" (Introdução), é uma tentativa inicial de despojar fenômenos históricos e sociais de mitos e fundamentá-los na análise de causa e efeito, conflitos sociais e fatores econômicos."
 historical_character.ibn_tufail:0 "Ibn Tufail foi um polímata andaluz do século XII — médico, filósofo e vizir dos califas almôadas — mais conhecido por seu romance filosófico \"Hayy ibn Yaqzan\". Esse conto de um menino selvagem que atinge a verdade espiritual em uma ilha deserta influenciaria pensadores europeus, de Espinosa aos escritores de \"Robinson Crusoé\"."
 historical_character.ibn_zaydun:0 "Ibn Zaydun foi um poeta e estadista do al-Andalus do século XI, nascido em uma família nobre de Córdoba. Seu caso de amor condenado com a princesa omíada e poetisa Wallada bint al-Mustakfi inspirou algumas das poesias de amor mais célebres da língua árabe."
 historical_character.ippen:0 "$Ippen$ estudou escrituras desde jovem antes de retornar à vida secular. Durante peregrinação em Kumano, kami lhe revelou o caminho para a iluminação: o recital extático do [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]. Inspirado divinamente, $Ippen$ retornou como monge devoto da Terra Pura, viajando pelo Japão com seguidores fervorosos e fundando a escola Ji-shū."
 historical_character.jacopone:0 "Jacopone da Todi foi um frade franciscano e poeta italiano do século XIII cujas \"laudes\" místicas, compostas no vernáculo úmbrio, são os primeiros primores da lírica religiosa. Crítico feroz do Papa Bonifácio VIII, passou anos preso por tomar partido dos franciscanos espirituais contra ele."
 historical_character.jan_hus:0 "Jan Hus foi um sacerdote boêmio e reitor da Universidade Charles de Praga cujas denúncias de indulgências papais e exigência de pregação em vernáculo incendiaram um movimento nacional de reforma. Convocado ao Concílio de Constança sob salvo-conduto imperial, foi condenado e queimado na fogueira em 1415; sua morte desencadeou as Guerras Hussitas, que desafiaram cruzada após cruzada."
 historical_character.jangar:0 "Jangar é o herói lendário da épica Oirat \"A Épica de Jangar\". Ele é famoso por construir a cidade fantástica de Shambhala e liderar seu povo com sabedoria e coragem. Suas batalhas contra inimigos e sua busca para restaurar a paz e a prosperidade em sua terra encapsulam as lutas e ideais do povo Oirat."
 historical_character.jayadeva:0 "Jayadeva foi um poeta sânscrito do século XII da região de Bengala cujo lírico \"Gitagovinda\" recria o amor de Krishna e Radha como uma sublime alegoria religiosa. Seus versos tornaram-se centrais para o movimento devocional bhakti e ainda são cantados em templos de Odisha a Kerala hoje."
 historical_character.jeong_mong_ju:0 "Estadista, acadêmico e poeta do final de Goryeo, Chŏng Mong-ju foi reverenciado por sua lealdade inabalável à dinastia em seus últimos dias. Mestre do pensamento neoconfucionista e da diplomacia, opôs-se à ascensão do regime Joseon e foi assassinado por seus princípios. Seu poema final, expressando fidelidade firme, permanece um dos versos mais famosos da Coreia."
 historical_character.jerome_of_prague:0 "Jerônimo de Praga foi um erudito e polemista boêmio que estudou em Oxford, trouxe os escritos de Wycliffe para Praga e esteve ao lado de Jan Hus como o campeão mais instruído do partido da reforma. Convocado ao Concílio de Constança para se retratar, primeiro cedeu e depois publicamente reafirmou o ensino de Hus, sendo queimado no mesmo local um ano depois de seu amigo."
 historical_character.jinul:0 "Um visionário monge Seon do período Goryeo, $Ji_nul$ buscou reformar o Budismo coreano unificando prática meditativa e estudo doutrinal. Fundador da Ordem Jogye em Songgwangsa, enfatizou a iluminação pessoal dentro da disciplina monástica. Seus ensinamentos estabeleceram a base do Seon coreano contemporâneo, fundindo insight Zen com profundidade acadêmica."
 historical_character.joachim_of_fiore:0 "Joaquim de Fiore foi um abade e místico calabrês do século XII cuja visão tripartite da história — as Eras do Pai, do Filho e do Espírito Santo — influenciou profundamente o pensamento apocalíptico medieval. Seus escritos moldaram os franciscanos espirituais e inspiraram séculos de especulação milenarista por toda a Europa Latina."
 historical_character.joan_of_arc:0 "Nascida de camponeses em Lorena, Joana d'Arc afirmou ter visões divinas instando-a a expulsar os ingleses da França. Liderando exércitos reais para aliviar Orléans e coroando o Delfim em Reims, ela mudou o rumo da Guerra dos Cem Anos antes de ser capturada, julgada por heresia e queimada em Ruão aos dezenove anos."
 historical_character.john_axuch:0 "João Axuch foi um comandante militar bizantino do século XII e o ministro-chefe sob o imperador João II Comneno. Originalmente um turco seljúcida capturado na infância e criado dentro da corte imperial, Axuch se destacou como o conselheiro e amigo mais confiável do imperador."
 historical_character.john_oldcastle:0 "Sir John Oldcastle, Barão Cobham, foi um cavaleiro inglês e companheiro íntimo do jovem Henrique V que abraçou abertamente o lollardismo de Wycliffe. Condenado por heresia e confinado à Torre, ele escapou e liderou uma revolta lollarda condenada em Londres em 1414, sendo eventualmente recapturado e enforcado em fogo lento."
 historical_character.john_the_orphanotrophos:0 "João o Orfanotrófo foi um eunuco notável e oficial de corte influente no início do século XI durante o reinado do imperador Miguel IV. Como chefe do orfanotrófo, o funcionário público responsável pelo bem-estar de órfãos e pobres, João acumulou considerável poder e influência."
 historical_character.john_tzetzes:0 "João Tzetzes foi um estudioso bizantino do século XII conhecido por sua vasta produção literária e erudição em literatura clássica. Ele escreveu extensivamente sobre assuntos gramaticais, históricos e mitológicos, sendo suas obras mais famosas \"Chiliades\" ou \"Livro das Histórias\", uma coleção de anedotas históricas e mitológicas em verso."
 historical_character.john_wycliffe:0 "John Wycliffe foi um teólogo e reformador inglês do século XIV, conhecido por sua crítica precoce às práticas da Igreja Católica. Ele defendeu a tradução da Bíblia para o inglês, preparando o terreno para a Reforma Protestante. Os ensinamentos de Wycliffe, que questionavam a autoridade da igreja, influenciaram o movimento Lollard e reformadores posteriores, como Martinho Lutero."
 historical_character.joseph_rabban:0 "Joseph Rabban foi uma figura proeminente na comunidade judaica da Malabar no século IX. O rei Chera lhe concedeu direitos e privilégios para a comunidade judaica em Cochim, e a liderança de Rabban ajudou a solidificar a presença e influência judaica no sul da Índia. Suas ações garantiram autonomia e respeito por suas contribuições comerciais e culturais."
 historical_character.joseph_tarchaneiotes:0 "José Tarchaneiotes foi um general bizantino ativo durante o final do século XI, conhecido principalmente por seu papel nas campanhas militares bizantinas contra os turcos seljúcidas. Servindo sob o imperador Alexios I Komnenos, Tarchaneiotes desempenhou um papel fundamental em várias batalhas críticas, incluindo a bem-sucedida defesa de Nicéia."
 historical_character.kanwa:0 "Poeta da corte durante o reinado do Rei Airlangga, Mpu Kanwa compôs o Kakawin Arjunawiwaha, um épico que mistura mitologia hindu com ideais javaneses."
 historical_character.karunakara:0 "Karunakara foi um famoso general do rei Chola Kulottunga e esmagou tanto inimigos quanto traidores contra a causa Chola. A vida de Karunakara é descrita no poema Kalinkkattuparani, onde sua dominação sobre Kalinga e a subsequente homenagem a Kulottunga são idolatradas."
 historical_character.kashgari:0 "Mahmud al-Kashgari foi um lexicógrafo caracânida do século XI que viajou pelo mundo de língua turca para compilar seu \"Dīwān Lughāt al-Turk\", um dicionário e etnografia árabe-turca abrangente. Sua coleta cuidadosa de dialetos, canções, provérbios e o mapa mais antigo conhecido do mundo turco é uma janela incomparável para a estepe medieval."
 historical_character.kavindrarimathana:0 "Kavindrarimathana foi um arquiteto e engenheiro proeminente durante o reinado do Rei Rajendravarman II. É creditado pelo projeto de templos significativos, incluindo Pre Rup e East Mebon, demonstrando a habilidade arquitetônica do Império Khmer."
 historical_character.kokan_shiren:0 "Monge Zen Rinzai, poeta e historiador do período Kamakura; compilou o Zenrin Kokuhōki (um notável texto de história budista) e antologias de poesia que combinam a visão Zen com elegância literária."
 historical_character.kshemendra:0 "Kshemendra foi um poeta e estudioso da Caxemira do século XI, versátil em suas criações literárias que abrangiam obras satíricas, paródias e textos religiosos. Suas obras notáveis incluem \"Samaya Matrika\" e \"Darpadalana\", criticando humoristicamente os costumes de sua época, tornando-o uma figura única na literatura clássica em sânscrito."
 historical_character.kuturan:0 "Figura religiosa reverenciada na história balinesa, Mpu Kuturan é creditado com a unificação de várias seitas do Hinduísmo em Bali e com o estabelecimento do sistema Desa Adat, que integra leis religiosas e costumeiras."
 historical_character.la_hire:0 "Étienne de Vignolles, famoso como La Hire, foi um comandante militar-chave durante as fases finais da Guerra dos Cem Anos. Renomado por sua bravura e destreza em batalha, La Hire foi um dos principais comandantes sob Joana d'Arc."
 historical_character.leif_erikson:0 "Leif Erikson foi um explorador nórdico creditado por liderar os primeiros europeus conhecidos a pisar na América do Norte, por volta do ano 1000. Navegando para o oeste a partir da colônia de seu pai Érico, o Vermelho, na Groenlândia, ele batizou a costa arborizada que encontrou de \"Vinland\" e passou o inverno lá antes de retornar para casa com madeira e uvas."
 historical_character.li_qingzhao:0 "Uma das maiores poetisas da China, celebrada por sua poesia Ci (lírica) da dinastia Song, que expressa de forma pungente perdas pessoais e a elegância de tempos passados."
 historical_character.madhvacharya:0 "Madhvacharya foi um filósofo indiano do século XIII e o principal proponente da escola Dvaita do Vedanta. Ele ensinou que a alma (Atman) e a realidade última (Brahman) são distintas, um contraste marcante com as filosofias não-dualistas predominantes na época. Seus escritos e debates moldaram significativamente a teologia hindu."
 historical_character.maimonides:0 "Maimônides foi um filósofo e erudito judaico do século XII. Ele é mais conhecido por seu \"Mishneh Torah,\" uma codificação da lei judaica, e \"Guia dos Perplexos,\" que aborda a relação entre religião e filosofia. Ele é considerado um dos pensadores judaicos mais influentes da história."
 historical_character.manuel_holobolos:0 "Manuel Holobolos foi um estudioso e oficial do século XIII, conhecido por suas habilidades literárias e retóricas. Ele atuou em várias funções administrativas sob vários imperadores bizantinos e é mais lembrado por suas cartas e discursos eloquentes."
 historical_character.manuel_moschopoulos:0 "Manuel Moschopoulos foi um estudioso e gramático bizantino no final dos séculos XIII e XIV, mais conhecido por seu trabalho na revitalização do aprendizado e da literatura grega clássica. Ele escreveu extensivamente sobre assuntos gramaticais e produziu comentários sobre autores clássicos, visando preservar e esclarecer textos antigos."
 historical_character.marco_polo:0 "Marco Polo foi um comerciante, explorador e escritor veneziano que viajou pela Ásia ao longo da Rota da Seda entre 1271 e 1295. Seus extensos relatos de suas viagens à China sob o governo de Cã Kublai foram publicados como \"As Viagens de Marco Polo\", oferecendo aos europeus uma visão abrangente das terras e culturas asiáticas."
 historical_character.margery_kempe:0 "Margery Kempe foi uma mística e peregrina inglesa que, após uma série de visões angustiantes, abandonou seu negócio de fabricação de cerveja e viajou para Roma, Jerusalém e Compostela. O \"Livro de Margery Kempe\", ditado em sua velhice, é considerado a primeira autobiografia sobrevivente na língua inglesa."
 historical_character.matthew_paris:0 "Mateus de Paris foi um monge beneditino e cronista inglês do século XIII na Abadia de St. Albans. Sua \"Chronica Majora\" combinou comentários políticos incisivos com mapas vívidos e ilustrações desenhadas por sua própria mão, fornecendo um dos registros mais coloridos e detalhados de sua época."
 historical_character.medici:0 "Averardo de' Medici, também conhecido como Bicci, foi um ancestral inicial da ilustre família Medici, que se destacou em Florença durante o Renascimento. Averardo foi instrumental na construção da riqueza e status da família nos círculos políticos e sociais de Florença."
 historical_character.meister_eckhart:0 "Meister Eckhart foi um teólogo, filósofo e místico do século XIII, conhecido por seus ensinamentos influentes sobre a natureza de Deus e a relação da alma humana com o divino. Seus sermões e escritos exploram temas de desapego, nascimento divino na alma e a identidade do ser."
 historical_character.merchant:0 "Um comerciante astuto e bem-sucedido"
 historical_character.mibu_tadamine:0 "Apesar de origens humildes, $Tadamine$ ganhou grande renome por sua poesia waka após participar de uma competição, recebendo comissões imperiais e patrocínio da família Fujiwara. Junto com seu filho, $Tadami$, é contado entre os Trinta e Seis Poetas Imortais do Japão, com mais de oitenta e uma poesias supostamente incluídas em antologias imperiais."
 historical_character.michael_choniates:0 "Miguel Choniates foi um estudioso, poeta e figura eclesiástica bizantina do século XII, renomado por seu mandato como arcebispo de Atenas de 1182 a 1204. Em um tempo de controle bizantino em declínio, ele se esforçou para manter as tradições culturais e intelectuais de Atenas."
 historical_character.michael_psellos:0 "Miguel Psellos foi um filósofo, político e historiador bizantino do século XI. Servindo como cortesão sob vários imperadores, Psellos foi fundamental na revitalização da filosofia e ciências gregas na corte bizantina. Sua obra mais notável, \"Cronografia\", fornece um relato penetrante e detalhado da política bizantina e da vida na corte."
 historical_character.miklos_toldi:0 "Miklós Toldi é o lendário homem forte húngaro do reinado de Luís, o Grande, imortalizado em canção e crônica como um herói de origem camponesa de força prodigiosa que ascendeu ao favor da corte por proezas de armas. Sua história se tornaria a epopeia nacional da Hungria no século XIX sob a pena de János Arany."
 historical_character.mkhitar_gosh:0 "Mkhitar Gosh foi um estudioso, clérigo e jurista armênio do século XII, renomado por suas contribuições ao direito e à literatura armênia. Ele é o autor de uma das primeiras codificações do direito armênio, o 'Datastanagirk' ('Livro da Lei')."
 historical_character.monaguna:0 "Mpu Monaguna é creditado com a composição do Kakawin Sumanasantaka, uma obra poética que reflete a fusão de narrativas hindus com a cultura javanesa."
 historical_character.monk:0 "Um [GetTrait('devoted').GetNameNoTooltip( ROOT.Char )|l] piedoso e respeitado"
 historical_character.muireadhach_albanach:0 "Muireadhach Albanach Ó Dálaigh foi um poeta bardo irlandês do início do século XIII da prestigiada família Ó Dálaigh. Após matar o intendente de seu patrono, ele fugiu para a Escócia — ganhando seu epíteto \"Albanach\", \"o escocês\" — e participou de uma cruzada antes de retornar para compor para senhores gaélicos em ambos os lados do Mar da Irlanda."
 historical_character.munis_al_muzaffar:0 "Mu'nis al-Muzaffar foi um escravo eunuco nascido na Grécia que ascendeu para se tornar o general mais poderoso e regente efetivo do final do Califado Abássida. Por três décadas, ele manteve o império unido contra rebeliões e invasões estrangeiras, apenas para ser deposto e executado pelo próprio califa que ele havia colocado no trono."
 historical_character.murasaki:0 "Bisneta do renomado poeta Fujiwara Kanesuke, Lady Murasaki nasceu na erudita família Yoshikado, servindo como dama de companhia da imperatriz de Emperor Ichijo, Fujiwara Shōshi. Seu talento para a poesia foi logo reconhecido, sendo contada entre as Trinta e Seis Mulheres Poetas Imortais. Hoje é mais conhecida por seu diário, sua rivalidade com a poeta #EMP Sei Shōnagon#! e pelo #EMP Tale of Genji#!, possivelmente o primeiro romance."
 historical_character.myoe:0 "Orfão desde menino, $MyO_e$ estudou diversas escolas, tendo $Mongaku$ e $Eisai$ entre seus professores, mas não se impressionou. Buscando isolamento das discussões nos mosteiros, voltou aos antigos ensinamentos Kegon, revitalizando-os com influências Shingon e Tendai, rejeitando a fascinação pelo [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')]."
 historical_character.nachmanides:0 "Nachmanides, também conhecido como Moisés ben Nahman ou Ramban, foi um erudito e teólogo judeu do século XIII. Renomado por seu profundo comentário sobre a Torá e sua liderança na comunidade judaica de Girona, Nachmanides defendeu as crenças judaicas na Disputa de Barcelona em 1263. Seus escritos e ensinamentos combinam a lei judaica, a misticismo e os ensinamentos éticos."
 historical_character.namdev:0 "Namdev foi um santo e poeta marata do século XIII, conhecido por suas canções devocionais dedicadas a Vithoba e como uma figura proeminente no movimento Bhakti em Maharashtra. Popular entre as pessoas comuns, suas obras também aumentaram consideravelmente a difusão e prestígio da língua marata como uma linguagem de poesia e religião."
 historical_character.nestor_chronicler:0 "Nestor foi um monge do Mosteiro das Grutas de Kiev e o compilador tradicional da \"Crônica Primária\", o registro fundamental do povo rus' primitivo. Seus escritos moldaram a concepção russa de sua história, fé e da dinastia ruríquida governante por séculos."
 historical_character.nguyen_thuyen:0 "Poeta-oficial do século XIII, creditado por pioneirar o uso do script Nôm (escrita vernacular vietnamita) na literatura. Lembrado por versos que, segundo a lenda, afastaram crocodilos, simbolizando a força da língua e do aprendizado vietnamita."
 historical_character.nicephorus_blemmydes:0 "Nicéforo Blemmydes foi um estudioso e teólogo bizantino do século XIII. Ele fundou uma escola e um mosteiro onde ensinou e viveu a maior parte de sua vida. Blemmydes escreveu extensivamente sobre filosofia, teologia e ciência, esforçando-se para reconciliar as ideias filosóficas clássicas com a doutrina cristã."
 historical_character.nicetas_choniates:0 "Nicetas Choniates foi um funcionário do governo bizantino e historiador no final do século XII e início do século XIII. Renomado por seu trabalho \"Crônica\", ele fornece um relato detalhado da vida e da política bizantinas de 1118 a 1207, cobrindo o declínio do Império Bizantino e os eventos da Quarta Cruzada."
 historical_character.nichiren:0 "Um reformador radical e inflexível do Budismo japonês, $Nichiren$ declarou a devoção ao Sutra de Lótus como o único caminho para a salvação. Fieramente crítico de seitas rivais e da complacência política, suportou exílio e tentativas de assassinato por seus ensinamentos. Seu legado gerou a criação de uma escola nacionalista única de Budismo que perdura até hoje."
 historical_character.niketas_of_constantinople:0 "Nicetas foi um bispo bogomilo de Constantinopla que viajou para o oeste para presidir o concílio cátaro de Saint-Félix-de-Caraman por volta de 1167. Estabelecendo a hierarquia dualista do Languedoc e concedendo o consolamentum aos seus primeiros bispos, ele costurou a igreja cátara em uma tradição dissidente oriental mais ampla."
 historical_character.nizam_al_mulk:0 "Nizam al-Mulk foi o imponente vizir persa que, por quase trinta anos, governou efetivamente o Império Seljúcida sob os sultões Alp Arslan e Malik-Shah. Seu \"Siyāsatnāma\" definiu a teoria persa medieval de realeza, e a rede de madrasas que ele fundou — as Nizāmiyya — moldou o aprendizado sunita por séculos."
 historical_character.nizami_ganjavi:0 "Nizami Ganjavi foi um poeta persa do século XII de Ganja cujos cinco grandes romances — o \"Khamsa\" — são pilares da literatura clássica persa. Seus contos de Layla e Majnun, de Khusraw e Shirin, estabeleceram o padrão para a poesia narrativa em todo o mundo persa."
 historical_character.omar_khayyam:0 "Omar Khayyam foi um polímata persa do século XI, poeta, matemático e astrônomo. Mais conhecido hoje por sua poesia, coletada em \"O Rubaiyat\", ele fez contribuições significativas à álgebra e à astronomia na Pérsia. Seu trabalho acadêmico sobre a classificação e solução de equações cúbicas é considerado uma conquista monumental na matemática."
 historical_character.panuluh:0 "Mpu Panuluh completou o Kakawin Bhāratayuddha e escreveu o Kakawin Hariwangsa, contribuindo significativamente para a tradição literária javanesa."
 historical_character.paul_vladimiri:0 "Pawel Wlodkowic foi um teólogo, jurista e reitor polonês da Universidade Jaguelônica. No Concílio de Constança, ele argumentou famosamente que os povos pagãos detinham direitos naturais à propriedade e ao autogoverno, denunciando as guerras de conversão forçada da Ordem Teutônica como ilegais mesmo aos olhos de Deus."
 historical_character.peter_abelard:0 "Pedro Abelardo foi um filósofo e teólogo francês do século XII, famoso por sua abordagem escolástica e seu relacionamento controverso com Héloïse. Seu livro \"Sic et Non\" utilizou o raciocínio dialético para explorar questões teológicas. A vida e a obra de Abelardo tiveram um impacto significativo na filosofia medieval, enquanto sua história de amor com Héloïse permanece uma narrativa clássica medieval."
 historical_character.peter_the_eunuch:0 "Pedro, o Eunuco, foi um proeminente oficial da corte bizantina e conselheiro de confiança durante o reinado do imperador Miguel IV no século XI. Servindo como parakoimomenos, Pedro desempenhou um papel crítico em apoiar a ascensão de Miguel IV ao trono e promoveu os interesses do mosteiro de Estudiós."
 historical_character.peter_the_hermit:0 "Pedro, o Eremita, foi um pregador ascético francês cujos sermões apaixonados reuniram Dezenas de milhares de pessoas comuns para se juntarem à Cruzada Popular em 1096. Sua horda indisciplinada foi amplamente destruída na Anatólia, mas ele próprio sobreviveu para participar da tomada de Jerusalém três anos depois."
 historical_character.peter_the_stratopedarches:0 "Pedro, o 'Estratopedarches', foi um notável comandante militar e eunuco do século X que 'abundava em força física'. Ele desempenhou um papel crucial durante o reinado do imperador Basílio II, particularmente durante a revolta liderada pelo general Bardas Skleros."
 historical_character.peter_waldo:0 "Pedro Waldo foi um rico comerciante de Lyon que, após um despertar religioso, doou sua fortuna e começou a pregar a pobreza apostólica no vernáculo. Seus seguidores, os valdenses, foram eventualmente condenados por Roma, mas sobreviveram nos vales alpinos como um dos primeiros movimentos proto-protestantes duradouros."
 historical_character.petrarch:0 "Petrarca foi um erudito e poeta italiano do século XIV, amplamente considerado o \"Pai do Humanismo.\" Ele é mais conhecido por seus sonetos e poemas, especialmente o \"Canzoniere,\" que se concentrava em seu amor não correspondido por Laura. As obras de Petrarca foram instrumentais no desenvolvimento do humanismo renascentista, enfatizando o aprendizado clássico e o individual."
 historical_character.pham_ngu_lao:0 "Famoso general da dinastia Tran, que ajudou a repelir várias invasões mongóis no século XIII. De origem camponesa, ascendeu pela coragem e tornou-se símbolo de patriotismo (também tema de um poema famoso destacando sua dedicação)."
 historical_character.physician:0 "Um médico capaz e habilidoso"
 historical_character.poet:0 "Um poeta renomado e respeitado"
 historical_character.prapanca:0 "Poeta da corte e historiador de Majapahit, Java, autor do épico Nagarakretagama (1365) que detalha a glória e geografia de Majapahit; sua obra é uma fonte-chave sobre a história e administração javanesa."
 historical_character.priest_bogomil:0 "O padre Bogomil foi um clérigo da aldeia búlgara do século X cuja pregação da pobreza apostólica e rejeição da Igreja visível e de seus sacramentos deu seu nome a um dos movimentos dualistas mais duradouros da Europa medieval. Dos Bálcãs, seus discípulos levaram a doutrina por todo o Império Bizantino e tão a oeste quanto o Languedoc."
 historical_character.qiu_chuji:0 "Reverenciado mestre taoista (um dos Sete Verdadeiros Taoistas do Norte) e conselheiro do Cã Genghis; viajou do Norte da China à Ásia Central para aconselhar o Cã sobre governança e longevidade, ajudando a estabelecer a política religiosa inicial dos Yuan."
 historical_character.raiktor:0 "Em 1081, em meio à turbulência após a ascensão de Alexios I Comneno ao poder, Raiktor, um monge, alegou falsamente ser o deposto imperador Miguel VII. Aproveitando-se dessa oportunidade, o duque normando Roberto Guiscard usou a reivindicação de Raiktor para justificar sua invasão dos Balcãs. Apesar de a farsa ter sido descoberta, Guiscard continuou sua campanha, desfilando Raiktor diante de Dyrrachium para ganhar apoio. No final, Guiscard abandonou Raiktor quando o engano falhou, levando provavelmente ao silencioso descarte de Raiktor uma vez que ele não era mais útil."
 historical_character.ramanuja:0 "Ramanuja foi um teólogo indiano do século XI, conhecido por seu papel fundamental na fundação da tradição do Sri Vaishnavismo. Ele advogou a devoção a Vishnu, promovendo uma abordagem pessoal e compassiva da espiritualidade. Suas interpretações do Vedanta enfatizavam o não-dualismo qualificado, uma importante divergência em relação a outras escolas de pensamento."
 historical_character.ramon_llull:0 "Ramon Llull foi um polímata, teólogo e missionário maiorquino do século XIII que desenvolveu uma \"Arte\" lógica destinada a converter todos os povos ao cristianismo por meio de argumentos racionais. Ele escreveu prolificamente em catalão, latim e árabe, pioneiro tanto da filosofia vernácula quanto da lógica combinatória que inspiraria Leibniz séculos mais tarde."
 historical_character.rashi:0 "Rashi (Shlomo Yitzchaki) foi um rabino francês do século XI e respeitado erudito judaico, conhecido por seus comentários abrangentes sobre o Talmud e a Bíblia Hebraica. Suas obras tiveram um impacto profundo e duradouro nos estudos judaicos, na lei e são parte integrante da educação judaica tradicional."
 historical_character.regino_of_prum:0 "Regino de Prüm foi um notável monge beneditino, historiador e teórico da música do século IX. Ele serviu como abade da Abadia de Prüm até sua expulsão em 899, após o que se tornou abade da Abadia de São Martinho em Treves. Ele é mais conhecido por sua crônica 'Chronicon'."
 historical_character.robert_of_st_albans:0 "Roberto de St. Albans foi um templário inglês que, por volta de 1185, abandonou sua ordem, converteu-se ao Islã e entrou a serviço de Saladino. Ele liderou ataques aiúbidas contra os estados cruzados e, segundo relatos, casou-se com a família do sultão, um escândalo duradouro nas crônicas ocidentais."
 historical_character.roger_bacon:0 "Roger Bacon foi um filósofo e frade franciscano inglês do século XIII, reconhecido por sua defesa precoce do método científico. Ele enfatizou a observação e a experimentação em seus estudos, contribuindo para o desenvolvimento da ciência empírica. O trabalho de Bacon em óptica e alquimia influenciou estudiosos posteriores durante o período medieval."
 historical_character.roger_de_flor:0 "Roger de Flor foi um proeminente capitão mercenário e aventureiro do final do século XIII e início do século XIV. Originalmente um cavaleiro templário, ele mais tarde se tornou o líder dos Almogàvers, formando a Companhia Catalã. Lutou por Andrônico II e Miguel IX, o último dos quais mandou assassiná-lo devido à sua crescente influência dentro do Império Bizantino."
 historical_character.rumi:0 "Rumi foi um poeta, teólogo e místico sufista persa do século XIII. Seu profundo legado espiritual é encapsulado em suas obras poéticas, notavelmente o \"Masnavi,\" que muitas vezes é referido como o \"Alcorão em persa.\" Os ensinamentos de Rumi enfatizam o amor incondicional, a tolerância e a busca pela verdade divina através de experiências espirituais pessoais."
 historical_character.saadi_shirazi:0 "Saadi de Shiraz foi um poeta persa do século XIII cujas décadas de peregrinação o levaram da Anatólia à Índia na esteira da tempestade mongol. Seu \"Bustān\" e \"Gulistān\", misturando inteligência, calor e sabedoria mundana, tornaram-no por séculos o poeta mais lido do mundo de língua persa."
 historical_character.saadia:0 "Saadia Gaon foi um filósofo, teólogo e erudito judeu do século X. Ele serviu como chefe da famosa Academia de Sura e é renomado por suas obras sobre a lei judaica e seu tratado filosófico \"Emunoth ve-Deoth\" (O Livro das Crenças e Opiniões). Este tratado foi a primeira tentativa sistemática de integrar a teologia judaica com elementos da filosofia grega."
 historical_character.sakata_kintoki:0 "Um poderoso guerreiro das montanhas de Sagami, $dynn_Satake$ $Kin_toki$ teria servido $dynn_Minamoto$ $Yorimitsu$ com grande força e lealdade. Seus feitos lendários como 'Kintarō' incluem lutar com ursos, arrancar árvores e avançar em batalhas."
 historical_character.samonas:0 "Samona foi um eunuco notável e oficial de corte influente durante o final dos séculos IX e X sob o imperador Leão VI, o Sábio. Originalmente de Samosata, ele ganhou destaque através de sua posição como parakoimomenos, ou camareiro do imperador, onde exerceu um considerável poder dentro da corte bizantina."
 historical_character.sargis_pitsak:0 "Sargis Pitsak foi um iluminador de manuscritos e escriba armênio do século XIV, renomado por suas contribuições à arte da confecção de livros armênios medievais."
 historical_character.saxo_grammaticus:0 "Saxo Grammaticus foi um historiador e clérigo dinamarquês do século XII na comitiva do arcebispo Absalon de Lund. Sua abrangente \"Gesta Danorum\" combinou mito, lenda e crônica contemporânea, preservando a perdida lenda de Hamlet que inspiraria Shakespeare quatro séculos depois."
 historical_character.scholar:0 "Um renomado erudito"
 historical_character.sedah:0 "Comissionado pelo Rei Jayabhaya, Mpu Sedah começou a compor o Kakawin Bhāratayuddha, uma adaptação do Mahabharata, que mais tarde foi completada por Mpu Panuluh."
 historical_character.sekkilhar:0 "Como uma criança prodígio, Sekkilhar foi recrutado ainda jovem pelo Raja Kulothunga como um ministro e estadista de grande valor. Sekkilhar é mais conhecido por ter escrito o Periya Puranam, a história de vida dos 63 Shaiva Nayanars em 4.253 versos. Eventualmente, o próprio Sekkilhar foi canonizado e permanece como uma divindade de procissão na região."
 historical_character.shaprut:0 "Hasdai ibn Shaprut foi um médico, diplomata e erudito judeu do século X na Espanha muçulmana. Servindo como confidente do califa Abd ar-Rahman III, ele desempenhou um papel fundamental nas cortes intelectuais e diplomáticas de Córdova, promovendo intercâmbios culturais entre estudiosos judeus e islâmicos."
 historical_character.shinran:0 "Órfão desde criança, $Shinran$ foi ordenado ainda jovem, mas enfrentou dificuldades no sacerdócio. Guiado por uma visão para procurar o monge $HO_nen$, tornou-se seu discípulo principal e sofreu exílio durante a perseguição Jogen. Continuando ardorosamente a pregar a Terra Pura [Glossary( 'nembutsu', 'GLOSS_NEMBUTSU')] ao povo, eventualmente fundou sua própria escola, a Jōdo Shinshū, ou Verdadeira Seita da Terra Pura, agora a mais amplamente praticada no Japão."
 historical_character.shota_rustaveli:0 "Shota Rustaveli foi um poeta georgiano do século XII e um dos maiores contribuintes para a literatura georgiana. Ele é mais conhecido por seu poema épico 'O Cavaleiro na Pele de Pantera', considerado uma obra-prima da literatura nacional georgiana."
 historical_character.simon_of_keza:0 "Simão de Kéza foi um clérigo húngaro na corte do Rei Ladislau IV que compôs a \"Gesta Hunnorum et Hungarorum\" por volta de 1283. Sua crônica elaborou o mito de parentesco magiar-huno, lançando Átila como o rei ancestral dos húngaros, uma ideia que moldaria a identidade nacional por séculos."
 historical_character.snorri_sturluson:0 "Snorri Sturluson foi um historiador, poeta e político islandês do século XIII, renomado por ser o autor da \"Edda em Prosa,\" uma obra fundamental da mitologia nórdica. Seus escritos são fontes cruciais para a compreensão moderna do patrimônio nórdico. As obras de Snorri também incluem \"Heimskringla,\" uma crônica dos reis noruegueses que mistura história com folclore."
 historical_character.soothsayer:0 "Um adivinho com visões proféticas"
 historical_character.stephen_hagiochristophorites:0 "Estêvão Hagiochristophorites foi um favorito notório da corte e principal executor do Imperador Andrônico I Comneno. Renomado por suas extorsões brutais e assassinatos políticos, sua tentativa de prender Isaac Ângelo em 1185 saiu culposamente pela culatra, desencadeando a revolta que derrubou Andrônico e encerrou o domínio comneno."
 historical_character.strategist:0 "Um estrategista e comandante magistral"
 historical_character.su_shi:0 "Su Shi, conhecido por seu nome de cortesia Dongpo, foi um polímata da dinastia Song do Norte — poeta, pintor, calígrafo, estadista e gourmet. Seus versos, ensaios em prosa e cartas de exílio autodepreciativas das pântanosas terras do sul do Yangtze o tornaram talvez a figura literária mais amada da história chinesa."
 historical_character.suger:0 "Suger foi um abade franco de Saint-Denis do século XII, conselheiro dos reis Luís VI e Luís VII, e regente da França durante a Segunda Cruzada. Suas ambiciosas reformas de sua igreja abacial — abóbadas imponentes inundadas com luz de vitrais — são amplamente creditadas como o nascimento do estilo gótico de arquitetura."
 historical_character.takezaki_suenaga:0 "Samurai extremamente leal do xogunato Kamakura, $dynn_Takezaki$ $Suenaga$ ganhou fama por seu valor durante as invasões mongóis do Japão. Determinado a receber reconhecimento adequado por seu serviço, comissionou pergaminhos ilustrados que registraram suas façanhas."
 historical_character.tantular:0 "Renomado poeta javanês, Mpu Tantular escreveu o Kakawin Sutasoma, introduzindo a frase 'Bhinneka Tunggal Ika' ('Unidade na Diversidade'), posteriormente adotada como lema nacional da Indonésia."
 historical_character.theodore_metochites:0 "Um homem do Renascimento antes do Renascimento, Metochites foi um polímata que se destacou em filosofia, astronomia, matemática e arte, servindo como ministro-chefe sob o imperador Andronikos II Palaiologos. Ele é mais conhecido por seu patrocínio da Igreja da Chora em Constantinopla, onde comissionou extensos mosaicos e afrescos."
 historical_character.theologian:0 "Um teólogo piedoso e realizado"
 historical_character.theophanes_the_greek:0 "Teófanes, o Grego, foi um proeminente pintor bizantino. Ele trouxe uma profundidade emocional expressiva para o desenvolvimento da iconografia russa, que se afastou do estilo bizantino mais formal. Suas contribuições mais notáveis incluem afrescos na Igreja da Transfiguração em Novgorod e na Catedral da Anunciação em Moscovo."
 historical_character.theophylact_of_ohrid:0 "Teófilacto foi um arcebispo bizantino do século XI e estudioso. Durante seu mandato como arcebispo de Órida, desempenhou um papel crucial na vida religiosa e cultural da região, exercendo uma influência significativa na teologia ortodoxa oriental."
 historical_character.thomas_aquinas:0 "Tomás de Aquino foi um teólogo e filósofo dominicano, famoso por unir a filosofia aristotélica com a teologia cristã em sua \"Summa Theologica.\" Ele defendeu a compatibilidade entre razão e fé, impactando significativamente a doutrina cristã, a lei natural e a ética. O legado de Aquino perdura como santo canonizado e Doutor da Igreja."
 historical_character.thomas_becket:0 "Tomás Becket foi um arcebispo inglês e mártir, mais conhecido por seu conflito com o rei Henrique II sobre os direitos da Igreja. Sua defesa firme da autoridade eclesiástica levou ao seu assassinato na Catedral de Cantuária em 1170. O martírio de Becket solidificou seu status como santo, com seu santuário em Cantuária tornando-se um importante local de peregrinação."
 historical_character.thorkell_the_tall:0 "Thorkell, o Alto, foi um jarl jomsviking que liderou o grande exército viking que devastou a Inglaterra em 1009-1012, capturando o arcebispo Ælfheah de Canterbury e, em última análise, não conseguindo salvá-lo de seus próprios guerreiros. Posteriormente, ele entrou a serviço do rei Æthelred e depois de Cnut, o Grande, tornando-se um dos jarls mais poderosos do Império do Mar do Norte."
 historical_character.torbjorg_the_seeress:0 "Þorbjörg, a Vidente, é uma figura profética apresentada na \"Saga de Eirik, o Vermelho.\" Conhecida por sua prática de spá (profecia) e seiðr (magia nórdica), ela desempenhou um papel crucial na previsão de eventos futuros, com sua aparência cerimonial na saga refletindo a crença nórdica no poder da profecia."
 historical_character.vasili_the_bogomil:0 "Basílio, o Médico, foi um líder bogomilo em Constantinopla sob Aleixo I Comneno, o principal alvo da campanha anti-heresia do imperador descrita no Alexíada. Atraído para a confissão pelo próprio Aleixo, ele recusou-se a retratar-se e foi queimado no Hipódromo, sua execução anunciando uma longa repressão imperial às comunidades bogomilas em todos os Bálcãs."
 historical_character.vidyapati:0 "Vidyapati foi um poeta e erudito do século XIV de Bihar, Índia. Ele é conhecido por suas canções de amor e hinos devocionais dedicados a Shiva, que influenciaram profundamente o movimento Bhakti. Suas obras são celebradas pela beleza lírica e profunda expressão emocional."
 historical_character.walther:0 "Walther von der Vogelweide foi o minnesinger mais celebrado da Idade Média alemã, um poeta lírico itinerante cujas canções variavam do amor cortês ao comentário político mordaz sobre imperador e papa. Ele serviu a vários príncipes em todo o Sacro Império Romano-Germânico e ganhou a reputação de principal voz medieval da língua alemã."
 historical_character.wang_chongyang:0 "Sábio taoísta reformista do final da dinastia Song do Norte, fundador da escola Quanzhen. Após abandonar uma carreira marcial, Wang Zhe retirou-se para um eremitério nas montanhas Zhongnan, emergindo em seus últimos anos para pregar uma disciplina sincrética misturando a alquimia interior taoísta com meditação budista e ética confuciana. Seus sete principais discípulos levaram a ordem pelo norte da China e para as cortes mongóis."
 historical_character.warrior:0 "Um guerreiro poderoso e temido"
 historical_character.warrior_poet:0 "Um poderoso e famoso poeta guerreiro"
 historical_character.wen_tianxiang:0 "Acadêmico-general reverenciado do final do Sul Song, Wen Tianxiang foi um farol de resistência contra a conquista Mongol. Capturado após a defesa fracassada da dinastia, recusou servir aos Yuan e morreu como mártir. Sua poesia na prisão, especialmente o 'Cântico da Retidão', consagrou seu legado como exemplo de virtude e lealdade."
 historical_character.werner_of_urslingen:0 "Werner de Urslingen foi um nobre alemão que se tornou um dos primeiros grandes condottieri italianos, fundando a notória Grande Companhia que devastou a península italiana na década de 1340. Ele famosamente mandou inscrever em sua couraça: \"Inimigo de Deus, da Piedade e da Misericórdia.\""
 historical_character.widukind_of_corvey:0 "Widukind de Corvey foi um monge e historiador saxão do século X, renomado por seu trabalho 'Res gestae Saxonicae', uma crônica que detalha as ações dos saxões, com foco particular no reinado do imperador Otão I."
 historical_character.william_of_ockham:0 "William de Ockham foi um filósofo e teólogo inglês do século XIV, renomado por \"A Navalha de Ockham,\" o princípio de preferir explicações mais simples. Uma figura-chave na tradição escolástica, ele desafiou a autoridade da Igreja e defendeu a separação entre o poder secular e religioso. Suas ideias influenciaram o desenvolvimento da lógica, ciência e pensamento político."
 historical_character.william_wallace:0 "William Wallace foi um cavaleiro escocês e um proeminente líder durante as Guerras de Independência da Escócia contra a Inglaterra no final do século XIII. Conhecido por suas táticas ousadas e feroz patriotismo, Wallace derrotou a famosa força inglesa na Batalha da Ponte de Stirling em 1297 e foi nomeado Guardião da Escócia."
 historical_character.yehuda_halevi:0 "Yehuda Halevi foi um poeta e filósofo judeu espanhol do século XII, celebrado por sua poesia tocante e diálogo filosófico. Em \"O Kuzari,\" Halevi defende as verdades filosóficas do judaísmo e expressa seu profundo anseio por Sião. Seus escritos mesclam devoção religiosa com uma rica tradição lírica, tornando-o uma figura central na literatura hebraica medieval."
 historical_character.yelu_chucai:0 "Yelü Chucai foi um erudito e estadista kitan que serviu como principal conselheiro de Gengis Khan e Ögedei Khan. Um devoto confuciano e budista, seu conselho persistente salvou grande parte do norte da China de ser depovoada para pastagem, persuadindo os cãs mongóis de que um império assentado e tributado renderia muito mais do que terra arrasada."
 historical_character.yi_saek:0 "Um estudioso confucionista crucial do final de Goryeo, Yi Saek introduziu o Neoconfucionismo de Zhu Xi na Coreia e formou uma geração de futuros reformadores Joseon. Embora apoiasse reformas educacionais, permaneceu leal à dinastia Goryeo e recusou cargos sob seus sucessores. Sua influência ligou duas dinastias e moldou o pensamento coreano por séculos."
 historical_character.yue_fei:0 "Um dos generais mais célebres da China, Yue Fei ascendeu de origens humildes para se tornar defensor inflexível do Sul Song contra os invasores Jurchen Jin. Firme na lealdade ao imperador e à unidade nacional, foi traído por oficiais corruptos e executado injustamente. Seu legado permanece símbolo de patriotismo e integridade."
 historical_character.yunus_emre:0 "Yunus Emre foi um místico sufi e poeta popular da Anatólia dos séculos XIII e XIV cujos versos simples e devocionais em turco vernáculo ajudaram a moldar a língua como veículo de alta literatura. Sua mensagem humana e tolerante o tornou uma das figuras mais amadas da tradição religiosa turca."
 historical_character.yusuf_khass_hajib:0 "Yūsuf Khāṣṣ Ḥājib foi um erudito caracânida do século XI de Balasaghun que compôs o \"Kutadgu Bilig\", a primeira grande obra sobrevivente em uma língua turca. Seus versos alegóricos sobre governo, justiça e a boa vida renderam-lhe o título de corte \"Khāṣṣ Ḥājib\", ou Camareiro Privado."
 historical_character.zawisza:0 "Zawisza, o Negro, foi um cavaleiro e comandante militar polonês do século XV, renomado por sua bravura e cavalheirismo. Zawisza se destacou na Batalha de Grünwald em 1410 e, posteriormente, serviu em várias cortes reais. Ele morreu heroicamente durante o cerco da fortaleza de Golubac em 1428, enquanto servia em uma cruzada contra o Império Otomano."
 historical_character.zhu_xi:0 "Zhu Xi foi um filósofo da dinastia Song do século XII cuja síntese de ideias confucianas, budistas e taoístas remodelou o pensamento do Leste Asiático. Seus comentários sobre os \"Quatro Livros\" tornaram-se a base do sistema de exames imperiais na China, Coreia e Vietnã pelos sete séculos seguintes."
