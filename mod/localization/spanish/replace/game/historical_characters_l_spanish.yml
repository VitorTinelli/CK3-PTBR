 nick_kintaro_desc:0 "Frequentemente traduzido como 'Menino de Ouro', este personagem simboliza a virilidade da juventude masculina."
 nick_la_hire:0 "La Hire"
 nick_la_hire_desc:0 "Há muitas explicações para a origem do apelido 'La Hire'. Alguns dizem que foi os ingleses que o chamaram de 'o Deus da Ira' (a ira de Deus), que é uma palavra do antigo francês 'hīra', significando 'a ira' ou 'o irritado'. Alternativamente, pode ser que seu nome venha do francês 'ouriço' ('hérisson') porque ele tinha uma disposição espinhosa."
