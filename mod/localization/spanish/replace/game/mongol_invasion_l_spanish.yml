l_spanish:
 GENGHIS_KHAN_GLOSS:0 "Apenas um grande soberano já portou o honorífico mongol #G Gêngis#! ou #G Chinggis Cã#!. Seu significado é incerto, podendo atribuir força, retidão ou domínio 'Universal', 'Oceânico'. E, de fato, aquele que deteve este título superou em muito o #EMP Gurkhan#! de sua época e criou o maior império de estepes já visto."
 cadet_name_great_yuan:0 "Bó'érjìjin"
 genghis_khan_mongol_empire_tt:0 "Ganhou [GetTitleByKey('e_mongol_empire').GetName]"
 genghis_khan_mongol_troops_tt:0 "Ganhou exércitos massivos de [special_troops|E]"
 gok_threatening_powers_tt:0 "@warning_icon! #X Ameaçará [rulers|E] com [holdings|E] destruídas, [courtiers|E] massacrados e [title|E] tomado se recusarem a [vassalization|E]#!"
 mongol_invasion.1001.a:0 "Ainda assim, minhas mãos tremem..."
 mongol_invasion.1001.b:0 "O grande [new_khan.GetPrimaryTitle.GetTierAsNameNoTooltip] sobrevive."
 mongol_invasion.1001.c:0 "[old_khan.GetFirstNameNoTooltip] ganha um lugar de honra em [ROOT.Char.GetFaith.NegativeAfterLife]."
 mongol_invasion.1001.generic.desc:0 "[ROOT.Char.GetFaith.HighGodName] é bondoso, e [ROOT.Char.GetFaith.DeathDeityName] abate até os mais poderosos! As notícias são boas: [old_khan.GetTitledFirstNameNicknamed], senhor dos cavalos e saqueador, [old_khan.GetDeathReasonHideKiller|l].\n\nCom temor, já falamos do novo mestre terrível de [new_khan.GetPrimaryTitle.GetNameNoTier]... mas este [new_khan.GetTitledFirstNameNicknamed] #EMP não pode#! ser tão aterrorizante quanto seu antecessor...\n\nTalvez isso até marque o fim da conquista [new_khan.GetPrimaryTitle.GetAdjectiveNoTooltip]?"
 mongol_invasion.1001.sympathetic.desc:0 "#EMP Oh, os lamentos! Os choros!#! O grande [old_khan.GetTitledFirstNameNicknamed], escolhido pelos Céus para conquistar toda a Terra, se foi. Dizem que o [old_khan.GetTitleAsNameNoTooltip] [old_khan.GetDeathReasonHideKiller|l].\n\nCom a morte de seu mestre, [new_khan.GetPrimaryTitle.GetDefinitiveName] reúne seu grande #EMP kurultai#! e proclama um novo [new_khan.GetTitleAsNameNoTooltip].\n\nE assim, enquanto [old_khan.GetFirstNameNoTooltip] cavalga eternamente pelo céu, a [new_khan.GetTitledFirstNameNicknamed] pertencerá toda a Terra!"
 mongol_invasion.1001.title:0 "O Cã está morto!"
 mongol_invasion.1002.a:0 "Um atrevido! Os [genghis_khan.GetCulture.GetCollectiveNounNoTooltip] enlouqueceram."
 mongol_invasion.1002.b:0 "Atrás de nossos muros... certamente estamos seguros."
 mongol_invasion.1002.craven:0 "E [genghis_khan.GetSheHe] está vindo para cá?!"
 mongol_invasion.1002.desc.close.end:0 "Por direito, [genghis_khan.GetSheHe] deve governar os quatro cantos do universo.\n\nIncontáveis cavaleiros nômades se reúnem sob o estandarte de [genghis_khan.GetHerHis]. Pela vontade de seu Maior Cã, são libertos das antigas lealdades tribais, reorganizados para a guerra e avançam como um trovão para conquistar toda a estepe, todo o mundo — tudo sob o Grande Céu Azul!"
 mongol_invasion.1002.desc.close.mid:0 "e — pelos sábios de seu povo, em um vasto #EMP kurultai#! — é declarado"
 mongol_invasion.1002.desc.close:0 "Um líder temível, [genghis_khan.GetTitledFirstName], surge dos clãs em guerra de"
 mongol_invasion.1002.desc.close_mongolia:0 "Mongólia"
 mongol_invasion.1002.desc.close_steppes:0 "As estepes"
 mongol_invasion.1002.desc.far:0 "\n\nEm meio a risos nervosos, meus conselheiros me dizem que [genghis_khan.GetSheHe] jurou conquistar o mundo inteiro, reduzir cidades a pó sob os cascos dos cavalos, e destruir muralhas de castelos com arco e flecha.\n\n[genghis_khan.GetSheHe|U] não é o primeiro nômade a fazer tais promessas... mas dizem também que o [genghis_khan.GetTitleAsNameNoTooltip] cavalga à frente de uma horda de milhares, de cavaleiros invencíveis que não podem ser mortos."
 mongol_invasion.1002.desc.far_intro:0 "Chegam notícias... um tirano selvagem se ergue entre as tribos bárbaras das estepes distantes. Um '[genghis_khan.GetTitledFirstName]', que se declara Governante do Universo —"
 mongol_invasion.1002.desc.genghis:0 "[Glossary( 'Genghis Cã', 'GENGHIS_KHAN_GLOSS' )]."
 mongol_invasion.1002.desc.gok:0 "O Maior de Todos os Cãs!"
 mongol_invasion.1002.genghis_khan_tt:0 "@warning_icon! #X [counties|E] ocupados pelos [genghis_khan.GetCulture.GetCollectiveNoun] perderão grande parte do seu [development|E]#!"
 mongol_invasion.1002.t:0 "Ascensão dos [genghis_khan.GetCulture.GetCollectiveNounNoTooltip]"
 mongol_invasion.1003.a:0 "Tanto, perdido..."
 mongol_invasion.1003.b:0 "É apenas pagãos tendo o que merecem!"
 mongol_invasion.1003.c:0 "Os Mongóis irão destruir o mundo se nós não os pararmos!"
 mongol_invasion.1003.desc:0 "A grande instituição de aprendizado e conhecimento de Baghdad, a Casa da Sabedoria, foi vítima do fogo e destruição durante o cerco Mongol na cidade.\n\n Apenas ruínas foram deixadas para trás, como um sinal do valor ao antigo conhecimento no novo mundo dos Mongóis."
 mongol_invasion.1003.t:0 "A Casa da Sabedoria Queima"
 mongol_invasion.1004.a:0 "O Império irar levantar-se de novo um dia..."
 mongol_invasion.1004.b:0 "A misericórdia de [ROOT.Char.GetFaith.HighGodNamePossessive] finalmente se revela..."
 mongol_invasion.1004.desc:0 "Com a morte [Select_CString( old_mongol_emperor.IsFemale, 'da poderosa', 'do poderoso' )] [old_mongol_emperor.GetFirstName] — mestre de todas as terras subjugadas pelos Mongóis — vários sucessores lutam para tomar o lugar [old_mongol_emperor.GetHerHim] como Grande Cã. Nenhum reconhecerá a legitimidade dos outros.\n\nE assim é o fim dos Mongóis como um império unificado.\n\nEsses descendentes do primeiro grande conquistador ainda mantêm alguma força. Eles clamam por guerra. Mas nenhum deles, nem [successor_1.GetName], nem [successor_2.GetName], se destaca acima dos outros como governante de todo o universo."
 mongol_invasion.1004.t:0 "Colapso do Grande Canato"
 mongol_invasion.1005.a.tt:0 "[GetTitleByKey('e_mongol_empire').GetName] perde seus principais métodos de conquista, tornando-se menos agressivo."
 mongol_invasion.1005.a:0 "Uma era de medo chegou ao fim."
 mongol_invasion.1005.desc:0 "Com a passagem do trono de [old_khan.GetTitledFirstName] para [new_khan.GetTitledFirstName], meus conselheiros gargalham de alegria, suspiram de alívio... pois [new_khan.GetFirstNameNoTooltip] não ousa se autodenominar \"o governante do universo\".\n\nAntigamente, os nômades da estepe ameaçavam todo o mundo, reunindo vastas hordas. Agora, finalmente reconhecem que seus objetivos estão além de seu alcance."
 mongol_invasion.1005.t:0 "O Cã Está Morto"
 mongol_invasion.2001.a.tt:0 "Você se torna um vassalo de [mongol_emperor.GetShortUIName]"
 mongol_invasion.2001.a:0 "Eu me submeto com honra, meu [mongol_emperor.GetTitleAsNameNoTooltip]."
 mongol_invasion.2001.b.tt:0 "[mongol_emperor.GetShortUIName|U] declara guerra com você"
 mongol_invasion.2001.b:0 "Você não representa uma ameaça para mim, tolo arrogante!"
 mongol_invasion.2001.desc:0 "Como o governante do universo, é inevitável que você irá se curvar a mim. Que seja em um juramento de fidelidade, ao invés de uma lâmina de um machadeiro contra seu pescoço."
 mongol_invasion.2001.opening:0 "Meu servo destinado,"
 mongol_invasion.2002.a:0 "Uma sábia escolha, meu servo."
 mongol_invasion.2002.desc:0 "Eu me submeto à sua legítima e benevolente graça. Eu estarei com você contra qualquer um que se oponha ao seu destino."
 mongol_invasion.2002.opening:0 "Honrado Governante do Universo,"
 mongol_invasion.2003.a:0 "É guerra e morte, então."
 mongol_invasion.2003.desc:0 "Você ousa achar que você pode me ameaçar à submissão? Eu irei lhe mostrar o que um verdadeiro governante faz com seu tão chamado cavaleiro invencível!"
 mongol_invasion.2003.opening:0 "Sua sombra [mongol_emperor.Custom2('InsultAdjective', SCOPE.sC('demand_recipient'))] de um [mongol_emperor.GetTitleAsNameNoTooltip],"
 mongol_invasion.2101.a:0 "Claro, meu lorde."
 mongol_invasion.2101.b.tt:0 "@warning_icon! [mongol_emperor.GetShortUIName] quebra sua aliança com você e ao invés pode ir à guerra!"
 mongol_invasion.2101.b:0 "Você acha que eu te sirvo? Ridículo!"
 mongol_invasion.2101.desc:0 "Você tem sido um bom amigo e servo para mim até então. É hora de fazer seu serviço oficial, enquanto você jura fidelidade ao Governante do Universo."
 mongol_invasion.2103.a:0 "Você irá se curvar para mim agora, de um jeito ou de outro!"
 mongol_invasion.2103.b:0 "Apenas aguarde, seu cachorro insolente..."
 mongol_invasion.2111.b.tt:0 "@warning_icon! [mongol_emperor.GetShortUIName] quebra sua aliança com você"
 mongol_invasion.2111.b:0 "Você me acha menos que um igual? Revoltante!"
 mongol_invasion.2112.a:0 "Ah, você irá se arrepender de suas palavras e atos..."
 mongol_invasion.2112.desc:0 "Você realmente acredita ser meu melhor? Você não é nem meu igual! Está claro que a amizade que eu graciosamente lhe ofereci não foi nada mais que arremeçar pérolas aos porcos."
 mongol_invasion_submission_reminder_tt:0 "Você pode evitar a ruína com a [decision|E] #high $submit_to_the_great_khan_decision$#!"
 mpo_greatest_of_khans.1010_desc:0 "Cavaleiros sem mestre juram lealdade! Guerreiros ávidos oferecem seus arcos! Incontáveis famílias se aglomeram em seu grande acampamento!"
 mpo_greatest_of_khans.1010_title:0 "Clãs Menores Se Juntam à Horda"
 submit_to_the_great_khan_decision:0 "Renda-se ao Grande Cã"
 submit_to_the_great_khan_decision_confirm:0 "Vou me humilhar para salvar minha vida"
 submit_to_the_great_khan_decision_opening_desc:0 "Meu reino será cinzas, meu povo cadáveres, meu corpo vítima de mil cortes e golpes... a menos que eu implore por misericórdia ao grande cavaleiro que conquista o mundo."
 submit_to_the_great_khan_decision_tooltip:0 "Você se torna vassalo do Maior de Todos os Cãs"
 temujin_horde_gathers_tt:0 "@alert_icon! #alert_trial Guerreiros nômades continuarão se reunindo atrás de você, o Cã escolhido pelos Céus, concedendo mais @herd_icon![herd|E], @prestige_icon![prestige|E], e @gold_icon![gold|E] — se sua [dominance|E] permanecer acima de [GetLaw('nomadic_authority_3').GetName]#!"
