 camp_purpose_brigands_effects:0 "$EFFECT_LIST_BULLET$Encontra mais [criminal_task_contracts|E] de todos os tipos\n$EFFECT_LIST_BULLET$Encontra mais [task_contracts|E] de [prowess|E] e [intrigue|E]\n$EFFECT_LIST_BULLET$Desbloqueia [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_subdued_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('barber_tent_morticians_tools').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_ransom_cages').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('baggage_train_negotiators').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_juicy_rumors').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_lockwagon').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('proving_grounds_the_stick_game').GetName]#!\n$EFFECT_LIST_BULLET$Pode acessar certos [officers|E] especiais:\n$BULLET_WITH_TAB$[GetCourtPositionType('master_thief_camp_officer').GetName()] #weak (Desbloqueado via $supply_tent_subdued_gear_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('person_haggler_camp_officer').GetName()] #weak (Desbloqueado via $baggage_train_ransom_cages_domicile_building$)#!\n$BULLET_WITH_TAB$[GetCourtPositionType('master_of_spoils_camp_officer').GetName()] #weak (Desbloqueado via $proving_grounds_lockwagon_domicile_building$)#!\n\n#WEAK \"Salteador\" é um termo tão feio — não há nada de errado em ser decisivo e prático, especialmente se você conseguir obter um bom lucro ao mesmo tempo.#!"
 camp_purpose_confirmation_button_text:0 "Alterar Propósito"
 camp_purpose_explorers:0 "Exploradores"
 camp_purpose_explorers_effects:0 "$EFFECT_LIST_BULLET$Encontra mais [transport_task_contracts|E]\n$EFFECT_LIST_BULLET$Encontra mais [task_contracts|E] de [diplomacy|E] e [intrigue|E]\n$EFFECT_LIST_BULLET$Encontra um pouco mais [task_contracts|E] [martial|E]\n$EFFECT_LIST_BULLET$Desbloqueia [camp_buildings|E]:\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_provisions').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_reserve_water').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('supply_tent_climbing_gear').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_fire_local_hangers_on').GetName]#!\n$BULLET_WITH_TAB$#high [GetDomicileBuilding('camp_perimeter_extra_watch').GetName]#!\n\n#WEAK Sempre há outra colina, outra montanha, outra cultura, outra língua esperando logo além daquele horizonte...#!"
