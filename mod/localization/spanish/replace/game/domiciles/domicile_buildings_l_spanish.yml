 baggage_train_ascetics_domicile_building_desc:0 "#weak (Requer [GetDomicileBuilding('baggage_train_01').GetName])#!\nEsses buscadores espirituais trazem dignidade e sabedoria que são uma visão incomum em um bando errante, mas não natural."
 baggage_train_bartering_grounds_domicile_building:0 "Terras de Troca"
 baggage_train_bartering_grounds_domicile_building_desc:0 "#weak (Requer [GetDomicileBuilding('baggage_train_01').GetName])#!\nO acampamento já está repleto de comércio, dar um lugar e foco a isso nos permite estruturá-lo."
 baggage_train_kennel.tt.ate_dogs:0 "Você recentemente comeu todos os seus cães"
 baggage_train_kennel_domicile_building:0 "Canis"
 baggage_train_kennel_domicile_building_desc:0 "#weak (Requer [GetDomicileBuilding('baggage_train_01').GetName])#!\nOs cães estavam nos seguindo de qualquer forma, então é melhor colocá-los para trabalhar."
