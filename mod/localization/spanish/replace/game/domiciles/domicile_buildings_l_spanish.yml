 baggage_train_ample_steeds_domicile_building:0 "Cavalos Abundantes"
 baggage_train_ample_steeds_domicile_building_desc:0 "#weak (Requer [GetDomicileBuilding('baggage_train_01').GetName])#!\nCavalos, assim como pessoas, se cansam. Um bom estábulo de reservas faz maravilhas para deixá-los descansar quando mais importa."
