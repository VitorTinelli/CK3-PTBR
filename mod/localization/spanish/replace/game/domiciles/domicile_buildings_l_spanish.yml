 baggage_train_pleasure_tents_domicile_building:0 "Tendas Privadas"
 baggage_train_pleasure_tents_domicile_building_desc:0 "#weak (Requer [GetDomicileBuilding('baggage_train_01').GetName])#!\nAinda mais do que a maioria das habitações, um acampamento é um espaço comunal — um mal adequado para intimidade pessoal. A maioria dos seguidores aprecia ter uma área para simplesmente estar... #EMP sozinhos#! juntos."
 baggage_train_porters_domicile_building:0 "Carregadores Habilidosos"
 baggage_train_porters_domicile_building_desc:0 "#weak (Requer [GetDomicileBuilding('baggage_train_01').GetName])#!\nO que não pode ser carregado deve ser deixado para trás, então é imperativo que possamos carregar o máximo possível."
